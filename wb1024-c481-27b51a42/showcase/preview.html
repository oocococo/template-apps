<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1024 合成 · WorkBuddy 程序员节</title>
<meta name="description" content="1024 合成——用 WorkBuddy 打造的 1024 程序员节主题小游戏。滑动合并数字，挑战合成 1024！">
<meta property="og:title" content="1024 合成 · WorkBuddy 程序员节">
<meta property="og:description" content="滑动合并数字，挑战合成 1024。一个用 WorkBuddy 做的程序员节小游戏。">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --grid:#21262d; --cell:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#39d353; --accent2:#58a6ff;
    --gap:12px; --pad:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',monospace;
    background:radial-gradient(1100px 560px at 50% -8%,#1b2735 0%,var(--bg) 62%);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:24px 14px 40px;
  }
  .wrap{width:100%;max-width:480px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:10px;}
  .title h1{font-size:30px;font-weight:800;letter-spacing:.5px;}
  .title h1 b{color:var(--accent);}
  .title p{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.4;}
  .scores{display:flex;gap:8px;flex-shrink:0;}
  .score-box{background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:7px 12px;text-align:center;min-width:72px;}
  .score-box .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .score-box .val{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);}
  .bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 14px;gap:10px;flex-wrap:wrap;}
  .hint{color:var(--muted);font-size:12px;line-height:1.55;max-width:300px;}
  .hint b{color:var(--text);}
  .btn{background:var(--accent);color:#06210f;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .08s,filter .15s;white-space:nowrap;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.95);}
  .btn.ghost{background:transparent;color:var(--accent2);border:1px solid var(--grid);}
  .board{position:relative;background:var(--grid);border-radius:14px;padding:var(--pad);touch-action:none;user-select:none;overflow:hidden;}
  .grid-bg{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);}
  .grid-cell{background:var(--cell);border-radius:10px;aspect-ratio:1/1;}
  .tiles{position:absolute;inset:var(--pad);}
  .tile{position:absolute;top:0;left:0;transition:transform .12s ease-in-out;will-change:transform;}
  .tile .inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;font-variant-numeric:tabular-nums;}
  .tile.pop .inner{animation:pop .14s ease-out;}
  .tile.merged .inner{animation:merge .16s ease;}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes merge{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  .overlay{position:absolute;inset:0;background:rgba(13,17,23,.86);backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;border-radius:14px;}
  .overlay.show{display:flex;}
  .overlay .big{font-size:30px;font-weight:800;}
  .overlay .sub{color:var(--muted);font-size:14px;line-height:1.6;}
  .overlay .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .tag{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;}
  .tag b{color:var(--accent);}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--grid);color:var(--text);padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:10;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>1024 <b>合成</b></h1>
      <p>WorkBuddy · 1024 程序员节限定小游戏<br>滑动合并，挑战合成 1024</p>
    </div>
    <div class="scores">
      <div class="score-box"><div class="label">得分</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">最佳</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div class="bar">
    <div class="hint">用 <b>方向键 / WASD</b> 或 <b>手指滑动</b> 移动方块。<br>相同数字相撞合并，目标是 <b>1024</b>！</div>
    <button class="btn" id="newGame">新游戏</button>
  </div>

  <div class="board" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="big" id="ovTitle">🎉 合成 1024！</div>
      <div class="sub" id="ovSub">你用 WorkBuddy 完成了这次挑战。</div>
      <div class="row">
        <button class="btn" id="ovPrimary">再来一局</button>
        <button class="btn ghost" id="ovSecondary">继续挑战</button>
      </div>
    </div>
  </div>

  <div class="tag">
    用 <b>WorkBuddy</b> 一键生成 · 参赛作品<br>
    #WorkBuddy &nbsp; #1024程序员节
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const previewStorage = (() => { try { const s=window.localStorage; s.getItem('merge1024_best'); return s; } catch (_) { const data={}; return { getItem:k=>data[k] || null, setItem:(k,v)=>{data[k]=String(v);} }; } })();
  const SIZE=4, GAP=12;
  const board=document.getElementById('board');
  const gridBg=document.getElementById('gridBg');
  const tilesLayer=document.getElementById('tiles');
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay');
  const ovTitle=document.getElementById('ovTitle');
  const ovSub=document.getElementById('ovSub');
  const ovPrimary=document.getElementById('ovPrimary');
  const ovSecondary=document.getElementById('ovSecondary');
  const toast=document.getElementById('toast');

  const COLORS={
    1:{bg:'#2d333b',fg:'#c9d1d9'},2:{bg:'#373e47',fg:'#c9d1d9'},
    3:{bg:'#9e6a03',fg:'#fff'},4:{bg:'#bb8009',fg:'#fff'},
    5:{bg:'#db6d28',fg:'#fff'},6:{bg:'#f0883e',fg:'#fff'},
    7:{bg:'#3fb950',fg:'#08230f'},8:{bg:'#56d364',fg:'#08230f'},
    9:{bg:'#2ea043',fg:'#fff'},10:{bg:'#39d353',fg:'#06210f'},
    11:{bg:'#58a6ff',fg:'#06243f'},12:{bg:'#bc8cff',fg:'#1c0c33'}
  };

  let grid, tiles, score, won, over, keepPlaying, idCounter, best;

  // build static background cells
  for(let i=0;i<SIZE*SIZE;i++){
    const c=document.createElement('div'); c.className='grid-cell'; gridBg.appendChild(c);
  }

  best=parseInt(previewStorage.getItem('merge1024_best')||'0',10);
  bestEl.textContent=best;

  function cellSize(){ return (tilesLayer.clientWidth - GAP*(SIZE-1))/SIZE; }

  function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(null)); }

  function showToast(msg){
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t=setTimeout(()=>toast.classList.remove('show'),1400);
  }

  function styleTile(t){
    const e=Math.log2(t.value);
    const col=COLORS[e]||COLORS[12];
    t.inner.style.background=col.bg;
    t.inner.style.color=col.fg;
    const size=cellSize();
    t.el.style.width=size+'px';
    t.el.style.height=size+'px';
    t.el.style.transform='translate('+(t.x*(size+GAP))+'px,'+(t.y*(size+GAP))+'px)';
    const fs=size*(t.value>=1000?0.32:t.value>=100?0.4:t.value>=10?0.46:0.52);
    t.inner.style.fontSize=fs+'px';
  }

  function createEl(t){
    const el=document.createElement('div'); el.className='tile';
    const inner=document.createElement('div'); inner.className='inner';
    inner.textContent=t.value;
    el.appendChild(inner);
    t.el=el; t.inner=inner;
    tilesLayer.appendChild(el);
    styleTile(t);
    requestAnimationFrame(()=>{ el.classList.add('pop'); });
    el.addEventListener('animationend',()=>el.classList.remove('pop','merged'));
  }

  function removeTile(t){
    if(t.el&&t.el.parentNode) t.el.parentNode.removeChild(t.el);
    tiles=tiles.filter(x=>x!==t);
  }

  function addRandomTile(){
    const empties=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!grid[r][c]) empties.push({r,c});
    if(!empties.length) return;
    const {r,c}=empties[Math.floor(Math.random()*empties.length)];
    const value=Math.random()<0.9?2:4;
    const t={id:++idCounter,value,x:c,y:r,merged:false,isNew:true};
    grid[r][c]=t; tiles.push(t); createEl(t);
  }

  function updateScores(){
    scoreEl.textContent=score;
    if(score>best){ best=score; bestEl.textContent=best; previewStorage.setItem('merge1024_best',best); }
  }

  const vectors={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function within(p){ return p.x>=0&&p.x<SIZE&&p.y>=0&&p.y<SIZE; }
  function buildTraversals(v){
    const t={x:[0,1,2,3],y:[0,1,2,3]};
    if(v.x===1) t.x.reverse();
    if(v.y===1) t.y.reverse();
    return t;
  }
  function findFarthest(cell,v){
    let prev, cur={x:cell.x,y:cell.y};
    do{ prev=cur; cur={x:prev.x+v.x,y:prev.y+v.y}; }
    while(within(cur)&&!grid[cur.y][cur.x]);
    return {farthest:prev, next:within(cur)?cur:null};
  }

  function move(dir){
    if(over) return;
    if(won&&!keepPlaying) return;
    const v=vectors[dir];
    const trav=buildTraversals(v);
    let moved=false;
    tiles.forEach(t=>{ t.merged=false; });

    trav.y.forEach(y=>{
      trav.x.forEach(x=>{
        const tile=grid[y][x];
        if(!tile) return;
        const {farthest,next}=findFarthest({x,y},v);
        if(next && grid[next.y][next.x] && grid[next.y][next.x].value===tile.value && !grid[next.y][next.x].merged){
          const other=grid[next.y][next.x];
          const newVal=tile.value*2;
          grid[y][x]=null;
          tile.x=next.x; tile.y=next.y;
          other.value=newVal; other.merged=true;
          other.inner.textContent=newVal;
          other.el.classList.add('merged');
          tile.inner.textContent='';
          styleTile(tile);
          setTimeout(()=>removeTile(tile),130);
          score+=newVal;
          if(newVal===1024 && !won){ won=true; }
          moved=true;
        } else if(farthest.x!==x || farthest.y!==y){
          grid[y][x]=null;
          tile.x=farthest.x; tile.y=farthest.y;
          grid[farthest.y][farthest.x]=tile;
          styleTile(tile);
          moved=true;
        }
      });
    });

    if(moved){
      addRandomTile();
      updateScores();
      if(won && !keepPlaying){ showOverlay('win'); }
      else if(!movesAvailable()){ over=true; showOverlay('over'); }
    }
  }

  function movesAvailable(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(!grid[r][c]) return true;
      const v=grid[r][c].value;
      if(c+1<SIZE && grid[r][c+1] && grid[r][c+1].value===v) return true;
      if(r+1<SIZE && grid[r+1][c] && grid[r+1][c].value===v) return true;
    }
    return false;
  }

  function showOverlay(type){
    if(type==='win'){
      ovTitle.textContent='🎉 合成 1024！';
      ovSub.textContent='目标达成！可以继续挑战更大的数字，或开新局。';
      ovPrimary.textContent='再来一局'; ovSecondary.style.display=''; ovSecondary.textContent='继续挑战';
    } else {
      ovTitle.textContent='游戏结束';
      ovSub.textContent='没有可移动的方块了。最终得分 '+score+'。';
      ovPrimary.textContent='再来一局'; ovSecondary.style.display='none';
    }
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  function newGame(){
    tilesLayer.innerHTML='';
    grid=emptyGrid(); tiles=[]; score=0; won=false; over=false; keepPlaying=false; idCounter=0;
    hideOverlay(); updateScores();
    addRandomTile(); addRandomTile();
    showToast('新游戏开始');
  }

  // input
  const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
    w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  window.addEventListener('keydown',e=>{
    const dir=keyMap[e.key];
    if(dir){ e.preventDefault(); move(dir); }
  });

  let tStart=null;
  board.addEventListener('touchstart',e=>{ const t=e.touches[0]; tStart={x:t.clientX,y:t.clientY}; },{passive:true});
  board.addEventListener('touchend',e=>{
    if(!tStart) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-tStart.x, dy=t.clientY-tStart.y;
    const ax=Math.abs(dx), ay=Math.abs(dy);
    if(Math.max(ax,ay)<24){ tStart=null; return; }
    if(ax>ay) move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
    tStart=null;
  },{passive:true});

  document.getElementById('newGame').addEventListener('click',newGame);
  ovPrimary.addEventListener('click',()=>{ hideOverlay(); newGame(); });
  ovSecondary.addEventListener('click',()=>{ keepPlaying=true; hideOverlay(); showToast('继续挑战，冲 2048！'); });

  window.addEventListener('resize',()=>{ tiles.forEach(styleTile); });

  newGame();
})();
</script>
</body>
</html>
