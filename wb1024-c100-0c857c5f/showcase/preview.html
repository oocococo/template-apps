.table td {\r
  padding: 10px 14px;\r
  border-bottom: 1px solid var(--line-2);\r
  vertical-align: middle;\r
}\r
.table tr:last-child td { border-bottom: 0; }\r
.table tbody tr:hover { background: var(--surface-2); }\r
.table .num { font-family: var(--font-mono); font-size: 12.5px; }\r
\r
/* ---------- \u8FDB\u5EA6\u6761 ---------- */\r
.bar {\r
  height: 6px;\r
  border-radius: 20px;\r
  background: var(--bg-sink);\r
  overflow: hidden;\r
}\r
.bar > i {\r
  display: block;\r
  height: 100%;\r
  border-radius: 20px;\r
  background: var(--accent);\r
  transition: width .5s cubic-bezier(.4, 0, .2, 1);\r
}\r
.bar.green > i { background: var(--green); }\r
.bar.red > i { background: var(--red); }\r
\r
/* ---------- \u8BDD\u672F\u5361 ---------- */\r
.script-layer {\r
  border-left: 2px solid var(--line);\r
  padding: 2px 0 2px 16px;\r
  position: relative;\r
}\r
.script-layer + .script-layer { margin-top: 16px; }\r
.script-layer::before {\r
  content: "";\r
  position: absolute;\r
  left: -5px;\r
  top: 8px;\r
  width: 8px; height: 8px;\r
  border-radius: 50%;\r
  background: var(--surface);\r
  border: 2px solid var(--line);\r
}\r
.script-layer.l1::before { border-color: var(--blue); }\r
.script-layer.l2::before { border-color: var(--amber); }\r
.script-layer.l3::before { border-color: var(--green); }\r
.script-layer .sl-head {\r
  font-size: 11px;\r
  letter-spacing: .1em;\r
  color: var(--ink-4);\r
  margin-bottom: 4px;\r
}\r
.script-layer .sl-text {\r
  font-size: 14px;\r
  line-height: 1.85;\r
  color: var(--ink);\r
}\r
.script-layer .sl-note {\r
  font-size: 11.5px;\r
  color: var(--ink-4);\r
  margin-top: 5px;\r
  line-height: 1.6;\r
}\r
\r
/* ---------- \u65F6\u95F4\u7EBF ---------- */\r
.timeline { position: relative; padding-left: 20px; }\r
.timeline::before {\r
  content: "";\r
  position: absolute;\r
  left: 5px;\r
  top: 6px;\r
  bottom: 6px;\r
  width: 1px;\r
  background: var(--line);\r
}\r
.tl-item { position: relative; padding-bottom: 18px; }\r
.tl-item:last-child { padding-bottom: 0; }\r
.tl-item::before {\r
  content: "";\r
  position: absolute;\r
  left: -18px;\r
  top: 6px;\r
  width: 7px; height: 7px;\r
  border-radius: 50%;\r
  background: var(--surface);\r
  border: 2px solid var(--line);\r
}\r
.tl-item.hot::before { border-color: var(--accent); background: var(--accent); }\r
.tl-head {\r
  display: flex;\r
  align-items: center;\r
  gap: 8px;\r
  flex-wrap: wrap;\r
  margin-bottom: 4px;\r
}\r
.tl-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }\r
\r
/* ---------- \u65B9\u6848\u5C42 ---------- */\r
.tier {\r
  border: 1px solid var(--line);\r
  border-radius: var(--radius);\r
  background: var(--surface);\r
  overflow: hidden;\r
}\r
.tier-head {\r
  display: flex;\r
  align-items: center;\r
  gap: 8px;\r
  padding: 10px 14px;\r
  background: var(--surface-2);\r
  border-bottom: 1px solid var(--line-2);\r
}\r
.tier-head .t-index {\r
  font-family: var(--font-serif);\r
  font-size: 13px;\r
  color: var(--accent);\r
  letter-spacing: .06em;\r
}\r
.tier-head .t-name { font-size: 13px; font-weight: 600; }\r
.tier-head .t-goal { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }\r
.tier-body { padding: 12px 14px; }\r
\r
.item-card {\r
  border: 1px solid var(--line-2);\r
  border-radius: var(--radius-sm);\r
  padding: 10px 12px;\r
  background: var(--surface);\r
}\r
.item-card + .item-card { margin-top: 8px; }\r
.item-card .ic-top { display: flex; align-items: baseline; gap: 8px; }\r
.item-card .ic-name { font-size: 13.5px; font-weight: 600; }\r
.item-card .ic-price {\r
  font-family: var(--font-mono);\r
  font-size: 12px;\r
  color: var(--ink-3);\r
  margin-left: auto;\r
  white-space: nowrap;\r
}\r
.item-card .ic-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }\r
.item-card .ic-evidence {\r
  margin-top: 7px;\r
  padding-top: 7px;\r
  border-top: 1px dashed var(--line);\r
  font-size: 11.5px;\r
  color: var(--ink-3);\r
  line-height: 1.65;\r
}\r
.item-card .ic-evidence b { color: var(--ink-2); font-weight: 600; }\r
\r
/* ---------- \u5BF9\u8BDD ---------- */\r
.chat-scroll { max-height: 62vh; overflow-y: auto; padding: 4px 2px; }\r
.msg { display: flex; gap: 10px; margin-bottom: 16px; }\r
.msg .m-avatar {\r
  width: 28px; height: 28px;\r
  border-radius: 8px;\r
  display: grid;\r
  place-items: center;\r
  font-size: 11px;\r
  font-weight: 600;\r
  flex: none;\r
}\r
.msg.user .m-avatar { background: var(--bg-sink); color: var(--ink-2); }\r
.msg.bot .m-avatar { background: var(--ink); color: #fff; font-family: var(--font-serif); }\r
.msg .m-body { min-width: 0; flex: 1; }\r
.msg .m-role { font-size: 11px; color: var(--ink-4); margin-bottom: 3px; }\r
.msg .m-text {\r
  font-size: 13.5px;\r
  line-height: 1.8;\r
  white-space: pre-wrap;\r
  word-break: break-word;\r
}\r
.msg.user .m-text {\r
  background: var(--surface-2);\r
  border: 1px solid var(--line-2);\r
  border-radius: var(--radius-sm);\r
  padding: 9px 12px;\r
  display: inline-block;\r
}\r
.msg .m-src {\r
  margin-top: 8px;\r
  font-size: 11px;\r
  color: var(--ink-4);\r
  line-height: 1.8;\r
  border-left: 2px solid var(--line);\r
  padding-left: 9px;\r
}\r
\r
/* ---------- \u5F39\u5C42 ---------- */\r
.modal-mask {\r
  position: fixed;\r
  inset: 0;\r
  background: rgba(32, 24, 18, .38);\r
  backdrop-filter: blur(2px);\r
  display: grid;\r
  place-items: center;\r
  padding: 20px;\r
  z-index: 80;\r
  animation: fade .16s ease;\r
}\r
.modal {\r
  background: var(--surface);\r
  border-radius: 16px;\r
  box-shadow: var(--shadow-3);\r
  width: 100%;\r
  max-width: 620px;\r
  max-height: 88vh;\r
  display: flex;\r
  flex-direction: column;\r
  animation: rise .2s cubic-bezier(.2, .8, .3, 1);\r
}\r
.modal.wide { max-width: 860px; }\r
.modal-head {\r
  padding: 16px 20px;\r
  border-bottom: 1px solid var(--line-2);\r
  display: flex;\r
  align-items: center;\r
  gap: 10px;\r
}\r
.modal-head h3 { font-size: 15px; }\r
.modal-head .x {\r
  margin-left: auto;\r
  border: 0;\r
  background: transparent;\r
  color: var(--ink-4);\r
  font-size: 18px;\r
  line-height: 1;\r
  padding: 4px;\r
}\r
.modal-body { padding: 18px 20px; overflow-y: auto; }\r
.modal-foot {\r
  padding: 13px 20px;\r
  border-top: 1px solid var(--line-2);\r
  display: flex;\r
  gap: 8px;\r
  justify-content: flex-end;\r
  background: var(--surface-2);\r
  border-radius: 0 0 16px 16px;\r
}\r
@keyframes fade { from { opacity: 0 } }\r
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.99) } }\r
\r
/* ---------- toast ---------- */\r
.toast-root {\r
  position: fixed;\r
  bottom: 24px;\r
  left: 50%;\r
  transform: translateX(-50%);\r
  display: flex;\r
  flex-direction: column;\r
  gap: 8px;\r
  z-index: 95;\r
  pointer-events: none;\r
}\r
.toast {\r
  background: var(--ink);\r
  color: #fff;\r
  font-size: 12.5px;\r
  padding: 9px 16px;\r
  border-radius: 22px;\r
  box-shadow: var(--shadow-2);\r
  animation: rise .2s ease;\r
  max-width: 86vw;\r
}\r
.toast.warn { background: var(--red); }\r
.toast.ok { background: var(--green); }\r
\r
/* ---------- \u63D0\u793A\u6761 ---------- */\r
.notice {\r
  display: flex;\r
  gap: 9px;\r
  padding: 11px 14px;\r
  border-radius: var(--radius-sm);\r
  font-size: 12.5px;\r
  line-height: 1.7;\r
  background: var(--bg-sink);\r
  color: var(--ink-2);\r
}\r
.notice.accent { background: var(--accent-soft); color: #7d5436; }\r
.notice.red { background: var(--red-soft); color: #8b3d29; }\r
.notice.green { background: var(--green-soft); color: #2f5445; }\r
.notice.amber { background: var(--amber-soft); color: #7f5f22; }\r
.notice .n-mark { flex: none; font-weight: 700; opacity: .7; }\r
.notice ul { padding-left: 16px; }\r
.notice li { margin: 2px 0; }\r
\r
/* ---------- \u6863\u6848\u62BD\u5C49\u5934 ---------- */\r
.hero {\r
  display: flex;\r
  gap: 16px;\r
  align-items: flex-start;\r
  flex-wrap: wrap;\r
}\r
.hero .h-avatar {\r
  width: 54px; height: 54px;\r
  border-radius: 14px;\r
  background: var(--accent-soft);\r
  color: var(--accent);\r
  font-family: var(--font-serif);\r
  font-size: 22px;\r
  display: grid;\r
  place-items: center;\r
  flex: none;\r
}\r
.hero .h-main { min-width: 220px; flex: 1; }\r
.hero .h-name {\r
  font-family: var(--font-serif);\r
  font-size: 21px;\r
  font-weight: 600;\r
  display: flex;\r
  align-items: baseline;\r
  gap: 9px;\r
  flex-wrap: wrap;\r
}\r
.hero .h-name .h-sub {\r
  font-family: var(--font-sans);\r
  font-size: 12px;\r
  color: var(--ink-4);\r
  font-weight: 400;\r
}\r
.hero .h-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }\r
\r
/* ---------- \u7EF4\u5EA6\u7F51\u683C ---------- */\r
.dim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }\r
.dim-row {\r
  display: flex;\r
  gap: 10px;\r
  padding: 8px 0;\r
  border-bottom: 1px solid var(--line-2);\r
  font-size: 12.5px;\r
  align-items: baseline;\r
}\r
.dim-row .d-label { color: var(--ink-4); width: 88px; flex: none; font-size: 11.5px; }\r
.dim-row .d-val { color: var(--ink); flex: 1; min-width: 0; }\r
\r
/* ---------- \u5BF9\u6BD4 ---------- */\r
.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }\r
.compare .c-cell {\r
  border: 1px solid var(--line-2);\r
  border-radius: var(--radius-sm);\r
  padding: 8px 11px;\r
  font-size: 12.5px;\r
  background: var(--surface-2);\r
}\r
.compare .c-cell .c-when { font-size: 10.5px; color: var(--ink-4); font-family: var(--font-mono); }\r
.compare .c-arrow { color: var(--ink-4); font-size: 13px; }\r
\r
/* ---------- \u4E24\u680F\u5E03\u5C40 ---------- */\r
/* \u7528 class \u800C\u4E0D\u662F\u5185\u8054\u6837\u5F0F\uFF1A\u5A92\u4F53\u67E5\u8BE2\u76D6\u4E0D\u4F4F\u5185\u8054\u7684 grid-template-columns\uFF0C\r
   \u624B\u673A\u4E0A\u4E00\u680F\u4F1A\u88AB\u538B\u6210\u4E00\u6761\u7A84\u7F1D\uFF0C\u6587\u5B57\u9010\u5B57\u7AD6\u6392\u3002 */\r
.split { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 14px; align-items: start; }\r
.split-even { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }\r
.split-side { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 14px; align-items: start; }\r
\r
/* ---------- \u7EF4\u5EA6\u9009\u62E9\u5668 ---------- */\r
.dim-picker {\r
  display: grid;\r
  grid-template-columns: repeat(2, minmax(0, 1fr));\r
  gap: 15px 26px;\r
  align-content: start;\r
}\r
.dim-picker .chip-set { gap: 6px; }\r
.dim-picker .seg button { padding: 3px 8px; font-size: 11.5px; }\r
.dim-picker .seg { background: var(--bg-sink); }\r
\r
/* ---------- \u54CD\u5E94\u5F0F ---------- */\r
@media (max-width: 1180px) {\r
  .dim-picker { grid-template-columns: 1fr; }\r
}\r
\r
@media (max-width: 1080px) {\r
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\r
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\r
  .dim-grid { grid-template-columns: 1fr; }\r
}\r
\r
@media (max-width: 860px) {\r
  .app-shell { grid-template-columns: 1fr; }\r
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\r
  .sidebar {\r
    position: fixed;\r
    bottom: 0; left: 0; right: 0;\r
    top: auto;\r
    height: auto;\r
    border-right: 0;\r
    border-top: 1px solid var(--line);\r
    flex-direction: row;\r
    z-index: 40;\r
    padding-bottom: env(safe-area-inset-bottom);\r
  }\r
  .brand, .sidebar-foot, .nav-group-label { display: none; }\r
  .nav {\r
    display: flex;\r
    flex-direction: row;\r
    overflow-x: auto;\r
    padding: 6px 8px;\r
    gap: 2px;\r
    width: 100%;\r
    scrollbar-width: none;\r
  }\r
  .nav::-webkit-scrollbar { display: none; }\r
  .nav-item {\r
    flex: none;\r
    width: auto;\r
    flex-direction: column;\r
    gap: 2px;\r
    padding: 6px 9px;\r
    font-size: 10.5px;\r
    min-width: 60px;\r
    text-align: center;\r
  }\r
  .nav-item > span { white-space: nowrap; }\r
  .topbar-actions { flex-wrap: nowrap; }\r
  .topbar-actions .btn { padding: 5px 9px; font-size: 12px; }\r
  .nav-item .ni { font-size: 15px; }\r
  .nav-item .badge { position: absolute; margin: 0; }\r
  .page { padding: 16px 14px 90px; }\r
  .topbar { padding: 11px 14px; }\r
  .topbar h1 { font-size: 16px; }\r
  .g2, .g3,\r
  .split, .split-even, .split-side { grid-template-columns: 1fr; }\r
  .nav-item { white-space: nowrap; }\r
  .seg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }\r
  .seg::-webkit-scrollbar { display: none; }\r
  .seg button { white-space: nowrap; flex: none; }\r
  .topbar .crumb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw; }\r
  .card-head { flex-wrap: wrap; }\r
  .card-head .sub { flex-basis: 100%; }\r
  .card-head .right { margin-left: 0; }\r
  .modal-mask { padding: 0; align-items: flex-end; }\r
  .modal { max-width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; }\r
  .modal-foot { border-radius: 0; }\r
  .compare { grid-template-columns: 1fr; }\r
  .compare .c-arrow { display: none; }\r
}\r
\r
@media (max-width: 358px) {\r
  .g4 { grid-template-columns: 1fr; }\r
  .kpi .k-value { font-size: 23px; }\r
}\r
\r
@media print {\r
  .sidebar, .topbar-actions, .nav { display: none; }\r
  .app-shell { grid-template-columns: 1fr; }\r
  .card { box-shadow: none; break-inside: avoid; }\r
}\r
