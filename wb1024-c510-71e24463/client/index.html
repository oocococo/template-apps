<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历备忘录 · 节日与历史上的今天</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">📅</span>
        <div class="brand-text">
          <h1>日历备忘录</h1>
          <p>节日 · 节气 · 历史上的今天 · 我的备忘</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" title="切换主题">🌗</button>
        <button id="todayBtn" class="primary-btn">今天</button>
      </div>
    </header>

    <main class="layout">
      <!-- 左：日历 -->
      <section class="calendar-card">
        <div class="cal-header">
          <button id="prevBtn" class="nav-btn" aria-label="上个月">‹</button>
          <div class="cal-title" id="calTitle">2026 年 10 月</div>
          <button id="nextBtn" class="nav-btn" aria-label="下个月">›</button>
        </div>
        <div class="week-row">
          <span class="wk wk-sun">日</span>
          <span>一</span><span>二</span><span>三</span>
          <span>四</span><span>五</span>
          <span class="wk wk-sat">六</span>
        </div>
        <div class="day-grid" id="dayGrid"><!-- JS 渲染 --></div>
        <div class="legend">
          <span class="lg lg-legal">法定</span>
          <span class="lg lg-traditional">传统</span>
          <span class="lg lg-intl">节日</span>
          <span class="lg lg-term">节气</span>
          <span class="lg lg-memo">备忘</span>
        </div>
      </section>

      <!-- 右：详情 -->
      <section class="detail-card" id="detailCard">
        <div class="detail-date">
          <div class="dd-main">
            <span id="ddDay">22</span>
            <span class="dd-week" id="ddWeek">星期四</span>
          </div>
          <div class="dd-sub" id="ddSub">2026 年 10 月 · 农历 九月十三</div>
        </div>

        <div class="block">
          <h3 class="block-title">🎏 节日 / 节气</h3>
          <div id="holidayList" class="tag-list"></div>
        </div>

        <div class="block">
          <h3 class="block-title">📜 历史上的今天</h3>
          <div id="historyMeta" class="meta-line"></div>
          <ul id="historyList" class="history-list"></ul>
        </div>

        <div class="block">
          <h3 class="block-title">📝 我的备忘</h3>
          <form id="memoForm" class="memo-form">
            <input id="memoInput" type="text" maxlength="120" placeholder="写点什么提醒自己…" autocomplete="off" />
            <button type="submit" class="primary-btn sm">添加</button>
          </form>
          <ul id="memoList" class="memo-list"></ul>
        </div>
      </section>
    </main>

    <footer class="foot">
      数据离线可用 · 农历与二十四节气为天文推算 · 历史上的今天为本地精选
    </footer>
  </div>

  <script src="assets/lunar.js"></script>
  <script src="assets/holidays.js"></script>
  <script src="assets/history.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
