
<svg class="bg-enzo" viewBox="0 0 900 900" aria-hidden="true">
  <circle cx="450" cy="450" r="420"/>
</svg>

<div id="app">
  <header>
    <div class="brand"><b>一念</b><i>ENTER</i></div>
    <div class="step" id="step">01 / 落笔</div>
  </header>

  <main>
    <!-- 落笔 -->
    <section class="stage" id="stage-input">
      <div class="ask">此刻，你只做一件事</div>
      <div class="row">
        <div class="field">
          <input id="task" type="text" maxlength="28" autocomplete="off" spellcheck="false"
                 placeholder="写下那件你一直在躲的事">
          <div class="rule"></div>
        </div>
        <button id="enter" aria-label="锁定任务，开始专注">
          <svg viewBox="0 0 200 200" fill="none" aria-hidden="true">
            <path d="M150 46 V100 C150 121 133 138 112 138 H68" stroke="currentColor" stroke-width="12" stroke-linecap="square"/>
            <path d="M92 112 L64 138 L92 164" stroke="currentColor" stroke-width="12" stroke-linecap="square"/>
          </svg>
        </button>
      </div>
      <div class="tip">按下 <kbd>Enter</kbd> 锁定。从此刻起，世界只剩这一件事。</div>
      <div class="durs" id="durs">
        <button data-min="5">05</button>
        <button data-min="15">15</button>
        <button data-min="25" class="on">25</button>
        <button data-min="50">50</button>
      </div>
    </section>

    <!-- 入定 -->
    <section class="stage" id="stage-focus" hidden>
      <div class="who" id="who"></div>
      <div class="dial">
        <div class="rip" id="rip"></div>
        <svg viewBox="0 0 480 480" aria-hidden="true">
          <circle class="ring-track" cx="240" cy="240" r="238"/>
          <circle class="ring-prog" id="prog" cx="240" cy="240" r="238"/>
        </svg>
        <div class="clock"><small>剩余</small><b id="clock">25:00</b></div>
      </div>
      <div class="zen">想，皆是虚妄；敲，即是道场。</div>
      <button class="esc" id="esc" type="button">双击 ESC 或点击出定</button>
    </section>

    <!-- 出关 -->
    <section class="stage" id="stage-done" hidden>
      <div class="tag">完成 · DONE</div>
      <h1>一事已了</h1>
      <div class="sub" id="sub">25 分钟，只做了一件事。</div>
      <div class="stats">
        <div class="col"><div class="v" id="s1">25:00</div><div class="k">专注时长</div></div>
        <div class="dv"></div>
        <div class="col"><div class="v" id="s2">01</div><div class="k">今日已了</div></div>
        <div class="dv"></div>
        <div class="col"><div class="v" id="s3">01</div><div class="k">连续天数</div></div>
      </div>
      <div class="acts">
        <button class="again" id="again">再做一念</button>
        <button class="share" id="share">分享这一念</button>
      </div>
      <div class="zen-done">念起即行，事毕即空。</div>
    </section>
  </main>

  <footer>
    <div>一万个念头，一个回车。</div>
    <div class="r" id="foot">一日一念</div>
  </footer>
</div>

<div class="toast" id="toast"></div>
