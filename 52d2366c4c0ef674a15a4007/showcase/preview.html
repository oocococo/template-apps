<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一念 · ENTER —— 一万个念头，一个回车</title>
<meta name="description" content="一个只允许你做一件事的单任务专注应用。写下唯一要做的事，按下回车，世界就只剩这一件事。">
<style>
:root{
  --ink:#0B0B0C;
  --ink-2:#141416;
  --paper:#F2EFE9;
  --mist:#8A867E;
  --dim:#57544F;
  --cinnabar:#E8401F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",SimSun,serif;
  --mono:"JetBrains Mono","SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  transition:background .7s ease;
}
body.done{background:var(--cinnabar)}
#app{position:relative;height:100%;display:flex;flex-direction:column}

/* ---------- 背景圆相 ---------- */
.bg-enzo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vmin,900px);height:min(94vmin,900px);pointer-events:none;z-index:0;transition:opacity .6s}
.bg-enzo circle{fill:none;stroke:var(--paper);stroke-opacity:.055;stroke-width:2;
  stroke-linecap:round;stroke-dasharray:2510 130;transform:rotate(-108deg);transform-origin:450px 450px}
body.done .bg-enzo circle{stroke:var(--ink);stroke-opacity:.10}

/* ---------- 顶栏 ---------- */
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:26px 36px 0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:.06em}
.brand i{font-family:var(--mono);font-size:11px;font-style:normal;color:var(--dim);letter-spacing:.14em}
.step{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
body.done .brand b{color:var(--ink)}
body.done .brand i,body.done .step{color:rgba(11,11,12,.55)}

/* ---------- 舞台 ---------- */
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center}
.stage{width:100%;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}

/* ---------- 落笔 ---------- */
#stage-input{display:flex;flex-direction:column;align-items:center;max-width:940px;margin:0 auto;padding:0 36px}
.ask{font-family:var(--serif);font-size:clamp(20px,2.4vw,28px);color:var(--mist);letter-spacing:.06em}
.row{display:flex;align-items:center;gap:24px;width:100%;margin-top:clamp(30px,5vh,56px)}
.field{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
input#task{
  width:100%;background:none;border:0;outline:none;color:var(--paper);
  font-family:var(--serif);font-size:clamp(24px,3.2vw,36px);font-weight:400;
  padding:0;caret-color:var(--cinnabar);letter-spacing:.02em;
}
input#task::placeholder{color:rgba(242,239,233,.22)}
.rule{height:1px;background:var(--cinnabar);box-shadow:0 0 14px rgba(232,64,31,.55)}
#enter{
  flex:0 0 auto;width:clamp(72px,7.4vw,104px);aspect-ratio:1;border:0;cursor:pointer;
  border-radius:18px;background:var(--cinnabar);color:var(--ink);
  display:grid;place-items:center;
  box-shadow:0 0 46px rgba(232,64,31,.45);
  transition:transform .16s ease,box-shadow .25s ease,opacity .25s;
}
#enter:hover{transform:translateY(-2px);box-shadow:0 0 66px rgba(232,64,31,.72)}
#enter:active{transform:scale(.96)}
#enter:disabled{opacity:.32;box-shadow:none;cursor:not-allowed;transform:none}
#enter svg{width:46%;height:46%}
.tip{margin-top:22px;font-size:14px;color:var(--dim);letter-spacing:.02em}
.tip kbd{font-family:var(--mono);font-size:12px;border:1px solid rgba(242,239,233,.18);
  border-radius:4px;padding:1px 6px;color:var(--mist)}
.durs{display:flex;gap:16px;margin-top:44px}
.durs button{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:12px;
  color:var(--dim);letter-spacing:.08em;padding:4px 0;border-bottom:1px solid transparent;transition:.2s}
.durs button.on{color:var(--cinnabar);border-bottom-color:var(--cinnabar)}

/* ---------- 入定 ---------- */
#stage-focus{display:flex;flex-direction:column;align-items:center;justify-content:center}
.who{font-family:var(--serif);font-size:clamp(22px,3vw,42px);letter-spacing:.04em;text-align:center;
  max-width:min(880px,88vw);line-height:1.35}
.dial{position:relative;width:min(80vmin,480px);height:min(80vmin,480px);margin-top:clamp(10px,3vh,26px);
  display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.ring-track{fill:none;stroke:var(--cinnabar);stroke-opacity:.13;stroke-width:1}
.ring-prog{fill:none;stroke:var(--cinnabar);stroke-width:3;stroke-linecap:round;
  transform:rotate(-128deg);transform-origin:50% 50%;transition:stroke-dasharray 1s linear}
.ripple{fill:none;stroke:var(--cinnabar);stroke-width:1}
.clock{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.clock small{font-family:var(--mono);font-size:12px;color:var(--mist);letter-spacing:.2em}
.clock b{font-family:var(--mono);font-size:clamp(44px,7vw,78px);font-weight:300;letter-spacing:.01em;
  font-variant-numeric:tabular-nums}
.zen{margin-top:clamp(14px,3vh,28px);font-family:var(--serif);font-size:clamp(16px,1.7vw,22px);color:var(--mist);letter-spacing:.08em}
.esc{border:0;background:none;cursor:pointer;margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.12em}

/* ---------- 出关 ---------- */
#stage-done{display:flex;flex-direction:column;align-items:center;color:var(--ink);position:relative}
#stage-done .tag{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:rgba(11,11,12,.75)}
#stage-done h1{font-family:var(--serif);font-weight:700;font-size:clamp(46px,8.4vw,88px);
  letter-spacing:.06em;margin-top:14px;line-height:1.1}
#stage-done .sub{font-family:var(--serif);font-size:clamp(14px,1.8vw,18px);color:rgba(11,11,12,.8);margin-top:22px}
.stats{display:flex;align-items:center;gap:0;margin-top:clamp(28px,5vh,52px)}
.stats .col{width:clamp(110px,15vw,200px);text-align:center}
.stats .v{font-family:var(--mono);font-size:clamp(24px,3.4vw,40px);font-weight:300;font-variant-numeric:tabular-nums}
.stats .k{font-size:12px;margin-top:10px;color:rgba(11,11,12,.7)}
.stats .dv{width:1px;height:48px;background:rgba(11,11,12,.32)}
.acts{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:clamp(30px,5vh,56px)}
.again{border:0;cursor:pointer;background:var(--ink);color:var(--cinnabar);
  font-family:var(--sans);font-size:15px;letter-spacing:.06em;
  padding:18px 42px;border-radius:8px;transition:transform .16s,opacity .2s}
.again:hover{transform:translateY(-2px)}
.again:active{transform:scale(.97)}
.share{background:none;border:0;cursor:pointer;font-size:13px;color:rgba(11,11,12,.62);
  letter-spacing:.06em;border-bottom:1px solid rgba(11,11,12,.28);padding-bottom:3px}
.share:hover{color:var(--ink)}
.zen-done{margin-top:clamp(26px,4vh,46px);text-align:center;
  font-family:var(--serif);font-size:clamp(14px,1.5vw,18px);color:rgba(11,11,12,.85);letter-spacing:.08em}

/* ---------- 页脚 ---------- */
footer{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:0 36px 26px;font-family:var(--serif);font-size:15px;color:var(--dim)}
footer .r{font-family:var(--mono);font-size:11px;letter-spacing:.12em}
body.done footer{color:rgba(11,11,12,.6)}

/* ---------- 水波涟漪 ---------- */
@keyframes rip{0%{transform:scale(.62);opacity:.55}100%{transform:scale(1.28);opacity:0}}
.rip{position:absolute;inset:0;border-radius:50%;border:1px solid var(--cinnabar);opacity:0;pointer-events:none}
.rip.go{animation:rip 2.2s ease-out}
.toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,16px);z-index:9;
  background:var(--ink);color:var(--paper);font-size:13px;letter-spacing:.05em;
  padding:12px 22px;border-radius:999px;border:1px solid rgba(242,239,233,.14);
  opacity:0;transition:.28s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){
  header{padding:20px 20px 0}
  #stage-input,footer{padding-left:20px;padding-right:20px}
  .row{gap:14px;margin-top:34px}
  .durs{margin-top:30px}
  .stats .col{width:96px}
  .zen-done{bottom:20px}
}
</style>
</head>
<body>
<svg class="bg-enzo" viewBox="0 0 900 900" aria-hidden="true">
  <circle cx="450" cy="450" r="420"/>
</svg>

<div style="position:fixed;z-index:10;top:8px;left:50%;transform:translateX(-50%);color:#8a867e;font:11px sans-serif">示例体验，数据仅保留在本页 <button id="reset-demo" style="background:none;border:0;color:#8a867e;text-decoration:underline;cursor:pointer">恢复示例</button></div><div id="app">
  <header>
    <div class="brand"><b>一念</b><i>ENTER</i></div>
    <div class="step" id="step">01 / 落笔</div>
  </header>

  <main>
    <!-- 落笔 -->
    <section class="stage" id="stage-input">
      <div class="ask">此刻，你只做一件事</div>
      <div class="row">
        <div class="field">
          <input id="task" type="text" maxlength="28" autocomplete="off" spellcheck="false"
                 placeholder="写下那件你一直在躲的事">
          <div class="rule"></div>
        </div>
        <button id="enter" aria-label="锁定任务，开始专注">
          <svg viewBox="0 0 200 200" fill="none" aria-hidden="true">
            <path d="M150 46 V100 C150 121 133 138 112 138 H68" stroke="currentColor" stroke-width="12" stroke-linecap="square"/>
            <path d="M92 112 L64 138 L92 164" stroke="currentColor" stroke-width="12" stroke-linecap="square"/>
          </svg>
        </button>
      </div>
      <div class="tip">按下 <kbd>Enter</kbd> 锁定。从此刻起，世界只剩这一件事。</div>
      <div class="durs" id="durs">
        <button data-min="5">05</button>
        <button data-min="15">15</button>
        <button data-min="25" class="on">25</button>
        <button data-min="50">50</button>
      </div>
    </section>

    <!-- 入定 -->
    <section class="stage" id="stage-focus" hidden>
      <div class="who" id="who"></div>
      <div class="dial">
        <div class="rip" id="rip"></div>
        <svg viewBox="0 0 480 480" aria-hidden="true">
          <circle class="ring-track" cx="240" cy="240" r="238"/>
          <circle class="ring-prog" id="prog" cx="240" cy="240" r="238"/>
        </svg>
        <div class="clock"><small>剩余</small><b id="clock">25:00</b></div>
      </div>
      <div class="zen">想，皆是虚妄；敲，即是道场。</div>
      <button class="esc" id="esc" type="button">双击 ESC 或点击出定</button>
    </section>

    <!-- 出关 -->
    <section class="stage" id="stage-done" hidden>
      <div class="tag">完成 · DONE</div>
      <h1>一事已了</h1>
      <div class="sub" id="sub">25 分钟，只做了一件事。</div>
      <div class="stats">
        <div class="col"><div class="v" id="s1">25:00</div><div class="k">专注时长</div></div>
        <div class="dv"></div>
        <div class="col"><div class="v" id="s2">01</div><div class="k">今日已了</div></div>
        <div class="dv"></div>
        <div class="col"><div class="v" id="s3">01</div><div class="k">连续天数</div></div>
      </div>
      <div class="acts">
        <button class="again" id="again">再做一念</button>
        <button class="share" id="share">分享这一念</button>
      </div>
      <div class="zen-done">念起即行，事毕即空。</div>
    </section>
  </main>

  <footer>
    <div>一万个念头，一个回车。</div>
    <div class="r" id="foot">一日一念</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var memory={};
  var state={mins:25,task:'',endAt:0,timer:0,escAt:0,running:false};

  /* ---------- 本地记忆 ---------- */
  function load(){
    return memory
  }
  function save(o){
    memory=o
  }
  function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
  function bump(){
    var m=load(),t=dayKey();
    if(m.lastDay===t){m.today=(m.today||0)+1}
    else{
      var y=new Date();y.setDate(y.getDate()-1);
      m.streak=(m.lastDay===dayKey(y))?(m.streak||0)+1:1;
      m.today=1;m.lastDay=t;
    }
    m.total=(m.total||0)+1;
    save(m);return m;
  }
  function peek(){
    var m=load(),t=dayKey();
    if(m.lastDay!==t)return{streak:m.lastDay?(m.streak||0):0,today:0};
    return{streak:m.streak||1,today:m.today||0};
  }
  function pad(n){return (n<10?'0':'')+n}

  /* ---------- 工具 ---------- */
  function toast(msg){
    var el=$('#toast');el.textContent=msg;el.classList.add('on');
    clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},2000);
  }
  function setStep(t){$('#step').textContent=t}

  /* ---------- 落笔 ---------- */
  var taskInput=$('#task'),enterBtn=$('#enter');

  function syncEnter(){
    enterBtn.disabled=!taskInput.value.trim();
  }
  taskInput.addEventListener('input',syncEnter);
  syncEnter();

  $('#durs').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    Array.prototype.forEach.call(this.children,function(x){x.classList.remove('on')});
    b.classList.add('on');
    state.mins=+b.dataset.min;
  });

  enterBtn.addEventListener('click',start);
  taskInput.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();start()}
  });

  function start(){
    var v=taskInput.value.trim();
    if(!v){taskInput.focus();return}
    state.task=v;
    state.escAt=0;
    state.running=true;
    state.endAt=Date.now()+state.mins*60*1000;

    $('#who').textContent=v;
    $('#stage-input').hidden=true;
    $('#stage-focus').hidden=false;
    $('#stage-done').hidden=true;
    document.body.classList.remove('done');
    setStep('02 / 入定');
    $('#rip').classList.remove('go');
    void $('#rip').offsetWidth;
    $('#rip').classList.add('go');
    tick();
    state.timer=setInterval(tick,1000);
    taskInput.blur();
  }

  var C=2*Math.PI*238;
  function tick(){
    var left=Math.max(0,state.endAt-Date.now());
    if(left<=0){finish();return}
    var total=state.mins*60*1000;
    var p=left/total;
    var s=Math.ceil(left/1000);
    $('#clock').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    var prog=$('#prog');
    prog.style.strokeDasharray=(C*p).toFixed(1)+' '+C.toFixed(1);
  }

  /* ---------- 放弃 ---------- */
  function requestAbort(){
    if(!state.running)return;
    var now=Date.now();
    if(now-state.escAt<600){abort();state.escAt=0}else{
      state.escAt=now;toast('再按一次出定');
    }
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape')requestAbort()});
  $('#esc').addEventListener('click',function(){if(state.running)abort()});
  function abort(){
    clearInterval(state.timer);state.running=false;
    $('#stage-focus').hidden=true;$('#stage-input').hidden=false;
    document.body.classList.remove('done');
    setStep('01 / 落笔');
    taskInput.focus();
    toast('已出定。念头还在，下次再敲。');
  }

  /* ---------- 出关 ---------- */
  function finish(){
    clearInterval(state.timer);state.running=false;
    var m=bump();
    $('#s1').textContent=pad(state.mins)+':00';
    $('#s2').textContent=pad(m.today||1);
    $('#s3').textContent=pad(m.streak||1);
    $('#sub').textContent=state.mins+' 分钟，只做了一件事。';
    $('#stage-focus').hidden=true;
    $('#stage-input').hidden=true;
    $('#stage-done').hidden=false;
    document.body.classList.add('done');
    setStep('03 / 出关');
    taskInput.value='';
    syncEnter();
  }

  $('#again').addEventListener('click',function(){
    document.body.classList.remove('done');
    $('#stage-done').hidden=true;
    $('#stage-input').hidden=false;
    setStep('01 / 落笔');
    taskInput.focus();
  });

  $('#share').addEventListener('click',function(){
    var txt='「一万个念头，一个回车。」\n「一念 · ENTER」是一个只允许你做一件事的应用：写下唯一要做的事，按下回车，世界就只剩这一件事。';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('文案已复制，去发一条吧')},
        function(){toast('复制失败，请手动选择')});
    }else{toast('文案：'+txt)}
  });

  document.querySelector('#reset-demo').addEventListener('click',function(){clearInterval(state.timer);state.running=false;state.mins=25;memory={};document.body.classList.remove('done');$('#stage-focus').hidden=true;$('#stage-done').hidden=true;$('#stage-input').hidden=false;taskInput.value='';syncEnter();setStep('01 / 落笔');$('#foot').textContent='一日一念';Array.prototype.forEach.call($('#durs').children,function(b){b.classList.toggle('on',b.dataset.min==='25')});});
  /* ---------- 初始化 ---------- */
  var p=peek();
  $('#foot').textContent='一日一念'+(p.today?' · 今日已了 '+p.today:'');
  taskInput.focus();
})();
</script>
</body>
</html>
