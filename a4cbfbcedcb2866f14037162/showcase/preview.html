</style><div id="root"><div class="app-shell"><main class="page"><small>示例体验，数据仅保留在本页 · <button id="reset" class="text-link">恢复示例</button></small><header class="today-greeting"><div><p class="today-date">今天</p><h1>今天也值得认真过</h1></div></header><section class="card module-card"><div class="module-header"><h2>今日主心情</h2></div><div class="mood-grid" id="moods"></div></section><section class="card module-card"><div class="module-header"><h2>今日任务</h2></div><div class="task-list" id="tasks"></div><div class="form-actions"><input id="title" placeholder="任务名称" aria-label="任务名称"><button class="soft-button" id="add">添加任务</button></div></section><section class="card module-card"><div class="module-header"><h2>正在推进的项目</h2></div><p class="hint">给生活留一点向前的空间。</p></section><section class="card module-card"><div class="module-header"><h2>今日自动时间线</h2></div><div id="timeline" class="hint"></div></section><section class="card module-card"><div class="module-header"><h2>晚间一句总结</h2></div><textarea id="summary" placeholder="用一句话为今天收尾"></textarea><button class="soft-button" id="save">保存总结</button><span id="saved" class="hint"></span></section></main></div></div><script>let initial=()=>[{title:'整理今天的计划',done:false},{title:'读十页书',done:true}],tasks=initial(),mood='平静';const $=x=>document.getElementById(x);function render(){ $('moods').replaceChildren(...['开心','平静','期待','治愈','疲惫','焦虑','难过','生气'].map(x=>{let b=document.createElement('button');b.className='mood-chip'+(mood===x?' selected':'');b.style.setProperty('--mood-soft','#e7ece9');b.textContent=x;b.onclick=()=>{mood=x;render()};return b}));$('tasks').replaceChildren(...tasks.map((t,i)=>{let row=document.createElement('div');row.className='task-row';let check=document.createElement('button');check.className='round-check'+(t.done?' checked':'');check.textContent=t.done?'✓':'';check.setAttribute('aria-label','完成任务');check.onclick=()=>{t.done=!t.done;render()};let title=document.createElement('span');title.className='task-title'+(t.done?' done-text':'');title.textContent=t.title;let del=document.createElement('button');del.className='text-link';del.textContent='删除';del.onclick=()=>{tasks.splice(i,1);render()};row.append(check,title,del);return row}));$('timeline').textContent=tasks.filter(t=>t.done).map(t=>'完成了 '+t.title).join(' · ')||'完成一件任务，就会在这里留下痕迹。'}$('add').onclick=()=>{let v=$('title').value.trim();if(v){tasks.push({title:v,done:false});$('title').value='';render()}};$('save').onclick=()=>{$('saved').textContent='已保存'};$('reset').onclick=()=>{tasks=initial();mood='平静';$('summary').value='';$('saved').textContent='';render()};render()</script></html>
