<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auditer · 一个项目经理的 90 天</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#F7F5EF;color:#191917;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.mono{font-family:"SF Mono",Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.95);backdrop-filter:blur(10px);border-bottom:1px solid #E2DED2}
.top-in{max-width:1120px;margin:0 auto;padding:13px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.top-r{display:flex;align-items:center;gap:14px;flex:none}
.save-ind{font-size:11px;color:#A5A296;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save-ind i{width:5px;height:5px;border-radius:50%;background:#1D9E75;display:inline-block}
.save-ind.warn{color:#B4593B}
.save-ind.warn i{background:#B4593B}
.tbtn{font-size:11.5px;padding:5px 11px;border-radius:6px;border:1px solid #DDD9CC;background:#fff;color:#55534B;cursor:pointer;letter-spacing:.04em}
.tbtn:hover{border-color:#9A978C;background:#FBFAF5}
.saves-wrap{max-width:640px;margin:0 auto}
.slots{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px}
.slot{background:#fff;border:1px solid #E2DED2;border-radius:10px;padding:13px 15px;display:flex;align-items:center;gap:14px}
.slot.empty{background:#FBFAF5;border-style:dashed}
.slot .sn{flex:none;width:62px;font-size:11px;letter-spacing:.1em;color:#9A978C}
.slot .si{flex:1;min-width:0}
.slot .si b{display:block;font-size:13.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .si em{font-style:normal;font-size:11px;color:#A5A296;letter-spacing:.02em}
.slot .sb{flex:none;display:flex;gap:6px}
.slot .sb button{font-size:11.5px;padding:6px 11px;border-radius:6px;border:1px solid #DDD9CC;background:#fff;color:#55534B;cursor:pointer}
.slot .sb button:hover{border-color:#9A978C}
.slot .sb button.pri{background:#123F35;border-color:#123F35;color:#fff}
.slot .sb button.del:hover{border-color:#E8CFCA;color:#B4593B}
.savetip{margin-top:14px;font-size:12px;color:#9A978C;line-height:1.8}
.saverow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.28em;margin:0}
.brand span{font-size:11px;color:#9A978C;letter-spacing:.04em}
.steps{display:flex;gap:5px}
.steps i{width:28px;height:3px;background:#DDD9CC;border-radius:2px;transition:.3s}
.steps i.on{background:#123F35}
.steps i.cur{background:#9A6F32}

.layout{max-width:1120px;margin:0 auto;padding:30px 28px 90px;display:grid;grid-template-columns:248px 1fr;gap:40px;align-items:start}
.panel{position:sticky;top:74px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:2px}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-thumb{background:#DDD9CC;border-radius:2px}
.panel-hd{font-size:10.5px;letter-spacing:.18em;color:#9A978C;padding:0 2px 4px}
.gauge{background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:11px 13px}
.gauge .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.gauge .hd span{font-size:11.5px;color:#6B695F}
.gauge .hd b{font-size:12.5px;font-weight:600}
.bar{height:4px;background:#EDEAE0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.g i{background:#2B6B57}.bar.b i{background:#1F4A73}.bar.a i{background:#9A6F32}.bar.r i{background:#8F3327}
.risk-line{display:flex;align-items:center;gap:8px}
.risk-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.risk-txt{font-size:12.5px;font-weight:600}
.risk-hint{font-size:11px;color:#9A978C;line-height:1.55;margin:7px 0 0}
.cards-box{background:#FBF8F1;border:1px dashed #D8C9A5;border-radius:9px;padding:11px 13px}
.cards-box .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cards-box .hd span{font-size:11.5px;color:#7A6A48}
.cards-box .hd b{font-size:12.5px;font-weight:600;color:#8F6830}
.chip{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:4px;background:#fff;border:1px solid #E4DAC0;color:#7A6A48;margin:0 5px 5px 0;line-height:1.6}
.chip.more{background:#F5EFE0;border-style:dashed;color:#A08C60}

.stage{min-height:60vh}
.phase{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.phase .p1{font-size:11px;letter-spacing:.16em;color:#9A6F32;font-weight:600}
.phase .p2{font-size:11.5px;color:#A5A296}
h2.ev-title{font-size:27px;font-weight:600;letter-spacing:-.015em;margin:8px 0 22px;line-height:1.35}
.prose p{font-size:15px;line-height:1.95;color:#55534B;margin:0 0 14px}
.prose p em{font-style:normal;color:#191917;font-weight:500}
.talk{display:flex;gap:12px;margin:24px 0;align-items:flex-start}
.talk .t-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px}
.talk .who{font-size:10px;letter-spacing:.08em;color:#9A6F32;white-space:nowrap}
.talk .t-body{flex:1;min-width:0;border-left:2px solid #C9A96B;padding-left:15px}
.talk p{font-size:15.5px;line-height:1.9;color:#191917;margin:0}
.talk p+p{margin-top:10px}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:30px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:15px 17px;cursor:pointer;transition:.16s;color:#191917}
.opt:hover{border-color:#123F35;box-shadow:0 3px 14px rgba(18,63,53,.08);transform:translateY(-1px)}
.opt:active{transform:translateY(0)}
.opt .k{font-size:11px;color:#A5A296;border:1px solid #DDD9CC;border-radius:4px;width:20px;height:20px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.opt .t{font-size:14.5px;line-height:1.6;font-weight:500}
.opt .sub{display:block;font-size:12.5px;color:#8A887E;margin-top:5px;font-weight:400;line-height:1.6}

/* 抄送框 */
.ccrow{display:flex;align-items:center;gap:10px;margin-top:26px;padding:12px 15px;border:1px dashed #D8D2C2;border-radius:9px;cursor:pointer;transition:.16s;background:#FDFCF8}
.ccrow:hover{border-color:#B4593B;background:#FEFAF9}
.ccrow.on{border-style:solid;border-color:#B4593B;background:#FCF3F1}
.ccrow .cbox{flex:0 0 auto;width:17px;height:17px;border:1.5px solid #C9C4B4;border-radius:4px;display:grid;place-items:center;font-size:11px;color:#fff;background:#fff;transition:.16s}
.ccrow.on .cbox{background:#B4593B;border-color:#B4593B}
.ccrow .cct{font-size:13px;color:#55534B;line-height:1.6}
.ccrow.on .cct{color:#8F3327;font-weight:500}
.ccrow .ccn{margin-left:auto;flex:0 0 auto;font-size:10.5px;color:#B0ACA0;letter-spacing:.02em}

/* 沟通：怎么说 */
.saywrap{max-width:700px}
.saychosen{display:flex;align-items:baseline;gap:12px;padding:14px 17px;background:#F5F3EC;border-radius:9px;font-size:14px;color:#2E2C26;line-height:1.65;margin-bottom:20px}
.saychosen .lbl{flex:0 0 auto;font-size:10px;letter-spacing:.12em;color:#A5A296;font-weight:600}
.sayprompt{font-size:15px;line-height:1.9;color:#55534B;margin:0 0 22px}
.saymodes{display:flex;flex-direction:column;gap:11px}
.saym{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:16px 18px;cursor:pointer;transition:.16s}
.saym:hover{border-color:#123F35;box-shadow:0 3px 14px rgba(18,63,53,.08);transform:translateY(-1px)}
.saym .sm-k{font-size:12.5px;letter-spacing:.04em;color:#123F35;font-weight:600}
.saym .sm-line{font-size:15px;line-height:1.75;color:#2E2C26}
.sayhint{font-size:11.5px;color:#A5A296;margin:20px 0 0;letter-spacing:.03em}
.said{padding:14px 17px;background:#FBF8F1;border-left:2px solid #C9A96B;border-radius:0 8px 8px 0;margin-bottom:16px}
.said .lbl{display:block;font-size:10px;letter-spacing:.14em;color:#A5A296;font-weight:600;margin-bottom:7px}
.said q{font-size:15px;line-height:1.8;color:#2E2C26;quotes:"「" "」"}

.result{background:#F2F5F2;border:1px solid #D9E1D9;border-radius:9px;padding:17px 19px;margin-top:26px}
.delta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.delta span{font-size:11.5px;padding:3px 8px;border-radius:4px;background:#fff;border:1px solid #E2DED2;color:#6B695F}
.delta .up{color:#2B6B57;border-color:#CDE0D5}
.delta .dn{color:#8F3327;border-color:#E8CFCA}
.result p{font-size:14.5px;line-height:1.9;color:#3A3934;margin:0}
.note{margin-top:14px;padding:16px 18px;background:#FBF8F1;border:1px solid #E8DFC9;border-radius:9px}
.note .tag{font-size:10.5px;letter-spacing:.16em;color:#9A6F32;display:block;margin-bottom:8px;font-weight:600}
.note p{font-size:13.5px;line-height:1.85;color:#5A5142;margin:0}
.note p+p{margin-top:9px}
.note .law{color:#8F6830;font-weight:500}

.cont{display:inline-flex;align-items:center;gap:9px;margin-top:26px;background:#123F35;color:#F7F5EF;border:none;border-radius:8px;padding:11px 22px;font-size:14px;cursor:pointer;transition:.16s}
.cont:hover{background:#1B5646}

.act-intro{text-align:center;padding:56px 0 40px}
.act-intro .num{font-size:11px;letter-spacing:.3em;color:#9A6F32;margin-bottom:16px}
.act-intro h2{font-size:34px;font-weight:600;letter-spacing:.04em;margin:0 0 14px}
.act-intro .sub{font-size:14.5px;color:#8A887E;max-width:420px;margin:0 auto 34px;line-height:1.9}
.act-intro .quote{font-size:13px;color:#A5A296;line-height:1.9;max-width:440px;margin:0 auto 40px;padding-top:22px;border-top:1px solid #E2DED2}

.settle{max-width:640px}
.settle h2{font-size:24px;font-weight:600;margin:0 0 6px}
.settle .lead{font-size:13.5px;color:#8A887E;margin:0 0 26px}
.ledger{background:#fff;border:1px solid #E2DED2;border-radius:9px;overflow:hidden;margin-bottom:18px}
.ledger .row{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #F0EDE3;font-size:13.5px}
.ledger .row:last-child{border-bottom:none}
.ledger .row span:first-child{color:#6B695F}
.ledger .row b{font-weight:600}
.fired{background:#FCF3F1;border:1px solid #E8CFCA;border-radius:9px;padding:16px 18px;margin-bottom:18px}
.fired .tag{font-size:10.5px;letter-spacing:.16em;color:#8F3327;display:block;margin-bottom:10px;font-weight:600}
.fired .item{font-size:13.5px;line-height:1.8;color:#5A3A35;padding-left:14px;position:relative;margin-bottom:9px}
.fired .item:last-child{margin-bottom:0}
.fired .item::before{content:"—";position:absolute;left:0;color:#C08C82}
.checkup{background:#F5F3EC;border:1px solid #E2DED2;border-radius:9px;padding:16px 18px}
.checkup .tag{font-size:10.5px;letter-spacing:.16em;color:#9A6F32;display:block;margin-bottom:10px;font-weight:600}
.checkup p{font-size:13.5px;line-height:1.85;color:#5A5142;margin:0}
.sec{margin:22px 0}
.prog{background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:14px 16px;margin-bottom:14px}
.pg-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#8A887E;margin-bottom:9px;letter-spacing:.03em}
.pg-top b{color:#123F35;font-size:14px}
.pg-bar{height:5px;background:#EFEBE0;border-radius:3px;overflow:hidden;margin-bottom:12px}
.pg-bar i{display:block;height:100%;background:#123F35;border-radius:3px;transition:width .5s}
.prog p{font-size:13px;line-height:1.8;color:#55534B;margin:0 0 11px}
.pg-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:#A5A296}
.pg-meta span{position:relative}
.pg-meta span+span::before{content:"";position:absolute;left:-8px;top:50%;width:2px;height:2px;border-radius:50%;background:#CFCABA}
.sec-lbl{font-size:10.5px;letter-spacing:.18em;color:#A5A296;font-weight:600;margin-bottom:10px}
.truth{background:#fff;border:1px solid #E2DED2;border-left:3px solid #2B6B57;border-radius:8px;padding:15px 17px;margin-bottom:10px}
.truth .tt{font-size:14.5px;font-weight:600;color:#2E2C26;line-height:1.6;margin-bottom:8px}
.truth .bd{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.06em;color:#2B6B57;background:#EEF5F1;border-radius:4px;padding:2px 7px;margin-right:8px;vertical-align:2px}
.truth p{font-size:13px;line-height:1.85;color:#5A574D;margin:0}
.truth p.more{margin-top:7px;color:#78756A}
.blind{background:#FFFCFA;border:1px dashed #DCC8BF;border-radius:9px;padding:15px 17px}
.blind p{font-size:13px;line-height:1.85;color:#6E5A50;margin:0}
.blind p+p{margin-top:9px}
.blind b{color:#8F3327;font-size:14px}
.co{background:#FBF8F1;border:1px solid #E8DFC9;border-radius:9px;padding:16px 18px}
.co-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.co-hd b{font-size:15px;color:#8F3327;letter-spacing:.02em}
.co-n{font-size:10.5px;color:#A5A296;letter-spacing:.04em}
.co p{font-size:13.5px;line-height:1.85;color:#5A5142;margin:0}
.att-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #EBE7DB;font-size:13.5px}
.att-row:last-child{border-bottom:none}
.att-row .an{flex:0 0 84px;display:flex;align-items:center;gap:8px;font-weight:600;color:#2E2C26}
.att-row .an img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:center 18%;border:1px solid #EAE6DA}
.att-row .at{color:#6B695F;line-height:1.7}
.unk{margin:22px 0;padding:15px 17px;background:#fff;border:1px dashed #D8D2C2;border-radius:9px}
.unk .tag{font-size:10.5px;letter-spacing:.16em;color:#9A6F32;display:block;margin-bottom:8px;font-weight:600}
.unk p{font-size:13.5px;line-height:1.8;color:#5A5142;margin:0;font-style:italic}

.ending{padding:20px 0}
.ending .eyebrow{font-size:11px;letter-spacing:.24em;color:#9A6F32;margin-bottom:14px}
.ending h2{font-size:36px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.25}
.ending .desc{font-size:15.5px;line-height:2;color:#55534B;max-width:560px;margin-bottom:30px}
.ending .verdict{background:#fff;border:1px solid #E2DED2;border-left:3px solid #123F35;border-radius:6px;padding:16px 18px;margin-bottom:26px;font-size:14px;line-height:1.9;color:#3A3934}

.title-screen{max-width:520px;margin:0 auto;text-align:center;padding:70px 0 40px}
.title-screen .kicker{font-size:10.5px;letter-spacing:.34em;color:#9A6F32;margin-bottom:26px}
.title-screen h1{font-size:56px;font-weight:600;letter-spacing:.14em;margin:0 0 12px;line-height:1}
.title-screen .sub{font-size:14px;color:#8A887E;letter-spacing:.06em;margin-bottom:38px}
.title-screen .lead{font-size:14.5px;line-height:2;color:#55534B;text-align:left;background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:22px 24px;margin-bottom:30px}
.title-screen .lead p{margin:0 0 12px}
.title-screen .lead p:last-child{margin:0}
.title-screen .meta{font-size:11.5px;color:#A5A296;line-height:1.9;margin-top:26px}
.btn-primary{background:#123F35;color:#F7F5EF;border:none;border-radius:8px;padding:13px 34px;font-size:14.5px;cursor:pointer;transition:.16s;letter-spacing:.04em}
.btn-primary:hover{background:#1B5646}
.btn-ghost{background:transparent;color:#6B695F;border:1px solid #DDD9CC;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin-left:10px}
.btn-ghost:hover{border-color:#9A978C}

.panel-hd.grp{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px}
.grp-tag{font-size:8.5px;color:#B9B6AB;letter-spacing:.14em}
.gauge.tight{padding:9px 11px}
.gauge.tight .hd{margin-bottom:6px}
.gauge.tight .risk-hint{margin-top:5px}
.prow{display:grid;grid-template-columns:26px 1fr 32px 32px 32px;align-items:center;gap:6px;padding:5px 2px;border-bottom:1px solid #F2EFE6}
.prow.grp-hd{padding:2px 2px 4px;border-bottom:none;cursor:default}
.prow.grp-hd:hover{background:transparent}
.grp-hd .g-title{grid-column:1/3;font-size:8.5px;color:#B9B6AB;letter-spacing:.16em;white-space:nowrap}
.grp-hd>span:not(.g-title){font-size:8.5px;color:#C6C3B8;text-align:center;line-height:1}
.prow:last-child{border-bottom:none}
.prow:hover{background:#FBF9F3}
.pnm{font-size:12px;color:#191917;display:flex;align-items:baseline;gap:5px;white-space:nowrap;overflow:hidden}
.pnm em{font-style:normal;font-size:9px;color:#A5A296}
.pg{position:relative;height:6px;border-radius:3px;background:#EDEAE0;overflow:hidden;cursor:default}
.pg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .4s,background .4s}
.pg.pg-unknown{background:#B3B0A3}
.pv{text-align:right;font-size:11.5px;color:#3A3934;font-variant-numeric:tabular-nums}
.pv.low{color:#B4593B;font-weight:600}
.pv.hi{color:#2B6B57}
.ar{font-style:normal;font-size:8px;margin-left:-2px}
.ar.up{color:#1D9E75}
.ar.dn{color:#B4593B}
.crew-delta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:14px}
.crew-delta em{font-style:normal;font-size:10.5px;letter-spacing:.08em;color:#A5A296;width:100%;margin-bottom:2px}
.crew-delta span{font-size:12px;padding:5px 11px;border-radius:6px;background:#fff;border:1px solid #E2DED2;color:#55534B}
.crew-delta .up{color:#1D9E75;border-color:#CDE0D5;background:#FAFDFB}
.crew-delta .dn{color:#B4593B;border-color:#E8CFCA;background:#FEFAF9}
.pv.unk{color:#C6C3B8}
.coh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 11px;background:#FBF8F1;border:1px solid #E8DFC9;border-radius:7px;font-size:11px;margin-top:2px}
.coh span{color:#9A978C;letter-spacing:.04em}
.coh b{color:#8F3327;font-weight:600;font-size:11.5px}
.pcard{background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:10px 12px}
.p-top{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.p-name{font-size:13px;font-weight:600}
.p-role{font-size:9.5px;color:#A5A296}
.p-rows{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.p-row{display:flex;gap:3px;align-items:baseline;font-size:10px;color:#8A887E}
.p-row b{font-size:12.5px;font-weight:600;color:#191917}
.p-row b.low{color:#B4593B}
.p-row b.unk{color:#C6C3B8}
.p-note{font-size:10px;line-height:1.55;color:#9A978C}
.p-mini{height:3px;background:#EDEAE0;border-radius:2px;margin:6px 0 5px;overflow:hidden}
.p-mini i{display:block;height:100%;border-radius:2px;background:#2B6B57;transition:width .4s}
.p-mini i.warn{background:#B4593B}

.dispatch{max-width:720px}
.dtask{background:#fff;border:1px solid #E2DED2;border-radius:10px;padding:15px 17px;margin-bottom:11px;transition:.2s}
.dtask.done{border-color:#B9D4C6;background:#FCFDFC}
.dt-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
.dt-head b{font-size:14.5px;font-weight:600}
.diff{font-size:11px;color:#C0B49A;letter-spacing:.18em}
.dt-desc{font-size:13px;line-height:1.75;color:#55534B;margin:0 0 5px}
.dt-risk{font-size:12px;line-height:1.7;color:#8F6830;margin:0 0 12px}
.dt-opts{display:flex;gap:7px;flex-wrap:wrap}
.dpick{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #DDD9CC;border-radius:7px;padding:5px 12px 5px 6px;font-size:12.5px;cursor:pointer;transition:.15s;color:#55534B}
.dpick img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:center 18%}
.dpick:hover{border-color:#9A978C}
.dpick.on{background:#123F35;border-color:#123F35;color:#F7F5EF}
.dpick small{font-size:9.5px;opacity:.6;margin-left:5px}
.dres{background:#FBFDFC;border:1px solid #D9E1D9;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.dres .who{font-size:10px;letter-spacing:.1em;color:#1D9E75;display:block;margin-bottom:6px}
.dres .t{font-size:13.5px;line-height:1.85;color:#3A3934}
.dres.bad{background:#FCF3F1;border-color:#E8CFCA}
.dres.bad .who{color:#A33A2E}
.meet-tip{font-size:12px;color:#8F6830;background:#FBF8F1;border:1px solid #E8DFC9;border-radius:7px;padding:8px 12px;margin-top:12px}
.fade{animation:fade .38s ease both}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ═══════ 场景背景 / 人物头像 / 版面 ═══════ */
.bgfx{position:fixed;inset:0;z-index:-1;background:#F7F5EF center 32%/cover no-repeat;transition:background-image .9s ease}
.bgfx::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,245,239,.88),rgba(247,245,239,.94) 55%,rgba(247,245,239,.97))}
img.av{border-radius:50%;object-fit:cover;object-position:center 18%;flex:0 0 auto;background:#E8E4D8}
.prow img.av{width:26px;height:26px;border:1px solid #EAE6DA}
.stage{max-width:768px}
.act-hero{position:relative;height:232px;border-radius:14px;overflow:hidden;margin:0 0 30px;background:#E8E4D8;box-shadow:0 12px 32px rgba(25,25,23,.12)}
.act-hero>img{width:100%;height:100%;object-fit:cover;display:block}
.ah-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,20,18,.06) 25%,rgba(18,20,18,.68) 100%)}
.act-hero.slim{height:186px;margin-bottom:34px}
.ah-tx{position:absolute;left:0;right:0;bottom:0;padding:20px 26px 22px;color:#F7F5EF;text-align:left}
.ah-tx .ah-num{font-size:10.5px;letter-spacing:.3em;opacity:.8;display:block;margin-bottom:7px}
.ah-tx h2{font-size:30px;margin:0 0 7px;font-weight:600;letter-spacing:.08em;line-height:1.2}
.ah-tx p{margin:0;font-size:13.5px;opacity:.88;line-height:1.7}
.talk .t-av{width:44px;height:44px;border:2px solid #fff;box-shadow:0 2px 8px rgba(25,25,23,.16)}
.loc{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:#6B695F;letter-spacing:.06em;padding:3px 10px 3px 4px;background:#fff;border:1px solid #E2DED2;border-radius:20px;flex:0 0 auto}
.loc img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:center 30%;border:1px solid #EAE6DA}
.saypeers{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.sp-av{width:42px;height:42px;border:2px solid #fff;box-shadow:0 2px 8px rgba(25,25,23,.16)}
.sp-arrow{color:#B9B6AB;font-size:16px}
.sp-name{font-size:12.5px;color:#6B695F;letter-spacing:.04em}
.crew-delta span{display:inline-flex;align-items:center;gap:6px}
.crew-delta span img{width:20px;height:20px;border-radius:50%;object-fit:cover;object-position:center 18%}
.dres .who{display:flex;align-items:center;gap:8px}
.dres .who img{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:center 18%}
body.solo .panel{display:none}
body.solo .layout{grid-template-columns:1fr;max-width:920px}
body.solo .stage{margin:0 auto}
body.center .stage{max-width:680px;min-height:calc(100vh - 170px);display:flex;flex-direction:column;justify-content:center}

/* ── 结局：评分 / 分叉 / 战报 / 成就 ── */
.score{background:#fff;border:1px solid #E2DED2;border-radius:10px;padding:16px 18px;margin-top:20px}
.score .sc-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.score .sc-hd b{font-size:11px;letter-spacing:.18em;color:#9A978C;font-weight:500}
.score .sc-total{display:flex;align-items:baseline;gap:9px}
.score .sc-total em{font-style:normal;font-size:32px;font-weight:600;color:#123F35;line-height:1}
.score .sc-total i{font-style:normal;font-size:11.5px;color:#9A978C}
.sc-grade{font-size:12px;padding:3px 9px;border-radius:5px;background:#123F35;color:#fff;font-weight:600;margin-left:2px}
.sc-row{display:grid;grid-template-columns:64px 1fr 32px;align-items:center;gap:10px;margin-top:9px;font-size:12px;color:#55534B}
.sc-row .bar{height:6px;border-radius:3px;background:#EFECE2;overflow:hidden}
.sc-row .bar i{display:block;height:100%;border-radius:3px}
.sc-row b{font-size:11.5px;color:#3A3934;text-align:right;font-variant-numeric:tabular-nums}
.sc-note{margin-top:13px;padding-top:11px;border-top:1px dashed #E8E4D8;font-size:12px;color:#8A887E;line-height:1.8}
.fork{border-left:2px solid #C9A96B;padding:1px 0 1px 13px;margin-top:16px}
.fork b{font-size:12.5px;display:block;margin-bottom:6px;color:#191917}
.fork .f-row{font-size:12px;color:#55534B;line-height:1.85}
.fork .f-lbl{font-size:9.5px;letter-spacing:.1em;color:#A5A296;display:inline-block;width:50px}
.fork .f-alt{color:#8A887E}
.report{background:#123F35;color:#F2EFE6;border-radius:10px;padding:15px 17px;margin-top:20px;font-size:12px;line-height:1.95;font-family:Consolas,Menlo,monospace;white-space:pre-wrap}
.report .rp-hd{font-size:9.5px;letter-spacing:.16em;color:#B9B29A;margin-bottom:9px;font-family:inherit}
.btn-copy{margin-top:10px;font-size:11.5px;padding:6px 12px;border-radius:6px;border:1px solid #2E5C4C;background:transparent;color:#DDE7DF;cursor:pointer}
.btn-copy:hover{background:#1B4A3B}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-top:14px}
.ach{background:#fff;border:1px solid #E2DED2;border-radius:9px;padding:10px 11px;font-size:12px;position:relative}
.ach b{display:block;font-size:12.5px;margin:0 0 4px;color:#191917;font-weight:500}
.ach em{font-style:normal;font-size:10.5px;color:#A5A296;line-height:1.6;display:block}
.ach.lock{background:#FBFAF5;border-style:dashed}
.ach.lock b{color:#B4B2A9}
.ach.fresh{border-color:#C9A96B;background:#FFFDF5}
.ach .rar{position:absolute;right:9px;top:9px;font-size:9px;letter-spacing:.08em;color:#C9A96B}
.toast{position:fixed;right:22px;bottom:22px;z-index:80;background:#123F35;color:#F5F2E8;border-radius:10px;padding:12px 16px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.35s;max-width:280px}
.toast.on{opacity:1;transform:none}
.toast em{font-style:normal;display:block;font-size:9.5px;letter-spacing:.16em;color:#C9C2AE;margin-bottom:4px}

@media(max-width:880px){
  .layout{grid-template-columns:1fr;gap:22px;padding:18px 16px 70px}
  .panel{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;max-height:none;overflow:visible}
  .panel-hd{display:none}
  .panel-hd.grp{display:flex;flex:1 1 100%;margin-top:4px}
  .prow{flex:1 1 46%;grid-template-columns:1fr 30px 30px 30px;padding:4px 2px;border-bottom:none}
  .coh{flex:1 1 100%}
  .att-row{font-size:12.5px;gap:8px;padding:8px 0}
  .att-row .an{flex:0 0 44px}
  .saychosen{font-size:13px;gap:8px}
  .saychosen .lbl{font-size:9px}
  .saym .sm-line{font-size:14px;line-height:1.7}
  .sayprompt{font-size:14px}
  .p-note{display:none}
  .p-mini{display:none}
  .gauge{flex:1 1 140px;padding:9px 11px}
  .gauge .hd{margin-bottom:5px}
  .risk-hint{display:none}
  .cards-box{flex:1 1 100%}
  h2.ev-title{font-size:22px;margin:6px 0 18px}
  .title-screen h1{font-size:40px}
  .ending h2{font-size:27px}
  .top-in{padding:11px 16px}
  .brand span{display:none}
  .steps i{width:18px}
  .prow{grid-template-columns:24px 1fr 28px 28px 28px;gap:5px}
  .prow img.av{width:24px;height:24px}
  .talk{gap:10px}
  .talk .t-av{width:36px;height:36px}
  .act-hero{height:172px;border-radius:11px}
  .act-hero.slim{height:140px}
  .ah-tx{padding:13px 17px 15px}
  .ah-tx h2{font-size:22px}
  .att-row .an{flex:0 0 74px;gap:6px}
  .att-row .an img{width:24px;height:24px}
  .saypeers{gap:9px}
  .sp-av{width:36px;height:36px}
  body.center .stage{min-height:auto}
}
@media(max-width:600px){.layout>*{min-width:0}.slot{flex-wrap:wrap;gap:8px}.slot .sn{width:50px}.slot .si{flex:1 1 calc(100% - 60px)}.slot .sb{flex:1 1 100%;flex-wrap:wrap}.saverow button{max-width:100%}}</style>

];

var NS_GOOD = [
  ["stock2","存货监盘（含权属核查）"],
  ["fraud2","问题发票的扩大程序"],

function NS_hasCards(S, ids){
  var c = (S && S.cards) || [];
  for(var i=0;i<c.length;i++){ if(ids.indexOf(c[i].id)>=0) return true; }
  return false;
}
/* 只算「真扣下的牌」：severity>=1 视为未解决，severity=0 视为做实了的程序 */
function NS_unresolved(S){
  var out=[], c=(S&&S.cards)||[];
  for(var i=0;i<NS_POOL.length;i++){
    for(var j=0;j<c.length;j++){
      if(c[j].severity>=1 && NS_POOL[i].cards.indexOf(c[j].id)>=0){ out.push(NS_POOL[i].label); break; }
    }
  }
  return out;
}
function NS_solved(S){
  var map={}, out=[], c=(S&&S.cards)||[];
  for(var i=0;i<NS_GOOD.length;i++) map[NS_GOOD[i][0]]=NS_GOOD[i][1];
  for(var j=0;j<c.length;j++){
    if(c[j].severity===0 && map[c[j].id] && out.indexOf(map[c[j].id])<0) out.push(map[c[j].id]);
  }
  return out;
}

      note:"<span class='law'>把个案的判断沉淀成组织经验，是这份工作里最少被奖励、但最有用的动作</span>。案例不讲结论，讲分叉点：哪一步还有选择、哪一步之后就没了。这比任何一条准则条文都更容易被记住。",
      cards:[{ id:"case", label:"讲出去的那个案例", trigger:6, severity:0,
        reveal:"两年后，另一个经理在承接阶段给你打电话：「你当年那个案例，我们现在遇到了。」",
        eff:{ partner:6, risk:-6 } }],
      tag:"reflect" }
  ]
}

  ]
};

/* ─────────────────────────────────────────────
事件字段：
  act        幕号 1-6
  order      幕内顺序
  time       显示在标题上方的时间地点
  title      标题
  text       正文段落数组，支持 <em> 高亮
  talk       { who, lines[] } 可选，人物对话
  cond(S)    可选，返回 false 则该事件不出现
  choices[]  选项，每个含：
    t        选项文字
    sub      副标题（灰色小字，可选）
    eff      资源变化 {hours, morale, client, partner, risk, ms}
    cards[]  扣下的牌 {id,label,trigger,severity,reveal,eff}
    flag     设置标记（可选）
    punish   踩线计数（可选）
    res      选择后的结果叙述
    note     底稿批注（支持 HTML）
───────────────────────────────────────────── */

</script>
<script>
(function(){
"use strict";
var LS="auditer_save_v1", SLOT_PREFIX="auditer_slot_";
var S=null, LIST=null, SNAP=null, FIRED=[];

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ═══ 头像与场景背景 ═══ */
function avatarOf(id){
  if(id==="self") return DATA.selfAvatar||"";
  var c=(S&&S.crew[id])||DATA.crew[id];
  return (c&&c.avatar)||"";
}
function avatarImg(id,cls){
  var src=avatarOf(id); if(!src) return "";
  return '<img class="av '+(cls||"")+'" src="'+src+'" alt="" onerror="this.style.visibility=\'hidden\'">';
}
function crewIdByName(who){
  if(!who) return "";
  for(var k in DATA.crew){
    if(!DATA.crew.hasOwnProperty(k)) continue;
    var n=DATA.crew[k].name;
    if(who.indexOf(n)>=0||n.indexOf(who)>=0) return k;
  }
  return "";
}
function actBg(){
  var a=actInfo(S.act);
  return a.bg||"";
}
function setBg(){
  var el=$("bgfx"); if(!el) return;
  var u=actBg(); if(!u) return;
  if(el.getAttribute("data-bg")!==u){ el.setAttribute("data-bg",u); el.style.backgroundImage='url("'+u+'")'; }
}

function initCrew(){
  var o={};
  for(var k in DATA.crew){
    if(!DATA.crew.hasOwnProperty(k)) continue;
    var c=DATA.crew[k], n={};
    for(var p in c){ if(c.hasOwnProperty(p)) n[p]=c[p]; }
    n.id=k; n.met=false; o[k]=n;
  }
  if(o.zhou) o.zhou.met=true;
  return o;
}

function fresh(){
  return {act:1,i:0,screen:"title",hours:1300,max:1300,morale:80,client:68,partner:58,risk:0,
          cards:[],flags:{},log:[],ms:0,decisions:0,punish:0,
          crew:initCrew(),pick:{},dispatchDone:false,newMeet:[],
          truth:[],health:70,ccOn:false,seenSig:[],newAch:[]};
}

/* ═══════ 存储层：预览仅保留页面内状态 ═══════ */
var MEM={}; var STORE_OK=true;
function sget(k){return MEM[k]||null;}
function sset(k,v){MEM[k]=v;}
function sdel(k){delete MEM[k];}

function previewAlert(message){ toast(message); }
function previewConfirm(message){ return new Promise(function(resolve){var box=document.createElement('div');box.style.cssText='position:fixed;inset:0;z-index:1000;background:#0008;display:grid;place-items:center';var card=document.createElement('div');card.style.cssText='background:#fff;padding:24px;border-radius:10px;max-width:90vw';var text=document.createElement('p');text.textContent=message;card.appendChild(text);['取消','确定'].forEach(function(label,i){var button=document.createElement('button');button.textContent=label;button.style.marginRight='12px';button.onclick=function(){box.remove();resolve(i===1)};card.appendChild(button)});box.appendChild(card);document.body.appendChild(box);}); }
function slotKey(n){ return n==="auto" ? LS : (SLOT_PREFIX+n); }
function slotRead(n){
  var raw=sget(slotKey(n)); if(!raw) return null;
  try{ var o=JSON.parse(raw); return (o && o.act) ? o : null; }catch(e){ return null; }
}
function slotWrite(n,state){
  var o=JSON.parse(JSON.stringify(state)); o.ts=Date.now(); o.slot=n;
  sset(slotKey(n), JSON.stringify(o));
}
function slotDel(n){ sdel(slotKey(n)); }
function save(){
  if(S && S.screen==="saves"){ markSaved(); return; }   /* 存档界面不覆盖自动存档 */
  if(S && S.screen!=="title"){
    try{ S.pv=(LIST && LIST[S.i] && LIST[S.i].title) || (actInfo(S.act).name+"阶段"); }catch(e){}
    S.ts=Date.now();
  }
  sset(LS,JSON.stringify(S));
  markSaved();
}
function load(){
  try{
    var raw=sget(LS); if(!raw) return null;
    var o=JSON.parse(raw); if(!o || !o.act) return null; return o;
  }catch(e){ return null; }
}
function markSaved(){
  var el=$("saveInd"); if(!el) return;
  if(!STORE_OK){
    el.className="save-ind warn";
    el.innerHTML='<i></i><span>示例状态</span>';
    return;
  }
  el.className="save-ind";
  el.innerHTML='<i></i><span>示例状态</span>';
}

function actInfo(n){
  for(var i=0;i<DATA.acts.length;i++){ if(DATA.acts[i].n===n) return DATA.acts[i]; }
  return {n:n,name:"",sub:"",quote:""};
}

function buildList(){
  var arr=[];
  for(var i=0;i<DATA.events.length;i++){
    var e=DATA.events[i];
    if(e.act!==S.act) continue;
    if(e.cond && !e.cond(S)) continue;
    arr.push(e);
  }
  arr.sort(function(a,b){return (a.order||0)-(b.order||0);});
  LIST=arr;
}

function riskLevel(r){
  if(r<18) return {t:"干净",c:"#2B6B57",h:"该做的程序都做了，底稿经得起翻"};
  if(r<38) return {t:"有些欠账",c:"#7C8A2E",h:"有几页是你自己也不太想回看的"};
  if(r<58) return {t:"不太稳",c:"#9A6F32",h:"质控要是挑这几处，你没多少话好说"};
  if(r<78) return {t:"高危",c:"#B4593B",h:"欠的东西已经不是技术问题了"};
  return {t:"随时会炸",c:"#8F3327",h:"你在等一个时间点，不是等一个理由"};
}

function renderSteps(){
  var h="";
  for(var i=1;i<=6;i++){
    var cls = i<S.act ? "on" : (i===S.act ? "cur" : "");
    h+='<i class="'+cls+'"></i>';
  }
  $("steps").innerHTML=h;
}

function moodText(m){
  if(m>=70) return "状态还好";
  if(m>=45) return "有点累";
  if(m>=25) return "快撑不住";
  return "随时会散";
}
function pv(label,val,warn,unk){
  if(unk) return '<span class="p-row"><span>'+label+'</span><b class="unk">?</b></span>';
  return '<span class="p-row"><span>'+label+'</span><b class="'+(warn?'low':'')+'">'+val+'</b></span>';
}
function personCard(id){
  var c=S.crew[id];
  if(!c||!c.met) return "";
  if(id==="zhou") c.trust=S.partner;
  if(id==="li") c.coop=S.client;
  var h='<div class="pcard">';
  h+='<div class="p-top"><span class="p-name">'+esc(c.name)+'</span><span class="p-role">'+esc(c.role)+'</span></div>';
  h+='<div class="p-rows">';
  h+=pv("信任",c.trust,c.trust<30);
  if(c.energy!=null) h+=pv("精力",c.energy,c.energy<35);
  if(c.skill!=null) h+=pv("能力",c.skill,false,!c.skillKnown);
  if(c.patience!=null) h+=pv("耐心",c.patience,c.patience<30);
  if(c.coop!=null) h+=pv("配合",c.coop,c.coop<35);
  h+='</div>';
  if(c.energy!=null) h+='<div class="p-mini"><i class="'+(c.energy<35?'warn':'')+'" style="width:'+clamp(c.energy,0,100)+'%"></i></div>';
  h+='<div class="p-note">'+esc(c.note)+'</div>';
  h+='</div>';
  return h;
}
function crewGroup(title,ids,mood){
  var cards="";
  for(var i=0;i<ids.length;i++) cards+=personCard(ids[i]);
  if(!cards) return "";
  return '<div class="panel-hd grp"><span>'+title+'</span>'+(mood?'<span class="grp-tag">'+moodText(S.morale)+'</span>':'')+'</div>'+cards;
}

function pgauge(v,label,word){
  var col=v<35?"#B4593B":(v<65?"#C9A96B":"#1D9E75");
  return '<div class="pg" title="'+label+' '+v+' · '+word+'"><i style="width:'+clamp(v,0,100)+'%;background:'+col+'"></i></div>';
}
function trustWord(v){return v<35?"对你有戒心":(v<50?"有所保留":(v<65?"还算配合":(v<80?"信任你":"很信任你")));}
function stateWord(v,c){
  if(c.coop!=null&&c.energy==null&&c.patience==null) return v<35?"不太配合":(v<50?"有所保留":(v<65?"还算配合":"很配合"));
  return v<35?"快撑不住了":(v<50?"有些疲惫":(v<65?"状态尚可":"状态不错"));
}
function stateLabel(c){return (c.coop!=null&&c.energy==null&&c.patience==null)?"配合度":"状态";}
function skillWord(v){return v<35?"还在学":(v<50?"能打下手":(v<65?"可以独立做":"很可靠"));}
function personRow(id){
  var c=S.crew[id];
  if(!c||!c.met) return "";
  if(id==="zhou") c.trust=S.partner;
  if(id==="li") c.coop=S.client;
  var v1=c.trust;
  var v2=(c.energy!=null)?c.energy:((c.patience!=null)?c.patience:((c.coop!=null)?c.coop:null));
  var v3=(c.skill!=null)?(c.skillKnown?c.skill:"?"):null;
  var ar="";
  if(S.crewDelta && S.crewDelta[id]) ar='<i class="ar '+(S.crewDelta[id]>0?"up":"dn")+'">'+(S.crewDelta[id]>0?"▲":"▼")+'</i>';
  var h='<div class="prow" title="'+esc(c.note)+'">';
  h+=avatarImg(id,"pr-av");
  h+='<div class="pnm">'+esc(c.name)+ar+'<em>'+esc(String(c.role).split(" · ")[0])+'</em></div>';
  h+=pgauge(v1,"信任",trustWord(v1));
  h+=(v2==null)?'<div></div>':pgauge(v2,stateLabel(c),stateWord(v2,c));
  if(v3==null) h+='<div></div>';
  else if(v3==="?") h+='<div class="pg pg-unknown" title="能力 · 还不了解，派次活看看就知道"></div>';
  else h+=pgauge(v3,"能力",skillWord(v3));
  h+='</div>';
  return h;
}
function crewGroup(title,ids,tags){
  var rows="";
  for(var i=0;i<ids.length;i++) rows+=personRow(ids[i]);
  if(!rows) return "";
  var h='<div class="prow grp-hd" title="三个小条依次为：信任 / 状态(配合度·精力) / 能力。绿色=不错，土黄=一般，砖红=偏低；鼠标放在小条上可看具体说法。"><span class="g-title">'+title+'</span>';
  for(var j=0;j<3;j++) h+='<span>'+(tags[j]||"")+'</span>';
  return h+'</div>'+rows;
}

function renderPanel(){
  var r=riskLevel(S.risk);
  var hp=Math.round(S.hours/S.max*100);
  var h="";
  h+='<div class="panel-hd">项 目</div>';
  var htxt = S.hours<=0 ? '<b style="color:#8F3327;font-size:12px">已超支</b>' : '<b class="mono">'+S.hours+'h</b>';
  h+='<div class="gauge tight"><div class="hd"><span>预算工时</span>'+htxt+'</div><div class="bar '+(hp<25?"r":"g")+'"><i style="width:'+clamp(hp,0,100)+'%"></i></div></div>';
  h+='<div class="gauge tight"><div class="hd"><span>风险欠账</span><b class="risk-txt" style="color:'+r.c+'">'+r.t+'</b></div><div class="bar r"><i style="width:'+clamp(S.risk,0,100)+'%;background:'+r.c+'"></i></div><p class="risk-hint">'+r.h+'</p></div>';
  var cs=companyState();
  h+='<div class="coh" title="'+esc(cs.h)+'"><span>HX 现状</span><b>'+esc(cs.t)+'</b></div>';
  h+=crewGroup("所 内",["zhou","xu","lin"],["信","态","能"]);
  h+=crewGroup("客 户 方",["li","wang","zhao"],["信","态",""]);
  if(S.cards.length){
    h+='<div class="cards-box"><div class="hd"><span>扣下的牌</span><b>'+S.cards.length+'</b></div>';
    var startAt=Math.max(0,S.cards.length-4);
    if(startAt>0) h+='<span class="chip more">更早的 '+startAt+' 件</span>';
    for(var i=startAt;i<S.cards.length;i++){ h+='<span class="chip">'+esc(S.cards[i].label||"未决事项")+'</span>'; }
    h+='</div>';
  }
  $("panel").innerHTML=h;
}

function render(){
  document.body.classList.toggle("solo", S.screen==="title"||S.screen==="actIntro"||S.screen==="ending"||S.screen==="saves"||S.screen==="ach");
  document.body.classList.toggle("center", S.screen==="title"||S.screen==="actIntro");
  setBg();
  renderSteps();
  if(S.screen==="title"){ $("panel").innerHTML=""; renderTitle(); $("steps").innerHTML=""; return; }
  if(S.screen==="saves"){ $("panel").innerHTML=""; $("stage").innerHTML=viewSaves(); return; }
  if(S.screen==="ach"){ $("panel").innerHTML=""; $("stage").innerHTML=viewAch(); return; }
  renderPanel();
  var st=$("stage");
  if(S.screen==="actIntro") st.innerHTML=viewActIntro();
  else if(S.screen==="event") st.innerHTML=viewEvent();
  else if(S.screen==="say"){ if(S.pending==null){ S.screen="event"; st.innerHTML=viewEvent(); } else { st.innerHTML=viewSay(); } }
  else if(S.screen==="result") st.innerHTML=viewResult();
  else if(S.screen==="dispatch") st.innerHTML=viewDispatch();
  else if(S.screen==="dispatchResult") st.innerHTML=viewDispatchResult();
  else if(S.screen==="actEnd") st.innerHTML=viewActEnd();
  else if(S.screen==="ach") st.innerHTML=viewAch();
  else if(S.screen==="ending") st.innerHTML=viewEnding();
  st.classList.remove("fade"); void st.offsetWidth; st.classList.add("fade");
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderTitle(){
  var sv=load();
  var h='<div class="title-screen">';
  if(DATA.acts[0]&&DATA.acts[0].bg){
    h+='<div class="act-hero slim"><img src="'+DATA.acts[0].bg+'" alt="" onerror="this.parentNode.style.display=\'none\'"><div class="ah-ov"></div></div>';
  }
  h+='<div class="kicker">AUDITER · 一 个 项 目 经 理 的 九 十 天</div>';
  h+='<h1>AUDITER</h1>';
  h+='<div class="sub">一个项目经理的 90 天</div>';
  h+='<div class="lead">';
  h+='<p>你升上项目经理的第一年。第一个完整项目，交到你手上。</p>';
  h+='<p>预算不够、客户着急、人都派出去了。你可以省一点，也可以硬一点。账总能平，风险不会。</p>';
  h+='<p>它只是会晚一点到，由别人来问。</p>';
  h+='</div>';
  h+='<button class="btn-primary" data-act="start">开始这一年</button>';
  if(sv) h+='<button class="btn-ghost" data-act="resume">继续上次</button>';
  h+='<button class="btn-ghost" data-act="saves">存档管理</button>';
  h+='<button class="btn-ghost" data-act="ach">成就 '+achCount()+'</button>';
  h+='<div class="meta">六幕 · 61 个现场事件 · 八个结局<br>示例进度保留在当前页面</div>';
  h+='</div>';
  $("stage").innerHTML=h;
}

/* ═══════ 存档界面 ═══════ */
function fmtTime(ts){
  if(!ts) return "";
  var d=new Date(ts), p=function(n){ return n<10?("0"+n):(""+n); };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function slotName(n){ return n==="auto" ? "自动" : ("存档 "+n); }
function slotList(){
  var out=[{n:"auto",data:slotRead("auto")}];
  for(var i=1;i<=3;i++) out.push({n:i,data:slotRead(i)});
  return out;
}
function slotCard(x){
  var d=x.data, n=x.n;
  var h='<div class="slot'+(d?"":" empty")+'">';
  h+='<div class="sn">'+slotName(n)+'</div>';
  if(d){
    var an=(DATA.acts[d.act-1]||{}).name||"";
    var num=["","一","二","三","四","五","六"][d.act]||"";
    h+='<div class="si"><b>第'+num+'幕 · '+esc(d.pv||an)+'</b>';
    h+='<em>'+esc(an)+' · 决策 '+(d.decisions||0)+' 次 · 工时 '+(d.hours<=0?"超支":d.hours+"h")+' · '+fmtTime(d.ts)+'</em></div>';
    h+='<div class="sb"><button class="pri" data-act="loadslot" data-n="'+n+'">继续</button>';
    if(n!=="auto") h+='<button data-act="saveslot" data-n="'+n+'">覆盖</button>';
    h+='<button data-act="exportslot" data-n="'+n+'">导出</button>';
    h+='<button class="del" data-act="delslot" data-n="'+n+'">删除</button></div>';
  } else {
    h+='<div class="si"><b>空</b><em>把进度存到这里，方便回到某个节点重试</em></div>';
    h+='<div class="sb"><button data-act="saveslot" data-n="'+n+'">存到这里</button></div>';
  }
  return h+'</div>';
}
function viewSaves(){
  var h='<div class="saves-wrap">';
  h+='<div class="phase"><span class="p1">存 档</span><span class="p2">自动存档 + 三个手动位</span></div>';
  h+='<h2 class="ev-title">继续哪一次</h2>';
  h+='<div class="slots">';
  var list=slotList();
  for(var i=0;i<list.length;i++) h+=slotCard(list[i]);
  h+='</div>';
  h+='<div class="savetip">示例进度仅在当前页面保留。<br>'
    + (STORE_OK ? '示例进度只在当前页面保留。'
                : '<b style="color:#B4593B">示例进度关闭页面后重置。</b>')
    + '</div>';
  h+='<div class="saverow">';
  h+='<button class="btn-primary" data-act="newgame">开新的一局</button>';
  h+='<button class="btn-ghost" data-act="import">导入存档文件</button>';
  h+='<button class="btn-ghost" data-act="backfromsaves">回到游戏</button>';
  h+='</div></div>';
  return h;
}
function viewAch(){
  var h='<div class="saves-wrap" style="max-width:820px">';
  h+='<div class="phase"><span class="p1">成 就</span><span class="p2">'+achCount()+'</span></div>';
  h+='<h2 class="ev-title">做到了什么</h2>';
  h+=achWall(false);
  h+='<div class="savetip">成就跨周目累积，存在这台设备上，不随存档删除。稀有度：普通 / 稀有 / 极难。<br>灰色的是还没拿到的，提示就是线索。</div>';
  h+='<div class="saverow"><button class="btn-ghost" data-act="backfromsaves">回到游戏</button></div>';
  h+='</div>';
  return h;
}
function exportSlot(n){
  var d=slotRead(n);
  if(!d){ previewAlert("这一格还没有存档。"); return; }
  var stamp=(function(){ var t=new Date(),p=function(v){return v<10?("0"+v):(""+v);};
    return t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+"-"+p(t.getHours())+p(t.getMinutes()); })();
  var blob=new Blob([JSON.stringify(d)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download="auditer-"+slotName(n)+"-"+stamp+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function importFile(file){
  var fr=new FileReader();
  fr.onload=async function(){
    try{
      var o=JSON.parse(fr.result);
      if(!o || !o.act){ previewAlert("这不是 AUDITER 的存档文件。"); return; }
      if(slotRead(1) && !(await previewConfirm("存档 1 已有进度，覆盖吗？"))) return;
      slotWrite(1,o);
      S._back="saves"; S.screen="saves"; render();
    }catch(e){ previewAlert("存档文件读取失败：" + e.message); }
  };
  fr.readAsText(file);
}

function viewActIntro(){
  var a=actInfo(S.act);
  var NUM=["","一","二","三","四","五","六"];

/* ═══════ 评分 / 分叉 / 战报 ═══════ */
function computeScore(){
  var un=NS_unresolved(S).length, so=NS_solved(S).length;
  var prof=clamp(100 - S.risk*0.9 + (S.truth||[]).length*5 - un*3 + so*2, 0, 100);
  var riskc=clamp(100 - S.risk + (S.punish===0?30:0) - (S.punish||0)*8, 0, 100);
  var ce=0,n=0;
  for(var k in S.crew){ if(S.crew.hasOwnProperty(k) && S.crew[k].met){ ce+=S.crew[k].trust||0; n++; } }
  ce = n ? (ce/n) : 0;
  var rel=clamp((S.partner + S.client + ce)/3, 0, 100);
  var eff=clamp((S.hours/Math.max(1,S.max))*60 + (S.client>=55?20:0) + (S.hours>0?20:0), 0, 100);
  var total=Math.round(prof*0.35 + riskc*0.30 + rel*0.20 + eff*0.15);
  var grade = total>=85?"S":(total>=72?"A":(total>=58?"B":(total>=42?"C":"D")));
  return {prof:Math.round(prof),risk:Math.round(riskc),rel:Math.round(rel),eff:Math.round(eff),
          total:total,grade:grade,un:un,so:so};
}
function findEventByTitle(t){
  for(var i=0;i<DATA.events.length;i++){ if(DATA.events[i].title===t) return DATA.events[i]; }
  return null;
}
function forks(){
  var out=[], L=S.log||[];
  for(var i=0;i<L.length;i++){
    var l=L[i]; if(typeof l.i!=="number") continue;
    var ev=findEventByTitle(l.title); if(!ev) continue;
    var mine=ev.choices[l.i]; if(!mine) continue;
    var mineSev=0; (mine.cards||[]).forEach(function(c){ mineSev=Math.max(mineSev,c.severity||0); });
    if(mineSev<2) continue;
    /* 另一条路：在剩下的选项里找「最大后果更轻」的那一条 */
    var alt=null, altSev=99;
    for(var j=0;j<ev.choices.length;j++){
      if(j===l.i) continue;
      var s=0; (ev.choices[j].cards||[]).forEach(function(c){ s=Math.max(s,c.severity||0); });
      if(s<altSev){ altSev=s; alt=ev.choices[j]; }
    }
    if(!alt || altSev>=mineSev) continue;
    out.push({t:ev.title, mine:mine.t, alt:alt.t, altRes:(alt.res||"").split("。")[0]+"。"});
  }
  return out.slice(0,3);
}

function applyEff(eff){
  if(!eff) return [];
  var out=[], names={hours:"工时",morale:"团队",client:"客户",partner:"合伙人",risk:"风险"};
  for(var k in eff){
    if(!eff.hasOwnProperty(k)) continue;
    var v=eff[k]; if(!v) continue; var shown=v;
    if(k==="hours"){ S.hours=Math.max(0,S.hours+v); }
    else if(k==="risk"){ S.risk=clamp(S.risk+v,0,100); }
    else if(k==="partner"){ shown=Math.round(v*0.55); S.partner=clamp(S.partner+shown,0,100); if(!shown) continue; }
    else if(k==="morale"||k==="client"){ S[k]=clamp(S[k]+v,0,100); }
    else if(k==="ms"){ S.ms+=v; }
    var label=(shown>0?"+":"")+shown+" "+names[k];
    var good = (k==="risk") ? v<0 : (v>0);
    out.push({t:label,k:good?"up":"dn"});
  }
  return out;
}

function choose(idx){
  var e=LIST[S.i]; var o=e.choices[idx];
  if(o.say && e.say){ S.pending=idx; S.screen="say"; save(); render(); return; }
  applyChoice(idx,null);
}

function applyChoice(idx,mode){
  var e=LIST[S.i]; var o=e.choices[idx];
  S.chosen=idx; S.decisions++;
  var delta=applyEff(o.eff);
  if(mode && mode.eff){ delta=delta.concat(applyEff(mode.eff)); }
  var ccTxt="";
  if(S.ccOn && e.cc){
    delta=delta.concat(applyEff(e.cc.eff||{}));
    ccTxt=e.cc.tail||"";
    if(e.cc.meter){
      for(var ck in e.cc.meter){
        if(!e.cc.meter.hasOwnProperty(ck)) continue;
        var ccg=S.crew[ck]; if(ccg) ccg.trust=clamp(ccg.trust+e.cc.meter[ck],0,100);
      }
    }
  }
  S.ccOn=false;
  S.morale=clamp(S.morale-1,0,100);
  if(o.flag){ for(var k in o.flag){ if(o.flag.hasOwnProperty(k)) S.flags[k]=o.flag[k]; } }
  if(o.cards){
    for(var i=0;i<o.cards.length;i++){
      var cd=o.cards[i];
      S.cards.push({id:cd.id,label:cd.label,trigger:cd.trigger,severity:cd.severity||1,
                    reveal:cd.reveal,eff:cd.eff||{},mark:cd.mark||""});
    }
  }
  if(o.punish) S.punish++;
  S.log.push({act:S.act,title:e.title,choice:o.t,idx:idx,i:idx,tag:o.tag||""});
  if(o.ach) unlock(o.ach);
  S.newMeet=[];
  if(e.meet){
    for(var mi=0;mi<e.meet.length;mi++){
      var cid=e.meet[mi];
      if(S.crew[cid] && !S.crew[cid].met){ S.crew[cid].met=true; S.newMeet.push(cid); }
    }
  }
  /* 把选项自带的和「怎么说」带来的关系变化合并结算 */
  var meters={};
  if(o.meter){ for(var m1 in o.meter){ if(o.meter.hasOwnProperty(m1)) meters[m1]=(meters[m1]||0)+o.meter[m1]; } }
  if(mode && mode.meter){ for(var m2 in mode.meter){ if(mode.meter.hasOwnProperty(m2)) meters[m2]=(meters[m2]||0)+mode.meter[m2]; } }
  S.crewDelta=null;
  var hasM=false;
  for(var mk in meters){ if(meters.hasOwnProperty(mk)) hasM=true; }
  if(hasM){
    S.crewDelta={};
    for(var mq in meters){
      if(!meters.hasOwnProperty(mq)) continue;
      var mc=S.crew[mq];
      if(!mc) continue;
      mc.trust=clamp(mc.trust+meters[mq],0,100);
      S.crewDelta[mq]=meters[mq];
    }
  }
  var res=o.res||"";
  if(mode && mode.tail) res=res+" "+mode.tail;
  if(ccTxt) res=res+" "+ccTxt;
  S.lastResult={delta:delta,res:res,note:o.note,mode:mode||null};
  S.pending=null;
  checkAch();
  S.screen="result"; save(); render();
}

/* ═══════ 暗线：这条消息你看不看得见，取决于你之前做了什么 ═══════ */
function signalSeen(sig){
  var i,c;
  if(sig.id==="sig1"){
    if(S.risk<=8) return true;
    for(i=0;i<(S.log||[]).length;i++){
      if(String(S.log[i].choice||"").indexOf("去年的底稿")>=0) return true;
    }
    return false;
  }
  if(sig.id==="sig2") return S.risk<=10;
  if(sig.id==="sig3"){
    for(i=0;i<(S.cards||[]).length;i++){
      c=S.cards[i];
      if(c.id==="rev_lin") return false;   /* 抽的全是 11 月，你根本没看到 12 月 */
      if(c.id==="conf_lin") return false;
    }
    return S.risk<=18;
  }
  if(sig.id==="sig4") return S.risk<=30;
  if(sig.id==="sig5") return S.risk<=42;
  return S.risk<=40;
}

function evalSignals(){
  var news=[];
  for(var i=0;i<DATA.signals.length;i++){
    var sig=DATA.signals[i];
    if(sig.act!==S.act) continue;
    if(S.seenSig.indexOf(sig.id)>=0) continue;
    S.seenSig.push(sig.id);
    if(signalSeen(sig)){
      S.truth.push({id:sig.id,title:sig.title,badge:sig.badge,body:sig.body,more:sig.more,key:sig.key});
      news.push({seen:true,sig:sig});
    }else{
      /* 没看见这件事，不是「当场扣分」，是三年后有人替你翻出来。
         所以它的严重度降一级入档，风险敞口照算。 */
      S.cards.push({id:sig.id,label:sig.blindLabel,trigger:sig.trigger,
        severity:Math.max(2,sig.severity-1),reveal:sig.blindReveal,eff:sig.blindEff||{},mark:"blind"});
      news.push({seen:false,sig:sig});
    }
  }
  return news;
}

/* 公司状况：跟你做了什么无关，它自己一直在往坏的方向走。
   差别只在于——你看清了没有。 */
function calcHealth(){
  var dmg=0;
  for(var i=0;i<DATA.signals.length;i++){
    if(DATA.signals[i].act<=S.act) dmg+=DATA.signals[i].damage;
  }
  return clamp(78-dmg-(S.act-1)*2,0,100);
}
function companyState(){
  var hp=S.health;
  for(var i=0;i<DATA.company.length;i++){
    var c=DATA.company[i];
    if(hp>=c.min) return {t:c.t,h:(S.truth.length>=3?c.hc:c.h)};
  }
  var l=DATA.company[DATA.company.length-1];
  return {t:l.t,h:l.h};
}
function attLine(id){
  var c=S.crew[id];
  if(!c||!c.met) return null;
  var v=(id==="li")?(c.coop!=null?c.coop:c.trust):c.trust;
  var arr=DATA.attitude[id]||[];
  for(var i=0;i<arr.length;i++){ if(v>=arr[i][0]) return arr[i][1]; }
  return "";
}

function endAct(){
  S.sigNews=evalSignals();
  FIRED=[];
  var keep=[];
  for(var i=0;i<S.cards.length;i++){
    var c=S.cards[i];
    if(c.trigger===S.act){ FIRED.push(c); }
    else keep.push(c);
  }
  S.cards=keep;
  for(var j=0;j<FIRED.length;j++){
    applyEff(FIRED[j].eff);
    if(FIRED[j].severity>=3 && FIRED[j].mark!=="blind") S.punish++;
  }
  var overhead=[0,38,46,54,62,72,84][S.act]||38;
  S.hours=Math.max(0,S.hours-overhead);
  S.client=clamp(Math.round(S.client+(50-S.client)*0.18),0,100);
  if(S.crew.wang && S.crew.wang.met && S.crew.wang.trust<32) S.risk=clamp(S.risk+3,0,100);
  if(S.crew.zhao && S.crew.zhao.met && S.crew.zhao.trust<26) S.hours=Math.max(0,S.hours-10);
  var big=0;
  for(var q=0;q<FIRED.length;q++){ if(FIRED[q].severity>=3 && FIRED[q].mark!=="blind") big++; }
  /* 老周真正在意的是「你有没有看见别人没看见的东西」。
     看清一件事，比少扣一张牌更值钱。 */
  var seenNow=0;
  if(S.sigNews){ for(var sn=0;sn<S.sigNews.length;sn++){ if(S.sigNews[sn].seen) seenNow++; } }
  if(seenNow>0) S.partner=clamp(S.partner+seenNow*6,0,100);
  if(big===0) S.partner=clamp(S.partner+3,0,100);
  if(S.hours>0) S.partner=clamp(S.partner+3,0,100);
  if(S.client>=50) S.partner=clamp(S.partner+2,0,100);
  if(S.risk>75) S.partner=clamp(S.partner-4,0,100);
  if(S.hours<=0){ S.morale=clamp(S.morale-4,0,100); }
  var d={};
  d.overhead=overhead;
  d.hours = (S.hours-SNAP.hours>=0?"+":"")+(S.hours-SNAP.hours)+"h";
  d.morale = (S.morale-SNAP.morale>=0?"+":"")+(S.morale-SNAP.morale);
  d.client = (S.client-SNAP.client>=0?"+":"")+(S.client-SNAP.client);
  d.partner = (S.partner-SNAP.partner>=0?"+":"")+(S.partner-SNAP.partner);
  d.risk = (S.risk-SNAP.risk>=0?"+":"")+(S.risk-SNAP.risk);
  d.lead = diffLead(d);
  S.lastDiff=d;
  S.health=calcHealth();
  S.checkup=checkupText();
  S.screen="actEnd";
  checkAch();
  save(); render();
}

function diffLead(d){
  if(S.hours<=0) return "预算已经见底了。后面每一小时都要从别的地方挪。";
  if(parseInt(d.risk,10)>18) return "这一段的账看着还行，但有几笔是记在后面的。";
  return "进度按计划走，账面上没什么好说的。";
}

function checkupText(){
  var r=S.risk, n=S.cards.length;
  if(r<18 && n===0) return "底稿干净。该函的函了，该盘的盘了，剩下的都是判断问题，不是程序问题。";
  if(r<18) return "程序上没留缺口，但还有 "+n+" 件事悬着，你自己知道是哪几件。";
  if(r<38) return "有几处用了替代程序，理由写在底稿上——写得过去，但如果被追问细节，你需要想一下。";
  if(r<58) return "质控如果抽到这个项目，会先看那几页。你已经不太愿意主动提起它们了。";
  if(r<78) return "欠的东西开始连成片。现在补还来得及，代价是预算和客户的脸色。";
  return "如果这个项目今天被抽中，你手上没有能挡住问题的东西。";
}

function computeEnding(){
  var E=DATA.endings;
  var severe=S.punish;
  var over = S.hours<=0;
  var pick;
  var path=(S.flags&&S.flags.path)||"";
  if(severe>=4) pick=E.punished;
  else if(S.morale<=16) pick=E.burnout;
  else if(S.partner<=8) pick=E.fired;
  else if(path==="qc" && S.risk<=52 && severe<=1) pick=E.tech;
  else if(path==="big" && S.partner>=45 && S.risk<=40) pick=E.partner;
  else if(S.client>=72 && S.risk>=52 && S.partner<70) pick=E.cfo;
  else if(S.partner>=55 && S.risk<=24 && severe===0 && S.client>=18) pick=E.partner;
  else if(S.partner>=42 && S.risk<=48) pick=E.tech;
  else if(S.risk<=42) pick=E.plain;
  else pick=E.drift;
  return pick;
}

function begin(){

  S.screen="event"; S.i=0; buildList(); render();

    var sc=computeScore();
    if(sc.total>(META.best||0)) META.best=sc.total;
    metaSave();
    unlock("e_"+key);
  }
  S.newAch=S.newAch||[];
  S.screen="ending";
  checkAch();
  save(); render();
}

function normalizeState(){
  if(!S.crew) S.crew=initCrew();
  else {
    var base=initCrew();
    for(var ck in base){ if(base.hasOwnProperty(ck) && !S.crew[ck]) S.crew[ck]=base[ck]; }
  }
  if(!S.pick) S.pick={};
  if(!S.newMeet) S.newMeet=[];
  if(!S.truth) S.truth=[];
  if(!S.seenSig) S.seenSig=[];
  if(S.ccOn==null) S.ccOn=false;
  if(S.health==null || isNaN(S.health)) S.health=calcHealth();
  if(S.dispatchDone==null) S.dispatchDone=false;
  SNAP={hours:S.hours,morale:S.morale,client:S.client,partner:S.partner,risk:S.risk};
  buildList();
  /* 任何屏幕都能安全恢复：把回不去的状态退到一个能玩的位置 */
  if(S.screen==="title") S.screen="actIntro";
  if(S.screen==="saves") S.screen=S._back||"actIntro";
  if(S.screen==="ach") S.screen=S._back||"actIntro";
  if(S.screen==="dispatch" && !(DATA.dispatch && DATA.dispatch[S.act])) S.screen="actIntro";
  if(S.screen==="dispatchResult") S.screen="dispatch";
  if(S.screen==="say" && (S.pending==null || !LIST[S.i])) S.screen="event";
  if(S.screen==="result" && (typeof S.chosen!=="number" || !LIST[S.i])) S.screen="event";
  if(S.screen==="event" && !LIST[S.i]){ S.i=0; S.screen="actIntro"; }
  if(S.screen==="ending" && !S.ending) S.ending=computeEnding();
}

function resumeFrom(state){
  if(!state) return;
  S=JSON.parse(JSON.stringify(state));
  normalizeState();
  save(); render();
}

function start(cont){
  if(cont){ var s=load(); S = s || fresh(); }
  else { S=fresh(); }
  normalizeState();
  save(); render();
}

document.getElementById('reset-example').addEventListener('click',function(){ MEM={}; META={ach:{},endings:{},runs:0,best:0}; FIRED=[]; LIST=null; SNAP=null; S=fresh(); render(); });
document.addEventListener("click",async function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el) return;
  var a=el.getAttribute("data-act");
  if(a==="start"){ start(false); }
  else if(a==="resume"){ start(true); }
  else if(a==="saves"){ S._back=(S.screen==="title")?"title":S.screen; S.screen="saves"; render(); }
  else if(a==="ach"){ S._back=(S.screen==="title")?"title":S.screen; S.screen="ach"; render(); }
  else if(a==="toTitle"){ S.screen="title"; render(); }
  else if(a==="copyreport"){
    var txt=reportText();
    var done=function(){ toast("战报已复制"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){
        toast("安装后可复制战报");
      });
    } else {
      toast("安装后可复制战报");
    }
  }
  else if(a==="backfromsaves"){
    if(S._back==="title"||!S._back){ S.screen="title"; render(); }
    else { S.screen=S._back; normalizeState(); render(); }
  }
  else if(a==="loadslot"){
    var sd=slotRead(el.getAttribute("data-n"));
    if(!sd){ previewAlert("这一格是空的。"); return; }
    if(!(await previewConfirm("载入这个存档？当前未保存的进度会被覆盖。"))) return;
    resumeFrom(sd);
  }
  else if(a==="saveslot"){
    var sn=el.getAttribute("data-n");
    if(sn==="auto") return;
    if(!S._back || S._back==="title"){ previewAlert("先开始或继续一局，再存到这个位置。"); return; }
    if(slotRead(sn) && !(await previewConfirm("存档 "+sn+" 已有进度，覆盖吗？"))) return;
    var cp=JSON.parse(JSON.stringify(S));
    cp.screen=S._back;
    slotWrite(sn,cp);
    render();
  }
  else if(a==="delslot"){
    var dn=el.getAttribute("data-n");
    if(!(await previewConfirm("删除「"+slotName(dn)+"」的存档？删了就找不回来了。"))) return;
    slotDel(dn); render();
  }
  else if(a==="exportslot"){ toast("安装后可导出存档"); }
  else if(a==="import"){ toast("安装后可导入存档"); }
  else if(a==="newgame"){
    if(!(await previewConfirm("开新的一局？当前的自动存档会被新的进度覆盖（手动位不受影响）。"))) return;
    sdel(LS); S=fresh(); S.screen="actIntro"; normalizeState(); save(); render();
  }
  else if(a==="begin"){ begin(); }
  else if(a==="choose"){ choose(parseInt(el.getAttribute("data-i"),10)); }
  else if(a==="say"){ var m=LIST[S.i].say.modes[parseInt(el.getAttribute("data-i"),10)]; applyChoice(S.pending,m); }
  else if(a==="cc"){ S.ccOn=!S.ccOn; save(); render(); }
  else if(a==="next"){ next(); }
  else if(a==="advance"){ advance(); }
  else if(a==="pick"){ S.pick[el.getAttribute("data-t")]=el.getAttribute("data-m"); save(); render(); }
  else if(a==="confirmDispatch"){ confirmDispatch(); }
  else if(a==="afterDispatch"){ S.screen="event"; S.i=0; buildList(); save(); render(); }
  else if(a==="restart"){ sdel(LS); S=fresh(); start(false); }
});

(function(){
  var imp=$("impSave");
  if(imp) imp.addEventListener("change",function(){
    if(this.files && this.files[0]) importFile(this.files[0]);
    this.value="";
  });
})();

document.addEventListener("keydown",function(ev){
  if(!S) return;
  var k=ev.key.toUpperCase();
  if(S.screen==="event" && "ABCD".indexOf(k)>=0){
    var i="ABCD".indexOf(k);
    if(LIST[S.i] && LIST[S.i].choices[i]) choose(i);
  }
  if(S.screen==="say" && "123".indexOf(ev.key)>=0){
    var si="123".indexOf(ev.key);
    var sy=LIST[S.i] && LIST[S.i].say;
    if(sy && sy.modes[si]) applyChoice(S.pending,sy.modes[si]);
    return;
  }
  if(ev.key==="Enter"){
    if(S.screen==="result") next();
    else if(S.screen==="actEnd") advance();
    else if(S.screen==="actIntro") begin();
  }
});

/* 预加载全部场景与头像，避免切换时闪白 */
(function(){
  var urls=[];
  for(var i=0;i<DATA.acts.length;i++){ if(DATA.acts[i].bg) urls.push(DATA.acts[i].bg); }
  for(var k in DATA.crew){ if(DATA.crew.hasOwnProperty(k)&&DATA.crew[k].avatar) urls.push(DATA.crew[k].avatar); }
  if(DATA.selfAvatar) urls.push(DATA.selfAvatar);
  for(var u=0;u<urls.length;u++){ (function(src){ var im=new Image(); im.src=src; })(urls[u]); }
})();

function autoplay(){
  start(false);
  var guard=0;
  try{
    while(S.screen!=="ending" && guard<600){
      guard++;
      if(S.screen==="title"||S.screen==="actIntro"){ S.screen="actIntro"; begin(); }
      else if(S.screen==="dispatch"){
        var D=DATA.dispatch[S.act];
        if(D){ for(var t=0;t<D.tasks.length;t++){ S.pick[D.tasks[t].id]=D.members[t%D.members.length]; } confirmDispatch(); }
        else { S.screen="event"; }
      }
      else if(S.screen==="dispatchResult"){ S.screen="event"; S.i=0; buildList(); }
      else if(S.screen==="event"){
        var e=LIST[S.i];
        if(!e){ S.screen="actIntro"; advance(); continue; }
        choose(Math.floor(Math.random()*e.choices.length));
      }
      else if(S.screen==="say"){ applyChoice(S.pending, LIST[S.i].say.modes[0]); }
      else if(S.screen==="result"){ next(); }
      else if(S.screen==="actEnd"){ advance(); }
      else break;
    }
  }catch(err){ console.error("autoplay", err); }
}

/* 调试入口：?boot=actIntro|event|dispatch&act=N 可直达某界面，正常游玩不受影响 */
S=fresh();
(function(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get("boot")==="resume"){ start(true); return; }
    if(q.get("boot")==="autoplay"){ autoplay(); render(); return; }
    if(q.get("boot")){
      S.screen=q.get("boot");
      if(q.get("act")) S.act=parseInt(q.get("act"),10)||1;
      if(q.get("hours")) S.hours=parseInt(q.get("hours"),10);
      if(q.get("risk")!=null) S.risk=parseInt(q.get("risk"),10);
      if(q.get("met")==="all"){ for(var k in S.crew){ S.crew[k].met=true; } }
      SNAP={hours:S.hours,morale:S.morale,client:S.client,partner:S.partner,risk:S.risk};
      if(S.screen==="event"||S.screen==="actIntro"||S.screen==="dispatch") buildList();
      if(S.screen==="saves") S._back="title";
    }
  }catch(e){}
  render();
})();
})();
