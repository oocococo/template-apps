<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@charset "UTF-8";
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ============================================================
   黑金维多利亚风 —— 对齐原作 UI 截图（黑面板 / 金细线 / 衬线 / 菱形饰）
   ============================================================ */
:root{
  --bg:#070605;
  --panel:rgba(10,9,7,.93);
  --panel2:rgba(20,17,12,.95);
  --line:#3a3120;
  --line2:#6b5a35;
  --gold:#c9ae6e;
  --gold-hi:#e8d5a3;
  --gold-dim:#8a744a;
  --tx:#cfc3a9;
  --tx-dim:#8f8672;
  --bad:#b87a6e;
  --good:#8fbf9f;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"Songti SC","STSong","STZhongsong","SimSun",serif;
  color:var(--tx);
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer}

/* ══════════ 布局：顶栏两行（品牌+数值 / 按钮行居中），主区填满剩余 ══════════ */
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden}
#top{
  flex:none;display:flex;align-items:center;gap:18px;padding:5px 14px 6px;flex-wrap:wrap;
  background:linear-gradient(#12100b,#0a0906);
  border-bottom:1px solid var(--line2);
  box-shadow:0 1px 0 rgba(232,213,163,.12), 0 4px 14px rgba(0,0,0,.6);
  position:relative;z-index:5;
}
/* 按钮行独占一行并水平居中（不绝对定位，避免与窄屏数值区互相挤压） */
#topbtns{
  order:9;width:100%;display:flex;gap:8px;flex-wrap:nowrap;
  justify-content:center;
}
#brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
#brand b{font-size:19px;letter-spacing:4px;color:var(--gold-hi);font-weight:700}
#brand s{text-decoration:none;font-size:9px;letter-spacing:3px;color:var(--gold-dim)}
#brand::after{content:"◆";font-size:8px;color:var(--gold-dim);margin-left:6px}

.gv{display:flex;align-items:center;gap:6px;white-space:nowrap}
.gv>span{font-size:11px;color:var(--tx-dim);letter-spacing:2px}
.nv{font-size:15px;color:var(--gold-hi);min-width:30px;text-align:center}
.nv.gold::before{content:"◉ ";font-size:11px;color:var(--gold)}
.nv.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}

.bar{width:74px;height:7px;background:#050403;border:1px solid var(--line);position:relative}
.bar i{display:block;height:100%;transition:width .3s}
.bar.rp i{background:linear-gradient(90deg,#6b5a35,var(--gold))}
.bar.sn i{background:linear-gradient(90deg,#4a3030,#8a4038)}
.bar.sn.hot i{background:linear-gradient(90deg,#7a2a26,#c0453a);animation:blink 1.2s infinite}

/* 顶栏按钮：石市／瞻礼／排行榜／技艺／藏珍／台面 一行居中 */
.topbtn{
  background:linear-gradient(#1a1610,#0d0b08);
  border:1px solid var(--line2);color:var(--gold);
  font-size:12px;letter-spacing:2px;padding:5px 12px;white-space:nowrap;
}
.topbtn:hover{border-color:var(--gold);color:var(--gold-hi)}

/* ══════════ 主区 ══════════ */
#mn{display:flex;flex:1;min-height:0}
#stg{flex:1;position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%}

/* 侧栏收起（窄屏必备）：body.noside 时隐藏，画布拿回全部宽度 */
body.noside #sd{display:none}
body.noside #stg{flex:1}

#hn{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  max-width:86%;text-align:center;font-size:12px;line-height:1.6;
  color:var(--tx);background:var(--panel);
  border:1px solid var(--line);padding:6px 16px;
  pointer-events:none;
}
#hn b{color:var(--gold-hi)}
#hn:empty{display:none}

#tl{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;gap:8px;justify-content:center;align-items:center;
  padding:9px 10px 11px;flex-wrap:wrap;
  background:linear-gradient(rgba(5,4,3,0),rgba(5,4,3,.88) 40%);
}

/* ══════════ 按钮 ══════════ */
#tl button,.modal button{letter-spacing:1px}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:52px;padding:6px 10px;
  background:var(--panel);border:1px solid var(--line);color:var(--tx-dim);
}
.tool .k{font-size:12px}
.tool.on{border-color:var(--gold);color:var(--gold-hi);box-shadow:inset 0 0 12px rgba(201,174,110,.12)}
.tool:disabled{opacity:.35;cursor:default}
/* 切法选择（圆耀琢/阶台琢/穹素琢/融琢）：只列已解锁的，无锁定灰字 */
#tl .ck-row{display:flex;gap:6px;width:100%;justify-content:center;margin-top:6px}
#tl .ck{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 8px;background:var(--panel);border:1px solid var(--line);color:var(--tx-dim);
}
#tl .ck .k{font-size:12.5px;letter-spacing:1px}
#tl .ck small{font-size:10px;color:var(--tx-dim);letter-spacing:0}
#tl .ck.on{border-color:var(--gold);color:var(--gold-hi);box-shadow:inset 0 0 12px rgba(201,174,110,.12)}
#tl .ck.on small{color:#c9a86e}
/* 工具区：凿/锯/震同一行，操作按钮（制作首饰/直接卖出/弃石）同一行 */
#tl .tools-row{display:flex;gap:6px;width:100%;justify-content:center}
#tl .tools-row .tool{flex:1;min-width:0}
#tl .acts-row{display:flex;gap:6px;width:100%;justify-content:center;margin-top:6px}
#tl .acts-row .gh{flex:1;min-width:0}
.pri{
  background:linear-gradient(#241d10,#14100a);
  border:1px solid var(--gold-dim);color:var(--gold-hi);
  font-size:14px;padding:8px 22px;
}
.pri:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(201,174,110,.25)}
.gh{
  background:var(--panel);border:1px solid var(--line);
  color:var(--tx-dim);font-size:12px;padding:7px 14px;
}
.gh:hover{color:var(--tx);border-color:var(--line2)}
.gh.warn{border-color:rgba(184,122,110,.55);color:#b87a6e}
.gh.warn:hover{border-color:#b87a6e;color:#d09a8e}
.sl .btns{display:flex;flex-direction:column;gap:3px;flex:none}
.sl .btns .gh{padding:3px 8px;font-size:11px;white-space:nowrap}

/* ══════════ 侧栏 ══════════ */
#sd{
  width:264px;flex:none;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(#0b0a08,#080705);
  border-left:1px solid var(--line2);
  padding:10px 10px 24px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
#sd::-webkit-scrollbar{width:5px}
#sd::-webkit-scrollbar-thumb{background:var(--line)}

/* 侧栏视图切换（台面 / 背包） */
.svtabs{display:flex;gap:6px;margin-bottom:10px}
.svt{
  flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx-dim);
  font-size:12px;letter-spacing:2px;padding:6px 0;
}
.svt.on{border-color:var(--gold);color:var(--gold-hi);box-shadow:inset 0 0 12px rgba(201,174,110,.12)}

.sec{margin-bottom:14px;background:var(--panel);border:1px solid var(--line);padding:9px 10px 10px;position:relative}.sec::before{content:"";position:absolute;inset:3px;border:1px solid rgba(107,90,53,.25);pointer-events:none}
.sec h3{
  font-size:12px;font-weight:700;letter-spacing:4px;color:var(--gold);
  text-align:center;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;justify-content:center;
}
.sec h3::before,.sec h3::after{content:"◆";font-size:7px;color:var(--gold-dim)}

.rw{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;padding:2.5px 0}
.rw .k{color:var(--tx-dim)}
.rw .v{color:var(--tx);text-align:right}
.rw .v.ps{color:var(--good)}
.rw .v.ng{color:var(--bad)}

.cl{display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 0}
.cl .d{width:6px;height:6px;transform:rotate(45deg);background:#2a251c;flex:none}
.cl.l1 .d{background:#6b5a35}.cl.l2 .d{background:var(--gold)}.cl.l3 .d{background:var(--gold-hi)}
.cl .t{flex:1;color:var(--tx);min-width:0}
.cl .t em{display:block;font-style:normal;font-size:10px;color:var(--tx-dim)}
.cl .lv{font-size:10px;color:var(--tx-dim);flex:none}
.cl.l3 .lv{color:var(--gold-hi)}
.cl.arch{opacity:.45}

.dg{font-size:11px;padding:3px 6px;margin-top:3px;border-left:2px solid var(--bad);background:rgba(184,122,110,.08);color:var(--bad)}
.dg span.t{font-weight:700;margin-right:6px}

.sl{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(58,49,32,.4);cursor:pointer}
.sl:hover{background:rgba(201,174,110,.06)}
.sl canvas{width:38px;height:38px;flex:none;border:1px solid var(--line);background:#000}
.sl .if{flex:1;min-width:0}
.sl .n{display:block;font-size:13px;color:var(--tx)}
.sl .d{display:block;font-size:10px;color:var(--tx-dim)}
.sl .pr{color:var(--gold-hi);font-size:14px;flex:none}
.sl .pr::before{content:"◉ ";font-size:10px;color:var(--gold)}

/* ══════════ 模态 ══════════ */
#vl{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;z-index:50;
  backdrop-filter:blur(2px);
}
#vl.on{display:flex}
#md{
  width:min(92vw,560px);max-height:88vh;overflow-y:auto;
  background:linear-gradient(#14110b,#0b0906);
  border:1px solid var(--gold-dim);
  box-shadow:0 0 0 4px rgba(10,9,7,.9),0 0 0 5px var(--line),0 18px 60px rgba(0,0,0,.9);
  padding:22px 26px;
  scrollbar-width:thin;
}
#md h2{
  font-size:20px;letter-spacing:8px;color:var(--gold-hi);text-align:center;font-weight:700;
  display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:4px;
}
#md h2::before,#md h2::after{content:"◆";font-size:9px;color:var(--gold-dim)}
#md .sb{text-align:center;font-size:11px;letter-spacing:3px;color:var(--tx-dim);margin-bottom:14px}
#md .ln{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:1px solid rgba(58,49,32,.5)}
#md .ln .k{color:var(--tx-dim)}
#md .ln .v{color:var(--tx)}
#md .ln .v.ps{color:var(--good)} #md .ln .v.ng{color:var(--bad)}
#md .ln.tot{border-bottom:none;border-top:1px solid var(--line2);margin-top:4px;padding-top:8px}
#md .ln.tot .v{color:var(--gold-hi);font-size:15px}
#md .ds{font-size:12.5px;line-height:1.8;color:var(--tx);margin:9px 0;opacity:.92}
#md .ac{text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 拍卖会 */
#md .auc-cust{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line);margin-top:6px;background:rgba(0,0,0,.3)}
#md .auc-cust .face{
  width:34px;height:34px;flex:none;border:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold);
  background:radial-gradient(circle at 35% 30%,#241d12,#0a0806);
}
#md .auc-cust.out{opacity:.35}
#md .auc-log{margin:8px 0;border:1px solid var(--line);background:rgba(0,0,0,.28)}
#md .auc-log .rw{display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;border-bottom:1px solid rgba(58,49,32,.4)}
#md .auc-log .rw:last-child{border-bottom:none}
#md .auc-log .rw .v{color:var(--gold-hi)}
#md .auc-log .rw:first-child .v{color:var(--good);font-weight:bold}
#md button.pri[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
#md button.pri[disabled]:hover{box-shadow:none;border-color:var(--line2)}
#md .auc-cust .nm{flex:1;font-size:13px}
#md .auc-cust .st{font-size:11px;color:var(--tx-dim)}
#md .auc-cust .st.in{color:var(--good)}
#md .auc-cust .st.top{color:var(--gold-hi)}
#md .auc-price{text-align:center;margin:12px 0 4px}
#md .auc-price .p{font-size:30px;color:var(--gold-hi);letter-spacing:2px}
#md .auc-price .p::before{content:"◉ ";font-size:18px;color:var(--gold)}
#md .auc-price .l{font-size:11px;color:var(--tx-dim);letter-spacing:2px}

/* 工坊 */
#md .opt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#md .opt button{
  flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);
  color:var(--tx);padding:9px 8px;font-size:13px;
}
#md .opt button.on{border-color:var(--gold);color:var(--gold-hi);box-shadow:inset 0 0 12px rgba(201,174,110,.12)}
#md .opt button small{display:block;font-size:10px;color:var(--tx-dim);margin-top:2px}

/* 执照（技能树） */
#md .sk{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);margin-top:6px;background:rgba(0,0,0,.3)}
#md .sk.done{border-color:var(--gold-dim)}
#md .sk .nm{flex:1;font-size:13px;color:var(--tx)}
#md .sk .nm small{display:block;font-size:10.5px;color:var(--tx-dim);margin-top:1px}
#md .sk .cost{font-size:12px;color:var(--gold);white-space:nowrap}
#md .sk button{padding:5px 12px;font-size:12px}
#md .sk .ok{color:var(--good);font-size:12px;letter-spacing:2px}

/* 陈列柜 */
/* 天赐：入手弹窗（立绘 + 名称 + 加成） */
#md .gf-pop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1px solid var(--line);margin-top:6px;background:rgba(0,0,0,.3)}
#md .gf-pop canvas{display:block;width:200px;height:200px;border:1px solid var(--line);background:#000}
#md .gf-pop .nm{font-size:15px;color:var(--gold-hi);letter-spacing:2px;margin-top:4px}
#md .gf-pop small{display:block;font-size:11px;color:var(--tx-dim);line-height:1.7;text-align:center;padding:0 6px}
#md .gf-pop .bn{color:var(--good);font-size:13px;letter-spacing:1px}

/* 天赐：藏珍面板内的陈列网格 */
.gf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.gf-cell{
  padding:6px;border:1px solid var(--line);background:rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.gf-cell canvas{display:block;width:100%;height:auto;border:1px solid #2a2018;background:#000;margin-bottom:4px}
.gf-cell .gf-n{font-size:12px;color:var(--tx-dim);letter-spacing:1px}
.gf-cell .gf-m{font-size:10px;color:var(--tx-dim);line-height:1.4}
.gf-cell .gf-ds{font-size:10px;color:#6b6152;line-height:1.6;margin-top:4px;text-align:left}
.gf-cell.got{border-color:#6b5528;background:rgba(40,30,12,.35)}
.gf-cell.got .gf-n{color:var(--gold-hi)}
.gf-cell.got .gf-m{color:var(--good)}

/* 赌坊入场确认 */
.gm-ask{padding:14px 10px;border:1px solid var(--line);margin-top:8px;background:rgba(0,0,0,.3);text-align:center}
.gm-ask-p{font-size:14px;letter-spacing:1px;color:var(--tx)}
.gm-ask-p b{color:var(--gold-hi);font-size:20px;margin:0 3px}
.gm-ask-s{font-size:10.5px;color:var(--tx-dim);margin-top:6px;letter-spacing:.5px}

/* ══════════ toast ══════════ */
#ts{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);
  background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
  font-size:13px;letter-spacing:1px;padding:8px 20px;opacity:0;transition:.25s;
  pointer-events:none;z-index:60;max-width:86vw;text-align:center;
}
#ts.on{opacity:1;transform:translateX(-50%) translateY(0)}
#ts.good{border-color:var(--gold);color:var(--gold-hi)}
#ts.bad{border-color:var(--bad);color:var(--bad)}

/* ══════════ 窄屏 ══════════ */
@media (max-width:760px){
  /* 侧栏改为浮层，默认收起（body.noside），画布拿满宽度 */
  #mn{position:relative}   /* 浮层定位上下文：否则 #sd 会锚到页面顶部、被顶栏盖住 */
  #sd{position:absolute;right:0;top:0;bottom:0;z-index:4;width:min(78vw,264px);box-shadow:-8px 0 24px rgba(0,0,0,.7)}
  #brand s{display:none}
  #brand b{font-size:17px;letter-spacing:2px}
  #top{gap:8px 12px;padding:5px 10px}
  .gv>span{letter-spacing:0;font-size:10px}
  .gv>span .lg{display:none}          /* 标签缩成单字：时/金/誉/知 */
  .bar{width:40px}
  .nv{font-size:14px;min-width:24px}
  #tl{gap:5px;padding:7px 6px 9px}
  #tl button{font-size:11px;padding:6px 9px}
  .tool{min-width:46px;padding:5px 7px}
  .tool .k{font-size:11px}
  #topbtns{gap:5px;justify-content:center}
  .topbtn{padding:5px 7px;letter-spacing:0;font-size:11px}
}
@media (max-width:430px){
  #brand::after{display:none}
  #top{gap:6px 10px}
  .gv{gap:4px}
}

/* ══════════ 成品立绘 / 平台加成 / 排行榜 ══════════ */
.finale{text-align:center}
.finale h2{margin-bottom:6px}
.fin-frame{
  position:relative;display:inline-block;margin:6px auto 10px;padding:6px;
  border:1px solid var(--gold-dim);
  background:radial-gradient(circle at 50% 42%,rgba(40,30,16,.55),#070605);
  box-shadow:0 0 22px rgba(0,0,0,.7) inset;
  isolation:isolate;
}
.fin-frame #finCanvas{position:relative;z-index:1;display:block;border:1px solid var(--line);background:#000}
.fin-info{margin:4px 0 6px;text-align:left}
.fin-info .ln{font-size:13px;padding:4px 2px}

/* 平台加成提示 */
#socialHint{padding-top:4px;font-size:11px;color:var(--tx-dim);line-height:1.5}
#socialHint b{color:var(--gold-hi)}

/* 排行榜：单弹窗 + 两个 tab 小按钮切换 */
.lb-tabs{display:flex;gap:6px;margin:8px 0 6px}
.lb-tab{
  flex:1;padding:7px 0;font-size:13px;cursor:pointer;
  border:1px solid rgba(58,49,32,.6);border-radius:4px;
  background:rgba(0,0,0,.25);color:var(--tx-dim);
  transition:.15s;
}
.lb-tab:hover{color:var(--tx)}
.lb-tab.active{
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  color:#1a140c;font-weight:700;border-color:var(--gold);
}
.lb-pane{margin-top:4px}
.lb-pane .lb-list{margin-top:4px;border-top:1px solid rgba(58,49,32,.5);padding-top:4px}
.lb-row{
  display:flex;align-items:center;gap:8px;font-size:12px;
  padding:3px 4px;border-bottom:1px solid rgba(58,49,32,.35);
}
.lb-row .lb-r{width:20px;flex:none;text-align:center;color:var(--gold);font-weight:700}
.lb-row .lb-n{flex:1;color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .lb-s{color:var(--gold-hi);flex:none}
.lb-row.me{background:rgba(201,174,110,.10);border-radius:2px}
.lb-row.me .lb-n{color:var(--gold-hi)}
/* 前三名专属称号 */
.lb-title{
  display:inline-block;margin-left:5px;padding:0 5px;
  font-size:10px;letter-spacing:1px;
  border:1px solid var(--gold-dim);border-radius:2px;
  background:rgba(201,174,110,.12);color:var(--gold-hi);
}
.lb-row.top1 .lb-r{color:#f0d68a;text-shadow:0 0 8px rgba(232,213,163,.8)}
.lb-row.top2 .lb-r{color:#dcdcdc}
.lb-row.top3 .lb-r{color:#d8a878}

/* ══════════ 三选项加工条（继续／卖掉／下一道工序）══════════ */
#tl .tri{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px}
.tri .opt3{

.tc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}

.tc-empty{padding:22px 8px;text-align:center;color:var(--tx-dim);font-size:12px;letter-spacing:1px}

.tc-cell.gm{border-color:#4a3f2a}
.tc-cell.gm .tc-img{display:block;width:100%;height:78px;overflow:hidden;margin-bottom:4px}

}

  border:1px solid var(--line2);background:#0d0b08;font-size:12px;color:var(--tx-dim);
}
.rite-row.on .ri{border-color:var(--gold);color:var(--gold-hi);box-shadow:0 0 10px rgba(232,213,163,.35)}

.rite-row.on .rs{color:var(--gold-hi)}
.rite-bonus{
  margin-top:8px;padding:7px 8px;text-align:center;font-size:12px;
  border:1px dashed var(--line2);color:var(--gold);letter-spacing:1px;
}
.rite-bonus b{color:var(--gold-hi)}
/* 成色鉴定结果条 */
.gaze-bar{
  margin-top:8px;padding:9px 10px;border:1px solid var(--gold-dim);
  background:rgba(30,24,12,.55);text-align:center;
}
.gaze-bar .gz-n{font-size:14px;color:var(--gold-hi);letter-spacing:2px}
.gaze-bar .gz-d{font-size:11px;color:var(--tx-dim);margin-top:4px;line-height:1.5}

}

.box .bo-ds{font-size:11px;color:var(--tx-dim);line-height:1.5}

/* 侧栏的盲盒档位按钮 */
.bx{

}
.bx .bx-d{font-size:10px;color:var(--tx-dim);line-height:1.45}
.bx .bx-p{font-size:11px;color:var(--gold-hi)}

/* 顶栏石筹 */

#ld{position:fixed;inset:0;background:#0b0805;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .45s}

#stt .ev{color:#b87a6e}

const TAU = Math.PI * 2;
const cl = (v,a,b) => v<a?a:v>b?b:v;

function m32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RND = m32(20261011);
const rr=(a,b)=>a+RND()*(b-a);
const ri=(a,b)=>Math.floor(rr(a,b+1));
const pk=a=>a[Math.floor(RND()*a.length)];
function angD(a,b){let d=Math.abs(a-b)%TAU;return d>Math.PI?TAU-d:d}
function resetRnd(seed){RND=m32(seed)}

/* ── 鉴定体系（四类）：天品 / 上等 / 中等 / 下等 ──
   每块原石在完成全部工序后按此概率判为某一档：
   天品 = 龙石（绝料现形，仅此一途）；上等 = 红宝石/蓝宝石等高档宝石；
   中等 = 糯冰/糯种/紫罗兰/飘花冰种/芙蓉种等翡翠系；下等 = 豆种/干青等杂石（砖头料直接认定失败）。
   概率：天品 0.5% / 上等 4% / 中等 25% / 下等 70.5% */
const GRADE_RARE="rare";         // 天品：龙石
const GRADE_WASTE="waste";       // 下等：豆种/干青/砖头料（砖头料失败）
const GRADE_FLOWER="flower";     // 中等：糯冰/糯种/紫罗兰/飘花冰种/芙蓉种
const GRADE_HIGH="high";         // 上等：红宝石/蓝宝石等
/* 概率权重：天0.5 : 下70.5 : 中25 : 上4 = 总100 */
const GRADE_WEIGHT={ rare:0.5, waste:70.5, flower:25, high:4 };
/* 普通箱：不出天品（天品只由异石现形），权重沿用下70.5/中25/上1 */
const GRADE_WEIGHT_NORMAL={ rare:0, waste:74, flower:25, high:1 };
/* 异石箱：产出石种与普箱同一套池，但概率不同 —— 上等概率精确 10%
   天4 : 下26 : 中60 : 上10 = 总100 */
const GRADE_WEIGHT_EX={ rare:4, waste:26, flower:60, high:10 };
const GRADE_DESC={
  rare  :{n:"天品", ds:"青苔裹缝、霜纹透光 —— 传说级龙石现形，百年不遇。"},
  waste :{n:"下等", ds:"豆种干青，颗粒粗，水头不足，卖不上价。"},
  flower:{n:"中等", ds:"糯冰糯种、飘花芙蓉，底子润，能出件过得去的货。"},
  high  :{n:"上等", ds:"种老肉细或通透起胶，红蓝宝级色料，可做收藏级首饰。"}
};
/* 材质对售价的影响系数 */
/* 档位定价系数。天品(rare) 与上等(high) 提升到原值的 5 倍：
   rare 3.20 → 16.00，high 1.80 → 9.00。中等(flower) 提升到原值的 3 倍：
   flower 1.00 → 3.00。下等(waste) 不变。
   裸石与首饰共用 itemBase，故两者同时生效。 */
const GRADE_PRICE_K={ rare:16.00, waste:0.30, flower:3.00, high:9.00 };
/* ── 档位判定：rand 在 [0,1) 均匀分布，按权重切分（天品最低，次到下等→中等→上等） ── */
function pickGrade(w){
  w = w || GRADE_WEIGHT;
  const r=RND();
  const total=(w.rare||0)+w.waste+w.flower+w.high;
  if(r<(w.rare||0)/total) return GRADE_RARE;
  if(r<((w.rare||0)+w.waste)/total) return GRADE_WASTE;
  if(r<((w.rare||0)+w.waste+w.flower)/total) return GRADE_FLOWER;
  return GRADE_HIGH;
}

   （cluster_/cut_ 的 _high/_flower/_waste）本是白底产品图，与 lighter
   加法混合不兼容，叠上台面就是一团白光/大白方块。现已全部用 agent
   生图模型重生为纯黑底（key 走 Agnes，未消耗内置积分），EXPOSURE_FIX
   乘法压光会把这些黑底图压得过暗，故整体移除；载入时不再做任何压光。 */
function _ldTick(){
  IMG.loaded++;
  const pct=IMG.total?Math.min(100,Math.round(IMG.loaded/IMG.total*100)):100;
  const f=document.getElementById("ldF"), p=document.getElementById("ldP");
  if(f) f.style.width=pct+"%";
  if(p) p.textContent=pct+"%";
  if(IMG.loaded>=IMG.total){
    IMG.ready=true;
    const ld=document.getElementById("ld");
    if(ld){ ld.classList.add("off"); setTimeout(()=>{ if(ld.parentNode) ld.parentNode.removeChild(ld); },600); }
  }
}
function loadAssets(done){
  const list=[IMG_TABLE, IMG_TABLE_WORK, IMG_ANOMALY, IMG_WASTE];
  for(const sh of SHELLS) list.push(sh.img);
  for(const k of GK){
    list.push(GEMS[k].img); list.push(GEMS[k].cutimg);
    if(WINDOWS[k]) list.push(WINDOWS[k]);
  }
  for(const k of GK) if(ROUGH[k]) list.push(ROUGH[k]);   // 粗坯立绘（开箱弹窗用）
  for(const k in DMGIMG) for(const d in DMGIMG[k]) list.push(DMGIMG[k][d]);
  for(const k in CUTDMG) for(const d in CUTDMG[k]) list.push(CUTDMG[k][d]);
  // 工序状态立绘（剥落/切割/打磨 × 全石种）
  for(const k in WORK_ASSETS) for(const ph in WORK_ASSETS[k]) list.push(WORK_ASSETS[k][ph]);
  // 材质分级立绘（按石种×等级）
  for(const gk of GK){
    if(gk==="obsidian") continue;
    const ga=GRADE_ASSETS[gk];
    if(!ga) continue;
    for(const gk2 of [GRADE_WASTE, GRADE_FLOWER, GRADE_HIGH]){
      const a=ga[gk2];
      if(a.img) list.push(a.img);
      if(a.cutimg) list.push(a.cutimg);
      if(a.ring) list.push(a.ring);
      if(a.pendant) list.push(a.pendant);
      if(a.earring) list.push(a.earring);
    }
  }
  /* 天赐立绘：4 张。原先漏加载，导致 showGift / 藏珍面板只画出纯黑方块 */
  for(const g of GIFTS) list.push(g.img);
  /* 赌坊立绘：4 张石璞 + 10 档产物（砖头料已在 IMG_WASTE 里）*/
  for(const p of PU) list.push(p.img);
  for(const x of PU_PROD) if(x.k!=="wuzhan") list.push(x.img);
  IMG.total=list.length; IMG.loaded=0; IMG.left=list.length;
  if(!IMG.total){ _ldTick(); done(); return; }
  for(const src of list){
    const im=new Image();
    im.onload=()=>{ IMG.map[src]=im; if(--IMG.left>=0) _ldTick(); if(IMG.loaded>=IMG.total) done(); };
    im.onerror=()=>{ console.warn("asset fail",src); if(--IMG.left>=0) _ldTick(); if(IMG.loaded>=IMG.total) done(); };
    im.src=src;
  }
}
function imgOf(src){ return IMG.map[src]; }

/* ══════════ 程序化首饰立绘：金属戒托/吊链/耳钩 + 中央宝石 ══════════
   资料库72张首饰图均为裸石无金属托，需在此处程序化合成 */
const JEWEL_CACHE={};
function genJewelImg(gk,jk,grade,seed){
  const key=gk+"_"+jk+"_"+grade+"_"+seed;
  if(JEWEL_CACHE[key]) return JEWEL_CACHE[key];
  const S=260;
  const oc=document.createElement("canvas"); oc.width=S; oc.height=S;
  const x=oc.getContext("2d");
  const gem=GEMS[gk];
  const gc=gem.c, gc2=gem.c2, ch=gem.ch;   // ch 漏定义过：宝石高光色，缺了会在素材未加载时抛 ReferenceError
  // 金属色调按首饰类型区分：银托偏冷白，金托偏暖黄
  const isGold=(jk==="earring"); // earring=鎏金，其余银
  const mg=isGold?"#d4a84b":"#c0c4ca";
  const md=isGold?"#8a6920":"#7a7e84";
  const mh=isGold?"#f5e6b8":"#e8ecf0";
  // 背景：纯黑
  x.fillStyle="#000"; x.fillRect(0,0,S,S);
  const cx=S/2, cy=jk==="pendant"?S*0.48:S*0.58;
  const bw=S*0.38; // 宝石宽度
  // ── 绘制金属托 ──
  x.save();
  if(jk==="ring"){
    // 戒指：C形戒圈 + 顶部镶口
    const ringY=cy+bw*0.35;
    x.strokeStyle=md; x.lineWidth=bw*0.18; x.lineCap="round";
    x.beginPath(); x.arc(cx,ringY,bw*0.48,Math.PI*1.15,Math.PI*1.85); x.stroke();
    x.strokeStyle=mg; x.lineWidth=bw*0.16;
    x.beginPath(); x.arc(cx,ringY,bw*0.48,Math.PI*1.15,Math.PI*1.85); x.stroke();
    // 镶口底座
    x.fillStyle=mg;
    x.beginPath(); x.ellipse(cx,cy+bw*0.12,bw*0.22,bw*0.08,0,0,TAU); x.fill();
    x.strokeStyle=md; x.lineWidth=1.2; x.stroke();
    // 镶口四爪
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+0.2;
      x.fillStyle=mg;
      x.beginPath();
      x.ellipse(cx+Math.cos(a)*bw*0.12,cy-bw*0.05+Math.sin(a)*bw*0.06,3,5,a,0,TAU);
      x.fill();
    }
  }else if(jk==="pendant"){
    // 吊坠：细链 + 圆形挂环 + 吊坠托
    x.strokeStyle=mg; x.lineWidth=2.5;
    x.beginPath(); x.arc(cx,S*0.08,12,0,Math.PI); x.stroke();
    x.strokeStyle=md; x.lineWidth=1.5;
    x.beginPath(); x.arc(cx,S*0.08,12,0,Math.PI); x.stroke();
    // 挂环
    x.fillStyle=mg;
    x.beginPath(); x.arc(cx,cy-bw*0.38,6,0,TAU); x.fill();
    x.strokeStyle=md; x.lineWidth=1; x.stroke();
    // 吊坠托（椭圆形包边）
    x.fillStyle=mg;
    x.beginPath(); x.ellipse(cx,cy+bw*0.15,bw*0.24,bw*0.10,0,0,TAU); x.fill();
    x.strokeStyle=md; x.lineWidth=1.5; x.stroke();
  }else if(jk==="earring"){
    // 耳环：耳针 + 下垂链 + 双宝石（左右各一，这里画一个主图）
    x.strokeStyle=mg; x.lineWidth=2;
    x.beginPath(); x.moveTo(cx-S*0.15,S*0.06); x.lineTo(cx+S*0.15,S*0.06); x.stroke();
    x.strokeStyle=md; x.lineWidth=1;
    x.beginPath(); x.moveTo(cx-S*0.15,S*0.06); x.lineTo(cx+S*0.15,S*0.06); x.stroke();
    // 左链
    x.strokeStyle=mg; x.lineWidth=2;
    x.beginPath(); x.moveTo(cx-bw*0.25,cy-bw*0.35); x.quadraticCurveTo(cx-bw*0.35,cy-bw*0.1,cx-bw*0.2,cy); x.stroke();
    // 右链
    x.beginPath(); x.moveTo(cx+bw*0.25,cy-bw*0.35); x.quadraticCurveTo(cx+bw*0.35,cy-bw*0.1,cx+bw*0.2,cy); x.stroke();
    // 主宝石托
    x.fillStyle=mg;
    x.beginPath(); x.ellipse(cx,cy+bw*0.12,bw*0.22,bw*0.08,0,0,TAU); x.fill();
    x.strokeStyle=md; x.lineWidth=1.2; x.stroke();
  }
  x.restore();
  // ── 绘制宝石（渐变填充 + 高光）──
  x.save();
  if(jk==="ring"){
    // 蛋面/枕形宝石
    const gy=cy-bw*0.02;
    const grad=x.createRadialGradient(cx-bw*0.15,gy-bw*0.15,bw*0.02,cx,gy,bw*0.42);
    grad.addColorStop(0,gc2); grad.addColorStop(0.5,gc); grad.addColorStop(1,md);
    x.fillStyle=grad;
    x.beginPath();
    x.ellipse(cx,gy,bw*0.38,bw*0.28,0,0,TAU);
    x.fill();
    // 高光
    x.globalAlpha=0.45;
    x.fillStyle=ch;
    x.beginPath(); x.ellipse(cx-bw*0.12,gy-bw*0.1,bw*0.08,bw*0.05,-0.3,0,TAU); x.fill();
  }else if(jk==="pendant"){
    // 圆形蛋面
    const gy=cy+bw*0.05;
    const grad=x.createRadialGradient(cx-bw*0.12,gy-bw*0.12,bw*0.02,cx,gy,bw*0.32);
    grad.addColorStop(0,gc2); grad.addColorStop(0.5,gc); grad.addColorStop(1,md);
    x.fillStyle=grad;
    x.beginPath(); x.arc(cx,gy,bw*0.30,0,TAU); x.fill();
    x.globalAlpha=0.45;
    x.fillStyle=ch;
    x.beginPath(); x.arc(cx-bw*0.09,gy-bw*0.09,bw*0.06,0,TAU); x.fill();
  }else if(jk==="earring"){
    // 蛋面（对称双宝石中的一颗作为代表）
    const gy=cy+bw*0.05;
    const grad=x.createRadialGradient(cx-bw*0.12,gy-bw*0.12,bw*0.02,cx,gy,bw*0.32);
    grad.addColorStop(0,gc2); grad.addColorStop(0.5,gc); grad.addColorStop(1,md);
    x.fillStyle=grad;
    x.beginPath(); x.ellipse(cx,gy,bw*0.28,bw*0.34,0,0,TAU); x.fill();
    x.globalAlpha=0.45;
    x.fillStyle=ch;
    x.beginPath(); x.ellipse(cx-bw*0.08,gy-bw*0.1,bw*0.06,bw*0.04,-0.3,0,TAU); x.fill();
  }
  x.restore();
  JEWEL_CACHE[key]=oc;
  return oc;
}

function fit(){
  const r=cv.parentElement.getBoundingClientRect();
  DPR=Math.min(2, window.devicePixelRatio||1);
  CW=Math.max(220,r.width); CH=Math.max(200,r.height);
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  cv.style.width=CW+"px"; cv.style.height=CH+"px";
  cx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
/* 尺寸变化：跨过窄屏阈值时自动收起侧栏（防止浮层重新盖住台面） */
let _wasNarrow=false;
window.addEventListener("resize",()=>{
  const narrow=!!(window.matchMedia && window.matchMedia("(max-width:760px)").matches);
  if(narrow && !_wasNarrow) document.body.classList.add("noside");
  _wasNarrow=narrow;
  if(typeof syncSideBtn==="function") syncSideBtn();
  fit();
});

function render(){
  /* ── 打烊卡死安全网（2026-10-16 修） ──
     症状：玩家按石市，得到一句「今日已收工，明天再来」，但收摊按钮只关窗、
     进第二天的入口已经不在，于是彻底卡死。
     成因：G.dayOver 只在 closeDay() 里置位，而打烊面板可能被后续弹窗顶掉、
     或 showDayEnd 抛异常、或玩家在打烊后点开别的面板再关掉 —— 每一种都会
     留下「已打烊 + 遮罩不在 + 没有进入次日的按钮」这个死角。
     这里做无条件兜底：只要处于「已打烊、没破产、没有待结算弹窗」而遮罩又不在，
     就把打烊面板还给你。render() 到处都会被调用，所以这条网能盖住所有路径。 */
  if(typeof G!=="undefined" && G.dayOver && !G.dead && !G.settling && !G.finaleSt){
    const vl=document.getElementById("vl");
    if(vl && vl.className!=="on" && typeof resumeDayEnd==="function") resumeDayEnd();
  }
  // 先更新 DOM（侧栏/工具栏），再量 #tl 实际高度画画布 —— 保证让位准确
  if(typeof drawSide==="function") drawSide();
  if(typeof drawTools==="function") drawTools();
  draw();
  if(typeof syncTop==="function") syncTop();
}

/* ══════════ 场景：作坊实拍背景 + 聚光 + 暗角 ══════════
   闲置态用带油灯景（bg_idle），工序态换无灯暗景（bg_work）——
   工序时切台面，暖光会与石料立绘叠在一处显得脏，故换冷暗无灯背景。
   两图生成时已强制「画面正中央留空」，此处再叠一层中心暗角，
   把中央区域压暗兜底，保证任何情况下立绘都不会被背景干扰。 */
function drawStage(work){
  const t=imgOf(work?IMG_TABLE_WORK:IMG_TABLE);
  if(t){
    const sc=Math.max(CW/t.width, CH/t.height);
    const w=t.width*sc, h=t.height*sc;
    cx.drawImage(t,(CW-w)/2,(CH-h)/2,w,h);
  }else{
    cx.fillStyle="#171008"; cx.fillRect(0,0,CW,CH);
  }
  const c=center();
  /* 暖色聚光灯只在闲置（鉴石）态画；工序时立绘在 workCenter，聚光灯会偏到
     立绘左下角出一团可疑的亮斑，工序中不画 */
  if(!work){
    const sp=cx.createRadialGradient(c.x,c.y,10,c.x,c.y,Math.max(CW,CH)*0.5);
    sp.addColorStop(0,"rgba(255,214,150,.10)");
    sp.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=sp; cx.fillRect(0,0,CW,CH);
  }
  /* 中心留影：横向带状压暗（椭圆/径向渐变会在立绘外圈留下一道明显的
     圆形暗边，看起来像「黑饼」）。改用横向线性渐变 + 纵向遮罩，
     中央形成一条柔和的横向暗带，边界不可见，自然让出立绘区域。 */
  const bw=Math.min(CW,CH)*0.62;
  const lg=cx.createLinearGradient(c.x-bw,0,c.x+bw,0);
  lg.addColorStop(0,"rgba(6,4,3,0)");
  lg.addColorStop(.5,"rgba(6,4,3,.34)");
  lg.addColorStop(1,"rgba(6,4,3,0)");
  cx.fillStyle=lg; cx.fillRect(0,0,CW,CH);
  /* 纵向只压画面中段（台面以上），台面与顶部墙面保持原亮度 */
  const th=CH*0.30;
  const vg2=cx.createLinearGradient(0,c.y-th,0,c.y+th);
  vg2.addColorStop(0,"rgba(0,0,0,0)");
  vg2.addColorStop(.5,"rgba(0,0,0,1)");
  vg2.addColorStop(1,"rgba(0,0,0,0)");
  cx.save();
  cx.globalCompositeOperation="destination-out";
  cx.fillStyle=vg2; cx.fillRect(0,0,CW,CH);
  cx.restore();
  const vg=cx.createRadialGradient(c.x,c.y,Math.min(CW,CH)*0.28,c.x,c.y,Math.max(CW,CH)*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.66)");
  cx.fillStyle=vg; cx.fillRect(0,0,CW,CH);
}

function center(){ return {x:CW/2, y:CH*0.47}; }
/* DOM 工具栏(#tl)实际占高：画布底部面板锚点必须动态让位，
   否则窄屏下工具条换行变高，画布文字/进度条会叠压到按钮上 */
function tlPad(){
  const tl=document.getElementById("tl");
  const h=(tl&&tl.offsetHeight)||0;
  return h+12;
}
function R(){ return Math.min(CW,CH)*0.30; }
function lampXY(c){
  const a=(Number.isFinite(G.lamp)?G.lamp:Math.PI/2)-Math.PI/2;
  const d=Math.min(CW,CH)*0.40;
  return {x:c.x+Math.sin(a)*d, y:c.y-Math.cos(a)*d};
}
/* 台面投影：径向渐变的软影 —— 旧版是实心矢量椭圆，边缘一圈硬边
   （黑底素材上尤其明显，像压了一块黑饼），改成中心浓、边缘散开的椭圆软影 */
function drawShadow(c,rx,ry){
  const y=c.y+ry*1.15;
  cx.save();
  const g=cx.createRadialGradient(0,0,0,0,0,rx);
  g.addColorStop(0,"rgba(0,0,0,.20)");  // 降低阴影强度
  g.addColorStop(.55,"rgba(0,0,0,.08)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  cx.translate(c.x,y); cx.scale(1, Math.max(0.05, ry/rx));
  cx.fillStyle=g;
  cx.beginPath(); cx.arc(0,0,rx,0,TAU); cx.fill();
  cx.restore();
}

/* ══════════ 原石外壳：离屏合成（剥离挖洞） ══════════ */
const shellCache={};
function shellCanvas(s,prog){
  const key=s.id+"_"+Math.round(prog*20);
  if(shellCache[key]) return shellCache[key];
  const S=512;
  const oc=document.createElement("canvas"); oc.width=S; oc.height=S;
  const o=oc.getContext("2d");
  // 未剥离的开窗明料：直接展示磨开的窗口与内部宝石
  const useWin = (prog<0.01 && s.win && WINDOWS[s.gtype]);
  const img=imgOf(useWin ? WINDOWS[s.gtype] : SHELLS[s.shell].img);
  if(img){
    const sc=Math.max(S/img.width,S/img.height);
    o.drawImage(img,(S-img.width*sc)/2,(S-img.height*sc)/2,img.width*sc,img.height*sc);
  }
  if(prog>0.01){
    o.globalCompositeOperation="destination-out";
    const holeR=S*(0.16+prog*0.34);
    const g=o.createRadialGradient(S/2,S/2,holeR*0.5,S/2,S/2,holeR);
    g.addColorStop(0,"rgba(0,0,0,1)");
    g.addColorStop(.72,"rgba(0,0,0,.92)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    o.fillStyle=g;
    o.beginPath(); o.arc(S/2,S/2,holeR,0,TAU); o.fill();
    // 楔形碎裂：边缘不规则的崩落
    const seed=m32(Math.floor(s.seed*50)+9);
    const nW=2+Math.floor(prog*9);
    for(let i=0;i<nW;i++){
      const a=seed()*TAU, len=holeR*(0.85+seed()*0.75), wA=0.10+seed()*0.24;
      o.fillStyle="rgba(0,0,0,"+(0.55+seed()*0.4).toFixed(2)+")";
      o.beginPath(); o.moveTo(S/2,S/2);
      o.arc(S/2,S/2,len,a-wA/2,a+wA/2);
      o.closePath(); o.fill();
    }
    o.globalCompositeOperation="source-over";
  }
  // 边缘径向渐隐：消除方形贴图边界
  o.globalCompositeOperation="destination-in";
  const fade=o.createRadialGradient(S/2,S/2,S*0.30,S/2,S/2,S*0.50);
  fade.addColorStop(0,"rgba(0,0,0,1)");
  fade.addColorStop(.82,"rgba(0,0,0,1)");
  fade.addColorStop(1,"rgba(0,0,0,0)");
  o.fillStyle=fade;
  o.fillRect(0,0,S,S);
  o.globalCompositeOperation="source-over";
  if(Object.keys(shellCache).length>90) for(const k in shellCache) delete shellCache[k];
  shellCache[key]=oc;
  return oc;
}

function drawShell(s,prog,c,rad,rot){
  const oc=shellCanvas(s,prog);
  const sz=rad*2.55;
  cx.save();
  cx.translate(c.x,c.y);
  cx.rotate(rot||0);
  cx.globalCompositeOperation="lighter";
  cx.drawImage(oc,-sz/2,-sz/2,sz,sz);
  cx.globalCompositeOperation="source-over";
  cx.restore();
}

/* ══════════ 晶体簇（内核） ══════════ */
/* 受损时优先换用真实裂痕贴图，没有贴图的宝石才退回程序绘制 */
function clusterImgOf(s,stage){
  // 损伤贴图优先（破碎/崩边先于异象光效，否则破碎龙石永远显示异象原图）
  const st=stage||{};
  const gk=s.gtype;
  const d=DMGIMG[gk];
  if(stage && d){
    if(stage.dg.includes("crack") && d.crack) return d.crack;
    if(stage.dg.includes("chip")  && d.chip)  return d.chip;
  }
  if(s.anom) return IMG_ANOMALY;
  // 按石种+材质等级选择素材
  const grade=st.grade||null;
  if(grade && GRADE_ASSETS[gk] && GRADE_ASSETS[gk][grade] && GRADE_ASSETS[gk][grade].img){
    return GRADE_ASSETS[gk][grade].img;
  }
  // 降级：使用通用素材
  return GEMS[gk].img;
}
function drawCluster(s,stage,c,rad,rot){
  const g=GEMS[s.gtype];
  const anom=s.anom;
  const img=imgOf(clusterImgOf(s,stage));
  const pulse = anom ? 0.82+0.18*Math.sin(performance.now()/620) : 1;
  const shrink = (stage&&stage.dg&&stage.dg.includes("lost")) ? 0.82 : 1;   // 失重：料被磨薄
  const sz=rad*2.35*(0.8+0.4*cl(s.size,0,1))*shrink;
  cx.save();
  if(anom){
    cx.globalAlpha=.14*pulse;
    cx.fillStyle="#7a2a26";
    cx.beginPath(); cx.arc(c.x,c.y,sz*0.62,0,TAU); cx.fill();
    cx.globalAlpha=1;
  }
  cx.translate(c.x,c.y);
  cx.rotate(rot||0);
  cx.globalAlpha=pulse;
  /* 同样按亮度抠掉素材黑底：cluster 系列也是方图，
     直接 lighter 会把近黑底加到背景上，亮出矩形边界。 */
  if(img){
    const src=clusterImgOf(s,stage);
    cx.drawImage(img,-sz/2,-sz/2,sz,sz);
    cx.globalCompositeOperation="destination-in";
    cx.drawImage(alphaMaskOf(src,img),-sz/2,-sz/2,sz,sz);
  }
  cx.globalCompositeOperation="source-over";
  cx.globalAlpha=1;
  cx.restore();
  // 损伤纹：按类型分别呈现（裂纹分叉 / 崩边缺口 / 失重缩小 / 雾化蒙层）
  if(stage) drawDamage(cx,stage,s,c,rad,sz,"raw",clusterImgOf(s,stage));
}

/* ── 损伤可视化 ──
   旧实现的毛病（弹窗里那团「曝光」的白就是它）：
   把整幅受损刻面贴图用 lighter（加法）按 .95 / .9 叠在成品图上。底图与受损图
   是同一颗石头的两张实拍照，同一位置相加必然溢出 —— 实测糯冰底图均亮 117，
   叠上裂纹+崩边后升到 205，近白像素 52%，整颗炸成一团白。
   改法：受损贴图不再整幅加法叠加，而是裁剪进宝石所在的圆形区域做「替换」
   （等于给宝石换上受损版的样子）。金属托、戒圈在圆外不受影响，亮度也不再相加。
   雾化、缺料同理：不再糊实心的矢量白圆 / 黑圆，改为渐变柔化。
   mode: "raw" = 晶簇阶段（用 DMGIMG 原石裂痕），"cut" = 刻面/首饰（用 CUTDMG）
   baseSrc: 当前底图，若底图已经是这张受损图则不重复绘制 */
function drawDamage(g,st,s,c,rad,sz,mode,baseSrc){
  const dg=st.dg||[];
  if(!dg.length) return;
  const tbl = (mode==="raw") ? DMGIMG[s.gtype] : CUTDMG[s.gtype];
  /* 替换半径按主体形态给：
     晶簇/刻面裸石 —— 石头占满画面，半径给足；
     首饰 —— 只换戒面/坠面那一小块（约画面 15%），金属托、戒圈完整留在圈外，
             否则整枚戒指会被受损裸石照盖掉，看着就只剩一颗石头。 */
  let r, gy, clipFn;
  if(mode==="raw"){            r=sz*0.44; gy=c.y-sz*0.02; clipFn=()=>{ g.beginPath(); g.arc(c.x,gy,r,0,TAU); g.clip(); }; }
  else if(st.kind==="jewel"){
    r=sz*0.24; gy=c.y-sz*0.10;
    // 首饰用椭圆形裁切，避免圆形 clip 溢出盖住链条/戒圈
    clipFn=()=>{ g.beginPath(); g.ellipse(c.x,gy,r*1.15,r*r/sz*1.4,0,0,TAU); g.clip(); };
  }
  else {                       r=sz*0.42; gy=c.y-sz*0.02; clipFn=()=>{ g.beginPath(); g.arc(c.x,gy,r,0,TAU); g.clip(); }; }
  // ① 裂纹 / 破损 / 崩边：只呈现最重的一处，圆内替换，绝不叠两层
  let tex=null;
  if(tbl){
    if((dg.includes("crack")||dg.includes("broken")) && tbl.crack) tex=tbl.crack;
    else if(dg.includes("chip") && tbl.chip) tex=tbl.chip;
  }
  if(tex && tex!==baseSrc && imgOf(tex)){
    g.save(); clipFn();
    g.globalAlpha=.90;
    g.drawImage(imgOf(tex), c.x-sz/2, gy-sz/2, sz, sz);
    g.restore();
  }
  // ② 雾化：中心浓、向边缘散开的灰白蒙层（柔化，不再是实心矢量圆盘）
  if(dg.includes("haze")){
    g.save(); clipFn();
    const hg=g.createRadialGradient(c.x,gy,r*0.14,c.x,gy,r);
    hg.addColorStop(0,"rgba(206,211,216,.44)");
    hg.addColorStop(.60,"rgba(206,211,216,.24)");
    hg.addColorStop(1,"rgba(206,211,216,0)");
    g.fillStyle=hg; g.fillRect(c.x-r,gy-r,r*2,r*2);
    g.restore();
  }
  // ③ 缺料：只在边缘压暗成暗角，中心保持通透（不再糊一个黑圆）
  if(dg.includes("lost")){
    g.save(); clipFn();
    const lg=g.createRadialGradient(c.x,gy,r*0.55,c.x,gy,r);
    lg.addColorStop(0,"rgba(0,0,0,0)");
    lg.addColorStop(1,"rgba(0,0,0,.40)");
    g.fillStyle=lg; g.fillRect(c.x-r,gy-r,r*2,r*2);
    g.restore();
  }
}
/* 失重缩放系数：立绘绘制时按损伤缩一圈，表现料被磨薄 */
function lostScale(st){ return (st&&st.dg&&st.dg.includes("lost"))?0.86:1; }

/* 成品图：按石种+材质等级+首饰类型选择素材，有受损刻面贴图就用贴图，否则用完好刻面 */
/* 材质等级键白名单：GRADE_ASSETS 只认 waste/flower/high。
   历史上收刀路径漏赋 grade，工坊兜底又误填 gradeOf() 的「丙等」等切割成色，
   导致键不匹配后一路 fallthrough 到 GEMS[gk].cutimg（裸石）。此处统一归一化兜底。 */
const GRADE_KEYS=[GRADE_WASTE,GRADE_FLOWER,GRADE_HIGH];
function gradeKeyOf(g){ return GRADE_KEYS.indexOf(g)>=0 ? g : GRADE_FLOWER; }
function cutImgOf(st){
  const gk=st.s.gtype;
  const grade=gradeKeyOf(st.grade);
  // 已镶嵌成首饰：优先使用首饰贴图（裂纹/崩边由 drawDamage 叠加，不再整图替换）
  if(st.kind==="jewel" && st.jk && GRADE_ASSETS[gk] && GRADE_ASSETS[gk][grade] && GRADE_ASSETS[gk][grade][st.jk]){
    const src=GRADE_ASSETS[gk][grade][st.jk];
    if(imgOf(src)) return src;
    // 素材未加载，降级到程序化生成
    const oc=genJewelImg(gk,st.jk,grade,st.s.seed);
    return oc;
  }
  // 损伤优先：有裂纹/崩边就换受损刻面贴图（否则有 grade 的成品永远显示完好图，各状态复用同一张）
  const d=CUTDMG[gk];
  if(d && st.dg){
    if(st.dg.includes("crack") && d.crack) return d.crack;
    if(st.dg.includes("broken") && d.crack) return d.crack;
    if(st.dg.includes("chip")  && d.chip)  return d.chip;
  }
  if(grade && GRADE_ASSETS[gk] && GRADE_ASSETS[gk][grade] && GRADE_ASSETS[gk][grade].cutimg){
    return GRADE_ASSETS[gk][grade].cutimg;
  }
  // 降级：使用通用素材或DMG贴图
  if(d && st.dg){
    if(st.dg.includes("crack") && d.crack) return d.crack;
    if(st.dg.includes("chip")  && d.chip)  return d.chip;
  }
  return GEMS[gk].cutimg;
}
/* ══════════ 刻面成品 ══════════ */
function drawCut(st,c,rad){
  const src=cutImgOf(st);
  const img=imgOf(src);
  /* 接触影：贴宝石底部一圈软影。旧值 rx=rad*0.85 偏小，宝石像悬在台面上方；
     台面灯斑已由 draw() 的石料位暗底统一压暗，这里只补接触影。 */
  drawShadow(c,rad*1.02,rad*0.26);
  const shrink=(st.dg&&st.dg.includes("lost"))?0.85:1;
  const sz=rad*2.2*shrink;
  cx.save();
  cx.translate(c.x,c.y);
  cx.rotate(G.spin*0.5+st.s.offA);
  if(img){
    cx.drawImage(img,-sz/2,-sz/2,sz,sz);
    cx.globalCompositeOperation="destination-in";
    cx.drawImage(alphaMaskOf(src,img),-sz/2,-sz/2,sz,sz);
    cx.globalCompositeOperation="source-over";
  }
  cx.restore();
  // 成品上的损伤：裂纹 / 崩边 / 雾化 / 磨薄（全为贴图，无白线）
  drawDamage(cx,st,st.s,c,rad,sz,"cut",cutImgOf(st));
}


/* ══════════ 鉴定灯 ══════════ */
/* 鉴定灯：压一档亮度 —— 旧版中心 .85 的暖白斑叠在立绘上会压出一块死亮光 */
function drawLamp(c){
  const lp=lampXY(c);
  if(!Number.isFinite(lp.x)||!Number.isFinite(lp.y)) return;
  cx.save();
  const g=cx.createRadialGradient(lp.x,lp.y,0,lp.x,lp.y,52);
  g.addColorStop(0,"rgba(255,238,200,.52)");
  g.addColorStop(.28,"rgba(255,220,160,.16)");
  g.addColorStop(1,"rgba(255,210,140,0)");
  cx.fillStyle=g;
  cx.beginPath(); cx.arc(lp.x,lp.y,52,0,TAU); cx.fill();
  cx.restore();
}

/* ══════════ 加工操作面板：只留进度条，文字全部去除（不挡立绘）══════════ */
function opLabel(){ return G.phase==="peel"?"錾剥":G.phase==="cut"?"开料":"修磨"; }
function drawOpPanel(c){

/* ══════════ 提示条 ══════════ */
function arcGeo(c){
  const bottomPad=tlPad()+54;
  const y=CH-bottomPad-24;
  const room=y-(c.y+R()*0.55);
  const r=cl(Math.min(CW*0.34,room),70,200);
  return {x:c.x,y,r,a0:Math.PI*1.12,a1:Math.PI*1.88};
}
function drawGaugeBase(x,y,r,a0,a1){
  cx.strokeStyle="#3a3020"; cx.lineWidth=1.4;
  cx.beginPath(); cx.arc(x,y,r,a0,a1); cx.stroke();
  for(let i=0;i<=10;i++){
    const a=a0+(a1-a0)*(i/10);
    const r0=r-6, r1=r-(i%5===0?12:9);
    cx.strokeStyle=i%5===0?"#6b5a35":"#31291a"; cx.lineWidth=1;
    cx.beginPath();
    cx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);
    cx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);
    cx.stroke();
  }
}
function drawBar(c,pos,ideal,zone,label,tip,accent){
  /* 与加工进度条同一条底线：贴工具栏放，不压立绘 */
  const bw=Math.min(CW*0.52,320), bh=26;
  const BOT=tlPad();
  const bx=c.x-bw/2, by=CH-BOT-40;
  const z=cl(zone,0.05,0.4), id=cl(ideal,0.05,0.95);
  cx.save();
  // 底槽
  cx.fillStyle="rgba(8,6,4,.92)";
  cx.fillRect(bx,by,bw,bh);
  // 三段：致命(暗红) / 危险(橙) / 安全(绿)
  const seg=(a,b,col)=>{
    cx.fillStyle=col;
    cx.fillRect(bx+bw*cl(a,0,1), by+1, bw*cl(b-a,0,1), bh-2);
  };
  seg(0, id-z*1.6, "rgba(120,40,34,.55)");
  seg(id-z*1.6, id-z*0.5, "rgba(160,96,52,.55)");
  seg(id-z*0.5, id+z*0.5, "rgba(78,132,96,.75)");
  seg(id+z*0.5, id+z*1.6, "rgba(160,96,52,.55)");
  seg(id+z*1.6, 1, "rgba(120,40,34,.55)");
  // 正中完美线
  cx.fillStyle="rgba(232,213,163,.85)";
  cx.fillRect(bx+bw*id-1, by-3, 2, bh+6);
  // 边框
  cx.strokeStyle="rgba(107,90,53,.9)"; cx.lineWidth=1;
  cx.strokeRect(bx,by,bw,bh);
  // 游走指针（菱形錾头）
  const px=bx+bw*cl(pos,0,1);
  cx.fillStyle=accent;
  cx.beginPath();
  cx.moveTo(px, by-9); cx.lineTo(px+6, by+bh/2); cx.lineTo(px, by+bh+9); cx.lineTo(px-6, by+bh/2);
  cx.closePath(); cx.fill();
  cx.strokeStyle="rgba(255,240,200,.9)"; cx.lineWidth=1.2; cx.stroke();
  // 标签
  cx.font='12px "Songti SC","SimSun",serif'; cx.fillStyle=P.dim; cx.textAlign="center";
  cx.fillText(label, c.x, by-16);
  cx.restore();
}

/* ── 开料转盘：以解理面为中心左右自动摆动，摆到正中下刀 ── */
function drawCutDial(c){
  const {x,y,r,a0,a1}=arcGeo(c);
  const tgt=G.cutTarget, cur=G.cutAngle;
  const err=angD(cur,tgt);
  cx.save();
  drawGaugeBase(x,y,r,a0,a1);
  // 解理面目标区（随已刻面数变宽）
  let tol=0.16+G.cutDone*0.05+(G.gear.lab||1)*0.04;
  if(hasSkill("blade")) tol*=1.35;
  if(ev("night")) tol*=0.85;
  const span=a1-a0;
  cx.strokeStyle="rgba(143,191,159,.80)"; cx.lineWidth=9;
  cx.beginPath(); cx.arc(x,y,r-3, tgt-tol, tgt+tol); cx.stroke();
  cx.strokeStyle="rgba(184,122,110,.42)"; cx.lineWidth=3;
  cx.beginPath(); cx.arc(x,y,r-3, tgt-tol*2.2, tgt-tol); cx.stroke();
  cx.beginPath(); cx.arc(x,y,r-3, tgt+tol, tgt+tol*2.2); cx.stroke();
  // 当前刀口指针
  const a=cur;
  cx.strokeStyle=err>0.5?P.bad:P.gold; cx.lineWidth=2.6;
  cx.beginPath(); cx.arc(x,y,r-11,a-.035,a+.035); cx.stroke();
  cx.fillStyle=err>0.5?P.bad:P.gold;
  cx.beginPath(); cx.arc(x,y,3.4,0,TAU); cx.fill();
  // 解理面标记线
  cx.strokeStyle="rgba(232,213,163,.5)"; cx.lineWidth=1.2; cx.setLineDash([3,3]);
  cx.beginPath(); cx.moveTo(x+Math.cos(tgt)*(r-24), y+Math.sin(tgt)*(r-24));
  cx.lineTo(x+Math.cos(tgt)*(r+8), y+Math.sin(tgt)*(r+8)); cx.stroke();
  cx.setLineDash([]);
  cx.font='12px "Songti SC","SimSun",serif'; cx.fillStyle=P.dim; cx.textAlign="center";
  cx.fillText("切面角",x,y+18);
  cx.restore();
}

/* ══════════ 提示条：顶栏提示文字已全部移除（应用户要求去杂）══════════ */
function drawHint(){
  const el=document.getElementById("hn");
  el.innerHTML="";
}

/* ══════════ 主绘制 ══════════ */
/* 工序中立绘整体上移：底部要给进度条让位，立绘居中偏下会被进度条压住 */
function workCenter(){ return {x:CW/2, y:CH*0.38}; }
/* 工序状态立绘 —— 按亮度抠掉素材黑底。
   方框/黑边的根因：素材是方图，主体（石头）之外是**纯黑或近黑**的底，
   但并非100% 纯黑（lum 约 10~50），所以——
     · source-over：整块方图盖住背景 → 黑方块
     · lighter（加法）：那圈近黑底被「加」到背景上 → 亮出**矩形**边界
     · destination-out 擦圆外：擦除起点难定，容易啃掉石头
   采用按亮度抠 alpha：黑底 → 全透明，主体 → 不透明，阈值间平滑过渡。
   天然没有矩形边界，也不会误伤石头（石头本身明亮）。
   遮罩按素材缓存，每张只算一次。 */
const _maskCache={};
function alphaMaskOf(src,im){
  if(_maskCache[src]) return _maskCache[src];
  const W=im.width,H=im.height;
  /* 离屏取像素（不动原Image，避免污染 IMG 缓存） */
  const tmp=document.createElement("canvas"); tmp.width=W; tmp.height=H;
  const tx=tmp.getContext("2d");
  tx.drawImage(im,0,0);
  let id;
  try{ id=tx.getImageData(0,0,W,H); }
  catch(e){ _maskCache[src]=im; return im; }   /* 跨域等异常时退化为不抠图 */
  const d=id.data;
  const FLOOR=30, SOFT=18;   /* ≤30 全透明，≥48 全不透明 */
  for(let i=0;i<d.length;i+=4){
    const l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    let a;
    if(l<=FLOOR) a=0;
    else if(l>=FLOOR+SOFT) a=255;
    else a=Math.round((l-FLOOR)/SOFT*255);
    d[i+3]=a;
  }
  tx.putImageData(id,0,0);
  _maskCache[src]=tmp;
  return tmp;
}
function drawWorkImg(src,c,rad,rot,st){
  const im=imgOf(src);
  if(!im) return;
  const sz=rad*3.0;
  const m=alphaMaskOf(src,im);
  cx.save();
  cx.translate(c.x,c.y);
  cx.drawImage(im,-sz/2,-sz/2,sz,sz);
  cx.globalCompositeOperation="destination-in";
  cx.drawImage(m,-sz/2,-sz/2,sz,sz);
  cx.globalCompositeOperation="source-over";
  cx.restore();
}
function draw(){
  const working=(G.phase==="peel"||G.phase==="cut"||G.phase==="polish");
  /* 工序时换无灯桌图：原桌图油灯在台面中心（石料位），灯柱会从立绘后面
     穿出来挡住立绘；店铺待工态才用带灯桌图+鉴定灯。 */
  drawStage(working);
  drawHint();
  const c=working?workCenter():center();
  const st=cur();

  if(!st){
    /* 台面空置：旧版画虚线圈 + 「玉石馆的台面，空着」文字，
       在暖调新背景上既突兀又抢戏。已整块移除，只留干净的空台。 */
    return;
  }
  const s=st.s;
  const rad=R()*0.52;
  const rot=s.offA*0.15+G.spin*0.5;

  if(G.phase==="peel"){
    /* 落錾 = 剥落石皮状态立绘（壳被剥开一角、露出内部晶体） */
    drawShadow(c,rad*1.05,rad*0.28);
    drawWorkImg(workImgOf(s.gtype,"peel"),c,rad,null,st);
    drawOpPanel(c);
  }else if(G.phase==="cut"){
    /* 落刀 = 原石被切开的状态立绘 */
    drawShadow(c,rad*0.98,rad*0.26);
    drawWorkImg(workImgOf(s.gtype,"cut"),c,rad,null,st);
    drawOpPanel(c);
  }else if(G.phase==="polish"){
    /* 落磨 = 原石被打磨的状态立绘 */
    drawShadow(c,rad*0.98,rad*0.26);
    drawWorkImg(workImgOf(s.gtype,"polish"),c,rad,null,st);
    drawOpPanel(c);
  }else{
    /* 店铺待工态：剥落石皮立绘 + 鉴定灯（带灯桌图的氛围保留在这里） */
    drawLamp(c);
    drawShadow(c,rad*0.9,rad*0.26);
    drawWorkImg(workImgOf(s.gtype,"peel"),c,rad*0.92,rot,st);
  }
  drawWarp();
}

/* 运气见底：台面褪色发冷，提醒今日到此为止 */
/* 运气见底：台面静态褪色发冷，提醒今日到此为止
   （旧版有一团随正弦曲线飘动的暗色椭圆，像暗影缓缓飘过，已移除） */
function drawWarp(){
  const lk=(typeof luckOf==="function")?luckOf():22;
  if(lk>0) return;
  cx.save();
  cx.globalAlpha=.16;
  cx.fillStyle="#0a1420";
  cx.fillRect(0,0,CW,CH);
  cx.restore();
}

/* ── 缩略图：货摊原石只画外壳（不剧透宝石），藏品画成品 ── */
function thumb(cv2, src){
  const x=cv2.getContext("2d");
  const D=Math.min(2,window.devicePixelRatio||1);
  cv2.width=38*D; cv2.height=38*D;
  x.setTransform(D,0,0,D,0,0);
  x.fillStyle="#000"; x.fillRect(0,0,38,38);
  const im=imgOf(src);
  if(im){
    const sc=Math.max(38/im.width,38/im.height);
    x.globalCompositeOperation="lighter";
    x.drawImage(im,(38-im.width*sc)/2,(38-im.height*sc)/2,im.width*sc,im.height*sc);
    x.globalCompositeOperation="source-over";
  }
}

/* ── 完工按钮：实时算出「现在完工能拿多少」，价格随进度变化 ── */
function stopBtnHTML(){
  const st=cur(); if(!st||!st.s) return "";
  const ratio=(typeof stopRatio==="function")?stopRatio():0;
  if(ratio<=0) return "";
  const est=Math.max(1,Math.round(itemBase({kind:"gem",s:st.s,dg:st.dg,cuts:st.cuts,pq:st.pq===undefined?0.5:st.pq})*ratio));
  return `<button class="opt3" data-act="stop" title="完工出售，按当前完成度折价">完 工<small>${est} 金</small></button>`;
}

/* ── 下一道工序按钮：跃进到下一阶段，省掉「必须落完当前工序」的硬约束 ── */
const PHASE_NEXT={
  peel  :{to:"cut",   label:"下一道工序", sub:"直接上锯"},
  cut   :{to:"polish",label:"下一道工序", sub:"直接上磨"},
  polish:null
};
function nextStepHTML(){
  const nx=PHASE_NEXT[G.phase];
  if(!nx) return "";
  const st=cur(); if(!st) return "";
  // 至少完成一刀才能进阶，否则与「直接卖掉原石」无区别
  const done = G.phase==="peel" ? (G.peelMax-G.peelLeft) : G.cutDone;
  if(done<STOP_MIN_HIT) return `<button class="opt3 locked" disabled title="先落至少${STOP_MIN_HIT}手再进阶">下一道工序<small>需先落 ${STOP_MIN_HIT} 手</small></button>`;
  return `<button class="opt3 next" data-act="nextStep" title="跳过本工序剩余，直接进入下一道">${nx.label}<small>${nx.sub}</small></button>`;
}

/* 工具按钮已移除：工序由「落錾 / 落刀 / 落磨」单一主操作推进，
   当前生效工具仍由 bestTool() 自动选取最高级已解锁手艺，不再在界面上展示。 */
function bestTool(){
  let k="chisel";
  for(const t of TKS){ if(!toolLockReason(t)) k=t; }
  return k;
}
function drawTools(){
  const el=document.getElementById("tl");
  const st=cur();
  let h="";
  // 工具已隐去，但仍需按已解锁的最高级手艺自动生效
  const tk=bestTool();
  if(G.tool!==tk) G.tool=tk;
  // 主操作与「卖掉 / 下一道工序」并列一行：落錾 / 落刀 / 落磨
  // 完工按钮仅在最后一道工序（polish）时显示
  if(G.phase==="peel"||G.phase==="cut"){
    const act=G.phase;
    /* 工序名：錾剥 / 开料（学艺后显示线割·震解） / 修磨 */
    const name = G.phase==="peel" ? "錾 剥" : (typeof curCut==="function" ? curCut().n : "开 料");
    const rate=Math.round(opRate(G.phase,st)*100);
    h+=`<div class="tri">`;
    h+=`<button class="opt3 on" data-act="${act}">${name}<small>成功率 ${rate}%</small></button>`;
    h+=nextStepHTML();
    h+=`</div>`;
  }else if(G.phase==="polish"){
    // 最后一道工序：可完工、可继续修磨
    h+=`<div class="tri">`;
    h+=`<button class="opt3 on" data-act="polish">修 磨<small>成功率 ${Math.round(opRate("polish",st)*100)}%</small></button>`;
    h+=stopBtnHTML();
    h+=`</div>`;
  }
  /* 切法选择按钮已整体移除：开料方式由已学技艺自动决定（震解 > 线割 > 普通开料），
     玩家不再手动选琢型。 */
  if(!G.dayOver){
    const warn=G.jewels.length?`（${G.jewels.length} 件将按六折让渡）`:"";
    h+=`<div class="acts-row">`;
    h+=`<button class="gh${G.jewels.some(x=>x.kind==="gem"&&x.dg.length)?" warn":""}" data-act="openWs">${G.jewels.some(x=>x.kind==="gem"&&x.dg.length)?"制作首饰·先修伤":"制作首饰"}</button>`;
    h+=`<button class="gh${G.jewels.length?" warn":""}" data-act="closeShop">直接卖出${warn}</button>`;
    if(st) h+=`<button class="gh" data-act="drop">弃石</button>`;
    h+=`</div>`;
  }else if(st){
    h+=`<button class="gh" data-act="drop">弃石</button>`;
  }
  el.innerHTML=h;
  // 工具栏重建后高度会变：同步刷新 toast 锚点，避免提示条压住按钮
  const ts=document.getElementById("ts");
  if(ts) ts.style.bottom=(el.offsetHeight+4)+"px";
}

/* ── 模态 ── */
function showModal(html){
  document.getElementById("md").innerHTML=html;
  document.getElementById("vl").className="on";
}
function hideModal(){
  document.getElementById("vl").className="";
  // 自愈：任何路径关窗时，若还挂着一件未确认的成品/盲盒，先把游戏状态解锁，
  // 否则 settling 会一直为 true，后续所有加工判定都被挡住 —— 表现为「卡死」。
  if(typeof G!=="undefined"){
    if(G.finaleSt && !G.finaleSt.busy){
      const st=G.finaleSt.st;
      G.finaleSt=null;
      if(st && cur()===st && G.bag.some(x=>x.s.id===st.s.id)){
        G.settling=false;                       // 料还在案上，退回加工态即可继续
        // 成品弹窗被直接关掉（未点入柜）：料还没走完，退回上一道工序等玩家继续
        if(G.phase==="cut"||G.phase==="polish"){
          G.phase="peel";
          G.peelLeft=0;
        }
      }
    }
    if(G.settling && !G.finaleSt) G.settling=false;
  }
  // 开满两块料后，等当前弹窗（砖头料/天赐）关闭即强制打烊入夜
  // forced 必须显式传 true：这是「时辰/额度用尽」的自动收市，成品要留存到次日。
  // 漏传时 forced 为 undefined（falsy），会走「主动收工」分支把柜台成品六折清空 ——
  // 玩家辛苦开出的成品凭空少卖四成，且日志写的是「收市让渡」而不是「留存」。
  if(G._pendingClose && !G.finaleSt && !G.settling){ G._pendingClose=false; closeDay(true); }
}

/* 打烊面板重开：玩家在打烊后点开别的面板又关掉时，把「歇业进入次日」面板还给他。
   没有这一步，玩家会被「今日已收工，明天再来」挡住，却又找不到进第二天的入口。 */
function resumeDayEnd(){
  const d=G._dayEnd||{gained:0,net:rentOf(G.day),liq:{back:0,bn:0,sold:0,sn:0,kept:0}};
  showDayEnd(d.gained, d.net, d.liq);
  render();
}
function showDayEnd(gained, net, liq){
  liq = liq || {back:0,bn:0,sold:0,sn:0,kept:0};
  const rentDue = (G.day % RENT_INTERVAL === 0);
  let h=`<h2>打 烊</h2><div class="sb">第 ${G.day} 日 · 玉石馆</div>`;

function rentOf(d){
  // 买下玉石铺后永久免租

  const day = d || G.day;

}

/* 绝料现形：异石选项经鉴定确认为绝料后，名称与粗坯立绘即时切换为龙石 */
function boxOptGk(o){
  return (o.gazed && o.gaze && o.gaze.gk==="rare" && o.g==="obsidian") ? "dragon" : o.g;
}
function boxOptLabel(o){
  const bits=[];
  if(o.gazed){
    // 鉴定后才亮石种（花钱鉴定买的信息，之前不剧透）
    const g=GEMS[boxOptGk(o)];
    bits.push(`<b style="color:${g.c2}">${g.n}</b>`);
    bits.push(o.win?`<span style="color:#8fbf9f">明料</span>`:`<span style="color:#9a917f">${SHELLS[o.shell].n}壳</span>`);
    if(o.ex) bits.push(`<span style="color:#d66b6b">专属石料</span>`);
  }else{
    // 未鉴定只露外壳（石灰岩/砂岩/云母片岩），不露晶体不剧透石种
    bits.push(`<span style="color:#9a917f">${SHELLS[o.shell].n}壳</span>`);
  }
  return bits.join(" · ");
}

/* 开箱弹窗里的粗坯缓慢自转，模拟「转动镜头看料」；细看按钮触发运势检定撞迹象 */
let _boxRAF=0;
function startBoxSpin(){
  if(_boxRAF) cancelAnimationFrame(_boxRAF);
  if(!BOX) return;
  const k=BOX.b.k;
  const canvases=[...document.querySelectorAll("canvas[data-bo]")];
  if(!canvases.length) return;
  // 缩略图只显示外壳（石灰岩/砂岩/云母片岩纯壳图），不露内部晶体、不剧透石种
  const imgs=canvases.map((cv,i)=>{
    const o=BOX.opts[i];
    const sh=(o&&typeof o.shell==="number")?SHELLS[o.shell]:null;
    return sh?imgOf(sh.img):null;
  });
  const draw=(cv,im,t,i)=>{
    const x=cv.getContext("2d");
    x.fillStyle="#000"; x.fillRect(0,0,150,150);
    if(im){
      x.save(); x.translate(75,75); x.rotate(t*0.5+i*2.1);
      const sc=Math.max(150/im.width,150/im.height);
      x.globalCompositeOperation="lighter";
      x.drawImage(im,-im.width*sc/2,-im.height*sc/2,im.width*sc,im.height*sc);
      x.globalCompositeOperation="source-over"; x.restore();
    }
    // 描边不做稀有度染色 —— 稀有度要上台鉴定后才可见，描边只做统一的暗金框
    x.strokeStyle="rgba(107,90,53,.9)"; x.lineWidth=1;
    x.strokeRect(.5,.5,149,149);
  };
  const loop=()=>{
    if(!BOX || BOX.b.k!==k){ _boxRAF=0; return; }
    const t=performance.now()/1000;
    canvases.forEach((cv,i)=>draw(cv,imgs[i],t,i));
    _boxRAF=requestAnimationFrame(loop);
  };
  _boxRAF=requestAnimationFrame(loop);
}

    if(im){
      x.fillStyle="#000"; x.fillRect(0,0,150,150);
      x.globalCompositeOperation="lighter";
      x.drawImage(im,7,7,136,136);
      x.globalCompositeOperation="source-over";
    }
    // 损伤照样呈现在拍品图上：裂纹／崩边／磨薄／雾化，客人看得见

function aucTopBidder(){
  let t=null;
  for(const b of AUC.bidders) if(b.bid>0 && (!t||b.bid>t.bid)) t=b;
  return t;
}

        <span class="bx-n" style="border-color:${EX_STONE.shell}">${EX_STONE.n} · 石筹</span>
        <span class="bx-d">同上，改用石筹付款</span>
        <span class="bx-p">${locked?"需包月充电解锁":over?"明天再来":EX_STONE.pts+" 石筹"}</span>
      </button>

    if(locked) h+=`<p class="ds" style="margin-top:6px;font-size:11px;color:#c9ae6e">「异石」乃充电专属 · 需在视频页开通包月充电后解锁购买。</p>`;

/* 专属石在石市内自转展示 */
let _exRAF=0;
function spinExStone(){
  if(_exRAF) cancelAnimationFrame(_exRAF);
  const cv=document.querySelector("#md canvas[data-ex]");
  if(!cv) return;
  const im=imgOf(EX_STONE.rough||EX_STONE.img);
  const loop=()=>{
    if(!document.body.contains(cv)){ _exRAF=0; return; }
    const x=cv.getContext("2d");
    x.fillStyle="#000"; x.fillRect(0,0,110,110);
    if(im){
      x.save(); x.translate(55,55); x.rotate(performance.now()/2600);
      const sc=Math.max(110/im.width,110/im.height);
      x.globalCompositeOperation="lighter";
      x.drawImage(im,-im.width*sc/2,-im.height*sc/2,im.width*sc,im.height*sc);
      x.globalCompositeOperation="source-over"; x.restore();
    }
    x.strokeStyle="#7a3a3a"; x.lineWidth=2; x.strokeRect(1,1,108,108);
    _exRAF=requestAnimationFrame(loop);
  };
  loop();
}

  h+=`<div class="ac"><button class="gh" data-act="closeModal">合上榜单</button></div>`;
  showModal(h);
  const tabs=document.querySelectorAll(".lb-tab");
  tabs.forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(btn.classList.contains("active")) return;
      tabs.forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      loadRankBoard(btn.getAttribute("data-lbtab"));
    });
  });
  loadRankBoard("score");   // 默认开累计收益榜
}
/* 榜单缓存保鲜窗口：窗口内直接渲染缓存，过期或首次才发 RPC。
   配合 toyapi.js 的后台热拉（启动 + 每次上报后），玩家不打开弹窗也能保持榜单新鲜。*/
const LB_CACHE_TTL=30000;   // 30s
/* tab 切换：缓存新鲜则直接渲染，否则发 RPC 重新拉取——既避免永远停在旧缓存，也避免每次打开都打榜额度 */
function loadRankBoard(which){
  const target=document.getElementById("mdLb");
  if(!target) return;
  const board=(which==="val")?LB_BOARD_VAL:LB_BOARD;
  const titles=(which==="val")?LB_TITLES_VAL:LB_TITLES;
  const age = (TOY_API.lbFetchedAt && TOY_API.lbFetchedAt[board])
            ? (Date.now() - TOY_API.lbFetchedAt[board]) : Infinity;
  if(TOY_API.lbCache && Object.prototype.hasOwnProperty.call(TOY_API.lbCache, board) && age < LB_CACHE_TTL){
    renderLeaderboard(target, board, titles);
  }else{
    loadLeaderboard(target, board, titles);
  }
}

  }

  /* ── 佳石 + 赌坊产物：同一个柜子 ── */
  const gmT=G.treasure.filter(t=>t.src==="gamble");
  const exT=G.treasure.filter(t=>t.src!=="gamble");
  if(!G.treasure.length){
    h+=`<div class="tc-empty">藏珍之柜空空如也</div>`;
    h+=`<div style="text-align:center"><button class="gh" data-act="closeModal">合上柜门</button></div>`;
    showModal(h);
    drawGiftCells();
    return;
  }
  if(exT.length){
    const ts=treasureStats();
    h+=`<p class="ds" style="text-align:center">佳石共 ${ts.total} 方 · 上等 ${ts.high} 方 · 天品 ${ts.rare} 方</p>`;
  }
  if(gmT.length){
    h+=`<p class="ds" style="text-align:center">赌坊入藏 ${gmT.length} 方 · 全店售价 +${gmVaultBonus().toFixed(1)}%（上限 +${VAULT_CAP}%）</p>`;
  }
  h+=`<div class="tc-grid">`;
  for(const t of G.treasure){
    if(t.src==="gamble"){
      const x=PU_PROD.find(y=>y.k===t.g); if(!x) continue;
      const from=PU.find(p=>p.k===t.from);
      h+=`<div class="tc-cell gm">
        <div class="tc-img"><img src="${x.img}" alt="${x.n}"></div>
        <div class="tc-n">${x.n}</div>
        <div class="tc-m">${x.tier} · 售价 +${x.bo}%<br>第 ${t.day} 天 · ${from?from.n:""}</div>
      </div>`;
      continue;
    }
    const g=GEMS[t.g];
    if(!g) continue;
    h+=`<div class="tc-cell${t.ex?" ex":""}">
      <canvas data-tc2="${t.g}" width="150" height="150"></canvas>
      <div class="tc-n">★${g.n}${t.ex?" · 专属":""}</div>
      <div class="tc-m">${t.gn} · 底价 ${t.v} 金<br>第 ${t.day} 天</div>
    </div>`;
  }
  h+=`</div>`;
  h+=`<div class="ac"><button class="gh" data-act="closeModal">合上柜门</button></div>`;
  showModal(h);
  drawGiftCells();
  // 立绘补绘
  for(const cv2 of document.querySelectorAll("#md canvas[data-tc2]")){
    const g=GEMS[cv2.dataset.tc2];
    if(!g) continue;
    const x=cv2.getContext("2d");
    const im=imgOf(g.img);
    if(im){
      x.fillStyle="#000"; x.fillRect(0,0,150,150);
      x.globalCompositeOperation="lighter";
      const sc=Math.max(150/im.width,150/im.height);
      x.drawImage(im,(150-im.width*sc)/2,(150-im.height*sc)/2,im.width*sc,im.height*sc);
      x.globalCompositeOperation="source-over";
    }
  }
}

/* 天赐立绘：未得画暗色剪影占位，得手后画实图。
   与 showGift 一致用 source-over —— 天赐素材偏暗，lighter 会画成黑块。 */
function giftThumb(cv2,g){
  const x=cv2.getContext("2d");
  const got=G.gifts.some(y=>y.k===g.k);
  const im=imgOf(g.img);
  const sz=cv2.width||48;
  x.globalCompositeOperation="source-over";
  x.clearRect(0,0,sz,sz);
  if(!im) return;
  const sc=Math.max(sz/im.width,sz/im.height);
  if(got){
    x.drawImage(im,(sz-im.width*sc)/2,(sz-im.height*sc)/2,im.width*sc,im.height*sc);
  }else{
    x.globalAlpha=0.22;
    x.drawImage(im,(sz-im.width*sc)/2,(sz-im.height*sc)/2,im.width*sc,im.height*sc);
    x.globalAlpha=1;
  }
}
function drawGiftCells(){
  for(const cv2 of document.querySelectorAll("#md canvas[data-gf2]")){
    const g=GIFTS.find(x=>x.k===cv2.dataset.gf2);
    if(!g) continue;
    const x=cv2.getContext("2d");
    const got=G.gifts.some(y=>y.k===g.k);
    const im=imgOf(g.img);
    x.globalCompositeOperation="source-over";
    x.fillStyle="#14100b"; x.fillRect(0,0,120,120);
    if(!im){
      x.fillStyle="#6b6152"; x.font='12px "Songti SC",serif'; x.textAlign="center";
      x.fillText("？",60,64);
      continue;
    }
    const sc=Math.max(120/im.width,120/im.height);
    if(got){
      x.drawImage(im,(120-im.width*sc)/2,(120-im.height*sc)/2,im.width*sc,im.height*sc);
    }else{
      /* 未得：压暗剪影，轮廓可辨而细节不显 */
      x.globalAlpha=0.22;
      x.drawImage(im,(120-im.width*sc)/2,(120-im.height*sc)/2,im.width*sc,im.height*sc);
      x.globalAlpha=1;
    }
  }
}

function showGift(g){

  <div class="gf-pop"><canvas data-gfp="${g.k}" width="200" height="200"></canvas>

  <div class="ac"><button class="gh" data-act="closeModal">合上柜门</button></div>`);
  const cv=document.querySelector("#md canvas[data-gfp]");
  if(cv){
    const x=cv.getContext("2d");
    x.fillStyle="#14100b"; x.fillRect(0,0,200,200);
    const im=imgOf(g.img);
    if(im){
      /* 用 source-over 直接贴，不用 lighter。
         天赐素材本身偏暗（实测平均亮度 24~40），lighter 叠在深色弹窗底上
         等于「什么都没加」，画出来就是一块黑 —— 这正是原先看到的黑方块。
         source-over 直接呈现原图，不论明暗都看得见。 */
      x.globalCompositeOperation="source-over";
      const sc=Math.max(200/im.width,200/im.height);
      x.drawImage(im,(200-im.width*sc)/2,(200-im.height*sc)/2,im.width*sc,im.height*sc);
      /* 底部压一层暖色渐变，让立绘与深色弹窗底自然衔接 */
      const gr=x.createLinearGradient(0,140,0,200);
      gr.addColorStop(0,"rgba(11,9,8,0)");
      gr.addColorStop(1,"rgba(11,9,8,.85)");
      x.fillStyle=gr; x.fillRect(0,140,200,60);
    }else{
      /* 素材未就绪：画个占位符而不是纯黑方块 */
      x.globalCompositeOperation="source-over";
      x.fillStyle="#e8d5a3"; x.font='15px "Songti SC",serif'; x.textAlign="center";
      x.fillText(g.n,100,108);
    }
  }
}

/* 存档快照：与 Toy 版同结构，由本文件提供 */
function snapshot(){
  return {
    v:1, day:G.day, gold:G.gold, rep:G.rep, pts:G.pts, spend:G.spend|0,
    skills:Object.assign({}, G.skills),
    treasure:(G.treasure||[]).slice(0,KEEPCAP),
    gifts:(G.gifts||[]).map(g=>({k:g.k,n:g.n,bonus:g.bonus,ds:g.ds,img:g.img})),
    gamble:(()=>{ const gm=G.gamble; if(!gm) return undefined;
      return { tickets:gm.tickets|0, fund:gm.fund|0, owned:!!gm.owned,
               vault:(gm.vault||[]).slice(0,200),
               stats:{ open:gm.stats.open|0, byS:Object.assign({},gm.stats.byS),
                       spent:gm.stats.spent|0, got:gm.stats.got|0,
                       wuzhan:gm.stats.wuzhan|0, jade:gm.stats.jade|0,
                       byProd:Object.assign({},gm.stats.byProd) } }; })(),
    best:G.best, log:(G.log||[]).slice(0,12),
    bestVal:G.bestVal, bestValK:G.bestValK, bestValKind:G.bestValKind
  };
}
function applySnapshot(o){
  if(!o || typeof o!=="object") return false;
  if(typeof o.day==="number" && o.day>1) G.day=Math.floor(o.day);
  if(typeof o.gold==="number") G.gold=Math.max(0,Math.round(o.gold));
  if(typeof o.rep==="number") G.rep=cl(o.rep,0,REP_MAX);
  if(typeof o.pts==="number") G.pts=Math.max(0,Math.round(o.pts));
  if(typeof o.spend==="number") G.spend=Math.max(0,Math.round(o.spend));
  if(o.skills && typeof o.skills==="object") G.skills=Object.assign({}, o.skills);
  if(Array.isArray(o.treasure)) G.treasure=o.treasure.filter(t=>t&&GEMS[t.g]).slice(0,KEEPCAP);
  if(Array.isArray(o.gifts))
    G.gifts=o.gifts.filter(g=>g&&GIFTS.some(x=>x.k===g.k)).map(g=>GIFTS.find(x=>x.k===g.k));
  else if(Array.isArray(o.cabinet))
    G.gifts=o.cabinet.filter(r=>r&&r.n).map(r=>GIFTS.find(x=>x.n===r.n)).filter(Boolean);
  if(o.gamble && typeof o.gamble==="object"){
    const s=o.gamble, gm=G.gamble;
    gm.tickets=Math.max(0, Math.floor(Number(s.tickets)||0));
    gm.fund=Math.max(0, Math.round(Number(s.fund)||0));
    gm.owned=!!s.owned;
    if(Array.isArray(s.vault)){
      gm.vault=s.vault.filter(v=>v&&typeof v.k==="string"&&PU_PROD.some(p=>p.k===v.k)).slice(0,200);
    }
    if(s.stats && typeof s.stats==="object"){
      const t=s.stats;
      gm.stats.open=Math.max(0,Math.floor(Number(t.open)||0));
      gm.stats.byS=Math.assign({tai:0,lan:0,mo:0,yao:0}, t.byS||{});
      gm.stats.spent=Math.max(0,Math.round(Number(t.spent)||0));
      gm.stats.got=Math.max(0,Math.round(Number(t.got)||0));
      gm.stats.wuzhan=Math.max(0,Math.floor(Number(t.wuzhan)||0));
      gm.stats.jade=Math.max(0,Math.round(Number(t.jade)||0));
      gm.stats.byProd=Object.assign({}, t.byProd||{});
    }
  }
  if(o.best && typeof o.best==="object") G.best=o.best;
  if(Array.isArray(o.log)) G.log=o.log.slice(0,12);
  if(typeof o.bestVal==="number") G.bestVal=o.bestVal;
  if(typeof o.bestValK==="string") G.bestValK=o.bestValK;
  if(typeof o.bestValKind==="string") G.bestValKind=o.bestValKind;
  return true;
}

"use strict";
/* ══════════ 音频系统 ══════════
   BGM：assets/bgm.mp3，解码为 AudioBuffer 后用「双 BufferSource 前后紧接 + 交叉淡化」
        实现零间隙循环。
        为什么不用 <audio loop>：HTMLMediaElement 的 loop 在各浏览器都有解码器延迟
        （Chrome 起播约 23ms、结束也有余量），循环点能听到接缝，达不到「不能有哪怕
        0.1s 空白」的要求。
        为什么自己调度：AudioBufferSourceNode.start(t) 是采样级精确的，按
        「本段起点 = 上一段起点 + (dur - XFADE)」排下一段，两段在 XFADE 处重叠，
        任意时刻都有声音在播 —— 这是数学上无空隙的做法。
        交叉淡化同时掩盖 mp3 末尾可能存在的非零包络（直接回绕会「啪」一声爆音）。
   音效：Web Audio 实时合成，不占额外资源。 */

let _audioCtx = null;
let _bgmGain = null;
let _sfxGain = null;
let _masterMuted = false;

const BGM_VOL = 0.32;    // BGM 总线音量
const SFX_VOL = 0.45;    // 音效总线音量
const BGM_SRC = "assets/bgm.mp3";
const XFADE = 0.12;      // 交叉淡化时长（秒）

/* ── 初始化 ── */
function initAudio(){
  if(_audioCtx) return;
  try{
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    _masterMuted = false;
    const master = _audioCtx.createGain();
    master.gain.value = 0.62;
    master.connect(_audioCtx.destination);
    _bgmGain = _audioCtx.createGain();
    _bgmGain.gain.value = BGM_VOL;
    _bgmGain.connect(master);
    _sfxGain = _audioCtx.createGain();
    _sfxGain.gain.value = SFX_VOL;
    _sfxGain.connect(master);
  }catch(e){ console.log("Audio init failed:", e); }
}

function resumeAudio(){
  if(_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume();
}

/* ── 音效合成原语 ── */
function playTone(freq, duration, type="sine", gain=0.3, detune=0){
  if(!_audioCtx) return;
  resumeAudio();
  const osc = _audioCtx.createOscillator();
  const g = _audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = detune;
  g.gain.setValueAtTime(gain, _audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + duration);
  osc.connect(g);
  g.connect(_sfxGain);
  osc.start();
  osc.stop(_audioCtx.currentTime + duration);
}

function playFilteredNoise(duration, gain, ftype="bandpass", freq=1000, q=1){
  if(!_audioCtx) return;
  resumeAudio();
  const n = Math.max(1, Math.floor(_audioCtx.sampleRate * duration));
  const buf = _audioCtx.createBuffer(1, n, _audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = _audioCtx.createBufferSource(); src.buffer = buf;
  const f = _audioCtx.createBiquadFilter();
  f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  const g = _audioCtx.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(_sfxGain);
  src.start();
}

function playThump(f0, f1, dur, gain, type="sine"){
  if(!_audioCtx) return;
  resumeAudio();
  const t = _audioCtx.currentTime;
  const o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(_sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}

/* ══════════ BGM：零间隙单曲循环 ══════════ */
let _bgmBuf = null;        // 解码后的 AudioBuffer
let _bgmLoading = false;
let _bgmPlaying = false;
let _bgmNextAt = 0;        // 下一段起播时间（AudioContext 时间轴）
let _bgmTimer = null;

function _bgmFetchBuffer(){
  if(_bgmBuf) return Promise.resolve(_bgmBuf);
  if(_bgmLoading) return Promise.resolve(null);
  _bgmLoading = true;
  return fetch(BGM_SRC)
    .then(r=>r.arrayBuffer())
    .then(ab=>_audioCtx.decodeAudioData(ab))
    .then(buf=>{ _bgmBuf = buf; _bgmLoading = false; return buf; })
    .catch(e=>{ _bgmLoading=false; console.log("BGM load failed:", e); return null; });
}

/* 调度一段。fadeIn=true 时表示与前一段重叠 XFADE 秒：本段 0→1 淡入，
   末尾 XFADE 秒 1→0 淡出，正好交给下一段接手，全程无 0 音量点。 */
function _bgmSchedule(buf, startAt, fadeIn){
  const src=_audioCtx.createBufferSource();
  src.buffer=buf;
  const g=_audioCtx.createGain();
  const dur=buf.duration;
  if(fadeIn){
    g.gain.setValueAtTime(0.0001, startAt);
    g.gain.linearRampToValueAtTime(1, startAt + XFADE);
    g.gain.setValueAtTime(1, Math.max(startAt + XFADE, startAt + dur - XFADE));
    g.gain.linearRampToValueAtTime(0.0001, startAt + dur);
  }else{
    g.gain.setValueAtTime(1, startAt);
  }
  src.connect(g); g.connect(_bgmGain);
  src.start(startAt);
  src.stop(startAt + dur + 0.02);
  return src;
}

/* 循环泵：每 XFADE/3 检查一次，不足两个 XFADE 时补播下一段。
   标签页挂起导致 currentTime 落后时，用 now 纠正，避免一次性补大量段。 */
function _bgmPump(){
  if(!_bgmPlaying || !_bgmBuf || !_audioCtx) return;
  const now=_audioCtx.currentTime;
  const loopDur=_bgmBuf.duration - XFADE;
  let guard = 0;
  while(_bgmNextAt - now < XFADE * 2 && guard++ < 4){
    _bgmSchedule(_bgmBuf, _bgmNextAt, true);
    _bgmNextAt += loopDur;
    if(_bgmNextAt < now) _bgmNextAt = now + loopDur;   /* 纠正漂移 */
  }
}

function startBGM(){
  if(!_audioCtx) return;
  resumeAudio();
  if(_bgmPlaying) return;
  _bgmPlaying = true;
  _bgmFetchBuffer().then(buf=>{
    if(!buf || !_bgmPlaying) return;
    _bgmNextAt = _audioCtx.currentTime + 0.06;
    _bgmSchedule(buf, _bgmNextAt, false);          /* 首段不淡入 */
    _bgmNextAt += (buf.duration - XFADE);
    if(_bgmTimer) clearInterval(_bgmTimer);
    _bgmTimer = setInterval(_bgmPump, XFADE * 1000 / 3);
    _bgmPump();
  });
}

function stopBGM(){
  _bgmPlaying = false;
  if(_bgmTimer){ clearInterval(_bgmTimer); _bgmTimer = null; }
}

function toggleMute(){
  _masterMuted = !_masterMuted;
  if(_audioCtx){
    if(_masterMuted){
      _bgmGain.gain.value = 0;
      _sfxGain.gain.value = 0;
    }else{
      _bgmGain.gain.value = BGM_VOL;
      _sfxGain.gain.value = SFX_VOL;
    }
  }
  return _masterMuted;
}

window.AudioSys = { init: initAudio, resume: resumeAudio, startBGM, stopBGM, toggleMute, SFX };

function gazeInfoOf(s){

const SHAT_BACK=0.55;
/* 生成一块原石。传 o 时按盲盒三选一的结果锁定石种与关键属性 */
function mkStone(tier, allowEx, o){

  else gk=pk(GK.filter(k=>!GEMS[k].exclusive || allowEx===true));

          : (!g.exclusive && RND() < (ANOM_BASE+tier*ANOM_TIER)*((G.event&&G.event.k==="radio")?2:1)),
    shell: (o && o.shell!==undefined) ? o.shell : ri(0,SHELLS.length-1),

    rare: (o && o.rare!==undefined) ? o.rare : false,      // 天品档：现形龙石
    brick: (o && o.brick!==undefined) ? o.brick : false,   // 下等档内砖头料：直接认定失败
    cost: 0

  return s;
}
/* 毛料估值：满贯切完能卖多少。抬高基准并压缩低倍率宝石的劣势，
   保证最低档箱（杂矿袋）开出的水晶也能回本 —— 否则新手第一天必亏。 */
function gemVal(s){
  const g=GEMS[s.gtype];
  const mul=0.75+g.mul*0.55;                 // 水晶 0.55 → ×1.05；祖母绿 1.55 → ×1.60
  return Math.round(430*mul*(s.tier*.42+.85)*(.50+.72*s.purity)*(.55+.5*s.size)*(.6+.5*(1-s.haze)));
}
function dmgMultOf(dg){
  let m=1; for(const d of dg) m*=DMG[d].p;
  return m;
}
/* 天赐加成：陈列后全店售价提升（集齐 4 件不再产出） */
function giftBonus(){

}

function hasSkill(k){

  for(const j of G.worn) if(j.kind==="jewel" && JEWELS[j.jk].buff.k===k) return true;

/* 抛光品质 → 售价倍率（镜面抛光可达 ×1.25） */
function polishMul(j){
  const q = (j.pq===undefined || j.pq===null) ? 0.5 : j.pq;
  return 0.75 + 0.5*cl(q,0,1);
}
function polishTag(j){

/* 今日异象事件 */
function ev(k){ return G.event && G.event.k===k; }
/* ══════════ 首饰工价 ══════════
   镶得好是溢价，镶瘸了是倒贴 —— 同一颗石头，工价能差出十几倍。
   工价 = 抛光系数 × 损伤系数 × 瘸工罚金
     · 抛光系数 0.45(磨砂) ~ 1.40(镜面)：抛光是首饰的命门
     · 损伤系数：每处损伤按 DMG.p 连乘（破损 ×0.35、崩边 ×0.65）
     · 瘸工罚金：带伤的首饰是残次品，镶口和工钱都白费，每处损伤再打七五折
   镜面+完好 → ×1.40；磨砂+破损崩边 → ×0.07。
   再乘类型基数（戒指1.40 / 项链1.58 / 耳环1.80），
   最瘆的活计算下来比裸石还低 —— 首饰从来不是稳赚的买卖。 */
function workMul(j){
  const q=cl((j.pq===undefined||j.pq===null)?0.5:j.pq,0,1);
  const polishK=0.45+0.95*q;
  let dmgK=1; for(const d of (j.dg||[])) dmgK*=DMG[d].p;
  const botch=Math.pow(0.75, (j.dg||[]).length);
  return polishK*dmgK*botch;
}
/* 待拍藏品底价 */
function itemBase(j){
  /* 切法系统已移除：不再有琢型倍率。 */
  let v = gemVal(j.s);
  if(j.kind==="jewel"){
    // 首饰：类型基数 × 工价（工价已含抛光与损伤），不再另享裸石的抛光/损伤系数
    v *= JEWELS[j.jk].mul * workMul(j);
  }else{
    v *= dmgMultOf(j.dg) * polishMul(j);
  }
  // 材质系数：废料打折，高档料溢价
  if(typeof j.grade !== 'undefined') v *= GRADE_PRICE_K[j.grade] || 1;
  // 天赐加成 × 赌藏加成（赌藏独立柜，上限 +40%）
  const gm = (typeof gamblePriceMul==="function") ? gamblePriceMul() : 1;
  return Math.max(1, Math.round(v*giftBonus()*gm));
}

/* 工艺等级：只看工序完成度与失误，与料子本身无关

   半途收刀、工序未全部完成 → 丁等。 */
function craftGradeOf(j){
  if(!j) return "丙等";
  const stopped = !!j.stopped || j.stage==="stopped";
  if(stopped) return "丁等";
  const n=(j.dg&&j.dg.length)||0;
  if(n<=0) return "甲等";

function newDay(){
