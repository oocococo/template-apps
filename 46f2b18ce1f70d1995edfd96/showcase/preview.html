<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{
  --bg:#F7F5F2;
  --card:#FFFFFF;
  --ink:#1C1B1A;
  --ink-2:#5C5853;
  --ink-3:#97918A;
  --line:rgba(0,0,0,.065);
  --pink:#E86A87;
  --pink-soft:#FDEDF1;
  --blue:#4A8FE0;
  --blue-soft:#EAF2FC;
  --amber:#D99A3E;
  --amber-soft:#FCF2E2;
  --green:#4CA977;
  --seg:#EDEAE6;
  --radius:20px;
  --shadow:0 1px 2px rgba(28,27,26,.04), 0 8px 24px -12px rgba(28,27,26,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:#DAD5CD;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---------- 手机外壳 ---------- */
.phone{
  position:relative;
  width:393px;height:852px;
  border-radius:56px;
  background:#F7F5F2;
  box-shadow:0 0 0 11px #1b1b1d, 0 0 0 13px #2d2d30, 0 40px 80px -24px rgba(0,0,0,.5);
  overflow:hidden;
  isolation:isolate;
}
.dynamic-island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:124px;height:36px;border-radius:20px;background:#000;z-index:40;
}
@media (max-width:520px){
  body{background:var(--bg);}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;}
  .dynamic-island{display:none;}
}

/* ---------- 滚动区 ---------- */
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top, 0px) + 24px) 0 118px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.screen::-webkit-scrollbar{display:none;}

/* ---------- 顶部问候 ---------- */
.hero{padding:8px 22px 4px;}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between;}
.hero-date{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;}
.hero-title{font-size:27px;font-weight:700;letter-spacing:-.6px;margin:5px 0 0;}
.hero-sub{font-size:14px;color:var(--ink-2);margin:7px 0 0;line-height:1.5;}
.avatar{
  width:44px;height:44px;border-radius:16px;
  background:linear-gradient(160deg,#FFD8C2,#F3A98C);
  display:flex;align-items:center;justify-content:center;
  font-size:21px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 4px 10px -4px rgba(200,120,80,.6);
  flex:none;
}

/* ---------- 概览卡片 ---------- */
.overview{
  margin:18px 18px 0;
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr)); /* 由 JS 覆盖 */
  padding:14px 6px;
  row-gap:16px;
}
.ov-item{text-align:center;position:relative;min-width:0;padding:0 4px;}
.ov-item[data-col="0"]::before{display:none;}
.ov-item:not([data-col="0"])::before{
  content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line);
}
.ov-val{font-size:18px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ov-val small{font-size:12px;font-weight:600;color:var(--ink-3);margin-left:1px;letter-spacing:0;}
.ov-dot{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:4px;vertical-align:1px;}
.ov-lab{font-size:11px;color:var(--ink-3);margin-top:3px;font-weight:500;letter-spacing:.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- 区块标题 ---------- */
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 24px;margin:26px 0 10px;
}
.section-title{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:1.2px;text-transform:uppercase;}
.section-note{font-size:12.5px;color:var(--ink-3);}

/* ---------- 快捷记录按钮 ---------- */
.quick{padding:0 18px;}
.q-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 16px 12px;
}
.q-title{font-size:15px;font-weight:700;margin:0 0 12px 2px;letter-spacing:-.2px;}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.q-btn{
  border:none;background:var(--seg);border-radius:16px;
  padding:13px 12px 12px;text-align:left;
  display:flex;align-items:center;gap:11px;
  font-family:inherit;cursor:pointer;min-width:0;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), background .16s, box-shadow .16s;
  color:var(--ink);
}
.q-btn:active{transform:scale(.965);}
.q-icon{
  width:36px;height:36px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.q-icon svg{width:20px;height:20px;}
.q-txt{min-width:0;}
.q-name{
  font-size:14.5px;font-weight:650;letter-spacing:-.1px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.q-ago{
  font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.3;
  font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.q-ago.none{color:#BDB7AF;}
.q-card.editing .q-ago{opacity:.55;}
.q-btn.left .q-icon{background:var(--pink-soft);color:var(--pink);}
.q-btn.right .q-icon{background:var(--blue-soft);color:var(--blue);}
.q-btn.bottle .q-icon{background:var(--amber-soft);color:var(--amber);}
.q-btn.diaper .q-icon{background:#E9F4EE;color:var(--green);}


/* ---------- 时间轴 ---------- */
.timeline{margin:0 18px;}
.day-label{
  font-size:12px;font-weight:600;color:var(--ink-3);
  margin:18px 6px 8px;letter-spacing:.3px;
}
.day-label:first-child{margin-top:0;}
.tl-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.entry{
  display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;
  transition:background .15s;
}
.entry + .entry::before{
  content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line);
}
.entry:active{background:#FBFAF8;}
.e-time{
  width:42px;flex:none;font-size:13px;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;letter-spacing:-.2px;
}
.e-dot{
  width:9px;height:9px;border-radius:50%;flex:none;position:relative;
}
.e-dot::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid currentColor;opacity:.24;
}
.e-body{flex:1;min-width:0;}
.e-name{font-size:15px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:6px;}
.e-tag{
  font-size:10.5px;font-weight:650;padding:2px 6px;border-radius:6px;letter-spacing:.2px;
}
.e-meta{font-size:12px;color:var(--ink-3);margin-top:3px;}
.e-dur{
  font-size:13px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:5px;
}
.del{
  position:absolute;right:0;top:0;bottom:0;width:0;overflow:hidden;
  border:none;padding:0;background:#F04438;color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;
  transition:width .2s;
}
.entry.edit-mode .del{width:56px;}
.entry.edit-mode .e-dur{margin-right:52px;}

/* ---------- 空状态 ---------- */
.empty{
  margin:10px 18px;padding:38px 24px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);text-align:center;
}
.empty-emoji{font-size:30px;}
.empty-t{font-size:15px;font-weight:650;margin-top:10px;}
.empty-s{font-size:13px;color:var(--ink-3);margin-top:5px;line-height:1.6;}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:86px;z-index:35;
  display:flex;align-items:flex-start;justify-content:space-around;
  padding-top:9px;
  background:rgba(252,251,249,.86);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:.5px solid rgba(0,0,0,.08);
}
.tab{
  border:none;background:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);padding:2px 12px;transition:color .15s;
}
.tab ion-icon,.tab svg{width:24px;height:24px;display:block;}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.2px;}
.tab.on{color:var(--pink);}
.home-indicator{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:#1C1B1A;opacity:.85;z-index:36;
}

/* ---------- 弹层 / 底部表单 ---------- */
.sheet-mask{
  position:absolute;inset:0;z-index:50;background:rgba(20,18,16,.34);
  opacity:0;pointer-events:none;transition:opacity .28s;
  backdrop-filter:blur(1.5px);
}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:51;
  background:#FBFAF8;border-radius:26px 26px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.32,1);
  max-height:88%;overflow-y:auto;
  box-shadow:0 -8px 40px -12px rgba(0,0,0,.3);
}
.sheet.show{transform:translateY(0);}
.grabber{width:36px;height:5px;border-radius:3px;background:#DDD8D2;margin:0 auto 12px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-title{font-size:18px;font-weight:700;letter-spacing:-.3px;}
.sheet-cancel{
  border:none;background:none;font-family:inherit;font-size:15px;color:var(--ink-3);
  cursor:pointer;padding:4px 0;
}
.sheet-save{
  border:none;font-family:inherit;font-size:14.5px;font-weight:700;
  background:var(--pink);color:#fff;border-radius:12px;padding:9px 18px;cursor:pointer;
  transition:opacity .2s;
}
.sheet-save.off{opacity:.35;}
.field-label{font-size:12px;font-weight:650;color:var(--ink-3);letter-spacing:.6px;margin:16px 0 8px;}
.seg{
  display:flex;background:var(--seg);border-radius:12px;padding:3px;gap:2px;
}
.seg button{
  flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--ink-2);padding:9px 4px;border-radius:9px;cursor:pointer;transition:all .15s;
}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1.5px solid #E4DFD9;background:#fff;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--ink-2);padding:9px 15px;border-radius:12px;cursor:pointer;transition:all .15s;
}
.chip.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink);}
.chip.wide{flex:1;min-width:calc(50% - 4px);text-align:center;}
.stepper{
  display:flex;align-items:center;justify-content:space-between;
  background:#F0EDE9;border-radius:14px;padding:6px;
}
.stepper button{
  width:46px;height:42px;border:none;border-radius:11px;background:#fff;font-size:22px;
  color:var(--ink);font-family:inherit;cursor:pointer;line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.stepper button:active{background:#F5F3F0;}
.stepper .val{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px;}
.stepper .val small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:2px;}
.time-input{
  width:100%;border:1.5px solid #E4DFD9;background:#fff;border-radius:13px;
  padding:13px 14px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  -webkit-appearance:none;appearance:none;
}

/* ---------- 自定义快速按钮 ---------- */
.q-add{
  display:none;width:100%;margin-top:10px;padding:12px;
  border:1.5px dashed #D9D3CB;border-radius:16px;background:transparent;
  font-family:inherit;font-size:14px;font-weight:650;color:var(--ink-3);
  align-items:center;justify-content:center;gap:6px;cursor:pointer;
}
.q-add svg{width:16px;height:16px;}
.q-add:active{background:#F5F2EE;}
.q-edithint{display:none;font-size:11.5px;color:var(--ink-3);text-align:center;margin:10px 0 2px;line-height:1.5;}
.q-card.editing .q-add{display:flex;}
.q-card.editing .q-edithint{display:block;}
.q-card.editing .q-btn{background:#F3F0EC;box-shadow:inset 0 0 0 1.5px rgba(232,106,135,.18);}
.q-x{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:#E5484D;color:#fff;border:2px solid #fff;display:none;
  align-items:center;justify-content:center;font-size:13px;line-height:1;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:3;font-family:inherit;
}
.q-card.editing .q-x{display:flex;}
.q-btn{position:relative;}
.q-btn.dragging{opacity:.45;transform:scale(.96);}
.q-btn.over{box-shadow:0 0 0 2px var(--pink), 0 8px 18px -10px rgba(232,106,135,.8);}
.q-grid.drag-active .q-btn{cursor:grab;}
.q-empty{
  grid-column:1/-1;text-align:center;padding:20px 10px;font-size:12.5px;color:var(--ink-3);
  line-height:1.6;
}
/* 图标选择器 */
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.icon-opt{
  aspect-ratio:1;border-radius:12px;border:1.5px solid transparent;background:#F1EEEA;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);
  font-family:inherit;
}
.icon-opt svg{width:19px;height:19px;}
.icon-opt.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink);}
.color-grid{display:flex;gap:10px;margin-top:2px;}
.color-opt{
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}
.color-opt.on::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;
}
.text-input{
  width:100%;border:1.5px solid #E4DFD9;background:#fff;border-radius:13px;
  padding:12px 14px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  -webkit-appearance:none;
}
.text-input::placeholder{color:#BDB7AF;font-weight:500;}

/* ---------- 统计页 ---------- */
.stat-card{
  margin:0 18px 14px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;
}
.stat-t{font-size:14px;font-weight:700;margin:0 0 3px;letter-spacing:-.2px;}
.stat-s{font-size:12px;color:var(--ink-3);margin:0 0 14px;}
.bars{display:flex;align-items:flex-end;gap:6px;height:104px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar{
  width:100%;border-radius:7px 7px 3px 3px;background:#F2D3DB;min-height:3px;
  transition:height .5s cubic-bezier(.22,1,.32,1);position:relative;
}
.bar.has{background:linear-gradient(180deg,#F293AB,var(--pink));}
.bar-l{font-size:9.5px;color:var(--ink-3);font-weight:600;}
.bar-v{font-size:9.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;height:11px;}
.legend{display:flex;gap:16px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:500;}
.lg i{width:8px;height:8px;border-radius:3px;display:block;}
.rows .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px;}
.rows .row + .row{border-top:1px solid var(--line);}
.rows .k{color:var(--ink-2);}
.rows .v{font-weight:650;font-variant-numeric:tabular-nums;}
.range-seg{margin:0 18px 14px;}
.insight{
  margin:0 18px 14px;padding:14px 16px;border-radius:16px;
  background:linear-gradient(135deg,#FFF1F4,#FDE8EE);font-size:13px;line-height:1.65;color:#7A3B4B;
  border:1px solid rgba(232,106,135,.14);
}
.insight b{font-weight:700;}

/* ---------- 我的 ---------- */
.profile-head{display:flex;align-items:center;gap:14px;padding:8px 22px 0;}
.baby-avatar{
  width:64px;height:64px;border-radius:22px;flex:none;
  background:linear-gradient(160deg,#FFD8C2,#F3A98C);
  display:flex;align-items:center;justify-content:center;font-size:32px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
}
.profile-name{font-size:20px;font-weight:700;letter-spacing:-.4px;}
.profile-meta{font-size:13px;color:var(--ink-3);margin-top:3px;}
.list{margin:0 18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.list .li{
  display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative;font-size:15px;
}
.list .li + .li::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--line);}
.li-ic{
  width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;
}
.li-ic svg{width:17px;height:17px;}
.li-k{flex:1;color:var(--ink);font-weight:500;}
.li-v{color:var(--ink-3);font-size:13.5px;font-variant-numeric:tabular-nums;}
.li-val{font-size:15px;font-weight:650;}
.danger{color:#E5484D;font-weight:600;}

/* ---------- Toast ---------- */
.toast{
  position:absolute;left:50%;bottom:104px;transform:translate(-50%,14px);
  background:rgba(30,28,26,.92);color:#fff;font-size:13.5px;font-weight:600;
  padding:11px 20px;border-radius:14px;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .22s, transform .28s cubic-bezier(.22,1,.32,1);white-space:nowrap;
  backdrop-filter:blur(10px);display:flex;align-items:center;gap:7px;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 长按提示 ---------- */
.hint{
  text-align:center;font-size:11.5px;color:var(--ink-3);margin:22px 0 8px;line-height:1.6;
}

.fade{animation:fadeUp .34s cubic-bezier(.22,1,.32,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.press-ring{animation:ring .5s ease-out;}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(232,106,135,.45);}100%{box-shadow:0 0 0 12px rgba(232,106,135,0);}}

.demo-note{position:fixed;top:2px;left:4px;z-index:100;font:12px sans-serif;background:#fff9;border-radius:8px;padding:4px} @media(max-width:520px){.demo-note{top:auto;bottom:2px}}</style></head><body><div class="demo-note">示例体验 · 数据仅保留在本页 <button onclick="resetDemo()">恢复示例</button></div>

<script>
/* =========================================================
   数据层：页面内存，结构 [{id, type, side, amount, dirty, at}]
   type: 'feed'（亲喂） | 'bottle'（瓶喂） | 'diaper'（尿布）
   ========================================================= */
const KEY = 'babylog.v1';
const PKEY = 'babylog.profile.v1';

const memory = {};
const load = k => memory[k] || null;
const save = (k,v) => { memory[k] = JSON.parse(JSON.stringify(v)); };

const QKEY = 'babylog.quickbuttons.v1';
let records = load(KEY) || [];
let profile = load(PKEY) || { name:'小满', birth: isoDate(new Date()) };
let editMode = false;
let quickEdit = false;          // 快速记录按钮：自定义模式
let quickButtons = load(QKEY) || null;

/* 默认四个按钮（首次使用） */
const DEFAULT_BUTTONS = [
  { id:'b-left',   label:'左侧喂奶', sub:'记下当前时间', icon:'left',  color:'pink',  action:'feed-left'  },
  { id:'b-right',  label:'右侧喂奶', sub:'记下当前时间', icon:'right', color:'blue',  action:'feed-right' },
  { id:'b-bottle', label:'瓶喂',     sub:'记奶量',       icon:'bottle',color:'amber', action:'bottle'     },
  { id:'b-diaper', label:'换尿布',   sub:'尿 / 便 / 混合', icon:'diaper',color:'green', action:'diaper'     }
];
if (!Array.isArray(quickButtons) || !quickButtons.length) quickButtons = DEFAULT_BUTTONS.map(b=>Object.assign({},b));

/* 可选图标库 */
const ICONS = {
  left:  '<path d="M12 21c4.4 0 7-2.6 7-6 0-3.2-2.3-5-3.5-6.4-.9-1-1.5-1.9-1.5-3.1"/><path d="M12 21c-4.4 0-7-2.6-7-6 0-3.2 2.3-5 3.5-6.4C9.4 7.6 10 6.7 10 5.5"/><path d="m9.5 2.5 1 2 1-2"/>',
  right: '<path d="M12 21c4.4 0 7-2.6 7-6 0-3.2-2.3-5-3.5-6.4-.9-1-1.5-1.9-1.5-3.1"/><path d="M12 21c-4.4 0-7-2.6-7-6 0-3.2 2.3-5 3.5-6.4C9.4 7.6 10 6.7 10 5.5"/><path d="m14.5 2.5-1 2 1-2"/>',
  bottle:'<path d="M10 2h4"/><path d="M10.5 5h3l.6 2.2A5 5 0 0 1 18 12v6a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-6a5 5 0 0 1 3.9-4.8L10.5 5Z"/><path d="M6.5 12.5h11"/>',
  diaper:'<path d="M3 6.5c0-.8.7-1.5 1.5-1.5h15c.8 0 1.5.7 1.5 1.5v5.5a6.5 6.5 0 0 1-6.5 6.5h-5A6.5 6.5 0 0 1 3 12V6.5Z"/><path d="M9 5v3.2a2.3 2.3 0 0 1-4.6 0V5"/><path d="M19.6 5v3.2a2.3 2.3 0 0 1-4.6 0V5"/>',
  sleep: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>',
  poop:  '<path d="M12 21c4 0 6-2 6-4.5 0-2-1.5-3-1.5-4.5S18 9 18 7.5C18 5 15.5 3 12 3S6 5 6 7.5C6 9 7.5 10.5 7.5 12S6 14.5 6 16.5C6 19 8 21 12 21Z"/>',
  temp:  '<path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4.5 4.5 0 1 0 4 0Z"/><path d="M12 9v6"/>',
  pill:  '<rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="m9 15 6-6"/>',
  water: '<path d="M12 3s5 5.5 5 9a5 5 0 0 1-10 0c0-3.5 5-9 5-9Z"/>',
  sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  heart: '<path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19 10.7C19 15.6 12 20 12 20Z"/>',
  star:  '<path d="m12 3 2.8 5.9 6.2.8-4.5 4.3 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.7l6.2-.8L12 3Z"/>'
};
const COLORS = {
  pink:'#E86A87', blue:'#4A8FE0', amber:'#D99A3E',
  green:'#4CA977', purple:'#8A76D6', gray:'#7A736B'
};
let sheetType = null;
let draft = {};

/* ---------- 工具 ---------- */
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayKey(t){ const d = new Date(t); return isoDate(d); }
function pad(n){ return String(n).padStart(2,'0'); }
function hhmm(t){ const d = new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function daysBetween(a,b){ return Math.floor((startOfDay(b)-startOfDay(a))/86400000); }

/* 按月龄算「几个月几天」：按自然月推算，跨月不溢出 */
function ageParts(birthStr){
  const b = startOfDay(new Date(birthStr+'T00:00:00'));
  const now = startOfDay(new Date());
  if (now < b) return { total:0, months:0, days:0 };
  let months = (now.getFullYear()-b.getFullYear())*12 + (now.getMonth()-b.getMonth());
  // 若当月同日尚未来到，再减一个月
  const anchor = new Date(b); anchor.setMonth(b.getMonth()+months);
  if (anchor > now){
    months--;
    anchor.setMonth(b.getMonth()+months);
  }
  const days = Math.max(0, Math.round((now - anchor)/86400000));
  return { total: daysBetween(b, now)+1, months, days };
}

/* 月龄文案：不满 1 个月只显示天数，之后显示几个月几天 */
function ageText(birthStr){
  const a = ageParts(birthStr);
  if (a.total <= 0) return '还未出生';
  if (a.months < 1) return `${a.total} 天`;
  return a.days ? `${a.months} 个月 ${a.days} 天` : `${a.months} 个月`;
}
function shortAgo(ms){
  const m = Math.floor(ms/60000);
  if (m < 60) return m + '<small>分钟</small>';
  return (m/60).toFixed(1) + '<small>小时</small>';
}
function durText(min){
  min = Math.round(min);
  if (min < 60) return min+' 分钟';
  const h = Math.floor(min/60), m = min%60;
  return m ? `${h} 小时 ${m} 分` : `${h} 小时`;
}
function agoText(ms){
  const m = Math.floor(ms/60000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟`;
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h} 小时 ${r} 分` : `${h} 小时`;
}
const TYPE_NAME = { feed:'亲喂', bottle:'瓶喂', diaper:'换尿布', custom:'自定义' };
const SIDE_NAME = { left:'左侧', right:'右侧', both:'双侧', none:'' };
const DIRTY_NAME = { wet:'尿', dirty:'便', mixed:'尿+便' };

function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ---------- 记录写入 ---------- */
function addRecord(rec){
  records.push(Object.assign({ id: Date.now()+Math.random().toString(36).slice(2,6) }, rec));
  persist();
  renderAll();
  return records[records.length-1];
}
function persist(){
  records.sort((a,b)=> b.at - a.at);
  save(KEY, records);
  save(PKEY, profile);
  save(QKEY, quickButtons);
}

/* ---------- 一键喂奶：点一下即记录当前时间 ---------- */
function quickFeedTap(side, label){
  addRecord({ type:'feed', side, at: Date.now() });
  const name = label || (SIDE_NAME[side] + '喂奶');
  toast(`已记录 ${name} · ${hhmm(Date.now())}`);
  const btn = document.querySelector(`.q-btn[data-act="${side}"]`);
  if (btn){ btn.classList.add('press-ring'); setTimeout(()=>btn.classList.remove('press-ring'), 600); }
}

/* ---------- 渲染快速记录按钮 ---------- */
/* 该按钮最近一次记录：按动作类型 + 侧别/标签匹配 */
function lastForButton(b){
  const match = r => {
    if (b.action === 'feed-left')  return r.type === 'feed' && r.side === 'left';
    if (b.action === 'feed-right') return r.type === 'feed' && r.side === 'right';
    if (b.action === 'bottle')     return r.type === 'bottle';
    if (b.action === 'diaper')     return r.type === 'diaper';
    return r.type === 'custom' && r.label === b.label;
  };
  let newest = null;
  for (const r of records){ if (match(r) && (!newest || r.at > newest.at)) newest = r; }
  return newest;
}

/* 「多久之前」紧凑写法：刚刚 / 23分钟 / 1小时5分 / 2天3小时 */
function agoShort(ms){
  const m = Math.floor(ms/60000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m}分钟`;
  const h = Math.floor(m/60), rm = m%60;
  if (h < 24) return rm ? `${h}小时${rm}分` : `${h}小时`;
  const d = Math.floor(h/24), rh = h%24;
  return rh ? `${d}天${rh}小时` : `${d}天`;
}

function quickButtonHTML(b){
  const c = COLORS[b.color] || COLORS.pink;
  const last = lastForButton(b);
  const ago = last ? agoShort(Date.now() - last.at) : null;
  const agoHTML = ago
    ? `<div class="q-ago" data-ago="${b.id}">距上次 ${ago}</div>`
    : `<div class="q-ago none" data-ago="${b.id}">还没记录</div>`;
  return `<button class="q-btn" data-bid="${b.id}" style="border-left:3px solid ${c};">
    <span class="q-x" data-remove="${b.id}" title="删除">×</span>
    <div class="q-icon" style="background:${c}1F;color:${c};">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[b.icon]||ICONS.heart}</svg>
    </div>
    <div class="q-txt">
      <div class="q-name">${b.label}</div>
      ${agoHTML}
    </div>
  </button>`;
}

function renderQuick(){
  const grid = document.getElementById('quickGrid');
  grid.innerHTML = quickButtons.length
    ? quickButtons.map(quickButtonHTML).join('')
    : `<div class="q-empty">还没有按钮<br>点下方「添加记录按钮」新建一个</div>`;
  document.querySelector('.q-card').classList.toggle('editing', quickEdit);
  const t = document.getElementById('quickToggle');
  t.textContent = quickEdit ? '完成' : '自定义';
  t.style.color = quickEdit ? 'var(--ink-2)' : 'var(--pink)';
  document.getElementById('quickHint').style.display = quickEdit && quickButtons.length ? 'block' : 'none';
}

/* 触发按钮动作 */
function runQuick(id){
  const b = quickButtons.find(x=>x.id===id);
  if (!b) return;
  if (b.action === 'feed-left')  return quickFeedTap('left', b.label);
  if (b.action === 'feed-right') return quickFeedTap('right', b.label);
  if (b.action === 'bottle')     return openSheet('bottle');
  if (b.action === 'diaper')     return openSheet('diaper');
  if (b.action === 'custom')     return addCustomLog(b);
}

/* 自定义记录项：点一下记时间 */
function addCustomLog(b){
  addRecord({ type:'custom', label:b.label, icon:b.icon||'heart', color:b.color||'gray', at: Date.now() });
  toast(`已记录 ${b.label} · ${hhmm(Date.now())}`);
}

/* 自定义模式开关 */
document.getElementById('quickToggle').onclick = ()=>{
  quickEdit = !quickEdit;
  renderQuick();
  if (quickEdit) toast('拖动可排序 · 点 × 删除');
};

/* 点击 / 删除（委托在常驻的 .q-card 上） */
document.querySelector('.q-card').addEventListener('click', e=>{
  const rm = e.target.closest('[data-remove]');
  if (rm){
    e.stopPropagation();
    const id = rm.dataset.remove;
    const b = quickButtons.find(x=>x.id===id);
    quickButtons = quickButtons.filter(x=>x.id!==id);
    // 立即移除对应的概览计数格
    document.querySelectorAll(`.ov-item.extra[data-extra="${id}"]`).forEach(el=>el.remove());
    persist();
    renderQuick();
    renderOverview();
    toast(`已删除「${b ? b.label : ''}」`);
    return;
  }
  const btn = e.target.closest('.q-btn');
  if (!btn || quickEdit || dragJustEnded) return;
  runQuick(btn.dataset.bid);
});

/* ---------- 拖动排序（Pointer Events，鼠标/触摸通用） ---------- */
let dragEl = null, dragStart = null, dragMoved = false, dragJustEnded = false;

document.querySelector('.q-card').addEventListener('pointerdown', e=>{
  if (!quickEdit) return;
  const btn = e.target.closest('.q-btn');
  if (!btn || e.target.closest('[data-remove]')) return;
  dragEl = btn;
  dragMoved = false;
  dragStart = { x:e.clientX, y:e.clientY };
  btn.classList.add('dragging');
  btn.setPointerCapture?.(e.pointerId);
});

document.querySelector('.q-card').addEventListener('pointermove', e=>{
  if (!dragEl) return;
  if (!dragMoved){
    if (Math.abs(e.clientX-dragStart.x) < 5 && Math.abs(e.clientY-dragStart.y) < 5) return;
    dragMoved = true;
  }
  e.preventDefault();

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el && el.closest('.q-btn');
  document.querySelectorAll('.q-btn.over').forEach(x=>x.classList.remove('over'));
  if (target && target !== dragEl){
    target.classList.add('over');
    const r = target.getBoundingClientRect();
    const after = e.clientX > r.left + r.width/2;
    const from = quickButtons.findIndex(x=>x.id === dragEl.dataset.bid);
    if (from < 0) return;
    const item = quickButtons.splice(from,1)[0];
    const tIdx = quickButtons.findIndex(x=>x.id === target.dataset.bid);
    quickButtons.splice(tIdx + (after ? 1 : 0), 0, item);
    // 重建 DOM 并把 dragging 状态转移给新节点
    const grid = document.getElementById('quickGrid');
    grid.innerHTML = quickButtons.map(quickButtonHTML).join('');
    dragEl = grid.querySelector(`[data-bid="${item.id}"]`);
    if (dragEl) dragEl.classList.add('dragging');
  }
});

function renderOverview(){

  box.querySelectorAll('.ov-item.extra').forEach(el=>el.remove());
  const customs = quickButtons.filter(b=>b.action === 'custom');
  customs.forEach(b=>{
    const n = todays.filter(r=>r.type === 'custom' && r.label === b.label).length;
    const c = COLORS[b.color] || COLORS.pink;

    el.className = 'ov-item extra';

                    <div class="ov-lab"><i style="background:${c};" class="ov-dot"></i>${b.label}</div>`;

function renderTimeline(){
  const tl = document.getElementById('timeline');
  if (!records.length){
    tl.innerHTML = `<div class="empty fade">
      <svg class="empty-emoji" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;"><path d="M10 2h4"/><path d="M10.5 5h3l.6 2.2A5 5 0 0 1 18 12v6a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-6a5 5 0 0 1 3.9-4.8L10.5 5Z"/><path d="M6.5 12.5h11"/></svg>
      <div class="empty-t">今天还没有记录</div>
      <div class="empty-s">点上面的按钮，一键记下喂奶或换尿布的时间。</div>
    </div>`;
    return;
  }
  const groups = {};
  records.forEach(r => { (groups[dayKey(r.at)] = groups[dayKey(r.at)] || []).push(r); });
  const today = isoDate(new Date());
  const yest = isoDate(new Date(Date.now()-86400000));
  let html = '';
  Object.keys(groups).sort().reverse().forEach(k=>{
    const label = k === today ? '今天' : k === yest ? '昨天'
      : `${+k.slice(5,7)}月${+k.slice(8,10)}日`;
    const list = groups[k].slice().sort((a,b)=>b.at-a.at);
    html += `<div class="day-label">${label} · ${list.length} 条</div><div class="tl-group">`;
    html += list.map(entryHTML).join('');
    html += `</div>`;
  });
  tl.innerHTML = html;
  if (editMode) document.querySelectorAll('.entry').forEach(e=>e.classList.add('edit-mode'));
}

/* ---------- 表单 ---------- */

  const t = rec ? new Date(rec.at) : now;

  if (type === 'bottle'){
    draft = { amount: rec?.amount || 120, at: rec? rec.at : Date.now(), note: rec?.note || '' };
    document.getElementById('sheetTitle').textContent = isEdit ? '编辑瓶喂' : '记录瓶喂';
    document.getElementById('sheetBody').innerHTML = `
      <div class="field-label">奶量</div>
      <div class="stepper">
        <button onclick="stepAmt(-10)">−</button>
        <div class="val" id="amtVal">${draft.amount}<small>ml</small></div>
        <button onclick="stepAmt(10)">+</button>
      </div>
      <div class="field-label">时间</div>
      <input class="time-input" type="time" id="atInput" value="${pad(t.getHours())}:${pad(t.getMinutes())}">`;

  if (type === 'diaper'){
    draft = { dirty: rec?.dirty || 'wet', at: rec? rec.at : Date.now() };

    document.getElementById('sheetBody').innerHTML = `
      <div class="field-label">类型</div>
      <div class="chips">
        ${[['wet','尿了'],['dirty','便了'],['mixed','尿 + 便']].map(([k,label])=>
          `<button class="chip wide ${draft.dirty===k?'on':''}" data-dirty="${k}">${label}</button>`).join('')}
      </div>
      <div class="field-label">时间</div>
      <input class="time-input" type="time" id="atInput" value="${pad(t.getHours())}:${pad(t.getMinutes())}">`;
    document.querySelectorAll('[data-dirty]').forEach(b=>{
      b.onclick = ()=>{
        draft.dirty = b.dataset.dirty;
        document.querySelectorAll('[data-dirty]').forEach(x=>x.classList.toggle('on', x===b));
      };
    });
  }

  if (type === 'feed'){
    draft = { side: rec?.side || 'left', at: rec? rec.at : Date.now() };
    document.getElementById('sheetTitle').textContent = isEdit ? '编辑亲喂' : '记录亲喂';
    document.getElementById('sheetBody').innerHTML = `
      <div class="field-label">侧别</div>
      <div class="chips">
        ${[['left','左侧'],['right','右侧'],['both','双侧']].map(([k,label])=>
          `<button class="chip ${draft.side===k?'on':''}" data-side="${k}" style="flex:1;">${label}</button>`).join('')}

    });

  document.getElementById('sheetSave').dataset.editId = rec ? rec.id : '';
  document.getElementById('mask').classList.add('show');

function stepAmt(d){ draft.amount = Math.max(0, Math.min(400, draft.amount + d)); document.getElementById('amtVal').innerHTML = draft.amount + '<small>ml</small>'; }

function openEdit(id){

  if (r.type === 'custom'){ openCustomEdit(r); return; }
  openSheet(r.type, r);
}

  sheetType = null;
}

function saveSheet(){
  if (sheetType === 'button'){ saveButton(); return; }
  const inp = document.getElementById('atInput');
  const now = new Date();
  let at = draft.at;
  if (inp && inp.value){
    const [h,m] = inp.value.split(':').map(Number);
    const d = new Date(now); d.setHours(h,m,0,0);
    if (d.getTime() > now.getTime() + 60000) d.setDate(d.getDate()-1); // 未来时间视为昨天
    at = d.getTime();
  }
  const editId = document.getElementById('sheetSave').dataset.editId;

  const rec = Object.assign({ id: editId || (Date.now()+Math.random().toString(36).slice(2,6)) }, draft, { at,
    type: sheetType });

  if (editId){
    const i = records.findIndex(x=>x.id === editId);
    records[i] = rec;
    toast('已更新');
  } else {
    records.push(rec);
    const label = sheetType === 'diaper' ? `换尿布 · ${DIRTY_NAME[rec.dirty]}`
      : sheetType === 'bottle' ? `瓶喂 · ${rec.amount} ml` : `${SIDE_NAME[rec.side]}喂奶`;
    toast('✓ 已记录 ' + label);
  }
  persist(); closeSheet(); renderAll();
}

/* ---------- 统计 ---------- */
function renderStats(){
  const today = new Date();
  const days = [];
  for (let i=6;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = isoDate(d);
    const list = records.filter(r=>dayKey(r.at)===k);
    days.push({
      k, d,
      feed: list.filter(r=>(r.type==='feed' || r.type==='bottle')).length,
      bottle: list.filter(r=>r.type==='bottle').length,
      diaper: list.filter(r=>r.type==='diaper').length,
      ml: list.reduce((s,r)=>s+(r.amount||0),0)
    });
  }
  const max = Math.max(1, ...days.map(d=>d.feed));
  document.getElementById('bars').innerHTML = days.map(d=>{
    const h = Math.max(3, Math.round(d.feed / max * 82));
    return `<div class="bar-wrap">
      <div class="bar-v">${d.feed||''}</div>
      <div class="bar ${d.feed?'has':''}" style="height:${h}px"></div>
      <div class="bar-l">${['日','一','二','三','四','五','六'][d.d.getDay()]}</div>
    </div>`;
  }).join('');

  const t = days[6];
  const feeds = records.filter(r=>dayKey(r.at)===t.k && (r.type==='feed' || r.type==='bottle'));
  const todaysCustom = label => records.filter(r=>dayKey(r.at)===t.k && r.type==='custom' && r.label===label);
  const gaps = [];
  for (let i=0;i<feeds.length-1;i++) gaps.push((feeds[i].at - feeds[i+1].at)/60000);
  const avgGapToday = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : 0;
  const leftN = feeds.filter(r=>r.type==='feed'&&r.side==='left').length;
  const rightN = feeds.filter(r=>r.type==='feed'&&r.side==='right').length;
  document.getElementById('todayRows').innerHTML = `
    <div class="row"><span class="k">喂奶次数</span><span class="v">${t.feed} 次</span></div>
    <div class="row"><span class="k">左侧 / 右侧</span><span class="v">${leftN} / ${rightN}</span></div>
    <div class="row"><span class="k">瓶喂次数</span><span class="v">${t.bottle} 次</span></div>
    <div class="row"><span class="k">瓶喂奶量</span><span class="v">${t.ml} ml</span></div>
    <div class="row"><span class="k">平均喂养间隔</span><span class="v">${avgGapToday ? durText(avgGapToday) : '—'}</span></div>
    <div class="row"><span class="k">换尿布</span><span class="v">${t.diaper} 次</span></div>` +
    quickButtons.filter(b=>b.action==='custom').map(b=>{
      const n = todaysCustom(b.label).length;
      return `<div class="row"><span class="k">${b.label}</span><span class="v">${n} 次</span></div>`;
    }).join('');

  const weekFeeds = days.reduce((s,d)=>s+d.feed,0);
  const avg = (weekFeeds/7).toFixed(1);
  document.getElementById('statSub').textContent = `平均每天 ${avg} 次喂奶 · 共 ${records.length} 条记录`;

  let insight = '还没有足够的数据。多记几天，这里会显示喂养规律。';
  if (weekFeeds > 0){
    const recFeeds = feeds.slice().sort((a,b)=>b.at-a.at);
    let gap = 0, gapN = 0;
    for (let i=0;i<recFeeds.length-1;i++){
      gap += (recFeeds[i].at - recFeeds[i+1].at)/60000; gapN++;
    }
    const avgGap = gapN ? Math.round(gap/gapN) : 0;
    insight = `最近 7 天平均每天喂奶 <b>${avg} 次</b>，今日最多间隔约 <b>${
      gaps.length ? durText(Math.round(Math.max(...gaps))) : '—'}</b>。` +
      ` 尿布 ${t.diaper} 次。`;
  }
  document.getElementById('insight').innerHTML = insight;
}

function exportData(){ toast('安装后可导出 CSV'); return; 
  if (!records.length) return toast('还没有可导出的记录');
  const rows = [['时间','类型','侧别','奶量(ml)','尿布类型']];
  records.slice().sort((a,b)=>a.at-b.at).forEach(r=>{
    const d = new Date(r.at);
    rows.push([`${isoDate(d)} ${hhmm(r.at)}`, r.type==='custom'?(r.label||'自定义'):TYPE_NAME[r.type],
      r.type==='feed'?(SIDE_NAME[r.side]||''):'', r.amount||'', r.dirty?DIRTY_NAME[r.dirty]:'']);
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `喂养记录_${isoDate(new Date())}.csv`;
  a.click();
  toast('已导出 CSV');
}

function clearAll(){ records=[]; persist(); renderAll(); toast('已清空'); return;
  if (!records.length) return toast('没有记录');
  
  records = []; persist(); renderAll(); toast('已清空');
}

}

/* ---------- 页面切换 ---------- */
function switchTab(page){
  ['home','stats','me'].forEach(p=>{
    document.getElementById('screen-'+p).style.display = p===page ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.page===page));
  if (page==='stats') renderStats();
  if (page==='me') renderMe();
  document.getElementById('screen-'+page).scrollTop = 0;
}

function renderAll(){
  renderHeader(); renderOverview(); renderQuick(); renderTimeline();
  if (document.getElementById('screen-stats').style.display !== 'none') renderStats();
  if (document.getElementById('screen-me').style.display !== 'none') renderMe();
}

function tick(){
  const n = new Date();
  refreshAgo();
}

/* 只更新「距上次」文字，不重建按钮节点 */
function refreshAgo(){
  document.querySelectorAll('.q-ago[data-ago]').forEach(el=>{
    const b = quickButtons.find(x=>x.id === el.dataset.ago);
    if (!b) return;
    const last = lastForButton(b);
    el.textContent = last ? '距上次 ' + agoShort(Date.now() - last.at) : '还没记录';
    el.classList.toggle('none', !last);
  });
}
