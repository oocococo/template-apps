

<div class="phone">
  <div class="dynamic-island"></div>


  <!-- ============ 首页 ============ -->
  <main class="screen" id="screen-home">
    <div class="hero">
      <div class="hero-row">
        <div>
          <div class="hero-date" id="heroDate">10月21日 周三</div>
          <h1 class="hero-title" id="heroGreet">早上好，小满</h1>
        </div>
        <div class="avatar" style="font-weight:700;color:#8A4B2E;">满</div>
      </div>
      <p class="hero-sub" id="heroSub">距上次喂奶 1 小时 20 分</p>
    </div>

    <div class="overview" id="overview">
      <div class="ov-item">
        <div class="ov-val" id="ovFeed">—</div>
        <div class="ov-lab">今日喂奶</div>
      </div>
      <div class="ov-item">
        <div class="ov-val" id="ovDiaper">—</div>
        <div class="ov-lab">今日尿布</div>
      </div>
      <div class="ov-item">
        <div class="ov-val" id="ovTotal">—</div>
        <div class="ov-lab">距上次喂奶</div>
      </div>
    </div>

    <div id="timerSlot"></div>

    <div class="section-head">
      <div class="section-title">快速记录</div>
      <div class="section-note" id="quickToggle" style="cursor:pointer;font-weight:600;color:var(--pink);">自定义</div>
    </div>
    <div class="quick">
      <div class="q-card">
        <div class="q-grid" id="quickGrid"></div>
        <button class="q-add" id="quickAdd" onclick="openButtonForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加记录按钮
        </button>
        <div class="q-edithint" id="quickHint">拖动按钮可排序 · 点右上角叉号删除 · 完成后点「完成」</div>
      </div>
    </div>

    <div class="section-head">
      <div class="section-title">记录</div>
      <div class="section-note" id="editToggle" style="cursor:pointer;font-weight:600;">编辑</div>
    </div>
    <div class="timeline" id="timeline"></div>
    <p class="hint">点击记录可修改时间 · 开启「编辑」后长按删除</p>
  </main>

  <!-- ============ 统计页 ============ -->
  <main class="screen" id="screen-stats" style="display:none;">
    <div class="hero" style="padding-top:8px;">
      <div class="hero-date">最近 7 天</div>
      <h1 class="hero-title">喂养统计</h1>
      <p class="hero-sub" id="statSub">—</p>
    </div>

    <div class="section-head" style="margin-top:18px;">
      <div class="section-title">每日喂奶次数</div>
    </div>
    <div class="stat-card">
      <div class="bars" id="bars"></div>
      <div class="legend">
        <div class="lg"><i style="background:var(--pink);"></i>亲喂</div>
        <div class="lg"><i style="background:var(--amber);"></i>瓶喂</div>
        <div class="lg"><i style="background:var(--green);"></i>尿布</div>
      </div>
    </div>

    <div class="section-head">
      <div class="section-title">今日概览</div>
    </div>
    <div class="stat-card rows" id="todayRows"></div>

    <div class="insight" id="insight">—</div>
  </main>

  <!-- ============ 我的 ============ -->
  <main class="screen" id="screen-me" style="display:none;">
    <div class="profile-head">
      <div class="baby-avatar" style="font-weight:700;color:#8A4B2E;">满</div>
      <div>
        <div class="profile-name" id="meName">小满</div>
        <div class="profile-meta" id="meMeta">出生第 1 天 · 记录 0 条</div>
      </div>
    </div>

    <div class="section-head" style="margin-top:24px;">
      <div class="section-title">宝宝信息</div>
    </div>
    <div class="list">
      <div class="li" onclick="editProfile('name')">
        <div class="li-ic" style="background:var(--pink-soft);color:var(--pink);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20c0-3.3 3.6-5.5 8-5.5s8 2.2 8 5.5"/><circle cx="12" cy="7.5" r="3.8"/></svg>
        </div>
        <div class="li-k">宝宝名字</div>
        <div class="li-val" id="liName">小满</div>
      </div>
      <div class="li">
        <div class="li-ic" style="background:var(--amber-soft);color:var(--amber);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg>
        </div>
        <div class="li-k">出生日期</div>
        <input type="date" class="li-v" id="liBirth" style="border:none;background:none;font-family:inherit;text-align:right;color:var(--ink-3);">
      </div>
      <div class="li">
        <div class="li-ic" style="background:var(--blue-soft);color:var(--blue);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>
        </div>
        <div class="li-k">月龄</div>
        <div class="li-val" id="liAge">—</div>
      </div>
    </div>

    <div class="section-head">
      <div class="section-title">数据</div>
    </div>
    <div class="list">
      <div class="li" onclick="exportData()">
        <div class="li-ic" style="background:var(--blue-soft);color:var(--blue);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/></svg>
        </div>
        <div class="li-k">导出为 CSV</div>
        <div class="li-v">›</div>
      </div>
      <div class="li" onclick="loadDemo()">
        <div class="li-ic" style="background:#F1EFEC;color:#7A736B;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.6 5.9"/><path d="M4 21v-5h5"/></svg>
        </div>
        <div class="li-k">载入示例数据</div>
        <div class="li-v">体验用</div>
      </div>
      <div class="li" onclick="clearAll()">
        <div class="li-ic" style="background:#FDECEC;color:#E5484D;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 12.2A2 2 0 0 0 9.3 21h5.4a2 2 0 0 0 2-1.8L17.5 7"/></svg>
        </div>
        <div class="li-k danger">清空全部记录</div>
      </div>
    </div>
    <p class="hint">记录和设置保存在云端数据库。</p>
  </main>

  <!-- ============ 底部标签栏 ============ -->
  <nav class="tabbar">
    <button class="tab on" data-page="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.2V20h13V9.2"/><path d="M9.8 20v-5.5h4.4V20"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-page="stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-page="me" onclick="switchTab('me')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-3.6 3.4-5.8 7.5-5.8s7.5 2.2 7.5 5.8"/></svg>
      <span>我的</span>
    </button>
  </nav>
  <div class="home-indicator"></div>

  <!-- ============ 记录表单 ============ -->
  <div class="sheet-mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="sheet-cancel" onclick="closeSheet()">取消</button>
      <div class="sheet-title" id="sheetTitle">记录</div>
      <button class="sheet-save" id="sheetSave" onclick="saveSheet()">保存</button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>
