<p id="help">

<span>\u6761\u4E2D\u5706\u5708</span> <b>\u70B9\u4E00\u4E0B\u5C31\u8F6C\u4E2D\u95F4\u5C42\uFF0C\u56DB\u4E2A\u5706\u5708\u4E92\u4E0D\u76F8\u540C</b>\uFF1A\u4E0A\u6761 = <b>M</b>\u3001\u4E0B\u6761 = <b>M\u2032</b>\u3001
  \u5DE6\u6761 = <b>E</b>\u3001\u53F3\u6761 = <b>E\u2032</b>\uFF08\u4E2D\u5FC3\u6807\u7684\u5C31\u662F\u70B9\u51FA\u6765\u7684\u90A3\u4E00\u624B\uFF09\uFF1B\u6309\u4F4F\u51FA\u7BAD\u5934\uFF0C

<span>\u56DB\u89D2\u6309\u94AE</span> \u4E0A\u6392\u8F6C<b>\u80CC\u5411\u5C4F\u5E55</b>\u90A3\u4E00\u5C42 <b>B / B\u2032</b>\u3000\xB7\u3000\u4E0B\u6392\u8F6C<b>\u671D\u7740\u5C4F\u5E55</b>\u90A3\u4E00\u5C42 <b>F / F\u2032</b>

  \u6574\u4F53\u8F6C\u53EA\u6362\u89C6\u89D2\u3001\u4E0D\u8BA1\u6B65\uFF1B<b>S</b> \u662F\u7ED5\u89C6\u7EBF\u65B9\u5411\u7684\u90A3\u7247\u4E2D\u5C42\uFF0C\u5C4F\u5E55\u4E0A\u6CA1\u6709\u6ED1\u52A8\u65B9\u5411\uFF0C\u53EA\u80FD\u70B9
  \uFF08\u60F3\u7528\u624B\u52BF\u505A\uFF0C\u5148\u6309\u4E00\u4E0B y\uFF0C\u8F6C\u8FC7\u53BB\u540E\u5B83\u5C31\u53D8\u6210\u67D0\u6761\u4E0A\u7684\u5706\u5708\uFF09<br/>
<span>\u8BB0\u53F7</span> \u63A7\u4EF6\u4E0A\u6807\u7684\u662F\u6807\u51C6 Singmaster \u8BB0\u53F7\uFF08U D L R F B + M E S\uFF0C\u9006\u8F6C\u52A0 \u2032\uFF09\uFF0C
  \u9876\u680F\u300C\u6700\u8FD1\u300D\u663E\u793A\u521A\u505A\u7684\u90A3\u4E00\u6B65\u3002<b>\u89C6\u89D2\u4E00\u8F6C\uFF0C\u6807\u7B7E\u4F1A\u8DDF\u7740\u53D8</b> \u2014\u2014 \u56E0\u4E3A\u8F6C\u7684\u662F\u300C\u5F53\u524D\u89C6\u89D2\u4E0B\u90A3\u4E00\u5C42\u300D\uFF0C
  \u6BD4\u5982\u8F6C\u5230\u4FA7\u9762\u540E\uFF0C\u4E0A\u6761\u8F6C\u7684\u53EF\u80FD\u662F R \u9762<br/>
<span>\u952E\u76D8</span> U D L R F B + M E S + \u6574\u4F53\u8F6C x y z\uFF0CShift \u53CD\u5411\u3002\u8BB0\u53F7\u6309<b>\u63E1\u6301</b>\u89E3\u91CA\uFF1A
  \u6574\u8F6C x / y / z \u4E4B\u540E\u518D\u6572 R\uFF0C\u8F6C\u7684\u662F<b>\u65B0\u63E1\u6301\u4E0B\u7684\u53F3\u9762</b>\uFF08\u548C\u516C\u5F0F\u91CC\u5199\u7684\u4E00\u6837 \u2014\u2014 y \u4E4B\u540E\u7684 R \u5176\u5B9E\u5C31\u662F\u539F\u6765\u7684 B \u9762\uFF09\uFF1B
  \u62D6\u52A8\u5C4F\u5E55\u6362\u89C6\u89D2<b>\u4E0D\u4F1A</b>\u6539\u53D8\u8BB0\u53F7\u542B\u4E49\u3002\u63A7\u5236\u6761 / \u56DB\u89D2\u5219\u59CB\u7EC8\u662F\u300C\u5C4F\u5E55\u4E0A\u90A3\u4E00\u5C42\u300D<br/>
<span>\u516C\u5F0F\u8F93\u5165</span> \u652F\u6301 <b>U D L R F B M E S</b>\u3001\u6574\u4F53\u8F6C <b>x y z</b>\u3001\u5BBD\u8F6C <b>Rw Uw Fw Lw Dw Bw</b>\uFF0C
  \u53EF\u5E26 <b>2</b>\uFF08180\xB0\uFF09\u4E0E <b>\u2032</b>\uFF08\u9006\u8F6C\uFF0C<i>R2\u2032</i> \u4E0E <i>R\u20322</i> \u90FD\u8BA4\uFF09\u3002\u5C0F\u5199 r/u/f/l/d/b \u5373\u5BBD\u8F6C\uFF08r=Rw\uFF09\uFF0C\u5355\u5C42\u8BF7\u5199\u5927\u5199\uFF1B
  \u7A7A\u683C\u3001\u4E2D\u82F1\u6587\u9017\u53F7 / \u987F\u53F7 / \u5206\u53F7\u3001\u4EE5\u53CA / | . - + \u90FD\u4F5C\u5206\u9694\u7B26\uFF0C\u70B9\u300C\u6267\u884C\u300D\u6309\u516C\u5F0F\u8F6C\u52A8\u3002\u6574\u8F6C\u53EA\u6362\u89C6\u89D2\u4E0E\u63E1\u6301\u3001\u4E0D\u8BA1\u6B65\u6570\uFF1B
  \u5BBD\u8F6C = \u4E24\u5C42\u4E00\u8D77\u8F6C\uFF08<i>Rw</i> \u5C31\u662F <i>R</i> + <i>M\u2032</i>\uFF09\uFF0C\u7B97 1 \u6B65\uFF1B\u53EA\u6709\u516D\u4E2A\u9762\u5C42\u6709\u5BBD\u8F6C\u5199\u6CD5
   \uFF08<i>Rw\u2026Bw</i> \u6216\u5C0F\u5199 <i>r/u/f/l/d/b</i>\uFF09\uFF0C\u4E2D\u5C42 <i>Mw / Ew / Sw</i> \u4E0E\u5168\u89D2\u62EC\u53F7 <i>\uFF08\uFF09</i> \u90FD\u4E0D\u8BA4\u3001\u4F1A\u62A5\u300C\u65E0\u6CD5\u8BC6\u522B\u300D\uFF0C
   \u91CD\u590D / \u62EC\u53F7\u8BB0\u6CD5\u8BF7\u7528\u534A\u89D2\u62EC\u53F7\uFF1A<i>(R U R\u2032 U\u2032)3</i> = \u62EC\u53F7\u5185\u91CD\u590D 3 \u904D\uFF0C\u8BB0\u53F7\u540E\u7684\u6570\u5B57\uFF08\u4EFB\u610F\u4F4D\u6570\u3001\u4E0A\u9650 99\uFF09\u4E3A\u91CD\u590D\u6B21\u6570\uFF0C

   \u53E6\u6CE8\u610F<b>\u516C\u5F0F\u8F93\u5165\u91CC\u5C0F\u5199 = \u5BBD\u8F6C</b>\uFF0C\u4E0E\u952E\u76D8\u662F\u4E24\u5957\u8BED\u4E49\uFF1A\u952E\u76D8\u6572 r \u548C R \u90FD\u8F6C R\uFF08Shift \u624D\u53CD\u5411\uFF09<br/>
<span>\u8BA1\u65F6</span> <b>\u81EA\u52A8\u8BA1\u65F6</b>\uFF1A\u8D70\u7B2C\u4E00\u6B65\u81EA\u52A8\u5F00\u59CB\u3001\u5B8C\u5168\u590D\u539F\u81EA\u52A8\u505C\u6B62\uFF0C\u671F\u95F4\u4E0D\u80FD\u6682\u505C\u3001\u4E0D\u80FD\u624B\u52A8\u590D\u4F4D\uFF08\u53EA\u6709\u300C\u6253\u4E71 / \u590D\u539F\u300D\u4F1A\u6E05\u96F6\uFF09
  \xB7 <b>\u624B\u52A8\u8BA1\u65F6</b>\uFF1A\u5168\u90E8\u7531\u300C\u5F00\u59CB / \u6682\u505C / \u8BA1\u65F6\u590D\u4F4D\u300D\u63A7\u5236\uFF0C\u4E0D\u4F1A\u81EA\u52A8\u8D77\u505C<br/>
<span>\u516C\u5F0F\u8BB0\u5F55</span> \u300C\u6253\u4E71\u300D\u663E\u793A\u6253\u4E71\u5E8F\u5217\uFF08<b>\u4E0D\u8BA1\u5165\u6B65\u6570</b>\uFF09\uFF0C\u300C\u8D70\u6CD5\u300D\u8BB0\u5F55\u4F60\u7684\u6BCF\u4E00\u6B65\uFF08\u6574\u8F6C x/y/z \u4E5F\u8BB0\u3001\u4F46\u4E0D\u8BA1\u6B65\uFF09\uFF0C

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{--csz:54px;--bth:52px;--ksz:42px;--bin:66px}

#cube{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.cubie{position:absolute;width:var(--cubie);height:var(--cubie);
  left:calc(var(--cubie) / -2);top:calc(var(--cubie) / -2);
  transform-style:preserve-3d;will-change:transform}
.face{position:absolute;left:0;top:0;width:var(--cubie);height:var(--cubie);
  background:#15181d;border-radius:5px;overflow:hidden;
  transition:box-shadow .18s ease}
.face i{position:absolute;inset:7%;border-radius:22%;display:block;

.bar{position:absolute;z-index:3;border-radius:24px;touch-action:none;

  transition:opacity .13s ease,transform .13s ease}

.knob .dn{left:50%;bottom:calc(-1 * (var(--ksz) / 2 + 10px));transform:translate(-50%,-7px)}

.knob.act .rt{transform:translate(0,-50%)}

body.notabOpen #notab{display:block}
#notab .nt{color:#a8b0c4;font-weight:600;margin-bottom:5px}
#notab .ng{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px 10px}
#notab .nc{display:flex;gap:7px;align-items:baseline}
#notab .nc i{font-style:normal;font-weight:700;color:#A6E9D2;flex:none;min-width:32px;font-size:12.5px}
#notab .nn{margin-top:7px}
#notab .nn i{font-style:normal;font-weight:700;color:#A6E9D2;letter-spacing:.3px}

#trbox{display:flex;width:100%;max-width:460px;margin:0 auto;text-align:left;
  font-size:12px;line-height:1.7;color:#cdd5e3;
  background:rgba(255,255,255,.05);border:1px solid rgba(125,230,195,.30);
  border-radius:11px;padding:8px 12px;
  flex-direction:column}

#seqScram,#seqMove{cursor:pointer}
#trbox .th{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#trbox .th b{color:#A6E9D2;font-weight:700;font-size:12.5px;letter-spacing:.3px;flex:none}
#trbox .th .tcopy{margin-left:auto;flex:none;font-size:11px;padding:3px 9px;border-radius:7px; color:#A6E9D2;background:rgba(125,230,195,.12);border:1px solid rgba(125,230,195,.35); cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#trbox .th .tcopy:active{background:rgba(125,230,195,.25)}
#trbox .th .tcopy.done{color:#9fe6c4;background:rgba(125,230,195,.22)}
#trbox .tlist{max-height:36vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#trbox .tline{display:flex;gap:8px;align-items:baseline;padding:1px 0}
#trbox .tline i{font-style:normal;color:#7b8399;flex:none;min-width:26px;text-align:right;
  font-variant-numeric:tabular-nums}
#trbox .tline b{font-style:normal;font-weight:700;color:#A6E9D2;flex:none}
#trbox .tnote{margin-top:7px;color:#8b93a7;font-size:11px;line-height:1.6}


#whbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:8px;z-index:30;
  width:min(460px, calc(100vw - 20px));text-align:center;
  background:rgba(16,20,26,.97);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 30px rgba(0,0,0,.55);border-radius:11px;padding:34px 11px 10px;
  font-size:11.5px;line-height:1.7;color:#7b8399}
body.whbarOpen #whbar{display:block}

#whbar .wclose{position:absolute;right:5px;top:4px;width:30px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;color:#8b93a7;cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent}
#whbar .wclose.act,#whbar .wclose:active{background:rgba(255,255,255,.12);color:#e6e8ee}
#whbar .wh{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#whbar .wh+.wh{margin-top:7px}
#whbar .wt{display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;height:34px;padding:0 9px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);
  color:#bfe8d8;font-size:14px;font-weight:700;letter-spacing:.5px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#whbar .wt.act{background:rgba(125,230,195,.26);border-color:#7DE6C3;color:#eafff8}
#whbar .wl{font-size:11px;color:#8b93a7;margin-right:2px;align-self:center}
#whbar .wn{margin-top:7px;font-size:11.5px;line-height:1.7;color:#7b8399}
#whbar .wn i{font-style:normal;font-weight:700;color:#A6E9D2}
#help span{color:#a8b0c4}
#help b{color:#a8b0c4;font-weight:600}

@media (max-height:860px){
  body{padding:6px 10px 8px;gap:5px}
  h1{font-size:15px}
  .sub{display:none}
  #help{font-size:10.5px;line-height:1.55;display:none}
  body.helpOpen #help{display:block}
  #hud{font-size:11.5px;gap:14px}
}

#app{display:contents}
#personal-library{width:min(460px,100%);flex:none;font-size:12px;color:#a8b0c4;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 11px;margin-bottom:8px}
#personal-library summary{cursor:pointer;color:#bfe8d8}
.library-content{padding-top:8px;user-select:text;-webkit-user-select:text}
#personal-library input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#e6e8ee;padding:7px;border-radius:7px;margin:4px 0 8px}
#personal-library h2{font-size:12px;color:#a8b0c4;font-weight:600;margin:10px 0 4px}
#personal-library button{font:inherit;padding:5px 8px;border-radius:7px;color:#bfe8d8;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);cursor:pointer}
#personal-library button:disabled{opacity:.45;cursor:wait}
.library-actions,#formula-list{display:flex;flex-wrap:wrap;gap:6px}
#session-list{overflow-wrap:anywhere}
