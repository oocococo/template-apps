<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#16181d;
    --muted:#8a8f9c;
    --line:#eceef2;
    --accent:#4f46e5;
    --accent-soft:#eceafe;
    --danger:#e5484d;
    --shadow:0 1px 2px rgba(16,18,24,.04), 0 10px 30px rgba(16,18,24,.07);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1116;
      --card:#171a21;
      --text:#f2f4f8;
      --muted:#8b93a3;
      --line:#232732;
      --accent:#8b80ff;
      --accent-soft:#23243a;
      --danger:#ff6369;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}
  .shell{width:100%;max-width:560px;margin:0 auto;}
  .view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

  /* ---------- 登录 ---------- */
  #loginView{
    padding:calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px);
    justify-content:center;
  }
  .login-card{
    background:var(--card);
    border-radius:24px;
    padding:28px 22px 22px;
    box-shadow:var(--shadow);
  }
  .brand{text-align:center;margin-bottom:22px;}
  .brand-mark{
    width:54px;height:54px;margin:0 auto 14px;border-radius:17px;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(79,70,229,.28);
  }
  .brand-mark svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .brand h1{font-size:22px;margin:0 0 6px;letter-spacing:.2px;}
  .brand .sub{margin:0;color:var(--muted);font-size:13.5px;}

  .tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px;}
  .tab{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:9px 0;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
    transition:background .18s,color .18s;
  }
  .tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .field{margin-bottom:12px;}
  .field input,.code-row input{
    width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);
    border-radius:13px;padding:14px 15px;font-size:16px;outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  .field input:focus,.code-row input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field input::placeholder,.code-row input::placeholder{color:var(--muted);}
  .field-error{color:var(--danger);font-size:12.5px;margin:-6px 0 10px;min-height:0;}
  .field-error:empty{display:none;}
  .code-row{display:flex;gap:9px;margin-bottom:16px;}
  .code-row input{flex:1;min-width:0;letter-spacing:2px;}
  .btn-ghost{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--accent);
    border-radius:13px;padding:0 14px;font-size:13.5px;font-weight:600;cursor:pointer;
    white-space:nowrap;transition:opacity .18s;
  }
  .btn-ghost:disabled{opacity:.45;cursor:default;}
  .btn-primary{
    width:100%;border:0;border-radius:14px;padding:15px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:650;cursor:pointer;
    transition:transform .12s,opacity .18s;
  }
  .btn-primary:active{transform:scale(.985);}
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .btn-wechat{
    width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-wechat svg{width:19px;height:19px;fill:#07c160;}
  .legal{color:var(--muted);font-size:12px;text-align:center;margin:16px 0 0;line-height:1.6;}
  .form-msg{
    margin:12px 0 0;font-size:13px;text-align:center;color:var(--danger);
    min-height:0;
  }
  .form-msg:empty{display:none;}
  .form-msg.ok{color:var(--accent);}

  /* ---------- 主视图 ---------- */
  #appView{padding:0 0 calc(104px + env(safe-area-inset-bottom));}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 4px;
  }
  .who{display:flex;align-items:center;gap:11px;min-width:0;}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .hi{font-size:15.5px;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .date{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .icon-btn{
    border:0;background:transparent;color:var(--muted);font-size:13px;
    padding:8px 4px 8px 10px;cursor:pointer;
  }

  .progress-card{margin:16px 20px 0;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;}
  .remaining{font-size:19px;font-weight:700;letter-spacing:.2px;}
  .remaining .num{color:var(--accent);}
  .total{font-size:12.5px;color:var(--muted);}
  .bar{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;}
  .bar-fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .32s cubic-bezier(.2,.7,.3,1);}

  .carry{
    margin:12px 20px 0;background:var(--accent-soft);border-radius:14px;
    padding:11px 14px;display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text);
  }
  .carry span{flex:1;min-width:0;}
  .carry button{
    border:0;background:var(--accent);color:#fff;border-radius:9px;
    padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }

  .list{list-style:none;margin:14px 20px 0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:15px;padding:14px 14px 14px 15px;
    box-shadow:0 1px 2px rgba(16,18,24,.04);
    transition:opacity .2s, transform .2s;
  }
  .item.enter{animation:pop .22s ease both;}
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .item.leaving{opacity:0;transform:translateX(14px);}
  .item.pending{opacity:.55;}
  .check{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    border:1.8px solid var(--line);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .check:active{transform:scale(.9);}
  .check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .16s;}
  .item.done .check{background:var(--accent);border-color:var(--accent);}
  .item.done .check svg{opacity:1;}
  .title{
    flex:1;min-width:0;font-size:15.5px;line-height:1.45;
    word-break:break-word;overflow-wrap:anywhere;
    transition:color .2s;
  }
  .item.done .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;}
  .del{
    flex:0 0 auto;border:0;background:transparent;color:var(--muted);
    width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s,color .18s;
  }
  .del:hover,.del:focus-visible{background:var(--bg);color:var(--danger);}

  .empty{text-align:center;padding:52px 24px;color:var(--muted);}
  .empty-mark{font-size:30px;margin-bottom:12px;opacity:.9;}
  .empty p{margin:0 0 4px;font-size:15px;color:var(--text);font-weight:600;}
  .empty span{font-size:13px;}

  .composer{
    position:fixed;left:0;right:0;bottom:0;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(to top,var(--bg) 62%,rgba(0,0,0,0));
    z-index:20;
  }
  .composer-inner{
    max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center;
    background:var(--card);border-radius:16px;padding:7px 7px 7px 16px;
    box-shadow:0 2px 8px rgba(16,18,24,.06), 0 8px 26px rgba(16,18,24,.09);
  }
  .composer input{
    flex:1;min-width:0;border:0;background:transparent;color:var(--text);
    font-size:16px;padding:11px 0;outline:none;
  }
  .composer input::placeholder{color:var(--muted);}
  .add-btn{
    flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:0;
    background:var(--accent);color:#fff;font-size:22px;font-weight:400;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,opacity .18s;
  }
  .add-btn:active{transform:scale(.94);}
  .add-btn:disabled{opacity:.35;cursor:default;}
  .shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);
    transform:translateX(-50%) translateY(10px);
    background:rgba(22,24,29,.94);color:#fff;font-size:13.5px;
    padding:10px 18px;border-radius:11px;max-width:82vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:40;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .skeleton{padding:0;}
  .sk-item{height:56px;border-radius:15px;background:var(--card);margin-bottom:9px;opacity:.6;}
</style></head><body><section id="appView" class="view shell">
  <header class="topbar">
    <div class="who">
      <div class="avatar" id="avatar">我</div>
      <div class="who-text" style="min-width:0">
        <div class="hi" id="greeting">你好</div>
        <div class="date" id="dateLabel"></div>
      </div>
    </div>
    <button type="button" class="icon-btn" id="logoutBtn">退出</button>
  </header>

  <div class="progress-card">
    <div class="progress-top">
      <span class="remaining" id="remainingText">还剩 <span class="num">0</span> 项</span>
      <span class="total" id="totalText"></span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div class="carry hidden" id="carryBanner">
    <span id="carryText"></span>
    <button type="button" id="carryBtn">顺延</button>
  </div>

  <main>
    <ul class="list" id="list"></ul>
    <div class="empty hidden" id="empty">
      <div class="empty-mark">🌱</div>
      <p>今天还没有安排</p>
      <span>在下面写下第一件事</span>
    </div>
  </main>

  <div class="composer">
    <div class="composer-inner">
      <input id="newTask" type="text" maxlength="200" placeholder="添加任务…"
             enterkeyhint="done" aria-label="新任务">
      <button type="button" class="add-btn" id="addBtn" aria-label="添加任务">+</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</section><script>let todos=[{title:'整理今天的工作',done:false},{title:'喝一杯水',done:true}];const $=id=>document.getElementById(id);function render(){let n=todos.length,d=todos.filter(x=>x.done).length;$('remainingText').innerHTML=`还剩 <span class="num">${n-d}</span> 项`;$('totalText').textContent=n?`共 ${n} 项 · 已完成 ${d}`:'今天还是空的';$('barFill').style.width=n?`${d/n*100}%`:'0%';$('empty').classList.toggle('hidden',!!n);$('list').replaceChildren();todos.forEach((t,i)=>{let li=document.createElement('li');li.className='item enter'+(t.done?' done':'');let c=document.createElement('button');c.className='check';c.setAttribute('aria-label',t.done?'标记为未完成':'标记为已完成');c.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';c.onclick=()=>{t.done=!t.done;render()};let s=document.createElement('span');s.className='title';s.textContent=t.title;let x=document.createElement('button');x.className='del';x.setAttribute('aria-label','删除任务');x.textContent='✕';x.onclick=()=>{todos.splice(i,1);render()};li.append(c,s,x);$('list').append(li)})}function add(){let s=$('newTask').value.trim();if(!s)return;todos.push({title:s,done:false});$('newTask').value='';render()}$('newTask').onkeydown=e=>{if(e.key==='Enter')add()};$('addBtn').onclick=add;$('greeting').textContent='你好';let d=new Date();$('dateLabel').textContent=`${d.getMonth()+1}月${d.getDate()}日 · ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}`;$('logoutBtn').hidden=true;render();</script></body></html>
