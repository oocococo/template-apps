<h1>大理论<br/><em>时代</em></h1>

<p class="why__lead">阅读解读：我们可以从名字、日常记录和解释处境的方式，阅读这些词。下面五个角度帮助提出问题，具体的传播原因仍要回到公开资料与个别案例。</p>

<div class="mech__cell">
<b>机制 01</b>
<h3>框架效应</h3>
<p>阅读解读：把同一件日常小事换一种说法，会呈现哪些不同意味？可以比较日常提醒、身份口号与个人叙述的区别。</p>
</div>
<div class="mech__cell">
<b>机制 02</b>
<h3>成本低到离谱</h3>
<p>阅读解读：把注意力放到可辨认的日常动作上，例如怎样安排休息、怎样记录自己的选择。付出的时间、条件和成本，需要按具体处境判断。</p>
</div>
<div class="mech__cell">
<b>机制 03</b>
<h3>可打卡、可确认</h3>
<p>阅读解读：瓶子、台灯、笔记或一张照片，都可以成为记录日常的载体。可以继续追问：画面记录了什么，又有哪些结果尚未显示？</p>
</div>
<div class="mech__cell">
<b>机制 04</b>
<h3>争夺解释权</h3>
<p>阅读解读：“我选择怎样生活”也是一种自我叙述。命名可以作为阅读自我表达的线索，是否适合某个具体处境仍需独立判断。</p>
</div>
<div class="mech__cell">
<b>机制 05</b>
<h3>内容形式与商业关系</h3>
<p>阅读解读：当一种说法与商品或课程并置，可以分别查看内容主张、利益关系与实际证据。具体创作者的商业行为与动机，需以对应资料为依据。</p>
</div>
</div>
<div class="keep">
<div class="keep__col keep--yes">
<h3>可以带走的</h3>
<ul>
<li><b>可验证的动作</b>：把愿望拆为具体行动，回到实际结果，不依赖网络名称作效果证明。</li>
<li><b>对失控的承认</b>：承认有些事管不了，然后只管能管的那部分——这不是躺平，是把力气用在有回报的地方。</li>
<li><b>一种低成本的自我确认</b>：不必等到年薪百万，才允许自己觉得今天过得还行。</li>
</ul>
</div>
<div class="keep__col keep--no">
<h3>应该扔掉的</h3>
<ul>
<li><b>标签</b>：不以群体标签代替对具体人的了解；可以继续追问，这类说法是否遮住了个体差异。</li>
<li><b>把常识神秘化</b>：当一个道理必须叫「理论」才听得进去，说明缺的不是道理。</li>
<li><b>用情绪替代分析</b>：解构很爽，但它不产生任何可执行的下一步。</li>
</ul>
</div>
</div>
<p class="why__close">读完一个名字，还可以回到具体的人、具体的事，以及今天愿意怎样安排自己的生活。</p>
