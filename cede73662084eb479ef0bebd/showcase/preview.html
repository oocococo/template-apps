<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    /* 配色 */
    --bg:#f7f4ed; --bg-soft:#efe9dd; --panel:#ffffff; --card-hover:#fffdf9;
    --line:#e5dfd2; --border-strong:#d3cbb8;
    --txt:#2c2c2a; --sub:#8a8880; --text-dim:#5f5e5a;
    --acc:#1f4e79; --acc2:#b8860b; --accbg:#eaf1f7; --ok:#3b6d11; --bad:#b3392c;
    --radius:14px; --shadow:0 6px 22px rgba(60,50,30,.09);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
       background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; overflow:hidden; line-height:1.55;}
  .bg-orbs{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(760px 520px at 88% -8%, rgba(184,134,11,.055), transparent 70%),
      radial-gradient(680px 480px at 6% 104%, rgba(31,78,121,.05), transparent 70%);}
  button{background:var(--accbg); color:var(--acc); border:1px solid var(--border-strong); border-radius:var(--radius-sm,9px); padding:6px 13px; font-size:13px; cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s;}
  button:hover{background:#dfeaf5;}
  button.primary{background:var(--acc); color:#fff; border-color:var(--acc);}
  button.primary:hover{background:#173d5e;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  /* 站点风格顶栏 */
  .site-header{position:sticky; top:0; z-index:30; backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    background:rgba(247,244,237,.9); border-bottom:1px solid var(--line);}
  .header-inner{max-width:100%; padding:11px 20px 9px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-icon{font-size:23px; width:44px; height:44px; display:grid; place-items:center; border-radius:12px;
    background:var(--acc); color:#fff; box-shadow:0 4px 14px rgba(31,78,121,.2);}
  .brand-text h2{font-size:16px; letter-spacing:.5px; color:var(--txt);}
  .brand-text p{font-size:12px; color:var(--sub); margin-top:1px;}
  .header-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .btn-ghost{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:99px;
    border:1px solid var(--line); background:var(--panel); color:var(--text-dim); font-size:13px; text-decoration:none; cursor:pointer; transition:all .15s;}
  .btn-ghost:hover{border-color:var(--border-strong); color:var(--acc); background:var(--card-hover);}
  .toolbar{display:flex; gap:8px; align-items:center; padding:7px 16px 9px; flex-wrap:wrap;}
  .proj-sel{padding:7px 10px; border:1px solid var(--border-strong); border-radius:9px; background:var(--panel);
    color:var(--txt); font-size:13px; outline:none; min-width:118px; max-width:200px; cursor:pointer;}
  .proj-sel:focus{border-color:var(--acc);}
  .tb-div{width:1px; height:22px; background:var(--line); margin:0 3px;}
  header{display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;}
  header h1{font-size:16px; margin-right:8px; color:var(--acc); white-space:nowrap;}
  #userbox{margin-left:auto; font-size:12px; color:var(--sub); display:flex; align-items:center; gap:8px;}
  main{flex:1; display:flex; min-height:0; position:relative; z-index:2;}
  #treewrap{width:250px; min-width:200px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:8px;}
  .dir{font-weight:bold; color:var(--acc); margin-top:6px; font-size:13px;}
  .file{padding-left:16px; cursor:pointer; font-size:13px; padding-top:2px; padding-bottom:2px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .file:hover{background:var(--accbg);}
  .file.active{background:var(--accbg); color:var(--acc); font-weight:bold;}
  .file.outline{color:var(--acc2);}
  #viewwrap{flex:1; display:flex; flex-direction:column; min-width:0;}
  #viewbar{display:flex; gap:8px; align-items:center; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; color:var(--sub); flex-wrap:wrap;}
  #viewbar .fname{font-weight:bold; color:var(--txt);}
  #viewbar .grow{flex:1;}
  #content{flex:1; overflow:auto; padding:22px 30px; line-height:1.85; font-size:15px;}
  #editor{flex:1; display:none; width:100%; border:none; resize:none; padding:18px 24px; font-size:14px; line-height:1.9; font-family:Consolas,"Microsoft YaHei",monospace; background:var(--card-hover); outline:none;}
  #content h1{font-size:22px; border-bottom:2px solid var(--accbg); padding-bottom:8px; margin:18px 0 14px; color:var(--acc);}
  #content h2{font-size:18px; margin:20px 0 10px; color:var(--acc);}
  #content h3{font-size:15px; margin:14px 0 8px;}
  #content p{margin:8px 0;}
  #content blockquote{border-left:4px solid var(--accbg); background:#fbf8f2; padding:8px 14px; color:#6b6353; margin:10px 0; font-size:13.5px;}
  #content table{border-collapse:collapse; margin:12px 0; font-size:13.5px; width:100%;}
  #content th,#content td{border:1px solid var(--line); padding:6px 10px; text-align:left;}
  #content th{background:var(--accbg);}
  #content code{background:#f0ede6; padding:1px 5px; border-radius:3px; font-size:13px;}
  #content pre{background:#f0ede6; padding:12px; border-radius:6px; overflow:auto; font-size:13px; margin:10px 0;}
  #content pre code{background:none; padding:0;}
  #content ul,#content ol{margin:8px 0 8px 24px;}
  #content hr{border:none; border-top:1px dashed var(--line); margin:16px 0;}
  #content .fm{background:#fbf8f2; border:1px dashed #d8c9ad; border-radius:6px; padding:10px 14px; font-size:12.5px; color:#6b6353; white-space:pre-wrap; margin-bottom:14px;}
  #panel{width:280px; min-width:230px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column;}
  #tabs{display:flex; border-bottom:1px solid var(--line);}
  #tabs div{flex:1; text-align:center; padding:8px 0; font-size:13px; cursor:pointer; color:var(--sub); border-bottom:2px solid transparent;}
  #tabs div.on{color:var(--acc); border-bottom-color:var(--acc); font-weight:bold;}
  #panelbody{flex:1; overflow:auto; padding:10px; font-size:12.5px;}
  .pitem{padding:6px 8px; border-bottom:1px solid #f0ede6; line-height:1.6;}
  .pitem b{color:var(--acc);}
  .tag{display:inline-block; font-size:11px; padding:0 6px; border-radius:8px; background:var(--accbg); color:var(--acc); margin-left:4px;}
  .tag.warn{background:#fdeeea; color:var(--bad);}
  footer{display:flex; gap:16px; padding:5px 14px; font-size:12px; color:var(--sub); background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap;}
  .pass{color:var(--ok); font-weight:bold;} .fail{color:var(--bad); font-weight:bold;}
  dialog{border:1px solid var(--line); border-radius:10px; padding:20px; box-shadow:0 8px 30px rgba(0,0,0,.15); max-width:420px;}
  dialog::backdrop{background:rgba(0,0,0,.25);}
  dialog h3{margin-bottom:12px; color:var(--acc);}
  dialog label{display:block; font-size:13px; margin:10px 0 4px;}
  dialog input{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:5px; font-size:14px;}
  dialog select{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:5px; font-size:14px; background:#fff;}
  dialog .btns{margin-top:16px; text-align:right;}
  #loginView{flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; position:relative; z-index:2;}
  #loginView .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:40px 48px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.06);}
  #loginView h2{color:var(--acc); margin-bottom:8px; font-size:22px;}
  #loginView p{color:var(--sub); font-size:13px; margin-bottom:18px; line-height:1.8;}
  #loginView input{width:260px; padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; text-align:center;}
  #loginErr{color:var(--bad); font-size:13px; margin-top:12px; min-height:18px;}
@media (max-width:700px){
  main{flex-direction:column; overflow:hidden}
  #treewrap{width:100%;min-width:0;flex:0 0 110px;border-right:0;border-bottom:1px solid var(--line)}
  #viewwrap{width:100%;min-height:150px;flex:1}
  #panel{width:100%;min-width:0;flex:0 0 110px;border-left:0;border-top:1px solid var(--line)}
}
</style><body>

<div id="demoBar" style="padding:8px;background:#f5ead9;color:#483525;z-index:10">示例体验 · 数据仅保存在当前页面 <button id="restoreDemo">恢复示例</button></div>
<div class="bg-orbs"></div>

<div id="loginView">
  <div class="card">
    <div style="font-size:34px; margin-bottom:6px;">📝</div>
    <h2>写作台</h2>
    <p>云端写作台 · 设定 / 细纲 / 正文<br>正在准备示例</p>

    <div style="margin-top:14px"><button id="btnLogin" class="primary" style="font-size:15px; padding:9px 30px;">重试加载</button></div>
    <div id="loginErr"></div>
  </div>
</div>

<div id="appView" style="display:none; flex:1; flex-direction:column; min-height:0; position:relative; z-index:2;">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">📝</span>
        <div class="brand-text">
          <h2>写作台</h2>
          <p>云端写作台 · 设定 / 细纲 / 正文</p>
        </div>
      </div>
      <div class="header-tools">
        <button class="btn-ghost" id="btnBack">← 返回</button>
        <span id="uname" style="font-size:12px; color:var(--sub);"></span>
        <button class="btn-ghost" id="btnLogout">退出</button>
      </div>
    </div>
    <div class="toolbar">
      <select id="projSel" class="proj-sel" title="切换小说项目"></select>
      <button id="btnNewProj" class="btn-ghost">＋ 新项目</button>
      <button id="btnDelProj" class="btn-ghost" title="删除当前项目（含全部文件）">🗑 删项目</button>
      <span class="tb-div"></span>
      <button id="btnNewFile">＋ 新建文件</button>
      <button id="btnNew">＋ 新建细纲</button>
      <button id="btnSave" disabled>💾 保存</button>
      <button id="btnDel" disabled>🗑 删除本文件</button>
      <button id="btnLint" disabled>🔍 门禁检查</button>
      <button id="btnCopy" disabled>📋 复制扩写指令</button>
      <button id="btnImport">📥 从本地底稿导入</button>
    </div>
  </header>
  <main>
    <div id="treewrap"><div style="color:var(--sub); font-size:12px; padding:6px;">正在加载…</div></div>
    <div id="viewwrap">
      <div id="viewbar">
        <span class="fname" id="fname">（未打开文件）</span>
        <span id="fmode"></span>
        <span class="grow"></span>
        <span id="fcount"></span>
      </div>
      <div id="content"><p style="color:var(--sub)">左侧选择文件。所有文件都可直接编辑保存。</p></div>
      <textarea id="editor" spellcheck="false" placeholder="编辑区"></textarea>
    </div>
    <div id="panel">
      <div id="tabs">
        <div class="on" data-t="fs">伏笔</div>
        <div data-t="chars">角色</div>
        <div data-t="chaps">章节</div>
        <div data-t="rules">规则</div>
      </div>
      <div id="panelbody"></div>
    </div>
  </main>
  <footer>
    <span id="st1">就绪</span><span id="st2"></span><span id="st3"></span>
  </footer>
</div>

<dialog id="dlgNew">
  <h3>新建章节细纲</h3>
  <label>章号</label><input id="inNum" type="number" min="1" placeholder="4">
  <label>章名</label><input id="inTitle" placeholder="例：骨纹">
  <div class="btns">
    <button onclick="dlgNew.close()">取消</button>
    <button id="btnNewGo" class="primary">创建</button>
  </div>
</dialog>

<dialog id="dlgFile">
  <h3>新建文件</h3>
  <label>文件路径（相对项目根目录）</label>
  <input id="inPath" placeholder="例：30-正文/第01卷/第004章-骨纹.md">
  <label>模板</label>
  <select id="inTpl">
    <option value="chapter">正文章节（自动填 frontmatter）</option>
    <option value="blank">空白文件</option>
    <option value="world">世界观条目</option>
    <option value="char">角色卡</option>
  </select>
  <div class="btns">
    <button onclick="dlgFile.close()">取消</button>
    <button id="btnFileGo" class="primary">创建</button>
  </div>
</dialog>

<dialog id="demoDialog"><p id="demoMessage"></p><input id="demoInput"><div class="btns"><button id="demoCancel">取消</button><button id="demoOk" class="primary">确定</button></div></dialog>
<script>"use strict";
const localStorage={getItem(){return null},setItem(){},removeItem(){}};
const OUTLINE_DIR = "20-大纲/细纲";
const SKIP = new Set([".versions","tools"]);
const PKEY = "wr_project";
let allDocs = {};     // path -> {category,name,content,updated_at}（path 形如 项目名/目录/文件.md）
let curPath = null;
let curProject = localStorage.getItem(PKEY) || "";

const $ = id => document.getElementById(id);
function demoAsk(message, value, input) { return new Promise(resolve => {
 const d=$("demoDialog"), field=$("demoInput"); $("demoMessage").textContent=message; field.hidden=!input; field.value=value||"";
 const finish=result=>{ d.close(); resolve(result); }; $("demoOk").onclick=()=>finish(input?field.value:true); $("demoCancel").onclick=()=>finish(input?null:false);
 d.oncancel=e=>{e.preventDefault();finish(input?null:false)}; d.showModal(); if(input) field.focus();
}); }
const demoConfirm = msg => demoAsk(msg,"",false);
const demoPrompt = (msg,value="") => demoAsk(msg,value,true);
const demoAlert = msg => { $("st2").textContent=msg; };

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const projOf = p => p.split("/")[0];
const catOf = p => p.split("/")[1] || "_根";
const nameOf = p => p.split("/").pop();
const relOf = p => p.split("/").slice(2).join("/") || nameOf(p);

/* ================= API ================= */
const initialDocs={"示例项目·银河便利店/00-项目管理/总控.md":"# 银河便利店\n\n在银河边缘开一家便利店。","示例项目·银河便利店/20-大纲/章节摘要.md":"# 章节摘要\n\n| 章 | 章名 | 卷 | 一句话摘要 | 状态 |\n| 1 | 夜班 | 1 | 新店员接手夜班 | 草稿 |","示例项目·银河便利店/40-线索与时间线/伏笔追踪.md":"# 伏笔追踪\n\n| F-001 | 小票末尾多出的无名商品 | 谜团 | 1 | 待定 | | 待回收 |"}; let demoDocs={...initialDocs}; async function api(path,opts={}) {if(path.startsWith('/api/docs'))return {docs:Object.entries(demoDocs).map(([path,content])=>({path,content}))}; if(path==='/api/doc'){let d=JSON.parse(opts.body);demoDocs[d.path]=d.content;return {}} if(path.startsWith('/api/doc?')){delete demoDocs[new URLSearchParams(path.split('?')[1]).get('path')];return {}} if(path.startsWith('/api/project?')){let name=new URLSearchParams(path.split('?')[1]).get('name');let keys=Object.keys(demoDocs).filter(p=>p.startsWith(name+'/'));keys.forEach(p=>delete demoDocs[p]);return {name,removed:keys.length}} if(path==='/api/import'){let d=JSON.parse(opts.body).docs;d.forEach(x=>demoDocs[x.path]=x.content);return {imported:d.length}} }
/* ================= 登录 ================= */
async function tryEnter(tk, silent){
  try {
    const d = await api("/api/docs?full=1");
    allDocs = {};
    (d.docs||[]).forEach(r => { allDocs[r.path] = r; });
    $("loginView").style.display = "none";
    $("appView").style.display = "flex";
    $("uname").textContent = "示例数据";
    renderProjectSel(); buildTree(); renderPanels();
    $("st1").textContent = "✅ 已加载 " + Object.keys(allDocs).length + " 个文件 · 项目「" + curProject + "」";
    if (!Object.keys(allDocs).length) {
      $("st1").textContent = "⚠ 还没有资料，点「＋ 新项目」或「📥 从本地底稿导入」开始";
    }
    return true;
  } catch(e) {
    if (!silent) $("loginErr").textContent = e.message;
    else $("loginErr").textContent = "加载失败，请重试。";
    return false;
  }
}
$("btnLogin").onclick = () => tryEnter("", false);
$("btnLogout").onclick = () => { $("st2").textContent = "示例体验无需退出。"; };
$("btnBack").onclick = () => {
  if (document.referrer) history.back();
  else resetView();
};

/* ================= 数据操作 ================= */
async function loadAll(){
  $("st1").textContent = "正在加载…";
  try {
    const d = await api("/api/docs?full=1");
    allDocs = {};
    (d.docs||[]).forEach(r => { allDocs[r.path] = r; });
    renderProjectSel(); buildTree(); renderPanels();
    $("st1").textContent = "✅ 已加载 " + Object.keys(allDocs).length + " 个文件 · 项目「" + curProject + "」";
  } catch(e) { $("st1").textContent = "❌ 加载失败：" + e.message; }
}
async function saveDoc(path, content){
  await api("/api/doc", { method:"POST", body: JSON.stringify({ path, content }) });
  allDocs[path] = { path, category: catOf(path), name: nameOf(path), content, updated_at: new Date().toISOString() };
}
async function deleteDoc(path){
  await api("/api/doc?path=" + encodeURIComponent(path), { method:"DELETE" });
  delete allDocs[path];
}

/* ================= 项目切换 ================= */
function projectList(){
  const s = new Set();
  Object.keys(allDocs).forEach(p => s.add(projOf(p)));
  return [...s].sort((a,b)=>a.localeCompare(b,"zh"));
}
function renderProjectSel(){
  const sel = $("projSel");
  const list = projectList();
  if (!list.length) { sel.innerHTML = '<option>（无项目）</option>'; return; }
  if (!curProject || list.indexOf(curProject) < 0) curProject = list[0];
  sel.innerHTML = list.map(p =>
    '<option value="' + esc(p) + '"' + (p === curProject ? " selected" : "") + '>' + esc(p) + '</option>'
  ).join("");
  localStorage.setItem(PKEY, curProject);
}
function resetView(){
  curPath = null;
  $("fname").textContent = "（未打开文件）";
  $("fmode").textContent = "";
  $("fcount").textContent = "";
  $("editor").style.display = "none";
  $("content").style.display = "block";
  $("content").innerHTML = '<p style="color:var(--sub)">左侧选择文件。所有文件都可直接编辑保存。</p>';
  $("btnSave").disabled = $("btnDel").disabled = $("btnLint").disabled = $("btnCopy").disabled = true;
}
$("projSel").onchange = () => {
  curProject = $("projSel").value;
  localStorage.setItem(PKEY, curProject);
  resetView(); buildTree(); renderPanels();
  $("st1").textContent = "✅ 已加载 " + Object.keys(allDocs).length + " 个文件 · 项目「" + curProject + "」";
};

/* ================= 文件树 ================= */
function buildTree(){
  const tree = $("treewrap"); tree.innerHTML = "";
  const paths = Object.keys(allDocs).filter(p => projOf(p) === curProject).sort();
  if (!paths.length) {
    tree.innerHTML = '<div style="color:var(--sub);font-size:12px;padding:6px;">（本项目还没有文件）</div>';
    return;
  }
  const cats = {};
  paths.forEach(p => (cats[catOf(p)] = cats[catOf(p)] || []).push(p));
  Object.keys(cats).sort((a,b)=> (a==="_根"? -1 : b==="_根"? 1 : a.localeCompare(b,"zh"))).forEach(c => {
    const d = document.createElement("div"); d.className = "dir"; d.textContent = "📁 " + (c === "_根" ? "根目录" : c); tree.appendChild(d);
    cats[c].forEach(p => {
      const f = document.createElement("div");
      f.className = "file" + (p.indexOf("/" + OUTLINE_DIR + "/") > -1 ? " outline" : "") + (p === curPath ? " active" : "");
      f.textContent = relOf(p);
      f.title = p;
      f.onclick = () => openFile(p);
      tree.appendChild(f);
    });
  });
}

/* ================= 打开 / 保存 / 删除 ================= */
function openFile(path){
  const doc = allDocs[path];
  if (!doc) return;
  curPath = path;
  $("fname").textContent = path;
  $("fmode").textContent = "✏ 可编辑（改动需点「💾 保存」）";
  $("content").style.display = "none";
  $("editor").style.display = "block";
  $("editor").value = doc.content || "";
  $("btnSave").disabled = false;
  $("btnDel").disabled = false;
  $("btnLint").disabled = path.indexOf("/30-正文/") < 0;
  $("btnCopy").disabled = path.indexOf("/" + OUTLINE_DIR + "/") < 0;
  updateCount(); buildTree();
}
async function saveCurrent(){
  if (!curPath) return;
  $("st2").textContent = "保存中…";
  try {
    await saveDoc(curPath, $("editor").value);
    $("st2").textContent = "✅ 已保存 " + new Date().toLocaleTimeString();
    renderPanels(); buildTree();
  } catch(e) { $("st2").textContent = "❌ 保存失败：" + e.message; }
}

/* ================= Markdown 渲染 ================= */
function renderMD(src){
  let s = esc(src);
  s = s.replace(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/, (m,fm)=>'<div class="fm">ⓘ 元信息\n'+fm+'</div>\n');
  const codes=[];
  s = s.replace(/```([\s\S]*?)```/g,(m,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000";});
  const lines = s.split("\n"); const out=[]; let i=0;
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<span style="color:var(--acc)">$1</span>');
  while(i<lines.length){
    const L=lines[i];
    if(/^\s*$/.test(L)){i++;continue;}
    if(/^(---|\*\*\*)\s*$/.test(L)){out.push("<hr>");i++;continue;}
    let m;
    if(m=L.match(/^(#{1,4})\s+(.*)/)){const n=Math.min(m[1].length,4);out.push(`<h${n}>${inline(m[2])}</h${n}>`);i++;continue;}
    if(m=L.match(/^&gt;\s?(.*)/)){const buf=[];while(i<lines.length&&/^&gt;/.test(lines[i])){buf.push(lines[i].replace(/^&gt;\s?/,""));i++;}out.push("<blockquote>"+inline(buf.join(" "))+"</blockquote>");continue;}
    if(/^\|.+\|/.test(L) && i+1<lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      const head=L.split("|").slice(1,-1).map(x=>x.trim());
      i+=2; const rows=[];
      while(i<lines.length&&/^\|.+\|/.test(lines[i])){rows.push(lines[i].split("|").slice(1,-1).map(x=>x.trim()));i++;}
      out.push("<table><tr>"+head.map(h=>`<th>${inline(h)}</th>`).join("")+"</tr>"
        + rows.map(r=>"<tr>"+r.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>").join("")+"</table>");
      continue;
    }
    if(/^[-*]\s+/.test(L)){const buf=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i])){buf.push(lines[i].replace(/^[-*]\s+/,""));i++;}out.push("<ul>"+buf.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");continue;}
    if(/^\d+\.\s+/.test(L)){const buf=[];while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){buf.push(lines[i].replace(/^\d+\.\s+/,""));i++;}out.push("<ol>"+buf.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");continue;}
    const buf=[L];i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,4}\s|[-*]\s|\d+\.\s|&gt;|\||---)/.test(lines[i])){buf.push(lines[i]);i++;}
    out.push("<p>"+inline(buf.join(" ")).replace(/\n/g,"<br>")+"</p>");
  }
  let html=out.join("\n");
  html = html.replace(/\u0000(\d+)\u0000/g,(m,n)=>"<pre><code>"+codes[n]+"</code></pre>");
  return html;
}

/* ================= 门禁 ================= */
const BAN=["不禁","与此同时","一股","涌上心头","然而","内心深处","缓缓说道","命运的齿轮","宿命感","忍不住","下意识地","不由自主地"];
const WARN=["深吸一口气","时间来到了","另一边","仿佛","似乎"];
function lintText(body){
  const text=body.replace(/^---[\s\S]*?---\r?\n/,"");
  const words=text.replace(/\s/g,"").length;
  const dash=(text.match(/——/g)||[]).length;
  const ban=BAN.filter(w=>text.includes(w));
  const warnHits=WARN.filter(w=>text.includes(w));
  const feel=(text.match(/感到|觉得/g)||[]).length;
  const lines=text.split("\n").filter(x=>x.trim());
  const last=lines.length?lines[lines.length-1].trim():"";
  const issues=[];
  if(words<2500) issues.push("❌ 字数 "+words+"，不足 2500");
  else if(words>3200) issues.push("⚠ 字数 "+words+"，超出 3000 较多（确认是否有意）");
  else issues.push("✅ 字数 "+words+"（2500–3000 达标）");
  issues.push((dash<=12?"✅":"❌")+" 破折号 "+dash+"/12");
  issues.push((ban.length===0?"✅":"❌")+" ban词："+(ban.length?ban.join("、"):"0"));
  issues.push((warnHits.length<=3?"✅":"⚠")+" warn词："+(warnHits.length?warnHits.join("、"):0)+"（≤3）");
  issues.push((feel<=2?"✅":"⚠")+" 感到/觉得："+feel+"（≤2）");
  const endBad=/[?？!！]\s*$/.test(last)||/^（?第.+章完/.test(last);
  issues.push(endBad?"❌ 章末为反问/感叹/平收":"✅ 章末收在陈述句");
  return {issues, words, pass: ban.length===0 && dash<=12 && words>=2500 && !endBad};
}
$("btnLint").onclick = () => {
  if (!curPath) return;
  const doc = allDocs[curPath];

  const html = "<b>🔍 量化门禁 · "+esc(curPath)+"</b><br>"+r.issues.map(x=>'<div class="li">'+esc(x)+"</div>").join("")
    + '<div class="li" style="margin-top:8px">'+(r.pass?'<span class="pass">总体：通过</span>':'<span class="fail">总体：未通过，需修订</span>')+"</div>";
  $("editor").style.display = "none";
  $("content").style.display = "block";

    + renderMD(doc.content||"")
    + '<p style="margin-top:16px"><button onclick="backToEditor()">✏ 返回编辑</button></p>';
};

/* ================= 新建正文 / 任意文件 ================= */
function tplChapter(path){
  const fname = nameOf(path).replace(/\.md$/,"");
  const m = fname.match(/^第(\d+)章[-_ ]*(.*)$/);
  const num = m ? parseInt(m[1],10) : 0;
  const nm = m ? (m[2] || "（章名）") : fname;
  const vol = parseInt((path.match(/第(\d+)卷/)||[])[1] || "1", 10);
  const nn = String(num).padStart(3,"0");
  const today = new Date().toISOString().slice(0,10);
  return `---\nchapter: ${num}\nvolume: ${vol}\ntitle: 第${nn}章 ${nm}\nstatus: 草稿\npov: \ntimeline: \ncharacters: []\nlocations: []\nthreads: []\nforeshadow: []\npayoff: []\nwords: 0\nupdated: ${today}\n---\n\n# 第${nn}章 ${nm}\n\n（正文从这里开始。一段一行，段间空行。）\n`;
}
function tplWorld(path){
  const fname = nameOf(path).replace(/\.md$/,"");
  const m = fname.match(/^(W-\d+)[-_ ]*(.*)$/);
  const id = m ? m[1] : "W-000";
  const topic = m ? (m[2] || "主题") : fname;
  const today = new Date().toISOString().slice(0,10);
  return `---\nid: ${id}\ntopic: ${topic}\ncategory: 待定\nstatus: 初稿\nrefs: []\nupdated: ${today}\n---\n\n# ${topic}\n\n## 一句话概括\n\n（待补充）\n\n## 核心内容\n\n\n## 规则与限制\n\n| 项 | 说明 |\n| --- | --- |\n| 能做到什么 | |\n| 不能做到什么 | |\n| 代价 / 成本 | |\n\n## 关联条目\n\n- 相关：\n`;
}
function tplChar(path){
  const fname = nameOf(path).replace(/\.md$/,"");
  const m = fname.match(/^(C-\d+)[-_ ]*(.*)$/);
  const id = m ? m[1] : "C-000";

  return `---\nid: ${id}\nname: ${nm}\nrole: 配角\nfaction: \nstatus: 未登场\nfirst_appear: \ntags: []\nupdated: ${today}\n---\n\n# ${nm}\n\n## 一句话人设\n\n（待补充）\n\n## 核心三件套\n\n| 项 | 内容 |\n| --- | --- |\n| **想要**（表层目标） | |\n| **需要**（深层缺口） | |\n| **恐惧** | |\n\n## 关系网\n\n| 对象 | 关系 | 情感基调 | 起始章节 | 备注 |\n| --- | --- | --- | --- | --- |\n`;
}
