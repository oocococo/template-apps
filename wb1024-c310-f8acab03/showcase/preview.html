<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
  :root{
    --bg-1:#1c2230;
    --bg-2:#0f1216;
    --bg-3:#0b0d10;
    --card-a:#252b36;
    --card-b:#1a1f27;
    --card-back-a:#20262f;
    --card-back-b:#171b21;
    --text:#e6e9ee;
    --muted:#8b95a5;
    --muted-2:#7c8798;
    --line:rgba(255,255,255,.08);
    --green:#10b981;
    --green-soft:#6ee7b7;
    --red:#ef4444;
    --red-soft:#fca5a5;
    --radius:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1100px 560px at 50% -12%, var(--bg-1) 0%, var(--bg-2) 46%, var(--bg-3) 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:30px 18px 44px;
    -webkit-font-smoothing:antialiased;
  }

  .app{width:min(560px,100%);display:flex;flex-direction:column;gap:20px;}

  /* Header */
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .title{font-size:19px;font-weight:700;letter-spacing:.4px;}
  header .stats{
    font-size:12.5px;color:var(--green-soft);
    background:rgba(16,185,129,.1);
    border:1px solid rgba(16,185,129,.25);
    padding:5px 12px;border-radius:20px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;
  }
  header .stats .sep{color:rgba(255,255,255,.22);margin:0 5px;font-weight:400;}
  header .stats .stat-master{color:#8ca6c4;font-weight:500;}

  /* Progress bar */
  .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;}
  .bar-fill{height:100%;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#0ea5a0,#10b981,#34d399);
    transition:width .45s cubic-bezier(.4,.2,.2,1);}

  /* 本轮进度点 */
  .round-dots{display:flex;justify-content:center;align-items:center;gap:8px;min-height:10px;}
  .rdot{display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);transition:.25s ease;}
  .rdot.done{background:var(--green);box-shadow:0 0 9px rgba(16,185,129,.45);}
  .rdot.now{background:#0e1319;box-shadow:0 0 0 2px #34d399,0 0 8px rgba(16,185,129,.35);}
  .rdot.retry{background:rgba(248,113,113,.75);box-shadow:0 0 8px rgba(248,113,113,.3);}

  /* Stage (fade transitions) */
  .stage{
    transition:opacity .2s ease, transform .2s ease;
    perspective:1600px;
  }
  .stage.is-out{opacity:0;transform:translateY(10px) scale(.98);}

  /* Flip card */
  .flip-card{width:100%;height:322px;cursor:pointer;}
  .flip-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1);
  }
  .flip-inner.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 22px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    padding:28px;display:flex;overflow:hidden;
  }

  /* Front */
  .front{
    background:linear-gradient(160deg,var(--card-a),var(--card-b));
    flex-direction:column;justify-content:center;align-items:center;text-align:center;
  }
  .front::after{
    content:"";position:absolute;inset:0;border-radius:var(--radius);
    background:radial-gradient(400px 200px at 50% 0%, rgba(16,185,129,.1), transparent 70%);
    pointer-events:none;
  }
  .front-tag{
    position:absolute;top:20px;left:24px;
    font-size:10.5px;letter-spacing:2.5px;color:var(--muted-2);font-weight:600;
  }
  .word-main{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(38px,8vw,54px);
    font-weight:700;letter-spacing:.5px;line-height:1.15;
    color:#f4f7fb;position:relative;z-index:1;
    word-break:break-word;
  }
  .hint{
    position:absolute;bottom:22px;left:0;right:0;text-align:center;
    font-size:12.5px;color:var(--muted-2);letter-spacing:.5px;
  }

  /* 卡片右上角熟练度 */
  .face-level{
    position:absolute;top:18px;right:20px;z-index:2;
    display:flex;align-items:center;gap:7px;
    font-size:10.5px;font-weight:600;color:var(--muted-2);
  }
  .lv-stars{font-size:12.5px;letter-spacing:1.5px;color:#fbbf24;}
  .lv-stars .off{color:rgba(255,255,255,.2);}
  .lv-pct{letter-spacing:.3px;}

  /* Back */
  .back{
    background:linear-gradient(160deg,var(--card-back-a),var(--card-back-b));
    transform:rotateY(180deg);
    flex-direction:column;justify-content:space-between;
  }
  .back-word{
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;color:var(--muted);letter-spacing:1px;
  }
  .back-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .pos{
    align-self:flex-start;display:inline-block;
    font-size:11.5px;font-weight:700;letter-spacing:.5px;
    color:var(--green-soft);background:rgba(16,185,129,.12);
    border:1px solid rgba(16,185,129,.28);
    padding:2px 9px;border-radius:8px;margin-bottom:2px;
  }
  .meaning{
    font-size:22px;font-weight:700;line-height:1.5;color:#eaf5ef;word-break:break-word;
  }
  .example-wrap{
    border-left:3px solid rgba(16,185,129,.5);
    padding-left:13px;
  }
  .ex-label{font-size:10.5px;letter-spacing:1.5px;color:var(--muted-2);margin-bottom:4px;}
  .example{
    font-size:13.5px;font-style:italic;color:#a3adbd;line-height:1.55;
    max-height:66px;overflow:auto;
  }
  .example::-webkit-scrollbar{width:4px;}
  .example::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}

  /* Action buttons */
  .actions{display:flex;gap:14px;}
  .btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:15px 10px;border-radius:15px;font-size:14.5px;font-weight:650;
    cursor:pointer;transition:.18s ease;border:1px solid;background:transparent;
    font-family:inherit;letter-spacing:.3px;user-select:none;
  }
  .btn-unknown{color:var(--red-soft);border-color:rgba(248,113,113,.32);background:rgba(239,68,68,.08);}
  .btn-unknown:hover{background:rgba(239,68,68,.18);transform:translateY(-2px);}
  .btn-unknown:active{transform:translateY(0) scale(.98);}
  .btn-known{color:var(--green-soft);border-color:rgba(16,185,129,.38);background:rgba(16,185,129,.1);}
  .btn-known:hover{background:rgba(16,185,129,.2);transform:translateY(-2px);}
  .btn-known:active{transform:translateY(0) scale(.98);}

  /* Add trigger */
  .add-trigger{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-open-add{
    width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 20px;border-radius:14px;cursor:pointer;font-family:inherit;
    border:1.5px dashed rgba(16,185,129,.4);
    background:rgba(16,185,129,.06);color:var(--green-soft);
    font-size:14px;font-weight:650;letter-spacing:.3px;transition:.18s;
  }
  .btn-open-add:hover{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.62);}
  .btn-open-add:active{transform:scale(.99);}

  /* Modal */
  .modal-mask{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(4,6,9,.72);backdrop-filter:blur(6px);
  }
  .modal-mask.show{display:flex;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(460px,100%);max-height:90vh;overflow-y:auto;
    background:linear-gradient(160deg,#222833,#181c23);
    border:1px solid rgba(255,255,255,.1);border-radius:22px;
    box-shadow:0 30px 80px rgba(0,0,0,.62);
    padding:22px;
    animation:slideUp .26s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  .modal::-webkit-scrollbar{width:6px;}
  .modal::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{font-size:17px;font-weight:700;letter-spacing:.3px;}
  .modal-close{
    border:none;background:rgba(255,255,255,.06);color:var(--muted);
    width:30px;height:30px;border-radius:9px;cursor:pointer;
    font-size:14px;line-height:1;transition:.15s;
  }
  .modal-close:hover{background:rgba(239,68,68,.18);color:var(--red-soft);}

  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);padding:4px;border-radius:12px;margin-bottom:16px;}
  .tab{
    flex:1;padding:9px 6px;border:none;background:transparent;color:var(--muted);
    font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;
    transition:.18s;font-family:inherit;
  }
  .tab.active{background:rgba(16,185,129,.16);color:var(--green-soft);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .field{margin-bottom:13px;}
  .field > label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field > label .req{color:#f87171;}
  .field > input[type=text],.field > textarea{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--text);
    outline:none;font-family:inherit;transition:.18s;resize:vertical;
  }
  .field > input::placeholder,.field > textarea::placeholder{color:#5f6a7a;}
  .field > textarea{min-height:118px;line-height:1.6;}
  .field > input:focus,.field > textarea:focus{
    border-color:rgba(16,185,129,.5);background:rgba(255,255,255,.06);
    box-shadow:0 0 0 3px rgba(16,185,129,.1);
  }
  .field .err{display:none;font-size:11.5px;color:#f87171;margin-top:5px;}
  .field.invalid > input{border-color:rgba(248,113,113,.6);}
  .field.invalid .err{display:block;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    padding:6px 13px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--muted);
    font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .chip:hover{border-color:rgba(16,185,129,.4);color:var(--green-soft);}
  .chip.active{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.5);color:var(--green-soft);}
  .chip-input{
    padding:6px 11px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--text);font-size:12.5px;
    width:80px;outline:none;font-family:inherit;transition:.15s;
  }
  .chip-input:focus{border-color:rgba(16,185,129,.5);}

  .mini-preview{
    border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);
    padding:11px 14px;margin:2px 0 16px;min-height:62px;
  }
  .mp-label{font-size:10px;letter-spacing:1.6px;color:var(--muted-2);margin-bottom:5px;}
  .mp-word{font-family:Georgia,serif;font-size:17px;color:#f4f7fb;word-break:break-word;}
  .mp-line{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
  .mp-pos{
    font-size:10.5px;font-weight:700;color:var(--green-soft);
    background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28);
    padding:1px 7px;border-radius:6px;
  }
  .mp-meaning{font-size:13px;color:#cdd7e3;word-break:break-word;}

  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions.single{justify-content:flex-end;}
  .modal-actions.single .btn-cancel{flex:0 0 auto;padding:11px 26px;}
  .btn-cancel,.btn-primary{
    flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:650;
    cursor:pointer;font-family:inherit;transition:.18s;border:1px solid;
  }
  .btn-cancel{background:transparent;border-color:var(--line);color:var(--muted);}
  .btn-cancel:hover{background:rgba(255,255,255,.05);color:var(--text);}
  .btn-primary{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.45);color:var(--green-soft);}
  .btn-primary:hover{background:rgba(16,185,129,.28);}

  .batch-help{font-size:11px;color:var(--muted-2);margin-top:6px;line-height:1.7;}
  .batch-help code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:10.5px;}
  .batch-preview{max-height:180px;overflow-y:auto;margin:10px 0 14px;}
  .batch-preview::-webkit-scrollbar{width:5px;}
  .batch-preview::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:5px;}
  .bp-item{
    display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;
    font-size:12.5px;margin-bottom:6px;background:rgba(255,255,255,.02);
    border:1px solid transparent;
  }
  .bp-item.ok{border-color:rgba(16,185,129,.18);}
  .bp-item.bad{border-color:rgba(248,113,113,.25);background:rgba(239,68,68,.06);}
  .bp-item.dup{border-color:rgba(251,191,36,.22);background:rgba(251,191,36,.05);}
  .bp-ico{flex-shrink:0;font-size:11px;}
  .bp-word{font-weight:600;color:#e6edf3;white-space:nowrap;}
  .bp-meaning{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bp-note{margin-left:auto;flex-shrink:0;font-size:10.5px;color:var(--muted-2);}
  .bp-empty{font-size:12px;color:var(--muted-2);text-align:center;padding:16px 10px;}
  .bp-sum{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .inline-note{font-size:12px;color:var(--green-soft);text-align:center;margin-top:10px;min-height:16px;}

  /* ===== Library modal ===== */
  .lib-modal{width:min(540px,100%);}
  .tab-count{font-size:11px;color:var(--muted-2);font-weight:600;}
  .preset-list{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
  .bank-card{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);padding:14px;}
  .bank-head{display:flex;align-items:center;gap:10px;}
  .bank-icon{
    flex-shrink:0;width:38px;height:38px;display:grid;place-items:center;font-size:20px;
    background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);border-radius:11px;
  }
  .bank-info{flex:1;min-width:0;}
  .bank-name{font-size:14px;font-weight:700;color:#f0f5fa;}
  .bank-desc{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.5;}
  .bank-count{font-size:11.5px;color:var(--muted-2);white-space:nowrap;flex-shrink:0;}
  .bank-progress{height:4px;border-radius:4px;background:rgba(255,255,255,.06);margin:11px 0 9px;overflow:hidden;}
  .bank-progress > div{height:100%;border-radius:4px;background:linear-gradient(90deg,#0ea5a0,#34d399);transition:width .4s ease;}
  .bank-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .bank-state{font-size:11.5px;color:var(--muted-2);}
  .bank-btns{display:flex;gap:8px;margin-left:auto;}
  .bank-btn{
    padding:7px 13px;border-radius:9px;font-size:12px;font-weight:650;cursor:pointer;
    font-family:inherit;border:1px solid rgba(16,185,129,.42);
    background:rgba(16,185,129,.14);color:var(--green-soft);transition:.15s;white-space:nowrap;
  }
  .bank-btn:hover{background:rgba(16,185,129,.26);}
  .bank-btn:disabled{opacity:.42;cursor:not-allowed;background:rgba(255,255,255,.03);border-color:var(--line);color:var(--muted-2);}
  .bank-btn.ghost{border-color:var(--line);background:transparent;color:var(--muted);}
  .bank-btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--text);}
  .bank-words{
    margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);
    max-height:150px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px;
  }
  .bank-words::-webkit-scrollbar,.mine-list::-webkit-scrollbar{width:5px;}
  .bank-words::-webkit-scrollbar-thumb,.mine-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:5px;}
  .wchip{font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:#cdd7e3;white-space:nowrap;}
  .wchip b{color:#eaf5ef;font-weight:600;}

  .lib-search input{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:11px;padding:10px 13px;font-size:13px;color:var(--text);
    outline:none;font-family:inherit;transition:.18s;
  }
  .lib-search input::placeholder{color:#5f6a7a;}
  .lib-search input:focus{border-color:rgba(16,185,129,.5);box-shadow:0 0 0 3px rgba(16,185,129,.1);}
  .mine-stats{font-size:11.5px;color:var(--muted-2);margin:9px 2px 8px;}
  .mine-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 9px;}
  .mine-toolbar .mine-stats{margin:0;}
  .sort-btn{
    font-family:inherit;font-size:11px;color:#9fb0c6;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;
    white-space:nowrap;transition:.16s;
  }
  .sort-btn:hover{border-color:rgba(16,185,129,.35);color:#d3dde9;}
  .mine-list{max-height:322px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .mine-item{
    display:flex;align-items:center;gap:10px;padding:9px 11px;
    border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--line);
  }
  .mi-main{flex:1;min-width:0;}
  .mi-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .mi-word{font-family:Georgia,serif;font-size:14.5px;font-weight:600;color:#f2f6fa;}
  .mi-pos{font-size:10px;font-weight:700;color:var(--green-soft);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.26);padding:0 6px;border-radius:5px;}
  .mi-level{font-size:10.5px;letter-spacing:1px;color:#fbbf24;white-space:nowrap;line-height:1;}
  .mi-level .off{color:rgba(255,255,255,.22);}
  .mi-status{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;margin-left:auto;}
  .mi-status.done{background:rgba(16,185,129,.14);color:#6ee7b7;}
  .mi-status.queued{background:rgba(96,165,250,.12);color:#93c5fd;}
  .mi-status.fresh{background:rgba(148,163,184,.13);color:#b6c2d4;}
  .mi-meaning{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mi-meter{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden;}
  .mi-meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#0ea5a0,#34d399);transition:width .3s ease;}
  .mi-meter.lv0 i{background:rgba(255,255,255,.12);}
  .mi-meter.low i{background:linear-gradient(90deg,#b45309,#f59e0b);}
  .mi-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;font-size:10.5px;color:var(--muted-2);}
  .mi-meta .hi{color:#93b3a8;}
  .mi-del{
    flex-shrink:0;border:none;background:transparent;color:var(--muted-2);
    cursor:pointer;font-size:13px;padding:5px 8px;border-radius:8px;transition:.15s;
  }
  .mi-del:hover{background:rgba(239,68,68,.16);color:var(--red-soft);}
  .mine-empty{text-align:center;color:var(--muted-2);font-size:12.5px;padding:26px 12px;line-height:1.7;}

  /* Done state */
  .done-box{
    display:none;text-align:center;
    padding:52px 24px;
    background:linear-gradient(160deg,var(--card-back-a),var(--card-back-b));
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 22px 48px rgba(0,0,0,.5);
  }
  .done-box .trophy{
    width:84px;height:84px;margin:0 auto;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;line-height:1;
    background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.24);
    animation:pop .5s ease;
  }

/* ===================== 2. 状态与持久化 ===================== */
const KEY = 'flashcard_state_v2';
const LEGACY_KEY = 'flashcard_state_v1';
const ROUND_SIZE = 10;     // 每轮抽词数量
const MAX_LEVEL = 5;       // 熟练度上限（5 颗星）
const MASTER_LEVEL = 4;    // ≥4 颗星（80%）视为已掌握
const $ = id => document.getElementById(id);

let words = [];        // 全部单词（含熟练度字段）
let queue = [];        // 本轮待答队列（存 id）
let roundIds = [];     // 本轮抽中的 10 个词（顺序固定，用于进度点）
let roundDone = {};    // 本轮已答对：{ id: true }
let roundRetry = {};   // 本轮答错次数：{ id: n }

function uid(){ return 'w_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 熟练度：0-5 星，百分比 = level / 5 * 100 */
function lvOf(w){ return Math.max(0, Math.min(MAX_LEVEL, w.level || 0)); }
function pctOf(w){ return Math.round(lvOf(w) / MAX_LEVEL * 100); }
function isMastered(w){ return lvOf(w) >= MASTER_LEVEL; }
function starHtml(lv){
  const n = Math.max(0, Math.min(MAX_LEVEL, lv));
  return '★'.repeat(n) + (n < MAX_LEVEL ? `<span class="off">${'★'.repeat(MAX_LEVEL - n)}</span>` : '');
}

function normalizeWord(w){
  return {
    id: w.id,
    word: String(w.word || '').trim(),
    pos: String(w.pos || '').trim(),
    meaning: String(w.meaning || '').trim(),
    example: String(w.example || '').trim(),
    level: Math.max(0, Math.min(MAX_LEVEL, parseInt(w.level, 10) || 0)),
    seen: Math.max(0, parseInt(w.seen, 10) || 0),
    right: Math.max(0, parseInt(w.right, 10) || 0),
    lastSeen: Number(w.lastSeen) || 0
  };
}

function save(){
  localStorage.setItem(KEY, JSON.stringify({ words, queue, roundIds, roundDone, roundRetry }));
}

function load(){
  let s = null, legacy = false;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) s = JSON.parse(raw);
    if(!s){
      const old = localStorage.getItem(LEGACY_KEY);
      if(old){ s = JSON.parse(old); legacy = true; }
    }
  }catch(e){ return false; }
  if(!s || !Array.isArray(s.words)) return false;

  const oldMastered = new Set(Array.isArray(s.mastered) ? s.mastered : []);
  words = s.words
    .filter(w => w && w.id && w.word && w.meaning)
    .map(w => normalizeWord({
      ...w,
      // 旧数据：曾「已掌握」的词给到 4 星，其余从 0 开始
      level: legacy ? (oldMastered.has(w.id) ? MASTER_LEVEL : 0) : w.level
    }));

  const idSet = new Set(words.map(w => w.id));
  const keep = arr => (Array.isArray(arr) ? arr.filter(id => idSet.has(id)) : []);
  const keepMap = obj => {
    const out = {};
    if(obj && typeof obj === 'object'){
      Object.keys(obj).forEach(k => { if(idSet.has(k)) out[k] = obj[k]; });
    }
    return out;
  };

  roundIds = legacy ? [] : keep(s.roundIds);
  const rSet = new Set(roundIds);
  queue = roundIds.length ? keep(s.queue).filter(id => rSet.has(id)) : [];
  roundDone = legacy ? {} : keepMap(s.roundDone);
  roundRetry = legacy ? {} : keepMap(s.roundRetry);
  return true;
}

/* 抽本轮 10 个词：熟练度越低、越久没练的越优先，兼带随机轮换 */
function pickRoundWords(n){
  if(words.length <= n) return shuffle(words);
  const now = Date.now();
  const scored = words.map(w => {
    const gap = w.lastSeen ? Math.min((now - w.lastSeen) / 86400000, 30) : 30;
    return { w, s: lvOf(w) * 100 - gap * 3 + Math.random() * 45 };
  });
  scored.sort((a, b) => a.s - b.s);

  const weak = [], strong = [];
  scored.forEach(({ w }) => (isMastered(w) ? strong : weak).push(w));

  const picked = weak.slice(0, n);
  if(picked.length < n) picked.push(...strong.slice(0, n - picked.length));
  return shuffle(picked);
}

function startRound(){
  roundDone = {};
  roundRetry = {};
  if(!words.length){
    roundIds = [];
    queue = [];
    save();
    return;
  }
  roundIds = pickRoundWords(ROUND_SIZE).map(w => w.id);
  queue = roundIds.slice();
  save();
}

function initState(){
  if(!load()){
    words = DEFAULT_WORDS.map((w, i) => normalizeWord({ id: 'd' + i, ...w }));
    roundIds = []; queue = []; roundDone = {}; roundRetry = {};
  }
  // 没有进行中的轮次时自动抽一轮；已完结的轮次保留结果页
  if(!roundIds.length && words.length) startRound();
  else save();
}

/* ===================== 3. 渲染 ===================== */
function getCurrentWord(){
  if(!queue.length) return null;
  return words.find(w => w.id === queue[0]) || null;
}

function renderDots(){
  const box = $('roundDots');
  if(!roundIds.length){ box.innerHTML = ''; return; }
  const cur = queue[0];
  box.innerHTML = roundIds.map(id => {
    let cls = 'rdot';
    if(roundDone[id]) cls += ' done';
    else if(id === cur) cls += ' now';
    else if(roundRetry[id]) cls += ' retry';
    return `<i class="${cls}"></i>`;
  }).join('');
}

function render(){
  const total = words.length;
  const masteredCount = words.filter(isMastered).length;
  const roundTotal = roundIds.length;
  const roundKnown = roundIds.filter(id => roundDone[id]).length;

  // 顶部统计
  $('statRound').textContent = `本轮 ${roundKnown} / ${roundTotal || ROUND_SIZE}`;
  $('statMaster').textContent = `已掌握 ${masteredCount} / ${total}`;
  $('barFill').style.width = (roundTotal ? Math.round(roundKnown / roundTotal * 100) : 0) + '%';

  renderDots();

  const w = getCurrentWord();
  const stage = $('stage');
  const actions = $('actions');
  const doneBox = $('doneBox');

  if(!w){
    const empty = total === 0;
    const allMastered = !empty && words.every(isMastered);
    const fuzzy = roundIds.filter(id => !roundDone[id]).length;
    const btn = $('btnNext');

    if(empty){
      $('doneIcon').textContent = '🗂️';
      $('doneTitle').textContent = '词库还是空的';
      $('doneDesc').textContent = '去「词库」导入预设单词，或添加自己的单词吧。';
      $('doneStats').innerHTML = '';
      btn.textContent = '去导入词库';
      btn.dataset.mode = 'lib';
      $('btnResetAll').style.display = 'none';
    }else if(allMastered){
      $('doneIcon').textContent = '🏆';
      $('doneTitle').textContent = '全部单词都掌握啦！';
      $('doneDesc').textContent = `${total} 个词全部达到 ★★★★ 以上，记忆已经比较牢固了。`;
      $('doneStats').innerHTML = `<span>本轮认识<b>${roundKnown}</b></span><span>平均熟练度<b>${
        Math.round(words.reduce((a, x) => a + pctOf(x), 0) / total)
      }%</b></span>`;
      btn.textContent = '再练一轮 · 巩固';
      btn.dataset.mode = 'next';
      $('btnResetAll').style.display = 'block';
    }else{
      $('doneIcon').textContent = '🎉';
      $('doneTitle').textContent = '本轮完成';
      $('doneDesc').textContent = roundTotal
        ? (fuzzy
            ? `本轮 ${roundTotal} 个词里认识了 ${roundKnown} 个，还有 ${fuzzy} 个没到 ★★★★，下轮会优先抽到它们。`
            : `本轮 ${roundTotal} 个词全部答对，熟练度各涨了一颗星。`)
        : '再来一轮，继续巩固记忆。';
      $('doneStats').innerHTML = `<span>认识<b>${roundKnown}</b></span><span>待加强<b>${fuzzy}</b></span><span>词库共<b>${total}</b></span>`;
      btn.textContent = '抽下一轮 · 10 词';
      btn.dataset.mode = 'next';
      $('btnResetAll').style.display = 'block';
    }

    stage.style.display = 'none';
    actions.style.display = 'none';
    doneBox.style.display = 'block';
    return;
  }

  stage.style.display = 'block';
  actions.style.display = 'flex';
  doneBox.style.display = 'none';

  // 填充内容
  $('frontWord').textContent = w.word;
  $('backWord').textContent  = w.word;
  $('meaning').textContent   = w.meaning;
  $('example').textContent   = w.example && w.example.trim() ? w.example : '—— 暂无例句 ——';

  const lvPill = `<span class="lv-stars">${starHtml(lvOf(w))}</span><span class="lv-pct">${pctOf(w)}%</span>`;
  $('frontLevel').innerHTML = lvPill;
  $('backLevel').innerHTML  = lvPill;

  const posEl = $('pos');
  if(w.pos && w.pos.trim()){
    posEl.textContent = w.pos;
    posEl.style.display = 'inline-block';
  }else{
    posEl.style.display = 'none';
  }

  // 重置翻转（回到正面）
  $('flipInner').classList.remove('flipped');
}

/* 切换卡片时的淡出/淡入动画 */
function animateSwitch(cb){
  const stage = $('stage');
  stage.classList.add('is-out');
  setTimeout(() => {
    cb();
    requestAnimationFrame(() => stage.classList.remove('is-out'));
  }, 190);
}

/* ===================== 4. 交互逻辑 ===================== */
function handleKnown(){
  if(!queue.length) return;
  animateSwitch(() => {
    const id = queue.shift();
    const w = words.find(x => x.id === id);
    if(w){
      w.level = Math.min(MAX_LEVEL, lvOf(w) + 1);   // 认识 → 熟练度 +1 星
      w.seen  = (w.seen || 0) + 1;
      w.right = (w.right || 0) + 1;
      w.lastSeen = Date.now();
    }
    roundDone[id] = true;
    delete roundRetry[id];
    save();
    render();
  });
}

function handleUnknown(){
  if(!queue.length) return;
  animateSwitch(() => {
    const id = queue.shift();
    const w = words.find(x => x.id === id);
    if(w){
      w.level = Math.max(0, lvOf(w) - 1);           // 不认识 → 熟练度 -1 星（最低 0）
      w.seen = (w.seen || 0) + 1;
      w.lastSeen = Date.now();
    }
    roundRetry[id] = (roundRetry[id] || 0) + 1;
    // 回队尾再考一次；同一个词本轮最多出现 3 次，避免死循环
    if(roundRetry[id] <= 2 && !roundDone[id] && queue.length) queue.push(id);
    save();
    render();
  });
}

function handleFlip(){
  if(queue.length === 0) return;
  $('flipInner').classList.toggle('flipped');
}

/* ===================== 5. 添加新词（弹窗表单） ===================== */
let modalOpen = false;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- 解析工具（批量导入用） ---- */
function extractPos(rest){
  // 支持 n. / v. / adj. / n./v. / n. / v. 等复合词性
  const re = /^((?:n|v|vt|vi|adj|adv|prep|conj|pron|num|art|interj|aux)\.(?:\s*[\/／,，]\s*(?:n|v|vt|vi|adj|adv|prep|conj|pron|num|art|interj|aux)\.)*)\s*/i;
  const m = rest.match(re);
  if(m){
    const pos = m[1].replace(/\s+/g, '').replace(/\//g, ' / ');
    const meaning = rest.slice(m[0].length).replace(/^[,，;；:：\s]+/, '').trim();
    return { pos, meaning };
  }
  return { pos: '', meaning: rest.replace(/^[,，;；:：\s]+/, '').trim() };
}

function parseLine(raw){
  const line = String(raw).trim();
  if(!line) return null;
  let w = '', rest = '', m;

  if((m = line.match(/^(.+?)\s+[-–—]\s+(.+)$/))){ w = m[1]; rest = m[2]; }           // " - " 破折号
  else if((m = line.match(/^([^,，]+)\s*[,，]\s*(.+)$/))){ w = m[1]; rest = m[2]; }     // 逗号
  else if((m = line.match(/^([A-Za-z][A-Za-z'’\- ]*?)\s+((?:n|v|vt|vi|adj|adv|prep|conj|pron|num|art|interj|aux)\..*)$/i))){ w = m[1]; rest = m[2]; }
  else if((m = line.match(/^([A-Za-z][A-Za-z'’\- ]*?)\s+([\u4e00-\u9fa5\u3000-\u303f].*)$/))){ w = m[1]; rest = m[2]; } // 英文 + 中文释义
  else if((m = line.match(/^(.+?)\s*[-–—]\s*(.+)$/))){ w = m[1]; rest = m[2]; }        // 任意破折号（兜底，放后面避免拆分 hello-world）
  else if((m = line.match(/^(\S+)\s+(.+)$/))){ w = m[1]; rest = m[2]; }                 // 兜底"
  else return { error: true, raw: line };

  w = w.trim(); rest = rest.trim();
  if(!w || !rest) return { error: true, raw: line };
  const { pos, meaning } = extractPos(rest);
  if(!meaning) return { error: true, raw: line };
  return { error: false, word: w, pos, meaning, raw: line };
}

function addSingleWord(){
  const word = $('fWord').value.trim();
  const meaning = $('fMeaning').value.trim();
  const example = $('fExample').value.trim();
  const pos = currentPos();

  let ok = true;
  $('fieldWord').classList.toggle('invalid', !word); if(!word) ok = false;
  $('fieldMeaning').classList.toggle('invalid', !meaning); if(!meaning) ok = false;
  if(!ok){ if(!word) $('fWord').focus(); else $('fMeaning').focus(); return; }

  const dup = words.some(w => w.word.toLowerCase() === word.toLowerCase());
  words.push(normalizeWord({ id: uid(), word, pos, meaning, example }));
  afterWordsChanged();
  render();
  resetSingleForm();
  $('singleNote').textContent = dup
    ? `✓ 已添加：${word}（该词已存在，已作为新条目加入）`
    : `✓ 已添加：${word}，可继续添加`;
  $('fWord').focus();
  showToast('已加入词库：' + word);
}

/* 词库变动后：没有进行中的轮次就新抽一轮，否则保留当前轮不打断 */
function afterWordsChanged(){
  if(!roundIds.length && words.length) startRound();
  else save();
}

/* ---- 批量导入 ---- */
function renderBatchPreview(){
  const el = $('batchPreview');
  const sumEl = $('batchSummary');
  const lines = $('batchInput').value.split('\n').map(s => s.trim()).filter(Boolean);
  if(!lines.length){
    el.innerHTML = '<div class="bp-empty">输入后这里会实时显示解析结果</div>';
    sumEl.textContent = '';
    return;
  }
  const existing = new Set(words.map(w => w.word.toLowerCase()));
  let ok = 0, bad = 0, dup = 0;
  const html = lines.map(line => {
    const p = parseLine(line);
    if(!p || p.error){
      bad++;
      return `<div class="bp-item bad"><span class="bp-ico" style="color:#f87171">✕</span><span class="bp-word">${escapeHtml(line)}</span><span class="bp-note">无法解析</span></div>`;
    }
    if(existing.has(p.word.toLowerCase())){
      dup++;
      return `<div class="bp-item dup"><span class="bp-ico" style="color:#fbbf24">•</span><span class="bp-word">${escapeHtml(p.word)}</span><span class="bp-meaning">${escapeHtml(p.meaning)}</span><span class="bp-note">已存在，跳过</span></div>`;
    }
    ok++;
    return `<div class="bp-item ok"><span class="bp-ico" style="color:#6ee7b7">✓</span><span class="bp-word">${escapeHtml(p.word)}</span><span class="bp-meaning">${escapeHtml(p.meaning)}</span><span class="bp-note">${p.pos ? escapeHtml(p.pos) : ''}</span></div>`;
  }).join('');
  el.innerHTML = html;
  sumEl.innerHTML = `可导入 <b style="color:#6ee7b7">${ok}</b> 条 · 重复 ${dup} 条 · 无法解析 ${bad} 条`;
}

function importBatch(){
  const lines = $('batchInput').value.split('\n').map(s => s.trim()).filter(Boolean);
  if(!lines.length){ $('batchInput').focus(); return; }

  const existing = new Set(words.map(w => w.word.toLowerCase()));
  let added = 0, skipped = 0, invalid = 0;
  lines.forEach(line => {
    const p = parseLine(line);
    if(!p || p.error){ invalid++; return; }
    const key = p.word.toLowerCase();
    if(existing.has(key)){ skipped++; return; }
    words.push(normalizeWord({ id: uid(), word: p.word, pos: p.pos, meaning: p.meaning, example: '' }));
    existing.add(key);
    added++;
  });

  if(added){
    afterWordsChanged();
    render();
    $('batchInput').value = '';
    renderBatchPreview();
    closeModal();
    showToast(`成功导入 ${added} 个单词`
      + (skipped ? `，跳过 ${skipped} 个重复` : '')
      + (invalid ? `，${invalid} 行无法解析` : ''));
  }else{
    showToast(invalid ? `没有可导入的单词（${invalid} 行无法解析）` : '都是已存在的单词，已全部跳过');
  }
}

/* ===================== 5.1 词库（预设 + 我的） ===================== */
function openLib(){
  modalOpen = true;
  $('libMask').classList.add('show');
  document.body.style.overflow = 'hidden';
  renderLib();
}
function closeLib(){
  modalOpen = false;
  $('libMask').classList.remove('show');
  document.body.style.overflow = '';
}

function renderLib(){
  $('mineCount').textContent = `(${words.length})`;
  renderPresetBanks();
  renderMineList();
}

function findBank(id){ return PRESET_BANKS.find(b => b.id === id); }

function renderPresetBanks(){
  const existing = new Set(words.map(w => w.word.toLowerCase()));
  $('presetList').innerHTML = PRESET_BANKS.map(b => {
    const total = b.words.length;
    const owned = b.words.filter(w => existing.has(w.word.toLowerCase())).length;
    const pct = Math.round(owned / total * 100);
    const full = owned >= total;
    const label = full ? '已全部导入' : (owned ? `继续导入 ${total - owned} 词` : `导入 ${total} 词`);
    const stateText = !owned ? '尚未导入' : (full ? `已全部在词库 · ${total} 词` : `已在词库 ${owned} / ${total}`);
    return `
      <div class="bank-card">
        <div class="bank-head">
          <div class="bank-icon">${b.icon}</div>
          <div class="bank-info">
            <div class="bank-name">${b.name}</div>
            <div class="bank-desc">${b.desc}</div>
          </div>
          <div class="bank-count">${total} 词</div>
        </div>
        <div class="bank-progress"><div style="width:${pct}%"></div></div>
        <div class="bank-foot">
          <span class="bank-state">${stateText}</span>
          <div class="bank-btns">
            <button class="bank-btn ghost" data-preview="${b.id}">预览</button>
            <button class="bank-btn" data-import="${b.id}" ${full ? 'disabled' : ''}>${label}</button>
          </div>
        </div>
        <div class="bank-words" id="bw_${b.id}" hidden></div>
      </div>`;
  }).join('');

  $('presetList').querySelectorAll('[data-preview]').forEach(btn => {
    btn.addEventListener('click', () => toggleBankPreview(btn.dataset.preview, btn));
  });
  $('presetList').querySelectorAll('[data-import]').forEach(btn => {
    btn.addEventListener('click', () => importBank(btn.dataset.import));
  });
}

function toggleBankPreview(id, btn){
  const box = $('bw_' + id);
  if(!box) return;
  if(!box.hidden){ box.hidden = true; btn.textContent = '预览'; return; }
  const bank = findBank(id);
  box.innerHTML = bank.words.map(w =>
    `<span class="wchip"><b>${escapeHtml(w.word)}</b> ${escapeHtml(w.meaning)}</span>`
  ).join('');
  box.hidden = false;
  btn.textContent = '收起';
}

function importBank(id){
  const bank = findBank(id);
  if(!bank) return;
  const existing = new Set(words.map(w => w.word.toLowerCase()));
  let added = 0, skipped = 0;
  bank.words.forEach(w => {
    const key = w.word.toLowerCase();
    if(existing.has(key)){ skipped++; return; }
    words.push(normalizeWord({ id: uid(), word: w.word, pos: w.pos, meaning: w.meaning, example: w.example }));
    existing.add(key);
    added++;
  });

  if(added){
    afterWordsChanged();
    render();
    renderLib();
    showToast(`已导入「${bank.name}」${added} 个新词` + (skipped ? `，跳过 ${skipped} 个已存在` : ''));
  }else{
    showToast(`「${bank.name}」的单词已全部在词库中`);
  }
}

/* ===================== 5.2 熟练度 / 我的词库 ===================== */
const MINE_SORTS = [
  { id: 'weak',   label: '最需复习 ↓' },
  { id: 'strong', label: '最熟练 ↓' },
  { id: 'new',    label: '最近添加 ↓' }
];
let mineSort = 'weak';

function cycleMineSort(){
  const i = MINE_SORTS.findIndex(s => s.id === mineSort);
  mineSort = MINE_SORTS[(i + 1) % MINE_SORTS.length].id;
  $('btnSort').textContent = MINE_SORTS.find(s => s.id === mineSort).label;
  renderMineList();
}

function sortMineList(list){
  const a = list.slice();
  if(mineSort === 'weak'){
    a.sort((x, y) => (lvOf(x) - lvOf(y)) || ((x.lastSeen || 0) - (y.lastSeen || 0)));
  }else if(mineSort === 'strong'){
    a.sort((x, y) => (lvOf(y) - lvOf(x)) || ((x.lastSeen || 0) - (y.lastSeen || 0)));
  }else{
    a.reverse();   // words 数组本身按添加顺序
  }
  return a;
}

function statusOf(w){
  if(isMastered(w)) return '<span class="mi-status done">已掌握</span>';
  if(lvOf(w) === 0 && !w.seen) return '<span class="mi-status fresh">未练习</span>';
  return '<span class="mi-status queued">待巩固</span>';
}

function renderMineList(){
  const q = ($('libSearch').value || '').trim().toLowerCase();
  const filtered = words.filter(w =>
    !q || w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q)
  );
  const list = sortMineList(filtered);

  const masteredCount = words.filter(isMastered).length;
  const avg = words.length ? Math.round(words.reduce((a, w) => a + pctOf(w), 0) / words.length) : 0;
  $('mineStats').textContent = `共 ${words.length} 词 · 已掌握 ${masteredCount} · 平均熟练度 ${avg}%`;

  if(!list.length){
    $('mineList').innerHTML = `<div class="mine-empty">${
      words.length ? '没有匹配的单词，换个关键词试试' : '词库还是空的，去「预设词库」导入，或添加自己的单词吧'
    }</div>`;
    return;
  }

  $('mineList').innerHTML = list.map(w => {
    const lv = lvOf(w);
    const pct = pctOf(w);
    const meterCls = lv === 0 ? 'lv0' : (lv < MASTER_LEVEL ? 'low' : '');
    const last = w.lastSeen
      ? new Date(w.lastSeen).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' })
      : '未练习';
    return `
      <div class="mine-item">
        <div class="mi-main">
          <div class="mi-line">
            <span class="mi-word">${escapeHtml(w.word)}</span>
            ${w.pos ? `<span class="mi-pos">${escapeHtml(w.pos)}</span>` : ''}
            <span class="mi-level">${starHtml(lv)}</span>
            ${statusOf(w)}
          </div>
          <div class="mi-meaning">${escapeHtml(w.meaning)}</div>
          <div class="mi-meter ${meterCls}"><i style="width:${pct}%"></i></div>
          <div class="mi-meta">
            <span class="hi">熟练度 ${pct}%</span>
            <span>练习 ${w.seen || 0} 次</span>
            <span>认识 ${w.right || 0} 次</span>
            <span>最近 ${last}</span>
          </div>
        </div>
        <button class="mi-del" data-delword="${w.id}" title="从词库删除">✕</button>
      </div>`;
  }).join('');

  $('mineList').querySelectorAll('[data-delword]').forEach(btn => {
    btn.addEventListener('click', () => deleteWord(btn.dataset.delword));
  });
}

function deleteWord(id){
  const idx = words.findIndex(w => w.id === id);
  if(idx === -1) return;
  const name = words[idx].word;
  words.splice(idx, 1);
  queue = queue.filter(x => x !== id);
  roundIds = roundIds.filter(x => x !== id);
  delete roundDone[id];
  delete roundRetry[id];
  if(!roundIds.length && words.length) startRound();
  else save();
  render();
  renderLib();
  showToast('已删除：' + name);
}

function switchLibTab(name){
  document.querySelectorAll('[data-libtab]').forEach(t => t.classList.toggle('active', t.dataset.libtab === name));
  $('libPanelPreset').classList.toggle('active', name === 'preset');
  $('libPanelMine').classList.toggle('active', name === 'mine');
  if(name === 'mine') renderMineList();
}

/* ===================== 6. Toast ===================== */
let toastTimer = null;
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

});

$('btnResetAll').addEventListener('click', () => {
  if(!words.length) return;
  if(!confirm('确定把全部单词的熟练度清零，从头开始吗？')) return;
  words.forEach(w => { w.level = 0; w.seen = 0; w.right = 0; w.lastSeen = 0; });
  startRound();
  render();
  renderLib();
  showToast('已重置全部熟练度');
});

// 键盘快捷键：空格翻面 / ← 不认识 / → 认识（弹窗打开时让位给表单）
document.addEventListener('keydown', e => {
  if(modalOpen){
    if(e.key === 'Escape'){
      e.preventDefault();
      if($('libMask').classList.contains('show')) closeLib();
      else closeModal();
    }
    return;
  }
  const tag = (e.target.tagName || '').toUpperCase();
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.code === 'Space'){ e.preventDefault(); handleFlip(); }
  else if(e.key === 'ArrowLeft'){ handleUnknown(); }
  else if(e.key === 'ArrowRight'){ handleKnown(); }
});

/* ===================== 8. 启动 ===================== */
initState();
render();
updatePreview();
