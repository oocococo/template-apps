<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电梯结构与原理 · 仿真教学小程序</title>
<meta name="description" content="电梯四大空间八大系统 · 原理图/实物图/仿真图三图对照 · 工作原理动态仿真教学工具">


<style>/* =========================================================================
 * 电梯结构与原理 · 仿真教学小程序 —— 样式表
 * 设计取向：工程教学风格，整洁大气，大字号、高对比、清晰的层级
 * ========================================================================= */

:root {
  --c-primary: #2563eb;
  --c-primary-d: #1d4ed8;
  --c-ink: #0f172a;
  --c-body: #1f2937;
  --c-muted: #5b6675;
  --c-line: #e2e8f0;
  --c-bg: #eef2f7;
  --c-card: #ffffff;
  --c-accent: #0891b2;
  --c-warn: #dc2626;
  --c-ok: #059669;
  --radius: 14px;
  --shadow-s: 0 1px 2px rgba(15, 23, 42, .06), 0 2px 8px rgba(15, 23, 42, .05);
  --shadow-m: 0 4px 14px rgba(15, 23, 42, .10);
  --shadow-l: 0 16px 40px rgba(15, 23, 42, .16);
  --fs-base: 17px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--c-bg);
  color: var(--c-body);
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
  font-size: var(--fs-base);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { color: var(--c-ink); line-height: 1.35; margin: 0 0 .5em; font-weight: 700; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
h4 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
a { color: var(--c-primary); text-decoration: none; }

/* ------------------------------ 顶部导航 ------------------------------ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #0e7490 100%);
  color: #fff;
  box-shadow: var(--shadow-m);
}
.app-header .bar {
  max-width: 1360px;
  margin: 0 auto;
  padding: 14px 28px 0;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand .logo {
  width: 48px; height: 48px; border-radius: 12px;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.28);
  display: grid; place-items: center; font-size: 26px;
}
.brand h1 { color: #fff; font-size: 1.5rem; margin: 0; letter-spacing: .5px; }
.brand .sub { color: #c7d6f8; font-size: .86rem; margin: 2px 0 0; letter-spacing: 1px; }
.header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

.nav-tabs {
  max-width: 1360px;
  margin: 0 auto;
  padding: 12px 20px 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none;
  border: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 1rem;
  font-family: inherit;
  padding: 10px 18px 12px;
  border-radius: 12px 12px 0 0;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all .18s ease;
}
.tab:hover { color: #fff; background: rgba(255,255,255,.08); }
.tab.active { color: #fff; background: rgba(255,255,255,.14); border-bottom-color: #38bdf8; font-weight: 700; }
.tab .k { font-size: .82em; opacity: .75; margin-right: 6px; }

/* ------------------------------ 布局 ------------------------------ */
.wrap { max-width: 1360px; margin: 0 auto; padding: 26px 28px 80px; }
.view { display: none; animation: fade .28s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.section-title {
  display: flex; align-items: center; gap: 12px;
  margin: 30px 0 16px;
}
.section-title .bar { width: 6px; height: 26px; border-radius: 3px; background: var(--c-primary); }
.section-title h2 { margin: 0; }

/* ------------------------------ 通用卡片 ------------------------------ */
.card {
  background: var(--c-card);
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-s);
  padding: 22px 24px;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card.hoverable { cursor: pointer; }
.card.hoverable:hover { transform: translateY(-4px); box-shadow: var(--shadow-m); }

.grid { display: grid; gap: 20px; }
.grid.g4 { grid-template-columns: repeat(4, 1fr); }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.grid.g2 { grid-template-columns: repeat(2, 1fr); }

/* ------------------------------ 首页 Hero ------------------------------ */
.hero {
  background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
  border: 1px solid #dbeafe;
  border-radius: 18px;
  padding: 32px 36px;
  box-shadow: var(--shadow-s);
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 30px;
  align-items: center;
}
.hero h2 { font-size: 1.9rem; margin-bottom: .35em; }
.hero p { color: var(--c-muted); font-size: 1.02rem; margin-bottom: 1.1em; }
.hero-stats { display: flex; gap: 14px; flex-wrap: wrap; }
.stat {
  background: #fff; border: 1px solid var(--c-line); border-radius: 12px;
  padding: 12px 18px; min-width: 118px; box-shadow: var(--shadow-s);
}
.stat b { display: block; font-size: 1.6rem; color: var(--c-primary); line-height: 1.1; }
.stat span { font-size: .84rem; color: var(--c-muted); }
.hero-figure svg { width: 100%; height: auto; }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 13px; border-radius: 999px;
  font-size: .85rem; font-weight: 600;
  background: #eff6ff; color: var(--c-primary-d); border: 1px solid #bfdbfe;
}
.pill.warn { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.pill.ok { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.pill.grey { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }

/* ------------------------------ 空间卡片 ------------------------------ */
.space-card { position: relative; overflow: hidden; }
.space-card .sc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.space-card .sc-icon {
  width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center;
  font-size: 26px; background: #eff6ff; flex: none;
}
.space-card .sc-pos { font-size: .86rem; color: var(--c-muted); }
.space-card .sc-summary { color: var(--c-body); font-size: .96rem; }
.space-card ul { margin: 10px 0 0; padding-left: 20px; }
.space-card li { margin-bottom: 5px; font-size: .94rem; }
.space-card .accent-line { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }

/* ------------------------------ 系统卡片 ------------------------------ */
.sys-card { position: relative; padding-top: 18px; }
.sys-card .no {
  position: absolute; top: -14px; right: 18px;
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center; color: #fff; font-weight: 800;
  box-shadow: var(--shadow-s);
}
.sys-card .sys-head { display: flex; align-items: center; gap: 12px; }
.sys-card .sys-icon { font-size: 28px; }
.sys-card .sys-name { font-size: 1.14rem; font-weight: 700; color: var(--c-ink); }
.sys-card .sys-en { font-size: .78rem; color: var(--c-muted); letter-spacing: .3px; }
.sys-card .sys-summary { font-size: .93rem; color: var(--c-body); margin: 12px 0 10px; min-height: 3.4em; }
.sys-card .sys-foot { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--c-muted); }

/* ------------------------------ 三图对照 ------------------------------ */
.compare {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 8px;
}
.figure {
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-s);
}
.figure .fig-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; font-size: .9rem; font-weight: 700;
  background: #f8fafc; border-bottom: 1px solid var(--c-line); color: var(--c-ink);
}
.figure .fig-label .tag, .gal-title .tag { font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
.figure .fig-body { flex: 1; display: grid; place-items: center; background: #fbfdff; padding: 0; }
.figure .fig-body img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 4 / 3; }
.figure .fig-body .svg-host { width: 100%; padding: 6px; }
.figure .fig-body .svg-host svg { width: 100%; height: auto; display: block; }
.figure .fig-cap { padding: 10px 14px; font-size: .84rem; color: var(--c-muted); border-top: 1px solid var(--c-line); background: #fff; }
/* 两栏对照（E-09 空间弹层 / F-10） */
.compare.two { grid-template-columns: repeat(2, 1fr); }

/* ------------------------------ 结构分析 ------------------------------ */
.panel {
  background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius);
  padding: 20px 24px; box-shadow: var(--shadow-s); margin-bottom: 20px;
}
.panel > h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.panel > h3 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c-primary); }

.cmp-list { display: grid; gap: 10px; }
.cmp-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px; border-radius: 11px; background: #f8fafc; border: 1px solid #eef2f7;
  transition: background .15s;
}
.cmp-item:hover { background: #eff6ff; }
.cmp-item .idx {
  flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--c-primary); color: #fff; font-size: .85rem; font-weight: 700;
}
.cmp-item .n { font-weight: 700; color: var(--c-ink); font-size: .98rem; }
.cmp-item .d { font-size: .9rem; color: var(--c-muted); }
.cmp-item .thumb { flex: none; width: 96px; height: 72px; border-radius: 9px; object-fit: cover; border: 1px solid var(--c-line); background: #eef2f7; }

.bullets { margin: 0; padding-left: 0; list-style: none; }
.bullets li { position: relative; padding-left: 26px; margin-bottom: 10px; font-size: .96rem; }
.bullets li::before {
  content: ""; position: absolute; left: 8px; top: .62em;
  width: 7px; height: 7px; border-radius: 50%; background: var(--c-accent);
}

.formula {
  background: #0f172a; color: #7dd3fc; border-radius: 12px; padding: 16px 20px;
  font-family: "Cambria Math", "Consolas", monospace; font-size: 1.05rem; letter-spacing: .3px;
  border-left: 5px solid #38bdf8; overflow-x: auto;
}

/* ------------------------------ 矩阵表 ------------------------------ */
.matrix { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-s); font-size: .95rem; }
.matrix th, .matrix td { padding: 13px 14px; border-bottom: 1px solid var(--c-line); text-align: left; }
.matrix thead th { background: #0f172a; color: #fff; font-weight: 700; font-size: .92rem; }
.matrix tbody tr:hover { background: #f8fafc; }
.matrix td.c, .matrix th.c { text-align: center; width: 15%; }
.matrix .yes { color: var(--c-ok); font-weight: 800; font-size: 1.15rem; }
.matrix .no { color: #cbd5e1; }

/* ------------------------------ 仿真台 ------------------------------ */
.sim-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
.sim-stage {
  background: radial-gradient(circle at 50% 20%, #ffffff 0%, #eef4fb 100%);
  border: 1px solid var(--c-line); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow-s); min-height: 420px;
}
.sim-stage svg { width: 100%; height: auto; display: block; }
.ctrl { background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-s); }
.ctrl h4 { margin-bottom: 12px; }
.ctrl label { display: block; font-size: .88rem; color: var(--c-muted); margin: 12px 0 5px; font-weight: 600; }
.ctrl input[type=range] { width: 100%; accent-color: var(--c-primary); }
.ctrl select, .ctrl input[type=number] {
  width: 100%; padding: 8px 10px; border: 1px solid var(--c-line); border-radius: 9px;
  font-family: inherit; font-size: .94rem; background: #fff; color: var(--c-body);
}
.ctrl .readout { display: flex; justify-content: space-between; font-size: .88rem; color: var(--c-body); padding: 6px 0; border-bottom: 1px dashed var(--c-line); }
.ctrl .readout b { color: var(--c-primary-d); font-variant-numeric: tabular-nums; }

.btn {
  appearance: none; border: none; cursor: pointer; font-family: inherit;
  font-size: .95rem; font-weight: 700; padding: 10px 18px; border-radius: 10px;
  background: var(--c-primary); color: #fff; transition: all .16s ease;
}
.btn:hover { background: var(--c-primary-d); transform: translateY(-1px); }
.btn.ghost { background: #fff; color: var(--c-primary-d); border: 1px solid #bfdbfe; }
.btn.ghost:hover { background: #eff6ff; }
.btn.dang { background: #dc2626; }
.btn.dang:hover { background: #b91c1c; }
.btn.ok { background: #059669; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* 仿真场景内部元素 */
.sim-rope { stroke: #475569; stroke-width: 2.4; }
.sim-car { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 2; }
.sim-cw { fill: #fde68a; stroke: #b45309; stroke-width: 2; }
.sim-body-label { font-size: 13px; fill: #0f172a; font-weight: 700; font-family: inherit; }
.sim-hint { font-size: 13px; fill: #b91c1c; font-weight: 700; }
.sim-lead { font-size: 13.5px; fill: #1e3a8a; font-weight: 700; }

.log {
  margin-top: 14px; background: #0f172a; color: #a5f3fc; border-radius: 11px;
  padding: 12px 14px; font-family: Consolas, monospace; font-size: .84rem;
  max-height: 150px; overflow-y: auto; line-height: 1.6;
}
.log div { opacity: .92; }

/* ------------------------------ 测验 ------------------------------ */
.quiz-card { background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow-s); margin-bottom: 16px; }
.quiz-card .qno { font-size: .82rem; color: var(--c-muted); font-weight: 700; letter-spacing: .5px; }
.quiz-card .qtext { font-size: 1.06rem; font-weight: 700; color: var(--c-ink); margin: 6px 0 14px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px;
  border: 2px solid var(--c-line); border-radius: 11px; margin-bottom: 9px;
  cursor: pointer; transition: all .15s ease; font-size: .97rem;
}
.opt:hover { border-color: #bfdbfe; background: #f8fafc; }
.opt .k {
  flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
  background: #eef2f7; color: #475569; font-weight: 800; font-size: .84rem;
}
.opt.sel { border-color: var(--c-primary); background: #eff6ff; }
.opt.sel .k { background: var(--c-primary); color: #fff; }
.opt.right { border-color: var(--c-ok); background: #ecfdf5; }
.opt.right .k { background: var(--c-ok); color: #fff; }
.opt.wrong { border-color: var(--c-warn); background: #fef2f2; }
.opt.wrong .k { background: var(--c-warn); color: #fff; }
.explain { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: #f8fafc; border-left: 4px solid var(--c-accent); font-size: .92rem; color: var(--c-body); display: none; }
.explain.show { display: block; }
.score-bar {
  position: sticky; bottom: 0; margin-top: 18px;
  background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff;
  border-radius: 14px; padding: 16px 22px; display: flex; align-items: center; gap: 18px;
  box-shadow: var(--shadow-l);
}
.score-bar .big { font-size: 1.7rem; font-weight: 800; }
.score-bar .lbl { font-size: .86rem; color: #c7d6f8; }

/* ------------------------------ 详情弹层 ------------------------------ */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .55);
  backdrop-filter: blur(3px); display: none; place-items: center; z-index: 100; padding: 26px;
}
.modal-mask.show { display: grid; animation: fade .2s ease; }
.modal {
  background: #fff; border-radius: 16px; width: min(1080px, 100%); max-height: 90vh;
  overflow-y: auto; box-shadow: var(--shadow-l); padding: 26px 30px 34px;
}
.modal-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 8px; }
.modal-head h2 { margin: 0; }
.modal-head .close {
  margin-left: auto; appearance: none; border: none; background: #f1f5f9; color: #475569;
  width: 38px; height: 38px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; flex: none;
}
.modal-head .close:hover { background: #e2e8f0; }
.modal .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

/* ------------------------------ 页脚 ------------------------------ */
.app-footer {
  text-align: center; color: var(--c-muted); font-size: .85rem; padding: 26px;
}
.app-footer .line { max-width: 1360px; margin: 0 auto 14px; height: 1px; background: var(--c-line); }

/* ------------------------------ 模块照片带（v1.3.0，自扶梯版移植） ------------------------------ */
.photo-strip { margin-bottom: 22px; }
.photo-strip .ps-title { font-size: .95rem; font-weight: 800; color: var(--c-ink); margin-bottom: 10px; }
.photo-strip .ps-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.photo-item {
  flex: none; width: 240px; margin: 0; background: #fff;
  border: 1px solid var(--c-line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-s);
  cursor: pointer; transition: box-shadow .15s ease, transform .15s ease;
}
.photo-item:hover { box-shadow: var(--shadow-m); transform: translateY(-2px); }
/* 实物图一律 contain 保留完整结构，避免 cover 裁掉上下主体 */
.photo-item img { width: 100%; height: 160px; object-fit: contain; display: block; background: #f1f5f9; }
/* 竖长幅（v1.4.0）：22 张渲染图有 9 张宽高比 <0.75（限速器 289×1245 仅 0.232）。
   统一 240×160 方框下 contain 只剩 ~37px 宽，不裁但主体看不清 → 改窄高卡，可视面积约 3.9 倍。 */
.photo-item.tall { width: 150px; }
.photo-item.tall img { height: 300px; }
/* 超扁幅（门机 723×282，2.56）：加宽卡片，避免上下留大片空白 */
.photo-item.wide { width: 310px; }
.photo-item figcaption {
  padding: 9px 12px; font-size: .84rem; font-weight: 700; color: var(--c-body);
  line-height: 1.45; border-top: 1px dashed var(--c-line);
}

/* ------------------------------ 实物图库（v1.3.0） ------------------------------ */
.gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 8px; }
.gal-item {
  background: #fff; border: 1px solid var(--c-line); border-radius: 12px; overflow: hidden;
  cursor: pointer; box-shadow: var(--shadow-s); transition: transform .15s ease, box-shadow .15s ease;
}
.gal-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-m); }
.gal-item .gal-img { aspect-ratio: 4 / 3; background: #f1f5f9; }
/* 竖长幅（v1.4.0）：网格卡改用竖向框，竖图不再被压成一条细线 */
.gal-item.tall .gal-img { aspect-ratio: 3 / 4; }
.gal-item .gal-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.gal-item .gal-body { padding: 12px 14px; }
.gal-item .gal-title { font-weight: 700; color: var(--c-ink); font-size: .98rem; }
.gal-item .gal-cap { font-size: .85rem; color: var(--c-muted); margin-top: 4px; }
/* 灯箱大图（v1.4.0）：max-height 限幅，竖长图不再被 width:100% 拉到 3 倍以上而发虚，
   改为按高度自适应居中，保证 1:1 像素清晰度且不超一屏 */
.gallery-large img {
  width: auto; height: auto; max-width: 100%; max-height: 70vh;
  margin: 0 auto; display: block; border-radius: 12px; border: 1px solid var(--c-line);
}
@media (max-width: 1100px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 820px) { .gallery-grid { grid-template-columns: 1fr; } }

/* ------------------------------ 讲解模式 ------------------------------ */
body.present-mode { --fs-base: 19px; }
body.present-mode .wrap { max-width: 1180px; }
body.present-mode .compare { grid-template-columns: 1fr; }
body.present-mode .sim-layout { grid-template-columns: 1fr; }
/* 大号读数：讲解模式下读数区字号 +35%（02 文档 2.5） */
body.present-mode .ctrl .readout { font-size: 1.19rem; }
body.present-mode .ctrl .readout b { font-size: 1.19rem; }

/* 分步演示面板（C-03 框架） */
.present-panel {
  background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff;
  border-radius: 14px; padding: 16px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow-l);
}
.present-panel[hidden] { display: none; }
.present-panel .pp-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.present-panel .pp-step {
  background: #f59e0b; color: #0f172a; font-weight: 800; font-size: .85rem;
  padding: 3px 10px; border-radius: 999px; flex: none;
}
.present-panel .pp-title { font-size: 1.15rem; }
.present-panel .pp-desc { margin: 8px 0 12px; color: #dbeafe; font-size: .98rem; line-height: 1.6; }
.present-panel .pp-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.present-panel .pp-btns .btn { padding: 8px 15px; font-size: .9rem; }
.present-panel .pp-btns .btn.ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35); }
.present-panel .pp-btns .btn.ghost:hover { background: rgba(255,255,255,.22); }
.present-panel .pp-btns .btn.ok { background: #059669; }
.present-panel .pp-btns .btn.dang { background: #dc2626; }

/* 步骤高亮（仅作用于 SVG 元素；强调线宽在原值上 +2，避免改动物理几何） */
.hl {
  stroke: #f59e0b;
  /* 不覆盖 stroke-width：CSS 优先级高于 SVG 属性，写死会让 5/6/7 的粗线被压细成 4，
     表现为"高亮某部件反而变细"；改为只变色 + 发光 + 脉冲，保留元素自身线宽 */
  filter: drop-shadow(0 0 6px rgba(245, 158, 11, .85));
  animation: hlPulse 1.2s ease-in-out infinite;
}
@keyframes hlPulse { 50% { opacity: .55; } }
/* HTML 卡片用 outline 变体 */
.hl-outline { outline: 3px solid #f59e0b; outline-offset: 2px; border-radius: 10px; }

/* ------------------------------ 响应式 ------------------------------ */
@media (max-width: 1100px) {
  .grid.g4 { grid-template-columns: repeat(2, 1fr); }
  .hero { grid-template-columns: 1fr; }
  .sim-layout { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .grid.g3, .grid.g2, .grid.g4 { grid-template-columns: 1fr; }
  .compare, .compare.two { grid-template-columns: 1fr; }
  .wrap { padding: 18px 16px 60px; }
  .app-header .bar { padding: 12px 16px 0; }
}

/* 打印（教师备课导出） */
@media print {
  .app-header, .score-bar, .ctrl, .btn-row { display: none !important; }
  .view { display: block !important; }
  .card, .panel { box-shadow: none; border-color: #999; }
}
</style>

<script>/* =========================================================================
 * 原理图库（矢量 SVG 绘制）
 * 覆盖：四大空间示意图 + 八大系统原理图
 * ========================================================================= */

let _uid = 0;
const S = {
  /** 文本 */
  txt(x, y, s, o = {}) {
    const { anchor = 'middle', size = 13, fill = '#0f172a', weight = 700, cls = '' } = o;
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" fill="${fill}" font-weight="${weight}" font-family="inherit"${cls ? ` class="${cls}"` : ''}>${s}</text>`;
  },
  /** 线条 */
  ln(x1, y1, x2, y2, o = {}) {
    const { stroke = '#334155', w = 2, dash = '' } = o;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  },
  /** 矩形 */
  rc(x, y, w, h, o = {}) {
    const { fill = '#ffffff', stroke = '#334155', sw = 2, rx = 5, dash = '', opacity = 1 } = o;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${opacity}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  },
  /** 圆 */
  ci(cx, cy, r, o = {}) {
    const { fill = 'none', stroke = '#334155', sw = 2, dash = '' } = o;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  },
  /** 多边形 */
  pg(points, o = {}) {
    const { fill = '#ffffff', stroke = '#334155', sw = 2 } = o;
    return `<polygon points="${points.map(p => p.join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  },
  /** 箭头线 */
  ar(x1, y1, x2, y2, o = {}) {
    const { stroke = '#2563eb', w = 2.4, head = 9, dash = '' } = o;
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const bx = x2 - head * Math.cos(ang), by = y2 - head * Math.sin(ang);
    const p1 = [x2 - head * 1.7 * Math.cos(ang - 0.42), y2 - head * 1.7 * Math.sin(ang - 0.42)];
    const p2 = [x2 - head * 1.7 * Math.cos(ang + 0.42), y2 - head * 1.7 * Math.sin(ang + 0.42)];
    return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${stroke}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
      `<polygon points="${p1.join(',')} ${x2},${y2} ${p2.join(',')}" fill="${stroke}"/>`;
  },
  /** 钢丝绳（双线） */
  rope(x1, y1, x2, y2) {
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#475569" stroke-width="2.6"/>` +
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="5 4"/>`;
  },
  /** 尺寸标注（水平） */
  dimH(x1, x2, y, label) {
    return S.ln(x1, y, x2, y, { stroke: '#0891b2', w: 1.4 }) +
      S.ln(x1, y - 6, x1, y + 6, { stroke: '#0891b2', w: 1.4 }) +
      S.ln(x2, y - 6, x2, y + 6, { stroke: '#0891b2', w: 1.4 }) +
      S.txt((x1 + x2) / 2, y - 9, label, { size: 12, fill: '#0e7490' });
  },
  /** 尺寸标注（垂直） */
  dimV(y1, y2, x, label) {
    return S.ln(x, y1, x, y2, { stroke: '#0891b2', w: 1.4 }) +
      S.ln(x - 6, y1, x + 6, y1, { stroke: '#0891b2', w: 1.4 }) +
      S.ln(x - 6, y2, x + 6, y2, { stroke: '#0891b2', w: 1.4 }) +
      `<text x="${x - 8}" y="${(y1 + y2) / 2}" text-anchor="middle" font-size="12" fill="#0e7490" font-weight="700" font-family="inherit" transform="rotate(-90 ${x - 8} ${(y1 + y2) / 2})">${label}</text>`;
  }
};

/** 统一封装 */
function svgWrap(w, h, inner, bg) {
  _uid++;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">` +
    (bg ? `<rect x="0" y="0" width="${w}" height="${h}" fill="${bg}"/>` : '') +
    inner + `</svg>`;
}

function makePlanner(aMax, jMax) {
  let a = 0;                                   // 当前加速度
  return function plan(v, target, dt) {
    const dv = target - v;
    if (Math.abs(dv) < 1e-4 && Math.abs(a) < 1e-3) { a = 0; return target; }

    if (Math.abs(dv) < Math.abs(a) * dt) a = dv / dt;               // 防过冲

    if ((dv > 0 && nv > target) || (dv < 0 && nv < target)) { nv = target; a = 0; }

  };

    function refresh() {
      const Q = ctx.state.load;
      const n = ctx.state.ratio === '2:1' ? 2 : 1;
      const f = FG[ctx.state.groove] || 0.25;
      const LIMIT = Math.exp(f * A_S);
      const mCar = P + Q, mCw = W;
      const Tcar = mCar * G / n / 1000, Tcw = mCw * G / n / 1000;
      const T1 = Math.max(Tcar, Tcw), T2 = Math.min(Tcar, Tcw);
      const ratio = T1 / Math.max(1e-6, T2);
      const chk = ratio * C1 * C2;
      const slip = chk > LIMIT;
      const dm = mCar - mCw;
      const vRope = V_CAR * n;
      const F = Math.abs(dm) * G / n;
      const kW = (F * vRope / ETA) / 1000;

        ['对重质量 W', `${mCw} kg`],
        ['不平衡质量 Δm', `${dm > 0 ? '+' : ''}${dm} kg`],
        ['曳引轮张力 T₁ / T₂', `${T1.toFixed(2)} / ${T2.toFixed(2)} kN`],
        ['单根钢丝绳张力（4 根）', `${perRope.toFixed(2)} kN`],
        ['钢丝绳安全系数 K', `<b style="color:${safety >= 12 ? '#059669' : '#dc2626'}">${safety.toFixed(1)}</b>（GB 7588 要求 ≥12）`],
        ['曳引校核 (T₁/T₂)·C₁·C₂', `<b style="color:${slip ? '#dc2626' : '#059669'}">${chk.toFixed(3)}</b> / e^(fα) = ${LIMIT.toFixed(3)}`],
        ['当量摩擦系数 f', `${f.toFixed(2)}（${ctx.state.groove === 'normal' ? '带切口槽' : '磨损半圆槽'}）`],
        ['包角 α（曳引轮/导向轮）', `135° / 45°`],
        ['曳引结论', slip ? '<b style="color:#dc2626">打滑！曳引能力不足</b>' : '<b style="color:#059669">满足曳引条件</b>'],

        ['电机转矩 / 转速（估）', `${torque.toFixed(0)} N·m / ${rpm.toFixed(1)} r/min`],

      rCw.setAttribute('x1', XCW); rCw.setAttribute('y1', DY);
      rCw.setAttribute('x2', XCW); rCw.setAttribute('y2', (is21 ? cy2 : cwTop).toFixed(1));
      // 2:1 绳头板 ↔ 反绳轮（始终垂直）
      rT1.setAttribute('x1', XT1); rT1.setAttribute('y1', YT); rT1.setAttribute('x2', XT1); rT1.setAttribute('y2', cy1.toFixed(1));
      rT2.setAttribute('x1', XT2); rT2.setAttribute('y1', YT); rT2.setAttribute('x2', XT2); rT2.setAttribute('y2', cy2.toFixed(1));
      aCar.setAttribute('d', `M ${XT1} ${cy1.toFixed(1)} A ${RC} ${RC} 0 0 0 ${XCAR} ${cy1.toFixed(1)}`);
      aCw.setAttribute('d', `M ${XCW} ${cy2.toFixed(1)} A ${RC} ${RC} 0 0 0 ${XT2} ${cy2.toFixed(1)}`);
      sheave.setAttribute('transform', `rotate(${ang.toFixed(2)} ${SX} ${SY})`);
      defl.setAttribute('transform', `rotate(${angD.toFixed(2)} ${DX} ${DY})`);
    });
    return {
      destroy: stop,
      onchange(k, v) {

        ['总吊挂载荷 P+Q', `<b>${T} kg</b>（约 ${(T * G / 1000).toFixed(1)} kN）`],
        ['载荷率', `<b style="color:${over ? '#dc2626' : (pct > 0.8 ? '#f59e0b' : '#059669')}">${(pct * 100).toFixed(0)}%</b>（报警阈值 110%）`],
        ['超载保护判定', over ? '<b style="color:#dc2626">超载动作：禁止启动 + 声光报警</b>' : '<b style="color:#059669">未超载，允许启动</b>'],

        ['单根钢丝绳张力（4 根）', `${(T * G / N_ROPE / 1000).toFixed(2)} kN`],
        ['称重弹性下沉（示意）', `${(sag / 5 * 3).toFixed(1)} mm`]
      ]);
    }
    const stop = ticker(() => refresh());
    return {
      destroy: stop,
      onchange(k, v) {
        ctx.state[k] = v;
        if (k === 'load' && v > QR * 1.1) ctx.logLine(`载重 ${v} kg 超过 110% 额定载重：超载装置动作，电梯保持开门、禁止启动并发出声光报警`);

      },
      onaction() { }
    };
  }
};

        }

    };
  }
};

  mount(ctx) {

    const carG = E('g', {});

    const cwG = E('g', {});

    svg.appendChild(carG); svg.appendChild(cwG);
    const beam = svg.querySelector('line[y1="130"]');

      ${line(CX0, CZERO, CX1, CZERO, '#94a3b8', 1.6)}
      ${line(CX0, CZERO - CHALF, CX0, CZERO + CHALF, '#94a3b8', 1.6)}
      ${txtEl(CX0 - 6, CZERO - CHALF + 4, '+I', { anchor: 'end', size: 11, fill: '#dc2626' })}
      ${txtEl(CX0 - 6, CZERO + CHALF, '−I', { anchor: 'end', size: 11, fill: '#059669' })}

    function elec(d, dirSign) {
      const pm = d * G * V * dirSign / 1000;                       // 曳引轮轴功率 kW（>0 电动，<0 发电）
      const pg = pm > 0 ? pm / ETA : (pm < 0 ? pm * ETA : 0);      // 电网侧功率 kW（>0 吸收，<0 回馈）
      return { pm: pm, pg: pg, I: pg * 1000 / (SQ3 * U_L * COSF) };

    const clampY = y => Math.max(CZERO - CHALF, Math.min(CZERO + CHALF, y));

      const K = ctx.state.K, Q = ctx.state.load;
      const up = ctx.state.dir !== 'down';

      const F = dm * G;                                             // 不平衡力 N

      const pts = [];
      for (let q = 0; q <= 1000; q += 50) {
        const ei = elec((P + q) - W, dirSign);
        pts.push([CX0 + q / 1000 * (CX1 - CX0), clampY(CZERO - ei.I / I_FS * CHALF)]);

      curve.setAttribute('d', 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L'));
      // 平衡点（Δm = 0 处，Q = K·Q额）
      const bx0 = CX0 + (K * QR) / 1000 * (CX1 - CX0);
      balLine.setAttribute('x1', bx0.toFixed(1)); balLine.setAttribute('y1', CZERO - CHALF);
      balLine.setAttribute('x2', bx0.toFixed(1)); balLine.setAttribute('y2', CZERO + CHALF);
      balTxt.setAttribute('x', bx0.toFixed(1)); balTxt.setAttribute('y', CZERO - CHALF + 16);
      balTxt.textContent = `平衡点 Q=${(K * QR).toFixed(0)}`;
      marker.setAttribute('cx', (CX0 + Q / 1000 * (CX1 - CX0)).toFixed(1));
      marker.setAttribute('cy', clampY(CZERO - e.I / I_FS * CHALF).toFixed(1));
      marker.setAttribute('fill', motoring ? '#dc2626' : (generating ? '#059669' : '#64748b'));
      beam.setAttribute('transform', `rotate(${tilt.toFixed(2)} ${PIVX} ${PIVY})`);
      carG.setAttribute('transform', `translate(${(ax - 196).toFixed(2)},${(ay - 130).toFixed(2)})`);
      cwG.setAttribute('transform', `translate(${(bx - 524).toFixed(2)},${(by - 130).toFixed(2)})`);
      dmT.textContent = `Δm = (P+Q) − W = ${dm > 0 ? '+' : ''}${dm.toFixed(0)} kg（${dm > 0 ? '轿厢侧重' : dm < 0 ? '对重侧重' : '完全平衡'}）`;
      dmT.setAttribute('fill', Math.abs(dm) < 25 ? '#059669' : '#b45309');
      note.textContent = `K = ${K.toFixed(2)}（国标 0.40~0.50）· ${up ? '上行' : '下行'}：${Math.abs(dm) < 25 ? '★ 处于平衡点附近，拖动功率≈0，能耗最低' : (motoring ? `电动工况——电机从电网吸收 ${Math.abs(e.pg).toFixed(2)} kW` : `发电工况——机械能回馈 ${Math.abs(e.pg).toFixed(2)} kW`)}`;
      note.setAttribute('fill', Math.abs(dm) < 25 ? '#059669' : (motoring ? '#b45309' : '#0e7490'));
      ctx.readout([
        ['轿厢自重 P', `${P} kg`],
        ['额定载重 Q额', `${QR} kg`],
        ['平衡系数 K', `<b>${K.toFixed(2)}</b>（GB/T 10058 / GB 7588：0.40~0.50）`],
        ['对重总重 W = P + K·Q额', `<b>${W.toFixed(0)} kg</b>`],
        ['当前载重 Q', `${Q} kg`],
        ['不平衡质量 Δm = (P+Q) − W', `<b style="color:${Math.abs(dm) > 600 ? '#dc2626' : '#059669'}">${dm > 0 ? '+' : ''}${dm.toFixed(0)} kg</b>（${dm > 0 ? '轿厢侧重' : dm < 0 ? '对重侧重' : '平衡'}）`],
        ['不平衡力 F = Δm·g', `${(F / 1000).toFixed(2)} kN`],
        ['运行方向', `<b>${up ? '上行 ↑（轿厢上升）' : '下行 ↓（轿厢下降）'}</b>`],
        ['拖动状态（电动 / 发电）', motoring ? '<b style="color:#dc2626">电动：转矩与转向同向，电机拖动负载</b>'
          : generating ? '<b style="color:#059669">发电：转矩与转向相反，位能反拖电机发电</b>'
            : '<b style="color:#059669">平衡：Δm≈0，仅需克服摩擦与损耗</b>'],
        ['曳引轮轴功率 P = F·v', `${e.pm > 0 ? '+' : ''}${e.pm.toFixed(2)} kW（v = ${V.toFixed(1)} m/s）`],
        ['电网侧功率（估）', `${e.pg > 0 ? '+' : ''}${e.pg.toFixed(2)} kW（${e.pg > 0 ? '吸收' : e.pg < 0 ? '回馈' : '—'}）`],
        ['拖动电流 I（示意，带符号）', `<b style="color:${motoring ? '#dc2626' : generating ? '#059669' : '#64748b'}">${e.I > 0 ? '+' : ''}${e.I.toFixed(1)} A</b>（${motoring ? '由变频器流向电机（电动）' : generating ? '由电机流向变频器（发电回馈）' : '≈0（仅励磁与损耗）'}）`],
        ['电流方向说明', motoring ? '上行 Δm>0 或下行 Δm<0：重侧下行方向被电机提升 → 电动，电流为正'
          : generating ? '上行 Δm<0 或下行 Δm>0：重侧自然下行、位能反拖电机 → 发电，电流为负（回馈电网；无回馈单元时由制动电阻耗能）'

        ['能耗评价', Math.abs(dm) < 25 ? '<b style="color:#059669">最节能工况点</b>' : (Math.abs(dm) > 500 ? '<b style="color:#dc2626">|Δm| 偏大，拖动电流偏高</b>' : '<b style="color:#059669">|Δm| 适中</b>')]
      ]);
    }
    const stop = ticker(() => paint());
    return { destroy: stop, onchange(k, v) { ctx.state[k] = v; } };
  }
};
function circle3(cx, cy, r) { return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2.4"/>`; }

      const T = running && v < vmax ? 1.35 : 1.0;
      /* 运行状态四态判定（D-04）：
       * 停止 = 运行指令已撤销且 v≈0；减速中 = v 正在下降（含目标速度下调后的降速段）；
       * 加速中 = 有运行指令且 v 未达给定；匀速 = 有运行指令且 v≈给定。 */
      const dv = v - vPrev; vPrev = v;
      const stRun = (!running && v < 0.01) ? '停止（制动器抱闸）'
        : (dv < -1e-4) ? '减速中（S 曲线后段 → 末端抱闸）'
          : (running && v < vmax - 0.01) ? '加速中（S 曲线前段）'
            : (running && Math.abs(v - vmax) <= 0.01) ? '匀速运行'
              : '减速中（S 曲线后段 → 末端抱闸）';
      ctx.readout([
        ['给定速度', `${vmax.toFixed(1)} m/s`],
        ['实际速度', `<b>${v.toFixed(2)} m/s</b>`],
        ['输出频率 f（示意）', `${f.toFixed(1)} Hz`],
        ['输出电压 U（示意）', `${U.toFixed(0)} V`],
        ['转矩指令 T', `${T.toFixed(2)} 倍额`],
        ['运行状态', `<b style="color:${stRun === '停止（制动器抱闸）' ? '#64748b' : (stRun.indexOf('减速') >= 0 ? '#b45309' : '#1d4ed8')}">${stRun}</b>`]
      ]);
    }
    paint(0.016);
    const stop = ticker(paint);
    return {
      destroy: stop,
      onchange(k, v2) { ctx.state[k] = v2; },
      onaction(k) {
        if (k === 'run') { running = true; ctx.logLine('启动：变频器输出按 S 曲线升速'); }
        if (k === 'stop') { running = false; ctx.logLine('停止：按 S 曲线减速，末端抱闸'); }
        if (k === 'reset') { v = 0; ang = 0; hist = []; running = false; ctx.logLine('复位'); }
      }
    };
  }
};

        ['运行方向', dirn > 0 ? '上行' : dirn < 0 ? '下行' : '停止'],
        ['当前速度', `<b style="color:${(ctx.state.inspMode || state === 'rescue') && v > V_INSP + 0.01 ? '#dc2626' : '#1d4ed8'}">${v.toFixed(2)} m/s</b>${ctx.state.inspMode || state === 'rescue' ? `（检修速度 ${V_INSP.toFixed(2)}）` : ''}`],
        ['平层误差', `${(Math.abs(pos - Math.round(pos)) < 0.02 ? 0 : err).toFixed(0)} mm`],
        ['目标楼层', state === 'rescue' ? `<b style="color:#b45309">${rescueTo}F（救援平层）</b>` : (target ? target + 'F' : '—')],
        ['门状态', doorR2 > 0.02 ? '开启中' : '关闭（门锁闭合）'],
        ['运行模式', ctx.state.inspMode ? '<b style="color:#b45309">检修（点动）</b>' : (state === 'rescue' ? '<b style="color:#b45309">救援平层</b>' : '正常（集选）')],
        ['急停开关', ctx.state.estop ? '<b style="color:#dc2626">已按下（停止）</b>' : '正常'],
        ['公共按钮（保持）', comLatch ? '<b style="color:#059669">信号保持中</b>' : '未保持'],
        ['检修按钮时序', ctx.state.inspMode ? (comLatch ? (holdUp || holdDn ? '<b style="color:#059669">公共保持 + 方向 → 运行</b>' : '已保持公共，待按方向') : '<b style="color:#dc2626">未按公共按钮 → 不运行</b>') : '—'],
        ['内选登记（轿内）', [1, 2, 3, 4].filter(f => carCalls[f]).map(f => f + 'F').join('、') || '—'],
        ['外呼登记（层站）', (() => { const a = []; [1, 2, 3, 4].forEach(f => { if (hallU[f]) a.push(f + 'F▲'); if (hallD[f]) a.push(f + 'F▼'); }); return a.join('、') || '—'; })()],
        ['系统状态', { idle: '待机', move: '运行中', level: '平层校正', dooropen: '开门', dwell: '保持开门', doorclose: '关门', jog: '检修点动', rescue: '救援就近平层' }[state] || state]
      ]);
    }
    paint();
    const stop = ticker(dt => {
      const insp = ctx.state.inspMode;
      if (ctx.state.estop) {
        v = 0;
      } else if (state === 'rescue') {
        if (ctx.state.inspMode) { v = 0; }   // 检修介入：暂停就近平层，切回正常后继续
        else {
          // 救援：只能以检修速度就近平层
          const d = Math.sign(rescueTo - pos);
          v = Math.min(V_INSP, v + 1.0 * dt);
          pos += d * v / H * dt;
          dirn = d;
          if ((d > 0 && pos >= rescueTo) || (d < 0 && pos <= rescueTo)) { pos = rescueTo; v = 0; state = 'level'; leveling = 0; }
        }
      } else if (insp) {
        if (comLatch && (holdUp || holdDn)) {
          const d = holdUp ? 1 : -1;
          v = Math.min(V_INSP, v + 1.2 * dt);
          pos += d * v / H * dt;
          if (pos > 4) { pos = 4; v = 0; }
          if (pos < 1) { pos = 1; v = 0; }
          dirn = d; state = 'jog';
        } else { v = 0; dirn = 0; if (state === 'jog') state = 'idle'; }
      } else {
        const vmax = 1.6, acc = 1.2;
        if (state === 'idle') {
          const c = choose();
          if (c) {
            if (c.dir === 0) { v = 0; dirn = 0; state = 'dooropen'; doorR2 = 0; target = c.floor; ctx.logLine(`本层召唤：直接开门应答 ${c.floor}F`); }
            else { target = c.floor; dirn = c.dir; state = 'move'; ctx.logLine(`集选控制：方向 ${c.dir > 0 ? '上行' : '下行'}，下一应答 ${c.floor}F`); }
          }
        } else if (state === 'move') {
          // 运行中若有同向更近的召唤（顺向截梯），动态插入为下一应答层
          const c2 = choose();
          if (c2 && c2.dir === dirn && ((dirn > 0 && c2.floor < target) || (dirn < 0 && c2.floor > target))) {
            target = c2.floor; ctx.logLine(`顺向截梯：插入同向更近的 ${c2.floor}F 为下一应答层`);
          }
          const d = target - pos;
          dirn = Math.sign(d);
          if (Math.abs(d) < 0.02) { v = 0; pos = target; state = 'level'; leveling = 0; }
          else {
            const vSafe = Math.sqrt(2 * acc * Math.abs(d) * 0.9);
            v = Math.max(0, planV(v, Math.min(vmax, vSafe), dt));
            pos += dirn * v / H * dt;
            if ((dirn > 0 && pos > target) || (dirn < 0 && pos < target)) pos = target;
          }
        } else if (state === 'level') {
          leveling += dt;
          if (leveling > 0.9) { v = 0; state = 'dooropen'; doorR2 = 0; ctx.logLine('平层完成，编码器 + 平层感应器双重确认'); }
        } else if (state === 'dooropen') {
          doorR2 = Math.min(1, doorR2 + dt * 1.1);
          if (doorR2 >= 1) { dwell = 2.4; state = 'dwell'; const f = Math.round(pos); clearAt(f); ctx.logLine(`${f}F 开门到位，清除该层内选与本方向外呼`); }
        } else if (state === 'dwell') {
          dwell -= dt;
          if (dwell <= 0) { state = 'doorclose'; ctx.logLine('延时结束，执行关门'); }
        } else if (state === 'doorclose') {
          doorR2 = Math.max(0, doorR2 - dt * 1.4);
          if (doorR2 <= 0) {
            const done = Math.round(pos);
            if (rescueNote) { ctx.logLine(rescueNote + '：就近平层完成，恢复正常运行控制'); rescueNote = ''; }
            target = null;
            if (!anyCall()) dirn = 0;
            state = 'idle'; ctx.logLine('门锁闭合，安全回路接通');
            if (done === 1 || done === 4) dirn = done === 1 ? 1 : -1;   // 端站自动定向
          }
        }
      }
      paint();
    });
    /* 动作分发：面板按钮（若有）与示意图内控件共用 */
    function doAction(k) {
      const cm = /^c([1-4])$/.exec(k);
      if (cm) { addCarCall(parseInt(cm[1], 10)); return; }
      const hm = /^h([1-4])([ud])$/.exec(k);
      if (hm) { toggleHall(parseInt(hm[1], 10), hm[2]); return; }
      if (k === 'sw') {
        ctx.state.inspMode = !ctx.state.inspMode;
        if (ctx.state.inspMode) {
          [1, 2, 3, 4].forEach(f => { carCalls[f] = false; hallU[f] = false; hallD[f] = false; });
          target = null; dirn = 0; v = 0; state = 'idle'; comLatch = false;
          ctx.logLine('转换开关切至【检修】：取消正常运行控制与全部召唤，进入点动检修（0.50 m/s）');
        } else {
          comLatch = false;
          tryRestore('检修转正常');
        }
        return;
      }
      if (k === 'estop') {
        ctx.state.estop = !ctx.state.estop;
        if (ctx.state.estop) {
          // 急停：立即停止 + 取消全部召唤登记（安全回路断开，控制系统失电）
          v = 0; comLatch = false; holdUp = false; holdDn = false;
          [1, 2, 3, 4].forEach(f => { carCalls[f] = false; hallU[f] = false; hallD[f] = false; });
          target = null; dirn = 0; state = 'idle'; doorR2 = 0; dwell = 0;
          ctx.logLine('⛔ 急停按下：电梯立即停止，取消全部呼梯登记（须人工复位）');
        }
        else {
          tryRestore('急停复位');
        }
        return;
      }
      if (k === 'com') {
        // 公共按钮：按下后保持信号（再按一次解除）
        comLatch = !comLatch;
        if (!ctx.state.inspMode) ctx.logLine('提示：公共按钮仅在检修状态有效');
        else ctx.logLine(comLatch ? '公共按钮：信号保持（须再按住上行/下行方可点动运行）' : '公共按钮：信号解除，检修运行停止');
        return;
      }
      if (k === 'up:down') { holdUp = true; if (ctx.state.inspMode && !comLatch) ctx.logLine('防误操作：未先按下【公共】按钮并保持，上行无效'); return; }
      if (k === 'up:up') { holdUp = false; return; }
      if (k === 'dn:down') { holdDn = true; if (ctx.state.inspMode && !comLatch) ctx.logLine('防误操作：未先按下【公共】按钮并保持，下行无效'); return; }
      if (k === 'dn:up') { holdDn = false; return; }
    }
    /* 示意图内控件直接可操作：按钮与井道/轿厢同页可见，便于操作和理解；
     * 透明热区扩大触控范围（触屏友好），pointer-events=all 保证可点中 */
    const hot = (el, fn, r, key) => {
      if (!el) return;
      el.style.cursor = 'pointer';
      let hit;
      if (el.getAttribute('cx')) hit = E('circle', { cx: el.getAttribute('cx'), cy: el.getAttribute('cy'), r: r || 22, fill: 'transparent', 'pointer-events': 'all' });
      else {
        const x = +el.getAttribute('x'), y = +el.getAttribute('y'), w = +el.getAttribute('width'), h = +el.getAttribute('height');
        hit = E('rect', { x: x - 8, y: y - 8, width: w + 16, height: h + 16, fill: 'transparent', 'pointer-events': 'all' });
      }
      if (key) hit.setAttribute('data-hot', key);
      hit.style.cursor = 'pointer';
      el.parentNode.appendChild(hit);
      hit.addEventListener('click', fn);
    };
    const hotHold = (el, key) => {
      if (!el) return;
      el.style.cursor = 'pointer';
      const hit = E('circle', { cx: el.getAttribute('cx'), cy: el.getAttribute('cy'), r: 24, fill: 'transparent', 'pointer-events': 'all' });
      hit.setAttribute('data-hot', key);
      hit.style.cursor = 'pointer';
      el.parentNode.appendChild(hit);
      const dn = e => { e.preventDefault(); doAction(key + ':down'); };
      const up = () => doAction(key + ':up');
      hit.addEventListener('pointerdown', dn);
      hit.addEventListener('pointerup', up);
      hit.addEventListener('pointerleave', up);
      hit.addEventListener('pointercancel', up);
      hit.addEventListener('touchstart', dn, { passive: false });
      hit.addEventListener('touchend', up);
      hit.addEventListener('touchcancel', up);
    };
    Object.keys(hallEls).forEach(k => {
      const f = parseInt(k[0], 10), d = k[1];
      hot(hallEls[k], () => toggleHall(f, d), 22, 'h-' + f + d);
    });
    [1, 2, 3, 4].forEach(f => hot(cabBtns[f], () => addCarCall(f), 16, 'cb-' + f));
    hot(swKnob, () => doAction('sw'), 0, 'sw');
    hot(esBtn, () => doAction('estop'), 24, 'estop');
    hot(btnCom, () => doAction('com'), 24, 'com');
    hotHold(btnUp, 'up');
    hotHold(btnDn, 'dn');
    return {
      destroy: stop,
      onchange(k, v2) { ctx.state[k] = v2; },
      onaction(k) { doAction(k); }
    };
  }
};

         * 强迫减速 → 持续 ≤0.5 m/s；限位/极限 → 持续 ≤0.35 m/s 并趋向停靠位
         * 限位旁路开启时：限位开关仅给出信号，轿厢继续运行至极限开关动作 */
        if (swOn.dnF) v = Math.min(v, 0.5);

        const stopDn = bypassL ? Y_STOP_DN_E : Y_STOP_DN;
        if (!atLimit && ((swOn.dnL && !bypassL) || swOn.dnE) && y >= stopDn) {
          y = stopDn; v = 0; atLimit = true;
          ctx.logLine(bypassL && swOn.dnE

      }

      trG.setAttribute('transform', `rotate(${angT.toFixed(1)} 240 610)`);

    });

        if (k === 'uprun') { reset(Y_BUF - 32); mode = 'uprun'; ctx.logLine('上行运行：接近上端站时由强迫减速/限位/极限三级保护'); }
        if (k === 'fault') {

          v = 0; brakeDist = 0; mode = 'fault'; ang = 0; angT = 0;
          govElec = govMech = gearActed = bufHit = false; bufTravel = 0; lift = 0; yClamp = null; vImpact = 0; yMech = 0; atLimit = false;
          Object.keys(swOn).forEach(k2 => swOn[k2] = false);
          ctx.logLine(`模拟失控：轿厢自当前位置（底坑上方 ${((Y_BUF - y) / PX).toFixed(2)} m）加速下滑，观察限速器—安全钳联动（绳环连接点随轿厢运动）`);
        }

          gearFail = !gearFail;
          ctx.logLine(gearFail ? '已设置【安全钳失效】：超速时限速器虽动作但安全钳不制停，最终由缓冲器保护' : '安全钳恢复正常');

          if (btn && btn.textContent !== undefined) btn.textContent = ctx.state.bypassL ? '限位旁路中（点此恢复）' : '旁路限位开关';
          if (btn && btn.classList) btn.classList.toggle('dang', !ctx.state.bypassL);
          ctx.logLine(ctx.state.bypassL
            ? '已旁路上下限位开关（教学演示）：轿厢将越过限位停靠位继续运行，直至上下极限开关动作切断安全回路'
            : '限位旁路已取消：恢复限位开关停靠功能');
        }
        if (k === 'reset') { gearFail = false; reset(); }
      }

<script>/* =========================================================================
 * 学习档案示例数据模块
 * 示例数据仅保存在当前页面内存。
 * key: 'elevator-sim.profile.v1'（schema 版本化）
 * 提供：Profile.get() / save(p) / recordQuiz(scope,qIdx,ok)
 *       recordSimVisit(simKey) / recordSimAction(simKey) / clear()
 * ========================================================================= */
const Profile = (function () {
  const KEY = 'elevator-sim.profile.v1';
  const THROTTLE = 5000;                 // 仿真时长累计节流：每 5 秒最多写一次
  let data = load();
  let act = null;                        // 当前活动仿真 { key, last }
  let timer = null;
  let exam = { done: 0, right: 0 };      // 本次综合测验练习快照（内存累计）
  let examIdx = -1;                      // 当前快照在 attempts 中的下标

  function nowISO() { return new Date().toISOString(); }
  function blank() {
    return {
      schema: 1,
      student: { name: '', clazz: '' },
      updatedAt: null,
      quiz: { exam: { attempts: [], best: null, wrong: [] }, bySystem: {} },
      sims: {},
      settings: { present: false }
    };
  }
  function load() {
    try {
      const raw = null;
      if (!raw) return blank();
      const p = JSON.parse(raw) || {};
      const b = blank();
      // 合并默认字段，兼容旧数据缺字段
      b.student = Object.assign(b.student, p.student || {});
      b.updatedAt = p.updatedAt || null;
      b.quiz.exam = Object.assign(b.quiz.exam, (p.quiz && p.quiz.exam) || {});
      b.quiz.exam.attempts = Array.isArray(b.quiz.exam.attempts) ? b.quiz.exam.attempts : [];
      b.quiz.exam.wrong = Array.isArray(b.quiz.exam.wrong) ? b.quiz.exam.wrong : [];
      b.quiz.bySystem = (p.quiz && p.quiz.bySystem) || {};
      b.sims = p.sims || {};
      b.settings = Object.assign(b.settings, p.settings || {});
      return b;
    } catch (e) { return blank(); }
  }
  function persist() {
    try { data.updatedAt = nowISO(); void KEY; }
    catch (e) { /* 静默：隐私模式 / QuotaExceeded */ }
  }
  function simRec(key) {
    if (!data.sims[key]) data.sims[key] = { visits: 0, totalSec: 0, actions: 0, lastAt: null };
    return data.sims[key];
  }
  function ensureTimer() {
    if (timer) return;
    timer = setInterval(flushActive, THROTTLE);
  }
  /* 累计当前活动仿真的时长（节流写入） */
  function flushActive() {
    if (!act) return;
    const now = Date.now();
    const rec = simRec(act.key);
    rec.totalSec += (now - act.last) / 1000;
    act.last = now;
    persist();
  }

  return {
    get() { return data; },
    save(p) { if (p) data = Object.assign(blank(), p); persist(); },
    clear() {
      try { void KEY; } catch (e) { }
      data = blank(); act = null; exam = { done: 0, right: 0 }; examIdx = -1;
    },
    /* 测验判分后调用。scope='exam' 为综合测验，其余为系统 id（专项练习） */
    recordQuiz(scope, qIdx, ok) {
      try {
        if (scope === 'exam') {
          const ex = data.quiz.exam;
          const wi = ex.wrong.findIndex(w => w.q === qIdx);
          if (!ok) {
            if (wi >= 0) { ex.wrong[wi].n++; ex.wrong[wi].last = nowISO(); }
            else ex.wrong.push({ q: qIdx, n: 1, last: nowISO() });
          } else if (wi >= 0) { ex.wrong.splice(wi, 1); }
          exam.done++; if (ok) exam.right++;
          const rate = exam.done ? Math.round(exam.right / exam.done * 100) : 0;
          const snap = { at: nowISO(), done: exam.done, right: exam.right, rate };
          if (examIdx >= 0 && examIdx < ex.attempts.length) ex.attempts[examIdx] = snap;
          else { ex.attempts.push(snap); if (ex.attempts.length > 50) ex.attempts.shift(); examIdx = ex.attempts.length - 1; }
          if (!ex.best || exam.right > ex.best.right) ex.best = { right: exam.right, rate, at: snap.at };
        } else {
          const bs = data.quiz.bySystem[scope] || (data.quiz.bySystem[scope] = { done: 0, right: 0 });
          bs.done++; if (ok) bs.right++;
        }
        persist();
      } catch (e) { }
    },
    /* 打开某仿真时调用；key 为空表示当前仿真结束（冲刷时长，不计访问） */
    recordSimVisit(key) {
      try {
        flushActive();
        if (!key) { act = null; return; }
        const rec = simRec(key);
        rec.visits++; rec.lastAt = nowISO();
        act = { key, last: Date.now() };
        ensureTimer();
        persist();
      } catch (e) { }
    },
    /* 控件交互（onchange/onaction）时调用一次 */
    recordSimAction(key) {
      try {
        simRec(key).actions++;
        if (!act || act.key !== key) persist();   // 非活动仿真立即写；活动仿真由节流冲刷
      } catch (e) { }
    },
    /* 立即冲刷当前活动仿真时长（页面隐藏 / 仿真切换时调用） */
    flushActive() { flushActive(); }
  };
})();
/* 页面隐藏时立即冲刷时长，避免丢失 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && typeof Profile !== 'undefined' && Profile.flushActive) Profile.flushActive();
});
</script>

/* ------------------------------ 讲解模式 · 分步演示（C-03 框架） ------------------------------ */
/* 步骤数据模型：SIMS[x].steps = [{ t, d, hl:['.sel'], do:(api)=>{} }]，api = { set, act, log } */
const PRESENTER = { def: null, ctx: null, impl: null, step: -1, timer: null };

function presentAvailable() {
  return !!PRESENTER.def && Array.isArray(PRESENTER.def.steps) && PRESENTER.def.steps.length > 0;
}

function presentOpen(def, ctx, impl) {
  PRESENTER.def = def; PRESENTER.ctx = ctx; PRESENTER.impl = impl; PRESENTER.step = -1;
  const panel = $('#sim-present');
  if (!panel) return;
  if (!document.body.classList.contains('present-mode') || !def.steps || !def.steps.length) {
    panel.hidden = true; panel.innerHTML = '';
    return;
  }
  panel.hidden = false;
  panel.innerHTML = `
    <div class="pp-head">
      <span class="pp-step" id="pp-step">步骤 0/0</span>
      <b class="pp-title" id="pp-title"></b>
    </div>
    <p class="pp-desc" id="pp-desc"></p>
    <div class="pp-btns">
      <button class="btn ghost" id="pp-prev">◀ 上一步</button>
      <button class="btn" id="pp-next">下一步 ▶</button>
      <button class="btn ok" id="pp-auto">▶ 自动播放</button>
      <button class="btn dang" id="pp-exit">■ 退出分步</button>
    </div>`;
  $('#pp-prev').addEventListener('click', () => presentGo(PRESENTER.step - 1));
  $('#pp-next').addEventListener('click', () => presentGo(PRESENTER.step + 1));
  $('#pp-auto').addEventListener('click', presentAuto);
  $('#pp-exit').addEventListener('click', presentExit);
  presentGo(0);
}

function presentGo(n) {
  if (!presentAvailable()) return;
  const steps = PRESENTER.def.steps;
  if (n >= steps.length) { presentAutoStop(); return; }   // 播完自动停
  PRESENTER.step = Math.max(0, n);
  const st = steps[PRESENTER.step];
  // 高亮：清除旧高亮 → 应用新选择器
  $$('.hl', PRESENTER.ctx.stage).forEach(el => el.classList.remove('hl'));
  (st.hl || []).forEach(sel => {
    const el = PRESENTER.ctx.stage.querySelector(sel);
    if (el) el.classList.add('hl');
  });
  $('#pp-step').textContent = `步骤 ${PRESENTER.step + 1}/${steps.length}`;
  $('#pp-title').textContent = st.t || '';
  $('#pp-desc').textContent = st.d || '';
  // 执行步骤动作
  if (typeof st.do === 'function') {
    const impl = PRESENTER.impl;
    st.do({
      set: (k, v) => { if (impl && impl.onchange) impl.onchange(k, v); },
      act: (k) => { if (impl && impl.onaction) impl.onaction(k); },
      log: (m) => { if (PRESENTER.ctx.logLine) PRESENTER.ctx.logLine(m); }
    });
  }
}

function presentAuto() {
  const btn = $('#pp-auto');
  if (PRESENTER.timer) { presentAutoStop(); return; }
  if (PRESENTER.step >= PRESENTER.def.steps.length - 1) presentGo(0);
  PRESENTER.timer = setInterval(() => {
    if (PRESENTER.step >= PRESENTER.def.steps.length - 1) { presentAutoStop(); return; }
    presentGo(PRESENTER.step + 1);
  }, 3500);
  if (btn) btn.textContent = '⏸ 暂停播放';
}

function presentAutoStop() {
  if (PRESENTER.timer) { clearInterval(PRESENTER.timer); PRESENTER.timer = null; }
  const btn = $('#pp-auto');
  if (btn) btn.textContent = '▶ 自动播放';
}

/* ------------------------------ 竖长幅/超扁幅自适应（v1.4.0） ------------------------------
   22 张教学渲染图有 9 张宽高比 < 0.75（最极端限速器 289×1245 = 0.232），1 张 > 2.5（门机 2.564）。
   统一方框下 contain 不会裁掉主体，但会缩到看不清；这里按图片真实比例给卡片换档，
   不改变 object-fit: contain 的"不裁切"语义，只是把框换成贴合该图的形状。
   图片加载失败（naturalWidth=0）时保持默认方框，不报错。 */
function fitPortrait(root) {
  if (!root) return;
  const imgs = root.querySelectorAll('img');
  const fix = function (im) {
    const r = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0;
    if (!r) return;
    const card = im.closest('.photo-item') || im.closest('.gal-item');
    if (!card) return;
    if (r < 0.75) card.classList.add('tall');
    else if (r > 2.0) card.classList.add('wide');
  };
  Array.prototype.forEach.call(imgs, function (im) {
    if (im.complete && im.naturalWidth) fix(im);
    else im.addEventListener('load', function () { fix(im); });
  });
}

function quizCard(q, i, scope) {
  const opts = Array.isArray(q.a) ? q.o.map((o, j) => ({ o, j })).map(x => `
    <div class="opt" data-j="${x.j}"><span class="k">${'ABCD'[x.j]}</span><span>${x.o}</span></div>`).join('')
    : q.o.map((o, j) => `<div class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${o}</span></div>`).join('');
  return `<div class="quiz-card" data-q="${i}" data-scope="${scope}" data-answered="0">
    <div class="qno">第 ${i + 1} 题${q.multi ? '（多选）' : ''}</div>
    <div class="qtext">${q.q}</div>
    ${opts}
    ${q.multi ? '<button class="btn btn-confirm" style="margin-top:4px">确认作答</button>' : ''}
    <div class="explain">✅ 正确答案：<b>${Array.isArray(q.a) ? q.a.map(k => 'ABCD'[k]).join('、') : 'ABCD'[q.a]}</b>　${q.e}</div>
  </div>`;
}

function bindQuiz(root, bigId, lblId, total) {
  $$('.quiz-card', root).forEach(card => {
    const idx = +card.dataset.q;
    const q = EXAM[idx];
    const sel = [];
    $$('.opt', card).forEach(opt => opt.addEventListener('click', () => {
      if (card.dataset.answered === '1') return;
      const j = +opt.dataset.j;
      if (q.multi) {
        if (sel.includes(j)) { sel.splice(sel.indexOf(j), 1); opt.classList.remove('sel'); }
        else { sel.push(j); opt.classList.add('sel'); }
      } else {
        sel.length = 0; sel.push(j);
        $$('.opt', card).forEach(o => o.classList.remove('sel'));
        opt.classList.add('sel');
        showAnswer(card);
      }
      if (bigId) updateScore(root, bigId, lblId, total);
    }));
    const cf = $('.btn-confirm', card);
    if (cf) cf.addEventListener('click', () => {
      if (card.dataset.answered === '1') return;
      if (!sel.length) return;
      showAnswer(card);
      if (cf) cf.style.display = 'none';
      if (bigId) updateScore(root, bigId, lblId, total);
    });
  });
}

function showAnswer(card) {
  const idx = +card.dataset.q;
  const q = EXAM[idx];
  const sel = $$('.opt', card).filter(o => o.classList.contains('sel')).map(o => +o.dataset.j);
  const correct = Array.isArray(q.a) ? q.a : [q.a];
  const ok = sel.length === correct.length && sel.every(s => correct.includes(s));
  $$('.opt', card).forEach(o => {
    const j = +o.dataset.j;
    o.classList.remove('sel');
    if (correct.includes(j)) o.classList.add('right');
    else if (sel.includes(j)) o.classList.add('wrong');
  });
  card.dataset.answered = '1';
  card.dataset.ok = ok ? '1' : '0';
  $('.explain', card).classList.add('show');
  if (typeof Profile !== 'undefined') Profile.recordQuiz(card.dataset.scope, idx, ok);
}

function updateScore(root, bigId, lblId, total) {
  const cards = $$('.quiz-card', root);
  const done = cards.filter(c => c.dataset.answered === '1');
  const right = done.filter(c => c.dataset.ok === '1').length;
  const big = $('#' + bigId), lbl = $('#' + lblId);
  if (!big) return;
  big.textContent = `${right} / ${total}`;
  const rate = done.length ? Math.round(right / done.length * 100) : 0;
  lbl.textContent = `已答 ${done.length} 题 · 正确率 ${rate}%`;
}

/* ------------------------------ 启动 ------------------------------ */
document.addEventListener('DOMContentLoaded', () => {
  // 恢复讲解模式偏好（C-04 settings）
  if (typeof Profile !== 'undefined' && Profile.get().settings && Profile.get().settings.present) {
    document.body.classList.add('present-mode');
    $('#present-toggle').textContent = '🧑‍🏫 退出讲解模式';
  }
  renderOverview();
  renderSpaces();
  renderSystems();
  renderSims();
  renderQuiz();
  renderGallery();
  $$('.tab').forEach(t => t.addEventListener('click', () => switchView(t.dataset.view)));
  $('#present-toggle').addEventListener('click', e => {
    const on = document.body.classList.toggle('present-mode');
    e.target.textContent = on ? '🧑‍🏫 退出讲解模式' : '🧑‍🏫 讲解模式';
    if (typeof Profile !== 'undefined') {
      const p = Profile.get(); p.settings.present = on; Profile.save(p);
    }
    if (on && $('.view.active') && $('.view.active').id === 'view-sims') {
      const first = $('.tab-sim'); if (first) first.click();   // 重开当前仿真以挂载分步面板
    } else { presentModeOff(); }
  });
  $('#about-btn').addEventListener('click', openAbout);
  $('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (presentAvailable() && !$('#sim-present').hidden) { presentExit(); return; }
      closeModal();
    }
    if (!$('#sim-present') || $('#sim-present').hidden) return;
    if (e.key === 'ArrowLeft') { presentAutoStop(); presentGo(PRESENTER.step - 1); }
    if (e.key === 'ArrowRight') { presentAutoStop(); presentGo(PRESENTER.step + 1); }
  });
  const verEl = $('#app-ver');
  if (verEl && typeof APP_VERSION !== 'undefined') verEl.textContent = APP_VERSION + ' · ' + APP_BUILD;
  switchView('overview');
});
</script>


<script>
document.getElementById('example-reset').addEventListener('click', () => {
  closeModal();
  destroySim();
  presentModeOff();
  Profile.clear();
  document.body.classList.remove('present-mode');
  document.getElementById('present-toggle').textContent = '🧑‍🏫 讲解模式';
  renderOverview(); renderSpaces(); renderSystems(); renderSims(); renderQuiz(); renderGallery();
  switchView('overview');
});
</script>
