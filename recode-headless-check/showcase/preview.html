const $=s=>document.querySelector(s);let notes,files,selected;
const seed=[{id:'first',title:'周末，给自己一点留白',body:'去河边走走，带一本读到一半的书。\n\n路过喜欢的面包店，买两块刚出炉的可颂。\n\n不急着安排全部时间，给偶然遇见的事留一个位置。'},{id:'idea',title:'一个值得留下的灵感',body:'把每天的小念头放在这里。'}];
function render(){ $('#entries').replaceChildren();for(const note of notes){const b=document.createElement('button');b.className='entry'+(selected===note.id?' selected':'');const t=document.createElement('strong'),s=document.createElement('small');t.textContent=note.title;s.textContent='今天 · 刚刚编辑';b.append(t,s);b.onclick=()=>select(note.id);$('#entries').append(b);}$('#attachments').replaceChildren();for(const f of files){const row=document.createElement('div'),label=document.createElement('span'),button=document.createElement('button');row.className='file';label.textContent=f.name;button.textContent='下载 '+f.name;button.onclick=()=>save(f.blob,f.name);row.append(label,button);$('#attachments').append(row);}}
function select(id){selected=id;const n=notes.find(n=>n.id===id);$('#title').value=n?.title||'';$('#body').value=n?.body||'';$('#saved').textContent=n?'已保存':'未保存';render();}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('#new').onclick=()=>select(null);$('#save').onclick=()=>{if(!$('#title').reportValidity())return;const n={id:selected||String(Date.now()),title:$('#title').value,body:$('#body').value};notes=[n,...notes.filter(x=>x.id!==n.id)];select(n.id);$('#status').textContent='已保存在当前示例';};$('#export').onclick=()=>save(new Blob([$('#title').value+'\n\n'+$('#body').value],{type:'text/plain'}),'便笺.txt');$('#upload').onclick=()=>{for(const file of $('#files').files)files.push({name:file.name,blob:file});$('#files').value='';render();};$('#reset').onclick=reset;function reset(){notes=structuredClone(seed);files=[{name:'周末清单.txt',blob:new Blob(['书、相机和一点好心情。'],{type:'text/plain'})}];select('first');$('#status').textContent='示例内容，关闭后不保留。';}reset();
</script></html>
