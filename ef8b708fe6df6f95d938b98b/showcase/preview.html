<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间曲线 · 曲面实验室</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.6 "Microsoft YaHei",sans-serif}header{padding:16px 24px;background:linear-gradient(#131a24,#0d1117);border-bottom:1px solid #2a3441}h1{font-size:19px;margin:0}h1 span{color:#4da3ff}small{color:#8b98a9}nav{padding:10px 24px;color:#4da3ff;border-bottom:1px solid #2a3441}.wrap{display:grid;grid-template-columns:370px 1fr;gap:16px;padding:16px}.panel{background:#161b22;border:1px solid #2a3441;border-radius:12px;padding:16px}h2{font-size:15px;margin:0 0 12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}button{background:#1c2330;color:#c8d5e3;border:1px solid #344353;border-radius:6px;padding:7px 10px;cursor:pointer}button.on{color:#4da3ff;border-color:#4da3ff;background:#172c43}input[type=text]{background:#0d1117;border:1px solid #344353;color:#e6edf3;padding:10px;width:100%;border-radius:6px;font:16px monospace}.box{background:#0d1117;border:1px solid #2a3441;padding:12px;margin:12px 0;border-radius:6px;color:#8b98a9}.box strong{color:#3fb950}input[type=range]{width:100%;accent-color:#4da3ff}.run{background:#2675d8;color:white;width:100%;margin-top:14px}canvas{display:block;width:100%;height:500px;background:#161b22}.info{color:#8b98a9;font-size:12px}@media(max-width:1020px){.wrap{grid-template-columns:1fr}}@media(max-width:600px){canvas{height:340px}}
</style></head><body><header><h1>空间曲线 · <span>曲面实验室</span></h1><small>支持任意方程自动判型 —— y = x^2 + z^2 · 拖拽旋转 / 滚轮缩放</small></header><nav>示例体验：状态仅保留在当前页面　 <button id="reset">恢复示例</button></nav><div class="wrap"><div class="panel"><h2>① 选择模式</h2><div class="tabs" id="modes"><button class="on">方程模式 ★</button><button disabled>曲面 z=f(x,y)</button><button disabled>参数曲线</button><button disabled>参数曲面</button></div><label>直接输入方程（带或不带 = 都行）</label><input id="equation" type="text" value="y = x^2 + z^2"><div class="box" id="classification"><strong>可解出因变量</strong><br>y 是因变量，自变量 x, z → 精确曲面绘制<br>形如：抛物面类（旋转抛物面 / 椭圆抛物面）</div><details><summary>▸ 案例公式</summary><p><button data-eq="y = x^2 + z^2">旋转抛物面</button> <button data-eq="z = x^2 - y^2">马鞍面</button></p></details><p>绘图域　x, y, z ∈ [-5, 5]<input type="range" min="2" max="10" value="5" disabled></p><p>网格精度　70<input type="range" min="24" max="100" value="70" disabled></p><button class="run" id="run">▶ 生成图形</button><p id="demo-status" style="color:#3fb950">✔ 演示图形</p></div><div class="panel"><h2>② 视图选项</h2><div class="tabs" id="views"><button class="on">曲面</button><button disabled>网格</button><button disabled>等高线投影</button><button disabled>热力图</button><button disabled>线框</button></div><label><input type="checkbox" checked disabled> 显示坐标轴与网格框</label>　<label><input type="checkbox" checked disabled> 显示等值面剖切线</label><canvas id="plot"></canvas><div class="info">显式曲面：y = f(x, z)　|　因变量 y 自动识别　|　绘图域 ±5<br>示例仅演示抛物面和马鞍面，灰色控件需安装后使用。完整应用支持任意公式和其他绘图模式。</div></div></div><script>
document.querySelector('#reset').onclick=()=>{document.querySelector('#equation').value='y = x^2 + z^2';document.querySelectorAll('input[type=range]').forEach((x,i)=>x.value=i?70:5);document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=true);document.querySelector('details').open=false;document.querySelector('#demo-status').textContent='✔ 演示图形';document.querySelectorAll('.tabs').forEach(t=>t.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===0)));angle=.7;mode=0;draw()};const c=document.querySelector('canvas'),ctx=c.getContext('2d');let angle=.7,mode=0;function draw(){document.querySelector('.info').innerHTML=(mode===1?'马鞍面示例：z = x² − y²':'抛物面示例：y = x² + z²')+'<br>示例仅演示抛物面和马鞍面，灰色控件需安装后使用。完整应用支持任意公式和其他绘图模式。';document.querySelector('#classification').innerHTML=mode===1?'<strong>马鞍面示例</strong><br>z 是因变量，自变量 x, y':'<strong>可解出因变量</strong><br>y 是因变量，自变量 x, z → 精确曲面绘制<br>形如：抛物面类（旋转抛物面 / 椭圆抛物面）';let w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h*.55);const sx=w*.095,sy=h*.105;function p(x,z){let a=x*Math.cos(angle)-z*Math.sin(angle),b=x*Math.sin(angle)+z*Math.cos(angle),y=mode===1?(x*x-z*z)*.22:(x*x+z*z)*.22;return [a*sx,(b*.4-y)*sy]}for(let j=-4;j<=4;j+=.4){ctx.beginPath();for(let i=-4;i<=4;i+=.15){let [x,y]=p(i,j);i===-4?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle=`hsl(${185+(j+4)*14} 65% 55%)`;ctx.lineWidth=1.4*devicePixelRatio;ctx.stroke()}ctx.restore()}draw();onresize=draw;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);let x=e.clientX;c.onpointermove=e=>{angle+=(e.clientX-x)*.01;x=e.clientX;draw()}};c.onpointerup=()=>c.onpointermove=null;document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{document.querySelector('#equation').value=b.dataset.eq;mode=b.dataset.eq.includes(' - ')?1:0;draw()});document.querySelector('#run').onclick=()=>{const v=document.querySelector('#equation').value.replace(/\s/g,'');if(v==='y=x^2+z^2')mode=0;else if(v==='z=x^2-y^2')mode=1;else{document.querySelector('#demo-status').textContent='示例仅支持上面两条案例公式；完整公式绘图请安装应用。';return}document.querySelector('#demo-status').textContent='✔ 演示图形';draw()};document.querySelectorAll('.tabs').forEach(t=>t.onclick=e=>{if(e.target.tagName==='BUTTON'){t.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');draw()}});
</script></body></html>
