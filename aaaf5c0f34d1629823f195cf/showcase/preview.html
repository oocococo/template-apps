:root{
  --primary:#0f9d8f;          /* \u533B\u7597\u9752\u7EFF */
  --primary-deep:#0b7f74;
  --primary-bg:#e6f6f3;
  --accent:#2b7de9;           /* \u533B\u7597\u84DD */
  --accent-bg:#eaf2fd;
  --warn:#e8a23d;
  --warn-bg:#fdf3e2;
  --danger:#d9534f;
  --danger-bg:#fdeaea;
  --text:#22303a;
  --text-sub:#6b7a86;
  --text-faint:#9aa7b0;
  --line:#e6ebef;
  --card:#ffffff;
  --bg:#f3f6f8;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:#dfe7ec;color:var(--text);font-size:15px;line-height:1.55;
  min-height:100vh;
}
/* \u624B\u673A\u58F3 */
.phone{
  width:400px;max-width:100vw;height:820px;max-height:96vh;
  background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 30px 70px rgba(20,40,60,.35), inset 0 0 0 2px #0b0e12;
  display:flex;flex-direction:column;
}
.phone::before{ /* \u5218\u6D77 */
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:26px;background:#0b0e12;border-radius:0 0 18px 18px;z-index:50;
}
/* \u72B6\u6001\u680F */
.statusbar{
  height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:12px;font-weight:600;color:#22303a;background:transparent;
}
.statusbar .right{display:flex;gap:5px;align-items:center;}
/* \u5C0F\u7A0B\u5E8F\u5BFC\u822A\u680F */
.navbar{
  flex:0 0 50px;display:flex;align-items:center;justify-content:center;position:relative;
  background:var(--card);font-size:17px;font-weight:600;color:var(--text);
  border-bottom:1px solid var(--line);
}
.navbar .back{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:transparent;border:none;font-size:20px;color:var(--text);cursor:pointer;
}
.navbar .back:active{background:var(--line);}
/* \u5185\u5BB9\u533A */
.screen{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth;}
.screen::-webkit-scrollbar{width:0;}
/* \u901A\u7528\u5361\u7247 */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,60,.06);}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.hint{font-size:12.5px;color:var(--text-sub);line-height:1.6;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.tag.primary{background:var(--primary-bg);color:var(--primary-deep);}
.tag.blue{background:var(--accent-bg);color:var(--accent);}
.tag.warn{background:var(--warn-bg);color:var(--warn);}
.tag.muted{background:#f0f3f5;color:var(--text-faint);}
.tag.danger{background:var(--danger-bg);color:var(--danger);}
/* \u8FDB\u5EA6\u6761 */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.progress-bar{flex:1;height:6px;background:#e6ebef;border-radius:3px;overflow:hidden;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .3s;}
.progress-text{font-size:12.5px;color:var(--text-sub);font-weight:600;white-space:nowrap;}
/* \u6309\u94AE */
.btn{
  width:100%;height:48px;border:none;border-radius:12px;font-size:16px;font-weight:600;
  cursor:pointer;transition:transform .05s,opacity .2s;
}
.btn:active{transform:scale(.98);}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 6px 16px rgba(15,157,143,.28);}
.btn.primary:disabled{background:#c8d3d9;box-shadow:none;color:#fff;}
.btn.ghost{background:var(--card);color:var(--text-sub);border:1px solid var(--line);}
.btn.blue{background:linear-gradient(135deg,var(--accent),#1c64c8);color:#fff;}
.footer-btns{display:flex;gap:10px;margin-top:16px;}
.footer-btns .btn{flex:1;}
/* \u8868\u5355 */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field label .req{color:var(--danger);margin-left:2px;}
.field input[type=text],.field input[type=number],.field textarea{
  width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;
  font-size:15px;color:var(--text);background:#fbfcfd;outline:none;transition:border .2s;
}
.field textarea{height:auto;min-height:80px;padding:12px 14px;resize:none;font-family:inherit;}
.field input:focus,.field textarea:focus{border-color:var(--primary);background:#fff;}
.field .err{color:var(--danger);font-size:12px;margin-top:4px;display:none;}
.field.invalid input,.field.invalid textarea{border-color:var(--danger);background:#fff7f7;}
.field.invalid .err{display:block;}
/* \u5355\u9009/\u591A\u9009\u9009\u9879 */
.options{display:flex;flex-direction:column;gap:9px;}
.opt{
  display:flex;align-items:center;gap:11px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;cursor:pointer;background:var(--card);transition:all .15s;font-size:14.5px;
}
.opt .radio,.opt .check{flex:0 0 20px;height:20px;width:20px;border-radius:50%;border:2px solid #c8d3d9;position:relative;transition:all .15s;}
.opt .check{border-radius:6px;}
.opt .radio::after,.opt .check::after{
  content:"";position:absolute;inset:0;margin:auto;width:0;height:0;border-radius:inherit;
  background:var(--primary);transition:all .15s;
}
.opt .check::after{border-radius:2px;}
.opt.selected{border-color:var(--primary);background:var(--primary-bg);}
.opt.selected .radio,.opt.selected .check{border-color:var(--primary);}
.opt.selected .radio::after{width:10px;height:10px;}
.opt.selected .check::after{width:10px;height:10px;}
.opt .opt-main{flex:1;}
.opt .opt-sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
/* \u8BC4\u5206\u523B\u5EA6 0-10 */
.scale{display:flex;gap:4px;justify-content:space-between;}
.scale .sc{
  flex:1;display:flex;align-items:center;justify-content:center;height:42px;border-radius:10px;
  background:#f0f3f5;font-size:13.5px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:all .12s;
}
.scale .sc.on{background:var(--primary);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(15,157,143,.3);}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:6px;}
/* NRS \u62D6\u62FD\u6ED1\u5757 */
.nrs-slider-wrap{padding:10px 4px 4px;}
.nrs-big{text-align:center;font-size:48px;font-weight:800;color:var(--primary-deep);line-height:1.1;margin-bottom:6px;}
.nrs-big .unit{font-size:15px;font-weight:600;color:var(--text-sub);}
input[type=range].nrs-range{
  -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;cursor:pointer;
}
input[type=range].nrs-range::-webkit-slider-runnable-track{
  height:8px;border-radius:4px;
  background:linear-gradient(90deg,#bce8df 0%,#0f9d8f 50%,#0b6f66 100%);
}
input[type=range].nrs-range::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
  background:#fff;border:3px solid var(--primary);box-shadow:0 3px 8px rgba(15,157,143,.4);
  margin-top:-11px;cursor:grab;transition:transform .1s;
}
input[type=range].nrs-range::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12);}
input[type=range].nrs-range::-moz-range-track{
  height:8px;border-radius:4px;background:linear-gradient(90deg,#bce8df,#0f9d8f,#0b6f66);
}
input[type=range].nrs-range::-moz-range-thumb{
  width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--primary);
  box-shadow:0 3px 8px rgba(15,157,143,.4);cursor:grab;
}
.nrs-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);margin-top:2px;padding:0 2px;}
/* POEM \u9898\u5361\u7247 */
.poem-q{margin-bottom:12px;}
.poem-q .q-title{font-size:14.5px;font-weight:600;margin-bottom:8px;}
.poem-q.flash{border:2px solid var(--danger);box-shadow:0 0 0 4px rgba(217,83,79,.15);animation:flashbg 1s ease 2;}
@keyframes flashbg{0%,100%{background:var(--card);}50%{background:#fff1f0;}}
/* \u7C98\u6027\u8FDB\u5EA6\u63D0\u793A */
.poem-status{position:sticky;top:-16px;z-index:20;background:var(--bg);padding:8px 0 10px;margin:-4px -4px 0;}
.poem-status .ps-inner{display:flex;align-items:center;justify-content:space-between;background:var(--warn-bg);border:1px solid #f0d9a8;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;color:#7a5b1e;}
.poem-status .ps-inner.done{background:var(--primary-bg);border-color:#b6e3dc;color:var(--primary-deep);}
/* \u5E95\u90E8\u7C98\u6027\u6309\u94AE */
.footer-btns.sticky{position:sticky;bottom:-16px;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);padding-top:10px;}
.poem-opts{display:flex;gap:6px;}
.poem-opts .po{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;
  border:1.5px solid var(--line);cursor:pointer;transition:all .12s;background:var(--card);
}
.poem-opts .po .freq{font-size:11.5px;color:var(--text-sub);}
.poem-opts .po .score{font-size:10.5px;color:var(--text-faint);}
.poem-opts .po.on{border-color:var(--primary);background:var(--primary-bg);}
.poem-opts .po.on .freq,.poem-opts .po.on .score{color:var(--primary-deep);font-weight:600;}
/* \u6CBB\u7597\u8BE6\u60C5\u5B50\u9879 */
.sub-detail{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfd;}
.sub-detail .sd-name{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--primary-deep);}
.sub-detail .sd-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.sub-detail .sd-row .chip{
  padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;cursor:pointer;background:#fff;transition:all .12s;
}
.sub-detail .sd-row .chip.on{border-color:var(--primary);background:var(--primary-bg);color:var(--primary-deep);font-weight:600;}
/* \u533B\u751F\u7AEF */
.doctor-badge{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,var(--accent),#1c64c8);border-radius:var(--radius);color:#fff;margin-bottom:12px;}
.doctor-badge .avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
.patient-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;box-shadow:0 1px 3px rgba(20,40,60,.06);}
.patient-row:active{transform:scale(.99);}
.patient-row .p-ava{width:42px;height:42px;border-radius:50%;background:var(--primary-bg);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 42px;}
.patient-row .p-main{flex:1;min-width:0;}
.patient-row .p-name{font-weight:700;font-size:15px;}
.patient-row .p-sub{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.patient-row .p-scores{text-align:right;flex:0 0 auto;}
.patient-row .p-scores .scorad{font-size:18px;font-weight:800;color:var(--primary-deep);}
.patient-row .p-scores .lbl{font-size:10.5px;color:var(--text-faint);}
/* \u6307\u6807\u5757 */
.metrics{display:flex;gap:10px;margin-bottom:12px;}
.metric{flex:1;background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:0 1px 3px rgba(20,40,60,.06);}
.metric .m-val{font-size:22px;font-weight:800;color:var(--primary-deep);}
.metric .m-val.blue{color:var(--accent);}
.metric .m-val.warn{color:var(--warn);}
.metric .m-lbl{font-size:11px;color:var(--text-faint);margin-top:2px;}
/* SCORAD \u5206\u533A */
.sc-section{margin-bottom:14px;}
.sc-section .sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sc-section .sc-head .t{font-weight:700;font-size:15px;}
.sc-section .sc-head .formula{font-size:11.5px;color:var(--text-faint);font-family:ui-monospace,monospace;}
.sc-summary{
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;border-radius:var(--radius);
  padding:16px;text-align:center;margin-bottom:12px;
}
.sc-summary .big{font-size:38px;font-weight:800;line-height:1.1;}
.sc-summary .sub{font-size:12.5px;opacity:.9;margin-top:4px;}
.sc-summary .parts{margin-top:8px;font-size:12px;opacity:.95;font-family:ui-monospace,monospace;}
/* \u5386\u53F2\u8D8B\u52BF\u7B80\u6613\u6761 */
.trend-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--text-sub);}
.trend-row .date{width:86px;flex:0 0 86px;text-align:right;}
.trend-row .bar-track{flex:1;height:8px;background:#eef2f5;border-radius:4px;overflow:hidden;}
.trend-row .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent));}
.trend-row .val{width:34px;flex:0 0 34px;font-weight:700;color:var(--text);}
/* \u9996\u9875 hero */
.hero{background:linear-gradient(150deg,var(--primary),var(--primary-deep) 60%,#0a6f66);color:#fff;border-radius:20px;padding:22px 18px;margin-bottom:14px;}
.hero .h-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.hero .h-sub{font-size:13px;opacity:.92;line-height:1.6;}
.hero .h-tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;}
.hero .h-tags span{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;font-size:11.5px;}
.disclaimer{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12px;color:#7a5b1e;line-height:1.6;margin-bottom:12px;}
/* \u63D0\u4EA4\u6210\u529F */
.success-icon{width:72px;height:72px;border-radius:50%;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;margin:20px auto 14px;font-size:36px;}
.center{text-align:center;}
/* \u767B\u5F55 */
.login-ava{width:64px;height:64px;border-radius:50%;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;margin:24px auto 8px;font-size:30px;}
/* \u9690\u85CF\u9875\u9762 */
.page{display:none;}
.page.active{display:block;}
/* toast */
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(30,40,50,.92);color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:88%;}
#toast.show{opacity:1;}
/* \u53F3\u4E0B\u89D2\u533B\u751F\u5165\u53E3\uFF1A\u65E0\u8FB9\u6846\u3001\u4F4E\u8C03 */
.doctor-entry{
  position:absolute;right:12px;bottom:16px;z-index:80;
  background:transparent;border:none;cursor:pointer;
  font-size:12px;color:var(--text-faint);opacity:.6;
  letter-spacing:.3px;padding:6px 4px;transition:opacity .15s;
}
.doctor-entry:active{opacity:1;color:var(--text-sub);}
/* \u7A7A\u72B6\u6001 */
.empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:13.5px;}
.empty .ic{font-size:40px;margin-bottom:8px;}
