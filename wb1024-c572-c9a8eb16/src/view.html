
<div class="app">
  <div class="topbar">
    <div class="brand">打卡自律 · 养小鸡<small>坚持，是最温柔的复利</small></div>
    <div class="datepill" id="datepill">—</div>
  </div>

  <!-- 今日 -->
  <section class="tab active" id="tab-today">
    <div class="chickcard">
      <div id="chickMini"></div>
      <div class="chickname" id="chickNameMini">—</div>
      <div class="chicklv" id="chickLvMini">—</div>
    </div>
    <div class="statrow">
      <div class="stat"><b id="stToday">0/0</b><span>今日完成</span></div>
      <div class="stat"><b id="stTotal">0</b><span>累计打卡</span></div>
      <div class="stat"><b id="stBest">0</b><span>最长连续</span></div>
    </div>
    <div class="sectiontitle">今日待办</div>
    <div id="todayList"></div>
    <button class="btn primary" id="addQuick" style="margin-top:8px">＋ 添加习惯</button>
  </section>

  <!-- 数据 -->
  <section class="tab" id="tab-data">
    <div class="sectiontitle">近 7 天完成率</div>
    <div class="chart">
      <div class="bars" id="weekBars"></div>
    </div>
    <div class="sectiontitle">各习惯本周表现</div>
    <div class="chart"><div class="habitscore" id="habitScore"></div></div>
    <div class="sectiontitle">总体数据</div>
    <div class="statrow">
      <div class="stat"><b id="dTotal">0</b><span>总打卡次数</span></div>
      <div class="stat"><b id="dDays">0</b><span>打卡天数</span></div>
      <div class="stat"><b id="dFull">0</b><span>全勤天数</span></div>
    </div>
  </section>

  <!-- 小鸡 -->
  <section class="tab" id="tab-chick">
    <div class="chickcard" style="padding:22px">
      <div id="chickBig"></div>
      <div class="chickname" id="chickNameBig" style="margin-top:10px"></div>
      <div class="chicklv" id="chickLvBig"></div>
      <div class="chickdesc" id="chickDescBig"></div>
      <div class="xpwrap">
        <div class="xpbar"><i id="xpFill"></i></div>
        <div class="xptxt"><span id="xpNow">0 XP</span><span id="xpNext">下一级 —</span></div>
      </div>
      <div class="evosteps" id="evoSteps"></div>
      <button class="btn ghost" id="renameChick" style="margin-top:16px; border-color:var(--line)">给小鸡取个名</button>
    </div>
    <div class="chart">
      <div class="sectiontitle" style="margin:0 0 8px">怎么养大小鸡？</div>
      <div style="font-size:13px; color:var(--sub); line-height:1.8">
        · 每完成一次打卡 <b style="color:var(--txt)">+12 成长值</b><br>
        · 一天内全部习惯完成 <b style="color:var(--txt)">额外 +20</b><br>
        · 坚持越久，小鸡越长越大，从蛋到成年鸡<br>
        · 数据全部保存在本机，卸载即清空，记得备份
      </div>
    </div>
  </section>

  <!-- 习惯 -->
  <section class="tab" id="tab-habit">
    <div class="sectiontitle">我的习惯</div>
    <div id="habitList"></div>
    <button class="btn primary" id="addHabit">＋ 新建习惯</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="exportBtn">导出备份 (JSON)</button>
    <button class="btn ghost" id="importBtn">导入备份</button>
    <input accept="application/json" id="importFile" type="file" style="display:none">
  </section>
</div>

<div class="nav">
  <button class="active" data-tab="today"><span class="e">📅</span>今日</button>
  <button data-tab="data"><span class="e">📊</span>数据</button>
  <button data-tab="chick"><span class="e">🐤</span>小鸡</button>
  <button data-tab="habit"><span class="e">⚙️</span>习惯</button>
</div>

<!-- add/edit modal -->
<div class="mask" id="modal">
  <div class="sheet">
    <h3 id="modalTitle">新建习惯</h3>
    <div class="field">
      <label>名称</label>
      <input id="fName" maxlength="8" placeholder="例如：戒酒 / 跑步 / 阅读">
    </div>
    <div class="field">
      <label>图标</label>
      <div class="chips" id="iconChips"></div>
    </div>
    <div class="field">
      <label>类型</label>
      <div class="seg" id="kindSeg">
        <button class="on" data-k="check">打卡型（完成/未完成）</button>
        <button data-k="count">计数型（记数值）</button>
      </div>
    </div>
    <div class="field" id="unitField" style="display:none">
      <label>单位（如 km / 分钟 / 杯）</label>
      <input id="fUnit" maxlength="6" placeholder="分钟">
    </div>
    <div class="field" id="goalField" style="display:none">
      <label>每日目标值（0 表示不限）</label>
      <input id="fGoal" min="0" placeholder="60" type="number">
    </div>
    <div class="field">
      <label>主题色</label>
      <div class="chips" id="colorChips"></div>
    </div>
    <button class="btn primary" id="saveHabit">保存</button>
    <button class="btn ghost" id="cancelModal" style="margin-top:8px">取消</button>
  </div>
</div>

<!-- count value modal -->
<div class="mask" id="cntModal">
  <div class="sheet">
    <h3 id="cntTitle">记录数值</h3>
    <div class="field">
      <label id="cntLabel">数值</label>
      <input id="cntVal" min="0" placeholder="0" step="0.1" type="number">
    </div>
    <button class="btn primary" id="cntSave">保存</button>
    <button class="btn ghost" id="cntCancel" style="margin-top:8px">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>
