  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  color: #263c33;
  background: #f6f8f7;
  font-size: 14px;
  font-synthesis: none;
  --green: #159767;
  --green-dark: #126e4e;
  --muted: #8b9991;
  --line: #edf0ee;
  --yellow: #fbd662;
  --shadow: 0 3px 20px #123e2703;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  border: 1px solid #e1e8e3;
  border-radius: 8px;
  background: #fff;
  color: #3e5147;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 15px;
  min-height: 39px;
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
button:hover {
  background: #f0f7f2;
  border-color: #c7dacf;
}
button:active {
  transform: translateY(1px);
}
button:disabled {
  opacity: 0.45;
  cursor: default;
  transform: none;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid #9adab8;
  outline-offset: 3px;
}
input,
select,
textarea {
  border: 1px solid #dde5df;
  border-radius: 7px;
  background: #fff;
  padding: 10px 11px;
  color: #2b4035;
  min-width: 0;
  max-width: 100%;
}
input::placeholder,
textarea::placeholder {
  color: #aeb7b1;
}
input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: var(--green);
  padding: 0;
}
input[type="color"] {
  padding: 3px;
  width: 100%;
  height: 41px;
}
textarea {
  resize: vertical;
  line-height: 1.8;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h2 {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: 0.1px;
}
h3 {
  font-size: 15px;
}
p {
  line-height: 1.8;
}
small {
  font-size: 11px;
  font-weight: 400;
}
svg {
  flex-shrink: 0;
}
strong {
  font-weight: 600;
}
select {
  cursor: pointer;
}
.primary {
  background: var(--green);
  border-color: var(--green);
  color: white;
  font-weight: 550;
}
.primary:hover {
  background: #10845a;
  border-color: #10845a;
}
.yellow {
  background: var(--yellow);
  color: #364b38;
  border-color: var(--yellow);
}
.yellow:hover {
  background: #f4ca4d;
  border-color: #f4ca4d;
}
.danger {
  background: #c76c5f;
  color: white;
  border-color: #c76c5f;
}
.danger:hover {
  background: #b45a4d;
}
.danger-text {
  color: #bc7568 !important;
}
.text-button {
  padding: 0;
  min-height: 28px;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
}
.text-button:hover {
  background: transparent;
  color: #0b6c48;
}
.icon-button {
  padding: 8px;
  width: 36px;
  min-height: 34px;
  border: 0;
  background: transparent;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.between {
  justify-content: space-between;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #eef7f1;
  border: 1px solid #dceee3;
  border-radius: 6px;
  color: #579478;
  padding: 5px 8px;
  font-size: 10px;
  white-space: nowrap;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 5px;
  background: #b6c2ba;
}
.dot.green {
  background: #22b27b;
}
.eyebrow {
  font-size: 10px;
  font-weight: 550;
  color: #7e9b8d;
  letter-spacing: 1.9px;
}
.card {
  background: #fff;
  border: 1px solid #e8ede9;
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 23px;
  min-width: 0;
}
.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 23px;
  min-height: 22px;
}
.card-title h2 {
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-title h2 svg {
  color: var(--green);
}
.outline-button {
  width: 100%;
  font-size: 12px;
  color: #6b8275;
  background: #fff;
  border-color: #dbe6df;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 220px;
  background: #fff;
  border-right: 1px solid #e7ece8;
  padding: 33px 19px 0;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  white-space: nowrap;
  padding: 0 8px;
}
.brandmark {
  display: grid;
  place-items: center;
  width: 40px;
  height: 43px;
  border-radius: 12px;
  background: #16885e;
  color: white;
  transform: rotate(-5deg);
}
.brandmark > svg {
  transform: rotate(5deg);
}
.brand strong {
  font-size: 24px;
  letter-spacing: 2px;
  display: block;
  font-weight: 700;
  color: #1c4c36;
  line-height: 1.25;
}
.brand strong > span {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0;
  border-left: 1px solid #cad8cf;
  margin-left: 8px;
  padding-left: 8px;
  vertical-align: middle;
}
.brand small {
  display: block;
  color: #98a59c;
  font-size: 9px;
  margin-top: 5px;
  letter-spacing: 1.2px;
}
.sidebar-label {
  font-size: 9px;
  color: #b1bbb4;
  letter-spacing: 1.7px;
  margin: 43px 16px 15px;
}
.sidebar nav {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.sidebar nav button {
  border: 0;
  min-height: 46px;
  padding: 12px 17px;
  border-radius: 8px;
  justify-content: flex-start;
  gap: 13px;
  color: #829087;
  background: transparent;
  font-size: 12px;
  position: relative;
}
.sidebar nav button.active {
  color: #138d5d;
  background: #eaf5ee;
  font-weight: 600;
}
.sidebar nav button:hover {
  background: #f2f7f3;
}
.sidebar nav button.active i {
  position: absolute;
  right: 15px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--green);
}
.sidebar-note {
  background: linear-gradient(135deg, #f0f6ed, #f8faf5);
  border: 1px solid #e8efdf;
  border-radius: 10px;
  position: relative;
  margin: 42px 3px 20px;
  padding: 20px 17px 25px;
  overflow: hidden;
  min-height: 155px;
}
.road-badge {
  display: block;
  color: #9caa72;
  margin-bottom: 9px;
}
.sidebar-note strong {
  font-size: 12px;
  color: #728766;
  position: relative;
  z-index: 1;
}
.sidebar-note p {
  font-size: 10px;
  color: #a3b19c;
  margin-top: 8px;
}
.note-road {
  position: absolute;
  right: -9px;
  bottom: -52px;
  font-size: 130px;
  color: #e5edde;
  transform: rotate(-20deg);
}
.sidebar-bottom {
  margin-top: auto;
}
.sidebar-bottom > button {
  border: 0;
  background: transparent;
  color: #8a998e;
  justify-content: flex-start;
  width: 100%;
  gap: 12px;
  font-size: 11px;
  padding: 10px 17px;
}
.sidebar-bottom > button.active {
  background: #eef6f0;
  color: var(--green);
}
.profile {
  margin-top: 22px;
  border-top: 1px solid #edf1ed;
  padding: 21px 6px;
  display: flex;
  align-items: center;
  gap: 11px;
}
.profile > span {
  display: grid;
  place-items: center;
  background: #edf3e7;
  color: #849a6d;
  font-size: 13px;
  width: 33px;
  height: 33px;
  border-radius: 50%;
}
.profile > div {
  flex: 1;
}
.profile strong {
  font-size: 10px;
  display: block;
  font-weight: 500;
  color: #657d6d;
}
.profile small {
  font-size: 8px;
  color: #a2afa4;
  display: block;
  margin-top: 5px;
}
.profile > svg {
  color: #a1b4a3;
}
.workspace {
  margin-left: 220px;
  padding: 0 35px 25px;
  max-width: 1600px;
}
.topbar {
  height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e7ece8;
  margin-bottom: 29px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 11px;
  color: #a1ada4;
}
.breadcrumb > strong {
  font-weight: 450;
  color: #75887a;
}
.breadcrumb > b {
  font-weight: 400;
  font-size: 12px;
  color: #c4cec6;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 22px;
}
.topbar-right .date {
  font-size: 10px;
  color: #8c9b91;
  display: flex;
  align-items: center;
  gap: 7px;
}
.sync-button {
  min-height: 25px;
  border: 0;
  padding: 2px;
  background: none;
  font-size: 9px;
  color: #98aa9b;
  gap: 5px;
}
.sync-button > i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #56b58a;
}
.sync-button > i.pending {
  background: #d7ab54;
  animation: pulse 1s infinite;
}
.topbar-right > .icon-button {
  color: #90a295;
  width: 22px;
}
.page-heading {
  display: flex;
  align-items: center;
