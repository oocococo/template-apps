:root{
  --bg:#F4F7F5; --card:#FFFFFF; --ink:#15241C; --ink2:#556A5E; --ink3:#8A9C92;
  --brand:#0F7A4E; --brand2:#0B5F3D; --brandbg:#E8F4EE; --line:#DDE8E1;
  --warn:#B4400E; --warnbg:#FDF0E8; --blue:#1D4ED8; --bluebg:#EEF2FF;
  --r:14px; --sh:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:78px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0F7A4E,#0B5F3D);color:#fff;padding:14px 0 16px;box-shadow:0 2px 12px rgba(11,95,61,.18)}
header .wrap{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.sub{font-size:11.5px;opacity:.82;margin-top:2px}
.badge-line{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 0 8px}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0;cursor:pointer;font-family:inherit}
nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--brand);font-weight:700}
.panel{display:none;padding:16px 0 8px}
.panel.on{display:block}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14.5px;font-family:inherit;color:var(--ink);outline:none;box-shadow:var(--sh)}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,122,78,.12)}
.search .ic2{position:absolute;right:14px;top:11px;color:var(--ink3)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-family:inherit}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.count{font-size:12px;color:var(--ink3);margin:2px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;box-shadow:var(--sh)}
.card .row1{display:flex;align-items:flex-start;gap:8px}
.code{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brandbg);border-radius:6px;padding:2px 7px;margin-top:1px;font-variant-numeric:tabular-nums}
.title{font-size:14.5px;font-weight:600;line-height:1.5;flex:1}
.money{font-size:13px;color:var(--warn);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.money small{font-weight:500;color:var(--ink3);margin-left:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;padding:1.5px 7px;border-radius:6px;background:#F1F5F3;color:var(--ink2);border:1px solid var(--line)}
.tag.move{background:var(--warnbg);color:var(--warn);border-color:#F6D9C8}
.tag.move2{background:#FFF8E6;color:#8A6209;border-color:#EFDFB4}
.tag.sub{background:var(--bluebg);color:var(--blue);border-color:#DBE4FF}
.note{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.8px;color:var(--ink2);line-height:1.75}
.card.open .note{display:block}
.card .tog{font-size:11.5px;color:var(--brand);margin-top:7px;display:inline-block;cursor:pointer}
.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:20px 0 9px;display:flex;align-items:center;gap:7px}
.sec:before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
select,textarea,input[type=text]{font-family:inherit}
