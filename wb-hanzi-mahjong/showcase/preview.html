:root{
  --felt1:#1f9a68; --felt2:#0c5436; --hud:rgba(8,55,36,.9);
  --tile1:#fffdf6; --tile2:#ece2c8; --tile-edge:#d8c9a3; --tile-side:#cdbf9a;
  --ink:#2a2a2a; --gold:#f4c95d; --gold-dk:#7a5a10; --red:#e0483b; --cream:#faf6ed;
  --chip:rgba(14,82,54,.92);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#08351f;font-family:"Kaiti SC","STKaiti","KaiTi","\u6977\u4F53","Noto Serif SC",serif;color:var(--ink);display:flex;justify-content:center}
#app{position:relative;width:min(100vw,1040px);height:100dvh;background:linear-gradient(165deg,var(--felt1),var(--felt2));overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.5)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* \u7ACB\u4F53\u724C */
.tile{width:54px;height:72px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(160deg,var(--tile1),var(--tile2));
  border:1px solid var(--tile-edge);
  box-shadow: inset 0 2px 0 #fff, inset 0 -5px 7px rgba(0,0,0,.12), 0 5px 0 var(--tile-side), 0 8px 12px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:var(--ink);
  text-shadow:0 1px 0 #fff,0 -1px 1px rgba(0,0,0,.12);
  cursor:pointer;transition:transform .12s, box-shadow .12s;position:relative;user-select:none}
.tile.sm{width:38px;height:50px;font-size:21px;border-radius:7px;box-shadow: inset 0 1px 0 #fff, inset 0 -3px 5px rgba(0,0,0,.12), 0 3px 0 var(--tile-side), 0 5px 8px rgba(0,0,0,.3)}
.tile.sel{transform:translateY(-10px);box-shadow: inset 0 2px 0 #fff, 0 0 0 3px var(--gold), 0 5px 0 var(--tile-side), 0 10px 14px rgba(0,0,0,.4)}
.tile.drawn{border:2px solid var(--gold)}
.tile.revsel{outline:3px solid var(--gold);outline-offset:2px;box-shadow: inset 0 2px 0 #fff, 0 3px 0 var(--tile-side), 0 0 10px rgba(244,201,93,.6)}
.tile.claimtarget{outline:3px solid var(--gold);outline-offset:2px;box-shadow: inset 0 2px 0 #fff, 0 3px 0 var(--tile-side), 0 0 16px rgba(244,201,93,.95);transform:translateY(-5px)}
.tile.back{background:linear-gradient(160deg,#2a8a5e,#15704a);border:1px solid var(--gold);box-shadow: inset 0 2px 0 rgba(255,255,255,.15), 0 4px 0 #0c4a30, 0 7px 10px rgba(0,0,0,.3);cursor:default}
.tile.back::after{content:"\u9EBB";color:rgba(255,255,255,.35);font-size:22px;font-weight:800}
.meldword{display:flex;gap:2px;align-items:center;background:rgba(0,0,0,.22);padding:3px 6px;border-radius:8px}
.meldword .tile.sm{box-shadow: inset 0 1px 0 #fff, 0 2px 0 var(--tile-side)}
.mtag{color:var(--gold);font-size:11px;font-weight:800;margin-left:3px}

/* \u9996\u9875 */
#screen-home{align-items:center;justify-content:center;gap:18px;text-align:center;padding:28px}
#screen-home .logo{width:96px;height:96px;border-radius:22px;background:linear-gradient(160deg,var(--tile1),var(--tile2));box-shadow:0 6px 0 var(--tile-side),0 12px 26px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:var(--ink)}
#screen-home h1{color:#fff;font-size:34px;letter-spacing:8px}
#screen-home .sub{color:#d7f0e2;font-size:15px;letter-spacing:2px}
.home-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.home-card{width:220px;background:rgba(255,255,255,.95);border-radius:18px;padding:22px 18px;cursor:pointer;transition:transform .12s;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.home-card:hover{transform:translateY(-4px)}
.home-card .ic{font-size:42px}
.home-card h3{margin:10px 0 6px;font-size:19px;color:#1a3b2a}
.home-card p{font-size:13px;color:#5a6b60;line-height:1.6}

/* \u901A\u7528\u6309\u94AE */
.btn{padding:12px 22px;border-radius:24px;border:none;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn-gold{background:var(--gold);color:#3a2a05;box-shadow:0 4px 0 #c99a2e}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn-green{background:#15704a;color:#fff;box-shadow:0 4px 0 #0c4a30}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* \u6559\u5E08\u7AEF */
#screen-teacher{padding:20px 26px;overflow-y:auto}
#screen-teacher h2{color:#fff;font-size:22px;margin-bottom:4px}
#screen-teacher .lead{color:#cfe8da;font-size:13px;margin-bottom:16px}
.panel{background:rgba(255,255,255,.96);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.panel h3{font-size:16px;color:#1a3b2a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel label{font-size:13px;color:#4a5a50;display:inline-block;margin:0 6px 0 0}
.panel textarea{width:100%;height:120px;border:1px solid #d8c9a3;border-radius:10px;padding:10px;font-size:14px;font-family:inherit;resize:vertical}
.panel input[type=number]{width:70px;border:1px solid #d8c9a3;border-radius:8px;padding:6px 8px;font-size:14px;font-family:inherit}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tilepool{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:40px}
.tilepool .tile.sm{cursor:pointer}
.tilepool .tile.sm:hover{outline:2px solid var(--red)}
.deckinfo{font-size:13px;color:#4a5a50;margin-top:8px}
.warn{color:var(--red);font-size:13px;margin-top:6px;min-height:18px}
.teacher-actions{display:flex;gap:12px;margin:6px 0 30px;flex-wrap:wrap}

/* \u6E38\u620F\u5E93 */
#screen-library{padding:20px 26px;overflow-y:auto}
#screen-library h2{color:#fff;font-size:22px;margin-bottom:4px}
#screen-library .lead{color:#cfe8da;font-size:13px;margin-bottom:14px;line-height:1.6}
.lib-list{display:flex;flex-direction:column;gap:12px}
.lib-card{background:rgba(255,255,255,.96);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lib-card .num{font-weight:900;font-size:17px;color:var(--gold-dk);background:#fdf0d5;border:1px solid var(--gold);border-radius:10px;padding:6px 12px;letter-spacing:2px}
.lib-card .info{flex:1;min-width:160px}
.lib-card .info .nm{font-size:16px;color:#1a3b2a;font-weight:700}
.lib-card .info .meta{font-size:12px;color:#5a6b60;margin-top:2px}
.lib-card .acts{display:flex;gap:8px;flex-wrap:wrap}
.lib-card .acts button{padding:7px 14px;font-size:13px;border-radius:16px;border:none;font-family:inherit;font-weight:700;cursor:pointer}
.lib-load{background:var(--gold);color:#3a2a05}
.lib-del{background:#f3e3e3;color:var(--red)}
.lib-empty{color:#cfe8da;font-size:14px;text-align:center;margin-top:30px}

/* \u6E38\u620F\u754C\u9762 */
#hud{height:48px;background:var(--hud);display:flex;align-items:center;padding:0 16px;color:#fff;font-size:14px;flex-shrink:0;gap:10px}
#hud .sp{flex:1}
#hud .menu{color:var(--gold);cursor:pointer}
#table{flex:1;position:relative;min-height:0}
.seat{position:absolute;text-align:center}
.seat .pname{display:inline-block;background:var(--chip);color:#fff;font-size:13px;padding:4px 12px;border-radius:14px;white-space:nowrap}
.seat.me .pname{border:1.5px solid var(--gold);color:var(--gold);font-weight:700}
.seat.turn .pname{outline:2px solid var(--gold);outline-offset:2px}
.seat .melds{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px;max-width:240px}
#seat-top{top:8px;left:50%;transform:translateX(-50%)}
#seat-left{top:38%;left:8px}
#seat-right{top:38%;right:8px}
#seat-left .melds,#seat-right .melds{max-width:120px}
#discard-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(60%,420px)}
#discard-title{color:var(--gold);font-size:12px;text-align:center;margin-bottom:6px}
#discard-zone{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;max-height:200px;overflow:auto}
#discard-zone .tile{width:46px;height:60px;font-size:24px}
#discard-zone .tile.last{outline:2px solid var(--red);outline-offset:1px}
#claim-discard{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:8;display:none;text-align:center}
#claim-discard .lbl{color:var(--gold);font-size:13px;margin-bottom:6px;text-shadow:0 1px 3px #000}

/* \u5E95\u90E8\u64CD\u4F5C\u533A */
#mybar{flex-shrink:0;background:rgba(6,40,26,.6);padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08)}
#hint{color:var(--gold);font-size:13px;text-align:center;min-height:20px;line-height:1.5;margin-bottom:6px}
#actions{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
#actions.show{display:flex}
.act{padding:11px 0;min-width:84px;border-radius:22px;border:none;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.act.dis{background:#2e6b4e;color:#cfe8da}
.act.gold{background:var(--gold);color:#3a2a05;box-shadow:0 3px 0 #c99a2e}
.act.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #a52f24}
#hand-row{display:flex;align-items:flex-end;justify-content:center;min-height:80px;flex-wrap:wrap;gap:6px}
#my-melds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px;min-height:0}

/* \u62A5\u544A\u754C\u9762 */
#screen-report{background:var(--cream);overflow-y:auto;padding:20px 18px 34px}
#screen-report h2{text-align:center;font-size:21px;color:#333}
#hu-banner{display:none;margin:10px auto 0;width:fit-content;background:var(--red);color:#fff;font-size:18px;font-weight:900;padding:8px 26px;border-radius:24px;letter-spacing:2px}
#screen-report h3{font-size:16px;color:#333;margin:18px 0 10px}
.rrow{display:flex;align-items:center;background:#fff;border:1px solid #e8e0ce;border-radius:12px;padding:10px 12px;margin-bottom:8px;gap:10px}
.rrow.win{background:#fff7e0;border-color:var(--gold)}
.rrow .rk{width:30px;height:30px;border-radius:50%;background:#ede6d6;color:#7a6a4f;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rrow.win .rk{background:var(--gold);color:#3a2a05}
.rrow .nm{flex:1;font-size:15px}
.rrow .tag{font-size:11px;font-weight:700;color:var(--red)}
.rrow .sc{font-size:15px;font-weight:700}
.stat-card{background:#fff;border:1px solid #e8e0ce;border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:8px 18px}
.stat-card b{font-size:15px}
.stat-card .sub{width:100%;font-size:12px;color:#777}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fdf0d5;border:1px solid var(--gold);border-radius:16px;padding:5px 14px;font-size:13px;color:var(--gold-dk);font-weight:700}
.tip-box{font-size:13px;color:#6a6a6a;line-height:1.7}
.rep-btns{display:flex;gap:12px;margin-top:24px}
.rep-btns button{flex:1;padding:13px 0;border-radius:24px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;border:none}
#btn-again{background:var(--gold);color:#3a2a05;box-shadow:0 4px 0 #c99a2e}
#btn-home{background:#fff;color:var(--gold-dk);border:1.5px solid var(--gold)}

/* \u9996\u9875\u6A21\u5F0F\u5F00\u5173 + \u4E3B\u6309\u94AE */
.mode-switch{display:flex;gap:0;background:rgba(0,0,0,.25);border-radius:26px;padding:4px;margin-top:6px}
.mode-switch .seg{border:none;background:transparent;color:#cfe8da;font-family:inherit;font-size:15px;font-weight:700;padding:10px 20px;border-radius:22px;cursor:pointer;transition:.15s}
.mode-switch .seg.active{background:var(--gold);color:#3a2a05}
.home-play{font-size:17px;padding:14px 30px;margin-top:6px}
#home-offline,#home-online{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.home-sub{color:#cfe8da;font-size:12px;letter-spacing:1px;text-align:center;max-width:340px}
.bar{width:100%;height:10px;background:#efe7d3;border-radius:6px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#36c08a,#15704a)}

/* \u5F39\u5C42 / \u4F20\u8BBE\u5907 */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.dialog{background:var(--cream);border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:84dvh;overflow-y:auto}
.dialog h3{font-size:18px;margin-bottom:12px;color:#333}
.dialog p{font-size:13px;color:#666;line-height:1.8;margin:8px 0}
.dialog .dlg-btns{display:flex;gap:10px;margin-top:14px}
.dialog .dlg-btns button{flex:1;padding:11px 0;border-radius:20px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border:none}
.pass-card{background:var(--cream);border-radius:16px;padding:28px 30px;text-align:center}
.pass-card .who{font-size:21px;font-weight:900;color:#333;margin:10px 0 16px}

/* ---- \u5B9E\u65F6\u79EF\u5206\u6761 / \u6A21\u5F0F\u63D0\u793A ---- */
#scoreboard{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 10px;margin:0 auto 6px;max-width:780px}
.sb-item{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:#fff;border:1px solid #e3d6b4;font-size:13px;color:#4a5a50;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sb-item.me{border-color:#d9a13b;background:#fff6e2;color:#7a5a10;font-weight:700}
.sb-item.turn{border-color:#8fbf9f;background:#eef7f1;color:#2f6b46}
.sb-item .sb-sc{font-weight:700;font-variant-numeric:tabular-nums}
#mode-note{display:none;margin:0 auto 6px;max-width:780px;padding:7px 12px;border-radius:10px;background:#eef4ff;border:1px solid #c9d8f5;color:#2b3f6b;font-size:13px;text-align:center}
.auto-note{font-size:12.5px;color:#6b7a70;margin-left:6px;line-height:1.5}

/* \u6E38\u620F\u5E93\uFF1A\u6587\u4EF6\u5939\u6811 / \u6392\u5E8F / \u6E38\u620F\u540D\u663E\u793A */
.muted-sm{font-size:12px;color:#7a8a80;margin-left:8px}
.hint{font-size:12px;color:var(--red);margin-top:4px;min-height:14px}
.lib-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.lib-toolbar-label{font-size:13px;color:#cfe8da}
.lib-toolbar .sp{flex:1}
.lib-section{display:flex;flex-direction:column;gap:12px}
.lib-folder{margin:6px 0;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px}
.lib-folder-sum{font-size:15px;font-weight:700;color:#1a3b2a;cursor:pointer;list-style:none;padding:4px 0}
.lib-folder-sum::-webkit-details-marker{display:none}
.lib-folder .lib-card{margin-top:8px}
.lib-card .gname{color:#7a5a10;font-weight:600}
.lib-card .fpath{color:#3a7a5a}
#room-gamename{font-weight:600}

/* \u5B58\u5165\u6E38\u620F\u5E93\u5BF9\u8BDD\u6846 */
#dlg-save label{display:block;font-size:14px;color:#3a4a40;margin-top:12px;font-weight:600}
#dlg-save input,#dlg-save select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d8c9a3;border-radius:10px;font-family:inherit;font-size:15px;margin:4px 0;background:#fff;color:#222}

/* \u4E2A\u4EBA\u4FDD\u5B58\u4E0E\u9875\u9762\u5185\u786E\u8BA4 */
.status{font-size:12px;line-height:1.5;color:#cfe8da;min-height:18px;text-align:center}.panel .status{color:#5a6b60;text-align:left}.report-save{text-align:center;margin-top:20px}.report-status{color:#6a6a6a;text-align:center;font-size:13px;min-height:20px}.lib-report{cursor:pointer}.dialog input{width:100%;padding:10px 12px;border:1px solid #d8c9a3;border-radius:10px;font:15px inherit;background:#fff}.dialog label{display:block;font-size:14px;margin-top:12px}.dialog .error{font-size:13px;color:var(--red);min-height:18px;margin-top:8px}.tilepool button{font-family:inherit}.tilepool .tile,.hand .tile{padding:0}.library-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.empty-chips{font-size:13px;color:#6a6a6a}.save-note{font-size:12px;color:#666;line-height:1.6;margin-top:8px}

#screen-teacher .btn-ghost{color:#5a6b60;border-color:#bbb}#screen-history{padding:20px 26px;overflow-y:auto}#screen-history h2{color:#fff;font-size:22px;margin-bottom:14px}
