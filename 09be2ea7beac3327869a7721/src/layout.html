

<header>
  <div class="brand"><span class="mark">⚡</span>电学实验室<small>高中物理 · 电路仿真</small></div>
  <div class="seg" id="modeSeg">
    <button class="on" data-mode="sim">仿真</button>
    <button data-mode="test">测试</button>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <select class="sel" id="presetSel">
      <option value>实验模板…</option>
    </select>
    <button class="btn" id="btnClear">清空画板</button>
  </div>
</header>

<div class="layout">
  <aside class="palette" id="palette">
    <div class="ptitle">元 件 库</div>
    <div id="paletteList"></div>
    <p class="pnote">
      <b>怎么接线：</b>从元件两端的<b>小圆点</b>按住拖到另一个圆点即可连成导线。<br>
      <b>怎么移动：</b>拖动元件本体。<br>
      <b>怎么删除：</b>选中后按 Delete，或点右上角 ×。<br>
      默认按课本<b>理想模型</b>处理：电表内阻近似理想、电源内阻为 0，可在右侧自行修改。<br>
      直流稳态下：电容视为<b>断路</b>，电感视为<b>短路</b>。
    </p>
  </aside>

  <section class="stage-wrap">
    <div id="stage">
      <svg id="wires"></svg>
      <div class="stage-hint" id="stageHint">拖动元件摆放 → 从端口拖出导线 → 电路立即通电</div>
    </div>
  </section>

  <aside class="panel" id="panelBody"></aside>
</div>
