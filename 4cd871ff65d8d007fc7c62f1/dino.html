<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#eaf5ff" />
<title>恐龙数学 · 二年级 / 大班启蒙</title>
<style>
  :root{--ink:#152a45;--sub:#5b7794;--leaf:#0f9d63;--moss:#12b76a;--deep:#0c7fb8;--sand:#b45309;--sun:#f59e0b;--sky:#0e86c9;--rose:#e04a5c;--violet:#7c3aed;--cream:#eef6ff;--card:#ffffff;--line:rgba(15,157,99,.14);--panel:#ffffff;--panel-soft:#f2f8ff;--shadow:0 12px 28px rgba(23,63,120,.12);--shadow-s:0 3px 10px rgba(23,63,120,.10);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(circle at 10% 0%, rgba(56,189,248,.13), transparent 42%),radial-gradient(circle at 92% 6%, rgba(167,139,250,.13), transparent 40%),radial-gradient(circle at 50% 100%, rgba(34,197,94,.08), transparent 46%),#eef6ff;
    -webkit-font-smoothing:antialiased;
  }
  .app{position:relative;max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  @media (min-width:520px){
    .app{min-height:calc(100vh - 40px);margin:20px auto;border-radius:30px;overflow:hidden;
      box-shadow:0 28px 64px rgba(90,140,110,.20), 0 0 0 1px rgba(255,255,255,.8) inset;}
  }

  /* header */
  header{position:sticky;top:0;z-index:20;padding:13px 18px 9px;display:flex;align-items:center;gap:9px;
    background:linear-gradient(180deg,rgba(251,253,249,.97),rgba(251,253,249,.84) 70%,rgba(251,253,249,0));
    backdrop-filter:blur(8px);}
  .logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px;letter-spacing:.3px;}
  .logo .d{font-size:21px;}
  .lvpill{margin-left:auto;font-size:12px;font-weight:700;color:var(--deep);background:rgba(34,197,94,.14);
    border:1px solid rgba(14,134,201,.25);padding:5px 11px;border-radius:999px;}
  .stars{font-size:13px;font-weight:700;color:#b98210;background:rgba(245,158,11,.14);border:1px solid #ffe6a6;
    padding:5px 10px;border-radius:999px;}

  main{flex:1;padding:2px 16px 100px;}

  /* 通用 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow-s);}
  .sec-title{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:14px;font-weight:800;color:var(--ink);}
  .sec-title small{margin-left:auto;font-weight:600;color:var(--sub);font-size:12px;}
  .btn{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--panel);color:var(--ink);box-shadow:var(--shadow-s);font-family:inherit;}
  .btn.pri{background:linear-gradient(180deg,#0e86c9,#0f9d63);color:var(--panel);box-shadow:0 8px 18px rgba(63,156,109,.30);}
  .btn.sand{background:linear-gradient(180deg,#ffd777,#f2a93b);color:#4a3100;box-shadow:0 8px 18px rgba(242,169,59,.28);}
  .btn.soft{background:#eff7f0;color:var(--deep);box-shadow:none;border:1px solid #d8ecdc;}
  .btn:active{transform:translateY(1px);}
  .btnrow{display:flex;gap:10px;margin-top:12px;}
  .btnrow .btn{flex:1;}
  .btn[disabled]{opacity:.45;}

  /* 档位 */
  .levels{display:flex;gap:10px;margin:4px 0 14px;}
  .lv{position:relative;flex:1;text-align:left;border-radius:18px;padding:12px 13px;cursor:pointer;
    border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow-s);font-family:inherit;}
  .lv.on{border-color:var(--moss);background:linear-gradient(180deg,rgba(34,197,94,.10),rgba(34,197,94,.14));}
  .lv .e{font-size:19px;display:block;}
  .lv b{display:block;font-size:14px;margin-top:2px;}
  .lv small{display:block;font-size:11px;line-height:1.45;color:var(--sub);margin-top:2px;}
  .lv .tick{position:absolute;top:-9px;right:10px;font-size:10px;font-weight:800;color:var(--panel);
    background:var(--moss);padding:2px 8px;border-radius:999px;}

  /* hero */
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#ffffff;
    background:linear-gradient(150deg,rgba(34,197,94,.12) 0%,rgba(34,197,94,.08) 46%,rgba(245,158,11,.10) 100%);
    border:1px solid rgba(14,134,201,.30);box-shadow:var(--shadow);}
  .hero::after{content:"🦕";position:absolute;right:-8px;bottom:-18px;font-size:104px;opacity:.14;transform:rotate(-8deg);}
  .hero-top{display:flex;gap:8px;align-items:center;}
  .badge{font-size:11px;font-weight:800;color:#0f9d63;background:rgba(255,255,255,.12);
    border:1px solid rgba(14,134,201,.30);padding:4px 9px;border-radius:999px;}
  .badge.warm{color:#b45309;background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.35);}
  .hero h1{margin:10px 0 2px;font-size:22px;letter-spacing:.2px;}
  .hero .sub{margin:0;color:#4d6b8a;font-size:12px;}
  .concept{position:relative;margin:12px 0 0;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.10);
    border:1px dashed rgba(14,134,201,.30);font-size:14px;font-weight:700;line-height:1.5;color:#33566f;}
  .chant{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:800;color:#b45309;
    background:rgba(245,158,11,.20);border:1px solid rgba(245,158,11,.40);padding:5px 11px;border-radius:999px;}
  .bar{height:9px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:13px;overflow:hidden;border:1px solid rgba(14,134,201,.25);}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0e86c9,#0f9d63);transition:width .35s;}
  .tip{margin:8px 0 0;font-size:11.5px;color:#5b7794;}

  /* 四步 */
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .step{position:relative;text-align:left;border-radius:18px;padding:13px 13px 12px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-s);font-family:inherit;}
  .step .ic{font-size:20px;display:block;}
  .step b{display:block;font-size:13.5px;margin-top:5px;}
  .step small{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4;}
  .step .ok{position:absolute;top:9px;right:10px;font-size:10px;font-weight:800;color:#0f9d63;
    background:rgba(34,197,94,.14);border:1px solid rgba(14,134,201,.25);padding:2px 7px;border-radius:999px;}
  .step.primary{border-color:rgba(14,134,201,.30);background:linear-gradient(180deg,rgba(56,189,248,.08),rgba(56,189,248,.12));}

  /* 知识点卡 */
  .ltop{display:flex;align-items:center;gap:10px;margin:2px 0 12px;}
  .ltop .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    font-size:17px;cursor:pointer;box-shadow:var(--shadow-s);}
  .ltop .t{font-size:16px;font-weight:800;}
  .ltop .t small{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-top:1px;}
  .counter{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--sub);
    background:#eff7f0;border:1px solid #d8ecdc;padding:5px 10px;border-radius:999px;}

  .kcard{position:relative;text-align:center;border-radius:22px;padding:20px 16px 18px;background:var(--panel);
    border:1px solid var(--line);box-shadow:var(--shadow);}
  .art{font-size:34px;line-height:1.25;letter-spacing:2px;min-height:46px;word-break:break-all;}
  .art.big{font-size:26px;}
  .art.small{font-size:20px;letter-spacing:1px;}
  .kq{margin:12px 0 0;font-size:21px;font-weight:800;line-height:1.45;letter-spacing:.2px;}
  .keq{margin-top:12px;font-size:26px;font-weight:800;color:var(--deep);letter-spacing:1px;}
  .kans{margin-top:12px;font-size:16px;font-weight:800;color:#b45309;background:rgba(245,158,11,.14);
    border:1px solid #ffe6a6;display:inline-block;padding:7px 15px;border-radius:12px;}
  .kwhy{margin-top:12px;font-size:13.5px;line-height:1.65;color:#33566f;background:rgba(56,189,248,.10);
    border:1px solid rgba(14,134,201,.28);border-radius:14px;padding:11px 13px;text-align:left;}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:14px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:#d9e8dd;}
  .dots i.on{background:var(--moss);transform:scale(1.25);}

  /* 练习 / 测验 */
  .qcard{border-radius:22px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);}
  .qno{font-size:11.5px;font-weight:800;color:var(--moss);letter-spacing:.4px;}
  .qq{margin:8px 0 4px;font-size:20px;font-weight:800;line-height:1.5;}
  .qq.word{font-size:16px;line-height:1.75;color:#33566f;}
  .qword{display:inline-block;font-size:10px;font-weight:800;color:#053046;background:#ffb020;border-radius:8px;padding:2px 7px;margin-bottom:4px;letter-spacing:1px;}
  .qart{font-size:26px;letter-spacing:2px;margin-top:8px;word-break:break-all;}
  .opts{display:grid;gap:10px;margin-top:16px;}
  .opt{position:relative;text-align:left;border-radius:15px;padding:14px 15px;font-size:17px;font-weight:800;
    border:2px solid rgba(14,134,201,.20);background:#f2f8ff;cursor:pointer;font-family:inherit;color:var(--ink);}
  .opt:active{transform:scale(.99);}
  .opt.ok{border-color:#5fc48c;background:#eafaf0;color:#1f6b45;}
  .opt.no{border-color:#e04a5c;background:rgba(240,90,105,.14);color:#b8323f;}
  .opt .mk{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:15px;}
  .why{margin-top:13px;border-radius:14px;padding:12px 13px;font-size:13.5px;line-height:1.65;
    background:rgba(56,189,248,.10);border:1px solid rgba(14,134,201,.28);color:#33566f;}
  .why b{color:var(--deep);}
  .score{margin-top:10px;font-size:12px;color:var(--sub);font-weight:700;}

  /* 小剧场 */
  .stage{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(14,134,201,.25);
    background:linear-gradient(180deg,#dff1ff 0%,#eef9ff 52%,#f5fbef 52%,#f5fbef 100%);
    box-shadow:var(--shadow);}
  .stage svg{display:block;width:100%;height:auto;}
  .bubble{margin:0 12px 12px;padding:14px 15px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
    box-shadow:var(--shadow-s);position:relative;}
  .bubble .who{font-size:11.5px;font-weight:800;color:var(--moss);letter-spacing:.4px;}
  .bubble .txt{margin-top:5px;font-size:16px;font-weight:700;line-height:1.6;}
  .bubble .art2{position:absolute;right:12px;top:12px;font-size:20px;opacity:.85;}
  .scenter{text-align:center;font-size:11.5px;color:var(--sub);margin-top:8px;}

  /* 周表 */
  .week{display:grid;gap:7px;}
  .wrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:9px;
    padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;}
  .wrow.cur{border-color:rgba(14,134,201,.30);background:rgba(56,189,248,.10);}
  .wrow .d{font-size:11.5px;font-weight:800;color:var(--sub);}
  .wrow .t{font-size:13px;font-weight:700;}
  .wrow .v{font-size:11.5px;font-weight:800;color:var(--moss);}

  /* 我的 */
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .st{border-radius:16px;padding:13px;background:var(--panel);border:1px solid var(--line);text-align:center;}
  .st b{display:block;font-size:22px;color:var(--deep);}
  .st small{font-size:11.5px;color:var(--sub);}
  .mk{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .mk:last-child{border-bottom:0;}
  .mk .h{font-size:11px;color:var(--sub);margin-bottom:3px;}

  /* 底部导航 */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(251,253,249,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
  nav button{border:0;background:none;font-family:inherit;font-size:10.5px;font-weight:700;color:var(--sub);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;border-radius:12px;cursor:pointer;}
  nav button b{font-size:18px;font-weight:400;line-height:1;}
  nav button.on{color:var(--deep);}
  nav button.on b{transform:translateY(-1px);}
  @media (min-width:520px){ nav{max-width:460px;margin:0 auto;border-radius:0 0 30px 30px;} }

  /* toast / sheet */
  #toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,14px);z-index:80;
    background:rgba(38,58,44,.94);color:var(--panel);font-size:13px;font-weight:700;padding:10px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;}
  #toast.on{opacity:1;transform:translate(-50%,0);}
  #sheet{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;
    background:rgba(30,45,35,.35);}
  #sheet.on{display:flex;}
  #sheet .in{width:100%;max-width:460px;background:var(--panel);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    text-align:center;animation:up .22s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  #sheet .big{font-size:40px;}
  #sheet h3{margin:8px 0 4px;font-size:18px;}
  #sheet p{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.6;}

  .empty{text-align:center;color:var(--sub);font-size:13px;padding:18px 0;}
  .hintline{font-size:11.5px;color:var(--sub);margin:10px 2px 0;line-height:1.6;}

  /* ============ 明亮能量主题层（浅色 · 机甲光感） ============ */
  body{background:
    radial-gradient(circle at 8% -6%, rgba(34,197,94,.22), transparent 42%),
    radial-gradient(circle at 96% 0%, rgba(56,189,248,.24), transparent 42%),
    radial-gradient(circle at 50% 104%, rgba(251,191,36,.20), transparent 46%),
    linear-gradient(180deg,#eaf8f1 0%,#f3fbff 52%,#e8f4ff 100%);
    background-attachment:fixed;}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      radial-gradient(2px 2px at 12% 14%, rgba(34,197,94,.40), transparent),
      radial-gradient(1.6px 1.6px at 78% 9%, rgba(56,189,248,.42), transparent),
      radial-gradient(1.8px 1.8px at 42% 55%, rgba(56,189,248,.28), transparent),
      radial-gradient(1.6px 1.6px at 88% 68%, rgba(251,191,36,.45), transparent),
      radial-gradient(1.4px 1.4px at 22% 82%, rgba(34,197,94,.30), transparent);}
  .app{position:relative;z-index:1;}
  header{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.74) 72%,rgba(255,255,255,0));}
  .logo{color:#173c2e;}
  .logo .d{filter:drop-shadow(0 4px 8px rgba(34,180,110,.30));}
  .lvpill{background:#effaf3;border-color:rgba(15,157,99,.28);color:#0f8b57;}
  .stars{background:#fff;border-color:#ffe6a6;color:#b8790a;}
  .badge{background:rgba(255,255,255,.24);color:#fff;border-color:rgba(255,255,255,.40);}
  .badge.warm{color:#7a4a05;background:rgba(255,255,255,.88);border-color:rgba(245,158,11,.45);}
  .hero{background:linear-gradient(140deg,#12b981 0%,#0ea5b7 48%,#2f7ff0 100%);color:#fff;border:0;
    box-shadow:0 16px 30px rgba(16,140,120,.24);}
  .hero .sub{color:rgba(255,255,255,.92);}
  .hero .tip{color:rgba(255,255,255,.90);}
  .concept{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.55);color:#fff;}
  .chant{background:rgba(255,255,255,.92);color:#8a5600;border-color:rgba(245,158,11,.40);}
  .bar{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.42);}
  .bar i{background:linear-gradient(90deg,#d8ffef,#ffffff);box-shadow:0 0 10px rgba(255,255,255,.5);}
  .qword{color:#4a3100;background:#ffc53d;}
  .btn{border:1px solid rgba(14,134,201,.12);}
  .btn.pri{background:linear-gradient(180deg,#5ecdf5,#22a9e0);color:#04364a;border:0;
    box-shadow:0 4px 0 #1786b3,0 10px 20px rgba(34,169,224,.28);}
  .btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 #1786b3;}
  .btn.sand{background:linear-gradient(180deg,#ffd166,#f5a812);color:#4a3100;border:0;
    box-shadow:0 4px 0 #c47c00,0 10px 20px rgba(245,158,11,.26);}
  .btn.sand:active{transform:translateY(3px);box-shadow:0 1px 0 #c47c00;}
  .btn.soft{background:#eaf7ff;color:#0b74a8;border:1px solid rgba(34,169,224,.32);}
  .step{background:#fff;border:1px solid rgba(15,157,99,.12);}
  .step.primary{background:linear-gradient(135deg,#eafaf1,#ffffff);border-color:rgba(15,157,99,.40);}
  .step .ok{background:#e7f9f0;color:#0f9d63;}
  .kcard,.qcard{background:#fff;border:1px solid rgba(15,157,99,.12);}
  .keq{color:#0f8b57;}
  .kans{color:#8a5600;background:#fff7e3;border-color:#ffe0a3;}
  .kwhy,.why{background:#f1f9ff;border-color:rgba(14,134,201,.18);color:#33566f;}
  .qq.word{color:#33566f;}
  .opt{background:#f5fbff;border-color:rgba(14,134,201,.16);color:#15304f;}
  .opt.ok{border-color:#5fc48c;background:#eafaf0;color:#1f6b45;}
  .opt.no{border-color:#f08a96;background:#fdeef0;color:#b8323f;}
  .back{background:#fff;color:#15304f;border-color:rgba(15,157,99,.16);}
  #toast{background:rgba(20,42,70,.92);color:#fff;border:1px solid rgba(255,255,255,.18);}
  #modal{background:rgba(20,42,70,.34);}
  .sheet{background:#fff;border:1px solid rgba(15,157,99,.18);color:#15304f;}
  .dots i{background:#dbe7f3;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" style="cursor:pointer;" title="返回科目主页"><span class="d">🦕</span>恐龙数学</div>
    <a class="lvpill" id="backHome" href="#" style="text-decoration:none;cursor:pointer;">🏠 科目</a>
    <span class="lvpill" id="lvpill">二年级</span>
    <span class="stars" id="starBox">⭐ 0</span>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-view="home"><b>🏠</b>首页</button>
    <button data-view="learn"><b>🧮</b>学一学</button>
    <button data-view="practice"><b>✏️</b>练一练</button>
    <button data-view="me"><b>🦖</b>我的</button>
  </nav>
</div>
<div id="sheet" data-close="1"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script src="content-math-g2.js"></script>
<script src="content-math-kg.js"></script>
<script>
/* ======================= 基础工具 ======================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);

/* ======================= 档位与内容 ======================= */
const SETS = {
  g2: (typeof MATH_G2 !== 'undefined' ? MATH_G2 : []),
  kg: (typeof MATH_KG !== 'undefined' ? MATH_KG : [])
};
const LVMETA = {
  g2: { name: '二年级', emoji: '🦖', sub: '人教版 · 表内乘除 · 单位与时间' },
  kg: { name: '大班', emoji: '🦕', sub: '数学启蒙 · 10/20 以内加减 · 凑十破十 · 图形规律' }
};
const LEVEL_KEY = 'dino-level';
let LEVEL = (function () {
  try { const v = stateStore.getItem(LEVEL_KEY); if (v && SETS[v] && SETS[v].length) return v; } catch (e) {}
  return 'g2';
})();
const days = () => (SETS[LEVEL] && SETS[LEVEL].length ? SETS[LEVEL] : SETS.g2);
const baseKey = () => (LEVEL === 'kg' ? 'dino-math-kg-v1' : 'dino-math-v1');
const dayOf = d => days().find(x => x.day === d) || days()[0];
const passLine = total => Math.ceil(total * 0.8);

/* ======================= 状态 ======================= */
const EMPTY = () => ({ seen: {}, done: {}, quizScore: {}, stars: 0, streak: 1, lastVisit: '', mistakes: [] });

function loadState() {
  try {
    const raw = stateStore.getItem(baseKey());
    const s = raw ? JSON.parse(raw) : null;
    if (s && typeof s === 'object') return Object.assign(EMPTY(), s);
  } catch (e) {}
  return EMPTY();
}
let S = loadState();
const save = () => { try { stateStore.setItem(baseKey(), JSON.stringify(S)); } catch (e) {} };

function loadLevelState() { S = loadState(); }
function saveLevelState() { save(); }

/* 连续天数 */
(function streak() {
  const today = new Date().toDateString();
  if (S.lastVisit !== today) {
    const y = new Date(Date.now() - 864e5).toDateString();
    S.streak = (S.lastVisit === y) ? ((S.streak || 0) + 1) : 1;
    S.lastVisit = today;
    save();
  }
})();

/* ======================= 视图状态 ======================= */
let DAY = 1;
let VIEW = 'home';
let LI = 0;           // 学一学：第几个知识点
let LREV = {};        // 知识点是否已展开答案
let PI = 0, PSEL = -1, PSCORE = 0;
let SI = 0;           // 小剧场：第几幕
let QI = 0, QSEL = -1, QSCORE = 0, QDONE = false;

function firstUnfinishedDay() {
  for (const d of days()) if (!S.done[d.day]) return d.day;
  return days()[days().length - 1].day;
}

/* ======================= 语音 ======================= */
let VOICE = null, VOICE_TRIED = false;
function pickVoice() {
  if (VOICE_TRIED) return VOICE;
  VOICE_TRIED = true;
  try {
    const vs = speechSynthesis.getVoices() || [];
    VOICE = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  } catch (e) {}
  return VOICE;
}
function speak(text, rate) {
  if (!text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = rate || 0.9; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ======================= 进度 ======================= */
const seenOf = d => (S.seen[d] || []);
const markSeen = (d, i) => {
  const arr = seenOf(d);
  if (!arr.includes(i)) { S.seen[d] = arr.concat([i]); save(); }
};
const stepDone = (d, k) => !!S.done[d + '-' + k];
const markStep = (d, k) => { S.done[d + '-' + k] = true; save(); };

function dayProgress(d) {
  const day = dayOf(d), n = (day.learn || []).length;
  const a = Math.min(seenOf(d).length, n) / n * 0.35;
  const b = stepDone(d, 'practice') ? 0.3 : 0;
  const c = stepDone(d, 'story') ? 0.1 : 0;
  const q = S.quizScore[d] ? Math.min(1, S.quizScore[d] / Math.max(1, (day.quiz || []).length)) * 0.25 : 0;
  return Math.round((a + b + c + q) * 100);
}

function addStar(n) {
  S.stars = (S.stars || 0) + n;
  save();
  const el = $('#starBox'); if (el) el.textContent = '⭐ ' + S.stars;
}

/* 错题本 */
const mistakes = () => (S.mistakes || (S.mistakes = []));
function recordMistake(q, correct, wrong) {
  const arr = mistakes();
  const last = arr[arr.length - 1];
  if (last && last.q === q && Date.now() - last.ts < 6000) return;
  arr.push({ q: q, correct: String(correct), wrong: String(wrong), day: DAY, ts: Date.now() });
  if (arr.length > 100) arr.splice(0, arr.length - 100);
  save();
}

/* ======================= 渲染 ======================= */
const VIEWS = { home: homeView, learn: learnView, practice: practiceView, story: storyView, quiz: quizView, me: meView };

function render() {
  if (!days().length) { $('#view').innerHTML = '<div class="empty">内容没有加载成功，请刷新页面</div>'; return; }
  if (DAY > days().length) DAY = days().length;
  $('#lvpill').textContent = LVMETA[LEVEL].name;
  $('#starBox').textContent = '⭐ ' + (S.stars || 0);
  const fn = VIEWS[VIEW] || homeView;
  $('#view').innerHTML = fn();
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === VIEW));
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ======================= 交互 ======================= */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('on'), 1600);
}
function openSheet(html) { $('#sheetIn').innerHTML = html; $('#sheet').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); }

$('#sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet' && e.target.dataset.close) closeSheet();
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'lvSelect') {
    const lv = e.target.value;
    if (lv !== LEVEL) {
      LEVEL = lv;
      try { stateStore.setItem(LEVEL_KEY, lv); } catch (err) {}
      loadLevelState();
      saveLevelState();
      DAY = firstUnfinishedDay();
      LI = 0; LREV = {}; PI = 0; PSEL = -1; PSCORE = 0; SI = 0; QI = 0; QSEL = -1; QDONE = false;
      VIEW = 'home'; render();
      toast('已切到' + LVMETA[lv].name + '档');
    }
  }
});

document.addEventListener('click', e => {
  const nav = e.target.closest('#nav button');
  if (nav) {
    const v = nav.dataset.view;
    if (v === 'learn') { LI = 0; }
    if (v === 'practice') { PI = 0; PSEL = -1; PSCORE = 0; }
    VIEW = v; render(); return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case 'back': goHome(); break;

    case 'level': {
      const lv = el.dataset.lv;
      if (lv === LEVEL) { toast('已经在这个档位啦'); break; }
      LEVEL = lv;
      try { stateStore.setItem(LEVEL_KEY, lv); } catch (err) {}
      loadLevelState();
      saveLevelState();   /* 立即落盘：切档后该档位的进度键就存在，避免首次读取为空 */
      DAY = firstUnfinishedDay();
      LI = 0; LREV = {}; PI = 0; PSEL = -1; PSCORE = 0; SI = 0; QI = 0; QSEL = -1; QDONE = false;
      VIEW = 'home'; render();
      toast('已切到' + LVMETA[lv].name + '档');
      break;
    }

    case 'goDay':
      stopSpeak();
      DAY = clamp(parseInt(el.dataset.d, 10), 1, days().length);
      LI = 0; LREV = {}; PI = 0; PSEL = -1; PSCORE = 0; SI = 0; QI = 0; QSEL = -1; QDONE = false;
      VIEW = 'home'; render();
      break;

    /* ---- 学一学 ---- */
    case 'learn':
      VIEW = 'learn'; LI = 0; LREV = {}; render();
      setTimeout(() => { const d = dayOf(DAY).learn[0]; if (d) speak(d.q); }, 220);
      break;

    case 'reveal': {
      LREV[DAY + '-' + LI] = true;
      markSeen(DAY, LI);
      render();
      const l = dayOf(DAY).learn[LI];
      setTimeout(() => speak((l.a || '') + '。' + (l.why || ''), 0.92), 120);
      break;
    }

    case 'sayLearn': {
      const l = dayOf(DAY).learn[LI] || {};
      speak((l.q || '') + '。答案：' + (l.a || '') + '。' + (l.why || ''), 0.9);
      break;
    }

    case 'prevLearn':
      if (LI > 0) { stopSpeak(); LI--; render(); }
      break;

    case 'nextLearn': {
      stopSpeak();
      const ls = dayOf(DAY).learn || [];
      if (LI < ls.length - 1) { LI++; render(); }
      else { SI = 0; VIEW = 'story'; markStep(DAY, 'story'); render(); toast('知识点看完啦，去看小剧场 🎬'); }
      break;
    }

    /* ---- 练一练 ---- */
    case 'practice':
      VIEW = 'practice'; PI = 0; PSEL = -1; PSCORE = 0; render();
      break;

    case 'pick': {
      if (PSEL >= 0) break;
      const q = dayOf(DAY).quiz[PI];
      const k = parseInt(el.dataset.k, 10);
      PSEL = k;
      const right = String(q.opts[k]) === String(q.a);
      if (right) { PSCORE++; addStar(1); }
      else recordMistake(q.q, q.a, q.opts[k]);
      render();
      break;
    }

    case 'nextPractice': {
      stopSpeak();
      const qs = dayOf(DAY).quiz || [];
      if (PI < qs.length - 1) { PI++; PSEL = -1; render(); }
      else {
        markStep(DAY, 'practice');
        SI = 0; VIEW = 'story'; markStep(DAY, 'story'); render();
        toast('练完 ' + qs.length + ' 道题，答对 ' + PSCORE + ' 道 🎉');
      }
      break;
    }

    case 'sayQ': {
      const q = dayOf(DAY).quiz[PI] || {};
      speak(q.q, 0.86);
      break;
    }

    /* ---- 小剧场 ---- */
    case 'story':
      VIEW = 'story'; SI = 0; render();
      setTimeout(() => { const s = dayOf(DAY).story[0]; if (s) speak(s.text); }, 260);
      break;

    case 'sayStory': {
      const s = dayOf(DAY).story[SI] || {};
      speak(s.text, 0.88);
      break;
    }

    case 'nextStory': {
      stopSpeak();
      const ss = dayOf(DAY).story || [];
      if (SI < ss.length - 1) {
        SI++; markStep(DAY, 'story'); render();
        setTimeout(() => { const s = dayOf(DAY).story[SI]; if (s) speak(s.text); }, 200);
      } else {
        markStep(DAY, 'story');
        QI = 0; QSEL = -1; QSCORE = 0; QDONE = false; VIEW = 'quiz'; render();
      }
      break;
    }

    /* ---- 小测验 ---- */
    case 'quiz':
      VIEW = 'quiz'; QI = 0; QSEL = -1; QSCORE = 0; QDONE = false; render();
      break;

    case 'pickQuiz': {
      if (QSEL >= 0) break;
      const q = dayOf(DAY).quiz[QI];
      const k = parseInt(el.dataset.k, 10);
      QSEL = k;
      const right = String(q.opts[k]) === String(q.a);
      if (right) QSCORE++;
      else recordMistake(q.q, q.a, q.opts[k]);
      render();
      break;
    }

    case 'nextQuiz': {
      stopSpeak();
      const qs = dayOf(DAY).quiz || [];
      if (QI < qs.length - 1) { QI++; QSEL = -1; render(); }
      else {
        QDONE = true;
        S.quizScore[DAY] = QSCORE;
        if (QSCORE >= passLine(qs.length)) { S.done[DAY] = true; addStar(3); }
        save(); render();
        if (QSCORE >= passLine(qs.length)) { speak('太棒了，全部过关', 0.95); toast('通关！+3 ⭐'); }
      }
      break;
    }

    case 'quizAgain':
      QI = 0; QSEL = -1; QSCORE = 0; QDONE = false; render();
      break;

    case 'nextDay': {
      DAY = DAY < days().length ? DAY + 1 : DAY;
      LI = 0; LREV = {}; PI = 0; PSEL = -1; PSCORE = 0; SI = 0; QI = 0; QSEL = -1; QDONE = false;
      VIEW = 'home'; render();
      toast(DAY === days().length ? '已经是最后一天啦' : '进入 DAY ' + DAY);
      break;
    }

    /* ---- 我的 ---- */
    case 'reset':
      openSheet(`<div class="big">🧹</div><h3>清空所有记录？</h3>
        <p>星星、进度、错题都会归零，无法恢复。</p>
        <button class="btn pri" style="width:100%" data-act="resetYes">确认清空</button>
        <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">取消</button>`);
      break;

    case 'resetYes':
      S = EMPTY(); save(); closeSheet();
      DAY = 1; LI = 0; LREV = {}; PI = 0; PSEL = -1; PSCORE = 0; SI = 0; QI = 0; QSEL = -1; QDONE = false;
      VIEW = 'home'; render(); toast('已重新开始');
      break;

    case 'closeModal': closeSheet(); break;
  }
});

function goHome() {
  stopSpeak();
  VIEW = 'home'; render();
}

document.querySelectorAll('.logo, #backHome').forEach(el => el.addEventListener('click', e => { e.preventDefault(); storage.flush().then(() => { location.hash = ''; location.reload(); }); }));
/* 启动（支持 #day=2&view=practice 深链接） */
(function init() {
  if (!days().length) { render(); return; }
  DAY = firstUnfinishedDay();
  const h = location.hash || '';
  const md = h.match(/day=(\d+)/), mv = h.match(/view=(\w+)/);
  if (md) DAY = clamp(parseInt(md[1], 10), 1, days().length);
  if (mv && VIEWS[mv[1]]) VIEW = mv[1];
  render();
  setTimeout(() => {
    if (VIEW === 'home' && !S.done[DAY]) {
      toast('点「看例题」，先看懂 ' + (dayOf(DAY).learn || []).length + ' 个知识点吧');
    }
  }, 800);
})();
/* 返回科目页时保留分享码参数，避免分享链接跳转后失效 */
(function keepShareParam() {
  const a = document.getElementById('backHome');
  if (a && location.search) a.href = 'index.html' + location.search;
})();
</script>
</body>
</html>
