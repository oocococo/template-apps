<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爱音单词示例</title><style>
:root{
  --bg:#fef7f9; --card:#ffffff; --line:#f0e4ea; --line2:#f7eef2;
  --text:#2b2430; --sub:#7a6b78; --faint:#a99aa6;
  --pink:#ff8899; --pink2:#ffb8c6; --pinksoft:#fff0f4;
  --purple:#a76cff; --blue:#5b8def; --gold:#f5a623;
  --ok:#22a06b; --okbg:#e7f7ef; --bad:#e0524d; --badbg:#fdecec; --warn:#d98324; --warnbg:#fff3e3;
  --grad:linear-gradient(135deg,#ff8899,#a76cff);
  --shadow:0 6px 22px rgba(180,120,150,.14); --shadow2:0 2px 8px rgba(180,120,150,.10);
  --r:18px;
}
[data-theme="dark"]{
  --bg:#15141a; --card:#1e1c24; --line:#2e2a36; --line2:#26232e;
  --text:#ece8ef; --sub:#a396a4; --faint:#7a6d78;
  --pinksoft:#2c2029; --okbg:#163024; --badbg:#331c1c; --warnbg:#332715;
  --shadow:0 6px 22px rgba(0,0,0,.4); --shadow2:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:46px;
 background-image:radial-gradient(900px 420px at 8% -10%,rgba(255,136,153,.16),transparent),radial-gradient(800px 400px at 100% 0%,rgba(167,108,255,.14),transparent);
 background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}

/* 顶栏 */
header.top{position:sticky;top:0;z-index:60;backdrop-filter:saturate(160%) blur(12px);
 background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:9px;padding:9px 0}
.logo{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;
 display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--shadow2)}
.brand h1{font-size:16px;margin:0;font-weight:800}
.brand .slogan{font-size:11px;color:var(--faint);margin-top:-3px}
.res{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
 padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:var(--shadow2);white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.chip.fire{background:linear-gradient(135deg,#fff1e8,#ffe6ec);border-color:#ffd9c2;color:#c2603a}
[data-theme="dark"] .chip.fire{background:#2a2018;border-color:#3d2f22;color:#ffb489}
.chip.lv{background:var(--pinksoft);border-color:var(--pink2);color:var(--pink)}
nav.tabs{display:flex;gap:8px;padding:9px 8px 11px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;text-align:center;padding:13px 4px;border-radius:15px;font-size:15px;font-weight:800;color:var(--sub);
 background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,136,153,.35)}
section.page{display:none;animation:fade .22s ease}
section.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow2);margin-bottom:11px}
h3.t{font-size:14px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:6px}
h3.t .more{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.muted{color:var(--sub);font-size:13px}
.tiny{font-size:12px;color:var(--faint)}
.between{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:9px;align-items:center}
.grid{display:grid;gap:9px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:13px;
 font-weight:800;font-size:14px;background:var(--card);border:1px solid var(--line);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
.btn:active{transform:none}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,136,153,.32)}
.btn.gold{background:linear-gradient(135deg,#ffcf5c,#f5a623);color:#4a3208;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.pbar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.pbar.gold i{background:linear-gradient(90deg,#ffcf5c,#f5a623)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--sub);font-weight:800}
.tag.pk{background:var(--pinksoft);color:#d4527a}
[data-theme="dark"] .tag.pk{background:#33202a;color:#ff9ab6}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.wa{background:var(--warnbg);color:var(--warn)}.tag.gd{background:#fff6e0;color:#b8801a}
[data-theme="dark"] .tag.gd{background:#33290f;color:#ffc861}

/* 舞台：爱音（人物占满舞台） */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
 background:linear-gradient(160deg,#fff3f6,#f6efff);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow:hidden;min-height:420px}
[data-theme="dark"] .stage{background:linear-gradient(160deg,#241c26,#1f1c2a)}
.sdbox{position:relative;width:min(320px,78vw);height:330px;flex:0 0 auto;cursor:pointer}
.stage .sd{width:100%;height:100%;object-fit:contain;cursor:pointer;transition:.2s;filter:drop-shadow(0 8px 16px rgba(255,136,153,.4))}
.sdbox:active{transform:scale(.97)}
.l2d-stage{position:absolute;left:0;top:0;width:100%;height:100%;display:none;border-radius:14px;overflow:hidden;
 background:radial-gradient(circle at 50% 38%,rgba(255,214,230,.55),rgba(255,255,255,0) 70%)}
[data-theme="dark"] .l2d-stage{background:radial-gradient(circle at 50% 38%,rgba(120,90,110,.5),rgba(0,0,0,0) 70%)}
.l2d-stage.on{display:block}
.l2d-stage canvas{width:100%!important;height:100%!important;display:block}
.l2d-stage .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);text-align:center;padding:8px}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
 font-size:13.5px;font-weight:600;width:100%;max-width:340px;box-shadow:var(--shadow2)}
.bubble:before{content:"";position:absolute;left:50%;top:-7px;margin-left:-6px;width:12px;height:12px;background:var(--card);
 border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.stage-info{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.stage-info div{font-size:12px;color:var(--sub)}
.stage-info b{display:block;font-size:19px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sd{animation:floaty 3.4s ease-in-out infinite}
.qmascot{width:56px;height:56px;object-fit:contain;flex:0 0 auto;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(255,136,153,.35))}

/* 任务 */
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:none}
.task .tx{flex:1;min-width:0}
.task .tx .n{font-weight:800;font-size:13.5px}
.task .tx .d{font-size:12px;color:var(--faint)}

/* 学习卡 */
.flip{perspective:1200px;margin:8px 0}
.flip-in{display:grid;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);
 background:var(--card);padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
 box-shadow:var(--shadow);min-height:210px}
.face.back{transform:rotateY(180deg);justify-content:flex-start;text-align:left;align-items:stretch}
.word{font-size:32px;font-weight:800;word-break:break-word}
.phon{color:var(--sub);font-size:14px;margin-top:2px}
.hint{color:var(--faint);font-size:12px;margin-top:14px}
.def{font-size:15.5px;font-weight:800}
.def span{color:var(--pink);font-weight:700;font-size:13px}
.ex{margin-top:9px;font-size:13.5px;color:var(--sub);border-left:3px solid var(--pink2);padding-left:10px}
.ex i{display:block;font-style:normal;color:var(--faint);font-size:12.5px;margin-top:2px}
.say{width:54px;height:54px;border-radius:50%;background:var(--grad);color:#fff;font-size:22px;
 display:flex;align-items:center;justify-content:center;margin:12px auto 0;box-shadow:0 6px 16px rgba(255,136,153,.35)}
.say:active{transform:scale(.93)}
.score-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}
.sbtn{padding:11px 4px;border-radius:14px;font-weight:800;font-size:13px;border:1px solid var(--line);background:var(--card)}
.sbtn small{display:block;font-weight:600;font-size:10.5px;color:var(--faint);margin-top:2px}
.sbtn.b1{color:var(--bad)}.sbtn.b2{color:var(--warn)}.sbtn.b3{color:var(--blue)}.sbtn.b4{color:var(--ok)}
.sbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.books{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.book{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.book.on{background:var(--pink);color:#fff;border-color:transparent}
.sec-t{font-size:12px;font-weight:800;color:var(--sub);margin:12px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{cursor:pointer}
.chips .chip.on{background:var(--pink);color:#fff;border-color:transparent}

/* 学习模式 + 选项 + 拼写 + 连击 */
.modes{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.mode{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.mode.on{background:var(--ink,#3a2c33);color:#fff;border-color:transparent}
[data-theme="dark"] .mode.on{background:var(--pink)}
.combo-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#ff7a45;
 background:rgba(255,122,69,.12);border:1px solid rgba(255,122,69,.35);border-radius:999px;padding:3px 10px}
.combo-badge.hot{animation:comboPulse .5s ease}
@keyframes comboPulse{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:12px 13px;border-radius:14px;font-size:13.5px;font-weight:700;
 border:1px solid var(--line);background:var(--card);transition:transform .12s,background .12s}
.opt .kbd{flex:0 0 auto}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.opt.ok{background:rgba(46,175,110,.14);border-color:var(--ok)}
.opt.bad{background:rgba(230,70,90,.13);border-color:var(--bad)}
.opt:active{transform:scale(.98)}
.optrow{display:flex;gap:8px;margin-top:12px}
.spelltip{font-size:13px;font-weight:800;margin-top:9px;min-height:20px}
.spelltip.ok{color:var(--ok)}.spelltip.bad{color:var(--bad)}
.recall-btns{display:flex;gap:8px;margin-top:12px}
.batch-tip{font-size:12.5px;color:var(--sub);background:var(--line2);border-radius:12px;padding:9px 12px;margin-top:10px;line-height:1.7}
.drop-toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);z-index:240;opacity:0;
 background:var(--card);border:1px solid var(--pink);border-radius:14px;box-shadow:var(--shadow);padding:10px 16px;
 display:flex;align-items:center;gap:10px;transition:.25s;pointer-events:none;max-width:86vw}
.drop-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.drop-toast img{width:44px;height:58px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.drop-toast .dt-n{font-size:13px;font-weight:800}
.drop-toast .dt-d{font-size:11.5px;color:var(--faint)}
.ach{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.ach:last-child{border-bottom:none}
.ach .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--line2);flex:0 0 auto}
.ach.got .ic{background:var(--grad)}
.ach .tx{flex:1;min-width:0}
.ach .tx .n{font-weight:800;font-size:13.5px}
.ach .tx .d{font-size:12px;color:var(--faint)}
.ach.lock{opacity:.45}

/* 扭蛋 */
.gacha-hero{background:var(--grad);border:none;color:#fff;position:relative;overflow:hidden}
.gacha-hero:after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.13)}
.rate{width:100%;border-collapse:collapse;font-size:12.5px}
.rate th,.rate td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line2)}
.rate td:last-child,.rate th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pity{margin-top:10px}
.pity .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(min-width:620px){.results{grid-template-columns:repeat(6,1fr)}}
.rc{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--line2);aspect-ratio:3/4}
.rc img{width:100%;height:100%;object-fit:cover;display:block}
.rc .st{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font-size:10px;font-weight:800;text-align:center;color:#fff;background:rgba(0,0,0,.5)}
.rc.r5{border-color:#f5a623;box-shadow:0 0 0 2px rgba(245,166,35,.35)}
.rc.r4{border-color:#a76cff}
.rc.new:before{content:"NEW";position:absolute;top:3px;right:3px;background:#e0524d;color:#fff;font-size:9px;font-weight:800;
 padding:1px 5px;border-radius:6px;z-index:2}
/* 卡背（无图时的程序化卡面） */
.cback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
 font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.4);padding:6px;text-align:center}
.cback .s{font-size:13px;letter-spacing:2px}
.cback .n{font-size:9.5px;opacity:.95;margin-top:2px;line-height:1.2}

/* 演出层 */
.show{position:fixed;inset:0;z-index:250;background:#0b0710;display:none}
.show.on{display:block}
.show canvas{width:100%;height:100%;display:block}
.show .skip{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);
 padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:800}
.show .five{position:absolute;left:0;right:0;top:38%;text-align:center;color:#ffd76a;font-weight:900;font-size:34px;
 text-shadow:0 0 24px rgba(255,200,80,.8);opacity:0;transition:opacity .2s;pointer-events:none}
.show .five.on{opacity:1;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

/* 图鉴 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:620px){.dex{grid-template-columns:repeat(6,1fr)}}
.vol{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);padding:6px;text-align:center}
.vol .av{width:100%;aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.vol .nm{font-size:10.5px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol .pg{font-size:10px;color:var(--faint)}
.vol.oshi{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,136,153,.28)}
.vol .badge{position:absolute;top:3px;right:3px;font-size:9px;background:var(--pink);color:#fff;border-radius:5px;padding:0 4px;font-weight:800}
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
@media(min-width:620px){.cards-grid{grid-template-columns:repeat(6,1fr)}}
.mini{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:3/4;background:var(--line2);border:1px solid var(--line)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini.lock{opacity:.32;filter:grayscale(1)}
.mini .s{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;color:#fff;background:rgba(0,0,0,.45);font-weight:800}

/* 道具 / 商城 */
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:none}
.item .w{font-weight:800;font-size:13.5px}
.item .c{font-size:12px;color:var(--faint)}
.item .r{margin-left:auto;display:flex;gap:6px;align-items:center}

.modal-mask{position:fixed;inset:0;background:rgba(20,14,20,.52);backdrop-filter:blur(3px);z-index:260;display:none;
 align-items:center;justify-content:center;padding:16px}
.modal-mask.on{display:flex}
.modal{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);
 max-height:86vh;overflow:auto;animation:pop2 .22s ease}
@keyframes pop2{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 11px;font-size:17px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:300;
 background:rgba(43,36,48,.95);color:#fff;padding:9px 17px;border-radius:99px;font-size:13px;font-weight:800;
 opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{font-size:11px;background:var(--line2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--sub);font-weight:800}
select,input[type=text],input[type=number]{width:100%;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
select:focus,input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,136,153,.15)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.foot{text-align:center;color:var(--faint);font-size:11.5px;padding:16px 0 4px}
.foot b{color:var(--pink)}
.empty{text-align:center;padding:26px 12px;color:var(--faint);font-size:13px}
.empty .em{font-size:36px;display:block;margin-bottom:6px;opacity:.7}
.subtabs{display:flex;gap:6px;margin-bottom:10px}
.stab{flex:1;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s}
.stab.on{background:var(--grad);color:#fff;border-color:transparent}
.fab{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:6px;border:none;cursor:pointer;
 background:var(--grad);color:#fff;font-size:15px;font-weight:800;padding:12px 16px;border-radius:30px;box-shadow:0 8px 22px rgba(212,82,122,.45)}
.fab span{font-size:13px}
.fab:active{transform:scale(.95)}
.dict-res{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:54vh;overflow:auto}
.dict-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.12s}
.dict-row:hover{background:var(--card)}

</style><body><header class="top"><div class="wrap"><div class="topbar"><div class="logo">音</div><div class="brand"><h1>爱音单词 Web</h1><div class="slogan">背单词攒星石 · 和爱音一起打卡</div></div><div class="res"><span class="chip fire">🔥 0</span><span class="chip lv">Lv.1</span><span class="chip" id="stars">⭐ 120</span><span class="chip">❄ 3</span></div></div></div></header><main class="wrap"><p class="tiny">示例体验，数据仅保留在本页 <button id="reset" class="btn sm">恢复示例</button></p><div class="card" id="plan"><h3 class="t">📋 制定学习计划 <span class="more">先选好再开背</span></h3><div class="sec-t">① 选词书</div><div class="books" id="books"></div><div class="sec-t">② 本轮新词数</div><div class="chips" id="counts"></div><div class="sec-t">③ 题型倾向</div><div class="modes" id="modes"></div><div class="sec-t">④ 配比</div><div class="chips" id="mix"></div><button class="btn pri block" id="start" style="margin-top:16px">▶ 开始学习</button><div class="tiny" style="margin-top:8px">完整词库、Live2D 舞台和服饰需安装后体验。</div></div><div id="study" class="card" hidden><h3 class="t">📚 学习</h3><p class="tiny" id="progress"></p><div style="text-align:center;padding:28px"><h1 id="word"></h1><p id="meaning" hidden></p><button class="btn" id="reveal">显示释义</button></div><div class="row"><button class="btn" id="again">不认识</button><button class="btn pri" id="next">认识了</button></div><button class="btn" id="back" style="margin-top:15px">返回计划</button></div></main><script>
const words=[['abandon','放弃'],['ability','能力'],['able','能够的']];let i=0,stars=120,book='大学英语四级';const $=s=>document.querySelector(s);function chips(sel,items,cls){$(sel).innerHTML='';items.forEach((x,n)=>{let b=document.createElement('button');b.className=cls+(n?'':' on');b.textContent=x;b.onclick=()=>{for(const c of $(sel).children)c.classList.remove('on');b.classList.add('on');if(sel==='#books')book=x};$(sel).append(b)})}function render(){ $('#stars').textContent='⭐ '+stars;$('#word').textContent=words[i%words.length][0];$('#meaning').textContent=words[i%words.length][1];$('#meaning').hidden=true;$('#reveal').hidden=false;$('#progress').textContent=book+' · '+(i+1)+' / 3'}function reset(){i=0;stars=120;chips('#books',['大学英语四级','大学英语六级','考研英语','JLPT N5'],'book');chips('#counts',['20','50','100','200'],'chip');chips('#modes',['自动','回忆卡','四选一','拼写','听音选义'],'mode');chips('#mix',['自动','纯新词','纯复习'],'chip');$('#plan').hidden=false;$('#study').hidden=true;render()}$('#start').onclick=()=>{$('#plan').hidden=true;$('#study').hidden=false;render()};$('#reveal').onclick=()=>{$('#meaning').hidden=false;$('#reveal').hidden=true};$('#next').onclick=()=>{i++;stars++;render()};$('#again').onclick=()=>{i++;render()};$('#back').onclick=()=>{$('#study').hidden=true;$('#plan').hidden=false};$('#reset').onclick=reset;reset();</script></body></html>
