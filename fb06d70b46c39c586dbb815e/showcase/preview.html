<!doctype html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · AI自动玩</title>
<style>
  :root{
    --bg: #12131a;
    --panel: #1c1e29;
    --grid-bg: #262a3b;
    --cell-empty: #2f3346;
    --ink: #eef0fb;
    --sub: #9096b5;
    --accent: #6fe3c4;
    --accent2: #ff7a8a;
    --gold: #ffd27a;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2030 0%, var(--bg) 55%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100%;
  }
  .stage{
    width: min(94vw, 480px);
    padding: 22px 20px 28px;
  }
  .title-row{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 18px;
  }
  h1{
    font-size: 40px;
    margin:0;
    letter-spacing: -1px;
    font-weight: 800;
    background: linear-gradient(120deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 span.small{
    display:block;
    font-size: 12px;
    letter-spacing: 4px;
    font-weight: 600;
    color: var(--sub);
    -webkit-text-fill-color: var(--sub);
    margin-bottom: 4px;
  }
  .scores{ display:flex; gap: 8px; }
  .score-box{
    background: var(--panel);
    border-radius: 10px;
    padding: 6px 14px;
    text-align:center;
    min-width: 66px;
    border: 1px solid #2c3044;
  }
  .score-box .label{
    font-size: 10px; letter-spacing: 2px;
    color: var(--sub); text-transform: uppercase;
  }
  .score-box .value{
    font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .controls-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .hint{ font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  button.newgame{
    background: var(--accent); color: #0c1013;
    border: none; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: transform .12s ease, filter .12s ease;
  }
  button.newgame:hover{ filter: brightness(1.08); }
  button.newgame:active{ transform: scale(0.96); }
  .btn-row{ display:flex; gap: 8px; }
  button.ai-btn{
    background: var(--accent2); color: #ffffff;
    border: none; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: transform .12s ease, filter .12s ease;
  }
  button.ai-btn:hover{ filter: brightness(1.08); }
  button.ai-btn:active{ transform: scale(0.96); }
  button.ai-btn.running{ background: var(--gold); color: #0c1013; }
  .ai-speed{ display:flex; align-items:center; gap: 6px; margin-top: 8px; }
  .ai-speed label{ font-size: 12px; color: var(--sub); }
  .ai-speed select{
    background: var(--panel); color: var(--ink);
    border: 1px solid #2c3044; border-radius: 6px;
    padding: 4px 8px; font-size: 12px;
  }
  .board-wrap{ position: relative; }
  .board{
    position: relative; background: var(--grid-bg);
    border-radius: 16px; padding: 10px;
    display:grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 10px;
    aspect-ratio: 1 / 1; touch-action: none; user-select: none;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.35);
  }
  .cell-bg{ background: var(--cell-empty); border-radius: 10px; }
  .tiles-layer{
    position:absolute; inset: 10px;
    display:grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 10px; pointer-events:none;
  }
  .tile{
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius: 10px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: left .11s ease, top .11s ease, transform .11s ease;
    will-change: left, top, transform;
  }
  @keyframes pop{
    0%{ transform: scale(0.5); opacity: .4; }
    100%{ transform: scale(1); opacity: 1; }
  }
  @keyframes merge-pulse{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.14); }
    100%{ transform: scale(1); }
  }
  .overlay{
    position:absolute; inset:0;
    background: rgba(18,19,26,0.82);
    border-radius: 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px; opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:all; }
  .overlay h2{ margin:0; font-size: 26px; font-weight:800; }
  .overlay button{
    background: var(--accent); border:none; border-radius:10px;
    padding: 10px 20px; font-weight:700; cursor:pointer; color:#0c1013;
  }
  footer{
    margin-top: 16px; text-align:center;
    font-size: 11.5px; color: var(--sub);
  }
</style>
</head>
<body>
<div style="position:fixed;top:0;right:0;z-index:10;background:#1c1e29;padding:8px">示例体验 <button id="restoreSample">恢复示例</button></div>
<div class="stage">
  <div class="title-row">
    <h1><span class="small">MERGE THE NUMBERS</span>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">分数</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最佳</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>
  <div class="controls-row">
    <div class="hint">方向键 / WASD 或滑动屏幕<br>合并相同数字，凑出 2048</div>
    <div class="btn-row">
      <button class="ai-btn" id="aiBtn">AI 自动玩</button>
      <button class="newgame" id="newgame">重新开始</button>
    </div>
  </div>
  <div class="ai-speed">
    <label>AI 速度：</label>
    <select id="aiSpeed">
      <option value="50">极速</option>
      <option value="150" selected="">正常</option>
      <option value="400">慢速</option>
    </select>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayText">游戏结束</h2>
      <button id="overlayBtn">再来一局</button>
    </div>
  </div>
  <footer>提示：即使无法移动也不要放弃，尝试换个方向 ✦</footer>
</div>
<script>
(function(){
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const tilesLayer = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const newgameBtn = document.getElementById('newgame');
  const aiBtn = document.getElementById('aiBtn');
  const aiSpeedSelect = document.getElementById('aiSpeed');
  const TILE_STYLES = {
    2:{bg:'#2f3346',fg:'#eef0fb'}, 4:{bg:'#39405c',fg:'#eef0fb'},
    8:{bg:'#3a6f7a',fg:'#fff'}, 16:{bg:'#2f9c8f',fg:'#fff'},
    32:{bg:'#38b28f',fg:'#fff'}, 64:{bg:'#6fe3c4',fg:'#0c1013'},
    128:{bg:'#f2c14e',fg:'#0c1013'}, 256:{bg:'#ffd27a',fg:'#0c1013'},
    512:{bg:'#ff9f6e',fg:'#0c1013'}, 1024:{bg:'#ff7a8a',fg:'#fff'},
    2048:{bg:'#c46bff',fg:'#fff'}
  };
  function styleFor(v){ return TILE_STYLES[v]||{bg:'#7a4bff',fg:'#fff'}; }
  let grid,score,best,tileIdSeed,won,over;
  let aiRunning=false, aiTimer=null;
  function loadBest(){ return 0; }
  function saveBest(v){}
  for(let i=0;i<SIZE*SIZE;i++){
    const c=document.createElement('div');c.className='cell-bg';boardEl.appendChild(c);
  }
  function emptyGrid(){
    const g=[];for(let r=0;r<SIZE;r++) g.push(new Array(SIZE).fill(null));return g;
  }
  function newTile(r,c,value){
    tileIdSeed++;return{id:tileIdSeed,r,c,value,merged:false,isNew:true};
  }
  function randomEmptyCell(){
    const empties=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])empties.push([r,c]);
    return empties.length===0?null:empties[Math.floor(Math.random()*empties.length)];
  }
  function spawnTile(){
    const pos=randomEmptyCell();if(!pos)return;
    const value=Math.random()<0.9?2:4;
    grid[pos[0]][pos[1]]=newTile(pos[0],pos[1],value);
  }
  function resetGame(){
    grid=emptyGrid();score=0;tileIdSeed=0;won=false;over=false;
    overlay.classList.remove('show');spawnTile();spawnTile();updateScore();render(true);
  }
  function updateScore(){
    scoreEl.textContent=score;
    if(score>best){best=score;saveBest(best);}
    bestEl.textContent=best;
  }
  function cellMetrics(){
    const rect=boardEl.getBoundingClientRect();
    const pad=10,gap=10,size=(rect.width-pad*2-gap*3)/4;
    return{size,gap,pad};
  }
  function render(fresh){
    tilesLayer.innerHTML='';
    const{size,gap}=cellMetrics();
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      const t=grid[r][c];if(!t)continue;
      const el=document.createElement('div');el.className='tile';
      const st=styleFor(t.value);
      el.style.background=st.bg;el.style.color=st.fg;
      el.style.width=size+'px';el.style.height=size+'px';
      el.style.left=(c*(size+gap))+'px';el.style.top=(r*(size+gap))+'px';
      el.style.fontSize=(t.value>=1024?size*0.32:size*0.4)+'px';
      el.textContent=t.value;
      if(t.isNew)el.style.animation='pop .18s ease';
      if(t.merged)el.style.animation='merge-pulse .18s ease';
      tilesLayer.appendChild(el);
    }
  }
  function cloneGridValues(){
    return grid.map(row=>row.map(t=>t?t.value:null));
  }
  function slideLine(cells){
    const filtered=cells.filter(Boolean);const result=[];let gained=0;
    for(let i=0;i<filtered.length;i++){
      const cur=filtered[i];cur.isNew=false;cur.merged=false;
      if(i<filtered.length-1&&filtered[i+1].value===cur.value){
        const mergedTile={id:cur.id,r:0,c:0,value:cur.value*2,merged:true,isNew:false};
        gained+=mergedTile.value;result.push(mergedTile);i++;
      }else{result.push(cur);}
    }
    while(result.length<SIZE)result.push(null);
    return{result,gained};
  }
  function getLine(dir,index){
    const arr=[];
    for(let k=0;k<SIZE;k++){
      let r,c;
      if(dir==='left'){r=index;c=k;}else if(dir==='right'){r=index;c=SIZE-1-k;}
      else if(dir==='up'){r=k;c=index;}else{r=SIZE-1-k;c=index;}
      arr.push(grid[r][c]);
    }
    return arr;
  }
  function setLine(dir,index,values){
    for(let k=0;k<SIZE;k++){
      let r,c;
      if(dir==='left'){r=index;c=k;}else if(dir==='right'){r=index;c=SIZE-1-k;}
      else if(dir==='up'){r=k;c=index;}else{r=SIZE-1-k;c=index;}
      const t=values[k];if(t){t.r=r;t.c=c;}grid[r][c]=t;
    }
  }
  function move(dir){
    if(over)return;
    const before=JSON.stringify(cloneGridValues());
    let totalGain=0;
    for(let index=0;index<SIZE;index++){
      const line=getLine(dir,index);
      const{result,gained}=slideLine(line);
      totalGain+=gained;setLine(dir,index,result);
    }
    const after=JSON.stringify(cloneGridValues());
    if(before!==after){
      score+=totalGain;updateScore();spawnTile();render(false);
      checkWin();if(!overlay.classList.contains('show'))checkGameOver();
    }
  }
  function checkWin(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)
      if(grid[r][c]&&grid[r][c].value===2048&&!won){won=true;showOverlay('🎉 你赢了！',true);}
  }
  function hasMoves(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(!grid[r][c])return true;
      const v=grid[r][c].value;
      if(c<SIZE-1&&grid[r][c+1]&&grid[r][c+1].value===v)return true;
      if(r<SIZE-1&&grid[r+1][c]&&grid[r+1][c].value===v)return true;
    }
    return false;
  }
  function checkGameOver(){
    if(!hasMoves()){over=true;showOverlay('游戏结束',false);stopAI();}
  }
  function showOverlay(text,isWin){
    overlayText.textContent=text;
    overlayBtn.textContent=isWin?'继续游戏':'再来一局';
    overlay.classList.add('show');
    overlayBtn.onclick=()=>{overlay.classList.remove('show');if(!isWin)resetGame();else checkGameOver();};
  }
  const KEY_MAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
    a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
  window.addEventListener('keydown',(e)=>{
    const dir=KEY_MAP[e.key];if(dir){e.preventDefault();move(dir);}
  });
  let touchStartX=0,touchStartY=0;
  boardEl.addEventListener('touchstart',(e)=>{
    const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;
  },{passive:true});
  boardEl.addEventListener('touchend',(e)=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
    const absX=Math.abs(dx),absY=Math.abs(dy);
    if(Math.max(absX,absY)<24)return;
    if(absX>absY)move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
  newgameBtn.addEventListener('click',resetGame);
  window.addEventListener('resize',()=>render(false));
  best=loadBest();resetGame();

  /* ===== AI v2: Expectimax + 转置表 + 迭代加深 ===== */
  const AI_DIRS=['left','right','up','down'];
  const MOVE_TIME_LIMIT = 200; // ms per move（转置表key修复后缓存命中率大幅提升，可以承受更长预算）

  // 自适应搜索深度：空格越少（局面越关键/分支越少）搜得越深，
  // 空格越多（局面越安全/分支越大）搜得浅一些，把时间花在刀刃上
  function getSearchDepth(g){
    let empty=0;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!g[r][c]) empty++;
    if(empty<=2) return 7;
    if(empty<=4) return 6;
    if(empty<=6) return 5;
    return 4;
  }

  // 把grid编码为一个64位数（每格4bit，0=空，否则log2(value)）
  function aiGridKey(){
    let key = 0;
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const v = grid[r][c] ? Math.log2(grid[r][c].value) : 0;
      key = (key << 4) | v;
    }
    return key;
  }
  function aiSimKey(g){
    // 用字符串拼接代替位移，避免16格*4bit=64位超出JS位运算32位上限导致的哈希碰撞
    let key = '';
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const v = g[r][c] ? Math.log2(g[r][c].value) : 0;
      key += v.toString(36);
    }
    return key;
  }

  // 独立的快速模拟网格操作（不修改真实grid）
  function aiSimSlideLine(cells){
    const filtered=cells.filter(Boolean);const result=[];let gained=0;
    for(let i=0;i<filtered.length;i++){
      const cur={value:filtered[i].value};
      if(i<filtered.length-1&&filtered[i+1].value===cur.value){
        gained+=cur.value*2;result.push({value:cur.value*2});i++;
      }else{result.push(cur);}
    }
    while(result.length<SIZE)result.push(null);
    return{result,gained};
  }
  function aiSimGetLine(g,dir,index){
    const arr=[];
    for(let k=0;k<SIZE;k++){
      let r,c;
      if(dir==='left'){r=index;c=k;}else if(dir==='right'){r=index;c=SIZE-1-k;}
      else if(dir==='up'){r=k;c=index;}else{r=SIZE-1-k;c=index;}
      arr.push(g[r][c]);
    }
    return arr;
  }
  function aiSimSetLine(g,dir,index,values){
    for(let k=0;k<SIZE;k++){
      let r,c;
      if(dir==='left'){r=index;c=k;}else if(dir==='right'){r=index;c=SIZE-1-k;}
      else if(dir==='up'){r=k;c=index;}else{r=SIZE-1-k;c=index;}
      g[r][c]=values[k];
    }
  }
  function aiSimMove(g,dir){
    const before=JSON.stringify(g.map(r=>r.map(t=>t?t.value:null)));
    for(let index=0;index<SIZE;index++){
      const line=aiSimGetLine(g,dir,index);
      const{result}=aiSimSlideLine(line);
      aiSimSetLine(g,dir,index,result);
    }
    const after=JSON.stringify(g.map(r=>r.map(t=>t?t.value:null)));
    return before!==after;
  }
  function aiCloneGrid(){
    return grid.map(row=>row.map(t=>t?{value:t.value}:null));
  }

  // 预计算权重表（蛇形模式，角落最大）
  const WEIGHT_MATRIX = [
    [Math.pow(2,15), Math.pow(2,14), Math.pow(2,13), Math.pow(2,12)],
    [Math.pow(2, 8), Math.pow(2, 9), Math.pow(2,10), Math.pow(2,11)],
    [Math.pow(2, 7), Math.pow(2, 6), Math.pow(2, 5), Math.pow(2, 4)],
    [Math.pow(2, 0), Math.pow(2, 1), Math.pow(2, 2), Math.pow(2, 3)]
  ];

  // 启发式评估（优化版）
  function aiEvaluate(g){
    let emptyCount=0, maxVal=0;
    let weightedSum=0;
    let mergeScore=0;
    let monoH=0, monoV=0;
    let smoothness=0;

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cell=g[r][c];
        if(!cell){emptyCount++;continue;}
        const v=cell.value;
        const lv=Math.log2(v);
        if(v>maxVal)maxVal=v;
        // 蛇形权重加成
        weightedSum+=v*WEIGHT_MATRIX[r][c];
        // 合并潜力：相邻相同值
        if(c<SIZE-1&&g[r][c+1]&&g[r][c+1].value===v) mergeScore+=v*2;
        if(r<SIZE-1&&g[r+1][c]&&g[r+1][c].value===v) mergeScore+=v*2;
      }
    }

    // 行单调性：需与蛇形权重矩阵方向一致（第0/2行左到右递减，第1/3行左到右递增）
    // 否则该项评分会和权重矩阵互相矛盾，抵消AI摆出蛇形链的动力
    for(let r=0;r<SIZE;r++){
      const wantIncreasing = (r % 2 === 1);
      for(let c=0;c<SIZE-1;c++){
        const a=g[r][c]?Math.log2(g[r][c].value):0;
        const b=g[r][c+1]?Math.log2(g[r][c+1].value):0;
        if(wantIncreasing){
          if(b>=a) monoH+=(b-a)*2; else monoH-=(a-b)*3;
        } else {
          if(a>=b) monoH+=(a-b)*2; else monoH-=(b-a)*3;
        }
      }
    }
    // 列单调性（上到下递减）
    for(let c=0;c<SIZE;c++){
      for(let r=0;r<SIZE-1;r++){
        const a=g[r][c]?Math.log2(g[r][c].value):0;
        const b=g[r+1][c]?Math.log2(g[r+1][c].value):0;
        if(a>b) monoV+=(a-b)*2; else monoV-=(b-a)*3;
      }
    }

    // 平滑性
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(!g[r][c])continue;
        const lv=Math.log2(g[r][c].value);
        if(c<SIZE-1&&g[r][c+1])smoothness-=Math.abs(lv-Math.log2(g[r][c+1].value));
        if(r<SIZE-1&&g[r+1][c])smoothness-=Math.abs(lv-Math.log2(g[r+1][c].value));
      }
    }

    // 空格惩罚（空格越少越危险）
    const emptyPenalty = emptyCount < 2 ? -2000 : 0;

    // 综合评分
    return weightedSum * 0.1
         + emptyCount * 270
         + monoH * 30
         + monoV * 30
         + smoothness * 15
         + mergeScore * 50
         + emptyPenalty;
  }

  // Expectimax 核心（带转置表和时间限制）
  const transTable = new Map();
  let aiStartTime = 0;
  let aiTimeUp = false;

  function expectimax(g, depth, isPlayerNode){
    // 时间检查
    if(Date.now() - aiStartTime > MOVE_TIME_LIMIT) { aiTimeUp = true; return aiEvaluate(g); }

    if(depth === 0) return aiEvaluate(g);

    // 转置表查找
    const key = aiSimKey(g);
    const cacheKey = key + '|' + depth + '|' + (isPlayerNode?1:0);
    const cached = transTable.get(cacheKey);
    if(cached !== undefined) return cached;

    let result;

    if(isPlayerNode){
      // 玩家节点：选择最佳方向
      let bestScore = -Infinity;
      let moved = false;
      for(const dir of AI_DIRS){
        const ng = g.map(r=>r.map(t=>t?{value:t.value}:null));
        const ok = aiSimMove(ng, dir);
        if(!ok) continue;
        moved = true;
        const score = expectimax(ng, depth - 1, false);
        if(score > bestScore) bestScore = score;
        if(aiTimeUp) break;
      }
      result = moved ? bestScore : -Infinity;
    } else {
      // 机会节点：在每个空位放置2或4，取期望值
      const empties = [];
      for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!g[r][c])empties.push([r,c]);

      if(empties.length === 0) {
        result = aiEvaluate(g);
      } else {
        let totalScore = 0;
        // 只采样部分空位以控制时间
        const maxSamples = depth >= 3 ? 3 : empties.length;
        const step = Math.max(1, Math.floor(empties.length / maxSamples));

        for(let i=0; i<empties.length && !aiTimeUp; i+=step){
          const[er,ec]=empties[i];
          // 90%概率放2
          const g2=g.map(r=>r.map(t=>t?{value:t.value}:null));
          g2[er][ec]={value:2};
          const s2=expectimax(g2,depth-1,true);
          // 10%概率放4
          const g4=g.map(r=>r.map(t=>t?{value:t.value}:null));
          g4[er][ec]={value:4};
          const s4=expectimax(g4,depth-1,true);
          totalScore += 0.9*s2 + 0.1*s4;
        }
        result = totalScore / Math.ceil(empties.length / step);
      }
    }

    if(!aiTimeUp) transTable.set(cacheKey, result);
    return result;
  }

  function aiChooseBestMove(){
    let bestDir = null;
    let bestScore = -Infinity;

    aiStartTime = Date.now();
    aiTimeUp = false;
    transTable.clear();

    const depth = getSearchDepth(grid);

    // 先做快速评估排序，优先尝试更有前途的方向
    const dirScores = [];
    for(const dir of AI_DIRS){
      const ng = aiCloneGrid();
      const ok = aiSimMove(ng, dir);
      if(!ok) continue;
      dirScores.push({dir, quick: aiEvaluate(ng)});
    }
    dirScores.sort((a,b) => b.quick - a.quick);

    // 从最有前途的方向开始Expectimax搜索
    for(const {dir} of dirScores){
      const ng = aiCloneGrid();
      aiSimMove(ng, dir);
      const score = expectimax(ng, depth - 1, false);
      if(score > bestScore){
        bestScore = score;
        bestDir = dir;
      }
      if(aiTimeUp) break;
    }

    return bestDir;
  }

  function aiStep(){
    if(!aiRunning)return;if(over){stopAI();return;}
    const dir=aiChooseBestMove();
    if(dir)move(dir);else{stopAI();return;}
    if(aiRunning){const speed=parseInt(aiSpeedSelect.value)||150;aiTimer=setTimeout(aiStep,speed);}
  }
  function startAI(){
    if(aiRunning)return;aiRunning=true;
    aiBtn.textContent='⏸ 停止 AI';aiBtn.classList.add('running');
    overlay.classList.remove('show');if(over)resetGame();aiStep();
  }
  function stopAI(){
    aiRunning=false;if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}
    aiBtn.textContent='AI 自动玩';aiBtn.classList.remove('running');
  }
  aiBtn.addEventListener('click',()=>{if(aiRunning)stopAI();else startAI();});
  document.getElementById('restoreSample').addEventListener('click',()=>{stopAI();best=0;aiSpeedSelect.value='150';resetGame();});
})();
</script>
