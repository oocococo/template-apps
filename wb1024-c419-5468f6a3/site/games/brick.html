<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打砖块 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .bk-tools { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bk-lv {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  }
  .bk-lv i {
    display: inline-block; min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 7px; background: var(--brand-soft); color: var(--brand);
    font-style: normal; font-size: 12.5px; font-weight: 800;
    line-height: 22px; text-align: center;
  }
  .bk-wrap { width: 100%; display: flex; justify-content: center; }
  .bk-wrap canvas {
    display: block;
    border-radius: 14px;
    box-shadow: var(--shadow);
    cursor: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (max-width: 520px) {
    .bk-tools { gap: 6px; }
  }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">打砖块<small>八关闯关 · 鼠标或方向键移动挡板</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">分数</span><span class="val" id="score">0</span></div>
    <div class="score-box"><span class="lb">生命</span><span class="val" id="lives">♥♥♥</span></div>
    <div class="score-box accent"><span class="lb">最高分</span><span class="val" id="best">0</span></div>
  </div>

  <div class="bk-tools">
    <span class="bk-lv">第 <i id="lv">1</i> 关</span>
    <button class="btn btn-primary" id="newBtn">重新开始</button>
  </div>

  <div class="bk-wrap">
    <canvas id="board"></canvas>
  </div>
</main>

<div class="g-hint">
  移动鼠标控制挡板 · <b>点击</b>或<b>空格</b>发球 · <b>← →</b> 也能移动 · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">游戏结束</h3>
    <div class="big" id="ovScore">0 分</div>
    <p id="ovSub">再来一局？</p>
    <div class="overlay-actions">
      <button class="btn" id="ovRetry">重试本关</button>
      <button class="btn btn-primary" id="ovNew">重新开始</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/brick.js"></script>
</body>
</html>
