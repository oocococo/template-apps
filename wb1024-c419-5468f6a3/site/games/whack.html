<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打地鼠 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wk-timer-wrap { width: 100%; max-width: 470px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .wk-timer { flex: 1; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .wk-timer i { display: block; height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #2fbf8f, #5b6ef5); transition: width .12s linear; }
  .wk-timer.low i { background: linear-gradient(90deg, #ff9f43, #f2545b); }
  .wk-sec { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; min-width: 42px; text-align: right; color: var(--ink-2); }
  .combo-tag {
    position: absolute; top: 12px; right: 14px; z-index: 6;
    padding: 5px 12px; border-radius: 999px;
    background: linear-gradient(135deg, #ffb340, #ff7043);
    color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .4px;
    opacity: 0; transform: translateY(-6px) scale(.9);
    transition: opacity .2s, transform .2s cubic-bezier(.3,1.5,.5,1);
  }
  .combo-tag.on { opacity: 1; transform: translateY(0) scale(1); }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">打地鼠<small>30 秒,能敲中多少只</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">得分</span><span class="val" id="score">0</span></div>
    <div class="score-box accent"><span class="lb">最高分</span><span class="val" id="best">0</span></div>
  </div>

  <div class="wk-timer-wrap">
    <div class="wk-timer" id="timerBar"><i></i></div>
    <span class="wk-sec" id="sec">30s</span>
  </div>

  <div class="whack-stage" id="stage">
    <span class="combo-tag" id="comboTag"></span>
  </div>
</main>

<div class="g-hint">
  鼠标点或手指戳钻出洞口的地鼠 · 连续命中会有连击加成 · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay on" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">准备好了吗</h3>
    <div class="big" id="ovScore">30</div>
    <p id="ovSub">三十秒，手速见真章。点击开始。</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" id="ovStart">开始</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/whack.js"></script>
</body>
</html>
