入的法规全文汇总导出为一份全文册，含每部法规的来源标注、导入时间与逐条解析结构，便于团队内部流转与归档。平台不内嵌法规原文，权威文本以发布机关公布版本为准。"}]},window.MDR_CN=[{id:"cn-739",title:"医疗器械监督管理条例（2025年修订版）",titleEn:"Regulations on the Supervision and Administration of Medical Devices (2025 Revision)",region:"CN",level:"行政法规",type:"条例",docNo:"国务院令第739号公布 · 国令第797号第二次修订",issuer:"国务院",issueDate:"2024-12-06",effectiveDate:"2025-01-20",status:"现行有效",priority:"core",tags:["注册","备案","生产","经营","使用","上市后","监管"],summary:"中国医疗器械监管的根本大法（行政法规层级），确立分类管理、注册与备案、生产与经营许可、不良事件监测与召回等全生命周期制度框架。现行版本为 2024 年 12 月 6 日《国务院关于修改和废止部分行政法规的决定》（国令第 797 号）第二次修订、自 2025 年 1 月 20 日起施行的版本。",articles:[{no:"第二条",label:"适用范围",text:"在中华人民共和国境内从事医疗器械的研制、生产、经营、使用活动及其监督管理，适用本条例。"},{no:"第三条",label:"分类管理",text:"国家对医疗器械按照风险程度实行分类管理：第一类风险程度低，第二类具有中度风险，第三类具有较高风险，需要采取特别措施严格控制管理。"},{no:"第六条",label:"注册与备案",text:"第一类医疗器械实行产品备案管理；第二类、第三类医疗器械实行产品注册管理。医疗器械注册人、备案人应当对医疗器械全生命周期安全有效负责。"},{no:"第二十条",label:"注册审评程序",text:"受理注册申请后，技术审评机构应当在规定时限内完成技术审评；对符合安全有效要求的，作出准予注册决定并发给医疗器械注册证，有效期5年。"},{no:"第三十条",label:"生产许可",text:"从事第二类、第三类医疗器械生产，应当经省级（第二类）或国务院药品监督管理部门（第三类）批准，取得医疗器械生产许可证。"},{no:"第四十二条",label:"经营许可与备案",text:"从事第三类医疗器械经营实行许可管理；从事第二类医疗器械经营实行备案管理。医疗器械经营企业应当建立并执行进货查验记录和销售记录制度。"},{no:"第六十二条",label:"不良事件与召回",text:"医疗器械注册人、备案人应当建立不良事件监测和再评价制度；发现医疗器械存在缺陷的，应当立即停止生产、销售、进口，通知相关单位并召回。"},{no:"第七十条",label:"法律责任",text:"对无证生产经营、生产销售不符合标准产品、未履行召回义务等违法行为，规定没收、罚款、责令停产停业、吊销许可证及行业禁入等处罚。"},{no:"2024修订",label:"第二次修订要点",text:"根据国令第797号第二次修订：将部门称谓统一为药品监督管理部门；第十九条第二款主管部门增加国务院疾病预防控制部门；删去第一百零三条中的计划生育技术服务机构表述。自2025年1月20日起施行。"}],related:["cn-47","cn-53","cn-54","cn-15"],officialUrl:"https://www.gov.cn/zhengce/content/2021-03/18/content_5593739.htm",source:"中国政府网 / 国家药品监督管理局",lastVerified:"2026-09-17"},{id:"cn-api",title:"中华人民共和国产品质量法",titleEn:"Product Quality Law of the People's Republic of China",region:"CN",level:"法律",type:"法律",docNo:"主席令第22号（2018年修正）",issuer:"全国人民代表大会常务委员会",issueDate:"1993-02-22",effectiveDate:"2018-12-29",status:"现行有效",priority:"normal",tags:["产品质量","责任","监督"],summary:"确立生产者、销售者的产品质量责任与义务，是医疗器械产品质量责任的上位法依据之一。",articles:[{no:"第二十六条",label:"生产者责任",text:"生产者应当对其生产的产品质量负责，产品质量应当符合不存在危及人身、财产安全的不合理危险等要求。"},{no:"第二十七条",label:"标识要求",text:"产品或者其包装上的标识必须真实，并有产品质量检验合格证明、中文名称、厂名厂址、生产日期等信息。"},{no:"第四十三条",label:"缺陷赔偿",text:"因产品存在缺陷造成人身、他人财产损害的，受害人可以向生产者要求赔偿，也可以向销售者要求赔偿。"}],related:["cn-739"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/",source:"全国人大 / 国家药品监督管理局法规文件库",lastVerified:"2026-09-17"},{id:"cn-std-law",title:"中华人民共和国标准化法",titleEn:"Standardization Law of the People's Republic of China",region:"CN",level:"法律",type:"法律",docNo:"主席令第78号（2017年修订）",issuer:"全国人民代表大会常务委员会",issueDate:"1988-12-29",effectiveDate:"2018-01-01",status:"已修订",priority:"normal",tags:["标准","强制性标准","推荐性标准"],summary:"确立国家标准、行业标准、地方标准、团体标准、企业标准五级体系，明确强制性标准必须执行的法定效力。",articles:[{no:"第十条",label:"标准体系",text:"对保障人身健康和生命财产安全、国家安全、生态环境安全的技术要求，应当制定强制性国家标准。"},{no:"第二十五条",label:"强制效力",text:"不符合强制性标准的产品、服务，不得生产、销售、进口或者提供。"}],related:["cn-33"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/",source:"全国人大 / 国家药品监督管理局法规文件库",lastVerified:"2026-09-17"},{id:"cn-ad-law",title:"中华人民共和国广告法（医疗器械相关条款）",titleEn:"Advertising Law of the People's Republic of China",region:"CN",level:"法律",type:"法律",docNo:"主席令第22号（2021年修正）",issuer:"全国人民代表大会常务委员会",issueDate:"1994-10-27",effectiveDate:"2021-04-29",status:"现行有效",priority:"key",tags:["广告","宣传","合规"],summary:"规定医疗器械广告须经审查、禁用表示功效安全性的断言或保证，是市场宣传合规的高频执法依据。",articles:[{no:"第十六条",label:"医疗器械广告禁止情形",text:"医疗、药品、医疗器械广告不得含有表示功效、安全性的断言或者保证；不得说明治愈率或者有效率；不得利用广告代言人作推荐、证明。"},{no:"第四十六条",label:"广告审查",text:"发布医疗、药品、医疗器械等广告，应当在发布前由有关部门对广告内容进行审查；未经审查，不得发布。"}],related:["cn-labeling"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/",source:"全国人大 / 国家药品监督管理局法规文件库",lastVerified:"2026-09-17"},{id:"cn-metrology",title:"中华人民共和国计量法",titleEn:"Metrology Law of the People's Republic of China",region:"CN",level:"法律",type:"法律",docNo:"主席令第28号（2017年修正）",issuer:"全国人民代表大会常务委员会",issueDate:"1985-09-06",effectiveDate:"2017-12-27",status:"现行有效",priority:"normal",tags:["计量","检定","设备"],summary:"规范计量器具的制造、修理、检定与使用，涉及医疗诊断计量器具（如血压计、体温计）的强制检定要求。",articles:[{no:"第九条",label:"强制检定",text:"县级以上人民政府计量行政部门对社会公用计量标准器具，部门和企业、事业单位使用的最高计量标准器具，以及用于贸易结算、安全防护、医疗卫生、环境监测方面的列入强制检定目录的工作计量器具，实行强制检定。"}],related:["cn-739"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/",source:"全国人大 / 国家药品监督管理局法规文件库",lastVerified:"2026-09-17"},{id:"cn-47",title:"医疗器械注册与备案管理办法",titleEn:"Measures for the Administration of Medical Device Registration and Filing",region:"CN",level:"部门规章",type:"办法",docNo:"国家市场监督管理总局令第47号",issuer:"国家市场监督管理总局",issueDate:"2021-07-27",effectiveDate:"2021-10-01",status:"现行有效",priority:"core",tags:["注册","备案","审评","临床评价","体系核查"],summary:"医疗器械注册备案的程序性核心规章，规定申请、受理、技术审评、体系核查、审批发证、变更与延续全流程要求。",articles:[{no:"第七条",label:"注册人义务",text:"医疗器械注册人、备案人应当加强医疗器械全生命周期质量管理，对研制、生产、经营、使用全过程中医疗器械的安全性、有效性依法承担责任。"},{no:"第二十条",label:"申请资料",text:"申请医疗器械注册应当提交产品技术要求、检验报告、临床评价资料、产品说明书和标签样稿、质量管理体系文件等资料。"},{no:"第二十九条",label:"体系核查",text:"药品监督管理部门在技术审评过程中应当开展注册质量管理体系核查，核查内容涵盖设计开发、采购、生产、质量控制等环节。"},{no:"第四十三条",label:"审批时限",text:"技术审评机构应当自收到申请资料之日起60个工作日内完成技术审评；需要外聘专家评审的，所需时间不计算在内。"},{no:"第五十七条",label:"变更与延续",text:"注册证载明的产品名称、型号规格、结构组成等发生变化的，应当申请变更注册；注册证有效期届满需要延续的，应当在届满前6个月提出延续注册申请。"},{no:"第六十六条",label:"创新与优先",text:"对创新医疗器械和符合优先审批情形的医疗器械，按照专门程序给予优先办理、优先审评审批。"}],related:["cn-739","cn-48","cn-ce-guideline","cn-rsl"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"},{id:"cn-48",title:"体外诊断试剂注册与备案管理办法",titleEn:"Measures for the Administration of In Vitro Diagnostic Reagent Registration and Filing",region:"CN",level:"部门规章",type:"办法",docNo:"国家市场监督管理总局令第48号",issuer:"国家市场监督管理总局",issueDate:"2021-07-27",effectiveDate:"2021-10-01",status:"现行有效",priority:"core",tags:["体外诊断试剂","注册","备案","IVD"],summary:"针对体外诊断试剂（IVD）的专门注册备案规章，与《医疗器械注册与备案管理办法》并行适用，明确IVD的注册检验、临床评价特殊要求。",articles:[{no:"第七条",label:"按药品管理情形",text:"与致病性病原体抗原、抗体以及核酸等检测相关的试剂，与血型、组织配型相关的试剂等，按照药品管理的有关规定执行。"},{no:"第二十四条",label:"注册检验",text:"体外诊断试剂注册检验应当由具有相应资质的医疗器械检验机构进行，出具的检验报告作为注册申请资料提交。"},{no:"第三十六条",label:"主要原材料变更",text:"主要原材料、生产工艺、反应体系等发生实质性变化的，属于许可事项变更，应当申请变更注册。"}],related:["cn-47","cn-739"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"},{id:"cn-53",title:"医疗器械生产监督管理办法",titleEn:"Measures for the Supervision and Administration of Medical Device Manufacturing",region:"CN",level:"部门规章",type:"办法",docNo:"国家市场监督管理总局令第53号",issuer:"国家市场监督管理总局",issueDate:"2021-07-27",effectiveDate:"2021-10-01",status:"现行有效",priority:"core",tags:["生产许可","生产备案","委托生产","质量管理"],summary:"规定医疗器械生产许可与备案、生产质量管理、委托生产、监督检查等要求，是生产企业合规的核心规章。",articles:[{no:"第八条",label:"生产许可条件",text:"从事第二类、第三类医疗器械生产，应当具有与生产的医疗器械相适应的生产场地、环境条件、生产设备、专业技术人员及质量管理体系。"},{no:"第二十六条",label:"委托生产",text:"医疗器械注册人、备案人可以委托具备相应生产能力的企业生产医疗器械；委托方对受托方的质量管理能力应当进行评估，并对产品质量承担全部责任。"},{no:"第三十四条",label:"质量管理体系",text:"医疗器械生产企业应当按照医疗器械生产质量管理规范建立健全质量管理体系并保持有效运行。"},{no:"第四十条",label:"生产变更",text:"生产许可事项发生变化的，应当自变化之日起30个工作日内向原发证部门申请办理变更手续。"}],related:["cn-739","cn-gmp","cn-14"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"},{id:"cn-54",title:"医疗器械经营监督管理办法",titleEn:"Measures for the Supervision and Administration of Medical Device Distribution",region:"CN",level:"部门规章",type:"办法",docNo:"国家市场监督管理总局令第54号",issuer:"国家市场监督管理总局",issueDate:"2021-07-27",effectiveDate:"2021-10-01",status:"现行有效",priority:"core",tags:["经营许可","经营备案","进货查验","销售记录"],summary:"规定医疗器械经营许可与备案、经营质量管理、网络销售衔接、监督检查等要求，覆盖批发、零售、批零兼营等业态。",articles:[{no:"第九条",label:"经营许可条件",text:"从事第三类医疗器械经营，应当具有与经营范围和经营规模相适应的经营场所、贮存条件、质量管理制度和专业人员。"},{no:"第二十七条",label:"进货查验",text:"医疗器械经营企业应当建立并执行进货查验记录制度，查验供货者的资质和医疗器械的合格证明文件，建立进货查验记录。"},{no:"第三十条",label:"销售记录",text:"从事第二类、第三类医疗器械批发业务的，应当建立销售记录制度，记录记载至有效期届满后5年，植入类器械记录应当永久保存。"}],related:["cn-739","cn-gsp","cn-38"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"},{id:"cn-18",title:"医疗器械使用质量监督管理办法",titleEn:"Measures for the Supervision and Administration of Medical Device Use Quality",region:"CN",level:"部门规章",type:"办法",docNo:"国家食品药品监督管理总局令第18号",issuer:"国家食品药品监督管理总局",issueDate:"2015-10-21",effectiveDate:"2016-02-01",status:"现行有效",priority:"key",tags:["使用单位","医疗机构","维护保养","追溯"],summary:"面向医疗机构等使用单位，规定医疗器械采购、验收、贮存、使用、维护、转让与处置的全过程质量管理要求。",articles:[{no:"第八条",label:"采购与验收",text:"使用单位应当从具有合法资质的生产经营企业采购医疗器械，建立并执行进货查验记录制度，验明产品合格证明文件。"},{no:"第十五条",label:"维护与追溯",text:"使用单位应当对医疗器械进行定期检查、检验、校准、保养、维护，并记录存档；大型医用设备应当建立使用档案。"},{no:"第二十条",label:"植入类器械",text:"对植入和介入类医疗器械，使用单位应当将相关信息记录到病历等相关记录中，确保信息可追溯。"}],related:["cn-739","cn-54"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"},{id:"cn-38",title:"医疗器械网络销售监督管理办法",titleEn:"Measures for the Supervision and Administration of Online Sales of Medical Devices",region:"CN",level:"部门规章",type:"办法",docNo:"国家食品药品监督管理总局令第38号",issuer:"国家食品药品监督管理总局",issueDate:"2017-12-20",effectiveDate:"2018-03-01",status:"现行有效",priority:"key",tags:["网络销售","电商平台","备案","经营范围"],summary:"规范医疗器械网络销售行为，明确网络销售企业备案、平台经营者审核与管理义务，禁售特定高风险品类。",articles:[{no:"第七条",label:"销售主体备案",text:"从事医疗器械网络销售的企业应当是依法取得医疗器械生产许可、经营许可或者办理备案的企业，并向所在地设区的市级药品监督管理部门备案。"},{no:"第十一条",label:"信息展示",text:"网络销售企业应当在网站显著位置展示其医疗器械生产经营许可证件或者备案凭证，产品页面应当展示医疗器械注册证或者备案凭证。"},{no:"第十四条",label:"平台义务",text:"医疗器械网络交易服务第三方平台提供者应当对入驻企业的资质进行审核登记，建立入驻企业档案，并对平台内销售行为进行管理。"}],related:["cn-54","cn-ad-law"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"},{id:"cn-adr",title:"医疗器械不良事件监测和再评价管理办法",titleEn:"Measures for the Administration of Medical Device Adverse Event Monitoring and Re-evaluation",region:"CN",level:"部门规章",type:"办法",docNo:"国家市场监督管理总局令第1号",issuer:"国家市场监督管理总局、国家卫生健康委员会",issueDate:"2018-08-13",effectiveDate:"2019-01-01",status:"现行有效",priority:"core",tags:["不良事件","再评价","上市后","个例报告"],summary:"建立医疗器械不良事件监测、报告、评价与控制体系，规定个例报告时限、定期风险评价报告与再评价触发条件。",articles:[{no:"第十四条",label:"个例报告时限",text:"导致死亡的事件应当于发现或者知悉之日起7日内报告；导致严重伤害、可能导致严重伤害或死亡的事件应当于20日内报告。"},{no:"第二十条",label:"定期风险评价",text:"医疗器械注册人、备案人应当对上市后器械的安全性进行主动监测，按规定撰写并提交定期风险评价报告。"},{no:"第三十四条",label:"再评价情形",text:"存在严重不良事件、安全性有效性存在重大问题、风险受益比发生重大改变等情形的，应当组织开展再评价。"}],related:["cn-739","cn-recall","cn-udi"],officialUrl:"https://www.nmpa.gov.cn/xxgk/fgwj/bmgzh/index.html",source:"国家药品监督管理局 · 部门规章",lastVerified:"2026-09-17"}],window.MDR_CN_EXT=[{id:"cn-nmpa-121",title:"关于公布医疗器械注册申报资料要求和批准证明文件格式的公告",titleEn:"Requirements for Medical Device Registration Dossier and Approval Certificate Formats",region:"CN",level:"规范性文件",type:"公告",docNo:"国家药品监督管理局2021年第121号公告",issuer:"国家药品监督管理局",issueDate:"2021-09-29",effectiveDate:"2022-01-01",status:"现行有效",priority:"core",tags:["注册","注册申报","申报资料","体系核查","EP清单"],summary:"现行注册申报资料的唯一目录依据，确立监管信息、综述资料、非临床资料、临床评价资料、说明书标签、质量管理体系文件六大模块，与 IMDRF 目录结构趋同。",articles:[{no:"适用范围",label:"替代关系",text:"自2022年1月1日起施行，原国家食品药品监督管理总局2014年第43号公告同时废止；第二类、第三类医疗器械注册、变更、延续注册均按本公告提交资料。"},{no:"六大模块",label:"资料框架",text:"申报资料分为监管信息、综述资料、非临床资料、临床评价资料、产品说明书和标签样稿、质量管理体系文件六个部分。"},{no:"体系文件",label:"质量管理体系文件",text:"新增质量管理体系文件要求（含程序文件与核查文件），申请人递交注册申请时应当具备完备的质量管理体系并随时接受核查。"},{no:"EP清单",label:"安全和性能基本原则清单",text:"附件9为《医疗器械安全和性能基本原则清单》，申报时应当逐项说明适用性并提供符合性证据。"}],related:["cn-47","cn-nmpa-122","cn-essp","cn-rsl"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 公告",lastVerified:"2026-09-17"},{id:"cn-nmpa-122",title:"关于公布体外诊断试剂注册申报资料要求和批准证明文件格式的公告",titleEn:"Requirements for IVD Registration Dossier and Approval Certificate Formats",region:"CN",level:"规范性文件",type:"公告",docNo:"国家药品监督管理局2021年第122号公告",issuer:"国家药品监督管理局",issueDate:"2021-09-29",effectiveDate:"2022-01-01",status:"现行有效",priority:"core",tags:["注册","注册申报","体外诊断试剂","IVD","申报资料"],summary:"体外诊断试剂注册申报的目录依据，与第121号公告同批发布，针对 IVD 产品特点规定主要原材料、反应体系、分析性能与稳定性研究资料要求。",articles:[{no:"适用范围",label:"适用对象",text:"适用于体外诊断试剂（含第二类、第三类）的注册、变更注册与延续注册申报资料准备。"},{no:"非临床资料",label:"IVD 特有要求",text:"除通用风险管理与产品技术要求外，须提交主要原材料研究、反应体系（如适用）、分析性能评估、参考区间与稳定性研究资料。"},{no:"临床评价",label:"临床评价资料",text:"按《体外诊断试剂注册与备案管理办法》与相关指导原则提交临床评价资料，可采用同品种比对或临床试验路径。"}],related:["cn-48","cn-nmpa-121"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 公告",lastVerified:"2026-09-17"},{id:"cn-nmpa-2021-76",title:"关于实施《医疗器械注册与备案管理办法》《体外诊断试剂注册与备案管理办法》有关事项的通告",titleEn:"Notice on Implementation of the Provisions for Medical Device Registration and Filing",region:"CN",level:"规范性文件",type:"通告",docNo:"国家药品监督管理局2021年第76号通告",issuer:"国家药品监督管理局",issueDate:"2021-09-29",effectiveDate:"2021-10-01",status:"现行有效",priority:"key",tags:["注册","备案","过渡期","新旧衔接"],summary:"两部注册管理办法（47号、48号令）的配套实施通告，明确新旧制度衔接、在审品种处理、注册证延续与文书格式等过渡安排。",articles:[{no:"施行衔接",label:"新旧衔接",text:"2021年10月1日起施行新办法；此前受理的注册申请，按受理时的规定继续审评审批。"},{no:"证书沿用",label:"既有证书效力",text:"已取得的医疗器械注册证在有效期内继续有效，注册人应当按新办法履行全生命周期管理义务。"},{no:"配套调整",label:"配套文件",text:"注册申报资料要求、体系核查、电子申报等配套文件同步按新目录体系执行。"}],related:["cn-47","cn-48","cn-nmpa-121"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 通告",lastVerified:"2026-09-17"},{id:"cn-dossier-2022",title:"关于发布《医疗器械产品注册项目立卷审查要求》等文件的通告",titleEn:"Requirements for Dossier Completeness Review of Medical Device Registration",region:"CN",level:"规范性文件",type:"通告",docNo:"国家药品监督管理局2022年第40号通告",issuer:"国家药品监督管理局",issueDate:"2022-08-31",effectiveDate:"2022-08-31",status:"现行有效",priority:"key",tags:["注册","立卷审查","形式审查","申报资料"],summary:"确立注册申报的立卷审查（形式审查）标准，明确资料完整性、格式规范性与不予受理的具体情形，是申报文件质量的第一道关口。",articles:[{no:"审查定位",label:"立卷审查",text:"受理前对申报资料的完整性与格式符合性进行审查，属于形式审查，不涉及技术内容评价。"},{no:"不予受理情形",label:"不予受理",text:"资料项目缺失、格式不符合要求、申请表信息不一致等情形，应当一次性告知补正或不予受理。"},{no:"申报建议",label:"实务要点",text:"应按第121号／122号公告的目录结构逐项自查，避免因形式问题退审而延误审评时序。"}],related:["cn-nmpa-121","cn-nmpa-122"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 通告",lastVerified:"2026-09-17"},{id:"cn-tech-require",title:"医疗器械产品技术要求编写指导原则",titleEn:"Guideline for Drafting Product Technical Requirements",region:"CN",level:"指导原则",type:"指导原则",docNo:"国家药品监督管理局2022年第8号通告",issuer:"国家药品监督管理局",issueDate:"2022-02-09",effectiveDate:"2022-02-09",status:"现行有效",priority:"core",tags:["注册","产品技术要求","注册检验","标准"],summary:"规定产品技术要求的结构、性能指标与检验方法编写规则，以及引用国家标准／行业标准的写法，是注册申报与注册检验的核心文件依据。",articles:[{no:"文件构成",label:"结构要求",text:"产品技术要求应当包括产品型号规格、性能指标、检验方法、术语定义、附录（如适用）等部分。"},{no:"指标设定",label:"性能指标",text:"性能指标应当覆盖安全性与有效性要求，凡适用的强制性标准条款必须纳入；可采用国家标准、行业标准原文或自定方法与限值。"},{no:"检验方法",label:"方法学",text:"检验方法应当可操作、可复现，优先采用现行有效标准方法；自建方法需提供方法学验证资料。"},{no:"变更管理",label:"与变更注册衔接",text:"产品技术要求发生实质性变化的，应按变更注册办理；非实质性变化的按质量管理体系文件控制。"}],related:["cn-47","cn-nmpa-121","cn-gb9706-1"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 通告",lastVerified:"2026-09-17"},{id:"cn-essp-tech",title:"医疗器械安全和性能基本原则符合性技术指南",titleEn:"Technical Guide for Compliance with Essential Principles of Safety and Performance",region:"CN",level:"指导原则",type:"技术指南",docNo:"国家药监局器审中心2022年第29号通告",issuer:"国家药品监督管理局医疗器械技术审评中心",issueDate:"2022-07-13",effectiveDate:"2022-07-13",status:"现行有效",priority:"key",tags:["注册","基本原则","EP清单","符合性声明"],summary:"对《医疗器械安全和性能基本原则》逐条给出符合性判定思路与证据形式，指导申请人编制 EP 符合性清单与技术资料。",articles:[{no:"逐条对应",label:"原则与证据映射",text:"将每项基本原则与产品技术要求、研究资料、非临床与临床证据建立对应关系，形成可核查的证据链。"},{no:"不适用说明",label:"适用性判定",text:"对不适用的原则应当给出理由；不得以空白或简单勾选替代实质论证。"},{no:"与申报衔接",label:"申报应用",text:"符合性清单作为注册申报非临床资料的必要组成部分，与风险管理资料相互印证。"}],related:["cn-essp","cn-nmpa-121"],officialUrl:"https://www.cmde.org.cn/",source:"国家药品监督管理局医疗器械技术审评中心",lastVerified:"2026-09-17"},{id:"cn-comm",title:"医疗器械审评沟通交流管理办法（试行）",titleEn:"Measures for Review Communication and Exchange (Trial)",region:"CN",level:"规范性文件",type:"管理办法",docNo:"原国家食品药品监督管理总局2017年第19号通告",issuer:"原国家食品药品监督管理总局",issueDate:"2017-02-07",effectiveDate:"2017-02-07",status:"现行有效",priority:"key",tags:["注册","沟通交流","审评","申报策略"],summary:"确立注册申报前与审评机构的沟通交流机制（会议形式、申请条件、资料要求），是重大技术争议与创新产品厘清审评路径的正式渠道。",articles:[{no:"沟通形式",label:"会议类型",text:"分为一般性沟通、重大事项沟通、创新产品沟通等，通过书面或会议形式开展。"},{no:"申请要求",label:"资料准备",text:"申请人应当提交沟通交流申请表、产品概述、拟讨论问题清单及相关支持性资料。"},{no:"效力说明",label:"沟通意见效力",text:"沟通交流形成的意见供审评参考，不构成审评结论，也不替代正式申报程序。"}],related:["cn-47","cn-innovation","cn-priority"],officialUrl:"https://www.cmde.org.cn/",source:"国家药品监督管理局医疗器械技术审评中心",lastVerified:"2026-09-17"},{id:"cn-class1-2022",title:"关于第一类医疗器械备案有关事项的公告",titleEn:"Announcement on Filing of Class I Medical Devices",region:"CN",level:"规范性文件",type:"公告",docNo:"国家药品监督管理局2022年第62号公告",issuer:"国家药品监督管理局",issueDate:"2022-08-11",effectiveDate:"2022-08-11",status:"现行有效",priority:"key",tags:["备案","第一类","分类界定","备案资料"],summary:"规范第一类医疗器械产品备案与生产备案的资料要求、办理程序与备案后管理，明确备案人主体责任与备案信息公示要求。",articles:[{no:"备案性质",label:"备案非许可",text:"第一类医疗器械实行备案管理，备案不属于行政许可，但备案人仍须对产品安全有效与备案资料真实性负责。"},{no:"资料要求",label:"备案资料",text:"应当提交备案表、产品技术要求、产品检验报告、临床评价资料（如适用）、说明书标签样稿及生产制造信息等。"},{no:"备案后管理",label:"监管要求",text:"监管部门对备案资料进行事后核查，发现不符合要求的取消备案并向社会公布。"}],related:["cn-739","cn-catalog","cn-15"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 公告",lastVerified:"2026-09-17"},{id:"cn-master-doc",title:"关于医疗器械主文档登记事项的公告",titleEn:"Announcement on Master File Registration for Medical Devices",region:"CN",level:"规范性文件",type:"公告",docNo:"国家药品监督管理局2021年第36号公告",issuer:"国家药品监督管理局",issueDate:"2021-03-12",effectiveDate:"2021-03-12",status:"现行有效",priority:"normal",tags:["注册","主文档","原材料","供应商"],summary:"建立医疗器械主文档登记制度，允许原材料、关键元器件等供应商以主文档形式向监管部门登记技术资料，供注册申请人引用。",articles:[{no:"制度定位",label:"主文档作用",text:"主文档用于保护供应商技术秘密，同时供注册申请人在申报资料中授权引用，避免重复提交原材料技术资料。"},{no:"适用范围",label:"适用情形",text:"适用于原材料、元器件、组件以及检测方法等第三方技术资料的登记与引用。"},{no:"引用规则",label:"授权引用",text:"注册申请人引用主文档前应当取得主文档所有者授权，并在申报资料中说明引用关系。"}],related:["cn-47","cn-nmpa-121"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 公告",lastVerified:"2026-09-17"},{id:"cn-high-end",title:"优先审批高端医疗器械目录（2025版）",titleEn:"Priority Review Catalogue of High-end Medical Devices (2025 Edition)",region:"CN",level:"规范性文件",type:"目录",docNo:"国家药品监督管理局2025年第48号通告",issuer:"国家药品监督管理局",issueDate:"2025-12-26",effectiveDate:"2025-12-26",status:"现行有效",priority:"key",tags:["注册","优先审批","高端器械","创新通道"],summary:"配合高端医疗器械创新发展政策发布的优先审批目录，列入目录的产品可适用优先审评审批，是国产高端器械加速上市的通道依据。",articles:[{no:"政策背景",label:"政策依据",text:"为落实全面深化药品医疗器械监管改革、促进产业高质量发展的部署，对高端医疗器械实施优先审批。"},{no:"适用方式",label:"适用条件",text:"产品属于目录范围且符合优先审批条件的，可在注册申报时提出优先审批申请，纳入优先审评序列。"},{no:"实施要点",label:"实务提示",text:"目录动态更新，申报前应当核对目录版本与适用范围，并结合创新医疗器械特别审查程序择一适用。"}],related:["cn-priority","cn-innovation"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 通告",lastVerified:"2026-09-17"},{id:"cn-innovate-2025",title:"关于发布优化全生命周期监管支持高端医疗器械创新发展有关举措的公告",titleEn:"Measures to Optimize Life-cycle Regulation and Support Innovation of High-end Medical Devices",region:"CN",level:"规范性文件",type:"公告",docNo:"国家药品监督管理局2025年第63号公告",issuer:"国家药品监督管理局",issueDate:"2025-07-03",effectiveDate:"2025-07-03",status:"现行有效",priority:"core",tags:["注册","创新通道","全生命周期","监管改革"],summary:"系统性提出支持高端医疗器械创新发展的全生命周期监管举措，涵盖审评前移、沟通交流、检查优化、上市后监管与国际化支持。",articles:[{no:"审评前移",label:"研发阶段介入",text:"强化研发阶段的沟通指导，对重点创新产品建立专人对接与跟踪服务机制。"},{no:"流程优化",label:"审评检查协同",text:"优化注册体系核查与生产许可检查的协同安排，减少重复检查，提高审评效率。"},{no:"国际化支持",label:"国际协同",text:"支持企业开展国际多中心临床与境外申报，推动监管国际互认与标准衔接。"}],related:["cn-innovation","cn-high-end"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 公告",lastVerified:"2026-09-17"},{id:"cn-ct-inspect",title:"医疗器械临床试验项目检查要点及判定原则",titleEn:"Inspection Points and Determination Principles for Medical Device Clinical Trials",region:"CN",level:"规范性文件",type:"公告",docNo:"国家药品监督管理局2025年第22号公告",issuer:"国家药品监督管理局",issueDate:"2025-03-12",effectiveDate:"2025-03-12",status:"现行有效",priority:"key",tags:["临床试验","临床试验机构","核查","GCP"],summary:"统一临床试验项目检查的要点与判定原则，明确真实性问题与规范性问题两类情形的判定标准，是临床试验现场核查的执法口径依据。",articles:[{no:"检查要点",label:"检查维度",text:"覆盖试验条件、受试者权益保障、试验用医疗器械管理、试验数据记录、方案执行与不良事件处理等维度。"},{no:"判定原则",label:"判定分类",text:"区分真实性问题与规范性／完整性问题，真实性问题属于不可接受情形，直接判定为不符合要求。"},{no:"后果衔接",label:"处理措施",text:"检查发现问题的，可要求整改、暂停试验或不予认可其数据用于注册申报。"}],related:["cn-gcp","cn-37"],officialUrl:"https://www.nmpa.gov.cn/xxgk/ggtg/",source:"国家药品监督管理局 · 公告",lastVerified:"2026-09-17"}],window.MDR_INTL=[{id:"us-fdc",title:"美国联邦食品、药品和化妆品法（医疗器械相关条款）",titleEn:"Federal Food, Drug, and Cosmetic Act (FD&C Act) — Device Provisions",region:"US",level:"法律",type:"Act",docNo:"21 U.S.C. §321 et seq.",issuer:"U.S. Congress / FDA",issueDate:"1938-06-25",effectiveDate:"1938-06-25",status:"现行有效",priority:"core",tags:["上市前审批","分类","510(k)","PMA","修正案"],summary:"美国医疗器械监管的最高法律层级，经 1976 年医疗器械修正案（MDA）确立三类分类与上市前审查制度，是 FDA 全部器械法规的授权来源。",articles:[{no:"§513 (510)",label:"风险分类",text:"医疗器械按风险分为 Class I（一般监管）、Class II（一般监管加特殊控制）、Class III（上市前批准），并规定 7 种分类标准。"},{no:"§510(k)",label:"上市前通知",text:"Class II 及部分 Class I 器械须提交 510(k) 上市前通知，证明与已合法上市 predicate device 实质性等同（Substantial Equivalence）。"},{no:"§515",label:"上市前批准",text:"Class III 器械须提交 PMA 申请，FDA 审查安全性与有效性的独立证据，包括临床试验数据与生产企业质量体系。"},{no:"§513(f)(2)",label:"De Novo 分类",text:"对没有 predicate 的新型低中风险器械，申请人可申请 De Novo 分类，获批后自动建立新的 Class I/II 分类并可作为后续 predicate。"},{no:"§515B",label:"突破性器械",text:"Breakthrough Devices Program 为治疗或诊断危及生命或不可逆衰弱疾病的突破性技术提供优先审评与交互式沟通。"},{no:"§501/§502",label:"掺假与标识错误",text:"规定 adulterated（掺假）与 misbranded（标识错误）的判定情形及相应法律责任，是 FDA 执法没收与禁令的基础条款。"}],related:["us-807","us-814","us-qmsr"],officialUrl:"https://www.fda.gov/medical-devices",source:"U.S. Food and Drug Administration",lastVerified:"2026-09-17"},{id:"us-qmsr",title:"美国质量体系法规（QMSR，21 CFR Part 820）",titleEn:"Quality Management System Regulation (QMSR), 21 CFR Part 820",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 820（89 FR 7496）",issuer:"U.S. Food and Drug Administration",issueDate:"2024-02-02",effectiveDate:"2026-02-02",status:"现行有效",priority:"core",tags:["QSR","QMSR","ISO 13485","质量体系","cGMP"],summary:"取代原 QSR（Quality System Regulation），将 ISO 13485:2016 通过引用并入美国法规，实现 FDA 质量体系要求与国际标准的实质对齐。",articles:[{no:"§820.3",label:"术语与引用",text:"QMSR 大量术语改为直接引用 ISO 13485:2016，如将 device master record 等概念与 ISO 术语对应。"},{no:"§820.7",label:"引用并入",text:"ISO 13485:2016 整体通过引用并入法规；企业满足 ISO 13485 即实质满足本部分要求，但仍须满足 FDA 保留的附加要求（如投诉档案、器械记录）。"},{no:"§820.35",label:"记录控制",text:"保留 FDA 特有的记录要求，包括器械主记录、设计历史文档、投诉档案（Complaint Files）等，属于 ISO 13485 之外仍需满足的部分。"},{no:"§820.40",label:"上市后要求",text:"明确与 21 CFR Part 803（MDR）、Part 806（纠正与移除）的衔接，上市后活动纳入质量体系闭环。"},{no:"过渡安排",label:"生效与过渡",text:"2024年2月2日发布最终规则，2026年2月2日起强制执行；此前按 QSR 建立体系的检查记录仍需按新规过渡转换。"}],related:["us-fdc","intl-iso13485","us-mdr"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-820",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-807",title:"美国机构注册与器械列名 / 510(k)（21 CFR Part 807）",titleEn:"Establishment Registration and Device Listing; Premarket Notification 510(k)",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 807",issuer:"U.S. Food and Drug Administration",issueDate:"1976-05-28",effectiveDate:"2023-10-01",status:"现行有效",priority:"core",tags:["510(k)","注册","列名","eSTAR","实质性等同"],summary:"规定企业注册（Establishment Registration）、器械列名（Device Listing）与 510(k) 上市前通知的提交、审查与收费要求。",articles:[{no:"§807.20",label:"注册与列名义务",text:"从事器械生产、制备、宣传、复合或加工的机构，以及拟在美国商业流通的器械的外国制造商、出口商，均须向 FDA 注册并提交器械列名。"},{no:"§807.81",label:"510(k) 适用",text:"首次商业流通前、预期用途或技术发生重大变化可能影响安全有效性时，须提交 510(k)；§807.85 列出豁免情形。"},{no:"§807.87",label:"提交内容",text:"510(k) 需包含器械描述、预期用途、与 predicate 的实质性等同比较、性能数据、生物相容性、标签与真实性声明。"},{no:"§807.100",label:"审查决定",text:"FDA 作出实质性等同（SE）或不实质等同（NSE）决定；NSE 器械通常被归入 Class III 而需提交 PMA。"},{no:"eSTAR",label:"电子提交",text:"自 2023 年 10 月 1 日起，510(k) 原则上须通过 eSTAR 电子提交模板提交，纸质或非 eSTAR 电子提交将被拒收（RTA）。"}],related:["us-fdc","us-814","us-estar"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-807",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-estar",title:"eSTAR 电子提交模板与拒收（RTA）政策",titleEn:"eSTAR Program and Refuse to Accept Policy for 510(k)s",region:"US",level:"规范性文件",type:"指南",docNo:"FDA Guidance / eSTAR",issuer:"U.S. Food and Drug Administration",issueDate:"2023-10-01",effectiveDate:"2023-10-01",status:"现行有效",priority:"key",tags:["eSTAR","电子提交","RTA","510(k)","De Novo"],summary:"FDA 强制使用的交互式电子提交模板，将 510(k)/De Novo 全部申报资料结构化打包，并配套拒收政策进行形式审查。",articles:[{no:"模板结构",label:"结构化提交",text:"eSTAR 为 PDF 形式，内嵌自动校验与内容导向的问题清单，可按产品类型加载对应附件（如软件、生物相容性、灭菌）。"},{no:"强制范围",label:"强制使用",text:"2023年10月1日起 510(k) 必须使用 eSTAR；后续扩展至 De Novo、Pre-Sub 等类型。"},{no:"RTA 审查",label:"拒收政策",text:"FDA 在 15 个日历日内完成受理审查，缺失必备要素（如说明书、真实性声明、比较表）将被 Refuse to Accept（RTA）。"}],related:["us-807","us-fdc"],officialUrl:"https://www.fda.gov/medical-devices/premarket-submissions-selecting-and-preparing-correct-submission/estar-program",source:"U.S. Food and Drug Administration",lastVerified:"2026-09-17"},{id:"us-814",title:"美国上市前批准（PMA）与产品开发协议（21 CFR Part 814）",titleEn:"Premarket Approval of Medical Devices, 21 CFR Part 814",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 814",issuer:"U.S. Food and Drug Administration",issueDate:"1986-10-01",effectiveDate:"1986-10-01",status:"现行有效",priority:"core",tags:["PMA","Class III","临床数据","补充申请"],summary:"规定 Class III 器械上市前批准的申请、审查、补充申请（PMA Supplement）与产品开发协议（PDP）程序。",articles:[{no:"§814.20",label:"申请内容",text:"PMA 申请须包含临床前研究、临床研究、制造信息（含质量体系）、标签、环境影响评估与申请人声明等完整资料。"},{no:"§814.40",label:"审查时限",text:"FDA 应当在受理之日起 180 日内完成审查并作出决定，实际审查周期通常更长，需多轮信息交互。"},{no:"§814.39",label:"补充申请",text:"已批准 PMA 的某些变更（如制造工艺、标签、设计变更）需提交 PMA Supplement 并获批准后方可实施。"},{no:"§814.47",label:"撤回与撤销",text:"规定自愿撤回、FDA 撤销批准（如发现不实陈述、不符合条件）的程序与后果。"}],related:["us-fdc","us-807","us-ide"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-814",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-ide",title:"美国研究性器械豁免（IDE，21 CFR Part 812）",titleEn:"Investigational Device Exemptions, 21 CFR Part 812",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 812",issuer:"U.S. Food and Drug Administration",issueDate:"1980-01-18",effectiveDate:"1980-01-18",status:"现行有效",priority:"key",tags:["IDE","临床试验","IRB","知情同意"],summary:"规定用于临床试验的器械豁免程序，涉及重大风险器械的 IDE 审批、显著风险/非显著风险判定与 IRB 审查要求。",articles:[{no:"§812.20",label:"IDE 申请",text:"重大风险（Significant Risk）器械临床试验须提交 IDE 申请并经 FDA 批准；非显著风险器械须经 IRB 批准并遵守简略要求。"},{no:"§812.25/§812.27",label:"申请内容",text:"包括研究计划、研究者信息、器械说明、前期研究报告、风险分析、知情同意书与 IRB 信息。"},{no:"§812.150",label:"记录与报告",text:"研究发起人须如实记录并向 FDA 提交进展报告、不良器械效应报告、最终报告等。"}],related:["us-814","us-807"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-812",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-mdr",title:"美国医疗器械报告制度（MDR，21 CFR Part 803）",titleEn:"Medical Device Reporting, 21 CFR Part 803",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 803",issuer:"U.S. Food and Drug Administration",issueDate:"1984-06-15",effectiveDate:"1984-06-15",status:"现行有效",priority:"core",tags:["MDR","不良事件","上市后","报告时限"],summary:"规定制造商、进口商、使用者机构向 FDA 报告器械死亡、严重伤害与故障事件的义务与时限，是上市后监督的核心制度。",articles:[{no:"§803.50",label:"制造商报告",text:"制造商须在获知（become aware）之日起 30 个日历日内提交 MDR 报告；若事件要求补救措施以避免对公众健康造成重大危害，须在 5 个工作日内报告。"},{no:"§803.40/§803.30",label:"进口商与用户设施",text:"进口商须在获知后 30 日内报告；用户设施（医院等）须在获知后 10 个工作日内报告死亡与严重伤害事件。"},{no:"§803.58",label:"外国事件",text:"外国制造商向 FDA 报告境外发生事件时，可指定美国代理人履行报告义务。"},{no:"§803.18",label:"记录保存",text:"投诉档案与 MDR 相关记录须保存 2 年，或自器械使用寿命结束后 2 年，二者取较长者。"}],related:["us-fdc","us-qmsr","us-recall"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-803",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-recall",title:"美国器械纠正与移除（召回）报告（21 CFR Part 806）",titleEn:"Medical Devices; Reports of Corrections and Removals, 21 CFR Part 806",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 806",issuer:"U.S. Food and Drug Administration",issueDate:"1984-02-03",effectiveDate:"1984-02-03",status:"现行有效",priority:"key",tags:["召回","纠正","移除","FSN"],summary:"规定制造商对器械进行纠正或移除时向 FDA 报告的义务、报告时限与豁免情形，并要求随附安全警示函（FSN）。",articles:[{no:"§806.10",label:"报告义务",text:"制造商对已商业流通器械实施纠正或移除，以降低健康风险或纠正法规违反情形的，须在 10 个工作日内向 FDA 报告。"},{no:"§806.20",label:"豁免情形",text:"对器械进行常规维护、修理或工程变更而不涉及风险降低的，可豁免报告要求。"},{no:"§806.30",label:"记录要求",text:"须保存纠正与移除的相关记录，并按规定期限（通常 2 年）保留。"}],related:["us-mdr","us-fdc"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-806",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-udi",title:"美国唯一器械标识系统（UDI，21 CFR Part 830）",titleEn:"Unique Device Identification System, 21 CFR Part 830",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 830",issuer:"U.S. Food and Drug Administration",issueDate:"2013-09-24",effectiveDate:"2013-09-24",status:"现行有效",priority:"core",tags:["UDI","GUDID","DI","PI","追溯"],summary:"建立美国 UDI 制度，要求器械标签标注 DI/PI、向 GUDID 数据库提交数据，并按分类分批实施。",articles:[{no:"§830.20/§830.30",label:"标注义务",text:"器械标签与包装须载有 UDI，采用人眼可读形式与自动识别形式（AIDC）；永久性标记适用于可重复使用器械。"},{no:"§830.300",label:"GUDID 数据提交",text:"标签商（Labeler）须向 FDA 全球唯一器械标识数据库（GUDID）提交器械标识数据，并在信息变化时及时更新。"},{no:"§830.50/§830.60",label:"变更与注销",text:"器械标识信息发生变更须重新提交；器械停止流通时须标注为不再销售。"},{no:"实施时间表",label:"分批实施",text:"按 Class III（2014-09-24 起）、Class II（2016-09-24 起）、Class I（2018-09-24 起）分批实施，部分器械有例外与替代方案。"}],related:["cn-udi","us-fdc"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-830",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-pms",title:"美国上市后监督（21 CFR Part 822）",titleEn:"Postmarket Surveillance, 21 CFR Part 822",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 822",issuer:"U.S. Food and Drug Administration",issueDate:"1996-02-01",effectiveDate:"1996-02-01",status:"现行有效",priority:"normal",tags:["上市后监督","PMS","跟踪随访"],summary:"授权 FDA 要求制造商对特定器械开展上市后监督，通过真实世界数据持续评价安全有效性。",articles:[{no:"§822.10",label:"监督要求",text:"FDA 可要求制造商制定并实施上市后监督计划，收集器械在临床使用中的性能数据与安全信息。"},{no:"§822.30",label:"监督计划",text:"监督计划须包含监督目的、方法与统计分析方案、样本量与报告安排，并经 FDA 批准。"}],related:["us-mdr","us-fdc"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-822",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"us-11",title:"美国电子记录与电子签名（21 CFR Part 11）",titleEn:"Electronic Records; Electronic Signatures, 21 CFR Part 11",region:"US",level:"部门规章",type:"CFR",docNo:"21 CFR Part 11",issuer:"U.S. Food and Drug Administration",issueDate:"1997-03-20",effectiveDate:"1997-08-20",status:"现行有效",priority:"key",tags:["电子记录","电子签名","数据完整性","审计追踪"],summary:"规定电子记录与电子签名在法律上等同纸质记录与手写签名的条件，是数据完整性（Data Integrity）与计算机化系统验证的基础。",articles:[{no:"§11.10",label:"系统要求",text:"封闭系统应当具备系统验证、记录生成与保存、审计追踪、权限控制、操作顺序检查、输入有效性检查与人员培训等能力。"},{no:"§11.50/§11.70",label:"电子签名",text:"电子签名应当包含签署人姓名、签署日期时间与签署含义（如审查、批准、职责），并与对应记录永久关联。"},{no:"§11.100",label:"唯一性",text:"每个人的电子签名应当唯一，不得由他人复用或重新分配。"}],related:["us-qmsr"],officialUrl:"https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-11",source:"Electronic Code of Federal Regulations (eCFR)",lastVerified:"2026-09-17"},{id:"eu-mdr",title:"欧盟医疗器械法规 MDR (EU) 2017/745",titleEn:"Regulation (EU) 2017/745 on Medical Devices (MDR)",region:"EU",level:"行政法规",type:"Regulation",docNo:"Regulation (EU) 2017/745",issuer:"European Parliament and Council",issueDate:"2017-04-05",effectiveDate:"2021-05-26",status:"现行有效",priority:"core",tags:["MDR","CE认证","公告机构","临床评价","GSPR"],summary:"取代 93/42/EEC 与 90/385/EEC，建立欧盟医疗器械统一监管框架，大幅强化临床评价、上市后监督、UDI 与公告机构责任。",articles:[{no:"附录 I",label:"通用安全与性能要求",text:"GSPR（General Safety and Performance Requirements）共 23 项，涵盖化学物理生物学特性、感染与微生物污染、环境与电气安全、辐射、软件与网络安全、标签与说明书等。"},{no:"附录 II/III",label:"技术文件",text:"技术文件须包含器械描述与规格、参考标准与符合性证据、标签与说明书、设计制造信息、GSPR 符合性检查表与风险分析。"},{no:"附录 IX/X/XI",label:"符合性评定路径",text:"公告机构依据附录 IX（质量体系+技术文件评估）、附录 X（型式检验）、附录 XI（产品符合性验证）开展符合性评定并签发 CE 证书。"},{no:"第六章",label:"临床评价与 PMCF",text:"临床评价须贯穿器械全生命周期，须制定临床评价计划、撰写临床评价报告（CER），并实施上市后临床跟踪（PMCF）。"},{no:"第 27 条",label:"UDI 系统",text:"MDR 建立欧盟 UDI 系统，器械须标注 UDI-DI 与 UDI-PI，并录入 EUDAMED 数据库。"},{no:"第 87 条",label:"严重事件报告",text:"严重事件须在获知后 15 日内报告；死亡或非预期严重健康恶化须在 10 日内报告；重大公共卫生威胁须在 2 日内报告。"},{no:"第 120 条",label:"过渡期",text:"规定原指令证书的过渡安排，后经 (EU) 2023/607 修订延长过渡期至 2027/2028 年（按风险类别分档）。"}],related:["eu-ivdr","eu-607","intl-iso13485","eu-mdcg"],officialUrl:"https://eur-lex.europa.eu/eli/reg/2017/745/oj",source:"EUR-Lex / European Commission DG SANTE",lastVerified:"2026-09-17"}],window.MDR_FLOW={version:"1.0.0",updatedAt:"2026-09-17",notice:"本流程数据依据现行法规整理，供路径规划与材料准备参考；流程环节、办理机关与时限以监管机构最新办事指南为准。时限均为工作日上限，法定节假日未扣除。",classify:{no:"01",title:"属性界定与分类判定",intro:"管理类别决定申报路径、办理机关与审评时限，是注册工作的第一步。判定结论应当逐项留痕，形成可追溯的分类判定记录。",steps:[{no:"1.1",name:"属性界定",desc:"判断产品是否按医疗器械管理。医疗器械是指直接或者间接用于人体的仪器、设备、器具、体外诊断试剂及校准物、材料以及其他类似或者相关的物品，包括所需要的计算机软件；其效用主要通过物理等方式获得，而不是通过药理学、免疫学或者代谢的方式获得。",basis:["cn-739","cn-47"],tip:"属性存在争议时，可向监管部门申请属性界定（分类界定）后再行申报。"},{no:"1.2",name:"查阅分类目录",desc:"比对《医疗器械分类目录》的一级产品类别、二级产品类别、产品描述与预期用途，确定管理类别。目录自2018年8月1日起施行，并持续以分类界定文件动态调整。",basis:["cn-catalog"],tip:"目录内产品直接按目录确定类别，无需单独申请界定。"},{no:"1.3",name:"目录外产品界定",desc:"对新研制的尚未列入分类目录的医疗器械，可以直接申请第三类医疗器械产品注册，也可以依据分类规则判断产品类别并向国家药品监督管理局申请类别确认后，再申请产品注册或者办理产品备案。直接申请第三类注册的，由国家局按风险程度确定类别；被确定为第二类或第一类的，应当向相应的药品监督管理部门申请注册或者备案。",basis:["cn-47","cn-15"],tip:"类别确认结论直接影响后续申报机关与时限安排，建议在立项阶段完成。"},{no:"1.4",name:"形成判定记录",desc:"依分类规则综合产品结构特征、接触人体情况、接触部位与接触时间、是否依靠能源、是否用于生命支持或维持、是否被人体吸收或代谢、对患者的潜在影响程度等要素，逐项给出判定结论并归档，作为注册申报资料的组成部分。",basis:["cn-15"],tip:"判定记录同时是注册质量管理体系核查的关注点。"}],factors:[{k:"结构特征",q:"产品属于有源器械还是无源器械？是否包含软件（独立软件或软件组件）？",note:"有源器械与含软件产品需额外评估软件与网络安全要求。"},{k:"接触人体",q:"是否接触人体？属于表面接触、有创侵入还是外科侵入？",note:"侵入程度越高，风险等级越高。"},{k:"接触时间",q:"接触时间属于暂时（少于 60 分钟）、短期（60 分钟至 30 日）还是长期（超过 30 日）？",note:"接触时间越长，风险等级越高。"},{k:"能量供给",q:"是否依靠电能或其他能源运行？能量是否作用于患者？",note:"能量输出类产品需重点评估电气安全与能量危害。"},{k:"生命支持",q:"是否用于生命支持或生命维持？是否用于监测维持生命的重要生理参数？",note:"生命支持类器械通常按第三类管理。"},{k:"吸收代谢",q:"是否全部或部分被人体吸收、降解或参与代谢？",note:"可吸收、可降解材料通常按第三类管理。"},{k:"特殊人群",q:"是否专用于儿童、孕妇、老年人等特殊人群？",note:"特殊人群使用可能上调管理类别。"},{k:"失效后果",q:"产品失效或者误用对人体造成的后果：轻微、中度，还是严重（危及生命或导致永久损伤）？",note:"后果越严重，类别越高。"}],decision:[{cond:"风险程度低，实行常规管理可以保证安全、有效",result:"第一类",path:"pw-class1",action:"产品备案（设区的市级药品监督管理部门）"},{cond:"具有中度风险，需要严格控制管理以保证安全、有效",result:"第二类",path:"pw-class2",action:"产品注册（省、自治区、直辖市药品监督管理部门）"},{cond:"具有较高风险，需要采取特别措施严格控制管理以保证安全、有效",result:"第三类",path:"pw-class3",action:"产品注册（国家药品监督管理局）"}]},pathways:[{id:"pw-class1",group:"常规路径",icon:"📦",name:"第一类医疗器械产品备案",short:"风险程度低，无需注册审评，提交备案资料后由市级监管部门存档备查",applicable:"风险程度低、实行常规管理可以保证安全有效的第一类医疗器械",org:"境内：设区的市级负责药品监督管理的部门；进口：国家药品监督管理局",deadline:"无审评时限。备案资料齐全、符合形式要求的，当场予以备案",result:"医疗器械备案编号与备案信息表（长期有效，管理类别调整或产品技术要求变化时需变更备案）",steps:[{no:"1",name:"产品研制与技术要求编制",org:"备案人",due:"自行安排",detail:"完成产品研制，编制产品技术要求（含可客观判定的功能性、安全性指标及检测方法），并同步开展风险管理活动。",basis:["cn-47","cn-essp","cn-tech-require"]},{no:"2",name:"产品检验",org:"备案人或受托检验机构",due:"自行安排",detail:"按照产品技术要求进行检验并形成检验报告。检验报告可以是备案人的自检报告，也可以是委托有资质的医疗器械检验机构出具的检验报告；检验用产品的生产应当符合生产质量管理规范的相关要求。",basis:["cn-47","cn-selfcheck"]},{no:"3",name:"临床评价",org:"备案人",due:"自行安排",detail:"除豁免情形外应当开展临床评价并提交临床评价资料。列入免于临床评价目录的产品可免于提交。",basis:["cn-47","cn-ce-guideline"]},{no:"4",name:"编制说明书与标签",org:"备案人",due:"自行安排",detail:"编制产品说明书和标签，内容应当符合条例及相关规定，并与产品技术要求一致。",basis:["cn-739","cn-labeling","cn-naming-guide"]},{no:"5",name:"提交备案资料",org:"备案人",due:"产品生产前",detail:"第一类医疗器械生产前，备案人应当向药品监督管理部门提交备案资料，获取备案编号。",basis:["cn-47"]},{no:"6",name:"形式审查与当场备案",org:"设区的市级药品监督管理部门",due:"资料齐全合规的当场办理",detail:"备案资料齐全、符合形式要求的，当场予以备案。备案资料不齐全或者不符合规定形式的，一次告知需要补正的全部内容；不予备案的，告知备案人并说明理由。",basis:["cn-47"]}],notes:["已备案的医疗器械管理类别调整为第二类或者第三类的，应当按照规定申请注册。","备案信息表中登载内容及备案的产品技术要求发生变化的，应当向原备案部门变更备案。","备案后监督中发现备案资料不规范的，药品监督管理部门应当责令备案人限期改正。"],basis:["cn-47","cn-739","cn-class1-2022"]},{id:"pw-class2",group:"常规路径",icon:"🏷️",name:"第二类医疗器械注册（境内）",short:"省级药品监督管理部门审评审批，技术审评 60 个工作日，注册证有效期 5 年",applicable:"具有中度风险，需要严格控制管理以保证安全有效的第二类医疗器械",org:"省、自治区、直辖市药品监督管理部门（技术审评：省级医疗器械技术审评机构）",deadline:"受理 5 个工作日；技术审评 60 个工作日；审批决定 20 个工作日；制证送达 10 个工作日",result:"医疗器械注册证及附件（产品技术要求），有效期 5 年",steps:[{no:"1",name:"产品研制与非临床研究",org:"申请人",due:"自行安排",detail:"完成产品研制，开展物理和化学性能、电气安全、辐射安全、软件、生物学特性、消毒灭菌、动物试验、稳定性等非临床研究，并形成产品风险管理资料。研究样品应当具有代表性和典型性。",basis:["cn-47","cn-essp","cn-tech-require"]},{no:"2",name:"产品检验",org:"申请人自检或受托检验机构",due:"自行安排",detail:"按照产品技术要求进行检验并提交检验报告。检验合格的，方可开展临床试验或者申请注册。采用自检的，应当符合注册自检管理规定对实验室与质量体系的要求。",basis:["cn-47","cn-selfcheck","cn-tech-require"]},{no:"3",name:"临床评价",org:"申请人",due:"自行安排",detail:"通过同品种医疗器械临床文献资料、临床数据进行分析评价，或者通过开展临床试验证明安全性与有效性。已有临床数据不足以确认安全有效的，应当开展临床试验。临床试验应当在备案的临床试验机构内进行，试验开始前向所在地省级药品监督管理部门备案。",basis:["cn-47","cn-ce-guideline","cn-gcp","cn-37"]},{no:"4",name:"编制申报资料",org:"申请人",due:"自行安排",detail:"按照 2021 年第 121 号公告要求，组织监管信息、综述资料、非临床资料、临床评价资料、产品说明书和标签样稿、质量管理体系文件六大模块资料，并逐项填写医疗器械安全和性能基本原则清单。",basis:["cn-nmpa-121","cn-essp","cn-essp-tech"]},{no:"5",name:"受理与形式审查",org:"省级药品监督管理部门",due:"5 个工作日内",detail:"申报资料齐全、符合形式审查要求的予以受理。资料不齐全或者不符合形式审查要求的，在 5 个工作日内一次告知需要补正的全部内容；逾期不告知的，自收到申报资料之日起即为受理。",basis:["cn-47"]},{no:"6",name:"转交技术审评",org:"受理部门",due:"受理之日起 3 个工作日内",detail:"药品监督管理部门自受理之日起 3 个工作日内将申请资料转交技术审评机构。",basis:["cn-47"]},{no:"7",name:"技术审评",org:"省级医疗器械技术审评机构",due:"60 个工作日（补正资料后 60 个工作日）",detail:"对产品的安全性、有效性、质量可控性进行技术审评。需要申请人补正资料的，一次告知需要补正的全部内容，申请人应当在 1 年内按照补正通知的要求一次提供补充资料。审评期间可就重大技术问题与申请人沟通交流。",basis:["cn-47","cn-comm"]},{no:"8",name:"注册质量管理体系核查",org:"省、自治区、直辖市药品监督管理部门",due:"核查时间不计入审评时限",detail:"对申请人质量管理体系进行核查，确认其与产品研制、生产实际相符。核查不通过，以及申请人拒绝接受现场检查的，作出不予注册的决定。",basis:["cn-47","cn-gmp","cn-gmp-2025"]},{no:"9",name:"审批决定",org:"省级药品监督管理部门",due:"收到审评意见之日起 20 个工作日内",detail:"对符合安全、有效、质量可控要求的，准予注册并发给医疗器械注册证，经核准的产品技术要求以附件形式发给申请人；不予注册的书面说明理由，并告知复议与诉讼权利。",basis:["cn-47","cn-739"]},{no:"10",name:"制证与送达",org:"省级药品监督管理部门",due:"作出审批决定之日起 10 个工作日内",detail:"作出医疗器械注册审批决定后 10 个工作日内颁发、送达有关行政许可证件。",basis:["cn-47"]},{no:"11",name:"领取注册证",org:"注册人",due:"注册证有效期 5 年",detail:"取得注册证后即可组织生产。生产前应当取得生产许可，并按规定赋码上传唯一标识数据。",basis:["cn-739","cn-53","cn-udi"]}],notes:["时限延长不得超过原时限的二分之一，须经技术机构负责人批准并书面告知申请人。","申请人补充资料、核查后整改、外聘专家咨询、药品与器械联合审评、中止审评审批程序、质量管理体系核查所占用的时间，均不计入工作时限。","对不予通过的审评结论，申请人可以在 15 日内提出异议，异议处理时间不计入审评时限。"],basis:["cn-47","cn-nmpa-121","cn-nmpa-122","cn-739"]},{id:"pw-class3",group:"常规路径",icon:"🧬",name:"第三类医疗器械注册（境内）",short:"国家药品监督管理局审评审批，技术审评 90 个工作日，体系核查由省级局实施",applicable:"具有较高风险，需要采取特别措施严格控制管理以保证安全有效的第三类医疗器械",org:"国家药品监督管理局（技术审评：国家药品监督管理局医疗器械技术审评中心）",deadline:"受理 5 个工作日；技术审评 90 个工作日；审批决定 20 个工作日；制证送达 10 个工作日",result:"医疗器械注册证及附件（产品技术要求），有效期 5 年",steps:[{no:"1",name:"产品研制与非临床研究",org:"申请人",due:"自行安排",detail:"完成产品研制与非临床研究，形成产品风险管理资料与非临床研究报告综述、研究方案和研究报告。",basis:["cn-47","cn-essp","cn-tech-require"]},{no:"2",name:"产品检验",org:"申请人自检或受托检验机构",due:"自行安排",detail:"按照产品技术要求进行检验并提交检验报告。检验合格的，方可开展临床试验或者申请注册。",basis:["cn-47","cn-selfcheck"]},{no:"3",name:"临床评价与临床试验",org:"申请人",due:"临床试验审批 60 日在先",detail:"开展临床评价。需开展临床试验且对人体具有较高风险的第三类医疗器械，应当先取得临床试验审批；临床试验应当在符合要求的三级甲等医疗机构开展。",basis:["cn-47","cn-gcp","cn-ce-guideline"]},{no:"4",name:"编制申报资料",org:"申请人",due:"自行安排",detail:"按照 2021 年第 121 号公告组织六大模块申报资料，并填写医疗器械安全和性能基本原则清单。涉及境外生产场地或关键原材料供应商数据的，可同步办理医疗器械主文档登记。",basis:["cn-nmpa-121","cn-essp","cn-master-doc"]},{no:"5",name:"受理与形式审查",org:"国家药品监督管理局",due:"5 个工作日内",detail:"申报资料齐全、符合形式审查要求的予以受理；资料不齐全或者不符合形式审查要求的，在 5 个工作日内一次告知需要补正的全部内容。",basis:["cn-47"]},{no:"6",name:"转交技术审评",org:"国家药品监督管理局",due:"受理之日起 3 个工作日内",detail:"自受理之日起 3 个工作日内将申请资料转交国家局器械审评中心。",basis:["cn-47"]},{no:"7",name:"技术审评",org:"国家局器械审评中心",due:"90 个工作日（补正资料后 60 个工作日）",detail:"对安全性、有效性、质量可控性进行技术审评。审评期间可开展沟通交流与专家咨询，就重大问题听取专家意见。",basis:["cn-47","cn-comm"]},{no:"8",name:"注册质量管理体系核查",org:"省级药品监督管理部门（国家局器械审评中心通知启动）",due:"通知 10 个工作日 / 省级局 30 个工作日完成",detail:"国家局器械审评中心应当在注册申请受理后 10 个工作日内通知相关省级药品监督管理部门启动核查；省级药品监督管理部门原则上在接到核查通知后 30 个工作日内完成核查，并将核查情况与结果反馈至国家局器械审评中心。核查时间不计入审评时限。",basis:["cn-47","cn-gmp-2025"]},{no:"9",name:"审批决定",org:"国家药品监督管理局",due:"收到审评意见之日起 20 个工作日内",detail:"符合要求的准予注册并发给医疗器械注册证；不予注册的书面说明理由并告知救济途径。",basis:["cn-47","cn-739"]},{no:"10",name:"制证与送达",org:"国家药品监督管理局",due:"作出审批决定之日起 10 个工作日内",detail:"10 个工作日内颁发、送达有关行政许可证件。",basis:["cn-47"]},{no:"11",name:"领取注册证",org:"注册人",due:"注册证有效期 5 年",detail:"取得注册证后组织生产，生产前取得生产许可，并按唯一标识制度要求赋码上传数据。",basis:["cn-739","cn-53","cn-udi"]}],notes:["境外申请人应当指定中国境内的企业法人作为代理人办理注册事项，并提交注册地或生产地主管部门准许上市的证明文件。","创新医疗器械、临床急需医疗器械可叠加创新特别审查或优先审批通道，缩短整体周期。","质量管理体系核查时间、补充资料时间均不计入审评时限，实际周期通常长于法定上限之和。"],basis:["cn-47","cn-nmpa-121","cn-nmpa-122","cn-739"]},{id:"pw-clinical",group:"前置许可",icon:"🧪",name:"第三类医疗器械临床试验审批",short:"对人体具有较高风险的第三类医疗器械，临床试验前须取得国家局批准",applicable:"列入需进行临床试验审批目录的第三类医疗器械（对人体具有较高风险）",org:"国家药品监督管理局（技术审评：国家局器械审评中心）",deadline:"自受理申请之日起 60 个工作日内作出是否同意的决定，逾期未通知的视为同意",result:"同意开展医疗器械临床试验的批准文件（临床试验应在符合要求的三级甲等医疗机构开展）",steps:[{no:"1",name:"提交临床试验申请",org:"申请人",due:"临床试验开展前",detail:"按照相关要求提交综述资料、研究资料、临床资料、产品说明书和标签样稿等申请资料。",basis:["cn-47","cn-gcp"]},{no:"2",name:"受理与形式审查",org:"国家药品监督管理局",due:"5 个工作日内",detail:"受理要求适用注册与备案管理办法关于受理的规定，资料不齐全或不符合形式审查要求的一次告知补正。",basis:["cn-47"]},{no:"3",name:"技术审评与决定",org:"国家局器械审评中心",due:"60 个工作日（补正资料后 40 个工作日）",detail:"对拟开展临床试验的医疗器械的风险程度、临床试验方案、临床受益与风险对比分析报告等进行综合分析，作出是否同意开展临床试验的决定，并通过网站通知申请人；逾期未通知的，视为同意。",basis:["cn-47"]},{no:"4",name:"临床试验备案与实施",org:"申办者",due:"试验开始前",detail:"临床试验开始前，申办者应当向所在地省级药品监督管理部门备案；试验在具备相应条件并按规定备案的医疗器械临床试验机构内进行，试验用器械的生产应当符合生产质量管理规范的相关要求。",basis:["cn-gcp","cn-37"]}],notes:["需进行临床试验审批的第三类医疗器械临床试验应在符合要求的三级甲等医疗机构开展。","临床试验期间出现严重不良事件或其他严重安全性风险信息，申办者应当按规定报告并采取风险控制措施。"],basis:["cn-47","cn-gcp","cn-37"]},{id:"pw-innovation",group:"加速通道",icon:"💡",name:"创新医疗器械特别审查",short:"国内首创、国际领先且具显著临床价值的产品，可获早期介入与专人指导",applicable:"同时满足：① 拥有产品核心技术发明专利权（申请须在专利授权公告日起 5 年内），或专利已公开并出具载明新颖性与创造性的检索报告；② 已完成前期研究并具有基本定型产品，研究过程真实受控、数据完整可溯源；③ 主要工作原理或作用机理为国内首创，性能或安全性与同类产品比较有根本性改进，技术上处于国际领先水平，且具有显著临床应用价值",org:"境内申请人向所在地省级药品监督管理部门提出，境外申请人向国家药品监督管理局提出",deadline:"省级局初审 20 个工作日；后续审查与公示按特别审查程序规定执行",result:"创新医疗器械特别审查意见通知单，纳入创新产品注册程序并一并界定管理类别",steps:[{no:"1",name:"提交创新审查申请",org:"申请人",due:"产品基本定型后",detail:"境内申请人向所在地省级药品监督管理部门提出创新医疗器械特别审查申请；境外申请人向国家药品监督管理局提出。",basis:["cn-innovation"]},{no:"2",name:"省级初审",org:"省级药品监督管理部门",due:"20 个工作日内",detail:"对申报项目是否符合特别审查程序规定条件进行初审并出具初审意见。不符合的书面告知申请人；符合的，将申报资料与初审意见一并报送国家药品监督管理局行政事项受理服务和投诉举报中心。",basis:["cn-innovation"]},{no:"3",name:"专家审查与公示",org:"创新医疗器械审查办公室",due:"按程序规定执行",detail:"组织专家对产品是否属于国内首创、国际领先、具显著临床价值进行审查；经审查拟同意的予以公示，公示无异议后出具特别审查意见。所申请创新医疗器械的管理属性存在疑问的，应当先进行属性界定。",basis:["cn-innovation"]},{no:"4",name:"纳入创新通道与专人指导",org:"国家药品监督管理局及相关技术机构",due:"纳入后持续",detail:"按各自职责指定专人负责、及时沟通、提供指导。国家局器械审评中心可与申请人在注册申请受理前及技术审评过程中，就产品研制中的重大技术问题、重大安全性问题、临床试验方案、阶段性临床试验结果的总结与评价等沟通交流。",basis:["cn-innovation","cn-47","cn-comm"]},{no:"5",name:"优先审评审批",org:"国家局器械审评中心",due:"通知纳入通道后",detail:"注册申请进入优先审评审批，检验、体系核查、技术审评各环节优先安排。",basis:["cn-innovation","cn-47"]},{no:"6",name:"提交注册申请",org:"申请人",due:"规定期限内",detail:"纳入创新产品注册程序的医疗器械，申请人应当在规定期限内提出注册申请，逾期未提出的不再适用该程序。",basis:["cn-47"]}],notes:["纳入后申请人主动要求终止，或国家药品监督管理局发现不再符合要求的，终止创新产品注册程序并告知申请人。","发明专利授权公告日起 5 年的时限是硬性门槛，建议在专利授权后立即启动专利布局与申报节奏规划。"],basis:["cn-innovation","cn-47","cn-innovate-2025"]},{id:"pw-priority",group:"加速通道",icon:"⚡",name:"医疗器械优先审批",short:"临床急需、列入国家科技重大专项或优先审批目录的产品，优先审评与优先核查",applicable:"① 诊断或治疗罕见病、恶性肿瘤且具有明显临床优势，诊断或治疗老年人特有和多发疾病且目前尚无有效诊断或治疗手段，专用于儿童且具有明显临床优势，或者临床急需且在我国尚无同品种产品获准注册；② 列入国家科技重大专项或者国家重点研发计划；③ 列入《优先审批高端医疗器械目录》等其他情形",org:"国家药品监督管理局（审核：国家局组织专家或国家局器械审评中心）",deadline:"按注册申请各环节时限执行，但全程优先安排",result:"纳入优先审批程序，注册申请优先审评审批，体系核查优先安排",steps:[{no:"1",name:"同步提出优先审批申请",org:"申请人",due:"提出注册申请时一并提出",detail:"申请适用优先审批程序的，应当在提出医疗器械注册申请时，向国家药品监督管理局提出申请。",basis:["cn-priority","cn-47"]},{no:"2",name:"审核与论证",org:"国家药品监督管理局",due:"按程序规定执行",detail:"属于临床急需等第一项情形的，由国家药品监督管理局组织专家审核；属于国家科技重大专项等第二项情形的，由国家局器械审评中心审核；属于其他情形的，广泛听取意见并组织专家论证后确定是否纳入。",basis:["cn-priority","cn-47"]},{no:"3",name:"优先审评审批",org:"国家药品监督管理局及相关技术机构",due:"纳入后全程优先",detail:"对纳入优先审批程序的医疗器械注册申请，优先进行审评审批；省级药品监督管理部门优先安排注册质量管理体系核查。",basis:["cn-priority","cn-47"]},{no:"4",name:"专项沟通交流",org:"国家局器械审评中心",due:"技术审评过程中",detail:"在对纳入优先审批程序的产品开展技术审评过程中，应当按规定积极与申请人沟通交流，必要时可安排专项交流。",basis:["cn-priority","cn-comm"]}],notes:["优先审批与创新特别审查属于不同通道，符合条件的产品需分别提出申请，不可自动转换。","《优先审批高端医疗器械目录》由动态调整，申报前应核对最新版本。"],basis:["cn-priority","cn-47","cn-high-end"]},{id:"pw-emergency",group:"加速通道",icon:"🚨",name:"医疗器械应急注册",short:"突发公共卫生事件应急所需产品，检验、体系核查、技术审评并行推进",applicable:"突发公共卫生事件应急所需，且在我国境内尚无同类产品上市，或者虽已有同类产品上市但产品供应不能满足突发公共卫生事件应急处理需要",org:"国家药品监督管理局",deadline:"随到随审，检验、体系核查与技术审评并行开展",result:"应急注册的医疗器械注册证",steps:[{no:"1",name:"提出应急注册申请",org:"申请人",due:"应急响应期间",detail:"申请人向国家药品监督管理局提出应急注册申请，符合条件的纳入应急注册程序。",basis:["cn-emergency","cn-47"]},{no:"2",name:"并行办理与随到随审",org:"国家药品监督管理局及相关技术机构",due:"按应急响应要求",detail:"按照统一指挥、早期介入、随到随审、科学审批的要求办理，并行开展医疗器械产品检验、体系核查、技术审评等工作。",basis:["cn-emergency","cn-47"]},{no:"3",name:"附条件批准衔接",org:"国家药品监督管理局",due:"审评结论形成时",detail:"对属于急需情形的产品，可依法作出附条件批准决定，并在注册证中载明上市后需要继续完成的研究工作及完成时限。",basis:["cn-47","cn-emergency-use"]}],notes:["应急注册以突发公共卫生事件应急响应为适用前提，非应急状态下不适用。","紧急使用与应急注册是不同制度：列入紧急使用范围的，可按紧急使用管理规定使用，但不等同于取得注册证。"],basis:["cn-emergency","cn-47","cn-emergency-use"]},{id:"pw-conditional",group:"加速通道",icon:"🧾",name:"附条件批准",short:"急需产品先批准后补证据，注册证载明有效期与上市后研究义务",applicable:"用于治疗罕见疾病、严重危及生命且尚无有效治疗手段的疾病，以及应对公共卫生事件等急需的医疗器械",org:"国家药品监督管理局",deadline:"随注册申请审评程序执行",result:"附条件批准的医疗器械注册证，载明有效期、上市后需要继续完成的研究工作及完成时限",steps:[{no:"1",name:"作出附条件批准决定",org:"国家药品监督管理局",due:"注册申请审评过程中",detail:"对符合情形的医疗器械，药品监督管理部门可以作出附条件批准决定，并在医疗器械注册证中载明有效期、上市后需要继续完成的研究工作及完成时限等相关事项。",basis:["cn-47","cn-conditional"]},{no:"2",name:"上市后数据收集与监测",org:"注册人",due:"上市后持续",detail:"注册人应当在医疗器械上市后收集受益和风险相关数据，持续对产品的受益和风险开展监测与评估，采取有效措施主动管控风险。",basis:["cn-47","cn-adr","cn-prr"]},{no:"3",name:"按期完成研究并提交资料",org:"注册人",due:"注册证载明期限内",detail:"在规定期限内按照要求完成研究并提交相关资料。",basis:["cn-47","cn-conditional"]},{no:"4",name:"退出机制",org:"注册人 / 国家药品监督管理局",due:"逾期触发",detail:"逾期未按照要求完成研究，或者不能证明受益大于风险的，注册人应当及时申请办理注册证注销手续，药品监督管理部门可以依法注销医疗器械注册证。",basis:["cn-47","cn-conditional"]}],notes:["附条件批准并非免于审评，而是先批准后补证据，上市后研究义务具有强制性与时限约束。","附条件批准的医疗器械，未在规定期限内完成注册证载明事项的，不予延续注册。"],basis:["cn-47","cn-conditional"]},{id:"pw-change",group:"证后维护",icon:"🔧",name:"变更注册与变更备案",short:"区分实质性变化与非实质性变化，走变更注册或 30 日内变更备案",applicable:"已注册的第二类、第三类医疗器械产品在设计、原材料、生产工艺、适用范围、使用方法等方面发生变化",org:"原注册部门（变更注册）／原注册部门（变更备案）",deadline:"变更注册按注册程序各环节时限执行；非实质性变化应当在变化之日起 30 日内备案",result:"医疗器械变更注册文件（与原注册证合并使用）或变更备案记录",steps:[{no:"1",name:"变化识别与分类评估",org:"注册人",due:"变化发生后立即",detail:"注册人应当主动开展上市后研究，对安全性、有效性和质量可控性进一步确认。识别变化是否属于实质性变化，建议建立变更分类评估程序并留痕。",basis:["cn-47"]},{no:"2",name:"变更注册申请",org:"注册人",due:"实施变化前",detail:"设计、原材料、生产工艺、适用范围、使用方法等发生实质性变化，有可能影响安全有效的，应当向原注册部门申请办理变更注册手续。注册证载明的产品名称、型号、规格、结构及组成、适用范围、产品技术要求、进口医疗器械生产地址等属于需要办理变更注册的事项。",basis:["cn-47"]},{no:"3",name:"变更注册技术审评",org:"技术审评机构",due:"按注册程序时限",detail:"重点针对变化部分进行审评，对变化后产品是否安全、有效、质量可控形成审评意见。认为有必要核查质量管理体系的，组织开展核查。",basis:["cn-47"]},{no:"4",name:"变更备案",org:"注册人",due:"变化之日起 30 日内",detail:"发生非实质性变化的，应当在变化之日起 30 日内向原注册部门备案。注册人名称和住所、代理人名称和住所等属于备案事项；境内医疗器械生产地址变更的，应当在办理相应的生产许可变更后办理备案。",basis:["cn-47"]}],notes:["医疗器械变更注册文件与原医疗器械注册证合并使用，有效期截止日期与原注册证相同。","未按照要求对发生变化进行备案的，责令限期改正；逾期不改正的，处 1 万元以上 3 万元以下罚款。","发生其他变化的，注册人应当按照质量管理体系要求做好相关工作，并按规定向药品监督管理部门报告。"],basis:["cn-47"]},{id:"pw-renew",group:"证后维护",icon:"🔁",name:"延续注册",short:"注册证有效期 5 年，届满 6 个月前提出延续申请，逾期视为放弃",applicable:"医疗器械注册证有效期届满需要继续销售的注册产品",org:"原注册部门",deadline:"应当在注册证有效期届满 6 个月前提出申请；除法定不予延续情形外，应当在有效期届满前作出准予延续的决定",result:"延续注册的医疗器械注册证",steps:[{no:"1",name:"到期提醒与准备",org:"注册人",due:"有效期届满 6 个月前",detail:"建立注册证有效期台账，在届满 6 个月前启动延续注册准备。重点核查是否有新的医疗器械强制性标准发布实施，产品能否达到新要求。",basis:["cn-47","cn-nmpa-2023-14"]},{no:"2",name:"提交延续注册申请",org:"注册人",due:"有效期届满 6 个月前",detail:"向原注册部门申请延续注册，并按照相关要求提交申请资料。",basis:["cn-47"]},{no:"3",name:"审评与作出决定",org:"原注册部门",due:"有效期届满前作出决定",detail:"除法定不予延续情形外，接到延续注册申请的药品监督管理部门应当在注册证有效期届满前作出准予延续的决定；逾期未作决定的，视为准予延续。",basis:["cn-47"]},{no:"4",name:"新证有效期衔接",org:"注册人",due:"批准时",detail:"延续注册的批准时间在原注册证有效期内的，延续注册的注册证有效期起始日为原注册证到期日次日；批准时间不在原注册证有效期内的，起始日为批准延续注册的日期。",basis:["cn-47"]}],notes:["不予延续注册的三种法定情形：未在规定期限内提出延续注册申请；新的强制性标准发布实施而产品不能达到新要求；附条件批准的医疗器械未在规定期限内完成注册证载明事项。","已注册医疗器械管理类别由高类别调整为低类别的，注册证在有效期内继续有效；有效期届满需要延续的，按照调整后的类别申请延续注册或者进行备案。管理类别由低调整为高的，应当按照改变后的类别重新申请注册。"],basis:["cn-47","cn-739","cn-nmpa-2023-14"]}],dossier:{no:"03",title:"注册申报资料清单",basis:"cn-nmpa-121",intro:"依据国家药品监督管理局 2021 年第 121 号公告，第二类、第三类医疗器械注册、变更注册、延续注册的申报资料分为六大模块。下列清单可用于逐项勾选与责任分工；具体子项与格式要求以公告附件及相应产品注册审查指导原则为准。",groups:[{no:"一",name:"监管信息",items:["申请表","术语、缩写词列表","产品列表","关联文件","申报前与监管机构的联系情况和沟通记录","符合性声明"]},{no:"二",name:"综述资料",items:["概述","产品描述","适用范围和禁忌证（含适用人群）","申报产品上市历史","其他需要说明的内容"]},{no:"三",name:"非临床资料",items:["产品风险管理资料","医疗器械安全和性能基本原则清单（EP 清单）","产品技术要求及检验报告","研究资料（物理和化学性能、电气安全、辐射安全、软件、生物学特性、生物源材料安全
