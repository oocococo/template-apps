有效期"],prefer:"使用期限 / 有效期",msg:"效期存在多种表述并存。",fix:"「货架期」「保质期」非法规规范用语，建议统一为「使用期限」（有源、可重复使用器械）或「有效期」（无菌、一次性使用器械），并与产品技术要求、说明书保持一致。",basis:["cn-tech-require"]},{id:"tm-ae",name:"不良事件表述",level:"中",variants:["不良事故","不良事件","器械不良事件"],wrong:["不良事故"],prefer:"医疗器械不良事件",msg:"使用了非规范写法「不良事故」。",fix:"法规口径为「医疗器械不良事件」，请全文替换，并同步核对报告时限与「可疑即报」原则。",basis:["cn-adr"]},{id:"tm-udi",name:"唯一标识表述",level:"低",variants:["UDI","唯一标识","器械唯一标识"],prefer:"医疗器械唯一标识（UDI）",msg:"唯一标识存在缩写与全称混用。",fix:"首次出现写全称「医疗器械唯一标识（UDI）」，其后使用「UDI」，并区分产品标识（DI）与生产标识（PI）。",basis:["cn-udi"]},{id:"tm-person",name:"申报阶段主体表述",level:"中",variants:["申请人","注册人","备案人","持有人"],prefer:"按阶段区分使用",msg:"申报阶段主体称谓混用。",fix:"申请注册阶段用「申请人」，取证后用「注册人」「备案人」；「持有人」为不良事件监测与上市后法规中的统称，勿与注册人混用造成责任主体歧义。",basis:["cn-739","cn-47","cn-adr"]}],deadlines:[{id:"dl-recall",name:"召回通知时限",level:"高",when:["召回"],cite:"《医疗器械召回管理办法》第十五条",basis:["cn-recall"],checks:[{label:"一级召回通知时限",re:/(一|1)\s*级召回[^。；;\n]{0,24}?(\d+)\s*(?:个)?(?:日|天)/g,allowed:["1"],expect:"一级召回应当在 1 日内通知到经营企业、使用单位或告知使用者"},{label:"二级召回通知时限",re:/(二|2)\s*级召回[^。；;\n]{0,24}?(\d+)\s*(?:个)?(?:日|天)/g,allowed:["3"],expect:"二级召回应当在 3 日内通知"},{label:"三级召回通知时限",re:/(三|3)\s*级召回[^。；;\n]{0,24}?(\d+)\s*(?:个)?(?:日|天)/g,allowed:["7"],expect:"三级召回应当在 7 日内通知"}],missing:{level:"高",msg:"文档涉及召回但未出现法规规定的通知时限（1 / 3 / 7 日）。",fix:"补充召回分级标准与各等级的通知时限，以及召回事件报告表、调查评估报告与召回计划的提交时限。"}},{id:"dl-ae",name:"不良事件报告时限",level:"高",when:["不良事件"],cite:"《医疗器械不良事件监测和再评价管理办法》第二十五条",basis:["cn-adr"],checks:[{label:"严重伤害事件报告时限",skip:/境外|出口|海外/,re:/(严重伤害|严重损伤)[^。；;\n]{0,24}?(\d+)\s*(?:个)?(?:日|天)/g,allowed:["20"],expect:"导致严重伤害、可能导致严重伤害或死亡的应当在 20 日内报告"},{label:"导致死亡事件报告时限",skip:/境外|出口|海外/,re:/(死亡|致死)[^。；;\n]{0,24}?(\d+)\s*(?:个)?(?:日|天)/g,allowed:["7"],expect:"导致死亡的可疑不良事件应当在 7 日内报告"}],missing:{level:"高",msg:"文档涉及不良事件但未出现法规规定的报告时限（死亡 7 日 / 严重伤害 20 日）。",fix:"补充个例不良事件的报告时限、境外事件的 30 日报告要求，以及评价结果 30 日 / 45 日的提交时限。"}},{id:"dl-renew",name:"延续注册申请时限",level:"中",when:["延续注册"],cite:"《医疗器械注册与备案管理办法》第五十七条",basis:["cn-47"],checks:[{label:"延续注册申请时限",g:1,unit:"个月",re:/延续注册[^。；;\n]{0,30}?(\d+)\s*(?:个)?\s*月/g,allowed:["6"],expect:"应当在注册证有效期届满 6 个月前提出延续注册申请"}],missing:{level:"中",msg:"文档涉及延续注册但未写明申请时限。",fix:"写明「应当在注册证有效期届满 6 个月前提出延续注册申请」，并说明逾期未申请的后果。"}}],sampleDocs:[{id:"sample-tech",name:"示例 · 便携式动态心电记录仪 产品技术要求（含待整改项）",type:"tech",note:"示例文本刻意保留了若干常见缺陷，用于演示审查引擎的检出能力。",text:["便携式动态心电记录仪 产品技术要求","文件编号：QR-TR-XG-01    版本：V1.0    编制日期：2024.3.1","","1 产品名称与型号规格","1.1 产品名称：便携式动态心电记录仪（通用名称：动态心电记录仪）","1.2 型号规格：XG-100、XG-200、XG-300，三款型号的差异仅在于存储容量。","","2 性能指标","2.1 输入动态范围：不小于 5 mV。","2.2 频率响应：0.05 Hz 至 100 Hz。","2.3 采样率：250 Hz。","2.4 输入阻抗：不小于 10 MΩ。","2.5 噪声电平：不大于 30 μV。","2.6 记录通道数：3 通道。","2.7 整机厚度：2","2.8 电池续航时间：不小于 24 小时。","","3 检验方法","3.1 按 GB 9706.1 与 YY 9706.102-2021 规定的方法进行检验。","3.2 心电性能按 YY 0885-2013 规定的方法进行检验。","3.3 数据接口按 ISO 14971 的风险控制措施要求进行验证。","","4 判定标准","4.1 各项性能指标均符合本技术要求规定的，判定为合格。","4.2 本产品采用先进的数字滤波算法，绝对安全可靠，任何人使用都不会受到伤害。","4.3 部分环境试验项目的判定依据见【】。","","5 附录","附录 A 编制说明：XXXX","附录 B 数据导出格式说明：导出记录的解析方法参见 5.2 节。","","6 其他说明","6.1 本产品涉及软件，软件版本随固件发布更新，具体版本号见使用说明书。","6.2 本产品的生物相容性评价参照相关生物学评价标准执行。","6.3 说明书与标签样稿中应当包含产品名称、适用范围、禁忌症、注意事项与警示信息。","6.4 申报资料中的患者姓名字段在导出时应当加密处理。","6.5 本技术要求依据《医疗器械监督管理条例》与《医疗器械注册与备案管理办法》编制。"].join(`
`)},{id:"sample-pm",name:"示例 · 医疗器械不良事件监测与召回管理程序（含时限错误）",type:"pm",note:"示例文本刻意在时限与用语上设置了错误，用于演示时限口径核对能力。",text:["医疗器械不良事件监测与召回管理程序","文件编号：QP-PM-07    版本：V2.0    生效日期：2024/5/1    页码：1/4","","1 目的","规范本公司医疗器械不良事故的收集、报告、评价与控制，明确医疗器械召回的实施流程，确保上市后风险管理有效运行。制造商与生产企业应当共同履行本程序规定的职责。","","2 适用范围","适用于本公司生产及委托生产的全部第二类、第三类医疗器械。委托生产的产品,其质量协议中应当约定受托方的配合义务。","","3 职责","3.1 质量部负责不良事件信息的收集、调查与评价，负责召回的组织实施。","3.2 销售部负责销售流向记录与召回通知的送达，保证产品可追溯。","3.3 管理者代表负责审批召回等级与召回计划。","","4 不良事件报告与评价","4.1 各部门发现或者获知可疑医疗器械不良事件的，应当在 1 个工作日内报告质量部。","4.2 导致死亡的不良事件，应当在 7 日内通过国家医疗器械不良事件监测信息系统报告。","4.3 导致严重伤害、可能导致严重伤害或者死亡的不良事件，应当在 30 日内报告。","4.4 境外发生的导致或者可能导致严重伤害或者死亡的不良事件的，自发现或者获知之日起 30 日内报告。","4.5 群体不良事件的，应当在 12 小时内通过电话或者传真方式报告，并在 24 小时内按个例事件报告。","","5 风险控制与再评价","5.1 评价结果表明产品存在危及人身安全缺陷的，应当立即停止生产与销售，并采取修改说明书、召回等措施。","5.2 需要原注册机关审批的，按规定提交变更申请。","","6 召回","6.1 根据缺陷的严重程度，召回分为一级召回、二级召回、三级召回。","6.2 一级召回应当在 3 日内、二级召回应当在 3 日内、三级召回应当在 7 日内，通知到有关经营企业、使用单位或者告知使用者。","6.3 作出召回决定后，应当立即填写召回事件报告表，并在 5 个工作日内将调查评估报告和召回计划报所在地省级药品监督管理部门备案。","6.4 召回完成后 10 日内提交召回总结报告。","6.5 召回相关资料与记录应当保存至注册证失效后 5 年。","","7 记录保存","7.1 不良事件监测记录应当保存至医疗器械有效期后 2 年；无有效期的保存期限不得少于 5 年；植入性医疗器械的监测记录应当永久保存。","7.2 本程序引用的最新版标准与相关法规要求，由质量部每年度评审一次并更新。","","8 说明","8.1 延续注册应当在注册证有效期届满前 3 个月提出申请。","8.2 本程序未规定事项，按《医疗器械监督管理条例》等有关规定执行。"].join(`
`)}]},window.MDR_SELFCHECK={version:"1.0.0",updatedAt:"2026-09-17",notice:"本清单由本地规则引擎按选定申报路径自动组装，用于申报前的内部防漏核对。条目内容为法规要点提炼，不构成官方逐字全文，亦不替代注册审查指导原则、立卷审查要求与监管机构最新口径。各项判定须由具备资质的 RA/QA 人员结合产品实际复核确认。",levels:[{id:"red",name:"红线项",icon:"⛔",weight:30,desc:"不满足将直接导致不予受理、不予注册或体系核查不通过，必须在提交申报前彻底解决"},{id:"key",name:"关键项",icon:"⚠️",weight:10,desc:"直接影响审评结论，缺失或存在缺陷会引发发补，显著延长审评周期"},{id:"adv",name:"建议项",icon:"💡",weight:3,desc:"不构成硬性缺陷，但完善后可降低沟通成本、提高一次性通过概率"}],stages:[{id:"pre",no:"一",icon:"🧭",name:"立项与路径决策",desc:"属性界定、分类判定、路径选择与资源准备"},{id:"study",no:"二",icon:"🔬",name:"研究与验证",desc:"技术要求、检验、非临床研究、临床评价与风险管理"},{id:"dossier",no:"三",icon:"📚",name:"资料编制",desc:"121 号公告六大模块的齐备性、规范性与全册一致性"},{id:"submit",no:"四",icon:"📤",name:"申报与受理",desc:"电子申报、费用、体系核查准备与沟通交流"},{id:"post",no:"五",icon:"🔄",name:"审评应对与上市后准备",desc:"发补响应、整改闭环与取得注册证后的法定义务"}],pathRules:[{id:"pw-class1",mode:"full",label:"第一类 · 备案",hint:"第一类产品实行备案管理，免于临床评价与注册质量管理体系核查，自检重点在备案资料完整性与分类准确性。"},{id:"pw-class2",mode:"full",label:"第二类 · 注册",hint:"第二类产品由省级药品监督管理部门审评审批，需关注省内办事指南对资料格式的补充要求。"},{id:"pw-class3",mode:"full",label:"第三类 · 注册",hint:"第三类产品由国家药监局审评审批，技术审评时限 90 个工作日，体系核查与临床评价要求最为严格。"},{id:"pw-clinical",mode:"full",label:"第三类 · 临床试验审批",hint:"列入需进行临床试验审批目录的第三类器械，须先取得临床试验批准再开展试验。"},{id:"pw-innovation",mode:"full",label:"创新 · 特别审查",hint:"须先通过创新医疗器械审查认定，方可进入特别审查通道；认定材料与专利、临床价值论证是前置门槛。"},{id:"pw-priority",mode:"full",label:"优先审批",hint:"适用于列入优先审批医疗器械目录、治疗罕见病/恶性肿瘤/老年人特有疾病等情形，需提交优先审批理由及支持性资料。"},{id:"pw-emergency",mode:"full",label:"应急审批",hint:"适用于突发公共卫生事件应急所需器械，需先取得应急审批认定，可附条件批准并压缩审评时限。"},{id:"pw-conditional",mode:"full",label:"附条件批准",hint:"适用于临床急需且现有手段无法满足的情形，上市后须完成确证性研究并履行承诺事项。"},{id:"pw-change",mode:"delta",label:"变更注册与备案",hint:"变更注册为增量申报，仅需针对发生变化的部分提交资料，并证明变更未对安全有效性产生不利影响。"},{id:"pw-renew",mode:"delta",label:"延续注册",hint:"延续注册须在注册证有效期届满 6 个月前提出，核心是证明产品无实质变化且上市后风险可控。"}],items:[{id:"sc-attr",stage:"pre",level:"red",title:"产品属性已界定",ask:"本产品是否属于《医疗器械监督管理条例》定义的医疗器械？是否已排除药品、消字号、普通电子产品的可能？",detail:"属性界定是所有后续工作的起点。原理、结构、用途三者共同决定属性；同一产品若宣称不同预期用途，可能落入不同监管路径。存在争议时应当申请属性界定或分类界定，不要凭经验推定。",evidence:["产品预期用途与作用原理说明","与同类已上市产品的对比分析","属性界定申请或咨询答复记录"],pitfall:"按非医疗器械研发上市，被监管部门认定应按医疗器械管理，须重新走注册程序，前期投入全部作废。",basis:["cn-739","cn-15"]},{id:"sc-classify",stage:"pre",level:"red",title:"管理类别已确定",ask:"产品已确定属于第一类、第二类还是第三类？是否已在《医疗器械分类目录》中找到对应的一级、二级产品类别？",detail:"管理类别决定申报路径、审批层级与资料深度。目录内有对应类别的可直接归类；目录外、新研制的，应当申请分类界定。分类判定需结合产品的接触方式、使用时长、有源无源、是否侵入等判定要素综合确定。",evidence:["分类目录对应条目截图与编码","分类界定告知书（目录外产品）","分类判定要素逐项分析记录"],pitfall:"按第二类申报，审评中被认定应按第三类管理，须重新申报，已缴费用与已耗时不予保留。",basis:["cn-15","cn-catalog","cn-739"]},{id:"sc-path",stage:"pre",level:"red",title:"申报路径与审批部门已确认",ask:"是否已明确向哪一级药品监督管理部门申报、走常规路径还是加速通道？是否已核对受理机构的办事指南？",detail:"第一类备案至设区的市级药监部门；第二类注册至省级药监部门；第三类注册至国家药品监督管理局。申报材料格式除遵循 121 号公告外，还须符合受理机构办事指南的补充要求。",evidence:["申报路径确认记录","受理机构办事指南核对清单","审批部门与联系方式"],pitfall:"材料按国家统一格式准备，但未按省级局办事指南补充要求装订，受理环节被退回。",basis:["cn-47","cn-nmpa-121","cn-class1-2022"]},{id:"sc-naming",stage:"pre",level:"key",title:"产品通用名称合规",ask:"产品通用名称是否符合《医疗器械通用名称命名规则》与命名指导原则？是否已避免使用商品名、商标或暗示疗效的词汇？",detail:"通用名称由核心词与特征词构成，应当符合命名规则、命名术语指南与相应产品的命名指导原则。名称中的结构、材料、技术特点描述应当与实际产品一致，且全册资料中的名称必须统一。",evidence:["通用名称命名依据说明","命名术语对照表","全册资料名称一致性自查记录"],pitfall:"名称含夸大或绝对化用语、含商标，或与应用范围、技术要求不一致，被要求改名并同步修改全册资料。",basis:["cn-19","cn-naming-guide"]},{id:"sc-qms",stage:"pre",level:"red",title:"质量管理体系已建立并有效运行",ask:"是否已按 GMP 及其适用附录建立质量管理体系？是否已有实际运行记录（至少覆盖设计开发、采购、生产、检验全过程）？",detail:"注册质量管理体系核查关注的是体系是否真实、有效运行，而非文件是否齐备。体系文件与实际运行不一致、记录后补、设计与开发过程无留痕，是核查不通过的主要情形。体系须覆盖申报产品的完整过程，并保留可追溯的记录。",evidence:["质量手册与程序文件清单","设计开发输入输出与评审验证记录","采购、生产、检验记录","内审与管理评审记录"],pitfall:"体系文件齐备但无实际运行记录，或记录内容与申报资料矛盾，体系核查结论为不通过，注册申请被终止。",basis:["cn-gmp-2025","cn-gmp","cn-rsl","cn-gbt42061"]},{id:"sc-gmp-appendix",stage:"pre",level:"key",title:"适用 GMP 附录已识别并落实",ask:"产品是否适用无菌、植入性、体外诊断试剂或独立软件等专项附录？相应特殊要求是否已在体系中落实？",detail:"医疗器械生产质量管理规范配套四个附录（无菌、植入性、体外诊断试剂、独立软件），在通用要求之外增加洁净度、生物安全、软件生存周期等特殊控制。附录判断依据为产品特性，与是否为独立软件、是否无菌提供直接相关。",evidence:["附录适用性判定记录","洁净区监测记录（如适用）","软件生存周期过程文件（如适用）"],pitfall:"有源无菌产品未落实无菌附录要求，或含软件组件产品未落实独立软件附录要求，核查时被判定关键项目不符合。",basis:["cn-gmp-aseptic","cn-gmp-implant","cn-gmp-ivd","cn-sw-appendix"]},{id:"sc-sites",stage:"pre",level:"key",title:"生产场地与生产资质已落实",ask:"生产地址是否与实际生产场地一致？是否已取得相应生产许可或完成第一类生产备案？是否已完成生产许可的变更？",detail:"注册申请人应当具备与产品相适应的生产条件。第二类、第三类需取得医疗器械生产许可证，第一类需完成生产备案。生产地址、生产范围必须覆盖申报产品；若注册申请人与生产企业不一致（委托生产），须另行管理。",evidence:["生产许可证或生产备案凭证","生产场地平面图与工艺布局图","生产设备清单"],pitfall:"注册申请人与实际生产企业不一致但未办理委托生产备案，或生产范围未覆盖申报产品，受理环节即被退回。",basis:["cn-53","cn-gmp-2025"]},{id:"sc-entrust",stage:"pre",level:"key",title:"委托生产安排已合规",ask:"如采用委托生产，双方是否已签订质量协议？受托方是否具备相应生产范围与资质？是否已办理委托生产备案？",detail:"委托生产应当签订明确质量责任的委托生产质量协议，受托方须持有相应生产许可。注册申请人（委托方）对产品质量承担全部法律责任。研发阶段已建立的技术转移文件应当完整移交给受托方。",evidence:["委托生产质量协议","受托方生产许可证","委托生产备案凭证","技术转移文件清单"],pitfall:"质量协议仅约定商务条款未明确质量责任划分，或受托方生产范围不覆盖申报产品，注册申请被退回。",basis:["cn-53","cn-entrust-agreement"],not:["pw-class1"]},{id:"sc-selfcheck-plan",stage:"pre",level:"key",title:"注册自检安排已决策",ask:"产品是否采用自检方式出具检验报告？自检实验室的能力、人员与体系是否满足要求？",detail:"注册申请人可选择自行检验（注册自检）或委托有资质的检验机构检验。采用自检的，自检能力须经确认，检验人员、设备、方法、环境与记录管理均须符合要求，并接受注册自检核查。自检报告与申报资料中其他数据必须一致。",evidence:["自检能力确认报告","检验人员资质与培训记录","检验设备计量校准证书","自检方法验证记录"],pitfall:"宣称自检但实验室未建立相应质量管理体系，或检验方法与产品技术要求不一致，注册自检核查不通过。",basis:["cn-selfcheck","cn-selfcheck-check-2025"],not:["pw-class1"]},{id:"sc-innovation-qual",stage:"pre",level:"red",title:"创新医疗器械资格已取得",ask:"是否已证明产品具有核心技术发明专利、属于国内首创、国际领先且具有显著临床应用价值？是否已通过创新审查认定？",detail:"创新医疗器械特别审查需同时满足三个条件：申请人掌握核心技术发明专利；产品主要工作原理或作用机理为国内首创、性能或安全性有根本性改进、技术上处于国际领先；具有显著临床应用价值。必须先取得创新审查认定，才能进入特别审查通道。",evidence:["发明专利证书与权利要求书","国内外同类产品技术对比分析","临床应用价值论证报告","创新审查认定文件"],pitfall:"仅有实用新型专利或外观专利，或专利尚未授权，不满足创新审查认定的硬性条件。",basis:["cn-innovation","cn-innovate-2025"],paths:["pw-innovation"]},{id:"sc-priority-qual",stage:"pre",level:"key",title:"优先审批理由与支持资料已备齐",ask:"产品是否属于优先审批目录内品种，或属于治疗罕见病、恶性肿瘤、老年人特有及多发病等情形？支撑资料是否充分？",detail:"优先审批适用于列入优先审批医疗器械目录的产品，以及诊断或治疗罕见病、恶性肿瘤且具有明显临床优势，或治疗老年人特有和多发疾病且具有明显临床优势等情形。理由陈述须有流行病学数据、临床需求分析与现有手段局限性对比作为支撑。",evidence:["优先审批理由论证报告","流行病学与临床需求数据","现有诊疗手段局限性的文献综述"],pitfall:"仅笼统陈述临床急需，未提供流行病学数据或与现有手段的对比分析，优先审批申请不被采纳。",basis:["cn-priority","cn-high-end"],paths:["pw-priority"]},{id:"sc-emergency-qual",stage:"pre",level:"red",title:"应急审批适用情形已确认",ask:"产品是否属于突发公共卫生事件应急所需的医疗器械？是否已取得应急审批认定并纳入应急审批程序？",detail:"应急审批适用于突发公共卫生事件应急所需、且国内尚无同类产品上市或现有产品无法满足需求的情形。须先取得应急审批认定，方可按应急程序申报，审评时限大幅压缩，但上市后须继续完成相关研究。",evidence:["应急审批认定文件","应急需求论证材料","现有产品无法满足需求的说明"],pitfall:"未经应急审批认定直接按应急程序提交资料，仍按常规程序受理，无法享受时限压缩。",basis:["cn-emergency","cn-emergency-use"],paths:["pw-emergency"]},{id:"sc-conditional-qual",stage:"pre",level:"red",title:"附条件批准适用性已论证",ask:"产品是否用于严重危及生命且尚无有效治疗手段的疾病，或属于临床急需？是否已明确上市后需完成的确证性研究内容与时限？",detail:"附条件批准适用于临床急需且现有诊疗手段无法满足需求的情形。申请人须在申报时明确上市后需继续完成的研究内容、完成时限与风险控制措施，并承诺按期完成。未按期完成将被撤销注册证。",evidence:["附条件批准适用性论证报告","上市后确证性研究方案","风险控制与承诺事项清单"],pitfall:"未在申报时明确上市后研究方案与时限，或在获批后未按期推进确证性研究，注册证被撤销。",basis:["cn-conditional"],paths:["pw-conditional"]},{id:"sc-ct-approval",stage:"pre",level:"red",title:"第三类临床试验审批已取得（如适用）",ask:"产品是否列入需进行临床试验审批的第三类医疗器械目录？如列入，是否已取得临床试验批准？",detail:"列入需进行临床试验审批目录的第三类医疗器械，必须先取得临床试验批准，方可开展临床试验。未列入目录的第三类产品开展临床试验，实行备案管理，须在试验开始前完成备案并符合伦理要求。",evidence:["临床试验批准文件","临床试验方案与伦理委员会意见","临床试验机构资质与备案凭证"],pitfall:"未取得批准即开展临床试验，或先开展试验后补备案，试验数据不可用于注册申报。",basis:["cn-47","cn-gcp","cn-37"],paths:["pw-clinical","pw-class3","pw-innovation","pw-priority"]},{id:"sc-master-doc",stage:"pre",level:"adv",title:"主文档登记已考虑",ask:"是否涉及原材料、关键元器件或工艺等主文档内容？是否已办理主文档登记以便在申报资料中引用？",detail:"主文档登记用于将原材料、关键元器件、生产工艺等共性资料单独登记，注册申报时通过授权引用，避免每次申报重复提交含商业秘密的技术资料。主文档持有人与注册申请人须办理授权手续。",evidence:["主文档登记凭证","主文档引用授权书"],pitfall:"每次申报都重复提交供应商的完整技术资料，既增加工作量，也带来商业秘密泄露风险。",basis:["cn-master-doc"]},{id:"sc-comm",stage:"pre",level:"adv",title:"申报前沟通交流已安排",ask:"是否就重大问题（分类、临床评价路径、技术要求指标等）与审评机构开展过沟通交流？",detail:"沟通交流可就重大技术问题、临床评价路径、通用名称、适用标准等事项在申报前取得监管倾向性意见，降低后期发补风险。沟通交流需提交申请并明确咨询问题，会议形成的记录可作为申报依据。",evidence:["沟通交流申请与答复","沟通交流会议纪要","问题清单与内部结论"],pitfall:"临床评价路径未事先沟通，申报后被告知需开展临床试验，项目周期大幅延长。",basis:["cn-comm"]},{id:"sc-tech-require",stage:"study",level:"red",title:"产品技术要求已按指导原则编制",ask:"产品技术要求是否按《医疗器械产品技术要求编写指导原则》编制？性能指标是否完整覆盖安全性与有效性要求？",detail:"产品技术要求是注册审评与上市后监督的基准文件，包含产品型号规格、性能指标与检验方法三部分。性能指标须可客观判定，检验方法须可复现。指标的设定应当与安全和性能基本原则清单、研究资料、检验报告相互对应，不得出现指标无研究支撑或无检验方法的情形。",evidence:["产品技术要求正式文本","性能指标设定依据说明","与适用标准条款的对照表"],pitfall:"性能指标缺项（如漏电气安全、漏生物学项目）、指标不可判定或检验方法不可复现，直接发补甚至不予注册。",basis:["cn-tech-require","cn-essp","cn-nmpa-121"],docs:["tech"]},{id:"sc-ep-list",stage:"study",level:"red",title:"安全和性能基本原则清单逐项完成",ask:"是否已逐条填写 EP 清单，对每条原则说明适用性（适用/不适用）并给出符合性证据编号？",detail:"医疗器械安全和性能基本原则清单是审评的核心核对表。每条原则都须明确适用性；适用项须给出符合性方法（如符合某标准条款、经某研究验证）与证据在申报资料中的位置。不适用项须给出合理理由，不能留空。",evidence:["EP 清单完整填报表","逐条符合性证据索引","不适用项的理由说明"],pitfall:"清单留空、全部填「适用」却不给证据、或符合性方法指向不存在的资料，是发补高频项。",basis:["cn-essp","cn-essp-tech"],docs:["all"]},{id:"sc-test-report",stage:"study",level:"red",title:"检验报告已取得且覆盖全部性能指标",ask:"是否已取得注册检验报告或自检报告？报告是否覆盖产品技术要求的全部性能指标？检验产品是否为典型性型号？",detail:"检验报告须由具备资质的检验机构出具（委托检验），或由申请人自检出具（自检）。报告须覆盖产品技术要求中的全部性能指标，检验样品须能代表申报的全部型号规格。报告出具日期距申报日期不宜过久，涉及标准更新的须按新标准重新检验。",evidence:["注册检验报告或自检报告原件","典型性型号选择说明","检验样品与申报型号的对应关系"],pitfall:"检验报告未覆盖全部性能指标、检验样品不是典型型号，或引用已被替代的旧版标准，报告不被认可。",basis:["cn-47","cn-tech-require","cn-selfcheck","cn-nmpa-2023-14"],docs:["tech"]},{id:"sc-standards",stage:"study",level:"key",title:"适用标准清单完整且版本现行",ask:"是否已逐项列出适用的国家标准、行业标准（含 GB 9706.1-2020 及配套并列、专用标准）？引用版本是否为现行有效版本并标注年号？",detail:"适用标准清单须完整、准确，并标注标准号与年号。强制性标准必须执行；医用电气设备须关注 GB 9706.1-2020 及配套并列标准、专用标准的实施要求与过渡期安排。引用标准时未标注年号会导致适用版本不明确，属规范性缺陷。",evidence:["适用标准清单（含标准号与年号）","标准现行有效性核查记录","标准条款与技术要求指标对照表"],pitfall:"标准号未标注年号、引用了已被替代的版本，或漏列强制性标准，构成规范性缺陷并可能引发重新检验。",basis:["cn-33","cn-gb9706-1","cn-yy9706-102","cn-nmpa-2023-14","cn-essp-tech"]},{id:"sc-rm",stage:"study",level:"red",title:"风险管理活动贯穿全生命周期并形成报告",ask:"是否已按风险管理标准开展风险分析、评价与控制？是否形成覆盖设计开发全过程的风险管理报告？剩余风险是否经过受益风险分析？",detail:"风险管理不是一次性文档，须贯穿设计开发全过程，并在生产、上市后持续更新。风险管理报告须完整记录风险分析、风险评价、风险控制措施及其验证、剩余风险评价与受益风险分析结论。风险控制措施必须落到产品技术要求或说明书的具体条款上，不能停留在管理层面。",evidence:["风险管理计划","风险分析记录（FMEA/FTA 等）","风险控制措施验证记录","剩余风险评价与受益风险分析","风险管理报告"],pitfall:"风险分析只在报告中体现、控制措施未落到技术要求或说明书条款，或未评价剩余风险，被判定风险管理不充分。",basis:["cn-gbt42062","cn-yyt1437","cn-essp"],docs:["rm"]},{id:"sc-bio",stage:"study",level:"key",title:"生物学评价已完成",ask:"产品是否与人体直接或间接接触？是否已按生物学评价标准完成评价或试验？材料变更后是否重新评价？",detail:"与人体接触的器械须开展生物学评价，优先通过已有数据和材料表征进行评价，必要时开展生物学试验。评价项目依据接触性质、接触部位与接触时长确定。材料供应商、牌号或工艺发生变化时，须重新评估并更新评价报告。",evidence:["生物学评价报告","材料清单与材料表征数据","生物学试验报告（如适用）","材料变更评估记录"],pitfall:"仅笼统引用供应商提供的生物相容性报告而未做材料表征与接触条件匹配分析，评价结论不被采信。",basis:["cn-essp","intl-iso10993","cn-nmpa-121"]},{id:"sc-elec",stage:"study",level:"key",title:"电气安全与电磁兼容验证已完成",ask:"（如有源）是否已按 GB 9706.1-2020 及配套并列、专用标准完成验证？电磁兼容与预期使用环境是否匹配？",detail:"有源医疗器械须满足医用电气设备通用要求与配套并列标准（电磁兼容、医用电气系统等）、专用标准。电磁兼容要求须与产品的预期使用环境一致（专业医疗机构使用与家庭环境使用的要求不同）。涉及无线通信的还须符合无线电管理规定。",evidence:["电气安全检验报告","电磁兼容检验报告","预期使用环境说明","风险分析中的电气安全相关条目"],pitfall:"按家庭环境要求设计但申报为医疗机构使用，或漏做专用标准检验，检验报告被要求补充。",basis:["cn-gb9706-1","cn-yy9706-102","intl-iec60601"],docs:["tech"]},{id:"sc-sterile",stage:"study",level:"key",title:"灭菌确认与无菌屏障系统已验证",ask:"（如无菌提供）是否已完成灭菌工艺确认？无菌屏障系统是否经验证？灭菌方式与产品材料是否兼容？",detail:"无菌医疗器械须完成灭菌确认，包括灭菌工艺的确认、无菌屏障系统的完整性与货架有效期验证。灭菌方式的选择须考虑材料兼容性与残留物水平（如环氧乙烷残留）。重复灭菌的须验证重复次数上限。",evidence:["灭菌确认报告","无菌屏障系统验证报告","灭菌残留物检测报告（如适用）","灭菌工艺规程"],pitfall:"灭菌确认只做灭菌效果验证、未做无菌屏障完整性验证，或残留物水平未检测，涉及无菌要求的关键项目不符合。",basis:["cn-gmp-aseptic","cn-essp","cn-nmpa-121"]},{id:"sc-stability",stage:"study",level:"key",title:"货架有效期与包装完整性已验证",ask:"是否已完成货架有效期验证？包装运输条件是否与产品特性匹配？是否考虑了极端温湿度条件？",detail:"货架有效期验证须基于实时老化或加速老化数据，并考虑产品在储存与运输过程中的最不利条件。需冷链的产品须验证冷链完整性与温度偏离后的处置。包装验证应覆盖运输振动、跌落等实际风险。",evidence:["货架有效期验证报告","加速老化与实时老化数据","包装运输验证报告","冷链验证报告（如适用）"],pitfall:"仅提供加速老化数据而无实时老化数据支撑，或有效期结论超出验证覆盖范围，被要求补充验证。",basis:["cn-nmpa-121","cn-cold-chain","cn-essp"]},{id:"sc-sw",stage:"study",level:"key",title:"软件研究资料与网络安全已完备",ask:"（含软件）是否已按软件注册审查指导原则提交软件研究资料？软件安全性级别是否已判定？网络安全是否已按指导原则评价？",detail:"含软件的产品须提交软件研究资料，内容包括软件基本信息、实现过程、生存周期、缺陷管理、版本管理、安全性级别判定、确认测试等。软件安全性级别依据软件失效可能造成的伤害严重程度判定，级别越高要求越严。含网络连接功能的须单独开展网络安全评价。",evidence:["软件研究资料","软件安全性级别判定报告","软件确认测试报告","网络安全描述文档与漏洞评估"],pitfall:"软件安全性级别判定偏低、软件版本与申报版本不一致、含网络功能却未提交网络安全资料，均为发补或不予注册原因。",basis:["cn-software","cn-cyber","cn-yyt0664","cn-sw-appendix","cn-yyt1406"],docs:["sw"]},{id:"sc-ai",stage:"study",level:"key",title:"人工智能算法研究已完备（如适用）",ask:"（含 AI/ML 功能）是否已按人工智能医疗器械指导原则提交算法研究资料？训练数据、验证数据与泛化能力是否已有说明？",detail:"人工智能医疗器械须提交算法基本信息、数据来源与标注、训练与调优过程、性能评估（含独立测试集）、可解释性与泛化能力分析、更新策略等资料。数据来源合法性与伦理审查、数据集代表性是审评重点关注项。",evidence:["算法研究资料","数据集来源与标注说明","独立测试集性能评估报告","算法更新策略文件"],pitfall:"训练数据与测试数据未严格分离、性能评估未使用独立测试集、数据来源合法性无法证明。",basis:["cn-ai","cn-software"],docs:["sw"]},{id:"sc-uc",stage:"study",level:"key",title:"可用性工程与人因设计已验证",ask:"是否已开展可用性工程活动？使用错误相关风险是否已识别并在设计或说明书中控制？",detail:"可用性工程关注使用错误带来的风险。须识别预期用户、使用场景与使用环境，分析使用错误相关风险，并通过设计改进或说明书警示予以控制。涉及自测、家用、急救或复杂操作的器械为重点关注对象，必要时须开展形成性测试与总结性测试。",evidence:["可用性工程文档","使用错误风险分析记录","形成性与总结性可用性测试报告","说明书相关警示内容"],pitfall:"可用性工程文档仅为形式文件、未开展实际测试，或使用错误风险未在说明书中体现控制措施。",basis:["cn-hf","cn-yyt1474"],docs:["ifu"]},{id:"sc-ce-path",stage:"study",level:"red",title:"临床评价路径已决策并有据",ask:"产品列入免于临床评价目录吗？如未列入，采用同品种比对还是开展临床试验？决策依据是否完整？",detail:"临床评价有三条路径：列入免于临床评价目录的提交免临床评价说明；可通过同品种医疗器械临床数据完成评价的，提交同品种比对分析资料；以上均不满足的须开展临床试验。路径选择须有明确法规依据，不能为省事而误用免临床路径。",evidence:["临床评价路径决策记录","免于临床评价目录比对说明","同品种比对可行性分析"],pitfall:"产品不在免临床评价目录内却直接提交免临床说明，被要求补做临床评价甚至临床试验。",basis:["cn-ce-guideline","cn-47","cn-rwd"],docs:["ce"]},{id:"sc-ce-report",stage:"study",level:"red",title:"临床评价资料已形成并支持适用范围",ask:"同品种比对的差异性是否已分析并证明对安全有效性无不利影响？临床评价结论是否覆盖申报的全部适用范围？",detail:"采用同品种比对路径的，须系统检索并筛选临床数据，逐项比对同品种产品的技术特征、生物学特性与临床应用，对差异性逐条分析并证明不产生不利影响。临床评价结论必须覆盖申报的适用范围、适用人群与禁忌证，不能超出评价覆盖范围。",evidence:["临床评价报告","文献检索策略与筛选记录","同品种产品比对表与差异性分析","适用范围支持性分析"],pitfall:"比对未覆盖全部差异项（如材料、软件算法、适用范围），或评价结论超出临床数据覆盖范围，被要求补充评价。",basis:["cn-ce-guideline","cn-rwd","cn-essp"],docs:["ce"]},{id:"sc-ct",stage:"study",level:"red",title:"临床试验合规且数据可用",ask:"（如开展）试验是否在备案的临床试验机构开展？是否已完成备案/审批？伦理审查、知情同意、数据溯源是否完整？",detail:"临床试验须在符合条件的临床试验机构开展，试验开始前完成备案（属审批目录的须先取得批准）。试验须经伦理委员会审查同意，受试者知情同意，数据真实、准确、完整、可溯源。试验方案的偏离须有记录与说明。",evidence:["临床试验报告","伦理委员会意见与知情同意书","临床试验机构与试验项目备案凭证","数据溯源与核查记录"],pitfall:"试验方案关键偏离未记录、数据无法溯源、或试验机构未备案，数据不被接受，须重新开展试验。",basis:["cn-gcp","cn-37","cn-ct-inspect","intl-iso14155"],docs:["ce"]},{id:"sc-animal",stage:"study",level:"adv",title:"动物试验必要性与结果已论证",ask:"是否开展动物试验？未开展的理由是否充分（如可通过已有数据、台架试验替代）？",detail:"动物试验应遵循「替代、减少、优化」原则，仅在无法通过体外试验、台架试验、已有文献或其他产品数据充分评价安全有效性时开展。未开展动物试验的须在申报资料中说明理由，理由须有说服力，不能用「同类产品均未开展」搪塞。",evidence:["动物试验方案与报告（如开展）","未开展动物试验的理由说明与文献支持"],pitfall:"该做而未做且理由牵强，或做了试验但样本量、观察指标、观察周期不足以支持安全性结论。",basis:["cn-nmpa-121","cn-essp"]},{id:"sc-animal-source",stage:"study",level:"key",title:"生物源材料安全性已控制",ask:"（如使用动物源、人源或微生物源材料）来源是否可追溯？病毒灭活与去除工艺是否已验证？",detail:"使用生物源材料的器械须提供材料来源、供体筛查、病毒灭活/去除验证等资料，并评价免疫原性风险。来源可追溯性与病毒安全性是审评重点。涉及人源材料的须符合伦理与相关管理规定。",evidence:["材料来源证明与供体筛查记录","病毒灭活/去除验证报告","免疫原性评价资料","供应商审计记录"],pitfall:"仅提供供应商声明而无病毒灭活验证数据，或来源不可追溯，生物源材料安全性不被认可。",basis:["cn-essp","cn-nmpa-121","intl-iso10993"]},{id:"sc-radiation",stage:"study",level:"adv",title:"辐射安全与环境保护已评价",ask:"（如含辐射）是否已评价辐射安全？是否取得辐射安全许可证或放射性同位素相关许可？",detail:"含电离辐射或激光等辐射源的产品须评价辐射安全，包括辐射剂量、屏蔽措施与防护设计。涉及放射性同位素的须取得相应许可。辐射防护须在技术要求与说明书中明确。",evidence:["辐射安全评价报告","辐射剂量检测数据","辐射安全许可证（如适用）","用户防护说明"],pitfall:"含辐射功能却未提交辐射安全评价资料，或说明书未包含必要的防护警示，被要求补充。",basis:["cn-essp","cn-nmpa-121"]},{id:"sc-d1",stage:"dossier",level:"key",title:"模块一 · 监管信息齐备",ask:"申请表、术语缩写词列表、产品列表、关联文件、沟通交流记录、符合性声明是否齐全且信息一致？",detail:"模块一为监管信息，是受理环节的形式审查重点。申请表信息须与营业执照、生产许可、产品技术要求完全一致。产品列表须覆盖申报的全部型号规格。符合性声明须由法定代表人或授权人签章。",evidence:["申请表","术语与缩写词列表","产品列表","关联文件","沟通交流记录","符合性声明"],pitfall:"申请表信息与营业执照或生产许可不一致、产品列表与实际申报型号不符，形式审查不通过。",basis:["cn-nmpa-121"]},{id:"sc-d2",stage:"dossier",level:"key",title:"模块二 · 综述资料完整且边界清晰",ask:"产品描述、适用范围、禁忌证、适用人群、上市历史是否完整？适用范围表述是否与临床评价、说明书一致？",detail:"综述资料高度概括产品全貌。产品描述须说明结构组成、工作原理与关键材料。适用范围与禁忌证表述必须与临床评价结论、产品技术要求、说明书三处完全一致，且不得夸大或模糊。已上市产品须提供上市历史与不良事件概况。",evidence:["产品描述与结构组成说明","适用范围与禁忌证","适用人群说明","申报产品上市历史"],pitfall:"适用范围在综述资料、临床评价、说明书中表述不一致，或存在夸大表述，是发补与不予注册的高频原因。",basis:["cn-nmpa-121","cn-739"]},{id:"sc-d3",stage:"dossier",level:"red",title:"模块三 · 风险管理资料已提交",ask:"风险管理资料是否作为非临床资料的组成部分完整提交？是否与技术要求、说明书相互呼应？",detail:"风险管理资料是模块三非临床资料的必备组成部分，不能仅作为体系文件存在。提交内容须与产品技术要求中的安全性指标、说明书中的警示信息形成闭环对应。",evidence:["风险管理报告","风险控制措施与技术要求条款对照表","风险相关说明书内容"],pitfall:"风险管理报告放在体系文件里而未随申报资料提交，或报告内容与技术要求、说明书无对应关系。",basis:["cn-nmpa-121","cn-gbt42062"]},{id:"sc-d5",stage:"dossier",level:"red",title:"模块三 · 产品技术要求及检验报告已提交",ask:"产品技术要求与检验报告是否同时提交并相互对应？检验报告指标与原技术要求逐条一致？",detail:"产品技术要求与检验报告须成对提交，且逐条对应。检验报告的检测项目、指标要求须与产品技术要求完全一致，任何偏差都须有说明。技术要求中的推荐性内容不得混入强制性指标，反之亦然。",evidence:["产品技术要求","检验报告","指标与报告逐条对照表"],pitfall:"先出检验报告后修改技术要求，导致报告与文本不一致，须重新检验。",basis:["cn-nmpa-121","cn-tech-require"]},{id:"sc-d6",stage:"dossier",level:"red",title:"模块三 · 研究资料完整覆盖性能指标",ask:"物理化学性能、电气安全、辐射安全、软件、生物学、生物源材料、灭菌、动物试验、稳定性等研究是否逐项齐备？",detail:"研究资料须支撑产品技术要求中的每一项性能指标。凡技术要求中列出的指标，都必须能在研究资料中找到设定依据与验证数据；反之研究资料中的结论也须体现在技术要求或说明书中。两者不得相互孤立。",evidence:["各专项研究资料","性能指标与研究资料的对应关系表","研究方法与方法学验证记录"],pitfall:"技术要求中列有某项指标，但研究资料中无对应研究，审评认定为指标缺乏依据。",basis:["cn-nmpa-121","cn-essp"]},{id:"sc-d8",stage:"dossier",level:"key",title:"模块四 · 临床评价资料已按路径提交",ask:"是否按已决策路径提交了对应资料（免临床说明 / 同品种比对分析 / 临床试验资料）？结论是否覆盖适用范围？",detail:"模块四资料形式取决于临床评价路径。无论哪种路径，结论都必须明确支持申报的适用范围与禁忌证，且与其他模块表述一致。采用同品种路径的须附同品种产品的合法上市证明。",evidence:["临床评价报告或免临床评价说明","同品种产品注册证与合法上市证明","临床试验相关资料（如适用）"],pitfall:"采用同品种比对但未提供同品种产品在中国的合法上市证明，比对基础不成立。",basis:["cn-nmpa-121","cn-ce-guideline"]},{id:"sc-d9",stage:"dossier",level:"red",title:"模块五 · 说明书与标签样稿合规",ask:"说明书是否包含《医疗器械说明书和标签管理规定》要求的全部项目？标签是否符合最小销售单元要求？是否使用了规范的符号？",detail:"说明书须涵盖产品名称、注册人信息、注册证编号、适用范围、禁忌证、注意事项、警示信息、使用方法、维护保养、生产日期与使用期限、灭菌方式（如适用）、UDI 等法定项目。标签内容不得超出说明书范围，且不得含有绝对化或暗示疗效的表述。符号须符合医疗器械符号标准。",evidence:["产品说明书","最小销售单元标签样稿","包装标签样稿","符号使用清单与依据"],pitfall:"缺禁忌证、缺警示信息、使用绝对化表述（如「绝对安全」「无任何副作用」）、符号不规范，属高频发补项。",basis:["cn-labeling","cn-yyt0466-1","cn-udi"],docs:["ifu"]},{id:"sc-d10",stage:"dossier",level:"key",title:"模块六 · 质量管理体系文件已提交",ask:"是否提交了程序文件目录与主要内容？体系核查相关文件是否齐备？采用自检的是否提交自检相关体系资料？",detail:"模块六为质量管理体系文件，用于支撑注册质量管理体系核查。提交内容包括程序文件目录及主要内容、与申报产品相关的体系文件。体系文件须覆盖申报产品的设计开发、采购、生产、检验与上市后全过程，并反映出体系处于受控状态。",evidence:["程序文件目录与主要内容","质量管理体系核查相关文件","注册自检相关体系资料（如适用）"],pitfall:"程序文件目录与实际体系文件不符，或体系文件未覆盖申报产品，无法支撑体系核查。",basis:["cn-nmpa-121","cn-rsl"]},{id:"sc-d11",stage:"dossier",level:"red",title:"全册资料一致性与自洽性已核查",ask:"产品名称、型号规格、结构组成、材料、性能指标、适用范围在六大模块中是否处处一致？数据与结论是否相互支撑？",detail:"全册一致性是形式审查与实质审评的共同关注点。须逐项核对名称、型号、规格、结构、材料、指标、适用范围、禁忌证在综述资料、研究资料、技术要求、检验报告、临床评价、说明书之间的表述是否完全一致。数据前后矛盾会直接引发质疑。",evidence:["全册一致性核查表","关键信息（名称/型号/材料/适用范围）跨模块对照表","数据自洽性复核记录"],pitfall:"材料牌号在技术要求与研究资料中不一致、型号规格在检验报告与产品列表中不匹配，被认为资料真实性存疑。",basis:["cn-nmpa-121","cn-essp"]},{id:"sc-d12",stage:"dossier",level:"key",title:"立卷审查要求已逐项自检",ask:"是否已对照立卷审查要求逐项自检？是否存在明显不符合项会被判定为不予受理？",detail:"立卷审查是受理后的第一道实质门槛，审查申报资料是否基本齐全、格式是否规范、是否存在明显不符合要求的情形。未通过立卷审查的申请将不予受理，须重新申报。建议在提交前逐项模拟立卷审查。",evidence:["立卷审查要求自检表","不予受理风险项排查记录","整改完成情况说明"],pitfall:"资料缺项、格式严重不规范、未提交强制性标准要求的检验报告，立卷审查不予通过，申请不予受理。",basis:["cn-dossier-2022","cn-nmpa-121"]},{id:"sc-d13",stage:"dossier",level:"key",title:"语言与格式符合申报要求",ask:"申报资料是否使用中文？外文资料是否附中文译本？引用未公开发表文献是否已取得权利人许可？",detail:"注册申报资料应当使用中文。源自外文的资料须同时提供原文与中文译本，译文须准确。引用未公开发表的文献资料时，应当提供资料权利人许可使用的文件。文件编排、页码、目录须符合公告附件的格式要求。",evidence:["中文资料与原文对照","翻译准确性确认记录","文献使用许可文件"],pitfall:"外文资料未附中文译本，或引用未公开文献无许可文件，被要求补正。",basis:["cn-nmpa-121"]},{id:"sc-d14",stage:"dossier",level:"adv",title:"非临床文献已系统检索",ask:"是否已综述与申报产品相关的非临床文献？文献检索策略与筛选过程是否可追溯？",detail:"非临床文献用于补充研究资料、支持性能指标与安全性结论。检索策略、数据库、时间范围与筛选标准应当记录并可追溯，文献结论与产品实际情况的关联性须说明。",evidence:["非临床文献综述","文献检索策略与筛选流程图","关键文献与产品关联性分析"],pitfall:"文献综述仅罗列文献而无筛选过程与关联性分析，无法支撑产品的安全性有效性结论。",basis:["cn-nmpa-121"]},{id:"sc-s1",stage:"submit",level:"key",title:"电子申报资料已按格式提交",ask:"电子申报资料的目录结构、文件命名、格式与容量是否符合要求？是否已完成电子签章？",detail:"注册申报实行电子申报，须按受理机构要求的目录结构与文件命名规则组织资料，PDF 文件须清晰、可检索。需要签章的文件须完成电子签章。资料版本须为最终定稿版本，避免提交过程中版本混用。",evidence:["电子申报资料包","文件目录与命名核对记录","电子签章完成确认"],pitfall:"文件命名混乱、目录结构与要求不符、扫描件模糊不可检索，形式审查退回。",basis:["cn-nmpa-121","cn-nmpa-2021-76"]},{id:"sc-s2",stage:"submit",level:"key",title:"注册费用与缴费安排已落实",ask:"是否已确认应缴注册费用金额？缴费时点与方式是否已安排？",detail:"注册申请受理后需按规定缴纳注册费用，未按期缴费的视为放弃申请。收费依据与标准应查询受理机构公示。小微企业、创新医疗器械等可能存在费用减免政策，须提前确认适用性。",evidence:["收费标准查询记录","缴费凭证","费用减免申请（如适用）"],pitfall:"未按期缴费导致申请被视为放弃，须重新申报。",basis:["cn-47"]},{id:"sc-s3",stage:"submit",level:"red",title:"注册质量管理体系核查准备就绪",ask:"是否已做好接受体系核查的准备？体系是否覆盖申报产品且处于有效运行状态？现场检查的场地、人员、记录是否就位？",detail:"第二类、第三类注册须接受注册质量管理体系核查。核查关注体系是否真实运行、设计与开发过程是否可追溯、记录是否真实完整。核查可能采取现场检查或书面检查方式。核查结论直接决定注册申请的走向，须提前开展模拟核查。",evidence:["体系核查准备清单","模拟核查记录与整改闭环","现场检查陪同人员与分工表","设计开发过程全套记录"],pitfall:"体系文件与运行记录不一致、记录后补、关键过程无留痕，核查结论为不通过。",basis:["cn-rsl","cn-gmp-2025","cn-14"],not:["pw-class1"]},{id:"sc-s4",stage:"submit",level:"key",title:"注册自检核查准备就绪",ask:"采用自检的，自检实验室是否已做好接受核查准备？自检报告与申报资料数据是否一致？",detail:"注册自检须接受注册自检核查。核查关注自检能力的真实性与检验数据的可靠性，包括人员能力、设备溯源、方法验证、环境控制与记录管理。自检报告中的原始记录须完整保存并可追溯。",evidence:["自检能力核查准备清单","原始检验记录","设备计量校准证书","人员资质与培训记录"],pitfall:"自检报告数据与原始记录不符，或检验设备超出校准有效期，自检报告不被认可。",basis:["cn-selfcheck","cn-selfcheck-check-2025"],not:["pw-class1"]},{id:"sc-s5",stage:"submit",level:"adv",title:"受理与补正预案已准备",ask:"是否已梳理可能触发补正的常见情形并准备应对？补正资料的责任人是否明确？",detail:"受理后如资料不符合要求会被要求补正，补正须在规定时限内完成，逾期视为放弃申请。建议提前梳理高频补正情形（如标准版本、检验报告覆盖范围、说明书项目），并预置修订方案与责任人。",evidence:["高频补正情形清单","补正预案与责任人分工","补正时限提醒机制"],pitfall:"收到补正通知后临时组织材料，超过补正时限导致申请被终止。",basis:["cn-47"]},{id:"sc-s6",stage:"submit",level:"adv",title:"申报时机与标准过渡期已核对",ask:"申报时点是否避开标准换版过渡期？涉及 GB 9706.1-2020 等标准换版的，是否已按新标准完成检验？",detail:"标准换版期间申报须特别注意适用版本。医用电气设备涉及 GB 9706.1-2020 及配套标准实施，相关部门已就实施工作发布通告，明确过渡期安排。在过渡期后申报的须按新标准检验并提交符合性资料。",evidence:["适用标准版本与实施日期核对表","按新标准出具的检验报告","过渡期政策适用性分析"],pitfall:"在旧标准过渡期结束后仍按旧标准检验，检验报告不被认可，须重新检验。",basis:["cn-nmpa-2023-14","cn-gb9706-1","cn-yy9706-102"]},{id:"sc-s7",stage:"submit",level:"adv",title:"沟通交流与专家咨询渠道已建立",ask:"审评过程中是否需要药物/器械审评专家咨询？是否已了解沟通交流的申请方式与时机？",detail:"审评过程中可主动申请沟通交流，就审评意见之外的技术问题沟通。重大问题可在发补前申请沟通，避免反复发补。沟通交流申请须明确具体问题，不能泛泛而谈。",evidence:["沟通交流申请记录","问题清单","沟通结果与后续处理记录"],pitfall:"收到发补意见后才沟通，失去提前澄清的机会，增加审评轮次。",basis:["cn-comm"]},{id:"sc-c1",stage:"submit",level:"red",title:"变更事项已逐条识别",ask:"是否已逐条列出拟变更的全部事项（名称、型号规格、结构组成、材料、工艺、性能指标、适用范围、说明书、生产地址等）？",detail:"变更注册的起点是穷尽式识别变更事项。实践中常见问题是只申报了显性变更（如换材料），漏报了随之而来的隐性变更（如工艺参数、检验方法、标签内容）。凡与原注册证批准内容不一致之处，都应当纳入变更清单。",evidence:["变更事项逐条清单","原注册证批准内容与现状对照表","变更来源说明（供应商变更/工艺优化/法规要求等）"],pitfall:"漏报隐性变更，导致变更注册获批后产品实际状态仍与注册证不一致，后续监督检查被认定未按注册证生产。",basis:["cn-47","cn-nmpa-121"],paths:["pw-change"]},{id:"sc-c2",stage:"submit",level:"red",title:"变更类型已判定为许可事项或登记事项",ask:"每一项变更属于许可事项变更还是登记事项变更？判定依据是否为法规原文而非经验推断？",detail:"变更类型判定直接决定申报路径。可能影响产品安全有效性的变更属许可事项变更，须申请变更注册；生产地址变更、注册人名称变更等登记事项变更按登记事项办理。判定错误会导致申报被退回、变更无效，甚至被认定为未按注册证生产。",evidence:["变更类型判定表（逐项对应法规条款）","法规条款原文摘录","判定结论内部评审记录"],pitfall:"将实质性变更按登记事项备案，被监管部门认定变更无效，须重新按许可事项申报，且期间生产销售存在合规风险。",basis:["cn-47","cn-nmpa-121"],paths:["pw-change"]},{id:"sc-c3",stage:"submit",level:"red",title:"变更影响性评估已完成",ask:"是否评估了变更对安全性、有效性、性能指标、检验结论、临床评价结论、风险管理的影响？结论是否支持「未产生不利影响」？",detail:"变更注册的核心论证是「变更未对产品的安全性有效性产生不利影响」。须针对每项变更分析其影响链条：变更 → 影响哪些性能/风险 → 是否需补充验证/检验/临床评价 → 结论。影响性评估必须有技术与数据支撑，不能只写「无影响」。",evidence:["变更影响性评估报告","影响链条分析表","补充验证与检验需求判定记录","风险评估更新记录"],pitfall:"影响性评估结论为「无影响」但无任何数据支撑，审评要求补充变更前后对比验证，审评周期延长。",basis:["cn-47","cn-nmpa-121","cn-gbt42062"],paths:["pw-change"]},{id:"sc-c4",stage:"submit",level:"key",title:"变更前后对比资料已编制",ask:"是否已就变更前后的差异提供可比对的资料？差异项是否逐条说明并给出验证或评价结论？",detail:"变更注册须提交变更前后对比资料，使审评人员能够清晰看到「改了什么、为什么改、改了之后是否仍安全有效」。对比应覆盖技术要求条款、结构组成、材料、工艺、检验方法、说明书内容等维度，逐条给出差异与结论。",evidence:["变更前后对比表（分维度）","变更后的产品技术要求","变更说明与理由"],pitfall:"只提交变更后的新资料而无变更前基线，审评无法判断差异，被要求补充对比资料。",basis:["cn-nmpa-121","cn-47"],paths:["pw-change"]},{id:"sc-c5",stage:"submit",level:"key",title:"变更涉及的检验与验证已补充",ask:"变更涉及性能指标或检验方法的，是否已重新检验或补充验证？变更涉及材料的，是否已重新开展生物学评价？",detail:"变更是否需重新检验取决于其是否影响技术要求的符合性。涉及材料变更的须重新评估生物学特性；涉及工艺变更的须验证工艺稳定性；涉及软件版本更新的须按软件更新类型判定是否需重新提交软件研究资料。",evidence:["变更后检验报告或补充验证报告","生物学重新评价资料（如适用）","软件更新影响评估（如适用）","灭菌或稳定性再验证资料（如适用）"],pitfall:"材料变更未重新做生物学评价，或软件版本更新未评估更新类型，被要求补充资料或不予变更。",basis:["cn-nmpa-121","cn-software","intl-iso10993"],paths:["pw-change"]},{id:"sc-c6",stage:"submit",level:"key",title:"变更后的技术要求、说明书与体系文件已同步",ask:"产品技术要求、说明书、标签、质量体系文件是否已随变更同步更新？更新后的版本是否一致？",detail:"变更获批后，产品技术要求、说明书、标签样稿与体系文件须同步更新至变更后状态，且各处表述完全一致。体系文件（如工艺规程、检验规程、设计开发文件）也须相应修订并保留变更记录，确保实际生产与注册证内容一致。",evidence:["变更后技术要求与说明书定稿","体系文件修订记录","变更培训与执行确认记录"],pitfall:"注册变更获批但生产工艺规程未同步修订，实际生产仍按旧工艺执行，被认定未按注册证组织生产。",basis:["cn-nmpa-121","cn-labeling","cn-gmp-2025"],paths:["pw-change"]},{id:"sc-r1",stage:"submit",level:"red",title:"延续注册时机符合法定要求",ask:"是否在注册证有效期届满 6 个月前提出申请？到期日与倒排计划是否已确认？",detail:"注册证有效期 5 年。延续注册须在有效期届满 6 个月前提出，逾期不予受理。原注册证在延续审查期间继续有效；延续注册审查未通过的，注册证将被注销。倒排计划应至少预留资料编制、体系自查与内部审批的时间。",evidence:["注册证原件与到期日登记","延续注册倒排计划","内部审批与提交节点确认"],pitfall:"超过届满前 6 个月才提交，申请不予受理，注册证到期即失效，产品须重新申报注册。",basis:["cn-47","cn-nmpa-121"],paths:["pw-renew"]},{id:"sc-r2",stage:"submit",level:"red",title:"产品未发生实质性变化已证明",ask:"注册证有效期内产品是否发生影响安全性有效性的实质性变化？如有，是否已先办理变更注册？",detail:"延续注册的前提是产品未发生实质性变化。若存在实质性变化而未办理变更注册，延续注册申请将被拒绝，须先完成变更注册。判断标准与变更注册的类型判定一致，须逐项比对现行产品与注册证批准内容。",evidence:["产品现状与注册证批准内容逐项比对表","无实质性变化声明","已办理的变更注册批件（如有）"],pitfall:"存在未办理的实质性变化仍申请延续，被要求先完成变更注册，延续申请被退回，面临注册证到期风险。",basis:["cn-47","cn-nmpa-121"],paths:["pw-renew"]},{id:"sc-r3",stage:"submit",level:"key",title:"注册证有效期内生产与上市情况已汇总",ask:"是否已汇总有效期内产品的生产量、销售量、销售区域与使用情况？数据是否真实可核？",detail:"延续注册须提交产品在注册证有效期内的生产、销售与使用情况说明。数据须真实、可核查，并与生产记录、销售记录一致。长期无生产销售的产品可能被质疑继续注册的必要性，须给出合理说明。",evidence:["生产与销售汇总表","销售区域与客户类型统计","产量与销售记录原始凭证索引"],pitfall:"汇总数据与生产、销售记录不一致，或长期零销售且无合理说明，被要求补充材料。",basis:["cn-47","cn-nmpa-121"],paths:["pw-renew"]},{id:"sc-r4",stage:"submit",level:"red",title:"有效期内不良事件与召回情况已汇总分析",ask:"是否已汇总有效期内收到的不良事件、投诉、召回与监管通报？是否已形成风险再评价结论？",detail:"延续注册要求对产品上市后的风险状况作出评价。须汇总不良事件报告、投诉、召回、监管抽检与通报等信息，分析是否存在新的风险或风险趋势变化，并给出结论：现有风险控制措施是否仍然充分。隐瞒或遗漏不良事件是严重问题。",evidence:["不良事件与投诉汇总表","召回与监管通报记录","风险再评价报告与结论","定期风险评价报告（如有）"],pitfall:"不良事件汇总与实际监测系统记录不符，或只罗列数据而无风险再评价结论，被要求补充或引发真实性核查。",basis:["cn-47","cn-adr","cn-prr","cn-recall"],paths:["pw-renew"]},{id:"sc-r5",stage:"submit",level:"key",title:"法规与标准更新影响已评估",ask:"有效期内适用的强制性标准、指导原则是否已换版？产品技术要求是否需要按新标准更新？",detail:"延续注册期间常伴随标准换版。须核查适用标准是否仍现行有效，强制性标准换版的须说明产品是否符合新标准，必要时更新产品技术要求并重新检验（如 GB 9706.1-2020 系列标准实施带来的影响）。",evidence:["适用标准现行性核查记录","标准换版影响评估报告","按新标准出具的检验报告（如适用）","更新后的产品技术要求（如适用）"],pitfall:"适用强制性标准已换版但未评估影响，延续注册被要求按新标准补充检验，周期延长。",basis:["cn-nmpa-2023-14","cn-33","cn-gb9706-1","cn-yy9706-102"],paths:["pw-renew"]},{id:"sc-r6",stage:"submit",level:"key",title:"延续注册资料已按清单编制",ask:"是否已按受理机构要求的延续注册资料清单编制资料？承诺书、声明类文件是否已按格式签署？",detail:"延续注册资料范围小于首次注册，通常包括延续注册申请表、原注册证、产品无实质性变化声明、上市后情况资料、承诺书等。虽资料量小，但格式与签署要求同样严格，形式缺陷同样会导致不予受理。",evidence:["延续注册资料清单与自查表","各项声明与承诺书","原注册证与相关批件"],pitfall:"声明与承诺书未按格式签署、资料缺项，延续注册申请不予受理，而受理窗口时间已非常紧张。",basis:["cn-47","cn-nmpa-121"],paths:["pw-renew"]},{id:"sc-p1",stage:"post",level:"red",title:"不良事件监测体系已建立",ask:"是否已建立不良事件监测与报告制度？是否已指定专人负责？是否已注册为国家药品不良反应监测系统用户？",detail:"注册人应当建立不良事件监测与再评价管理制度，配备相应人员，主动收集、报告、评价不良事件。导致死亡的不良事件应在 7 日内报告，导致严重伤害或可能导致严重伤害的应在 20 日内报告，其他不良事件在 30 日内报告。境外发生的不良事件另按规定报告。",evidence:["不良事件监测与报告制度文件","监测负责人任命与培训记录","监测系统用户注册凭证","不良事件报告流程与时限台账"],pitfall:"未建立制度或未指定专人、报告时限超期、对境外不良事件漏报，均属监管处罚高频情形。",basis:["cn-adr"],docs:["pm"]},{id:"sc-p2",stage:"post",level:"red",title:"召回程序与分级标准已明确",ask:"是否已建立召回管理制度？是否明确一级、二级、三级召回的判定标准与启动时限？",detail:"注册人应当建立医疗器械召回制度。一级召回对应使用该器械可能引起严重健康危害的情形，须在 1 日内通知相关经营使用单位并报告；二级召回对应可能引起暂时或可逆健康危害的情形，3 日内；三级召回对应一般不引起健康危害的情形，7 日内。召回须同时向监管部门报告并保存记录。",evidence:["召回管理制度","召回分级判定标准","召回演练记录","召回报告模板与联系人清单"],pitfall:"未建立召回制度、召回分级判定标准不明、启动时限超期，是飞行检查与监管处罚的重点。",basis:["cn-recall","cn-739"],docs:["pm"]},{id:"sc-p3",stage:"post",level:"key",title:"定期风险评价报告机制已建立",ask:"是否已按规范建立定期风险评价报告撰写与上报机制？报告周期是否明确？",detail:"注册人应当定期开展风险评价并撰写报告。报告须基于不良事件监测数据、投诉、文献、监管信息等，对产品风险进行再评价并给出结论与措施。报告内容须真实反映产品上市后的风险状况，不能流于形式。",evidence:["定期风险评价报告规范引用","报告撰写模板","数据收集与统计分析流程","报告上报记录"],pitfall:"报告仅罗列数据而无风险再评价结论，或未按期上报，被要求整改。",basis:["cn-prr","cn-adr"],docs:["pm"]},{id:"sc-p4",stage:"post",level:"key",title:"UDI 赋码与数据上传已安排",ask:"产品是否属于 UDI 实施范围？是否已完成最小销售单元与更小包装的赋码？是否已上传产品标识数据？",detail:"UDI 实施按产品目录分步推进。纳入范围的注册人须在产品最小销售单元、更小包装及运输包装上赋码，并按规定上传产品标识数据至相关数据库。UDI 数据须与注册信息保持一致。",evidence:["UDI 实施计划与编码规则","赋码样稿与检测记录","产品标识数据上传凭证","UDI 与注册信息对照表"],pitfall:"已纳入实施范围但未赋码或未上传数据，或 UDI 数据与注册信息不一致，影响产品经营与使用环节流通。",basis:["cn-udi"],docs:["ifu"]},{id:"sc-p5",stage:"post",level:"key",title:"上市后质量体系持续符合",ask:"取得注册证后生产是否持续符合 GMP？是否已按注册证批准的技术要求组织生产？变更是否已履行审批或备案？",detail:"取得注册证不意味着监管结束。注册人须持续保持质量管理体系有效运行，按批准的产品技术要求组织生产，生产条件、工艺、供应商发生变化的须评估并履行变更程序。监督检查与飞行检查会核实注册证与实际生产的一致性。",evidence:["生产许可与注册证有效性台账","按批准技术要求生产的确认记录","变更管理与评估记录","内审与管理评审记录"],pitfall:"实际生产工艺或材料与注册申报不一致且未办理变更，被认定为未按注册证组织生产。",basis:["cn-53","cn-gmp-2025","cn-14"]},{id:"sc-p6",stage:"post",level:"key",title:"追溯体系可覆盖全链条",ask:"是否已建立从原材料采购到销售出库的追溯体系？能否快速定位问题批次的流向？",detail:"追溯体系须覆盖原材料采购、生产过程、成品放行、销售出库全过程，并保留可追溯的记录。发生质量问题时须能快速锁定问题批次并定位其销售流向，以支撑召回与不良事件调查。经营环节的进销存记录是企业追溯能力的延伸。",evidence:["批号编制与追溯规则文件","原材料入库与批号关联记录","销售记录与客户台账","追溯演练记录"],pitfall:"原材料批号与成品批号无关联，发生问题时无法界定受影响范围，召回范围只能一刀切扩大。",basis:["cn-gmp-2025","cn-gsp","cn-udi"]},{id:"sc-p7",stage:"post",level:"adv",title:"经营与供应链合规安排已就位",ask:"产品经营方式是否合规？网络销售是否已办理备案或取得相应资质？经销协议是否明确质量责任？",detail:"从事医疗器械经营须取得经营许可或备案；网络销售须符合网络销售质量管理规范并办理相应备案。注册人与经营企业之间须明确质量责任，经销协议应包含质量条款。自营网络销售的须在网站显著位置公示资质。",evidence:["经营许可或备案凭证","网络销售备案凭证","经销协议质量条款","网站资质公示截图"],pitfall:"未办理网络销售备案即开展线上销售，或未在网站公示资质，属违规经营。",basis:["cn-54","cn-gsp","cn-net-sale-gsp","cn-internet-filing"]},{id:"sc-p8",stage:"post",level:"adv",title:"说明书更新与信息变更机制已建立",ask:"是否已建立说明书随法规、标准更新而修订的机制？说明书修订后是否及时通知经营与使用单位？",detail:"说明书内容须随法规、标准、临床认知的变化及时修订。涉及安全性的说明书变更须按规定办理手续，并及时通知经营企业与使用单位。已上市产品的说明书与注册批准内容须保持一致。",evidence:["说明书修订管理流程","法规标准跟踪机制","说明书变更通知记录"],pitfall:"标准已换版但说明书仍引用旧标准号，或说明书内容与注册批准内容不一致。",basis:["cn-labeling","cn-47"]},{id:"sc-p9",stage:"post",level:"red",title:"附条件批准上市后研究承诺已落实",ask:"附条件批准时承诺的确证性研究是否已按期启动？研究进度与风险控制措施是否已按承诺报告？",detail:"附条件批准上市的产品，注册人须在批准时承诺的期限内完成确证性研究，并向监管部门报告进展。未按期完成或研究结论不支持原批准条件的，注册证将被撤销。研究期间须同步实施风险控制措施，包括说明书警示、医生培训、使用限制等。",evidence:["上市后确证性研究方案与进度报告","风险控制措施实施记录","向监管部门的阶段性报告","研究相关的伦理与数据记录"],pitfall:"获批后确证性研究未按期推进或无进展报告，注册证被撤销；风险控制措施未实际执行，被认定为承诺未履行。",basis:["cn-conditional","cn-47"],paths:["pw-conditional"]},{id:"sc-p10",stage:"post",level:"adv",title:"医疗器械唯一标识与出口合规已考虑",ask:"（如出口）是否了解目标市场的准入要求？是否需要医疗器械出口销售证明？",detail:"产品出口须符合目标国家或地区的准入要求，出口销售证明由药品监督管理部门出具，证明该产品已在中国境内取得注册或备案。出口产品的技术要求可与境内注册产品不同，但须符合目标市场要求。",evidence:["目标市场准入要求清单","出口销售证明申请记录","出口产品技术要求与境内版本差异说明"],pitfall:"已取得境内注册证即认为可直接出口，未办理出口销售证明，清关受阻。",basis:["cn-export-cert","cn-739"]}]},window.MDR_FULLTEXT={version:"1.0.0",updatedAt:"2026-09-17",policy:{title:"全文层数据政策",points:["本平台不内嵌、不复制法规与标准原文，仅提供官方获取通道与本地导入解析能力。","法规全文的权威版本以发布机关公布文本为准；不同版本、修订批次之间可能存在实质差异，请确认版本年份与修订公告。","导入的全文保存在应用文件存储，可在「全文层」中清除。","平台不对导入文本的完整性、准确性与时效性负责；导入件会记录来源与导入时间，供团队内部核对与追溯。","正式引用、合规判定与对外法律文件，必须回溯官方公布文本。"]},channels:[{id:"ch-gov",name:"中国政府网 · 国务院政策文件库",issuer:"中华人民共和国国务院",url:"https://www.gov.cn/zhengce/",format:"HTML / PDF",scope:"行政法规、国务院规范性文件",tip:"《医疗器械监督管理条例》等行政法规优先用此通道，可核对国令号与修订批次。",applies:["CN"]},{id:"ch-nmpa",name:"国家药品监督管理局 · 政策法规",issuer:"国家药品监督管理局（NMPA）",url:"https://www.nmpa.gov.cn/xxgk/fgwj/index.html",format:"HTML / PDF",scope:"部门规章、规范性文件、公告通告",tip:"按发布年份归档；公告通告页通常可直接下载官方 PDF 原件，是导入全文的首选来源。",applies:["CN"]},{id:"ch-cmde",name:"国家药监局器审中心 · 指导原则",issuer:"国家药品监督管理局医疗器械技术审评中心（CMDE）",url:"https://www.cmde.org.cn/",format:"HTML / PDF",scope:"技术审查指导原则、审评要点、立卷审查要求",tip:"指导原则更新频繁，同一名称可能有多个年份版本，导入后务必标注版本年份。",applies:["CN"]},{id:"ch-sac",name:"国家标准全文公开系统",issuer:"国家市场监督管理总局 / 国家标准化管理委员会",url:"https://openstd.samr.gov.cn/bzgk/gb/",format:"在线预览",scope:"GB 强制性国家标准、GB/T 推荐性国家标准",tip:"该系统提供在线预览，部分标准不提供下载；YY 医药行业标准请走中检院通道。",applies:["CN"]},{id:"ch-nifdc",name:"中国食品药品检定研究院 · 医疗器械标准管理",issuer:"中国食品药品检定研究院（NIFDC）",url:"https://www.nifdc.org.cn/",format:"HTML",scope:"YY / YY/T 医药行业标准目录与查询",tip:"行业标准的正式文本通常需通过标准出版机构获取，平台不代用户取得。",applies:["CN"]},{id:"ch-ecfr",name:"eCFR · Electronic Code of Federal Regulations",issuer:"美国联邦政府（GPO / NARA）",url:"https://www.ecfr.gov/",format:"HTML / XML",scope:"21 CFR 全部章节，含 Part 803 / 806 / 807 / 814 / 820 / 822 / 830",tip:"eCFR 提供逐版比对与生效日期视图，是导入美国法规全文最准确的通道。",applies:["US"]},{id:"ch-eurlex",name:"EUR-Lex · 欧盟法律数据库",issuer:"欧盟出版局（Publications Office of the EU）",url:"https://eur-lex.europa.eu/",format:"HTML / PDF",scope:"MDR (
