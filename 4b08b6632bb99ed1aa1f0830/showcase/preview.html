<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医械法规云 · 示例体验</title><style>/* ============================================================================
 * 医械法规云 MedReg Hub — 样式表
 * 浅色主题 · 零外部依赖
 * ==========================================================================*/

:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --surface-3: #eff4fa;
  --border: #dde5ee;
  --border-strong: #c6d3e2;
  --text: #16233a;
  --text-2: #46586f;
  --muted: #7789a0;
  --primary: #0b4f92;
  --primary-600: #0d63b5;
  --primary-50: #e8f1fb;
  --accent: #ff6a00;
  --accent-50: #fff2e6;
  --ok: #0f8a5f;
  --ok-bg: #e6f6ef;
  --warn: #b26a00;
  --warn-bg: #fdf3e2;
  --info: #1f6fd0;
  --info-bg: #eaf2fd;
  --danger: #c02b3a;
  --danger-bg: #fdecee;
  --purple: #6b46c1;
  --purple-bg: #f1ecfd;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow-1: 0 1px 2px rgba(22, 35, 58, .06), 0 1px 3px rgba(22, 35, 58, .04);
  --shadow-2: 0 4px 14px rgba(22, 35, 58, .09);
  --shadow-3: 0 18px 50px rgba(16, 30, 54, .22);
  --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--primary-600); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }
::selection { background: #cfe3f8; }

/* ---------------- 顶部 ---------------- */
.topbar {
  background: #0a3767;
  color: #cfe0f2;
  font-size: 12px;
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 6px 20px;
  display: flex; align-items: center; gap: 18px;
}
.topbar-inner .spacer { flex: 1; }
.topbar-inner a { color: #cfe0f2; }
.topbar-inner .dot { color: #4d7ba9; }

.header {
  background: linear-gradient(180deg, #0d4a8c 0%, #0b4f92 100%);
  color: #fff;
  position: sticky; top: 0; z-index: 60;
  box-shadow: 0 2px 10px rgba(9, 40, 76, .18);
}
.header-main {
  max-width: 1440px; margin: 0 auto; padding: 14px 20px;
  display: flex; align-items: center; gap: 26px;
}
.brand { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 11px;
  background: linear-gradient(135deg, #ff6a00, #ff9138);
  display: grid; place-items: center;
  font-size: 20px; font-weight: 700; color: #fff;
  box-shadow: 0 3px 10px rgba(255, 106, 0, .38);
}
.brand-name { font-size: 19px; font-weight: 700; letter-spacing: .5px; line-height: 1.2; }
.brand-sub { font-size: 11px; color: #9dc3e8; letter-spacing: 1.4px; text-transform: uppercase; }

.search-wrap { flex: 1; max-width: 720px; position: relative; }
.search-box {
  display: flex; align-items: center;
  background: #fff; border-radius: 999px; padding: 4px 4px 4px 18px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
}
.search-box input {
  flex: 1; border: 0; outline: 0; font-size: 14px; padding: 9px 6px;
  background: transparent; color: var(--text); font-family: inherit;
}
.search-box .btn-search {
  border: 0; border-radius: 999px; padding: 9px 26px;
  background: linear-gradient(135deg, #ff6a00, #ff8a2b); color: #fff;
  font-size: 14px; font-weight: 600; letter-spacing: 2px;
}
.search-box .btn-search:hover { filter: brightness(1.06); }
.search-hint {
  margin-top: 7px; font-size: 12px; color: #a8c8e8;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.search-hint .chip-link {
  color: #dbeaf8; background: rgba(255, 255, 255, .1);
  padding: 1px 9px; border-radius: 999px; cursor: pointer; border: 0; font-size: 12px;
}
.search-hint .chip-link:hover { background: rgba(255, 255, 255, .2); }

.header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.hbtn {
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22);
  color: #eaf3fc; border-radius: 8px; padding: 7px 14px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.hbtn:hover { background: rgba(255, 255, 255, .2); }
.hbtn.active { background: #fff; color: var(--primary); border-color: #fff; font-weight: 600; }
.hbtn .badge-count {
  background: var(--accent); color: #fff; border-radius: 999px;
  font-size: 11px; padding: 0 6px; min-width: 17px; text-align: center;
}

/* 地区类目条 */
.catbar { background: #fff; border-bottom: 1px solid var(--border); }
.catbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: stretch; gap: 2px; overflow-x: auto;
}
.catbar-inner::-webkit-scrollbar { height: 0; }
.cat-item {
  border: 0; background: transparent; color: var(--text-2);
  padding: 12px 15px; font-size: 14px; white-space: nowrap;
  border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 7px;
}
.cat-item:hover { color: var(--primary-600); background: var(--surface-3); }
.cat-item.active { color: var(--primary); border-bottom-color: var(--accent); font-weight: 600; }
.cat-item .cnt {
  background: var(--surface-3); color: var(--muted); border-radius: 999px;
  font-size: 11px; padding: 0 7px; border: 1px solid var(--border);
}
.cat-item.active .cnt { background: var(--accent-50); color: var(--accent); border-color: #ffd7b3; }

/* ---------------- 布局 ---------------- */
.wrap { max-width: 1440px; margin: 0 auto; padding: 18px 20px 60px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 268px; gap: 16px; align-items: start; }
@media (max-width: 1240px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .rail { display: none; } }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { display: none; } }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-1);
}
.panel + .panel { margin-top: 14px; }
.panel-head {
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.panel-head .en { font-weight: 400; color: var(--muted); font-size: 11px; letter-spacing: .6px; }
.panel-body { padding: 10px 12px 14px; }

/* 侧栏筛选 */
.facet + .facet { margin-top: 4px; border-top: 1px dashed var(--border); padding-top: 10px; }
.facet-title {
  font-size: 12px; font-weight: 700; color: var(--text-2);
  margin: 0 0 7px; display: flex; align-items: center; justify-content: space-between;
}
.facet-title .mini-reset { font-size: 11px; color: var(--muted); cursor: pointer; border: 0; background: none; font-weight: 400; }
.facet-title .mini-reset:hover { color: var(--accent); }
.facet-list { display: flex; flex-direction: column; gap: 1px; max-height: 286px; overflow-y: auto; }
.facet-list::-webkit-scrollbar { width: 6px; }
.facet-list::-webkit-scrollbar-thumb { background: #cfdae6; border-radius: 3px; }
.facet-opt {
  display: flex; align-items: center; gap: 8px; padding: 5px 7px;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--text-2);
  border: 1px solid transparent;
}
.facet-opt:hover { background: var(--surface-3); color: var(--primary); }
.facet-opt.on { background: var(--primary-50); color: var(--primary); font-weight: 600; border-color: #cfe3f8; }
.facet-opt .box {
  width: 14px; height: 14px; border: 1px solid var(--border-strong); border-radius: 3px;
  flex: 0 0 auto; display: grid; place-items: center; background: #fff;
}
.facet-opt.on .box { background: var(--primary-600); border-color: var(--primary-600); }
.facet-opt.on .box::after { content: "✓"; color: #fff; font-size: 10px; line-height: 1; }
.facet-opt .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet-opt .cnt { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.facet-opt.on .cnt { color: var(--primary-600); }

.btn-reset {
  width: 100%; margin-top: 12px; border: 1px solid var(--border-strong);
  background: var(--surface-2); color: var(--text-2); border-radius: var(--radius-sm);
  padding: 7px; font-size: 13px;
}
.btn-reset:hover { background: #fff; border-color: var(--primary-600); color: var(--primary); }

/* ---------------- 工具条 ---------------- */
.toolbar {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 12px; box-shadow: var(--shadow-1);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.toolbar .result-count { font-size: 13px; color: var(--text-2); }
.toolbar .result-count b { color: var(--accent); font-size: 16px; font-family: var(--mono); }
.sorts { display: flex; gap: 4px; margin-left: auto; }
.sort-btn {
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  padding: 5px 11px; border-radius: var(--radius-sm); font-size: 13px;
}
.sort-btn:hover { color: var(--primary); background: var(--surface-3); }
.sort-btn.active { background: var(--primary-50); color: var(--primary); border-color: #cfe3f8; font-weight: 600; }

.active-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tagchip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-2);
  border-radius: 999px; padding: 3px 6px 3px 11px; font-size: 12px;
}
.tagchip b { font-weight: 600; color: var(--primary); }
.tagchip .x { border: 0; background: #e7eef7; color: var(--text-2); border-radius: 999px; width: 16px; height: 16px; line-height: 1; font-size: 11px; }
.tagchip .x:hover { background: var(--danger-bg); color: var(--danger); }

/* ---------------- 法规卡片 ---------------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow-1); transition: box-shadow .15s, border-color .15s, transform .15s;
  position: relative; overflow: hidden;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.card.core::before { background: linear-gradient(180deg, #ff6a00, #ffa04d); }
.card.key::before { background: linear-gradient(180deg, #0d63b5, #5aa6e8); }
.card:hover { box-shadow: var(--shadow-2); border-color: var(--border-strong); transform: translateY(-1px); }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.card-title {
  font-size: 16px; font-weight: 700; color: var(--text); margin: 0 0 3px;
  cursor: pointer; line-height: 1.45;
}
.card-title:hover { color: var(--primary-600); }
.card-en { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
.card-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 0 0 auto; }
.fav-btn {
  border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap;
}
.fav-btn:hover { border-color: var(--accent); color: var(--accent); }
.fav-btn.on { background: var(--accent-50); border-color: #ffc993; color: var(--accent); font-weight: 600; }

.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.badge {
  font-size: 11px; border-radius: var(--radius-sm); padding: 1px 8px;
  border: 1px solid transparent; white-space: nowrap;
}
.badge.region { background: var(--primary-50); color: var(--primary); border-color: #cfe3f8; }
.badge.level { background: var(--surface-3); color: var(--text-2); border-color: var(--border); }
.badge.status-现行有效 { background: var(--ok-bg); color: var(--ok); }
.badge.status-已修订 { background: var(--warn-bg); color: var(--warn); }
.badge.status-即将实施 { background: var(--info-bg); color: var(--info); }
.badge.status-征求意见 { background: var(--purple-bg); color: var(--purple); }
.badge.status-已废止 { background: #eceff3; color: var(--muted); }
.badge.core { background: linear-gradient(135deg, #ff6a00, #ff8f36); color: #fff; }
.badge.key { background: var(--primary-600); color: #fff; }

.meta-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
  gap: 4px 18px; font-size: 12.5px; color: var(--text-2); margin-bottom: 9px;
}
.meta-grid .k { color: var(--muted); }
.meta-grid .v { color: var(--text); font-weight: 600; word-break: break-word; }
.card-summary { font-size: 13px; color: var(--text-2); margin: 0 0 10px; line-height: 1.65; }
.card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 9px; border-top: 1px dashed var(--border); }
.topic-tag {
  font-size: 11.5px; background: var(--surface-3); color: var(--text-2);
  border-radius: var(--radius-sm); padding: 1px 8px; cursor: pointer; border: 1px solid var(--border);
}
.topic-tag:hover { background: var(--primary-50); color: var(--primary); border-color: #cfe3f8; }
.card-foot .spacer { flex: 1; }
.act {
  font-size: 12.5px; border-radius: var(--radius-sm); padding: 4px 12px;
  border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  display: inline-flex; align-items: center; gap: 5px;
}
.act:hover { border-color: var(--primary-600); color: var(--primary); background: #f6faff; }
.act.primary { background: var(--primary-600); border-color: var(--primary-600); color: #fff; }
.act.primary:hover { background: var(--primary); color: #fff; }
.act.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.act.accent:hover { filter: brightness(1.06); color: #fff; }

mark { background: #fff3c4; color: inherit; padding: 0 1px; border-radius: 2px; }

/* 空态 / 加载 */
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 10px; }
.empty h3 { color: var(--text-2); margin: 0 0 6px; }

.more-wrap { text-align: center; margin-top: 14px; }
.btn-more {
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2);
  border-radius: 999px; padding: 8px 30px; font-size: 13px;
}
.btn-more:hover { border-color: var(--primary-600); color: var(--primary); }

/* ---------------- 右栏 ---------------- */
.rail .stat-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: 13px; color: var(--text-2); }
.rail .stat-row .n { font-family: var(--mono); font-weight: 700; color: var(--primary); font-size: 15px; min-width: 34px; }
.rail .stat-row .bar { flex: 1; height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.rail .stat-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, #0d63b5, #59a6e8); border-radius: 999px; }
.rail .stat-row .bar i.hot { background: linear-gradient(90deg, #ff6a00, #ffa04d); }

.rank-item {
  display: flex; gap: 9px; padding: 7px 6px; border-radius: var(--radius-sm); cursor: pointer;
  align-items: flex-start;
}
.rank-item:hover { background: var(--surface-3); }
.rank-no {
  width: 19px; height: 19px; border-radius: 5px; background: var(--surface-3); color: var(--muted);
  font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: 0 0 auto; font-family: var(--mono);
}
.rank-item:nth-child(1) .rank-no { background: linear-gradient(135deg, #ff6a00, #ffa04d); color: #fff; }
.rank-item:nth-child(2) .rank-no { background: linear-gradient(135deg, #0d63b5, #5aa6e8); color: #fff; }
.rank-item:nth-child(3) .rank-no { background: linear-gradient(135deg, #0f8a5f, #4cc79b); color: #fff; }
.rank-txt { font-size: 12.5px; color: var(--text-2); line-height: 1.45; }
.rank-txt .t { color: var(--text); font-weight: 600; }
.rank-txt .m { font-size: 11px; color: var(--muted); display: block; }

.quick-links { display: flex; flex-direction: column; gap: 2px; }
.quick-links button {
  text-align: left; border: 0; background: transparent; color: var(--text-2);
  font-size: 13px; padding: 7px 8px; border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 9px;
}
.quick-links button:hover { background: var(--surface-3); color: var(--primary); }
.quick-links .ico { width: 20px; text-align: center; }

/* ---------------- Hero（未检索时） ---------------- */
.hero {
  background: linear-gradient(120deg, #0b4f92 0%, #12689c 55%, #1f86a8 100%);
  border-radius: var(--radius); padding: 26px 28px; color: #fff; margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px;
  border-radius: 50%; background: rgba(255, 255, 255, .07);
}
.hero h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: .5px; }
.hero p { margin: 0 0 18px; color: #cbe2f6; font-size: 13.5px; max-width: 760px; }
.hero-stats { display: flex; gap: 34px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero-stat .n { font-size: 26px; font-weight: 700; font-family: var(--mono); color: #ffd7a8; line-height: 1.2; }
.hero-stat .l { font-size: 12px; color: #b3d2ec; letter-spacing: .5px; }

.scene-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 16px; }
.scene-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; cursor: pointer; box-shadow: var(--shadow-1); transition: .15s;
  display: flex; gap: 11px; align-items: flex-start;
}
.scene-card:hover { border-color: var(--primary-600); box-shadow: var(--shadow-2); transform: translateY(-2px); }
.scene-card .ico { font-size: 21px; line-height: 1; }
.scene-card .nm { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.scene-card .ds { font-size: 12px; color: var(--muted); line-height: 1.5; }
.scene-card .ct { font-size: 11px; color: var(--primary); margin-top: 5px; font-family: var(--mono); }

/* ---------------- 详情抽屉 ---------------- */
.mask {
  position: fixed; inset: 0; background: rgba(11, 26, 48, .5); z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.mask.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 94vw); z-index: 101;
  background: var(--surface); box-shadow: var(--shadow-3);
  transform: translateX(102%); transition: transform .26s cubic-bezier(.22, .61, .36, 1);
  display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }
.drawer-head {
  padding: 15px 22px; border-bottom: 1px solid var(--border); background: var(--surface-2);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer-head h2 { margin: 0 0 4px; font-size: 19px; line-height: 1.4; }
.drawer-head .en { font-size: 12px; color: var(--muted); }
.drawer-head .close {
  margin-left: auto; border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  width: 30px; height: 30px; border-radius: 8px; font-size: 17px; line-height: 1; flex: 0 0 auto;
}
.drawer-head .close:hover { background: var(--danger-bg); color: var(--danger); border-color: #f0b6bd; }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }
.drawer-body::-webkit-scrollbar { width: 8px; }
.drawer-body::-webkit-scrollbar-thumb { background: #cdd9e6; border-radius: 4px; }

.sec { margin-bottom: 22px; }
.sec-h {
  font-size: 14px; font-weight: 700; margin: 0 0 10px; padding-left: 10px;
  border-left: 3px solid var(--accent); line-height: 1.3;
  display: flex; align-items: center; gap: 9px;
}
.sec-h .hint { font-size: 11.5px; color: var(--muted); font-weight: 400; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.kv .row { display: flex; border-bottom: 1px solid var(--border); font-size: 13px; }
.kv .row:last-child { border-bottom: 0; }
.kv .kk { flex: 0 0 108px; background: var(--surface-2); color: var(--muted); padding: 8px 12px; }
.kv .vv { flex: 1; padding: 8px 12px; color: var(--text); word-break: break-word; }

.art {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 7px; overflow: hidden; background: #fff;
}
.art-h {
  padding: 9px 13px; display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--surface-2);
}
.art-h:hover { background: var(--surface-3); }
.art-no {
  font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--primary);
  background: var(--primary-50); border-radius: 4px; padding: 1px 7px; flex: 0 0 auto;
}
.art-label { font-size: 13px; font-weight: 600; }
.art-h .arrow { margin-left: auto; color: var(--muted); font-size: 11px; transition: transform .18s; }
.art.open .art-h .arrow { transform: rotate(90deg); }
.art-c { display: none; padding: 11px 14px; font-size: 13.5px; color: var(--text-2); line-height: 1.8; border-top: 1px dashed var(--border); }
.art.open .art-c { display: block; }

.notice {
  background: var(--warn-bg); border: 1px solid #f3d7a8; color: #7a5100;
  border-radius: var(--radius-sm); padding: 10px 13px; font-size: 12.5px; line-height: 1.7;
}
.notice b { color: #5f3f00; }

.rel-list { display: flex; flex-wrap: wrap; gap: 7px; }
.rel-chip {
  border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  border-radius: 999px; padding: 4px 13px; font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center;
}
.rel-chip:hover { border-color: var(--primary-600); color: var(--primary); background: #f6faff; }
.rel-chip .rg { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }

.drawer-foot {
  border-top: 1px solid var(--border); padding: 12px 22px; background: var(--surface-2);
  display: flex; gap: 9px; flex-wrap: wrap; align-items: center;
}
.drawer-foot .spacer { flex: 1; }

/* ---------------- 下载中心 ---------------- */
.dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.dl-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 17px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 9px;
}
.dl-card .nm { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.dl-card .ds { font-size: 12.5px; color: var(--text-2); line-height: 1.65; flex: 1; }

/* ---------------- 底部 ---------------- */
.foot {
  margin-top: 30px; padding: 22px 20px 30px; border-top: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: 12.5px;
}
.foot-inner { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 24px; }
@media (max-width: 900px) { .foot-inner { grid-template-columns: 1fr; } }
.foot h4 { margin: 0 0 8px; font-size: 13px; color: var(--text-2); }
.foot ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.foot li { cursor: pointer; }
.foot li:hover { color: var(--primary-600); }
.foot .legal { grid-column: 1 / -1; border-top: 1px dashed var(--border); padding-top: 14px; line-height: 1.75; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 20px);
  background: #16233a; color: #fff; padding: 10px 22px; border-radius: 999px;
  font-size: 13px; z-index: 200; opacity: 0; pointer-events: none; transition: .22s;
  box-shadow: var(--shadow-3); max-width: 82vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media print { .header, .catbar, .topbar, .rail, .side, .toolbar, .drawer-foot { display: none; } }

/* ============================================================================
 * 注册流程模块
 * ==========================================================================*/

/* 流程视图：隐藏类目条与两侧栏，主区全宽 */
body.flow-mode .catbar,
body.flow-mode .side,
body.flow-mode .rail { display: none; }
body.flow-mode .layout { grid-template-columns: minmax(0, 1fr); }
.topbar-inner a.active { color: #fff; font-weight: 700; }

.flow { display: flex; flex-direction: column; gap: 16px; }

/* ---- 模块头部 ---- */
.flow-hero {
  background: linear-gradient(135deg, #0b4f92 0%, #14639f 52%, #1f7bb8 100%);
  color: #eaf3fc; border-radius: 14px; padding: 26px 28px; box-shadow: var(--shadow-2);
}
.flow-hero h1 { margin: 8px 0 10px; font-size: 25px; letter-spacing: .3px; color: #fff; }
.flow-hero p { margin: 0; max-width: 900px; font-size: 13.5px; line-height: 1.85; color: #d3e6f7; }
.flow-hero .fh-tag {
  display: inline-block; font-size: 11px; letter-spacing: 1.4px; font-weight: 700;
  background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .28);
  padding: 3px 11px; border-radius: 999px; color: #fff;
}
.flow-stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0 0; }
.flow-stats > div {
  background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .2);
  border-radius: 10px; padding: 9px 16px; min-width: 108px; display: flex; flex-direction: column;
}
.flow-stats .n { font-size: 21px; font-weight: 800; color: #fff; line-height: 1.2; }
.flow-stats .l { font-size: 11.5px; color: #cbe0f5; }
.fh-notice {
  margin-top: 15px; font-size: 12px; line-height: 1.7; color: #ffe8c9;
  background: rgba(255, 138, 0, .16); border: 1px solid rgba(255, 176, 74, .42);
  border-radius: 8px; padding: 8px 12px;
}

/* ---- 区块 ---- */
.flow-sec {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px 22px; box-shadow: var(--shadow-1);
}
.flow-h {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 0 6px; font-size: 18px; font-weight: 800; color: var(--text);
  padding-bottom: 12px; border-bottom: 2px solid var(--surface-3);
}
.flow-h .no {
  font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff;
  background: var(--primary); border-radius: 6px; padding: 3px 9px; letter-spacing: .5px;
}
.flow-h .hint { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: auto; }
.flow-sub {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 22px 0 10px; font-size: 14.5px; font-weight: 700; color: var(--text);
}
.flow-sub .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
.flow-intro { margin: 8px 0 0; font-size: 13.5px; line-height: 1.85; color: var(--text-2); }
.flow-acts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
.flow-acts.big { justify-content: center; margin: 4px 0 8px; }
.flow-acts.big .act { padding: 11px 22px; font-size: 14px; }

/* ---- 决策总览图 ---- */
.flow-diagram {
  display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; margin-top: 14px;
}
.fd-node {
  flex: 1 1 150px; min-width: 140px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px 14px; display: flex; flex-direction: column; gap: 3px;
  border-top: 3px solid var(--primary-600);
}
.fd-node .fd-no {
  width: 20px; height: 20px; border-radius: 50%; background: var(--primary-50); color: var(--primary);
  font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-bottom: 3px;
}
.fd-node .fd-t { font-size: 13.5px; font-weight: 700; color: var(--text); }
.fd-node .fd-d { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
.fd-arrow { display: grid; place-items: center; color: var(--border-strong); font-size: 22px; font-weight: 700; }
@media (max-width: 900px) { .fd-arrow { display: none; } }

/* ---- 分类判定 ---- */
.cls-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 16px; }
.cls-step {
  display: flex; gap: 12px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 15px;
}
.cs-no {
  flex: 0 0 auto; font-family: var(--mono); font-size: 11.5px; font-weight: 700;
  color: var(--primary); background: var(--primary-50); border: 1px solid #cfe3f8;
  border-radius: 6px; padding: 3px 7px; height: fit-content;
}
.cs-body { min-width: 0; }
.cs-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
.cs-desc { font-size: 12.8px; line-height: 1.75; color: var(--text-2); }
.cs-tip {
  margin-top: 8px; font-size: 12px; line-height: 1.65; color: #8a5b00;
  background: var(--warn-bg); border-radius: 6px; padding: 6px 9px;
}

/* ---- 法规依据 chip ---- */
.basis-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.basis-row .bl { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.basis-chip {
  font-size: 11.5px; border: 1px solid var(--border-strong); background: #fff;
  color: var(--primary-600); border-radius: 999px; padding: 3px 10px;
  max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.basis-chip:hover { background: var(--primary-50); border-color: var(--primary-600); }

/* ---- 表格 ---- */
.tbl-wrap { margin-top: 10px; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.flow-tbl { width: 100%; border-collapse: collapse; font-size: 12.6px; background: #fff; }
.flow-tbl th {
  background: var(--surface-3); color: var(--text-2); font-size: 12px; font-weight: 700;
  text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
.flow-tbl td { padding: 10px 12px; border-bottom: 1px solid var(--surface-3); vertical-align: top; line-height: 1.7; color: var(--text-2); }
.flow-tbl tr:last-child td { border-bottom: 0; }
.flow-tbl tbody tr:hover td { background: #fbfdff; }
.flow-tbl .fc-k { font-weight: 700; color: var(--text); white-space: nowrap; }
.flow-tbl .fc-r { min-width: 110px; background: repeating-linear-gradient(45deg, #fdfefe, #fdfefe 6px, #f6f9fc 6px, #f6f9fc 12px); }
.flow-tbl .c { text-align: center; white-space: nowrap; }
.flow-tbl .hl { font-weight: 700; color: var(--primary); }
.flow-tbl .muted { color: var(--muted); font-size: 11.5px; }

/* ---- 类别结论卡 ---- */
.dec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
.dec-card {
  text-align: left; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px;
  transition: .18s;
}
.dec-card:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.dc-class { font-size: 17px; font-weight: 800; color: var(--accent); }
.dc-act { font-size: 13px; font-weight: 700; color: var(--text); }
.dc-cond { font-size: 12px; color: var(--text-2); line-height: 1.65; }
.dc-go { font-size: 12px; color: var(--primary-600); font-weight: 700; margin-top: 3px; }

/* ---- 申报路径 ---- */
.pw-group + .pw-group { margin-top: 22px; }
.pw-group-h {
  display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; color: var(--text);
  margin-bottom: 10px; padding-left: 10px; border-left: 3px solid var(--primary);
}
.pw-group-h b {
  font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-50);
  border-radius: 999px; padding: 1px 8px;
}
.pw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.pw-card {
  position: relative; cursor: pointer; background: #fff; border: 1px solid var(--border);
  border-radius: 11px; padding: 15px 16px 14px; transition: .18s;
}
.pw-card:hover { border-color: var(--primary-600); box-shadow: var(--shadow-2); }
.pw-card.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-50), var(--shadow-2); }
.pw-ico { font-size: 21px; line-height: 1; }
.pw-name { margin: 7px 0 6px; font-size: 14.5px; font-weight: 700; color: var(--text); }
.pw-short { margin: 0; font-size: 12.5px; line-height: 1.7; color: var(--text-2); min-height: 42px; }
.pw-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pw-badge {
  font-size: 11px; border-radius: 999px; padding: 2px 9px;
  background: var(--primary-50); color: var(--primary); border: 1px solid #cfe3f8;
}
.pw-badge.time { background: var(--accent-50); color: #b34a00; border-color: #ffd7b3; }
.pw-org {
  margin-top: 9px; font-size: 11.5px; color: var(--muted); line-height: 1.6;
  padding-top: 9px; border-top: 1px dashed var(--border);
}
.pw-toggle { display: block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--primary-600); }

/* ---- 路径详情 ---- */
.pw-detail {
  margin-top: 14px; border: 1px solid var(--primary-600); border-radius: 12px;
  padding: 18px 20px 20px; background: linear-gradient(180deg, #f8fbff 0%, #fff 180px);
}
.pwd-h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 17px; font-weight: 800; color: var(--text); }
.pwd-grp {
  font-size: 11px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 999px; padding: 2px 10px;
}
.pwd-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px; margin-top: 14px; }
.pwd-kv > div { display: flex; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.pwd-kv .k { flex: 0 0 62px; font-size: 12px; font-weight: 700; color: var(--muted); }
.pwd-kv .v { font-size: 12.6px; line-height: 1.7; color: var(--text-2); }
.pwd-notes { margin-top: 18px; background: var(--warn-bg); border: 1px solid #f0dcb8; border-radius: 10px; padding: 12px 15px; }
.pn-h { font-size: 12.5px; font-weight: 800; color: #8a5b00; margin-bottom: 6px; }
.pwd-notes ul, .tl-rules ul, .ds-tips ul { margin: 0; padding-left: 18px; }
.pwd-notes li, .ds-tips li { font-size: 12.4px; line-height: 1.8; color: #7a5200; }

/* ---- 时间轴 ---- */
.timeline { list-style: none; margin: 6px 0 0; padding: 0 0 0 6px; }
.tls { position: relative; display: flex; gap: 14px; padding: 0 0 18px 0; }
.tls::before {
  content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 2px; background: var(--border);
}
.tls:last-child::before { display: none; }
.tls-no {
  flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; z-index: 1;
  font-family: var(--mono);
}
.tls-body { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; }
.tls-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tls-name { font-size: 14px; font-weight: 700; color: var(--text); }
.tls-due {
  font-size: 11.5px; font-weight: 700; color: #b34a00; background: var(--accent-50);
  border: 1px solid #ffd7b3; border-radius: 999px; padding: 2px 9px;
}
.tls-org { margin-top: 6px; font-size: 12px; color: var(--primary-600); font-weight: 600; }
.tls-detail { margin-top: 6px; font-size: 12.6px; line-height: 1.8; color: var(--text-2); }

/* ---- 资料清单 ---- */
.ds-progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.ds-bar { flex: 1; height: 7px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.ds-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary-600), #38a3e0); transition: width .25s; }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 14px; }
.ds-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; }
.ds-h { display: flex; align-items: center; gap: 9px; padding-bottom: 9px; border-bottom: 1px dashed var(--border); }
.ds-no {
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: #fff;
  background: var(--primary); border-radius: 6px; padding: 2px 8px;
}
.ds-name { font-size: 14px; font-weight: 700; color: var(--text); }
.ds-cnt { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.ds-items { margin-top: 9px; display: flex; flex-direction: column; gap: 2px; }
.ds-item {
  display: flex; align-items: flex-start; gap: 9px; padding: 6px 8px; border-radius: 6px;
  cursor: pointer; font-size: 12.6px; line-height: 1.7; color: var(--text-2);
}
.ds-item:hover { background: #fff; }
.ds-item.on { color: var(--primary); font-weight: 600; background: var(--primary-50); }
.ds-item input { margin: 3px 0 0; accent-color: var(--primary-600); flex: 0 0 auto; }
.ds-item span { min-width: 0; }
.ds-tips { margin-top: 16px; background: var(--info-bg); border: 1px solid #cfe1f8; border-radius: 10px; padding: 12px 15px; }
.ds-tips .pn-h { color: var(--primary); }
.ds-tips li { font-size: 12.4px; line-height: 1.8; color: var(--text-2); }

/* ---- 时限推算 ---- */
.tl-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 16px; }
.tl-f { display: flex; flex-direction: column; gap: 6px; }
.tl-f > span { font-size: 12px; font-weight: 700; color: var(--text-2); }
.tl-f select, .tl-f input {
  font-family: inherit; font-size: 13px; color: var(--text); background: #fff;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 11px; min-width: 190px;
}
.tl-f select:focus, .tl-f input:focus { outline: none; border-color: var(--primary-600); box-shadow: 0 0 0 3px var(--primary-50); }
.tl-out:empty { display: none; }
.tl-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 11px; margin-top: 18px; }
.tls-card {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 14px; display: flex; flex-direction: column; gap: 3px;
}
.tls-card .k { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.tls-card .v { font-size: 17px; font-weight: 800; color: var(--text); font-family: var(--mono); }
.tls-card .v.hi { color: var(--accent); }
.tl-note {
  margin-top: 12px; font-size: 12.2px; line-height: 1.8; color: #7a5200;
  background: var(--warn-bg); border: 1px solid #f0dcb8; border-radius: 9px; padding: 10px 14px;
}
.tl-warn { margin-top: 14px; font-size: 13px; color: var(--danger); background: var(--danger-bg); border-radius: 8px; padding: 10px 14px; }
.tl-rules { margin-top: 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; }
.tl-rules .pn-h { color: var(--text-2); }
.tl-rules li { font-size: 12.3px; line-height: 1.8; color: var(--text-2); }

@media (max-width: 760px) {
  .flow-hero { padding: 20px 18px; }
  .flow-hero h1 { font-size: 20px; }
  .flow-sec { padding: 16px 14px 18px; }
  .cls-steps, .pw-grid, .ds-grid { grid-template-columns: 1fr; }
  .flow-h .hint { margin-left: 0; width: 100%; }
}

/* ============================================================================
 * 文档审查工作台
 * ==========================================================================*/
body.review-mode .catbar,
body.review-mode .side,
body.review-mode .rail { display: none; }
body.review-mode .layout { grid-template-columns: minmax(0, 1fr); }

.rv { display: flex; flex-direction: column; gap: 14px; }
.rv-hero {
  position: relative; overflow: hidden; color: #fff;
  background: linear-gradient(135deg, #0b3c72 0%, #0d63b5 58%, #1487d6 100%);
  border-radius: 14px; padding: 26px 30px 24px; box-shadow: var(--shadow-2);
}
.rv-hero::after {
  content: ""; position: absolute; right: -70px; top: -70px;
  width: 260px; height: 260px; border-radius: 50%; background: rgba(255, 255, 255, .08);
}
.rv-hero h1 { margin: 10px 0 8px; font-size: 25px; letter-spacing: .5px; }
.rv-hero p { margin: 0; font-size: 13.4px; line-height: 1.85; color: rgba(255, 255, 255, .9); max-width: 960px; }
.rv-hero .fh-tag {
  display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 1.4px;
  color: #cfe6ff; background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .24); border-radius: 999px; padding: 3px 12px;
}
.rv-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 18px; position: relative; }
.rv-stats > div { background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .2); border-radius: 10px; padding: 11px 14px; }
.rv-stats .n { display: block; font-size: 22px; font-weight: 800; font-family: var(--mono); }
.rv-stats .l { font-size: 11.6px; color: rgba(255, 255, 255, .82); }

.rv-grid { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 16px; align-items: start; }
.rv-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
.rv-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.rv-side .panel + .panel, .rv-report .panel + .panel { margin-top: 0; }

/* 侧栏控件 */
.rv-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 11px; }
.rv-mode {
  font-family: inherit; font-size: 12.4px; font-weight: 600; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 8px; cursor: pointer; text-align: center; transition: .15s;
}
.rv-mode:hover { border-color: var(--primary-600); color: var(--primary); }
.rv-mode.on { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(11, 79, 146, .24); }
.rv-sel {
  width: 100%; font-family: inherit; font-size: 13px; color: var(--text); background: #fff;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px;
}
.rv-sel:focus { outline: none; border-color: var(--primary-600); box-shadow: 0 0 0 3px var(--primary-50); }
.rv-lab { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin: 13px 0 6px; }
.rv-hint { font-size: 11.8px; line-height: 1.7; color: var(--muted); margin-top: 7px; }
.rv-file { width: 100%; font-size: 12.4px; font-family: inherit; color: var(--text-2); }
.rv-text {
  width: 100%; min-height: 170px; resize: vertical; font-family: var(--mono); font-size: 12.2px;
  line-height: 1.75; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 12px;
}
.rv-text:focus { outline: none; border-color: var(--primary-600); background: #fff; box-shadow: 0 0 0 3px var(--primary-50); }
.rv-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 11.8px; color: var(--muted); }
.rv-samples { display: flex; flex-direction: column; gap: 6px; }
.rv-samples .act { text-align: left; font-size: 12.2px; padding: 7px 10px; }
.rv-run { width: 100%; margin-top: 14px; padding: 11px; font-size: 13.6px; font-weight: 700; }
.rv-basis { border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 11px; }
.rv-basis-h { display: flex; flex-direction: column; gap: 2px; }
.rv-basis-h b { font-size: 12.8px; color: var(--primary); }
.rv-basis-h span { font-size: 11.5px; color: var(--muted); }
.rv-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; max-height: 172px; overflow: auto; }
.rv-chip {
  font-family: inherit; font-size: 11.3px; color: var(--text-2); text-align: left; max-width: 100%;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 7px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rv-chip:hover { border-color: var(--primary-600); color: var(--primary); background: var(--primary-50); }
.rv-more { font-size: 11.5px; color: var(--muted); }
.rv-custom input {
  width: 100%; font-family: inherit; font-size: 12.6px; color: var(--text); background: #fff;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px;
}
.rv-custom input:focus { outline: none; border-color: var(--primary-600); box-shadow: 0 0 0 3px var(--primary-50); }
.rv-opts { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; max-height: 214px; overflow: auto; }
.rv-opt {
  font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; cursor: pointer;
}
.rv-opt .t { font-size: 12.3px; color: var(--text); font-weight: 600; }
.rv-opt .d { font-size: 11.2px; color: var(--muted); font-family: var(--mono); }
.rv-opt:hover { border-color: var(--primary-600); }
.rv-opt.on { background: var(--ok-bg); border-color: #b6e2d0; }
.rv-opt.on .t::after { content: "  ✓ 已加入"; color: var(--ok); font-size: 11px; }
.rv-custom-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.rv-custom-acts .act { font-size: 11.8px; padding: 6px 9px; }

/* 审查报告 */
.rv-empty .rv-flow-hint { margin-top: 14px; font-size: 12.4px; line-height: 1.8; color: var(--primary); background: var(--primary-50); border-radius: 8px; padding: 10px 14px; }
.rv-report { display: flex; flex-direction: column; gap: 14px; }
.rv-score { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; padding: 20px 22px; }
.rv-score-n {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0b4f92, #1487d6); border-radius: 12px; color: #fff; padding: 16px 10px;
}
.rv-score-n .v { font-size: 46px; font-weight: 800; font-family: var(--mono); line-height: 1; }
.rv-score-n .u { font-size: 12px; color: rgba(255, 255, 255, .78); margin-top: 4px; }
.rv-score-n .g { font-size: 12.4px; margin-top: 10px; color: rgba(255, 255, 255, .92); }
.rv-score-n .g b { font-size: 14px; }
.rv-score-s { display: flex; flex-direction: column; gap: 7px; }
.rv-score-s .ln { display: flex; align-items: baseline; gap: 10px; font-size: 12.8px; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
.rv-score-s .ln > span { flex: 0 0 96px; color: var(--muted); font-size: 12px; }
.rv-score-s .ln > b { color: var(--text); font-weight: 600; }
.rv-score-s .ln > b.hi { color: var(--danger); margin-right: 10px; }
.rv-score-s .ln > b.md { color: var(--warn); margin-right: 10px; }
.rv-score-s .ln > b.lo { color: var(--muted); }
.rv-dims { padding: 16px 20px; }
.rv-sec-t { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 11px; }
.rv-dim { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 12.4px; }
.rv-dim .nm { flex: 0 0 78px; color: var(--text-2); }
.rv-dim .bar { flex: 1; height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.rv-dim .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #ffa04d); }
.rv-dim b { flex: 0 0 26px; text-align: right; font-family: var(--mono); color: var(--text); }
.rv-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.rv-acts .act { font-size: 12.6px; padding: 9px 13px; }
.rv-sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 18px 20px; }
.rv-sec-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.rv-sec-h h3 { margin: 0; font-size: 15px; color: var(--text); }
.rv-lvs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.rv-lv {
  font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.rv-lv:hover { border-color: var(--primary-600); color: var(--primary); }
.rv-lv.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.rv-issues { display: flex; flex-direction: column; gap: 10px; }
.rv-issue { border: 1px solid var(--border); border-left: 4px solid var(--border-strong); border-radius: 9px; padding: 12px 15px; background: var(--surface-2); }
.rv-issue.hi { border-left-color: var(--danger); background: #fffafa; }
.rv-issue.md { border-left-color: var(--warn); background: #fffdf7; }
.rv-issue.lo { border-left-color: var(--muted); }
.rv-issue-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rv-issue-h b { font-size: 13.4px; color: var(--text); }
.rv-issue-h .lv { font-size: 11.2px; font-weight: 800; border-radius: 5px; padding: 2px 7px; color: #fff; }
.rv-issue-h .lv.hi { background: var(--danger); }
.rv-issue-h .lv.md { background: var(--warn); }
.rv-issue-h .lv.lo { background: var(--muted); }
.rv-issue-h .dm { font-size: 11.4px; color: var(--primary); background: var(--primary-50); border-radius: 5px; padding: 2px 7px; }
.rv-issue-d { margin-top: 7px; font-size: 12.7px; line-height: 1.8; color: var(--text-2); }
.rv-evi {
  margin-top: 7px; font-size: 11.8px; line-height: 1.8; color: #7a5200; word-break: break-all;
  background: var(--warn-bg); border-radius: 7px; padding: 8px 11px; font-family: var(--mono);
}
.rv-issue-f { margin-top: 7px; font-size: 12.5px; line-height: 1.8; color: var(--text-2); background: #fff; border: 1px dashed var(--border-strong); border-radius: 7px; padding: 9px 12px; }
.rv-issue-f i { font-style: normal; font-weight: 700; color: var(--ok); margin-right: 6px; }
.rv-cite { margin-top: 6px; font-size: 11.6px; color: var(--muted); }
.rv-covered { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); overflow: hidden; }
.rv-covered .sec-h {
  width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0;
  font-family: inherit; font-size: 13.6px; font-weight: 700; color: var(--text);
  padding: 15px 20px; cursor: pointer; text-align: left;
}
.rv-covered .sec-h .hint { font-size: 11.6px; font-weight: 400; color: var(--muted); }
.rv-covered-body { display: none; padding: 0 20px 16px; }
.rv-covered.open .rv-covered-body { display: block; }
.rv-cv { font-size: 12.5px; line-height: 1.85; color: var(--text-2); border-bottom: 1px dashed var(--border); padding: 7px 0; }
.rv-cv .dm { font-size: 11.2px; color: var(--primary); background: var(--primary-50); border-radius: 5px; padding: 1px 6px; margin-right: 8px; }
.rv-cv em { font-style: normal; color: var(--ok); margin-left: 8px; font-size: 11.6px; }
.rv-disclaim { font-size: 11.8px; line-height: 1.8; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 9px; padding: 11px 15px; }

@media (max-width: 980px) {
  .rv-grid { grid-template-columns: minmax(0, 1fr); }
  .rv-side { position: static; }
  .rv-score { grid-template-columns: minmax(0, 1fr); }
  .rv-hero { padding: 20px 18px; }
  .rv-hero h1 { font-size: 20px; }
}

/* ============================================================================
 * 申报前自检清单
 * ==========================================================================*/
body.selfcheck-mode .catbar,
body.selfcheck-mode .side,
body.selfcheck-mode .rail { display: none; }
body.selfcheck-mode .layout { grid-template-columns: minmax(0, 1fr); }
body.selfcheck-mode .wrap { max-width: 1420px; }

.sc-hero {
  background: linear-gradient(135deg, #0b4f92 0%, #0d63b5 58%, #1b7fc9 100%);
  border-radius: var(--radius);
  padding: 26px 26px 22px;
  color: #fff;
  box-shadow: var(--shadow-2);
  margin-bottom: 16px;
}
.sc-hero h1 { font-size: 23px; font-weight: 800; margin: 8px 0 8px; letter-spacing: .2px; }
.sc-hero p { font-size: 13.4px; line-height: 1.8; color: rgba(255, 255, 255, .88); margin: 0; max-width: 1120px; }
.sc-hero .fh-notice {
  margin-top: 14px; font-size: 12.2px; line-height: 1.72; color: #ffe9d6;
  background: rgba(255, 255, 255, .1); border-left: 3px solid var(--accent);
  padding: 9px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.sc-hero .rv-stats { display: flex; gap: 26px; margin-top: 16px; flex-wrap: wrap; }
.sc-hero .rv-stats .n { font-size: 26px; font-weight: 800; }
.sc-hero .rv-stats .n.hi { color: #ffd0d6; }
.sc-hero .rv-stats .n.md { color: #ffe0a8; }
.sc-hero .rv-stats .l { font-size: 12px; color: rgba(255, 255, 255, .74); }
.sc-hero .rv-stats > div { display: flex; flex-direction: column; gap: 1px; }

/* ---------- 侧栏 ---------- */
.sc-lab { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin: 12px 0 6px; }
.sc-pathhint {
  margin-top: 9px; font-size: 12.2px; line-height: 1.72; color: var(--text-2);
  background: var(--surface-3); border-left: 3px solid var(--primary-50);
  padding: 8px 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.sc-pathstat {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12.4px; color: var(--text-2); padding: 6px 0; border-top: 1px dashed var(--border);
}
.sc-pathstat:first-of-type { margin-top: 8px; }
.sc-pathstat b { font-size: 13px; }
.sc-pathstat b.hi { color: var(--danger); }

.sc-prog { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow-1); }
.sc-prog-h { display: flex; justify-content: space-between; align-items: center; font-size: 12.4px; color: var(--text-2); }
.sc-prog-h b { font-size: 12.4px; }
.sc-prog-h b.hi { color: var(--danger); }
.sc-prog-h b.md { color: var(--warn); }
.sc-prog-h b.ok { color: var(--ok); }
.sc-prog-n { display: flex; align-items: baseline; gap: 3px; margin: 2px 0 4px; }
.sc-prog-n .v { font-size: 30px; font-weight: 800; color: var(--primary); line-height: 1.1; }
.sc-prog-n .u { font-size: 14px; font-weight: 700; color: var(--muted); }
.sc-prog-msg { font-size: 12px; color: var(--text-2); line-height: 1.6; margin-bottom: 10px; }
.sc-pseg { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 7px; align-items: center; font-size: 11.6px; color: var(--text-2); margin-bottom: 6px; }
.sc-pseg .bar { height: 7px; background: var(--surface-3); border-radius: 4px; overflow: hidden; display: block; }
.sc-pseg .bar i { display: block; height: 100%; border-radius: 4px; transition: width .3s; }
.sc-pseg .bar i.w-red { background: var(--danger); }
.sc-pseg .bar i.w-key { background: #e0a33c; }
.sc-pseg .bar i.w-adv { background: var(--info); }
.sc-pseg b { font-size: 11.4px; color: var(--text); white-space: nowrap; }

.sc-fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.sc-fchip {
  font: inherit; font-size: 12px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  padding: 5px 10px; border-radius: 20px; transition: .15s;
}
.sc-fchip:hover { border-color: var(--primary-600); color: var(--primary); }
.sc-fchip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.sc-fchip i { font-style: normal; opacity: .72; font-size: 11px; margin-left: 3px; }
.sc-toggle {
  width: 100%; margin-top: 12px; font: inherit; font-size: 12.4px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  padding: 8px; border-radius: var(--radius-sm); transition: .15s;
}
.sc-toggle:hover { border-color: var(--primary-600); }
.sc-toggle.on { background: var(--primary-50); border-color: #b7d5f2; color: var(--primary); font-weight: 700; }
.sc-reset { width: 100%; margin-top: 8px; font-size: 12.2px; }

/* ---------- 评分卡 ---------- */
.sc-report { display: flex; flex-direction: column; gap: 12px; }
.sc-score {
  display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 20px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow-1);
}
.sc-score-n { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; border-right: 1px dashed var(--border); }
.sc-score-n .v { font-size: 54px; font-weight: 800; color: var(--primary); line-height: 1; letter-spacing: -1px; }
.sc-score-n .u { font-size: 15px; font-weight: 700; color: var(--muted); margin-top: -30px; margin-left: 68px; }
.sc-score-n .g { font-size: 13px; color: var(--text-2); margin-top: 10px; }
.sc-score-n .g b.hi { color: var(--danger); }
.sc-score-n .g b.md { color: var(--warn); }
.sc-score-n .g b.ok { color: var(--ok); }
.sc-score-s { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 22px; align-content: center; }
.sc-score-s .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.6px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
.sc-score-s .ln span { color: var(--muted); white-space: nowrap; }
.sc-score-s .ln b { font-weight: 700; color: var(--text); text-align: right; }
.sc-score-s .ln b.hi { color: var(--danger); }
.sc-score-s .ln b.md { color: var(--warn); }
.sc-score-s .ln b.ok { color: var(--ok); }

.sc-alert {
  background: var(--danger-bg); border: 1px solid #f3c6cb; border-left: 4px solid var(--danger);
  border-radius: var(--radius); padding: 12px 15px;
}
.sc-alert b { display: block; font-size: 13.4px; color: var(--danger); margin-bottom: 6px; }
.sc-alert ul { margin: 0; padding-left: 20px; font-size: 12.6px; color: var(--text-2); line-height: 1.85; }
.sc-alert.ok { background: var(--ok-bg); border-color: #b6e2d0; border-left-color: var(--ok); }
.sc-alert.ok b { color: var(--ok); }
.sc-alert.ok p { margin: 0; font-size: 12.6px; color: var(--text-2); }

/* ---------- 分布条 ---------- */
.sc-dims { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-1); }
.sc-lvrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 12.4px; }
.sc-lvrow .nm { color: var(--text-2); white-space: nowrap; }
.sc-lvrow .stk { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--surface-3); }
.sc-lvrow .stk .seg { display: block; height: 100%; transition: width .3s; }
.sc-lvrow .stk .seg.d { background: var(--ok); }
.sc-lvrow .stk .seg.n { background: #b8c6d6; }
.sc-lvrow .stk .seg.t { background: var(--danger); }
.sc-lvrow b { font-size: 11.8px; color: var(--text-2); white-space: nowrap; }
.sc-legend { display: flex; gap: 16px; margin-top: 8px; padding-top: 9px; border-top: 1px dashed var(--border); font-size: 11.8px; color: var(--muted); }
.sc-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sc-legend i.seg.d { background: var(--ok); }
.sc-legend i.seg.n { background: #b8c6d6; }
.sc-legend i.seg.t { background: var(--danger); }

/* ---------- 阶段分组 ---------- */
.sc-sec { display: flex; flex-direction: column; gap: 14px; }
.sc-sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sc-sec-h h3 { font-size: 15.5px; font-weight: 700; margin: 0; }
.sc-sec-h .hint { font-size: 12px; color: var(--muted); }
.sc-stage { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-1); }
.sc-stage-h {
  display: grid; grid-template-columns: 34px 30px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 12px 15px; background: var(--surface-3); border-bottom: 1px solid var(--border);
}
.sc-stage-h .no { font-size: 15px; font-weight: 800; color: var(--primary); text-align: center; }
.sc-stage-h .ico { font-size: 17px; text-align: center; }
.sc-stage-h .tt b { display: block; font-size: 14px; }
.sc-stage-h .tt span { font-size: 11.8px; color: var(--muted); }
.sc-stage-h .pg { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.sc-stage-h .pg b { font-size: 13px; color: var(--text); }
.sc-stage-h .pg em { font-style: normal; font-size: 11.4px; }
.sc-stage-h .pg em.hi { color: var(--danger); font-weight: 700; }
.sc-stage-h .pg em.ok { color: var(--ok); }
.sc-list { display: flex; flex-direction: column; }

/* ---------- 条目 ---------- */
.sc-item { padding: 13px 16px 13px 18px; border-bottom: 1px solid var(--border); border-left: 4px solid transparent; transition: background .15s; }
.sc-item:last-child { border-bottom: none; }
.sc-item.lv-red { border-left-color: var(--danger); }
.sc-item.lv-key { border-left-color: #e0a33c; }
.sc-item.lv-adv { border-left-color: var(--info); }
.sc-item.st-ok { background: #f4fbf7; }
.sc-item.st-na { background: var(--surface-2); }
.sc-item.st-na .sc-title, .sc-item.st-na .sc-ask { color: var(--muted); }
.sc-item.st-ok .sc-title::after { content: " ✓"; color: var(--ok); }

.sc-item-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sc-lv { font-size: 11.4px; font-weight: 700; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.lv-red .sc-lv { background: var(--danger-bg); color: var(--danger); }
.lv-key .sc-lv { background: var(--warn-bg); color: var(--warn); }
.lv-adv .sc-lv { background: var(--info-bg); color: var(--info); }
.sc-title { font-size: 13.8px; font-weight: 700; color: var(--text); flex: 1; min-width: 200px; }
.sc-mks { display: flex; gap: 5px; }
.sc-mk {
  font: inherit; font-size: 11.8px; cursor: pointer; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  padding: 4px 9px; border-radius: var(--radius-sm); transition: .15s;
}

.mk-regsvc-item .m { font-size: 11.2px; color: var(--muted); }

@media (max-width: 1080px) {
