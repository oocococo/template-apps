<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/* =========================================================
 * 过去多久 · 事项计时器 —— 样式
 * 暗色为主，跟随系统偏好自动切换浅色
 * ========================================================= */

:root {
  color-scheme: dark;
  --bg: #0e1016;
  --bg-glow-1: rgba(108, 140, 255, 0.14);
  --bg-glow-2: rgba(56, 217, 169, 0.08);
  --surface: #161a26;
  --surface-2: #1c2130;
  --border: #272d40;
  --text: #e9ecf5;
  --text-dim: #97a0b8;
  --accent: #7c96ff;
  --accent-strong: #5d7cff;
  --accent-rgb: 124, 150, 255;
  --danger: #ff7a85;
  --fresh: #3ddc97;
  --recent: #63b3ff;
  --aging: #ffc44d;
  --stale: #ff7a85;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f6fb;
    --bg-glow-1: rgba(93, 124, 255, 0.12);
    --bg-glow-2: rgba(56, 217, 169, 0.10);
    --surface: #ffffff;
    --surface-2: #f0f3fa;
    --border: #e2e7f2;
    --text: #1c2233;
    --text-dim: #66708c;
    --accent: #4f68e8;
    --accent-strong: #4f68e8;
    --accent-rgb: 79, 104, 232;
    --danger: #e5484d;
    --fresh: #17a56b;
    --recent: #2b7fd4;
    --aging: #d9920d;
    --stale: #e5484d;
    --shadow: 0 8px 24px rgba(28, 34, 51, 0.08);
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(60rem 30rem at 110% -10%, var(--bg-glow-1), transparent 60%),
    radial-gradient(50rem 26rem at -10% 110%, var(--bg-glow-2), transparent 60%),
    var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: 40px 20px 60px;
}

.hidden { display: none !important; }

/* ---------- 头部 ---------- */

.app-header h1 {
  margin: 0 0 8px;
  font-size: 30px;
  letter-spacing: 0.5px;
}

.title-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.stats {
  font-size: 13px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 10px;
}

.subtitle {
  margin: 0 0 24px;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.7;
}

/* ---------- 录入区 ---------- */

.composer {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow);
}

.composer-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.composer-row-sub { flex-wrap: wrap; }

.text-input {
  flex: 1;
  min-width: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.text-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.25);
}

.switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}

.switch input {
  accent-color: var(--accent-strong);
  width: 15px;
  height: 15px;
  cursor: pointer;
}

/* ---------- 按钮 ---------- */

.btn {
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.05s, background 0.15s, border-color 0.15s, color 0.15s;
}

.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--accent-strong);
  color: #ffffff;
  font-weight: 600;
}

.btn-primary:hover { background: var(--accent); }

.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text-dim);
}

.btn-ghost:hover {
  color: var(--text);
  border-color: var(--accent);
}

.btn-record {
  background: rgba(var(--accent-rgb), 0.14);
  border-color: rgba(var(--accent-rgb), 0.35);
  color: var(--accent);
  font-weight: 600;
}

.btn-record:hover { background: rgba(var(--accent-rgb), 0.24); }

.btn-del.armed {
  background: var(--danger);
  border-color: var(--danger);
  color: #ffffff;
  font-weight: 700;
}

/* ---------- 卡片网格 ---------- */

.grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.15s, transform 0.15s;
}

.card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--text-dim);
}

.dot[data-freshness="fresh"]  { background: var(--fresh);  box-shadow: 0 0 8px var(--fresh); }
.dot[data-freshness="recent"] { background: var(--recent); box-shadow: 0 0 8px var(--recent); }
.dot[data-freshness="aging"]  { background: var(--aging);  box-shadow: 0 0 8px var(--aging); }
.dot[data-freshness="stale"]  { background: var(--stale);  box-shadow: 0 0 8px var(--stale); }

.card-name {
  margin: 0;
  flex: 1 1 100%;
  min-width: 0;
  font-size: 17px;
  font-weight: 650;
  overflow-wrap: anywhere;
}

.card-name-input {
  flex: 1 1 100%;
  min-width: 0;
  background: var(--surface-2);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
}

.card-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.card-actions .btn {
  padding: 7px 11px;
  font-size: 13px;
}

/* ---------- 计时展示 ---------- */

.card-body {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.elapsed-label {
  font-size: 12px;
  color: var(--text-dim);
}

.elapsed {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
  font-family: "SF Mono", "Cascadia Code", "Cascadia Mono", Consolas,
    "JetBrains Mono", "Courier New", monospace;
}

.card-meta {
  margin: 0;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.8;
}

/* ---------- 空状态 ---------- */

.empty {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 48px 20px;
  text-align: center;
  color: var(--text-dim);
  margin-top: 20px;
}

.empty p {
  margin: 6px 0 0;
  font-size: 15px;
  color: var(--text);
}

.empty .empty-sub {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 4px;
}

.empty-icon {
  width: 34px;
  height: 34px;
  margin: 0 auto 10px;
  color: var(--accent);
  opacity: 0.8;
}

/* ---------- 页脚 ---------- */

.app-footer {
  margin-top: 28px;
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(16px);
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 10;
  max-width: 90vw;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------- 响应式 ---------- */

@media (max-width: 560px) {
  .app { padding: 24px 14px 48px; }
  .composer-row { flex-direction: column; align-items: stretch; }
  .elapsed { font-size: 21px; }
}

  <!--pnid:ZAKqFTotCwCW0cjd3Jpyq5--><!-- 轻提示 -->

  <div style="text-align:center;font-size:12px">示例体验，数据仅保留在本页 <button type="button" id="reset-demo">恢复示例</button></div><script>/* =========================================================
 * 过去多久 · 事项计时器
 * 纯前端实现：localStorage 持久化 + setInterval 逐秒刷新
 * 零依赖，浏览器直接打开 index.html 即可运行
 * ========================================================= */
(() => {
  'use strict';

  /* ---------- 常量 ---------- */
  const STORAGE_KEY = 'elapsed-tracker:v1';
  const localStorage = { data: JSON.stringify([{id:'sample',name:'去图书馆',lastDoneAt:Date.now()-90061000,createdAt:Date.now()-90061000}]), getItem(){return this.data}, setItem(k,v){this.data=v} };
  const MAX_NAME_LEN = 50;
  let toastTimer = null;

  /* ---------- DOM 引用 ---------- */
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const statsEl = document.getElementById('stats');
  const nameInput = document.getElementById('name-input');
  const addForm = document.getElementById('add-form');
  const customToggle = document.getElementById('custom-time-toggle');
  const customTime = document.getElementById('custom-time');
  const toastEl = document.getElementById('toast');

  /* ---------- 通用工具 ---------- */
  const pad2 = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  /* =========================================================
   * 数据层
   * ========================================================= */

  /** 从 localStorage 读取并清洗数据（损坏数据按空列表启动） */
  function loadEvents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) return [];
      return data
        .filter((e) => e && typeof e.name === 'string' && Number.isFinite(Number(e.lastDoneAt)))
        .map((e) => ({
          id: typeof e.id === 'string' && e.id ? e.id : uid(),
          name: e.name.trim().slice(0, MAX_NAME_LEN),
          lastDoneAt: Number(e.lastDoneAt),
          createdAt: Number.isFinite(Number(e.createdAt)) ? Number(e.createdAt) : Number(e.lastDoneAt),
        }));
    } catch (err) {
      console.warn('读取本地数据失败，已按空列表启动：', err);
      return [];
    }
  }

  function saveEvents() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    } catch (err) {
      toast('保存失败：本地存储不可用或已满');
    }
  }

  let events = loadEvents();

  const findByName = (name) => events.find((e) => e.name === name);

  /**
   * 新增事项 / 记录一次完成
   * 规则：相同名称视为同一项 —— 已存在则仅把 lastDoneAt 重置为本次完成时刻，
   * 不重复创建；不存在则新建（创建时刻即首次完成时刻）。
   * 返回 { event, existed }，existed 表示是否重置了已有事项。
   */
  function addOrRecord(rawName, doneAt) {
    const name = (rawName || '').trim();
    if (!name) return null;
    const ts = Number.isFinite(doneAt) ? Math.min(doneAt, Date.now()) : Date.now();
    const exist = findByName(name);
    if (exist) {
      exist.lastDoneAt = ts;
      saveEvents();
      render();
      return { event: exist, existed: true };
    }
    const ev = { id: uid(), name, lastDoneAt: ts, createdAt: ts };
    events.push(ev);
    saveEvents();
    render();
    return { event: ev, existed: false };
  }

  /**
   * 重命名：新名称与已有事项冲突时自动合并
   * （保留两者中较近的一次完成时间，删除被改名的那一项）。
   */
  function renameEvent(id, rawNewName) {
    const newName = (rawNewName || '').trim();
    if (!newName) return { ok: false };
    const target = events.find((e) => e.id === id);
    if (!target) return { ok: false };
    if (target.name === newName) { render(); return { ok: true }; }
    const conflict = findByName(newName);
    if (conflict) {
      conflict.lastDoneAt = Math.max(conflict.lastDoneAt, target.lastDoneAt);
      events = events.filter((e) => e.id !== id);
      saveEvents();
      render();
      return { ok: true, mergedInto: conflict.name };
    }
    target.name = newName;
    saveEvents();
    render();
    return { ok: true };
  }

  function removeEvent(id) {
    const removed = events.find((e) => e.id === id);
    events = events.filter((e) => e.id !== id);
    saveEvents();
    render();
    return removed;
  }

  /* =========================================================
   * 时间计算与格式化
   * ========================================================= */

  function elapsedParts(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    return {
      days: Math.floor(total / 86400),
      hours: Math.floor((total % 86400) / 3600),
      minutes: Math.floor((total % 3600) / 60),
      seconds: total % 60,
    };
  }

  /** 形如「3 天 05 小时 12 分 30 秒」 */
  function formatElapsed(ms) {
    const p = elapsedParts(ms);
    return `${p.days} 天 ${pad2(p.hours)} 小时 ${pad2(p.minutes)} 分 ${pad2(p.seconds)} 秒`;
  }

  function formatDateTime(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  }

  function toLocalInputValue(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  /** 新鲜度分档（仅用于卡片状态点配色） */
  function freshness(ms) {
    const h = ms / 3600000;
    if (h < 1) return 'fresh';
    if (h < 24) return 'recent';
    if (h < 24 * 7) return 'aging';
    return 'stale';
  }

  /* =========================================================
   * 渲染层
   * ========================================================= */

  const tickRefs = new Map(); // id -> { elapsed, dot }，供逐秒刷新使用

  /** 排序：按最近记录时间（lastDoneAt）从近到远 */
  const sortedEvents = () => [...events].sort((a, b) => b.lastDoneAt - a.lastDoneAt);

  function render() {
    tickRefs.clear();
    listEl.textContent = '';
    const sorted = sortedEvents();
    statsEl.textContent = `共 ${events.length} 项`;
    emptyEl.classList.toggle('hidden', sorted.length > 0);
    for (const ev of sorted) listEl.appendChild(renderCard(ev));
    tick();
  }

  function renderCard(ev) {
    const card = el('article', 'card');
    card.dataset.id = ev.id;

    /* 头部：状态点 + 名称（可原地编辑） + 操作按钮 */
    const head = el('div', 'card-head');
    const dot = el('span', 'dot');
    const name = el('h2', 'card-name', ev.name);
    const actions = el('div', 'card-actions');
    const recordBtn = el('button', 'btn btn-record', '记录完成');
    const editBtn = el('button', 'btn btn-ghost', '编辑');
    const delBtn = el('button', 'btn btn-ghost', '删除');
    actions.append(recordBtn, editBtn, delBtn);
    head.append(dot, name, actions);

    /* 中部：实时计时文案 */
    const body = el('div', 'card-body');
    const label = el('span', 'elapsed-label', '距离上次完成已过去');
    const elapsed = el('span', 'elapsed');
    body.append(label, elapsed);

    /* 底部：时间元信息 */
    const meta = el('div', 'card-meta');
    meta.append(
      el('div', null, `上次完成：${formatDateTime(ev.lastDoneAt)}`),
      el('div', null, `首次记录：${formatDateTime(ev.createdAt)}`)
    );

    /* 交互：记录完成（重置计时） */
    recordBtn.addEventListener('click', () => {
      const res = addOrRecord(ev.name, Date.now());
      if (res) toast(`「${ev.name}」计时已重置，从此刻重新计算`);
    });

    /* 交互：原地编辑（Enter 保存 / Esc 取消 / 失焦保存） */
    editBtn.addEventListener('click', () => {
      const input = el('input', 'card-name-input');
      input.type = 'text';
      input.value = ev.name;
      input.maxLength = MAX_NAME_LEN;
      head.replaceChild(input, name);
      input.focus();
      input.select();
      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        if (commit) {
          if (!input.value.trim()) toast('名称不能为空');
          const res = renameEvent(ev.id, input.value);
          if (res.ok && res.mergedInto) toast(`已合并进「${res.mergedInto}」`);
          if (res.ok) return; // 成功时 renameEvent 内部已完成重渲染
        }
        render(); // 取消 / 空名称：恢复原状
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    });

    /* 交互：删除（两步确认，防止误删） */
    let armed = false;
    let armTimer = null;
    const disarm = () => {
      armed = false;
      delBtn.textContent = '删除';
      delBtn.classList.remove('armed');
    };
    delBtn.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        delBtn.textContent = '确认删除';
        delBtn.classList.add('armed');
        clearTimeout(armTimer);
        armTimer = setTimeout(disarm, 2500);
      } else {
        clearTimeout(armTimer);
        const removed = removeEvent(ev.id);
        if (removed) toast(`已删除「${removed.name}」`);
      }
    });

    card.append(head, body, meta);
    tickRefs.set(ev.id, { elapsed, dot });
    return card;
  }

  /**
   * 逐秒刷新：每次用 Date.now() - lastDoneAt 重新计算文本，
   * 不做递减累加，因此不存在计时漂移；只更新文本节点，不重建 DOM，
   * 编辑中的输入框不会被打断。
   */
  function tick() {
    const now = Date.now();
    for (const ev of events) {
      const refs = tickRefs.get(ev.id);
      if (!refs) continue;
      const ms = now - ev.lastDoneAt;
      refs.elapsed.textContent = formatElapsed(ms);
      refs.dot.dataset.freshness = freshness(ms);
    }
  }
  setInterval(tick, 1000);

  /* =========================================================
   * 顶部表单：新增 / 记录完成
   * ========================================================= */

  /** 本次完成时刻：默认「现在」；勾选自定义后取所选时间（不允许超过当前） */
  function currentDoneAt() {
    if (customToggle.checked && customTime.value) {
      const t = new Date(customTime.value).getTime();
      if (Number.isFinite(t)) return Math.min(t, Date.now());
    }
    return Date.now();
  }

  function submitDemo(e) {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    const res = addOrRecord(name, currentDoneAt());
    if (res) {
      toast(res.existed ? `「${name}」已存在，计时已重置` : `已添加「${name}」，开始计时`);
      nameInput.value = '';
      nameInput.focus();
    }
  }

  document.getElementById('add-btn').addEventListener('click', submitDemo);
  addForm.addEventListener('submit', submitDemo);
  customToggle.addEventListener('change', () => {
    customTime.classList.toggle('hidden', !customToggle.checked);
    if (customToggle.checked) {
      const now = new Date();
      customTime.max = toLocalInputValue(now);
      const d = new Date(now);
      d.setSeconds(0, 0);
      customTime.value = toLocalInputValue(d);
    }
  });

  /* ---------- 多标签页同步 ---------- */
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) {
      events = loadEvents();
      render();
    }
  });

  /* ---------- Toast ---------- */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  document.getElementById('reset-demo').onclick = () => { events = [{id:'sample',name:'去图书馆',lastDoneAt:Date.now()-90061000,createdAt:Date.now()-90061000}]; localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); addForm.reset(); customToggle.checked = false; customTime.value = ''; customTime.classList.add('hidden'); toastEl.classList.remove('show'); clearTimeout(toastTimer); render(); };
  /* ---------- 启动 ---------- */
  render();
})();
</script></body></html>
