
  <div id="app">
    <canvas id="scene"></canvas>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="topbar">
      <button id="dayBtn" class="pill" title="选择关卡 / 日历">
        <span>第 <b id="dayNum">1</b> 天</span>
        <small id="dayDate"></small>
      </button>
      <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
      <span class="pill" id="streakPill">🔥 <b id="streakNum">0</b></span>
      <div class="modegroup" role="group" aria-label="交互模式">
        <button class="mode active" id="modeWipe" title="擦拭模式：拖动擦污渍">🖐 擦拭</button>
        <button class="mode" id="modeRotate" title="旋转模式：拖动旋转视角（与擦拭分离）">🔄 旋转</button>
      </div>
      <button id="resetViewBtn" class="tool" title="回到正面" style="width:40px;height:40px;font-size:18px;">⌖</button>
    </div>

    <div id="toast"></div>

    <div id="complete">
      <div class="big">✓ 擦干净了</div>
      <div class="sub" id="completeSub">今日金句已解锁</div>
      <button id="completeShare" class="cshare">分享到朋友圈</button>
    </div>

    <div class="toolbar">
      <button class="tool active" id="toolWipe" title="干擦：去水雾/灰尘/指纹（油污需先喷水）">🧽<span class="lbl">干擦</span></button>
      <button class="tool" id="toolSpray" title="喷水：打湿油污以便擦除，也能轻冲浮尘">💧<span class="lbl">喷水</span></button>
      <button class="tool" id="toolBrush" title="刷子：大笔刷，专攻顽固渍和贴纸">🪥<span class="lbl">刷子</span></button>
      <div class="divider"></div>
      <button class="tool" id="cardBtn" title="清洁剂卡：直接清除一块污渍">🧴<span id="cardCount">0</span></button>
      <button class="tool" id="shareBtn" title="分享到朋友圈：导出今日金句卡片" disabled>📤<span class="lbl">分享</span></button>
      <button class="tool" id="resetBtn" title="重置当前关：从头再擦一遍">↺</button>
    </div>

    <div class="face-hint">点「🔄 旋转」拖动转视角，点「🖐 擦拭」再拖动擦污渍 · 六个面都能擦 · 金句贴前表面，擦净才显形</div>
  </div>

  <!-- 日历 / 关卡选择 -->
  <div class="overlay" id="calendarOverlay">
    <div class="sheet">
      <button class="close" id="calClose">关闭</button>
      <h2>365 天 · 关卡选择</h2>
      <div class="legend">
        <span><i class="dot" style="background:#eafaf8;border:2px solid #2f9e9b"></i>今天</span>
        <span><i class="dot" style="background:#d9f2e2"></i>已通关</span>
        <span><i class="dot" style="background:#fff3e6"></i>可补卡</span>
        <span><i class="dot" style="background:#eceff1"></i>未解锁</span>
      </div>
      <div class="grid" id="calGrid"></div>
      <p class="hint">点击「今天」正常打卡（推进连续登录、满 3 天赠清洁剂卡）；点击过往日期为「补卡」，仅记录通关、不推进连续登录也不赠卡；未来日期锁定。</p>
      <div class="row">
        <span id="calInfo" style="font-size:13px;opacity:0.8;"></span>
        <button class="reset" id="resetSaveBtn">重置存档</button>
      </div>
    </div>
  </div>
