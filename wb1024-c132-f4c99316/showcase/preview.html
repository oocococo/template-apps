<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug 尸检台 · 每个 bug 都值得一份体面的尸检报告</title>
<meta name="description" content="把一段报错原文贴进来，生成一份法医式鉴定书：死因、责任认定、修复处方。">
<style>
  :root{
    --paper:#F3F0E7;
    --card:#FFFDF8;
    --ink:#1B1A17;
    --ink2:#5C574C;
    --ink3:#8C867A;
    --line:#DDD6C6;
    --line2:#EDE8DA;
    --red:#B03A2E;
    --redbg:#FBEDEA;
    --green:#3E6B4F;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.035) 1px, transparent 0);
    background-size:14px 14px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 22px 80px}

  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:26px 0 18px;border-bottom:1px solid var(--line);margin-bottom:34px;
    flex-wrap:wrap;gap:8px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-family:var(--serif);font-size:19px;letter-spacing:.06em;font-weight:600}
  .brand span{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
  header .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.1em}

  /* ---------- 首屏 ---------- */
  .hero{margin-bottom:26px}
  .hero h1{
    font-family:var(--serif);font-size:34px;line-height:1.32;font-weight:600;
    letter-spacing:.01em;margin-bottom:12px;
  }
  .hero h1 em{font-style:normal;color:var(--red)}
  .hero p{color:var(--ink2);font-size:14.5px;max-width:56ch}
  .hero p code{font-family:var(--mono);font-size:12.5px;background:#E9E4D6;padding:1px 5px;border-radius:2px}

  /* ---------- 输入区 ---------- */
  .intake{
    background:var(--card);border:1px solid var(--line);
    padding:0;margin-top:24px;position:relative;
  }
  .intake::before{
    content:"";position:absolute;inset:5px;border:1px solid var(--line2);pointer-events:none;
  }
  .intake-hd{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 20px;border-bottom:1px dashed var(--line);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;
  }
  textarea{
    width:100%;min-height:168px;border:0;outline:0;resize:vertical;
    padding:18px 20px;background:transparent;color:var(--ink);
    font-family:var(--mono);font-size:13px;line-height:1.75;
  }
  textarea::placeholder{color:#B5AE9D}
  .samples{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:0 20px 16px;font-size:12.5px;color:var(--ink3);
  }
  .samples button{
    font-family:inherit;font-size:12px;color:var(--ink2);cursor:pointer;
    background:transparent;border:1px solid var(--line);padding:4px 11px;
    transition:.16s;border-radius:2px;
  }
  .samples button:hover{border-color:var(--ink2);color:var(--ink);background:#F7F3E6}
  .act{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 20px;border-top:1px solid var(--line2);flex-wrap:wrap;
  }
  .act .hint{font-size:12px;color:var(--ink3)}
  .go{
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;
    background:var(--ink);color:#FBF8EF;border:0;cursor:pointer;
    padding:11px 26px;transition:.16s;
  }
  .go:hover{background:var(--red)}
  .go:disabled{background:#C9C2B2;cursor:not-allowed}

  /* ---------- 解剖中 ---------- */
  .working{display:none;padding:64px 0;text-align:center}
  .working.on{display:block}
  .slice{
    width:100%;max-width:420px;height:2px;background:var(--line2);
    margin:0 auto 22px;overflow:hidden;position:relative;
  }
  .slice i{position:absolute;inset:0 auto 0 0;width:34%;background:var(--red);animation:sweep 1.1s ease-in-out infinite}
  @keyframes sweep{0%{left:-34%}100%{left:100%}}
  .working p{font-family:var(--mono);font-size:12px;color:var(--ink3);letter-spacing:.08em}

  /* ---------- 报告 ---------- */
  #report{display:none;margin-top:30px}
  #report.on{display:block;animation:rise .40s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{transform:translateY(12px)}to{transform:none}}

  .sheet{
    background:var(--card);border:1px solid var(--line);position:relative;
    padding:30px 32px 26px;
  }
  .sheet::after{
    content:"";position:absolute;inset:6px;border:1px solid var(--line2);pointer-events:none;
  }
  .sheet-hd{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px;gap:12px;flex-wrap:wrap;
  }
  .sheet-hd .t{font-family:var(--serif);font-size:17px;letter-spacing:.14em;font-weight:600}
  .sheet-hd .no{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.1em}

  .label{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    color:var(--ink3);text-transform:uppercase;margin-bottom:7px;
  }
  .deceased{
    font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--ink);
    background:#F6F2E6;border-left:3px solid var(--ink3);padding:12px 15px;
    word-break:break-word;margin-bottom:26px;
  }

  .verdict{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  .verdict h2{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:.03em;line-height:1.2}
  .sev{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 10px;
    border:1px solid currentColor;white-space:nowrap;
  }
  .sev.fatal{color:var(--red);background:var(--redbg)}
  .sev.severe{color:#9A6417;background:#FBF3E4}
  .sev.chronic{color:#5B6B7C;background:#EEF1F4}
  .sev.prank{color:var(--green);background:#EDF3EE}
  .sev-sub{font-size:12.5px;color:var(--ink3);margin-bottom:26px}

  .sec{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}
  .sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .sec p{font-size:14.5px;line-height:1.85;color:#332F28}
  .sec p + p{margin-top:10px}

  .culprits{margin-top:4px}
  .cul{margin-bottom:11px}
  .cul-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .cul-top b{font-weight:600}
  .cul-top span{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
  .bar{height:7px;background:#EDE8DA;position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink2);transition:width .7s cubic-bezier(.2,.7,.3,1)}
  .cul:first-child .bar i{background:var(--red)}

  ol.rx{list-style:none;counter-reset:rx}
  ol.rx li{
    counter-increment:rx;position:relative;padding-left:34px;margin-bottom:13px;
    font-size:14.5px;line-height:1.8;color:#332F28;
  }
  ol.rx li::before{
    content:counter(rx,decimal-leading-zero);
    position:absolute;left:0;top:2px;
    font-family:var(--mono);font-size:11px;color:var(--red);
    border:1px solid var(--red);width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
  }
  ol.rx li code{font-family:var(--mono);font-size:12.5px;background:#F1ECDE;padding:1px 5px;border-radius:2px}

  .prevent{
    background:#F6F2E6;padding:14px 16px;font-size:13.5px;line-height:1.8;color:var(--ink2);
    border-left:3px solid #C9C0A8;
  }

  .sheet-ft{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:28px;padding-top:18px;border-top:1px dashed var(--line);gap:16px;flex-wrap:wrap;
  }
  .stamp{
    font-family:var(--serif);font-size:15px;letter-spacing:.28em;color:var(--red);
    border:2px solid var(--red);padding:7px 13px 7px 17px;
    transform:rotate(-4deg);opacity:.88;
  }
  .conf{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.08em;text-align:right;line-height:1.9}

  .again{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .again button{
    font-family:inherit;font-size:13px;cursor:pointer;padding:9px 20px;
    border:1px solid var(--line);background:var(--card);color:var(--ink2);transition:.16s;
  }
  .again button:hover{border-color:var(--ink);color:var(--ink)}
  .again button.primary{background:var(--ink);color:#FBF8EF;border-color:var(--ink)}
  .again button.primary:hover{background:var(--red);border-color:var(--red)}

  /* ---------- 页脚 ---------- */
  footer{
    margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink3);line-height:1.9;
  }
  footer b{color:var(--ink2);font-weight:600}
  .rules-list{
    margin-top:14px;display:grid;gap:1px;background:var(--line2);
    grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    border:1px solid var(--line2);
  }
  .rules-list span{
    font-family:var(--mono);font-size:10.5px;color:var(--ink3);
    padding:6px 9px;background:var(--paper);letter-spacing:.02em;
  }

  @media (max-width:620px){
    .wrap{padding:0 16px 60px}
    .hero h1{font-size:26px}
    .sheet{padding:22px 18px 20px}
    .verdict h2{font-size:23px}
    .brand b{font-size:17px}
    header{padding-top:18px;margin-bottom:26px}
  }

  @media print{
    body{background:#fff;background-image:none}
    header,.hero,.intake,.again,footer,.working{display:none!important}
    .wrap{max-width:none;padding:0}
    .sheet{border:1px solid #999}
    #report{display:block!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <b>Bug 尸检台</b>
      <span>Autopsy / v1.0</span>
    </div>
    <div class="meta" id="hdrMeta">31 EXAMINERS READY</div>
  </header>

  <section class="hero">
    <h1>每个 bug<br>都值得一份<em>体面的尸检报告</em></h1>
    <p>把报错原文贴进来。它不会告诉你「出错了」——它会告诉你死因、谁的责任、以及下一步具体改哪里。<br>纯本地规则鉴定，不联网，不上传。</p>
  </section>

  <section class="intake">
    <div class="intake-hd">
      <span>样本受理 / Intake</span>
      <span id="counter">0 字</span>
    </div>
    <textarea id="err" spellcheck="false" placeholder="把整段报错粘进来，例如：
TypeError: Cannot read properties of undefined (reading 'map')
    at renderList (src/components/list.js:42:18)"></textarea>
    <div class="samples">
      <span>没带样本？试一具：</span>
      <button data-s="null">空指针</button>
      <button data-s="cors">跨域</button>
      <button data-s="oom">内存溢出</button>
      <button data-s="syntax">语法错误</button>
      <button data-s="dup">唯一键冲突</button>
    </div>
    <div class="act">
      <span class="hint">支持整段日志，会自动挑出最像死因的那一行</span>
      <button class="go" id="go">开始尸检 →</button>
    </div>
  </section>

  <section class="working" id="working">
    <div class="slice"><i></i></div>
    <p id="workingMsg">正在固定样本…</p>
  </section>

  <section id="report"></section>

  <footer>
    <b>说明</b>　本工具的全部判断来自 <span id="ruleCount">30</span> 条本地规则，不调用任何模型接口，样本只在你自己的浏览器里处理。它擅长把常见死因说清楚、把排查方向排对，不能替代完整的堆栈分析——<b>报告里的「匹配度」低于 50% 时，请把完整堆栈补齐再看</b>。
    <div class="rules-list" id="rulesList"></div>
  </footer>
</div>

<script>
/* Bug 尸检台 · 鉴定引擎
 * 纯规则匹配，无网络请求，无外部依赖。
 * 设计原则：命中的规则要能从用户的原文里抠出具体片段（变量名、文件名、模块名、状态码），
 * 否则报告读起来就像套模板。
 */
(function (global) {
  'use strict';

  var FATAL = { key: 'fatal', label: '致命', desc: '当场去世，进程都没了' };
  var SEVERE = { key: 'severe', label: '重症', desc: '还能跑，但这条链路废了' };
  var CHRONIC = { key: 'chronic', label: '慢性', desc: '不致命，天天犯' };
  var PRANK = { key: 'prank', label: '伪死', desc: '看着吓人，多半没事' };

  var RULES = [
    {
      id: 'null-ref',
      name: '空指针猝死',
      sev: FATAL,
      kw: [/cannot read propert/i, /cannot read properties/i, /of undefined/i, /of null/i, /NoneType.{0,20}has no attribute/i, /NullPointerException/i, /nil pointer/i, /is null and cannot be/i],
      cause: function (c) {
        var t = c.prop ? '属性 `' + c.prop + '`' : '某个属性';
        return '你顺着一条引用链去取 ' + t + '，走到某一环的时候那个对象是空的。注意：不是 ' + (c.prop || '属性') + ' 不存在，是它爹不存在。堆栈里的行号通常指向取值那一行，但真正的输入在更上游就已经是空的——报错位置往往不是犯罪现场，只是尸体被发现的地方。';
      },
      culprits: [['你自己（没判空）', 0.58], ['接口返回结构与预期不符', 0.27], ['上游数据缺字段', 0.15]],
      remedy: [
        '沿访问链逐级判空，或者直接改成可选链（`a?.b?.c`）；不要只在最外层套一个 try',
        '和接口方对齐字段契约，确认最近有没有改过返回结构、有没有可能返回空对象',
        '补一条单测，把这个返回结构钉死，下次改动会红'
      ],
      prevention: '空值不是一个数值问题，是一个契约问题。谁允许它为空，谁就该在这一层兜住。'
    },
    {
      id: 'not-a-function',
      name: '类型背叛',
      sev: SEVERE,
      kw: [/is not a function/i, /is not callable/i, /object is not a function/i, /undefined is not a function/i, /not a function/i],
      cause: function (c) {
        return '你调用了一个「以为是函数」的东西，它实际不是。常见三种情形：导入方式不对（默认导出与具名导出混了）、这个库的版本换过 API、或者在模块还没初始化完的时候就已经调用了。' + (c.file ? '堆栈落在 ' + c.file + '，先去那行看被调用的名字是怎么来的。' : '先去报错那一行，看这个被调用的名字到底是从哪来的。');
      },
      culprits: [['导入 / 导出写法错了', 0.45], ['依赖版本和文档对不上', 0.33], ['初始化顺序问题', 0.22]],
      remedy: [
        '在调用前 `console.log` 一下这个标识符本身，先确认它是什么，别猜',
        '对照依赖的实际版本查 API，不要照抄网上较新或较旧版本的写法',
        '如果是循环依赖或初始化顺序问题，把调用移到模块加载完成之后'
      ],
      prevention: '给项目的依赖版本上锁；用类型系统比靠记忆可靠。'
    },
    {
      id: 'module-missing',
      name: '器官缺失',
      sev: SEVERE,
      kw: [/cannot find module/i, /module not found/i, /no module named/i, /is not recognized as an internal/i, /could not resolve/i, /package .* is not installed/i],
      cause: function (c) {
        var m = c.mod ? '`' + c.mod + '`' : '某个模块';
        return '运行时找不到 ' + m + ' 这个器官。三种可能：根本没装、装了但不在当前解析路径里、或者名字拼错了。注意最后一种——大小写在 macOS 上不敏感、到了 Linux 直接报错，本地好好的、一上线就死，说的就是这个。';
      },
      culprits: [['依赖没装 / 没进 package.json', 0.5], ['路径或大小写不对', 0.3], ['构建产物里没打进去', 0.2]],
      remedy: [
        '确认这个模块在依赖清单里，并且是 dependencies 而不是只在本机 devDependencies',
        '逐个字符核对导入路径的大小写，和实际目录名对齐',
        '如果是构建后出错，检查打包配置有没有把它排除掉'
      ],
      prevention: '本地能跑不等于能部署。CI 里跑一遍干净安装，是最便宜的保险。'
    },
    {
      id: 'cors',
      name: '跨域排异',
      sev: SEVERE,
      kw: [/access-control-allow-origin/i, /cors/i, /blocked by cors policy/i, /preflight/i, /cross-origin/i],
      cause: function () {
        return '浏览器替你挡了一刀。你的页面和接口不同源，服务端没有在响应头里明确允许你。这件事和你的业务代码基本无关，是安全策略在生效——所以你在 Postman 里能通、在页面上就是不行，这不是玄学。';
      },
      culprits: [['服务端没配允许来源', 0.55], ['预检请求没被正确处理', 0.3], ['走了代理但代理没转发头', 0.15]],
      remedy: [
        '在服务端加上 `Access-Control-Allow-Origin`，把你实际的域名写进去，不要图省事写 `*`（带凭证时 `*` 会被拒）',
        '确认 `OPTIONS` 预检请求被正确响应，且返回了允许的方法与头',
        '开发阶段用同源代理绕开，但别把这个方案带进生产'
      ],
      prevention: '跨域是设计，不是 bug。上线前把域名白名单当配置项管理，别硬编码。'
    },
    {
      id: 'not-found',
      name: '路径失踪',
      sev: CHRONIC,
      kw: [/\b404\b/, /not found/i, /no such file/i, /ENOENT/i, /does not exist/i],
      cause: function (c) {
        var code = c.code === 404 ? '404 ' : '';
        return code + '你要的东西不在你找的地方。可能是路由没注册、路径拼错、静态资源没构建出来，也可能是这个资源本来就被删了。' + (c.file ? '报错指向 ' + c.file + '，先确认这个文件在构建产物里到底存不存在。' : '先确认这个路径在构建产物里到底存不存在，再怀疑路由。');
      },
      culprits: [['路径或路由配置写错', 0.5], ['构建产物里缺失', 0.28], ['资源已下线但调用方没同步', 0.22]],
      remedy: [
        '在终端里把完整路径打印出来，逐级 `ls` 一遍，确认到底哪一级不见了',
        '检查路由注册顺序：通配路由如果写在前面，会吃掉后面所有具体路由',
        '静态资源 404 优先怀疑构建输出目录与部署目录不一致'
      ],
      prevention: '路径问题一律用绝对路径排查一次，相对路径是给人读的，不是给机器猜的。'
    },
    {
      id: 'server-500',
      name: '内脏衰竭',
      sev: FATAL,
      kw: [/\b500\b/, /internal server error/i, /unhandled exception/i, /stack trace/i],
      cause: function () {

      culprits: [['括号 / 引号不配对', 0.45], ['多一个尾逗号或少了逗号', 0.3], ['用了当前版本不支持的语法', 0.25]],
      remedy: [
        '从报错位置往上找最近的一个未闭合结构，别盯着报错那一行',
        '确认构建 / 运行环境的语言版本支持你写的语法（可选链、顶层 await 之类）',
        '用编辑器的括号匹配功能走一遍，比肉眼可靠'
      ],
      prevention: '语法错误是唯一一类「工具能完全替你抓」的错误。让编辑器实时检查开着。'
    },
    {
      id: 'type-mismatch',
      name: '类型错位',
      sev: SEVERE,
      kw: [/typeerror/i, /is not assignable/i, /incompatible types/i, /expected type/i, /cannot convert/i, /Type '.*' is not/i],
      cause: function () {
        return '你以为传的是 A，实际传的是 B。动态语言里是运行时才发现，静态语言里是编译期就拦下——后者其实幸运得多。常见来源：数字和字符串混用、接口返回的类型和声明不一致、可选字段没处理。';
      },
      culprits: [['隐式类型转换', 0.45], ['接口声明与实际不符', 0.35], ['可选值未处理', 0.2]],
      remedy: [
        '在边界处（接口响应、表单输入、URL 参数）统一做一次类型收敛，别让脏类型流进业务层',
        '用严格模式或类型检查把问题提前到编译期',
        '字符串和数字之间的比较、拼接，逐个检查'
      ],
      prevention: '类型系统的价值不是让人写得舒服，是让错误在更便宜的地方被发现。'
    },
    {
      id: 'async',
      name: '悬空承诺',
      sev: CHRONIC,
      kw: [/unhandled\s*(?:promise\s*)?rejection/i, /await.*not.*async/i, /promise.*pending/i, /uncaught \(in promise\)/i],
      cause: function () {
        return '一个异步操作失败了，但没有人接住它。或者你在一个非 async 函数里用了 await，拿到的只是一个 Promise 对象而不是结果——这时候打印出来是 `[object Promise]`，而你以为拿到了数据。';
      },
      culprits: [['缺 catch / try', 0.5], ['在非 async 函数里 await', 0.3], ['并发请求未全部等待', 0.2]],
      remedy: [
        '每个 await 外面都要有 try/catch，或者在最外层统一挂 unhandledRejection 兜底',
        '确认用了 await 的函数本身是 async，否则拿到的永远是 Promise',
        '并发场景用 allSettled，避免一个失败全军覆没还没人知道'
      ],
      prevention: '异步的默认行为是「静默失败」。不主动接住，它就当作没发生。'
    },
    {
      id: 'segfault',
      name: '内存越界',
      sev: FATAL,
      kw: [/segmentation fault/i, /segfault/i, /core dumped/i, /SIGSEGV/i, /access violation/i, /buffer overflow/i],
      cause: function () {
        return '程序访问了不属于它的内存。在托管语言里几乎见不到，一旦出现通常意味着底层依赖有 bug、或者 FFI / 原生扩展出了问题。这类死法没有「改改业务代码」的解法，得往依赖和运行时里挖。';
      },
      culprits: [['原生依赖有 bug', 0.45], ['越界 / 野指针', 0.35], ['ABI 或版本不兼容', 0.2]],
      remedy: [
        '先确认是否最近升级过原生依赖或运行时版本，是就回退验证',
        '抓 core dump 或用调试器看崩溃栈，别靠日志猜',
        '把出问题的原生扩展单独隔离出来复现，不要在整个应用里盲改'
      ],
      prevention: '段错误的排查成本极高，所以原生依赖的版本要锁得比业务依赖更死。'
    },
    {
      id: 'dns',
      name: '查无此地',
      sev: SEVERE,
      kw: [/ENOTFOUND/i, /getaddrinfo/i, /name or service not known/i, /dns/i, /no such host/i],
      cause: function () {
        return '域名解析不出来。可能是域名写错、DNS 记录没生效、或者运行环境里没有配 DNS。容器环境中这一条特别常见——宿主机能解析，容器里不行。';
      },
      culprits: [['域名写错 / 记录未生效', 0.45], ['容器 DNS 配置缺失', 0.35], ['网络策略阻断', 0.2]],
      remedy: [
        '先 `dig` / `nslookup` 确认域名能解析出 IP',
        '在出问题的那个环境里解析（容器内、CI 内），而不是在你本机',
        '检查容器 / 服务的 DNS 配置，确认能访问外部解析服务'
      ],
      prevention: '「我这儿能连」永远不是结论。要在出错的那个环境里验证。'
    },
    {
      id: 'date-tz',
      name: '时区漂移',
      sev: CHRONIC,
      kw: [/timezone/i, /UTC/i, /\bGMT\b/i, /Invalid Date/i, /date.*invalid/i, /off by one day/i],
      cause: function () {
        return '同一个时间点，在不同时区被解读成了不同的日期。这不是玄学——服务器在 UTC、用户在 UTC+8，一个 `2026-10-22` 的字符串在两端可以代表相差一天的瞬间。跨月、跨年的时候尤其致命，而且测试环境往往和线上时区不一样，所以永远测不出来。';
      },
      culprits: [['前后端时区不一致', 0.5], ['日期只存了字符串没存时区', 0.3], ['本地化格式直接入库', 0.2]],
      remedy: [
        '存储一律用 UTC 时间戳，展示时再按用户时区格式化，别在库里存本地时间字符串',
        '接口传输用带时区的标准格式（ISO 8601），不要传 `2026-10-22` 这种裸日期',
        '测试环境的时区要和线上一致，否则这类问题永远测不出来'
      ],
      prevention: '时区问题的成本全在「事后才想起来」。设计表结构的时候就该定死。'
    },
    {
      id: 'docker',
      name: '容器排异',
      sev: SEVERE,
      kw: [/docker/i, /image/i, /no such container/i, /exit code 137/i, /pull access denied/i, /layer/i],
      cause: function (c) {
        return '容器这一层出了问题。退出码 137 是内存超限被杀（不是程序自己退的），125/126/127 是启动命令或权限问题，拉取失败则多半是镜像名或鉴权。这一类错误的共同点是：日志里看着像应用崩了，实际是被外面弄死的。';
      },
      culprits: [['资源限制（内存 / CPU）', 0.4], ['镜像 / 启动命令问题', 0.35], ['权限或挂载路径', 0.25]],
      remedy: [
        '先看退出码，137 直接查内存上限，不要读应用日志浪费时间',
        '确认启动命令的路径和权限在镜像内是有效的',
        '检查挂载目录在容器内的路径与权限，宿主机 UID 不一致是常见坑'
      ],
      prevention: '容器里的错误先看容器的脸色（退出码、事件），再看应用的自述（日志）。'
    }
  ];

  // ---------- 提取上下文 ----------
  function extract(text) {
    var ctx = { raw: text, excerpt: '', prop: '', file: '', mod: '', code: 0 };
    var lines = String(text).split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    // 挑最像"错误正文"的一行：优先含 Error/Exception/at/Caused 的，其次第一行
    var best = lines[0] || '';
    for (var i = 0; i < lines.length; i++) {
      if (/(error|exception|failed|refused|denied|timeout|undefined|cannot)/i.test(lines[i])) { best = lines[i]; break; }
    }
    ctx.excerpt = best.slice(0, 160);

    var mProp = text.match(/propert(?:y|ies)\s+['"]([^'"]+)['"]/i);
    if (mProp) ctx.prop = mProp[1];
    var mFile = text.match(/([\w./\\-]+\.(?:js|jsx|ts|tsx|mjs|cjs|py|java|go|rb|php|vue|json|ya?ml|sql))\b/i);
    if (mFile) ctx.file = mFile[1].split(/[\\/]/).pop();
    var mMod = text.match(/(?:cannot find module|module not found|no module named|requires?)\s*['"]?([@\w./-]+)/i);
    if (mMod) ctx.mod = mMod[1];
    var mCode = text.match(/\b([45]\d{2})\b/);
    if (mCode) ctx.code = parseInt(mCode[1], 10);
    return ctx;
  }

  function score(rule, text) {
    var n = 0;
    for (var i = 0; i < rule.kw.length; i++) {
      if (rule.kw[i].test(text)) n++;
    }
    return n;
  }

  // 兜底：认不出来的，也要给一份说得过去的报告
  var FALLBACK = {
    id: 'unknown',
    name: '死因不明',
    sev: SEVERE,
    kw: [],
    cause: function () {
      return '这段文字里没有出现我认识的典型死因特征。要么它是一段被截断的日志，要么真正的错误信息在更前面。这种情况最忌讳盯着最后一行看——进程退出时打印的那行，通常只是结果，不是原因。';
    },
    culprits: [['信息不足，无法认定', 1]],
    remedy: [
      '把完整堆栈贴进来，尤其是第一行错误类型和 `Caused by` 之后的几层',
      '找同一时间点的上下文日志，看这条错误之前的最后一条正常日志是什么',
      '确认这是首次出现还是一直如此：一直如此是代码问题，突然出现是环境或数据变了'
    ],
    prevention: '错误的可诊断性，取决于日志里有没有留下足够的现场。'
  };

  function diagnose(text) {
    var ctx = extract(text);
    var best = null;
    var bestScore = 0;
    for (var i = 0; i < RULES.length; i++) {
      var s = score(RULES[i], text);
      if (s > bestScore) { bestScore = s; best = RULES[i]; }
    }
    var rule = best || FALLBACK;
    if (bestScore === 0) rule = FALLBACK;

    // 责任比例：兜底规则固定 100%，其余按规则给定，抖动 ±3 保持稳定可复现
    var seed = hash(String(text));
    var culprits = rule.culprits.map(function (c) { return { who: c[0], pct: Math.round(c[1] * 100) }; });
    if (culprits.length > 1) {
      var drift = (seed % 7) - 3;
      culprits[0].pct += drift;
      culprits[1].pct -= drift;
    }
    var sum = culprits.reduce(function (a, b) { return a + b.pct; }, 0);
    if (sum !== 100 && culprits.length) culprits[0].pct += 100 - sum;

    return {
      no: 'A-' + (seed % 9000 + 1000) + '-' + String(rule.id).slice(0, 3).toUpperCase(),
      rule: rule,
      name: rule.name,
      sev: rule.sev,
      cause: rule.cause(ctx),
      culprits: culprits,
      remedy: rule.remedy,
      prevention: rule.prevention,
      ctx: ctx,
      hits: bestScore,
      confidence: bestScore > 0 ? Math.min(96, 62 + bestScore * 14) : 34
    };
  }

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h;
  }

  global.Autopsy = {
    diagnose: diagnose,
    rules: RULES,
    version: '1.0',
    count: RULES.length
  };
})(window);

</script>
<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var errEl = $('err'), goEl = $('go'), reportEl = $('report'),
      workingEl = $('working'), msgEl = $('workingMsg'), counterEl = $('counter');

  var SAMPLES = {
    null: "TypeError: Cannot read properties of undefined (reading 'map')\n    at renderList (src/components/list.js:42:18)\n    at Array.map (<anonymous>)",
    cors: "Access to fetch at 'https://api.example.com/v1/orders' from origin 'http://localhost:3000' has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present on the requested resource.",
    oom: "FATAL ERROR: Ineffective mark-compacts near heap limit Allocation failed - JavaScript heap out of memory\n 1: 0xb7c1a0 node::Abort()\n 2: 0xa8a5e6 node::FatalError()",
    syntax: "SyntaxError: Unexpected token '<', \"<!DOCTYPE \"... is not valid JSON\n    at JSON.parse (<anonymous>)\n    at fetchUser (src/api/user.ts:19:22)",
    dup: "error: duplicate key value violates unique constraint \"users_email_key\"\nDETAIL: Key (email)=(a@b.com) already exists."
  };

  var MSGS = ['正在固定样本…','比对 ' + window.Autopsy.rules.length + ' 例已知死因…','沿调用链回溯责任…','拟定修复处方…','归档…'];
  var timer = null;

  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  errEl.addEventListener('input', function(){
    counterEl.textContent = fmt(errEl.value.trim().length) + ' 字';
  });

  document.querySelectorAll('.samples button').forEach(function(b){
    b.addEventListener('click', function(){
      errEl.value = SAMPLES[b.dataset.s] || '';
      errEl.dispatchEvent(new Event('input'));
      errEl.focus();
    });
  });

  goEl.addEventListener('click', run);

  function run(){
    var text = errEl.value.trim();
    if(!text){
      errEl.focus();
      errEl.style.outline = '2px solid #B03A2E';
      setTimeout(function(){ errEl.style.outline = ''; }, 900);
      return;
    }

    reportEl.classList.remove('on');
    workingEl.classList.add('on');
    goEl.disabled = true;
    window.scrollTo({ top: workingEl.offsetTop - 120, behavior: 'smooth' });

    var i = 0;
    msgEl.textContent = MSGS[0];
    clearInterval(timer);
    timer = setInterval(function(){
      i = (i + 1) % MSGS.length;
      msgEl.textContent = MSGS[i];
    }, 300);

    setTimeout(function(){
      clearInterval(timer);
      workingEl.classList.remove('on');
      goEl.disabled = false;
      var r = window.Autopsy.diagnose(text);
      render(r);
    }, 1400);
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c];
    });
  }

  function render(r){
    var sevClass = r.sev.key;
    var culprits = r.culprits.map(function(c){
      return '<div class="cul">' +
        '<div class="cul-top"><b>' + esc(c.who) + '</b><span>' + c.pct + '%</span></div>' +
        '<div class="bar"><i style="width:' + c.pct + '%"></i></div>' +
      '</div>';
    }).join('');

    var rx = r.remedy.map(function(s){
      return '<li>' + esc(s).replace(/`([^`]+)`/g, '<code>$1</code>') + '</li>';
    }).join('');

    var excerpt = r.ctx.excerpt || '（未提取到有效内容）';

    reportEl.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-hd">' +
          '<span class="t">BUG 尸检报告</span>' +
          '<span class="no">No. ' + r.no + '</span>' +
        '</div>' +

        '<div class="label">样本原文 / Specimen</div>' +
        '<div class="deceased">' + esc(excerpt) + '</div>' +

        '<div class="verdict">' +
          '<h2>' + esc(r.name) + '</h2>' +
          '<span class="sev ' + sevClass + '">' + r.sev.label + ' · ' + esc(r.sev.desc) + '</span>' +
        '</div>' +
        '<div class="sev-sub">规则 <code style="font-family:var(--mono);font-size:11.5px;color:#5C574C">' + esc(r.rule.id) + '</code> · 原文命中 ' + r.hits + ' 处特征</div>' +

        '<div class="sec">' +
          '<div class="label">鉴定意见 / Findings</div>' +
          '<p>' + esc(r.cause).replace(/`([^`]+)`/g, '<code>$1</code>') + '</p>' +
        '</div>' +

        '<div class="sec">' +
          '<div class="label">责任认定 / Culpability</div>' +
          '<div class="culprits">' + culprits + '</div>' +
        '</div>' +

        '<div class="sec">' +
          '<div class="label">修复处方 / Prescription</div>' +
          '<ol class="rx">' + rx + '</ol>' +
        '</div>' +

        '<div class="sec">' +
          '<div class="label">复盘 / Postmortem</div>' +
          '<div class="prevent">' + esc(r.prevention) + '</div>' +
        '</div>' +

        '<div class="sheet-ft">' +
          '<span class="stamp">已 结 案</span>' +
          '<span class="conf">匹配度 ' + r.confidence + '%<br>本地规则鉴定 · 未上传</span>' +
        '</div>' +
      '</div>' +

      '<div class="again">' +
        '<button class="primary" id="againBtn">再验一具</button>' +
        '<button id="printBtn">打印 / 存成 PDF</button>' +
      '</div>';

    reportEl.classList.add('on');
    reportEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    $('againBtn').addEventListener('click', function(){
      errEl.value = '';
      errEl.dispatchEvent(new Event('input'));
      reportEl.classList.remove('on');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(function(){ errEl.focus(); }, 320);
    });
    $('printBtn').addEventListener('click', function(){ window.print(); });
  }

  // 页脚规则清单 —— 让人看见"它到底认识多少种死因"
  var names = window.Autopsy.rules.map(function(r){ return r.name; });
  $('rulesList').innerHTML = names.map(function(n){ return '<span>' + n + '</span>'; }).join('');
  $('hdrMeta').textContent = window.Autopsy.rules.length + ' EXAMINERS READY';
  $('ruleCount').textContent = window.Autopsy.rules.length;

  // 带样例直达：index.html?demo=null 打开即出报告，方便分享效果
  var demo = new URLSearchParams(location.search).get('demo');
  if (demo && SAMPLES[demo]) {
    errEl.value = SAMPLES[demo];
    errEl.dispatchEvent(new Event('input'));
    setTimeout(run, 240);
  }
})();
</script>
</body>
