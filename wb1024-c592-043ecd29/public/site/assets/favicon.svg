<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="电梯与扶梯仿真课堂图标">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- 轿厢外框 -->
  <rect x="14" y="12" width="36" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- 中分门缝 -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#ffffff" stroke-width="2.6"/>
  <!-- 上行箭头 -->
  <polyline points="23,28 32,19 41,28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="19" x2="32" y2="45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
