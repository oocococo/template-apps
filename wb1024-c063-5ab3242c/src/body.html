
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">环</span>
      <div class="brand-text">
        <h1 id="appTitle">环评工程师考试 · 学习小软件</h1>
        <p id="appSub">基于「环评老周」专家包内容整理</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="progressBadge">进度 0/0</span>
      <button class="btn ghost" id="resetBtn" title="清空本地进度">重置进度</button>
    </div>
  </header>

  <!-- 导航 -->
  <nav class="tabs">
    <button class="tab active" data-view="home">🏠 首页</button>
    <button class="tab" data-view="learn">📚 知识点学习</button>
    <button class="tab" data-view="quiz">✍️ 刷题测验</button>
    <button class="tab" data-view="exam">📝 真题库</button>
    <button class="tab" data-view="calc">🧮 计算例题</button>
    <button class="tab" data-view="ref">🔎 速查表</button>
    <button class="tab" data-view="limits">📊 标准限值</button>
  </nav>

  <main>
    <!-- ============ 首页（一键开始 / 仪表盘） ============ -->
    <section id="view-home" class="view active">
      <div class="hero">
        <div class="hero-text">
          <div class="hero-kicker">融合 2018–2025 真实真题 · 智能练习</div>
          <h2 class="hero-title">环评工程师 · 一键刷题学习</h2>
          <p class="hero-sub" id="heroSub">点一下就开始，边做题边学知识点，进度自动保存。</p>
          <div class="hero-actions">
            <button class="btn-hero primary" id="btnOneClick">🚀 一键开始做题</button>
            <button class="btn-hero" id="btnDaily">📅 每日一练</button>
            <button class="btn-hero ghost" id="btnQuickLearn">📖 快速学习</button>
          </div>
        </div>
        <div class="hero-ring" id="heroRing"></div>
      </div>

      <div class="stat-row" id="statRow"></div>

      <div class="dash-grid">
        <div class="dash-card">
          <h3 class="dash-title">各科掌握度</h3>
          <div id="subjBars" class="subj-bars"></div>
        </div>
        <div class="dash-card">
          <h3 class="dash-title">题库构成</h3>
          <div id="bankBreakdown" class="bank-breakdown"></div>
        </div>
      </div>
    </section>

    <!-- ============ 专注刷题（一键做题） ============ -->
    <section id="view-focus" class="view">
      <div class="focus-wrap">
        <div class="focus-top">
          <button class="btn small" id="focusExit">← 退出</button>
          <div class="focus-progress"><div class="bar" id="focusBar"></div></div>
          <div class="focus-count" id="focusCount">1 / 1</div>
        </div>
        <div class="focus-card" id="focusCard"></div>
      </div>
    </section>

    <!-- ============ 学习视图 ============ -->
    <section id="view-learn" class="view">
      <aside class="sidebar" id="subjectList"></aside>
      <div class="content" id="learnContent">
        <div class="placeholder">从左侧选择科目与章节开始学习。</div>
      </div>
    </section>

    <!-- ============ 刷题视图 ============ -->
    <section id="view-quiz" class="view">
      <div class="quiz-bar" id="quizBar"></div>
      <div class="quiz-wrap" id="quizWrap"></div>
    </section>

    <!-- ============ 真题库视图 ============ -->
    <section id="view-exam" class="view">
      <div class="exam-intro" id="examIntro"></div>
      <div class="exam-bar" id="examBar"></div>
      <div class="exam-wrap" id="examWrap"></div>
      <div class="exam-cases" id="examCases" style="display:none"></div>
    </section>

    <!-- ============ 速查视图 ============ -->
    <section id="view-ref" class="view">
      <div class="ref-grid" id="refGrid"></div>
    </section>

    <!-- ============ 计算例题视图 ============ -->
    <section id="view-calc" class="view">
      <div class="calc-intro">点击「显示解答」查看分步计算过程。共 <b id="calcCount">0</b> 道带数值例题，覆盖源强、大气等级、风险 Q 值、事故池、噪声衰减、废水达标。</div>
      <div class="calc-wrap" id="calcWrap"></div>
    </section>

    <!-- ============ 标准限值视图 ============ -->
    <section id="view-limits" class="view">
      <div class="limits-intro">常用排放标准限值数字库（浓度/速率/边界值）。<b>数值以现行有效版本及项目属地要求为准</b>，本表用于练习与速查。</div>
      <div class="limits-wrap" id="limitsWrap"></div>
    </section>
  </main>

  <footer class="foot">
    <span id="footMeta"></span>
    <span class="disclaimer">内容为技术学习整理，不替代持证工程师签字与审批意见；法规标准以现行有效版本为准。</span>
  </footer>
