}

/* ============ 自绘弹窗（沙箱 iframe 下替代原生 alert/confirm/prompt） ============ */
.xmodal-overlay {
  position: fixed; inset: 0;
  background: rgba(44, 62, 80, 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999; padding: 24px;
  animation: xmodalIn .15s ease;
}
@keyframes xmodalIn { from { opacity: 0; } to { opacity: 1; } }
.xmodal-box {
  background: #FFF7E6;
  border: 3px solid #2c3e50;
  border-radius: 14px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  padding: 20px 16px 16px;
  max-width: 320px; width: 100%;
  text-align: center;
}
.xmodal-msg {
  font-size: 14px; font-weight: 700; color: #2c3e50;
  line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap;
}
.xmodal-btns { display: flex; gap: 10px; justify-content: center; }
.xmodal-btns .btn-pixel { min-width: 96px; min-height: 44px; }
.xmodal-input {
  width: 100%; font-size: 16px; padding: 10px 12px;
  border: 2px solid #2c3e50; border-radius: 10px;
  margin-bottom: 14px; box-sizing: border-box;
  background: #fff; color: #2c3e50; font-weight: 700;
  outline: none;
}
.xmodal-input:focus { border-color: #F5A623; }

/* ============ 启动页：云端恢复入口 ============ */
.splash-recover {
  display: block;
  margin: 12px auto 0;
  background: rgba(255, 247, 230, 0.9);
  border: 2px solid #2c3e50;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 12px; font-weight: 800; color: #2c3e50;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  transition: transform .12s;
}
.splash-recover:hover { transform: translateY(-2px); }
.splash-recover:active { transform: translateY(1px); box-shadow: none; }

/* ============ 顶部云端状态徽标 ============ */
.cloud-badge {
  font-size: 11px; font-weight: 800;
  border: 2px solid #2c3e50; border-radius: 999px;
  padding: 5px 10px; background: #EFEAE0; color: #5c6b7a;
  cursor: pointer; white-space: nowrap;
  transition: transform .12s, background .2s;
}
.cloud-badge:active { transform: translateY(1px); }
.cloud-badge.sync { background: #DFF3E4; color: #2F7A4A; }
.cloud-badge.sync-partial { background: #FFF0CE; color: #9A6A12; }
.cloud-badge.offline { background: #EFEAE0; color: #7a6a55; }

/* ============ 角色页顶部返回条 ============ */
.cg-topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 14px;
}
.cg-back {
  background: #FFF7E6; border: 3px solid #2c3e50; border-radius: 10px;
  box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  padding: 9px 14px; font-size: 13px; font-weight: 800; color: #2c3e50;
  cursor: pointer; transition: transform .12s;
}
.cg-back:hover { transform: translateY(-2px); }
.cg-back:active { transform: translateY(1px); box-shadow: none; }
.cg-step-hint { font-size: 11px; color: #8B96A5; font-weight: 700; }

/* ============ 首页小工具条（换形象 / 同步） ============ */
.quick-tools { display: flex; gap: 8px; margin-top: 10px; }
.qt-btn {
  flex: 1; font-size: 12px; font-weight: 800; color: #2c3e50;
  background: #FFF7E6; border: 2px solid #2c3e50; border-radius: 10px;
  box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  padding: 9px 6px; cursor: pointer; transition: transform .12s;
}
.qt-btn:hover { transform: translateY(-2px); }
.qt-btn:active { transform: translateY(1px); box-shadow: none; }

/* ============================================================
   ★ 第七轮：少年漫画风主题（墨线 × 网点 × 速度线 × 爆框）
   追加在末尾，利用层叠覆盖上方的奶油手账风。
   ============================================================ */
:root {
  --ink: #17130c;          /* 墨黑 */
  --paper: #fdf8ea;        /* 漫画纸 */
  --m-red: #e0301e;        /* 热血红 */
  --m-blue: #1f50b5;       /* 少年蓝 */
  --m-yellow: #ffc61a;     /* 爆炸黄 */
  --m-orange: #f2691e;     /* 气焰橙 */
}

/* ---------- 全局底色：漫画纸 + 淡网点 ---------- */
html, body {
  background-color: #efe7d0 !important;
  background-image:
    radial-gradient(circle, rgba(23,19,12,0.055) 1px, transparent 1.6px) !important;
  background-size: 11px 11px !important;
}

/* ---------- 顶部品牌栏：墨黑 + 爆炸黄 ---------- */
.top-nav {
  background: var(--ink) !important;
  border-bottom: 4px solid #000 !important;
  box-shadow: 0 4px 0 rgba(23,19,12,0.35) !important;
}
.brand-logo-manga { display: flex; align-items: baseline; gap: 7px; user-select: none; }
.blm-main {
  font-size: 20px; font-weight: 900; color: var(--m-yellow);
  letter-spacing: 2px; font-style: italic;
  text-shadow: 2px 2px 0 var(--m-red), 4px 4px 0 rgba(0,0,0,0.45);
}
.blm-sub {
  font-size: 10px; font-weight: 900; color: #fff; letter-spacing: 1.5px;
  background: var(--m-red); padding: 2px 6px 1px;
  transform: skewX(-10deg); border: 2px solid #000;
}
.stage-pill { border-color: var(--m-yellow) !important; color: var(--m-yellow) !important; background: rgba(255,198,26,0.12) !important; font-weight: 800; }
.reset-btn { color: #fff !important; }
.reset-btn img { filter: brightness(0) invert(1); }

/* ---------- 所有面板：漫画纸卡 + 墨线 + 硬阴影 ---------- */
.pixel-card, .cal-card, .today-card, .duo-card, .skill-levels-card,
.char-card-v2, .level-card-v2, .answer-card-v2, .form-card, .form-frame-wrap,
.chargen-preview-card, .modal-box, .xmodal-box, .pet-card,
.arc-modal-box, .skilltree-col {
  background-color: var(--paper) !important;
  background-image: radial-gradient(circle, rgba(23,19,12,0.04) 1px, transparent 1.5px) !important;
  background-size: 9px 9px !important;
  border: 3px solid var(--ink) !important;
  border-radius: 8px !important;
  box-shadow: 6px 6px 0 rgba(23,19,12,0.9) !important;
}
/* 卡片微倾斜：漫画格感 */
.cal-card { transform: rotate(-0.5deg); }
.today-card { transform: rotate(0.4deg); }
.skill-levels-card { transform: rotate(0.35deg); }
.answer-card-v2 { transform: rotate(-0.4deg); }
.level-card-v2 { transform: rotate(0.3deg); }
.cal-card:hover, .today-card:hover { transform: rotate(0deg); transition: transform .2s; }

/* ---------- 隐藏旧手账风 PNG 装饰 ---------- */
.frame-bg, .level-frame-bg, .char-card-bg, .cta-img-bg, .form-frame-bg,
.answer-cat-sticker, .splash-cta-bg, .hero-btn-bg, .brand-logo-v2, .splash-logo,
.today-icon-img { display: none !important; }
.cal-card::before, .today-card::before,
.duo-card:first-child::after, .duo-card:last-child::after { display: none !important; }

/* ---------- 按钮：漫画硬边 ---------- */
.btn-pixel {
  border: 3px solid var(--ink) !important;
  border-radius: 7px !important;
  box-shadow: 4px 4px 0 var(--ink) !important;
  font-weight: 900 !important;
  letter-spacing: 0.5px;
  transition: transform .1s, box-shadow .1s;
}
.btn-pixel:active { transform: translate(3px, 3px) !important; box-shadow: 1px 1px 0 var(--ink) !important; }
.btn-pixel.primary { background: var(--m-red) !important; color: #fff !important; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
.btn-pixel.secondary { background: #fff !important; color: var(--ink) !important; }
.btn-pixel.warm { background: var(--m-yellow) !important; color: var(--ink) !important; }

/* ---------- 首页双主操作：漫画必杀技按钮 ---------- */
.hero-actions-v2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.hero-btn-v2 { aspect-ratio: auto !important; }
.hero-btn-manga {
  display: flex !important; flex-direction: column; align-items: center; gap: 4px;
  padding: 18px 10px 14px !important;
  border: 3.5px solid var(--ink) !important; border-radius: 10px;
  box-shadow: 6px 6px 0 var(--ink) !important;
  transition: transform .1s, box-shadow .1s;
  position: relative; overflow: hidden;
}
.hero-btn-manga::after { /* 速度线 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(-55deg, rgba(255,255,255,0.13) 0 6px, transparent 6px 14px);
}
.hero-btn-manga.red { background: linear-gradient(160deg, #ff5238 0%, #d21f0f 100%) !important; color: #fff; }
.hero-btn-manga.blue { background: linear-gradient(160deg, #2f6bed 0%, #173a8f 100%) !important; color: #fff; }
.hero-btn-manga:hover { transform: translateY(-2px) rotate(-0.5deg); }
.hero-btn-manga:active { transform: translate(4px, 4px) !important; box-shadow: 2px 2px 0 var(--ink) !important; }
.hbm-ico { font-size: 26px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.4)); }
.hbm-text { font-size: 17px; font-weight: 900; letter-spacing: 1px; text-shadow: 2px 2px 0 rgba(0,0,0,0.45); }
.hbm-exp {
  background: var(--m-yellow); color: var(--ink);
  font-weight: 900; font-size: 11px; padding: 2px 9px 1px;
  border: 2px solid var(--ink); border-radius: 20px; transform: skewX(-6deg);
}

/* ---------- 等级卡：战斗力 / 段位 / 连击 ---------- */
.level-tag {
  background: var(--m-red) !important; color: #fff !important;
  border: 3px solid var(--ink) !important; border-radius: 6px;
  font-weight: 900 !important; font-style: italic;
  transform: skewX(-8deg); box-shadow: 3px 3px 0 var(--ink);
}
.level-bar-track { border: 3px solid var(--ink) !important; background: #fff !important; border-radius: 6px !important; overflow: hidden; }
.level-bar-fill {
  background: repeating-linear-gradient(-55deg, var(--m-yellow) 0 9px, #f5a300 9px 18px) !important;
  border-right: 3px solid var(--ink);
}
.level-num { font-weight: 900 !important; color: var(--ink) !important; }
.power-row { display: flex; gap: 9px; margin-top: 11px; position: relative; z-index: 1; }
.power-cell {
  flex: 1; background: var(--ink); border: 3px solid #000; border-radius: 7px;
  padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  box-shadow: 3px 3px 0 rgba(23,19,12,0.4);
}
.power-label { font-size: 10px; font-weight: 800; color: var(--m-yellow); letter-spacing: 3px; }
.power-num { font-size: 19px; font-weight: 900; font-style: italic; color: #fff; line-height: 1.15; }
.streak-num { font-size: 16px; font-weight: 900; color: var(--m-orange); line-height: 1.3; }
.rank-badge { font-size: 15px; font-weight: 900; color: #d99a4e; line-height: 1.3; }
.rank-badge.silver { color: #d7dde8; }
.rank-badge.gold { color: var(--m-yellow); text-shadow: 0 0 8px rgba(255,198,26,0.6); }

/* ---------- 快捷任务 / 小工具：漫画小格 ---------- */
.qa-btn, .qt-btn {
  border: 3px solid var(--ink) !important; border-radius: 8px !important;
  background: #fff !important; box-shadow: 4px 4px 0 rgba(23,19,12,0.85) !important;
  font-weight: 800;
}
.qa-btn:active, .qt-btn:active { transform: translate(2px, 2px) !important; box-shadow: 1px 1px 0 var(--ink) !important; }
.qa-exp { background: var(--ink); color: var(--m-yellow); border-radius: 12px; padding: 1px 7px; font-weight: 900; }

/* ---------- 底部导航：墨黑条 ---------- */
.bottom-nav {
  background: var(--ink) !important;
  border-top: 4px solid #000 !important;
  box-shadow: 0 -4px 0 rgba(23,19,12,0.25) !important;
}
.bn-tab { color: #96907e !important; font-weight: 700; }
.bn-tab .bn-ico { filter: brightness(0) invert(0.62) !important; }
.bn-tab.active { color: var(--m-yellow) !important; }
.bn-tab.active .bn-ico { filter: brightness(0) invert(0.85) sepia(1) saturate(6) hue-rotate(2deg) !important; }
.bn-ico-emoji { font-size: 20px; }

/* ---------- EXP 提示：爆炸贴 ---------- */
.exp-toast-inner {
  background: var(--m-yellow) !important;
  border: 3px solid var(--ink) !important; border-radius: 8px;
  box-shadow: 4px 4px 0 var(--ink) !important;
  transform: rotate(-2deg);
  font-weight: 900 !important; color: var(--ink) !important;
}

/* ---------- 升级：全屏漫画爆框 ---------- */
.levelup-toast { z-index: 400; }
.levelup-inner {
  position: relative;
  background: repeating-conic-gradient(from -90deg at 50% 50%, #fff 0deg 7deg, #ffe49a 7deg 14deg) !important;
  border: 4px solid var(--ink) !important; border-radius: 14px;
  box-shadow: 9px 9px 0 var(--ink) !important;
  padding: 34px 46px !important;
  animation: mangaBurstIn 0.38s cubic-bezier(0.2, 2.2, 0.4, 1) !important;
}
.levelup-star { font-size: 46px; filter: drop-shadow(3px 3px 0 var(--ink)); }
.levelup-text {
  font-size: 40px !important; font-weight: 900 !important; font-style: italic;
  color: var(--m-red) !important; letter-spacing: 2px;
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 4px 4px 0 var(--ink);
  transform: rotate(-3deg);
}
.levelup-lvl { color: var(--m-blue) !important; font-weight: 900 !important; font-style: italic; -webkit-text-stroke: 1px var(--ink); }
.levelup-sub { color: var(--ink) !important; font-weight: 700; }
@keyframes mangaBurstIn {
  0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
  60% { transform: scale(1.12) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); }
}

/* ---------- 启动页：漫画封面 ---------- */
.splash-bg { filter: saturate(1.12) contrast(1.04); }
.page-splash::after { /* 速度线聚焦层 */
  content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 40%, rgba(255,255,255,0.16) 0deg 2.4deg, transparent 2.4deg 10deg);
  mix-blend-mode: soft-light;
}
.splash-content { z-index: 2; }
.splash-logo-manga { text-align: center; transform: rotate(-2.5deg); animation: splash-logo-in 0.8s ease; }
.slm-kicker {
  display: inline-block; background: var(--ink); color: var(--m-yellow);
  font-weight: 900; font-size: 13px; letter-spacing: 6px;
  padding: 4px 14px 3px; border-radius: 4px; border: 2px solid #000;
  margin-bottom: 6px;
}
.slm-title {
  font-size: clamp(42px, 12vw, 58px); font-weight: 900; color: #fff;
  letter-spacing: 5px; line-height: 1.15;
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--m-red), 9px 9px 0 rgba(23,19,12,0.9);
}
.slm-online {
  font-size: clamp(20px, 6vw, 27px); font-weight: 900; font-style: italic;
  color: var(--m-yellow); letter-spacing: 12px; margin-top: 2px;
  -webkit-text-stroke: 1.4px var(--ink); paint-order: stroke fill;
  text-shadow: 3px 3px 0 var(--ink);
}
.splash-cta {
  aspect-ratio: auto !important; width: 86%; max-width: 400px;
  background: linear-gradient(160deg, #ff5238, #d21f0f) !important;
  border: 4px solid var(--ink) !important; border-radius: 12px;
  box-shadow: 7px 7px 0 var(--ink) !important;
  padding: 16px 20px !important;
  transform: rotate(-1deg);
  filter: none !important;
}
.splash-cta:hover { transform: rotate(-1deg) translateY(-2px) !important; }
.splash-cta:active { transform: rotate(-1deg) translate(4px, 4px) !important; box-shadow: 2px 2px 0 var(--ink) !important; }
.splash-cta-text {
  position: static !important; inset: auto !important;
  color: #fff !important; font-size: clamp(15px, 4.2vw, 19px) !important;
  font-weight: 900 !important; letter-spacing: 2px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.4) !important;
}
.splash-recover {
  background: #fff !important; border: 3px solid var(--ink) !important;
  border-radius: 9px !important; box-shadow: 4px 4px 0 var(--ink) !important;
  color: var(--ink) !important; font-weight: 800 !important;
}

/* ---------- 表单页 ---------- */
.onboard-title { color: var(--ink); font-weight: 900; text-shadow: 2px 2px 0 rgba(255,255,255,0.6); }
.step-num { border: 3px solid var(--ink) !important; font-weight: 900; }
.step-item.active .step-num { background: var(--m-red) !important; color: #fff !important; }
.field input, .field select, .field textarea,
.modal-body .field input, .form-card input, .form-card select {
  border: 2.5px solid var(--ink) !important; border-radius: 7px !important;
  background: #fff !important; font-weight: 600;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none !important; box-shadow: 3px 3px 0 var(--ink) !important; border-color: var(--ink) !important;
}
.field label { font-weight: 900 !important; color: var(--ink) !important; }
.cta-img-btn { aspect-ratio: auto !important; }
.cta-img-btn.primary {
  background: linear-gradient(160deg, #ff5238, #d21f0f) !important;
  border: 3.5px solid var(--ink) !important; border-radius: 10px;
  box-shadow: 6px 6px 0 var(--ink) !important; padding: 14px 22px !important;
}
.cta-img-btn.primary:active { transform: translate(4px, 4px) !important; box-shadow: 2px 2px 0 var(--ink) !important; }
.cta-img-text { position: static !important; color: #fff !important; font-weight: 900 !important; font-size: 16px !important; text-shadow: 2px 2px 0 rgba(0,0,0,0.4) !important; }
.cta-img-btn.secondary {
  background: #fff !important; border: 3px solid var(--ink) !important;
  border-radius: 10px; box-shadow: 4px 4px 0 var(--ink); padding: 12px 18px !important;
}
.cta-img-text-secondary { position: static !important; color: var(--ink) !important; font-weight: 800 !important; }

/* ---------- 角色选择页 ---------- */
.pick-tile {
  border: 3px solid var(--ink) !important; border-radius: 8px !important;
  background: #fff !important; box-shadow: 3px 3px 0 rgba(23,19,12,0.5);
  transition: transform .12s, box-shadow .12s;
}
.pick-tile:hover { transform: translateY(-2px) rotate(-0.6deg); }
.pick-tile.selected {
  outline: 4px solid var(--m-red) !important; outline-offset: 2px;
  box-shadow: 5px 5px 0 var(--ink) !important;
}
/* 角色缩略图：完整显示全身立绘（不裁头），背景图仍 cover */
#charGrid .pick-tile { background: linear-gradient(180deg, #f3f7ff 0%, #fff 60%) !important; }
#charGrid .pick-tile img { object-fit: contain !important; object-position: center bottom; }
.chargen-title, .chargen-step-label { font-weight: 900 !important; color: var(--ink); }
.cg-topbar { border: 3px solid var(--ink) !important; background: var(--paper) !important; border-radius: 8px; box-shadow: 4px 4px 0 rgba(23,19,12,0.85); }
.cg-back { font-weight: 800 !important; color: var(--ink) !important; }

/* ---------- 答案之书：漫画对话框 ---------- */
.answer-card-v2 {
  background: var(--paper) !important;
  background-image: radial-gradient(circle, rgba(23,19,12,0.05) 1px, transparent 1.5px) !important;
  background-size: 8px 8px !important;
  padding: 16px 14px 16px 18px !important;
}
.answer-title-v2 { font-weight: 900 !important; color: var(--ink) !important; }
.answer-body-v2 {
  font-weight: 800 !important; color: var(--ink) !important;
  font-size: 15px !important;
}
.answer-refresh-v2 {
  background: var(--m-blue) !important; color: #fff !important;
  border: 3px solid var(--ink) !important; border-radius: 8px !important;
  box-shadow: 3px 3px 0 var(--ink) !important; font-weight: 900 !important;
}
.answer-refresh-v2:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) !important; }

/* ---------- 日历与清单 ---------- */
.cal-month-label { font-weight: 900 !important; color: var(--ink); }
.cal-today-btn { border: 2.5px solid var(--ink) !important; border-radius: 6px !important; font-weight: 800; background: #fff !important; box-shadow: 2px 2px 0 var(--ink); }
.cal-cell.has-exp .cal-dot, .cal-day.has-exp .cal-dot { background: var(--m-red) !important; }
.today-label { font-weight: 900 !important; color: var(--ink); }
.today-add-btn { background: var(--ink) !important; border-radius: 7px !important; font-weight: 900; }
.today-footer { color: #7a6f58 !important; font-weight: 600; }

/* ---------- 弹窗头部 ---------- */
.modal-header { background: var(--ink) !important; border-bottom: 3px solid #000 !important; border-radius: 8px 8px 0 0; }
.modal-header h3 { color: var(--m-yellow) !important; font-weight: 900 !important; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
.modal-close { color: #fff !important; font-weight: 900; }
.xmodal-box { border-width: 4px !important; }
.xmodal-msg { font-weight: 700; color: var(--ink); }
.xmodal-input { border: 2.5px solid var(--ink) !important; border-radius: 7px !important; }

/* ---------- 经历库 / 技能树文字强化 ---------- */
.explog-header h2, .skilltree-header h2 { color: var(--ink); text-shadow: 2px 2px 0 rgba(255,255,255,0.5); }
.st-col-header { font-weight: 900 !important; color: var(--ink); }
.btn-add-learning {
  border: 3px dashed var(--ink) !important; border-radius: 8px !important;
  font-weight: 800 !important; color: var(--ink) !important; background: #fff !important;
}
.tree-tab { border: 2.5px solid var(--ink) !important; border-radius: 7px !important; font-weight: 800; background: #fff; }
.tree-tab.active { background: var(--ink) !important; color: var(--m-yellow) !important; }

/* ---------- 云端徽标 ---------- */
.cloud-badge { border: 2.5px solid var(--m-yellow) !important; color: var(--m-yellow) !important; background: rgba(255,198,26,0.1) !important; font-weight: 800; }
.cloud-badge.offline { border-color: #96907e !important; color: #96907e !important; }

/* ---------- 滚动条漫画化 ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #efe7d0; }
::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 6px; border: 2px solid #efe7d0; }

/* 补丁：CTA 按钮内容居中（原 img 背景移除后） */
.cta-img-btn { display: flex; align-items: center; justify-content: center; }

/* 补丁：启动页入场动画改为纯 transform（避免动画冻结时不可见） */
@keyframes splashZoomIn {
  from { transform: rotate(-2.5deg) scale(1.12); }
  to   { transform: rotate(-2.5deg) scale(1); }
}
@keyframes splashCtaIn {
  from { transform: rotate(-1deg) translateY(14px); }
  to   { transform: rotate(-1deg) translateY(0); }
}
.splash-logo-manga { animation: splashZoomIn 0.55s ease; }
.splash-cta { animation: splashCtaIn 0.6s 0.1s ease backwards; }

/* 补丁：人物卡/等级卡/表单卡脱离背景图，改为自流式漫画卡布局 */
.char-card-v2 {
  display: flex; gap: 14px; align-items: stretch;
  padding: 14px; min-height: 210px;
  filter: none !important;
}
.char-card-portrait-wrap {
  position: static !important; width: 38%; flex: none;
  height: auto !important; min-height: 182px;
  border: 3px solid var(--ink); border-radius: 7px;
  background:
    repeating-conic-gradient(from 0deg at 50% 100%, rgba(31,80,181,0.10) 0deg 4deg, transparent 4deg 11deg),
    linear-gradient(180deg, #cfe8ff 0%, #eef8ff 70%, #fff8dc 100%) !important;
  overflow: hidden;
}
.char-portrait-img-v2 { filter: drop-shadow(3px 3px 0 rgba(23,19,12,0.25)) !important; }
.char-card-info-v2 { position: static !important; flex: 1; overflow: visible !important; min-width: 0; }
.char-name { font-weight: 900 !important; color: var(--ink); font-size: 19px !important; }
.char-quote {
  background: #fff !important; border: 2.5px solid var(--ink) !important;
  border-radius: 10px !important; font-weight: 700; color: var(--ink) !important;
  box-shadow: 3px 3px 0 rgba(23,19,12,0.5);
}
.char-tags .tag-chip { border: 2px solid var(--ink) !important; font-weight: 800; }

.level-card-v2 { padding: 13px 14px 12px; filter: none !important; }
.level-frame-inner { position: static !important; inset: auto !important; padding: 0 !important; }

.form-frame-wrap { padding: 10px; }
.form-card {
  position: static !important; padding: 6px 4px 2px !important; overflow: visible !important;
  background: transparent !important; border: none !important; box-shadow: none !important;
}

/* ---------- 组合形象（背景+角色分层渲染，绕开沙箱 canvas 限制） ---------- */
.char-card-portrait-wrap { position: relative !important; }
.char-portrait-img-v2.combo-bg-img {
  object-fit: cover !important;
  object-position: center !important;
  filter: none !important;
}
/* 修复：合成形象严格约束在人物卡框内（inset:0 + contain），不再溢出遮挡右侧信息 */
/* 根因：旧绝对定位遗留 left:7%/top:6% 在 relative 下把整框向右下偏移，压到信息栏 */
.char-card-portrait-wrap {
  overflow: hidden !important;
  left: auto !important; top: auto !important; right: auto !important; bottom: auto !important;
}
.char-card-info-v2 { position: relative; z-index: 2; min-width: 0; }
.char-portrait-layer {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  margin: 0; transform: none;
  padding: 0 5%;
  box-sizing: border-box;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(3px 3px 0 rgba(23,19,12,0.25));
  pointer-events: none;
}
.char-combo { position: relative; width: 100%; height: 100%; overflow: hidden; }
.char-combo .combo-bg {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
}
.char-combo .combo-char {
  position: absolute; inset: 0;
  width: 100%; height: 100%; margin: 0; transform: none;
  object-fit: contain; object-position: center bottom;
  filter: drop-shadow(3px 3px 0 rgba(23,19,12,0.25));
}
