<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* ============================================================
   老李的世界Online｜我的人物面板
   视觉：像素风 / 清新 / q版可爱 / 适合生活记录
   ============================================================ */

:root {
  --c-sky: #5fb4f2;
  --c-sky-deep: #4a8fd8;
  --c-sky-light: #bfe0f7;
  --c-cream: #fff7e6;
  --c-warm: #ffd86b;
  --c-warm-deep: #f5a623;
  --c-pink: #ffb3c7;
  --c-green: #7cd992;
  --c-green-deep: #4abf6c;
  --c-purple: #b89dff;
  --c-bg: #f0f6fb;
  --c-card: #ffffff;
  --c-text: #2c3e50;
  --c-text-soft: #7a8a9b;
  --c-border: #d8e6f3;

  --pixel-shadow: 0 4px 0 rgba(0,0,0,0.08);
  --pixel-border: 3px solid #2c3e50;
  --pixel-radius: 0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,0.6) 0, transparent 8px),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,0.4) 0, transparent 12px),
    radial-gradient(circle at 60% 80%, rgba(255,255,255,0.5) 0, transparent 10px),
    radial-gradient(circle at 30% 70%, rgba(255,255,255,0.4) 0, transparent 14px);
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ============================================================
   顶部品牌栏
   ============================================================ */
.top-nav {
  background: linear-gradient(180deg, var(--c-sky) 0%, var(--c-sky-deep) 100%);
  color: #fff;
  padding: 14px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  border-bottom: 3px solid #2c3e50;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-logo {
  width: 38px; height: 38px;
  background: var(--c-cream);
  border: 3px solid #2c3e50;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: var(--pixel-shadow);
}
.brand-text .title {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 1px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
}
.brand-text .subtitle {
  font-size: 11px;
  opacity: 0.9;
  margin-top: 1px;
}

.stage-pill {
  background: rgba(255,255,255,0.2);
  border: 2px solid #fff;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
}

/* ============================================================
   主体容器
   ============================================================ */
.page-wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* ============================================================
   像素面板基类
   ============================================================ */
.pixel-card {
  background: var(--c-card);
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.15);
  padding: 18px;
}
.pixel-card .card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--c-text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 2px dashed var(--c-border);
}
.pixel-card .card-title .ico {
  width: 24px; height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

/* ============================================================
   启动：个人情况表单页
   ============================================================ */
#page-onboard { display: none; }

.onboard-wrap {
  max-width: 720px;
  margin: 0 auto;
}
.onboard-banner {
  background: linear-gradient(135deg, var(--c-cream) 0%, #ffe5b8 100%);
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.15);
  padding: 22px;
  margin-bottom: 20px;
  text-align: center;
}
.onboard-banner .big-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--c-text);
  letter-spacing: 1px;
}
.onboard-banner .big-title .acc { color: var(--c-warm-deep); }
.onboard-banner .sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--c-text-soft);
}
.onboard-banner .mini-mascot {
  display: inline-flex;
  margin-top: 12px;
  font-size: 36px;
}

.form-card {
  background: var(--c-card);
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.15);
  padding: 22px;
}
.form-card .row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
.form-card .row.single { grid-template-columns: 1fr; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--c-text);
  margin-bottom: 6px;
}
.field label .hint {
  font-weight: 400;
  color: var(--c-text-soft);
  margin-left: 4px;
  font-size: 11px;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #2c3e50;
  background: #fafcfe;
  font-size: 14px;
  outline: none;
  transition: background .15s, border-color .15s;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--c-sky);
  background: #fff;
}
.field textarea {
  resize: vertical;
  min-height: 70px;
  line-height: 1.5;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 18px;
}
.btn-pixel {
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 700;
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.25);
  transition: transform .12s, box-shadow .12s;
  letter-spacing: 1px;
}
.btn-pixel:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 rgba(44,62,80,0.25);
}
.btn-pixel.primary {
  background: var(--c-warm);
  color: #2c3e50;
}
.btn-pixel.primary:hover { background: #ffe08a; }
.btn-pixel.secondary {
  background: #fff;
  color: var(--c-text);
}

/* ============================================================
   首页：人物面板
   ============================================================ */
#page-home { display: none; }

.profile-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 18px;
  align-items: start;
}

.profile-card {
  background: linear-gradient(180deg, #fff 0%, #fff8ec 100%);
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.15);
  padding: 18px;
  text-align: center;
}
.profile-card .avatar-stage {
  background: linear-gradient(180deg, #cfe7fb 0%, #f6e0a5 100%);
  border: 3px solid #2c3e50;
  height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin-bottom: 12px;
}
.profile-card .char-portrait {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  image-rendering: auto;
}

.profile-card .nickname {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-top: 4px;
}
.profile-card .meta {
  font-size: 12px;
  color: var(--c-text-soft);
  margin-top: 4px;
}
.profile-card .meta .id {
  display: inline-block;
  margin-left: 6px;
  background: var(--c-bg);
  border: 1.5px solid #2c3e50;
  padding: 1px 6px;
  font-size: 11px;
}

.speech-bubble {
  position: relative;
  background: #fff;
  border: 3px solid #2c3e50;
  padding: 8px 10px;
  font-size: 12px;
  margin-top: 10px;
  line-height: 1.5;
}
.speech-bubble::after {
  content: "";
  position: absolute;
  top: -10px; left: 24px;
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 10px solid #2c3e50;
}
.speech-bubble::before {
  content: "";
  position: absolute;
  top: -7px; left: 26px;
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-bottom: 8px solid #fff;
  z-index: 1;
}

.keywords {
  margin-top: 12px;
  text-align: left;
}
.keywords .label {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-text-soft);
  margin-bottom: 6px;
}
.keywords .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.tag-chip {
  background: var(--c-bg);
  border: 2px solid #2c3e50;
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 600;
}

.right-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.skill-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: #f0f6fb;
  border: 2px solid #2c3e50;
  font-size: 12px;
}
.skill-item .dot {
  width: 10px; height: 10px;
  border: 2px solid #2c3e50;
  flex-shrink: 0;
}
.skill-item.confirmed .dot { background: var(--c-green-deep); }
.skill-item .name { font-weight: 600; }
.skill-item .tag {
  margin-left: auto;
  font-size: 10px;
  color: var(--c-text-soft);
  border: 1.5px solid var(--c-border);
  padding: 1px 5px;
}

.explore-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.explore-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 2px solid #2c3e50;
  background: linear-gradient(90deg, #fff8ec 0%, #fff 100%);
}
.explore-item .emoji {
  width: 28px; height: 28px;
  background: var(--c-warm);
  border: 2px solid #2c3e50;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.explore-item .text .title { font-size: 12px; font-weight: 700; }
.explore-item .text .desc { font-size: 11px; color: var(--c-text-soft); }

.action-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn-action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  font-size: 14px;
  font-weight: 700;
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.25);
  transition: transform .12s, box-shadow .12s;
  letter-spacing: 1px;
}
.btn-action:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 rgba(44,62,80,0.25);
}
.btn-action.sky   { background: var(--c-sky); color: #fff; }
.btn-action.warm  { background: var(--c-warm); color: #2c3e50; }
.btn-action.green { background: var(--c-green); color: #2c3e50; }
.btn-action.pink  { background: var(--c-pink); color: #2c3e50; }

.footnote {
  margin-top: 24px;
  padding: 14px;
  background: #fff8ec;
  border: 2.5px dashed #2c3e50;
  font-size: 12px;
  color: var(--c-text-soft);
  text-align: center;
  line-height: 1.7;
}
.footnote .acc { color: var(--c-warm-deep); font-weight: 700; }

/* ============================================================
   经历记录弹窗（Modal）
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44, 62, 80, 0.55);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(3px);
}
.modal-box {
  background: var(--c-card);
  border: 3px solid #2c3e50;
  box-shadow: 6px 6px 0 rgba(44,62,80,0.25);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 3px solid #2c3e50;
  background: var(--c-cream);
}
.modal-header h3 {
  font-size: 16px;
  font-weight: 800;
}
.modal-close {
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  border: 2px solid #2c3e50;
  background: #fff;
  box-shadow: 2px 2px 0 rgba(44,62,80,0.15);
  transition: transform .1s, box-shadow .1s;
}
.modal-close:hover {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 rgba(44,62,80,0.15);
}
.modal-body {
  padding: 18px;
}
.modal-body .field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--c-text);
  margin-bottom: 6px;
}
.modal-body .field label .hint {
  font-weight: 400;
  color: var(--c-text-soft);
  margin-left: 4px;
  font-size: 11px;
}
.modal-body .field input,
.modal-body .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #2c3e50;
  background: #fafcfe;
  font-size: 14px;
  outline: none;
  transition: background .15s, border-color .15s;
}
.modal-body .field input:focus,
.modal-body .field textarea:focus {
  border-color: var(--c-sky);
  background: #fff;
}
.modal-body .field textarea {
  resize: vertical;
  min-height: 100px;
  line-height: 1.6;
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 18px;
  border-top: 2px dashed var(--c-border);
  flex-shrink: 0;
}

@media (max-width: 768px) {
  .modal-overlay { padding: 12px; }
  .modal-box { max-width: 100%; }
}

/* ============================================================
   经验值条
   ============================================================ */
.exp-bar-wrap {
  margin-top: 12px;
  padding: 0 4px;
}
.exp-bar-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  font-size: 11px;
  font-weight: 700;
}
.exp-bar-label .lvl-display {
  background: var(--c-warm);
  border: 2px solid #2c3e50;
  padding: 1px 8px;
  font-size: 10px;
}
.exp-bar-label .exp-num {
  color: var(--c-text-soft);
  font-size: 10px;
}
.exp-bar-track {
  height: 14px;
  background: var(--c-bg);
  border: 2px solid #2c3e50;
  position: relative;
  overflow: hidden;
}
.exp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c-green) 0%, var(--c-green-deep) 100%);
  transition: width 0.5s ease;
  position: relative;
}
.exp-bar-fill::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    90deg,
    rgba(255,255,255,0.15) 0,
    rgba(255,255,255,0.15) 4px,
    transparent 4px,
    transparent 8px
  );
}

/* ============================================================
   EXP增加提示
   ============================================================ */
.exp-toast {
  position: fixed;
  top: 80px;
  right: 24px;
  z-index: 350;
}
.exp-toast-inner {
  background: var(--c-cream);
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.25);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.exp-toast-icon {
  font-size: 18px;
}
.exp-toast-text {
  font-size: 14px;
  font-weight: 800;
  color: var(--c-warm-deep);
}
@keyframes expToastIn {
  from { transform: translateX(60px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes expToastOut {
  from { transform: translateX(0); opacity: 1; }
  to   { transform: translateX(60px); opacity: 0; }
}

/* ============================================================
   升级提示
   ============================================================ */
.levelup-toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 300;
  animation: levelupIn 0.4s ease;
}
.levelup-inner {
  background: var(--c-cream);
  border: 4px solid #2c3e50;
  box-shadow: 6px 6px 0 rgba(44,62,80,0.3);
  padding: 24px 36px;
  text-align: center;
}
.levelup-star {
  font-size: 42px;
  animation: levelupStar 0.6s ease infinite alternate;
}
.levelup-text {
  font-size: 16px;
  font-weight: 800;
  margin-top: 6px;
  color: var(--c-text);
}
.levelup-lvl {
  font-size: 28px;
  font-weight: 800;
  color: var(--c-warm-deep);
  margin-top: 4px;
}
.levelup-sub {
  font-size: 12px;
  color: var(--c-text-soft);
  margin-top: 6px;
}
@keyframes levelupIn {
  from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
  to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes levelupStar {
  from { transform: scale(1) rotate(-5deg); }
  to   { transform: scale(1.15) rotate(5deg); }
}

/* ============================================================
   技能确认弹窗
   ============================================================ */
.skill-confirm-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid #2c3e50;
  background: #fafcfe;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background .15s;
}
.skill-confirm-item:hover {
  background: #eef3fc;
}
.skill-confirm-item.already {
  opacity: 0.5;
  cursor: default;
}
.skill-confirm-item input[type=checkbox] {
  width: 18px; height: 18px;
  accent-color: var(--c-green-deep);
  cursor: pointer;
}
.skill-confirm-name {
  font-size: 13px;
  font-weight: 600;
  flex: 1;
}
.skill-confirm-badge {
  font-size: 10px;
  background: var(--c-bg);
  border: 1.5px solid var(--c-border);
  padding: 1px 6px;
  color: var(--c-text-soft);
}

/* ============================================================
   我的经历库
   ============================================================ */
.explog-wrap {
  max-width: 720px;
  margin: 0 auto;
}
.explog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.exp-entry {
  margin-bottom: 14px;
}
.exp-entry-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.exp-entry-header .exp-date {
  font-size: 11px;
  color: var(--c-text-soft);
  background: var(--c-bg);
  border: 2px solid #2c3e50;
  padding: 2px 8px;
  font-weight: 600;
  flex-shrink: 0;
}
.exp-entry-header .exp-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--c-text);
  flex: 1;
}
.exp-entry-header .exp-del {
  width: 24px; height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  border: 2px solid #2c3e50;
  background: #fff;
  color: var(--c-text-soft);
  box-shadow: 2px 2px 0 rgba(44,62,80,0.1);
  transition: color .15s, background .15s;
  flex-shrink: 0;
}
.exp-entry-header .exp-del:hover {
  color: #c0392b;
  background: #fce4e4;
}

.exp-structured {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}
.exp-field {
  display: flex;
  gap: 8px;
  font-size: 12px;
  line-height: 1.6;
}
.exp-field-label {
  flex-shrink: 0;
  font-weight: 700;
  color: var(--c-text-soft);
  min-width: 70px;
  text-align: right;
}
.exp-field-val {
  color: var(--c-text);
  flex: 1;
}

.exp-raw-toggle {
  font-size: 11px;
  color: var(--c-sky-deep);
  cursor: pointer;
  font-weight: 600;
  margin-bottom: 4px;
  user-select: none;
}
.exp-raw-toggle:hover { color: var(--c-text); }
.exp-raw-text {
  font-size: 12px;
  color: var(--c-text-soft);
  line-height: 1.6;
  white-space: pre-wrap;
  padding: 8px 10px;
  background: var(--c-bg);
  border: 2px dashed var(--c-border);
  margin-bottom: 8px;
}

.exp-skills-section {
  margin-top: 6px;
  padding-top: 8px;
  border-top: 2px dashed var(--c-border);
}
.exp-skills-label {
  font-size: 11px;

}

}

/* 技能树左右分栏 */

}

.skilltree-col {

}

}
.skilltree-col.learning {

}

.st-col-header {

}
.st-col-icon {
  font-size: 18px;
}
.st-col-desc {
  font-size: 11px;
  color: var(--c-text-soft);
  margin-bottom: 14px;
  line-height: 1.5;
}

.st-empty {
  text-align: center;
  font-size: 12px;
  color: var(--c-text-soft);
  padding: 30px 10px;
  line-height: 1.8;
}

/* 技能节点 */
.st-skill-node {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid #2c3e50;
  background: #fff;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.st-skill-node:hover {
  background: #f0f6fb;
  transform: translate(1px, 1px);
}

.st-node-dot {
  width: 14px; height: 14px;
  border: 2px solid #2c3e50;
  flex-shrink: 0;
  position: relative;
}
.st-node-dot.lit {
  background: var(--c-green-deep);
  box-shadow: 0 0 0 3px rgba(74,191,108,0.2);
}
.st-node-dot.want {
  background: var(--c-bg);
}
.st-node-dot.learning {
  background: var(--c-warm);
  box-shadow: 0 0 0 3px rgba(255,216,107,0.2);
  animation: learningPulse 2s ease infinite;
}
.st-node-dot.practiced {
  background: var(--c-sky);
}
.st-node-dot.verified {
  background: var(--c-purple);
  box-shadow: 0 0 0 3px rgba(184,157,255,0.2);
}

@keyframes learningPulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(255,216,107,0.2); }
  50% { box-shadow: 0 0 0 6px rgba(255,216,107,0.15); }
}

.st-node-name {
  font-size: 13px;
  font-weight: 700;
  flex: 1;
}

.st-node-status {
  font-size: 10px;
  padding: 2px 7px;

}
.st-node-status.want { background: var(--c-bg); color: var(--c-text-soft); }
.st-node-status.learning { background: #fff8ec; color: var(--c-warm-deep); }
.st-node-status.practiced { background: #e0f0ff; color: var(--c-sky-deep); }
.st-node-status.verified { background: #eee5ff; color: #7c5cbf; }
.st-node-status.lit { background: #e8f5e9; color: var(--c-green-deep); }

.st-node-meta {
  font-size: 10px;
  color: var(--c-text-soft);
  margin-left: auto;
}
.st-node-tree {
  font-size: 10px;
  color: var(--c-sky-deep);
  margin-left: 4px;
}

/* 添加新技能按钮 */

  padding: 14px;
  border: 3px dashed #2c3e50;
  background: #fff8ec;
  font-size: 14px;
  font-weight: 700;
  color: var(--c-warm-deep);
  cursor: pointer;
  transition: background .15s, transform .1s;
  margin-top: 4px;
}
.btn-add-learning:hover {
  background: #ffe5b8;

}

/* ============================================================

   ============================================================ */
.skill-unit-item {
  display: flex;
  align-items: center;

}
.skill-unit-item.want { border-color: var(--c-border); }
.skill-unit-item.learning { border-color: var(--c-warm); background: #fff8ec; }
.skill-unit-item.practiced { border-color: var(--c-sky); background: #e0f0ff; }
.skill-unit-item.verified { border-color: var(--c-purple); background: #eee5ff; }

.skill-unit-status-dot {
  width: 10px; height: 10px;

}
.skill-unit-status-dot.want { background: var(--c-bg); }
.skill-unit-status-dot.learning { background: var(--c-warm); }
.skill-unit-status-dot.practiced { background: var(--c-sky); }
.skill-unit-status-dot.verified { background: var(--c-purple); }
.skill-unit-status-dot.lit { background: var(--c-green-deep); }

.skill-unit-name {
  font-size: 12px;
  font-weight: 600;
  flex: 1;
}
.skill-unit-status-text {

}

}

/* ============================================================

   ============================================================ */
.skill-break-item {
  display: flex;

  gap: 8px;

}
.skill-break-arrow {

}

   学习计划弹窗
   ============================================================ */

  background: linear-gradient(90deg, #fff8ec, #e8f5e9);

}

  font-size: 11px;

  font-size: 12px;

.plan-task-title {

.plan-section-title {

.plan-section-desc {

.plan-phase-header {
  display: inline-block;

.plan-tree-chip {

}
.ptc-dot.want { background: var(--c-bg); }
.ptc-dot.learning { background: var(--c-warm); }
.ptc-dot.practiced { background: var(--c-sky); }

  margin: 0;

  .arc-modal-box {
    width: 95vw;

  }

@keyframes arcx-hint-blink {

  font-weight: 700;
  letter-spacing: 2px;
}

.char-card {
  background: linear-gradient(180deg, #cfe7fb 0%, #fff8ec 100%);
  padding: 10px 10px 8px;
  position: relative;
}
.char-tag {
  position: absolute;
  top: 0; left: 0;
  background: #2c3e50;
  color: var(--c-warm);
  font-size: 10px;
  font-weight: 800;
  padding: 3px 10px;
  letter-spacing: 2px;

}
.char-portrait {
  position: relative;
  width: 100%;
  height: 200px;
  max-height: 200px;
  border: 3px solid #2c3e50;
  background: linear-gradient(180deg, #1a2a4a 0%, #2c4a7a 40%, #f6c98a 95%, #e0a560 100%);
  overflow: hidden;
  margin-top: 12px;
}
.char-portrait img {
  position: absolute;
  bottom: 0;
  left: 50%;

  object-position: center bottom;
  image-rendering: pixelated;
}

  inset: 0;
  background-image:

    radial-gradient(1.5px 1.5px at 78% 12%, #fff 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 42% 8%, #fff 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 32%, #fff 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 18% 38%, #fff 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 65% 24%, #fff 50%, transparent 100%);
  pointer-events: none;
}
.char-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--c-text);
  letter-spacing: 2px;
  text-align: center;
  margin-top: 8px;
  text-shadow: 2px 2px 0 rgba(255,255,255,0.7);
}
.char-school {
  text-align: center;
  margin-top: 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--c-text);
  line-height: 1.5;
}
.char-school-line.soft { color: var(--c-text-soft); font-size: 11px; font-weight: 600; }
.char-meta {
  margin-top: 8px;
  border-top: 2px dashed var(--c-border);
  padding-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.char-meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
}
.char-meta-k { color: var(--c-text-soft); font-weight: 600; }
.char-meta-v {
  color: var(--c-text);
  font-weight: 700;
  font-family: "Courier New", monospace;
  letter-spacing: 1px;
}

.kw-card .char-kws {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.char-kw {
  font-size: 11px;
  font-weight: 700;
  background: var(--c-warm);
  border: 2px solid #2c3e50;
  color: #2c3e50;
  padding: 2px 9px;
}

.desc-card {
  background: #fffdf5;
  border-style: dashed;
  padding: 12px 14px;
}
.char-quote {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-text);
  line-height: 1.7;
  text-align: center;
  font-style: italic;
}

/* ============== 中栏：能力 ============== */
.ability-card {
  background: #fff;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.ability-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.skill-branch {
  background: #fafcfe;
  border: 2px solid var(--c-border);
  border-left: 4px solid var(--c-sky-deep);
  padding: 5px 8px;
}
.branch-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  color: var(--c-text);
  margin-bottom: 4px;
}
.branch-icon { font-size: 13px; }
.branch-name { flex: 1; }
.branch-count {
  font-size: 10px;
  font-weight: 800;
  background: var(--c-sky-light);
  color: var(--c-sky-deep);
  border: 1.5px solid var(--c-sky-deep);
  padding: 0 6px;
  line-height: 16px;
}
.branch-skills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 2px;
}
.skill-node {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  background: #fff;
  border: 1.5px solid #2c3e50;
  padding: 1px 6px;
  color: var(--c-text);
  line-height: 1.4;
}
.skill-node.lit {
  background: #e8f5e9;
  border-color: var(--c-green-deep);
  color: var(--c-green-deep);
  box-shadow: 2px 2px 0 var(--c-green-deep);
}
.skill-node-dot {
  width: 7px; height: 7px;
  background: var(--c-green-deep);
  border: 1px solid #2c3e50;
  display: inline-block;
  box-shadow: 0 0 4px var(--c-green);
}
.skill-node-name { color: inherit; }

/* ============== 右栏：正在成长 ============== */
.grow-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.grow-item {
  background: #fffdf5;
  border: 2px solid #2c3e50;
  border-left: 4px solid var(--c-warm-deep);
  padding: 5px 8px;
  box-shadow: 2px 2px 0 rgba(44,62,80,0.12);
}
.grow-head {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 3px;
}
.grow-stage {
  font-size: 9px;
  font-weight: 800;
  background: var(--c-warm-deep);
  color: #fff;
  padding: 1px 5px;
  letter-spacing: 1px;
  border: 1.5px solid #2c3e50;
}
.grow-name {
  font-size: 12px;
  font-weight: 800;
  color: var(--c-text);
  flex: 1;
}
.grow-goal {
  font-size: 10px;
  color: var(--c-text-soft);
  margin-bottom: 5px;
  line-height: 1.4;
}
.grow-progress {
  display: flex;
  align-items: center;
  gap: 6px;
}
.grow-progress-bar {
  flex: 1;
  height: 8px;
  background: #f0f0e0;
  border: 1.5px solid #2c3e50;
  overflow: hidden;
}
.grow-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c-warm) 0%, var(--c-warm-deep) 100%);
  transition: width .3s;
}
.grow-progress-text {
  font-size: 10px;
  font-weight: 800;
  color: var(--c-warm-deep);
  font-family: "Courier New", monospace;
}

.recent-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.recent-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  padding: 3px 7px;
  background: #fafcfe;
  border: 1.5px solid var(--c-border);
}
.recent-tag {
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border: 1.5px solid #2c3e50;
  flex-shrink: 0;
}
.recent-tag.skill { background: #e8f5e9; color: var(--c-green-deep); }
.recent-tag.exp { background: var(--c-sky-light); color: var(--c-sky-deep); }
.recent-text {
  flex: 1;
  color: var(--c-text);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============== 时间线 ============== */
.arcx-section {
  margin: 0 12px 10px;
  background: #fff;
  border: 3px solid #2c3e50;
  box-shadow: 3px 3px 0 rgba(44,62,80,0.15);
  padding: 10px 14px;
}
.arcx-section.timeline-section {
  background: linear-gradient(180deg, #fff 0%, #fafcfe 100%);
}
.arcx-section.whatsnew-section {
  background: linear-gradient(180deg, #fff 0%, #fff8ec 100%);
}
.grow-card { /* container only, .arcx-card already styles */ }
.recent-card { /* container only */ }
.arcx-section-title {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 12px;
  font-weight: 800;
  color: var(--c-text);
  margin-bottom: 10px;
  padding-bottom: 5px;
  border-bottom: 2px dashed var(--c-border);
}
.arcx-timeline {
  overflow-x: auto;
  padding: 4px 0 8px;
}
.timeline-track {
  display: flex;
  align-items: flex-start;
  gap: 0;
  min-width: 100%;
}
.timeline-node {
  flex: 1;
  min-width: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 4px;
}
.timeline-dot {
  width: 14px;
  height: 14px;
  background: var(--c-sky);
  border: 2.5px solid #2c3e50;
  margin-bottom: 8px;
  box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--c-sky);
  flex-shrink: 0;
}
.timeline-dot.latest {
  background: var(--c-warm-deep);
  box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--c-warm-deep);
  animation: arcx-pulse 1.6s ease-in-out infinite;
}
@keyframes arcx-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
.timeline-date {
  font-size: 10px;
  font-weight: 800;
  color: var(--c-sky-deep);
  background: var(--c-sky-light);
  border: 1.5px solid var(--c-sky-deep);
  padding: 1px 6px;
  margin-bottom: 4px;
  font-family: "Courier New", monospace;
}
.timeline-text {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-text);
  line-height: 1.4;
  max-width: 110px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.timeline-arrow {
  align-self: flex-start;
  margin-top: 0;
  padding-top: 2px;
  font-size: 14px;
  font-weight: 800;
  color: var(--c-text-soft);
  flex-shrink: 0;
  line-height: 1;
}

/* ============== 本版本新增 ============== */
.whatsnew-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.whatsnew-col {
  background: #fafcfe;
  border: 2px solid var(--c-border);
  padding: 8px 10px;
}
.whatsnew-col-title {
  font-size: 11px;
  font-weight: 800;
  color: var(--c-text);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1.5px dashed var(--c-border);
}
.whatsnew-items {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.whatsnew-item {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border: 1.5px solid #2c3e50;
  color: var(--c-text);
  background: #fff;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.whatsnew-item.skill { background: #e8f5e9; border-color: var(--c-green-deep); color: var(--c-green-deep); }
.whatsnew-item.exp { background: var(--c-sky-light); border-color: var(--c-sky-deep); color: var(--c-sky-deep); }
.whatsnew-item.goal { background: #fff8ec; border-color: var(--c-warm-deep); color: #8a5a00; }
.whatsnew-empty {
  font-size: 10px;
  color: var(--c-text-soft);
  text-align: center;
  padding: 6px 0;
}

/* ============== 底部签名 ============== */
.arcx-bottombar {
  background: linear-gradient(135deg, var(--c-cream) 0%, #ffe5b8 100%);
  border-top: 3px solid #2c3e50;
  padding: 10px 20px;
  text-align: center;
}
.arcx-bottom-quote {
  font-size: 12px;
  font-weight: 800;
  color: var(--c-text);
  letter-spacing: 1px;
}
.arcx-bottom-brand {
  font-size: 10px;
  color: var(--c-text-soft);
  margin-top: 3px;
  letter-spacing: 2px;
}

/* 历史存档 banner（保留旧样式名） */
.arc-history-banner {
  background: var(--c-sky-light);
  border: 2px solid var(--c-sky-deep);
  color: var(--c-text);
  font-size: 12px;
  font-weight: 700;
  padding: 10px 14px;
  margin-bottom: 12px;
  text-align: center;
}
.arc-list-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 2px solid var(--c-border);
  background: #fff;
  padding: 5px 10px;
  margin: 0 6px 6px 0;
}
.arc-list-name {
  font-size: 12px;
  font-weight: 700;
}
.arc-list-date {
  font-size: 10px;
  color: var(--c-text-soft);
}
.arc-list-btn {
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid #2c3e50;
  background: var(--c-bg);
  padding: 2px 8px;
  cursor: pointer;
}
.arc-list-btn:hover { background: var(--c-sky-light); }
.arc-list-btn.del { color: #c0392b; }
.arc-list-btn.del:hover { background: #fce4e4; }

/* 响应式：中等屏两栏 */
@media (max-width: 900px) {
  .arc-modal-box { max-width: 100%; }
  .arcx-main {
    grid-template-columns: 1fr 1fr;
  }
  .arcx-col-l { grid-column: 1 / -1; }
  .whatsnew-grid { grid-template-columns: 1fr; }
}

/* 响应式：手机单栏 */
@media (max-width: 600px) {
  .arc-modal-box { margin: 0; }
  .arcx-sheet { margin: 8px; }
  .arcx-main {
    grid-template-columns: 1fr;
    padding: 8px;
  }
  .arcx-titlebar { padding: 10px 12px; }
  .arcx-section { margin: 0 8px 8px; padding: 10px 12px; }
  .arcx-bottombar { padding: 10px 12px; }
  .char-portrait { aspect-ratio: 1 / 1.1; }
  .timeline-node { min-width: 80px; }
  .timeline-text { max-width: 90px; }
}

/* ============================================================
   角色生成页
   ============================================================ */
.chargen-wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px 16px 60px;
  text-align: center;
}
.chargen-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}
.chargen-subtitle {
  font-size: 13px;
  color: var(--c-text-soft);
  margin-bottom: 20px;
  line-height: 1.6;
}
.chargen-spinner-wrap {
  display: flex;
  justify-content: center;
  margin: 20px 0 24px;
}
.chargen-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--c-border);
  border-top-color: var(--c-sky);
  border-radius: 50%;
  animation: chargen-spin 0.8s linear infinite;
}
@keyframes chargen-spin {
  to { transform: rotate(360deg); }
}
.chargen-prompt-box {
  background: var(--c-card);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 16px;
  text-align: left;
  margin-bottom: 16px;
}
.chargen-prompt-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-text-soft);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.chargen-prompt-text {
  font-size: 12px;
  color: var(--c-text);
  line-height: 1.7;
  background: var(--c-bg);
  border: 2px solid var(--c-border);
  padding: 10px;
  word-break: break-word;
  max-height: 120px;
  overflow-y: auto;
  user-select: all;
}
.chargen-tip {
  font-size: 12px;
  color: var(--c-text-soft);
  line-height: 1.7;
  margin-bottom: 20px;
}
.chargen-waiting-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.chargen-waiting-actions .btn-pixel {
  width: 100%;
  max-width: 300px;
}
.chargen-result-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
}
.chargen-image-wrap {
  background: linear-gradient(180deg, #cfe7fb 0%, #f6e0a5 100%);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  display: inline-block;
  margin-bottom: 12px;
  max-width: 320px;
  width: 100%;
}
.chargen-portrait {
  display: block;
  width: 100%;
  height: auto;
  image-rendering: auto;
}
.chargen-result-label {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-warm-deep);
  margin-bottom: 20px;
}
.chargen-result-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-pixel.warm {
  background: var(--c-warm);
  color: #2c3e50;
}
.btn-pixel.warm:hover {
  background: #ffe08a;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 768px) {
  .top-nav { padding: 12px 14px; }
  .stage-pill { display: none; }
  .page-wrap { padding: 16px 12px 60px; }
  .profile-layout { grid-template-columns: 1fr; }
  .skill-grid { grid-template-columns: 1fr; }
  .action-bar { grid-template-columns: 1fr; }
  .form-card .row { grid-template-columns: 1fr; }
  .onboard-banner .big-title { font-size: 18px; }

  .skilltree-main { grid-template-columns: 1fr; }
  .tree-tabs { gap: 4px; }
  .tree-tab { padding: 5px 10px; font-size: 11px; }
}

/* ============================================================
   首页重做 (mobile-first)
   ============================================================ */
.home-wrap {
  max-width: 540px;
  padding: 16px 14px 90px;
}

/* 1. 人物卡 */
.char-card {
  background: var(--c-card);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 12px;
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 12px;
  position: relative;
}
.char-card-portrait {
  background: linear-gradient(180deg, #cfe7fb 0%, #f6e0a5 100%);
  border: 2px solid #2c3e50;
  height: 130px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.char-portrait-img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
}
.char-card-info { display: flex; flex-direction: column; min-width: 0; }
.char-name-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
}
.char-name {
  font-size: 16px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}
.char-edit-btn {
  font-size: 12px;
  border: 1.5px solid #2c3e50;
  background: var(--c-bg);
  padding: 1px 5px;
  line-height: 1;
}
.char-meta-line {
  font-size: 11px;
  color: var(--c-text-soft);
  margin-bottom: 2px;
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.char-meta-line .m-ico { font-size: 11px; }
.char-quote {
  margin-top: 6px;
  font-size: 11px;
  color: var(--c-text);
  line-height: 1.5;
  font-style: italic;
  background: var(--c-bg);
  border-left: 3px solid var(--c-warm);
  padding: 4px 8px;
}
.char-tags {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 6px;
}
.char-tags .tag-chip {
  background: var(--c-warm);
  border: 1.5px solid #2c3e50;
  padding: 2px 7px;
  font-size: 10px;
  font-weight: 600;
  color: var(--c-text);
}
.char-tags .tag-chip.muted {
  background: transparent;
  color: var(--c-text-soft);
  font-style: italic;
}

/* 2. 等级卡 */
.level-card {
  background: var(--c-card);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 10px 12px;
  margin-top: 12px;
}
.level-row {
  display: flex; align-items: center; gap: 8px;
}
.level-tag {
  background: var(--c-warm);
  border: 2px solid #2c3e50;
  font-size: 12px;
  font-weight: 800;
  padding: 3px 8px;
  white-space: nowrap;
}
.level-bar-track {
  flex: 1;
  height: 14px;
  background: var(--c-bg);
  border: 2px solid #2c3e50;
  position: relative;
  overflow: hidden;
}
.level-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c-green) 0%, var(--c-green-deep) 100%);
  transition: width 0.5s ease;
  position: relative;
}
.level-bar-fill::after {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg,
    rgba(255,255,255,0.18) 0, rgba(255,255,255,0.18) 4px,
    transparent 4px, transparent 8px);
}
.level-num {
  font-size: 11px;
  color: var(--c-text-soft);
  white-space: nowrap;
  min-width: 64px;
  text-align: right;
}
.level-hint {
  font-size: 11px;
  color: var(--c-text-soft);
  margin-top: 6px;
  text-align: center;
}

/* 3. 主要操作按钮 */
.hero-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}
.hero-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 14px 8px;
  border: var(--pixel-border);
  box-shadow: 4px 4px 0 rgba(44,62,80,0.25);
  transition: transform .12s, box-shadow .12s;
  cursor: pointer;
}
.hero-btn:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 rgba(44,62,80,0.25);
}
.hero-btn.sky   { background: var(--c-sky);    color: #fff; }
.hero-btn.warm  { background: var(--c-warm);   color: var(--c-text); }
.hero-btn-ico { font-size: 22px; }
.hero-btn-title { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
.hero-btn-sub { font-size: 10px; opacity: 0.85; }

/* 4. 日历 + 今日 */
.cal-row {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.cal-card,
.today-card {
  background: var(--c-card);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 10px;
  min-width: 0;
}
.cal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.cal-month-label {
  font-size: 12px; font-weight: 800;
  background: var(--c-cream);
  border: 1.5px solid #2c3e50;
  padding: 2px 7px;
}
.cal-today-btn {
  font-size: 10px;
  background: var(--c-sky);
  color: #fff;
  border: 1.5px solid #2c3e50;
  padding: 2px 8px;
  font-weight: 700;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  font-size: 10px;
  color: var(--c-text-soft);
  text-align: center;
  margin-bottom: 3px;
}
.cal-weekdays .weekend { color: var(--c-warm-deep); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-day {
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  border: 1.5px solid transparent;
  background: transparent;
  position: relative;
  color: var(--c-text);
  cursor: default;
}
.cal-day.placeholder { visibility: hidden; }
.cal-day.weekend { color: var(--c-warm-deep); }
.cal-day.today {
  background: var(--c-warm);
  border-color: #2c3e50;
  font-weight: 800;
}
.cal-day.has-event::after {
  content: "";
  width: 4px; height: 4px;
  background: var(--c-green-deep);
  border-radius: 50%;
  margin-top: 1px;
}
.cal-day.has-task::after {
  background: var(--c-sky-deep);
}
.cal-day.has-exp::after {
  background: var(--c-warm-deep);
}
.cal-day.selected {
  outline: 2px dashed var(--c-sky-deep);
}

/* 今日 */
.today-header {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700;
  border-bottom: 2px dashed var(--c-border);
  padding-bottom: 6px;
  margin-bottom: 6px;
}
.today-icon { font-size: 14px; }
.today-label { font-weight: 800; }
.today-date { color: var(--c-text-soft); font-size: 10px; font-weight: 500; margin-left: auto; }
.today-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.today-list li {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  line-height: 1.4;
}
.today-list li input[type="checkbox"] {
  margin: 0;
  flex-shrink: 0;
  accent-color: var(--c-green-deep);
}
.today-list li .tl-title { flex: 1; min-width: 0; }
.today-list li.done .tl-title { text-decoration: line-through; opacity: 0.55; }
.today-list .tl-skill {
  font-size: 9px;
  color: var(--c-text-soft);
  border: 1px solid var(--c-border);
  padding: 0 4px;
  border-radius: 2px;
  flex-shrink: 0;
}
.today-empty {
  font-size: 11px;
  color: var(--c-text-soft);
  text-align: center;
  padding: 6px 0;
}
.today-footer {
  margin-top: 6px;
  font-size: 10px;
  color: var(--c-text-soft);
  text-align: center;
  background: var(--c-cream);
  padding: 4px 6px;
  border: 1px dashed var(--c-border);
  line-height: 1.5;
}

/* 5+6. 双栏卡片 */
.duo-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.duo-card {
  background: var(--c-card);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 10px;
  min-width: 0;
}
.duo-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px dashed var(--c-border);
  padding-bottom: 5px;
  margin-bottom: 6px;
}
.duo-card-title {
  font-size: 12px;
  font-weight: 800;
  display: flex; align-items: center; gap: 4px;
}
.duo-card-title .d-ico { font-size: 12px; }
.duo-more {
  font-size: 10px;
  color: var(--c-text-soft);
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
}
.duo-list {
  list-style: none;
  padding: 0; margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.duo-list li {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  line-height: 1.4;
}
.duo-list .duo-ico {
  font-size: 14px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.duo-list .duo-body {
  flex: 1; min-width: 0;
}
.duo-list .duo-title {
  font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.duo-list .duo-sub {
  font-size: 10px;
  color: var(--c-text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.duo-list .duo-date {
  font-size: 10px;
  color: var(--c-text-soft);
  flex-shrink: 0;
}
.duo-list .mini-progress {
  display: flex; align-items: center; gap: 4px;
}
.duo-list .mini-bar {
  flex: 1;
  height: 4px;
  background: var(--c-bg);
  border: 1px solid #2c3e50;
  min-width: 30px;
}
.duo-list .mini-bar-fill {
  height: 100%;
  background: var(--c-green-deep);
}
.duo-list .mini-pct {
  font-size: 10px;
  font-weight: 700;
  color: var(--c-green-deep);
  flex-shrink: 0;
  min-width: 26px;
  text-align: right;
}
.duo-empty {
  font-size: 11px;
  color: var(--c-text-soft);
  text-align: center;
  padding: 8px 0;
  font-style: italic;
}

/* 7. 答案之书 */
.answer-card {
  background: linear-gradient(135deg, #f6e8ff 0%, #e8f3ff 100%);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 12px;
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.answer-icon { font-size: 24px; }
.answer-body { flex: 1; min-width: 0; }
.answer-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--c-purple);
  margin-bottom: 3px;
}
.answer-text {
  font-size: 12px;
  line-height: 1.5;
  color: var(--c-text);
  font-style: italic;
}
.answer-refresh {
  font-size: 10px;
  background: var(--c-card);
  border: 1.5px solid #2c3e50;
  padding: 3px 7px;
  flex-shrink: 0;
  cursor: pointer;
}

/* 8. 底部导航 */
.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--c-card);
  border-top: 3px solid #2c3e50;
  box-shadow: 0 -4px 0 rgba(0,0,0,0.06);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0));
  z-index: 200;
}
.bn-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  background: transparent;
  border: none;
  color: var(--c-text-soft);
  font-size: 10px;
  padding: 4px 0;
  cursor: pointer;
}
.bn-tab .bn-ico {
  font-size: 18px;
  filter: grayscale(0.6);
  opacity: 0.65;
  transition: filter .2s, opacity .2s, transform .2s;
}
.bn-tab.active {
  color: var(--c-text);
  font-weight: 700;
}
.bn-tab.active .bn-ico {
  filter: none;
  opacity: 1;
  transform: scale(1.1);
}
.bn-tab:active .bn-ico { transform: scale(0.9); }

.home-spacer { height: 8px; }

/* 手机端微调 */
@media (max-width: 380px) {
  .char-card { grid-template-columns: 90px 1fr; padding: 10px; }
  .char-card-portrait { height: 110px; }
  .cal-row { grid-template-columns: 1fr; }
  .duo-row { grid-template-columns: 1fr; }
  .hero-btn-ico { font-size: 18px; }
  .hero-btn-title { font-size: 12px; }
}

/* 今日自建任务输入 */
.today-add-row {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1.5px dashed var(--c-border);
}
.today-add-row input {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  padding: 5px 6px;
  border: 1.5px solid #2c3e50;
  background: var(--c-bg);
  color: var(--c-text);
  outline: none;
}
.today-add-row input:focus {
  background: var(--c-card);
  border-color: var(--c-sky);
}
.today-add-row input::placeholder {
  color: var(--c-text-soft);
  font-size: 10px;
}
.today-add-btn {
  background: var(--c-sky);
  color: #fff;
  border: 1.5px solid #2c3e50;
  font-size: 14px;
  font-weight: 800;
  padding: 0 10px;
  cursor: pointer;
  line-height: 1;
}
.today-add-btn:active { transform: scale(0.92); }

/* ============================================================
   角色选择页 (preset 背景+角色)
   ============================================================ */
.chargen-step {
  text-align: left;
  margin-top: 16px;
  background: var(--c-card);
  border: 2px dashed var(--c-border);
  padding: 10px;
}
.chargen-step-label {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--c-text);
}
.chargen-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.pick-tile {
  aspect-ratio: 1 / 1;
  border: 2px solid var(--c-border);
  background: var(--c-bg);
  padding: 0;
  cursor: pointer;
  overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.pick-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pick-tile:hover {
  border-color: var(--c-sky);
  transform: scale(1.02);
}
.pick-tile.selected {
  border-color: var(--c-warm-deep);
  border-width: 3px;
  box-shadow: 0 0 0 2px var(--c-warm);
}
.chargen-preview-card {
  margin-top: 16px;
  background: var(--c-card);
  border: var(--pixel-border);
  box-shadow: var(--pixel-shadow);
  padding: 10px;
}
.chargen-preview-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-text-soft);
  margin-bottom: 6px;
}
.chargen-preview-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--c-bg);
  border: 1.5px solid var(--c-border);
  overflow: hidden;
}
.chargen-preview-bg,
.chargen-preview-char {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.chargen-preview-char {
  z-index: 2;
  object-fit: contain;
  object-position: center bottom;
  height: 90%;
  top: auto;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
}
.chargen-preview-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--c-text-soft);
  z-index: 3;
  pointer-events: none;
}

/* ============================================================
   图标素材（来自 download.png）
   ============================================================ */
.brand-logo-img {
  width: 38px;
  height: 38px;
  object-fit: contain;
  image-rendering: pixelated;
}
.icon-reset-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.ico-16 {
  width: 14px;
  height: 14px;
  object-fit: contain;
  image-rendering: pixelated;
  vertical-align: -2px;
}
.hero-btn-ico {
  width: 26px;
  height: 26px;
  object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.18));
}
.today-icon-img {
  width: 18px;
  height: 18px;
  object-fit: contain;
  image-rendering: pixelated;
  margin-right: 2px;
}
.d-ico-img {
  width: 14px;
  height: 14px;
  object-fit: contain;
  image-rendering: pixelated;
  vertical-align: -2px;
  margin-right: 3px;
}
/* 底部导航：换成图片后的尺寸 */
.bn-tab .bn-ico {
  width: 26px;
  height: 26px;
  object-fit: contain;
  image-rendering: pixelated;
  transition: transform .2s, filter .2s;
}

/* 醒目的「重新开启」按钮 */
.reset-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--c-warm);
  color: var(--c-text);
  border: 2.5px solid #2c3e50;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.25);
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  margin-left: 8px;
  transition: transform .1s, box-shadow .1s;
}
.reset-btn:hover {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 rgba(0,0,0,0.25);
  background: #ffe08a;
}
.reset-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 rgba(0,0,0,0.25);
}

/* ============================================================
   01 启动页
   ============================================================ */
.page-splash {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
  overflow-x: hidden;
}
.splash-bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 0;
}
.splash-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 24px 16px 40px;
  width: 100%;
  max-width: 480px;
}
.splash-logo {
  width: 92%;
  max-width: 420px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.18));
  animation: splash-logo-in 0.8s ease;
}
@keyframes splash-logo-in {
  from { opacity: 0; transform: translateY(-20px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.splash-cta {
  position: relative;
  width: 86%;
  max-width: 400px;
  aspect-ratio: 1080 / 192; /* 与 cta-button.png 一致 */
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: transform .15s, filter .15s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  animation: splash-cta-in 0.9s 0.2s ease backwards;
}
@keyframes splash-cta-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.splash-cta:hover { transform: scale(1.03); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3)); }
.splash-cta:active { transform: scale(0.98); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
.splash-cta-bg {
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}
.splash-cta-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(13px, 3.8vw, 17px);
  font-weight: 800;
  color: #2c3e50;
  letter-spacing: 0.5px;
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
}
.splash-hint {
  font-size: 11px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  letter-spacing: 0.3px;
  text-align: center;
  margin-top: 4px;
  opacity: 0.92;
}

/* ============================================================
   02 建立档案（带美术背景 + 表单框）
   ============================================================ */
.page-onboard {
  position: relative;
  min-height: 100vh;
  padding: 12px 16px 60px;
  overflow-x: hidden;
}
.onboard-bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
}

/* 步骤指示器 */
.step-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 8px auto 14px;
  font-size: 12px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  font-weight: 700;
}
.step-item {
  display: flex;
  align-items: center;
  gap: 5px;
  opacity: 0.7;
}
.step-item.active {
  opacity: 1;
}
.step-item .step-num {
  width: 22px;
  height: 22px;
  background: rgba(255,255,255,0.3);
  border: 1.5px solid #fff;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
}
.step-item.active .step-num {
  background: #ffd86b;
  border-color: #2c3e50;
  color: #2c3e50;
}
.step-line {
  width: 22px;
  height: 2px;
  background: rgba(255,255,255,0.5);
  border-radius: 1px;
}

/* 标题 */
.onboard-hero {
  text-align: center;
  margin-bottom: 14px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.onboard-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.onboard-sub {
  font-size: 12px;
  line-height: 1.7;
  opacity: 0.95;
}

/* 表单框 */
.form-frame-wrap {
  position: relative;
  max-width: 460px;
  margin: 0 auto;
}
.form-frame-bg {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
}
.form-card {
  position: absolute;
  top: 8%;
  left: 5%;
  right: 5%;
  bottom: 6%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4% 4% 0;
  overflow-y: auto;
}
.form-card .row {
  display: flex;
  flex-direction: column;
}
.form-card .field {
  margin: 0;
}
.form-card label {
  font-size: 12px;
  font-weight: 700;
  color: #2c3e50;
  margin-bottom: 3px;
  display: block;
}
.form-card label .hint {
  font-weight: 500;
  color: #7a8a9b;
  margin-left: 6px;
  font-size: 11px;
}
.form-card input,
.form-card select,
.form-card textarea {
  width: 100%;
  background: #fff;
  border: 1.5px solid #c8d4e3;
  padding: 6px 10px;
  font-size: 12px;
  color: #2c3e50;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  font-family: inherit;
}
.form-card input:focus,
.form-card select:focus,
.form-card textarea:focus {
  border-color: #5fb4f2;
  box-shadow: 0 0 0 2px rgba(95,180,242,0.18);
}
.form-card input::placeholder,
.form-card textarea::placeholder {
  color: #b0bccd;
  font-size: 11px;
}
.form-card select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%237a8a9b'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 26px;
}

/* CTA 区 */
.onboard-cta-row {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.cta-img-btn {
  position: relative;
  width: 86%;
  max-width: 400px;
  aspect-ratio: 1080 / 192;
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: transform .15s, filter .15s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
}
.cta-img-btn:hover {
  transform: scale(1.03);
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
}
.cta-img-btn:active {
  transform: scale(0.98);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}
.cta-img-bg {
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}
.cta-img-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(13px, 3.6vw, 16px);
  font-weight: 800;
  color: #2c3e50;
  letter-spacing: 0.5px;
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
}
.cta-img-btn.secondary {
  aspect-ratio: auto;
  width: auto;
  background: rgba(255,255,255,0.85);
  border: 2px dashed #2c3e50;
  padding: 8px 16px;
  filter: none;
  font-size: 12px;
}
.cta-img-text-secondary {
  font-size: 12px;
  font-weight: 700;
  color: #2c3e50;
}
.cta-img-btn.secondary:hover { background: rgba(255,255,255,0.95); }

.onboard-footnote {
  text-align: center;
  font-size: 11px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  margin-top: 12px;
  opacity: 0.9;
}

/* splash 作者形象图（放在 CTA 下方，更大） */
.splash-author-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}
.splash-author {
  width: clamp(180px, 46vw, 260px);
  height: auto;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.3));
  animation: splash-author-in 1s 0.4s ease backwards,
             splash-credit-bob 3.2s 1.4s ease-in-out infinite;
}
@keyframes splash-author-in {
  from { opacity: 0; transform: translateY(20px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes splash-credit-bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-4px) rotate(2deg); }
}
.splash-credit-text {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: "PingFang SC", -apple-system, sans-serif;
  background: rgba(44,62,80,0.55);
  padding: 4px 12px;
  border-radius: 14px;
}
.splash-credit-by {
  font-size: 10px;
  color: #fff;
  letter-spacing: 1.5px;
  opacity: 0.85;
  line-height: 1;
}
.splash-credit-name {
  font-size: 14px;
  font-weight: 800;
  color: #ffd86b;
  text-shadow: 0 1px 0 #2c3e50;
  letter-spacing: 1px;
  line-height: 1.4;
}
@media (max-width: 380px) {
  .splash-author { width: 170px; }
  .splash-credit-name { font-size: 13px; }
}

/* ============================================================
   04 人物面板 v2（美术素材版）
   ============================================================ */

/* 1. 人物卡：card-bg.png (1536x1024, RGBA) */
.char-card-v2 {
  position: relative;
  width: 100%;
  margin-top: 6px;
  filter: drop-shadow(0 4px 10px rgba(44,62,80,0.18));
}
.char-card-bg {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}
.char-card-portrait-wrap {
  position: absolute;
  left: 7%;
  top: 6%;
  width: 40%;
  height: 66%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}
.char-portrait-img-v2 {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));
}
.char-card-info-v2 {
  position: absolute;
  left: 51%;
  right: 6%;
  top: 7%;
  bottom: 24%;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.char-card-info-v2 .char-name-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 3px;
}
.char-card-info-v2 .char-name {
  font-size: 17px;
  font-weight: 800;
  color: #2c3e50;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.char-card-info-v2 .char-edit-btn {
  font-size: 11px;
  border: 1.5px solid #2c3e50;
  background: rgba(255,255,255,0.8);
  padding: 1px 5px;
  line-height: 1.2;
  cursor: pointer;
  flex-shrink: 0;
}
.char-card-info-v2 .char-meta-line {
  font-size: 11px;
  color: #5a6b7d;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.char-card-info-v2 .char-quote {
  margin-top: 5px;
  font-size: 11px;
  color: #2c3e50;
  line-height: 1.45;
  font-style: italic;
  background: rgba(255,255,255,0.65);
  border-left: 3px solid #ffd86b;
  padding: 3px 7px;
}
.char-card-info-v2 .char-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.char-card-info-v2 .char-tags .tag-chip {
  background: rgba(255,216,107,0.9);
  border: 1.5px solid #2c3e50;
  padding: 1px 6px;
  font-size: 10px;
  font-weight: 600;
  color: #2c3e50;
}
.char-card-info-v2 .char-tags .tag-chip.muted {
  background: rgba(255,255,255,0.7);
  color: #7a8a9b;
  font-style: italic;
}

/* 2. 等级条：frame-thin-cream-2 拉伸作底 */
.level-card-v2 {
  position: relative;
  margin-top: 14px;
  filter: drop-shadow(0 3px 6px rgba(44,62,80,0.15));
}
.level-frame-bg {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}
.level-frame-inner {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
}
.level-frame-inner .level-tag {
  background: #ffd86b;
  border: 2px solid #2c3e50;
  font-size: 12px;
  font-weight: 800;
  padding: 2px 8px;
  white-space: nowrap;
  color: #2c3e50;
}
.level-frame-inner .level-bar-track {
  flex: 1;
  height: 13px;
  background: rgba(240,246,251,0.9);
  border: 2px solid #2c3e50;
  position: relative;
  overflow: hidden;
}
.level-frame-inner .level-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #7cd992 0%, #4abf6c 100%);
  transition: width 0.5s ease;
}
.level-frame-inner .level-bar-fill::after {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg,
    rgba(255,255,255,0.18) 0, rgba(255,255,255,0.18) 4px,
    transparent 4px, transparent 8px);
}
.level-frame-inner .level-num {
  font-size: 11px;
  color: #5a6b7d;
  white-space: nowrap;
  min-width: 58px;
  text-align: right;
  font-weight: 700;
}

/* 3. 主操作按钮（btn-record / btn-learn 图片） */
.hero-actions-v2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.hero-btn-v2 {
  position: relative;
  width: 100%;
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: transform .15s, filter .15s;
  filter: drop-shadow(0 4px 8px rgba(44,62,80,0.25));
}
.hero-btn-v2:hover {
  transform: scale(1.02) translateY(-1px);
  filter: drop-shadow(0 6px 10px rgba(44,62,80,0.3));
}
.hero-btn-v2:active {
  transform: scale(0.98);
  filter: drop-shadow(0 2px 4px rgba(44,62,80,0.2));
}
.hero-btn-bg {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}

/* 7. 答案之书 v2：cat-sticker + 奶油底 */
.answer-card-v2 {
  position: relative;
  margin-top: 18px;
  background: linear-gradient(135deg, #fff4de 0%, #ffeef0 55%, #eef5ff 100%);
  border: 3px solid #2c3e50;
  box-shadow: 3px 3px 0 rgba(44,62,80,0.18);
  padding: 14px 14px 14px 84px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  min-height: 76px;
  overflow: visible;
}
.answer-cat-sticker {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%) rotate(-6deg);
  width: 62px;
  height: auto;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
  animation: splash-credit-bob 3.2s ease-in-out infinite;
  pointer-events: none;
}
.answer-text-v2 {
  flex: 1;
  min-width: 0;
}
.answer-title-v2 {
  font-size: 12px;
  font-weight: 800;
  color: #b07a2a;
  margin-bottom: 3px;
}
.answer-body-v2 {
  font-size: 13px;
  line-height: 1.55;
  color: #2c3e50;
  font-style: italic;
  transition: opacity .12s;
}
.answer-refresh-v2 {
  font-size: 11px;
  font-weight: 700;
  background: #fff;
  border: 2px solid #2c3e50;
  padding: 5px 10px;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow: 2px 2px 0 rgba(44,62,80,0.2);
  transition: transform .1s, box-shadow .1s;
}
.answer-refresh-v2:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 rgba(44,62,80,0.2);
}

@media (max-width: 380px) {
  .char-card-info-v2 .char-name { font-size: 15px; }
  .answer-card-v2 { padding-left: 72px; }
  .answer-cat-sticker { width: 52px; }
}

.home-wrap::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.62);
  pointer-events: none;
  z-index: 0;
}
/* 让 home-wrap 内部内容浮在蒙层之上 */
.home-wrap > * { position: relative; z-index: 1; }

/* top-nav 在背景上也保持可见：加自己的不透明底色 */
.top-nav {
  background: linear-gradient(180deg, rgba(109,195,255,0.96) 0%, rgba(74,143,216,0.96) 100%);
  position: sticky;
  z-index: 100;
}

/* 人物卡、等级条、按钮：更强阴影 + 微透明白底，模拟"浮动" */
.char-card-v2 {
  filter: drop-shadow(0 8px 16px rgba(44,62,80,0.28));
}
.level-card-v2 {
  filter: drop-shadow(0 5px 10px rgba(44,62,80,0.22));
}
.level-frame-inner .level-tag {
  background: #ffd86b;
}
.level-frame-inner .level-bar-track {
  background: rgba(240,246,251,0.95);
}

/* 主操作按钮：更大阴影 + 微微上抬的悬浮感 */
.hero-btn-v2 {
  filter: drop-shadow(0 6px 10px rgba(44,62,80,0.35));
}
.hero-btn-v2:hover {
  transform: scale(1.02) translateY(-3px);
  filter: drop-shadow(0 10px 16px rgba(44,62,80,0.4));
}

/* 日历 / 今日 / duo 卡：更深阴影 + 白色卡片更明显 */
.cal-card,
.today-card,
.duo-card {
  background: rgba(255,253,246,0.96);
  border: 3px solid #2c3e50;
  box-shadow: 0 5px 10px rgba(44,62,80,0.22);
}

/* 答案之书：更明显浮动 */
.answer-card-v2 {
  box-shadow: 0 6px 12px rgba(44,62,80,0.25);
}

/* ============================================================
   页眉 v2：大 logo + 年级切换按钮
   ============================================================ */
.top-nav {
  padding: 8px 14px;
}
.brand-logo-v2 {
  height: 54px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 年级 pill（可点击） */
.grade-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #fff;
  border: 2.5px solid #2c3e50;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 800;
  color: #2c3e50;
  cursor: pointer;
  transition: transform .1s, box-shadow .1s, background .15s;
}
.grade-pill:hover {
  background: #fff8e6;
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 rgba(0,0,0,0.2);
}
.grade-pill:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 rgba(0,0,0,0.2);
}
.grade-pill .grade-caret {
  font-size: 10px;
  color: #7a8a9b;
  margin-left: 1px;
}

/* 年级选择弹窗 */
.grade-picker-box {
  background: #fff;
  border: 3px solid #2c3e50;
  box-shadow: 6px 6px 0 rgba(44,62,80,0.25);
  padding: 18px 16px 14px;
  width: min(320px, calc(100vw - 48px));
  text-align: center;
  animation: gradePickerIn .18s ease;
}
@keyframes gradePickerIn {
  from { opacity: 0; transform: translateY(10px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.grade-picker-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
  color: #2c3e50;
}
.grade-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.grade-opt {
  background: #f0f6fb;
  border: 2px solid #2c3e50;
  padding: 9px 0;
  font-size: 13px;
  font-weight: 700;
  color: #2c3e50;
  cursor: pointer;
  transition: background .12s, transform .1s;
  box-shadow: 2px 2px 0 rgba(44,62,80,0.15);
}
.grade-opt:hover {
  background: #fff3cd;
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 rgba(44,62,80,0.15);
}
.grade-opt.current {
  background: #ffd86b;
  box-shadow: inset 0 0 0 2px #2c3e50;
}

/* 我的技能等级 */
.skill-levels-card {
  margin-top: 14px;
  background: rgba(255,253,246,0.96);
  border: 3px solid #2c3e50;
  box-shadow: 0 5px 10px rgba(44,62,80,0.22);
  padding: 10px 12px 12px;
  position: relative;
  overflow: hidden;
}

.skill-levels-header {
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 2px dashed var(--c-border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.slh-ico {
  width: 20px; height: 20px;
  object-fit: contain;
}
.slh-title {
  font-size: 13px;
  font-weight: 800;
  color: #2c3e50;
}
.slh-hint {
  font-size: 10px;
  color: #7a8a9b;
  margin-left: auto;
}
.skill-levels-list {
  list-style: none;
  padding: 0; margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.skill-levels-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff8e6;
  border: 1.5px solid #c9a455;
  padding: 5px 8px;
}
.sl-ico {
  width: 26px;
  height: 26px;
  object-fit: contain;
  flex-shrink: 0;
}
.sl-name {
  font-size: 12px;
  font-weight: 700;
  color: #2c3e50;
  min-width: 48px;
  flex-shrink: 0;
}
.sl-bar {
  flex: 1;
  height: 6px;
  background: #fdf4d8;
  border: 1.5px solid #2c3e50;
  min-width: 40px;
  overflow: hidden;
}
.sl-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffd86b 0%, #f5a623 100%);
}
.sl-lv {
  font-size: 12px;
  font-weight: 800;
  color: #c97a14;
  background: #fff;
  border: 1.5px solid #c97a14;
  padding: 1px 6px;
  min-width: 38px;
  text-align: center;
  flex-shrink: 0;
}
.sl-empty {
  font-size: 11px;
  color: #7a8a9b;
  text-align: center;
  padding: 8px 0;
  font-style: italic;
}

/* 存档页：分类技能等级 */
.skill-section .arcx-cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 12px 14px 14px;
}
.arcx-cat-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: #fff8e6;
  border: 2px solid #c9a455;
  padding: 8px 4px;
  text-align: center;
}
.arcx-cat-ico {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.arcx-cat-name {
  font-size: 11px;
  font-weight: 700;
  color: #2c3e50;
  line-height: 1.1;
}
.arcx-cat-lv {
  font-size: 10px;
  font-weight: 800;
  color: #c97a14;
  background: #fff;
  border: 1.5px solid #c97a14;
  padding: 0 5px;
}
@media (max-width: 380px) {
  .skill-section .arcx-cat-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ============================================================
   存档页 v3 (使用 arch 资源)
   ============================================================ */
.arcx-v3-hero {
  position: relative;
  background: linear-gradient(180deg, #f0f6fb 0%, #e0eaf2 100%);
  border: 3px solid #2c3e50;
  box-shadow: 4px 4px 0 rgba(44,62,80,0.18);
  padding: 16px 16px 14px;
  margin-bottom: 14px;
  overflow: hidden;
}
.arcx-v3-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 15% 60%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,0.4) 0 4px, transparent 5px);
  pointer-events: none;
}
.arcx-hero-logo {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 6px;
}
.arcx-logo-text {
  font-size: 26px;
  font-weight: 800;
  color: #2c3e50;
  text-shadow: 0 2px 0 rgba(255,255,255,0.6), 2px 2px 0 rgba(44,62,80,0.18);
  letter-spacing: 1px;
}
.arcx-logo-accent {
  color: #5fb4f2;
}
.arcx-logo-tag {
  font-size: 11px;
  color: #5a6b7d;
  font-weight: 600;
}
.arcx-hero-tags {
  display: flex;
  justify-content: center;
  gap: 5px;
  font-size: 11px;
  color: #5a6b7d;
  margin-bottom: 10px;
}
.arcx-hero-actions {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 8px;
}
.arcx-hero-btn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  background: #fff;
  border: 1.5px solid #2c3e50;
  box-shadow: 2px 2px 0 rgba(44,62,80,0.18);
  color: #2c3e50;
}
.arcx-hero-save {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  align-items: baseline;
  font-size: 10px;
  color: #5a6b7d;
  font-weight: 600;
}
.arcx-save-ver {
  background: #2c3e50;
  color: #fff;
  padding: 1px 6px;
}

/* PLAYER card */
.arcx-player {
  position: relative;
  width: 100%;
  margin-bottom: 14px;
  filter: drop-shadow(4px 4px 0 rgba(44,62,80,0.18));
}
.arcx-player-bg {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}
.arcx-player-tag {
  position: absolute;
  top: 6%;
  left: 6%;
  background: #2c3e50;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  letter-spacing: 1px;
}
.arcx-player-portrait {
  position: absolute;
  left: 6%;
  top: 14%;
  width: 38%;
  height: 65%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}
.arcx-player-portrait img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
}
.arcx-player-info {
  position: absolute;
  left: 48%;
  right: 6%;
  top: 12%;
  bottom: 18%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
}
.apinfo-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  border-bottom: 1.5px dashed rgba(44,62,80,0.18);
  padding-bottom: 3px;
}
.apinfo-k {
  font-size: 10px;
  color: #7a8a9b;
  font-weight: 600;
  width: 48px;
  flex-shrink: 0;
}
.apinfo-v {
  font-size: 14px;
  color: #2c3e50;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 关键词 + 一句话 */
.arcx-tags-block,
.arcx-quote-block {
  background: rgba(255,253,246,0.95);
  border: 2.5px solid #2c3e50;
  box-shadow: 3px 3px 0 rgba(44,62,80,0.15);
  padding: 8px 12px;
  margin-bottom: 12px;
}
.arcx-card-title-row {
  font-size: 12px;
  font-weight: 800;
  color: #2c3e50;
  margin-bottom: 6px;
}
.arcx-tag-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.arcx-chip {
  background: #fff8e6;
  border: 1.5px solid #c9a455;
  color: #2c3e50;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
}
.arcx-quote-text {
  font-size: 13px;
  font-style: italic;
  color: #5a6b7d;
  line-height: 1.5;
}

/* 通用 section（用 frame 背景） */
.arcx-section {
  position: relative;
  margin-bottom: 14px;
  overflow: visible;
}
.arcx-section-bg {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}
.arcx-section-title {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px 4px;
  font-size: 13px;
  font-weight: 800;
  color: #2c3e50;
  z-index: 2;
}
.arcx-tit-icon { font-size: 14px; }
.arcx-tit-text { letter-spacing: 0.5px; }
.arcx-tit-count,
.arcx-tit-badge {
  margin-left: auto;
  background: #ffd86b;
  border: 1.5px solid #2c3e50;
  font-size: 11px;
  font-weight: 800;
  padding: 1px 7px;
}
.arcx-tit-sub {
  font-size: 10px;
  color: #7a8a9b;
  font-weight: 500;
  margin-left: 4px;
}
.arcx-empty {
  font-size: 11px;
  color: #7a8a9b;
  text-align: center;
  padding: 10px 16px;
  font-style: italic;
  position: relative;
  z-index: 2;
}

/* 4. 当前能力 */
.arcx-ability-rows {
  position: relative;
  padding: 6px 30px 18px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.arcx-ab-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.arcx-ab-dot {
  width: 10px; height: 10px;
  background: #5fb4f2;
  border: 1.5px solid #2c3e50;
  flex-shrink: 0;
}
.arcx-ab-name {
  font-size: 12px;
  font-weight: 700;
  color: #2c3e50;
  min-width: 80px;
  flex-shrink: 0;
}
.arcx-ab-bar {
  flex: 1;
  height: 8px;
  background: #fdf4d8;
  border: 1.5px solid #2c3e50;
  min-width: 40px;
  overflow: hidden;
}
.arcx-ab-fill {
  height: 100%;
  transition: width .4s;
}
.arcx-ab-lv {
  font-size: 11px;
  font-weight: 800;
  background: #fff;
  border: 1.5px solid;
  padding: 1px 7px;
  min-width: 40px;
  text-align: center;
  flex-shrink: 0;
}

/* 5. 学习进度 */
.arcx-stage-rows {
  position: relative;
  padding: 6px 24px 18px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.arcx-stage-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.arcx-stage-tag {
  background: #ff7a45;

/* 弹窗 grid 布局：body 不被 footer 挤压 */
.arc-modal-box {

.arc-modal-box .arc-modal-body {

  min-height: 0;

}
.arc-modal-box .modal-footer {
  grid-row: 3;
  flex-shrink: 0;
  gap: 6px !important;
  padding: 8px 12px !important;
}
.arc-modal-box .modal-footer #archiveList {
  max-height: 96px;
  overflow-y: auto;
}

  z-index: 3;
}
.arcx-stage-deco.arcx-deco-tl { top: -8px; left: -6px; }

.arcx-deco-corner-tr { top: -8px; right: -4px; transform: rotate(8deg); }
.arcx-deco-corner-bl { bottom: -8px; left: -4px; transform: rotate(8deg); }
.arcx-deco-corner-br { bottom: -8px; right: -4px; transform: rotate(-8deg); }

.arcx-section .arcx-deco-corner-br {

.arcx-section .arcx-deco-corner-bl { bottom: -10px; left: -4px; }

.quick-actions {

  gap: 8px;
  margin-top: 10px;
}
.qa-btn {
  display: flex;

  align-items: center;
  gap: 3px;
  padding: 10px 4px 8px;
