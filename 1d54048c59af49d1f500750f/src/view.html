
<div id="app">
  <header>
    <div class="header-top">
      <div class="logo">🍳 小灶<small>家常菜谱 · 今天吃什么</small></div>
      <div id="randBtn" style="font-size:22px">🎲</div>
    </div>
    <div class="search">
      <span>🔍</span>
      <input id="q" placeholder="搜索菜名、食材，如「番茄」「鸡」">
    </div>
  </header>

  <main id="main"></main>

  <nav>
    <div class="on" data-tab="home"><div class="ic">🏠</div>首页</div>
    <div data-tab="cat"><div class="ic">🍲</div>分类</div>
    <div data-tab="fav"><div class="ic">❤️</div>收藏 <span id="favN" style="color:var(--brand); font-weight:700">0</span></div>
    <div data-tab="menu"><div class="ic">📝</div>菜单</div>
  </nav>

  <!-- 详情 -->
  <div class="sheet" id="sheet">
    <div class="sh-head" id="shHead">
      <div class="back" id="backBtn">‹</div>
      <span id="shEmo">🍜</span>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>

  <!-- 计时器 -->
  <div class="timer-pop" id="timerPop">
    <div class="tbox">
      <div class="tm" id="tmv">05:00</div>
      <div class="lb" id="tml">烹饪计时中...</div>
      <button class="pause" id="tPause">暂停</button>
      <button class="stop" id="tStop">结束</button>
    </div>
  </div>
</div>
