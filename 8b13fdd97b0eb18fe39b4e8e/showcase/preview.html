/* ============================================================================
 * 程序员计算器 · 网页版样式
 * 桌面（≥900px）双栏：左为主操作区，右为键盘；窄屏单栏，键盘变为底部抽屉，
 * 与 App 的交互模型保持一致（点数值行 → 出键盘）。
 * ========================================================================== */

:root {
  --bg: #eef1f8;
  --panel: #ffffff;
  --ink: #1b1f2a;
  --ink-2: #3c4459;
  --muted: #9aa1b2;
  --muted-2: #a8aebc;
  --line: #eef0f6;
  --primary: #2b5cff;
  --primary-soft: #eaf0ff;
  --key: #f4f6fb;
  --key-fn: #e9edf8;
  --key-op: #e6ecff;
  --warn-bg: #fff5e9;
  --warn-ink: #b9761d;
  --radius: 18px;
  --mono: "Noto Sans Mono", Menlo, Consolas, "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  /* 数值字号分档（按最长一行反推，长数值自动降档，保证不溢出） */
  --f-lg: 30px;
  --f-md: 25px;
  --f-sm: 21px;
  --f-xs: 17.5px;
  --f-xxs: 15px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-image: linear-gradient(180deg, #e9edf7 0%, #f4f6fb 340px, #f4f6fb 100%);
  min-height: 100vh;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 26px 20px 60px;
}

/* ============================== 顶栏 ============================== */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.logo {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #2b5cff 0%, #6f92ff 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.5px;
  box-shadow: 0 8px 20px rgba(43, 92, 255, 0.3);
}

.brand h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.2px;
}

.brand .sub {
  margin: 2px 0 0;
  font-size: 12.5px;
  color: var(--muted);
}

.acts { display: flex; gap: 8px; flex: none; }

.act {
  appearance: none;
  border: 1px solid #dfe4f2;
  background: #fff;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
}

.act:hover { border-color: var(--primary); color: var(--primary); }
.act:active { box-shadow: inset 0 1px 3px rgba(24, 36, 72, 0.12); }

.act svg { display: block; }

/* ============================== 栅格 ============================== */

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 344px;
  gap: 18px;
  align-items: start;
}

.col-main { min-width: 0; }
.col-kb { position: sticky; top: 20px; min-width: 0; }

/* ============================== 面板 ============================== */

.panel {
  background: var(--panel);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 18px rgba(24, 36, 72, 0.05);
}

.panel:last-child { margin-bottom: 0; }

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.panel-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink-2);
  letter-spacing: 0.6px;
}

.panel-meta {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  text-align: right;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================== 位宽 chips ============================== */

.chips { display: flex; gap: 8px; margin-bottom: 8px; }
.chips:last-of-type { margin-bottom: 0; }

.chip {
  flex: 1;
  min-width: 0;
  padding: 9px 0;
  text-align: center;
  border-radius: 11px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: #5b6377;
  background: var(--key);
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}

.chip:hover { background: #e9edf8; }

.chip-on {
  color: #fff;
  background: var(--primary);
  box-shadow: 0 6px 16px rgba(43, 92, 255, 0.28);
}

.chip-on:hover { background: #2450e6; }

.range {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed #e7eaf4;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  word-break: break-all;
}

/* ============================== 数值视图 ============================== */

.views { padding: 8px 12px 12px; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 10px;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.12s;
}

.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: #f7f9ff; }
.row:hover + .row { border-top-color: transparent; }

.row-label { width: 92px; flex: none; }

.row-name {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
}

.row-desc {
  font-size: 11px;
  color: var(--muted-2);
  margin-top: 1px;
}

.row-value {
  flex: 1;
  min-width: 0;
  text-align: right;
  font-family: var(--mono);
}

.val-line {
  display: block;
  white-space: nowrap;
  line-height: 1.42;
  font-weight: 700;
  color: var(--ink);
}

.row-value.s-lg .val-line { font-size: var(--f-lg); }
.row-value.s-md .val-line { font-size: var(--f-md); }
.row-value.s-sm .val-line { font-size: var(--f-sm); }
.row-value.s-xs .val-line { font-size: var(--f-xs); }
.row-value.s-xxs .val-line { font-size: var(--f-xxs); }

.row-on { background: #f0f5ff; }
.row-on + .row { border-top-color: transparent; }

.row-editing { box-shadow: inset 3px 0 0 var(--primary); }

.row-off .row-name,
.row-off .row-desc,
.row-off .val-line { color: #c6cbd7; }

.caret {
  color: var(--primary);
  font-weight: 400;
  animation: blink 1.1s steps(1) infinite;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* 默认留一点透明度，让「可复制」这件事被发现；悬停/聚焦时完全显示。
   0.35 是在白底上量的，但编辑中的行带浅蓝底 + 左侧蓝条，同值下图标几乎不可见，
   因此编辑态单独给足存在感（用户实测反馈过「图标没有显示」）。 */
.copy {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
}

.row:hover .copy, .copy:focus-visible { opacity: 1; }
.row-editing .copy { opacity: 0.85; }
.copy:hover { color: var(--primary); background: var(--primary-soft); }

.hint {
  margin: 10px 4px 2px;
  padding: 9px 13px;
  border-radius: 11px;
  background: var(--warn-bg);
  color: var(--warn-ink);
  font-size: 12px;
}

/* ============================== 位视图 ============================== */

.bitgrid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 6px;
}

.bit {
  height: 40px;
  border-radius: 10px;
  background: var(--key);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s, color 0.12s;
}

.bit:hover { background: #e6ebf9; }

.bit-on {
  background: var(--primary);
  color: #fff;
  font-weight: 700;
}

.bit-on:hover { background: #2450e6; }

/* ============================== 页脚 ============================== */

.foot {
  margin: 14px 6px 0;
  font-size: 11.5px;
  line-height: 1.75;
  color: var(--muted-2);
}

.foot kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  background: #fff;
  border: 1px solid #dfe4f2;
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
  color: var(--ink-2);
}

/* ============================== 键盘 ============================== */

.kb {
  background: var(--panel);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: 0 10px 30px rgba(24, 36, 72, 0.1);
}

.kb.hidden { display: none; }

.kb-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.kb-type {
  font-family: var(--mono);
  font-size: 12px;
  color: #8a91a3;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.kb-done {
  appearance: none;
  border: 0;
  flex: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 7px 20px;
  border-radius: 999px;
  cursor: pointer;
}

.kb-done:hover { background: #dde7ff; }

.kb-row { display: flex; gap: 8px; margin-bottom: 8px; }
.kb-row:last-child { margin-bottom: 0; }

.key {
  flex: 1;
  min-width: 0;
  height: 52px;
  border-radius: 12px;
  background: var(--key);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s, transform 0.05s;
}

.key:hover { background: #e9edf8; }
.key:active { background: #dfe5f5; transform: translateY(1px); }

.key-fn { background: var(--key-fn); color: #47506b; font-size: 16px; }
.key-fn:hover { background: #dfe5f2; }

.key-op { background: var(--key-op); color: var(--primary); font-size: 16px; }
.key-op:hover { background: #d9e3ff; }

.key-blank { background: transparent; pointer-events: none; }

.kb-empty {
  background: var(--panel);
  border-radius: var(--radius);
  padding: 26px 22px;
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.9;
  box-shadow: 0 2px 18px rgba(24, 36, 72, 0.05);
}

.kb-empty.hidden { display: none; }
.kb-empty b { color: var(--ink-2); }

/* ============================== 轻提示 ============================== */

.toast {
  position: fixed;
  left: 50%;
  top: 22px;
  transform: translateX(-50%) translateY(-14px);
  background: rgba(27, 31, 42, 0.92);
  color: #fff;
  font-size: 12.5px;
  padding: 9px 18px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 60;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================== 窄屏：键盘转底部抽屉 ============================== */

@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .col-kb { position: static; }

  .kb {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    border-radius: 20px 20px 0 0;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(24, 36, 72, 0.16);
    animation: kb-up 0.18s ease-out;
  }

  @keyframes kb-up {
    from { transform: translateY(30px); opacity: 0.4; }
    to { transform: translateY(0); opacity: 1; }
  }

  .key { height: 48px; }
}

@media (max-width: 560px) {
  :root {
    --f-lg: 25px;
    --f-md: 21px;
    --f-sm: 18px;
    --f-xs: 15.5px;
    --f-xxs: 13.5px;
  }

  .wrap { padding: 18px 14px 56px; }
  .panel { padding: 15px 14px; }
  .views { padding: 6px 6px 10px; }
  .row { padding: 10px 6px; gap: 8px; }
  .row-label { width: 76px; }
  .bit { height: 34px; font-size: 14px; }
  .bitgrid { gap: 4px; }
  .key { height: 46px; font-size: 17px; }
  .row-value { overflow-wrap: break-word; }
}

@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  .kb { animation: none; }
}

<script>/* ============================================================================
 * 程序员计算器 · 核心转换引擎
 * ----------------------------------------------------------------------------
 * 设计要点
 *  1. 内部统一用「64 位无符号位模式」{hi, lo} 表示（各 32 位）。
 *     width(8/16/32/64) 与 signed 只决定「如何解释」，不改变存储本身，
 *     因此切换位宽时低位数据可无损保留。
 *  2. 全程不依赖 BigInt / 任何第三方库，兼容低版本小程序基础库与浏览器。
 *  3. 显示口径与主流程序员计算器一致：
 *       BIN / OCT / HEX  → 补码位模式，按位宽定长显示
 *       DEC              → 数值（有符号类型显示负号）
 *       FLOAT / DOUBLE   → 把当前位模式按 IEEE754 单/双精度解释
 * ========================================================================== */

var POW32 = 4294967296;
var MASK32 = 4294967295;

/* ----------------------------- U64 基础运算 ----------------------------- */

function u64(hi, lo) {
  return { hi: hi >>> 0, lo: lo >>> 0 };
}
function U0() {
  return { hi: 0, lo: 0 };
}
function isZero(u) {
  return u.hi === 0 && u.lo === 0;
}
function eq(a, b) {
  return a.hi === b.hi && a.lo === b.lo;
}
function clone(u) {
  return { hi: u.hi, lo: u.lo };
}

/** 由非负 Number 构造（调用方需保证 < 2^53） */
function fromNumber(n) {
  n = Math.floor(n);
  if (!isFinite(n) || n <= 0) return U0();
  if (n < POW32) return u64(0, n);
  var hi = Math.floor(n / POW32);
  return u64(hi, n - hi * POW32);
}

/** 转回 Number（超出 2^53 会损失精度，仅供内部小数值场景） */
function toNumber(u) {
  return u.hi * POW32 + u.lo;
}

function bitAnd(a, b) {
  return u64(a.hi & b.hi, a.lo & b.lo);
}
function bitOr(a, b) {
  return u64(a.hi | b.hi, a.lo | b.lo);
}
function bitXor(a, b) {
  return u64(a.hi ^ b.hi, a.lo ^ b.lo);
}
function bitNot(a) {
  return u64(~a.hi, ~a.lo);
}
function add(a, b) {
  var lo = a.lo + b.lo;
  var carry = lo >= POW32 ? 1 : 0;
  return u64(a.hi + b.hi + carry, carry ? lo - POW32 : lo);
}
/** 二进制补码取负 */
function negate(a) {
  return add(bitNot(a), u64(0, 1));
}
function shl(a, n) {
  n = n & 63;
  if (n === 0) return clone(a);
  if (n < 32) return u64((a.hi << n) | (a.lo >>> (32 - n)), a.lo << n);
  return u64(a.lo << (n - 32), 0);
}
function shr(a, n) {
  n = n & 63;
  if (n === 0) return clone(a);
  if (n < 32) return u64(a.hi >>> n, (a.lo >>> n) | (a.hi << (32 - n)));
  return u64(0, a.hi >>> (n - 32));
}

function getBit(u, i) {
  if (i < 0 || i > 63) return 0;
  if (i < 32) return (u.lo >>> i) & 1;
  return (u.hi >>> (i - 32)) & 1;
}
function setBit(u, i, v) {
  if (i < 0 || i > 63) return u;
  var r = clone(u);
  if (i < 32) {
    r.lo = v ? (r.lo | (1 << i)) >>> 0 : (r.lo & ~(1 << i)) >>> 0;
  } else {
    r.hi = v ? (r.hi | (1 << (i - 32))) >>> 0 : (r.hi & ~(1 << (i - 32))) >>> 0;
  }
  return r;
}
function toggleBit(u, i) {
  return setBit(u, i, getBit(u, i) ? 0 : 1);
}

/** 按位宽截断（保留低位） */
function maskBits(u, width) {
  if (width >= 64) return clone(u);
  if (width <= 0) return U0();
  if (width < 32) {
    var m = ((1 << width) >>> 0) - 1;
    return u64(0, (u.lo & m) >>> 0);
  }
  if (width === 32) return u64(0, u.lo);
  var mh = ((1 << (width - 32)) >>> 0) - 1;
  return u64((u.hi & mh) >>> 0, u.lo);
}

/* ------------------------------- 字符串输出 ------------------------------- */

function padLeft(s, n, c) {
  c = c === undefined ? '0' : c;
  s = String(s);
  while (s.length < n) s = c + s;
  if (s.length > n) s = s.slice(s.length - n);
  return s;
}

function toBin64(u) {
  return padLeft(u.hi.toString(2), 32) + padLeft(u.lo.toString(2), 32);
}
function toHex64(u) {
  return padLeft(u.hi.toString(16), 8) + padLeft(u.lo.toString(16), 8);
}
function toOct64(u) {
  var bin = toBin64(u);
  var pad = (3 - (bin.length % 3)) % 3;
  if (pad) bin = padLeft(bin, bin.length + pad);
  var out = '';
  for (var i = 0; i < bin.length; i += 3) out += parseInt(bin.substr(i, 3), 2);
  return out;
}
/** 十进制：base-65536 分片长除法，精确无误差 */
function toDec64(u) {
  var p = [u.hi >>> 16, u.hi & 65535, u.lo >>> 16, u.lo & 65535];
  if (!p[0] && !p[1] && !p[2] && !p[3]) return '0';
  var out = '';
  while (p[0] || p[1] || p[2] || p[3]) {
    var rem = 0;
    for (var i = 0; i < 4; i++) {
      var cur = rem * 65536 + p[i];
      p[i] = Math.floor(cur / 10);
      rem = cur % 10;
    }
    out = rem + out;
  }
  return out;
}

/* ------------------------------- 字符串解析 ------------------------------- */

function digitValue(ch) {
  var c = ch.charCodeAt(0);
  if (c >= 48 && c <= 57) return c - 48;
  if (c >= 97 && c <= 102) return c - 87;
  if (c >= 65 && c <= 70) return c - 55;
  return -1;
}

/** 2 / 8 / 16 进制解析，超过 64 位的高位被丢弃 */
function parseRadixStr(str, radix) {
  var bits = radix === 16 ? 4 : radix === 8 ? 3 : 1;
  var u = U0();
  var overflow = false;
  for (var i = 0; i < str.length; i++) {
    var d = digitValue(str.charAt(i));
    if (d < 0 || d >= radix) continue;
    var top = shr(u, 64 - bits);
    if (top.hi !== 0 || top.lo !== 0) overflow = true;
    u = bitOr(shl(u, bits), u64(0, d));
  }
  return { u: u, overflow: overflow };
}

/** 十进制解析（base-65536 累乘 10），溢出位被丢弃 */
function parseDecStr(str) {
  var p = [0, 0, 0, 0];
  var overflow = false;
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 48 || c > 57) continue;
    var carry = c - 48;
    for (var j = 3; j >= 0; j--) {
      var cur = p[j] * 10 + carry;
      p[j] = cur & 65535;
      carry = cur >>> 16;
    }
    if (carry) overflow = true;
  }
  return {
    u: u64(((p[0] << 16) | p[1]) >>> 0, ((p[2] << 16) | p[3]) >>> 0),
    overflow: overflow
  };
}

/* -------------------------------- 浮点数 -------------------------------- */

/** IEEE754 浮点 → 位模式；float32 会自动做精度收敛与溢出（Infinity）处理 */
function floatToBits(f, bytes) {
  var buf = new ArrayBuffer(bytes);
  var dv = new DataView(buf);
  if (bytes === 4) {
    dv.setFloat32(0, f, false);
    return u64(0, dv.getUint32(0, false));
  }
  dv.setFloat64(0, f, false);
  return u64(dv.getUint32(0, false), dv.getUint32(4, false));
}

/** 位模式 → IEEE754 浮点 */
function bitsToFloat(u, bytes) {
  var buf = new ArrayBuffer(bytes);
  var dv = new DataView(buf);
  if (bytes === 4) {
    dv.setUint32(0, u.lo, false);
    return dv.getFloat32(0, false);
  }
  dv.setUint32(0, u.hi, false);
  dv.setUint32(4, u.lo, false);
  return dv.getFloat64(0, false);
}

/** 浮点显示：单精度自适应取 7~9 位有效数字，保证「最短且可无损往返」 */
function formatFloatValue(f, single) {
  if (f !== f) return 'NaN';
  if (f === Infinity) return 'Infinity';
  if (f === -Infinity) return '-Infinity';
  if (f === 0) return 1 / f === -Infinity ? '-0' : '0';
  if (!single) return String(f);
  // 7 位足够大多数值；对 1234567.5 这类值需 8~9 位才能往返
  var target = floatToBits(f, 4);
  for (var p = 7; p <= 9; p++) {
    var v = Number(f.toPrecision(p));
    if (eq(floatToBits(v, 4), target)) return String(v);
  }
  return String(Number(f.toPrecision(9)));
}

function parseFloatLoose(s) {
  s = String(s).trim();
  if (!s || s === '-' || s === '+' || s === '.' || s === '-.' || s === '+.') return 0;
  var f = parseFloat(s);
  if (f !== f) return 0;
  return f;
}

/* ------------------------------- 位宽与类型 ------------------------------- */

var WIDTH_INFO = {
  8: { hex: 2, oct: 3, bits: 8 },
  16: { hex: 4, oct: 6, bits: 16 },
  32: { hex: 8, oct: 11, bits: 32 },
  64: { hex: 16, oct: 22, bits: 64 }
};

var TYPES = [
  { key: 'int8', label: 'int8', width: 8, signed: true },
  { key: 'int16', label: 'int16', width: 16, signed: true },
  { key: 'int32', label: 'int32', width: 32, signed: true },
  { key: 'int64', label: 'int64', width: 64, signed: true },
  { key: 'uint8', label: 'uint8', width: 8, signed: false },
  { key: 'uint16', label: 'uint16', width: 16, signed: false },
  { key: 'uint32', label: 'uint32', width: 32, signed: false },
  { key: 'uint64', label: 'uint64', width: 64, signed: false }
];

function typeInfo(key) {
  for (var i = 0; i < TYPES.length; i++) {
    if (TYPES[i].key === key) return TYPES[i];
  }
  return { key: key, label: key, width: 64, signed: true };
}

/* ------------------------------- 数值解释 ------------------------------- */

/**
 * 有符号解释：返回 { negative, magnitude }
 * magnitude 始终是「绝对值」的位模式，便于配合 toDec64 输出负号
 */
function signedView(u, width, signed) {
  var m = maskBits(u, width);
  if (!signed) return { negative: false, magnitude: m };
  if (getBit(m, width - 1) === 0) return { negative: false, magnitude: m };
  return { negative: true, magnitude: maskBits(negate(m), width) };
}

var U64_MAX = u64(MASK32, MASK32); // 2^64 - 1

/** 数值范围（用于界面提示 / 超范围截断判断） */
function rangeOf(width, signed) {
  if (signed) {
    var half = shl(u64(0, 1), width - 1); // 2^(width-1)
    return {
      min: '-' + toDec64(half),
      // 2^64 模运算下 half - 1 == half + (2^64-1)
      max: toDec64(add(half, U64_MAX))
    };
  }
  return {
    min: '0',
    max: toDec64(maskBits(U64_MAX, width))
  };
}

/* ------------------------------- 对外格式化 ------------------------------- */

function formatBin(u, width) {
  var s = toBin64(maskBits(u, width)).slice(-width);
  return s.replace(/(.{4})(?=.)/g, '$1 ');
}
function formatHex(u, width) {
  var m = maskBits(u, width);
  return toHex64(m).slice(-WIDTH_INFO[width].hex).toUpperCase();
}
function formatOct(u, width) {
  var m = maskBits(u, width);
  return toOct64(m).slice(-WIDTH_INFO[width].oct);
}
function formatDec(u, width, signed) {
  var v = signedView(u, width, signed);
  return (v.negative ? '-' : '') + toDec64(v.magnitude);
}

/** 一次算出六种显示视图；不支持的视图返回 null */
function formatAll(bits, width, signed) {
  var m = maskBits(bits, width);
  return {
    BIN: formatBin(m, width),
    OCT: formatOct(m, width),
    DEC: formatDec(m, width, signed),
    HEX: formatHex(m, width),
    FLOAT: width === 32 ? formatFloatValue(bitsToFloat(m, 4), true) : null,
    DOUBLE: width === 64 ? formatFloatValue(bitsToFloat(m, 8), false) : null
  };
}

/** 去掉前导零，至少保留一位 */
function trimZero(s) {
  var t = s.replace(/^0+(?=.)/, '');
  return t === '' ? '0' : t;
}

/** 二进制每 4 位插一个空格，便于阅读 */
function groupBin(s) {
  return String(s).replace(/(.{4})(?=.)/g, '$1 ');
}

/** 按文本长度给字号分档，避免长数值溢出 */
function sizeOf(text) {
  var n = String(text).length;
  if (n > 33) return 'xxs';
  if (n > 20) return 'xs';
  if (n > 14) return 'sm';
  if (n > 10) return 'md';
  return 'lg';
}

/** 进入编辑态时，某个类型对应的初始输入串 */

<script>/* ============================================================================

(function () {
  'use strict';

    { key: 'int8', label: 'int8', width: 8, signed: true },
    { key: 'int16', label: 'int16', width: 16, signed: true },
    { key: 'int32', label: 'int32', width: 32, signed: true },
    { key: 'int64', label: 'int64', width: 64, signed: true }
  ];
  var UNSIGNED_CHIPS = [
    { key: 'uint8', label: 'uint8', width: 8, signed: false },
    { key: 'uint16', label: 'uint16', width: 16, signed: false },
    { key: 'uint32', label: 'uint32', width: 32, signed: false },
    { key: 'uint64', label: 'uint64', width: 64, signed: false }
  ];

    { key: 'BIN', name: 'BIN', desc: '二进制' },
    { key: 'OCT', name: 'OCT', desc: '八进制' },
    { key: 'DEC', name: 'DEC', desc: '十进制' },
    { key: 'HEX', name: 'HEX', desc: '十六进制' },
    { key: 'FLOAT', name: 'FLOAT', desc: 'IEEE754 单精度', need: 32 },
    { key: 'DOUBLE', name: 'DBL', desc: 'IEEE754 双精度', need: 64 }
  ];

    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="9" y="9" width="12" height="12" rx="2"/>' +

        '<div class="row-label">' +
        '<div class="row-name">' + esc(v.name) + '</div>' +
        '<div class="row-desc">' + esc(v.desc) + '</div>' +
        '</div>' +
        '<div class="row-value s-' + size + '">' + linesHtml + '</div>' +

  function shareLink() {
    var url = location.href.split('#')[0] + hashString();
    copyText(url, '分享链接已复制');
  }

  /* ---------------------------- URL hash ---------------------------- */

  function hashString() {
    if (!state.hasValue) return '#';
    var m = C.maskBits(state.bits, state.width);
    // 只留位宽对应的十六进制位数：读回时反正会按位宽掩码，高位补零纯属噪音
    var digits = C.toHex64(m).slice(-C.WIDTH_INFO[state.width].hex).toLowerCase();
    return '#' + (state.signed ? 'int' : 'uint') + state.width + ':' + digits;
  }

  function writeHash() {}

  /** 从 hash 还原状态；返回是否成功解析 */
  function readHash() {
    var m = /^#(int|uint)(8|16|32|64):([0-9a-fA-F]{1,16})$/.exec('');
    if (!m) return false;
    var signed = m[1] === 'int';
    var width = parseInt(m[2], 10);
    var r = C.parseRadixStr(m[3], 16);
    state.width = width;
    state.signed = signed;
    state.bits = C.maskBits(r.u, width);
    state.inputType = 'DEC';
    state.editing = false;
    state.buffer = '';
    state.truncated = false;
    state.hasValue = true;
    state.fresh = true;
    return true;
  }

  /* ---------------------------- 物理键盘 ---------------------------- */

  /** 物理按键 → 虚拟键值；返回 null 表示该键在当前类型下无意义 */
  function physicalKeyToValue(type, signed, k) {
    if (k === 'Backspace') return 'back';
    if (k === 'Delete') return 'clear';
    if (/^[0-9]$/.test(k)) {
      if (type === 'BIN') return k === '0' || k === '1' ? k : null;
      if (type === 'OCT') return k <= '7' ? k : null;
      return k; // DEC / HEX / FLOAT / DOUBLE
    }
    if (/^[a-fA-F]$/.test(k)) {
      // 只有 HEX 接受字母；FLOAT/DOUBLE 的 e 单独处理
      if (type === 'HEX') return k.toUpperCase();
      if ((type === 'FLOAT' || type === 'DOUBLE') && (k === 'e' || k === 'E')) return 'e';
      return null;
    }
    if (k === '.') return type === 'FLOAT' || type === 'DOUBLE' ? '.' : null;
    // ± 只对「能表示负号」的类型开放：DEC 与浮点。
    // BIN/OCT/HEX 的 ± 在补码位模式下没有意义（虚拟键盘保留该键只为与 App 一致）。
    if (k === '-' && signed && (type === 'DEC' || type === 'FLOAT' || type === 'DOUBLE')) {
      return 'sign';
    }
    return null;
  }

  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;

    if (k === 'Escape') {
      if (state.editing) { onDone(); e.preventDefault(); }
      return;
    }
    if (k === 'Enter') {
      if (state.editing) { onDone(); e.preventDefault(); }
      return;
    }
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      moveActiveRow(k === 'ArrowUp' ? -1 : 1);
      return;
    }

    var value = physicalKeyToValue(state.inputType, state.signed, k);
    if (value === null) return;
    e.preventDefault();
    // 未编辑时敲有效字符 → 自动进入编辑态（fresh 会保证该字符覆盖旧值）
    if (!state.editing) onSelectView(state.inputType);
    onKey(value);
  }

  /** ↑/↓ 在六种视图间循环（会自动对齐位宽，与点击行一致） */
  function moveActiveRow(dir) {
    var idx = 0;
    for (var i = 0; i < VIEWS.length; i++) {
      if (VIEWS[i].key === state.inputType) idx = i;
    }
    for (var step = 0; step < VIEWS.length; step++) {
      idx = (idx + dir + VIEWS.length) % VIEWS.length;
      if (state.inputType !== VIEWS[idx].key) {
        onSelectView(VIEWS[idx].key);
        return;
      }
    }
  }

  /* ---------------------------- 事件绑定 ---------------------------- */

  function closestAttr(target, selector, attr) {
    var node = target && target.closest ? target.closest(selector) : null;
    return node ? node.getAttribute(attr) : null;
  }

  function init() {
    els.chipsSigned = $('chips-signed');
    els.chipsUnsigned = $('chips-unsigned');
    els.metaType = $('meta-type');
    els.rangeText = $('range-text');
    els.views = $('views');
    els.bitgrid = $('bitgrid');
    els.kb = $('kb');
    els.kbEmpty = $('kb-empty');
    els.kbType = $('kb-type');
    els.kbKeys = $('kb-keys');
    els.kbDone = $('kb-done');
    els.btnShare = $('btn-share');
    els.toast = $('toast');

    /* 位宽 chips：两行共用一套逻辑 */
    var onChipClick = function (e) {
      var key = closestAttr(e.target, '.chip', 'data-key');
      if (key) onSelectWidth(key);
    };
    els.chipsSigned.addEventListener('click', onChipClick);
    els.chipsUnsigned.addEventListener('click', onChipClick);

    /* 数值视图：点行进入编辑；点行尾图标复制 */
    els.views.addEventListener('click', function (e) {
      var copyKey = closestAttr(e.target, '.copy', 'data-copy');
      if (copyKey) { copyRow(copyKey); return; }
      var rowKey = closestAttr(e.target, '.row', 'data-key');
      if (rowKey) onSelectView(rowKey);
    });

    /* 位格子 */
    els.bitgrid.addEventListener('click', function (e) {
      var i = closestAttr(e.target, '.bit', 'data-i');
      if (i !== null) onToggleBit(parseInt(i, 10));
    });

    /* 键盘 */
    els.kb.addEventListener('click', function (e) {
      var v = closestAttr(e.target, '.key', 'data-v');
      if (v !== null) onKey(v);
    });
    els.kbDone.addEventListener('click', onDone);

    /* 分享 */
    els.btnShare.addEventListener('click', shareLink);

    /* 物理键盘 */
    document.addEventListener('keydown', onKeyDown);

    /* 外部修改 hash（例如粘贴别人的链接）→ 还原 */
    window.addEventListener('hashchange', function () {
      if (readHash()) render();
    });

    readHash();
    render();
  }

  /* 暴露给无头浏览器测试与调试 */
  window.PCWeb = {
    state: state,
    render: render,
    onSelectWidth: onSelectWidth,
    onSelectView: onSelectView,
    onKey: onKey,
    onToggleBit: onToggleBit,
    onDone: onDone,
    copyRow: copyRow,
    physicalKeyToValue: physicalKeyToValue,
    hashString: hashString
  };

  window.resetExample = function () { Object.assign(state, {width:32,signed:true,inputType:'DEC',editing:false,buffer:'',bits:C.parseInput('DEC','0',32,true).bits,truncated:false,hasValue:false,fresh:true}); render(); };
  init();
})();
</script>
</body>
</html>
