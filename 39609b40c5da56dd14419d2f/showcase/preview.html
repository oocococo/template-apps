<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* ============ 凌晨三点 · Oncall 指挥台 ============ */
:root{
  --bg:#070B10; --bg2:#0A1017; --card:#0F1721; --card2:#131C27;
  --line:rgba(150,180,220,.13); --line2:rgba(150,180,220,.22);
  --txt:#E7EEF7; --txt2:#A9BACC; --dim:#63788E;
  --fire:#FF6A3D; --fire2:#FF8B5E; --amber:#FFB020; --red:#FF4D6D;
  --green:#2FD27D; --cyan:#45C8F1; --purple:#A78BFA;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 78% -10%, rgba(255,106,61,.10), transparent 62%),
    radial-gradient(760px 480px at 8% 8%, rgba(69,200,241,.07), transparent 60%),
    radial-gradient(600px 400px at 50% 110%, rgba(167,139,250,.06), transparent 62%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:linear-gradient(rgba(150,180,220,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(150,180,220,.03) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 30%,transparent 78%);
}
#app{position:relative;z-index:1;min-height:100%}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(150,180,220,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(150,180,220,.3)}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 通用 ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.view{animation:fade .38s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--fire);
  text-transform:uppercase;display:inline-flex;align-items:center;gap:8px
}
.kicker::before{content:"";width:18px;height:1px;background:var(--fire);opacity:.7}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 26px;border-radius:11px;font-weight:600;font-size:14.5px;
  transition:.18s ease;white-space:nowrap
}
.btn-primary{
  background:linear-gradient(135deg,var(--fire),#E8492A);color:#fff;
  box-shadow:0 8px 26px -8px rgba(255,106,61,.65),inset 0 1px 0 rgba(255,255,255,.22)
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px rgba(255,106,61,.8)}
.btn-ghost{border:1px solid var(--line2);color:var(--txt2);background:rgba(255,255,255,.02)}
.btn-ghost:hover{border-color:rgba(255,106,61,.5);color:var(--txt);background:rgba(255,106,61,.06)}

/* ---------- 首页 ---------- */
.home{padding-bottom:80px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0;border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .dot{
  width:9px;height:9px;border-radius:50%;background:var(--fire);
  box-shadow:0 0 0 0 rgba(255,106,61,.7);animation:pulse 2.4s infinite
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,106,61,.55)}
  70%{box-shadow:0 0 0 11px rgba(255,106,61,0)}
  100%{box-shadow:0 0 0 0 rgba(255,106,61,0)}
}
.topbar .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.1em}

.hero{padding:76px 0 54px;position:relative}
.hero-visual{
  position:absolute;right:0;top:52px;width:392px;pointer-events:none;
  transform:rotate(-1.4deg)
}
.hv-card{
  background:rgba(17,25,36,.96);border:1px solid rgba(150,180,220,.30);border-radius:14px;
  padding:14px;box-shadow:0 40px 90px -24px #000,0 0 0 1px rgba(255,106,61,.06)
}
.hv-h{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--dim);
  padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px
}
.hv-h i{font-style:normal;color:var(--fire)}
.hv-al{
  border-left:2px solid var(--dim);background:#0C1219;border-radius:0 8px 8px 0;
  padding:8px 11px;margin-bottom:8px
}
.hv-al:last-child{margin-bottom:0}
.hv-al .l{display:flex;gap:7px;font-family:var(--mono);font-size:10.5px;margin-bottom:3px;color:var(--dim)}
.hv-al .l b{padding:0 5px;border-radius:4px;font-weight:700}
.hv-al p{font-size:12.5px;color:#CBD8E6;line-height:1.5}
.hv-al.p1{border-color:var(--red)} .hv-al.p1 b{background:rgba(255,77,109,.18);color:var(--red)}
.hv-al.p2{border-color:var(--amber)} .hv-al.p2 b{background:rgba(255,176,32,.16);color:var(--amber)}
.hv-al.p3{border-color:var(--purple)} .hv-al.p3 b{background:rgba(167,139,250,.16);color:var(--purple)}
.hv-foot{
  display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--dim)
}
.hv-foot em{font-style:normal;color:var(--fire);animation:blink 2s infinite}
.hero h1{max-width:660px}
.hero h1{
  font-size:clamp(40px,7.2vw,78px);line-height:1.02;letter-spacing:-.035em;
  font-weight:800;margin:18px 0 0
}
.hero h1 .n{color:var(--fire);position:relative}
.hero h1 .n::after{
  content:"";position:absolute;left:0;right:0;bottom:.06em;height:.055em;
  background:linear-gradient(90deg,var(--fire),transparent);opacity:.5
}
.hero .sub{
  margin-top:20px;font-size:16px;color:var(--txt2);max-width:560px;line-height:1.75
}
.hero .sub b{color:var(--txt);font-weight:600}
.hero .cta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero .cta .tip{font-size:12.5px;color:var(--dim);margin-left:4px}

.how{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px
}
.how .cell{background:var(--card);padding:24px 22px}
.how .cell .i{font-family:var(--mono);font-size:11px;color:var(--fire);letter-spacing:.18em}
.how .cell b{display:block;margin:10px 0 6px;font-size:15px}
.how .cell p{font-size:13px;color:var(--dim);line-height:1.7}

.sect-head{display:flex;align-items:baseline;justify-content:space-between;margin:64px 0 20px}
.sect-head h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sect-head span{font-size:12.5px;color:var(--dim)}

.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lv{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;transition:.2s ease;position:relative;overflow:hidden;display:block;width:100%
}
.lv::after{
  content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:linear-gradient(135deg,rgba(255,106,61,.07),transparent 42%);opacity:0;transition:.2s
}
.lv:hover{border-color:rgba(255,106,61,.42);transform:translateY(-3px)}
.lv:hover::after{opacity:1}
.lv-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lv-no{
  font-family:var(--mono);font-size:11px;color:var(--fire);border:1px solid rgba(255,106,61,.32);
  padding:2px 8px;border-radius:6px;letter-spacing:.1em
}
.lv-diff{font-size:11px;color:var(--dim);margin-left:auto;font-family:var(--mono)}
.lv h3{font-size:17px;font-weight:700;margin-bottom:5px}
.lv .d{font-size:13px;color:var(--dim);line-height:1.65}
.lv-foot{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:12px;color:var(--dim);font-family:var(--mono)}
.lv-foot .sys{color:var(--cyan)}
.lv-foot .grade{
  margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-weight:800;font-size:13px
}
.g-S{background:rgba(255,176,32,.16);color:var(--amber)}
.g-A{background:rgba(47,210,125,.14);color:var(--green)}
.g-B{background:rgba(69,200,241,.13);color:var(--cyan)}
.g-C{background:rgba(150,180,220,.12);color:var(--txt2)}
.g-D{background:rgba(255,77,109,.13);color:var(--red)}
.g-N{background:rgba(150,180,220,.08);color:var(--dim)}

.foot-note{
  margin-top:52px;padding-top:22px;border-top:1px solid var(--line);
  font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap
}

/* ---------- 简报弹层 ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(4,7,11,.78);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  display:grid;place-items:center;padding:24px;animation:fade .25s ease
}
.sheet{
  width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--card);
  border:1px solid var(--line2);border-radius:18px;padding:30px 32px;
  box-shadow:0 40px 100px -30px #000;animation:rise .3s cubic-bezier(.2,.9,.3,1)
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.sheet .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--fire)}
.sheet h2{font-size:24px;margin:10px 0 6px;letter-spacing:-.02em}
.sheet .st{font-size:13.5px;color:var(--dim)}
.brief-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.brief-grid .b{
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px
}
.brief-grid .b span{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:.08em}
.brief-grid .b b{display:block;font-size:15px;margin-top:4px;font-family:var(--mono)}
.sheet p.body{font-size:13.5px;color:var(--txt2);line-height:1.85}
.sheet .rulebox{
  margin:20px 0;padding:16px 18px;border-radius:11px;
  background:rgba(255,106,61,.07);border:1px solid rgba(255,106,61,.24)
}
.sheet .rulebox > b{color:var(--fire);font-size:13px;display:block;margin-bottom:6px}
.sheet .rulebox li b{color:var(--amber);font-weight:600}
.sheet .rulebox ul{margin:0;padding-left:16px;font-size:12.8px;color:var(--txt2);line-height:1.9}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}

/* ---------- 游戏界面 ---------- */
.game{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hud{
  flex:none;position:relative;z-index:30;background:rgba(7,11,16,.94);
  border-bottom:1px solid var(--line)
}
.hud-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.hud .back{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;transition:.15s}
.hud .back:hover{color:var(--txt)}
.hud .lvname{font-weight:700;font-size:14.5px;white-space:nowrap}
.hud .lvname i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--fire);margin-right:8px}
.hud .stats{display:flex;gap:22px;margin-left:auto;align-items:center}
.stat{text-align:right}
.stat span{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.1em}
.stat b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.01em}
.stat b.warn{color:var(--amber)}
.stat b.bad{color:var(--red)}
.stat b.ok{color:var(--green)}

.burnbar{height:3px;background:rgba(150,180,220,.1);position:relative;overflow:hidden}
.burnbar i{display:block;height:100%;width:0;transition:width .5s ease,background .5s ease}

.board{
  flex:1;min-height:0;max-width:1400px;width:100%;margin:0 auto;padding:14px 20px 18px;
  display:grid;grid-template-columns:302px minmax(0,1fr) 344px;grid-template-rows:minmax(0,1fr);
  gap:14px;align-items:stretch;overflow:hidden
}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;overflow:hidden}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;min-height:0
}
.panel.grow{flex:1}
.panel-h{
  display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);
  font-size:11.5px;font-family:var(--mono);letter-spacing:.12em;color:var(--dim)
}
.panel-h b{color:var(--txt2);font-weight:600;letter-spacing:.06em}
.panel-h .r{margin-left:auto;font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.panel-b{padding:12px 14px}

/* 告警流 */
.alerts{flex:1;min-height:120px;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.al{
  border-left:2px solid var(--dim);padding:7px 10px;border-radius:0 8px 8px 0;
  background:var(--bg2);font-size:12px;line-height:1.55;animation:slidein .35s ease
}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.al .hd{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;margin-bottom:3px}
.al .lv{padding:0 5px;border-radius:4px;font-weight:700;letter-spacing:.04em}
.al .t{color:var(--dim)}
.al .svc{color:var(--cyan)}
.al .msg{color:var(--txt2);word-break:break-word}
.al.p1{border-color:var(--red)} .al.p1 .lv{background:rgba(255,77,109,.18);color:var(--red)}
.al.p2{border-color:var(--amber)} .al.p2 .lv{background:rgba(255,176,32,.16);color:var(--amber)}
.al.p3{border-color:var(--cyan)} .al.p3 .lv{background:rgba(69,200,241,.14);color:var(--cyan)}
.al.info{border-color:var(--purple)} .al.info .lv{background:rgba(167,139,250,.16);color:var(--purple)}
.al.fresh{box-shadow:0 0 0 1px rgba(255,77,109,.28)}

/* 指标 */
.metric{padding:12px 16px 14px;display:flex;flex-direction:column;flex:none}
.metric .mt{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.metric .mt span{font-size:11.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.1em}
.metric .mt b{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.metric .mt b i{font-style:normal;font-size:12px;color:var(--dim);margin-left:2px}
.metric .mt b.ok{color:var(--green)} .metric .mt b.warn{color:var(--amber)} .metric .mt b.bad{color:var(--red)}
.chartwrap{position:relative;flex:none;height:124px;margin-top:10px;padding-left:32px}
.spark{width:100%;height:100%;display:block}
.ylab{
  position:absolute;left:0;font-family:var(--mono);font-size:10px;color:var(--dim);
  transform:translateY(-50%);letter-spacing:.02em
}
.ylab.t{top:0} .ylab.b{bottom:0;transform:translateY(50%)} .ylab.m{top:50%}

.svcrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed rgba(150,180,220,.08);font-size:12.5px}
.svcrow:last-child{border-bottom:none}
.svcrow .nm{font-family:var(--mono);color:var(--txt2)}
.svcrow .rl{color:var(--dim);font-size:11.5px;margin-left:2px}
.svcrow .st{margin-left:auto;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px}
.st-ok{background:rgba(47,210,125,.12);color:var(--green)}
.st-warn{background:rgba(255,176,32,.14);color:var(--amber)}
.st-err{background:rgba(255,77,109,.15);color:var(--red);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.45}}

/* 时间轴 */
.tl{flex:1;min-height:96px;overflow:auto;padding:10px 14px}
.tl-i{display:flex;gap:10px;font-size:12px;padding:5px 0;position:relative}
.tl-i .tt{font-family:var(--mono);font-size:10.5px;color:var(--dim);min-width:40px;padding-top:1px}
.tl-i .tx{color:var(--txt2);line-height:1.5}
.tl-i .tx em{font-style:normal;color:var(--txt)}
.tl-i.good .tx{color:var(--green)}
.tl-i.bad .tx{color:var(--red)}
.tl-i.temp .tx{color:var(--amber)}

/* 动作面板 */
.actions{padding:4px 10px 10px;flex:1;min-height:0;overflow:auto}
.agroup{margin-top:10px}
.agroup .gh{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);
  padding:5px 2px 4px;display:flex;align-items:center;gap:7px
}
.agroup .gh u{text-decoration:none;color:var(--fire);opacity:.75;letter-spacing:0}
.agroup .gh::after{content:"";flex:1;height:1px;background:var(--line)}
.act{
  width:100%;text-align:left;display:block;padding:6px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg2);margin-bottom:4px;transition:.15s ease
}
.act:hover{border-color:rgba(255,106,61,.45);background:rgba(255,106,61,.06);transform:translateX(2px)}
.act .t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;line-height:1.4}
.act .t .dur{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:400}
.act .t .dur.par{
  color:var(--cyan);border:1px solid rgba(69,200,241,.32);background:rgba(69,200,241,.08);
  padding:0 6px;border-radius:5px;font-size:10px;letter-spacing:.06em
}
.act .d{font-size:10.8px;color:var(--dim);margin-top:0;line-height:1.38}
.act.done{opacity:.42;pointer-events:none}
.act.done .t::after{content:"✓ 已执行";font-size:10px;color:var(--green);font-family:var(--mono)}
.act.trap .t .dur{color:var(--amber)}
.act.good{border-color:rgba(47,210,125,.3)}

/* 结算 */
.result{max-width:960px;margin:0 auto;padding:38px 24px 80px}
.rgrade{
  display:flex;align-items:center;gap:26px;padding:30px 32px;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,106,61,.11),rgba(167,139,250,.05) 60%,transparent);
  border:1px solid rgba(255,106,61,.24);margin-bottom:22px
}
.rgrade .big{
  font-family:var(--mono);font-size:82px;font-weight:800;line-height:1;
  letter-spacing:-.05em;width:96px;text-align:center
}
.rgrade .txt h2{font-size:24px;margin-bottom:6px;letter-spacing:-.02em}
.rgrade .txt p{font-size:13.5px;color:var(--txt2);line-height:1.7;max-width:520px}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.rstats .s{background:var(--card);padding:16px 18px}
.rstats .s span{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:.1em}
.rstats .s b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;margin-top:5px}
.rstats .s i{font-style:normal;font-size:11px;color:var(--dim);margin-left:3px;font-family:var(--sans)}

.scorelist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 20px;margin-bottom:22px}
.sc{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(150,180,220,.07)}
.sc:last-child{border-bottom:none}
.sc .nm{font-size:13px;width:112px;flex:none}
.sc .bar{flex:1;height:6px;border-radius:6px;background:rgba(150,180,220,.1);overflow:hidden}
.sc .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--fire),var(--amber));transition:width .8s cubic-bezier(.2,.9,.3,1)}
.sc .vl{font-family:var(--mono);font-size:12.5px;color:var(--txt2);width:78px;text-align:right;flex:none}

function demoStart(){/* ============================================================
   凌晨三点 · Oncall 指挥台
   核心机制：回合制时间推进 —— 动作耗时直接换算成「失败请求数」
   ============================================================ */
(function () {
  'use strict';

  var app = document.getElementById('app');
  var LS = 'oncall3am_v2';

  /* ---------------- 工具 ---------------- */
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function mmss(s) { var m = Math.floor(s / 60), q = s % 60; return (m < 10 ? '0' : '') + m + ':' + (q < 10 ? '0' : '') + q; }
  function num(n) {
    if (n >= 100000000) return (n / 100000000).toFixed(2) + ' 亿';
    if (n >= 10000) return (n / 10000).toFixed(1) + ' 万';
    return Math.round(n).toLocaleString('en-US');
  }
  var demoStore = {}; function store() { return demoStore; }
  function persist(o) { demoStore = o; }

  var toastT;
  function toast(msg) {
    var t = document.querySelector('.toast');
    if (!t) { t = el('<div class="toast"></div>'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3200);
  }

  /* ---------------- 引擎 ---------------- */
  function newGame(sc) {
    return {
      sc: sc, t: 0, err: sc.startErr, growth: sc.growth, impact: 0,
      flags: {}, used: {}, recs: [], alerts: [], aIdx: 0, hist: [{ t: 0, e: sc.startErr }],
      done: false, mttr: null, trapped: 0, temps: 0, runaway: false
    };
  }

  /* 推进时间：每 1 秒都在产生失败请求 */
  function advance(g, dt) {
    var sc = g.sc, acc = 0;
    for (var i = 0; i < dt; i++) {
      g.t++;
      g.err = clamp(g.err + g.growth, 0.3, 100);
      acc += sc.qps * (g.err / 100);
      g.hist.push({ t: g.t, e: g.err });
      /* 快到期的告警 */
      while (g.aIdx < sc.alerts.length && sc.alerts[g.aIdx].t <= g.t) {
        g.alerts.push(sc.alerts[g.aIdx]); g.aIdx++;
      }
    }
    g.impact += acc;
    if (g.hist.length > 900) g.hist.splice(0, g.hist.length - 900);
  }

  /* 应用一个动作 */
  function act(g, id) {
    if (g.done) return null;
    var a = null;
    for (var i = 0; i < g.sc.acts.length; i++) if (g.sc.acts[i].id === id) { a = g.sc.acts[i]; break; }
    if (!a || g.used[id]) return null;

    var eff = a, blind = false;
    if (a.req && !g.flags[a.req] && a.blind) { eff = Object.assign({}, a, a.blind); blind = true; }

    var t0 = g.t;
    advance(g, a.dur);
    if (!blind) g.used[id] = true;   /* 盲目失败的动作可以重来一次，但要再付一次时间 */
    if (a.flag) g.flags[a.flag] = true;

    if (eff.err) {
      if (eff.err.set != null) g.err = eff.err.set;
      if (eff.err.mul != null) g.err = clamp(g.err * eff.err.mul, 0.3, 100);
    }
    if (eff.growth) {
      if (eff.growth.set != null) g.growth = eff.growth.set;
      if (eff.growth.add != null) g.growth = g.growth + eff.growth.add;
    }
    g.hist.push({ t: g.t, e: g.err });

    var lv = eff.lv || 'info';
    if (lv === 'bad') g.trapped++;
    if (lv === 'temp') g.temps++;

    var rec = { id: id, label: a.t, t0: t0, t1: g.t, dur: a.dur, lv: lv, log: eff.log || '' };
    g.recs.push(rec);

    if (eff.win) { g.done = true; g.mttr = g.t; }
    else if (g.t >= g.sc.maxSec) { g.done = true; g.mttr = g.t; g.runaway = true; }
    return rec;
  }

  /* 干跑最优路径，得到满分基准（不写死数字） */
  var bestCache = {};
  function bestOf(sc) {
    if (bestCache[sc.id]) return bestCache[sc.id];
    var g = newGame(sc);
    for (var i = 0; i < sc.bestPath.length; i++) {
      if (g.done) break;
      act(g, sc.bestPath[i]);
    }
    if (!g.done) { g.mttr = g.t; }
    bestCache[sc.id] = { t: Math.max(g.mttr, 20), i: Math.max(g.impact, 1000) };
    return bestCache[sc.id];
  }

  function commCount(g) {
    var n = 0; if (g.flags.comm1) n++; if (g.flags.comm2) n++; if (g.flags.comm3) n++; return n;
  }

  function scoreOf(g) {
    var b = bestOf(g.sc);
    var mttr = g.mttr || g.t;
    var speed = 40 * clamp(1 - (mttr - b.t) / b.t, 0, 1);
    var imp = 30 * clamp(1 - (g.impact - b.i) / b.i, 0, 1);
    var dec = Math.max(0, 20 - 6 * g.trapped - 2 * g.temps);
    var cc = commCount(g);
    var comm = cc >= 2 ? 10 : cc === 1 ? 5 : 0;
    var total = Math.round(speed + imp + dec + comm);
    return {
      speed: Math.round(speed), imp: Math.round(imp), dec: Math.round(dec), comm: comm,
      total: total, grade: gradeOf(total), best: b, mttr: mttr
    };
  }
  function gradeOf(n) { return n >= 95 ? 'S' : n >= 85 ? 'A' : n >= 70 ? 'B' : n >= 55 ? 'C' : 'D'; }
  function gradeTitle(gr) {
    return ({ S: '首席救火官', A: '老练值班人', B: '合格 oncall', C: '手忙脚乱', D: '事故扩大者' })[gr];
  }

  /* ---------------- 视图状态 ---------------- */
  var view = 'home';
  var G = null;
  var RESULT = null;
  var BRIEF = null;   // 简报弹层

  /* ---------------- 首页 ---------------- */
  function heroHTML() {
    var s = store();
    var doneN = 0, bestSum = 0;
    window.SCENARIOS.forEach(function (sc) { if (s[sc.id]) { doneN++; bestSum += s[sc.id].total; } });

      var rec = s[sc.id];
      return '<button class="lv" data-lv="' + sc.id + '">' +

        '<div class="lv-foot"><span class="sys">' + esc(sc.system) + '</span>' +
        '<span>·</span><span>' + esc(sc.brief.when) + '</span>' +
        '<span class="grade g-' + (rec ? rec.grade : 'N') + '">' + (rec ? rec.grade : '·') + '</span>' +
        '</div></button>';
    }).join('');

    return '<div class="home"><div class="wrap">' +
      '<div class="topbar">' +
      '<div class="brand"><span class="dot"></span>凌晨三点 · ONCALL 指挥台</div>' +
      '<div class="meta">' + (doneN ? '已通关 ' + doneN + '/4 · 累计 ' + bestSum + ' 分' : '4 场真实生产事故') + '</div>' +
      '</div>' +

      '<div class="hero">' +
      '<span class="kicker">INCIDENT COMMANDER</span>' +
      '<h1>凌晨三点，<br>你只有<span class="n">六分钟</span>。</h1>' +
      '<p class="sub">这不是一个看板，是一个<b>要你动手</b>的线上故障指挥台。' +
      '告警会一条条砸过来，每个处置动作都要花时间——' +
      '而你花掉的每一秒，都在变成用户的<b>失败请求</b>。</p>' +
      '<div class="cta">' +
      '<button class="btn btn-primary" id="go">开始值班 →</button>' +
      '<button class="btn btn-ghost" id="howBtn">怎么玩</button>' +
      '<span class="tip">约 3 分钟一关</span>' +
      '</div>' +
      '<div class="hero-visual"><div class="hv-card">' +
      '<div class="hv-h"><span>告警流</span><i>● LIVE</i></div>' +
      '<div class="hv-al p2"><div class="l"><b>P2</b><span>T+00:00</span><span>gateway</span></div>' +

  /* ---------------- 游戏界面 ---------------- */
  function spark(g) {
    var h = g.hist, W = 100, H = 40;
    if (h.length < 2) return '';
    var maxE = 1;
    for (var i = 0; i < h.length; i++) if (h[i].e > maxE) maxE = h[i].e;
    var ymax = ymaxOf(g);
    var tmax = Math.max(g.t, 20);
    var pts = [], area = [];
    for (var k = 0; k < h.length; k++) {
      var x = (h[k].t / tmax) * W;
      var y = H - (clamp(h[k].e, 0, ymax) / ymax) * H;
      pts.push(x.toFixed(2) + ',' + y.toFixed(2));
      area.push(x.toFixed(2) + ',' + y.toFixed(2));
    }
    var line = pts.join(' ');
    var fill = '0,' + H + ' ' + area.join(' ') + ' ' + W + ',' + H;
    var col = g.err > 20 ? '#FF4D6D' : g.err > 5 ? '#FFB020' : '#2FD27D';
    var grid = '';
    [0.25, 0.5, 0.75].forEach(function (f) {
      var gy = (H * f).toFixed(2);
      grid += '<line x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" stroke="rgba(150,180,220,.10)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    });
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + col + '" stop-opacity=".30"/>' +
      '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
      grid +
      '<polygon points="' + fill + '" fill="url(#sg)"/>' +
      '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line x1="' + (W - 0.15) + '" y1="0" x2="' + (W - 0.15) + '" y2="' + H + '" stroke="' + col + '" stroke-width="1.5" opacity=".55" vector-effect="non-scaling-stroke"/>' +
      '</svg>';
  }
  function ymaxOf(g) {
    var m = 1; for (var i = 0; i < g.hist.length; i++) if (g.hist[i].e > m) m = g.hist[i].e;
    var need = m * 1.2, steps = [6, 10, 15, 20, 30, 40, 50, 65, 80, 100];
    for (var k = 0; k < steps.length; k++) if (steps[k] >= need) return steps[k];
    return 100;
  }

  function svcRows(g) {
    var bad = g.err > 22 ? 2 : g.err > 6 ? 1 : 0;
    return g.sc.svc.map(function (s, i) {
      var st = bad === 2 ? (i >= 2 ? 2 : 1) : bad === 1 ? (i >= 2 ? 1 : 0) : 0;
      if (g.done && !g.runaway) st = 0;
      var cls = st === 2 ? 'st-err' : st === 1 ? 'st-warn' : 'st-ok';
      var txt = st === 2 ? '异常' : st === 1 ? '过载' : '健康';
      return '<div class="svcrow"><span class="nm">' + esc(s.n) + '</span>' +
        '<span class="rl">' + esc(s.r) + '</span>' +
        '<span class="st ' + cls + '">' + txt + '</span></div>';
    }).join('');
  }

  function alertsHTML(g) {
    var list = g.alerts.slice(-14);
    if (!list.length) return '<div style="padding:18px 14px;color:var(--dim);font-size:12.5px">还没有告警。先主动查一下。</div>';
    return list.map(function (a) {
      var k = a.lv === 'P1' ? 'p1' : a.lv === 'P2' ? 'p2' : a.lv === 'P3' ? 'p3' : 'info';
      return '<div class="al ' + k + '"><div class="hd"><span class="lv">' + a.lv + '</span>' +
        '<span class="t">T+' + mmss(a.t) + '</span><span class="svc">' + esc(a.svc) + '</span></div>' +
        '<div class="msg">' + esc(a.msg) + '</div></div>';
    }).join('');
  }

  function tlHTML(g) {
    if (!g.recs.length) return '<div style="color:var(--dim);font-size:12px">你的每一个动作都会记在这里。</div>';
    return g.recs.map(function (r) {
      return '<div class="tl-i ' + r.lv + '"><span class="tt">' + mmss(r.t1) + '</span>' +
        '<span class="tx"><em>' + esc(r.label) + '</em> · ' + esc(r.log) + '</span></div>';

  function actsHTML(g) {
    var groups = [['diag', '诊断 · 拿信息'], ['stop', '止血 · 降错误率'], ['comm', '沟通 · 拿沟通分']];
    return groups.map(function (grp) {
      var items = g.sc.acts.filter(function (a) { return a.g === grp[0]; });

      return '<div class="agroup"><div class="gh">' + grp[1] + '<u>' + left + '</u></div>' +
        items.map(function (a) {
          var done = g.used[a.id];
          var locked = a.req && !g.flags[a.req];
          var durTxt = a.dur === 0 ? '并行' : a.dur + 's';
          return '<button class="act' + (done ? ' done' : '') + (!done && a.lv === 'bad' ? ' trap' : '') + '" data-act="' + a.id + '">' +
            '<div class="t">' + esc(a.t) + '<span class="dur' + (a.dur === 0 ? ' par' : '') + '">' + durTxt + '</span></div>' +
            '<div class="d">' + esc(a.d) + (locked && !done ? ' · 信息不足' : '') + '</div>' +
            '</button>';

      '<div class="panel-b" style="padding-top:2px;padding-bottom:6px">' + svcRows(g) + '</div></div>' +

      '<div class="col">' +

      '<span class="ylab b">0</span>' + spark(g) + '</div></div></div>' +

      '<div class="panel grow"><div class="panel-h"><b>操作时间轴</b><span class="r">' + g.recs.length + ' 个动作</span></div>' +
      '<div class="tl" id="tlBox">' + tlHTML(g) + '</div></div>' +

      '<div class="panel" style="flex:none;display:block;padding:13px 16px;font-size:12.5px;color:var(--dim);line-height:1.7">' +
      '<b style="color:var(--txt2)">判据</b> · 错误率 <b style="color:var(--green)">1%</b> 以下才算止血成功，盲目操作只会白烧时间。</div>' +

      '<div class="actions" id="actBox">' + actsHTML(g) + '</div></div></div>' +

  /* ---------------- 结算 ---------------- */
  function resultHTML() {
    var g = G, sc = g.sc, R = RESULT;

    var gr = R.grade;
    var colMap = { S: 'var(--amber)', A: 'var(--green)', B: 'var(--cyan)', C: 'var(--txt2)', D: 'var(--red)' };
    var col = colMap[gr];

    var rows = [['止血速度', R.speed, 40], ['影响控制', R.imp, 30], ['决策质量', R.dec, 20], ['沟通协作', R.comm, 10]];
    var scoreHTML = rows.map(function (r) {
      var ratio = r[1] / r[2];
      var bc = ratio >= 0.99 ? 'linear-gradient(90deg,#FFB020,#FF8B5E)'
        : ratio >= 0.5 ? 'linear-gradient(90deg,#FF6A3D,#FFB020)'
          : 'linear-gradient(90deg,#FF4D6D,#FF6A3D)';
      return '<div class="sc"><span class="nm">' + r[0] + '</span>' +

        '<span class="vl">' + r[1] + ' / ' + r[2] + '</span></div>';
    }).join('');

    var comment = makeComment(g, R);
    var lessonHTML = sc.lesson.points.map(function (p) { return '<li>' + p + '</li>'; }).join('');
    var cmp = '<div class="compare">' +
      '<div class="row"><span>止血时间 · 你</span><b>' + mmss(R.mttr) + '</b></div>' +
      '<div class="row"><span>止血时间 · 满分路径</span><b>' + mmss(b.t) + '</b></div>' +
      '<div class="row"><span>失败请求 · 你</span><b>' + num(g.impact) + '</b></div>' +
      '<div class="row"><span>失败请求 · 满分路径</span><b>' + num(b.i) + '</b></div>' +
      '<div class="row"><span>错误决策 / 临时方案</span><b>' + g.trapped + ' / ' + g.temps + '</b></div>' +
      '</div>' +
      '<p style="font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:10px">' +
      '沟通动作是并行的、不占时间，但它值 10 分——不做沟通，最多只能拿 90 分（A）。</p>';

    var recsHTML = g.recs.map(function (r) {
      return '<div class="tl-i ' + r.lv + '"><span class="tt">' + mmss(r.t1) + '</span>' +
        '<span class="tx"><em>' + esc(r.label) + '</em> · ' + esc(r.log) + '</span></div>';
    }).join('');

    var prev = store()[sc.id];
    var isNew = !prev || R.total > prev.total;
    var nextIdx = window.SCENARIOS.findIndex(function (x) { return x.id === sc.id; }) + 1;
    var next = window.SCENARIOS[nextIdx];

    return '<div class="result">' +
      '<div class="rgrade"><div class="big" style="color:' + col + '">' + gr + '</div>' +
      '<div class="txt"><h2>' + gradeTitle(gr) + ' · ' + R.total + ' 分</h2>' +
      '<p>' + esc(comment) + (isNew ? ' <span class="pill" style="vertical-align:2px">新纪录</span>' : '') + '</p></div></div>' +

      '<div class="rstats">' +
      '<div class="s"><span>MTTR</span><b>' + mmss(R.mttr) + '</b></div>' +
      '<div class="s"><span>失败请求</span><b>' + num(g.impact) + '</b></div>' +
      '<div class="s"><span>执行动作</span><b>' + g.recs.length + '<i>个</i></b></div>' +
      '<div class="s"><span>错误决策</span><b>' + g.trapped + '<i>个</i></b></div>' +

      '<div class="tl" style="max-height:230px;padding:0">' + recsHTML + '</div></div>' +
      '<div class="rbox"><h4><span class="i">02</span>你和满分路径差在哪</h4>' + cmp +
      '<div style="margin-top:18px" class="pill">最优路径：' +
      sc.bestPath.map(function (id) {
        var a = sc.acts.find(function (x) { return x.id === id; });
        return a ? a.t : id;
      }).join(' → ') + '</div></div>' +
      '</div>' +

      '<div class="rbox" style="margin-bottom:22px"><h4><span class="i">03</span>' + esc(sc.lesson.title) + '</h4>' +
      '<ul>' + lessonHTML + '</ul></div>' +

      '<div class="ractions">' +
      '<button class="btn btn-primary" id="shareCard">生成我的救火战绩卡</button>' +
      '<button class="btn btn-ghost" id="retry">再打一次</button>' +
      (next ? '<button class="btn btn-ghost" id="nextLv">下一关：' + esc(next.name) + '</button>' : '') +
      '<button class="btn btn-ghost" id="backHome">回到首页</button>' +
      '</div></div>';
  }

  function makeComment(g, R) {
    var parts = [];
    if (g.runaway) parts.push('时间耗尽，事故升级——出现这种情况通常是因为一直在做无效动作。');
    else if (R.mttr <= R.best.t * 1.2) parts.push('止血速度接近理论最优，你这套判断很干净。');
    else if (R.mttr <= R.best.t * 1.8) parts.push('止血速度还行，但中间有几秒其实是白花的。');
    else parts.push('花了太多时间在无效动作上——故障期间，犹豫本身就是成本。');

    if (g.trapped >= 3) parts.push('而且你踩了 ' + g.trapped + ' 个陷阱动作，其中有的让故障更严重了。');
    else if (g.trapped === 0) parts.push('全程没有一个错误决策，这在真实 oncall 里非常难得。');
    else parts.push('有 ' + g.trapped + ' 个错误决策，好在没把故障放大。');

    if (commCount(g) >= 2) parts.push('沟通也没落下。');
    else parts.push('沟通分基本空着——真实事故里，同步信息往往比修代码更重要。');
    return parts.join('');
  }

  /* ---------------- 战绩卡（Canvas） ---------------- */
  function makeCard() {
    var g = G, sc = g.sc, R = RESULT;
    var W = 1080, H = 1350;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d');
    var colMap = { S: '#FFB020', A: '#2FD27D', B: '#45C8F1', C: '#A9BACC', D: '#FF4D6D' };
    var col = colMap[R.grade];
    var P = 84, CW = W - P * 2;

    /* 背景 */
    x.fillStyle = '#070B10'; x.fillRect(0, 0, W, H);
    var grd = x.createRadialGradient(840, 100, 0, 840, 100, 760);
    grd.addColorStop(0, 'rgba(255,106,61,.22)'); grd.addColorStop(1, 'rgba(255,106,61,0)');
    x.fillStyle = grd; x.fillRect(0, 0, W, H);
    var grd2 = x.createRadialGradient(100, 1180, 0, 100, 1180, 660);
    grd2.addColorStop(0, 'rgba(69,200,241,.13)'); grd2.addColorStop(1, 'rgba(69,200,241,0)');
    x.fillStyle = grd2; x.fillRect(0, 0, W, H);

    /* 网格 */
    x.strokeStyle = 'rgba(150,180,220,.055)'; x.lineWidth = 1;
    for (var i = 0; i <= W; i += 54) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
    for (var j = 0; j <= H; j += 54) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }

    x.textBaseline = 'top'; x.textAlign = 'left';

    /* 顶栏 */
    x.font = '600 25px ui-monospace, Menlo, Consolas, monospace';
    x.fillStyle = '#FF6A3D'; x.fillText('ONCALL  ·  03:00 AM', P, 84);
    x.textAlign = 'right'; x.fillStyle = '#63788E';
    x.fillText('INCIDENT REPORT', W - P, 84); x.textAlign = 'left';

    x.fillStyle = '#E7EEF7';
    x.font = '800 66px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    x.fillText('我的救火战绩', P, 138);

    /* 等级环 */
    var cx = W - P - 118, cy = 330, rr = 108;
    x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI * 2);
    x.strokeStyle = 'rgba(150,180,220,.15)'; x.lineWidth = 3; x.stroke();
    x.beginPath(); x.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(R.total / 100, 0.02, 1));
    x.strokeStyle = col; x.lineWidth = 10; x.lineCap = 'round'; x.stroke();
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = col; x.font = '800 112px ui-monospace, Menlo, monospace';
    x.fillText(R.grade, cx, cy + 4);
    x.textBaseline = 'top'; x.textAlign = 'left';

    /* 关卡 */
    x.font = '600 22px ui-monospace, Menlo, monospace'; x.fillStyle = '#63788E';
    x.fillText('INCIDENT ' + sc.no + '  ·  ' + sc.diff, P, 252);
    x.fillStyle = '#E7EEF7'; x.font = '800 56px -apple-system, "PingFang SC", sans-serif';
    x.fillText(sc.name, P, 290);
    x.fillStyle = '#A9BACC'; x.font = '400 26px -apple-system, "PingFang SC", sans-serif';
    x.fillText(sc.sub, P, 364);
    x.fillStyle = '#FF6A3D'; x.font = '700 30px ui-monospace, Menlo, monospace';
    x.fillText(R.total + ' 分', P, 408);

    /* 四格数据 */
    var stats = [
      ['MTTR', mmss(R.mttr)],
      ['失败请求', num(g.impact)],
      ['执行动作', g.recs.length + ''],
      ['错误决策', g.trapped + '']
    ];
    var sy = 476, gap = 16, cw = (CW - gap * 3) / 4, ch = 136;
    stats.forEach(function (s, k) {
      var bx = P + k * (cw + gap);
      x.fillStyle = 'rgba(15,23,33,.9)';
      roundRect(x, bx, sy, cw, ch, 16); x.fill();
      x.strokeStyle = 'rgba(150,180,220,.15)'; x.lineWidth = 1.5; x.stroke();
      x.fillStyle = '#63788E'; x.font = '500 17px ui-monospace, monospace';
      x.fillText(s[0], bx + 20, sy + 22);
      x.fillStyle = k === 3 && g.trapped > 0 ? '#FF4D6D' : '#E7EEF7';
      x.font = '700 40px ui-monospace, monospace';
      x.fillText(s[1], bx + 20, sy + 62);
    });

    /* 四维得分 */
    var dims = [['止血速度', R.speed, 40], ['影响控制', R.imp, 30], ['决策质量', R.dec, 20], ['沟通协作', R.comm, 10]];
    var dy = 662;
    dims.forEach(function (d, k) {
      var yy = dy + k * 52;
      x.fillStyle = '#8A9CB2'; x.font = '400 22px -apple-system, "PingFang SC", sans-serif';
      x.fillText(d[0], P, yy - 4);
      var bx = P + 150, bw2 = CW - 150 - 92;
      x.fillStyle = 'rgba(150,180,220,.13)';
      roundRect(x, bx, yy, bw2, 9, 5); x.fill();
      var ratio = d[1] / d[2];
      if (ratio > 0.01) {
        x.fillStyle = ratio >= 0.99 ? '#FFB020' : ratio >= 0.7 ? '#FF6A3D' : '#FF4D6D';
        roundRect(x, bx, yy, Math.max(bw2 * ratio, 9), 9, 5); x.fill();
      }
      x.fillStyle = '#E7EEF7'; x.font = '600 21px ui-monospace, monospace';
      x.textAlign = 'right'; x.fillText(d[1] + '/' + d[2], W - P, yy - 4); x.textAlign = 'left';
    });

    /* 点评 */
    var cy2 = 905;
    x.fillStyle = 'rgba(255,106,61,.09)';
    roundRect(x, P, cy2, CW, 208, 18); x.fill();
    x.strokeStyle = 'rgba(255,106,61,.30)'; x.lineWidth = 1.5; x.stroke();
    x.fillStyle = '#FF6A3D'; x.font = '600 19px ui-monospace, monospace';
    x.fillText('复盘点评', P + 30, cy2 + 24);
    x.fillStyle = '#D5E0EC'; x.font = '400 27px -apple-system, "PingFang SC", sans-serif';
    wrap(x, makeComment(g, R), P + 30, cy2 + 62, CW - 60, 42, 4);

    /* 底栏 */
    var fy = H - 128;
    x.fillStyle = 'rgba(150,180,220,.15)'; x.fillRect(P, fy - 30, CW, 1);
    x.fillStyle = '#E7EEF7'; x.font = '700 26px -apple-system, "PingFang SC", sans-serif';
    x.fillText('凌晨三点 · Oncall 指挥台', P, fy);
    x.fillStyle = '#5C7086'; x.font = '400 20px ui-monospace, monospace';
    x.fillText('你花的每一秒，都是用户的失败请求', P, fy + 44);
    x.textAlign = 'right';
    x.fillStyle = '#FF6A3D'; x.font = '600 20px ui-monospace, monospace';
    x.fillText('#凌晨三点  #故障演练', W - P, fy + 44);
    x.textAlign = 'left';

    return c;
  }
  function roundRect(x, a, b, w, h, r) {
    x.beginPath();
    x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r);
    x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r);
    x.arcTo(a, b, a + w, b, r); x.closePath();
  }
  function wrap(x, text, px, py, maxW, lh, maxLines) {
    var chars = String(text).split('');
    var line = '', lines = [];
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (x.measureText(test).width > maxW && line) { lines.push(line); line = chars[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] += '…'; }
    lines.forEach(function (l, k) { x.fillText(l, px, py + k * lh); });
  }

  /* ---------------- 分享 ---------------- */
  function showShare() {
    var c = makeCard();
    var url = c.toDataURL('image/png');
    var g = G, R = RESULT;
    var text = '我在《凌晨三点 · Oncall 指挥台》里，用 ' + mmss(R.mttr) + ' 把「' + g.sc.name + '」救了回来，评级 ' + R.grade + '。\n' +
      '这个作品最扎心的地方是：你每点一个动作，时间就往前走，而每一秒都在变成用户的失败请求。\n' +
      '#凌晨三点 #故障演练';

    var o = el('<div class="overlay" id="ovShare"><div class="sheet" style="width:min(560px,100%)">' +
      '<div class="k">SHARE CARD</div>' +
      '<h2>你的救火战绩卡</h2>' +
      '<p class="st">3:4 比例，直接发小红书 / 朋友圈都合适</p>' +
      '<img class="shareimg" src="' + url + '" alt="战绩卡">' +
      '<div class="sharetxt" id="shareTxt">' + esc(text) + '</div>' +
      '<div class="acts">' +
      '<button class="btn btn-ghost" id="cpTxt">复制文案</button>' +
      '<button class="btn btn-primary" id="dlCard" disabled title="安装后可保存战绩卡">安装后可保存战绩卡</button>' +
      '</div></div></div>');
    document.body.appendChild(o);
    o.onclick = function (e) { if (e.target === o) o.remove(); };

    o.querySelector('#dlCard').onclick = function () {
      var a = document.createElement('a');
      a.download = 'oncall-' + g.sc.id + '-' + R.grade + '.png';
      a.href = url; a.click();
      toast('战绩卡已保存。');
    };
    o.querySelector('#cpTxt').onclick = function () {
      var t = text;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () { toast('文案已复制，直接粘贴即可'); })
          .catch(function () { fallbackCopy(t); });
      } else fallbackCopy(t);
    };
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('文案已复制'); } catch (e) { toast('复制失败，请手动选择文本'); }
    ta.remove();
  }

  /* ---------------- 渲染 & 事件 ---------------- */
  function render() {
    if (view === 'home') {
      app.innerHTML = heroHTML();
      app.querySelectorAll('.lv').forEach(function (b) {
        b.onclick = function () { openBrief(b.dataset.lv); };
      });
      document.getElementById('go').onclick = function () { openBrief(window.SCENARIOS[0].id); };
      document.getElementById('howBtn').onclick = showHow;
    } else if (view === 'game') {
      app.innerHTML = gameHTML();
      var ab = document.getElementById('alertBox');
      if (ab) ab.scrollTop = ab.scrollHeight;
      var tb = document.getElementById('tlBox');
      if (tb) tb.scrollTop = tb.scrollHeight;
      bindGame();
      if (BRIEF) { app.appendChild(el(briefHTML(G.sc))); bindBrief(); }
    } else if (view === 'result') {
      app.innerHTML = resultHTML();
      bindResult();
    }
  }

  function showHow() {
    var o = el('<div class="overlay" id="ov"><div class="sheet">' +
      '<div class="k">HOW TO PLAY</div><h2>三句话学会</h2>' +
      '<p class="st">不用读文档，进关卡点两下就懂了</p>' +
      '<div class="rulebox" style="margin-top:20px"><b>1 · 时间只在你操作时前进</b>' +
      '<ul><li>点一个动作，时间就往前走它标示的秒数。诊断 35 秒、回滚 45 秒、扩容 90 秒。</li>' +
      '<li>这几十秒里，故障一直在产生失败请求，实时累加在顶部。</li>' +
      '<li>只有沟通类动作是「并行」的——不占时间，但能拿 10 分沟通分。</li></ul></div>' +
      '<div class="rulebox"><b>2 · 诊断决定你能不能找对位置</b>' +
      '<ul><li>有些止血动作需要先拿到关键信息才有效——信息不足时点下去，可能白花时间。</li>' +
      '<li>但也不是查得越多越好：每查一项，都在烧用户的时间。</li></ul></div>' +
      '<div class="rulebox"><b>3 · 结算看四个维度</b>' +
      '<ul><li>止血速度 40 分 · 影响控制 30 分 · 决策质量 20 分 · 沟通协作 10 分。</li>' +
      '<li>评级 S / A / B / C / D，通关后可以生成战绩卡。</li></ul></div>' +
      '<div class="acts"><button class="btn btn-primary" id="closeHow">明白了</button></div>' +
      '</div></div>');
    document.body.appendChild(o);
    o.querySelector('#closeHow').onclick = function () { o.remove(); };
    o.onclick = function (e) { if (e.target === o) o.remove(); };
  }

  function openBrief(id) {
    var sc = window.SCENARIOS.find(function (s) { return s.id === id; });
    if (!sc) return;
    G = newGame(sc); RESULT = null; view = 'game'; BRIEF = true; render();
  }

  function bindBrief() {
    var ov = document.getElementById('ov');
    if (!ov) return;
    ov.querySelector('#cancelB').onclick = function () { BRIEF = null; view = 'home'; render(); };
    ov.querySelector('#startB').onclick = function () { BRIEF = null; render(); };
  }

  function bindGame() {
    document.getElementById('backHome').onclick = function () {
      if (G && !G.done && G.recs.length && false) return;
      BRIEF = null; view = 'home'; render();
    };
    document.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var r = act(G, b.dataset.act);
        if (!r) return;
        if (G.done) { finish(); return; }
        render();
        toast(r.label + ' · ' + r.log);
      };
    });
  }

  function finish() {
    RESULT = scoreOf(G);
    var s = store();
    var prev = s[G.sc.id];
    if (!prev || RESULT.total > prev.total) {
      s[G.sc.id] = { total: RESULT.total, grade: RESULT.grade, mttr: RESULT.mttr, impact: Math.round(G.impact), ts: Date.now() };
      persist(s);
    }
    view = 'result'; render();
    window.scrollTo(0, 0);
  }

  function bindResult() {
    document.getElementById('retry').onclick = function () { openBrief(G.sc.id); };
    var nx = document.getElementById('nextLv');
    if (nx) nx.onclick = function () {
      var i = window.SCENARIOS.findIndex(function (x) { return x.id === G.sc.id; });
      openBrief(window.SCENARIOS[i + 1].id);
    };
    document.getElementById('backHome').onclick = function () { view = 'home'; render(); };
    document.getElementById('shareCard').onclick = function () { showShare(); };
  }

  /* 启动 */
  render();
})();
}

function demoReset(){ document.querySelectorAll(".overlay,.toast").forEach(function(e){e.remove();}); document.getElementById("app").innerHTML=""; demoStart(); }</script></body></html>
