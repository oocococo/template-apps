<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
		/* ==========Dark Color Style========== */
		:root {
			--bg: #0f1419;
			--panel: #171e26;
			--panel2: #1d2630;
			--panel3: #233040;
			--bg-alt: #1a222c;
			--line: #2a3644;
			--txt: #E8E8E8;
			--dim: #8496a9;

			--primary-color: #00B0F0;
			--dark-color: #E8E8E8;
			--border-color: #2a3644;
			--text-color: #E8E8E8;
			--text-light: #8496a9;
		}

		/* Input placeholders (text shown before the user types) keep the same
		   dim white as the header info line and the footer */
		::placeholder {
			color: var(--text-light);
			opacity: 1;
		}

		body {
			font-family: 'Segoe UI', 'Microsoft YaHei', 'Arial', 'sans-serif', 'Heiti SC';
			font-size: 14px;
			color: var(--text-color);
			line-height: 1.5;
			background-color: var(--bg);
			margin: 0;
			padding: 20px;
		}

		.paper {
			background-color: var(--panel);
			box-sizing: border-box;
			width: 1262px;          /* 1200px content + 2 × 30px padding + 2 × 1px border */
			margin: 0 auto;         /* center the fixed-width layout in the browser */
			padding: 30px;
			border-radius: 12px;
			border: 1px solid var(--line);
			box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
			position: relative;
			overflow: hidden;
		}

		.paper::before {
			content: "";
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 15px;
			background: linear-gradient(135deg, #0891b2 0%, #2563eb 100%);
		}

		h1, h2, h3 {
			color: var(--dark-color);
			margin-top: 0;
			margin-bottom: 0.5em;
		}

		/* Banner-style page header: purple rounded icon + two-line title block on
		   the left, green-dot status pill on the right (plant-tool style) */
		.site-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			flex-wrap: wrap;
			padding: 14px 22px;
			border-radius: 12px;
			background: linear-gradient(90deg, #0e3358 0%, #113e69 45%, #0d2c4c 100%);
			margin-bottom: 20px;
		}

		/* Right column: the status pill is vertically centred on its own */

		.site-brand {
			display: flex;
			align-items: center;
			gap: 16px;
			min-width: 0;
		}

		.site-icon {
			flex: 0 0 auto;
			width: 46px;
			height: 46px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 10px;
			background: linear-gradient(135deg, #7c5cf5, #6a48ef);
			color: #ffffff;
			font-size: 26px;
			font-weight: 700;
			box-shadow: 0 2px 10px rgba(114, 82, 244, 0.45);
		}

		.site-titles h1 {
			margin: 0;
			padding: 0;
			border: none;
			text-align: left;
			font-size: 24px;
			line-height: 1.25;
			letter-spacing: 0.5px;
			color: #E8E8E8;
		}

		.site-titles h1 span {
			color: #FFD24A;
		}

		.header-info {
			color: var(--text-light);
			font-size: 13px;
			margin: 4px 0 0;
			text-align: left;
		}

		.site-badge {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 7px 14px;
			border-radius: 999px;
			background: rgba(4, 12, 22, 0.45);
			border: 1px solid rgba(232, 232, 232, 0.14);
			color: #E8E8E8;
			font-size: 13px;
			white-space: nowrap;
		}

		.site-badge-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #35E08C;
			box-shadow: 0 0 6px rgba(53, 224, 140, 0.9);
		}

		h2 {
			font-size: 1.25em;
			font-weight: 600;
		}

		h3 {
			font-size: 1.05em;
			font-weight: 600;
			color: var(--primary-color);
		}

		.input-section {
			border: 1px solid var(--line);
			background-color: var(--panel2);
			padding: 20px;
			border-radius: 10px;
			margin-bottom: 20px;
		}

		textarea {
			width: 100%; 
			height: 200px; 
			margin-bottom: 15px; 
			resize: vertical; 
			padding: 10px; 
			background-color: var(--bg);
			color: var(--txt);
			border: 1px solid var(--border-color); 
			border-radius: 4px; 
			font-family: Consolas, monospace; 
			transition: border 0.3s; 
			box-sizing: border-box; 
		}

		textarea:focus {
			border-color: var(--primary-color);
			outline: none;
			box-shadow: 0 0 0 2px rgba(0, 176, 240, 0.25);
		}

		/* SPD library controls at the top-right of the input section */
		.input-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			flex-wrap: wrap;
			/* keep the heading's original outer spacing here instead of on the
			   h2 itself, so the library controls centre exactly on the heading
			   text line (flex centres margin boxes, not text) */
			margin: 15px 0;
		}

		.input-header h2 {
			margin: 0;
		}

		.lib-controls {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.lib-load-btn {
			display: inline-block;
			padding: 7px 14px;
			background-color: var(--panel3);
			color: var(--txt);
			border: 1px solid var(--border-color);
			border-radius: 4px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
			transition: border 0.3s, color 0.3s;
		}

		.lib-load-btn:hover {
			border-color: var(--primary-color);
			color: var(--primary-color);
		}

		.lib-controls select {
			padding: 7px 10px;
			background-color: var(--bg);
			color: var(--txt);
			border: 1px solid var(--border-color);
			border-radius: 4px;
			max-width: 300px;
			font-size: 13px;
			cursor: pointer;
		}

		.lib-controls select:disabled {
			opacity: 0.55;
			cursor: not-allowed;
		}

		.input-group {
			display: flex;
			gap: 10px;
			margin-bottom: 15px;
			align-items: center;
		}

		input[type="number"] {
			padding: 8px 12px;
			background-color: var(--bg);
			color: var(--txt);
			border: 1px solid var(--border-color);
			border-radius: 4px;
			width: 150px;
		}

		input[type="number"]:focus {
			outline: none;
			border-color: var(--primary-color);
		}

		button {
			background-color: var(--panel3);
			color: var(--txt);
			border: 1px solid var(--line);
			padding: 8px 16px;
			border-radius: 6px;
			cursor: pointer;
			font-weight: 500;
			transition: background-color 0.3s, border-color 0.3s, color 0.3s;
		}

		button:hover {
			border-color: var(--primary-color);
			color: var(--primary-color);
		}

		button:active {
			transform: translateY(1px);
		}

		/* Main Button */
		button.btn-primary {
			background: linear-gradient(135deg, #0891b2, #2563eb);
			border: none;
			color: #E8E8E8;
			font-weight: 600;
		}

		button.btn-primary:hover {
			color: #E8E8E8;
			filter: brightness(1.15);
		}

		/* Transient message shown next to the buttons, fades out after 3 s */
		.toast-msg {
			display: inline-block;
			margin-left: 12px;
			font-size: 13px;
			color: var(--primary-color);
			vertical-align: middle;
			opacity: 0;
			transition: opacity 0.3s;
			pointer-events: none;
		}

		.toast-msg.show {
			opacity: 1;
		}

		/* Top chart row: shares the same 20px gutter as the parameter-card row
		   below, so that
		     - the right edge of the spectral chart lines up with the right edge
		       of the 2nd parameter card (TM-30), and
		     - the left edge of the CIE 1931 chart lines up with the left edge of
		       the 3rd parameter card (Horticulture), while its right edge keeps
		       the previous alignment with the right edge of the panel.
		   Card columns are (1200 - 2 borders - 40 padding - 15 scrollbar - 40 gaps) / 3
		   = 367.67px, so col1 = 0..367.67, col2 = 387.67..755.33, col3 = 775.33..1143.
		   Relative to the chart row start (1px left of the card row border box):
		   spectral span = 777.3px, CIE span = 404.7px, gutter = 20px.   */
		.main-container {
			display: flex;
			gap: 20px;
			height: 400px;
			width: 1202px;
			margin-top: 15px;
			margin-left: -1px;
		}

		.canvasSpectral-container {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 400px;
			width: 777.3px;
		}

		.canvasCie-container {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 400px;
			width: 404.7px;
		}

		canvas {
			border: 1px solid var(--line);
			background-color: var(--panel2);
			border-radius: 8px;
			position: absolute;
			top: 0;
			left: 0;
		}

		#coordinateCanvas {
			z-index: 1;
			background-color: transparent;
		}

		.tooltip {
			position: absolute;
			background: rgba(15, 20, 25, 0.94);
			color: #E8E8E8;
			border: 1px solid var(--line);
			border-radius: 4px;
			padding: 8px 12px;
			font-size: 12px;
			pointer-events: none;
			display: none;
			z-index: 100;
		}

		.results-container {
			background-color: var(--panel);
			border: 1px solid var(--line);
			padding: 20px;
			border-radius: 10px;
			margin-top: 20px;
			margin-bottom: 15px;
			display: flex;
			gap: 20px;
			flex-wrap: wrap;
			align-items: stretch;
			max-height: 70vh;
			overflow-y: auto;
			/* Always reserve the scrollbar width so the three card columns keep a
			   deterministic width and stay aligned with the charts above. */
			scrollbar-gutter: stable;
		}

		.result-card1 {
			background-color: var(--panel2);
			border: 1px solid var(--line);
			padding: 15px;
			border-radius: 8px;
			flex: 1;
			min-width: 300px;
		}

		.result-card2 {
			position: relative;
			background-color: var(--panel2);
			border: 1px solid var(--line);
			padding: 15px;
			border-radius: 8px;
			width: 100%;
			box-sizing: border-box;
		}

		.tm30-grid {
			display: flex;
			gap: 16px;
			align-items: stretch;
			margin-top: 8px;
		}

		.tm30-side {
			display: flex;
			flex-direction: column;
			gap: 14px;
			flex: 1;
			min-width: 0;
		}

		.tm30-grid canvas,
		#tm30-ces {
			position: static;
			border-radius: 6px;
		}

		/* Scale the TM-30 charts with the card width so the panel never
		   overflows the results column on narrower windows. The hue-bin
		   graphic is widened (41.5%) so its bottom edge lines up with the
		   bar-chart column; the bar canvases flex to absorb the residual
		   few pixels so both columns always end at the same height. */
		#tm30-vector {
			width: 41.5%;
			height: auto;
		}

		.tm30-side canvas {
			flex: 1 1 auto;
			min-height: 0;
			width: 100%;
			height: auto;
			display: block;
		}

		#tm30-ces {
			width: 100%;
			height: auto;
			display: block;
		}

		/* Floating readout shown when hovering a sample bar (Rf,ces) */
		.tm30-tip {
			position: absolute;
			display: none;
			pointer-events: none;
			z-index: 50;
			background-color: #1f9d55;
			color: #E8E8E8;
			font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
			font-size: 12px;
			font-weight: bold;
			padding: 3px 9px;
			border-radius: 4px;
			white-space: nowrap;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
		}

		.result-value {
			font-weight: bold;
			color: var(--primary-color);
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin: 0;
		}

		th, td {
			border: 1px solid var(--border-color);
			padding: 10px;
			text-align: center;
			width: 25%;
		}

		th {
			background-color: var(--panel3);
			color: var(--dim);
			font-weight: 600;
		}

		tr:nth-child(even) {
			background-color: var(--bg-alt);
		}

		tr:hover {
			background-color: #263445;
		}

		.ri-table td {
			color: #E8E8E8;
			font-weight: bold;
			text-shadow: 0 1px 1px rgba(0,0,0,0.3);
		}

		.legend {
			display: flex;
			flex-wrap: wrap;
			gap: 15px;
			margin: 0;
			padding: 10px;
			background-color: var(--panel2);
			border-radius: 8px;
			border: 1px solid var(--line);
		}

		.legend-item {
			display: flex;
			align-items: center;
			gap: 5px;
		}

		.legend-label {
			display: flex;
			align-items: center;
			gap: 5px;
			cursor: pointer;
			position: relative;
		}

		.legend-label input[type="checkbox"] {
			position: absolute;
			left: 0;
			top: 0;
			width: 20px;
			height: 20px;
			margin: 0;
			z-index: 2;
			opacity: 0;
			cursor: pointer;
		}

		.legend-label input[type="checkbox"] + .legend-color {
			width: 20px;
			height: 20px;
			border-radius: 3px;
			position: relative;
			z-index: 1;
			cursor: pointer;
		}

		.legend-label input[type="checkbox"]:checked + .legend-color::after {
			content: '✔';
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			font-size: 14px;
			color: #E8E8E8;
			text-shadow: 0 0 3px #000;
			z-index: 3; 
		}

		.footer {
			display: flex;
			align-items: center;
			justify-content: center;
			/* 20 px above = the regular module spacing; the bottom gap comes
			   from the .paper frame padding */
			margin-top: 20px;
			padding: 4px 15px;
			border: 1px solid var(--border-color);
			border-radius: 8px;
			background-color: var(--panel2);
			color: var(--text-light);
			font-size: 0.9em;
		}

		@media (max-width: 768px) {
			.input-group {
				flex-direction: column;
				align-items: flex-start;
			}

			input[type="number"] {
				width: 100%;
			}

			button {
				width: 100%;
				margin-bottom: 10px;
			}
		}
	
/* Keep the same panels and charts usable in a narrow viewport. */
@media (max-width: 768px) {
  body { padding: 10px; }
  .paper { width: 100%; padding: 20px 12px; }
  .site-header { padding: 12px; gap: 10px; }
  .site-titles { min-width: 0; }
  .site-titles h1 { font-size: 19px; overflow-wrap: anywhere; }
  .header-info { overflow-wrap: anywhere; }
  .input-section { padding: 12px; }
  .input-header { flex-wrap: wrap; gap: 8px; }
  .lib-controls { flex-wrap: wrap; max-width: 100%; }
  .legend { gap: 8px; }
  .main-container { width: 100%; height: auto; margin-left: 0; flex-direction: column; }
  .canvasSpectral-container { width: 100%; height: auto; aspect-ratio: 2 / 1; }
  .canvasCie-container { width: 100%; max-width: 400px; height: auto; aspect-ratio: 1; }
  .main-container canvas { width: 100% !important; height: 100% !important; box-sizing: border-box; }
  .results-container { padding: 10px; max-height: none; }
  .result-card1 { min-width: 0; flex: 1 1 100%; }
  .result-card2 { overflow-x: auto; }
  .result-card2 table { min-width: 700px; }
  .tm30-grid { min-width: 600px; }
  #tm30-ces { min-width: 600px; }
}

.preview-canvas{position:static;width:100%;height:260px}.preview-note{color:#b9c8d8}</style></head><body>
	<div class="paper">
		<div class="site-header">
			<div class="site-brand">
				<div class="site-icon">P</div>
				<div class="site-titles">
					<h1>Pascal <span>Multi-Function Lighting Calculator</span></h1>
					<div class="header-info">
						Author: Pascal.Kang &nbsp;•&nbsp; Version: 1.0.1 &nbsp;•&nbsp; License: GPL-3.0-only
					</div>
				</div>
			</div>
			<div class="site-badge"><span class="site-badge-dot"></span>Spectral Calculator</div>
		</div>

		<div class="input-section">
			<div class="input-header">
				<h2>Input Spectral Data</h2>
				
			</div>
			<textarea id="spectrum" placeholder="Paste spectral data copied from Excel here:

Option 1 (two columns: wavelength + intensity):
380    0.52
385    0.48
390    0.71
...
760    1.13

Option 2 (single column of values, e.g. 401 rows for 380-780 nm @ 1 nm):
0.52
0.48
...

Comma / space / tab separators and a single-line layout are also supported"></textarea>

			<div class="input-group">
				<input type="number" id="wpe" placeholder="WPE (%) Default: 70" min="0" max="100" step="0.1">
				<button onclick="normalizeAndSmooth()">Normalize & Smooth</button>
				<button onclick="calculate()" class="btn-primary">Calculate Parameters</button>
			</div>
		</div>

		<p class="preview-note">示例体验：光谱数据仅留在本页。完整指标和文件功能在安装后使用。</p><button onclick="resetExample()">恢复示例</button><h2>Spectral Curve</h2><canvas class="preview-canvas" id="chart" width="900" height="300"></canvas><p id="feedback"></p></div><script>function parseSpectralInput(raw) {
			const lines = raw.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.length);
			if (!lines.length) return { ok: false, error: 'The input box is empty.' };
			const tokenLines = lines.map(l => l.split(/[\s,;\t]+/).filter(t => t.length));
			const num = t => { const v = parseFloat(t); return isNaN(v) ? null : v; };

			let values;
			// single-column mode: one value per line, or everything on one line
			const singleColumn = tokenLines.length === 1 || tokenLines.every(tl => tl.length === 1);
			if (singleColumn) {
				const vals = [];
				for (const tl of tokenLines) {
					for (const t of tl) {
						const v = num(t);
						if (v === null) return { ok: false, error: 'Non-numeric value found in the single-column data.' };
						vals.push(v);
					}
				}
				if (vals.length === 401) {
					values = vals; // 380-780 nm @ 1 nm directly
				} else if (vals.length >= 2) {
					// spread evenly: first = 380 nm, last = 780 nm
					const step = 400 / (vals.length - 1);
					values = [];
					for (let wl = 380; wl <= 780; wl++) {
						const pos = (wl - 380) / step;
						const i = Math.min(Math.floor(pos), vals.length - 2);
						const f = pos - i;
						values.push(vals[i] * (1 - f) + vals[i + 1] * f);
					}
				} else {
					return { ok: false, error: 'A single value cannot define a spectrum. Provide at least two values.' };
				}
			} else {
				// two-column mode: wavelength + intensity per line
				const pts = [];
				for (const tl of tokenLines) {
					if (tl.length < 2) return { ok: false, error: 'Two-column data rows need both a wavelength and a value (found a row with a single number).' };
					const w = num(tl[0]), v = num(tl[1]);
					if (w === null || v === null) return { ok: false, error: 'Non-numeric wavelength or value found in the two-column data.' };
					pts.push([w, v]);
				}
				pts.sort((a, b) => a[0] - b[0]);
				if (pts.length < 2) return { ok: false, error: 'At least two data points are required.' };
				values = [];
				let k = 0;
				for (let wl = 380; wl <= 780; wl++) {
					while (k < pts.length - 2 && pts[k + 1][0] < wl) k++; // advance bracket
					if (wl < pts[0][0] || wl > pts[pts.length - 1][0]) {
						values.push(0); // outside the provided range -> pad with 0
					} else if (pts[k + 1][0] === pts[k][0]) {
						values.push(pts[k][1]);
					} else {
						const f = (wl - pts[k][0]) / (pts[k + 1][0] - pts[k][0]);
						values.push(pts[k][1] * (1 - f) + pts[k + 1][1] * f);
					}
				}
			}
			return { ok: true, values };
		}
function normalizeSpectrum(spectrum) {
			const maxIntensity = Math.max(...spectrum);
			if (maxIntensity === 0) {
				
				return spectrum; // If the maximum value is zero, return the original spectrum directly
			}
			return spectrum.map(value => value / maxIntensity);
		}
function normalizeAndSmooth() {
			const reducedRange = 2; // Set the smoothing range
			intensities.forEach((intensity, i) => {
				smoothCurve(i, intensity, reducedRange);
			});

			// Normalization processing
			intensities = normalizeSpectrum(intensities);

			// Redraw the curve
			drawSpectral();
		}

		// Smoothing function
		function smoothCurve(index, value, range = 5) {
			const maxSlope = 0.1; // Maximum first derivative

			// Temporarily store original values
			const originalValues = [...intensities];

			// Update the value at the current point
			intensities[index] = value;

			// Apply weighted adjustments to nearby points
			for (let i = Math.max(0, index - range); i <= Math.min(400, index + range); i++) {
				const distance = Math.abs(i - index);
				const weight = 1 - (distance / range); // The farther the distance, the smaller the weight
				intensities[i] = originalValues[i] * (1 - weight) + value * weight;
			}

			// Limit the first derivative to prevent spikes
			for (let i = Math.max(1, index - range); i <= Math.min(399, index + range); i++) {
				const slope = (intensities[i] - intensities[i - 1]) / 1;
				if (Math.abs(slope) > maxSlope) {
					intensities[i] = intensities[i - 1] + Math.sign(slope) * maxSlope;

let intensities=[];const sample='380 0.1\n450 0.8\n550 0.4\n650 0.9\n780 0.1';function drawSpectral(){let c=document.getElementById('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#8cdca4';x.lineWidth=3;x.beginPath();intensities.forEach((v,i)=>{const px=i/400*(c.width-30)+15,py=c.height-20-v*(c.height-40);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();document.getElementById('feedback').textContent='380–780 nm · '+intensities.length+' points';}function calculate(){const r=parseSpectralInput(document.getElementById('spectrum').value);if(!r.ok){document.getElementById('feedback').textContent=r.error;return;}if(!r.values.some(v=>v>0)){document.getElementById('feedback').textContent='Spectrum has zero intensity.';return;}intensities=normalizeSpectrum(r.values).map(v=>Math.max(0,v));drawSpectral();}function resetExample(){document.getElementById('spectrum').value=sample;document.getElementById('wpe').value='';calculate();}resetExample();</script></body></html>
