  .step .no{font-size:10.5px;color:var(--green);letter-spacing:.18em;margin-bottom:7px;}
  .step .t{font-size:13.5px;font-weight:600;margin-bottom:5px;}
  .step .d{font-size:12px;color:var(--ink-dim);line-height:1.65;}
  .startrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .best{font-size:12.5px;color:var(--ink-faint);}
  .best b{color:var(--amber);font-weight:600;}
  .keysline{margin-top:22px;font-size:11.5px;color:var(--ink-faint);line-height:2;}
  kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-family:inherit;font-size:11px;color:var(--ink-dim);}

  /* \u5F00\u573A\u6F14\u793A\u677F */
  .demo{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;
    box-shadow:var(--shadow);}
  .demo-h{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;
    color:var(--ink-faint);margin-bottom:10px;}
  .demo-spec{font-size:12.5px;color:var(--ink);min-height:20px;margin-bottom:10px;}
  .demo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;aspect-ratio:1/1;
    padding:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;}
  .dcell{border-radius:3px;background:var(--cell-bg);border:1px solid var(--cell-line);transition:background .2s ease;}
  .dcell.on{border-color:transparent;}
  .demo-foot{font-size:11px;color:var(--ink-faint);margin-top:10px;min-height:17px;}

  /* HUD */
  .hud{display:flex;gap:14px;align-items:stretch;margin-bottom:16px;position:relative;}
  .timerwrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .timerlabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);
    margin-bottom:6px;letter-spacing:.08em;}
  .timerlabel b{color:var(--ink);font-weight:600;}
  .bar{height:7px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;}
  .bar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--green-lite));
    transition:width .18s linear,background .3s ease;}
  .bar.warn > i{background:linear-gradient(90deg,var(--amber-lite),var(--amber));}
  .bar.danger > i{background:linear-gradient(90deg,var(--red),var(--red-lite));}
  .scorebox{border:1px solid var(--line);background:var(--panel);border-radius:12px;
    padding:6px 18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;min-width:104px;}
  .scorebox .l{font-size:9.5px;color:var(--ink-faint);letter-spacing:.18em;order:-1;}
  .scorebox .n{font-size:27px;font-weight:700;color:var(--amber);line-height:1.15;letter-spacing:-.02em;
    font-family:"SF Pro Display",-apple-system,"Helvetica Neue",Arial,sans-serif;}
  .scorebox .n.pulse{animation:numPulse .9s ease;}
  @keyframes numPulse{
    0%{transform:scale(1);}
    35%{transform:scale(1.16);color:var(--ink);}
    100%{transform:scale(1);}
  }
  .float{position:absolute;right:12px;top:-11px;font-size:15px;font-weight:700;color:var(--green);
    pointer-events:none;opacity:0;
    font-family:"SF Pro Display",-apple-system,"Helvetica Neue",Arial,sans-serif;}
  .float.go{animation:floatUp .95s ease forwards;}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(7px) scale(.9);}
    22%{opacity:1;transform:translateY(0) scale(1);}
    100%{opacity:0;transform:translateY(-20px) scale(1);}
  }
  .tnum-danger{color:var(--red);animation:tick .95s ease infinite;}
  @keyframes tick{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stage{display:grid;grid-template-columns:minmax(0,326px) minmax(0,1fr);gap:22px;align-items:start;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .card-h{font-size:10.5px;color:var(--ink-faint);letter-spacing:.2em;margin-bottom:10px;}
  .specrow{display:flex;gap:12px;align-items:flex-start;}
  .specmain{flex:1;min-width:0;}
  .mini{flex:none;width:66px;aspect-ratio:1/1;display:grid;
    grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:1px;
    padding:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;}
  .mini i{display:block;border-radius:1.5px;background:var(--cell-bg);}
  .mini i.on{background:var(--mc);}
  .spec{font-size:16px;font-weight:600;line-height:1.55;margin-bottom:6px;}
  .spec .accent{color:var(--green);}
  .cname{color:var(--sw-ink);font-weight:600;}
  html[data-theme="dark"] .cname{color:var(--sw);}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;min-height:17px;}
  .pm{font-size:12.5px;color:var(--ink-dim);border-left:2px solid var(--line);padding-left:10px;min-height:38px;}
  .pm em{color:var(--ink-faint);font-style:normal;}

  .tools{display:flex;gap:9px;margin:22px 0 8px;flex-wrap:wrap;}
  .sw{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
    position:relative;transition:transform .12s ease,border-color .12s ease;}
  .sw::after{content:"";position:absolute;inset:7px;border-radius:5px;background:var(--c);}
  .sw[aria-pressed="true"]{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .sw.erase::after{background:transparent;border:1.5px dashed var(--ink-faint);}
  .sw .k{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--ink-faint);}
  .card-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:30px;}

  .boardwrap{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;}
  .board{
    width:100%;max-width:430px;aspect-ratio:1/1;
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    gap:4px;padding:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;
    touch-action:none;user-select:none;-webkit-user-select:none;
    box-shadow:var(--shadow);
  }
  .cell{border-radius:4px;background:var(--cell-bg);border:1px solid var(--cell-line);
    transition:background .08s linear,border-color .12s linear;}
  .cell:hover{border-color:var(--cell-line-hover);}
  .cell.on{border-color:transparent;}
  .board.shake{animation:shake .3s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .deliver{border-color:var(--amber);color:var(--amber);font-weight:600;padding:13px 34px;}
  .deliver:hover{background:var(--amber);color:var(--on-accent);}

  .flash{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
    text-align:center;z-index:40;width:min(92vw,560px);}
  .flash.show{animation:pop 1.05s ease forwards;}
  .flash .p{font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.01em;
    text-shadow:var(--flash-shadow);}
  .flash .s{font-size:12.5px;color:var(--ink-dim);margin-top:5px;
    text-shadow:var(--flash-shadow);}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-46%) scale(.93);}
    16%{opacity:1;transform:translate(-50%,-52%) scale(1);}
    72%{opacity:1;transform:translate(-50%,-56%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-66%) scale(.98);}
  }

  /* \u7ED3\u7B97 */
  .over{text-align:center;padding:12px 0 0;}
  .over .rank{font-size:11.5px;letter-spacing:.22em;color:var(--green);margin-bottom:10px;}
  .over .title{font-size:clamp(24px,4.6vw,36px);font-weight:700;margin:0;letter-spacing:-.01em;}
  .over .big{font-size:clamp(58px,13vw,92px);font-weight:700;line-height:1;color:var(--amber);
    letter-spacing:-.04em;margin:16px 0 4px;display:flex;align-items:baseline;justify-content:center;gap:12px;
    font-family:"SF Pro Display",-apple-system,"Helvetica Neue",Arial,sans-serif;}
  .over .big .unit{font-size:16px;color:var(--ink-faint);font-weight:400;letter-spacing:.1em;}
  .verdict{max-width:540px;margin:14px auto 0;font-size:13px;color:var(--ink-dim);line-height:1.8;}
  .verdict b{color:var(--ink);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px auto 0;max-width:540px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 8px;}
  .stat .v{font-size:19px;font-weight:600;}
  .stat .l{font-size:10.5px;color:var(--ink-faint);letter-spacing:.1em;margin-top:2px;}
  .overrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;}

  .lb{max-width:540px;margin:22px auto 0;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;text-align:left;}
  .lb-h{font-size:10.5px;color:var(--ink-faint);letter-spacing:.18em;margin-bottom:8px;}
  .lb-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-dim);
    padding:5px 0;border-bottom:1px dashed var(--line-soft);}
  .lb-row:last-child{border-bottom:0;}
  .lb-row.me{color:var(--ink);}
  .lb-row .rk{width:22px;color:var(--ink-faint);}
  .lb-row.me .rk{color:var(--green);}
  .lb-row .sc{font-weight:600;font-variant-numeric:tabular-nums;flex:1;}
  .lb-row .mt{color:var(--ink-faint);font-size:11px;min-width:96px;text-align:right;}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  footer{margin-top:44px;padding-top:16px;border-top:1px dashed var(--line);
    font-size:11.5px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  @media (min-width:881px){
    .hero{min-height:calc(100vh - 230px);}
    #s-play:not([hidden]),#s-over:not([hidden]){
      min-height:calc(100vh - 250px);display:flex;flex-direction:column;justify-content:center;
    }
  }
  @media (max-width:880px){
    .hero-grid{grid-template-columns:1fr;gap:24px;}
    .hero-copy{display:flex;flex-direction:column;}
    .startrow{order:1;margin-bottom:24px;}
    .steps{order:2;}
    .keysline{order:3;}
    .demo{order:4;max-width:340px;margin:0 auto;width:100%;}
    .steps{grid-template-columns:1fr;}
    .step{padding:11px 13px;}
    .step .d{font-size:11.5px;}
    .stage{grid-template-columns:1fr;gap:12px;}
    .hud{flex-wrap:nowrap;gap:10px;margin-bottom:12px;}
    .scorebox{align-items:flex-start;min-width:86px;padding:4px 12px;}
    .scorebox .n{font-size:23px;}
    /* \u624B\u673A\u7AEF\u628A\u9700\u6C42\u5361\u538B\u6241\uFF0C\u4FDD\u8BC1\u300C\u9700\u6C42 + \u753B\u5E03 + \u4EA4\u4ED8\u300D\u4E00\u5C4F\u88C5\u4E0B */
    .top{margin-bottom:14px;padding-bottom:10px;}
    .card{padding:12px 12px 13px;}
    .card-h{margin-bottom:5px;}
    .mini{width:56px;padding:2px;}
    .specrow{gap:9px;}
    .spec{font-size:14.5px;line-height:1.4;margin-bottom:2px;}
    .hint{font-size:11px;margin-bottom:2px;min-height:0;}
    .pm{min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      font-size:11.5px;padding-left:8px;margin-top:6px;}
    .tools{margin:14px 0 2px;gap:8px;}
    .sw{width:31px;height:31px;}
    .sw .k{bottom:-14px;}
    .card-actions{margin-top:24px;gap:8px;}
    .boardwrap{gap:10px;}
    .board{width:min(100%,max(232px,calc(100vh - 500px)));padding:7px;gap:3px;}
    .deliver{padding:12px 30px;}
  }
  @media (max-width:640px){
    .app{padding:14px 12px 32px;}
    .stats{grid-template-columns:1fr 1fr;}
    .card{padding:14px;}
    .spec{font-size:15px;}
  }

/* Personal record synchronization feedback. */
