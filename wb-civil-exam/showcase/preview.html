const vi = { id: "yanyu", name: "言语理解与表达", short: "言语", desc: "片段阅读 · 逻辑填空 · 语句表达", accent: "#4C6484", questions: [{ id: "yy01", type: "逻辑填空", stem: "科学研究从来不是一条________的坦途。真正的突破往往诞生于无数次失败之后，需要研究者耐得住长期________，保持不为外界喧嚣所动的定力。", options: ["一帆风顺　寂寞", "一蹴而就　寂寞", "一帆风顺　孤僻", "一蹴而就　孤僻"], answer: 0, explain: "第一空修饰“坦途”，应选表示进展顺利的“一帆风顺”；“一蹴而就”表示一下子完成某件事，不宜修饰道路。第二空“耐得住寂寞”搭配恰当，“孤僻”描述性格特征。故选A。", points: ["成语辨析", "实词搭配", "固定搭配"], difficulty: 2 }, { id: "yy02", type: "逻辑填空", stem: "城市更新不是简单的拆旧建新，而是要在延续市民共同的历史________的同时，注入现代生活的功能。这种如同穿针引线、注重细节的“________”式改造，考验着城市管理者的智慧。", options: ["记忆　绣花", "记忆　手术", "痕迹　绣花", "痕迹　手术"], answer: 0, explain: "“市民共同的历史记忆”指人们共有的文化记忆；“痕迹”侧重物理印迹，与此处共同经历的语境不符。第二空由“穿针引线、注重细节”提示“绣花”。故选A。", points: ["成语辨析", "实词搭配", "时政语感"], difficulty: 3 }, { id: "yy03", type: "逻辑填空", stem: "互联网让信息传播的速度________，但也让谣言有了________的土壤。如何平衡效率与真实，成为亟待解决的课题。", options: ["空前加快　滋生", "空前加快　蔓延", "前所未有　滋生", "前所未有　蔓延"], answer: 0, explain: '第一空需修饰"速度加快"这一动宾结构，"空前加快"直接与"速度"搭配；"前所未有"是形容词性，修饰名词更自然（如"前所未有的速度"），直接接"速度"会造成搭配不当。第二空，"滋生土壤"是固定搭配，强调谣言在此环境中产生；"蔓延"侧重向四周扩散，多与"火势""疫情""情绪"搭配，与"土壤"不搭。故答案为 A。', points: ["实词搭配", "固定搭配"], difficulty: 2 }, { id: "yy04", type: "片段阅读", stem: `在数字化浪潮中，老年人的"数字鸿沟"问题日益凸显。许多老年人不会使用智能手机，在就医挂号、公交出行、移动支付等场景中频频受阻。这不仅是技术问题，更是社会包容性的问题。解决这一问题，既需要企业开发适老化的产品，也需要社区提供面对面的教学帮助，还需要家庭成员付出耐心。

这段文字主要说明的是：`, material: "上述文字意在强调的是：", options: ["老年人不会使用智能手机的现状", "数字鸿沟问题的严重程度", "解决老年人数字鸿沟问题需要多方协同", "适老化产品开发的重要性"], answer: 2, explain: '文段结构为"提出问题—分析性质—给出对策"。前三句铺垫"数字鸿沟"现象与性质（技术问题更是社会包容性问题），最后一句用"既需要……也需要……还需要……"引出并列的对策，这是文段的重点所在。A、B 项均只概括了前面的问题铺垫部分，非重点；D 项仅涉及对策中的一个方面（企业），表述过窄，遗漏了社区与家庭两方面。只有 C 项完整概括了并列对策的"多方协同"，故当选 C。', points: ["主旨概括", "并列结构", "对策优先"], difficulty: 2 }, { id: "yy05", type: "片段阅读", stem: `【模拟阅读材料，仅用于理解与推理练习】
很多人认为，阅读速度越快，获取的信息就越多。但研究表明，快速阅读时大脑对文字的处理停留在表层，理解深度和记忆效果都会明显下降。真正有效的阅读，需要在关键处慢下来，反复咀嚼，与既有的知识建立联结。

这段文字主要说明的是：`, material: "这段文字主要说明：", options: ["快速阅读会导致记忆效果下降", "阅读速度与阅读效果并非正相关", "有效阅读需要与既有知识建立联结", "阅读速度越快获取信息越多是错误的"], answer: 1, explain: '文段为"提出流行观点—转折否定—给出正确理解"结构。首句摆出"读得快=信息多"的常见认知，第二句用"但"转折指出快速阅读损害理解与记忆，第三句点明真正有效的阅读方式。整体论述的核心是"速度与效果之间的关系被误解"，B 项最贴合。A 项只提到记忆下降，遗漏"理解深度"且只说了问题的一半；C 项只是"有效阅读"的其中一个要求，表述不全；D 项停留在对流行观点的否定，未概括出文段的正面主张，且"获取信息越多"原文说的是"很多人认为"，否定它是手段而非目的。故答案为 B。', points: ["主旨概括", "转折结构"], difficulty: 2 }, { id: "yy06", type: "片段阅读", stem: `传统的村落保护往往把老房子当成"标本"封存起来，禁止一切改动。但村落是活的，它承载着世代居民的生活。把人迁走、把房子锁起来，看似保住了建筑本体，实则抽走了村落的灵魂。保护的关键，在于让居民能在这片土地上继续很好地生活。

这段文字主要说明的是：`, material: "根据这段文字，作者对村落保护的核心主张是：", options: ["应严格禁止对传统村落建筑的任何改动", "村落保护应标本兼治、修旧如旧", "让居民在原地拥有良好生活是保护的根基", "传统村落保护不应只关注建筑本体"], answer: 2, explain: '文段先批评"标本式"封存保护，指出其"抽走灵魂"，最后一句用"关键在于"明确给出主张：让居民能继续很好地生活。C 项与尾句核心主张直接对应。A 项恰是作者批评的观点；B 项"标本兼治""修旧如旧"均非文段表述，属于无中生有；D 项方向正确（不只是关注建筑本体）但仍停在"否定做法"层面，未点出作者给出的正面主张"居民生活"，相比之下 C 项更精准。故答案为 C。', points: ["观点态度", "尾句重点"], difficulty: 3 }, { id: "yy07", type: "片段阅读", stem: `土壤的形成极其缓慢，形成 1 厘米厚的表土通常需要数百甚至上千年。而一旦被破坏，恢复的难度和代价远超想象。因此，对于农田表土，我们应当像对待不可再生资源那样审慎使用，在建设施工中做到表土剥离、集中存放、异地回填。

这段文字主要说明的是：`, material: "这段文字主要介绍了：", options: ["土壤形成缓慢的原因", "农田表土保护的必要性与做法", "表土剥离回填的具体技术流程", "土壤为何被视为不可再生资源"], answer: 1, explain: '文段为"陈述事实（形成慢、恢复难）—得出结论（应审慎使用）—提出做法（剥离、存放、回填）"的因果结构。重点落在"因此"之后的对策上，即表土保护的必要性与具体做法，B 项概括准确。A、D 项只涉及原因铺垫；C 项"具体技术流程"表述过深，文段只是举出做法要点，并未展开技术细节。故答案为 B。', points: ["主旨概括", "因果结构", "对策优先"], difficulty: 2 }, { id: "yy08", type: "语句表达", stem: `①这使得方言的生存空间被不断压缩

将以上 5 个句子重新排列，语序最恰当的是：`, options: ["②③①④⑤", "③①②④⑤", "②③④①⑤", "③②①④⑤"], answer: 0, explain: '首句应引入话题并给出定义性判断，②"方言是地域文化的重要载体"最适合做首句，锁定 A、C。比较 A、C：③"随着城镇化推进和普通话普及"是原因状语，①"这使得方言的生存空间被不断压缩"中的"这"指代③所述背景，故③①相连；④"许多年轻人已经听不懂也说不出家乡话"是对①"生存空间被压缩"的具体表现说明，应接在①后；⑤以"保护方言"收束，提出对策性总结。故顺序为②③①④⑤，答案为 A。C 项③④相连会使"这使得"失去指代对象。', points: ["语句排序", "指代词", "首尾句判断"], difficulty: 3 }, { id: "yy09", type: "逻辑填空", stem: "面对复杂的国际形势，我们既要保持战略定力，不为一时一事所扰，也要________，在全面判断局势的基础上正确把握行动时机。", options: ["因势利导", "随机应变", "随波逐流", "审时度势"], answer: 3, explain: "“在全面判断局势的基础上正确把握行动时机”直接对应“审时度势”。“随机应变”强调随具体变化灵活应对，不突出全面分析与判断时机；“随波逐流”与战略定力矛盾。故选D。", points: ["成语辨析", "语境色彩"], difficulty: 2 }, { id: "yy10", type: "片段阅读", stem: `考古工作常常被误解为"寻宝"。事实上，考古学家最关心的不是器物值多少钱，而是它出土的位置、与之共存的遗存、以及它在整个遗址中的空间关系。一件陶罐单独看只是陶罐，只有放回它的"情境"中，才能回答古人如何生活、如何组织社会这些问题。

这段文字主要说明的是：`, material: "这段文字意在说明：", options: ["考古学与寻宝有着本质区别", "考古学的价值在于情境信息的解读", "器物出土位置比器物本身更重要", "公众对考古工作存在普遍误解"], answer: 1, explain: '文段先破除误解（不是寻宝），接着用"不是……而是……"点出考古学家真正关心的对象（位置、共存遗存、空间关系），末句进一步强调"放回情境"才能回答问题。整体指向考古学的方法论核心——情境信息，B 项概括最准。A 项只说了开头破除误解的部分；C 项"位置比器物本身更重要"把并列的多个要素窄化为"位置"，且"更重要"的表述过于绝对；D 项"普遍误解"是引子，非重点。故答案为 B。', points: ["主旨概括", "转折结构", "递进结构"], difficulty: 2 }, { id: "yy11", type: "逻辑填空", stem: "公共政策的效果往往存在滞后性，不能因为短期内未见成效就________、中断落实，也不能认为一次成效显著便可________、永远不再完善。", options: ["半途而废　一劳永逸", "急功近利　沾沾自喜", "半途而废　沾沾自喜", "急功近利　一劳永逸"], answer: 0, explain: "第一空后有“中断落实”，应选“半途而废”；“急功近利”强调急于获得成效，不能准确替代中断。第二空后有“永远不再完善”，对应想靠一次努力永远解决问题的“一劳永逸”。故选A。", points: ["成语辨析", "逻辑对应"], difficulty: 3 }, { id: "yy12", type: "片段阅读", stem: `【模拟阅读材料，仅用于理解与推理练习】
研究人员对 2000 名成年人的睡眠习惯进行了长达 10 年的追踪。结果发现，长期睡眠不足 6 小时的人，患心血管疾病的风险比睡眠 7 至 8 小时的人高出约 30%。但研究者也提醒，这项研究只能说明相关性，尚不能证明睡眠不足是导致心血管疾病的直接原因。

这段文字主要说明的是：`, material: "这段文字主要说明：", options: ["睡眠不足会增加心血管疾病风险", "睡眠时长与心血管疾病存在关联但因果未定", "每晚应保证 7 至 8 小时睡眠", "长达 10 年的追踪研究具有很高的可信度"], answer: 1, explain: '文段包含两层：一是研究发现的风险关联数据，二是研究者"只能说明相关性，尚不能证明因果关系"的提醒。作者把后半句的限定与前半句的数据并置，重点在于呈现"有关联但因果待证"这一完整结论，B 项准确。A 项只取前半段，忽略了关键的因果限定，属于表述不完整、易造成绝对化；C 项"应保证 7 至 8 小时"是过度推断，文段未提出建议；D 项"可信度很高"属于无中生有，研究者恰恰在提示局限。故答案为 B。', points: ["主旨概括", "转折结构", "相关与因果"], difficulty: 3 }, { id: "yy13", type: "逻辑填空", stem: "技艺的传承，靠的不只是纸面上的记录，更是师徒间________的示范与纠正。那些难以言传的微妙手感，只有在日复一日的________中才能被真正掌握。", options: ["耳提面命　耳濡目染", "口传心授　耳濡目染", "口传心授　潜移默化", "耳提面命　潜移默化"], answer: 1, explain: '第一空，后文有"示范与纠正"，且强调师徒之间的关系，"口传心授"（口头传授、内心领悟）在表述"传授技艺"时最为贴切，也与前文"纸面记录"形成对照；"耳提面命"强调教诲殷切、督促严厉，侧重态度而非传授方式。第二空，"在日复一日的耳濡目染中掌握"是常见搭配，强调长期身处其中受熏陶；"潜移默化"通常作状语或谓语使用（如"潜移默化地影响"），作"在……中"的宾语中心词不够自然。故答案为 B。', points: ["成语辨析", "语法功能"], difficulty: 3 }, { id: "yy14", type: "片段阅读", stem: `【模拟阅读材料，仅用于理解与推理练习】
城市里的鸟类正在悄悄改变自己的"歌喉"。研究发现，在交通噪声嘈杂的区域，鸟鸣的音频明显偏高，且鸣叫的音节变得更短。这是鸟类为了让自己的求偶与警戒信号被同伴听见而做出的适应。但这种适应并非没有代价——更高的音频更容易被天敌定位。

这段文字主要说明的是：`, material: "这段文字接下来最可能讲述的是：", options: ["鸟类适应噪声的具体生理机制", "交通噪声对鸟类种群数量的影响", "鸟类在噪声环境下面临的两难处境", "如何通过降低噪声来保护城市鸟类"], answer: 2, explain: '文段尾句以"但这种适应并非没有代价——更高的音频更容易被天敌定位"收束，指向一个"既有好处又有风险"的张力关系，即鸟类陷入"能被同伴听见"与"容易被天敌发现"的两难。按行文逻辑，下文应顺着这一矛盾继续展开，C 项最贴合。A 项转向生理机制，与尾句话题（代价/风险）断裂；B 项"种群数量"属于新的宏观话题；D 项直接跳到对策，缺少对矛盾本身的分析过渡，跳跃过大。故答案为 C。', points: ["下文推断", "话题一致"], difficulty: 3 }, { id: "yy15", type: "逻辑填空", stem: "一项好的制度设计，既要考虑理想状态下的运行效率，也要为各种意外情况预留________，避免因个别环节失灵而导致整体________。", options: ["余地　瘫痪", "分歧　失效", "争议　解冻", "隔阂　波动"], answer: 0, explain: "“预留余地”指为可能变化留下应对空间，符合意外情况下的制度安排；“分歧”“争议”“隔阂”不宜作为预先保留的应对能力。个别环节失灵导致整体不能正常运转，可用“瘫痪”。故选A。", points: ["实词辨析", "搭配", "语义轻重"], difficulty: 2 }, { id: "yy16", type: "片段阅读", stem: `在科普写作中，最常见的问题是"知识的诅咒"——作者一旦掌握了某个知识，就很难想象不了解它的人会有什么困惑。于是写出的内容处处省略推理、默认读者已知，最终把读者挡在门外。破解之道，是作者主动回忆自己当年的困惑，并把这些困感当作写作的起点。

这段文字主要说明的是：`, material: "这段文字主要说明：", options: ['科普写作中"知识的诅咒"的表现与成因', "科普作者应当从读者的困惑出发进行写作", '"知识的诅咒"是科普写作的普遍障碍', "科普写作需要省略推理过程以保持简洁"], answer: 1, explain: '文段脉络为"指出问题（知识的诅咒）—说明危害（把读者挡在门外）—给出破解之道（把困惑当作起点）"。重点落在尾句给出的对策，B 项与之直接对应。A 项只概括了问题的表现与成因，遗漏了对策这一重点；C 项停留在问题定性，未涉及解决方向；D 项与文意相反，文段批评的恰恰是"处处省略推理"。故答案为 B。', points: ["主旨概括", "对策优先"], difficulty: 2 }, { id: "yy17", type: "语句表达", stem: "下列句子中，没有语病的一项是：", options: ["通过这次活动，使我深刻认识到了团队协作的重要性。", "这次会议围绕以提升服务质量为中心展开了讨论。", "为了防止此类事故不再发生，企业修订了安全规程。", "经过这次培训，我深刻认识到了团队协作的重要性。"], answer: 3, explain: '逐项排查：A 项"通过……使我……"造成主语残缺——"通过这次活动"是介词短语作状语，不能充当主语，"使"又要求有主语，两相叠加导致全句无主语，删去"通过"或"使"任一即可。B 项"围绕以……为中心"属句式杂糅——"围绕……展开讨论"与"以……为中心展开讨论"两种句式被强行拼接，应择一使用。C 项"为了防止……不再发生"否定不当——“防止”本身已含否定意味，再加“不再”构成双重否定，表意相反，应删去"不"。D 项由"经过"引出状语、"我"作主语、动宾搭配完整，无语病。故答案为 D。', points: ["病句辨析", "成分残缺", "句式杂糅", "否定不当"], difficulty: 3 }, { id: "yy18", type: "片段阅读", stem: `【模拟阅读材料，仅用于理解与推理练习】
很多人把"专注"理解为排除一切干扰、长时间盯着一个目标。但脑科学的研究显示，人的注意力本就呈周期性波动，强求长时间的高强度聚焦反而会加速疲劳。更可持续的做法，是在专注与休息之间主动切换，用短暂的放空换取下一段高效。

这段文字主要说明的是：`, material: "这段文字意在强调：", options: ["人的注意力具有周期性波动的特点", "长时间高强度聚焦会加速疲劳", "主动切换专注与休息比强求持续专注更有效", "专注需要排除一切干扰"], answer: 2, explain: '文段结构为"提出流行误解—用研究结果反驳—给出更优做法"。尾句"更可持续的做法是……"是重心，C 项与其一致。A、B 两项都是支撑反驳的证据性信息，属于论据而非论点；D 项是文段开头提到的流行误解，恰是被否定的一方。故答案为 C。', points: ["主旨概括", "对策优先", "转折结构"], difficulty: 2 }, { id: "yy19", type: "逻辑填空", stem: "传统技艺的复兴，不能只靠情怀提供________，更需要市场的检验与商业模式的支撑。唯有让手艺能养活手艺人，传承才不会变成没有现实根基的________。", options: ["动力　空中楼阁", "约束　纸上谈兵", "隔阂　空中楼阁", "阻力　纸上谈兵"], answer: 0, explain: "情怀提供积极推动作用，应为“动力”，而非约束、隔阂或阻力。“没有现实根基”提示“空中楼阁”，比喻缺乏基础的设想。故选A。", points: ["实词搭配", "成语辨析", "语义重复"], difficulty: 3 }, { id: "yy20", type: "片段阅读", stem: `文学作品的翻译，历来被视为"带着镣铐跳舞"。译者在忠实原文与符合译入语表达习惯之间，往往要做艰难的取舍。好的译本并非逐字对应的结果，而是译者在深刻理解原作之后，用另一种语言重新完成的艺术创造。

这段文字主要说明的是：`, material: "这段文字主要说明：", options: ["文学翻译的难度体现在语言差异上", "好的文学翻译是一种再创造", "译者必须在忠实与通顺之间取舍", "逐字对应的翻译方式不可取"], answer: 1, explain: '文段先指出翻译的两难（镣铐跳舞、艰难取舍），末句用"并非……而是……"给出结论："好的译本……是译者……重新完成的艺术创造"。A 项"难度体现在语言差异"只是开头铺垫；C 项"必须取舍"是两难处境本身，非结论；D 项是对"逐字对应"的否定，属于结论的否定面表述，不如正面主张"再创造"完整。故答案为 B。', points: ["主旨概括", "转折结构", "正面主张优先"], difficulty: 2 }] }, gi = { id: "shuliang", name: "数量关系", short: "数量", desc: "数学运算 · 计算问题 · 行程工程 · 排列概率", accent: "#B57F27", questions: [{ id: "sl01", type: "数学运算", stem: "某单位组织员工外出考察，若每辆车坐 45 人，则多出 15 人没有座位；若每辆车坐 50 人，则最后一辆车还空 5 个座位。问该单位共有多少名员工？", options: ["180 人", "195 人", "200 人", "215 人"], answer: 1, explain: '设共有 x 辆车。第一种安排：总人数 = 45x + 15。第二种安排：每车 50 人，最后一辆空 5 个座位，说明总人数 = 50x − 5。两式相等：45x + 15 = 50x − 5，移项得 5x = 20，x = 4。总人数 = 45 × 4 + 15 = 195（人）。验证：195 ÷ 50 = 3 余 45，即 3 辆坐满共 150 人，第 4 辆坐 45 人，空 5 个座位，符合题意。故答案为 B。列方程时注意"最后一辆空 5 座"等价于"总座位数比总人数多 5"，即人数 = 车数 × 每车人数 − 5。', points: ["方程法", "盈亏问题"], difficulty: 2 }, { id: "sl02", type: "数学运算", stem: "甲、乙两人从相距 36 千米的两地同时出发相向而行，甲每小时行 5 千米，乙每小时行 4 千米。几小时后两人相遇？", options: ["3 小时", "4 小时", "4.5 小时", "5 小时"], answer: 1, explain: '相遇问题核心公式：相遇时间 = 总路程 ÷ 速度和。速度和 = 5 + 4 = 9（千米/小时），相遇时间 = 36 ÷ 9 = 4（小时）。故答案为 B。此类题的关键是识别"相向而行"对应"速度和"，"同向而行"对应"速度差"，切勿混用。', points: ["行程问题", "相遇"], difficulty: 1 }, { id: "sl03", type: "数学运算", stem: "一项工程，甲队单独做需 12 天完成，乙队单独做需 18 天完成。两队合作 4 天后，剩余工程由乙队单独完成，还需多少天？", options: ["6 天", "7 天", "8 天", "9 天"], answer: 2, explain: "设工作总量为 36（12 与 18 的最小公倍数），则甲效率 = 36÷12 = 3，乙效率 = 36÷18 = 2。合作 4 天完成量 = (3+2)×4 = 20，剩余 = 36 − 20 = 16。乙单独完成剩余需 16 ÷ 2 = 8（天）。故答案为 C。给总量赋值时优先取工期的公倍数，可避免分数运算。", points: ["工程问题", "赋值法", "效率比"], difficulty: 2 }, { id: "sl04", type: "数学运算", stem: "某商品进价 80 元，标价为 120 元。若商家按标价打八折出售，则利润率为多少？", options: ["16%", "20%", "25%", "30%"], answer: 1, explain: "打折后售价 = 120 × 0.8 = 96（元）。利润 = 96 − 80 = 16（元）。利润率 = 利润 ÷ 进价 = 16 ÷ 80 = 20%。故答案为 B。易错点：利润率的分母是进价（成本）而非售价，若用 16 ÷ 96 会得到约 16.7% 而误选 A。", points: ["利润问题", "打折", "利润率"], difficulty: 2 }, { id: "sl05", type: "数学运算", stem: "从 1、2、3、4、5 这五个数字中任取三个，组成没有重复数字的三位数，其中能被 5 整除的三位数有多少个？", options: ["8 个", "12 个", "16 个", "24 个"], answer: 1, explain: "能被 5 整除的三位数，其个位只能是 5（本题数字中没有 0）。固定个位为 5，则百位与十位从剩余 4 个数字（1、2、3、4）中有序选取 2 个：A(4,2) = 4 × 3 = 12（个）。故答案为 B。分类时先锁定受整除规则限制的个位，再排列其余位置，是最省力的做法。", points: ["排列组合", "整除", "分类计数"], difficulty: 2 }, { id: "sl06", type: "数学运算", stem: "甲、乙两地相距 60 千米。小王骑摩托车从甲地出发前往乙地，去时速度为 30 千米/小时，返回时速度为 20 千米/小时。小王往返全程的平均速度是多少？", options: ["24 千米/小时", "25 千米/小时", "26 千米/小时", "28 千米/小时"], answer: 0, explain: "平均速度 = 总路程 ÷ 总时间，而非速度的算术平均。总路程 = 60 × 2 = 120（千米）。去时时间 = 60 ÷ 30 = 2（小时），返回时间 = 60 ÷ 20 = 3（小时），总时间 = 5 小时。平均速度 = 120 ÷ 5 = 24（千米/小时）。故答案为 A。等距离往返的平均速度可用公式 2v₁v₂/(v₁+v₂) 秒算：2×30×20÷50 = 24。若误用 (30+20)÷2 = 25，即落入 B 项陷阱。", points: ["行程问题", "平均速度", "易错陷阱"], difficulty: 2 }, { id: "sl07", type: "数学运算", stem: "某班有学生 40 人，其中参加数学竞赛的有 25 人，参加物理竞赛的有 20 人，两项都参加的有 8 人。问两项都没参加的有多少人？", options: ["3 人", "5 人", "7 人", "9 人"], answer: 0, explain: '容斥原理：至少参加一项的人数 = 25 + 20 − 8 = 37（人）。两项都没参加的人数 = 40 − 37 = 3（人）。故答案为 A。关键是把"两项都参加"重复计入的部分减掉一次，即 |A∪B| = |A| + |B| − |A∩B|。', points: ["容斥原理", "集合"], difficulty: 2 }, { id: "sl08", type: "数学运算", stem: "一项工程由甲、乙、丙三人合作，甲每天完成总量的 1/20，乙每天完成 1/30，丙每天完成 1/60。三人合作需要多少天完成？", options: ["8 天", "10 天", "12 天", "15 天"], answer: 1, explain: "三人效率和 = 1/20 + 1/30 + 1/60。通分取 60：3/60 + 2/60 + 1/60 = 6/60 = 1/10。故合作需 10 天完成，答案为 B。这类题直接用分数相加即可，无需赋值；注意通分时分母取最小公倍数可减少计算量。", points: ["工程问题", "分数运算"], difficulty: 1 }, { id: "sl09", type: "数学运算", stem: "一个长方体的长、宽、高分别为 6 厘米、4 厘米、3 厘米。若将其切割成体积相等的小正方体，且小正方体棱长为整数厘米，则最多可以切成多少个？", options: ["24 个", "36 个", "48 个", "72 个"], answer: 3, explain: '大长方体体积 = 6 × 4 × 3 = 72（立方厘米）。要使小正方体数量最多，棱长应取最小正整数 1 厘米，此时小正方体体积为 1 立方厘米，可切 72 ÷ 1 = 72（个）。故答案为 D。注意"棱长为整数厘米"这一条件是关键，若无此限制则数量可无限细分，题目失去意义。', points: ["几何", "体积分割", "极值"], difficulty: 2 }, { id: "sl10", type: "数学运算", stem: "某数列：2，5，10，17，26，（　）。括号处应填的数字是：", options: ["35", "37", "39", "41"], answer: 1, explain: "观察相邻两项的差：5−2 = 3，10−5 = 5，17−10 = 7，26−17 = 9。差值构成首项为 3、公差为 2 的等差数列（3、5、7、9、11…）。下一项差值应为 11，故括号处 = 26 + 11 = 37。另可观察原数列通项为 n² + 1（n 从 1 起）：1²+1=2，2²+1=5，3²+1=10，4²+1=17，5²+1=26，6²+1=37。答案为 B。", points: ["数字推理", "二级差", "通项规律"], difficulty: 2 }, { id: "sl11", type: "数学运算", stem: "某溶液 200 克，浓度为 20%。若要使浓度提高到 25%，需要加入多少克溶质（假设溶质完全溶解）？", options: ["10 克", "13.3 克", "15 克", "20 克"], answer: 1, explain: '原溶质质量 = 200 × 20% = 40（克）。设加入 x 克溶质，则 (40 + x) ÷ (200 + x) = 25%。解得：40 + x = 0.25 × (200 + x) = 50 + 0.25x，即 0.75x = 10，x ≈ 13.33（克）。故答案为 B。易错点是浓度公式的分母是"溶液总质量"，加入溶质后溶液总质量也随之增加，不能直接用 200 当分母。', points: ["浓度问题", "方程法", "易错陷阱"], difficulty: 3 }, { id: "sl12", type: "数学运算", stem: "将一根绳子对折 3 次后，再从中间剪一刀，绳子被剪成多少段？", options: ["6 段", "8 段", "9 段", "16 段"], answer: 2, explain: "对折 3 次后，绳子的层数为 2³ = 8 层。从中间剪一刀，会同时剪断这 8 层，产生 8 个剪口。对于原本成环状连接的对折结构，8 个剪口将绳子分成 8 + 1 = 9 段。故答案为 C。记忆要点：对折 n 次得 2ⁿ 层，剪 m 刀得 2ⁿ × m 个剪口，段数为剪口数 + 1（前提是剪口不重合）。", points: ["趣味数学", "规律归纳"], difficulty: 3 }, { id: "sl13", type: "数学运算", stem: "某单位有 5 名员工，需选出 2 人分别担任组长和副组长。共有多少种不同的选法？", options: ["10 种", "15 种", "20 种", "25 种"], answer: 2, explain: '组长与副组长是两个不同职位，先选组长有 5 种选法，再从剩余 4 人中选副组长有 4 种，故共有 5 × 4 = 20（种），即 A(5,2) = 20。故答案为 C。区别要点：本题因职务不同属于"排列"；若只说"选出 2 人组成小组"无职务差别，则为组合 C(5,2) = 10。', points: ["排列组合", "排列与组合辨析"], difficulty: 2 }, { id: "sl14", type: "数学运算", stem: "甲数比乙数多 25%，则乙数比甲数少百分之多少？", options: ["20%", "25%", "30%", "33.3%"], answer: 0, explain: '设乙数为 100，则甲数 = 100 × (1 + 25%) = 125。乙比甲少 125 − 100 = 25，少的部分占甲的 25 ÷ 125 = 20%。故答案为 A。关键点：两个百分比的"基数（分母）"不同——前者以乙为基数，后者以甲为基数，因此 25% 与答案不相等，这是本类题最典型的陷阱。', points: ["百分数", "基数辨析", "易错陷阱"], difficulty: 2 }, { id: "sl15", type: "数学运算", stem: "某钟表在 3 点整时，时针与分针的夹角是多少度？", options: ["75°", "90°", "105°", "120°"], answer: 1, explain: '表盘共 360°，12 个刻度将表盘分为 12 等份，每个大格对应 360 ÷ 12 = 30°。3 点整时，分针指向 12，时针指向 3，两者相隔 3 个大格，夹角 = 3 × 30 = 90°。故答案为 B。若题问"3 点 30 分"的夹角，则需再计入时针走动的偏移量：时针每小时走 30°，30 分钟走 15°，此时夹角 = |(3×30 + 15) − 180| = 75°。', points: ["时钟问题", "角度计算"], difficulty: 1 }, { id: "sl16", type: "数学运算", stem: "某公司去年利润 500 万元，今年比去年增长了 20%，明年计划比今年再增长 15%。明年的计划利润是多少万元？", options: ["657.5", "675", "690", "700"], answer: 2, explain: "今年利润 = 500 × (1 + 20%) = 600（万元）。明年计划 = 600 × (1 + 15%) = 690（万元）。故答案为 C。连续增长要逐年计算，不能把增长率直接相加（500 × 1.35 = 675 是错误解法，对应 B 项的陷阱）。", points: ["百分数", "连续增长", "易错陷阱"], difficulty: 2 }, { id: "sl17", type: "数学运算", stem: "某次考试共 20 道题，答对一题得 5 分，答错或不答倒扣 2 分。小李最终得分 79 分，则他答对了多少题？", options: ["15 题", "16 题", "17 题", "18 题"], answer: 2, explain: "设答对 x 题，则答错或不答 (20 − x) 题。列方程：5x − 2(20 − x) = 79，展开得 5x − 40 + 2x = 79，即 7x = 119，x = 17。故答案为 C。验证：答对 17 题得 85 分，答错 3 题扣 6 分，净得 79 分，符合。也可用假设法：若全对得 100 分，每错一题损失 5 + 2 = 7 分，(100 − 79) ÷ 7 = 3（题错），答对 17 题。", points: ["方程法", "假设法", "鸡兔同笼"], difficulty: 2 }, { id: "sl18", type: "数学运算", stem: "一个正方体的棱长扩大到原来的 3 倍，其表面积扩大到原来的多少倍？", options: ["3 倍", "6 倍", "9 倍", "27 倍"], answer: 2, explain: "正方体表面积公式为 6a²。棱长由 a 变为 3a，则新表面积 = 6(3a)² = 6 × 9a² = 9 × (6a²)，即扩大到原来的 9 倍。故答案为 C。规律：长度按 k 倍放大，面积按 k² 倍放大，体积按 k³ 倍放大。本题若问体积则为 27 倍（对应 D 项陷阱）。", points: ["几何", "相似比", "易错陷阱"], difficulty: 2 }, { id: "sl19", type: "数学运算", stem: "甲、乙、丙三人共有图书 100 本。已知甲的图书数量是乙的 2 倍，乙的图书数量是丙的 3 倍。问丙有多少本图书？", options: ["8 本", "10 本", "12 本", "15 本"], answer: 1, explain: "设丙有 x 本，则乙有 3x 本，甲有 2 × 3x = 6x 本。列方程：6x + 3x + x = 100，即 10x = 100，解得 x = 10。故丙有 10 本，答案为 B。验证：丙 10 本、乙 30 本、甲 60 本，合计 100 本，且 60 = 2 × 30、30 = 3 × 10，倍数关系全部成立。用比例法亦可：甲∶乙∶丙 = 6∶3∶1，共 10 份，每份 100 ÷ 10 = 10 本，丙占 1 份即 10 本。", points: ["比例法", "方程法"], difficulty: 2 }, { id: "sl20", type: "数学运算", stem: "甲、乙两人同时同地同向出发，沿周长 400 米的环形跑道跑步。甲的速度为 6 米/秒，乙的速度为 4 米/秒。问甲第一次追上乙需要多长时间？", options: ["120 秒", "180 秒", "200 秒", "240 秒"], answer: 2, explain: '环形跑道上的追及问题：甲要"追上"乙，需比乙多跑整整一圈，即多跑 400 米。速度差 = 6 − 4 = 2（米/秒）。追及时间 = 400 ÷ 2 = 200（秒）。故答案为 C。识别要点：环形追及的时间 = 跑道周长 ÷ 速度差；若问"相遇"（相向而行）则为周长 ÷ 速度和。', points: ["行程问题", "环形追及", "速度差"], difficulty: 2 }] }, xi = { id: "panduan", name: "判断推理", short: "判断", desc: "图形推理 · 定义判断 · 类比推理 · 逻辑判断", accent: "#2C7A5B", questions: [{ id: "pd01", type: "定义判断", stem: `晕轮效应是指人们对他人的认知判断首先根据个人好恶得出，然后再从这个判断推论出认知对象的其他品质的现象。

根据上述定义，下列属于晕轮效应的是：`, options: ["小李因为同事小王长得英俊，就认为他工作能力一定很强", "老师根据学生平时的表现，客观评价其考试成绩", "顾客因为某品牌广告做得好而购买其产品", "员工因为公司福利待遇好而选择长期留任"], answer: 0, explain: '晕轮效应的核心要件有两个：①以个人好恶（如外貌、第一印象等非本质特征）作出初步判断；②由该判断推及其他品质。A 项因"长得英俊"（外表好恶）推出"工作能力一定很强"（其他品质），两个要件齐备。B 项强调"客观评价"，与"根据个人好恶"相矛盾；C 项"因广告好而购买"属于广告效果，不涉及对"其他品质"的推论；D 项是福利驱动的理性选择，也不符合要件①。故答案为 A。', points: ["定义判断", "要件比对"], difficulty: 2 }, { id: "pd02", type: "定义判断", stem: `逆向选择是指在信息不对称的情况下，市场的某一方如果能够利用多于另一方的信息使自己受益而使另一方受损，就倾向于与对方签订协议进行交易。

根据上述定义，下列属于逆向选择的是：`, options: ["投保人比保险公司更了解自己的健康状况，因此高风险人群更愿意购买医疗保险", "某公司因产品质量问题被消费者投诉后主动召回产品", "商家在促销期间大幅降低商品价格以吸引顾客", "员工因为公司业绩好而更加努力工作"], answer: 0, explain: '逆向选择的关键要件：①存在信息不对称；②信息优势方利用信息使自己受益、对方受损，并倾向达成交易。A 项中投保人掌握自身健康状况的信息优势，高风险人群更积极投保，会使保险公司承担超额风险，完全符合定义。B 项是质量问题引发的被动整改；C 项是常规促销行为；D 项属于正向激励，均缺少"信息不对称+利用信息优势损害对方"这一核心。故答案为 A。', points: ["定义判断", "要件比对", "经济学术语"], difficulty: 3 }, { id: "pd03", type: "类比推理", stem: "按“职业—手持工作工具”的关系，下列与“医生∶手术刀”对应最一致的是：", options: ["农民∶拖拉机", "教师∶粉笔", "司机∶汽车", "警察∶派出所"], answer: 1, explain: "教师与粉笔符合职业和手持工作工具的关系。拖拉机、汽车为大型机械或交通工具，派出所是工作机构，不符合题干限定的手持工具。故选B。", points: ["类比推理", "职业工具关系", "择优"], difficulty: 2 }, { id: "pd04", type: "类比推理", stem: "稻谷∶大米∶米饭", options: ["木材∶纸张∶书籍", "铁矿∶钢铁∶汽车", "小麦∶面粉∶面包", "棉花∶棉布∶衣服"], answer: 2, explain: '题干关系为"原料 → 初级加工品 → 最终成品"，且三者是同一物质在不同加工阶段的形态。A 项木材制成纸张再成书，链条成立但"书籍"还需内容要素，非纯物质形态变化；B 项铁矿炼成钢铁再制汽车，钢铁到汽车是零部件组装而非形态延续；C 项小麦磨成面粉再做成面包，与题干"稻谷→大米→米饭"（粮食作物经加工成为食物）的加工逻辑和物质延续性一致；D 项棉花纺成棉布再制衣服，链条也成立但纺织品加工跨度更大。四相比较，C 项在"同一物质连续性"与"食物加工"两点上与题干最贴合。故答案为 C。', points: ["类比推理", "加工关系", "择优"], difficulty: 2 }, { id: "pd05", type: "逻辑判断", stem: `【模拟阅读材料，仅用于理解与推理练习】
某研究发现，经常喝咖啡的人患 2 型糖尿病的比例明显低于不喝咖啡的人。因此，喝咖啡可以降低患 2 型糖尿病的风险。

以下哪项如果为真，最能削弱上述结论？`, options: ["咖啡中含有多种抗氧化物质", "许多不喝咖啡的人本身就有糖尿病家族史，属于高风险人群", "部分人因咖啡因过敏而不喝咖啡", "喝咖啡的人与不喝咖啡的人在运动和饮食习惯上没有明显差别"], answer: 1, explain: "结论把两组人的患病比例差异归因于咖啡。B项指出不喝咖啡组原有家族风险更高，说明两组基线不可比，提供了差异的其他解释。A项偏向支持，C项不能说明患病风险，D项排除了运动和饮食这一混杂因素而非削弱。故选B。", points: ["削弱论证", "样本代表性", "他因"], difficulty: 3 }, { id: "pd06", type: "逻辑判断", stem: `所有优秀的科学家都具有好奇心。小李具有好奇心。

由此可以推出：`, options: ["小李一定是优秀的科学家", "小李一定不是优秀的科学家", "小李不一定是优秀的科学家", "小李是优秀科学家的可能性大于不是的可能性"], answer: 2, explain: '题干"所有优秀的科学家都具有好奇心"可译为"优秀科学家 → 有好奇心"。"小李具有好奇心"是肯定了充分条件的后件。逻辑规则：肯定后件不能肯定前件，也不能否定前件，故既不能推出"小李一定是优秀科学家"（A 项错误），也不能推出"小李一定不是"（B 项错误）。在后件为真的情况下，前件的真假处于不确定状态，因此只能说"不一定是"，C 项表述准确。D 项引入了"可能性大小"的比较，属于无中生有——题干未提供任何关于概率的信息。故答案为 C。', points: ["逻辑推理", "充分条件", "肯定后件"], difficulty: 3 }, { id: "pd07", type: "逻辑判断", stem: `某单位计划选派 3 人参加培训，候选人共 5 人：甲、乙、丙、丁、戊。已知条件：
（1）甲和乙不能同时被选派；
（2）如果选派丙，则必须选派丁；
（3）若不选派戊，则必须选派甲。

若最终确定选派了戊，则下列哪项一定为真？`, options: ["丁被选派", "甲被选派", "乙被选派", "丙被选派"], answer: 0, explain: '题干已确定选派戊，占 1 个名额，还需从甲、乙、丙、丁中选 2 人，且甲、乙不能同选。以下用反证法排除"丁不被选派"的可能：若丁未被选派，则由条件（2）"选派丙→选派丁"逆否可得"不选派丁→不选派丙"，故丙也不能被选派。这样一来，剩下的可选人员只有甲和乙，而需要选出 2 人，只能同时选派甲和乙——但这恰好违反条件（1）"甲和乙不能同时被选派"。矛盾出现，说明"丁不被选派"的前提不成立，因此丁必定被选派，A 项一定为真。再验证其余选项的非必然性：方案"戊、甲、丁"满足全部条件，此时乙未被选派，排除 C；方案"戊、乙、丁"同样满足全部条件，此时甲、丙均未被选派，排除 B、D。故答案为 A。', points: ["逻辑推理", "分析推理", "反证法"], difficulty: 3 }, { id: "pd08", type: "定义判断", stem: `习得性无助是指个体在经历了某种学习后，在情感、认知和行为上表现出消极的特殊心理状态，即当个体感到自己无法控制外部事件时，会放弃努力。

根据上述定义，下列不属于习得性无助的是：`, options: ['学生连续多次考试成绩不理想后，认为"再努力也没用"，不再认真复习', "员工多次提出建议均被否决后，此后再也不在公司会议上发言", "小张首次参加马拉松比赛未完成全程，他认为是训练不足，制定了新的训练计划", '长期遭遇求职失败的人认为自己"天生就不适合工作"，放弃了求职'], answer: 2, explain: '习得性无助的核心要件：①经历反复失败（某种学习）；②形成"无法控制外部事件"的认知；③表现出放弃努力的消极状态。A、B、D 三项均符合三个要件：连续失败 → 归因于"努力无用/天生不适合"（无法控制）→ 放弃行动。C 项中小张虽然失败了，但他把原因归于"训练不足"（这是可控因素），并主动制定新计划继续努力，既没有形成失控认知，也没有放弃努力，不符合定义。故答案为 C。', points: ["定义判断", "选非题", "要件比对"], difficulty: 2 }, { id: "pd09", type: "逻辑判断", stem: `某公司规定：只有通过年度考核，才能获得年终奖金。小王获得了年终奖金。

由此可以推出：`, options: ["小王通过了年度考核", "小王没有通过年度考核", "小王可能没有通过年度考核", "无法确定小王是否通过年度考核"], answer: 0, explain: '题干"只有通过年度考核，才能获得年终奖金"是必要条件表述，等价于"获得年终奖金 → 通过年度考核"（必要条件在箭头右侧）。已知小王获得奖金（肯定前件），根据肯定前件必肯定后件的规则，可以必然推出"小王通过了年度考核"。故答案为 A。牢记翻译规则："只有 A 才 B"译为"B → A"；"如果 A 就 B"译为"A → B"，两者箭头方向相反，是最常见的失分点。', points: ["逻辑推理", "必要条件", "翻译推理"], difficulty: 2 }, { id: "pd10", type: "类比推理", stem: "破釜沉舟∶项羽", options: ["卧薪尝胆∶越王勾践", "三顾茅庐∶曹操", "闻鸡起舞∶班超", "望梅止渴∶刘备"], answer: 0, explain: '题干关系为"成语典故与其主人公"，且主人公身份与时局对应准确：破釜沉舟出自巨鹿之战，主人公是项羽。逐项核对史实：A 项卧薪尝胆的主人公是越王勾践，对应完全正确；B 项三顾茅庐的主人公是刘备（三顾者）而非曹操，错误；C 项闻鸡起舞的主人公是祖逖与刘琨，不是班超，错误；D 项望梅止渴的主人公是曹操，不是刘备，错误。故答案为 A。此类题依赖历史常识的准确记忆，切忌凭"感觉熟悉"选择。', points: ["类比推理", "成语典故", "历史常识"], difficulty: 2 }, { id: "pd11", type: "逻辑判断", stem: `【模拟阅读材料，仅用于理解与推理练习】
研究者让两组志愿者分别服用维生素 C 片和安慰剂，为期三个月。分组按报名先后顺序进行，被试和记录者都知道每个人服用的是哪一种药片。结果发现，服用维生素 C 的一组感冒次数明显减少。研究者据此认为维生素 C 能预防感冒。

以下哪项是上述实验设计中最需要改进的地方？`, options: ["样本量不够大", "未说明志愿者的年龄分布", "未采用随机双盲设计，可能存在心理暗示效应", "未测量维生素 C 在体内的浓度"], answer: 2, explain: '本题考查实验设计的严谨性。题目已设置对照组（安慰剂组），但"服用"这一行为本身可能带来安慰剂效应或心理暗示，若志愿者知道自己吃的是维生素 C，主观报告的感冒次数就可能受心理因素影响。因此最关键的是"未被试知情（单盲）甚至研究者和被试均不知情（双盲）并随机分组"这一设计缺陷。A、B、D 项虽然也涉及实验严谨性，但相对属于优化项而非本设计中最致命的缺陷——毕竟题目已设置对照，缺的是"盲法"这一控制心理效应的手段。故答案为 C。', points: ["论证评价", "实验设计", "双盲"], difficulty: 3 }, { id: "pd12", type: "定义判断", stem: `沉没成本是指已经发生且无法收回的支出。理性决策应当只考虑未来的成本和收益，而不受沉没成本的影响。

根据上述定义，下列行为体现了"受沉没成本影响"的是：`, options: ["小张买了一张电影票，看了一会儿发现电影很难看，但因为票钱已经花了而坚持看完", "小王在购买前仔细比较了多家店铺的价格", "小李因为天气预报有雨而带上了雨伞", "小赵因为公司离家近而选择了这份工作"], answer: 0, explain: '沉没成本的核心特征是"已发生、不可收回，且不应影响后续决策"。A 项中电影票钱已支付且无法退回（沉没成本），小张却因这笔已无法收回的支出而决定继续看下去，正是典型的被沉没成本绑架的非理性决策。B 项是购买前的理性比较（决策发生在成本发生之前）；C 项基于未来预期（下雨）作决策；D 项基于通勤便利这一现实收益作决策。故答案为 A。', points: ["定义判断", "行为经济学", "沉没成本"], difficulty: 2 }, { id: "pd13", type: "逻辑判断", stem: `甲、乙、丙三人分别来自北京、上海、广州三地。已知：
（1）甲不来自北京；
（2）丙来自广州。

由此可以确定：`, options: ["甲来自上海，乙来自北京", "甲来自广州，乙来自上海", "乙来自上海，丙来自广州", "甲来自上海，丙来自北京"], answer: 0, explain: '由条件（2）知丙来自广州，广州这一选项已被占用。由条件（1）知甲不来自北京，而广州也已归属丙，故甲只能来自上海。剩下乙只能来自北京。因此三人的来源确定为：甲来自上海、乙来自北京、丙来自广州，A 项正确。B 项说"甲来自广州"，与条件（2）矛盾（广州已归丙）；C 项说"乙来自上海"，与实际推出的"甲来自上海"矛盾；D 项说"丙来自北京"，直接与条件（2）"丙来自广州"冲突。故答案为 A。', points: ["逻辑推理", "匹配排序", "排除法"], difficulty: 2 }, { id: "pd14", type: "类比推理", stem: "按“表演者—表演依据—其中需要演绎的语言内容”的关系，下列与“演员∶剧本∶台词”对应最一致的是：", options: ["厨师∶菜谱∶食材", "歌手∶乐谱∶歌词", "教师∶教材∶习题", "司机∶地图∶路线"], answer: 1, explain: "歌手根据乐谱演唱其中的歌词，符合题干明确限定的表演者、依据及语言内容三层关系。食材是操作对象，习题是学习任务，路线是空间信息，均不满足这一完整限定。故选B。", points: ["类比推理", "三元关系", "择优"], difficulty: 3 }, { id: "pd15", type: "逻辑判断", stem: `甲、乙、丙三人中有一人打碎了花瓶。甲说："是乙打碎的。"乙说："不是我打碎的。"丙说："不是我打碎的。"已知三人中只有一人说了真话。

打碎花瓶的是：`, options: ["甲", "乙", "丙", "无法确定"], answer: 2, explain: '用假设法逐一检验。假设是甲打碎的：则甲说"是乙"为假；乙说"不是我"为真；丙说"不是我"为真。此时有两人说真话，与"只有一人说真话"矛盾，排除甲。假设是乙打碎的：则甲说"是乙"为真；乙说"不是我"为假；丙说"不是我"为真。此时也是两人说真话，矛盾，排除乙。假设是丙打碎的：则甲说"是乙"为假；乙说"不是我"为真；丙说"不是我"为假。此时恰好只有乙一人说真话，符合条件。故打碎花瓶的是丙，答案为 C。', points: ["逻辑推理", "真假推理", "假设法"], difficulty: 2 }, { id: "pd16", type: "定义判断", stem: `正外部性是指个体的经济活动使他人或社会受益，而受益者无须为此支付代价的情形。

根据上述定义，下列属于正外部性的是：`, options: ["果农种植果树，蜜蜂采蜜使附近养蜂人的蜂蜜产量提高，养蜂人未支付任何费用", "工厂排放污水导致下游渔场减产", "居民在自家院子里修建围墙以保护隐私", "企业支付广告费以提高产品知名度"], answer: 0, explain: "正外部性的核心要件：①经济活动使他人受益；②受益者无须支付代价。A 项中果农种果树（经济活动）使养蜂人蜂蜜增产（他人受益），养蜂人未付费用（无偿），两个要件齐备。B 项是工厂排污损害他人利益，属于负外部性，方向相反；C 项修围墙是自利行为，未使他人受益；D 项广告提高的是企业自身知名度，且企业为此支付了费用，均不符合定义。故答案为 A。", points: ["定义判断", "经济学概念", "要件比对"], difficulty: 2 }, { id: "pd17", type: "类比推理", stem: `降温∶寒冷

下列哪组既保持“改变温度—对应冷热感受”的关系，又与题干的温度变化方向相反？`, options: ["加热∶温暖", "下雨∶潮湿", "运动∶健康", "施肥∶肥沃"], answer: 0, explain: "题干限定为温度变化和相应冷热感受。加热使温度升高，对应温暖，与降温方向相反。其余选项分别涉及湿度、健康与土壤肥力，不属于这一温度关系。故选A。", points: ["类比推理", "因果关系", "择优"], difficulty: 2 }, { id: "pd18", type: "逻辑判断", stem: `【模拟阅读材料，仅用于理解与推理练习】
某市推行"垃圾分类积分兑换"政策后，该市生活垃圾总量下降了 15%。研究已确认政策前后该市人口数量和消费水平没有明显变化。市政府认为这一政策有效地减少了垃圾产生。

以下哪项如果为真，最能支持市政府的结论？`, options: ["同期该市开展了大规模的垃圾分类宣传教育活动", "积分兑换政策实施前后的三个月内，该市人口数量和消费水平基本没有变化", "与该市原有垃圾变化趋势及人口消费条件相近的周边城市，未推行该政策，垃圾总量同期基本持平", "该市居民对垃圾分类政策的知晓率超过 90%"], answer: 2, explain: "C项引入原有趋势和条件相近、但未实施政策的对照地区，其垃圾总量不变，可支持下降与政策有关。B项重复题干已知信息，不是新增支持；A项引入其他干预，D项知晓率不能直接说明减量。故选C。", points: ["加强论证", "对照实验", "排除他因"], difficulty: 3 }, { id: "pd19", type: "逻辑判断", stem: `【模拟阅读材料，仅用于理解与推理练习】
有研究人员称，经常使用社交媒体的人比不使用的人更容易感到孤独。

以下哪项如果为真，最能解释这一现象？`, options: ['社交媒体上展示的往往是他人精心筛选的"美好生活"，容易引发比较心理和自我否定', "社交媒体平台会收集用户的使用数据", "不使用社交媒体的人通常年龄较大", "社交媒体的用户数量逐年增长"], answer: 0, explain: '本题考查对现象的"解释"。题干现象是"用社交媒体多→更孤独"，需要给出一个能打通二者的机制。A 项提出具体心理机制：用户看到他人精心筛选的"美好生活"后进行向上比较，产生自我否定，进而感到孤独——这一因果链条完整解释了现象，解释力最强。B 项讲数据收集，与孤独感无因果关系；C 项提出年龄差异，但未说明年龄与孤独感如何关联，且属于对样本的旁证而非机制；D 项只是用户增长的事实，与"使用者的孤独感"无关。故答案为 A。', points: ["原因解释", "因果机制"], difficulty: 2 }, { id: "pd20", type: "定义判断", stem: `路径依赖是指人类社会中的技术演进或制度变迁均有类似于物理学中的惯性，即一旦进入某一路径就可能对这种路径产生依赖。

根据上述定义，下列不属于路径依赖的是：`, options: ["QWERTY键盘布局普及后，培训和设备长期围绕它形成配套；替代布局出现时，使用者仍因转换成本而沿用旧布局", "某地区的铁路轨距沿用百年前的规格，导致新列车需专门定制", "某公司长期使用一套低效的审批流程，员工虽抱怨但因习惯而无人推动修改", "某企业根据市场调研结果，果断切换到了全新的技术路线"], answer: 3, explain: "A、B、C均体现既有选择与配套习惯带来的持续影响，D项根据新信息切换路线，体现打破既有依赖，故选D。此题不依赖关于键盘最初设计目的的争议说法。", points: ["定义判断", "选非题", "制度经济学"], difficulty: 2 }] }, bi = { id: "ziliao", name: "资料分析", short: "资料", desc: "增长率 · 比重 · 平均数 · 倍数关系", accent: "#9C2B27", questions: [{ id: "zl01", type: "增长率", stem: "2025 年某市高新技术企业产值达到 480 亿元，比上年增长 20%。2024 年该市高新技术企业产值为多少亿元？", material: `根据以下资料回答本组题目。

2025 年，某市高新技术产业实现产值 480 亿元，比上年增长 20%；实现利润 62 亿元，比上年增长 24%。`, options: ["384 亿元", "400 亿元", "420 亿元", "460 亿元"], answer: 1, explain: "已知现期量与增长率，求基期量。公式：基期量 = 现期量 ÷ (1 + 增长率)。代入：480 ÷ (1 + 20%) = 480 ÷ 1.2 = 400（亿元）。故答案为 B。快速验算：400 × 1.2 = 480，符合。常见错误是用 480 × (1 − 20%) = 384 得到 A 项——增长率的分母是基期量而非现期量，因此不能反向用乘法。", points: ["基期量", "增长率", "易错陷阱"], difficulty: 1 }, { id: "zl02", type: "增长率", stem: "根据材料，2024 年该市高新技术产业实现利润约为多少亿元？", options: ["47.2 亿元", "50 亿元", "52 亿元", "58 亿元"], answer: 1, explain: '利润基期量 = 62 ÷ (1 + 24%) = 62 ÷ 1.24 = 50（亿元）。故答案为 B。计算技巧：62 ÷ 1.24 可先化简，注意到 1.24 × 50 = 62，恰好整除。资料分析中当选项差距较大时，可用"首位判断法"估算：62 ÷ 1.24 ≈ 62 ÷ 1.25 = 49.6，接近 50，直接锁定 B。', points: ["基期量", "速算技巧"], difficulty: 2, material: `根据以下资料回答本组题目。

2025 年，某市高新技术产业实现产值 480 亿元，比上年增长 20%；实现利润 62 亿元，比上年增长 24%。` }, { id: "zl03", type: "增长率", stem: "根据材料，2025 年该市高新技术产业利润率（利润÷产值）约为：", material: "2025 年，某市高新技术产业实现产值 480 亿元，实现利润 62 亿元。", options: ["11.5%", "12.9%", "13.5%", "14.2%"], answer: 1, explain: "利润率 = 利润 ÷ 产值 = 62 ÷ 480 ≈ 0.1292，即约 12.9%。故答案为 B。计算技巧：62 ÷ 480 = 62 ÷ 48 ÷ 10 = 1.2917 ÷ 10 = 12.92%。也可用简化法：62/480 ≈ 60/480 = 12.5%，实际略高于此，故在四个选项中选 12.9%。", points: ["比重", "利润率", "速算技巧"], difficulty: 2 }, { id: "zl04", type: "增长率", stem: "某省 2025 年粮食产量为 1200 万吨，2024 年为 1000 万吨。2025 年粮食产量的同比增长率为：", options: ["16.7%", "20%", "25%", "30%"], answer: 1, explain: '增长率 = (现期量 − 基期量) ÷ 基期量 = (1200 − 1000) ÷ 1000 = 200 ÷ 1000 = 20%。故答案为 B。注意分母是基期量（2024 年数据 1000），与"增长量占现期量的比重"不同，后者为 200 ÷ 1200 ≈ 16.7%（即 A 项陷阱）。', points: ["增长率", "基期量", "易错陷阱"], difficulty: 1 }, { id: "zl05", type: "比重", stem: "2025 年某市第三产业增加值为 3850 亿元，全市地区生产总值为 7000 亿元。第三产业占地区生产总值的比重为：", options: ["45%", "50%", "55%", "60%"], answer: 2, explain: "比重 = 部分量 ÷ 总体量 = 3850 ÷ 7000 = 0.55，即 55%。故答案为 C。计算技巧：3850 ÷ 7000，可先算 385 ÷ 700 ≈ 0.55，再定小数位。选项为 5% 一档，差距明显，直接心算 3850/7000 = 0.55 即可。", points: ["比重", "现期比重"], difficulty: 1 }, { id: "zl06", type: "平均数", stem: "某企业 2025 年营业收入 8.4 亿元，员工总数为 1200 人。该企业 2025 年人均营业收入为多少万元？", options: ["60 万元", "65 万元", "70 万元", "75 万元"], answer: 2, explain: "先统一单位：8.4 亿元 = 84000 万元。人均营业收入 = 84000 ÷ 1200 = 70（万元/人）。故答案为 C。单位换算是资料分析最高频的失分点，务必在计算前把亿元换算成万元再除，避免量级错位（若忘记换算会算出 0.007 万元而完全偏离选项）。", points: ["平均数", "单位换算", "易错陷阱"], difficulty: 2 }, { id: "zl07", type: "倍数关系", stem: "2025 年 A 市外贸进出口总额为 6300 亿美元，B 市为 2100 亿美元。A 市外贸额是 B 市的多少倍？", options: ["2 倍", "3 倍", "3.5 倍", "4 倍"], answer: 1, explain: '"A 是 B 的多少倍"用除法：6300 ÷ 2100 = 3（倍）。故答案为 B。辨析要点：注意区分"A 是 B 的几倍"（A ÷ B）与"A 比 B 多几倍"（A ÷ B − 1 = 2 倍）。若题目问"多几倍"，答案应为 2 倍。', points: ["倍数关系", "是几倍与多几倍"], difficulty: 1 }, { id: "zl08", type: "增长率", stem: "某市 2025 年城镇居民人均可支配收入为 68000 元，比上年增长 5.5%。则增加的绝对额为多少元？", options: ["3400 元", "3545 元", "3740 元", "3800 元"], answer: 1, explain: '先求基期量 = 68000 ÷ 1.055 ≈ 64455（元）。增长量 = 68000 − 64455 ≈ 3545（元）。故答案为 B。速算技巧：增长量 = 现期量 ÷ (1 + r) × r = 68000 ÷ 1.055 × 0.055 ≈ 64455 × 0.055 ≈ 3545。也可用估算：68000 × 5.5% = 3740，由于实际基期量小于现期量，故增长量应略小于 3740，选 3545。此类"增长量"题最忌直接用现期量乘增长率。', points: ["增长量", "增长率", "速算技巧", "易错陷阱"], difficulty: 3 }, { id: "zl09", type: "比重", stem: "2024 年某市高新技术产业产值占工业总产值的比重为 32%，2025 年该比重上升到 40%。2025 年高新技术产业产值占工业总产值的比重比 2024 年提高了多少个百分点？", options: ["6 个百分点", "8 个百分点", "10 个百分点", "25 个百分点"], answer: 1, explain: '"比重提高多少个百分点"直接做减法：40% − 32% = 8%，即提高了 8 个百分点。故答案为 B。关键辨析：比重的变化用"百分点"衡量，直接相减；若问"比重增长了百分之几"，则需用 (40% − 32%) ÷ 32% = 25%（对应 D 项陷阱）。这是资料分析中最具区分度的考点之一。', points: ["比重变化", "百分点与百分数", "易错陷阱"], difficulty: 3 }, { id: "zl10", type: "平均数", stem: "某地区 2025 年棉花种植面积为 150 万亩，总产量为 18 万吨。该地区棉花单位面积产量约为多少公斤/亩？", options: ["100 公斤/亩", "110 公斤/亩", "120 公斤/亩", "130 公斤/亩"], answer: 2, explain: '统一单位：18 万吨 = 180000 吨 = 18000 万公斤。单位面积产量 = 18000 万公斤 ÷ 150 万亩 = 120（公斤/亩）。故答案为 C。单位换算路径：1 吨 = 1000 公斤，故 18 万吨 = 180000 吨 = 1.8 亿公斤 = 18000 万公斤。计算时先换成"万公斤"再除以"万亩"，可直接约去"万"，得 18000 ÷ 150 = 120。', points: ["平均数", "单位换算", "易错陷阱"], difficulty: 3 }, { id: "zl11", type: "增长率", stem: "某公司 2023 年、2024 年、2025 年营业收入分别为 500 万元、600 万元、750 万元。以 2023 年为基期，2025 年营业收入比 2023 年增长了：", options: ["40%", "50%", "60%", "66.7%"], answer: 1, explain: '题干明确了"以 2023 年为基期"，因此直接用两端数据计算：增长率 = (750 − 500) ÷ 500 = 250 ÷ 500 = 50%。故答案为 B。审题要点：这类题的关键在于看清"基期是哪一年"。若题目问的是"2025 年比 2024 年增长多少"，则是 (750 − 600) ÷ 600 = 25%；若问"2024 年比 2023 年增长多少"，则为 (600 − 500) ÷ 500 = 20%。题干给定基期时，直接取两端数据相减再除以基期量即可，无需分年复合计算。', points: ["增长率", "基期量", "审题要点"], difficulty: 2 }, { id: "zl12", type: "比重", stem: "某市 2025 年农村居民人均可支配收入 24000 元，城镇居民人均可支配收入 48000 元。农村居民收入相当于城镇居民的：", options: ["40%", "50%", "60%", "200%"], answer: 1, explain: '"农村相当于城镇的百分之几"用部分除以参照对象：24000 ÷ 48000 = 0.5 = 50%。故答案为 B。辨析要点：注意区分"相当于"（直接相除）与"城乡收入比"的表述；若问"城乡收入差距倍数"则是 48000 ÷ 24000 = 2 倍。D 项 200% 是把分子分母颠倒所致。', points: ["比重", "倍数关系", "易错陷阱"], difficulty: 2 }, { id: "zl13", type: "平均数", stem: "某企业 2025 年 1—6 月营业收入分别为：420、380、450、510、480、560（单位：万元）。该企业上半年月均营业收入约为多少万元？", options: ["455 万元", "460 万元", "467 万元", "470 万元"], answer: 2, explain: "六个月合计 = 420 + 380 + 450 + 510 + 480 + 560 = 2800（万元）。月均 = 2800 ÷ 6 ≈ 466.7（万元），约 467 万元。故答案为 C。速算技巧：先取整估算，六个月均在 380—560 之间，中心值约 467；或用凑整法：420+380=800，450+510=960，480+560=1040，合计 2800，除以 6 得 466.67。", points: ["平均数", "速算技巧"], difficulty: 2 }, { id: "zl14", type: "增长率", stem: "某产品 2025 年产量为 1250 件，比 2024 年减少了 20%。2024 年该产品产量为多少件？", options: ["1500 件", "1563 件", "1600 件", "1700 件"], answer: 1, explain: '本题是"已知现期量与下降率求基期量"。公式：基期量 = 现期量 ÷ (1 − 下降率) = 1250 ÷ (1 − 20%) = 1250 ÷ 0.8 = 1562.5 ≈ 1563（件）。故答案为 B。高频陷阱：下降时很多人误用 1250 × (1 + 20%) = 1500 得到 A 项，但这是错误方向——基期量必然大于现期量（因为产量下降了），而 1500 < 1563，与逻辑矛盾；且 1250 × 1.2 = 1500 表示的是"从 1500 下降 20% 得 1200"，与题给 1250 不符。', points: ["基期量", "下降率", "易错陷阱"], difficulty: 3 }, { id: "zl15", type: "比重", stem: "2025 年某市规模以上工业企业共 1200 家，其中亏损企业 180 家。亏损企业占规模以上工业企业的比重为：", options: ["12%", "15%", "18%", "20%"], answer: 1, explain: "比重 = 180 ÷ 1200 = 0.15 = 15%。故答案为 B。速算技巧：180/1200 先约分为 18/120，再约分为 3/20 = 0.15。选项间距较大（3 个百分点），口算即可锁定。", points: ["比重", "现期比重"], difficulty: 1 }, { id: "zl16", type: "增长率", stem: "某省 2025 年快递业务量为 32 亿件，同比增长 25%。该省 2024 年快递业务量约为多少亿件？", options: ["24.0 亿件", "25.6 亿件", "26.7 亿件", "28.0 亿件"], answer: 1, explain: "基期量 = 32 ÷ (1 + 25%) = 32 ÷ 1.25 = 25.6（亿件）。故答案为 B。速算技巧：除以 1.25 等价于乘以 0.8，即 32 × 0.8 = 25.6，比直除更快。牢记常用转换：÷1.25 = ×0.8，÷1.5 = ×(2/3)，÷1.1 ≈ ×0.909。A 项 24.0 是用 32 × (1 − 25%) = 24 得到的，属方向性错误。", points: ["基期量", "速算技巧", "易错陷阱"], difficulty: 2 }, { id: "zl17", type: "平均数", stem: "某市 2025 年 GDP 为 5600 亿元，常住人口 800 万人。该市人均 GDP 约为多少万元？", options: ["6.4 万元", "7.0 万元", "7.5 万元", "8.0 万元"], answer: 1, explain: '人均 GDP = 5600 亿元 ÷ 800 万人 = 7（万元/人）。故答案为 B。单位换算思路：5600 亿元 ÷ 800 万人 = (5600 ÷ 800)（亿元/万人）= 7 亿元/万人 = 7 万元/人（因为 1 亿元 ÷ 1 万人 = 1 万元/人）。换算过程虽绕，但只要抓住"亿元/万人 = 万元/人"这一等价关系，可直接相除。', points: ["平均数", "单位换算", "速算技巧"], difficulty: 2 }, { id: "zl18", type: "比重", stem: "某公司 2025 年研发投入 1.8 亿元，占营业收入的比重为 6%。该公司 2025 年营业收入为多少亿元？", options: ["24 亿元", "27 亿元", "30 亿元", "33 亿元"], answer: 2, explain: '已知部分量与比重求总体量：总体量 = 部分量 ÷ 比重 = 1.8 ÷ 6% = 1.8 ÷ 0.06 = 30（亿元）。故答案为 C。速算技巧：除以 6% 等价于除以 0.06，即乘以 100/6 ≈ 16.67，1.8 × 16.67 = 30。也可用倍数思路：研发占比 6% 意味着"每 100 元收入中有 6 元研发"，则收入 = 研发 × (100/6) = 1.8 × 16.67 = 30。', points: ["比重", "总体量", "速算技巧"], difficulty: 2 }, { id: "zl19", type: "增长率", stem: "某市 2024 年一般公共预算收入为 420 亿元，2025 年达到 483 亿元。2025 年该市一般公共预算收入的同比增长率约为：", options: ["13%", "15%", "17%", "20%"], answer: 1, explain: "增长率 = (483 − 420) ÷ 420 = 63 ÷ 420 = 0.15 = 15%。故答案为 B。速算技巧：63 ÷ 420 先约分，63/420 = 21/140 = 3/20 = 0.15。也可用首位判断：63/420 ≈ 60/400 = 15%，锁定答案。", points: ["增长率", "速算技巧"], difficulty: 2 }, { id: "zl20", type: "平均数", stem: "根据材料，2025 年该市一般公共预算收入相当于支出的百分之几？", material: "某市 2024 年一般公共预算收入为 420 亿元，2025 年达到 483 亿元；2025 年一般公共预算支出为 560 亿元。", options: ["79.5%", "82.3%", "86.3%", "90.2%"], answer: 2, explain: '所求 = 483 ÷ 560 ≈ 0.8625，即约 86.3%。故答案为 C。速算技巧：483/560，可先算 480/560 = 6/7 ≈ 0.857，实际分子略大，故结果略高于 85.7%，在选项中对应 86.3%。也可用 483 ÷ 56 ≈ 8.625 再移位，得 0.8625。此类题注意分母是"支出"而非"收入"，读题时务必确认比较方向。', points: ["比重", "速算技巧", "读题细节"], difficulty: 3 }] }, _i = { id: "changshi", name: "常识判断", short: "常识", desc: "政治 · 法律 · 科技 · 人文 · 地理", accent: "#2A4468", questions: [{ id: "cs01", type: "法律常识", stem: "根据我国《民法典》，下列关于民事行为能力年龄的表述，正确的是：", options: ["八周岁以上的未成年人一般为限制民事行为能力人，法定例外除外", "六周岁以上的未成年人为限制民事行为能力人", "十周岁以上的未成年人为限制民事行为能力人", "十四周岁以上的未成年人为完全民事行为能力人"], answer: 0, explain: "《民法典》第十七条规定十八周岁以上为成年人；第十八条规定成年人为完全民事行为能力人，十六周岁以上且以自己的劳动收入为主要生活来源的未成年人视为完全民事行为能力人。第十九条规定八周岁以上未成年人为限制民事行为能力人，但第二十一条还规定，八周岁以上未成年人不能辨认自己行为的，适用无民事行为能力的规定。因此 A 表述为一般规则并保留法定例外，其他选项将六、十或十四周岁写成通用门槛均不正确。八周岁门槛在2017年《民法总则》第十九条中已经存在，并非《民法典》首次规定。", points: ["民法典", "民事行为能力", "年龄节点"], difficulty: 1 }, { id: "cs02", type: "政治常识", stem: "我国宪法规定，中华人民共和国的一切权力属于：", options: ["人民", "人民代表大会", "中国共产党", "国务院"], answer: 0, explain: '《宪法》第二条规定："中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。"故 A 项正确。易混淆点：人民代表大会是人民行使国家权力的机关，本身也是"代表人民"行使权力，但权力归属的主体是"人民"；中国共产党是领导核心，但宪法表述的权力归属是"人民"；国务院是最高国家行政机关，是执行机关。', points: ["宪法", "国家性质", "易混淆"], difficulty: 1 }, { id: "cs03", type: "科技常识", stem: "下列关于我国航天成就的表述，正确的是：", options: ['"天问一号"是我国首次火星探测任务，实现了火星环绕、着陆和巡视三大目标', '"嫦娥五号"实现了人类首次月球背面软着陆', '"北斗三号"是全球卫星导航系统，仅覆盖亚太地区', '"神舟十二号"是我国首次载人航天飞行任务'], answer: 0, explain: 'A 项正确：2020 年发射的"天问一号"是我国首次自主火星探测任务，通过一次任务实现了"绕、落、巡"三大目标，2021 年 5 月"祝融号"火星车成功着陆火星并开展巡视探测。B 项错误：实现人类首次月球背面软着陆的是"嫦娥四号"（2019 年），"嫦娥五号"的任务是月球采样返回（2020 年）。C 项错误："北斗三号"全球卫星导航系统建成后可为全球用户提供服务，覆盖范围是全球而非仅亚太。D 项错误：我国首次载人航天飞行任务是 2003 年的"神舟五号"（杨利伟），"神舟十二号"是空间站阶段首次载人飞行任务。', points: ["航天工程", "科技成就", "时政"], difficulty: 2 }, { id: "cs04", type: "人文常识", stem: "下列文学常识表述正确的一项是：", options: ["《史记》是我国第一部编年体通史，作者是班固", "《资治通鉴》是我国第一部编年体通史，作者是司马光", "《汉书》是我国第一部纪传体通史，作者是司马迁", "《三国志》是我国第一部国别体史书，作者是陈寿"], answer: 1, explain: 'B 项正确：《资治通鉴》由北宋司马光主持编纂，是我国第一部编年体通史，记载了从战国到五代的历史。A 项错误：《史记》是我国第一部纪传体通史（非编年体），作者是西汉司马迁（非班固）。C 项错误：《汉书》是我国第一部纪传体断代史（非通史），作者是东汉班固（非司马迁）。D 项错误：《三国志》是纪传体断代史（"国别体"的典型是《国语》《战国策》），作者是西晋陈寿。四个选项集中考查"史书体例＋作者"的对应，是常识判断的高频命题方式。', points: ["文学常识", "史书体例", "作者对应"], difficulty: 2 }, { id: "cs05", type: "法律常识", stem: "按标准工时制度计算，职工每日正常工作时间为多少小时（不含依法延长的工作时间）？", options: ["6 小时", "8 小时", "10 小时", "12 小时"], answer: 1, explain: "《国务院关于职工工作时间的规定》第三条规定，职工每日工作8小时、每周工作40小时，故选 B。《劳动法》第三十六条的文本是每日不超过8小时、平均每周不超过44小时；应与上述标准工时规定区分。延长工作时间另有条件：《劳动法》第四十一条要求因生产经营需要，经与工会和劳动者协商，一般每日延长不超过1小时；特殊原因下，在保障劳动者身体健康的条件下每日延长不超过3小时、每月不超过36小时。第四十二条规定的紧急情形等不受第四十一条限制；第三十九条及工时规定第五条还涉及依法实行其他工作和休息办法，不能把正常工时答案理解为任何情况下每天一律不得超过8小时。", points: ["劳动法", "工时制度", "数字记忆"], difficulty: 1 }, { id: "cs06", type: "地理常识", stem: "下列关于我国地理的表述，正确的是：", options: ["长江是我国最长的河流，发源于青藏高原的唐古拉山", "黄河是我国第一长河，最终注入渤海", "珠江是我国最长的内流河", "塔里木河最终注入东海"], answer: 0, explain: 'A 项正确：长江全长约 6300 公里，是我国最长的河流，也是世界第三长河，发源于青藏高原唐古拉山脉的各拉丹冬峰，最终注入东海。B 项错误：黄河是我国第二长河（不是第一），发源于巴颜喀拉山，注入渤海。C 项错误：珠江是外流河（注入南海），我国最长的内流河是塔里木河。D 项错误：塔里木河是内流河，最终消失于沙漠中（台特玛湖），不注入东海。本题集中考查"河流长度排序、发源地、注入海域、内外流属性"四个维度的组合辨析。', points: ["中国地理", "河流", "内流河"], difficulty: 2 }, { id: "cs07", type: "政治常识", stem: "党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进：", options: ["高质量发展", "中华民族伟大复兴", "共同富裕", "全面深化改革"], answer: 1, explain: '党的二十大报告明确指出："从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"故 B 项正确。"高质量发展"是全面建设社会主义现代化国家的首要任务；"共同富裕"是社会主义的本质要求，也是中国式现代化的本质要求之一；"全面深化改革"是"四个全面"战略布局的重要内容。这些表述极易混淆，需按原文准确记忆。', points: ["党的二十大", "中国式现代化", "时政原文"], difficulty: 2 }, { id: "cs08", type: "科技常识", stem: "下列现象与其物理原理对应正确的是：", options: ["用吸管吸饮料——大气压强的作用", '筷子斜插入水中看起来"折断"——光的反射', "在游泳池边看到池底比实际浅——光的反射", "夏天从冰箱取出的饮料瓶外壁出现水珠——水汽化"], answer: 0, explain: 'A 项正确：用吸管吸饮料时，管内空气被吸走导致气压降低，外界大气压大于管内气压，将饮料压入管中，这是大气压强作用的典型例子。B 项错误：筷子斜插入水中看起来"折断"，是光从水中射入空气时发生折射、使水下部分的位置看上去发生偏移，属于光的折射而非反射。C 项错误：看到池底比实际浅，同样是光从水射入空气时发生折射、视深小于实深造成的，也属折射而非反射。D 项错误：瓶外壁出现的水珠，是空气中的水蒸气遇冷变成小水滴附着在瓶壁上，这个过程是"液化"而非"汽化"（汽化是液态变气态）。故答案为 A。', points: ["物理常识", "光现象", "物态变化", "大气压"], difficulty: 2 }, { id: "cs09", type: "地理常识", stem: '我国四大高原中，被称为"世界屋脊"的是：', options: ["内蒙古高原", "黄土高原", "青藏高原", "云贵高原"], answer: 2, explain: '青藏高原平均海拔 4000 米以上，是世界上海拔最高的大高原，素有"世界屋脊"和"第三极"之称。故 C 项正确。其余三大高原的特征：内蒙古高原地势平坦，多草原，有"天苍苍，野茫茫"之称；黄土高原是世界上最大的黄土堆积区，水土流失严重，地表沟壑纵横；云贵高原地形崎岖，喀斯特地貌广布，有"地无三尺平"之说。', points: ["中国地理", "四大高原", "地貌特征"], difficulty: 1 }, { id: "cs10", type: "法律常识", stem: "根据我国《刑法》，已满多少周岁的人犯罪，应当负刑事责任（即完全刑事责任年龄）？", options: ["14 周岁", "16 周岁", "18 周岁", "20 周岁"], answer: 1, explain: '《刑法》第十七条规定："已满十六周岁的人犯罪，应当负刑事责任。"故 B 项正确。完整的刑事责任年龄体系需要一并掌握：①已满十六周岁，应当负完全刑事责任；②已满十四周岁不满十六周岁，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任；③已满十二周岁不满十四周岁，犯故意杀人、故意伤害罪，致人死亡或以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任。', points: ["刑法", "刑事责任年龄", "数字记忆"], difficulty: 2 }, { id: "cs11", type: "人文常识", stem: '"不以物喜，不以己悲"一句出自哪篇作品？', options: ["《岳阳楼记》", "《醉翁亭记》", "《滕王阁序》", "《赤壁赋》"], answer: 0, explain: '"不以物喜，不以己悲"出自北宋范仲淹的《岳阳楼记》，上一句为"嗟夫！予尝求古仁人之心，或异二者之为，何哉？"，这正是作者借古仁人之心表达"先天下之忧而忧，后天下之乐而乐"政治抱负的关键铺垫。故 A 项正确。其余作品辨析：《醉翁亭记》是欧阳修的名篇，"醉翁之意不在酒"出自其中；《滕王阁序》是王勃的作品，"落霞与孤鹜齐飞，秋水共长天一色"出自其中；《赤壁赋》是苏轼的作品，分前后两篇。', points: ["文学常识", "名篇名句", "作者对应"], difficulty: 1 }, { id: "cs12", type: "科技常识", stem: "下列关于人体生理的表述，正确的是：", options: ["人体最大的器官是心脏", "胰岛素由胰腺胰岛中的β细胞制造", "人体最长的骨头是脊椎骨", "胰岛素由肝脏分泌"], answer: 1, explain: "B项正确：胰腺的胰岛中含有制造胰岛素的β细胞，因此D项错误。A项错误：皮肤是人体最大的器官。C项错误：股骨（大腿骨）是人体最长的骨头。", points: ["生物常识", "人体生理", "易混淆"], difficulty: 2 }, { id: "cs13", type: "政治常识", stem: "我国的根本政治制度是：", options: ["人民代表大会制度", "中国共产党领导的多党合作和政治协商制度", "民族区域自治制度", "基层群众自治制度"], answer: 0, explain: '人民代表大会制度是我国的根本政治制度，是中国人民当家作主的根本途径和最高实现形式。故 A 项正确。其余三项均为我国的基本政治制度：B 项是中国共产党领导的多党合作和政治协商制度；C 项是民族区域自治制度；D 项是基层群众自治制度。这三项与"根本政治制度"的层级不同，是政治常识中最经典的混淆点，务必牢记"一根本、三基本"的框架。', points: ["政治制度", "根本政治制度", "易混淆"], difficulty: 1 }, { id: "cs14", type: "人文常识", stem: "下列作品与作者对应错误的是：", options: ["《雷雨》——曹禺", "《骆驼祥子》——老舍", "《边城》——沈从文", "《家》——鲁迅"], answer: 3, explain: 'D 项对应错误：《家》是巴金的作品（"激流三部曲"之一，包括《家》《春》《秋》），不是鲁迅所作。鲁迅的代表作有《呐喊》《彷徨》《阿Q正传》《狂人日记》等。A 项《雷雨》是曹禺的话剧代表作；B 项《骆驼祥子》是老舍的长篇小说代表作；C 项《边城》是沈从文的中篇小说代表作，三项对应均正确。故答案为 D。', points: ["文学常识", "现当代文学", "作者对应"], difficulty: 2 }, { id: "cs15", type: "科技常识", stem: "下列关于新能源的表述，错误的是：", options: ["太阳能、风能属于可再生能源", "核能发电不产生二氧化碳，因此被归为可再生能源", "水能属于可再生能源", "地热能属于可再生能源"], answer: 1, explain: 'B 项表述错误：核能发电确实在运行过程中不直接产生二氧化碳，但核燃料（铀等）属于不可再生的矿产资源，储量有限，因此核能通常被归为"清洁能源"而非"可再生能源"，两个概念不能混同。A 项正确：太阳能、风能可持续获取，属可再生能源；C 项正确：水能属于可再生能源；D 项正确：地热能来自地球内部的热量，可持续利用，属可再生能源。故答案为 B。', points: ["新能源", "可再生能源辨析", "易混淆"], difficulty: 3 }, { id: "cs16", type: "地理常识", stem: "我国面积最大的省级行政区是：", options: ["西藏自治区", "新疆维吾尔自治区", "内蒙古自治区", "青海省"], answer: 1, explain: '新疆维吾尔自治区面积约 166 万平方公里，约占我国国土总面积的六分之一，是我国面积最大的省级行政区。故 B 项正确。面积排序（前四）：新疆（约 166 万 km²）> 西藏（约 120 万 km²）> 内蒙古（约 118 万 km²）> 青海（约 72 万 km²）。这是常识判断中的高频记忆点，建议按"新疆、西藏、内蒙古、青海"的顺序记忆。', points: ["中国地理", "行政区面积", "数字记忆"], difficulty: 1 }, { id: "cs17", type: "法律常识", stem: "根据我国《民法典》，下列关于诉讼时效的表述，正确的是：", options: ["向人民法院请求保护民事权利的诉讼时效期间一般为三年", "诉讼时效期间一般为二年", "诉讼时效期间一律为二十年", "诉讼时效期间为一年"], answer: 0, explain: "《民法典》第一百八十八条规定，向人民法院请求保护民事权利的诉讼时效期间一般为三年，法律另有规定的依照其规定，故 A 正确。一般从权利人知道或者应当知道权利受到损害以及义务人之日起计算；法律另有规定的，依其规定。自权利受到损害之日起超过二十年的，人民法院不予保护，但有特殊情况的，人民法院可以根据权利人的申请决定延长。不能把二十年最长保护限制等同于一般时效，也不能说诉讼时效一律为二十年。一般三年的规定在2017年《民法总则》第一百八十八条中已经存在，并非《民法典》首次改成三年。", points: ["民法典", "诉讼时效", "新旧法对比"], difficulty: 2 }, { id: "cs18", type: "科技常识", stem: "下列关于 5G 技术的说法，正确的是：", options: ["5G 的核心优势是传输速率高、时延低、连接密度大", '5G 就是"5 个 G 的流量"，是资费套餐的名称', "5G 的传输速率低于 4G，但覆盖范围更广", "5G 只能应用于手机通信，不能用于工业场景"], answer: 0, explain: 'A 项正确：5G（第五代移动通信技术）的三大核心特性是增强移动宽带（eMBB，高速率）、超可靠低时延通信（uRLLC，低时延）、海量机器类通信（mMTC，大连接），即"高速率、低时延、大连接"。B 项错误：5G 是通信技术代际名称（G 代表 Generation，即"代"），与流量单位无关。C 项错误：5G 速率远高于 4G（峰值可达 10—20 Gbps），且基站更密集以满足容量需求，"覆盖更广"的说法不准确。D 项错误：5G 的典型应用场景包括工业互联网、车联网、远程医疗等，工业场景恰恰是 5G 的重要落地方向。', points: ["通信技术", "5G", "科技应用"], difficulty: 2 }, { id: "cs19", type: "人文常识", stem: '我国传统节日"端午节"的主要习俗不包括：', options: ["赛龙舟", "吃粽子", "挂艾草", "登高赏菊"], answer: 3, explain: 'D 项"登高赏菊"是重阳节（农历九月初九）的习俗，不属于端午节。端午节（农历五月初五）的主要习俗包括赛龙舟、吃粽子、挂艾草菖蒲、佩香囊、饮雄黄酒等，这些习俗与纪念屈原、驱邪避疫的文化内涵相关。其余节日习俗对应：清明节扫墓踏青；中秋节赏月吃月饼；七夕节乞巧；重阳节登高、赏菊、插茱萸、敬老。故答案为 D。', points: ["传统节日", "民俗文化", "选非题"], difficulty: 1 }, { id: "cs20", type: "政治常识", stem: "新发展理念包含的五个方面是：", options: ["创新、协调、绿色、开放、共享", "创新、改革、绿色、开放、共享", "创新、协调、生态、开放、共享", "改革、协调、绿色、开放、共赢"], answer: 0, explain: '新发展理念即"创新、协调、绿色、开放、共享"五大发展理念，是党的十八届五中全会提出的。故 A 项正确。记忆要点：创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要条件，开放是国家繁荣发展的必由之路，共享是中国特色社会主义的本质要求。B 项把"协调"误换成"改革"；C 项把"绿色"误换成"生态"；D 项把"创新"误换成"改革"、"共享"误换成"共赢"，均为常见干扰项。', points: ["新发展理念", "时政", "五个方面"], difficulty: 1 }] }, ft = {
  yanyu: vi,
  shuliang: gi,
  panduan: xi,
