adding:10px 13px;font-size:12.5px;color:#c4d0dc;line-height:1.65;margin-top:12px}\n.tip b{color:var(--text);font-weight:700}\n\n/* 组打卡 */\n.sets-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n.sets-hd-t{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted2)}\n.sets-cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n.sets{display:flex;gap:9px;margin-bottom:13px}\n.set-dot{flex:1;height:46px;border-radius:11px;background:var(--card2);\n  border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;\n  justify-content:center;gap:2px;cursor:pointer;transition:all .2s;position:relative}\n.set-dot:active{transform:scale(.94)}\n.set-num{font-size:13px;font-weight:800;color:var(--muted2);font-variant-numeric:tabular-nums}\n.set-reps{font-size:9.5px;color:var(--muted2);letter-spacing:.3px}\n.set-dot.done{background:rgba(0,224,164,.13);border-color:var(--accent)}\n.set-dot.done .set-num,.set-dot.done .set-reps{color:var(--accent)}\n\n/* 计时器 */\n.timer{background:var(--card2);border:1px solid var(--border);border-radius:12px;\n  padding:13px 14px;display:flex;align-items:center;gap:13px}\n.tm-main{flex:1;min-width:0}\n.tm-disp{display:flex;align-items:baseline;gap:5px;margin-bottom:3px}\n.tm-sec{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;\n  letter-spacing:-1px}\n.tm-sec.run{color:var(--accent)}\n.tm-sec.fin{color:var(--warn)}\n.tm-unit{font-size:11px;color:var(--muted2);font-weight:600}\n.tm-hint{font-size:10.5px;color:var(--muted2);line-height:1.5;height:16px;overflow:hidden;\n  text-overflow:ellipsis;white-space:nowrap}\n.tm-ctrls{display:flex;flex-direction:column;gap:6px;flex-shrink:0}\n.tm-row{display:flex;gap:6px}\n.tm-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text);\n  border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;\n  font-family:inherit}\n.tm-btn:active{transform:scale(.93)}\n.tm-btn:hover{border-color:var(--border2)}\n.tm-adj{width:32px;height:28px}\n.tm-play{width:60px;height:28px;background:rgba(0,224,164,.13);color:var(--accent);\n  border-color:rgba(0,224,164,.3)}\n.tm-play.on{background:rgba(255,159,67,.13);color:var(--warn);border-color:rgba(255,159,67,.3)}\n.tm-reset{width:100%;height:26px;font-size:10.5px;color:var(--muted)}\n\n/* 清单页 */\n.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}\n.chk:last-child{border-bottom:none;padding-bottom:0}\n.chk-b{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);\n  background:var(--bg2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;\n  justify-content:center;transition:all .2s;margin-top:1px}\n.chk-b:active{transform:scale(.88)}\n.chk.done .chk-b{background:var(--accent);border-color:var(--accent)}\n.chk-b svg{width:12px;height:12px;stroke:#0a0e13;stroke-width:3.2;fill:none;opacity:0;transition:opacity .2s}\n.chk.done .chk-b svg{opacity:1}\n.chk-t{flex:1;min-width:0}\n.chk-name{font-size:13.5px;font-weight:600;line-height:1.4}\n.chk.done .chk-name{color:var(--muted2);text-decoration:line-through}\n.chk-det{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}\n.chk-dose{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;flex-shrink:0;\n  margin-top:2px}\n\n/* 完成页 */\n.done-hero{text-align:center;padding:22px 0 18px}\n.done-ico{width:62px;height:62px;border-radius:50%;background:rgba(0,224,164,.13);\n  color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}\n.done-hero h2{font-size:21px;font-weight:800;margin-bottom:6px}\n.done-hero p{font-size:13px;color:var(--muted)}\n\n/* ===== 底部导航 ===== */\n.nav{flex-shrink:0;padding:11px 18px calc(11px + env(safe-area-inset-bottom));\n  border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;\n  background:rgba(10,14,19,.94);backdrop-filter:blur(12px)}\n.nav-btn "auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#ff9f43\"/></marker></defs>'\n  +'<rect x=\"112\" y=\"138\" width=\"76\" height=\"10\" rx=\"3\" fill=\"#1b242f\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<circle cx=\"150\" cy=\"62\" r=\"11\" fill=\"none\" stroke=\"#00e0a4\" stroke-width=\"3\"/>'\n  +'<line x1=\"150\" y1=\"73\" x2=\"150\" y2=\"134\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"150\" y1=\"134\" x2=\"110\" y2=\"162\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"110\" y1=\"162\" x2=\"106\" y2=\"190\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"150\" y1=\"134\" x2=\"190\" y2=\"162\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"190\" y1=\"162\" x2=\"194\" y2=\"190\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<rect x=\"96\" y=\"148\" width=\"12\" height=\"30\" rx=\"3\" fill=\"none\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<rect x=\"192\" y=\"148\" width=\"12\" height=\"30\" rx=\"3\" fill=\"none\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<line x1=\"88\" y1=\"160\" x2=\"66\" y2=\"160\" stroke=\"#ff9f43\" stroke-width=\"2.5\" marker-end=\"url(#g4)\"/>'\n  +'<line x1=\"212\" y1=\"160\" x2=\"234\" y2=\"160\" stroke=\"#ff9f43\" stroke-width=\"2.5\" marker-end=\"url(#g4)\"/>'\n  +'<text x=\"150\" y=\"202\" text-anchor=\"middle\" fill=\"#ff9f43\" font-size=\"11\" font-weight=\"700\">躯干固定 · 慢速外展</text>'\n  +'</svg>',\n\n add:\n  '<svg viewBox=\"0 0 300 210\" class=\"fig-svg\" role=\"img\" aria-label=\"坐姿髋内收示意\">'\n  +'<defs><marker id=\"g5\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#ff9f43\"/></marker></defs>'\n  +'<rect x=\"112\" y=\"138\" width=\"76\" height=\"10\" rx=\"3\" fill=\"#1b242f\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<circle cx=\"150\" cy=\"62\" r=\"11\" fill=\"none\" stroke=\"#00e0a4\" stroke-width=\"3\"/>'\n  +'<line x1=\"150\" y1=\"73\" x2=\"150\" y2=\"134\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"150\" y1=\"134\" x2=\"132\" y2=\"162\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"132\" y1=\"162\" x2=\"130\" y2=\"190\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"150\" y1=\"134\" x2=\"168\" y2=\"162\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"168\" y1=\"162\" x2=\"170\" y2=\"190\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<rect x=\"142\" y=\"158\" width=\"8\" height=\"30\" rx=\"2\" fill=\"none\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<rect x=\"150\" y=\"158\" width=\"8\" height=\"30\" rx=\"2\" fill=\"none\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<line x1=\"104\" y1=\"162\" x2=\"126\" y2=\"162\" stroke=\"#ff9f43\" stroke-width=\"2.5\" marker-end=\"url(#g5)\"/>'\n  +'<line x1=\"196\" y1=\"162\" x2=\"174\" y2=\"162\" stroke=\"#ff9f43\" stroke-width=\"2.5\" marker-end=\"url(#g5)\"/>'\n  +'<text x=\"150\" y=\"202\" text-anchor=\"middle\" fill=\"#ff9f43\" font-size=\"11\" font-weight=\"700\">向内夹 · 顶峰停顿</text>'\n  +'</svg>'\n};\n\n/* ============ 数据 ============ */\nvar TOTAL_SETS = 0;\nvar PAGES = [\n/* 0 封面 */ { type:'cover' },\n\n/* 1 热身 */ { type:'list', title:'热身激活', sub:'先松髋屈肌 · 再激活臀肌', ico:'热',\n  dur:'约 10 分钟', accent:'#ff9f43', accentBg:'rgba(255,159,67,.13)',\n  tip:'<b>为什么先松髋屈肌、再激活臀：</b>久坐让髂腰肌、股直肌长期缩短，它们一紧就会抑制臀肌发力（俗称\"臀肌失忆\"）。不先松开，臀推和倒蹬的力会跑到腰和大腿前侧，练完腰酸、臀没感觉。先用 3 分钟松开髋前侧，再用臀桥、蚌式把臀大肌和臀中肌叫醒，后面的大重量才能真正落到臀上。',\n  items:[\n    {n:'髋屈肌 / 股直肌松解', d:'泡沫轴或网球压在大腿根部前侧，缓慢滚动', s:'约 2 分钟'},\n    {n:'臀肌松解', d:'泡沫轴坐滚臀大肌、臀中肌', s:'约 1 分钟'},\n    {n:'骨盆前后倾', d:'四点跪位或站姿，逐节活动骨盆与腰椎', s:'1 组 × 10 次'},\n    {n:'徒手臀桥', d:'脚跟发力顶髋，顶峰夹臀停 1 秒', s:'2 组 × 15 次'},\n    {n:'蚌式开合', d:'侧卧屈膝，双脚并拢，上方膝盖打开', s:'2 组 × 15 次/侧'},\n    {n:'弹力带侧向行走', d:'弹力带套在膝上方，半蹲横向移动', s:'2 组 × 12 步/侧'}\n  ]},\n\n/* 1.5 椭圆机有氧 */ { type:'list', title:'椭圆机有氧', sub:'热身后的有氧激活 · 助全身减脂不粗腿', ico:'氧',\n  dur:'约 10 分钟', accent:'#9b8cff', accentBg:'rgba(155,140,255,.13)',\n  tip:'<b>为什么热身后加 10 分钟椭圆机：</b>你的目标是\"翘而不粗腿\"。臀腿力量训练会增肌，而椭圆机是有氧，帮你在增肌的同时控制全身脂肪，让线条更紧致、不显粗壮。阻力调到中等、全程匀速，强度保持在\"能正常交谈但略喘\"即可，别冲刺到上气不接下气。',\n  items:[\n    {n:'椭圆机', d:'中等阻力、匀速踏步，双手轻扶或自然摆动', s:'10 分钟'},\n    {n:'收尾过渡', d:'最后 1 分钟降阻力慢走，心率平缓下来再进力量区', s:'约 1 分钟'}\n  ]},\n\n/* 2 臀推机 */ { type:'ex', idx:1, id:'ht',\n  name:'臀推机', en:'Hip Thrust Machine',\n  target:'臀大肌 · 腘绳肌（协同）',\n  sets:4, reps:'12-15', rest:50,\n  setup:'靠垫压在髋部（骨盆上方），脚距与髋同宽踩实踏板；重量以最后 2 次仍能顶峰夹臀、腰不塌为准。',\n  steps:[\n    '坐稳，肩背贴紧靠背，脚踩实踏板，膝盖对准脚尖',\n    '核心收紧，肋骨下沉，下巴微收',\n    '脚跟发力顶髋，把髋向前上方推起',\n    '顶峰夹臀、骨盆微后倾，停 1 秒（躯干与大腿接近一条斜线）',\n    '用 2-3 秒控制回放，不要\"砸\"回座位'\n  ],\n  notes:[\n    '<b>全程别塌腰</b>：用腰椎顶起是臀推最常见的错误，练完腰酸就是代偿了。核心收紧、肋骨往下沉',\n    '<b>顶峰骨盆后倾</b>：想象\"把尾骨卷向肚脐\"，夹臀停 1 秒，臀大肌才完全收缩',\n    '下巴微收、视线看前方，<b>仰头会让腰椎跟着顶</b>',\n    '脚距与髋同宽或略宽，<b>膝盖对准脚尖不内扣</b>',\n    '回放要控制，猛放会硬扯骨盆和腰椎',\n    '做对了<b>臀部发酸</b>；腰酸或大腿前侧酸就是代偿了'\n  ]},\n\n/* 3 宽距倒蹬 */ { type:'ex', idx:2, id:'lp',\n  name:'宽距倒蹬机', en:'Wide Stance Leg Press',\n  target:'臀大肌 · 腘绳肌 · 股四头肌',\n  sets:4, reps:'12-15', rest:50,\n  setup:'脚踩踏板<b>上 1/3</b>、间距略宽于肩、脚尖外展约 30 度；重量以骨盆不卷离靠垫为准。',\n  steps:[\n    '坐入器械，臀部与下背贴紧靠垫，核心收紧',\n    '脚踩踏板上 1/3，间距略宽于肩，脚尖外展 30 度',\n    '解开保险，缓慢下放，膝盖沿脚尖方向打开',\n    '蹬起时脚跟推，顶部保持微屈，不锁死膝盖',\n    '下放至大腿接近胸部、但骨盆未卷离靠垫为止'\n  ],\n  notes:[\n    '脚位<b>高而宽</b>才练得到臀：踏板上方 + 脚尖外展；脚位越低越靠前就越练股四头',\n    '<b>膝盖必须对准脚尖</b>，内扣是膝关节最大的敌人',\n    '下放时<b>骨盆不要卷离靠垫</b>（屁股离开垫子会伤腰），到卷之前就停',\n    '顶部<b>膝盖不锁死</b>，保持微屈，压力一直留在肌肉上',\n    '<b>想不粗腿：高脚位 + 中等重量</b>，别冲大重量——重量越大，股四头（大腿前侧）参与越多，臀占比反而下降'\n  ]},\n\n/* 4 哈克深蹲（可选） */ { type:'ex', idx:3, id:'hack', optional:true,\n  name:'哈克深蹲', en:'Hack Squat',\n  target:'股四头肌 · 臀大肌（脚位偏前）',\n  sets:3, reps:'12-15', rest:50,\n  setup:'脚踩踏板中上位置（偏前），肩背贴紧靠垫；重量以全程脚掌踩实、膝不内扣为准。膝盖不适可直接跳过。',\n  steps:[\n    '肩背贴紧靠垫，脚踩踏板中上位置，脚距与肩同宽',\n    '核心收紧，解开保险',\n    '缓慢下蹲，膝盖沿脚尖方向打开，不内扣',\n    '蹲至大腿接近平行（或舒适深度），停 1 秒',\n    '脚掌踩实蹬起，顶部不锁死膝盖'\n  ],\n  notes:[\n    '脚位越<b>靠前（高）臀参与越多</b>，越靠后（低）越练股四头；想练臀就站高一点',\n    '蹲到<b>大腿接近平行</b>即可，不必追极限深度——靠牺牲骨盆稳定换深度得不偿失',\n    '全程脚掌踩实，<b>不踮脚、膝不内扣</b>',\n    '腰背始终贴紧靠垫，不要弓背',\n    '<b>想不粗腿就跳过它</b>：整体偏股四头（大腿前侧），是这套里最容易把腿练粗的动作；翘臀优先级低于臀推和倒蹬，膝盖不适更该跳'\n  ]},\n\n/* 5 坐姿髋外展 */ { type:'ex', idx:4, id:'abd',\n  name:'坐姿髋外展', en:'Seated Hip Abduction',\n  target:'臀中肌 · 臀小肌',\n  sets:4, reps:'12-15', rest:40,\n  setup:'挡板卡在大腿外侧（膝上方），躯干贴紧靠背；重量以全程躯干不动为准，可加到 15-20 次。',\n  steps:[\n    '坐入器械，大腿外侧顶住挡板（挡板位于膝上方）',\n    '躯干贴紧靠背，双手扶稳把手，核心收紧',\n    '缓慢向两侧打开，用臀部外上方发力',\n    '打开到最大幅度，顶峰停 1 秒',\n    '用 2 秒控制回放，不要被机器弹回'\n  ],\n  notes:[\n    '<b>躯干绝对不能前倾借力</b>（最常见错误），背始终贴紧靠背',\n    '慢速外展、顶峰停 1 秒、回放 2 秒，<b>绝不靠惯性甩</b>',\n    '重量一大必然甩，宁可加到 15-20 次',\n    '骨盆不旋转、不歪斜，两侧幅度对称',\n    '做对了感觉在<b>臀部外上方</b>（臀中肌）；大腿外侧或髋前侧酸就是阔筋膜张肌代偿了'\n  ]},\n\n/* 6 坐姿髋内收 */ { type:'ex', idx:5, id:'add',\n  name:'坐姿髋内收', en:'Seated Hip Adduction',\n  target:'内收肌群（大收肌 · 长收肌）',\n  sets:3, reps:'12-15', rest:40,\n  setup:'挡板卡在大腿内侧，起始腿张开到最大舒适位；重量以回放不弹回为准。',\n  steps:[\n    '坐入器械，大腿内侧顶住挡板',\n    '躯干贴紧靠背，双手扶稳，骨盆保持正位',\n    '缓慢向内夹，双腿向中线靠拢',\n    '夹到中线位置，顶峰停 1 秒',\n    '用 2 秒控制回放，不要被机器弹开'\n  ],\n  notes:[\n    '<b>这不是臀部动作</b>：练的是大腿内侧内收肌，对翘臀直接贡献小；想不粗大腿内侧，重量别贪，轻重量慢速夹就够',\n    '向内夹到中线，顶峰停 1 秒，别只是\"碰一下\"就回',\n    '回放控制 2 秒，别让机器把腿弹开',\n    '躯干稳定、<b>不耸肩</b>、骨盆不歪',\n    '大收肌参与髋伸展，练好它对深蹲、臀推的骨盆稳定有帮助'\n  ]},\n\n/* 7 拉伸 */ { type:'list', title:'拉伸放松', sub:'拉开髋前侧 · 巩固训练效果', ico:'拉',\n  dur:'约 10 分钟', accent:'#4aa8ff', accentBg:'rgba(74,168,255,.13)',\n  tip:'<b>为什么这 10 分钟不能省：</b>髋屈肌是臀肌的\"刹车\"。你在前面练了 35 分钟把臀练强，如果髂腰肌、股直肌一直短着，它会持续抑制臀肌发力，练出来的力量很快被抵消。把髋前侧拉开，臀才能真正\"站出来\"。',\n  items:[\n    {n:'髋屈肌拉伸（弓步）', d:'后腿跪，骨盆后倾，身体直立前移，感受髋前侧拉开', s:'2 × 30 秒/侧'},\n    {n:'梨状肌 / 臀肌拉伸', d:'仰卧，一腿跨过身体，双手抱膝向对侧带', s:'2 × 30 秒/侧'},\n    {n:'股四头肌拉伸', d:'站姿或侧卧，脚跟拉向臀部，骨盆保持后倾', s:'2 × 30 秒/侧'},\n    {n:'腘绳肌拉伸', d:'仰卧抬腿或坐姿体前屈，保持背部平直', s:'2 × 30 秒/侧'},\n    {n:'泡沫轴放松臀腿', d:'缓慢滚臀大肌、大腿外侧、腘绳肌', s:'约 2 分钟'}\n  ]},\n\n/* 8 完成 */ { type:'done' }\n];\n\n/* 统计总组数 */\nPAGES.forEach(function(p){ if(p.type==='ex') TOTAL_SETS += p.sets; });\nvar DONE_KEY = 'gluteplan_v1';\n\n/* ============ 状态 ============ */\nvar ST = { page:0, sets:{}, list:{}, seen:{} };\ntry{\n  var raw = localStorage.getItem(DONE_KEY);\n  if(raw){ var o=JSON.parse(raw); ST.sets=o.sets||{}; ST.list=o.list||{}; ST.seen=o.seen||{}; }\n}catch(e){}\n\nfunction save(){\n  try{ localStorage.setItem(DONE_KEY, JSON.stringify({sets:ST.sets,list:ST.list,seen:ST.seen})); }catch(e){}\n}\n\n/* ============ 计时器 ============ */\nvar TM = { id:null, endAt:0, remain:45, total:45, running:false };\n\nfunction beep(){\n  try{\n    var C = window.AudioContext||window.webkitAudioContext; if(!C) return;\n    var ctx=new C(), o=ctx.createOscillator(), g=ctx.createGain();\n    o.connect(g); g.connect(ctx.destination);\n    o.frequency.value=880; o.type='sine';\n    g.gain.setValueAtTime(.001,ctx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+.02);\n    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);\n    o.start(ctx.currentTime); o.stop(ctx.currentTime+.5);\n    setTimeout(function(){ try{ctx.close();}catch(e){} },700);\n  }catch(e){}\n}\nfunction tmReset(sec){\n  if(TM.id){ clearInterval(TM.id); TM.id=null; }\n  TM.running=false; TM.total=sec; TM.remain=sec;\n}\nfunction tmStart(){\n  if(TM.running) return;\n  if(TM.remain<=0) TM.remain=TM.total;\n  TM.running=true; TM.endAt=Date.now()+TM.remain*1000;\n  TM.id=setInterval(tmTick,200); paintTimer();\n}\nfunction tmPause(){\n  if(!TM.running) return;\n  if(TM.id){ clearInterval(TM.id); TM.id=null; }\n  TM.running=false; TM.remain=Math.max(0,Math.round((TM.endAt-Date.now())/1000));\n  paintTimer();\n}\nfunction tmTick(){\n  var left=Math.max(0,Math.round((TM.endAt-Date.now())/1000));\n  if(left!==TM.remain){ TM.remain=left; }\n  if(left<=0){\n    if(TM.id){ clearInterval(TM.id); TM.id=null; }\n    TM.running=false; beep();\n    if(navigator.vibrate) try{ navigator.vibrate([180,90,180]); }catch(e){}\n  }\n  paintTimer();\n}\nfunction tmAdj(d){\n  var t=Math.min(60,Math.max(30,TM.total+d));\n  if(TM.running){ TM.total=t; }\n  else { TM.total=t; TM.remain=t; tmReset(t); }\n  paintTimer();\n}\nfunction paintTimer(){\n  var s=document.getElementById('tmSec'); if(!s) return;\n  var btn=document.getElementById('tmPlay');\n  var tot=document.getElementById('tmTotal');\n  s.textContent=TM.remain;\n  s.className='tm-sec'+(TM.running?' run':(TM.remain===0?' fin':''));\n  if(btn) btn.textContent=TM.running?'暂停':'开始';\n  if(btn) btn.className='tm-btn tm-play'+(TM.running?' on':'');\n  if(tot) tot.textContent=TM.total;\n  var ring=document.getElementById('tmRing');\n  if(ring){\n    var pct = TM.total>0 ? (1-TM.remain/TM.total) : 0;\n    ring.style.width=(pct*100)+'%';\n  }\n}\n\n/* ============ 渲染 ============ */\nfunction renderCover(){\n  var listHtml = PAGES.map(function(p,i){\n    if(p.type!=='ex') return '';\n    return '<div class=\"ov-item\" data-go=\"'+i+'\">'+\n      '<div class=\"ov-n\">'+p.idx+'</div>'+\n      '<div class=\"ov-name\">'+p.name+(p.optional?'<em>可选</em>':'')+'</div>'+\n      '<div class=\"ov-s\">'+p.sets+' × '+p.reps+'</div></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"cover-hero\">'+\n      '<h1>练臀训练计划</h1>'+\n      '<p>臀大肌复合强化 &nbsp;+&nbsp; 臀中肌孤立<br>改善臀肌失忆 · 建立髋伸展力量</p>'+\n    '</div>'+\n    '<div class=\"timebar\">'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#ff9f43\">10<small>分钟</small><span>热身</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#9b8cff\">10<small>分钟</small><span>有氧</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:35;background:#00e0a4\">35<small>分钟</small><span>主体</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#4aa8ff\">10<small>分钟</small><span>拉伸</span></div>'+\n    '</div>'+\n    '<div class=\"tb-legend\">'+\n      '<span><i style=\"background:#ff9f43\"></i>热身 10</span>'+\n      '<span><i style=\"background:#9b8cff\"></i>有氧 10</span>'+\n      '<span><i style=\"background:#00e0a4\"></i>主体 35</span>'+\n      '<span><i style=\"background:#4aa8ff\"></i>拉伸 10</span>'+\n      '<span style=\"color:var(--accent);font-weight:700\">合计 约 65 分钟</span>'+\n    '</div>'+\n    '<div class=\"kv\" style=\"margin-top:16px\">'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">主项动作</div><div class=\"kv-v\">5 <small>个（含 1 可选）</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总组数</div><div class=\"kv-v\">'+TOTAL_SETS+' <small>组</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">每组次数</div><div class=\"kv-v\">12-15 <small>次</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">组间歇</div><div class=\"kv-v\">40-50 <small>秒</small></div></div>'+\n    '</div>'+\n    '<div class=\"card\" style=\"margin-top:14px\">'+\n      '<div class=\"card-hd\"><div class=\"card-ico\" style=\"background:rgba(255,159,67,.13);color:#ff9f43\">!</div>'+\n      '<div class=\"card-t\">先看这 3 条，比动作本身更重要</div></div>'+\n      '<div style=\"font-size:12.5px;line-height:1.75;color:#c4d0dc\">'+\n        '<div style=\"margin-bottom:8px\"><b style=\"color:#ffc78b\">1. 髋内收不是练臀动作。</b>它练大腿内侧内收肌，对翘臀直接贡献小；真正价值是骨盆稳定与腿型均衡。想翘臀，优先臀推 + 倒蹬。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>2. 想不粗腿，哈克深蹲建议跳过。</b>它整体偏股四头（大腿前侧），是这套里最容易把腿练粗的动作；想翘臀靠臀推 + 倒蹬就够，膝盖不适更该跳。</div>'+\n        '<div><b>3. 臀推别用腰顶。</b>腰椎代偿是臀推第一大错误——练完腰酸就是做错了。核心收紧、肋骨下沉、顶峰骨盆后倾夹臀。</div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"tip\" style=\"margin-top:14px\"><b>动作顺序：</b>热身松髋屈肌 + 激活臀 → 椭圆机有氧 10 分钟 → 臀推机 → 宽距倒蹬 → 哈克深蹲（可选）→ 髋外展 → 髋内收 → 拉伸。先松后练、复合优先、孤立收尾。<b>总时长约 65 分钟；跳过哈克深蹲则约 60 分钟。</b>想不粗腿：哈克跳过、倒蹬高脚位轻重量、内收轻重量。</div>'+\n    '<div class=\"sec-t\">训练流程（点任意动作可直接跳过去）</div>'+\n    '<div class=\"ov-list\">'+\n      '<div class=\"ov-item\" data-go=\"1\"><div class=\"ov-n\" style=\"background:rgba(255,159,67,.13);color:#ff9f43\">热</div>'+\n        '<div class=\"ov-name\">热身激活</div><div class=\"ov-s\">10 分钟</div></div>'+\n      '<div class=\"ov-item\" data-go=\"2\"><div class=\"ov-n\" style=\"background:rgba(155,140,255,.13);color:#9b8cff\">氧</div>'+\n        '<div class=\"ov-name\">椭圆机有氧</div><div class=\"ov-s\">10 分钟</div></div>'+\n      listHtml+\n      '<div class=\"ov-item\" data-go=\"8\"><div class=\"ov-n\" style=\"background:rgba(74,168,255,.13);color:#4aa8ff\">拉</div>'+\n        '<div class=\"ov-name\">拉伸放松</div><div class=\"ov-s\">10 分钟</div></div>'+\n    '</div>'+\n    '<div class=\"tip\" style=\"margin-top:14px\"><b>频率：</b>每周 2 次，间隔至少 48 小时（臀是大肌群，恢复比肩背慢）；坚持 6-8 周才见明显变化，前两周能感觉到\"臀会发力了\"就是进步。</div>'+\n  '</div>';\n}\n\nfunction renderList(p,pi){\n  var items = p.items.map(function(it,i){\n    var k = pi+'_'+i;\n    var on = !!ST.list[k];\n    return '<div class=\"chk'+(on?' done':'')+'\" data-chk=\"'+k+'\">'+\n      '<div class=\"chk-b\"><svg viewBox=\"0 0 24 24\"><polyline points=\"4,12 10,18 20,6\"/></svg></div>'+\n      '<div class=\"chk-t\"><div class=\"chk-name\">'+it.n+'</div><div class=\"chk-det\">'+it.d+'</div></div>'+\n      '<div class=\"chk-dose\">'+it.s+'</div></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"ex-head\">'+\n      '<div class=\"ex-idx\" style=\"background:'+p.accentBg+';color:'+p.accent+'\">'+p.ico+'</div>'+\n      '<div class=\"ex-title\"><h2>'+p.title+'</h2>'+\n        '<div class=\"ex-en\">'+p.sub+'</div>'+\n        '<div class=\"ex-target\" style=\"color:'+p.accent+'\">'+p.dur+'</div></div>'+\n    '</div>'+\n    '<div class=\"card\"><div style=\"font-size:12.5px;letter-spacing:.8px;color:var(--muted2);font-weight:700;margin-bottom:4px\">逐项完成</div>'+\n      items+'</div>'+\n    '<div class=\"tip\" style=\"border-left-color:'+p.accent+'\">'+p.tip+'</div>'+\n  '</div>';\n}\n\nfunction renderEx(p,pi){\n  var st = ST.sets[p.id] || [];\n  var dots='';\n  for(var i=0;i<p.sets;i++){\n    var on = st.indexOf(i)>-1;\n    dots += '<div class=\"set-dot'+(on?' done':'')+'\" data-set=\"'+i+'\">'+\n      '<div class=\"set-num\">第 '+(i+1)+' 组</div><div class=\"set-reps\">'+p.reps+' 次</div></div>';\n  }\n  var doneN = st.length;\n\n  var steps = p.steps.map(function(s,i){\n    return '<div class=\"step\"><div class=\"step-n\">'+(i+1)+'</div><div class=\"step-t\">'+s+'</div></div>';\n  }).join('');\n\n  var notes = p.notes.map(function(n){\n    return '<div class=\"note\"><span class=\"note-d\">&#9679;</span><span>'+n+'</span></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"ex-head\">'+\n      '<div class=\"ex-idx\">'+p.idx+'</div>'+\n      '<div class=\"ex-title\"><h2>'+p.name+(p.optional?'<em>可选</em>':'')+'</h2>'+\n        '<div class=\"ex-en\">'+p.en+' · 第 '+p.idx+' / 5 个动作</div>'+\n        '<div class=\"ex-target\">目标肌群：'+p.target+'</div></div>'+\n    '</div>'+\n    '<div class=\"specs\">'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.sets+'</div><div class=\"spec-k\">组数</div></div>'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.reps+'</div><div class=\"spec-k\">每组次数</div></div>'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.rest+'</div><div class=\"spec-k\">组间歇秒</div></div>'+\n    '</div>'+\n    '<div class=\"ex-fig\">'+FIG[p.id]+'</div>'+\n    '<div class=\"setup\">'+p.setup+'</div>'+\n    '<div class=\"sec-t\">执行步骤</div>'+\n    '<div class=\"steps\">'+steps+'</div>'+\n    '<div class=\"notes\">'+\n      '<div class=\"notes-hd\"><span>&#9888;</span>注意点（每组都要检查）</div>'+notes+\n    '</div>'+\n    '<div class=\"sec-t\">组数打卡 · 完成一组自动开始间歇计时</div>'+\n    '<div class=\"sets-hd\"><div class=\"sets-hd-t\">点击圆圈标记完成</div>'+\n      '<div class=\"sets-cnt\">'+doneN+' / '+p.sets+' 组</div></div>'+\n    '<div class=\"sets\">'+dots+'</div>'+\n    '<div class=\"timer\">'+\n      '<div class=\"tm-main\">'+\n        '<div class=\"tm-disp\"><span class=\"tm-sec\" id=\"tmSec\">'+p.rest+'</span>'+\n          '<span class=\"tm-unit\">秒 / <span id=\"tmTotal\">'+p.rest+'</span> 秒</span></div>'+\n        '<div class=\"tm-hint\" id=\"tmHint\">点上面的组数，计时自动开始</div>'+\n        '<div class=\"progress\" style=\"margin-top:7px\"><div class=\"progress-fill\" id=\"tmRing\" style=\"width:0\"></div></div>'+\n      '</div>'+\n      '<div class=\"tm-ctrls\">'+\n        '<div class=\"tm-row\">'+\n          '<button class=\"tm-btn tm-adj\" id=\"tmMinus\">&#8722;5</button>'+\n          '<button class=\"tm-btn tm-play\" id=\"tmPlay\">开始</button>'+\n          '<button class=\"tm-btn tm-adj\" id=\"tmPlus\">+5</button>'+\n        '</div>'+\n        '<button class=\"tm-btn tm-reset\" id=\"tmReset\">重置</button>'+\n      '</div>'+\n    '</div>'+\n  '</div>';\n}\n\nfunction renderDone(){\n  var done=0; PAGES.forEach(function(p){ if(p.type==='ex') done+=(ST.sets[p.id]||[]).length; });\n  var pct = TOTAL_SETS? Math.round(done/TOTAL_SETS*100):0;\n  return '<div class=\"page\">'+\n    '<div class=\"done-hero\">'+\n      '<div class=\"done-ico\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4,12 10,18 20,5\"/></svg></div>'+\n      '<h2>训练完成</h2><p>今天练了 '+done+' 组，完成度 '+pct+'%</p>'+\n    '</div>'+\n    '<div class=\"kv\" style=\"margin-bottom:14px\">'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总组数</div><div class=\"kv-v\">'+done+'<small>/'+TOTAL_SETS+'</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总时长</div><div class=\"kv-v\">65 <small>分钟</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">建议频率</div><div class=\"kv-v\">2 <small>次/周</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">恢复间隔</div><div class=\"kv-v\">48 <small>小时</small></div></div>'+\n    '</div>'+\n    '<div class=\"card\">'+\n      '<div class=\"card-hd\"><div class=\"card-ico\">&#9635;</div><div class=\"card-t\">练完必做的 3 件事</div></div>'+\n      '<div style=\"font-size:12.5px;line-height:1.8;color:#c4d0dc\">'+\n        '<div style=\"margin-bottom:8px\"><b>1. 记录发力感。</b>记一句\"今天哪几个动作臀是真的酸\"。几周后感觉会越来越明确，这就是臀肌被重新唤醒的过程。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>2. 久坐是臀肌最大的敌人。</b>每 45 分钟站起来，做一次髋屈肌拉伸 + 10 个徒手臀桥。<b>练满 65 分钟（含有氧），剩下坐着的那些小时才是决定因素。</b></div>'+\n        '<div><b>3. 下次拍个侧面视频。</b>手机架髋部高度、距离 2.5-3 米拍臀推，我可以逐帧帮你看骨盆和腰椎有没有代偿。</div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"tip\"><b>预期时间表：</b>1-2 周臀开始有发力感和延迟性酸痛；3-4 周臀推重量明显上升、髋外展能控制住不甩；6-8 周形态和围度出现变化。<b>如果 4 周后毫无感觉，多半是腰椎或大腿前侧在代偿——先把重量降下来，把\"顶峰夹臀\"做对。</b></div>'+\n    '<button class=\"nav-btn\" id=\"resetAll\" style=\"width:100%;height:42px;margin-top:14px;background:var(--card);border:1px solid var(--border);color:var(--muted)\">清除打卡记录，重新开始</button>'+\n  '</div>';\n}\n\n/* ============ 主逻辑 ============ */\nvar content=document.getElementById('content');\nvar prevBtn=document.getElementById('prevBtn');\nvar nextBtn=document.getElementById('nextBtn');\nvar dotsBox=document.getElementById('dots');\n\nfunction curEx(){ var p=PAGES[ST.page]; return (p&&p.type==='ex')?p:null; }\n\nfunction paint(){\n  var p=PAGES[ST.page];\n  ST.seen[ST.page]=1; save();\n  content.scrollTop=0;\n\n  if(p.type==='cover'){ content.innerHTML=renderCover(); }\n  else if(p.type==='list'){ content.innerHTML=renderList(p,ST.page); }\n  else if(p.type==='ex'){ tmReset(p.rest); content.innerHTML=renderEx(p,ST.page); }\n  else { content.innerHTML=renderDone(); }\n\n  // 头部\n  var ht=document.getElementById('headTitle');\n  var hm=document.getElementById('headMeta');\n  var done=0; PAGES.forEach(function(q){ if(q.type==='ex') done+=(ST.sets[q.id]||[]).length; });\n  document.getElementById('progFill').style.width=(TOTAL_SETS?done/TOTAL_SETS*100:0)+'%';\n  if(p.type==='cover'){ ht.textContent='练臀训练计划'; }\n  else if(p.type==='ex'){ ht.textContent=p.name; }\n  else if(p.type==='list'){ ht.textContent=p.title; }\n  else { ht.textContent='训练完成'; }\n  hm.innerHTML='<b>'+done+'</b> / '+TOTAL_SETS+' 组';\n\n  // 导航\n  prevBtn.disabled = ST.page===0;\n  if(ST.page===PAGES.length-1){ nextBtn.textContent='已完成'; nextBtn.disabled=true; }\n  else { nextBtn.innerHTML='下一页 &#8250;'; nextBtn.disabled=false; }\n\n  // 页码点\n  var dh='';\n  for(var i=0;i<PAGES.length;i++){\n    dh+='<div class=\"dot'+(i===ST.page?' on':(ST.seen[i]?' seen':''))+'\" data-dot=\"'+i+'\"></div>';\n  }\n  dotsBox.innerHTML=dh;\n\n  bind();\n}\n\nfunction bind(){\n  // 跳转\n  var gos=content.querySelectorAll('[data-go]');\n  for(var i=0;i<gos.length;i++){\n    gos[i].addEventListener('click',function(){\n      ST.page=+this.getAttribute('data-go'); paint();\n    });\n  }\n  // 页码点\n  var ds=dotsBox.querySelectorAll('[data-dot]');\n  for(var j=0;j<ds.length;j++){\n    ds[j].addEventListener('click',function(){\n      ST.page=+this.getAttribute('data-dot'); paint();\n    });\n  }\n  // 清单勾选\n  var chks=content.querySelectorAll('[data-chk]');\n  for(var k=0;k<chks.length;k++){\n    chks[k].addEventListener('click',function(){\n      var key=this.getAttribute('data-chk');\n      if(ST.list[key]) delete ST.list[key]; else ST.list[key]=1;\n      save(); paint();\n    });\n  }\n  // 组打卡\n  var p=curEx();\n  if(p){\n    var sd=content.querySelectorAll('[data-set]');\n    for(var m=0;m<sd.length;m++){\n      sd[m].addEventListener('click',function(){\n        var idx=+this.getAttribute('data-set');\n        var arr=ST.sets[p.id]||[];\n        var pos=arr.indexOf(idx);\n        if(pos>-1) arr.splice(pos,1); else arr.push(idx);\n        ST.sets[p.id]=arr; save();\n        if(pos===-1 && arr.length<p.sets){ tmStart(); }\n        paint();\n      });\n    }\n    var b1=document.getElementById('tmPlay');\n    var b2=document.getElementById('tmMinus');\n    var b3=document.getElementById('tmPlus');\n    var b4=document.getElementById('tmReset');\n    if(b1) b1.addEventListener('click',function(){ TM.running?tmPause():tmStart(); });\n    if(b2) b2.addEventListener('click',function(){ tmAdj(-5); });\n    if(b3) b3.addEventListener('click',function(){ tmAdj(5); });\n    if(b4) b4.addEventListener('click',function(){ tmReset(TM.total); paintTimer(); var h=document.getElementById('tmHint'); if(h) h.textContent='已重置为 '+TM.total+' 秒'; });\n  }\n  // 清除\n  var ra=document.getElementById('resetAll');\n  if(ra) ra.addEventListener('click',function(){\n    ST.sets={}; ST.list={}; ST.seen={}; ST.page=0; save(); paint();\n  });\n}\n\nfunction go(d){\n  var t=ST.page+d;\n  if(t<0||t>=PAGES.length) return;\n  ST.page=t; paint();\n}\n\nprevBtn.addEventListener('click',function(){ go(-1); });\nnextBtn.addEventListener('click',function(){ go(1); });\n\ndocument.addEventListener('keydown',function(e){\n  if(e.key==='ArrowLeft'){ go(-1); }\n  else if(e.key==='ArrowRight'){ go(1); }\n});\n\n// 滑动翻页\nvar tx=0,ty=0,tracking=false;\ncontent.addEventListener('touchstart',function(e){\n  if(e.touches.length!==1) return;\n  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tracking=true;\n},{passive:true});\ncontent.addEventListener('touchend',function(e){\n  if(!tracking) return; tracking=false;\n  var t=e.changedTouches[0];\n  var dx=t.clientX-tx, dy=t.clientY-ty;\n  if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6){\n    if(dx<0) go(1); else go(-1);\n  }\n},{passive:true});\n\npaint();\n<\/script>\n</body>\n</html>\n"};
const css="\n  :root{\n    --bg:#0a0e13; --card:#131a22; --card2:#0f151c; --line:#222e3a;\n    --text:#e8eef5; --muted:#8a97a5; --accent:#00e0a4; --accent2:#4aa8ff;\n    --warn:#ff9f43; --danger:#ff5e6c; --good:#00e0a4;\n    --r:14px;\n  }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);\n    font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Helvetica Neue\",Arial,sans-serif;\n    -webkit-font-smoothing:antialiased;overscroll-behavior:none}\n  body{max-width:480px;margin:0 auto;min-height:100vh;position:relative;\n    padding-bottom:74px;}\n  .app-head{padding:18px 18px 10px;position:sticky;top:0;z-index:5;\n    background:linear-gradient(180deg,#0a0e13 70%,rgba(10,14,19,0))}\n  .app-head h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px}\n  .app-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}\n\n  /* 视图 */\n  .view{display:none;padding:4px 14px 16px;animation:fade .28s ease}\n  .view.active{display:block}\n  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n\n  /* 计划卡片 */\n  .plan-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);\n    padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;\n    cursor:pointer;transition:transform .12s,border-color .15s}\n  .plan-card:active{transform:scale(.985)}\n  .plan-card .pc-ico{width:54px;height:54px;border-radius:14px;flex:0 0 54px;\n    display:flex;align-items:center;justify-content:center;font-size:26px}\n  .plan-card .pc-ico svg{width:28px;height:28px}\n  .tab .ti svg{width:22px;height:22px;display:block}\n  .day .ph svg{width:11px;height:11px;display:inline-block;vertical-align:-1px}\n  .plan-card h3{margin:0 0 4px;font-size:16px;font-weight:700}\n  .plan-card .pc-sub{font-size:12px;color:var(--muted);line-height:1.5}\n  .plan-card .pc-go{margin-left:auto;color:var(--accent);font-size:13px;font-weight:700;\n       document.getElementById('ovTitle').textContent=name;
      var frame=document.getElementById('ovFrame');
      var fb=document.getElementById('ovFallback');
      var link=document.getElementById('ovLink');
      link.href=URL.createObjectURL(new Blob([plans[file]],{type:'text/html'}));
      fb.style.display='none';
      frame.style.display='block';
      frame.srcdoc=plans[file];
      document.getElementById('planOverlay').classList.add('show');
    });
  });
  document.getElementById('ovClose').addEventListener('click',function(){
    var o=document.getElementById('planOverlay');
    o.classList.remove('show');
    document.getElementById('ovFrame').srcdoc='';
  });
  document.getElementById('ovNew').addEventListener('click',function(){
    toast("安装后可在新窗口打开计划");
  });
  // iframe 加载失败兜底
  document.getElementById('ovFrame').addEventListener('error',function(){
    this.style.display='none';
    document.getElementById('ovFallback').style.display='block';
  });

  /* ---------- 日历 ---------- */
  var WK=['日','一','二','三','四','五','六'];
  function renderCalendar(){
    var y=vm.y, m=vm.m;
    document.getElementById('calMonth').textContent=y+'年'+(m+1)+'月';
    var first=new Date(y,m,1).getDay();
    var total=new Date(y,m+1,0).getDate();
    var tk=todayKey();
    var grid=document.getElementById('daysGrid');
    var html='';
    for(var i=0;i<first;i++) html+='<div class="day empty"></div>';
    for(var d=1;d<=total;d++){
      var k=y+'-'+(m+1<10?'0'+(m+1):(m+1))+'-'+(d<10?'0'+d:d);
      var rec=getDay(k);
      var cls='day';
      if(k===tk) cls+=' today';
      if(rec&&rec.done) cls+=' done';
      if(k===selKey) cls+=' sel';
      var badge='';
      if(rec&&rec.done) badge+='<span class="chk">✓</span>';
      if(rec&&rec.photo) badge+='<span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></span>';
      if(rec&&rec.plans&&rec.plans.length) badge+='<span class="plan-dot"></span>';
      html+='<div class="'+cls+'" data-k="'+k+'">'+d+badge+'</div>';
    }
    grid.innerHTML=html;
    grid.querySelectorAll('.day:not(.empty)').forEach(function(el){
      el.addEventListener('click',function(){ openDay(el.dataset.k); });
    });
  }
  function openDay(k){
    selKey=k;
    var rec=ensureDay(k);
    var dt=parse(k);
    document.getElementById('dpDate').textContent=k;
    document.getElementById('dpWeek').textContent='星期'+WK[dt.getDay()];
    var db=document.getElementById('doneBtn');
    db.classList.toggle('on', !!rec.done);
    db.textContent= rec.done? '✓ 已完成训练（点击取消）' : '✓ 标记今天完成训练';
    // plan chips
    document.querySelectorAll('#planChips .chip').forEach(function(ch){
      ch.classList.toggle('on', rec.plans.indexOf(ch.dataset.p)>=0);
    });
    // photo
    if(rec.photo){
      document.getElementById('photoImg').src=rec.photo;
      document.getElementById('photoPrev').style.display='block';
      document.getElementById('photoBox').style.display='none';
    }else{
      document.getElementById('photoPrev').style.display='none';
      document.getElementById('photoBox').style.display='block';
    }
    document.getElementById('dayPanel').classList.add('show');
    renderCalendar();
  }
  document.getElementById('prevM').addEventListener('click',function(){
    vm.m--; if(vm.m<0){vm.m=11;vm.y--;} renderCalendar();
  });
  document.getElementById('nextM').addEventListener('click',function(){
    vm.m++; if(vm.m>11){vm.m=0;vm.y++;} renderCalendar();
  });
  document.getElementById('todayBtn').addEventListener('click',function(){
    var n=new Date(); vm.y=n.getFullYear(); vm.m=n.getMonth(); selKey=todayKey();
    renderCalendar(); openDay(todayKey());
  });
  document.getElementById('doneBtn').addEventListener('click',function(){
    if(!selKey) return;
    var rec=ensureDay(selKey);
    rec.done=!rec.done;
    save(); openDay(selKey);
    toast(rec.done?'已打勾 ✓ 今天完成训练':'已取消打勾');
  });
  document.querySelectorAll('#planChips .chip').forEach(function(ch){
    ch.addEventListener('click',function(){
      if(!selKey) return;
      var rec=ensureDay(selKey);
      var p=ch.dataset.p, i=rec.plans.indexOf(p);
      if(i>=0) rec.plans.splice(i,1); else rec.plans.push(p);
      save(); openDay(selKey);
    });
  });

  /* ---------- 照片上传（压缩） ---------- */
  var pendingFile=null;
  document.getElementById('photoBox').addEventListener('click',function(){
    if(!selKey){ toast('请先选择日期'); return; }
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    compressImage(f,function(dataUrl){
      if(!selKey) return;
      var rec=ensureDay(selKey);
      rec.photo=dataUrl; rec.done=true; // 传了照片默认也算完成
      save(); openDay(selKey);
      toast('美照已保存 📷');
    });
    e.target.value='';
  });
  document.getElementById('photoDel').addEventListener('click',function(){
    if(!selKey) return;
    var rec=ensureDay(selKey);
    rec.photo='';
    save(); openDay(selKey);
    toast('已删除照片');
  });
  function compressImage(file, cb){
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var maxW=900, maxH=900;
        var w=img.width, h=img.height;
        if(w>maxW||h>maxH){
          var r=Math.min(maxW/w, maxH/h);
          w=Math.round(w*r); h=Math.round(h*r);
        }
        var cv=document.createElement('canvas');
        cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.7));
      };
      img.onerror=function(){ toast('图片读取失败'); };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---------- 统计 ---------- */
  function doneKeys(){ return Object.keys(data.days).filter(function(k){return data.days[k].done;}).sort(); }
  function dayDiff(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
  function renderStats(){
    var keys=doneKeys();
    var total=keys.length;
    var tk=todayKey();
    var ym=tk.slice(0,7);
    var month=keys.filter(function(k){return k.indexOf(ym)===0;}).length;
    var photos=Object.keys(data.days).filter(function(k){return data.days[k].photo;}).length;
    // 连续打卡（从今天往回）
    var cur=0, d=new Date();
    while(true){ var k=fmt(d); if(data.days[k]&&data.days[k].done){cur++; d.setDate(d.getDate()-1);} else break; }
    // 最长连续
    var longest=0, run=0, prev=null;
    keys.forEach(function(k){
      if(prev && dayDiff(prev,k)===1) run++; else run=1;
      if(run>longest) longest=run;
      prev=k;
    });
    document.getElementById('stTotal').textContent=total;
    document.getElementById('stMonth').textContent=month;
    document.getElementById('stStreak').textContent=cur;
    document.getElementById('stLong').textContent=longest;
    document.getElementById('stPhoto').textContent=photos;
    document.getElementById('stEmpty').style.display = total? 'none':'block';

    // 近7天
    var w7=document.getElementById('week7'); var wh='';
    var base=new Date(); base.setDate(base.getDate()-6);
    for(var i=0;i<7;i++){
      var dd=new Date(base); dd.setDate(base.getDate()+i);
      var k=fmt(dd); var on=data.days[k]&&data.days[k].done;
      wh+='<div class="c"><div class="d">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</div>'+
          '<div class="dot'+(on?' on':'')+'">'+(on?'✓':'·')+'</div></div>';
    }
    w7.innerHTML=wh;

    // 各计划次数
    var cnt={posture:0,back:0,glute:0};
    Object.keys(data.days).forEach(function(k){
      (data.days[k].plans||[]).forEach(function(p){ if(cnt[p]!=null) cnt[p]++; });
    });
    var maxc=Math.max(1,cnt.posture,cnt.back,cnt.glute);
    var rows='';
    PLANS.forEach(function(p){
      var c=cnt[p.id];
      rows+='<div class="ps-row"><div class="pn">'+p.name+'</div>'+
            '<div class="ps-bar"><i style="width:'+(c/maxc*100)+'%"></i></div>'+
            '<div class="pv">'+c+'</div></div>';
    });
    document.getElementById('planStatRows').innerHTML=rows;
  }

  /* ---------- 工具 ---------- */
  var toastT=null;
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT);
    toastT=setTimeout(function(){ t.classList.remove('show'); },1800);
  }

  document.getElementById("resetDemo").addEventListener("click",function(){memory={}; data=load(); selKey=null; document.getElementById("planOverlay").classList.remove("show"); document.getElementById("dayPanel").classList.remove("show"); switchView("plans"); renderCalendar();});
  // 初始
  renderCalendar();
})();

</script></body></html>
