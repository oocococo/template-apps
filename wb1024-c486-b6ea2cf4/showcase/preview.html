<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健身打卡体验</title></head><body><div style="position:relative;z-index:2;padding:8px;background:#20303a;color:#e8eef5;font:14px sans-serif">示例体验，数据仅保留在本页 <button id="resetDemo" type="button">恢复示例</button></div><div id="app"></div><script>const plans={"驼背纠正训练计划.html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>驼背纠正训练计划</title>\n<style>\n:root{\n  --bg:#0a0e13; --bg2:#111820; --card:#161e27; --card2:#1b242f;\n  --border:#242f3d; --border2:#2e3b4c;\n  --text:#e9eff6; --muted:#8697a8; --muted2:#5f7183;\n  --accent:#00e0a4; --accent2:#00b884;\n  --warn:#ff9f43; --warnbg:rgba(255,159,67,.10);\n  --danger:#ff5f6d; --good:#00e0a4;\n}\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%}\nbody{\n  background:var(--bg); color:var(--text);\n  font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  font-size:15px; line-height:1.6; overflow:hidden;\n  -webkit-font-smoothing:antialiased;\n}\n#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;\n  background:linear-gradient(170deg,#0a0e13 0%,#111a24 100%);position:relative}\n\n/* ===== 顶栏 ===== */\n.topbar{padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}\n.tb-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}\n.tb-title{font-size:16px;font-weight:700;letter-spacing:.3px}\n.tb-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n.tb-meta b{color:var(--accent);font-weight:700}\n.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden}\n.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));\n  border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}\n\n/* ===== 内容区 ===== */\n.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;\n  padding:18px 18px 24px;scroll-behavior:smooth}\n.content::-webkit-scrollbar{width:0}\n.page{animation:pageIn .32s cubic-bezier(.4,0,.2,1)}\n@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n\n/* ===== 通用卡片 ===== */\n.card{background:var(--card);border:1px solid var(--border);border-radius:14px;\n  padding:16px;margin-bottom:14px}\n.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.card-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;\n  font-size:15px;font-weight:700;flex-shrink:0;background:rgba(0,224,164,.13);color:var(--accent)}\n.card-t{font-size:15px;font-weight:700}\n\n.sec-t{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--muted2);\n  text-transform:uppercase;margin:16px 0 9px}\n\n/* ===== 封面 ===== */\n.cover-hero{padding:6px 0 18px;text-align:center}\n.cover-hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;\n  background:linear-gradient(120deg,#fff 20%,var(--accent));-webkit-background-clip:text;\n  -webkit-text-fill-color:transparent;background-clip:text}\n.cover-hero p{font-size:13px;color:var(--muted);line-height:1.7}\n\n/* 首页高亮提示横幅 */\n.big-banner{margin:4px 0 16px;padding:14px 16px;border-radius:14px;\n  background:linear-gradient(120deg,rgba(255,159,67,.16),rgba(0,224,164,.14));\n  border:1.5px solid rgba(255,159,67,.55);box-shadow:0 6px 18px rgba(255,159,67,.12)}\n.big-banner .bb-k{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;\n  letter-spacing:1px;color:#ff9f43;margin-bottom:8px}\n.big-banner .bb-k::before{content:\"⚡\";font-size:14px}\n.big-banner .bb-row{display:flex;gap:10px;flex-wrap:wrap}\n.big-banner .bb-item{flex:1;min-width:120px;background:rgba(10,14,19,.45);border-radius:10px;\n  padding:10px 11px;border:1px solid var(--border)}\n.big-banner .bb-t{font-size:15px;font-weight:800;color:#fff;margin-bottom:3px}\n.big-banner .bb-t b{color:var(--accent)}\n.big-banner .bb-d{font-size:11.5px;line-height:1.6;color:#c4d0dc}\n\n.timebar{display:flex;height:44px;border-radius:11px;overflow:hidden;margin-bottom:9px;\n  border:1px solid var(--border)}\n.tb-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;\n  font-size:11px;line-height:1.25;color:#0a0e13;font-weight:700}\n.tb-seg span{font-size:9px;font-weight:600;opacity:.75}\n.tb-legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-bottom:4px}\n.tb-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}\n\n.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.kv-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 12px}\n.kv-k{font-size:10px;color:var(--muted2);letter-spacing:.8px;font-weight:700;margin-bottom:3px}\n.kv-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}\n.kv-v small{font-size:11px;color:var(--muted);font-weight:600}\n\n.ov-list{display:flex;flex-direction:column;gap:7px}\n.ov-item{display:flex;align-items:center;gap:11px;background:var(--card2);\n  border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;\n  transition:border-color .2s,transform .15s}\n.ov-item:active{transform:scale(.985)}\n.ov-item:hover{border-color:var(--border2)}\n.ov-n{width:22px;height:22px;border-radius:7px;background:rgba(0,224,164,.13);color:var(--accent);\n  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.ov-name{flex:1;font-size:13px;font-weight:600}\n.ov-s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n\n/* ===== 动作页 ===== */\n.ex-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}\n.ex-idx{width:38px;height:38px;border-radius:11px;background:rgba(0,224,164,.13);\n  color:var(--accent);display:flex;align-items:center;justify-content:center;\n  font-size:15px;font-weight:800;flex-shrink:0}\n.ex-title{flex:1;min-width:0}\n.ex-title h2{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.3}\n.ex-en{font-size:11px;color:var(--muted2);letter-spacing:.5px;margin-top:2px}\n.ex-target{font-size:11px;color:var(--accent);margin-top:5px;font-weight:600}\n\n.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}\n.spec{background:var(--card2);border:1px solid var(--border);border-radius:10px;\n  padding:9px 6px;text-align:center}\n.spec-v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}\n.spec-k{font-size:9.5px;color:var(--muted2);letter-spacing:.7px;font-weight:700;margin-top:3px}\n\n.setup{background:var(--bg2);border:1px solid var(--border);border-radius:10px;\n  padding:11px 13px;margin-bottom:13px;font-size:12.5px;color:#c4d0dc;line-height:1.65}\n.setup b{color:var(--text);font-weight:700}\n\n/* 动作示意图 */\n.ex-fig{background:var(--bg2);border:1px solid var(--border);border-radius:12px;\n  padding:6px 6px 2px;margin-bottom:13px;display:flex;justify-content:center}\n.ex-fig svg{width:100%;max-width:320px;height:auto;display:block}\n\n.steps{counter-reset:s;margin-bottom:13px}\n.step{display:flex;gap:10px;margin-bottom:8px}\n.step-n{width:20px;height:20px;border-radius:6px;background:var(--border);color:var(--muted);\n  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;margin-top:1px}\n.step-t{font-size:13px;color:#c4d0dc;line-height:1.6}\n\n/* 注意点 */\n.notes{background:var(--warnbg);border:1px solid rgba(255,159,67,.28);border-radius:12px;\n  padding:13px 14px;margin-bottom:14px}\n.notes-hd{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;\n  color:var(--warn);letter-spacing:.8px;margin-bottom:9px}\n.note{display:flex;gap:9px;margin-bottom:7px;font-size:12.5px;line-height:1.6;color:#e2d3c2}\n.note:last-child{margin-bottom:0}\n.note-d{color:var(--warn);font-weight:800;flex-shrink:0;font-size:13px;line-height:1.5}\n.note b{color:#ffc78b;font-weight:700}\n\n/* 危险警示 */\n.alert{background:rgba(255,95,109,.09);border:1px solid rgba(255,95,109,.32);\n  border-radius:12px;padding:13px 14px;margin-bottom:14px}\n.alert-hd{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;\n  color:var(--danger);letter-spacing:.8px;margin-bottom:10px}\n.alert-row{display:flex;gap:9px;margin-bottom:8px;font-size:12.5px;line-height:1.6}\n.alert-row:last-child{margin-bottom:0}\n.alert-b{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;\n  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}\n.alert-ok{background:rgba(0,224,164,.18);color:var(--accent)}\n.alert-no{background:rgba(255,95,109,.18);color:var(--danger)}\n.alert-t{flex:1;color:#d5dde5}\n.alert-t b{color:#fff;font-weight:700}\n\n/* 组打卡 */\n.sets-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n.sets-hd-t{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted2)}\n.sets-cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n.sets{display:flex;gap:9px;margin-bottom:13px}\n.set-dot{flex:1;height:46px;border-radius:11px;background:var(--card2);\n  border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;\n  justify-content:center;gap:2px;cursor:pointer;transition:all .2s;position:relative}\n.set-dot:active{transform:scale(.94)}\n.set-num{font-size:13px;font-weight:800;color:var(--muted2);font-variant-numeric:tabular-nums}\n.set-reps{font-size:9.5px;color:var(--muted2);letter-spacing:.3px}\n.set-dot.done{background:rgba(0,224,164,.13);border-color:var(--accent)}\n.set-dot.done .set-num,.set-dot.done .set-reps{color:var(--accent)}\n\n/* 计时器 */\n.timer{background:var(--card2);border:1px solid var(--border);border-radius:12px;\n  padding:13px 14px;display:flex;align-items:center;gap:13px}\n.tm-main{flex:1;min-width:0}\n.tm-disp{display:flex;align-items:baseline;gap:5px;margin-bottom:3px}\n.tm-sec{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;\n  letter-spacing:-1px}\n.tm-sec.run{color:var(--accent)}\n.tm-sec.fin{color:var(--warn)}\n.tm-unit{font-size:11px;color:var(--muted2);font-weight:600}\n.tm-hint{font-size:10.5px;color:var(--muted2);line-height:1.5;height:16px;overflow:hidden;\n  text-overflow:ellipsis;white-space:nowrap}\n.tm-ctrls{display:flex;flex-direction:column;gap:6px;flex-shrink:0}\n.tm-row{display:flex;gap:6px}\n.tm-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text);\n  border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;\n  font-family:inherit}\n.tm-btn:active{transform:scale(.93)}\n.tm-btn:hover{border-color:var(--border2)}\n.tm-adj{width:32px;height:28px}\n.tm-play{width:60px;height:28px;background:rgba(0,224,164,.13);color:var(--accent);\n  border-color:rgba(0,224,164,.3)}\n.tm-play.on{background:rgba(255,159,67,.13);color:var(--warn);border-color:rgba(255,159,67,.3)}\n.tm-reset{width:100%;height:26px;font-size:10.5px;color:var(--muted)}\n\n/* 清单页 */\n.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}\n.chk:last-child{border-bottom:none;padding-bottom:0}\n.chk-b{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);\n  background:var(--bg2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;\n  justify-content:center;transition:all .2s;margin-top:1px}\n.chk-b:active{transform:scale(.88)}\n.chk.done .chk-b{background:var(--accent);border-color:var(--accent)}\n.chk-b svg{width:12px;height:12px;stroke:#0a0e13;stroke-width:3.2;fill:none;opacity:0;transition:opacity .2s}\n.chk.done .chk-b svg{opacity:1}\n.chk-t{flex:1;min-width:0}\n.chk-name{font-size:13.5px;font-weight:600;line-height:1.4}\n.chk.done .chk-name{color:var(--muted2);text-decoration:line-through}\n.chk-det{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}\n.chk-dose{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;flex-shrink:0;\n  margin-top:2px}\n\n.tip{background:var(--bg2);border-left:2.5px solid var(--accent);border-radius:0 9px 9px 0;\n  padding:10px 13px;font-size:12.5px;color:#c4d0dc;line-height:1.65;margin-top:12px}\n.tip b{color:var(--text);font-weight:700}\n\n/* 完成页 */\n.done-hero{text-align:center;padding:22px 0 18px}\n.done-ico{width:62px;height:62px;border-radius:50%;background:rgba(0,224,164,.13);\n  color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}\n.done-hero h2{font-size:21px;font-weight:800;margin-bottom:6px}\n.done-hero p{font-size:13px;color:var(--muted)}\n.done-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}\n\n/* ===== 底部导航 ===== */\n.nav{flex-shrink:0;padding:11px 18px calc(11px + env(safe-area-inset-bottom));\n  border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;\n  background:rgba(10,14,19,.94);backdrop-filter:blur(12px)}\n.nav-btn{flex:0 0 auto;min-width:76px;height:40px;border-radius:10px;border:1px solid var(--border);\n  background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;\n  font-family:inherit;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}\n.nav-btn:active{transform:scale(.95)}\n.nav-btn:hover:not(:disabled){border-color:var(--border2);background:var(--card2)}\n.nav-btn:disabled{opacity:.32;cursor:not-allowed}\n.nav-btn.pri{background:rgba(0,224,164,.13);border-color:rgba(0,224,164,.3);color:var(--accent)}\n.dots{flex:1;display:flex;justify-content:center;gap:6px}\n.dot{width:6px;height:6px;border-radius:50%;background:var(--border2);cursor:pointer;\n  transition:all .25s;flex-shrink:0}\n.dot.on{width:18px;border-radius:3px;background:var(--accent)}\n.dot.seen{background:var(--muted)}\n\n@media(max-width:360px){\n  .specs{gap:6px}\n  .cover-hero h1{font-size:23px}\n  .ex-title h2{font-size:17px}\n  .nav-btn{min-width:66px;font-size:12px}\n}\n</style>\n</head>\n<body>\n<div id=\"app\">\n  <div class=\"topbar\">\n    <div class=\"tb-row\">\n      <div class=\"tb-title\" id=\"headTitle\">驼背纠正训练计划</div>\n      <div class=\"tb-meta\" id=\"headMeta\">0 / 18 组</div>\n    </div>\n    <div class=\"progress\"><div class=\"progress-fill\" id=\"progFill\"></div></div>\n  </div>\n\n  <div class=\"content\" id=\"content\"></div>\n\n  <div class=\"nav\">\n    <button class=\"nav-btn\" id=\"prevBtn\">&#8249; 上一页</button>\n    <div class=\"dots\" id=\"dots\"></div>\n    <button class=\"nav-btn pri\" id=\"nextBtn\">下一页 &#8250;</button>\n  </div>\n</div>\n\n<script>\n/* ============ 数据 ============ */\nvar TOTAL_SETS = 0;\nvar PAGES = [\n/* 0 封面 */ { type:'cover' },\n\n/* 1 热身 */ { type:'list', title:'热身激活', sub:'先放松紧张肌 · 再激活后链小肌肉', ico:'热',\n  dur:'约 10 分钟', accent:'#ff9f43', accentBg:'rgba(255,159,67,.13)',\n  tip:'<b>为什么先做放松、再做激活：</b>驼背人群的胸肌、上斜方肌长期缩短变硬，像两根绷紧的橡皮筋把肩膀往前拽。不先松开，你就很难把肩胛骨往后缩——硬练只会让斜方肌上束和脖子代偿。先用 3 分钟把紧的地方松开，再唤醒长期\"关机\"的后链小肌肉，后面的强化才能真正练到后背。',\n  items:[\n    {n:'胸大肌 / 胸小肌松解', d:'泡沫轴或网球压在胸肌、胸小肌处，缓慢滚动', s:'约 2 分钟'},\n    {n:'上斜方肌 / 肩胛提肌松解', d:'网球压在颈侧斜方肌上缘，轻轻画圈', s:'约 1 分钟'},\n    {n:'猫牛式胸椎活动', d:'四点跪位，逐节活动胸椎', s:'1 组 × 10 次'},\n    {n:'靠墙天使 Wall Angel', d:'腰背臀贴墙，手臂沿墙上滑下滑', s:'2 组 × 10 次'},\n    {n:'弹力带肩外旋', d:'大臂夹紧体侧、屈肘 90 度，手往外转', s:'2 组 × 15 次'},\n    {n:'收下巴训练', d:'平视，后脑往后方平移（双下巴动作），激活深层颈屈肌', s:'3 组 × 10 次'}\n  ]},\n\n/* 2 横握下拉 */ { type:'ex', idx:3, id:'latw',\n  name:'大剪刀后仰 · 横握下拉', en:'Wide Grip Lat Pulldown',\n  target:'背阔肌 · 大圆肌 · 斜方肌中下束',\n  sets:3, reps:'12-15', rest:45,\n  setup:'横杆握外侧折角（约 1.5 倍肩宽）；重量以最后 2 次仍能沉肩胛、后仰不塌为准。',\n  steps:[\n    '大腿卡紧固定垫，坐稳，脚掌踩实地面',\n    '先沉肩胛：想象把肩膀往裤兜里塞下去，再开始拉',\n    '躯干后仰 10-15 度，挺胸，核心收紧',\n    '肘往下往后插，拉到横杆至上胸/锁骨位置，顶峰停 1 秒',\n    '用 2-3 秒慢放回，让背阔肌完全伸展到位'\n  ],\n  notes:[\n    '<b>先沉肩胛再拉</b>，顺序反了就会耸肩，斜方肌上束代偿把脖子练粗',\n    '后仰角度<b>别超过 20 度</b>，过度后仰会变成借力，腰椎承受剪切力',\n    '感觉是<b>\"肘往下插\"</b>，不是\"手往下拽\"，否则全练到肱二头肌',\n    '回放要控制，猛放会让肩关节前侧被硬扯',\n    '全程<b>不耸肩、不仰头</b>，下巴微收'\n  ]},\n\n/* 3 纵握下拉 */ { type:'ex', idx:4, id:'latv',\n  name:'大剪刀后仰 · 纵握下拉', en:'Neutral Grip Lat Pulldown',\n  target:'背阔肌下部 · 菱形肌 · 肱二头肌',\n  sets:3, reps:'12-15', rest:45,\n  setup:'换 V 柄/竖柄，掌心相对（肩处外旋位，圆肩最友好），重量可略大。',\n  steps:[\n    '掌心相对握住 V 柄，手腕保持中立不弯折',\n    '沉肩胛、后仰 10 度、挺胸，与横握一致',\n    '肘贴近身体两侧往下走，能比横握拉得更低',\n    '拉到胸骨下缘/上腹部，顶峰夹一下肩胛，停 1 秒',\n    '2-3 秒控制回放，感受背阔肌被拉长'\n  ],\n  notes:[\n    '肘要<b>贴着身体走</b>，往外张开会变成横握的动作，失去纵握的意义',\n    '手腕别弯折，力量从肘传出去，手腕只做\"钩子\"',\n    '这是<b>肩关节压力最小</b>的下拉方式，肩痛时可以只做这一种',\n    '同样<b>不能耸肩</b>，回放时要有\"背在变长\"的感觉'\n  ]},\n\n/* 4 反向蝴蝶机 */ { type:'ex', idx:2, id:'pec',\n  name:'反向蝴蝶机', en:'Reverse Pec Deck / Reverse Fly',\n  target:'后束三角肌 · 斜方肌中束 · 菱形肌',\n  sets:4, reps:'12-15', rest:45,\n  danger:true,\n  setup:'反坐（面朝靠垫、背朝外），握把与肩同高；宁轻勿重，5-10kg 起步。',\n  steps:[\n    '胸口贴紧靠垫，核心收紧，躯干不离开靠垫',\n    '肘部微屈并全程保持这个角度，像抱一棵大树',\n    '用肩胛骨发力，带动手臂向两侧、向后展开',\n    '展开到最远处，想象两片肩胛骨中间夹住一支笔，停 1 秒',\n    '2 秒慢放回，回放时保持张力，别完全松掉'\n  ],\n  notes:[\n    '<b>肘角度全程固定</b>，用手臂甩就变成甩手，后束一点都练不到',\n    '<b>绝不耸肩</b>，肩膀始终往下压，脖子两侧的斜方肌上束要放松',\n    '回放时也要控制，让肌肉在拉长状态下继续工作',\n    '这个动作<b>不需要大重量</b>，重量一大必然靠甩，宁可加到 20 次',\n    '做对了会感觉<b>肩后侧和肩胛骨中间发酸</b>，不是手臂酸'\n  ]},\n\n/* 5 宽距划船 */ { type:'ex', idx:1, id:'row',\n  name:'宽距划船', en:'Wide Grip Seated Row',\n  target:'斜方肌中束 · 菱形肌 · 后束三角肌',\n  sets:4, reps:'12-15', rest:50,\n  setup:'装宽横杆握两端；重量以全程躯干不晃为准。',\n  steps:[\n    '脚踏稳踏板，膝盖微屈保持弹性，别锁死',\n    '躯干直立，核心收紧，挺胸，肩胛先下沉',\n    '肘尖指向斜后方 45 度，把杆拉向胸骨下缘',\n    '顶峰时肩胛骨用力夹紧，停 1 秒',\n    '回放时主动让肩胛骨\"打开\"前伸，把胸椎伸展开'\n  ],\n  notes:[\n    '<b>躯干绝不能前后晃</b>，身体一摆，力就从背部跑到腰和下背',\n    '宽握时<b>肘略高于手腕</b>，肘尖朝斜后方，不要朝正后方夹紧',\n    '回放要充分，让肩胛骨完全打开——<b>这段行程才是纠正驼背的关键</b>',\n    '全程挺胸，一旦含胸，菱形肌就卸力了',\n    '手只是钩子，想象<b>\"用肘去戳后面的人\"</b>'\n  ]},\n\n/* 6 绳索面拉 */ { type:'ex', idx:5, id:'fp',\n  name:'绳索面拉', en:'Face Pull',\n  target:'后束三角肌 · 斜方肌下束 · 冈下肌/小圆肌',\n  sets:4, reps:'12-15', rest:40,\n  setup:'滑轮调至眼/额高度，装绳索；重量以全程站定不动为准，宁轻勿重。',\n  steps:[\n    '双手对握绳头，拇指朝向自己，手臂前伸',\n    '肘与肩同高，把绳索拉向面部',\n    '到末端做外旋：前臂向外打开，拳心转向斜上方，像\"投降\"姿势',\n    '绳头停在太阳穴两侧，顶峰停 1 秒',\n    '用 3 秒慢放回，全程保持肩胛下沉'\n  ],\n  notes:[\n    '<b>腿只负责站稳</b>：不屈膝、不上下起伏、躯干不前后晃（这是你上次视频里最明显的问题，先把重量降下来）',\n    '<b>必须做外旋</b>，只往后拉不打开，后束刺激直接减半',\n    '<b>不耸肩</b>，肩膀始终往下沉，脖子两侧放松',\n    '呼吸配合：拉起时呼气，肋骨往下沉不外翻',\n    '做对了会感觉<b>肩后侧和肩胛骨下方</b>酸，脖子或手臂酸就是代偿了'\n  ]},\n\n/* 7 拉伸 */ { type:'list', title:'拉伸放松', sub:'打开胸前链 · 巩固训练效果', ico:'拉',\n  dur:'约 10 分钟', accent:'#4aa8ff', accentBg:'rgba(74,168,255,.13)',\n  tip:'<b>为什么这 10 分钟不能省：</b>驼背的根源之一是胸大肌、胸小肌长期缩短，它们像一根绷紧的橡皮筋，把肩膀死死往前拽。你在前面练了 35 分钟把后背练强，如果不把前面这根\"橡皮筋\"松开，后背再强也会被拽回去。这一半是训练，一半是治疗。',\n  items:[\n    {n:'门框胸大肌拉伸', d:'小臂贴门框，身体往前跨并轻微外旋', s:'2 × 30 秒/侧'},\n    {n:'胸小肌靠墙拉伸', d:'手放头后，前臂贴墙，身体前移', s:'2 × 30 秒/侧'},\n    {n:'上斜方肌+肩胛提肌拉伸', d:'头侧倾并轻微前屈，手轻搭头顶', s:'2 × 30 秒/侧'},\n    {n:'收下巴训练', d:'平躺或靠墙，后脑往后方平移（双下巴动作）', s:'2 × 10 次'},\n    {n:'泡沫轴胸椎伸展', d:'轴在胸椎下方，双手抱头缓慢后仰', s:'约 2 分钟'}\n  ]},\n\n/* 8 完成 */ { type:'done' }\n];\n\n/* 统计总组数 */\nPAGES.forEach(function(p){ if(p.type==='ex') TOTAL_SETS += p.sets; });\n\n/* 按科学顺序重排 ex 页：水平拉(主轴)→后束→背阔肌→肩外旋(收尾) */\n(function(){\n  var exs = PAGES.filter(function(p){return p.type==='ex';}).sort(function(a,b){return a.idx-b.idx;});\n  var k=0, out=[];\n  PAGES.forEach(function(p){ out.push(p.type==='ex' ? exs[k++] : p); });\n  PAGES = out;\n})();\nvar DONE_KEY = 'hbplan_v1';\n\n/* ============ 动作示意图（SVG 线稿） ============ */\nvar FIG = {\n latw:\n  '<svg viewBox=\"0 0 300 210\" class=\"fig-svg\" role=\"img\" aria-label=\"横握下拉示意\">'\n  +'<defs><marker id=\"m1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#ff9f43\"/></marker></defs>'\n  +'<circle cx=\"130\" cy=\"15\" r=\"6\" fill=\"none\" stroke=\"#44566a\" stroke-width=\"3\  stroke=\"#44566a\" stroke-width=\"3\"/>'\n  +'<line x1=\"116\" y1=\"44\" x2=\"144\" y2=\"44\" stroke=\"#e9eff6\" stroke-width=\"3\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"116\" y1=\"44\" x2=\"116\" y2=\"62\" stroke=\"#e9eff6\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"144\" y1=\"44\" x2=\"144\" y2=\"62\" stroke=\"#e9eff6\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<circle cx=\"130\" cy=\"86\" r=\"12\" fill=\"none\" stroke=\"#00e0a4\" stroke-width=\"3\"/>'\n  +'<line x1=\"130\" y1=\"98\" x2=\"130\" y2=\"105\" stroke=\"#00e0a4\" stroke-width=\"3\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"116\" y1=\"105\" x2=\"144\" y2=\"105\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"130\" y1=\"105\" x2=\"130\" y2=\"158\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"130\" y1=\"158\" x2=\"112\" y2=\"182\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"130\" y1=\"158\" x2=\"148\" y2=\"182\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<rect x=\"104\" y=\"160\" width=\"52\" height=\"10\" rx=\"3\" fill=\"#1b242f\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<line x1=\"118\" y1=\"105\" x2=\"116\" y2=\"50\" stroke=\"#00e0a4\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"142\" y1=\"105\" x2=\"144\" y2=\"50\" stroke=\"#00e0a4\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>'\n  +'<path d=\"M224 54 C 238 76, 238 96, 224 116\" stroke=\"#ff9f43\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#m2)\"/>'\n  +'<text x=\"150\" y=\"202\" text-anchor=\"middle\" fill=\"#ff9f43\" font-size=\"11\" font-weight=\"700\">掌心相对 · 肘贴身</text>'\n  +'</svg>',\n\n pec:\n  '<svg viewBox=\"0 0 300 210\" class=\"fig-svg\" role=\"img\" aria-label=\"反向蝴蝶机示意\">'\n  +'<defs><marker id=\"m3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fi { clearInterval(TM.id); TM.id=null; }\n  TM.running=false; TM.remain=Math.max(0,Math.round((TM.endAt-Date.now())/1000));\n  paintTimer();\n}\nfunction tmTick(){\n  var left=Math.max(0,Math.round((TM.endAt-Date.now())/1000));\n  if(left!==TM.remain){ TM.remain=left; }\n  if(left<=0){\n    if(TM.id){ clearInterval(TM.id); TM.id=null; }\n    TM.running=false; beep();\n    if(navigator.vibrate) try{ navigator.vibrate([180,90,180]); }catch(e){}\n  }\n  paintTimer();\n}\nfunction tmAdj(d){\n  var t=Math.min(60,Math.max(30,TM.total+d));\n  if(TM.running){ TM.total=t; }\n  else { TM.total=t; TM.remain=t; tmReset(t); }\n  paintTimer();\n}\nfunction paintTimer(){\n  var s=document.getElementById('tmSec'); if(!s) return;\n  var btn=document.getElementById('tmPlay');\n  var tot=document.getElementById('tmTotal');\n  s.textContent=TM.remain;\n  s.className='tm-sec'+(TM.running?' run':(TM.remain===0?' fin':''));\n  if(btn) btn.textContent=TM.running?'暂停':'开始';\n  if(btn) btn.className='tm-btn tm-play'+(TM.running?' on':'');\n  if(tot) tot.textContent=TM.total;\n  var ring=document.getElementById('tmRing');\n  if(ring){\n    var pct = TM.total>0 ? (1-TM.remain/TM.total) : 0;\n    ring.style.width=(pct*100)+'%';\n  }\n}\n\n/* ============ 渲染 ============ */\nfunction esc(s){ return s; }\n\nfunction renderCover(){\n  var listHtml = PAGES.map(function(p,i){\n    if(p.type!=='ex') return '';\n    return '<div class=\"ov-item\" data-go=\"'+i+'\">'+\n      '<div class=\"ov-n\">'+p.idx+'</div>'+\n      '<div class=\"ov-name\">'+p.name+'</div>'+\n      '<div class=\"ov-s\">'+p.sets+' × '+p.reps+'</div></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"cover-hero\">'+\n      '<h1>驼背纠正训练计划</h1>'+\n      '<p>强化后背链 &nbsp;+&nbsp; 打开胸前链<br>改善圆肩 · 上交叉综合征</p>'+\n    '</div>'+\n    '<div class=\"big-banner\">'+\n      '<div class=\"bb-k\">驼背纠正第一铁律 · 每一下都先做到</div>'+\n      '<div class=\"bb-row\">'+\n        '<div class=\"bb-item\"><div class=\"bb-t\">先 <b>沉肩胛</b> · 不耸肩</div>'+\n          '<div class=\"bb-d\">发力前先把肩膀往下\"塞\"进裤兜、远离耳朵。耸肩＝斜方肌上束（脖子）代偿，越练越圆肩。</div></div>'+\n        '<div class=\"bb-item\"><div class=\"bb-t\">夹肩胛 · <b>躯干腿不动</b></div>'+\n          '<div class=\"bb-d\">靠肩胛后缩和后链发力，不是靠晃身体、屈膝去够重量。腿只站稳，动的是后背。</div></div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"timebar\">'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#ff9f43\">10<small>分钟</small><span>热身</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:35;background:#00e0a4\">35<small>分钟</small><span>主体</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#4aa8ff\">10<small>分钟</small><span>拉伸</span></div>'+\n    '</div>'+\n    '<div class=\"tb-legend\">'+\n      '<span><i style=\"background:#ff9f43\"></i>热身 10</span>'+\n      '<span><i style=\"background:#00e0a4\"></i>主体 35</span>'+\n      '<span><i style=\"background:#4aa8ff\"></i>拉伸 10</span>'+\n      '<span style=\"color:var(--accent);font-weight:700\">合计 约 55 分钟</span>'+\n    '</div>'+\n    '<div class=\"kv\" style=\"margin-top:16px\">'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">主项动作</div><div class=\"kv-v\">5 <small>个</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总组数</div><div class=\"kv-v\">'+TOTAL_SETS+' <small>组</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">每组次数</div><div class=\"kv-v\">12-15 <small>次</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">组间歇</div><div class=\"kv-v\">40-50 <small>秒</small></div></div>'+\n    '</div>'+\n    '<div class=\"card\" style=\"margin-top:14px\">'+\n      '<div class=\"card-hd\"><div class=\"card-ico\" style=\"background:rgba(255,159,67,.13);color:#ff9f43\">!</div>'+\n      '<div class=\"card-t\">先看这 3 条，比动作本身更重要</div></div>'+\n      '<div style=\"font-size:12.5px;line-height:1.75;color:#c4d0dc\">'+\n        '<div style=\"margin-bottom:8px\"><b style=\"color:#ffc78b\">1. 蝴蝶机必须反着坐。</b>正向夹胸练胸大肌，对圆肩是火上浇油；反坐向后展开才是纠正动作。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>2. 这 4 个动作只能练 35 分钟。</b>剩下的 20 分钟靠热身（含放松）+拉伸补上，而拉伸是纠正驼背的另一半，别省。</div>'+\n        '<div><b>3. 重量宁轻勿重。</b>所有动作的判断标准统一：最后 2 次仍能做到不耸肩、不晃躯干、不屈膝。</div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"tip\" style=\"margin-top:14px\"><b>动作顺序：</b>热身放松 → 宽距划船 → 反向蝴蝶机 → 横/纵握下拉 → 绳索面拉 → 拉伸。先松后练、复合优先、面拉收尾。</div>'+\n    '<div class=\"sec-t\">训练流程（点任意动作可直接跳过去）</div>'+\n    '<div class=\"ov-list\">'+\n      '<div class=\"ov-item\" data-go=\"1\"><div class=\"ov-n\" style=\"background:rgba(255,159,67,.13);color:#ff9f43\">热</div>'+\n        '<div class=\"ov-name\">热身激活</div><div class=\"ov-s\">10 分钟</div></div>'+\n      listHtml+\n      '<div class=\"ov-item\" data-go=\"7\"><div class=\"ov-n\" style=\"background:rgba(74,168,255,.13);color:#4aa8ff\">拉</div>'+\n        '<div class=\"ov-name\">拉伸放松</div><div class=\"ov-s\">10 分钟</div></div>'+\n    '</div>'+\n    '<div class=\"tip\" style=\"margin-top:14px\"><b>频率：</b>每周 2-3 次，间隔≥48 小时；坚持 6-8 周才见明显变化，前两周肩后侧开始有感觉就是进步。</div>'+\n  '</div>';\n}\n\nfunction renderList(p,pi){\n  var items = p.items.map(function(it,i){\n    var k = pi+'_'+i;\n    var on = !!ST.list[k];\n    return '<div class=\"chk'+(on?' done':'')+'\" data-chk=\"'+k+'\">'+\n      '<div class=\"chk-b\"><svg viewBox=\"0 0 24 24\"><polyline points=\"4,12 10,18 20,6\"/></svg></div>'+\n      '<div class=\"chk-t\"><div class=\"chk-name\">'+it.n+'</div><div class=\"chk-det\">'+it.d+'</div></div>'+\n      '<div class=\"chk-dose\">'+it.s+'</div></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"ex-head\">'+\n      '<div class=\"ex-idx\" style=\"background:'+p.accentBg+';color:'+p.accent+'\">'+p.ico+'</div>'+\n      '<div class=\"ex-title\"><h2>'+p.title+'</h2>'+\n        '<div class=\"ex-en\">'+p.sub+'</div>'+\n        '<div class=\"ex-target\" style=\"color:'+p.accent+'\">'+p.dur+'</div></div>'+\n    '</div>'+\n    '<div class=\"card\"><div style=\"font-size:12.5px;letter-spacing:.8px;color:var(--muted2);font-weight:700;margin-bottom:4px\">逐项完成</div>'+\n      items+'</div>'+\n    '<div class=\"tip\" style=\"border-left-color:'+p.accent+'\">'+p.tip+'</div>'+\n  '</div>';\n}\n\nfunction renderEx(p,pi){\n  var st = ST.sets[p.id] || [];\n  var dots='';\n  for(var i=0;i<p.sets;i++){\n    var on = st.indexOf(i)>-1;\n    dots += '<div class=\"set-dot'+(on?' done':'')+'\" data-set=\"'+i+'\">'+\n      '<div class=\"set-num\">第 '+(i+1)+' 组</div><div class=\"set-reps\">'+p.reps+' 次</div></div>';\n  }\n  var doneN = st.length;\n\n  var steps = p.steps.map(function(s,i){\n    return '<div class=\"step\"><div class=\"step-n\">'+(i+1)+'</div><div class=\"step-t\">'+s+'</div></div>';\n  }).join('');\n\n  var notes = p.notes.map(function(n){\n    return '<div class=\"note\"><span class=\"note-d\">&#9679;</span><span>'+n+'</span></div>';\n  }).join('');\n\n  var alertHtml='';\n  if(p.danger){\n    alertHtml = '<div class=\"alert\">'+\n      '<div class=\"alert-hd\"><span>&#9888;</span>方向错了会加重驼背</div>'+\n      '<div class=\"alert-row\"><div class=\"alert-b alert-ok\">&#10003;</div>'+\n        '<div class=\"alert-t\"><b>要这样做：</b>面朝靠垫反坐，向两侧<b>向后</b>展开，夹紧肩胛骨。练后束三角肌、斜方肌中束、菱形肌。</div></div>'+\n      '<div class=\"alert-row\"><div class=\"alert-b alert-no\">&#10007;</div>'+\n        '<div class=\"alert-t\"><b>绝不要：</b>正向坐、双手向前环抱夹胸。那是练胸大肌，会让紧张的胸前侧更紧，圆肩更严重。</div></div>'+\n    '</div>';\n  }\n\n  return '<div class=\"page\">'+\n    '<div class=\"ex-head\">'+\n      '<div class=\"ex-idx\">'+p.idx+'</div>'+\n      '<div class=\"ex-title\"><h2>'+p.name+'</h2>'+\n        '<div class=\"ex-en\">'+p.en+' · 第 '+p.idx+' / 5 个动作</div>'+\n        '<div class=\"ex-target\">目标肌群：'+p.target+'</div></div>'+\n    '</div>'+\n    '<div class=\"specs\">'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.sets+'</div><div class=\"spec-k\">组数</div></div>'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.reps+'</div><div class=\"spec-k\">每组次数</div></div>'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.rest+'</div><div class=\"spec-k\">组间歇秒</div></div>'+\n    '</div>'+\n    '<div class=\"ex-fig\">'+FIG[p.id]+'</div>'+\n    '<div class=\"setup\">'+p.setup+'</div>'+\n    '<div class=\"sec-t\">执行步骤</div>'+\n    '<div class=\"steps\">'+steps+'</div>'+\n    alertHtml+\n    '<div class=\"notes\">'+\n      '<div class=\"notes-hd\"><span>&#9888;</span>注意点（每组都要检查）</div>'+notes+\n    '</div>'+\n    '<div class=\"sec-t\">组数打卡 · 完成一组自动开始间歇计时</div>'+\n    '<div class=\"sets-hd\"><div class=\"sets-hd-t\">点击圆圈标记完成</div>'+\n      '<div class=\"sets-cnt\">'+doneN+' / '+p.sets+' 组</div></div>'+\n    '<div class=\"sets\">'+dots+'</div>'+\n    '<div class=\"timer\">'+\n      '<div class=\"tm-main\">'+\n        '<div class=\"tm-disp\"><span class=\"tm-sec\" id=\"tmSec\">'+p.rest+'</span>'+\n          '<span class=\"tm-unit\">秒 / <span id=\"tmTotal\">'+p.rest+'</span> 秒</span></div>'+\n        '<div class=\"tm-hint\" id=\"tmHint\">点上面的组数，计时自动开始</div>'+\n        '<div class=\"progress\" style=\"margin-top:7px\"><div class=\"progress-fill\" id=\"tmRing\" style=\"width:0\"></div></div>'+\n      '</div>'+\n      '<div class=\"tm-ctrls\">'+\n        '<div class=\"tm-row\">'+\n          '<button class=\"tm-btn tm-adj\" id=\"tmMinus\">&#8722;5</button>'+\n          '<button class=\"tm-btn tm-play\" id=\"tmPlay\">开始</button>'+\n          '<button class=\"tm-btn tm-adj\" id=\"tmPlus\">+5</button>'+\n        '</div>'+\n        '<button class=\"tm-btn tm-reset\" id=\"tmReset\">重置</button>'+\n      '</div>'+\n    '</div>'+\n  '</div>';\n}\n\nfunction renderDone(){\n  var done=0; PAGES.forEach(function(p){ if(p.type==='ex') done+=(ST.sets[p.id]||[]).length; });\n  var pct = TOTAL_SETS? Math.round(done/TOTAL_SETS*100):0;\n  return '<div class=\"page\">'+\n    '<div class=\"done-hero\">'+\n      '<div class=\"done-ico\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4,12 10,18 20,5\"/></svg></div>'+\n      '<h2>训练完成</h2><p>今天练了 '+done+' 组，完成度 '+pct+'%</p>'+\n    '</div>'+\n    '<div class=\"done-stat\">'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总组数</div><div class=\"kv-v\">'+done+'<small>/'+TOTAL_SETS+'</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总时长</div><div class=\"kv-v\">55 <small>分钟</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">建议频率</div><div class=\"kv-v\">2-3 <small>次/周</small></div></div>'+\n    '</div>'+\n    '<div class=\"card\">'+\n      '<div class=\"card-hd\"><div class=\"card-ico\">&#9635;</div><div class=\"card-t\">练完必做的 3 件事</div></div>'+\n      '<div style=\"font-size:12.5px;line-height:1.8;color:#c4d0dc\">'+\n        '<div style=\"margin-bottom:8px\"><b>1. 记录发力感。</b>在备忘录记一句\"今天哪个动作感觉到肩后侧酸了\"。几周后你会发现感觉越来越明确，这就是神经肌肉连接建立的过程。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>2. 日常姿势比训练更重要。</b>屏幕垫高到眼睛高度，每 45 分钟做一次\"靠墙天使\"——训练 55 分钟，剩下 15 小时才是决定因素。</div>'+\n        '<div><b>3. 下次拍个侧面视频。</b>手机架胸口高度、距离 2.5-3 米，我可以逐帧帮你检查肩胛和躯干有没有代偿。</div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"tip\"><b>预期时间表：</b>1-2 周肩后侧有感觉；3-4 周能控制肩胛后缩、肩不往前扣；6-8 周他人看出姿态变化。<b>4 周无变化，多半是重量过大或日常姿势未同步调整。</b></div>'+\n    '<button class=\"nav-btn\" id=\"resetAll\" style=\"width:100%;height:42px;margin-top:14px;background:var(--card);border:1px solid var(--border);color:var(--muted)\">清除打卡记录，重新开始</button>'+\n  '</div>';\n}\n\n/* ============ 主逻辑 ============ */\nvar content=document.getElementById('content');\nvar prevBtn=document.getElementById('prevBtn');\nvar nextBtn=document.getElementById('nextBtn');\nvar dotsBox=document.getElementById('dots');\n\nfunction curEx(){ var p=PAGES[ST.page]; return (p&&p.type==='ex')?p:null; }\n\nfunction paint(){\n  var p=PAGES[ST.page];\n  ST.seen[ST.page]=1; save();\n  content.scrollTop=0;\n\n  if(p.type==='cover'){ content.innerHTML=renderCover(); }\n  else if(p.type==='list'){ content.innerHTML=renderList(p,ST.page); }\n  else if(p.type==='ex'){ tmReset(p.rest); content.innerHTML=renderEx(p,ST.page); }\n  else { content.innerHTML=renderDone(); }\n\n  // 头部\n  var ht=document.getElementById('headTitle');\n  var hm=document.getElementById('headMeta');\n  var done=0; PAGES.forEach(function(q){ if(q.type==='ex') done+=(ST.sets[q.id]||[]).length; });\n  document.getElementById('progFill').style.width=(TOTAL_SETS?done/TOTAL_SETS*100:0)+'%';\n  if(p.type==='cover'){ ht.textContent='驼背纠正训练计划'; }\n  else if(p.type==='ex'){ ht.textContent=p.name; }\n  else if(p.type==='list'){ ht.textContent=p.title; }\n  else { ht.textContent='训练完成'; }\n  hm.innerHTML='<b>'+done+'</b> / '+TOTAL_SETS+' 组';\n\n  // 导航\n  prevBtn.disabled = ST.page===0;\n  if(ST.page===PAGES.length-1){ nextBtn.textContent='已完成'; nextBtn.disabled=true; }\n  else { nextBtn.innerHTML='下一页 &#8250;'; nextBtn.disabled=false; }\n\n  // 页码点\n  var dh='';\n  for(var i=0;i<PAGES.length;i++){\n    dh+='<div class=\"dot'+(i===ST.page?' on':(ST.seen[i]?' seen':''))+'\" data-dot=\"'+i+'\"></div>';\n  }\n  dotsBox.innerHTML=dh;\n\n  bind();\n}\n\nfunction bind(){\n  // 跳转\n  var gos=content.querySelectorAll('[data-go]');\n  for(var i=0;i<gos.length;i++){\n    gos[i].addEventListener('click',function(){\n      ST.page=+this.getAttribute('data-go'); paint();\n    });\n  }\n  // 页码点\n  var ds=dotsBox.querySelectorAll('[data-dot]');\n  for(var j=0;j<ds.length;j++){\n    ds[j].addEventListener('click',function(){\n      ST.page=+this.getAttribute('data-dot'); paint();\n    });\n  }\n  // 清单勾选\n  var chks=content.querySelectorAll('[data-chk]');\n  for(var k=0;k<chks.length;k++){\n    chks[k].addEventListener('click',function(){\n      var key=this.getAttribute('data-chk');\n      if(ST.list[key]) delete ST.list[key]; else ST.list[key]=1;\n      save(); paint();\n    });\n  }\n  // 组打卡\n  var p=curEx();\n  if(p){\n    var sd=content.querySelectorAll('[data-set]');\n    for(var m=0;m<sd.length;m++){\n      sd[m].addEventListener('click',function(){\n        var idx=+this.getAttribute('data-set');\n        var arr=ST.sets[p.id]||[];\n        var pos=arr.indexOf(idx);\n        if(pos>-1) arr.splice(pos,1); else arr.push(idx);\n        ST.sets[p.id]=arr; save();\n        if(pos===-1 && arr.length<p.sets){ tmStart(); }\n        paint();\n      });\n    }\n    var b1=document.getElementById('tmPlay');\n    var b2=document.getElementById('tmMinus');\n    var b3=document.getElementById('tmPlus');\n    var b4=document.getElementById('tmReset');\n    if(b1) b1.addEventListener('click',function(){ TM.running?tmPause():tmStart(); });\n    if(b2) b2.addEventListener('click',function(){ tmAdj(-5); });\n    if(b3) b3.addEventListener('click',function(){ tmAdj(5); });\n    if(b4) b4.addEventListener('click',function(){ tmReset(TM.total); paintTimer(); var h=document.getElementById('tmHint'); if(h) h.textContent='已重置为 '+TM.total+' 秒'; });\n  }\n  // 清除\n  var ra=document.getElementById('resetAll');\n  if(ra) ra.addEventListener('click',function(){\n    ST.sets={}; ST.list={}; ST.seen={}; ST.page=0; save(); paint();\n  });\n}\n\nfunction go(d){\n  var t=ST.page+d;\n  if(t<0||t>=PAGES.length) return;\n  ST.page=t; paint();\n}\n\nprevBtn.addEventListener('click',function(){ go(-1); });\nnextBtn.addEventListener('click',function(){ go(1); });\n\ndocument.addEventListener('keydown',function(e){\n  if(e.key==='ArrowLeft'){ go(-1); }\n  else if(e.key==='ArrowRight'){ go(1); }\n});\n\n// 滑动翻页\nvar tx=0,ty=0,tracking=false;\ncontent.addEventListener('touchstart',function(e){\n  if(e.touches.length!==1) return;\n  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tracking=true;\n},{passive:true});\ncontent.addEventListener('touchend',function(e){\n  if(!tracking) return; tracking=false;\n  var t=e.changedTouches[0];\n  var dx=t.clientX-tx, dy=t.clientY-ty;\n  if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6){\n    if(dx<0) go(1); else go(-1);\n  }\n},{passive:true});\n\npaint();\n<\/script>\n</body>\n</html>\n", "综合练背训练计划.html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>综合练背训练计划</title>\n<style>\n:root{\n  --bg:#0a0e13; --bg2:#111820; --card:#161e27; --card2:#1b242f;\n  --border:#242f3d; --border2:#2e3b4c;\n  --text:#e9eff6; --muted:#8697a8; --muted2:#5f7183;\n  --accent:#00e0a4; --accent2:#00b884;\n  --warn:#ff9f43; --warnbg:rgba(255,159,67,.10);\n  --danger:#ff5f6d; --good:#00e0a4;\n}\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%}\nbody{\n  background:var(--bg); color:var(--text);\n  font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  font-size:15px; line-height:1.6; overflow:hidden;\n  -webkit-font-smoothing:antialiased;\n}\n#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;\n  background:linear-gradient(170deg,#0a0e13 0%,#111a24 100%);position:relative}\n\n/* ===== 顶栏 ===== */\n.topbar{padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}\n.tb-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}\n.tb-title{font-size:16px;font-weight:700;letter-spacing:.3px}\n.tb-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n.tb-meta b{color:var(--accent);font-weight:700}\n.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden}\n.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));\n  border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}\n\n/* ===== 内容区 ===== */\n.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;\n  padding:18px 18px 24px;scroll-behavior:smooth}\n.content::-webkit-scrollbar{width:0}\n.page{animation:pageIn .32s cubic-bezier(.4,0,.2,1)}\n@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n\n/* ===== 通用卡片 ===== */\n.card{background:var(--card);border:1px solid var(--border);border-radius:14px;\n  padding:16px;margin-bottom:14px}\n.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.card-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;\n  font-size:15px;font-weight:700;flex-shrink:0;background:rgba(0,224,164,.13);color:var(--accent)}\n.card-t{font-size:15px;font-weight:700}\n\n.sec-t{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--muted2);\n  text-transform:uppercase;margin:16px 0 9px}\n\n/* ===== 封面 ===== */\n.cover-hero{padding:6px 0 18px;text-align:center}\n.cover-hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;\n  background:linear-gradient(120deg,#fff 20%,var(--accent));-webkit-background-clip:text;\n  -webkit-text-fill-color:transparent;background-clip:text}\n.cover-hero p{font-size:13px;color:var(--muted);line-height:1.7}\n\n/* 首页高亮提示横幅 */\n.big-banner{margin:4px 0 16px;padding:14px 16px;border-radius:14px;\n  background:linear-gradient(120deg,rgba(255,159,67,.16),rgba(0,224,164,.14));\n  border:1.5px solid rgba(255,159,67,.55);box-shadow:0 6px 18px rgba(255,159,67,.12)}\n.big-banner .bb-k{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;\n  letter-spacing:1px;color:#ff9f43;margin-bottom:8px}\n.big-banner .bb-k::before{content:\"⚡\";font-size:14px}\n.big-banner .bb-row{display:flex;gap:10px;flex-wrap:wrap}\n.big-banner .bb-item{flex:1;min-width:120px;background:rgba(10,14,19,.45);border-radius:10px;\n  padding:10px 11px;border:1px solid var(--border)}\n.big-banner .bb-t{font-size:15px;font-weight:800;color:#fff;margin-bottom:3px}\n.big-banner .bb-t b{color:var(--accent)}\n.big-banner .bb-d{font-size:11.5px;line-height:1.6;color:#c4d0dc}\n\n.timebar{display:flex;height:44px;border-radius:11px;overflow:hidden;margin-bottom:9px;\n  border:1px solid var(--border)}\n.tb-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;\n  font-size:11px;line-height:1.25;color:#0a0e13;font-weight:700}\n.tb-seg span{font-size:9px;font-weight:600;opacity:.75}\n.tb-legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-bottom:4px}\n.tb-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}\n\n.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.kv-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 12px}\n.kv-k{font-size:10px;color:var(--muted2);letter-spacing:.8px;font-weight:700;margin-bottom:3px}\n.kv-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}\n.kv-v small{font-size:11px;color:var(--muted);font-weight:600}\n\n.ov-list{display:flex;flex-direction:column;gap:7px}\n.ov-item{display:flex;align-items:center;gap:11px;background:var(--card2);\n  border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;\n  transition:border-color .2s,transform .15s}\n.ov-item:active{transform:scale(.985)}\n.ov-item:hover{border-color:var(--border2)}\n.ov-n{width:22px;height:22px;border-radius:7px;background:rgba(0,224,164,.13);color:var(--accent);\n  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.ov-name{flex:1;font-size:13px;font-weight:600}\n.ov-s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n\n/* ===== 动作页 ===== */\n.ex-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}\n.ex-idx{width:38px;height:38px;border-radius:11px;background:rgba(0,224,164,.13);\n  color:var(--accent);display:flex;align-items:center;justify-content:center;\n  font-size:15px;font-weight:800;flex-shrink:0}\n.ex-title{flex:1;min-width:0}\n.ex-title h2{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.3}\n.ex-en{font-size:11px;color:var(--muted2);letter-spacing:.5px;margin-top:2px}\n.ex-target{font-size:11px;color:var(--accent);margin-top:5px;font-weight:600}\n\n.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}\n.spec{background:var(--card2);border:1px solid var(--border);border-radius:10px;\n  padding:9px 6px;text-align:center}\n.spec-v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}\n.spec-k{font-size:9.5px;color:var(--muted2);letter-spacing:.7px;font-weight:700;margin-top:3px}\n\n.setup{background:var(--bg2);border:1px solid var(--border);border-radius:10px;\n  padding:11px 13px;margin-bottom:13px;font-size:12.5px;color:#c4d0dc;line-height:1.65}\n.setup b{color:var(--text);font-weight:700}\n\n/* 动作示意图 */\n.ex-fig{background:var(--bg2);border:1px solid var(--border);border-radius:12px;\n  padding:6px 6px 2px;margin-bottom:13px;display:flex;justify-content:center}\n.ex-fig svg{width:100%;max-width:320px;height:auto;display:block}\n\n.steps{counter-reset:s;margin-bottom:13px}\n.step{display:flex;gap:10px;margin-bottom:8px}\n.step-n{width:20px;height:20px;border-radius:6px;background:var(--border);color:var(--muted);\n  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;margin-top:1px}\n.step-t{font-size:13px;color:#c4d0dc;line-height:1.6}\n\n/* 注意点 */\n.notes{background:var(--warnbg);border:1px solid rgba(255,159,67,.28);border-radius:12px;\n  padding:13px 14px;margin-bottom:14px}\n.notes-hd{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;\n  color:var(--warn);letter-spacing:.8px;margin-bottom:9px}\n.note{display:flex;gap:9px;margin-bottom:7px;font-size:12.5px;line-height:1.6;color:#e2d3c2}\n.note:last-child{margin-bottom:0}\n.note-d{color:var(--warn);font-weight:800;flex-shrink:0;font-size:13px;line-height:1.5}\n.note b{color:#ffc78b;font-weight:700}\n\n/* 危险警示 */\n.alert{background:rgba(255,95,109,.09);border:1px solid rgba(255,95,109,.32);\n  border-radius:12px;padding:13px 14px;margin-bottom:14px}\n.alert-hd{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;\n  color:var(--danger);letter-spacing:.8px;margin-bottom:10px}\n.alert-row{display:flex;gap:9px;margin-bottom:8px;font-size:12.5px;line-height:1.6}\n.alert-row:last-child{margin-bottom:0}\n.alert-b{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;\n  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}\n.alert-ok{background:rgba(0,224,164,.18);color:var(--accent)}\n.alert-no{background:rgba(255,95,109,.18);color:var(--danger)}\n.alert-t{flex:1;color:#d5dde5}\n.alert-t b{color:#fff;font-weight:700}\n\n/* 组打卡 */\n.sets-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n.sets-hd-t{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted2)}\n.sets-cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n.sets{display:flex;gap:9px;margin-bottom:13px}\n.set-dot{flex:1;height:46px;border-radius:11px;background:var(--card2);\n  border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;\n  justify-content:center;gap:2px;cursor:pointer;transition:all .2s;position:relative}\n.set-dot:active{transform:scale(.94)}\n.set-num{font-size:13px;font-weight:800;color:var(--muted2);font-variant-numeric:tabular-nums}\n.set-reps{font-size:9.5px;color:var(--muted2);letter-spacing:.3px}\n.set-dot.done{background:rgba(0,224,164,.13);border-color:var(--accent)}\n.set-dot.done .set-num,.set-dot.done .set-reps{color:var(--accent)}\n\n/* 计时器 */\n.timer{background:var(--card2);border:1px solid var(--border);border-radius:12px;\n  padding:13px 14px;display:flex;align-items:center;gap:13px}\n.tm-main{flex:1;min-width:0}\n.tm-disp{display:flex;align-items:baseline;gap:5px;margin-bottom:3px}\n.tm-sec{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;\n  letter-spacing:-1px}\n.tm-sec.run{color:var(--accent)}\n.tm-sec.fin{color:var(--warn)}\n.tm-unit{font-size:11px;color:var(--muted2);font-weight:600}\n.tm-hint{font-size:10.5px;color:var(--muted2);line-height:1.5;height:16px;overflow:hidden;\n  text-overflow:ellipsis;white-space:nowrap}\n.tm-ctrls{display:flex;flex-direction:column;gap:6px;flex-shrink:0}\n.tm-row{display:flex;gap:6px}\n.tm-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text);\n  border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;\n  font-family:inherit}\n.tm-btn:active{transform:scale(.93)}\n.tm-btn:hover{border-color:var(--border2)}\n.tm-adj{width:32px;height:28px}\n.tm-play{width:60px;height:28px;background:rgba(0,224,164,.13);color:var(--accent);\n  border-color:rgba(0,224,164,.3)}\n.tm-play.on{background:rgba(255,159,67,.13);color:var(--warn);border-color:rgba(255,159,67,.3)}\n.tm-reset{width:100%;height:26px;font-size:10.5px;color:var(--muted)}\n\n/* 清单页 */\n.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}\n.chk:last-child{border-bottom:none;padding-bottom:0}\n.chk-b{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);\n  background:var(--bg2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;\n  justify-content:center;transition:all .2s;margin-top:1px}\n.chk-b:active{transform:scale(.88)}\n.chk.done .chk-b{background:var(--accent);border-color:var(--accent)}\n.chk-b svg{width:12px;height:12px;stroke:#0a0e13;stroke-width:3.2;fill:none;opacity:0;transition:opacity .2s}\n.chk.done .chk-b svg{opacity:1}\n.chk-t{flex:1;min-width:0}\n.chk-name{font-size:13.5px;font-weight:600;line-height:1.4}\n.chk.done .chk-name{color:var(--muted2);text-decoration:line-through}\n.chk-det{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}\n.chk-dose{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;flex-shrink:0;\n  margin-top:2px}\n\n.tip{background:var(--bg2);border-left:2.5px solid var(--accent);border-radius:0 9px 9px 0;\n  padding:10px 13px;font-size:12.5px;color:#c4d0dc;line-height:1.65;margin-top:12px}\n.tip b{color:var(--text);font-weight:700}\n\n/* 完成页 */\n.done-hero{text-align:center;padding:22px 0 18px}\n.done-ico{width:62px;height:62px;border-radius:50%;background:rgba(0,224,164,.13);\n  color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}\n.done-hero h2{font-size:21px;font-weight:800;margin-bottom:6px}\n.done-hero p{font-size:13px;color:var(--muted)}\n.done-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}\n\n/* ===== 底部导航 ===== */\n.nav{flex-shrink:0;padding:11px 18px calc(11px + env(safe-area-inset-bottom));\n  border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;\n  background:rgba(10,14,19,.94);backdrop-filter:blur(12px)}\n.nav-btn{flex:0 0 auto;min-width:76px;height:40px;border-radius:10px;border:1px solid var(--border);\n  background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;\n  font-family:inherit;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}\n.nav-btn:active{transform:scale(.95)}\n.nav-btn:hover:not(:disabled){border-color:var(--border2);background:var(--card2)}\n.nav-btn:disabled{opacity:.32;cursor:not-allowed}\n.nav-btn.pri{background:rgba(0,224,164,.13);border-color:rgba(0,224,164,.3);color:var(--accent)}\n.dots{flex:1;display:flex;justify-content:center;gap:6px}\n.dot{width:6px;height:6px;border-radius:50%;background:var(--border2);cursor:pointer;\n  transition:all .25s;flex-shrink:0}\n.dot.on{width:18px;border-radius:3px;background:var(--accent)}\n.dot.seen{background:var(--muted)}\n\n@media(max-width:360px){\n  .specs{gap:6px}\n  .cover-hero h1{font-size:23px}\n  .ex-title h2{font-size:17px}\n  .nav-btn{min-width:66px;font-size:12px}\n}\n</style>\n</head>\n<body>\n<div id=\"app\">\n  <div class=\"topbar\">\n    <div class=\"tb-row\">\n      <div class=\"tb-title\" id=\"headTitle\">综合练背训练计划</div>\n      <div class=\"tb-meta\" id=\"headMeta\">0 / 18 组</div>\n    </div>\n    <div class=\"progress\"><div class=\"progress-fill\" id=\"progFill\"></div></div>\n  </div>\n\n  <div class=\"content\" id=\"content\"></div>\n\n  <div class=\"nav\">\n    <button class=\"nav-btn\" id=\"prevBtn\">&#8249; 上一页</button>\n    <div class=\"dots\" id=\"dots\"></div>\n    <button class=\"nav-btn pri\" id=\"nextBtn\">下一页 &#8250;</button>\n  </div>\n</div>\n\n<script>\n/* ============ 数据 ============ */\nvar TOTAL_SETS = 0;\nvar PAGES = [\n/* 0 封面 */ { type:'cover' },\n\n/* 1 热身 */ { type:'list', title:'热身激活', sub:'先激活背阔肌 · 学会把肩膀沉下去', ico:'热',\n  dur:'约 10 分钟', accent:'#ff9f43', accentBg:'rgba(255,159,67,.13)',\n  tip:'<b>为什么先练\"沉肩\"：</b>练背最大的坑不是重量，是耸肩——背阔肌还没发力，斜方肌上束（脖子两侧那块）就抢着干了，练完脖子粗、背没感觉。热身先做死挂和肩胛引体，把\"肩膀往裤兜里塞\"这个动作练成肌肉记忆，后面的垂直拉才能真正练到背阔肌，而不是练脖子。',\n  items:[\n    {n:'死挂 Dead Hang', d:'双手抓单杠或引体机横杆，身体悬垂，主动把肩胛骨下沉', s:'2 组 × 20 秒'},\n    {n:'肩胛引体 Scapular Pull-up', d:'悬垂状态，只做\"沉肩+后缩\"，不弯肘、不拉起身体', s:'2 组 × 10 次'},\n    {n:'弹力带 Pull-apart', d:'双手前举握弹力带，向两侧水平展开到胸前', s:'2 组 × 15 次'},\n    {n:'猫牛式胸椎活动', d:'四点跪位，逐节活动胸椎', s:'1 组 × 10 次'},\n    {n:'弹力带肩外旋', d:'大臂夹紧体侧、屈肘 90 度，手往外转', s:'2 组 × 15 次'}\n  ]},\n\n/* 2 引体向上机 */ { type:'ex', idx:1, id:'pu',\n  name:'引体向上机（助力引体）', en:'Assisted Pull-up',\n  target:'背阔肌 · 大圆肌 · 肱二头肌 · 斜方肌下束',\n  sets:4, reps:'12-15', rest:50,\n  setup:'调好助力重量（能完成 12-15 次），跪/站上垫，双手正握略宽于肩；重量以最后 2 次不靠甩、不耸肩为准。',\n  steps:[\n    '双手正握横杆，握距略宽于肩，悬垂时身体稳定、不前后荡',\n    '先沉肩胛：把肩膀往裤兜里塞下去，再开始拉',\n    '想象用肘把身体往杆上拉，胸口主动靠向杆、不仰头',\n    '拉到下巴过杆（或胸贴近杆），顶峰夹背停 1 秒',\n    '用 2-3 秒慢放，到手臂接近伸直但保持张力'\n  ],\n  notes:[\n    '<b>先沉肩胛再拉</b>，顺序反了必耸肩，斜方肌上束代偿——这是练背最容易犯的错',\n    '拉的时候想<b>\"肘往地面踩\"</b>，不是\"手往上拽\"，否则全练到肱二头肌',\n    '<b>身体不要前后荡</b>（借力），核心收紧，腿交叉固定，让背阔肌单独干活',\n    '下巴过杆即可，别过度后仰仰头，脖子放松',\n    '下放过程要有控制，猛放会扯伤肩袖'\n  ]},\n\n/* 3 高位下拉 */ { type:'ex', idx:2, id:'lp',\n  name:'高位下拉', en:'Lat Pulldown',\n  target:'背阔肌 · 大圆肌 · 斜方肌中下束',\n  sets:4, reps:'12-15', rest:50,\n  setup:'横杆握外侧（约 1.5 倍肩宽）；重量以最后 2 次仍能沉肩胛、躯干不后仰过度为准。',\n  steps:[\n    '大腿卡紧固定垫，坐稳，脚掌踩实地面',\n    '先沉肩胛，再开始拉',\n    '躯干后仰 10-15 度、挺胸、核心收紧',\n    '肘往斜下方插，拉到横杆至上胸/锁骨，顶峰停 1 秒',\n    '用 2-3 秒慢放回，让背阔肌完全伸展'\n  ],\n  notes:[\n    '<b>先沉肩胛再拉</b>，耸肩会让斜方肌上束代偿、脖子练粗',\n    '后仰别超 20 度，过度后仰变借力、腰椎吃剪切力',\n    '感觉是<b>\"肘往下插\"</b>，不是\"手往下拽\"，否则练到肱二头肌',\n    '回放要控制，猛放会硬扯肩前侧',\n    '全程<b>不耸肩、不仰头</b>，下巴微收'\n  ]},\n\n/* 4 坐姿划船 */ { type:'ex', idx:3, id:'row',\n  name:'坐姿划船', en:'Seated Cable Row',\n  target:'斜方肌中束 · 菱形肌 · 背阔肌 · 后束三角肌',\n  sets:3, reps:'12-15', rest:50,\n  setup:'装宽横杆或 V 柄，握两端；重量以全程躯干不晃为准。',\n  steps:[\n    '脚踏稳踏板，膝盖微屈带弹性，不锁死',\n    '躯干直立微后倾，挺胸，肩胛先下沉',\n    '肘尖朝斜后方，把杆拉向胸骨下缘',\n    '顶峰肩胛夹紧，停 1 秒',\n    '回放主动让肩胛\"打开\"前伸，展开胸椎'\n  ],\n  notes:[\n    '<b>躯干绝不能前后晃</b>，身体一摆力就跑腰和下背',\n    '宽握时<b>肘略高于手腕</b>、肘尖朝斜后，别朝正后夹紧',\n    '<b>这条偏\"背的厚度\"</b>：为不把背练厚，保持中低重量、高次数，不冲大重量；女生尤其别在这条上加片',\n    '全程挺胸，一旦含胸菱形肌就卸力',\n    '手只是钩子，想<b>\"用肘去戳后面的人\"</b>'\n  ]},\n\n/* 5 龙门架直臂下拉 */ { type:'ex', idx:4, id:'sap',\n  name:'龙门架直臂下拉', en:'Straight-Arm Pulldown',\n  target:'背阔肌（下部）· 大圆肌 · 胸大肌下部',\n  sets:3, reps:'12-15', rest:40,\n  setup:'滑轮调至最高，装绳索或直杆，双手抓；重量轻到中，以手臂全程不打弯、不耸肩为准。',\n  steps:[\n    '站距与肩同宽，微屈膝，核心收紧，手臂从头顶略前举',\n    '保持手臂完全伸直，用背阔肌把双手由上往下压到大腿前',\n    '下压到最低点，背阔肌收紧、肋骨下沉，停 1 秒',\n    '用 2-3 秒慢放回，让背阔肌被拉长，手回到头顶附近',\n    '全程肘不弯、肩不耸'\n  ],\n  notes:[\n    '这条的核心是<b>\"手臂伸直\"</b>——一弯肘就变成二头弯举，背阔肌瞬间下班',\n    '<b>不耸肩</b>，肩膀始终往下压，把背阔肌孤立出来',\n    '手只负责\"钩住\"绳索，发力点在腋下到腰侧的背阔肌',\n    '回放别让重量带着手臂甩上去，控制着回',\n    '腰椎别塌，肋骨下沉不外翻'\n  ]},\n\n/* 6 绳索面拉 */ { type:'ex', idx:5, id:'fp',\n  name:'绳索面拉', en:'Face Pull',\n  target:'后束三角肌 · 斜方肌下束 · 冈下肌/小圆肌',\n  sets:3, reps:'12-15', rest:40,\n  setup:'滑轮调至眼/额高度，装绳索；重量以全程站定不动为准，宁轻勿重。',\n  steps:[\n    '双手对握绳头，拇指朝向自己，手臂前伸',\n    '肘与肩同高，把绳索拉向面部',\n    '到末端做外旋：前臂向外打开，拳心转向斜上方，像\"投降\"姿势',\n    '绳头停在太阳穴两侧，顶峰停 1 秒',\n    '用 3 秒慢放回，全程保持肩胛下沉'\n  ],\n  notes:[\n    '<b>腿只负责站稳</b>：不屈膝、不上下起伏、躯干不前后晃',\n    '<b>必须做外旋</b>，只往后拉不打开，后束刺激直接减半',\n    '<b>不耸肩</b>，肩膀始终往下沉，脖子两侧放松',\n    '<b>放最后收尾、保留 2 次余力</b>：别力竭硬做，力竭时必耸肩代偿，反而练到脖子',\n    '做对了感觉<b>肩后侧和肩胛骨下方</b>酸，脖子或手臂酸就是代偿了'\n  ]},\n\n/* 6 哑铃侧平举 */ { type:'ex', idx:6, id:'lat',\n  name:'哑铃侧平举', en:'Dumbbell Lateral Raise',\n  target:'三角肌中束（肩头）· 斜方肌上束（需避免）',\n  sets:3, reps:'15-20', rest:40,\n  setup:'站姿微屈膝，双手持轻哑铃（1-3kg 起步），拇指略朝上；重量以能做 15-20 次、肩不耸为准。',\n  steps:[\n    '双臂微屈自然垂于体侧，掌心相对，核心收紧',\n    '用肩中束把哑铃向两侧平举，想象\"肩膀把胳膊抬起来\"',\n    '举到与肩同高（手肘略低于肩），顶峰停 1 秒',\n    '用 2-3 秒慢放，回到体侧但手不碰腿',\n    '全程肩下沉、不耸肩，靠肩发力不靠甩'\n  ],\n  notes:[\n    '想<b>\"用肩把胳膊抬起来\"</b>，不是用手甩——手只是钩子，肩膀才是发动机',\n    '<b>全程不耸肩</b>，肩膀往下沉，否则练到的就是脖子两侧的上斜方（会变壮、显壮）',\n    '举到<b>肩高就停</b>，别过头顶，过顶斜方上束就进场了',\n    '拇指略朝上（\"倒水\"姿势），减少斜方参与、孤立中束',\n    '<b>轻重量高次数（15-20）</b>：这是\"肩头圆润线条\"的练法，不是\"大块肌肉\"'\n  ]},\n\n/* 7 拉伸 */ { type:'list', title:'拉伸放松', sub:'松开背阔肌与胸前链 · 巩固宽度', ico:'拉',\n  dur:'约 10 分钟', accent:'#4aa8ff', accentBg:'rgba(74,168,255,.13)',\n  tip:'<b>为什么练完要拉伸背阔肌：</b>背阔肌练完会缩短变紧，它一紧就会把肩膀往下、往前带，长期下来又回到圆肩。拉伸背阔肌 + 胸肌，等于把刚练出来的\"宽度\"和\"开肩\"锁住，不让它被拉回去。另外提醒：想腰细，练背日千万别加杠铃/哑铃侧屈——那练的是腰侧（腹外斜肌），会把腰练厚，和\"显腰细\"正好相反。',\n  items:[\n    {n:'背阔肌门框拉伸', d:'单臂上举贴门框，身体向对侧侧移并微前屈', s:'2 × 30 秒/侧'},\n    {n:'胸大肌门框拉伸', d:'小臂贴门框，身体往前跨并轻微外旋', s:'2 × 30 秒/侧'},\n    {n:'胸小肌靠墙拉伸', d:'手放头后，前臂贴墙，身体前移', s:'2 × 30 秒/侧'},\n    {n:'上斜方肌+肩胛提肌拉伸', d:'头侧倾并轻微前屈，手轻搭头顶', s:'2 × 30 秒/侧'},\n    {n:'泡沫轴胸椎伸展', d:'轴在胸椎下方，双手抱头缓慢后仰', s:'约 2 分钟'}\n  ]},\n\n/* 8 完成 */ { type:'done' }\n];\n\n/* 统计总组数 */\nPAGES.forEach(function(p){ if(p.type==='ex') TOTAL_SETS += p.sets; });\n\n/* 按 idx 重排 ex 页：垂直拉优先 → 复合 → 直臂孤立 → 面拉收尾 */\n(function(){\n  var exs = PAGES.filter(function(p){return p.type==='ex';}).sort(function(a,b){return a.idx-b.idx;});\n  var k=0, out=[];\n  PAGES.forEach(function(p){ out.push(p.type==='ex' ? exs[k++] : p); });\n  PAGES = out;\n})();\nvar EX_COUNT = PAGES.filter(function(p){return p.type==='ex';}).length;\nvar DONE_KEY = 'backplan_v1';\n\n/* ============ 动作示意图（SVG 线稿） ============ */\nvar FIG = {\n pu:\n  '<svg viewBox=\"0 0 300 210\" class=\"fig-svg\" role=\"img\" aria-label=\"引体向上机示意\">'\n  +'<defs><marker id=\"b0\" viewBox=\ \" y2=\"188\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"150\" y1=\"62\" x2=\"118\" y2=\"150\" stroke=\"#44566a\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"4 4\"/>'\n  +'<line x1=\"150\" y1=\"62\" x2=\"182\" y2=\"150\" stroke=\"#44566a\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"4 4\"/>'\n  +'<line x1=\"150\" y1=\"62\" x2=\"104\" y2=\"92\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<line x1=\"150\" y1=\"62\" x2=\"196\" y2=\"92\" stroke=\"#00e0a4\" stroke-width=\"4\" stroke-linecap=\"round\"/>'\n  +'<rect x=\"96\" y=\"86\" width=\"16\" height=\"6\" rx=\"2\" fill=\"#1b242f\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<rect x=\"188\" y=\"86\" width=\"16\" height=\"6\" rx=\"2\" fill=\"#1b242f\" stroke=\"#44566a\" stroke-width=\"2\"/>'\n  +'<line x1=\"104\" y1=\"150\" x2=\"104\" y2=\"104\" stroke=\"#ff9f43\" stroke-width=\"2.5\" marker-end=\"url(#b5)\"/>'\n  +'<line x1=\"196\" y1=\"150\" x2=\"196\" y2=\"104\" stroke=\"#ff9f43\" stroke-width=\"2.5\" marker-end=\"url(#b5)\"/>'\n  +'<text x=\"150\" y=\"202\" text-anchor=\"middle\" fill=\"#ff9f43\" font-size=\"11\" font-weight=\"700\">举到肩高 · 不耸肩</text>'\n  +'</svg>'\n};\n\n/* ============ 状态 ============ */\nvar ST = { page:0, sets:{}, list:{}, seen:{} };\ntry{\n  var raw = localStorage.getItem(DONE_KEY);\n  if(raw){ var o=JSON.parse(raw); ST.sets=o.sets||{}; ST.list=o.list||{}; ST.seen=o.seen||{}; }\n}catch(e){}\n\nfunction save(){\n  try{ localStorage.setItem(DONE_KEY, JSON.stringify({sets:ST.sets,list:ST.list,seen:ST.seen})); }catch(e){}\n}\n\n/* ============ 计时器 ============ */\nvar TM = { id:null, endAt:0, remain:45, total:45, running:false };\n\nfunction beep(){\n  try{\n    var C = window.AudioContext||window.webkitAudioContext; if(!C) return;\n    var ctx=new C(), o=ctx.createOscillator(), g=ctx.createGain();\n    o.connect(g); g.connect(ctx.destination);\n    o.frequency.value=880; o.type='sine';\n    g.gain.setValueAtTime(.001,ctx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+.02);\n    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);\n    o.start(ctx.currentTime); o.stop(ctx.currentTime+.5);\n    setTimeout(function(){ try{ctx.close();}catch(e){} },700);\n  }catch(e){}\n}\nfunction tmReset(sec){\n  if(TM.id){ clearInterval(TM.id); TM.id=null; }\n  TM.running=false; TM.total=sec; TM.remain=sec;\n}\nfunction tmStart(){\n  if(TM.running) return;\n  if(TM.remain<=0) TM.remain=TM.total;\n  TM.running=true; TM.endAt=Date.now()+TM.remain*1000;\n  TM.id=setInterval(tmTick,200); paintTimer();\n}\nfunction tmPause(){\n  if(!TM.running) return;\n  if(TM.id){ clearInterval(TM.id); TM.id=null; }\n  TM.running=false; TM.remain=Math.max(0,Math.round((TM.endAt-Date.now())/1000));\n  paintTimer();\n}\nfunction tmTick(){\n  var left=Math.max(0,Math.round((TM.endAt-Date.now())/1000));\n  if(left!==TM.remain){ TM.remain=left; }\n  if(left<=0){\n    if(TM.id){ clearInterval(TM.id); TM.id=null; }\n    TM.running=false; beep();\n    if(navigator.vibrate) try{ navigator.vibrate([180,90,180]); }catch(e){}\n  }\n  paintTimer();\n}\nfunction tmAdj(d){\n  var t=Math.min(60,Math.max(30,TM.total+d));\n  if(TM.running){ TM.total=t; }\n  else { TM.total=t; TM.remain=t; tmReset(t); }\n  paintTimer();\n}\nfunction paintTimer(){\n  var s=document.getElementById('tmSec'); if(!s) return;\n  var btn=document.getElementById('tmPlay');\n  var tot=document.getElementById('tmTotal');\n  s.textContent=TM.remain;\n  s.className='tm-sec'+(TM.running?' run':(TM.remain===0?' fin':''));\n  if(btn) btn.textContent=TM.running?'暂停':'开始';\n  if(btn) btn.className='tm-btn tm-play'+(TM.running?' on':'');\n  if(tot) tot.textContent=TM.total;\n  var ring=document.getElementById('tmRing');\n  if(ring){\n    var pct = TM.total>0 ? (1-TM.remain/TM.total) : 0;\n    ring.style.width=(pct*100)+'%';\n  }\n}\n\n/* ============ 渲染 ============ */\nfunction esc(s){ return s; }\n\nfunction renderCover(){\n  var listHtml = PAGES.map(function(p,i){\n    if(p.type!=='ex') return '';\n    return '<div class=\"ov-item\" data-go=\"'+i+'\">'+\n      '<div class=\"ov-n\">'+p.idx+'</div>'+\n      '<div class=\"ov-name\">'+p.name+'</div>'+\n      '<div class=\"ov-s\">'+p.sets+' × '+p.reps+'</div></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"cover-hero\">'+\n      '<h1>女生综合练背计划</h1>'+\n      '<p>练出背阔肌\"宽度\" · 打造倒三角显腰细<br>不厚背 · 不练粗上斜方 · 手臂只紧致 · 肩头可练圆</p>'+\n    '</div>'+\n    '<div class=\"big-banner\">'+\n      '<div class=\"bb-k\">练背第一铁律 · 每一下都先做到</div>'+\n      '<div class=\"bb-row\">'+\n        '<div class=\"bb-item\"><div class=\"bb-t\">先 <b>沉肩胛</b></div>'+\n          '<div class=\"bb-d\">拉之前先把肩膀往下\"塞\"进裤兜、远离耳朵。耸肩=练脖子（上斜方），背就白练了。</div></div>'+\n        '<div class=\"bb-item\"><div class=\"bb-t\">用 <b>肘</b> 去拉</div>'+\n          '<div class=\"bb-d\">想象\"肘往下后方插\"，手只当钩子。靠肘带动＝背阔肌发力；靠手拽＝手臂代偿变粗。</div></div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"timebar\">'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#ff9f43\">10<small>分钟</small><span>热身</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:38;background:#00e0a4\">38<small>分钟</small><span>主体</span></div>'+\n      '<div class=\"tb-seg\" style=\"flex:10;background:#4aa8ff\">10<small>分钟</small><span>拉伸</span></div>'+\n    '</div>'+\n    '<div class=\"tb-legend\">'+\n      '<span><i style=\"background:#ff9f43\"></i>热身 10</span>'+\n      '<span><i style=\"background:#00e0a4\"></i>主体 38</span>'+\n      '<span><i style=\"background:#4aa8ff\"></i>拉伸 10</span>'+\n      '<span style=\"color:var(--accent);font-weight:700\">合计 约 58 分钟</span>'+\n    '</div>'+\n    '<div class=\"kv\" style=\"margin-top:16px\">'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">主项动作</div><div class=\"kv-v\">6 <small>个</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总组数</div><div class=\"kv-v\">'+TOTAL_SETS+' <small>组</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">每组次数</div><div class=\"kv-v\">12-15 <small>次</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">组间歇</div><div class=\"kv-v\">40-50 <small>秒</small></div></div>'+\n    '</div>'+\n    '<div class=\"card\" style=\"margin-top:14px\">'+\n      '<div class=\"card-hd\"><div class=\"card-ico\" style=\"background:rgba(255,159,67,.13);color:#ff9f43\">!</div>'+\n      '<div class=\"card-t\">先看这 3 条，比动作本身更重要</div></div>'+\n      '<div style=\"font-size:12.5px;line-height:1.75;color:#c4d0dc\">'+\n        '<div style=\"margin-bottom:8px\"><b style=\"color:#ffc78b\">1. 这条计划练的是背阔肌\"宽度\"。</b>背练宽 → 肩膀和背撑开 → 腰在视觉上显细（\"倒三角\"）。所以全程不追求背的厚度，也避开一切耸肩类动作。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>2. 两件事这里都规避了。</b>① <b>不练粗上斜方</b>：每条动作第一句都是\"沉肩、不耸肩\"，耸肩才练脖子；② <b>手臂不练粗</b>：不做二头弯举、手只当钩子，把背阔肌孤立出来。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>3. 肩头的肌肉（三角肌中束）反而要练。</b>它让肩膀有圆润肩线、又不显壮，已加入哑铃侧平举。</div>'+\n        '<div style=\"margin-top:5px;padding-top:9px;border-top:1px solid var(--border)\"><b style=\"color:#ff8fa0\">避开清单：</b>不做杠铃耸肩、不大重量划船（背会变厚）、不做二头弯举、不做负重侧屈（腰会变粗）。</div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"tip\" style=\"margin-top:14px\"><b>动作顺序：</b>热身沉肩激活 → 引体向上机 → 高位下拉 → 坐姿划船 → 龙门架直臂下拉 → 绳索面拉 → 哑铃侧平举 → 拉伸。垂直拉优先、复合在前、面拉收尾别力竭，侧平举练肩头。</div>'+\n    '<div class=\"sec-t\">训练流程（点任意动作可直接跳过去）</div>'+\n    '<div class=\"ov-list\">'+\n      '<div class=\"ov-item\" data-go=\"1\"><div class=\"ov-n\" style=\"background:rgba(255,159,67,.13);color:#ff9f43\">热</div>'+\n        '<div class=\"ov-name\">热身激活</div><div class=\"ov-s\">10 分钟</div></div>'+\n      listHtml+\n      '<div class=\"ov-item\" data-go=\"7\"><div class=\"ov-n\" style=\"background:rgba(74,168,255,.13);color:#4aa8ff\">拉</div>'+\n        '<div class=\"ov-name\">拉伸放松</div><div class=\"ov-s\">10 分钟</div></div>'+\n    '</div>'+\n    '<div class=\"tip\" style=\"margin-top:14px\"><b>频率：</b>综合背日每周 1 次即可，与驼背计划分日搭配（如背日一三、姿势日二五）；坚持 6-8 周背部轮廓才有明显变化。</div>'+\n  '</div>';\n}\n\nfunction renderList(p,pi){\n  var items = p.items.map(function(it,i){\n    var k = pi+'_'+i;\n    var on = !!ST.list[k];\n    return '<div class=\"chk'+(on?' done':'')+'\" data-chk=\"'+k+'\">'+\n      '<div class=\"chk-b\"><svg viewBox=\"0 0 24 24\"><polyline points=\"4,12 10,18 20,6\"/></svg></div>'+\n      '<div class=\"chk-t\"><div class=\"chk-name\">'+it.n+'</div><div class=\"chk-det\">'+it.d+'</div></div>'+\n      '<div class=\"chk-dose\">'+it.s+'</div></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"ex-head\">'+\n      '<div class=\"ex-idx\" style=\"background:'+p.accentBg+';color:'+p.accent+'\">'+p.ico+'</div>'+\n      '<div class=\"ex-title\"><h2>'+p.title+'</h2>'+\n        '<div class=\"ex-en\">'+p.sub+'</div>'+\n        '<div class=\"ex-target\" style=\"color:'+p.accent+'\">'+p.dur+'</div></div>'+\n    '</div>'+\n    '<div class=\"card\"><div style=\"font-size:12.5px;letter-spacing:.8px;color:var(--muted2);font-weight:700;margin-bottom:4px\">逐项完成</div>'+\n      items+'</div>'+\n    '<div class=\"tip\" style=\"border-left-color:'+p.accent+'\">'+p.tip+'</div>'+\n  '</div>';\n}\n\nfunction renderEx(p,pi){\n  var st = ST.sets[p.id] || [];\n  var dots='';\n  for(var i=0;i<p.sets;i++){\n    var on = st.indexOf(i)>-1;\n    dots += '<div class=\"set-dot'+(on?' done':'')+'\" data-set=\"'+i+'\">'+\n      '<div class=\"set-num\">第 '+(i+1)+' 组</div><div class=\"set-reps\">'+p.reps+' 次</div></div>';\n  }\n  var doneN = st.length;\n\n  var steps = p.steps.map(function(s,i){\n    return '<div class=\"step\"><div class=\"step-n\">'+(i+1)+'</div><div class=\"step-t\">'+s+'</div></div>';\n  }).join('');\n\n  var notes = p.notes.map(function(n){\n    return '<div class=\"note\"><span class=\"note-d\">&#9679;</span><span>'+n+'</span></div>';\n  }).join('');\n\n  return '<div class=\"page\">'+\n    '<div class=\"ex-head\">'+\n      '<div class=\"ex-idx\">'+p.idx+'</div>'+\n      '<div class=\"ex-title\"><h2>'+p.name+'</h2>'+\n        '<div class=\"ex-en\">'+p.en+' · 第 '+p.idx+' / '+EX_COUNT+' 个动作</div>'+\n        '<div class=\"ex-target\">目标肌群：'+p.target+'</div></div>'+\n    '</div>'+\n    '<div class=\"specs\">'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.sets+'</div><div class=\"spec-k\">组数</div></div>'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.reps+'</div><div class=\"spec-k\">每组次数</div></div>'+\n      '<div class=\"spec\"><div class=\"spec-v\">'+p.rest+'</div><div class=\"spec-k\">组间歇秒</div></div>'+\n    '</div>'+\n    '<div class=\"ex-fig\">'+FIG[p.id]+'</div>'+\n    '<div class=\"setup\">'+p.setup+'</div>'+\n    '<div class=\"sec-t\">执行步骤</div>'+\n    '<div class=\"steps\">'+steps+'</div>'+\n    '<div class=\"notes\">'+\n      '<div class=\"notes-hd\"><span>&#9888;</span>注意点（每组都要检查）</div>'+notes+\n    '</div>'+\n    '<div class=\"sec-t\">组数打卡 · 完成一组自动开始间歇计时</div>'+\n    '<div class=\"sets-hd\"><div class=\"sets-hd-t\">点击圆圈标记完成</div>'+\n      '<div class=\"sets-cnt\">'+doneN+' / '+p.sets+' 组</div></div>'+\n    '<div class=\"sets\">'+dots+'</div>'+\n    '<div class=\"timer\">'+\n      '<div class=\"tm-main\">'+\n        '<div class=\"tm-disp\"><span class=\"tm-sec\" id=\"tmSec\">'+p.rest+'</span>'+\n          '<span class=\"tm-unit\">秒 / <span id=\"tmTotal\">'+p.rest+'</span> 秒</span></div>'+\n        '<div class=\"tm-hint\" id=\"tmHint\">点上面的组数，计时自动开始</div>'+\n        '<div class=\"progress\" style=\"margin-top:7px\"><div class=\"progress-fill\" id=\"tmRing\" style=\"width:0\"></div></div>'+\n      '</div>'+\n      '<div class=\"tm-ctrls\">'+\n        '<div class=\"tm-row\">'+\n          '<button class=\"tm-btn tm-adj\" id=\"tmMinus\">&#8722;5</button>'+\n          '<button class=\"tm-btn tm-play\" id=\"tmPlay\">开始</button>'+\n          '<button class=\"tm-btn tm-adj\" id=\"tmPlus\">+5</button>'+\n        '</div>'+\n        '<button class=\"tm-btn tm-reset\" id=\"tmReset\">重置</button>'+\n      '</div>'+\n    '</div>'+\n  '</div>';\n}\n\nfunction renderDone(){\n  var done=0; PAGES.forEach(function(p){ if(p.type==='ex') done+=(ST.sets[p.id]||[]).length; });\n  var pct = TOTAL_SETS? Math.round(done/TOTAL_SETS*100):0;\n  return '<div class=\"page\">'+\n    '<div class=\"done-hero\">'+\n      '<div class=\"done-ico\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4,12 10,18 20,5\"/></svg></div>'+\n      '<h2>训练完成</h2><p>今天练了 '+done+' 组，完成度 '+pct+'%</p>'+\n    '</div>'+\n    '<div class=\"done-stat\">'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总组数</div><div class=\"kv-v\">'+done+'<small>/'+TOTAL_SETS+'</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">总时长</div><div class=\"kv-v\">55 <small>分钟</small></div></div>'+\n      '<div class=\"kv-item\"><div class=\"kv-k\">建议频率</div><div class=\"kv-v\">1 <small>次/周</small></div></div>'+\n    '</div>'+\n    '<div class=\"card\">'+\n      '<div class=\"card-hd\"><div class=\"card-ico\">&#9635;</div><div class=\"card-t\">练完必做的 3 件事</div></div>'+\n      '<div style=\"font-size:12.5px;line-height:1.8;color:#c4d0dc\">'+\n        '<div style=\"margin-bottom:8px\"><b>1. 记录发力感。</b>在备忘录记一句\"今天哪个动作感觉到腋下到腰侧酸了\"。背阔肌感觉越强，说明沉肩做得越对、没被斜方肌上束抢活。</div>'+\n        '<div style=\"margin-bottom:8px\"><b>2. 和驼背计划分日练。</b>今天练了宽度，明天或后天再练姿势肌，别连着把后链小肌肉榨干——那正是斜方肌代偿的温床。</div>'+\n        '<div><b>3. 下次拍个侧面视频。</b>手机架胸口高度、距离 2.5-3 米，我可以逐帧帮你检查引体/高位下拉有没有耸肩、躯干晃不晃。</div>'+\n      '</div>'+\n    '</div>'+\n    '<div class=\"tip\"><b>预期时间表：</b>1-2 周背阔肌发力感变清晰；3-4 周背的宽度和\"倒三角\"轮廓开始显现；6-8 周他人能看出变化。<b>若颈后/上斜方肌常酸痛，说明一直在耸肩代偿，优先降重量、先练沉肩。</b></div>'+\n    '<button class=\"nav-btn\" id=\"resetAll\" style=\"width:100%;height:42px;margin-top:14px;background:var(--card);border:1px solid var(--border);color:var(--muted)\">清除打卡记录，重新开始</button>'+\n  '</div>';\n}\n\n/* ============ 主逻辑 ============ */\nvar content=document.getElementById('content');\nvar prevBtn=document.getElementById('prevBtn');\nvar nextBtn=document.getElementById('nextBtn');\nvar dotsBox=document.getElementById('dots');\n\nfunction curEx(){ var p=PAGES[ST.page]; return (p&&p.type==='ex')?p:null; }\n\nfunction paint(){\n  var p=PAGES[ST.page];\n  ST.seen[ST.page]=1; save();\n  content.scrollTop=0;\n\n  if(p.type==='cover'){ content.innerHTML=renderCover(); }\n  else if(p.type==='list'){ content.innerHTML=renderList(p,ST.page); }\n  else if(p.type==='ex'){ tmReset(p.rest); content.innerHTML=renderEx(p,ST.page); }\n  else { content.innerHTML=renderDone(); }\n\n  // 头部\n  var done=0; PAGES.forEach(function(q){ if(q.type==='ex') done+=(ST.sets[q.id]||[]).length; });\n  document.getElementById('progFill').style.width=(TOTAL_SETS?done/TOTAL_SETS*100:0)+'%';\n  if(p.type==='cover'){ document.getElementById('headTitle').textContent='女生综合练背计划'; }\n  else if(p.type==='ex'){ document.getElementById('headTitle').textContent=p.name; }\n  else if(p.type==='list'){ document.getElementById('headTitle').textContent=p.title; }\n  else { document.getElementById('headTitle').textContent='训练完成'; }\n  document.getElementById('headMeta').innerHTML='<b>'+done+'</b> / '+TOTAL_SETS+' 组';\n\n  // 导航\n  prevBtn.disabled = ST.page===0;\n  if(ST.page===PAGES.length-1){ nextBtn.textContent='已完成'; nextBtn.disabled=true; }\n  else { nextBtn.innerHTML='下一页 &#8250;'; nextBtn.disabled=false; }\n\n  // 页码点\n  var dh='';\n  for(var i=0;i<PAGES.length;i++){\n    dh+='<div class=\"dot'+(i===ST.page?' on':(ST.seen[i]?' seen':''))+'\" data-dot=\"'+i+'\"></div>';\n  }\n  dotsBox.innerHTML=dh;\n\n  bind();\n}\n\nfunction bind(){\n  // 跳转\n  var gos=content.querySelectorAll('[data-go]');\n  for(var i=0;i<gos.length;i++){\n    gos[i].addEventListener('click',function(){\n      ST.page=+this.getAttribute('data-go'); paint();\n    });\n  }\n  // 页码点\n  var ds=dotsBox.querySelectorAll('[data-dot]');\n  for(var j=0;j<ds.length;j++){\n    ds[j].addEventListener('click',function(){\n      ST.page=+this.getAttribute('data-dot'); paint();\n    });\n  }\n  // 清单勾选\n  var chks=content.querySelectorAll('[data-chk]');\n  for(var k=0;k<chks.length;k++){\n    chks[k].addEventListener('click',function(){\n      var key=this.getAttribute('data-chk');\n      if(ST.list[key]) delete ST.list[key]; else ST.list[key]=1;\n      save(); paint();\n    });\n  }\n  // 组打卡\n  var p=curEx();\n  if(p){\n    var sd=content.querySelectorAll('[data-set]');\n    for(var m=0;m<sd.length;m++){\n      sd[m].addEventListener('click',function(){\n        var idx=+this.getAttribute('data-set');\n        var arr=ST.sets[p.id]||[];\n        var pos=arr.indexOf(idx);\n        if(pos>-1) arr.splice(pos,1); else arr.push(idx);\n        ST.sets[p.id]=arr; save();\n        if(pos===-1 && arr.length<p.sets){ tmStart(); }\n        paint();\n      });\n    }\n    var b1=document.getElementById('tmPlay');\n    var b2=document.getElementById('tmMinus');\n    var b3=document.getElementById('tmPlus');\n    var b4=document.getElementById('tmReset');\n    if(b1) b1.addEventListener('click',function(){ TM.running?tmPause():tmStart(); });\n    if(b2) b2.addEventListener('click',function(){ tmAdj(-5); });\n    if(b3) b3.addEventListener('click',function(){ tmAdj(5); });\n    if(b4) b4.addEventListener('click',function(){ tmReset(TM.total); paintTimer(); var h=document.getElementById('tmHint'); if(h) h.textContent='已重置为 '+TM.total+' 秒'; });\n  }\n  // 清除\n  var ra=document.getElementById('resetAll');\n  if(ra) ra.addEventListener('click',function(){\n    ST.sets={}; ST.list={}; ST.seen={}; ST.page=0; save(); paint();\n  });\n}\n\nfunction go(d){\n  var t=ST.page+d;\n  if(t<0||t>=PAGES.length) return;\n  ST.page=t; paint();\n}\n\nprevBtn.addEventListener('click',function(){ go(-1); });\nnextBtn.addEventListener('click',function(){ go(1); });\n\ndocument.addEventListener('keydown',function(e){\n  if(e.key==='ArrowLeft'){ go(-1); }\n  else if(e.key==='ArrowRight'){ go(1); }\n});\n\n// 滑动翻页\nvar tx=0,ty=0,tracking=false;\ncontent.addEventListener('touchstart',function(e){\n  if(e.touches.length!==1) return;\n  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tracking=true;\n},{passive:true});\ncontent.addEventListener('touchend',function(e){\n  if(!tracking) return; tracking=false;\n  var t=e.changedTouches[0];\n  var dx=t.clientX-tx, dy=t.clientY-ty;\n  if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6){\n    if(dx<0) go(1); else go(-1);\n  }\n},{passive:true});\n\npaint();\n<\/script>\n</body>\n</html>\n", "练臀训练计划.html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>练臀训练计划</title>\n<style>\n:root{\n  --bg:#0a0e13; --bg2:#111820; --card:#161e27; --card2:#1b242f;\n  --border:#242f3d; --border2:#2e3b4c;\n  --text:#e9eff6; --muted:#8697a8; --muted2:#5f7183;\n  --accent:#00e0a4; --accent2:#00b884;\n  --warn:#ff9f43; --warnbg:rgba(255,159,67,.10);\n  --danger:#ff5f6d; --good:#00e0a4;\n}\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%}\nbody{\n  background:var(--bg); color:var(--text);\n  font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  font-size:15px; line-height:1.6; overflow:hidden;\n  -webkit-font-smoothing:antialiased;\n}\n#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;\n  background:linear-gradient(170deg,#0a0e13 0%,#111a24 100%);position:relative}\n\n/* ===== 顶栏 ===== */\n.topbar{padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}\n.tb-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}\n.tb-title{font-size:16px;font-weight:700;letter-spacing:.3px}\n.tb-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n.tb-meta b{color:var(--accent);font-weight:700}\n.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden}\n.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));\n  border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}\n\n/* ===== 内容区 ===== */\n.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;\n  padding:18px 18px 24px;scroll-behavior:smooth}\n.content::-webkit-scrollbar{width:0}\n.page{animation:pageIn .32s cubic-bezier(.4,0,.2,1)}\n@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n\n/* ===== 通用卡片 ===== */\n.card{background:var(--card);border:1px solid var(--border);border-radius:14px;\n  padding:16px;margin-bottom:14px}\n.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.card-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;\n  font-size:15px;font-weight:700;flex-shrink:0;background:rgba(0,224,164,.13);color:var(--accent)}\n.card-t{font-size:15px;font-weight:700}\n\n.sec-t{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--muted2);\n  text-transform:uppercase;margin:16px 0 9px}\n\n/* ===== 封面 ===== */\n.cover-hero{padding:6px 0 18px;text-align:center}\n.cover-hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;\n  background:linear-gradient(120deg,#fff 20%,var(--accent));-webkit-background-clip:text;\n  -webkit-text-fill-color:transparent;background-clip:text}\n.cover-hero p{font-size:13px;color:var(--muted);line-height:1.7}\n\n.timebar{display:flex;height:44px;border-radius:11px;overflow:hidden;margin-bottom:9px;\n  border:1px solid var(--border)}\n.tb-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;\n  font-size:11px;line-height:1.25;color:#0a0e13;font-weight:700}\n.tb-seg span{font-size:9px;font-weight:600;opacity:.75}\n.tb-legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-bottom:4px;\n  flex-wrap:wra
