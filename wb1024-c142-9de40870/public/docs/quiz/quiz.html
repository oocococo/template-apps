9E21\u3001\u7FFB\u724C\u9E21",tag:"ji",b:'<p>\u9E21\u5206\u4E09\u8DEF\uFF0C\u89C4\u5219\u6700\u7ED5\uFF0C\u4E5F\u662F\u6700\u5BB9\u6613\u7B97\u9519\u7684\u4E00\u7B14\uFF1A</p><ul><li><b>\u672C\u6765\u5C31\u662F\u9E21</b>\uFF1A\u5E7A\u9E21\uFF081\u6761\uFF0C1 \u5206/\u5F20\uFF09\u3001\u4E4C\u9AA8\u9E21\uFF088\u7B52\uFF0C1 \u5206/\u5F20\uFF09\u3002</li><li><b>\u7FFB\u724C\u9E21</b>\uFF1A\u80E1\u724C\u540E\u7FFB\u5F00\u724C\u5899\u9876\u7684\u6307\u793A\u724C\uFF0C<b>\u540C\u82B1\u8272\u6570\u5B57\u52A0\u4E00</b> \u90A3\u5F20\u662F\u9E21\uFF08\u7FFB 5\u4E07 \u2192 6\u4E07\u662F\u9E21\uFF1B\u7FFB 9\u4E07 \u2192 1\u4E07\u662F\u9E21\uFF09\u3002</li><li><b>\u91D1\u9E21</b>\uFF1A\u7FFB\u5230\u7684\u9E21\u724C\u6070\u597D\u662F 1\u6761 \u6216 8\u7B52 \u65F6\u5347\u7EA7\u4E3A\u91D1\u9E21 \u2014\u2014 \u91D1\u5E7A\u9E21 / \u91D1\u4E4C\u9AA8\u9E21\u6BCF\u5F20 2 \u5206\u3002</li></ul><p><b>\u5148\u5206\u6E05\u300C\u53EB\u724C\u5BB6\u300D\u662F\u8C01</b>\uFF1A<b>\u672C\u6B21\u53EB\u724C\uFF08\u542C\u724C\uFF09\u7684\u4EBA \u222A \u80E1\u724C\u7684\u4EBA</b> \u2014\u2014 \u80E1\u724C\u8005\u624B\u724C\u5DF2\u7ECF\u6210\u578B\u3001\u672C\u8EAB\u4E0D\u7B97"\u542C\u724C"\uFF0C\u4F46\u7ED3\u7B97\u91CC\u7167\u6837\u7B97<b>\u53EB\u724C\u5BB6</b>\uFF08\u6309\u81EA\u5DF1\u7684\u9E21\u6570\u5411\u4E09\u5BB6\u5404\u6536\uFF09\u3002\u65E2\u6CA1\u542C\u724C\u4E5F\u6CA1\u80E1\u7684\uFF0C\u5C31\u662F<b>\u672A\u53EB\u5BB6</b>\u3002</p><p><b>\u5F52\u5C5E\uFF08\u5173\u952E\uFF09</b>\uFF1A\u53EA\u6709<b>\u53EB\u724C\u5BB6</b>\u624B\u91CC\u7684\u9E21\u624D\u7B97\u5206\uFF1B\u672A\u53EB\u5BB6<b>\u6253\u51FA\u53BB\u7684</b>\u3001<b>\u6760\uFF08\u526F\u9732\uFF09\u4EAE\u51FA\u6765\u7684</b>\u5E7A\u9E21 / 8\u7B52\uFF0C\u90FD<b>\u7B97\u7ED9\u53EB\u724C\u5BB6</b>\uFF1B\u672A\u53EB\u5BB6<b>\u624B\u91CC\u7559\u7740\u3001\u6CA1\u6253\u4E5F\u6CA1\u6760</b>\u7684\u9E21\uFF0C\u4E00\u5206\u4E0D\u7B97\u3002</p><p class="tiny">\u51B2\u950B\u9E21\u3001\u8D23\u4EFB\u9E21\u3001\u5305\u9E21\u662F\u9E21\u91CC\u6700\u7E
