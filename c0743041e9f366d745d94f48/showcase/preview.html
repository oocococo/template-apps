<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的书签 · 网站收藏夹</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2533; --muted:#6b7385;
    --line:#e7eaf3; --accent:#4f6ef7; --accent-soft:#eef2ff;
    --danger:#e5484d; --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:18px 18px 60px}

  /* Header */
  header{
    position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#fff,rgba(255,255,255,.92));
    backdrop-filter:blur(8px); padding:14px 0 12px; margin-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .head-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px}
  .logo .mark{
    width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#4f6ef7,#8a5cf6);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:var(--shadow);
  }
  .grow{flex:1}
  .search{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; padding:9px 13px; min-width:220px; flex:1 1 260px; box-shadow:var(--shadow);
  }
  .search input{border:0; outline:0; flex:1; font-size:15px; background:transparent; color:var(--ink)}
  .search svg{flex:none; color:var(--muted)}

  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:11px;
    padding:9px 14px; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:.15s; white-space:nowrap; box-shadow:var(--shadow);
  }
  .btn:hover{border-color:#cdd6ec; transform:translateY(-1px)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:#3f5cf0}
  .btn.danger{color:var(--danger); border-color:#f3c9cb}
  .btn.icon{padding:9px 11px}

  /* Toolbar */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:14px 0 4px}
  .select{
    border:1px solid var(--line); background:var(--panel); border-radius:11px; padding:8px 11px;
    font-size:14px; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
  }
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:11px; overflow:hidden; box-shadow:var(--shadow)}
  .seg button{border:0; background:transparent; padding:8px 12px; cursor:pointer; color:var(--muted); font-size:14px; display:flex; align-items:center}
  .seg button.on{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .meta{color:var(--muted); font-size:13px; margin-left:auto}

  /* Quick access */
  .quick{display:flex; gap:10px; overflow-x:auto; padding:10px 2px 4px; margin-top:6px}
  .quick::-webkit-scrollbar{height:6px}
  .quick::-webkit-scrollbar-thumb{background:#d7def0; border-radius:6px}
  .chip{
    flex:none; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:6px 13px 6px 7px; cursor:pointer; font-size:13px; box-shadow:var(--shadow); transition:.15s;
  }
  .chip:hover{border-color:#cdd6ec; transform:translateY(-1px)}
  .chip .fav,.chip .letter{width:22px; height:22px; border-radius:50%; flex:none}
  .chip.hide{display:none}

  /* Group + cards */
  .group-title{display:flex; align-items:center; gap:9px; margin:22px 2px 12px; font-weight:700; font-size:15px}
  .group-title .count{background:var(--accent-soft); color:var(--accent); font-size:12px; padding:1px 9px; border-radius:999px; font-weight:600}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:14px}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:11px; position:relative; transition:.15s;
  }
  .card:hover{border-color:#cdd6ec; transform:translateY(-2px); box-shadow:0 10px 30px rgba(20,30,60,.1)}
  .card .top{display:flex; align-items:center; gap:12px}
  .icon{width:42px; height:42px; border-radius:11px; flex:none; overflow:hidden; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent); font-size:18px}
  .icon .fav{width:100%; height:100%; object-fit:cover; display:none}
  .icon.loaded .fav{display:block}
  .icon.loaded .letter{display:none}
  .card .name{font-weight:650; font-size:15px; word-break:break-word}
  .card .url{color:var(--muted); font-size:12.5px; word-break:break-all}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tag{background:var(--accent-soft); color:var(--accent); font-size:11.5px; padding:2px 9px; border-radius:999px; cursor:pointer; border:0}
  .card .acts{display:flex; gap:8px; margin-top:2px; opacity:0; transition:.15s}
  .card:hover .acts{opacity:1}
  .mini{border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 9px; font-size:12.5px; cursor:pointer; color:var(--muted)}
  .mini:hover{border-color:#cdd6ec; color:var(--ink)}
  .mini.del:hover{color:var(--danger); border-color:#f3c9cb}
  .open{position:absolute; inset:0; cursor:pointer; z-index:0}
  .card .top,.card .url,.card .tags,.card .acts{position:relative; z-index:1}
  .clicks{font-size:11px; color:var(--muted)}

  /* List view */
  .list .grid{grid-template-columns:1fr; gap:8px}
  .list .card{flex-direction:row; align-items:center; padding:11px 14px}
  .list .card .body{flex:1; min-width:0}
  .list .card .name{font-size:14.5px}
  .list .card .tags{margin-top:3px}
  .list .card .acts{opacity:1; margin-top:0}
  .list .card .top{gap:12px}

  /* Empty */
  .empty{text-align:center; padding:60px 20px; color:var(--muted)}
  .empty .big{font-size:46px; margin-bottom:10px}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(20,28,50,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:18px}
  .overlay.show{display:flex}
  .modal{background:#fff; border-radius:18px; width:100%; max-width:480px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:92vh; overflow:auto}
  .modal h3{margin:0 0 4px; font-size:18px}
  .modal .sub{color:var(--muted); font-size:13px; margin-bottom:16px}
  .field{margin-bottom:13px}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px;
    outline:0; font-family:inherit; color:var(--ink); background:#fff;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field .hint{font-size:12px; color:var(--muted); margin-top:4px}
  .preview{display:flex; align-items:center; gap:10px; margin-top:6px; font-size:12.5px; color:var(--muted)}
  .modal-acts{display:flex; gap:10px; justify-content:flex-end; margin-top:8px}

  /* Menu */
  .menu-wrap{position:relative}
  .menu{position:absolute; right:0; top:46px; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:6px; min-width:170px; display:none; z-index:40}
  .menu.show{display:block}
  .menu button{display:block; width:100%; text-align:left; border:0; background:transparent; padding:9px 11px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--ink)}
  .menu button:hover{background:var(--accent-soft); color:var(--accent)}
  .menu .sep{border-top:1px solid var(--line); margin:5px 0}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#1f2533; color:#fff;
    padding:11px 18px; border-radius:11px; font-size:14px; opacity:0; transition:.25s; z-index:80; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .wrap{padding:12px 12px 50px}
    .grid{grid-template-columns:1fr 1fr}
    .logo span.txt{display:none}
    .search{order:3; flex-basis:100%}
    .card .acts{opacity:1}
    .meta{width:100%; margin:6px 0 0}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="head-row">
      <div class="logo"><span class="mark">🔖</span><span class="txt">我的书签</span></div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="搜索名称、网址、标签…" autocomplete="off">
      </div>
      <button class="btn primary" id="addBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        添加
      </button>
      <div class="menu-wrap">
        <button class="btn icon" id="menuBtn" title="更多">⋯</button>
        <div class="menu" id="menu">
          <button id="exportBtn">导出备份 (JSON)</button>
          <button id="importBtn">导入备份</button>
          <div class="sep"></div>
          <button id="clearBtn" style="color:var(--danger)">清空全部</button>
        </div>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </div>
</header>

<div class="wrap">
  <div style="padding:8px 0;color:#6b7385;font-size:13px">示例体验，数据仅保留在本页 <button type="button" id="resetDemo">恢复示例</button></div>
  <div class="quick" id="quick"></div>

  <div class="toolbar">
    <select class="select" id="groupBy">
      <option value="none">不分组</option>
      <option value="category">按分类</option>
      <option value="tags">按标签</option>
    </select>
    <select class="select" id="catFilter">
      <option value="">全部分类</option>
    </select>
    <select class="select" id="sortBy">
      <option value="recent">最近添加</option>
      <option value="name">名称 A→Z</option>
      <option value="visits">常用优先</option>
    </select>
    <div class="seg" id="viewSeg">
      <button data-view="card" class="on" title="卡片视图">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button data-view="list" title="列表视图">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
    </div>
    <span class="meta" id="meta"></span>
  </div>

  <div id="content"></div>
</div>

<!-- Add / Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">添加书签</h3>
    <div class="sub">示例数据仅保留在本页，安装后保存在应用数据库。</div>
    <form id="form">
      <input type="hidden" id="fId">
      <div class="field">
        <label>网站名称 *</label>
        <input id="fName" required placeholder="例如：示例网站">
      </div>
      <div class="field">
        <label>网址 *</label>
        <input id="fUrl" required placeholder="https://example.com" inputmode="url">
        <div class="hint">支持 http/https，留空协议会自动补全 https://</div>
      </div>
      <div class="field">
        <label>分类</label>
        <input id="fCat" list="catList" placeholder="例如：工作 / 学习 / 工具">
        <datalist id="catList"></datalist>
      </div>
      <div class="field">
        <label>标签</label>
        <input id="fTags" placeholder="用逗号分隔，例如：AI, 效率, 常用">
      </div>
      <div class="preview" id="fPreview"></div>
      <div class="modal-acts">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="button" id="demoSave" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const KEY="wb_bookmarks_v1", SET="wb_bookmarks_settings_v1";
  const $ = s => document.querySelector(s);

  const demoData = [{id:"demo1",name:"示例网站",url:"https://example.com",category:"学习",tags:["常用"],createdAt:1,visits:0},{id:"demo2",name:"参考资料",url:"https://example.org",category:"工作",tags:["工具"],createdAt:2,visits:0}];
  let bookmarks = structuredClone(demoData);
  let settings = Object.assign({view:"card", groupBy:"none", sortBy:"recent", catFilter:""}, loadSettings());

  function load(){ try{ return JSON.parse(null)||[] }catch(e){ return [] } }
  function save(){ void 0 }
  function loadSettings(){ try{ return JSON.parse(null)||{} }catch(e){ return {} } }
  function saveSettings(){ void 0 }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }
  function normUrl(u){
    u=(u||"").trim();
    if(!u) return u;
    if(!/^https?:\/\//i.test(u)) u="https://"+u;
    return u;
  }
  function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,"") }catch(e){ return "" } }
  function favicon(){ return "" }
  function initial(name){ return (name||"?").trim().charAt(0).toUpperCase() }

  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800);
  }

  // ---- Icon element builder ----
  function iconEl(bm, size){
    const h=hostOf(bm.url);
    const wrap=document.createElement("div");
    wrap.className="icon"+(size?(" s"+size):"");
    const img=document.createElement("img");
    img.className="fav"; img.alt=""; img.loading="lazy";
    img.onload=()=>wrap.classList.add("loaded");
    img.onerror=()=>{ img.style.display="none"; };
    
    const letter=document.createElement("span");
    letter.className="letter"; letter.textContent=initial(bm.name);
    wrap.appendChild(img); wrap.appendChild(letter);
    return wrap;
  }

  // ---- Filtering & sorting ----
  function getFiltered(){
    const q=$("#search").value.trim().toLowerCase();
    const cf=settings.catFilter;
    let list=bookmarks.filter(b=>{
      if(cf && (b.category||"")!==cf) return false;
      if(!q) return true;
      const hay=(b.name+" "+(b.url||"")+" "+(b.category||"")+" "+((b.tags||[]).join(" "))).toLowerCase();
      return hay.includes(q);
    });
    const s=settings.sortBy;
    list.sort((a,b)=>{
      if(s==="name") return a.name.localeCompare(b.name,"zh");
      if(s==="visits") return (b.visits||0)-(a.visits||0);
      return (b.createdAt||0)-(a.createdAt||0);
    });
    return list;
  }

  function groupMap(list){
    const g=settings.groupBy;
    if(g==="none") return [["全部", list]];
    const map=new Map();
    list.forEach(b=>{
      if(g==="category"){ const k=b.category||"未分类"; push(map,k,b); }
      else if(g==="tags"){ const ts=b.tags&&b.tags.length?b.tags:["未标签"]; ts.forEach(t=>push(map,t,b)); }
    });
    function push(m,k,v){ if(!m.has(k))m.set(k,[]); m.get(k).push(v); }
    const entries=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],"zh"));
    return entries.length?entries:[["全部",list]];
  }

  // ---- Render ----
  function render(){
    const content=$("#content");
    const list=getFiltered();
    content.className = settings.view==="list" ? "list" : "";
    $("#meta").textContent = list.length? `${list.length} 个书签` : "";
    updateCatFilter();

    if(!bookmarks.length){
      content.innerHTML=`<div class="empty"><div class="big">🔖</div><div>还没有书签</div><div style="margin-top:6px">点击右上角「添加」收藏第一个网站</div></div>`;
      renderQuick(); return;
    }
    if(!list.length){
      content.innerHTML=`<div class="empty"><div class="big">🔍</div><div>没有匹配的书签</div></div>`;
      renderQuick(); return;
    }

    const groups=groupMap(list);
    const frag=document.createDocumentFragment();
    groups.forEach(([title,items])=>{
      if(settings.groupBy!=="none"){
        const h=document.createElement("div");
        h.className="group-title";
        h.innerHTML=`<span>${escapeHtml(title)}</span><span class="count">${items.length}</span>`;
        frag.appendChild(h);
      }
      const grid=document.createElement("div"); grid.className="grid";
      items.forEach(b=>grid.appendChild(cardEl(b)));
      frag.appendChild(grid);
    });
    content.innerHTML=""; content.appendChild(frag);
    renderQuick();
  }

  function cardEl(b){
    const card=document.createElement("div"); card.className="card";
    const open=document.createElement("a"); open.className="open"; open.href=b.url; open.target="_blank"; open.rel="noopener noreferrer";
    open.onclick=()=>incVisits(b.id);
    card.appendChild(open);

    const top=document.createElement("div"); top.className="top";
    top.appendChild(iconEl(b));
    const info=document.createElement("div"); info.style.minWidth="0"; info.style.flex="1";
    const name=document.createElement("div"); name.className="name"; name.textContent=b.name;
    const url=document.createElement("div"); url.className="url"; url.textContent=hostOf(b.url)||b.url;
    info.appendChild(name); info.appendChild(url);
    top.appendChild(info);
    card.appendChild(top);

    if(b.tags&&b.tags.length){
      const tags=document.createElement("div"); tags.className="tags";
      b.tags.forEach(t=>{
        const btn=document.createElement("button"); btn.className="tag"; btn.textContent=t;
        btn.onclick=(e)=>{ e.stopPropagation(); $("#search").value=t; render(); };
        tags.appendChild(btn);
      });
      card.appendChild(tags);
    }

    const acts=document.createElement("div"); acts.className="acts";
    const edit=document.createElement("button"); edit.className="mini"; edit.textContent="编辑";
    edit.onclick=(e)=>{ e.stopPropagation(); openModal(b); };
    const del=document.createElement("button"); del.className="mini del"; del.textContent="删除";
    del.onclick=(e)=>{ e.stopPropagation(); removeBm(b.id); };
    acts.appendChild(edit); acts.appendChild(del);
    card.appendChild(acts);
    return card;
  }

  function renderQuick(){
    const q=$("#quick");
    const top=[...bookmarks].filter(b=>b.visits>0).sort((a,b)=>b.visits-a.visits).slice(0,8);
    if(!top.length){ q.innerHTML=""; q.style.display="none"; return; }
    q.style.display="flex"; q.innerHTML="";
    top.forEach(b=>{
      const chip=document.createElement("a"); chip.className="chip"; chip.href=b.url; chip.target="_blank"; chip.rel="noopener";
      chip.title=b.name+" · 访问 "+(b.visits||0)+" 次";
      chip.onclick=()=>incVisits(b.id);
      const h=hostOf(b.url);
      const ic=document.createElement("div"); ic.className="icon"; ic.style.width="22px"; ic.style.height="22px"; ic.style.fontSize="11px"; ic.style.borderRadius="50%";
      const img=document.createElement("img"); img.className="fav"; img.style.width="100%"; img.style.height="100%"; img.style.borderRadius="50%";
      img.onload=()=>ic.classList.add("loaded"); img.onerror=()=>img.style.display="none";
      
      const letter=document.createElement("span"); letter.className="letter"; letter.textContent=initial(b.name);
      ic.appendChild(img); ic.appendChild(letter);
      const label=document.createElement("span"); label.textContent=b.name;
      chip.appendChild(ic); chip.appendChild(label);
      q.appendChild(chip);
    });
  }

  function incVisits(id){
    const b=bookmarks.find(x=>x.id===id); if(!b) return;
    b.visits=(b.visits||0)+1; save();
  }

  function updateCatFilter(){
    const sel=$("#catFilter"); const cur=settings.catFilter;
    const cats=[...new Set(bookmarks.map(b=>b.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh"));
    sel.innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    sel.value=cur;
    $("#catList").innerHTML=cats.map(c=>`<option value="${escapeHtml(c)}">`).join("");
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

  // ---- CRUD ----
  function openModal(bm){
    $("#modalTitle").textContent = bm? "编辑书签" : "添加书签";
    $("#fId").value = bm? bm.id : "";
    $("#fName").value = bm? bm.name : "";
    $("#fUrl").value = bm? bm.url : "";
    $("#fCat").value = bm? (bm.category||"") : "";
    $("#fTags").value = bm? (bm.tags||[]).join(", ") : "";
    updatePreview();
    $("#overlay").classList.add("show");
    setTimeout(()=>$("#fName").focus(),50);
  }
  function closeModal(){ $("#overlay").classList.remove("show") }

  function updatePreview(){
    const name=$("#fName").value.trim()||"预览";
    const url=normUrl($("#fUrl").value);
    $("#fPreview").innerHTML="";
    if(!url){ $("#fPreview").textContent=""; return; }
    $("#fPreview").appendChild(iconEl({name,url}));
    const span=document.createElement("span"); span.textContent=hostOf(url);
    $("#fPreview").appendChild(span);
  }

  function submitForm(e){
    e.preventDefault();
    const id=$("#fId").value;
    const name=$("#fName").value.trim();
    const url=normUrl($("#fUrl").value.trim());
    const category=$("#fCat").value.trim();
    const tags=$("#fTags").value.split(",").map(t=>t.trim()).filter(Boolean);
    if(!name||!url){ toast("请填写名称和网址"); return; }
    if(id){
      const b=bookmarks.find(x=>x.id===id);
      Object.assign(b,{name,url,category,tags});
      toast("已更新");
    } else {
      bookmarks.push({id:uid(),name,url,category,tags,createdAt:Date.now(),visits:0});
      toast("已添加");
    }
    save(); closeModal(); render();
  }

  function removeBm(id){
    const b=bookmarks.find(x=>x.id===id); if(!b) return;
    
    bookmarks=bookmarks.filter(x=>x.id!==id); save(); render(); toast("已删除");
  }

  // ---- Export / Import ----
  function exportData(){
    const blob=new Blob([JSON.stringify(bookmarks,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="bookmarks-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    URL.revokeObjectURL(a.href); toast("已导出备份");
  }
  function importData(file){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!Array.isArray(data)) throw 0;
        let added=0;
        data.forEach(d=>{
          if(d&&d.name&&d.url){
            bookmarks.push({id:uid(),name:String(d.name),url:normUrl(String(d.url)),
              category:d.category?String(d.category):"",tags:Array.isArray(d.tags)?d.tags.map(String):[],
              createdAt:d.createdAt||Date.now(),visits:d.visits||0}); added++;
          }
        });
        save(); render(); toast(`已导入 ${added} 个书签`);
      }catch(e){ toast("导入失败：文件格式不正确"); }
    };
    r.readAsText(file);
  }

  // ---- Events ----
  $("#addBtn").onclick=()=>openModal(null);
  $("#cancelBtn").onclick=closeModal;
  $("#overlay").onclick=e=>{ if(e.target===$("#overlay")) closeModal(); };
  $("#form").onsubmit=submitForm;
  $("#demoSave").onclick=submitForm;
  $("#resetDemo").onclick=()=>{bookmarks=structuredClone(demoData);settings={view:"card",groupBy:"none",sortBy:"recent",catFilter:""};$("#search").value="";$("#groupBy").value="none";$("#sortBy").value="recent";[...$("#viewSeg").children].forEach(x=>x.classList.toggle("on",x.dataset.view==="card"));$("#menu").classList.remove("show");closeModal();render();toast("已恢复示例");};
  $("#fName").oninput=updatePreview; $("#fUrl").oninput=updatePreview;
  $("#search").oninput=render;

  $("#groupBy").onchange=e=>{ settings.groupBy=e.target.value; saveSettings(); render(); };
  $("#sortBy").onchange=e=>{ settings.sortBy=e.target.value; saveSettings(); render(); };
  $("#catFilter").onchange=e=>{ settings.catFilter=e.target.value; saveSettings(); render(); };

  $("#viewSeg").onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    settings.view=b.dataset.view; saveSettings();
    [...$("#viewSeg").children].forEach(x=>x.classList.toggle("on",x===b));
    render();
  };

  // menu
  $("#menuBtn").onclick=e=>{ e.stopPropagation(); $("#menu").classList.toggle("show"); };
  document.onclick=e=>{ if(!e.target.closest(".menu-wrap")) $("#menu").classList.remove("show"); };
  $("#exportBtn").onclick=()=>{ $("#menu").classList.remove("show"); toast("安装后可导出备份"); };
  $("#importBtn").onclick=()=>{ $("#menu").classList.remove("show"); $("#importFile").click(); };
  $("#importFile").onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
  $("#clearBtn").onclick=()=>{ toast("请使用恢复示例重置数据"); return;
    $("#menu").classList.remove("show");
    if(!bookmarks.length){ toast("书签已是空的"); return; }
    if(confirm("确定清空全部书签？此操作不可恢复（建议先导出备份）。")){
      bookmarks=[]; save(); render(); toast("已清空");
    }
  };

  // keyboard: Esc closes, "/" focuses search
  document.onkeydown=e=>{
    if(e.key==="Escape") closeModal();
    if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){ e.preventDefault(); $("#search").focus(); }
  };

  // init
  render();
})();
</script>
</body>
</html>
