<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>秋日暮色老街 · Old Street</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#161a28;}
  canvas{display:block;}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 46%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 46%, rgba(128,122,132,1) 80%, rgba(38,36,48,1) 100%);}
  #tint{position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(circle at 32% 60%, rgba(255,150,80,.08), rgba(0,0,0,0) 60%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(230,190,150,.35);
          background:rgba(18,14,10,.55);color:#eed9be;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(230,190,150,.7);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(230,190,150,.35);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#eed9be;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#eed9be;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="虫鸣 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="55"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   秋日暮色 · 日式乡间老街街角  (three.js r128 / 完全离线)
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const JP = '"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Microsoft YaHei",sans-serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x232c4a, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x232c4a);
scene.fog = new T.Fog(0x232c4a, 30, 90);

const camera = new T.PerspectiveCamera(32, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(0, 1.2, -0.4), r:22.5, theta:0.72, phi:1.05,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.36,0.56,0.74,0.89,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM = new T.MeshBasicMaterial({color:0x1c1410, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x2e2114, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity = (o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.alphaTest) p.alphaTest=o.alphaTest;
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.055) return null;
  const k = t===undefined?0.016:t;
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function SP(pa, r, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.SphereGeometry(r, 14, 11), m);
  mesh.position.set(x,y,z);
  if(o.sy) mesh.scale.y = o.sy;
  (pa||scene).add(mesh);
  if(o.ol!==0) addOL(mesh, o.olt, o.warm);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}
/* 径向光晕 / 接触阴影 / 树影光斑 */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.72)'); g.addColorStop(0.55,'rgba(0,0,0,0.30)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
const DAPPLE_TEX = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.clearRect(0,0,256,256);
  for(let i=0;i<26;i++){
    const cx=Math.random()*256, cy=Math.random()*256, r=R(8,34);
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,0.5)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,6.2832); x.fill();
  }
  return TX(c);
})();
function pool(x, y, z, w, d, color, op, ry){
  const m = MB(color, {transparent:true, map:RAD_TEX, blending:T.AdditiveBlending, opacity:op, depthWrite:false});
  const p = PL(root, w, d, m, x, y, z, {rx:-Math.PI/2});
  if(ry) p.rotation.z = ry;
  return p;
}
function shadowBlob(x, y, z, w, d, op){
  const m = MB(0x000000, {transparent:true, map:SHADOW_TEX, opacity:op===undefined?0.5:op, depthWrite:false});
  return PL(root, w, d, m, x, y, z, {rx:-Math.PI/2});
}
function glowSprite(x,y,z, size, color, op){
  const s = new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:color, blending:T.AdditiveBlending, opacity:op, transparent:true, depthWrite:false}));
  s.position.set(x,y,z); s.scale.set(size, size, 1); root.add(s); return s;
}
/* ============================================================
   秋日地表贴图
   ============================================================ */
/* 石板路（不规则石板 + 苔缝 + 落叶） */
const STONE = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#6b6752'; x.fillRect(0,0,512,512);
  // 苔藓缝
  for(let i=0;i<40;i++){
    x.fillStyle='rgba(96,110,64,'+R(0.2,0.5).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(6,20), R(3,10), Math.random()*3, 0, 6.2832); x.fill();
  }
  const pal=['#a89e8c','#9d937f','#948a78','#ada492','#8f8674','#a39a88'];
  const n=6, cw=512/n;
  for(let gy=0;gy<n;gy++) for(let gx=0;gx<n;gx++){
    const jx=R(-7,7), jy=R(-7,7), pad=R(3,6);
    x.fillStyle=pal[(Math.random()*pal.length)|0];
    rr(x, gx*cw+pad+jx, gy*cw+pad+jy, cw-pad*2+R(-6,6), cw-pad*2+R(-6,6), R(8,22)); x.fill();
    x.fillStyle='rgba(255,250,235,'+R(0.05,0.14).toFixed(2)+')';
    rr(x, gx*cw+pad+jx+4, gy*cw+pad+jy+4, (cw-pad*2)*0.5, (cw-pad*2)*0.4, R(6,16)); x.fill();
  }
  speckle(x,512,512,1600,1.8,0.09);
  // 散落枯叶
  for(let i=0;i<26;i++){
    x.fillStyle=['rgba(200,132,62,0.85)','rgba(178,100,44,0.85)','rgba(214,158,72,0.8)'][(Math.random()*3)|0];
    x.save(); x.translate(Math.random()*512, Math.random()*512); x.rotate(Math.random()*6.28);
    x.beginPath(); x.ellipse(0,0,R(3,6),R(2,4),0,0,6.2832); x.fill(); x.restore();
  }
  return c;
})();
const STONE_T1 = TX(STONE, 4.6, 0.8);   // 主街
const STONE_T2 = TX(STONE, 0.8, 1.6);   // 小径

/* 碎石路 */
const GRAVEL = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#847a68'; x.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){
    const g=70+Math.random()*60;
    x.fillStyle='rgba('+g.toFixed(0)+','+(g-6).toFixed(0)+','+(g-18).toFixed(0)+',0.85)';
    x.beginPath(); x.arc(Math.random()*256, Math.random()*256, R(1,3.4), 0, 6.2832); x.fill();
  }
  speckle(x,256,256,600,1.6,0.1);
  for(let i=0;i<10;i++){
    x.fillStyle='rgba(190,132,60,0.75)';
    x.save(); x.translate(Math.random()*256, Math.random()*256); x.rotate(Math.random()*6.28);
    x.beginPath(); x.ellipse(0,0,R(3,5),R(2,3),0,0,6.2832); x.fill(); x.restore();
  }
  return TX(c, 1.3, 4.6);
})();
/* 秋日浅草地 */
const GRASS = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#6e7a42'; x.fillRect(0,0,512,512);
  for(let i=0;i<130;i++){
    x.fillStyle=['rgba(126,138,74,0.5)','rgba(150,148,88,0.42)','rgba(92,104,54,0.5)','rgba(168,150,92,0.3)'][(Math.random()*4)|0];
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(24,90), R(16,60), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,2600,2.0,0.09);
  for(let i=0;i<44;i++){
    x.fillStyle=['rgba(200,132,62,0.8)','rgba(178,100,44,0.8)','rgba(214,158,72,0.72)'][(Math.random()*3)|0];
    x.save(); x.translate(Math.random()*512, Math.random()*512); x.rotate(Math.random()*6.28);
    x.beginPath(); x.ellipse(0,0,R(2.6,5),R(1.8,3.4),0,0,6.2832); x.fill(); x.restore();
  }
  return c;
})();
const GRASS_T = TX(GRASS, 3, 3);
const GRASS_T2 = TX(GRASS, 1.6, 1.6);
/* 泥土小径 */
const DIRT = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#94825e'; x.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){
    x.fillStyle='rgba(' + R(120,165).toFixed(0) + ',' + R(105,140).toFixed(0) + ',' + R(70,100).toFixed(0) + ',0.5)';
    x.beginPath(); x.ellipse(Math.random()*256, Math.random()*256, R(10,44), R(8,30), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,256,256,1400,1.8,0.12);
  return TX(c, 0.5, 1.9);
})();
/* 深色老木板（民居墙板） */
const WOOD_D = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#4d3c2c'; x.fillRect(0,0,256,256);
  for(let p=0;p<4;p++){
    const px=p*64;
    x.fillStyle=['#52402f','#483727','#554333','#4a3929'][p];
    x.fillRect(px+2,0,60,256);
    x.strokeStyle='rgba(28,20,12,0.8)'; x.lineWidth=3;
    x.beginPath(); x.moveTo(px+1,0); x.lineTo(px+1,256); x.stroke();
    x.strokeStyle='rgba(30,22,14,0.35)'; x.lineWidth=2;
    for(let i=0;i<6;i++){
      const gy=Math.random()*256;
      x.beginPath(); x.moveTo(px+6,gy); x.bezierCurveTo(px+22,gy+R(-14,14), px+40,gy+R(-14,14), px+58,gy+R(-10,10)); x.stroke();
    }
    // 木节
    if(Math.random()>0.4){
      const kx=px+R(14,50), ky=Math.random()*256;
      x.strokeStyle='rgba(26,18,10,0.6)';
      x.beginPath(); x.ellipse(kx,ky,4,6,0.4,0,6.2832); x.stroke();
    }
  }
  return c;
})();
const WOOD_T = TX(WOOD_D, 2, 1);
/* 浅色廊台木板 */
const WOOD_L = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#8a6a48'; x.fillRect(0,0,256,256);
  for(let p=0;p<4;p++){
    const px=p*64;
    x.fillStyle=['#93714d','#86663f','#9a7852','#8d6c46'][p];
    x.fillRect(px+2,0,60,256);
    x.strokeStyle='rgba(56,40,24,0.7)'; x.lineWidth=3;
    x.beginPath(); x.moveTo(px+1,0); x.lineTo(px+1,256); x.stroke();
    x.strokeStyle='rgba(60,44,26,0.28)'; x.lineWidth=2;
    for(let i=0;i<5;i++){
      const gy=Math.random()*256;
      x.beginPath(); x.moveTo(px+6,gy); x.bezierCurveTo(px+24,gy+R(-12,12), px+42,gy+R(-12,12), px+58,gy+R(-8,8)); x.stroke();
    }
  }
  return TX(c, 1, 2);
})();
/* 斑驳老墙（灰泥） */
const PLASTER = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#d8cdb8'; x.fillRect(0,0,256,256);
  for(let i=0;i<60;i++){
    x.fillStyle='rgba('+R(120,160).toFixed(0)+','+R(110,145).toFixed(0)+','+R(88,118).toFixed(0)+','+R(0.06,0.2).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*256, Math.random()*256, R(10,60), R(8,44), Math.random()*3, 0, 6.2832); x.fill();
  }
  // 底部潮渍
  const g=x.createLinearGradient(0,180,0,256);
  g.addColorStop(0,'rgba(96,100,72,0)'); g.addColorStop(1,'rgba(96,100,72,0.45)');
  x.fillStyle=g; x.fillRect(0,180,256,76);
  // 裂纹
  x.strokeStyle='rgba(90,84,66,0.5)'; x.lineWidth=1.6;
  for(let i=0;i<5;i++){
    let cx=Math.random()*256, cy=Math.random()*120;
    x.beginPath(); x.moveTo(cx,cy);
    for(let s=0;s<5;s++){ cx+=R(-18,18); cy+=R(10,30); x.lineTo(cx,cy); }
    x.stroke();
  }

   ============================================================ */
const FLOOR_Y = 0.2, WALL_TOP = 2.7;

function gableRoof(pa, cx, cz, w, d, h, ov, y){
  const hx = w/2 + ov, dz = d + 2*ov;
  const L = Math.sqrt(hx*hx + h*h), ang = Math.atan2(h, hx);
  [-1,1].forEach(s=>{
    const slab = BX(pa, L, 0.1, dz, M.roof, 0,0,0, {olt:0.02});
    slab.position.set(s*hx/2, y + h/2, cz);
    slab.rotation.z = Math.atan2(-h, s*hx);
    slab.position.x += cx;
  });
  const tri = new T.Shape();
  tri.moveTo(-hx, 0); tri.lineTo(hx, 0); tri.lineTo(0, h); tri.closePath();
  const tg = new T.ShapeGeometry(tri);
  const tm = new T.MeshToonMaterial({color:0xc4b89e, gradientMap:RAMP, side:T.DoubleSide});
  [-1,1].forEach(s=>{
    const e = new T.Mesh(tg, tm);
    e.position.set(cx, y, cz + s*(dz/2-0.01));
    if(s<0) e.rotation.y = Math.PI;
    pa.add(e);
  });
}

  CY(root, 0.26, 0.26, 0.7, 10, MK(0x777266), x+0.24, 4.35, z, {olt:0.012});
  BX(root, 0.34, 0.42, 0.1, MK(0xd0cabb), x-0.1, 2.6, z+0.13, {olt:0.01});
  PL(root, 0.28, 0.36, MB(0xf2e8d8), x-0.1, 2.6, z+0.19, {});
  shadowBlob(x, 0.014, z, 1.1, 1.1, 0.48);
  // 低空交错电线
  wire(-0.4, 6.5, 5.2,  -6.9, 4.0, -0.55, 0.75);      // 至民居檐角
  wire(-0.4, 5.95, 5.2, -6.9, 3.5, -0.55, 0.8);
  wire(-0.4, 6.5, 5.2,  -8, 5.9, 7.6, 0.55);          // 向西侧延伸
  wire(-0.4, 6.5, 5.2,  8, 5.7, 1.2, 1.05);           // 低空横越主街
  wire(-0.4, 5.95, 5.2, 4.2, 5.0, -2.7, 0.95);        // 至高台
  wire(-0.4, 5.8, 5.2,  1.2, 3.62, 4.7, 0.35);        // 下垂至路灯
})();
/* ============================================================
   枯黄行道树 / 草丛 / 落叶堆
   ============================================================ */
function buildTree(x, z, s, y0){
  const g = new T.Group(); g.position.set(x, y0||0, z); root.add(g);
  const th = 2.3*s;
  CY(g, 0.15*s, 0.24*s, th, 8, M.trunk, 0, th/2, 0, {olt:0.02});
  // 斜枝
  [[0.5,0.7,0.3,0.5],[-0.55,0.6,-0.4,0.45],[0.1,0.85,0.55,0.4]].forEach(b=>{
    const br = CY(g, 0.04*s, 0.07*s, 0.9*s, 6, M.trunk, b[0]*s, th*b[1], b[2]*s, {olt:0.012});
    br.rotation.z = -b[0]*0.7; br.rotation.x = b[2]*0.6;
  });
  const canopy = new T.Group(); canopy.position.y = th*0.92; g.add(canopy);
  const cols = [M.leafA, M.leafB, M.leafC, M.leafA, M.leafB, M.leafC];
  [[0,0.55,0,0.95],[-0.75,0.3,0.35,0.7],[0.7,0.35,-0.3,0.66],[0.1,1.0,-0.15,0.58],
   [-0.35,0.75,-0.55,0.52],[0.5,0.8,0.5,0.5]].forEach((b,i)=>{
    const sp = new T.Mesh(new T.SphereGeometry(b[3]*s, 14, 11), cols[i]);
    sp.position.set(b[0]*s, b[1]*s, b[2]*s); sp.scale.y = 0.8;
    canopy.add(sp); addOL(sp, 0.02);
  });
  SWAY.push({obj:canopy, amp:0.022*s, sp:R(0.55,0.85), ph:R(0,6.28), ax:'z'});
  SWAY.push({obj:canopy, amp:0.012*s, sp:R(0.4,0.7), ph:R(0,6.28), ax:'x'});
  shadowBlob(x, (y0||0)+0.016, z, 2.8*s, 2.8*s, 0.5);
  // 树下落叶堆
  const p = PL(root, 1.6*s, 0.8*s, MB_.leafPile, x+R(-0.4,0.4), (y0||0)+0.022, z+R(0.5,0.9), {rx:-Math.PI/2});
  p.rotation.z = R(0,6.28);
  return g;
}
/* 前景大树 / 高台大树 / 巷口小树 */
buildTree(-4.4, 6.7, 1.25, 0);
buildTree(7.0, -6.6, 1.1, TERR_Y);
buildTree(-7.1, -7.0, 0.85, 0);
buildTree(2.6, 5.9, 0.7, 0);

/* 草丛 */
const TUFT_MATS = [0xffffff, 0xd8cc9a, 0xbcc79a].map(c=>
  MB(c, {map:TUFT_TEX, transparent:true, alphaTest:0.4, side:T.DoubleSide, depthWrite:true}));
(function buildTufts(){
  const spots = [];
  function ok(x,z){
    if(x>-7.7 && x<-1.3 && z<0.45 && z>-7.7) return false;         // 民居院落
    if(z>1.05 && z<3.95) return false;                              // 主街
    if(x>-1.05 && x<1.65 && z<1.05) return false;                   // 小巷
    if(x>2.0 && z<-2.4) return false;                               // 高台
    return true;
  }
  const fixed = [
    [-7.3,1.0],[-6.2,0.95],[-4.9,0.9],[-3.6,0.95],[-1.7,0.95],[0.5,4.4],[2.1,4.3],
    [-7.5,4.6],[-6.0,4.5],[-3.9,4.3],[-2.6,4.7],[-1.5,5.2],[0.2,5.8],[1.6,6.4],
    [-7.4,6.8],[-6.6,7.4],[-3.2,7.4],[-0.6,7.2],[1.0,7.5],[2.8,6.9],[4.4,7.3],
    [6.2,6.8],[7.4,5.9],[6.4,4.4],[4.8,4.6],[3.4,4.9],[-2.2,3.1],[1.9,0.6],
    [1.85,-0.8],[1.8,-1.9],[-1.15,-1.2],[-1.15,-3.4],[-1.15,-5.6],
    [3.4,-2.2],[5.6,-2.3],[7.4,-2.4],[3.1,-4.8],[7.5,-3.9]
  ];
  fixed.forEach(p=>{ if(ok(p[0],p[1])) spots.push(p); });
  for(let i=0;i<18;i++){
    const x=R(-7.6,7.6), z=R(4.2,7.6);
    if(ok(x,z)) spots.push([x,z]);
  }
  spots.forEach(p=>{
    const s = R(0.7,1.2);
    const m = TUFT_MATS[(Math.random()*TUFT_MATS.length)|0];
    for(let k=0;k<2;k++){
      const t = PL(root, 0.62*s, 0.5*s, m, p[0], 0.24*s, p[1], {ry:k*Math.PI/2 + R(-0.3,0.3)});
      SWAY.push({obj:t, amp:0.06, sp:R(1.2,2.2), ph:R(0,6.28), ax:'rz'});
    }
    // 野花
    if(Math.random()>0.72){
      const fc = [0xe8d46a, 0xe0e0d0, 0xc98ab0][(Math.random()*3)|0];
      SP(root, 0.035, MK(fc), p[0]+R(-0.1,0.1), 0.3, p[1]+R(-0.1,0.1), {ol:0});
    }
  });
  // 高台与庭院补植
  for(let i=0;i<10;i++){
    const x=R(2.6,7.6), z=R(-7.6,-3.0);
    const t = PL(root, 0.6, 0.48, TUFT_MATS[0], x, TERR_Y+0.24, z, {ry:R(0,3.14)});
    SWAY.push({obj:t, amp:0.05, sp:R(1.2,2.0), ph:R(0,6.28), ax:'rz'});
  }
  [[-4.1,-0.2],[-2.0,-1.9],[-1.85,-4.6],[-4.2,-2.6]].forEach(p=>{
    const t = PL(root, 0.5, 0.42, TUFT_MATS[1], p[0], 0.2, p[1], {ry:R(0,3.14)});
    SWAY.push({obj:t, amp:0.05, sp:R(1.2,2.0), ph:R(0,6.28), ax:'rz'});
  });
})();

/* 散落落叶堆 */
(function buildPiles(){
  [[-3.3,4.6],[-6.9,3.3],[0.8,0.7],[1.2,1.0],[-5.2,7.0],[2.4,1.05],
   [-1.6,0.75],[6.0,-2.45],[-0.6,4.3],[4.2,4.8],[-7.3,5.4]].forEach(p=>{
    const w = R(0.7,1.2);
    const q = PL(root, w, w*0.55, MB_.leafPile, p[0], 0.034, p[1], {rx:-Math.PI/2});
    q.rotation.z = R(0,6.28);
  });
  [[-3.4,-1.9],[5.0,-4.3],[2.6,-6.6]].forEach(p=>{
    const q = PL(root, 0.9, 0.5, MB_.leafPile, p[0], (p[0]>2?TERR_Y:0)+0.036, p[1], {rx:-Math.PI/2});
    q.rotation.z = R(0,6.28);
  });
})();
/* ============================================================
   动效：枯叶飘落 / 路面光影 / 林间流转 / 天际暮色渐变
   ============================================================ */
/* ---- 枯叶飘落 ---- */
const LEAF_N = 72;
const LEAF_COLS = [0xd8863a, 0xc9622f, 0xe0a83e, 0xa8552a, 0xcaa04e];
const leaves = [];
for(let i=0;i<LEAF_N;i++){
  const m = new T.SpriteMaterial({map:LEAF_TEX, color:LEAF_COLS[(Math.random()*LEAF_COLS.length)|0],
    transparent:true, opacity:R(0.75,0.98), depthWrite:false});
  const s = new T.Sprite(m);
  const sz = R(0.07, 0.15);
  s.scale.set(sz, sz, 1);
  root.add(s);
  leaves.push({s:s, m:m, x:R(-7.6,7.6), z:R(-7.6,7.6), y:R(0.3,7.5),
    vy:R(0.35,0.75), ph:R(0,6.28), sp:R(1.2,2.6), rs:R(-1.4,1.4)});
}
function updateLeaves(dt, t){
  leaves.forEach(f=>{
    f.y -= f.vy*dt;
    f.x += (0.25 + Math.sin(t*0.5)*0.15)*dt + Math.sin(t*f.sp + f.ph)*dt*0.5;
    f.z += Math.cos(t*f.sp*0.8 + f.ph)*dt*0.35;
    f.m.rotation += f.rs*dt;
    if(f.y < 0.05){
      f.y = R(5.5, 8.5);
      f.x = R(-7.6, 7.6); f.z = R(-7.6, 7.6);
    }
    if(f.x > 7.8) f.x = -7.7;
    f.s.position.set(f.x, f.y, f.z);
  });
}
/* ---- 路面 / 庭院 摇曳光影 ---- */
const dapples = [];
[[5.5, 2.4, 0.05, 0.13, 0.4],   // 主街
 [5.0, -4.5, 0.47, 0.1, 0.5],   // 高台
 [-2.8, -3.5, 0.05, 0.14, 0.6]  // 庭院
].forEach((p,i)=>{
  const m = MB(0xffc98a, {transparent:true, map:DAPPLE_TEX, blending:T.AdditiveBlending, opacity:p[3], depthWrite:false});
  const d = PL(root, 5.5, 3.5, m, p[0], p[2], p[1], {rx:-Math.PI/2});
  dapples.push({obj:d, base:p[3], ph:i*2.2, dx:R(0.1,0.25), dz:R(0.05,0.15)});
});
/* ---- 远处林间光影流转 ---- */
const glowsBack = [];
[[-6.4, 2.6, -7.3, 0xff9e6a, 0.14, 5.5], [4.6, 3.2, -7.6, 0xffb070, 0.12, 6.5],
 [-1.0, 3.0, -7.4, 0x8a7ab0, 0.09, 7.5]].forEach((p,i)=>{
  const s = glowSprite(p[0], p[1], p[2], p[5], p[3], p[4]);
  glowsBack.push({s:s, base:p[4], ph:i*2.1, x0:p[0]});
});
/* 西侧落日余晖 */
const sunsetGlow = glowSprite(-7.2, 1.8, 5.4, 11, 0xff9450, 0.16);

/* ---- 天际暮色缓慢渐变 ---- */
const SKY_A = new T.Color(0x252e4e);
const SKY_B = new T.Color(0x46365a);
const SKY_C = new T.Color(0x3a3f5e);
const skyNow = new T.Color();
function updateSky(t){
  const k = 0.5 + 0.5*Math.sin(t*0.12);          // ~52 秒周期
  const w = 0.5 + 0.5*Math.sin(t*0.07 + 1.8);
  skyNow.copy(SKY_A).lerp(SKY_B, k*0.65).lerp(SKY_C, w*0.25);
  scene.background.copy(skyNow);
  scene.fog.color.copy(skyNow);
  sun.intensity = 0.5 + 0.16*w;
  sunsetGlow.material.opacity = 0.12 + 0.07*w;
}

/* ============================================================
   动画主循环
   ============================================================ */
let time = 0, last = performance.now();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  time += dt;
  const t = time;

  /* 相机 */
  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.88;
  ctrl.phi = clamp(ctrl.phi, 0.20, 1.36);
  ctrl.r   = clamp(ctrl.r, 9, 55);
  if(ctrl.dragging) ctrl.idle = 0; else ctrl.idle += dt;
  if(ctrl.idle > 5) ctrl.theta += dt*0.009;      // 静置时缓慢自转
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 晚风：草木 / 树冠 / 布艺摇曳 */
  const wind = 0.65 + 0.35*Math.sin(t*0.4) + 0.18*Math.sin(t*1.7);
  SWAY.forEach(sw=>{
    const v = Math.sin(t*sw.sp + sw.ph) * sw.amp * (0.6 + 0.6*wind);
    if(sw.ax==='rz') sw.obj.rotation.z = v;
    else if(sw.ax==='x') sw.obj.rotation.x = v;
    else sw.obj.rotation[sw.ax] = v;
  });
  CLOTHS.forEach(c=>{
    c.obj.rotation.x = 0.08 + Math.sin(t*1.6 + c.ph)*0.1*wind;
    c.obj.rotation.y = Math.sin(t*1.1 + c.ph)*0.16*wind;
  });

  /* 枯叶 / 光斑 / 天色 */
  updateLeaves(dt, t);
  dapples.forEach(d=>{
    d.obj.position.x += Math.sin(t*0.22 + d.ph)*d.dx*dt*2;
    d.obj.position.z += Math.cos(t*0.17 + d.ph)*d.dz*dt*2;
    d.obj.material.opacity = d.base*(0.7 + 0.3*Math.sin(t*0.5 + d.ph));
  });
  glowsBack.forEach(g=>{
    g.s.material.opacity = g.base*(0.6 + 0.4*Math.sin(t*0.35 + g.ph));
    g.s.position.x = g.x0 + Math.sin(t*0.16 + g.ph)*0.8;
  });
  updateSky(t);

  /* 灯光微亮 */
  LANTS.forEach(l=>{
    const v = 0.88 + 0.10*Math.sin(t*l.sp + l.ph) + 0.04*Math.sin(t*l.sp*3.3);
    l.light.intensity = l.base*v;
    l.spr.material.opacity = 0.34*v;
  });
  L.stLamp.intensity = 1.05 + 0.1*Math.sin(t*1.9) + 0.04*Math.sin(t*6.1);
  L.gLamp.intensity  = 0.7 + 0.08*Math.sin(t*1.5+1.0);
  L.house.intensity  = 1.45 + 0.08*Math.sin(t*0.9+2.0);

  /* 水潭微光 */
  renderer.render(scene, camera);
}
animate();

/* ---- 虫鸣音效（Web Audio 程序化合成，完全离线） ---- */
const snd = { ctx:null, gain:null, on:false, vol:0.55 };
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  snd.ctx = new AC();
  snd.gain = snd.ctx.createGain();
  snd.gain.gain.value = 0;
  snd.gain.connect(snd.ctx.destination);
}
/* 一声蟋蟀颤音：4~6 个高频短脉冲 */
function chirp(freq, vol, t0){
  const c = snd.ctx, dur = 0.024, gap = 0.026;
  const n = 4 + Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const t = t0 + i*(dur+gap);
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq*(0.97 + Math.random()*0.06);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(snd.gain);
    o.start(t); o.stop(t + dur + 0.03);
  }
}
/* 一只蟋蟀的循环：连鸣 2~4 组，随后随机间歇 */
function cricketLoop(freq, base){
  (function step(){
    if(!snd.on) return;
    const reps = 2 + Math.floor(Math.random()*3);
    const t0 = snd.ctx.currentTime + 0.05;
    for(let i=0;i<reps;i++)
      chirp(freq*(0.99 + Math.random()*0.02), base*(0.75 + Math.random()*0.35), t0 + i*0.34);
    setTimeout(step, (reps*0.34 + 0.7 + Math.random()*2.6)*1000);
  })();
}
(function(){
  const btn = document.getElementById('sndBtn'), vol = document.getElementById('sndVol'),
        icOn = document.getElementById('icOn'), icOff = document.getElementById('icOff');
  btn.addEventListener('click', ()=>{
    if(!snd.ctx) sndBuild();
    if(!snd.ctx) return;
    if(snd.ctx.state==='suspended') snd.ctx.resume();
    snd.on = !snd.on;
    icOn.style.display  = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none'  : 'block';
    const t = snd.ctx.currentTime;
    snd.gain.gain.setTargetAtTime(snd.on ? snd.vol : 0, t, 0.4);
    if(snd.on){ cricketLoop(4300, 0.16); cricketLoop(5150, 0.11); }
  });
  vol.addEventListener('input', ()=>{
    snd.vol = vol.value/100;
    if(snd.on && snd.ctx)
      snd.gain.gain.setTargetAtTime(snd.vol, snd.ctx.currentTime, 0.15);
  });
  // 兜底：若浏览器挂起了音频上下文，任意画布点击时自动恢复
  renderer.domElement.addEventListener('pointerdown', ()=>{
    if(snd.ctx && snd.ctx.state==='suspended') snd.ctx.resume();
  });
})();
</script>
