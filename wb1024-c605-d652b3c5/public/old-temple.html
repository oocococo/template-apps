<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>仲夏月夜 · 山寺水巷</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070f;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 38% 32%, rgba(150,185,255,.10), rgba(0,0,0,0) 62%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 48%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 42%,
                  rgba(120,131,166,1) 76%, rgba(36,42,64,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(170,200,240,.35);
          background:rgba(10,16,30,.55);color:#c8dcf5;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(170,200,240,.7);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(170,200,240,.35);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#c8dcf5;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#c8dcf5;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="虫鸣 开·关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="52"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   仲夏月夜 · 山间临水寺庙古巷   (three.js r128 / 完全离线)
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const CN = '"Songti SC","STSong","SimSun","Noto Serif CJK SC","Microsoft YaHei",serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.6));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x060a14, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x060a14);
scene.fog = new T.Fog(0x0a1122, 54, 122);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(-0.3,1.9,-0.5), r:35, theta:0.52, phi:1.02,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.30,0.53,0.73,0.90,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM      = new T.MeshBasicMaterial({color:0x080d1a, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x2b1c0c, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity=(o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.alphaTest!==undefined){ p.alphaTest=o.alphaTest; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.05) return null;
  const k = (t===undefined?0.017:t);
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  o.userData.isOL = true;
  o.castShadow = false;
  o.receiveShadow = false;
  mesh.add(o);
  return o;
}
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function CO(pa, r,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.ConeGeometry(r,h,seg||8), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function SP(pa, r, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.SphereGeometry(r, o.sg||12, o.sy||9), m);
  mesh.position.set(x,y,z);
  if(o.sx!==undefined||o.sy2!==undefined||o.sz!==undefined) mesh.scale.set(o.sx||1,o.sy2||1,o.sz||1);
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}

/* ---------------- 画布贴图 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5?'rgba(255,255,255,':'rgba(0,0,0,')+(alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();

/* 青石板 */
const TEX_STONE = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#394454'; x.fillRect(0,0,512,512);
  for(let r=0;r<4;r++) for(let i=0;i<5;i++){
    const off=(r%2)*64;
    const px=i*128+off-128;
    if(px<-128||px>512) continue;
    const v=R(-12,16);
    x.fillStyle='rgb('+Math.round(58+v)+','+Math.round(70+v)+','+Math.round(90+v)+')';
    x.fillRect(px+2, r*128+2, 124, 124);
    x.fillStyle='rgba(255,255,255,0.05)'; x.fillRect(px+2, r*128+2, 124, 4);
    x.fillStyle='rgba(0,0,0,0.16)'; x.fillRect(px+2, r*128+120, 124, 6);
  }
  speckle(x,512,512,2600,2.0,0.13);
  return TX(c,3,3);
})();
/* 青瓦 */
const TEX_TILE = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#2f3b53'; x.fillRect(0,0,256,256);
  for(let i=0;i<16;i++){
    const px=i*16;
    const g=x.createLinearGradient(px,0,px+16,0);
    g.addColorStop(0,'rgba(10,16,30,0.85)'); g.addColorStop(0.42,'rgba(98,118,152,0.55)');
    g.addColorStop(0.72,'rgba(52,66,92,0.32)'); g.addColorStop(1,'rgba(10,16,30,0.85)');
    x.fillStyle=g; x.fillRect(px,0,16,256);
  }
  for(let r=0;r<8;r++){
    const py=r*32;
    x.fillStyle='rgba(8,14,26,0.45)'; x.fillRect(0,py,256,5);
    x.fillStyle='rgba(122,144,180,0.14)'; x.fillRect(0,py+5,256,3);
    for(let i=0;i<16;i++){
      x.fillStyle='rgba(8,14,26,0.30)';
      x.beginPath(); x.arc(i*16+8, py+22, 3.4, 0, 6.2832); x.fill();
    }
  }
  speckle(x,256,256,900,1.6,0.10);
  return TX(c,2,2);
})();
/* 斑驳白墙 */
const TEX_WALL = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#7d8596'; x.fillRect(0,0,512,512);
  for(let i=0;i<44;i++){
    const px=Math.random()*512, py=R(110,512), w=R(40,190), h=R(50,220);
    const g=x.createLinearGradient(px,py,px,py+h);
    g.addColorStop(0,'rgba(58,66,80,0.28)'); g.addColorStop(1,'rgba(58,66,80,0)');
    x.fillStyle=g; x.fillRect(px,py,w,h);
  }
  for(let i=0;i<26;i++){
    x.fillStyle='rgba(150,160,178,'+R(0.06,0.20).toFixed(3)+')';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(20,80), R(14,50), Math.random()*3,0,6.2832); x.fill();
  }
  for(let i=0;i<22;i++){
    x.fillStyle='rgba(74,104,74,'+R(0.06,0.20).toFixed(3)+')';
    x.beginPath(); x.ellipse(Math.random()*512, R(300,512), R(16,64), R(10,34), Math.random()*3,0,6.2832); x.fill();
  }
  speckle(x,512,512,2200,1.8,0.10);
  x.fillStyle='#4a5262'; x.fillRect(0,470,512,42);
  x.fillStyle='rgba(0,0,0,0.25)'; x.fillRect(0,468,512,4);
  return TX(c,2,2);
})();
/* 木纹 */
const TEX_WOOD = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#6a4a33'; x.fillRect(0,0,256,256);
  for(let i=0;i<46;i++){
    x.strokeStyle='rgba('+R(48,96).toFixed(0)+','+R(32,66).toFixed(0)+','+R(20,44).toFixed(0)+','+R(0.14,0.40).toFixed(2)+')';
    x.lineWidth=R(0.6,2.6);
    x.beginPath(); x.moveTo(0, Math.random()*256);
    x.bezierCurveTo(80,Math.random()*256, 170,Math.random()*256, 256, Math.random()*256);
    x.stroke();
  }
  speckle(x,256,256,900,1.4,0.09);
  return TX(c,2,2);
})();
/* 山岩 */
const TEX_ROCK = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#28323f'; x.fillRect(0,0,256,256);
  for(let i=0;i<40;i++){
    x.fillStyle='rgba('+R(34,72).toFixed(0)+','+R(42,82).toFixed(0)+','+R(54,98).toFixed(0)+',0.5)';
    x.beginPath(); x.ellipse(Math.random()*256, Math.random()*256, R(16,70), R(12,44), Math.random()*3,0,6.2832); x.fill();
  }
  x.strokeStyle='rgba(14,20,30,0.55)'; x.lineWidth=2.4;
  for(let i=0;i<16;i++){ x.beginPath(); x.moveTo(Math.random()*256,Math.random()*256); x.lineTo(Math.random()*256,Math.random()*256); x.stroke(); }
  speckle(x,256,256,2000,1.8,0.12);
  return TX(c,2,2);
})();
/* 雕花窗棂（镂空） */
const TEX_LATTICE = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.fillStyle='#4a3222'; x.fillRect(0,0,128,128);
  x.globalCompositeOperation='destination-out';
  const cols=4, rows=4, pad=7, gap=5;
  const cw=(128-pad*2-gap*(cols-1))/cols, ch=(128-pad*2-gap*(rows-1))/rows;
  for(let r=0;r<rows;r++) for(let i=0;i<cols;i++)
    x.fillRect(pad+i*(cw+gap), pad+r*(ch+gap), cw, ch);
  x.globalCompositeOperation='source-over';
  x.strokeStyle='#4a3222'; x.lineWidth=3;
  for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){
    const px=pad+i*(cw+gap), py=pad+r*(ch+gap);
    x.beginPath();
    x.moveTo(px+cw*0.5,py); x.lineTo(px+cw,py+ch*0.5);
    x.lineTo(px+cw*0.5,py+ch); x.lineTo(px,py+ch*0.5); x.closePath(); x.stroke();
  }
  return TX(c);
})();
/* 匾额 */
function plaqueTex(text, bg, fg){
  const c=CV(512,150), x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,512,150);
  x.fillStyle='rgba(0,0,0,0.22)'; x.fillRect(0,0,512,10); x.fillRect(0,140,512,10);
  x.strokeStyle=fg; x.lineWidth=8; x.strokeRect(7,7,498,136);
  x.lineWidth=2.5; x.strokeRect(20,20,472,110);
  x.fillStyle=fg; x.font='bold 78px '+CN; x.textAlign='center'; x.textBaseline='middle';
  const n=text.length, sp=Math.min(92, 400/n);
  for(let i=0;i<n;i++) x.fillText(text[i], 256+(i-(n-1)/2)*sp, 78);
  return TX(c);
}
function clothTex(ch, bg, fg){
  const c=CV(64,128), x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,64,128);
  x.fillStyle='rgba(0,0,0,0.18)'; x.fillRect(0,0,64,10);
  x.fillStyle=fg; x.font='bold 40px '+CN; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(ch, 32, 66);
  return TX(c);
}
/* 经书卷轴 */
const TEX_SUTRA = (function(){
  const c=CV(256,128), x=c.getContext('2d');
  x.fillStyle='#4a3222'; x.fillRect(0,0,256,128);
  for(let r=0;r<3;r++){
    const py=8+r*40;
    x.fillStyle='#3a2618'; x.fillRect(4,py+34,248,4);
    for(let i=0;i<11;i++){
      const px=8+i*22;
      x.fillStyle=['#c8b184','#bfa877','#d3c199','#b09a72'][i%4];
      x.fillRect(px, py+6, 18, 28);
      x.fillStyle='rgba(255,255,255,0.16)'; x.fillRect(px, py+6, 18, 5);
      x.fillStyle='rgba(0,0,0,0.22)'; x.fillRect(px, py+26, 18, 8);
    }
  }
  return TX(c);
})();
/* 竹帘 */
const TEX_BLIND = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.clearRect(0,0,128,128);
  for(let i=0;i<26;i++){
    const py=i*5;
    x.fillStyle='rgba(196,176,120,'+(0.72+Math.random()*0.2).toFixed(2)+')';
    x.fillRect(0,py,128,3.4);
    x.fillStyle='rgba(90,70,40,0.45)'; x.fillRect(0,py+3.4,128,1.2);
  }
  x.fillStyle='rgba(120,92,50,0.85)'; x.fillRect(0,0,128,4); x.fillRect(0,124,128,4);
  return TX(c);
})();
/* 碑刻 */
const TEX_STELE = (function(){
  const c=CV(128,256), x=c.getContext('2d');
  x.fillStyle='#4e5666'; x.fillRect(0,0,128,256);
  speckle(x,128,256,700,1.6,0.12);
  x.strokeStyle='rgba(24,30,42,0.5)'; x.lineWidth=3; x.strokeRect(12,12,104,232);
  x.fillStyle='rgba(26,32,44,0.78)'; x.font='bold 34px '+CN; x.textAlign='center'; x.textBaseline='middle';
  ['山','寺','禪','林'].forEach((ch,i)=> x.fillText(ch, 64, 52+i*56));
  return TX(c);
})();

/* ---------------- 材质 ---------------- */
const M = {
  baseTop   : MK(0x2b3346, {map:TEX_ROCK}),
  baseSide  : MK(0x1a2130, {map:TEX_ROCK}),
  baseTrim  : MK(0x333c52),
  ground    : MK(0x33405a, {map:TEX_STONE}),
  bankStone : MK(0x3a4459, {map:TEX_ROCK}),
  bed       : MK(0x1d2434, {map:TEX_STONE}),
  pave      : MK(0x3b475e, {map:TEX_STONE}),
  mossStone : MK(0x3c5340, {map:TEX_STONE}),
  rock      : MK(0x2a3546, {map:TEX_ROCK}),
  rockLite  : MK(0x36425a, {map:TEX_ROCK}),
  tile      : MK(0x36445e, {map:TEX_TILE, side:T.DoubleSide}),
  tileRidge : MK(0x2b3750, {side:T.DoubleSide}),

/* ============================================================
   地形：河道 / 两岸
   ============================================================ */
const Y_BANK = 0.24, Y_WATER = -0.10, Y_BED = -0.55;
function zc(x){ return 2.95 + (x+8)*0.14; }
function zn(x){ return zc(x) - 1.45 + Math.sin(x*1.9)*0.09 + Math.sin(x*0.83+1.4)*0.07; }
function zs(x){ return zc(x) + 1.45 + Math.sin(x*1.5+2.2)*0.09 + Math.cos(x*0.95)*0.07; }

const XS = [];
for(let i=0;i<=22;i++) XS.push(-8 + i*(16/22));
const PT_N = XS.map(x=>[x, zn(x)]);
const PT_S = XS.map(x=>[x, zs(x)]);

function stripMesh(ptsA, ptsB, yA, yB, mat, uRep){
  const pos=[], uv=[], n=ptsA.length;
  for(let i=0;i<n-1;i++){
    const a0=ptsA[i], a1=ptsA[i+1], b0=ptsB[i], b1=ptsB[i+1];
    const q=[[a0[0],yA,a0[1]],[b0[0],yB,b0[1]],[b1[0],yB,b1[1]],[a1[0],yA,a1[1]]];
    const u0=i*(uRep||1)/(n-1), u1=(i+1)*(uRep||1)/(n-1);
    const uvq=[[u0,0],[u0,1],[u1,1],[u1,0]];
    [0,1,2,0,2,3].forEach(k=>{ pos.push(q[k][0],q[k][1],q[k][2]); uv.push(uvq[k][0],uvq[k][1]); });
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  const m=new T.Mesh(g, mat);
  // 双面补一层，避免绕序问题
  const g2=new T.BufferGeometry();
  const pos2=[], uv2=[];
  for(let i=0;i<n-1;i++){
    const a0=ptsA[i], a1=ptsA[i+1], b0=ptsB[i], b1=ptsB[i+1];
    const q=[[b0[0],yB,b0[1]],[a0[0],yA,a0[1]],[a1[0],yA,a1[1]],[b1[0],yB,b1[1]]];
    const u0=i*(uRep||1)/(n-1), u1=(i+1)*(uRep||1)/(n-1);
    const uvq=[[u0,0],[u0,1],[u1,1],[u1,0]];
    [0,1,2,0,2,3].forEach(k=>{ pos2.push(q[k][0],q[k][1],q[k][2]); uv2.push(uvq[k][0],uvq[k][1]); });
  }
  g2.setAttribute('position', new T.Float32BufferAttribute(pos2,3));
  g2.setAttribute('uv', new T.Float32BufferAttribute(uv2,2));
  g2.computeVertexNormals();
  m.add(new T.Mesh(g2, mat));
  return m;
}
function wallStrip(pts, yTop, yBot, mat, uRep){
  const pos=[], uv=[], n=pts.length;
  for(let i=0;i<n-1;i++){
    const a=pts[i], b=pts[i+1];
    const q=[[a[0],yTop,a[1]],[a[0],yBot,a[1]],[b[0],yBot,b[1]],[b[0],yTop,b[1]]];
    const u0=i*(uRep||1)/(n-1), u1=(i+1)*(uRep||1)/(n-1);
    const uvq=[[u0,1],[u0,0],[u1,0],[u1,1]];
    [0,1,2,0,2,3].forEach(k=>{ pos.push(q[k][0],q[k][1],q[k][2]); uv.push(uvq[k][0],uvq[k][1]); });
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  return new T.Mesh(g, mat);
}

(function buildTerrain(){
  root.add(stripMesh(XS.map(x=>[x,-8.05]), PT_N.map(p=>[p[0],p[1]-0.02]), Y_BANK, Y_BANK, M.ground, 6));
  root.add(stripMesh(PT_S.map(p=>[p[0],p[1]+0.02]), XS.map(x=>[x,8.05]), Y_BANK, Y_BANK, M.ground, 6));
  root.add(stripMesh(PT_N.map(p=>[p[0],p[1]+0.30]), PT_S.map(p=>[p[0],p[1]-0.30]), Y_BED, Y_BED, M.bed, 5));
  root.add(wallStrip(PT_N.map(p=>[p[0],p[1]-0.02]), Y_BANK, Y_WATER+0.04, M.bankStone, 7));
  root.add(wallStrip(PT_S.map(p=>[p[0],p[1]+0.02]), Y_BANK, Y_WATER+0.04, M.bankStone, 7));
  for(let i=0;i<XS.length-1;i++){

    BX(root, w, 0.10, 0.16, M.stoneLite, mx, Y_BANK+0.03, zs(mx)+0.06, {ol:0});

  for(let i=0;i<28;i++){

const CLIFF_FOOT = -7.05;
function pine(pa, x,y,z, s){
  const g=new T.Group(); g.position.set(x,y,z); pa.add(g);
  CY(g, 0.09*s,0.15*s,1.5*s, 7, M.trunk, 0, 0.72*s, 0, {ol:0});
  for(let i=0;i<3;i++) CO(g, (0.72-i*0.17)*s, 0.62*s, 7, i%2?M.pine:M.leaf, 0, (0.85+i*0.42)*s, 0, {ol:0});
  CO(g, 0.34*s, 0.55*s, 7, M.pine, 0, 2.0*s, 0, {ol:0});
}
(function buildCliff(){
  const back=-8.05, rows=[0,0.34,0.68,1.0];
  const yAt = t => 0.22 + Math.pow(t,0.86)*4.30;
  const zAt = t => CLIFF_FOOT + (back-CLIFF_FOOT)*t;
  let prev=null;
  rows.forEach((t,r)=>{
    const pts=[];
    for(let i=0;i<=18;i++){
      const x=-8.02+i*(16.04/18);
      const jz=Math.sin(x*1.3+r*1.7)*0.16 + Math.cos(x*0.61+2.0+r)*0.13;
      const jy=Math.sin(x*0.94+r*2.1)*0.30 + Math.cos(x*1.9+r)*0.22;
      pts.push({x:x, z:zAt(t)+jz*(r>0?1:0.4), y:yAt(t)+jy*(r>0?1:0.3)});
    }
    if(prev){
      for(let i=0;i<prev.length-1;i++){
        const a=[[prev[i].x,prev[i].z],[prev[i+1].x,prev[i+1].z]];
        const b=[[pts[i].x,pts[i].z],[pts[i+1].x,pts[i+1].z]];
        root.add(stripMesh(a, b, prev[i].y, prev[i+1].y, r%2?M.rockLite:M.rock, 1));
        root.add(stripMesh(b, a, pts[i].y, pts[i+1].y, M.rock, 1));
      }
    }
    prev=pts;
  });
  for(let i=0;i<30;i++){
    const x=R(-7.9,7.9), t=R(0.05,0.98);
    BX(root, R(0.26,1.4), R(0.22,1.2), R(0.26,1.4), Math.random()<0.5?M.rock:M.rockLite,
       x, yAt(t)+R(-0.2,0.35), zAt(t)+R(-0.22,0.22), {ry:Math.random()*3, rx:R(-0.2,0.2), olt:0.02});
  }
  [[-6.6,1.0],[-4.2,0.86],[-1.4,1.12],[2.6,0.92],[5.4,1.05]].forEach(p=>
    pine(root, p[0], yAt(1.0)-0.10, zAt(1.0)+R(-0.35,0.10), p[1]));
  for(let i=0;i<18;i++)
    BX(root, R(0.3,0.8), R(0.2,0.45), R(0.3,0.8), M.mossStone,
       R(-7.7,7.7), 0.24+R(0,0.1), CLIFF_FOOT+R(0.05,0.5), {ry:Math.random()*3, olt:0.02});
})();

const waterUniforms = {
  uTime:{value:0}, uMoon:{value:new T.Color(0xd2e2ff)},
  uDeep:{value:new T.Color(0x1c3a64)}, uShallow:{value:new T.Color(0x4d7ab2)},
  uMoonX:{value:0.38},
  uLamp:{value: Array.from({length:20}, ()=> new T.Vector3(0,0,0))},
  uLampCol:{value: Array.from({length:20}, ()=> new T.Color(0,0,0))},
  uLampN:{value:0}
};
const waterMat = new T.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader:[
    'varying vec2 vUv;',
    'varying vec3 vWorld;',
    'void main(){',
    '  vUv = uv;',
    '  vWorld = position;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n'),
  fragmentShader:[
    'varying vec2 vUv; varying vec3 vWorld;',
    'uniform float uTime; uniform float uMoonX;',
    'uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uMoon;',
    'uniform vec3 uLamp[20];',
    'uniform vec3 uLampCol[20];',
    'uniform int uLampN;',
    'float h11(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
    'float nse(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
    '  return mix(mix(h11(i),h11(i+vec2(1.0,0.0)),f.x), mix(h11(i+vec2(0.0,1.0)),h11(i+vec2(1.0,1.0)),f.x), f.y); }',
    'void main(){',
    '  vec2 uv = vUv; float t = uTime;',
    '  float f1 = nse(vec2(uv.x*9.0, uv.y*26.0 - t*0.40));',
    '  float f2 = nse(vec2(uv.x*21.0+3.1, uv.y*54.0 - t*0.65));',
    '  float band = sin((uv.y*34.0 + uv.x*7.0) + t*1.45 + f1*6.2832)*0.5+0.5;',
    '  float w = band*0.55 + (f2-0.5)*0.62 + (f1-0.5)*0.34;',
    '  vec3 col = mix(uDeep, uShallow, clamp(w*1.00+0.55, 0.0, 1.0));',
    '  // Sparkle 波光粼粼 (密集)',
    '  float sp = pow(max(0.0, nse(vec2(uv.x*170.0, uv.y*240.0 + t*1.10))), 9.0)*5.2;',
    '  sp += pow(max(0.0, nse(vec2(uv.x*90.0+7.7, uv.y*130.0 - t*0.70))), 11.0)*4.4;',
    '  sp += pow(max(0.0, nse(vec2(uv.x*45.0+2.3, uv.y*70.0 + t*0.50))), 16.0)*2.4;',
    '  // Moon path 月光带（宽·亮）',
    '  float mp = exp(-pow((uv.x - uMoonX)*1.6, 2.0));',
    '  col += uMoon * mp * (0.22 + w*0.16 + sp*0.55);',
    '  // Waterline foam 水边泛光（明显）',
    '  float edge = min(uv.y, 1.0-uv.y);',
    '  float foam = smoothstep(0.10, 0.0, edge) * (0.55+0.45*sin(t*1.7 + uv.x*32.0));',
    '  col += vec3(0.86,0.94,1.10) * foam * 0.35;',
    '  // Stylized flowing streaks 流水纹',
    '  float streak = sin(uv.y*62.0 - t*1.20 + sin(uv.x*8.0+t*0.55)*2.2);',
    '  streak = smoothstep(0.50, 1.0, streak);',
    '  col += vec3(0.62,0.80,1.05) * streak * 0.20;',
    '  // Sub-bright base',
    '  col += vec3(0.42,0.62,0.92) * 0.10;',
    '  // Sparkle highlights',
    '  col += vec3(0.92,1.00,1.10) * sp * 0.30;',
    '  // Lamp reflections 灯光倒影',
    '  vec2 pos = vWorld.xz;',
    '  vec2 fw = normalize(vec2(0.55, 1.0)); vec2 rt = vec2(-fw.y, fw.x);',
    '  for(int i=0;i<20;i++){',
    '    if(i >= uLampN) break;',
    '    vec2 L = uLamp[i].xy; float I = uLamp[i].z;',
    '    vec2 d = pos - L; float dlen = length(d);',
    '    if(dlen > 5.0) continue;',
    '    float along = dot(d, fw); float across = dot(d, rt);',
    '    float wob = 0.5+0.5*sin(along*16.0 - t*2.40 + across*4.2);',
    '    float wob2= 0.5+0.5*sin(along*7.5 + t*1.50 + nse(vec2(L))*3.0);',
    '    float wfall = exp(-pow(across / (0.095 + 0.060*abs(along)+0.001), 2.0));',
    '    float dista = exp(-abs(along)*0.50) * exp(-pow(dlen*0.50, 1.5));',
    '    float st = dista * wfall * (0.40+0.60*wob) * (0.55+0.45*wob2) * I;',
    '    col += uLampCol[i] * st * 1.80;',
    '  }',
    '  gl_FragColor = vec4(col, 1.0); }'
  ].join('\n'),
  side:T.DoubleSide
});
root.add(stripMesh(PT_N.map(p=>[p[0],p[1]-0.07]), PT_S.map(p=>[p[0],p[1]+0.07]),

/* ============================================================
   构件工具
   ============================================================ */
function roofGeo(w,d,h,ridgeFrac,seg){
  seg=seg||3;
  const hw=w/2, hd=d/2, hr=w*(ridgeFrac===undefined?0.30:ridgeFrac)/2;
  const pos=[], uv=[];
  const yAt=t=>h*Math.pow(1-t,1.55);
  const xAt=t=>hr+(hw-hr)*t;
  function quad(a,b,c,e){ [a,b,c,a,c,e].forEach(p=>{ pos.push(p[0],p[1],p[2]); uv.push(p[3],p[4]); }); }
  for(let i=0;i<seg;i++){
    const t0=i/seg, t1=(i+1)/seg;
    const x0=xAt(t0), x1=xAt(t1), y0=yAt(t0), y1=yAt(t1), z0=hd*t0, z1=hd*t1;
    const uL0=(-x0+hw)/w, uR0=(x0+hw)/w, uL1=(-x1+hw)/w, uR1=(x1+hw)/w;
    quad([-x0,y0,z0,uL0,t0],[x0,y0,z0,uR0,t0],[x1,y1,z1,uR1,t1],[-x1,y1,z1,uL1,t1]);
    quad([x0,y0,-z0,uR0,t0],[-x0,y0,-z0,uL0,t0],[-x1,y1,-z1,uL1,t1],[x1,y1,-z1,uR1,t1]);
    quad([-x0,y0,-z0,0,t0],[-x0,y0,z0,1,t0],[-x1,y1,z1,1,t1],[-x1,y1,-z1,0,t1]);
    quad([x0,y0,z0,1,t0],[x0,y0,-z0,0,t0],[x1,y1,-z1,0,t1],[x1,y1,z1,1,t1]);
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  return g;
}
function addRoof(pa, w,d,h, x,y,z, o){
  o=o||{};
  const rf = (o.ridgeFrac===undefined?0.30:o.ridgeFrac);
  const mesh = new T.Mesh(roofGeo(w,d,h,rf,o.seg||3), o.mat||M.tile);
  mesh.position.set(x,y,z);
  if(o.ry) mesh.rotation.y=o.ry;
  pa.add(mesh);
  if(o.ol!==0) addOL(mesh, 0.022);
  const rl = w*rf;
  BX(mesh, rl+0.16, 0.13, 0.14, M.tileRidge, 0, h+0.03, 0, {ol:0});
  BX(mesh, rl+0.16, 0.05, 0.20, M.tileRidge, 0, h+0.11, 0, {ol:0});
  [-1,1].forEach(s=>{
    const gx=s*(rl/2+0.06);
    BX(mesh, 0.15,0.30,0.13, M.tileRidge, gx, h+0.18, 0, {ol:0});
    BX(mesh, 0.11,0.16,0.11, M.tileRidge, gx+s*0.075, h+0.36, 0, {rz:-s*0.55, ol:0});
    BX(mesh, 0.07,0.10,0.07, M.tileRidge, gx+s*0.15, h+0.44, 0, {rz:-s*1.0, ol:0});
  });

const Y_S = Y_BANK;
const LANE = [[-7.55,6.30],[-6.30,6.60],[-5.00,6.50],[-3.85,6.15],[-2.95,5.80]];
function pathStrip(pts, w, mat, y){
  const pos=[], uv=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    let dx=b[0]-a[0], dz=b[1]-a[1];
    const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const nx=-dz*w/2, nz=dx*w/2;
    const q=[[a[0]-nx,y,a[1]-nz],[a[0]+nx,y,a[1]+nz],[b[0]+nx,y,b[1]+nz],[b[0]-nx,y,b[1]-nz]];
    const u0=i*1.6, u1=(i+1)*1.6;
    const uvq=[[u0,0],[u0,1],[u1,1],[u1,0]];
    [0,1,2,0,2,3].forEach(k=>{ pos.push(q[k][0],q[k][1],q[k][2]); uv.push(uvq[k][0],uvq[k][1]); });
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  return new T.Mesh(g, mat);
}
function wallRun(pts, h, mat, skipIdx){
  for(let i=0;i<pts.length-1;i++){
    if(skipIdx && skipIdx.indexOf(i)>=0) continue;
    const a=pts[i], b=pts[i+1];
    const L=Math.hypot(b[0]-a[0], b[1]-a[1]);
    const mx=(a[0]+b[0])/2, mz=(a[1]+b[1])/2;
    const ang=Math.atan2(-(b[1]-a[1]), b[0]-a[0]);
    BX(root, L+0.06, h, 0.16, mat, mx, Y_S+h/2, mz, {ry:ang, olt:0.018});
    BX(root, L+0.22, 0.11, 0.34, M.tileRidge, mx, Y_S+h+0.05, mz, {ry:ang, olt:0.012});
    BX(root, L+0.06, 0.16, 0.20, M.stoneDark, mx, Y_S+0.08, mz, {ry:ang, ol:0});
  }
}

const BR = { x:0.41, z:4.23, ry:-0.139, L:3.20, W:1.50 };
(function buildBridge(){
  const g=new T.Group(); g.position.set(BR.x, Y_BANK, BR.z); g.rotation.y=BR.ry; root.add(g);
  const L=BR.L, W=BR.W, N=18;
  const deck = t => 0.14 + 0.60*Math.sin(Math.PI*clamp(t,0,1));
  const dk   = z => deck((z+L/2)/L);
  // 桥面石板
  for(let i=0;i<N;i++){
    const t0=i/N, t1=(i+1)/N;
    const z0=-L/2+t0*L, z1=-L/2+t1*L, y0=deck(t0), y1=deck(t1);
    const len=Math.hypot(z1-z0, y1-y0);
    BX(g, W+0.26, 0.11, len*1.04, i%2?M.stone:M.stoneLite,
       0, (y0+y1)/2-0.055, (z0+z1)/2, {rx:-Math.atan2(y1-y0, z1-z0), olt:0.010});
  }
  // 拱券 + 拱腹
  const a=1.15, rise=0.52, R=(a*a+rise*rise)/(2*rise), crown=0.30, cy=crown-R;
  const A=Math.asin(a/R), NA=13;
  for(let i=0;i<NA;i++){
    const th=-A+(i+0.5)*(2*A/NA);
    const seg=2*A/NA*R*1.12;
    const yz=cy+R*Math.cos(th), zz=R*Math.sin(th);
    BX(g, W+0.28, 0.21, seg, M.stoneLite, 0, yz, zz, {rx:th, olt:0.012});
    const exY=cy+(R+0.105)*Math.cos(th);
    const dB=dk(zz)-0.11;
    if(dB>exY+0.03) BX(g, W+0.20, dB-exY, seg*0.95, M.bankStone, 0, (dB+exY)/2, zz, {ol:0});
  }
  // 桥台
  [-1,1].forEach(s=>{
    const z2=s*(a+(L/2-a)/2);
    BX(g, W+0.26, 0.62, (L/2-a)+0.06, M.bankStone, 0, -0.17, z2, {olt:0.014});
    BX(g, W+0.34, 0.13, (L/2-a)+0.12, M.stone, 0, 0.09, z2, {olt:0.012});
  });
  // 栏板 / 望柱
  [-1,1].forEach(s=>{
    const wx=s*(W/2+0.03);
    for(let i=0;i<=N;i++){
      const z=-L/2+(i/N)*L;
      CY(g, 0.033,0.038,0.28, 6, M.stoneLite, wx, dk(z)+0.14, z, {olt:0.008});
    }
    for(let i=0;i<N;i++){
      const z0=-L/2+(i/N)*L, z1=-L/2+((i+1)/N)*L;
      const y0=dk(z0)+0.29, y1=dk(z1)+0.29;
      const len=Math.hypot(z1-z0, y1-y0);
      BX(g, 0.05, 0.12, len*1.04, M.stone, wx, (y0+y1)/2, (z0+z1)/2,
         {rx:-Math.atan2(y1-y0, z1-z0), olt:0.008});
    }
    [-1,1].forEach(e=>{
      const z=-L/2+((e<0?0:1))*L, y=dk(z);
      CY(g, 0.055,0.068,0.50, 7, M.stoneLite, wx, y+0.25, z, {olt:0.010});
      SP(g, 0.072, M.stoneLite, wx, y+0.55, z, {sg:9, sy:7, olt:0.010});
    });
  });
  // 桥头石灯
  [-1,1].forEach(s=> stoneLantern(g, s*(W/2+0.30), dk(-L/2+0.34)+0.02, -L/2+0.34, 0.80, true));
  stoneLantern(g, -(W/2+0.30), dk(L/2-0.34)+0.02, L/2-0.34, 0.80, true);
  // 桥心月华
  const gl=new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:0xa8c8ff,
    blending:T.AdditiveBlending, opacity:0.14, transparent:true, depthWrite:false}));
  gl.position.set(0, 0.92, 0); gl.scale.set(2.6,2.6,1); g.add(gl);
  LANTERNS.push({halo:gl, base:0.14, ph:5.1, sp:0.5});
})();

const CURTAINS = [];
function curtain(pa, w, h, x,y,z, ry){
  const mat = new T.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uCol:{value:new T.Color(0xd9c9a6)}, uOp:{value:0.92} },
    vertexShader:[
      'uniform float uTime; varying vec2 vUv;',
      'void main(){ vUv=uv; vec3 p=position;',
      ' float k=1.0-uv.y;',
      ' p.z += sin(uv.y*5.2 + uTime*1.55 + uv.x*2.4)*0.055*k;',
      ' p.x += sin(uv.y*3.3 + uTime*1.15)*0.028*k;',
      ' gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0); }'
    ].join('\n'),
    fragmentShader:[
      'uniform vec3 uCol; uniform float uOp; varying vec2 vUv;',
      'void main(){',
      '  float b=0.74+0.26*sin(vUv.y*64.0);',
      '  float e=smoothstep(0.0,0.10,vUv.x)*smoothstep(1.0,0.90,vUv.x);',
      '  gl_FragColor=vec4(uCol*b, uOp*(0.35+0.65*e)); }'
    ].join('\n'),
    transparent:true, side:T.DoubleSide, depthWrite:false
  });
  const m=new T.Mesh(new T.PlaneGeometry(w,h,8,10), mat);
  m.position.set(x,y,z); m.rotation.y=ry||0; pa.add(m);
  CURTAINS.push(mat);
  return m;
}

})();

/* ============================================================
   水面涟漪
   ============================================================ */
const RIPS = [];
(function initRipples(){
  const gg=new T.RingGeometry(0.30, 0.40, 26);
  for(let i=0;i<14;i++){
    const m=new T.Mesh(gg, MB(0xa8c8ff,{transparent:true, opacity:0, side:T.DoubleSide,
      blending:T.AdditiveBlending, depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.visible=false; root.add(m);
    RIPS.push({m:m, t:1, x:0, z:0, sp:1, mx:1});
  }
})();
function spawnRipple(x,z,maxR){
  for(let i=0;i<RIPS.length;i++){
    const p=RIPS[i];
    if(p.t>=1){ p.t=0; p.x=x; p.z=z; p.mx=maxR||1.1; p.sp=R(0.5,0.9); p.m.visible=true; return; }
  }
}

/* ============================================================
   萤火
   ============================================================ */
const FLY_ZONES = [
  [ 1.40,-4.60],[ 0.90,-1.20],[-2.60,-1.60],[ 3.60, 0.60],
  [-6.30, 6.60],[-4.20, 6.32],[-2.60, 5.30],
  [ 5.60,-3.40],[-5.40, 1.90],[ 2.20, 6.60]
];
const FLIES = [];
(function initFlies(){
  for(let i=0;i<30;i++){
    const z0=FLY_ZONES[i%FLY_ZONES.length];
    const s=new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:0xbdf08a,
      blending:T.AdditiveBlending, opacity:0, transparent:true, depthWrite:false}));
    s.scale.set(0.17,0.17,1); root.add(s);
    FLIES.push({s:s, cx:z0[0]+R(-0.70,0.70), cz:z0[1]+R(-0.70,0.70), r:R(0.35,1.15),
                ph:Math.random()*6.28, ph2:Math.random()*6.28, sp:R(0.22,0.55), yb:R(0.30,1.45)});
  }
})();

/* ============================================================
   声音：夏夜虫鸣（间歇·三物种）
   ============================================================ */
const AUD = { ctx:null, master:null, on:false, vol:0.52, ckT:0, cricket:null };
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  const ctx = new AC(); AUD.ctx = ctx;
  const master = ctx.createGain();
  master.gain.value = 0; master.connect(ctx.destination); AUD.master = master;

  // 共享带通，模拟夏夜空气感
  const bus = ctx.createBiquadFilter();
  bus.type = 'bandpass'; bus.frequency.value = 4200; bus.Q.value = 6.5;
  bus.connect(master);

  // 物种 A：蟋蟀高音颤鸣（4350~4850 Hz）
  const spA = { fMin:4350, fMax:4850, nMin:3, nMax:6, gapMin:1900, gapMax:5600, dur:0.042, gain:0.062 };
  // 物种 B：油葫芦 / 蛐蛐中频啾鸣（3000~3600 Hz）
  const spB = { fMin:3000, fMax:3600, nMin:2, nMax:5, gapMin:2600, gapMax:7200, dur:0.065, gain:0.078 };
  // 物种 C：低频蝉虫滋滋（2300~2750 Hz）
  const spC = { fMin:2300, fMax:2750, nMin:4, nMax:8, gapMin:3200, gapMax:7800, dur:0.048, gain:0.058 };

  function trill(sp, t0){
    const n = sp.nMin + Math.floor(Math.random()*(sp.nMax-sp.nMin+1));
    for(let i=0;i<n;i++){
      const tt = t0 + i*(sp.dur*0.95);
      const o = ctx.createOscillator();
      o.type = 'square';
      const f = sp.fMin + Math.random()*(sp.fMax-sp.fMin);
      o.frequency.setValueAtTime(f, tt);
      o.frequency.exponentialRampToValueAtTime(f*(0.93+Math.random()*0.14), tt+sp.dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(sp.gain, tt+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, tt+sp.dur);
      o.connect(g); g.connect(bus);
      o.start(tt); o.stop(tt+sp.dur+0.02);
    }
  }

  function schedule(){
    const t = ctx.currentTime;
    const sp = [spA, spB, spC][Math.floor(Math.random()*3)];
    trill(sp, t + 0.05);
    AUD.ckT = setTimeout(schedule, sp.gapMin + Math.random()*(sp.gapMax - sp.gapMin));
  }

  AUD.cricket = function cricket(){
    if(!AUD.on) return;
    schedule();
  };
  return true;
}
(function bindSound(){
  const btn=document.getElementById('sndBtn'), vol=document.getElementById('sndVol');
  const icOn=document.getElementById('icOn'), icOff=document.getElementById('icOff');
  function applyVol(){
    if(AUD.master) AUD.master.gain.setTargetAtTime(AUD.on?AUD.vol:0, AUD.ctx.currentTime, 0.09);
  }
  btn.addEventListener('click', ()=>{
    if(!AUD.ctx && !sndBuild()) return;
    if(AUD.ctx.state==='suspended') AUD.ctx.resume();
    AUD.on = !AUD.on;
    icOn.style.display  = AUD.on?'block':'none';
    icOff.style.display = AUD.on?'none':'block';
    applyVol();
    clearTimeout(AUD.ckT);
    if(AUD.on) AUD.ckT = setTimeout(AUD.cricket, 600);
  });
  vol.addEventListener('input', ()=>{ AUD.vol = vol.value/100; applyVol(); });
})();

/* ============================================================
   收集临水灯火 → 写入水面着色器（灯光倒影）
   ============================================================ */
(function gatherRiverLamps(){
  const v = new T.Vector3();
  const list = [];
  // 灯笼光晕
  for(let i=0;i<LANTERNS.length;i++){
    const l = LANTERNS[i];
    l.halo.getWorldPosition(v);
    const dz = Math.abs(v.z - zc(v.x));
    if(dz > 4.8) continue;
    list.push({ x:v.x, z:v.z, col: l.halo.material.color.clone(), I: 0.95 });
  }
  // 主要点光源
  Object.keys(L).forEach(k => {
    L[k].getWorldPosition(v);
    const dz = Math.abs(v.z - zc(v.x));
    if(dz > 4.8) return;
    list.push({ x:v.x, z:v.z, col: new T.Color(L[k].color), I: 0.60 });
  });
  list.sort((a,b) => Math.hypot(a.x,a.z-zc(a.x)) - Math.hypot(b.x,b.z-zc(b.x)));
  const N = Math.min(20, list.length);
  for(let i=0;i<20;i++){
    if(i < N){
      waterUniforms.uLamp.value[i].set(list[i].x, list[i].z, list[i].I);
      waterUniforms.uLampCol.value[i].copy(list[i].col);
    } else {
      waterUniforms.uLamp.value[i].set(0,0,0);
      waterUniforms.uLampCol.value[i].set(0,0,0);
    }
  }
  waterUniforms.uLampN.value = N;
})();

/* ============================================================
   阴影：月相平行光 → 正交投影
   ============================================================ */
(function setupShadows(){
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  moon.castShadow = true;
  moon.shadow.mapSize.set(1536, 1536);
  const sc = moon.shadow.camera;
  sc.left = -15; sc.right = 15; sc.top = 15; sc.bottom = -15;
  sc.near = 0.5; sc.far = 110;
  sc.updateProjectionMatrix();
  moon.shadow.bias = -0.0009;
  moon.shadow.normalBias = 0.040;
  moon.shadow.radius = 2.4;

  scene.traverse(o=>{
    if(!o.isMesh) return;
    if(o.userData.isOL){ o.castShadow=false; o.receiveShadow=false; return; }
    const m = o.material;
    if(!m) return;
    if(m.isShaderMaterial){ o.castShadow=false; o.receiveShadow=false; return; }
    if(m.transparent || m.blending === T.AdditiveBlending){ o.castShadow=false; o.receiveShadow=false; return; }
    o.castShadow = true;
    o.receiveShadow = true;
  });
})();

/* ============================================================
   主循环
   ============================================================ */
const clock = new T.Clock();
let ACC = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  ACC += dt;
  const t = ACC;

  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.86;
  ctrl.phi = clamp(ctrl.phi, 0.22, 1.44);
  ctrl.r   = clamp(ctrl.r, 13, 62);
  if(!ctrl.dragging){ ctrl.idle += dt; if(ctrl.idle > 4) ctrl.theta += dt*0.034; }
  const sp=Math.sin(ctrl.phi), cp=Math.cos(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*cp,
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta));
  camera.lookAt(ctrl.target);

  waterUniforms.uTime.value = t;

  for(let i=0;i<WILLOWS.length;i++){
    const w=WILLOWS[i];
    w.g.rotation.z = w.base + w.amp*Math.sin(t*w.sp + w.ph);
    w.g.rotation.x = w.amp*0.42*Math.sin(t*w.sp*0.79 + w.ph*1.7);
  }
  for(let i=0;i<VINES.length;i++){
    const v=VINES[i];
    v.g.rotation.z = v.base + v.amp*Math.sin(t*v.sp + v.ph);
  }
  for(let i=0;i<FLAGS.length;i++){
    const f=FLAGS[i];
    if(f.axis==='z') f.g.rotation.z = f.base + f.amp*Math.sin(t*f.sp + f.ph);
    else             f.g.rotation.y = f.base + f.amp*Math.sin(t*f.sp + f.ph);
  }
  for(let i=0;i<CURTAINS.length;i++) CURTAINS[i].uniforms.uTime.value = t;
  for(let i=0;i<LANTERNS.length;i++){
    const l=LANTERNS[i];
    l.halo.material.opacity = l.base*(0.80 + 0.20*Math.sin(t*l.sp + l.ph) + 0.07*Math.sin(t*l.sp*2.7 + l.ph*2));
  }
  for(let i=0;i<FLAMES.length;i++){
    const f=FLAMES[i];
    const k=1 + 0.15*Math.sin(t*f.sp + f.ph) + 0.07*Math.sin(t*f.sp*2.3 + f.ph*3);
    f.s.scale.set(f.base*k, f.base*1.6*k*(0.93+0.09*Math.sin(t*f.sp*1.7 + f.ph)), 1);
    f.s.material.opacity = 0.72 + 0.22*Math.sin(t*f.sp*1.3 + f.ph);
  }
  for(let i=0;i<SMOKE.length;i++){
    const p=SMOKE[i];
    p.t += dt*p.sp; if(p.t>=1) p.t -= 1;
    const k=p.t;
    p.s.position.set(p.ox + Math.sin(k*5.2+p.ph)*0.20*k,
                     p.y0 + k*1.65*p.sc,
                     p.oz + Math.cos(k*4.4+p.ph)*0.17*k);
    const sz=(0.10 + k*0.40)*p.sc;
    p.s.scale.set(sz,sz,1);
    p.s.material.opacity = 0.20*Math.sin(Math.PI*k);
  }
  if(Math.random() < dt*1.6){
    const rx=R(-7.2,6.8);
    spawnRipple(rx, zc(rx)+R(-1.15,1.15), R(0.55,1.35));
  }
  for(let i=0;i<RIPS.length;i++){
    const p=RIPS[i];
    if(p.t>=1){ if(p.m.visible) p.m.visible=false; continue; }
    p.t += dt*p.sp;
    const k=Math.min(1, p.t), r=0.10+k*p.mx;
    p.m.position.set(p.x, Y_WATER+0.015, p.z);
    p.m.scale.set(r,r,1);
    p.m.material.opacity = 0.34*(1-k)*(1-k);
  }
  for(let i=0;i<FLIES.length;i++){
    const f=FLIES[i];
    f.s.position.set(
      f.cx + Math.sin(t*f.sp + f.ph)*f.r,
      Y_BANK + f.yb + Math.sin(t*0.75 + f.ph2)*0.34,
      f.cz + Math.cos(t*f.sp*0.83 + f.ph)*f.r);
    f.s.material.opacity = 0.90*Math.pow(Math.max(0, Math.sin(t*1.9 + f.ph*2.6)), 6);
  }
  for(let i=0;i<BOATS.length;i++){
    const b=BOATS[i];
    b.g.position.y = b.y + Math.sin(t*0.75 + b.ph)*0.022;
    b.g.rotation.z = Math.sin(t*0.62 + b.ph*1.4)*0.034;
    b.g.rotation.x = Math.sin(t*0.48 + b.ph)*0.020;
  }
  for(let i=0;i<REFL.length;i++){
    const r=REFL[i];
    r.s.material.opacity = r.b*(0.78 + 0.22*Math.sin(t*r.sp + r.ph));
    r.s.scale.set(r.w*(1+0.05*Math.sin(t*r.sp*1.3 + r.ph)), r.h, 1);
  }

  renderer.render(scene, camera);
}
animate();
</script>
