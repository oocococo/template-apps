<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雨夜便利店 · Rainy Konbini</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070e;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 60% 55%, rgba(90,120,255,.07), rgba(0,0,0,0) 62%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 48%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 44%, rgba(115,120,140,1) 78%, rgba(40,44,58,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(160,190,230,.35);
          background:rgba(10,16,28,.55);color:#bcd2ee;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(160,190,230,.7);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(160,190,230,.35);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#bcd2ee;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#bcd2ee;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="雨声 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="55"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   雨夜便利店 · 三渲二微缩街角  (three.js r128 / 完全离线)
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const JP = '"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Microsoft YaHei",sans-serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x080b14, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x080b14);
scene.fog = new T.Fog(0x0b1224, 40, 100);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(-0.8,1.5,-1.2), r:27.5, theta:0.80, phi:1.02,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.34,0.55,0.74,0.89,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM = new T.MeshBasicMaterial({color:0x090c17, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x241a10, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity = (o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.emissiveMap) p.emissiveMap = o.emissiveMap;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.055) return null;
  const k = t===undefined?0.017:t;
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
/** 盒子：parent, 宽高深, 材质, 坐标, 选项{rx,ry,rz,ol(0=不描边),olt,warm} */
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
/** 平面：默认朝 +z；ry 旋转 */
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

/* 径向光晕（用于灯光池 / 辉光精灵） */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
/* 柔和光带（用于湿地面拉长倒影） */
const BEAM_TEX = (function(){
  const c=CV(128,256), x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.52,'rgba(255,255,255,0.85)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,256);
  const h=x.createLinearGradient(0,0,128,0);
  h.addColorStop(0,'rgba(0,0,0,1)'); h.addColorStop(0.5,'rgba(0,0,0,0)'); h.addColorStop(1,'rgba(0,0,0,1)');
  x.globalCompositeOperation='destination-out'; x.fillStyle=h; x.fillRect(0,0,128,256);
  return TX(c);
})();
/* 接触阴影 */
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.75)'); g.addColorStop(0.55,'rgba(0,0,0,0.32)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();

/* 沥青 */
const ASPHALT = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#191d25'; x.fillRect(0,0,512,512);
  for(let i=0;i<70;i++){
    x.fillStyle='rgba('+R(30,70).toFixed(0)+','+R(34,74).toFixed(0)+','+R(40,84).toFixed(0)+',0.5)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(30,120), R(20,90), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,4200,2.2,0.11);
  return TX(c,3,3);
})();
/* 人行道水泥砖 */
const PAVE = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#333a47'; x.fillRect(0,0,512,512);
  speckle(x,512,512,2600,2.0,0.09);
  x.strokeStyle='rgba(12,16,24,0.55)'; x.lineWidth=3;
  for(let i=0;i<=4;i++){ const p=i*128; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke(); x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  x.strokeStyle='rgba(150,170,200,0.07)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){ const p=i*128+3; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke(); x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  return TX(c,4,4);
})();
/* 停车场沥青 */
const LOT_TEX = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#1c2029'; x.fillRect(0,0,512,512);
  for(let i=0;i<50;i++){
    x.fillStyle='rgba('+R(28,64).toFixed(0)+','+R(32,68).toFixed(0)+','+R(38,76).toFixed(0)+',0.45)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(30,110), R(20,80), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,3400,2.0,0.1);
  return TX(c,2,2);
})();
/* 停车场标线（透明叠加层，画布上方=店铺一侧） */
const LOT_LINES = (function(){
  const c=CV(1024,384), x=c.getContext('2d');
  x.clearRect(0,0,1024,384);
  const stalls=[[70,300],[360,300],[650,300]];
  x.lineWidth=7; x.strokeStyle='rgba(233,238,246,0.82)';
  stalls.forEach((s,i)=>{
    x.beginPath();
    x.moveTo(s[0], 46); x.lineTo(s[0], 330); x.lineTo(s[0]+s[1], 330); x.lineTo(s[0]+s[1], 46);
    x.stroke();
    x.save(); x.fillStyle='rgba(245,214,120,0.85)';
    x.font='bold 74px '+JP; x.textAlign='center'; x.textBaseline='middle';
    x.fillText(String(i+1), s[0]+s[1]/2, 300);
    x.restore();
  });
  // 车挡
  x.fillStyle='rgba(240,238,230,0.7)';
  stalls.forEach(s=>{ rr(x, s[0]+38, 78, s[1]-76, 20, 8); x.fill(); });
  // 通行箭头
  x.save(); x.translate(640, 356); x.fillStyle='rgba(230,236,246,0.5)';
  x.beginPath(); x.moveTo(0,-40); x.lineTo(34,0); x.lineTo(14,0); x.lineTo(14,42); x.lineTo(-14,42); x.lineTo(-14,0); x.lineTo(-34,0); x.closePath(); x.fill();
  x.restore();
  return TX(c);
})();
/* 混凝土（底座 / 墙） */
const CONC = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#3b4150'; x.fillRect(0,0,256,256);
  speckle(x,256,256,1800,1.8,0.1);
  return TX(c,2,2);
})();

/* ---------------- 大类材质 ---------------- */
const M = {
  baseTop   : MK(0x20242e, {map:CONC}),
  baseSide  : MK(0x171b24, {map:CONC}),
  baseTrim  : MK(0x2b3242),
  road      : MK(0x14171e, {map:ASPHALT}),
  pave      : MK(0x2f3542, {map:PAVE}),
  lot       : MK(0x181c23, {map:LOT_TEX}),
  curb      : MK(0x4a5160),
  white     : MK(0xe6ebf3),
  metal     : MK(0x8d95a4),
  darkMetal : MK(0x3d4450),
  glass     : MK(0x9ec8e8, {transparent:true, opacity:0.20, emissive:0x2b3d52, ei:0.5}),
  storeWall : MK(0xd9dde4, {emissive:0x2b3242, ei:0.35}),
  storeTrim : MK(0x2f3a4e),
  canopy    : MK(0x2b3446),
  canopyTop : MK(0x39445a),
  inWall    : MK(0xf2e8d6, {emissive:0x8a6c32, ei:0.62}),
  inFloor   : MK(0xd8d2c4, {map:CONC, emissive:0x7a5228, ei:0.52}),
  inCeil    : MK(0xf6f2e8, {emissive:0x9a7c3a, ei:0.55}),
  shelf     : MK(0xf0f1f4, {emissive:0x8d6a30, ei:0.55}),
  shelfEdge : MK(0x9fa7b6),
  counter   : MK(0xb98a54, {emissive:0x8d5520, ei:0.48}),
  cooler    : MK(0xdfe6ee, {emissive:0x6d5124, ei:0.4}),
  rubber    : MK(0x2a2e38),
  leaf      : MK(0x35603f),
  wood      : MK(0x7a5a3c),
  red       : MK(0xd0453f),
  blue      : MK(0x3f7fd0),
  yellow    : MK(0xe8c14a),
  green     : MK(0x46b98d)
};
const MB_ = {
  glowWarm : MB(0xffd9a0, {transparent:true, blending:T.AdditiveBlending, map:RAD_TEX, opacity:0.9}),
  neonWhite: MB(0xf2f8ff),
  neonGreen: MB(0x8ff0d2),
  neonPink : MB(0xff87b0)
};

/* ---------------- 灯光 ---------------- */
scene.add(new T.HemisphereLight(0x35507e, 0x080b12, 0.55));
scene.add(new T.AmbientLight(0x2a3550, 0.42));
const moon = new T.DirectionalLight(0x8fb4f0, 0.42);
moon.position.set(-14, 20, 10); scene.add(moon);
const fill = new T.DirectionalLight(0x6f8ad0, 0.22);
fill.position.set(12, 8, -14); scene.add(fill);

const L = {};
function ptLight(name, color, intensity, dist, x,y,z){
  const l = new T.PointLight(color, intensity, dist, 2);
  l.position.set(x,y,z); scene.add(l); L[name]=l; return l;
}
ptLight('in1', 0xffd39a, 1.55, 8.5, -5.2, 2.75, -5.0);
ptLight('in2', 0xffd39a, 1.45, 8.0, -2.6, 2.75, -3.6);
ptLight('in3', 0xffd9a8, 1.15, 7.0, -4.4, 2.8,  -2.9);
ptLight('sign', 0xbfe8ff, 0.85, 7.5, -3.6, 2.6, -1.9);
ptLight('vend', 0xff9ec0, 0.75, 5.5, -6.0, 1.6, -1.35);
ptLight('lampA',0xffd9a0, 1.35, 13,   1.5, 4.7,  1.5);
ptLight('lampB',0xffd9a0, 1.05, 11,  -4.4, 4.3,  1.6);
ptLight('alley',0xffc98a, 0.60, 6.5, -4.2, 2.9, -7.05);
ptLight('pole', 0xcfe6ff, 0.70, 7.0, -6.6, 3.6,  1.0);
ptLight('traf', 0x66ff9c, 0.45, 6.0,  3.1, 3.1, -1.2);

/* ============================================================
   底座
   ============================================================ */
const root = new T.Group();
scene.add(root);

function buildBase(){
  // 主体
  BX(root, 16, 1.5, 16, M.baseSide, 0, -0.75, 0, {ol:0});
  // 顶面（街道路面基准 y=0）
  PL(root, 16, 16, M.baseTop, 0, 0.001, 0, {rx:-Math.PI/2, ol:0});
  // 底部装饰线
  BX(root, 16.5, 0.22, 16.5, M.baseTrim, 0, -1.55, 0, {ol:0});
  BX(root, 16.9, 0.18, 16.9, MK(0x12161f), 0, -1.74, 0, {ol:0});
  // 顶面边框
  const fr = 0.34;
  BX(root, 16, 0.06, fr, M.baseTrim, 0, 0.03,  8-fr/2, {olt:0.01});
  BX(root, 16, 0.06, fr, M.baseTrim, 0, 0.03, -8+fr/2, {olt:0.01});
  BX(root, fr, 0.06, 16, M.baseTrim,  8-fr/2, 0.03, 0, {olt:0.01});
  BX(root, fr, 0.06, 16, M.baseTrim, -8+fr/2, 0.03, 0, {olt:0.01});
}
buildBase();

/* ============================================================
   街道：L 形路口 + 人行道 + 停车场
   ============================================================ */
const Y_ROAD = 0.004, Y_LOT = 0.05, Y_PAVE = 0.18;

function buildStreets(){
  // 车行道（横向：z 2..8；纵向：x 2..8, z -8..2）
  PL(root, 16, 6, M.road, 0, Y_ROAD, 5, {rx:-Math.PI/2});
  PL(root, 6, 10, M.road, 5, Y_ROAD, -3, {rx:-Math.PI/2});

  // 中央虚线
  const dashM = MK(0xdfe4ec, {emissive:0x40454c, ei:0.35});

  const zb = MK(0xe9edf4, {emissive:0x303540, ei:0.35});
  for(let i=0;i<4;i++) BX(root, 0.42, 0.02, 5.6, zb, 0.32+i*0.48, Y_ROAD+0.012, 5.0, {ol:0});

  BX(root, 2.7, 0.02, 0.22, zb, 3.55, Y_ROAD+0.012, -0.15, {ol:0});

  // 井盖
  const mh = MK(0x4c5361);
  CY(root, 0.42,0.42,0.03, 16, mh, 4.2, Y_ROAD+0.014, 4.2, {ol:0});
  CY(root, 0.42,0.42,0.03, 16, mh, 6.4, Y_ROAD+0.014, 1.1, {ol:0});

  // 人行道（L 形框：让出中央停车场与后巷）
  const pv = MK(0x2f3542, {map:PAVE});
  BX(root, 9.4, Y_PAVE, 1.6, pv, -2.7, Y_PAVE/2, -7.2, {olt:0.012});  // 后（小巷）

  BX(root, 0.8, Y_PAVE, 10,  pv,  1.6, Y_PAVE/2, -3.0, {olt:0.012});  // 右
  BX(root, 1.0, Y_PAVE, 10,  pv, -7.5, Y_PAVE/2, -3.0, {olt:0.012});  // 左

  // 路缘石（框住整块模型）
  const curbM = M.curb;
  BX(root, 10,  0.19, 0.3, curbM, -3.0, 0.095,  2.0, {olt:0.012});
  BX(root, 0.3, 0.19, 10,  curbM,  2.0, 0.095, -3.0, {olt:0.012});
  BX(root, 16,  0.19, 0.3, curbM,  0.0, 0.095,  8.0, {olt:0.012});
  BX(root, 0.3, 0.19, 16,  curbM,  8.0, 0.095,  0.0, {olt:0.012});
  BX(root, 10,  0.19, 0.3, curbM, -3.0, 0.095, -8.0, {olt:0.012});
  BX(root, 0.3, 0.19, 10,  curbM, -8.0, 0.095, -3.0, {olt:0.012});

  // 停车场（店铺前 + 店铺右侧）
  BX(root, 8.2, Y_LOT, 7.8, MK(0x14171d), -2.9, Y_LOT/2, -2.7, {ol:0});
  PL(root, 8.2, 7.8, M.lot, -2.9, Y_LOT+0.002, -2.7, {rx:-Math.PI/2});

  const lines = MB(0xffffff, {transparent:true, map:LOT_LINES, opacity:0.85, depthWrite:false});
  PL(root, 8.2, 3.0, lines, -2.9, Y_LOT+0.006, -0.5, {rx:-Math.PI/2});

  // 排水沟（店前 + 右侧，带格栅）
  const gr = MK(0x565e6c);
  for(let i=-6.6;i<1.4;i+=0.5) BX(root, 0.42, 0.03, 0.30, gr, i, Y_LOT+0.004, 1.14, {ol:0});
  for(let i=-6.4;i<1.4;i+=0.5) BX(root, 0.30, 0.03, 0.42, gr, 1.14, Y_LOT+0.004, i, {ol:0});
  BX(root, 8.0, 0.10, 0.42, MK(0x3a4150), -2.9, Y_LOT-0.03, 1.14, {ol:0});
  BX(root, 0.42, 0.10, 8.0, MK(0x3a4150), 1.14, Y_LOT-0.03, -2.9, {ol:0});
}

const FLOOR_Y = 0.16, WALL_TOP = 3.5, GB = 0.5, GT = 2.85;
const CHX = -1.8, CHZ = -3.2, CHL = 1.22;
const cham = new T.Group();
cham.position.set(CHX, 0, CHZ); cham.rotation.y = Math.PI/4; root.add(cham);

const DRIPS = [];       // 屋檐滴水点
const doors = [];       // 自动门
const flickers = [];    // 闪烁灯光

function buildStoreShell(){
  const wallM  = M.storeWall;
  const bandM  = MK(0x1fa88a, {emissive:0x0d5a4a, ei:0.5});   // 品牌色腰线
  const frameM = M.storeTrim;

  // 地基
  BX(root, 6.16, FLOOR_Y, 3.96, MK(0x5b6270,{map:CONC}), -4, FLOOR_Y/2, -4.3, {ol:0});
  BX(root, 6.3, 0.07, 4.1, MK(0x3d4450), -4, 0.035, -4.3, {ol:0});

  // ---- 背墙 (z=-6.2) ----
  BX(root, 6.14, WALL_TOP-FLOOR_Y, 0.14, wallM, -4, (WALL_TOP+FLOOR_Y)/2, -6.2, {olt:0.02});
  // ---- 左墙 (x=-7) ----
  BX(root, 0.14, WALL_TOP-FLOOR_Y, 3.8, wallM, -7, (WALL_TOP+FLOOR_Y)/2, -4.3, {olt:0.02});
  // 落水管
  CY(root, 0.07,0.07,3.3, 8, M.darkMetal, -6.9, 1.9, -6.05, {ol:0});

  // ---- 正面 (z=-2.4, x -7..-2.6) ----
  const fw = 4.4, fcx = -4.8;
  BX(root, fw, 0.34, 0.16, bandM, fcx, 0.33, -2.4, {olt:0.014});                       // 腰线
  BX(root, fw, WALL_TOP-GT, 0.16, wallM, fcx, (WALL_TOP+GT)/2, -2.4, {olt:0.02});      // 顶楣
  BX(root, 0.16, GT-GB, 0.18, frameM, -6.92, (GT+GB)/2, -2.4, {olt:0.014});            // 端柱
  BX(root, 0.16, GT-GB, 0.18, frameM, -2.66, (GT+GB)/2, -2.4, {olt:0.014});
  [-5.4,-3.9].forEach(mx=> BX(root, 0.1, GT-GB, 0.18, frameM, mx, (GT+GB)/2, -2.4, {olt:0.012}));
  [[-6.15,1.41],[-4.65,1.41],[-3.3,1.11]].forEach(p=>
    PL(root, p[1], GT-GB, M.glass, p[0], (GT+GB)/2, -2.4));

  // ---- 右侧 (x=-1, z -4.0..-6.2) ----
  const rd = 2.2, rcz = -5.1;
  BX(root, 0.16, 0.34, rd, bandM, -1, 0.33, rcz, {olt:0.014});
  BX(root, 0.16, WALL_TOP-GT, rd, wallM, -1, (WALL_TOP+GT)/2, rcz, {olt:0.02});
  BX(root, 0.18, GT-GB, 0.16, frameM, -1, (GT+GB)/2, -3.93, {olt:0.014});
  BX(root, 0.18, GT-GB, 0.16, frameM, -1, (GT+GB)/2, -6.13, {olt:0.014});
  BX(root, 0.18, GT-GB, 0.1, frameM, -1, (GT+GB)/2, -5.03, {olt:0.012});
  [[-5.58,1.01],[-4.48,1.0]].forEach(p=>
    PL(root, p[1], GT-GB, M.glass, -1.0, (GT+GB)/2, p[0], {ry:Math.PI/2}));

  // ---- 切角 (自动门) ----
  BX(cham, CHL*2, 0.34, 0.16, bandM, -0.94, 0.33, 0, {olt:0.014});
  BX(cham, CHL*2, 0.34, 0.16, bandM,  0.94, 0.33, 0, {olt:0.014});
  BX(cham, CHL*2, WALL_TOP-GT, 0.16, wallM, 0, (WALL_TOP+GT)/2, 0, {olt:0.02});
  BX(cham, 0.1, GT-0.5, 0.18, frameM, -1.15, (GT+0.5)/2, 0, {olt:0.012});
  BX(cham, 0.1, GT-0.5, 0.18, frameM,  1.15, (GT+0.5)/2, 0, {olt:0.012});
  PL(cham, 0.42, GT-GB, M.glass, -0.94, (GT+GB)/2, 0);
  PL(cham, 0.42, GT-GB, M.glass,  0.94, (GT+GB)/2, 0);
  // 门框
  BX(cham, 1.66, 0.16, 0.24, frameM, 0, 2.44, 0, {olt:0.014});
  BX(cham, 0.09, 2.28, 0.24, frameM, -0.83, 1.24, 0, {olt:0.012});
  BX(cham, 0.09, 2.28, 0.24, frameM,  0.83, 1.24, 0, {olt:0.012});
  BX(cham, 1.7, 0.06, 0.34, M.metal, 0, 0.19, 0, {ol:0});
  // 门扇
  const dglass = MK(0xb4d8f0, {transparent:true, opacity:0.42, emissive:0x33485c, ei:0.6});
  [-1,1].forEach((s,i)=>{
    const p = BX(cham, 0.75, 2.14, 0.05, dglass, s*0.375, 1.25, 0.02 - i*0.09, {ol:0});
    BX(p, 0.75, 0.11, 0.07, M.metal, 0,  1.0, 0, {ol:0});
    BX(p, 0.75, 0.13, 0.07, M.metal, 0, -1.0, 0, {ol:0});
    BX(p, 0.05, 0.5, 0.07, M.metal, s*0.32, 0, 0, {ol:0});
    doors.push({mesh:p, base:s*0.375, dir:s});
  });

  // ---- 屋顶 ----
  BX(root, 6.34, 0.26, 4.14, MK(0x4b5364), -4, 3.63, -4.3, {olt:0.02});
  [[0,-6.27,6.34,0.12],[0,-2.33,6.34,0.12],[-7.07,0,0.12,4.14],[-0.93,0,0.12,4.14]]
    .forEach(p=> BX(root, p[2], 0.22, p[3], M.storeTrim, p[0]||-4, 3.89, p[1]||-4.3, {olt:0.014}));
  // 屋顶设备
  BX(root, 1.0, 0.5, 0.7, M.metal, -5.6, 3.99, -5.6, {olt:0.014});
  BX(root, 0.55, 0.42, 0.5, M.darkMetal, -2.6, 3.95, -5.9, {olt:0.014});
  CY(root, 0.16,0.16,0.7, 8, M.metal, -3.6, 4.11, -3.2, {ol:0});

  // ---- 招牌底板 / 雨棚 ----
  const canM = M.canopy, canT = M.canopyTop;
  const cyTop = 2.79;

function buildInstanced(geo, list, emis, warm){
  const buckets = PAL.map(()=>[]);
  list.forEach(p=> buckets[(p.c|0) % PAL.length].push(p));
  buckets.forEach((b,i)=>{
    if(!b.length) return;
    const im = new T.InstancedMesh(geo, MK(PAL[i], {emissive:emis||0x4d3a1c, ei:0.5}), b.length);
    const mt = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), s = new T.Vector3();
    b.forEach((p,j)=>{
      e.set(0, p.ry||0, 0); q.setFromEuler(e);
      s.set(p.sx||p.s||1, p.sy||p.s||1, p.sz||p.s||1);
      mt.compose(new T.Vector3(p.x,p.y,p.z), q, s);
      im.setMatrixAt(j, mt);
    });
    im.instanceMatrix.needsUpdate = true;
    root.add(im);
  });
}

  CY(g, 0.33,0.33,0.055, 16, dr,  0.55, 0.33, 0, {rx:Math.PI/2, ol:0});
  CY(g, 0.055,0.055,0.07, 10, M.metal, -0.55, 0.33, 0, {rx:Math.PI/2, ol:0});
  CY(g, 0.055,0.055,0.07, 10, M.metal,  0.55, 0.33, 0, {rx:Math.PI/2, ol:0});

  bar(-0.55,0.33, 0.32,0.78); bar(0.32,0.78, 0.0,0.72);

  CY(g, 0.02,0.02,0.42, 8, M.darkMetal, 0.52, 0.88, 0, {rx:Math.PI/2, ol:0});

  BX(g, 0.26,0.16,0.22, MK(0xb98a54), -0.58, 0.86, 0, {ol:0});    // 车筐

    const ry = Math.atan2(-(z1-z0), (x1-x0));
    const cx=(x0+x1)/2, cz=(z0+z1)/2;
    [0.78, 1.06].forEach(h=>{
      const b = BX(root, len, 0.07, 0.07, pm, cx, Y_PAVE+h-0.35, cz, {ol:0});
      b.rotation.y = ry;

    for(let i=0;i<=n;i++){

      CY(root, 0.045,0.045,0.72, 8, pm, x0+(x1-x0)*t, Y_PAVE+0.36, z0+(z1-z0)*t, {ol:0});

  seg(1.85, -6.0, 1.85, 1.3);
}

  root.add(m); return m;
}

/* ============================================================
   积水 / 雨 / 波纹 / 蒸汽
   ============================================================ */
const SOLID = [ {x0:-7.15,x1:-0.85,z0:-6.35,z1:-2.25,h:4.0},
                {x0:-8.10,x1:-0.45,z0:-8.10,z1:-7.40,h:7.0} ];
function inSolid(x,z){
  for(let i=0;i<SOLID.length;i++){ const s=SOLID[i];
    if(x>s.x0 && x<s.x1 && z>s.z0 && z<s.z1) return s.h; }
  return 0;
}
function surfaceY(x,z){
  if(x > 2 || z > 2) return Y_ROAD;
  if(z < -6.6 || x < -7) return Y_PAVE;
  if(z > 1.2 || x > 1.2) return Y_PAVE;
  return Y_LOT;
}

/* ---- 积水 ---- */
function puddle(x,y,z,w,d,color,op){
  const dark = MB(0x070c14, {transparent:true, map:RAD_TEX, opacity:op||0.78, depthWrite:false});
  const p = PL(root, w, d, dark, x, y, z, {rx:-Math.PI/2});
  p.scale.set(R(0.85,1.15), R(0.8,1.2), 1);
  const sh = MB(color||0x6f8dc8, {transparent:true, map:RAD_TEX, blending:T.AdditiveBlending, opacity:0.16, depthWrite:false});
  PL(root, w*0.62, d*0.5, sh, x+w*0.06, y+0.004, z, {rx:-Math.PI/2});
}
function buildPuddles(){
  [[0.6,4.6,2.6,1.7,0x8fb4f0],[-2.6,6.3,3.0,1.9,0x7fa0e0],[5.6,5.4,2.4,2.0,0x6f8dc8],
   [6.6,-2.2,2.2,2.6,0x8fb4f0],[3.2,-5.6,2.6,1.8,0x6f8dc8],[7.0,3.0,1.8,2.2,0x8fb4f0],
   [-6.0,6.5,2.8,1.6,0x7fa0e0]].forEach(p=> puddle(p[0], Y_ROAD+0.009, p[1], p[2], p[3], p[4], 0.8));
  [[-2.0,-1.0,1.8,1.2,0xffc978],[-5.6,0.3,1.5,1.0,0xffc978],[0.35,-1.7,1.6,1.1,0xbfe8ff],
   [-1.0,-5.2,1.4,1.0,0xffb060],[-3.2,0.95,2.0,1.0,0xffc978],[0.6,-3.6,1.3,1.6,0xbfe8ff]]
   .forEach(p=> puddle(p[0], Y_LOT+0.012, p[1], p[2], p[3], p[4], 0.72));
  [[-4.6,-7.0,1.4,0.7,0xffb060],[-2.2,-7.25,1.0,0.6,0xffb060]]
   .forEach(p=> puddle(p[0], Y_PAVE+0.012, p[1], p[2], p[3], p[4], 0.7));
}
buildPuddles();

/* ---- 玻璃雨水（着色器） ---- */
const glassMats = [];
function makeGlassRain(w,h, x,y,z, ry, parent){
  const mat = new T.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uAspect:{value:w/h}, uOpacity:{value:0.38},
               uColor:{value:new T.Color(0xcfe8ff)} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform float uTime; uniform float uAspect; uniform float uOpacity; uniform vec3 uColor;',
      'float h11(float p){ return fract(sin(p*127.1)*43758.5453); }',
      'void main(){',
      '  vec2 uv=vUv; float a=0.0;',
      '  for(int i=0;i<18;i++){ float fi=float(i);',
      '    vec2 c=vec2(h11(fi*1.37), h11(fi*3.11));',
      '    float r=0.005+h11(fi*5.7)*0.011;',
      '    float d=distance(vec2(uv.x*uAspect,uv.y), vec2(c.x*uAspect,c.y));',
      '    a += smoothstep(r,0.0,d)*(0.30+0.45*h11(fi*7.3)); }',
      '  for(int i=0;i<6;i++){ float fi=float(i)+30.0;',
      '    float cx=h11(fi*1.7); float sp=0.10+h11(fi*2.3)*0.24;',
      '    float y=fract(h11(fi*4.1)-uTime*sp);',
      '    float dx=abs(uv.x-cx);',
      '    float head=smoothstep(0.017,0.002,dx)*smoothstep(0.06,0.0,abs(uv.y-y));',
      '    float trail=smoothstep(0.008,0.0,dx)*(1.0-smoothstep(0.0,0.24,y-uv.y))*step(uv.y,y);',
      '    a += head*0.5+trail*0.2; }',
      '  gl_FragColor=vec4(uColor, clamp(a,0.0,1.0)*uOpacity); }'
    ].join('\n'),
    transparent:true, depthWrite:false
  });
  glassMats.push(mat);
  const p = new T.Mesh(new T.PlaneGeometry(w,h), mat);
  p.position.set(x,y,z); if(ry) p.rotation.y = ry;
  (parent||root).add(p);
}
makeGlassRain(4.40, 2.35, -4.80, 1.675, -2.30, 0);
makeGlassRain(2.20, 2.35, -0.92, 1.675, -5.10, Math.PI/2);
makeGlassRain(2.44, 2.35, 0, 1.675, 0.09, 0, cham);

/* ---- 雨 ---- */
const RAIN_N = 1700;
const rainGeo = new T.BufferGeometry();
const rainPos = new Float32Array(RAIN_N*6);
const rainY = new Float32Array(RAIN_N);
const rainX = new Float32Array(RAIN_N);
const rainZ = new Float32Array(RAIN_N);
const rainV = new Float32Array(RAIN_N);
const rainL = new Float32Array(RAIN_N);
for(let i=0;i<RAIN_N;i++){
  let x, z, guard=0;
  do{ x = R(-11,11); z = R(-11,11); guard++; }while(guard<12 && (x<-9.5||x>9.5||z<-9.5||z>9.5));
  rainX[i]=x; rainZ[i]=z; rainY[i]=R(0,13); rainV[i]=R(11,17); rainL[i]=R(0.4,0.95);
}
rainGeo.setAttribute('position', new T.BufferAttribute(rainPos, 3));
const rain = new T.LineSegments(rainGeo, new T.LineBasicMaterial({color:0xa9c9f5, transparent:true, opacity:0.32}));
rain.frustumCulled = false; root.add(rain);

function updateRain(dt){
  const p = rainPos;
  for(let i=0;i<RAIN_N;i++){
    let y = rainY[i] - rainV[i]*dt;
    if(y < -0.2){ y = R(11,13.5); rainX[i]=R(-11,11); rainZ[i]=R(-11,11); }
    rainY[i]=y;
    const j=i*6, x=rainX[i], z=rainZ[i], l=rainL[i];
    const roof = inSolid(x,z);
    if(roof && y < roof){ p[j]=x;p[j+1]=-80;p[j+2]=z; p[j+3]=x;p[j+4]=-80;p[j+5]=z; continue; }
    p[j]=x; p[j+1]=y; p[j+2]=z;
    p[j+3]=x+0.055*l; p[j+4]=y+l; p[j+5]=z+0.03*l;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

/* ---- 屋檐滴水 ---- */
const drips = DRIPS.map(p=>{
  const m = new T.Mesh(new T.SphereGeometry(0.032, 8, 6),
    MB(0xd6ecff, {transparent:true, opacity:0.9}));
  m.scale.set(1, 2.4, 1); root.add(m);
  return {m, o:p, y:R(0.2, 2.6), v:R(2.2,3.2)};
});
function updateDrips(dt){
  drips.forEach(d=>{
    d.y -= d.v*dt;
    if(d.y < 0.06){ d.y = 2.70; spawnRipple(d.o.x, Y_LOT+0.02, d.o.z, 0.9); }
    d.m.position.set(d.o.x, d.y, d.o.z);
    const k = clamp((2.72-d.y)/2.6, 0, 1);
    d.m.scale.set(1, 2.0+k*3.5, 1);
    d.m.material.opacity = 0.9 - k*0.25;
  });
}

/* ---- 水波纹 ---- */
const ripples = [];
const ringGeo = new T.RingGeometry(0.06, 0.105, 22);
for(let i=0;i<80;i++){
  const m = new T.Mesh(ringGeo, MB(0xa8cff0, {transparent:true, opacity:0, blending:T.AdditiveBlending, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.visible = false; root.add(m);
  ripples.push({m: m, t: 0, dur: 1, s0: 0.4, s1: 1.8, alive: false});
}
function spawnRipple(x, y, z, scale){
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    if(r.alive) continue;
    r.alive = true; r.t = 0; r.dur = R(0.85,1.5);
    r.s0 = 0.35*scale; r.s1 = R(1.4,2.2)*scale;
    r.m.position.set(x,y,z); r.m.visible = true;
    return r;
  }
}
function updateRipples(dt){
  let spawn = 0;
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    if(!r.alive) continue;
    r.t += dt/r.dur;
    if(r.t >= 1){ r.alive=false; r.m.visible=false; continue; }
    const s = r.s0 + (r.s1-r.s0)*r.t;
    r.m.scale.set(s, s, 1);
    r.m.material.opacity = (1-r.t)*(1-r.t)*0.75;
  }
  // 随机补新
  spawn += dt*26;
  while(spawn > 0){
    spawn -= 1;
    if(Math.random() > 0.55) continue;
    const x = R(-8,8), z = R(-8,8);
    if(inSolid(x,z)) continue;
    spawnRipple(x, surfaceY(x,z)+0.022, z, R(0.5,1.3));
  }
}

/* ---- 关东煮蒸汽 ---- */
const steam = [];
for(let i=0;i<8;i++){
  const s = new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:0xffffff, transparent:true,
    opacity:0, blending:T.AdditiveBlending, depthWrite:false}));
  root.add(s);
  steam.push({s: s, t: Math.random()});
}
function updateSteam(dt){
  steam.forEach(st=>{
    st.t += dt*0.30;
    if(st.t > 1) st.t -= 1;
    const t = st.t;
    st.s.position.set(-2.06 + R(-0.01,0.01), 1.74 + t*0.95, -3.88 + t*0.12);
    const s = 0.20 + t*0.85;
    st.s.scale.set(s, s*1.2, 1);
    st.s.material.opacity = Math.sin(t*Math.PI)*0.30;
  });
}

/* ---- 雨声音效（Web Audio 程序化合成，完全离线） ---- */
const snd = { ctx:null, gain:null, lfoG:null, on:false, vol:0.55 };
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  snd.ctx = new AC();
  // 2 秒噪声循环，轻度粉红化，接近雨声底噪
  const len = snd.ctx.sampleRate * 2;
  const buf = snd.ctx.createBuffer(1, len, snd.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let l0=0, l1=0;
  for(let i=0;i<len;i++){
    const w = Math.random()*2-1;
    l0 = 0.97*l0 + 0.03*w;
    l1 = 0.85*l1 + 0.15*w;
    d[i] = (l0*2.2 + l1*0.8 + w*0.12) * 0.42;
  }
  const src = snd.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const hp = snd.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
  const lp = snd.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=0.4;
  snd.gain = snd.ctx.createGain(); snd.gain.gain.value=0;
  src.connect(hp); hp.connect(lp); lp.connect(snd.gain); snd.gain.connect(snd.ctx.destination);
  src.start();
  // 缓慢起伏，模拟雨势变化
  const lfo = snd.ctx.createOscillator(); lfo.frequency.value=0.09;
  snd.lfoG = snd.ctx.createGain(); snd.lfoG.gain.value=0;
  lfo.connect(snd.lfoG); snd.lfoG.connect(snd.gain.gain); lfo.start();
}
(function(){
  const btn=document.getElementById('sndBtn'), vol=document.getElementById('sndVol'),
        icOn=document.getElementById('icOn'), icOff=document.getElementById('icOff');
  btn.addEventListener('click', ()=>{
    if(!snd.ctx) sndBuild();
    if(!snd.ctx) return;
    if(snd.ctx.state==='suspended') snd.ctx.resume();
    snd.on = !snd.on;
    icOn.style.display  = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none'  : 'block';
    const t = snd.ctx.currentTime;
    snd.gain.gain.setTargetAtTime(snd.on ? snd.vol*0.9 : 0, t, 0.5);
    snd.lfoG.gain.setTargetAtTime(snd.on ? snd.vol*0.15 : 0, t, 0.5);
  });
  vol.addEventListener('input', ()=>{
    snd.vol = vol.value/100;
    if(snd.on){
      const t = snd.ctx.currentTime;
      snd.gain.gain.setTargetAtTime(snd.vol*0.9, t, 0.15);
      snd.lfoG.gain.setTargetAtTime(snd.vol*0.15, t, 0.15);
    }
  });
  // 兜底：若浏览器挂起了音频上下文，任意画布点击时自动恢复
  renderer.domElement.addEventListener('pointerdown', ()=>{
    if(snd.ctx && snd.ctx.state==='suspended') snd.ctx.resume();
  });
})();

/* ============================================================
   动画
   ============================================================ */
let time = 0, last = performance.now();
let flickV = 1, doorK = 0, doorOpen = false, doorT = 0, doorNext = 7;
const TRAF_NEXT = {2:1, 1:0, 0:2};
const TRAF_DUR  = {2:7.5, 1:1.8, 0:8.0};
const TRAF_COL  = {2:0x66ff9c, 1:0xf2b23c, 0:0xe8483f};

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  time += dt;

  /* 相机 */
  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.88;
  ctrl.phi = clamp(ctrl.phi, 0.20, 1.36);
  ctrl.r   = clamp(ctrl.r, 9, 62);
  if(ctrl.dragging) ctrl.idle = 0; else ctrl.idle += dt;
  if(ctrl.idle > 5) ctrl.theta += dt*0.009;
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 雨 / 水 */
  updateRain(dt);
  updateDrips(dt);
  updateRipples(dt);
  updateSteam(dt);
  for(let i=0;i<glassMats.length;i++) glassMats[i].uniforms.uTime.value = time;

  /* 招牌闪烁 */
  flickV += (1 - flickV) * Math.min(1, dt*5);
  if(Math.random() < dt*0.55) flickV = 0.25 + Math.random()*0.25;
  const fv = 0.72 + 0.28*flickV;
  L.sign.intensity = 0.85*fv;
  L.vend.intensity = 0.75*(0.86+0.14*flickV);
  L.pole.intensity = 0.70*(0.88+0.12*flickV);
  flickers.forEach(f=>{ f.obj.material.opacity = f.base*(0.55+0.45*flickV)*(0.95+0.05*Math.sin(time*f.sp)); });

  /* 自动门 */
  doorT += dt;
  if(!doorOpen && doorT > doorNext){ doorOpen = true; doorT = 0; }
  else if(doorOpen && doorT > 4.2){ doorOpen = false; doorT = 0; doorNext = R(9, 22); }
  const tgt = doorOpen ? 1 : 0;
  doorK += (tgt - doorK) * Math.min(1, dt*2.2);
  const e = doorK*doorK*(3-2*doorK);
  doors.forEach(d=>{ d.mesh.position.x = d.base + d.dir*0.75*e; });

  /* 交通信号 */
  traffic.t += dt;
  if(traffic.t > TRAF_DUR[traffic.phase]){
    traffic.t = 0; traffic.phase = TRAF_NEXT[traffic.phase];
    setTraffic(traffic.phase);
    const c = TRAF_COL[traffic.phase];
    L.traf.color.setHex(c);
    traffic.poolLamp.material.color.setHex(c);
  }
  L.traf.intensity = 0.45 + 0.06*Math.sin(time*2.1);

  renderer.render(scene, camera);
}
animate();
