<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暮雾车站 · Misty Terminus</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#aeb4ae;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 55% 50%, rgba(150,168,158,.10), rgba(0,0,0,0) 65%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 46%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 40%, rgba(168,174,168,1) 74%, rgba(70,78,72,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(90,105,98,.45);
          background:rgba(226,230,224,.55);color:#3e4a44;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(70,85,78,.8);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(80,95,88,.4);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#3e4a44;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#3e4a44;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="风声 · 信号铃声与火车汽笛 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="55"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   暮雾车站 · 欧式郊外废弃火车站 三渲二微缩景观 (three.js r128 / 完全离线)
   暮秋薄雾 / 荒芜怀旧 / 室内残灯 vs 室外冷雾
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const EU = '"Palatino Linotype",Georgia,"Times New Roman",serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xb4bab3, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0xb4bab3);
scene.fog = new T.Fog(0xb4bab3, 13, 52);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 300);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(0,1.35,-0.4), r:26, theta:0.55, phi:1.04,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.34,0.55,0.74,0.89,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM = new T.MeshBasicMaterial({color:0x2a2e2c, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x241c10, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity = (o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.emissiveMap) p.emissiveMap = o.emissiveMap;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.055) return null;
  const k = t===undefined?0.017:t;
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
/** 盒子：parent, 宽高深, 材质, 坐标, 选项{rx,ry,rz,ol(0=不描边),olt,warm} */
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
/** 平面：默认朝 +z；ry 旋转 */
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

/* 径向光晕（灯光池 / 辉光 / 雾团） */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
/* 接触阴影 */
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.72)'); g.addColorStop(0.55,'rgba(0,0,0,0.30)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();

/* ---- 秋草地面（含落叶斑点） ---- */
const GRASS = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#7c7b54'; x.fillRect(0,0,512,512);
  for(let i=0;i<80;i++){
    x.fillStyle='rgba('+R(96,132).toFixed(0)+','+R(98,128).toFixed(0)+','+R(58,80).toFixed(0)+',0.45)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(24,100), R(16,70), Math.random()*3, 0, 6.2832); x.fill();
  }
  // 枯草丛
  for(let i=0;i<500;i++){
    x.strokeStyle='rgba('+R(120,160).toFixed(0)+','+R(104,130).toFixed(0)+','+R(56,80).toFixed(0)+',0.5)';
    x.lineWidth=1.2;
    const gx=Math.random()*512, gy=Math.random()*512;
    x.beginPath(); x.moveTo(gx,gy); x.lineTo(gx+R(-4,4), gy-R(4,10)); x.stroke();
  }
  // 落叶碎点
  const lc=['rgba(154,106,48,0.55)','rgba(176,129,60,0.5)','rgba(120,84,40,0.5)','rgba(186,150,80,0.4)'];
  for(let i=0;i<700;i++){
    x.fillStyle=lc[(Math.random()*lc.length)|0];
    x.save(); x.translate(Math.random()*512, Math.random()*512); x.rotate(Math.random()*3);
    x.beginPath(); x.ellipse(0,0,R(1.5,4),R(0.8,1.8),0,0,6.2832); x.fill(); x.restore();
  }
  speckle(x,512,512,1600,1.6,0.08);
  return TX(c,3,3);
})();
/* ---- 碎石道砟 ---- */
const BALLAST = (function(){
  const c=CV(512,256), x=c.getContext('2d');
  x.fillStyle='#87826f'; x.fillRect(0,0,512,256);
  for(let i=0;i<900;i++){
    const g=R(96,150)|0;
    x.fillStyle='rgba('+g+','+(g-6)+','+(g-22)+',0.85)';
    x.save(); x.translate(Math.random()*512, Math.random()*256); x.rotate(Math.random()*3);
    x.fillRect(0,0,R(2,6),R(2,5)); x.restore();
  }
  speckle(x,512,256,1200,1.4,0.12);
  return TX(c,2,1);
})();
/* ---- 站台水泥板 ---- */
const PLAT = (function(){
  const c=CV(512,256), x=c.getContext('2d');
  x.fillStyle='#969084'; x.fillRect(0,0,512,256);
  speckle(x,512,256,2400,1.8,0.09);
  x.strokeStyle='rgba(58,62,58,0.4)'; x.lineWidth=3;
  for(let i=0;i<=4;i++){ const p=i*128; x.beginPath(); x.moveTo(p,0); x.lineTo(p,256); x.stroke(); }
  for(let j=0;j<=2;j++){ const p=j*128; x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  // 污渍与裂纹
  for(let i=0;i<26;i++){
    x.strokeStyle='rgba(52,54,50,0.35)'; x.lineWidth=1.4;
    const sx=Math.random()*512, sy=Math.random()*256;
    x.beginPath(); x.moveTo(sx,sy);
    for(let k=0;k<4;k++) x.lineTo(sx+R(-26,26), sy+R(-16,16));
    x.stroke();
  }
  for(let i=0;i<24;i++){
    x.fillStyle='rgba(88,88,66,'+R(0.08,0.2).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*256, R(14,60), R(8,30), Math.random()*3, 0, 6.2832); x.fill();
  }
  return TX(c,3,1);
})();
/* ---- 老石砌墙（层石） ---- */
const STONE = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#b1a78f'; x.fillRect(0,0,512,512);
  for(let row=0;row<8;row++){
    const y=row*64;
    x.fillStyle='rgba('+R(168,186)|0+','+(R(158,176)|0)+','+(R(132,150)|0)+',0.5)';
    x.fillRect(0,y,512,64);
    x.strokeStyle='rgba(90,86,72,0.5)'; x.lineWidth=3;
    x.beginPath(); x.moveTo(0,y); x.lineTo(512,y); x.stroke();
    const off=(row%2)*64;
    for(let cx=off;cx<512;cx+=128){
      x.beginPath(); x.moveTo(cx,y); x.lineTo(cx,y+64); x.stroke();
    }
  }
  // 风化斑块
  for(let i=0;i<40;i++){
    x.fillStyle='rgba('+(R(70,100)|0)+','+(R(72,96)|0)+','+(R(52,72)|0)+','+R(0.05,0.16).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(12,60), R(10,44), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,2000,1.6,0.08);
  return TX(c,3,2);
})();
/* ---- 石板瓦屋顶 ---- */
const ROOF = (function(){
  const c=CV(512,256), x=c.getContext('2d');
  x.fillStyle='#6e675c'; x.fillRect(0,0,512,256);
  for(let row=0;row<8;row++){
    const y=row*32;
    for(let i=0;i<16;i++){
      const w=32;
      x.fillStyle='rgba('+(R(96,124)|0)+','+(R(90,116)|0)+','+(R(80,104)|0)+',0.75)';
      x.fillRect(i*w+(row%2)*16, y, w-2, 30);
    }
  }
  x.strokeStyle='rgba(44,44,40,0.4)'; x.lineWidth=2;
  for(let i=0;i<20;i++){
    const sx=Math.random()*512, sy=Math.random()*256;
    x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+R(-18,18), sy+R(10,40)); x.stroke();
  }
  speckle(x,512,256,1400,1.5,0.1);
  return TX(c,3,2);
})();
/* ---- 旧木板 ---- */
const WOOD = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#7a5f42'; x.fillRect(0,0,256,256);
  for(let i=0;i<8;i++){
    const y=i*32;
    x.fillStyle='rgba('+(R(96,130)|0)+','+(R(74,102)|0)+','+(R(48,70)|0)+',0.5)';
    x.fillRect(0,y,256,32);
    x.strokeStyle='rgba(46,34,20,0.55)'; x.lineWidth=2;
    x.beginPath(); x.moveTo(0,y); x.lineTo(256,y); x.stroke();
    for(let k=0;k<5;k++){
      x.strokeStyle='rgba(58,42,24,0.3)'; x.lineWidth=1;
      x.beginPath(); x.moveTo(0,y+R(4,28)); x.bezierCurveTo(80,y+R(4,28),180,y+R(4,28),256,y+R(4,28)); x.stroke();
    }
  }
  speckle(x,256,256,900,1.4,0.1);
  return TX(c,2,2);
})();
/* ---- 候车厅磨损地砖 ---- */
const TILE = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  const m=['#c9bda0','#a97e5e'];
  for(let r=0;r<8;r++) for(let i=0;i<8;i++){
    x.fillStyle=m[(r+i)%2];
    x.fillRect(i*64, r*64, 64, 64);
  }
  x.strokeStyle='rgba(84,72,56,0.45)'; x.lineWidth=2;
  for(let i=0;i<=8;i++){ const p=i*64; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke(); x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  // 磨损 / 灰尘
  for(let i=0;i<40;i++){
    x.fillStyle='rgba(120,110,88,'+R(0.1,0.28).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(10,50), R(8,36), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,1500,1.5,0.09);
  return TX(c,2,2);
})();
/* ---- 室内生锈铁皮（取暖炉） ---- */
const IRON_STOVE = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.fillStyle='#3c3a38'; x.fillRect(0,0,128,128);
  for(let i=0;i<40;i++){
    x.fillStyle='rgba('+(R(110,160)|0)+','+(R(60,86)|0)+','+(R(30,48)|0)+','+R(0.1,0.35).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*128, Math.random()*128, R(4,18), R(3,12), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,128,128,400,1.4,0.15);
  return TX(c,1,1);
})();
/* ---- 货运车厢木板 + 锈迹 ---- */
const WAGON = (function(){
  const c=CV(512,256), x=c.getContext('2d');
  for(let i=0;i<8;i++){
    const y=i*32;
    x.fillStyle='rgba('+(R(118,150)|0)+','+(R(88,112)|0)+','+(R(58,76)|0)+',0.6)';
    x.fillRect(0,y,512,32);
    x.strokeStyle='rgba(52,38,24,0.6)'; x.lineWidth=2.4;
    x.beginPath(); x.moveTo(0,y); x.lineTo(512,y); x.stroke();
  }
  // 锈迹流淌
  for(let i=0;i<30;i++){
    x.fillStyle='rgba('+(R(120,160)|0)+','+(R(66,90)|0)+','+(R(30,48)|0)+','+R(0.12,0.32).toFixed(2)+')';
    const sx=Math.random()*512, sy=Math.random()*200;
    x.beginPath(); x.ellipse(sx, sy, R(4,14), R(16,60), 0, 0, 6.2832); x.fill();
  }
  // 褪色大字
  x.save();
  x.fillStyle='rgba(228,222,206,0.55)';
  x.font='bold 92px '+EU; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('NORD', 256, 96);
  x.font='bold 40px '+EU;
  x.fillText('N° 7342 · VONS EST', 256, 190);
  x.restore();

function buildSiding(){
  // 道岔侧线：主线 → 右前方弯出
  const pts=[];
  for(let i=0;i<=24;i++){
    const t=i/24;
    pts.push(new T.Vector3(2.4+5.6*t, 0.165, TRACK_Z + 2.5*t*t));
  }
  const curve = new T.CatmullRomCurve3(pts);
  // 轨枕
  for(let i=1;i<24;i++){
    const t=i/24;
    const p=curve.getPoint(t), tan=curve.getTangent(t);
    const ry=Math.atan2(-tan.z, tan.x);
    BX(root, 0.22, 0.06, 1.05, M.woodDark, p.x, 0.10, p.z, {ol:0, ry:ry});
  }
  // 侧线道砟
  const bpts=[];
  for(let i=0;i<=24;i++){
    const t=i/24;
    bpts.push(new T.Vector3(2.4+5.6*t, 0.005, TRACK_Z + 2.5*t*t));
  }
  // 两条钢轨（沿曲线偏移）
  const up = new T.Vector3(0,1,0);
  [-1,1].forEach(s=>{
    const ops=[];
    for(let i=0;i<=24;i++){
      const t=i/24;
      const p=curve.getPoint(t), tan=curve.getTangent(t);
      const side=new T.Vector3().crossVectors(tan,up).normalize().multiplyScalar(0.36*s);
      ops.push(p.clone().add(side));
    }
    const oc=new T.CatmullRomCurve3(ops);
    const tube=new T.Mesh(new T.TubeGeometry(oc, 32, 0.045, 6, false), M.rail);
    root.add(tube);
  });
}

const FLR = 0.14, WT = 4.5;          // 室内地板 / 墙高

const BCX=(BX0+BX1)/2, BCZ=(BZ0+BZ1)/2;
const glassFogMats = [];   // 玻璃雾气着色器

function makeGlassFog(w,h, x,y,z, ry){
  const mat = new T.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uAspect:{value:w/h}, uOpacity:{value:0.24},
               uColor:{value:new T.Color(0xdfe8dd)} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform float uTime; uniform float uAspect; uniform float uOpacity; uniform vec3 uColor;',
      'float h11(float p){ return fract(sin(p*127.1)*43758.5453); }',
      'void main(){',
      '  vec2 uv=vUv; float a=0.0;',
      '  for(int i=0;i<12;i++){ float fi=float(i);',
      '    vec2 c=vec2(h11(fi*1.37), h11(fi*3.11));',
      '    c.y=fract(c.y + uTime*0.018*(0.5+h11(fi*2.7)));',
      '    c.x+=sin(uTime*0.11+fi)*0.02;',
      '    float r=0.10+h11(fi*5.7)*0.16;',
      '    float d=distance(vec2(uv.x*uAspect,uv.y), vec2(c.x*uAspect,c.y));',
      '    a += smoothstep(r,0.0,d)*(0.16+0.20*h11(fi*7.3)); }',
      '  a *= 0.45+0.55*smoothstep(1.0,0.15,uv.y);',   // 底部雾气更重
      '  gl_FragColor=vec4(uColor, clamp(a,0.0,1.0)*uOpacity); }'
    ].join('\n'),
    transparent:true, depthWrite:false
  });
  glassFogMats.push(mat);
  const p = new T.Mesh(new T.PlaneGeometry(w,h), mat);
  p.position.set(x,y,z); if(ry) p.rotation.y = ry;
  root.add(p);
}

/* ---- 铁艺栅栏 ---- */
function fenceSeg(x0,z0,x1,z1, tilt){
  const len = Math.hypot(x1-x0, z1-z0);
  const ry = Math.atan2(-(z1-z0), (x1-x0));
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  [0.5, 0.78].forEach(h=>{
    const b = BX(root, len, 0.05, 0.05, M.ironFence2, cx, h, cz, {ol:0});
    b.rotation.y = ry;
  });
  const n = Math.max(2, Math.round(len/1.1));
  for(let i=0;i<=n;i++){
    const t=i/n;
    const p = CY(root, 0.028,0.028,0.85, 8, M.ironFence, x0+(x1-x0)*t, 0.425, z0+(z1-z0)*t, {ol:0});
    if(tilt && i===n-1){ p.rotation.z = tilt; p.position.y = 0.38; }
    // 枪尖
    CY(root, 0.001,0.028,0.09, 6, M.ironFence2, x0+(x1-x0)*t, 0.895, z0+(z1-z0)*t, {ol:0});
  }
}

/* ---- 枯树 ---- */
function deadTree(x, z, s){
  const g = new T.Group(); g.position.set(x, GY, z); g.scale.setScalar(s||1); root.add(g);
  CY(g, 0.07,0.17,2.4, 8, M.trunk, 0, 1.2, 0, {olt:0.016});
  const branch=(h, a, l, rz)=>{
    const b = CY(g, 0.03,0.055,l, 6, M.trunk, Math.sin(a)*l*0.5, h, Math.cos(a)*l*0.5, {ol:0});
    b.rotation.z = rz*Math.cos(a*0.5);
    b.rotation.x = rz*Math.sin(a*0.5)*0.7;
    return b;
  };
  branch(2.1, 0.4, 1.1, 0.9);
  branch(1.9, 2.2, 1.0, 0.8);
  branch(2.3, 4.2, 1.2, 0.9);
  branch(1.6, 5.3, 0.8, 1.0);
  branch(2.45, 1.2, 0.7, 0.7);
  shadowBlob(x, GY+0.01, z, 2.2*(s||1), 2.2*(s||1), 0.45);
}

function bush(x, z, s, c){
  const mats=[M.bush1, M.bush2, M.bush3];

  for(let i=0;i<3;i++){

    sp.position.set(x+R(-0.3,0.3)*(s||1), R(0.16,0.3)*(s||1), z+R(-0.3,0.3)*(s||1));
    sp.scale.y = 0.72; root.add(sp); addOL(sp, 0.014);
  }
}

function oldLamp(x, z, baseY, h, armDir){
  const g = new T.Group(); g.position.set(x, baseY, z); root.add(g);
  CY(g, 0.06,0.09,h, 8, M.darkMetal, 0, h/2, 0, {olt:0.012});
  BX(g, 0.6, 0.07, 0.07, M.darkMetal, armDir*0.3, h+0.02, 0, {ol:0});
  // 灯罩 + 灯泡
  CY(g, 0.13,0.06,0.18, 8, MK(0x3c423c), armDir*0.58, h-0.13, 0, {olt:0.01});
  const bulb = new T.Mesh(new T.SphereGeometry(0.075, 10, 8), MB(0xffe2b0));
  bulb.position.set(armDir*0.58, h-0.24, 0); g.add(bulb);
  CY(g, 0.02,0.02,0.1, 6, M.darkMetal, armDir*0.58, h-0.16, 0, {ol:0});
  const gs = glowSprite(x+armDir*0.58, baseY+h-0.24, z, 2.0, 2.0, 0xffd898, 0.34);
  const pl = ptLight('lamp'+lamps.length, 0xffcf90, 0.85, 8.0, x+armDir*0.58, baseY+h-0.3, z);
  shadowBlob(x, baseY+0.012, z, 1.0, 1.0, 0.45);
  lamps.push({glow:gs, light:pl, base:0.34, phase:R(0,6.28)});
  return g;
}

    const vy=R(0.5,4.2), vz=R(BZ0+0.3,BZ1-0.3);
    const lf = PL(root, R(0.14,0.24), R(0.1,0.18), MK(Math.random()>0.5?0x5c6238:0x6e5c2e),
                  BX0-0.03, vy, vz, {ry:-Math.PI/2});
    lf.rotation.z = R(0,6.28);

    if(i%2===0) CY(root, 0.012,0.02,R(0.6,1.6), 5, M.vine, BX0-0.05, vy-0.5, vz, {ol:0});
  }
  // 檐下悬垂（会摆动）
  [[BX0-0.05, -2.6],[BX0-0.05, -3.6],[BX0-0.05, -4.6],[BX1+0.05, -3.0],[BX1+0.05, -4.4]].forEach((p,i)=>{
    const strand = new T.Group(); strand.position.set(p[0], 4.55, p[1]); root.add(strand);
    const ln = R(0.7,1.4);
    CY(strand, 0.012,0.02,ln, 5, M.vine, 0, -ln/2, 0, {ol:0});
    for(let k=0;k<4;k++){

      lf.rotation.z = R(0,6.28);
    }
    vineSway.push({g:strand, phase:R(0,6.28), amp:R(0.05,0.1)});
  });
}

/* ============================================================
   地面落叶（静态铺陈） + 地面翻动叶
   ============================================================ */
const LEAF_COL = [0xa87a3a, 0x8a5c2c, 0x6e4e26];
(function buildGroundLeaves(){
  const geo = new T.PlaneGeometry(0.16, 0.11);
  const inBuilding = (x,z)=> x>BX0-0.2 && x<BX1+0.2 && z<BZ0+0.2 && z>BZ1-0.2;
  const inPlat = (x,z)=> x>-6.5 && x<3.1 && z<-0.55 && z>-2.45;
  LEAF_COL.forEach(col=>{
    const im = new T.InstancedMesh(geo, MK(col, {side:T.DoubleSide}), 46);
    const mt = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), s = new T.Vector3();
    let placed = 0, guard=0;
    while(placed<46 && guard<400){
      guard++;
      const x=R(-7.7,7.7), z=R(-7.7,7.7);
      if(inBuilding(x,z)) continue;
      let y = GY+0.012;
      if(inPlat(x,z)) y = PLAT_H+0.014;
      e.set(-Math.PI/2+R(-0.2,0.2), R(0,6.28), R(-0.3,0.3));
      q.setFromEuler(e);
      s.set(R(0.7,1.4), R(0.7,1.4), 1);
      mt.compose(new T.Vector3(x,y,z), q, s);
      im.setMatrixAt(placed, mt);
      placed++;
    }
    im.count = placed;
    im.instanceMatrix.needsUpdate = true;
    root.add(im);
  });
})();

/* ============================================================
   落叶飘落 / 白雾流动
   ============================================================ */
const fallLeaves = [];
for(let i=0;i<52;i++){
  const m = PL(root, R(0.1,0.17), R(0.07,0.12), MK(LEAF_COL[i%3], {side:T.DoubleSide}), 0, -5, 0);
  fallLeaves.push({
    m, x:R(-8,8), y:R(1.5,9), z:R(-8,8),
    vy:R(0.35,0.75), ph:R(0,6.28), sp:R(0.7,1.6), rx:R(0.5,1.6), rz:R(0.4,1.4)
  });
}
function updateLeaves(dt, time){
  fallLeaves.forEach(f=>{
    f.y -= f.vy*dt;
    f.x += Math.sin(time*f.sp + f.ph)*dt*0.55;
    f.z += Math.cos(time*f.sp*0.8 + f.ph)*dt*0.4;
    if(f.y < 0.05 || Math.abs(f.x)>8.2 || Math.abs(f.z)>8.2){
      f.y = R(6,9.5); f.x = R(-8,8); f.z = R(-8,8);
    }
    f.m.position.set(f.x, f.y, f.z);
    f.m.rotation.x = time*f.rx + f.ph;
    f.m.rotation.z = time*f.rz + f.ph*0.7;
  });
  // 地面叶被风小幅翻动
  groundFlutter.forEach(g=>{
    g.m.rotation.x = -Math.PI/2 + Math.sin(time*2.2 + g.phase)*g.amp;
    g.m.rotation.z = Math.cos(time*1.7 + g.phase)*g.amp*0.6;
  });
}

const mists = [];
for(let i=0;i<11;i++){
  const s = new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:0xe2e8e2, transparent:true,
    opacity:R(0.08,0.17), depthWrite:false}));
  const hi = i%3;
  s.position.set(R(-11,11), hi===0?R(0.4,1.0):R(1.6,4.2), R(-11,11));
  const sc = hi===0? R(9,14) : R(6,11);
  s.scale.set(sc, sc*R(0.42,0.6), 1);
  root.add(s);
  mists.push({s, v:R(0.14,0.36), ph:R(0,6.28)});
}
function updateMist(dt, time){
  mists.forEach(m=>{
    m.s.position.x += m.v*dt;
    m.s.position.y += Math.sin(time*0.3+m.ph)*dt*0.05;
    if(m.s.position.x > 13.5) m.s.position.x = -13.5;
    m.s.material.opacity += Math.sin(time*0.5+m.ph)*dt*0.004;
    m.s.material.opacity = clamp(m.s.material.opacity, 0.05, 0.2);
  });
}

/* ============================================================
   声音（Web Audio 程序化合成，完全离线）
   风声底噪 + 间歇信号铃声 + 偶尔火车汽笛
   ============================================================ */
const snd = { ctx:null, master:null, windG:null, bellBus:null, whiBus:null, noiseBuf:null,
              on:false, vol:0.55, nextBell:6, nextWhistle:24 };
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  snd.ctx = new AC();
  // 2 秒噪声循环
  const len = snd.ctx.sampleRate * 2;
  const buf = snd.ctx.createBuffer(1, len, snd.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let l0=0;
  for(let i=0;i<len;i++){
    const w = Math.random()*2-1;
    l0 = 0.96*l0 + 0.04*w;
    d[i] = (l0*2.4 + w*0.2) * 0.4;
  }
  snd.noiseBuf = buf;
  snd.master = snd.ctx.createGain(); snd.master.gain.value = 0;
  snd.master.connect(snd.ctx.destination);
  // 风：噪声 → 低通 → 缓慢起伏
  const src = snd.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp = snd.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.4;
  snd.windG = snd.ctx.createGain(); snd.windG.gain.value=0.4;
  src.connect(lp); lp.connect(snd.windG); snd.windG.connect(snd.master);
  src.start();
  const lfo = snd.ctx.createOscillator(); lfo.frequency.value=0.06;
  const lg = snd.ctx.createGain(); lg.gain.value=0.16;
  lfo.connect(lg); lg.connect(snd.windG.gain); lfo.start();
  // 分总线
  snd.bellBus = snd.ctx.createGain(); snd.bellBus.gain.value=0.85; snd.bellBus.connect(snd.master);
  snd.whiBus  = snd.ctx.createGain(); snd.whiBus.gain.value=1.0;  snd.whiBus.connect(snd.master);
}
function ding(t){
  const c = snd.ctx;
  const o = c.createOscillator(); o.type='sine'; o.frequency.value = 1244*R(0.98,1.02);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
  o.connect(g); g.connect(snd.bellBus);
  o.start(t); o.stop(t+0.2);
  const o2 = c.createOscillator(); o2.type='sine'; o2.frequency.value = 1244*R(0.98,1.02)*1.59;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.2, t+0.004);
  g2.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
  o2.connect(g2); g2.connect(snd.bellBus);
  o2.start(t); o2.stop(t+0.12);
}
function playBell(){
  if(!snd.on || !snd.ctx) return;
  const t0 = snd.ctx.currentTime + 0.05;
  const dur = R(1.8, 3.6);
  for(let t=0; t<dur; t+=R(0.085,0.115)) ding(t0+t);
}
function blast(t0, dur, f){
  const c = snd.ctx;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.3, t0+0.08);
  g.gain.setValueAtTime(0.3, t0+dur*0.65);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  g.connect(snd.whiBus);
  [f, f*1.19].forEach(fr=>{
    const o = c.createOscillator(); o.type='sine'; o.frequency.value=fr;
    const v = c.createOscillator(); v.frequency.value=5.2;
    const vg = c.createGain(); vg.gain.value=3.2;
    v.connect(vg); vg.connect(o.frequency);
    o.connect(g);
    o.start(t0); o.stop(t0+dur+0.15);
    v.start(t0); v.stop(t0+dur+0.15);
  });
  const nb = c.createBufferSource(); nb.buffer=snd.noiseBuf; nb.loop=true;
  const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f*2.1; bp.Q.value=1.1;
  const ng = c.createGain(); ng.gain.value=0.06;
  nb.connect(bp); bp.connect(ng); ng.connect(g);
  nb.start(t0); nb.stop(t0+dur+0.15);
}
function playWhistle(){
  if(!snd.on || !snd.ctx) return;
  const t0 = snd.ctx.currentTime + 0.1;
  const f = R(368, 408);
  blast(t0, 1.0, f);
  blast(t0+1.7, 2.3, f*0.985);
}
(function(){
  const btn=document.getElementById('sndBtn'), vol=document.getElementById('sndVol'),
        icOn=document.getElementById('icOn'), icOff=document.getElementById('icOff');
  btn.addEventListener('click', ()=>{
    if(!snd.ctx) sndBuild();
    if(!snd.ctx) return;
    if(snd.ctx.state==='suspended') snd.ctx.resume();
    snd.on = !snd.on;
    icOn.style.display  = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none'  : 'block';
    const t = snd.ctx.currentTime;
    snd.master.gain.setTargetAtTime(snd.on ? snd.vol*0.9 : 0, t, 0.5);
    if(snd.on){ snd.nextBell = time+2; snd.nextWhistle = time+R(16,30); }
  });
  vol.addEventListener('input', ()=>{
    snd.vol = vol.value/100;
    if(snd.on && snd.ctx){
      snd.master.gain.setTargetAtTime(snd.vol*0.9, snd.ctx.currentTime, 0.15);
    }
  });
  renderer.domElement.addEventListener('pointerdown', ()=>{
    if(snd.ctx && snd.ctx.state==='suspended') snd.ctx.resume();
  });
})();

/* ============================================================
   动画
   ============================================================ */
let time = 0, last = performance.now();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  time += dt;

  /* 相机 */
  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.88;
  ctrl.phi = clamp(ctrl.phi, 0.20, 1.36);
  ctrl.r   = clamp(ctrl.r, 9, 58);
  if(ctrl.dragging) ctrl.idle = 0; else ctrl.idle += dt;
  if(ctrl.idle > 5) ctrl.theta += dt*0.009;
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 雾气 / 落叶 / 玻璃雾 */
  updateMist(dt, time);
  updateLeaves(dt, time);
  for(let i=0;i<glassFogMats.length;i++) glassFogMats[i].uniforms.uTime.value = time;

  /* 藤蔓轻晃 */
  vineSway.forEach(v=>{ v.g.rotation.z = Math.sin(time*0.9 + v.phase)*v.amp; });

  /* 路灯光晕在雾气中弥散 */
  lamps.forEach(l=>{
    const k = 0.86 + 0.14*Math.sin(time*0.8 + l.phase);
    l.glow.material.opacity = l.base*k;
    l.light.intensity = 0.85*k;
  });

  /* 取暖炉余烬闪烁 */
  L.stove.intensity = 0.42 + 0.16*Math.sin(time*7.3) * Math.sin(time*2.1);

  /* 信号灯微弱明暗闪烁（偶发熄灭） */
  signal.t += dt;
  const cyc = signal.t % 17;
  let on;
  if(cyc > 10 && cyc < 13) on = false;
  else on = (signal.t % 1.6) < 0.95;
  signal.mat.color.setHex(on ? 0xff4a3c : 0x4a201a);
  signal.glow.material.opacity = on ? 0.3 : 0.03;
  L.sig.intensity = on ? 0.35 : 0.0;

  /* 钟摆微摆（久已停摆，风化的惯性） */
  // pendulum 静止即可

  /* 声音事件调度 */
  if(snd.on && snd.ctx){
    if(time > snd.nextBell){ playBell(); snd.nextBell = time + R(10,26); }
    if(time > snd.nextWhistle){ playWhistle(); snd.nextWhistle = time + R(34,80); }
  }

  renderer.render(scene, camera);
}
animate();
</script>

</html>
