<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暖冬午后 · 温馨独居小房间</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#170f0a;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 52% 46%, rgba(255,214,150,.10), rgba(0,0,0,0) 62%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 48%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 42%, rgba(148,128,110,1) 78%, rgba(52,38,28,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,206,150,.35);
          background:rgba(38,24,16,.55);color:#ffd9b0;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(255,206,150,.7);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(255,206,150,.35);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#ffd9b0;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#ffd9b0;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="钢琴曲 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="50" title="音量"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   暖冬午后 · 温馨独居小房间  (three.js r128 / 完全离线)
   三渲二 · 微缩室内景观 · 床边小猫
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const lerp  = T.MathUtils.lerp;
const JP = '"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Microsoft YaHei",sans-serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x17100b, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x17100b);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(0, 1.35, -0.4), r:24.0, theta:0.78, phi:1.00,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0042;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.30,0.50,0.70,0.86,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM      = new T.MeshBasicMaterial({color:0x181009, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x2e1c10, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity=(o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm, force){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(!force && Math.min(s.x,s.y,s.z) < 0.05) return null;
  const k = t===undefined?0.017:t;
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm, o.olf);
  return mesh;
}
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h,o.sw||1,o.sh||1), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function SP(pa, r, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.SphereGeometry(r, o.seg||14, o.sg||10), m);
  mesh.position.set(x,y,z);
  if(o.sx||o.sy||o.sz) mesh.scale.set(o.sx||1,o.sy||1,o.sz||1);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm, o.olf);
  return mesh;
}
function CN(pa, r,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.ConeGeometry(r,h,seg||10), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm, o.olf);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

/* 径向光斑 / 阴影 */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.28,'rgba(255,255,255,0.62)');
  g.addColorStop(0.62,'rgba(255,255,255,0.16)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new T.CanvasTexture(c);
})();
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(0,0,0,0.92)');
  g.addColorStop(0.45,'rgba(0,0,0,0.5)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new T.CanvasTexture(c);
})();
const SMOKE_TEX = (function(){
  const c=CV(64,64), x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,0.85)');
  g.addColorStop(0.5,'rgba(255,255,255,0.28)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  return new T.CanvasTexture(c);
})();

/* 浅木地板 */
const TEX_FLOOR = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#dcbb92'; x.fillRect(0,0,512,512);
  const rows=8, rh=512/rows;
  for(let r=0;r<rows;r++){
    const y=r*rh, base=196+Math.random()*24;
    x.fillStyle='rgb('+(base+42)+','+(base-2)+','+(base-56)+')';
    x.fillRect(0,y,512,rh-1);
    for(let i=0;i<44;i++){
      x.strokeStyle='rgba(146,100,60,'+(0.05+Math.random()*0.12).toFixed(3)+')';
      x.lineWidth=0.6+Math.random()*1.2;
      x.beginPath();
      const gy=y+Math.random()*rh;
      x.moveTo(0,gy);
      for(let px=0;px<=512;px+=32) x.lineTo(px, gy+Math.sin(px*0.021+r*1.7)*1.5+(Math.random()-0.5)*1.1);
      x.stroke();
    }
    x.fillStyle='rgba(116,80,48,0.5)'; x.fillRect(0,y+rh-2,512,2);
    const off=(r%2)?152:334;
    x.fillRect(off,y,2,rh);
    x.fillRect((off+208)%512,y,2,rh);
  }
  speckle(x,512,512,420,1.4,0.055);
  return TX(c,3,3);
})();

/* 奶油墙面 */
const TEX_WALL = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.fillStyle='#f7ead9'; x.fillRect(0,0,128,128);
  speckle(x,128,128,260,1.2,0.045);
  return TX(c,4,2);
})();

/* 被褥绒布 */
const TEX_DUVET = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.fillStyle='#f6d9c3'; x.fillRect(0,0,128,128);
  for(let i=0;i<520;i++){
    x.fillStyle='rgba(214,152,116,'+(0.05+Math.random()*0.10).toFixed(3)+')';
    x.fillRect(Math.random()*128, Math.random()*128, 1.6, 1.6);
  }
  x.strokeStyle='rgba(226,170,136,0.32)'; x.lineWidth=1.2;
  for(let i=8;i<128;i+=16){ x.beginPath(); x.moveTo(0,i+Math.sin(i)*1.4); x.lineTo(128,i-Math.sin(i)*1.4); x.stroke(); }
  return TX(c,2,2);
})();

/* 小猫毯（针织） */
const TEX_QUILT = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.fillStyle='#d99177'; x.fillRect(0,0,128,128);
  x.strokeStyle='rgba(255,226,206,0.35)'; x.lineWidth=2.4; x.lineCap='round';
  for(let y=6;y<128;y+=13){
    for(let xx=6;xx<128;xx+=13){
      x.beginPath();
      x.moveTo(xx-4,y+5); x.quadraticCurveTo(xx,y+11,xx+4,y+5);
      x.stroke();
    }
  }
  x.strokeStyle='rgba(150,74,58,0.22)'; x.lineWidth=1.6;
  for(let i=0;i<128;i+=13){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,128); x.stroke(); }
  speckle(x,128,128,180,1.6,0.07);
  return TX(c,1.6,1.6);
})();

/* 地毯 */
const TEX_RUG = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#ecd8c6'; x.fillRect(0,0,256,256);
  x.strokeStyle='#d5a184'; x.lineWidth=6; rr(x,12,12,232,232,20); x.stroke();
  x.strokeStyle='#e6c3a8'; x.lineWidth=2.5; rr(x,25,25,206,206,15); x.stroke();
  x.strokeStyle='rgba(196,140,112,0.5)'; x.lineWidth=2; rr(x,42,42,172,172,11); x.stroke();
  x.strokeStyle='rgba(202,148,118,0.45)'; x.lineWidth=2.2;
  for(let i=0;i<3;i++){ rr(x,66+i*20,66+i*20,124-i*40,124-i*40,8); x.stroke(); }
  x.fillStyle='rgba(214,158,128,0.28)';
  for(let i=0;i<8;i++){
    const a=i/8*6.2832;
    x.beginPath(); x.ellipse(128+Math.cos(a)*46, 128+Math.sin(a)*46, 7,4.4, a, 0, 6.2832); x.fill();
  }
  speckle(x,256,256,340,1.7,0.06);
  return TX(c);
})();

/* 挂画 */
const TEX_PAINT1 = (function(){
  const c=CV(256,192), x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,192);
  g.addColorStop(0,'#f6dcae'); g.addColorStop(0.55,'#f0c193'); g.addColorStop(1,'#e0a075');
  x.fillStyle=g; x.fillRect(0,0,256,192);
  x.fillStyle='#fff0cd'; x.beginPath(); x.arc(186,58,26,0,6.2832); x.fill();
  x.fillStyle='rgba(255,240,205,0.35)'; x.beginPath(); x.arc(186,58,42,0,6.2832); x.fill();
  x.fillStyle='#c98d78'; x.beginPath();
  x.moveTo(0,140); x.quadraticCurveTo(70,96,132,140); x.quadraticCurveTo(196,178,256,132);
  x.lineTo(256,192); x.lineTo(0,192); x.closePath(); x.fill();
  x.fillStyle='#a9715f'; x.beginPath();
  x.moveTo(0,164); x.quadraticCurveTo(88,134,168,168); x.quadraticCurveTo(214,186,256,166);
  x.lineTo(256,192); x.lineTo(0,192); x.closePath(); x.fill();
  x.fillStyle='rgba(90,60,45,0.55)';
  for(let i=0;i<5;i++){ x.fillRect(40+i*36, 150-((i%3)*9), 3, 16); }
  return TX(c);
})();
const TEX_PAINT2 = (function(){
  const c=CV(256,192), x=c.getContext('2d');
  x.fillStyle='#f6ecdc'; x.fillRect(0,0,256,192);
  x.fillStyle='#e9d3b6'; x.fillRect(0,0,256,192);
  x.strokeStyle='rgba(150,110,86,0.55)'; x.lineWidth=3;
  x.beginPath(); x.arc(128,104,58,0,6.2832); x.stroke();
  x.strokeStyle='rgba(197,131,98,0.65)'; x.lineWidth=2;
  x.beginPath(); x.arc(128,104,42,0,6.2832); x.stroke();
  x.fillStyle='#c98d78';
  x.beginPath(); x.ellipse(128,104,13,13,0,0,6.2832); x.fill();
  x.fillStyle='#8fae74';
  for(let i=0;i<6;i++){
    x.save(); x.translate(128,104); x.rotate(i*1.047+0.4);
    x.beginPath(); x.ellipse(0,-50,8,20,0,0,6.2832); x.fill(); x.restore();
  }
  return TX(c);
})();

/* 挂布 */
const TEX_TAPESTRY = (function(){
  const c=CV(256,192), x=c.getContext('2d');
  x.fillStyle='#e8d3ba'; x.fillRect(0,0,256,192);
  x.fillStyle='#d9a883';
  for(let i=0;i<4;i++){
    x.beginPath(); x.moveTo(20+i*58,176);
    x.quadraticCurveTo(49+i*58,84, 78+i*58,176); x.closePath(); x.fill();
  }
  x.strokeStyle='rgba(255,246,230,0.6)'; x.lineWidth=3;
  x.beginPath(); x.moveTo(0,44); x.lineTo(256,44); x.stroke();
  x.beginPath(); x.moveTo(0,30); x.lineTo(256,30); x.stroke();
  for(let i=0;i<10;i++){ x.beginPath(); x.moveTo(14+i*26,30); x.lineTo(14+i*26,44); x.stroke(); }
  x.fillStyle='#c98d78';
  for(let i=0;i<6;i++){ x.beginPath(); x.arc(30+i*40,20,5,0,6.2832); x.fill(); }
  speckle(x,256,192,220,1.6,0.06);
  return TX(c);
})();

/* 照片墙小拍立得 */
function photoTex(seed){
  const c=CV(96,120), x=c.getContext('2d');
  x.fillStyle='#fffaf0'; x.fillRect(0,0,96,120);
  const pal=[['#f6d0ad','#e0957a','#b6d4e6'],['#e9dcc2','#c6d6b4','#efb79c'],['#dfe8f2','#f5d8ad','#c8b6a4']];
  const p=pal[seed%pal.length];
  x.fillStyle=p[0]; x.fillRect(8,8,80,94);
  const k=seed%4;
  if(k===0){
    x.fillStyle='#f8d9a0'; x.beginPath(); x.arc(52,44,15,0,6.2832); x.fill();
    x.fillStyle=p[1]; x.beginPath(); x.moveTo(8,102); x.lineTo(42,64); x.lineTo(74,102); x.closePath(); x.fill();
    x.fillStyle=p[2]; x.beginPath(); x.moveTo(46,102); x.lineTo(74,76); x.lineTo(88,102); x.closePath(); x.fill();
  }else if(k===1){
    x.fillStyle='#7a5c48';

const WALLS = [];
function mkWall(axis, sign){
  const g = new T.Group(); root.add(g);
  const len = (HW + WT)*2;
  const geo = new T.BoxGeometry(axis==='x'?WT:len, WH, axis==='x'?len:WT);
  const m = new T.Mesh(geo, M.wall);
  m.position.set(axis==='x'? sign*WC : 0, WH/2, axis==='x'? 0 : sign*WC);
  g.add(m); addOL(m, 0.022, true);
  // 顶部檐线
  const cap = new T.Mesh(new T.BoxGeometry(axis==='x'?WT+0.16:len+0.3, 0.16, axis==='x'?len+0.3:WT+0.16), M.trim);
  cap.position.set(m.position.x, WH+0.08, m.position.z);
  g.add(cap); addOL(cap, 0.016, true);
  const list = [];
  g.traverse(o=>{ if(o.isMesh){ o.userData.bm=o.material; o.userData.bo=(o.material.opacity!==undefined?o.material.opacity:1); list.push(o);} });
  WALLS.push({g, list, nx:(axis==='x'?sign:0), nz:(axis==='x'?0:sign), op:1});
  return g;
}

}

const CAT_PATH = [
  [-1.55,-3.30],  // 床边小毯子（家）
  [-1.20,-4.50],  // 绕过床头柜
  [0.70,-4.50],   // 后墙前

  [0.75, 0.30],   // 猫抓板外侧

  [-2.20, 1.75],  // 地毯边缘
  [-4.10, 1.70],
  [-4.50, 0.30],
  [-3.60,-0.95],
  [-2.30,-1.60]   // 床脚旁
];
const CUM = [0];
for(let i=1;i<=CAT_PATH.length;i++){
  const a = CAT_PATH[i-1], b = CAT_PATH[i%CAT_PATH.length];
  CUM.push(CUM[i-1] + Math.hypot(b[0]-a[0], b[1]-a[1]));
}
const PATH_LEN = CUM[CAT_PATH.length];

const cat = new T.Group(); root.add(cat);
const catBody = new T.Group(); cat.add(catBody);
const catParts = {};
(function buildCat(){

  SP(head, 0.13, M.catWhite, 0.14, -0.07, 0, {sx:0.9, sy:0.6, sz:0.95, seg:12, sg:9, ol:0});
  // 耳

  // 胡须

      BX(head, 0.16, 0.006, 0.006, M.catWhite, 0.20, -0.05+i*0.028, s*0.085, {ry:s*(0.25+i*0.10), rz:-0.12+i*0.14, ol:0});
    }

  // 项圈 + 铃铛
  const col = new T.Mesh(new T.TorusGeometry(0.135, 0.024, 6, 16), MK(0xd8705f));
  col.rotation.y = Math.PI/2; col.rotation.z = 0.25; col.position.set(0.29, 0.38, 0); catBody.add(col);
  SP(catBody, 0.038, MK(0xf2c96a,{emissive:0x4a3a10, ei:0.3}), 0.32, 0.30, 0, {ol:0});

  // 尾巴（骨链）
  catParts.tail = [];
  let par = catBody;
  for(let i=0;i<8;i++){
    const b = new T.Object3D();
    b.position.set(i===0 ? -0.40 : -0.115, i===0 ? 0.36 : 0, i===0 ? 0 : 0);

    const seg = new T.Mesh(new T.CylinderGeometry(Math.max(r0,0.016), Math.max(r1,0.014), 0.12, 8),

    catParts.tail.push(b);
    par = b;
  }

  // 四条腿（髋关节 + 腿 + 爪）
  catParts.legs = [];
  [[0.27,0.135],[0.27,-0.135],[-0.26,0.135],[-0.26,-0.135]].forEach(p=>{
    const hip = new T.Object3D(); hip.position.set(p[0], 0.30, p[1]); catBody.add(hip);
    const l = new T.Mesh(new T.CylinderGeometry(0.058,0.050, 0.30, 8), M.catFur);
    l.position.set(0, -0.15, 0); hip.add(l); addOL(l, 0.010, true, true);
    const paw = new T.Mesh(new T.SphereGeometry(0.062, 10, 8), (p[0]>0?M.catWhite:M.catWhite));
    paw.scale.set(1.15, 0.68, 1.0); paw.position.set(0.006, -0.30, 0); hip.add(paw);
    catParts.legs.push(hip);

  // 身上的斑纹
  [[0.10,0.50,0.13],[-0.06,0.50,-0.10],[-0.22,0.48,0.06]].forEach(p=>{

  cat.position.set(CAT_HOME.x, 0.04, CAT_HOME.y);

const catShadow = shadowBlob(CAT_HOME.x, 0.05, CAT_HOME.y, 1.3, 1.0, 0.42);

/* --- 小猫状态机 --- */
const CAT = { state:'sleep', t:0, sleepFor:R(7,11), s:0, ry:cat.rotation.y, pose:0,
              pauseT:0, paused:false, walked:0 };
function pathAt(s){
  s = s % PATH_LEN; if(s<0) s += PATH_LEN;
  let i=0; while(i<CAT_PATH.length-1 && s>CUM[i+1]) i++;
  const a = CAT_PATH[i], b = CAT_PATH[(i+1)%CAT_PATH.length];
  const segLen = CUM[i+1]-CUM[i];
  const u = segLen>0 ? (s-CUM[i])/segLen : 0;
  return { x:a[0]+(b[0]-a[0])*u, z:a[1]+(b[1]-a[1])*u,
           dx:(b[0]-a[0])/segLen, dz:(b[1]-a[1])/segLen };
}
function setCatPose(k){
  const P = catParts;
  P.body.scale.x = lerp(0.68, 0.88, k);
  P.body.scale.y = lerp(0.44, 0.42, k);
  P.body.position.y = lerp(0.27, 0.32, k);
  P.head.position.set(lerp(0.10,0.44,k), lerp(0.28,0.44,k), lerp(0.20,0.0,k));
  P.head.rotation.y = lerp(0.95, 0.0, k);
  P.head.rotation.z = lerp(0.30, 0.0, k);
  P.eyes.forEach(e=>{ e.scale.y = lerp(0.10, 1.0, k); });
}
function updateCat(dt){
  const P = catParts;
  CAT.t += dt;
  let tailMode = 'idle', sway = time*1.7;

  if(CAT.state === 'sleep'){
    CAT.pose += (0 - CAT.pose) * Math.min(1, dt*3);
    setCatPose(CAT.pose);
    // 呼吸
    const br = Math.sin(time*1.25)*0.5+0.5;
    P.body.scale.y = lerp(0.44,0.42,CAT.pose) + br*0.022;
    catBody.rotation.z = 0;
    catBody.position.y = 0;
    tailMode = 'sleep';
    CAT.s = 0;
    if(CAT.t > CAT.sleepFor){ CAT.state='wake'; CAT.t=0; }
  }
  else if(CAT.state === 'wake'){
    // 0~0.5 抬头，0.5~2.4 伸懒腰，2.4~2.9 收势
    const t = CAT.t;
    const rise = clamp(t/0.8, 0, 1);
    CAT.pose += (rise - CAT.pose) * Math.min(1, dt*4);
    setCatPose(CAT.pose);
    if(t > 0.8 && t < 2.5){
      const st = (t-0.8)/1.7;              // 0..1
      const a = Math.sin(st*Math.PI);
      if(st < 0.5){
        // 前肢前伸、前身下压
        const k = st/0.5;
        catBody.rotation.z = -0.30 * Math.sin(k*Math.PI*0.5);
        catBody.position.y = -0.03 * Math.sin(k*Math.PI*0.5);
        P.legs[0].rotation.z = 1.15 * a;
        P.legs[1].rotation.z = 1.05 * a;
        P.legs[2].rotation.z = -0.20 * a;
        P.legs[3].rotation.z = -0.16 * a;
      }else{
        // 后肢后蹬、背拱起
        const k = (st-0.5)/0.5;
        catBody.rotation.z = 0.16 * Math.sin(k*Math.PI*0.5);
        catBody.position.y = 0.02 * Math.sin(k*Math.PI*0.5);
        P.legs[0].rotation.z = 0.35 * a;
        P.legs[1].rotation.z = 0.30 * a;
        P.legs[2].rotation.z = -0.85 * a;
        P.legs[3].rotation.z = -0.80 * a;
      }
      P.head.rotation.z = -0.18*a;
      tailMode = 'stretch';
    }else{
      catBody.rotation.z *= (1-Math.min(1,dt*4));
      catBody.position.y *= (1-Math.min(1,dt*4));
      P.legs.forEach(l=>{ l.rotation.z *= (1-Math.min(1,dt*4)); });
      tailMode = 'idle';
    }
    if(CAT.t > 2.9){ CAT.state='walk'; CAT.t=0; CAT.s=0; CAT.walked=0; CAT.paused=false; CAT.pauseT=0; }
  }
  else if(CAT.state === 'walk'){
    CAT.pose += (1 - CAT.pose) * Math.min(1, dt*4);
    setCatPose(CAT.pose);
    catBody.rotation.z = 0; catBody.position.y = 0;
    // 中途停顿张望
    if(CAT.pauseT > 0){
      CAT.pauseT -= dt;
      P.legs.forEach(l=>{ l.rotation.z *= (1-Math.min(1,dt*6)); });
      catBody.position.y = Math.sin(time*2.2)*0.006;
      P.head.rotation.y = Math.sin(time*0.9)*0.30;
    }else{
      const sp = 1.02;
      CAT.s += sp*dt;
      CAT.walked += sp*dt;
      const p = pathAt(CAT.s - 0.05);
      cat.position.x = p.x; cat.position.z = p.z;
      const targetRy = Math.atan2(-p.dz, p.dx);
      let diff = targetRy - CAT.ry;
      while(diff >  Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      CAT.ry += diff * Math.min(1, dt*4.5);
      cat.rotation.y = CAT.ry;
      // 步态
      const ph = CAT.s*7.4;
      const off = [0, Math.PI, Math.PI*0.5, Math.PI*1.5];
      for(let i=0;i<4;i++){
        const a = Math.sin(ph + off[i]);
        P.legs[i].rotation.z = a * 0.52;
        P.legs[i].position.y = 0.30 + Math.max(0, Math.cos(ph+off[i]))*0.018;
      }
      catBody.position.y = Math.abs(Math.sin(ph))*0.014;
      P.head.rotation.y = Math.sin(time*1.1)*0.10;
      // 途中只停一次，张望片刻
      if(!CAT.paused && CAT.walked > 9.5){ CAT.paused = true; CAT.pauseT = 2.2; }
      if(CAT.s >= PATH_LEN){ CAT.state='settle'; CAT.t=0; }
    }
    tailMode = 'idle';
  }
  else if(CAT.state === 'settle'){
    const k = clamp(CAT.t/1.9, 0, 1);
    CAT.pose += ((1-k) - CAT.pose) * Math.min(1, dt*3);
    setCatPose(CAT.pose);
    catBody.rotation.z *= (1-Math.min(1,dt*3));
    P.legs.forEach(l=>{ l.rotation.z *= (1-Math.min(1,dt*3)); });
    tailMode = k>0.5 ? 'sleep' : 'idle';
    if(CAT.t > 2.1){ CAT.state='sleep'; CAT.t=0; CAT.sleepFor=R(11,17); }
  }

  /* 尾巴 */
  const k = Math.min(1, dt*5);
  for(let i=0;i<P.tail.length;i++){
    const b = P.tail[i];
    let tz, ty;
    if(tailMode === 'sleep'){
      tz = (i===0 ? -0.10 : 0.52);
      ty = (i===0 ? 0.78 : 0.21);
      if(i>0) tz += Math.sin(time*1.1 + i*0.6)*0.02;
    }else if(tailMode === 'stretch'){
      tz = (i===0 ? -1.30 : -0.10);
      ty = Math.sin(time*2.4 - i*0.4)*0.05;
    }else{
      tz = (i===0 ? -0.95 : -0.15);
      ty = Math.sin(sway - i*0.5)*0.10*(i===0?0.5:1);
      if(tailMode==='idle' && i>0) tz += Math.sin(time*1.6 - i*0.7)*0.03;
    }
    b.rotation.z += (tz - b.rotation.z)*k;
    b.rotation.y += (ty - b.rotation.y)*k;
  }

  catShadow.position.set(cat.position.x, 0.052, cat.position.z);
  catShadow.material.opacity = 0.42;
}

/* ============================================================
   12. 音频：合成钢琴循环曲（舒缓轻柔）
   ============================================================ */
const snd = { ctx:null, on:false, vol:0.5, master:null, dry:null, wet:null, conv:null,
              timer:null, next:0, beat:0, t0:0 };
const BPM = 56, SPB = 60/BPM;          // 每拍秒数
const LOOP_BEATS = 32;

/* 和声：FM7 - Em7 - Dm7 - Cmaj7 - FM7 - Em7 - Am7 - G */
const CHORDS = [
  {root:41, notes:[53,57,60,64]},
  {root:40, notes:[52,55,59,62]},
  {root:38, notes:[50,53,57,60]},
  {root:36, notes:[48,52,55,59]},
  {root:41, notes:[53,57,60,64]},
  {root:40, notes:[52,55,59,62]},
  {root:45, notes:[57,60,64,67]},
  {root:43, notes:[50,55,59,62]}
];
const MELODY = [
  [2.0, 81, 1.7, 0.20],[6.0, 79, 1.5, 0.19],[10.0, 77, 1.7, 0.20],[13.5, 76, 2.4, 0.21],
  [18.0, 79, 1.5, 0.19],[21.5, 81, 1.9, 0.20],[26.0, 79, 1.0, 0.17],[27.5, 76, 1.0, 0.17],[30.0, 74, 2.6, 0.20]
];
const EVENTS = (function(){
  const ev = [];
  for(let i=0;i<8;i++){
    const c = CHORDS[i], b = i*4;
    ev.push({b:b, n:c.root, d:3.8, v:0.30});
    for(let j=0;j<4;j++) ev.push({b:b+0.5+j*0.55, n:c.notes[j], d:2.6, v:0.125});
    for(let j=0;j<3;j++) ev.push({b:b+2.7+j*0.45, n:c.notes[(j+2)%4]+12, d:1.9, v:0.068});
  }
  MELODY.forEach(m=> ev.push({b:m[0], n:m[1], d:m[2], v:m[3]}));
  ev.sort((a,b)=>a.b-b.b);
  return ev;
})();

function makeIR(sec, decay){
  const rate = snd.ctx.sampleRate, len = Math.floor(rate*sec);
  const buf = snd.ctx.createBuffer(2, len, rate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<len;i++){
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay) * 0.6;
    }
  }
  return buf;
}
function m2f(m){ return 440 * Math.pow(2, (m-69)/12); }
function piano(t, midi, dur, vel){
  const c = snd.ctx;
  const f0 = m2f(midi);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vel, t+0.014);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vel*0.30), t+0.26);
  g.gain.exponentialRampToValueAtTime(0.0001, t+Math.max(0.35, dur));
  const lp = c.createBiquadFilter();
  lp.type='lowpass'; lp.Q.value=0.5;
  lp.frequency.setValueAtTime(Math.min(6500, f0*9+900), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(500, f0*2.4+280), t+dur*0.85);
  // [泛音倍数, 音量, 波形]
  const parts = [[1, 1.0, 'triangle'],[2, 0.30, 'sine'],[3, 0.115, 'sine'],[4.02, 0.05, 'sine']];
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    const o = c.createOscillator();
    o.type = p[2];
    o.frequency.value = f0 * p[0] * (1 + (i? (Math.random()-0.5)*0.0016 : 0));
    const og = c.createGain(); og.gain.value = p[0]===1 ? 0.55*p[1] : p[1];
    o.connect(og); og.connect(lp);
    o.start(t); o.stop(t+dur+0.12);
  }
  // 极轻的击弦感
  const nb = c.createBuffer(1, Math.floor(c.sampleRate*0.05), c.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1)*Math.pow(1-i/nd.length, 3);
  const ns = c.createBufferSource(); ns.buffer = nb;
  const nf = c.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value = f0*3.2; nf.Q.value=1.1;
  const ng = c.createGain(); ng.gain.value = vel*0.10;
  ns.connect(nf); nf.connect(ng); ng.connect(lp);
  ns.start(t);
  lp.connect(g);
  g.connect(snd.dry); g.connect(snd.wet);
}
function schedBeat(beatIdx, when){
  // 找出落在该拍窗口内的事件
  const b0 = beatIdx % LOOP_BEATS, b1 = b0 + 1;
  for(let i=0;i<EVENTS.length;i++){
    const e = EVENTS[i];
    const bb = e.b % LOOP_BEATS;
    let rel = bb - b0;
    if(rel < -0.001) rel += LOOP_BEATS;            // 跨循环接缝
    if(rel >= 0.999) continue;
    const t = when + rel*SPB + (Math.random()-0.5)*0.016;
    piano(t, e.n, e.d*SPB, e.v*(0.9+Math.random()*0.2));
  }
}
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  snd.ctx = new AC();
  snd.master = snd.ctx.createGain(); snd.master.gain.value = 0;
  snd.master.connect(snd.ctx.destination);
  snd.dry = snd.ctx.createGain(); snd.dry.gain.value = 0.72; snd.dry.connect(snd.master);
  snd.conv = snd.ctx.createConvolver(); snd.conv.buffer = makeIR(2.8, 2.6);
  snd.wet = snd.ctx.createGain(); snd.wet.gain.value = 0.42;
  snd.wet.connect(snd.conv); snd.conv.connect(snd.master);
  // 整体柔化
  const soft = snd.ctx.createBiquadFilter();
  soft.type='lowpass'; soft.frequency.value = 5200; soft.Q.value=0.4;
  snd.master.disconnect(); snd.master.connect(soft); soft.connect(snd.ctx.destination);

  snd.next = snd.ctx.currentTime + 0.18;
  snd.beat = 0;
  snd.timer = setInterval(()=>{
    if(!snd.ctx) return;
    const ahead = snd.ctx.currentTime + 0.9;
    while(snd.next < ahead){
      // 标签页被节流 / 系统休眠后时钟落后：跳过已过期的拍，避免补发成一团音
      if(snd.next > snd.ctx.currentTime - 0.05) schedBeat(snd.beat, snd.next);
      snd.next += SPB; snd.beat++;
    }
  }, 220);
}
(function(){
  const btn=document.getElementById('sndBtn'), vol=document.getElementById('sndVol'),
        icOn=document.getElementById('icOn'), icOff=document.getElementById('icOff');
  btn.addEventListener('click', ()=>{
    if(!snd.ctx) sndBuild();
    if(!snd.ctx) return;
    if(snd.ctx.state==='suspended') snd.ctx.resume();
    snd.on = !snd.on;
    icOn.style.display  = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none'  : 'block';
    const t = snd.ctx.currentTime;
    snd.master.gain.setTargetAtTime(snd.on ? snd.vol*0.85 : 0, t, 0.45);
  });
  vol.addEventListener('input', ()=>{
    snd.vol = vol.value/100;
    if(snd.on && snd.ctx){
      snd.master.gain.setTargetAtTime(snd.vol*0.85, snd.ctx.currentTime, 0.12);
    }
  });
  renderer.domElement.addEventListener('pointerdown', ()=>{
    if(snd.ctx && snd.ctx.state==='suspended') snd.ctx.resume();
  });
})();

/* ============================================================
   13. 动画
   ============================================================ */
function updateWalls(){
  const cp = camera.position;
  for(let i=0;i<WALLS.length;i++){
    const w = WALLS[i];
    const d = (w.nx!==0) ? (cp.x - w.nx*HW)*w.nx : (cp.z - w.nz*HW)*w.nz;
    let op = d <= 0 ? 1 : clamp(1 - d/2.6, 0, 1);
    if(Math.abs(op - w.op) < 0.003) continue;
    w.op = op;
    for(let j=0;j<w.list.length;j++){
      const o = w.list[j];
      if(op >= 0.997){ o.material = o.userData.bm; }
      else{
        if(!o.userData.fm){
          const m = o.userData.bm.clone();
          m.transparent = true; m.depthWrite = false;
          o.userData.fm = m;
        }
        o.material = o.userData.fm;
        o.material.opacity = op * o.userData.bo;
      }
    }
    w.g.visible = op > 0.004;
  }
}
function updateCurtains(t){
  for(let i=0;i<curtains.length;i++){
    const c = curtains[i];
    const pos = c.geo.attributes.position, arr = pos.array, base = c.base;
    for(let k=0;k<pos.count;k++){
      const x = base[k*3], y = base[k*3+1];
      const v = 0.5 - y/c.h;                       // 0 顶 1 底
      const amp = Math.pow(Math.max(v,0), 1.5)*0.085;
      arr[k*3+2] = Math.sin(x*3.4 + t*1.05 + c.ph)*amp + Math.sin(y*2.2 - t*0.75)*amp*0.35;
      arr[k*3]   = x + Math.sin(t*0.85 + y*1.8)*0.018*v;
    }
    pos.needsUpdate = true;
    c.geo.computeVertexNormals();
  }
}
function updateRug(t){
  if(!rugMesh) return;
  const pos = rugMesh.geometry.attributes.position, arr = pos.array, base = rugBase;
  for(let k=0;k<pos.count;k++){
    const x = base[k*3], y = base[k*3+1];
    arr[k*3+2] = Math.sin(x*2.1 + t*0.85)*0.010 + Math.sin(y*2.6 - t*0.62)*0.008;
  }
  pos.needsUpdate = true;
  rugMesh.geometry.computeVertexNormals();
}
function updateSmoke(dt){
  for(let i=0;i<smokeParts.length;i++){
    const p = smokeParts[i];
    p.ph += dt*p.sp;
    if(p.ph > 1) p.ph -= 1;
    const u = p.ph;
    p.s.position.set(
      p.base.x + Math.sin(u*6.2832 + i)*0.10*u + Math.sin(time*0.6+i)*0.02,
      p.base.y + u*0.85,
      p.base.z + Math.cos(u*5.1 + i*1.7)*0.09*u
    );
    const sc = 0.10 + u*0.34;
    p.s.scale.set(sc, sc, 1);
    p.s.material.opacity = 0.26 * Math.sin(u*Math.PI);
  }
}
function updateDust(dt){
  for(let i=0;i<dust.length;i++){
    const d = dust[i];
    d.ph += dt*0.35;
    d.s.position.set(
      d.x0 + Math.sin(time*d.sp + d.ph)*d.amp,
      d.y0 + ((time*d.sp*0.22 + d.ph*0.3) % 1.0)*0.55 - 0.2,
      d.z0 + Math.cos(time*d.sp*0.8 + d.ph*1.3)*d.amp*0.8
    );
    d.s.material.opacity = 0.14 + 0.24*(0.5+0.5*Math.sin(time*0.7 + d.ph*3));
  }
}
function updateChime(t){
  if(!chime) return;
  const a = Math.sin(t*0.55)*0.055 + Math.sin(t*0.87+1.3)*0.028;
  chime.g.rotation.z = a;
  chime.g.rotation.x = Math.sin(t*0.42)*0.035;
  for(let i=0;i<chime.pend.length;i++){
    const p = chime.pend[i];
    p.rotation.z = Math.sin(t*0.62 + i*0.9)*0.075 + a*0.35;
    p.rotation.x = Math.cos(t*0.51 + i*1.2)*0.065;
  }
}

let time = 0, last = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  time += dt;

  /* 相机 */
  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.88;
  ctrl.phi = clamp(ctrl.phi, 0.18, 1.34);
  ctrl.r   = clamp(ctrl.r, 7.5, 50);
  if(ctrl.dragging) ctrl.idle = 0; else ctrl.idle += dt;
  if(ctrl.idle > 5) ctrl.theta += dt*0.009;
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 剖切墙面 */
  updateWalls();

  /* 窗帘 / 地毯 / 风铃 */
  updateCurtains(time);
  updateRug(time);
  updateChime(time);

  /* 书页被微风翻动 */
  if(bookPage){
    const f = Math.sin(time*0.62);
    const burst = Math.pow(Math.max(0, Math.sin(time*0.21)), 8);
    bookPage.rotation.y = -f*0.22 - burst*1.25;
  }

  /* 日光斑缓慢移动 */
  if(sunPool){
    sunPool.position.x = 0.90 + Math.sin(time*0.055)*0.75;
    sunPool.position.z = -2.45 + Math.sin(time*0.041+1.1)*0.52;
    sunPool.material.opacity = 0.46 + 0.09*Math.sin(time*0.16);
  }
  updateDust(dt);

  /* 香薰轻烟 */
  updateSmoke(dt);

  /* 台灯光晕柔和弥散 */
  if(lampGlow){
    lampGlow.material.opacity = 0.34 + 0.09*Math.sin(time*0.9) + 0.03*Math.sin(time*3.1);
    lampGlow.scale.setScalar(1.5 + 0.09*Math.sin(time*0.75));
  }
  /* 落地灯暖色光影缓慢流动 */
  L.floor.intensity = 0.56 + 0.14*Math.sin(time*0.42) + 0.04*Math.sin(time*1.7);
  L.floor.position.x = -4.35 + Math.sin(time*0.22)*0.16;
  L.floor.position.z =  3.95 + Math.cos(time*0.19)*0.14;
  L.desk.intensity  = 0.62 + 0.09*Math.sin(time*0.7+1.4) + 0.03*Math.sin(time*2.6);
  L.bed.intensity   = 0.46 + 0.09*Math.sin(time*0.55+0.6);
  L.pend.intensity  = 0.50 + 0.09*Math.sin(time*0.33+2.2);
  L.win.intensity   = 0.66 + 0.11*Math.sin(time*0.26);
  L.room.intensity  = 0.50 + 0.05*Math.sin(time*0.31+0.9);
  sun.intensity     = 0.38 + 0.05*Math.sin(time*0.12);

  /* 挂钟：显示真实当前时间 */
  if(CLOCK){
    const d = new Date();
    const s = d.getSeconds() + d.getMilliseconds()/1000;
    const m = d.getMinutes() + s/60;
    const h = d.getHours()%12 + m/60;
    CLOCK.s.rotation.z = -s/60*Math.PI*2;
    CLOCK.m.rotation.z = -m/60*Math.PI*2;
    CLOCK.h.rotation.z = -h/12*Math.PI*2;
  }

  /* 串灯轻微明灭 */
  for(let i=0;i<bulbSprites.length;i++){
    const b = bulbSprites[i];
    b.s.material.opacity = b.base*(0.72 + 0.28*Math.sin(time*0.8 + b.ph));
  }

  /* 小猫 */
  updateCat(dt);

  renderer.render(scene, camera);
}
animate();
