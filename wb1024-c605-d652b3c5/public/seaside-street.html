<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>滨海栈桥 · Seaside Street</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#93a9bc;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 55% 45%, rgba(190,215,235,.10), rgba(0,0,0,0) 62%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 46%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 46%, rgba(196,206,214,1) 80%, rgba(120,134,148,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(120,150,180,.45);
          background:rgba(240,246,252,.55);color:#3d5468;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(90,130,170,.8);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(90,120,150,.4);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#3d5468;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#3d5468;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="雨声·雷 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="55"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   滨海栈桥 · 盛夏雷雨 三渲二微缩场景  (three.js r128 / 完全离线)
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const JP = '"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Microsoft YaHei",sans-serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x9db2c4, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
const BG_BASE  = new T.Color(0x9db2c4);
const BG_FLASH = new T.Color(0xeaf2fa);
const BG = BG_BASE.clone();
scene.background = BG;
scene.fog = new T.Fog(0xa7bac9, 40, 100);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(0.2,1.2,0.3), r:24.5, theta:0.85, phi:1.05,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.42,0.60,0.76,0.90,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM = new T.MeshBasicMaterial({color:0x2b3644, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x40372a, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity = (o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.055) return null;
  const k = t===undefined?0.017:t;
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function SP(pa, r, seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.SphereGeometry(r, seg||14, (seg||14)*0.8|0), m);
  mesh.position.set(x,y,z);
  if(o.sx||o.sy||o.sz) mesh.scale.set(o.sx||1, o.sy||1, o.sz||1);
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

/* 径向光晕 */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
/* 接触阴影 */
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.72)'); g.addColorStop(0.55,'rgba(0,0,0,0.30)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();

/* 混凝土（底座侧壁） */
const CONC = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#7d8a94'; x.fillRect(0,0,256,256);
  speckle(x,256,256,1800,1.8,0.10);
  return TX(c,2,2);
})();
/* 沙滩 */
const SAND = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#dccdaa'; x.fillRect(0,0,512,512);
  for(let i=0;i<60;i++){
    x.fillStyle='rgba('+R(190,225).toFixed(0)+','+R(175,205).toFixed(0)+','+R(140,170).toFixed(0)+',0.4)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(25,90), R(15,55), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,3200,1.8,0.09);
  // 波痕
  x.strokeStyle='rgba(255,250,235,0.28)'; x.lineWidth=3;
  for(let i=0;i<14;i++){
    const y0=Math.random()*512;
    x.beginPath();
    for(let px=0;px<=512;px+=16) x.lineTo(px, y0 + Math.sin(px*0.03+i)*9);
    x.stroke();
  }
  return TX(c,4,1);
})();
/* 湿沙 */
const SAND_WET = (function(){
  const c=CV(512,128), x=c.getContext('2d');
  x.fillStyle='#b2a181'; x.fillRect(0,0,512,128);
  speckle(x,512,128,900,1.6,0.10);
  for(let i=0;i<22;i++){
    x.fillStyle='rgba(90,80,62,'+(0.05+Math.random()*0.10).toFixed(2)+')';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*128, R(14,50), R(4,14), 0, 0, 6.2832); x.fill();
  }
  return TX(c,4,1);
})();
/* 草地 */
const GRASS = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#66a06a'; x.fillRect(0,0,512,512);
  for(let i=0;i<90;i++){
    x.fillStyle='rgba('+R(70,110).toFixed(0)+','+R(130,165).toFixed(0)+','+R(75,105).toFixed(0)+',0.45)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(20,80), R(15,60), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,3600,1.6,0.08);
  // 短草笔触
  x.strokeStyle='rgba(46,96,58,0.4)'; x.lineWidth=2;
  for(let i=0;i<900;i++){
    const px=Math.random()*512, py=Math.random()*512, l=3+Math.random()*5;
    x.beginPath(); x.moveTo(px,py); x.lineTo(px+R(-2,2), py-l); x.stroke();
  }
  return TX(c,4,4);
})();
/* 木栈道（防腐木 + 防滑纹） */
const DECK = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#a3835c'; x.fillRect(0,0,512,512);
  for(let r=0;r<8;r++){
    const y=r*64;
    x.fillStyle='rgba('+R(150,180).toFixed(0)+','+R(118,142).toFixed(0)+','+R(80,100).toFixed(0)+',0.35)';
    x.fillRect(0,y,512,64);
    // 木纹
    x.strokeStyle='rgba(90,66,42,0.30)'; x.lineWidth=2;
    for(let i=0;i<6;i++){
      const gy=y+8+Math.random()*48;
      x.beginPath();
      for(let px=0;px<=512;px+=24) x.lineTo(px, gy + Math.sin(px*0.02+i*2+r)*2.5);
      x.stroke();
    }
    // 板缝
    x.fillStyle='rgba(58,42,28,0.85)'; x.fillRect(0,y+60,512,4);
    // 防滑点
    x.fillStyle='rgba(70,52,34,0.5)';
    for(let i=0;i<10;i++){ x.beginPath(); x.arc(26+i*52, y+22, 2.4, 0, 6.2832); x.fill();
                           x.beginPath(); x.arc(52+i*52, y+44, 2.4, 0, 6.2832); x.fill(); }
  }
  speckle(x,512,512,1400,1.4,0.07);
  return TX(c,2,4);
})();
/* 滨海步道水泥 */
const PAVE = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#b9c2c9'; x.fillRect(0,0,512,512);
  speckle(x,512,512,2600,2.0,0.08);
  x.strokeStyle='rgba(90,100,110,0.55)'; x.lineWidth=3;
  for(let i=0;i<=4;i++){ const p=i*128; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke(); x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  x.strokeStyle='rgba(255,255,255,0.20)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){ const p=i*128+3; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke(); x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  return TX(c,3,3);
})();
/* 海面（细碎浪纹） */
const SEA = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#3d94a6'; x.fillRect(0,0,512,512);
  for(let i=0;i<70;i++){
    x.fillStyle='rgba('+R(52,86).toFixed(0)+','+R(140,176).toFixed(0)+','+R(158,190).toFixed(0)+',0.30)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(30,120), R(12,45), 0, 0, 6.2832); x.fill();
  }
  // 细碎浪纹（短弧线）
  x.strokeStyle='rgba(205,238,240,0.5)'; x.lineWidth=3; x.lineCap='round';
  for(let i=0;i<220;i++){
    const px=Math.random()*512, py=Math.random()*512, w=R(10,34);
    x.beginPath(); x.moveTo(px,py);
    x.quadraticCurveTo(px+w/2, py-R(2,6), px+w, py);
    x.stroke();
  }
  x.strokeStyle='rgba(240,250,250,0.35)';
  for(let i=0;i<90;i++){
    const px=Math.random()*512, py=Math.random()*512, w=R(6,20);
    x.beginPath(); x.moveTo(px,py);
    x.quadraticCurveTo(px+w/2, py-R(2,5), px+w, py);
    x.stroke();
  }
  speckle(x,512,512,600,1.4,0.06);
  return TX(c,4,2);
})();
/* 浪花白沫（透明） */
const FOAM = (function(){
  const c=CV(256,64), x=c.getContext('2d');
  x.clearRect(0,0,256,64);
  for(let i=0;i<60;i++){
    const px=Math.random()*256, py=14+Math.random()*36, w=R(8,30);
    x.fillStyle='rgba(255,255,255,'+(0.25+Math.random()*0.55).toFixed(2)+')';
    x.beginPath(); x.ellipse(px,py,w,R(3,8),0,0,6.2832); x.fill();
  }
  x.fillStyle='rgba(255,255,255,0.75)';
  for(let i=0;i<8;i++){
    const px=Math.random()*256, w=R(20,60);
    x.beginPath(); x.ellipse(px, 30+Math.random()*10, w, 4, 0, 0, 6.2832); x.fill();
  }
  return TX(c);
})();
/* 遮阳棚帆布条纹 */
const AWNING = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#f4efe2'; x.fillRect(0,0,256,256);
  x.fillStyle='#5f93c9';
  for(let i=0;i<8;i+=2) x.fillRect(i*32,0,32,256);
  speckle(x,256,256,300,1.2,0.05);
  return TX(c,1,1);
})();

/* ============================================================
   标牌贴图
   ============================================================ */
const TEX_WARN = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#f2c53c'; x.fillRect(0,0,256,256);
  x.strokeStyle='#d0392b'; x.lineWidth=14; x.strokeRect(10,10,236,236);
  // 波浪图标
  x.strokeStyle='#20344a'; x.lineWidth=10; x.lineCap='round';
  for(let i=0;i<3;i++){
    const y0=70+i*26;
    x.beginPath();
    for(let px=40;px<=216;px+=8) x.lineTo(px, y0 + Math.sin(px*0.09+i*1.4)*9);
    x.stroke();
  }
  x.fillStyle='#20344a'; x.font='bold 44px '+JP; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('高波注意', 128, 186);
  x.font='bold 26px '+JP;
  x.fillText('遊泳禁止', 128, 224);
  return TX(c);
})();
const TEX_GUIDE = (function(){
  const c=CV(512,256), x=c.getContext('2d');
  x.fillStyle='#8a6242'; x.fillRect(0,0,512,256);
  x.strokeStyle='#6d4c33'; x.lineWidth=10; x.strokeRect(6,6,500,244);
  x.fillStyle='#f6f1e4'; x.font='bold 46px '+JP; x.textAlign='left'; x.textBaseline='middle';
  x.fillText('海浜公園', 30, 62);
  x.font='bold 34px '+JP;
  x.fillText('エメラルド浜', 30, 128);
  x.fillText('桟橋・釣り場', 30, 190);
  x.font='bold 44px '+JP; x.textAlign='right';
  x.fillText('→', 470, 62);
  x.font='bold 36px '+JP;
  x.fillText('→', 470, 128);
  x.fillText('↑', 470, 190);
  return TX(c);
})();
const TEX_NOTICE = (function(){
  const c=CV(512,384), x=c.getContext('2d');
  x.fillStyle='#e8e2d2'; x.fillRect(0,0,512,384);
  x.strokeStyle='#7a6248'; x.lineWidth=12; x.strokeRect(8,8,496,368);

function updateWater(t){
  const p = seaGeo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){
    const x=seaBase[i], z=seaBase[i+2];
    p[i+1] = 0.055*Math.sin(x*1.05 + t*1.6)
           + 0.042*Math.cos(z*1.55 + t*2.1)
           + 0.022*Math.sin((x+z)*2.3 + t*3.0);
  }
  seaGeo.attributes.position.needsUpdate = true;
  seaGeo.computeVertexNormals();
  seaMat.map.offset.y -= 0.0055;
  seaMat.map.offset.x -= 0.0025;
}

const deckWood = MK(0xa3835c,{map:DECK});
const railWhite = MK(0xe9eef2);

function rail(x0,z0,x1,z1,y0){
  const len = Math.hypot(x1-x0, z1-z0);
  const ry = Math.atan2(-(z1-z0), (x1-x0));
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  [0.86, 0.55].forEach(h=>{
    const b = BX(root, len, 0.055, 0.055, railWhite, cx, y0+h, cz, {ol:0});
    b.rotation.y = ry;
  });
  const n = Math.max(2, Math.round(len/0.8));
  for(let i=0;i<=n;i++){
    const t=i/n;
    CY(root, 0.035,0.035,0.88, 8, railWhite, x0+(x1-x0)*t, y0+0.44, z0+(z1-z0)*t, {ol:0});
  }
}

    new T.Vector3(x0,y0,z0),
    new T.Vector3((x0+x1)/2, (y0+y1)/2-0.16, (z0+z1)/2),

}

function seaLamp(x,z,y0,h,armRy){
  const pm = MK(0x2f4a44);
  CY(root, 0.075,0.10,h, 10, pm, x, y0+h/2, z, {olt:0.012});
  CY(root, 0.11,0.12,0.08, 10, MK(0x24382f), x, y0+0.04, z, {ol:0});

  arm.rotation.z = 0.6*Math.cos(armRy); arm.rotation.x = -0.6*Math.sin(armRy);
  CY(root, 0.14,0.17,0.09, 10, MK(0x24382f), hx, y0+h+0.36, hz, {ol:0});
  const glass = CY(root, 0.115,0.135,0.26, 10, MK(0xfff0c8,{emissive:0xffd27a, ei:0.85}), hx, y0+h+0.2, hz, {ol:0});
  CY(root, 0.06,0.075,0.07, 8, MK(0x24382f), hx, y0+h+0.05, hz, {ol:0});
  const gl = new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:0xffd9a0, blending:T.AdditiveBlending, opacity:0.30, transparent:true, depthWrite:false}));
  gl.position.set(hx, y0+h+0.2, hz); gl.scale.set(1.6,1.6,1); root.add(gl);
  ptLight('lp'+x.toFixed(1)+z.toFixed(1), 0xffd9a8, 0.85, 8.5, hx, y0+h, hz);
  shadowBlob(x, y0+0.012, z, 1.0, 1.0, 0.42);
  return {glass:glass, sprite:gl};
}

function updateRain(dt){
  const p = rainPos;
  for(let i=0;i<RAIN_N;i++){
    let y = rainY[i] - rainV[i]*dt;
    if(y < -0.2){ y = R(10,12.5); rainX[i]=R(-10.5,10.5); rainZ[i]=R(-10.5,10.5); }
    rainY[i]=y;
    const j=i*6, x=rainX[i], z=rainZ[i], l=rainL[i];
    p[j]=x; p[j+1]=y; p[j+2]=z;
    p[j+3]=x+0.05*l; p[j+4]=y+l; p[j+5]=z+0.02*l;

  m.rotation.x = -Math.PI/2; m.visible = false; root.add(m);
  ripples.push({m: m, t: 0, dur: 1, s0: 0.4, s1: 1.8, alive: false});
}
function spawnRipple(x, y, z, scale){
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    if(r.alive) continue;
    r.alive = true; r.t = 0; r.dur = R(0.9,1.5);
    r.s0 = 0.35*scale; r.s1 = R(1.4,2.2)*scale;
    r.m.position.set(x,y,z); r.m.visible = true;
    return r;
  }
}
let rippleTimer = 0, splashTimer = 0;
function updateRipples(dt){
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    if(!r.alive) continue;
    r.t += dt/r.dur;
    if(r.t >= 1){ r.alive=false; r.m.visible=false; continue; }
    const s = r.s0 + (r.s1-r.s0)*r.t;
    r.m.scale.set(s, s, 1);
    r.m.material.opacity = (1-r.t)*(1-r.t)*0.7;
  }
  // 零星雨点涟漪：落在积水与海面
  rippleTimer += dt*22;
  while(rippleTimer > 1){
    rippleTimer -= 1;
    if(Math.random() > 0.5) continue;
    if(Math.random() < 0.45){
      const p = PUDDLES[(Math.random()*PUDDLES.length)|0];
      spawnRipple(p.x+R(-p.w*0.3,p.w*0.3), p.y+0.006, p.z+R(-p.d*0.3,p.d*0.3), R(0.4,0.8));
    }else{
      const x=R(-8,8), z=R(2.6,7.6);
      spawnRipple(x, 0.16, z, R(0.6,1.2));
    }
  }
  // 礁石拍浪涟漪
  splashTimer += dt;
  if(splashTimer > 1.3){
    splashTimer = 0;
    const p = ROCK_SPLASH[(Math.random()*ROCK_SPLASH.length)|0];
    if(p) spawnRipple(p.x+R(-0.3,0.3), 0.16, p.z-0.3, R(0.8,1.3));
  }
}

/* ============================================================
   声音：雨声 + 间歇雷霆（Web Audio 程序化合成，完全离线）
   ============================================================ */
const snd = { ctx:null, gain:null, lfoG:null, noiseBuf:null, on:false, vol:0.55 };
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  snd.ctx = new AC();
  // 噪声源（雨 + 雷共用）
  const len = snd.ctx.sampleRate * 3;
  const buf = snd.ctx.createBuffer(1, len, snd.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let l0=0, l1=0;
  for(let i=0;i<len;i++){
    const w = Math.random()*2-1;
    l0 = 0.97*l0 + 0.03*w;
    l1 = 0.85*l1 + 0.15*w;
    d[i] = (l0*2.2 + l1*0.8 + w*0.12) * 0.42;
  }
  snd.noiseBuf = buf;
  // —— 雨声（细雨底噪）——
  const src = snd.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const hp = snd.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500;
  const lp = snd.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2100; lp.Q.value=0.4;
  snd.gain = snd.ctx.createGain(); snd.gain.gain.value=0;
  src.connect(hp); hp.connect(lp); lp.connect(snd.gain); snd.gain.connect(snd.ctx.destination);
  src.start();
  // 缓慢起伏，模拟海风雨势变化
  const lfo = snd.ctx.createOscillator(); lfo.frequency.value=0.08;
  snd.lfoG = snd.ctx.createGain(); snd.lfoG.gain.value=0;
  lfo.connect(snd.lfoG); snd.lfoG.connect(snd.gain.gain); lfo.start();
}
function playThunder(){
  if(!snd.ctx || !snd.on) return;
  const c = snd.ctx, t = c.currentTime;
  const dur = 2.6 + Math.random()*2.2;
  const src = c.createBufferSource(); src.buffer = snd.noiseBuf;
  const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.8;
  lp.frequency.setValueAtTime(360 + Math.random()*260, t);
  lp.frequency.exponentialRampToValueAtTime(60, t + 1.4 + Math.random()*0.8);
  const g = c.createGain();
  const peak = snd.vol * (0.42 + Math.random()*0.4);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.05 + Math.random()*0.35);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  src.connect(lp); lp.connect(g); g.connect(c.destination);
  const off = Math.random()*1.2;
  src.start(t, off, dur + 0.2);
}
(function(){
  const btn=document.getElementById('sndBtn'), vol=document.getElementById('sndVol'),
        icOn=document.getElementById('icOn'), icOff=document.getElementById('icOff');
  btn.addEventListener('click', ()=>{
    if(!snd.ctx) sndBuild();
    if(!snd.ctx) return;
    if(snd.ctx.state==='suspended') snd.ctx.resume();
    snd.on = !snd.on;
    icOn.style.display  = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none'  : 'block';
    const t = snd.ctx.currentTime;
    snd.gain.gain.setTargetAtTime(snd.on ? snd.vol*0.55 : 0, t, 0.5);
    snd.lfoG.gain.setTargetAtTime(snd.on ? snd.vol*0.10 : 0, t, 0.5);
  });
  vol.addEventListener('input', ()=>{
    snd.vol = vol.value/100;
    if(snd.on){
      const t = snd.ctx.currentTime;
      snd.gain.gain.setTargetAtTime(snd.vol*0.55, t, 0.15);
      snd.lfoG.gain.setTargetAtTime(snd.vol*0.10, t, 0.15);
    }
  });
  renderer.domElement.addEventListener('pointerdown', ()=>{
    if(snd.ctx && snd.ctx.state==='suspended') snd.ctx.resume();
  });
})();

/* ---------------- 雷电闪光 ---------------- */
const FOG_BASE = new T.Color(0xa7bac9);
const FOG_FLASH = new T.Color(0xdceaf4);
let flashK = 0, flashSeq = 0, flashNext = 6;
function updateFlash(dt){
  flashNext -= dt;
  if(flashNext <= 0){
    flashNext = R(9, 24);
    flashSeq = R(0.5, 0.9);
    setTimeout(playThunder, R(500, 1800));
  }
  if(flashSeq > 0){
    flashSeq -= dt;
    flashK = Math.max(flashK, flashSeq * (0.6 + 0.4*Math.sin(performance.now()*0.045)));
  }
  flashK = Math.max(0, flashK - dt*2.4);
  const k = Math.min(1, flashK);
  hemi.intensity = 0.72 + k*0.85;
  ambient.intensity = 0.42 + k*0.55;
  sun.intensity = 0.52 + k*0.55;
  BG.copy(BG_BASE).lerp(BG_FLASH, k*0.6);
  scene.fog.color.copy(FOG_BASE).lerp(FOG_FLASH, k*0.6);
}

/* ============================================================
   动画
   ============================================================ */
let time = 0, last = performance.now();
let flickV = 1;

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  time += dt;

  /* 相机 */
  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.88;
  ctrl.phi = clamp(ctrl.phi, 0.20, 1.36);
  ctrl.r   = clamp(ctrl.r, 8, 55);
  if(ctrl.dragging) ctrl.idle = 0; else ctrl.idle += dt;
  if(ctrl.idle > 5) ctrl.theta += dt*0.009;
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 海 / 雨 / 涟漪 */
  updateWater(time);
  updateCloudShadows(dt);
  updateRain(dt);
  updateRipples(dt);
  updateFlash(dt);

  /* 岸线浪花 */
  foams.forEach(f=>{
    f.m.material.opacity = f.base + 0.22*Math.sin(time*1.05 + f.ph);
    f.m.position.z = f.z0 + 0.13*Math.sin(time*0.85 + f.ph);
  });
  splashFoams.forEach(sf=>{
    const k = Math.max(0, Math.sin(time*1.35 + sf.ph));
    sf.s.material.opacity = k*0.4;
    sf.s.scale.set(0.9 + k*0.5, 0.7 + k*0.35, 1);
  });

  /* 浮标随浪起伏 */
  buoy.position.y = 0.08 + 0.06*Math.sin(time*1.25);
  buoy.rotation.z = 0.09*Math.sin(time*0.9);
  buoy.rotation.x = 0.06*Math.sin(time*1.1+1.3);

  /* 海风：椰树叶 / 防护林摆动 */
  palmLeaves.forEach(p=>{
    p.top.rotation.z = p.amp*Math.sin(time*1.55 + p.ph);
    p.top.rotation.x = p.amp*0.6*Math.sin(time*1.1 + p.ph*1.7);
  });

  /* 低云漂移 */
  clouds.forEach(c=>{
    c.g.position.x += c.v*dt;
    if(c.g.position.x > 13) c.g.position.x = -13;
  });

  /* 灯串微光闪烁 + 路灯呼吸 */
  flickV += (1 - flickV) * Math.min(1, dt*5);
  if(Math.random() < dt*0.4) flickV = 0.55 + Math.random()*0.35;
  const lv = 0.8 + 0.2*flickV;
  bulbs.forEach((b,i)=>{
    b.material.opacity = 0.55 + 0.45*(0.7+0.3*Math.sin(time*2.2 + i*0.9))*lv;
  });
  lampGlass.forEach((lg,i)=>{
    lg.glass.material.emissiveIntensity = 0.72 + 0.18*Math.sin(time*1.6 + i*1.9)*lv;
    lg.sprite.material.opacity = 0.24 + 0.10*Math.sin(time*1.6 + i*1.9)*lv;
  });

  /* 栈道水渍缓慢风干（缓慢周期性变化） */
  const dry = 0.5 + 0.5*Math.sin(time*0.06);
  deckWet.opacity = 0.08 + 0.10*dry;

  renderer.render(scene, camera);
}
animate();
</script>
