
<header>
  <div class="logo">盒</div>
  <h1>可组装拼接盒 · 参数化建模工具</h1>
  <span class="ver">燕尾榫卯互锁 ｜ 50×50×25 基准 ｜ 单文件网页版</span>
  <div class="sp"></div>
  <label style="font-size:12px; color:var(--muted)">预设</label>
  <select id="preset"></select>
  <button id="btnSave">保存参数</button>
  <button id="btnLoad">载入参数</button>
  <input accept=".json,application/json" id="fileJson" type="file" style="display:none">
</header>

<main>
  <aside id="panel"></aside>

  <div id="stage">
    <div id="cvCard">
      <canvas id="cv"></canvas>
      <div id="cvErr"></div>
    </div>

    <div class="cards">
      <div class="card">
        <h2>派生量 <span class="tag" id="geomTag">已重建</span></h2>
        <table class="kv" id="derived"></table>
      </div>
      <div class="card">
        <h2>设计校核 <span class="tag" id="checkTag">…</span></h2>
        <div id="checkList"></div>
      </div>
    </div>

    <div class="card">
      <h2>网格体检与干涉</h2>
      <div id="stats"></div>
      <div class="ioBar">
        <button class="pri" id="btnBox">单盒 STL</button>
        <button id="btnArr">阵列 STL</button>
        <label>N×N</label>
        <input id="arrN" max="8" min="2" step="1" type="number" value="4">
        <button id="btnCoupon">试样 STL</button>
        <label>间隙 mm</label>
        <input id="couponClr" type="text" value="0.20">
        <div class="sep"></div>
        <button id="btnAll">全部生成</button>
        <button id="btnSelf">自检</button>
        <button id="btnReset" style="margin-left:auto">恢复默认</button>
      </div>
      <div id="log"></div>
      <div id="selfWrap"></div>
    </div>
  </div>
</main>
