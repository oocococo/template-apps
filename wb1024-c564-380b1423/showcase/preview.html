<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2329; --sub:#646a73;
    --line:#e5e6eb; --brand:#2f6fed; --brand-soft:#eaf1ff;
    --ok:#16a34a; --ok-soft:#e7f6ec; --bad:#e5484d; --bad-soft:#fdecec;
    --warn:#d97706; --shadow:0 2px 12px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  h1{font-size:18px;margin:0;}
  .sub-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .sub-switch button{border:0;background:transparent;padding:8px 16px;font-size:14px;color:var(--sub);cursor:pointer;}
  .sub-switch button.on{background:var(--brand);color:#fff;font-weight:600;}
  .modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .modes button{border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:7px 13px;border-radius:20px;font-size:13px;cursor:pointer;}
  .modes button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600;}
  .resume-bar{display:none;align-items:center;gap:10px;background:var(--brand-soft);
    border:1px solid #cfe0ff;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;color:var(--brand);flex-wrap:wrap;}
  .resume-bar button{border:1px solid var(--brand);background:#fff;color:var(--brand);
    border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .stats{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap;}
  .stats b{color:var(--ink);}
  .progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px;}
  .progress > i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);}
  .qhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap;}
  .tag{background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 8px;font-weight:600;}
  .tag.t2{background:#fff1e6;color:var(--warn);}
  .tag.er{background:#fdecec;color:var(--bad);}
  .qtext{font-size:17px;font-weight:600;margin:4px 0 12px;}
  .qimg{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:0 0 12px;display:block;}
  .imgmiss{font-size:12px;color:var(--sub);background:#fafafa;border:1px dashed var(--line);
    border-radius:8px;padding:8px;margin-bottom:12px;}
  .kpoint{position:relative;overflow:hidden;font-size:13px;color:var(--sub);background:#f7f9ff;border:1px solid #e4ecff;
    border-left:3px solid var(--brand);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
  .kpoint b{color:var(--ink);}
  /* 模拟考试专用：考点先模糊，点击后揭开（其余模式不受影响） */
  .kpoint.blur-hide .kpoint-body{filter:blur(7px);-webkit-filter:blur(7px);opacity:.72;
    user-select:none;-webkit-user-select:none;}
  .kpoint-veil{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:600;color:var(--brand);
    background:rgba(247,249,255,.78);cursor:pointer;text-align:center;padding:0 10px;
    -webkit-tap-highlight-color:transparent;}
  .kpoint-veil:hover{background:rgba(234,241,255,.95);}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;cursor:pointer;font-size:15px;background:#fff;transition:.15s;}
  .opt:hover{border-color:var(--brand);}
  .opt .key{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);font-weight:600;}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft);}
  .opt.sel .key{background:var(--brand);color:#fff;border-color:var(--brand);}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);}
  .opt.right .key{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);}
  .opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad);}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:600;}
  .opt.right .mark{color:var(--ok);} .opt.wrong .mark{color:var(--bad);}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn{border:0;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;font-weight:600;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .result{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .verdict{font-size:16px;font-weight:700;margin-bottom:8px;}
  .verdict.ok{color:var(--ok);} .verdict.bad{color:var(--bad);}
  .ans{font-size:14px;margin:6px 0;}
  .exp{font-size:14px;color:var(--sub);background:#fafafa;border-radius:10px;padding:12px;}
  .exp b{color:var(--ink);}
  .empty{text-align:center;color:var(--sub);padding:50px 0;}
  .exam-bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;
    color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;margin-bottom:12px;}
  .exam-bar .timer{font-weight:700;color:var(--bad);}
  .exam-right{display:flex;align-items:center;gap:10px;}
  .btn-restart{border:1px solid var(--bad);background:#fff;color:var(--bad);
    border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:600;}
  .btn-restart:hover{background:var(--bad);color:#fff;}
  .exam-result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;box-shadow:var(--shadow);}
  .score{font-size:46px;font-weight:800;margin:6px 0;}
  .score.pass{color:var(--ok);} .score.fail{color:var(--bad);}
  .foot{font-size:12px;color:var(--sub);margin-top:18px;line-height:1.7;}
  a{color:var(--brand);}
  .tips{display:flex;flex-direction:column;gap:14px;}
  .tip-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
  .tip-card h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .tip-card .idx{background:var(--brand);color:#fff;border-radius:8px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 26px;}
  .tip-card .mn{font-size:15px;font-weight:600;color:var(--ink);background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.9;}
  .tip-card .desc{font-size:14px;color:var(--sub);line-height:1.8;}
  .tip-card .mem{font-size:13px;color:var(--warn);margin-top:10px;background:#fff8ef;border:1px solid #ffe2c2;border-radius:8px;padding:8px 10px;line-height:1.7;}
</style><body>

</div><script>const memStore={data:{},getItem(k){return this.data[k]||null},setItem(k,v){this.data[k]=v},removeItem(k){delete this.data[k]},clear(){this.data={}}};window.BANK=[{"id":1,"q":"对未取得驾驶证驾驶机动车的，追究其法律责任。","opt":["正确","错误"],"a":[0],"type":3,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察无证驾驶的处罚。未取得驾驶证驾驶机动车属于违法行为，将依法追究法律责任。因此选择“正确”。相关法规参考：《道路交通安全法》第九十九条，未取得机动车驾驶证、机动车驾驶证被吊销或者机动车驾驶证被暂扣期间驾驶机动车的，由公安机关交通管理部门处二百元以上二千元以下罚款，可以并处十五日以下拘留。","img":null,"freq":20000.001},{"id":2,"q":"驾驶机动车应当随身携带哪种证件？","opt":["工作证","驾驶证","身份证","职业资格证"],"a":[1],"type":1,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察机动车上路行驶条件。驾驶机动车上路行驶应随车携带驾驶证、行驶证。因此选择“驾驶证”。相关法规参考：《道路交通安全法》第十九条，驾驶人应当按照驾驶证载明的准驾车型驾驶机动车；驾驶机动车时，应当随身携带机动车驾驶证。","img":null,"freq":20000.002},{"id":3,"q":"在实习期内驾驶机动车的，应当在车身后部粘贴或者悬挂哪种标志？","opt":["注意新手标志","注意避让标志","统一式样的实习标志","注意车距标志"],"a":[2],"type":1,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察实习期相关知识。实习期要在车后粘贴或悬挂实习标志，提醒其他车辆注意。因此选择“统一式样的实习标志”。相关法规参考：《机动车驾驶证申领和使用规定》第七十六条，在实习期内驾驶机动车的，应当在车身后部粘贴或者悬挂统一式样的实习标志。","img":null,"freq":38000.003},{"id":4,"q":"以欺骗、贿赂等不正当手段取得驾驶证被依法撤销驾驶许可的，多长时间不得重新申请驾驶许可？","opt":["3年内","终生","1年内","5年内"],"a":[0],"type":1,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察违规申领驾驶证行为。以欺骗、贿赂等手段取得驾驶证，是违法行为，取得的驾驶证也不合法，会被收缴驾驶证，3年内不得再次申领，处2000元以下罚款。因此选择“3年内”。相关法规参考：《机动车驾驶证申领和使用规定》第九十三条，申请人以欺骗、贿赂等不正当手段取得机动车驾驶证的，公安机关交通管理部门收缴机动车驾驶证，撤销机动车驾驶许可，处二千元以下罚款；申请人在三年内不得再次申领机动车驾驶证。","img":null,"freq":1036000.004},{"id":5,"q":"驾驶人要按照驾驶证载明的准驾车型驾驶车辆。","opt":["正确","错误"],"a":[0],"type":3,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察准驾车型。什么证开什么车，要按照驾驶证准驾的车型驾驶，与准驾车型不符上路行驶一次记9分。因此选择“正确”。相关法规参考：《道路交通安全法》第十九条，驾驶人应当按照驾驶证载明的准驾车型驾驶机动车；驾驶机动车时，应当随身携带机动车驾驶证。","img":null,"freq":20000.005},{"id":6,"q":"驾驶报废机动车上路行驶的驾驶人，除按规定罚款外，还要受到哪种处理？","opt":["撤销驾驶许可","收缴驾驶证","强制恢复车况","吊销驾驶证"],"a":[3],"type":1,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察机动车强制报废相关规定。驾驶报废的机动车上路非常危险，除了按规定罚款，还要吊销其驾驶证。因此选择“吊销驾驶证”。相关法规参考：《道路交通安全法》第一百条：驾驶拼装的机动车或者已达到报废标准的机动车上道路行驶的，公安机关交通管理部门应当予以收缴，强制报废。对驾驶前款所列机动车上道路行驶的驾驶人，处200元以上2000元以下罚款，并吊销机动车驾驶证。","img":null,"freq":36000.006},{"id":7,"q":"对驾驶已达到报废标准的机动车上路行驶的驾驶人，会受到下列哪种处罚？","opt":["处15日以下拘留","吊销机动车驾驶证","处20元以上200元以下罚款","追究刑事责任"],"a":[1],"type":1,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察机动车强制报废相关规定。驾驶达到报废标准的机动车上路非常危险，除了按规定罚款，还要吊销其驾驶证。因此选择“吊销机动车驾驶证”。相关法规参考：《道路交通安全法》第一百条：驾驶拼装的机动车或者已达到报废标准的机动车上道路行驶的，公安机关交通管理部门应当予以收缴，强制报废。对驾驶前款所列机动车上道路行驶的驾驶人，处200元以上2000元以下罚款，并吊销机动车驾驶证。","img":null,"freq":1036000.007},{"id":8,"q":"驾驶机动车上路前应当检查车辆安全技术性能。","opt":["正确","错误"],"a":[0],"type":3,"sub":1,"ch":"驾驶证和机动车管理规定","diff":0,"er":0,"exp":"本题主要考察出车前的检查。驾驶人在行车前，应对机动车的安全技术性能进行检查，确保车辆无安全隐患再上路行驶。因此选择“正确”。相关法规参考：《道路交通安全法》第二十一条，驾驶人驾驶机动车上道路行驶前，应当对机动车的安全技术性能进行认真检查；不得驾驶安全设施不全或者机件不符合技术标准等具有安全隐患的机动车。","img":null,"freq":20000.008},{"id":1297,"q":"机动车倒车时，后方道路条件较好的，应在确认安全的情况下尽快完成倒车操作。","opt":["正确","错误"],"a":[0],"type":3,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察倒车时的安全驾驶。道路情况复杂时倒车应观察周边环境，减速慢行。后方道路条件较好的，应在确认安全的情况下尽快完成倒车操作，以免妨碍其他车辆正常行驶。因此选择“正确”。相关法规参考：GA/T1773.2-2021《机动车驾驶人安全文明操作规范第2部分：小型汽车驾驶》，9.7倒车，1.操作方法，倒车应按以下步骤操作：a）倒车前察明周边情况，必要时下车查看；b）挂入倒车挡，确认安全后低速倒车；c）倒车过程中持续观察车辆后方和前方两侧情况。倒车时车尾要朝向较安全一侧。","img":null,"freq":8000.297},{"id":1298,"q":"驾驶人进入驾驶室前，首先要做什么？","opt":["观察机动车周围情况","不用观察周围情况","开启车门直接上车","注意观察天气情况"],"a":[0],"type":1,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察出车前的检查。注意“进入驾驶室前”，也就是上车前，上车前要从驾驶室车门外开始，逆时针绕车一周，检查车辆及周边情况，查看车底，车后有无异常情况，如玩耍的小孩，确认安全后再上车。因此选择“观察机动车周围情况”。相关法规参考：GA/T 1773.2-2021《机动车驾驶人安全文明操作规范 第2部分：小型汽车驾驶》，9.1.1.1上车时，宜按以下步骤操作：a）上车开门前驾驶人站在驾驶室左门侧后位置，观察车辆前后交通情况，在确保安全的情况下用左手握住门把，打开车门，左脚向前迈近一步；b） 右手握住转向盘，右脚伸入驾驶室，侧身使臀部、腰部、上身、左脚依次进入驾驶室，自然坐下；c）左手用适当的力度顺势关闭车门，并确认车门关严。9.1.1.2确认驻车制动器处于制动状态，系好安全带，调整驾驶座椅、后视镜。","img":null,"freq":8000.298},{"id":1299,"q":"出车前对轮胎进行哪些方面的检查？","opt":["什么也不用检查","轮胎有没有清洗","备胎在什么位置","轮胎的紧固和气压"],"a":[3],"type":1,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察出车前的检查。对轮胎的检查是为了确保在行车过程中能安全行驶，应该检查的是轮胎的磨损、紧固、气压情况和轮胎侧面的磨损标记。因此选择“轮胎的紧固和气压”。相关内容拓展：对轮胎的检查包括：1.检查轮胎气压，气压不足要及时充气；2.检查轮胎侧面的磨损标记，磨损标记处沟槽深度小于1.6毫米时要立即更换；3.轮胎有裂纹或损伤要及时检修；4.轮胎沟槽内有异物的，要清除异物。","img":null,"freq":8000.299},{"id":1300,"q":"出车前检查冷却液、发动机机油、燃油等是否有渗漏现象。","opt":["正确","错误"],"a":[0],"type":3,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察出车前的检查。上路行驶前，驾驶人应检查车辆各项液体是否有渗漏现象，不得驾驶安全设施不全或者机件不符合技术标准等具有安全隐患的机动车，确保出行前一定都正常。因此选择“正确”。相关法规参考：GA/T 1773.2-2021《机动车驾驶人安全文明操作规范 第2部分：小型汽车驾驶》，5.1.1 机动车驾驶人（以下简称“驾驶人”）行车前应逆时针绕行车辆检查，并符合以下要求，a）车底或附近无儿童等人员及障碍物；b） 灯具完好；c） 机动车号牌齐全完好、无遮挡；d）轮胎气压正常、胎纹无异常磨损，轮胎表面无异物；e） 风窗玻璃、后视镜完好、清洁；f）车底无漏油、漏水；g）车门和后备箱盖关闭正常；h） 三角警告牌完好；有灭火器的，压力符合规定。5.1.2 上车后观察车内情况，应无影响安全操作的散落物。","img":null,"freq":8000.3},{"id":1301,"q":"行车前应对机动车驾驶室、发动机舱、车外部、轮胎进行检查。","opt":["正确","错误"],"a":[0],"type":3,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察出车前的检查。驾驶机动车上道路行驶前，驾驶人要对机动车的安全技术性能进行认真检查，不得驾驶安全设施不全或者机件不符合技术标准等具有安全隐患的机动车，确保出行前一定都正常。因此选择“正确”。相关法规参考：GA/T 1773.2-2021《机动车驾驶人安全文明操作规范 第2部分：小型汽车驾驶》，5.1.1 机动车驾驶人（以下简称“驾驶人”）行车前应逆时针绕行车辆检查，并符合以下要求，a）车底或附近无儿童等人员及障碍物；b） 灯具完好；c） 机动车号牌齐全完好、无遮挡；d）轮胎气压正常、胎纹无异常磨损，轮胎表面无异物；e） 风窗玻璃、后视镜完好、清洁；f）车底无漏油、漏水；g） 车门和后备箱盖关闭正常；h） 三角警告牌完好；有灭火器的，压力符合规定。5.1.2 上车后观察车内情况，应无影响安全操作的散落物。","img":null,"freq":8000.301},{"id":1302,"q":"使用已有裂纹或损伤的轮胎最容易引起什么后果？","opt":["向一侧偏驶","爆胎","转向困难","侧滑"],"a":[1],"type":1,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察出车前的检查。轮胎已经有裂纹或者损伤，说明轮胎的磨损很严重，在行驶过程中很容易发生气压过低，波浪变形、温度升高从而爆胎。因此选择“爆胎”。相关内容拓展：对轮胎的检查包括：1.检查轮胎气压，气压不足要及时充气；2.检查轮胎侧面的磨损标记，磨损标记处沟槽深度小于1.6毫米时要立即更换；3.轮胎有裂纹或损伤要及时检修；4.轮胎沟槽内有异物的，要清除异物。","img":null,"freq":8000.302},{"id":1303,"q":"汽车的专用备胎可作为正常轮胎长期使用。","opt":["正确","错误"],"a":[1],"type":3,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察备用轮胎的相关知识。备用轮胎只能作为应急使用，不能作为正常轮胎长期使用。因此选择“错误”。相关内容拓展：车辆配备的专用备胎不能作为正常轮胎长时间使用，只能在发生爆胎或轮胎漏气时临时应急使用。使用备胎时，行驶速度不能过快，而且要尽快将车开到最近的修理厂进行维修，换上正常的轮胎。","img":null,"freq":8000.303},{"id":1305,"q":"驾驶机动车的驾驶人不需要系安全带。","opt":["正确","错误"],"a":[1],"type":3,"sub":4,"ch":"安全行车常识","diff":0,"er":0,"exp":"本题主要考察安全带的使用常识。安全带的作用是在汽车发生碰撞或紧急制动时，固定驾乘人员位置，减轻对驾乘人员的伤害。驾驶人、乘车人在汽车行驶前，系好安全带是最有效的自我保护方法，在遇到意外危险情况时可避免受到致命的伤害。因此选择“错误”。相关法规参考：《道路交通安全法》第五十一条，机动车行驶时，驾驶人、乘坐人员应当按规定使用安全带，摩托车驾驶人及乘坐人员应当按规定戴安全头盔。","img":null,"freq":8000.305}];

const LS_WRONG='jiakao_wrong_v1', LS_REC='jiakao_rec_v2', LS_PROG='jiakao_progress_v2',
      LS_ANS='jiakao_ans_v2', LS_EXAM='jiakao_exam_v1';
let wrong = JSON.parse(memStore.getItem(LS_WRONG)||'{}');   // 全局错题汇总（用于错题本）
let recAll = JSON.parse(memStore.getItem(LS_REC)||'{}');    // 按 科目_模式 分桶：{ '1_seq':{qid:'right'|'wrong'}, ... }
let ansAll = JSON.parse(memStore.getItem(LS_ANS)||'{}');    // 按 科目_模式 分桶：{ '1_seq':{qid:[idx,...]}, ... }
// 当前分类(科目+模式)下的答题记录，独立保存 —— 切换标签互不串扰
let rec = {};    // {qid:'right'/'wrong'}
let qans = {};   // {qid:[index,...]}
function scopeKey(){ return `${S.sub}_${S.mode}`; }
function loadScope(){ rec = recAll[scopeKey()]||{}; qans = ansAll[scopeKey()]||{}; }
function commitScope(){
  if(Object.keys(rec).length) recAll[scopeKey()]=rec; else delete recAll[scopeKey()];
  if(Object.keys(qans).length) ansAll[scopeKey()]=qans; else delete ansAll[scopeKey()];
  try{
    memStore.setItem(LS_REC,JSON.stringify(recAll));
    memStore.setItem(LS_ANS,JSON.stringify(ansAll));
  }catch(e){}
}

const MODES = [
  {k:'seq',  n:'顺序练习'},
  {k:'rand', n:'随机练习'},
  {k:'wrong',n:'错题本'},
  {k:'top',  n:'精选500题'},
  {k:'exam', n:'模拟考试'},
  {k:'tips', n:'技巧口诀'},
];

let S = { sub:1, mode:'seq', list:[], idx:0, sel:new Set(), submitted:false,
          answered:0, correct:0, exam:null };

/* ---------- 列表构建 ---------- */
function buildList(){
  let base = BANK.filter(q=>q.sub===S.sub);
  let list;
  if(S.mode==='wrong'){
    list = base.filter(q=>wrong[q.id]);
  } else if(S.mode==='top'){
    // 精选500：按 freq 权重取前 500。freq = 官方题型分布权重 + 2026 高频必考模块加权 + 命中元贝精简500题单的权威种子加权（确定性，刷新不变）
    list = base.slice().sort((a,b)=>b.freq-a.freq).slice(0, Math.min(500, base.length));
  } else if(S.mode==='rand'){
    list = base.slice().sort(()=>Math.random()-0.5);
  } else if(S.mode==='exam'){
    // 模拟考试按真实题型配比 + 高频加权抽题：科目一 100题=60单选+40判断；科目四 50题(含多选)
    if(S.sub===1){
      const single = base.filter(q=>q.type===1);
      const judge  = base.filter(q=>q.type===3);
      list = shuffleArr([...weightedSample(single,60), ...weightedSample(judge,40)]);
    } else {
      const mc   = base.filter(q=>q.type===2);          // 科目四多选（必含）
      const rest = base.filter(q=>q.type!==2);
      list = shuffleArr([...weightedSample(mc,20), ...weightedSample(rest,30)]);
    }
  } else if(S.mode==='tips'){
    list = []; // 技巧口诀为静态速记内容，无题目
  } else {
    list = base;
  }
  S.list = list; S.idx = 0; S.answered=0; S.correct=0;
}

/* ---------- 进度持久化 ---------- */
function saveProgress(){
  try{
    const ids = (S.mode==='rand'||S.mode==='exam') ? S.list.map(q=>q.id) : null;
    const data = {
      sub:S.sub, mode:S.mode, idx:S.idx, ids,
      exam: S.exam ? {answers:S.exam.answers, finished:S.exam.finished,
                      total:S.exam.total, left:S.exam.left, duration:S.exam.duration} : null
    };
    memStore.setItem(LS_PROG, JSON.stringify(data));
  }catch(e){}
}
function loadProgress(){
  try{ return JSON.parse(memStore.getItem(LS_PROG)); }catch(e){ return null; }
}

/* ---------- 模拟考试独立存档（试卷 + 位置 + 答案 + 剩余时间） ---------- */
function saveExam(){
  try{
    if(!S.exam) return;  // 非考试模式：不动考试存档（避免练习时误清）
    // 关键：只有"仍处于考试模式"时才同步题号。
    // 切换到别的菜单后 buildList() 会把 S.idx 重置为 0，若此时再同步，
    // 就会把存档里的题号清回第 1 题 → 切回"模拟考试"又回到第一题（本 BUG）。
    if(S.mode==='exam') S.exam.idx = S.idx;
    memStore.setItem(LS_EXAM, JSON.stringify({
      sub:S.exam.sub, ids:S.exam.ids, idx:S.exam.idx||0, answers:S.exam.answers,
      sel:S.exam.sel||{}, finished:!!S.exam.finished, total:S.exam.total,
      duration:S.exam.duration, left:S.exam.left
    }));
  }catch(e){}
}
function clearExam(){ try{ memStore.removeItem(LS_EXAM); }catch(e){} }
function loadExam(){
  try{
    const e=JSON.parse(memStore.getItem(LS_EXAM));
    if(!e || !e.sub || !Array.isArray(e.ids)) return null;
    const list=e.ids.map(id=>QMAP[id]).filter(Boolean);
    if(!list.length) return null;
    return {e,list};
  }catch(err){ return null; }
}

/* ---------- 统计条（已做/正确/正确率/错题） ---------- */
function renderStats(){
  const statsEl=document.getElementById('stats');
  const progEl=document.getElementById('prog');
  if(!statsEl) return;
  if(S.mode==='exam' && S.exam && S.exam.finished){ statsEl.innerHTML=''; progEl.style.width='100%'; return; }
  if(!S.list.length){ statsEl.innerHTML=''; progEl.style.width='0'; return; }
  const total=S.list.length;
  if(S.mode==='wrong'){
    statsEl.innerHTML = `错题本共 <b>${Object.keys(wrong).filter(id=>QMAP[id]&&QMAP[id].sub===S.sub).length}</b> 题`;
    progEl.style.width='0'; return;
  }
  if(S.mode==='exam'){ statsEl.innerHTML=''; progEl.style.width='0'; return; }
  // key 均为字符串（memStore 序列化后），与题目数字 id 比较时统一转字符串；rec 为当前(科目+模式)独立记录
  const doneKeys=Object.keys(rec).filter(id=>S.list.some(x=>String(x.id)===id));
  const doneCount=doneKeys.length;
  const rightCount=doneKeys.filter(id=>rec[id]==='right').length;
  const wrongSub=Object.keys(wrong).filter(id=>QMAP[id]&&QMAP[id].sub===S.sub).length;
  statsEl.innerHTML=`共 <b>${total}</b> 题 · 已做 <b>${doneCount}</b> · 正确 <b>${rightCount}</b> · 正确率 <b>${doneCount?Math.round(rightCount/doneCount*100):0}%</b> · 错题 <b>${wrongSub}</b>`;
  progEl.style.width=(doneCount/total*100)+'%';
}

/* ---------- 渲染 ---------- */
function render(){
  loadScope(); // 载入当前(科目+模式)独立的答题记录，避免切换标签串扰
  renderModes();
  const stage = document.getElementById('stage');
  const examBar = document.getElementById('examBar');
  const statsEl = document.getElementById('stats');

  // 技巧口诀：静态速记内容，隐藏统计/进度/考试条
  if(S.mode==='tips'){
    examBar.style.display='none';
    statsEl.innerHTML='';
    document.getElementById('prog').style.width='0';
    renderTips();
    return;
  }

  if(S.mode==='exam' && S.exam && S.exam.finished){
    stage.innerHTML=''; renderExamResult(); examBar.style.display='none'; statsEl.innerHTML='';
    document.getElementById('prog').style.width='100%'; return;
  }
  examBar.style.display = (S.mode==='exam')?'flex':'none';

  if(!S.list.length){
    stage.innerHTML='<div class="card empty">该科目暂无题目（或错题本还是空的，先去练习吧）</div>';
    statsEl.innerHTML=''; document.getElementById('prog').style.width='0';
    return;
  }
  const q = S.list[S.idx];
  const total = S.list.length;
  // 进度/统计（独立函数，提交后也会调用刷新）
  renderStats();

  if(S.mode==='exam'){
    document.getElementById('examInfo').textContent = `第 ${S.idx+1} / ${total} 题`;
  }

  // 还原提示：恢复已作答状态时，先挂载卡片再做结果重绘（保证 .actions / submitBtn 在 DOM 中可被查到）

  // 题目卡片
  const card = document.createElement('div'); card.className='card';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<span class="tag">${TYPE[q.type]}</span>`+
    (q.ch?`<span>章节：${CHAPTERS[q.ch]||q.ch}</span>`:'')+
    (q.er?`<span class="tag er">易错率 ${q.er}%</span>`:'')+
    `<span>第 ${S.idx+1} / ${total} 题</span>`;
  card.appendChild(head);

  const qt = document.createElement('div'); qt.className='qtext'; qt.textContent=q.q; card.appendChild(qt);

  if(q.img){
    const im = document.createElement('img'); im.className='qimg'; im.src=q.img; im.loading='lazy';
    im.onerror=()=>{ im.style.display='none';
      const m=document.createElement('div'); m.className='imgmiss'; m.textContent='（图片加载失败，需联网或图片源已失效）';
      if(im.parentNode) im.parentNode.insertBefore(m,im.nextSibling); };
    card.appendChild(im);
  }

  const opts = document.createElement('div'); opts.className='opts';
  q.opt.forEach((text,i)=>{
    const o = document.createElement('div'); o.className='opt';
    const key = String.fromCharCode(65+i);
    o.innerHTML = `<span class="key">${key}</span><span class="ot">${escapeHtml(text)}</span><span class="mark"></span>`;
    o.onclick = ()=>onSelect(i,o);
    o.dataset.i=i;
    opts.appendChild(o);
  });
  card.appendChild(opts);

  // 考点 / 知识点（接口 explain 字段）—— 常驻展示在题目下方
  // 模拟考试：加一层模糊遮罩，点击后才揭开，避免直接看到提示；其余模式保持原样直接展示
  if(q.exp){
    const kp = document.createElement('div'); kp.className='kpoint';
    if(S.mode==='exam'){
      kp.classList.add('blur-hide');
      const body=document.createElement('div'); body.className='kpoint-body';
      body.innerHTML = `<b>💡 考点 / 知识点：</b>${escapeHtml(q.exp)}`;
      const veil=document.createElement('div'); veil.className='kpoint-veil';
      veil.innerHTML = '👆 点击显示考点 / 知识点';
      veil.onclick=()=>{ kp.classList.remove('blur-hide'); if(veil.parentNode) veil.parentNode.removeChild(veil); };
      kp.appendChild(body); kp.appendChild(veil);
    } else {
      kp.innerHTML = `<b>💡 考点 / 知识点：</b>${escapeHtml(q.exp)}`;
    }
    card.appendChild(kp);
  }

  const acts = document.createElement('div'); acts.className='actions';
  const submitBtn = mkBtn('提交答案','primary', submit);
  submitBtn.id='submitBtn';
  const prevBtn = mkBtn('上一题','ghost', prev);
  const nextBtn = mkBtn('下一题','ghost', next);
  if(S.mode==='exam'){ nextBtn.textContent='下一题'; nextBtn.disabled=true; }
  acts.appendChild(prevBtn); acts.appendChild(submitBtn); acts.appendChild(nextBtn);
  card.appendChild(acts);

  const result = document.createElement('div'); result.id='result'; result.className='result';
  // 恢复已作答状态（练习模式按用户选择恢复；考试模式按答案恢复）
  if(S.mode!=='exam' && qans[q.id]){
    S.submitted=true; S.sel=new Set(qans[q.id]);
  } else if(S.mode==='exam' && S.exam && S.exam.answers[S.idx]!==undefined){
    S.submitted=true;
    const sv = S.exam.sel && S.exam.sel[S.idx];
    if(sv) S.sel = new Set(sv);   // 恢复本题原来的选择，便于高亮显示
  }
  card.appendChild(result);

  stage.innerHTML=''; stage.appendChild(card);
  S._opts = opts; // 缓存
  if(S.submitted){ paintResult(q,opts,result,true); document.getElementById('submitBtn').disabled=true; }
}

function renderTips(){
  const stage=document.getElementById('stage');
  let html='<div class="tips">';
  TIPS.forEach((t,i)=>{
    html+=`<div class="tip-card">
      <h3><span class="idx">${i+1}</span>${escapeHtml(t.title)}</h3>
      <div class="mn">${escapeHtml(t.mn).replace(/\n/g,'<br>')}</div>
      <div class="desc">${escapeHtml(t.desc).replace(/\n/g,'<br>')}</div>
      ${t.mem?`<div class="mem">🧠 记忆：${escapeHtml(t.mem).replace(/\n/g,'<br>')}</div>`:''}
    </div>`;
  });
  html+='</div>';
  stage.innerHTML=html;
}

function paintResult(q,opts,result,restore){
  // restore=true：重绘已作答的题（切回模式/刷新恢复）。此时 S.sel 已被清空，
  // 绝不能用它重新判定，否则会把原本答对的记录覆盖成答错。
  restore = !!restore;
  const ok = (restore && S.mode==='exam' && S.exam && S.exam.answers[S.idx]!==undefined)
             ? !!S.exam.answers[S.idx]
             : sameSet(S.sel, q.a);
  const verdict = document.createElement('div');
  verdict.className='verdict '+(ok?'ok':'bad');
  verdict.textContent = ok?'✓ 回答正确':'✗ 回答错误';
  result.appendChild(verdict);
  const ans = document.createElement('div');
  ans.className='ans'; ans.style.fontSize='14px';
  ans.innerHTML = `正确答案：<b>${q.a.map(i=>String.fromCharCode(65+i)).join('、')}</b>`;
  result.appendChild(ans);
  // 高亮选项
  q.opt.forEach((t,i)=>{
    const o = opts.children[i]; if(!o) return;
    const isCorrect = q.a.includes(i);
    const isSel = S.sel.has(i);
    if(isCorrect) o.classList.add('right');
    else if(isSel) o.classList.add('wrong');
    const mark = o.querySelector('.mark');
    if(isCorrect) mark.textContent='正确';
    else if(isSel) mark.textContent='你的选择';
  });
  // 记录
  if(S.mode==='exam'){
    if(!restore){                                   // 仅真实提交时写入，恢复重绘不动存档
      S.exam.answers[S.idx] = ok;
      (S.exam.sel = S.exam.sel || {})[S.idx] = [...S.sel];
    }
    const nb = document.querySelector('.actions').children[2];
    if(nb) nb.disabled=false;
  }
  // 练习模式提供"重做本题"
  if(S.mode!=='exam'){
    const redo = mkBtn('重做本题','ghost', ()=>{
      delete qans[q.id]; delete rec[q.id];
      if(wrong[q.id]) delete wrong[q.id];
      commitScope();
      try{ memStore.setItem(LS_WRONG,JSON.stringify(wrong)); }catch(e){}
      S.submitted=false; S.sel=new Set(); saveProgress(); render();
    });
    result.appendChild(redo);
  }
}

/* ---------- 交互 ---------- */
function onSelect(i,o){
  if(S.submitted) return;
  const q=S.list[S.idx];
  if(q.type===2){ // 多选
    if(S.sel.has(i)) S.sel.delete(i); else S.sel.add(i);
  } else {
    S.sel = new Set([i]);
    [...S._opts.children].forEach(c=>c.classList.remove('sel'));
  }
  if(S.sel.has(i)) o.classList.add('sel'); else o.classList.remove('sel');
}
function submit(){
  if(S.submitted) return;
  if(!S.sel.size){ alert('请先选择一个答案'); return; }
  S.submitted=true;
  const q=S.list[S.idx];
  const ok = sameSet(S.sel, q.a);
  // 练习/考试分别处理：练习写入"当前分类"独立记录；考试仅写入全局错题汇总（不污染练习记录）
  if(S.mode!=='exam'){
    rec[q.id] = ok?'right':'wrong';
    qans[q.id] = [...S.sel];
    commitScope();
  }
  if(!ok) wrong[q.id]=true; else if(wrong[q.id]) delete wrong[q.id];
  try{ memStore.setItem(LS_WRONG,JSON.stringify(wrong)); }catch(e){}
  const opts = S._opts; const result=document.getElementById('result');
  paintResult(q,opts,result,false);
  document.getElementById('submitBtn').disabled=true;
  saveProgress(); saveExam();
  renderStats(); // 提交后立即刷新统计条
}
function next(){
  if(S.idx < S.list.length-1){ S.idx++; resetQ(); render(); saveProgress(); saveExam(); }
  else if(S.mode==='exam'){ finishExam(); }
  else { alert('已经是最后一题啦'); }
}
function prev(){ if(S.idx>0){ S.idx--; resetQ(); render(); saveProgress(); saveExam(); } }
function resetQ(){ S.sel=new Set(); S.submitted=false; }

/* ---------- 模拟考试 ---------- */
function updateTimer(){
  const m=String(Math.floor(S.exam.left/60)).padStart(2,'0');
  const s=String(S.exam.left%60).padStart(2,'0');
  const t=document.getElementById('timer'); if(t) t.textContent=`${m}:${s}`;
}
function startExamTimer(){
  clearInterval(S.exam.timer);
  S.exam.timer=setInterval(()=>{
    S.exam.left--; updateTimer();
    if(S.exam.left<=0){ clearInterval(S.exam.timer); finishExam(); }
  },1000);
}
function startExam(){
  S.exam = { answers:{}, finished:false, total:S.list.length, sub:S.sub,
             ids:S.list.map(q=>q.id), idx:0,
             duration:45*60, left:45*60, timer:null };
  startExamTimer();
  saveExam();
}
function finishExam(){
  clearInterval(S.exam && S.exam.timer);
  S.exam.finished=true; saveExam(); saveProgress();
  // 若用户此刻已切到别的模式（顺序/错题等），不要强行打断跳转到成绩页
  if(S.mode==='exam') render();
}
function renderExamResult(){
  const a=S.exam.answers; const total=S.exam.total;
  const right=Object.values(a).filter(Boolean).length;
  const score=Math.round(right/total*100);
  const pass=score>=90;
  const stage=document.getElementById('stage');
  stage.innerHTML=`<div class="exam-result">
    <div>模拟考试结束</div>
    <div class="score ${pass?'pass':'fail'}">${score}<span style="font-size:18px">分</span></div>
    <div style="color:var(--sub);margin-bottom:14px">答对 ${right} / ${total} · 合格线 90 分 · ${pass?'🎉 恭喜通过':'未达合格线，再练练'}</div>
    <button class="btn primary" onclick="restartExam()">再来一次</button>
  </div>`;
}
/* 重新考试：仅重置本次考试（重新抽题 + 计时归零），不影响其它模式的进度记录 */
function confirmRestartExam(){
  const answered = S.exam ? Object.keys(S.exam.answers).length : 0;
  const head = answered ? `当前已作答 ${answered} 题。` : '本次考试尚未作答。';
  if(confirm(`${head}\n\n确定重新开始本次模拟考试吗？\n将清空当前答题记录、重新抽题，并把计时重置为 45:00。`)){
    restartExam();
  }
}
function restartExam(){
  clearInterval(S.exam && S.exam.timer); // 先停掉旧计时器，避免叠加
  S.exam=null;
  buildList(); resetQ(); startExam(); render(); saveProgress(); hideResumeBar();
}

/* ---------- 工具 ---------- */
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function weightedSample(pool, n){
  // 按 freq 加权无放回抽样（freq 越高越容易被抽中，贴近真实考试出题分布）
  const arr = pool.slice(); const res = [];
  while(res.length < n && arr.length){
    let total = 0; for(const q of arr) total += (q.freq||1);
    let r = Math.random()*total, idx = 0;
    for(; idx<arr.length; idx++){ r -= (arr[idx].freq||1); if(r<=0) break; }
    if(idx>=arr.length) idx = arr.length-1;
    res.push(arr[idx]); arr.splice(idx,1);
  }
  return res;
}
function sameSet(a,b){ if(a.size!==b.length) return false; for(const x of a) if(!b.includes(x)) return false; return true; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mkBtn(t,cls,fn){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=t; b.onclick=fn; return b; }
function renderModes(){
  const m=document.getElementById('modes'); m.innerHTML='';
  MODES.filter(x=>x.k!=="exam").forEach(x=>{
    const b=document.createElement('button'); b.textContent=x.n;
    if(x.k===S.mode) b.className='on';
    b.onclick=()=>{
      // 离开考试模式前先存档当前位置，切回来可无缝继续
      if(S.mode==='exam' && S.exam && !S.exam.finished) saveExam();
      S.mode=x.k;
      if(x.k==='exam'){
        if(!S.exam || S.exam.finished || S.exam.sub!==S.sub){
          // 首次进入 / 已交卷 / 换了科目 → 才重新抽题开考
          buildList(); startExam();
        } else {
          // 关键修复：同科目内有进行中的考试 → 恢复原卷与位置，绝不重置进度与计时
          S.list = S.exam.ids.map(id=>QMAP[id]).filter(Boolean);
          S.idx = Math.max(0, Math.min(S.exam.idx||0, S.list.length-1));
          if(!S.exam.timer) startExamTimer(); // 刷新/恢复后继续倒计时
        }
      } else {
        buildList();
      }
      resetQ();
      render(); saveProgress(); saveExam(); hideResumeBar();
    };
    m.appendChild(b);
  });
}
function switchSub(s){
  if(s===S.sub) return;  // 重复点击当前科目：不重置任何进度（含进行中的考试）
  clearInterval(S.exam && S.exam.timer);
  S.exam=null; clearExam();  // 切换科目：放弃当前考试视图，避免与新科目题目串味
  S.sub=s; document.getElementById('sub1').classList.toggle('on',s===1);
  document.getElementById('sub4').classList.toggle('on',s===4);
  if(S.mode==='exam'){ S.mode='seq'; }
  buildList(); resetQ(); render(); saveProgress(); hideResumeBar();
}

/* ---------- 续刷横幅 ---------- */
function showResumeBar(p){
  const bar=document.getElementById('resumeBar');
  if(p && p.sub && p.mode && p.mode!=='tips' && !(p.mode==='exam' && p.exam && p.exam.finished)){
    const modeName=(MODES.find(m=>m.k===p.mode)||{}).n||p.mode;
    const subName=p.sub===1?'科目一':'科目四';
    bar.style.display='flex';
    let tip=`📌 已为你恢复上次进度：${subName} · ${modeName} · 第 ${(p.idx||0)+1} 题`;
    if(p.mode==='exam' && p.exam && p.exam.left!=null){
      const mm=String(Math.floor(p.exam.left/60)).padStart(2,'0');
      const ss=String(p.exam.left%60).padStart(2,'0');
      tip+=`（考试进行中，剩余 ${mm}:${ss}）`;
    }
    bar.innerHTML=`<span>${tip}</span>`;
    const btn=document.createElement('button');
    btn.textContent='从头开始本模式';
    btn.onclick=()=>{
      if(confirm('确定从头开始当前模式？已答记录保留，进度回到第 1 题。')){
        S.idx=0; S.exam=null; resetQ();
        if(S.mode==='exam'){ buildList(); startExam(); } else { buildList(); resetQ(); }
        saveProgress(); hideResumeBar(); render();
      }
    };
    bar.appendChild(btn);
  } else { bar.style.display='none'; }
}
function hideResumeBar(){ document.getElementById('resumeBar').style.display='none'; }

/* ---------- 启动（带进度恢复） ---------- */
function init(){
  pruneStale(); // 清理不在当前题库中的历史记录（旧版哈希 id 等）
  const p = loadProgress();
  // 优先恢复未完成的模拟考试（试卷/位置/答案/剩余时间都在 LS_EXAM 里）
  const ex = loadExam();
  if(ex && p && p.mode==='exam' && p.sub===ex.e.sub){
    S.sub = p.sub; S.mode='exam';
    S.list = ex.list;
    S.exam = { sub:ex.e.sub, ids:ex.e.ids, answers:ex.e.answers||{}, sel:ex.e.sel||{},
               finished:!!ex.e.finished,
               total:ex.e.total||ex.list.length, duration:ex.e.duration||45*60,
               left:(ex.e.left==null?45*60:ex.e.left), timer:null };
    S.idx = Math.max(0, Math.min(ex.e.idx||0, S.list.length-1));
    updateTimer();
    if(!S.exam.finished) startExamTimer();
    render(); showResumeBar(p);
    return;
  }
  if(p && p.sub && p.mode){
    S.sub = p.sub;
    S.mode = p.mode;
    if((p.mode==='rand'||p.mode==='exam') && Array.isArray(p.ids)){
      S.list = p.ids.map(id=>QMAP[id]).filter(Boolean);
    } else {
      buildList();
    }
    S.idx = Math.max(0, Math.min(p.idx||0, Math.max(0,S.list.length-1)));
    if(p.mode==='exam' && p.exam){
      S.exam = { answers:p.exam.answers||{}, finished:!!p.exam.finished,
                 total:p.exam.total||S.list.length,
                 duration:p.exam.duration||45*60,
                 left:(p.exam.left==null?45*60:p.exam.left), timer:null };
      updateTimer();
      if(!S.exam.finished) startExamTimer();
    }
    render();
    showResumeBar(p);
  } else {
    buildList(); render();
  }
}
init();

Object.assign(window,{switchSub,confirmRestartExam,restartExam});
