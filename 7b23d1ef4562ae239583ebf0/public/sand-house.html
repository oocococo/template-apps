<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>戈壁驿站 · 黎明沙尘暴</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#c9a476;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 52% 50%, rgba(255,214,150,.12), rgba(0,0,0,0) 66%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 48%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 42%, rgba(196,164,124,1) 78%, rgba(110,80,52,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(240,210,160,.4);
          background:rgba(40,28,14,.55);color:#ecd4a8;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(240,210,160,.75);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(240,210,160,.35);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#ecd4a8;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#ecd4a8;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="风沙与篝火声 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="55"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   戈壁驿站 · 黎明沙尘暴  三渲二微缩景观  (three.js r128 / 完全离线)
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const JP = '"Microsoft YaHei","PingFang SC","Hiragino Sans",sans-serif';

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xc9a476, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0xc9a476);
scene.fog = new T.Fog(0xc49b6e, 38, 108);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(0,1.4,-0.8), r:31, theta:0.75, phi:1.02,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.045;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.014; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.34,0.55,0.74,0.89,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM = new T.MeshBasicMaterial({color:0x241708, side:T.BackSide});
const OLM_WARM = new T.MeshBasicMaterial({color:0x3a2410, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity = (o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.emissiveMap) p.emissiveMap = o.emissiveMap;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t, warm){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.055) return null;
  const k = t===undefined?0.017:t;
  const o = new T.Mesh(g, warm?OLM_WARM:OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}
function SP(pa, r, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.SphereGeometry(r, 14, 11), m);
  mesh.position.set(x,y,z);
  mesh.scale.set(o.sx||1, o.sy||1, o.sz||1);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt, o.warm);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

/* 径向光晕（灯光池 / 辉光精灵） */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
/* 接触阴影 */
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.72)'); g.addColorStop(0.55,'rgba(0,0,0,0.30)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
/* 沙地：底色 + 风纹 + 碎石 */
const SAND_TEX = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#d5ab72'; x.fillRect(0,0,512,512);
  for(let i=0;i<90;i++){
    x.fillStyle = ['#dcb87f','#caa06a','#e0c08c','#c69463'][i%4];
    x.globalAlpha = 0.20+Math.random()*0.24;
    x.beginPath();
    x.ellipse(Math.random()*512, Math.random()*512, 18+Math.random()*70, 10+Math.random()*40, Math.random()*3.14, 0, 6.2832);
    x.fill();
  }
  x.globalAlpha=1;
  /* 风蚀沙纹 */
  x.lineWidth=2;
  for(let i=0;i<46;i++){
    const y0=Math.random()*512;
    x.strokeStyle = (i%2? 'rgba(255,240,205,0.20)':'rgba(120,92,58,0.16)');
    x.beginPath();
    x.moveTo(-10, y0);
    for(let px=0;px<=512;px+=32) x.lineTo(px, y0 + Math.sin(px*0.018+i)*11 + Math.sin(px*0.006+i*2)*7);
    x.stroke();
  }
  speckle(x,512,512,2600,1.5,0.30);
  return TX(c,4,4);
})();

/* 夯土墙：土坯层理 + 裂纹 */
const MUD_TEX = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#b0824e'; x.fillRect(0,0,256,256);
  for(let i=0;i<60;i++){
    x.fillStyle=['#a87744','#bd8b55','#9e6d40','#c49159'][i%4];
    x.globalAlpha=0.18+Math.random()*0.2;
    x.fillRect(Math.random()*256, Math.random()*256, 20+Math.random()*60, 6+Math.random()*18);
  }
  x.globalAlpha=1;
  /* 土坯砖缝 */
  x.strokeStyle='rgba(104,72,40,0.30)'; x.lineWidth=2;
  for(let r=0;r<6;r++){
    const y = r*43 + 8;
    x.beginPath(); x.moveTo(0,y); x.lineTo(256,y); x.stroke();
    const off = (r%2)*32;
    for(let cx=off; cx<256; cx+=64){ x.beginPath(); x.moveTo(cx,y); x.lineTo(cx,y+43); x.stroke(); }
  }
  /* 风化裂纹 */
  x.strokeStyle='rgba(58,38,20,0.34)';
  for(let i=0;i<9;i++){
    let px=Math.random()*256, py=Math.random()*256;
    x.lineWidth=1+Math.random()*1.4;
    x.beginPath(); x.moveTo(px,py);
    for(let k=0;k<7;k++){ px+=R(-22,22); py+=R(-16,16); x.lineTo(px,py); }
    x.stroke();
  }
  speckle(x,256,256,1500,1.4,0.28);
  return TX(c,0.62,0.62);
})();

/* 风化木料 */
const PLANK_TEX = (function(){
  const c=CV(128,256), x=c.getContext('2d');
  x.fillStyle='#7c5c3a'; x.fillRect(0,0,128,256);
  for(let i=0;i<8;i++){
    x.fillStyle=['#8a6742','#6d4f31','#8e7150','#63482c'][i%4];
    x.fillRect(i*16, 0, 16, 256);
  }
  x.strokeStyle='rgba(40,28,16,0.42)'; x.lineWidth=2;
  for(let i=0;i<=8;i++){ x.beginPath(); x.moveTo(i*16,0); x.lineTo(i*16,256); x.stroke(); }
  x.strokeStyle='rgba(52,36,20,0.22)'; x.lineWidth=1;
  for(let i=0;i<26;i++){
    const px=Math.random()*128;
    x.beginPath(); x.moveTo(px,0);
    for(let y=0;y<=256;y+=24) x.lineTo(px+Math.sin(y*0.03+i)*3, y);
    x.stroke();
  }
  speckle(x,128,256,900,1.2,0.24);
  return TX(c,1,1);
})();

/* 粗布 / 挂毯：条纹织物 */
const CLOTH_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  x.fillStyle='#a8562f'; x.fillRect(0,0,128,128);
  const cols=['#c98b3f','#8d4526','#e0bd7c','#7a3a22'];
  for(let i=0;i<9;i++){
    x.fillStyle=cols[i%4];
    x.fillRect(0, i*14, 128, 14);
  }
  x.globalAlpha=0.5;
  x.fillStyle='#5e2f18';
  for(let i=0;i<5;i++) x.fillRect(0, i*28+11, 128, 4);
  x.globalAlpha=0.28;
  for(let i=0;i<40;i++){
    x.fillStyle=Math.random()>0.5?'#ffffff':'#3a1c0e';
    x.fillRect(Math.random()*128, Math.random()*128, 2+Math.random()*8, 2+Math.random()*4);
  }
  x.globalAlpha=1;
  speckle(x,128,128,600,1.2,0.26);
  return TX(c,1,1);
})();

/* 褪色路牌 */
const SIGN_TEX = (function(){
  const c=CV(384,128), x=c.getContext('2d');
  x.fillStyle='#c3ab86'; x.fillRect(0,0,384,128);
  x.strokeStyle='rgba(70,52,32,0.7)'; x.lineWidth=5; x.strokeRect(4,4,376,120);
  x.fillStyle='#5b452c'; x.font='bold 48px '+JP; x.textAlign='center';
  x.fillText('丝路驿站', 192, 56);
  x.font='bold 30px '+JP;
  x.fillText('敦煌 120km →', 192, 100);
  /* 褪色风化 */
  x.globalAlpha=0.34;
  for(let i=0;i<70;i++){
    x.fillStyle = Math.random()>0.5 ? '#e6d7ba' : '#7d6a4e';
    x.beginPath();
    x.ellipse(Math.random()*384, Math.random()*128, 4+Math.random()*26, 3+Math.random()*12, Math.random()*3, 0, 6.2832);
    x.fill();
  }
  x.globalAlpha=0.5; x.strokeStyle='rgba(90,70,44,0.5)'; x.lineWidth=2;
  for(let i=0;i<14;i++){
    x.beginPath(); x.moveTo(Math.random()*384,0); x.lineTo(Math.random()*384,128); x.stroke();
  }
  x.globalAlpha=1;
  speckle(x,384,128,900,1.3,0.24);
  return TX(c);
})();
const SIGN2_TEX = (function(){
  const c=CV(256,96), x=c.getContext('2d');
  x.fillStyle='#bda683'; x.fillRect(0,0,256,96);
  x.strokeStyle='rgba(70,52,32,0.6)'; x.lineWidth=4; x.strokeRect(3,3,250,90);
  x.fillStyle='#5b452c'; x.font='bold 34px '+JP; x.textAlign='center';
  x.fillText('← 玉门 40km', 128, 60);
  x.globalAlpha=0.32;
  for(let i=0;i<40;i++){
    x.fillStyle=Math.random()>0.5?'#e6d7ba':'#7d6a4e';
    x.beginPath(); x.ellipse(Math.random()*256,Math.random()*96,3+Math.random()*18,3+Math.random()*9,0,0,6.2832); x.fill();
  }
  x.globalAlpha=1; speckle(x,256,96,600,1.2,0.22);
  return TX(c);
})();

/* ---------------- 材质 ---------------- */
const M = {
  baseTop  : MK(0xd7ae74, {map:SAND_TEX}),
  baseSide : MK(0xa37f52, {map:SAND_TEX}),
  baseTrim : MK(0x8a6a46),
  mud      : MK(0xb0824e, {map:MUD_TEX}),
  mudDark  : MK(0x8f683e, {map:MUD_TEX}),
  mudIn    : MK(0xc09258, {map:MUD_TEX, emissive:0x8a5a20, ei:0.55}),
  inFloor  : MK(0xc8a468, {map:SAND_TEX, emissive:0x8a5a22, ei:0.5}),
  roof     : MK(0xc09a62, {map:SAND_TEX}),
  wood     : MK(0x7c5c3a, {map:PLANK_TEX}),
  woodOld  : MK(0x8d7d64, {map:PLANK_TEX}),
  woodDark : MK(0x54402a, {map:PLANK_TEX}),
  rock     : MK(0x9a8468),
  rockDark : MK(0x7d6b54),
  bush     : MK(0x7d7440),
  bushDark : MK(0x635b31),
  cloth    : MK(0x9c5236, {map:CLOTH_TEX}),
  clothDark: MK(0x7a4030, {map:CLOTH_TEX}),
  sack     : MK(0xb09468, {map:CLOTH_TEX}),
  pot      : MK(0x9a5a38),
  potDark  : MK(0x7d4629),
  metal    : MK(0x6d6a60),
  hay      : MK(0xa89450),
  hide     : MK(0x8a6438, {emissive:0x6a3f16, ei:0.35}),
  glass    : MK(0xffc880, {emissive:0xff9a40, ei:0.8, transparent:true, opacity:0.4}),
  ember    : MK(0xff7a2c, {emissive:0xff5a12, ei:1.2}),
  flame    : MB(0xffc45e, {transparent:true, opacity:0.9}),
  pathM    : MK(0xddbe8c, {map:SAND_TEX})
};

/* ---------------- 黎明光照 ---------------- */
const L = {};
L.hemi = new T.HemisphereLight(0xdfc49c, 0x6b5638, 0.55); scene.add(L.hemi);
L.amb  = new T.AmbientLight(0x8a7454, 0.42); scene.add(L.amb);
L.sun  = new T.DirectionalLight(0xffc888, 0.34);
L.sun.position.set(-15, 7.5, 11); scene.add(L.sun);
L.fill = new T.DirectionalLight(0xa8b0c8, 0.14);
L.fill.position.set(12, 6, -9); scene.add(L.fill);
L.lamp = new T.PointLight(0xffb066, 1.35, 9.5, 2);
L.lamp.position.set(0.5, 1.5, -2.0); scene.add(L.lamp);
L.fire = new T.PointLight(0xff7a33, 0.85, 5.5, 2);
L.fire.position.set(-1.3, 0.62, -2.7); scene.add(L.fire);

/* 带洞口的夯土墙（挤出几何：拱门 / 木窗洞） */
function wallGeo(w, h, holes){
  const s = new T.Shape();
  s.moveTo(0,-0.02); s.lineTo(w,-0.02); s.lineTo(w,h); s.lineTo(0,h); s.closePath();
  (holes||[]).forEach(hp=>{ const p = new T.Path(); hp(p); s.holes.push(p); });
  return new T.ExtrudeGeometry(s, {depth:0.16, bevelEnabled:false});
}
function archHole(cx, w, top){
  return function(p){
    const x0=cx-w/2, x1=cx+w/2;
    p.moveTo(x0,0); p.lineTo(x0,top);
    p.absarc(cx, top, w/2, Math.PI, 0, true);
    p.lineTo(x1,0); p.closePath();
  };
}
function rectHole(cx, y0, y1, w){
  return function(p){
    p.moveTo(cx-w/2,y0); p.lineTo(cx-w/2,y1); p.lineTo(cx+w/2,y1); p.lineTo(cx+w/2,y0); p.closePath();
  };
}
function wall(meshGeo, mat, x,y,z, ry){
  const mesh = new T.Mesh(meshGeo, mat);
  mesh.position.set(x,y,z);
  if(ry) mesh.rotation.y = ry;
  house.add(mesh);
  addOL(mesh, 0.02);
  return mesh;
}

function makeFlame(pa, x,y,z, s, glowColor, glowSize){
  const g = new T.Group();
  const c1 = new T.Mesh(new T.ConeGeometry(0.092*s, 0.36*s, 8), MB(0xffb44a,{transparent:true,opacity:0.92}));
  c1.position.y = 0.18*s; g.add(c1);
  const c2 = new T.Mesh(new T.ConeGeometry(0.052*s, 0.21*s, 8), MB(0xffe9b4,{transparent:true,opacity:0.95}));
  c2.position.y = 0.13*s; g.add(c2);
  const sp = new T.Sprite(new T.SpriteMaterial({map:RAD_TEX, color:(glowColor||0xffa04a), transparent:true, opacity:0.55, blending:T.AdditiveBlending, depthWrite:false}));
  sp.scale.set((glowSize||1.2)*s,(glowSize||1.2)*s,1);
  sp.position.y = 0.16*s; g.add(sp);
  g.position.set(x,y,z);
  (pa||scene).add(g);
  FLAMES.push({g:g, s:s, ph:Math.random()*6.28});
  return g;
}

function bush(x,z,s,type){
  const g = new T.Group();
  const n = type? 5 : 4;
  for(let i=0;i<n;i++){

(function(){
  function fence(x0,z0,x1,z1,n,lean){
    const dx=(x1-x0)/n, dz=(z1-z0)/n;
    for(let i=0;i<=n;i++){
      const t=i/n, lx=x0+dx*i, lz=z0+dz*i;
      const tilt = (i%3===1? lean: 0) * R(0.6,1.2);
      CY(ground, 0.055,0.065,0.95,7, (i%2?M.woodOld:M.woodDark), lx, 0.46, lz, {rz:tilt, olt:0.010});
    }
    const len = Math.hypot(x1-x0, z1-z0);
    const ry = Math.atan2(-(z1-z0), x1-x0);
    [0.62, 0.32].forEach(function(y,k){
      const seg = Math.max(2, Math.round(n/2));
      for(let i=0;i<seg;i++){
        if(k===1 && i%3===2) continue;   /* 残缺：缺口 */
        const t0=i/seg, t1=(i+1)/seg;
        if(k===0 && i%4===3) continue;
        const cx=(x0+(x1-x0)*(t0+t1)/2), cz=(z0+(z1-z0)*(t0+t1)/2);
        BX(ground, len/seg*0.96, 0.075, 0.05, (i%2?M.woodOld:M.woodDark), cx, y+ (k?0:0.02), cz,
           {ry:ry, rz:R(-0.02,0.02), ol:0});
      }
    });
  }
  fence(3.45, 3.75, 7.35, 2.45, 5, 0.10);
  fence(7.35, 2.45, 7.15, -1.15, 4, 0.13);
  fence(-7.25, 2.05, -6.55, 5.35, 3, 0.14);
})();

/* ---------------- 动态更新 ---------------- */
function updWind(dt){
  WIND.t -= dt;
  if(WIND.t<=0){ WIND.t = R(4.5, 13.0); WIND.target = R(0.45, 1.75); }
  WIND.gust += (WIND.target - WIND.gust) * Math.min(1, dt*0.55);
}
function updSand(dt, t){
  const g = WIND.gust;
  const pa = sPos, va = sVel;
  for(let i=0;i<SAND_N;i++){
    const i3=i*3;
    pa[i3]   += va[i3]   * g * dt;
    pa[i3+1] += (va[i3+1] + Math.sin(t*1.7+sPh[i])*0.12) * dt;
    pa[i3+2] += (va[i3+2] + Math.sin(t*1.1+sPh[i]*1.7)*0.25) * dt;
    if(pa[i3] > 16){ pa[i3] = -16; pa[i3+2] = R(-16,16); }
    if(pa[i3+1] < 0.02){ pa[i3+1] = R(1,8); }
    if(pa[i3+1] > 9) pa[i3+1] = 0.2;
    if(pa[i3+2] > 16) pa[i3+2] = -16;
    if(pa[i3+2] < -16) pa[i3+2] = 16;
  }
  sandGeo.attributes.position.needsUpdate = true;
  sandMat.opacity = 0.40 + 0.22*clamp(g/1.75,0,1);
  const pb = sand2Pos, vb = sand2Vel;
  for(let i=0;i<SAND2_N;i++){
    const i3=i*3;
    pb[i3]   += vb[i3] * g * dt;
    pb[i3+1] += vb[i3+1] * dt;
    pb[i3+2] += vb[i3+2] * g * dt * 0.4;
    if(pb[i3] > 16){ pb[i3] = -16; pb[i3+2] = R(-16,16); }
    if(pb[i3+1] < 0.01) pb[i3+1] = R(0.2,1.5);
    if(pb[i3+1] > 1.8) pb[i3+1] = 0.05;
    if(pb[i3+2] > 16) pb[i3+2] = -16;
    if(pb[i3+2] < -16) pb[i3+2] = 16;
  }
  sand2Geo.attributes.position.needsUpdate = true;
  sand2.material.opacity = 0.22 + 0.26*clamp(g/1.75,0,1);
}
function updDrift(dt, t){
  const g = WIND.gust;
  for(let i=0;i<DRIFT.length;i++){
    const d = DRIFT[i];
    d.m.position.x += d.v * (0.45 + g*0.9) * dt;
    if(d.m.position.x > 8.6){ d.m.position.x = -8.6; d.m.position.z = R(-7.8,7.8); }
    d.m.material.opacity = (0.08 + 0.20*clamp(g/1.75,0,1)) * (0.55 + 0.45*Math.sin(t*0.9+d.ph));
  }
}
function updMotes(dt, t){
  const g = WIND.gust;
  for(let i=0;i<MOTES.length;i++){
    const m = MOTES[i];
    m.s.position.x += (0.18 + g*0.30) * dt * m.sp * 3;
    m.s.position.y += Math.sin(t*0.9 + m.ph)*0.14*dt;
    m.s.position.z += Math.cos(t*0.7 + m.ph*1.3)*0.10*dt;
    if(m.s.position.x > 1.6){ m.s.position.x = -2.2; m.s.position.y = R(0.2,2.5); m.s.position.z = R(0.5,2.8); }
    m.s.material.opacity = 0.22 + 0.34*(0.5+0.5*Math.sin(t*2.1+m.ph));
  }
}
function updSmoke(dt, t){
  const g = WIND.gust;
  for(let i=0;i<SMOKE.length;i++){
    const s = SMOKE[i];
    s.t += s.sp * dt * (0.7 + g*0.35);
    if(s.t > 1) s.t -= 1;
    const y = 4.86 + s.t*2.6;
    const spread = 0.10 + s.t*0.85;
    s.s.position.set(-1.8 + s.t*(1.1 + g*1.9) + Math.sin(t*0.8+i)*0.12, y, -2.7 + Math.sin(t*0.6+i*1.7)*0.22 + s.t*0.5);
    const sc = 0.42 + s.t*1.25;
    s.s.scale.set(sc, sc, 1);
    s.s.material.opacity = 0.30 * Math.sin(Math.PI*s.t) * (0.7+0.3*Math.sin(t*1.3+i));
  }
}
function updFlames(t){
  for(let i=0;i<FLAMES.length;i++){
    const f = FLAMES[i];
    const k = 0.82 + 0.16*Math.sin(t*11.5+f.ph) + 0.10*Math.sin(t*27.3+f.ph*2.1) + 0.06*Math.sin(t*41+f.ph*3);
    f.g.scale.set(0.9+0.18*Math.sin(t*17+f.ph), k, 0.9+0.18*Math.cos(t*15+f.ph));
    f.g.rotation.z = Math.sin(t*6.2+f.ph)*0.10 + Math.sin(t*13.7+f.ph)*0.05;
  }
  /* 灯火与灶火的光强呼吸 */
  const fl = 0.86 + 0.14*Math.sin(t*9.1) + 0.08*Math.sin(t*21.7+1.3);
  L.lamp.intensity = 1.35*fl;
  const ff = 0.80 + 0.20*Math.sin(t*7.3+2.1) + 0.10*Math.sin(t*17.9);
  L.fire.intensity = 0.85*ff;
  L.door.intensity = 0.55*(0.85+0.15*Math.sin(t*5.5));
  glowWinF.material.opacity = 0.30 + 0.06*Math.sin(t*4.3);
  glowWinS.material.opacity = 0.25 + 0.05*Math.sin(t*3.7+1.1);
  poolDoor.material.opacity = 0.26 + 0.06*Math.sin(t*4.9);
  innerGlow.material.opacity = 0.27 + 0.05*Math.sin(t*3.1);
}
function updBushes(t){
  const g = WIND.gust;
  for(let i=0;i<BUSHES.length;i++){
    const b = BUSHES[i];
    const a = b.amp * (0.55 + g*0.75);
    b.g.rotation.z = Math.sin(t*b.sp + b.ph)*a + Math.sin(t*b.sp*2.3 + b.ph)*a*0.35;
    b.g.rotation.x = Math.sin(t*b.sp*0.8 + b.ph*1.3)*a*0.55;
  }
}
function updRidges(t){
  for(let i=0;i<RIDGES.length;i++){
    const r = RIDGES[i];
    const k = 0.85 + 0.30*(0.5+0.5*Math.sin(t*0.055 + r.ph));
    r.m.scale.set(r.sx, r.base*k, r.sz);
  }
}
/* ---------------- 音效：间歇沙暴风声 + 连续篝火 ---------------- */
const snd = { ctx:null, master:null, windG:null, windBP:null, fireG:null, on:false, vol:0.55 };
function noiseBuffer(ctx, sec, crossfade, gen){
  const sr = ctx.sampleRate;
  const n = Math.floor(sr*sec);
  const fade = Math.floor(sr*crossfade);
  const raw = new Float32Array(n+fade);
  gen(raw, n+fade, sr);
  const buf = ctx.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=raw[i];
  for(let i=0;i<fade;i++){ const a=i/fade; d[i] = raw[i]*a + raw[n+i]*(1-a); }
  return buf;
}
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  const ctx = new AC();
  snd.ctx = ctx;
  snd.master = ctx.createGain();
  snd.master.gain.value = 0;
  snd.master.connect(ctx.destination);

  /* 风声：粉红噪声 → 带通（随阵风扫频） */
  const wbuf = noiseBuffer(ctx, 4.0, 0.5, function(d,n,sr){
    let b0=0,b1=0,b2=0;
    for(let i=0;i<n;i++){
      const w = Math.random()*2-1;
      b0 = 0.99765*b0 + w*0.0990460;
      b1 = 0.96300*b1 + w*0.2965164;
      b2 = 0.57000*b2 + w*1.0526913;
      d[i] = (b0+b1+b2+w*0.1848)*0.10;
    }
  });
  const wsrc = ctx.createBufferSource(); wsrc.buffer = wbuf; wsrc.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=460; bp.Q.value=0.65;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
  snd.windG = ctx.createGain(); snd.windG.gain.value = 0.12;
  wsrc.connect(bp); bp.connect(lp); lp.connect(snd.windG); snd.windG.connect(snd.master);
  snd.windBP = bp;
  wsrc.start();

  /* 篝火：低频轰鸣 + 连续爆裂声（烘焙进循环） */
  const fbuf = noiseBuffer(ctx, 3.0, 0.4, function(d,n,sr){
    let b=0, spike=0, decay=0;
    for(let i=0;i<n;i++){
      const w = Math.random()*2-1;
      b = 0.982*b + w*0.024;
      if(Math.random() < 0.00042){ spike = 0.55 + Math.random()*0.9; decay = 0.975 + Math.random()*0.02; }
      spike *= decay;
      d[i] = b*1.5 + spike*(Math.random()*2-1)*0.55;
    }
  });
  const fsrc = ctx.createBufferSource(); fsrc.buffer = fbuf; fsrc.loop = true;
  const flp = ctx.createBiquadFilter(); flp.type='lowpass'; flp.frequency.value = 1250;
  const fhp = ctx.createBiquadFilter(); fhp.type='highpass'; fhp.frequency.value = 110;
  snd.fireG = ctx.createGain(); snd.fireG.gain.value = 0.55;
  fsrc.connect(flp); flp.connect(fhp); fhp.connect(snd.fireG); snd.fireG.connect(snd.master);
  fsrc.start();
}
function sndSet(on){
  snd.on = on;
  if(on && !snd.ctx) sndBuild();
  if(!snd.ctx) return;
  if(snd.ctx.state === 'suspended') snd.ctx.resume();
  snd.master.gain.setTargetAtTime(on ? snd.vol : 0, snd.ctx.currentTime, 0.5);
}
(function(){
  const btn = document.getElementById('sndBtn');
  const icOn = document.getElementById('icOn');
  const icOff = document.getElementById('icOff');
  const vol = document.getElementById('sndVol');
  btn.addEventListener('click', function(){
    sndSet(!snd.on);
    icOn.style.display = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none' : 'block';
  });
  vol.addEventListener('input', function(){
    snd.vol = (vol.value|0)/100;
    if(snd.on && snd.ctx) snd.master.gain.setTargetAtTime(snd.vol, snd.ctx.currentTime, 0.06);
  });
  renderer.domElement.addEventListener('pointerdown', function(){
    if(snd.on && snd.ctx && snd.ctx.state === 'suspended') snd.ctx.resume();
  });
})();

/* ---------------- 主循环 ---------------- */
const clock = new T.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  /* 相机 */
  ctrl.theta += ctrl.dth;
  ctrl.phi = clamp(ctrl.phi + ctrl.dph, 0.16, 1.46);
  ctrl.r   = clamp(ctrl.r + ctrl.dr, 12, 62);
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.86;
  ctrl.idle += dt;
  if(!ctrl.dragging && ctrl.idle > 2.5) ctrl.theta += dt*0.030;
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 风与沙 */
  updWind(dt);
  updSand(dt, t);
  updDrift(dt, t);
  updMotes(dt, t);
  updSmoke(dt, t);
  updRidges(t);
  updBushes(t);
  updFlames(t);
  updDawn(t);

  /* 风声随阵风起伏 */
  if(snd.on && snd.ctx){
    const g = clamp(WIND.gust/1.75, 0, 1.2);
    snd.windG.gain.value = 0.09 + 0.24*g;
    snd.windBP.frequency.value = 330 + 720*g;
  }

  renderer.render(scene, camera);
}
animate();
