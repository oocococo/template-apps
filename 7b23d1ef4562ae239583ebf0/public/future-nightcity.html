<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雨夜霓虹 · 未来都市空中立交枢纽</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#04060e;}
  canvas{display:block;}
  #tint{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 58% 52%, rgba(130,90,255,.10), rgba(0,140,210,.05) 45%, rgba(0,0,0,0) 68%);}
  #vg{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
      background:radial-gradient(ellipse at 50% 48%, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 42%, rgba(112,116,142,1) 78%, rgba(34,38,52,1) 100%);}
  #snd{position:fixed;top:10px;right:12px;z-index:10;display:flex;align-items:center;gap:6px;
       opacity:.45;transition:opacity .25s;}
  #snd:hover{opacity:.95;}
  #sndBtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(160,190,230,.35);
          background:rgba(10,16,28,.55);color:#bcd2ee;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #sndBtn:hover{border-color:rgba(160,190,230,.7);}
  #sndBar{display:none;align-items:center;}
  #snd:hover #sndBar{display:flex;}
  #sndVol{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;
          background:rgba(160,190,230,.35);outline:none;cursor:pointer;}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
          background:#bcd2ee;border:none;}
  #sndVol::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#bcd2ee;border:none;}
</style>
</head>
<body>
<div id="tint"></div>
<div id="vg"></div>
<div id="snd">
  <button id="sndBtn" title="城市喧嚣 开/关">
    <svg id="icOff" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>
    <svg id="icOn" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <div id="sndBar"><input id="sndVol" type="range" min="0" max="100" value="55"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   雨夜霓虹 · 未来都市空中立交枢纽  (three.js r128 / 完全离线)
   三渲二 / 卡通渐变 / 轮廓线 / 微缩模型
   ============================================================ */
const T = THREE;
const R  = (a,b)=> a + Math.random()*(b-a);
const clamp = T.MathUtils.clamp;
const JP = '"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Microsoft YaHei",sans-serif';
const UX = new T.Vector3(1,0,0);
const D2R = Math.PI/180;

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new T.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x060912, 1);
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x060912);
scene.fog = new T.Fog(0x0a1226, 46, 118);

const camera = new T.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.5, 400);

/* ---------------- 自由轨道控制（拖拽 / 旋转 / 缩放） ---------------- */
const ctrl = { target:new T.Vector3(0,5.4,0), r:34, theta:0.86, phi:1.03,
               dth:0, dph:0, dr:0, idle:0, dragging:false };
(function(){
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  const pts = new Map();
  let lx=0, ly=0, ld=0;
  el.addEventListener('pointerdown', e=>{
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX; ly=e.clientY; ctrl.idle=0; ctrl.dragging=true;
  });
  el.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      ctrl.dth -= (e.clientX-lx)*0.0058;
      ctrl.dph -= (e.clientY-ly)*0.0045;
    }else if(pts.size===2){
      const p=[...pts.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(ld) ctrl.dr += (ld-d)*0.05;
      ld=d;
    }
    lx=e.clientX; ly=e.clientY; ctrl.idle=0;
  });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) ld=0; if(pts.size===0) ctrl.dragging=false; };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); ctrl.dr += e.deltaY*0.016; ctrl.idle=0; }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

/* ---------------- 卡通渐变（三渲二关键） ---------------- */
function makeRamp(steps, vals){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*vals[i]);
  const t = new T.DataTexture(d, steps, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = makeRamp(5, [0.32,0.54,0.73,0.89,1.0]);

/* ---------------- 材质 / 几何工具 ---------------- */
const OLM = new T.MeshBasicMaterial({color:0x05070e, side:T.BackSide});

function MK(color, o){
  o = o || {};
  const p = { color:color, gradientMap:RAMP };
  if(o.emissive!==undefined){ p.emissive=new T.Color(o.emissive); p.emissiveIntensity = (o.ei!==undefined?o.ei:1); }
  if(o.map) p.map = o.map;
  if(o.side) p.side = o.side;
  if(o.transparent){ p.transparent=true; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  return new T.MeshToonMaterial(p);
}
function MB(color, o){
  o = o||{};
  const p = { color:color };
  if(o.map) p.map=o.map;
  if(o.side) p.side=o.side;
  if(o.transparent!==undefined){ p.transparent=o.transparent; p.opacity=(o.opacity!==undefined?o.opacity:1); p.depthWrite=!!o.depthWrite; }
  if(o.blending!==undefined) p.blending=o.blending;
  return new T.MeshBasicMaterial(p);
}
function addOL(mesh, t){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new T.Vector3());
  if(Math.min(s.x,s.y,s.z) < 0.055) return null;
  const k = t===undefined?0.017:t;
  const o = new T.Mesh(g, OLM);
  o.scale.set((s.x+2*k)/s.x, (s.y+2*k)/s.y, (s.z+2*k)/s.z);
  mesh.add(o);
  return o;
}
/** 盒子：parent, 宽高深, 材质, 坐标, 选项{rx,ry,rz,ol(0=不描边),olt} */
function BX(pa, w,h,d, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt);
  return mesh;
}
/** 平面：默认朝 +z；ry 旋转 */
function PL(pa, w,h, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
function CY(pa, rt,rb,h,seg, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||12), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  if(o.ol!==0 && !m.transparent) addOL(mesh, o.olt);
  return mesh;
}
function TOR(pa, r, tube, m, x,y,z, o){
  o = o||{};
  const mesh = new T.Mesh(new T.TorusGeometry(r, tube, 8, o.seg||22), m);
  mesh.position.set(x,y,z);
  if(o.rx) mesh.rotation.x=o.rx; if(o.ry) mesh.rotation.y=o.ry; if(o.rz) mesh.rotation.z=o.rz;
  (pa||scene).add(mesh);
  return mesh;
}
/** 沿方向摆放的盒子（长度沿局部 X） */
function dirBox(pa, a, b, w, h, m, ox, oy, oz){
  const dir = new T.Vector3().subVectors(b,a);
  const len = dir.length();
  const mesh = new T.Mesh(new T.BoxGeometry(len, h, w), m);
  mesh.position.set((a.x+b.x)/2 + (ox||0), (a.y+b.y)/2 + (oy||0), (a.z+b.z)/2 + (oz||0));
  mesh.quaternion.setFromUnitVectors(UX, dir.normalize());
  (pa||scene).add(mesh);
  return mesh;
}

/* ---------------- 画布贴图生成 ---------------- */
function CV(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function TX(c, rx, ry){
  const t = new T.CanvasTexture(c);
  t.anisotropy = 4;
  if(rx){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx, ry||rx); }
  return t;
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function speckle(ctx,w,h,n,size,alpha){
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*size+0.4;
    ctx.fillStyle = (Math.random()>0.5? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (alpha*Math.random()).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

/* 径向光晕 / 柔和光带 / 接触阴影 */
const RAD_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();
const BEAM_TEX = (function(){
  const c=CV(128,256), x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.52,'rgba(255,255,255,0.85)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,256);
  const h=x.createLinearGradient(0,0,128,0);
  h.addColorStop(0,'rgba(0,0,0,1)'); h.addColorStop(0.5,'rgba(0,0,0,0)'); h.addColorStop(1,'rgba(0,0,0,1)');
  x.globalCompositeOperation='destination-out'; x.fillStyle=h; x.fillRect(0,0,128,256);
  return TX(c);
})();
const SHADOW_TEX = (function(){
  const c=CV(128,128), x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.75)'); g.addColorStop(0.55,'rgba(0,0,0,0.32)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return TX(c);
})();

/* ---------------- 纹理 ---------------- */
const CONC = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#33394a'; x.fillRect(0,0,256,256);
  speckle(x,256,256,1600,1.8,0.10);
  return TX(c,2,2);
})();
/* 湿润金属甲板 */
const DECK = (function(){
  const c=CV(512,512), x=c.getContext('2d');
  x.fillStyle='#171d2b'; x.fillRect(0,0,512,512);
  for(let i=0;i<40;i++){
    x.fillStyle='rgba('+R(24,52).toFixed(0)+','+R(30,60).toFixed(0)+','+R(44,86).toFixed(0)+',0.45)';
    x.beginPath(); x.ellipse(Math.random()*512, Math.random()*512, R(40,150), R(30,110), Math.random()*3, 0, 6.2832); x.fill();
  }
  speckle(x,512,512,3600,2.0,0.10);
  // 甲板分缝
  x.strokeStyle='rgba(8,12,20,0.75)'; x.lineWidth=4;
  for(let i=0;i<=4;i++){ const p=i*128; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke();
                                        x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  x.strokeStyle='rgba(120,190,240,0.07)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){ const p=i*128+4; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke();
                                          x.beginPath(); x.moveTo(0,p); x.lineTo(512,p); x.stroke(); }
  // 检修口
  x.fillStyle='rgba(70,84,104,0.5)'; rr(x, 60,330,110,110,10); x.fill();
  x.strokeStyle='rgba(10,14,22,0.8)'; x.lineWidth=5; rr(x, 60,330,110,110,10); x.stroke();
  return TX(c,5,5);
})();
/* 路面 */
const ROAD = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#12161f'; x.fillRect(0,0,256,256);
  speckle(x,256,256,2400,2.0,0.12);
  for(let i=0;i<16;i++){
    x.fillStyle='rgba(30,44,66,0.35)';
    x.fillRect(0, Math.random()*256, 256, R(1,3));
  }
  return TX(c,2,2);
})();
/* 拉丝金属板 */
const METALP = (function(){
  const c=CV(256,256), x=c.getContext('2d');
  x.fillStyle='#454e5f'; x.fillRect(0,0,256,256);
  for(let i=0;i<200;i++){
    x.strokeStyle='rgba('+R(90,150).toFixed(0)+','+R(100,160).toFixed(0)+','+R(120,180).toFixed(0)+',0.10)';
    x.lineWidth=R(0.5,2); const y=Math.random()*256;
    x.beginPath(); x.moveTo(0,y); x.lineTo(256,y+R(-2,2)); x.stroke();
  }
  x.strokeStyle='rgba(10,14,22,0.55)'; x.lineWidth=3;
  for(let i=1;i<4;i++){ const p=i*64; x.beginPath(); x.moveTo(0,p); x.lineTo(256,p); x.stroke(); }
  return TX(c,2,3);
})();
/* 玻璃幕墙 */
const CURTAIN = (function(){
  const c=CV(256,512), x=c.getContext('2d');
  x.fillStyle='#101a2e'; x.fillRect(0,0,256,512);
  const cols=6, rows=14, cw=256/cols, ch=512/rows;
  for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){
    const lit = Math.random();
    let col;
    if(lit>0.80) col='rgba(150,225,255,0.55)';
    else if(lit>0.70) col='rgba(120,160,255,0.34)';
    else if(lit>0.66) col='rgba(255,170,120,0.28)';
    else col='rgba(24,40,66,0.55)';
    x.fillStyle=col; x.fillRect(i*cw+2, r*ch+2, cw-4, ch-4);
    if(lit>0.80){ x.fillStyle='rgba(200,240,255,0.18)'; x.fillRect(i*cw+2, r*ch+2, cw-4, ch*0.4); }
  }
  x.strokeStyle='rgba(8,12,20,0.85)'; x.lineWidth=4;
  for(let i=0;i<=cols;i++){ const p=i*cw; x.beginPath(); x.moveTo(p,0); x.lineTo(p,512); x.stroke(); }
  for(let r=0;r<=rows;r++){ const p=r*ch; x.beginPath(); x.moveTo(0,p); x.lineTo(256,p); x.stroke(); }
  return TX(c);
})();
/* 办公层内部（透过大玻璃看到的层） */
const OFFICE = (function(){
  const c=CV(256,128), x=c.getContext('2d');
  x.fillStyle='#1a2c46'; x.fillRect(0,0,256,128);
  x.fillStyle='rgba(140,205,255,0.20)'; x.fillRect(0,0,256,128);
  // 天花灯带
  x.fillStyle='rgba(200,240,255,0.85)';
  for(let i=0;i<4;i++) x.fillRect(14+i*62, 6, 44, 5);
  // 工位
  for(let i=0;i<4;i++){
    const bx=12+i*62;
    x.fillStyle='rgba(60,86,124,0.95)'; x.fillRect(bx, 74, 46, 8);
    x.fillStyle='rgba(20,30,48,0.9)';   x.fillRect(bx+2, 82, 4, 18); x.fillRect(bx+40, 82, 4, 18);
    x.fillStyle='rgba(120,215,255,0.75)'; x.fillRect(bx+14, 58, 20, 15);
    x.fillStyle='rgba(255,120,190,0.45)'; x.fillRect(bx+36, 60, 8, 12);
  }
  // 隔断
  x.fillStyle='rgba(28,48,78,0.7)';
  for(let i=0;i<4;i++) x.fillRect(58+i*62, 52, 3, 50);
  return TX(c);
})();
/* 控制台屏幕 */
function panelTex(c1, c2, title){
  const c=CV(256,160), x=c.getContext('2d');
  x.fillStyle='#07121f'; x.fillRect(0,0,256,160);
  x.fillStyle=c1; x.fillRect(0,0,256,16);
  x.fillStyle='#04101c'; x.font='bold 12px '+JP; x.textAlign='left'; x.textBaseline='middle';
  x.fillText(title, 8, 8);
  // 折线图
  x.strokeStyle=c1; x.lineWidth=2.5; x.beginPath();
  for(let i=0;i<=32;i++){ const px=8+i*7.6, py=52+Math.sin(i*0.55+Math.random()*0.3)*R(8,20);
    i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  // 柱状
  for(let i=0;i<12;i++){ const bh=R(8,42); x.fillStyle=(i%3? c1:c2); x.fillRect(10+i*20, 148-bh, 13, bh); }
  // 文字行
  x.fillStyle=c2;
  for(let i=0;i<3;i++) x.fillRect(150, 30+i*12, R(30,96), 5);
  x.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<2;i++) x.fillRect(150, 76+i*10, R(20,80), 3);
  // 扫描线
  x.fillStyle='rgba(0,0,0,0.22)';
  for(let i=0;i<160;i+=4) x.fillRect(0,i,256,2);
  return TX(c);
}
const PANEL_A = panelTex('#3fe6ff','#9b6cff','TRAFFIC CTRL / 統合管制');
const PANEL_B = panelTex('#ff3fa0','#3fe6ff','FLOW MONITOR / 流量監視');
const PANEL_C = panelTex('#5cffa8','#3fe6ff','POWER GRID / 電力網');
/* 气象状态面板 */
const WEATHER = (function(){
  const c=CV(256,160), x=c.getContext('2d');
  x.fillStyle='#06121e'; x.fillRect(0,0,256,160);
  x.strokeStyle='rgba(90,220,255,0.45)'; x.lineWidth=2;
  for(let i=1;i<=4;i++){ x.beginPath(); x.arc(74,80,i*16,0,6.2832); x.stroke(); }
  x.strokeStyle='rgba(90,220,255,0.25)';
  x.beginPath(); x.moveTo(10,80); x.lineTo(138,80); x.moveTo(74,16); x.lineTo(74,144); x.stroke();
  x.fillStyle='rgba(255,80,140,0.85)';
  for(let i=0;i<7;i++){ const a=Math.random()*6.2832, r=Math.random()*60;
    x.beginPath(); x.arc(74+Math.cos(a)*r, 80+Math.sin(a)*r, R(2,4.5), 0, 6.2832); x.fill(); }
  x.fillStyle='#dff4ff'; x.font='bold 17px '+JP; x.textAlign='left'; x.textBaseline='middle';
  x.fillText('気象 / WEATHER', 152, 22);
  x.fillStyle='#3fe6ff'; x.font='bold 15px '+JP;
  x.fillText('豪雨 RAIN', 152, 52);
  x.fillText('視界 320m', 152, 76);

function drawScreen(){
  const x=SCREEN_CV.getContext('2d'), w=256, h=256;
  x.fillStyle='#050a16'; x.fillRect(0,0,w,h);
  const m = screenMode % 5;
  if(m===0){                       // 均衡器
    for(let i=0;i<15;i++){ const bh=R(18,205); x.fillStyle=(i%4===0)?'#ff3fa0':'#3fe6ff';
      x.fillRect(9+i*16, h-14-bh, 12, bh); }

    for(let i=1;i<7;i++){ x.beginPath(); x.arc(128,128,i*19,0,6.2832); x.stroke(); }

    x.fillStyle='#9b6cff'; x.beginPath(); x.arc(128,128,9,0,6.2832); x.fill();
  }else if(m===2){                 // 波形
    x.strokeStyle='#9b6cff'; x.lineWidth=5; x.beginPath();
    for(let i=0;i<=64;i++){ const px=i*4, py=128+Math.sin(i*0.38)*R(18,58); i?x.lineTo(px,py):x.moveTo(px,py); }
    x.stroke();
    x.strokeStyle='rgba(63,230,255,0.55)'; x.lineWidth=3; x.beginPath();
    for(let i=0;i<=64;i++){ const px=i*4, py=128+Math.cos(i*0.27)*R(10,34); i?x.lineTo(px,py):x.moveTo(px,py); }
    x.stroke();
  }else if(m===3){                 // 字符网格
    x.font='bold 19px '+JP; x.textAlign='center'; x.textBaseline='middle';
    for(let r=0;r<10;r++) for(let c2=0;c2<13;c2++){
      x.fillStyle = Math.random()>0.76 ? '#3fe6ff' : 'rgba(70,150,210,0.20)';

    }
  }else{                           // 滚动横条 + 标题
    for(let i=0;i<8;i++){
      x.fillStyle = (i%2)? 'rgba(63,230,255,0.20)':'rgba(255,63,160,0.16)';
      x.fillRect(0, (i*34 + (performance.now()*0.03)%h)%h, w, 16);

  }

  for(let i=0;i<h;i+=4) x.fillRect(0,i,w,2);
  SCREEN_TX.needsUpdate = true;
}

  BX(root, BASE+0.5, 0.26, BASE+0.5, M.baseTrim, 0, -1.82, 0, {ol:0});
  BX(root, BASE+0.9, 0.20, BASE+0.9, MK(0x0d1220), 0, -2.02, 0, {ol:0});

  const fr = 0.36;

function arcPts(cx,cz,r,a0,a1,y0,y1,n){
  const p=[];
  for(let i=0;i<=n;i++){ const t=i/n, a=(a0+(a1-a0)*t)*D2R;
    p.push(new T.Vector3(cx+Math.cos(a)*r, y0+(y1-y0)*t, cz+Math.sin(a)*r)); }
  return p;
}
function spiralPts(cx,cz,r0,r1,a0,a1,y0,y1,n){
  const p=[];
  for(let i=0;i<=n;i++){ const t=i/n, a=(a0+(a1-a0)*t)*D2R, r=r0+(r1-r0)*t;
    p.push(new T.Vector3(cx+Math.cos(a)*r, y0+(y1-y0)*t, cz+Math.sin(a)*r)); }
  return p;
}
function linePts(x0,y0,z0,x1,y1,z1,n){
  const p=[];
  for(let i=0;i<=n;i++){ const t=i/n;
    p.push(new T.Vector3(x0+(x1-x0)*t, y0+(y1-y0)*t, z0+(z1-z0)*t)); }
  return p;
}
/** 一段高架路（含护栏 / 导视线 / 边缘霓虹） */
function roadSeg(pa, a, b, w, th, o){
  o = o||{};
  const dir = new T.Vector3().subVectors(b,a);
  const len = dir.length();
  if(len < 0.02) return null;
  const g = new T.Group();
  g.position.copy(a).add(b).multiplyScalar(0.5);
  g.quaternion.setFromUnitVectors(UX, dir.clone().normalize());
  pa.add(g);
  BX(g, len+0.03, th, w, o.deck||M.road, 0, 0, 0, {olt:0.013});
  const eg = o.edge || M.neonCY;
  BX(g, len, 0.055, 0.09, eg, 0, th/2+0.006,  w/2-0.055, {ol:0});
  BX(g, len, 0.055, 0.09, eg, 0, th/2+0.006, -(w/2-0.055), {ol:0});
  if(o.under!==false)
    BX(g, len*0.94, 0.035, w*0.48, o.underM||M.underGlow, 0, -th/2-0.02, 0, {ol:0});
  if(o.guide!==false){
    const gm = o.guideM || M.guideCY;
    BX(g, len*0.24, 0.025, 0.075, gm, -len*0.25, th/2+0.005, 0, {ol:0});
    BX(g, len*0.24, 0.025, 0.075, gm,  len*0.25, th/2+0.005, 0, {ol:0});
  }
  if(o.rail!==false){
    [1,-1].forEach(s=>{
      const zx = s*(w/2-0.035);
      BX(g, len, 0.05, 0.06, M.metal, 0, th/2+0.40, zx, {ol:0});
      BX(g, len, 0.042, 0.05, M.metal, 0, th/2+0.18, zx, {ol:0});
      const np = Math.max(1, Math.round(len/2.6));
      for(let i=0;i<=np;i++)
        BX(g, 0.055, 0.45, 0.055, M.darkMetal, (i/np-0.5)*len, th/2+0.20, zx, {ol:0});
    });
  }
  if(o.truss) BX(g, len*0.88, 0.17, w*0.42, M.darkMetal, 0, -th/2-0.13, 0, {ol:0});
  return g;
}
function roadPath(pa, pts, w, th, o){
  for(let i=0;i<pts.length-1;i++) roadSeg(pa, pts[i], pts[i+1], w, th, o);
}
/** 透明电磁轨道（一段） */
function tubeSeg(pa, a, b, r, o){
  o = o||{};
  const dir = new T.Vector3().subVectors(b,a);
  const len = dir.length();
  if(len < 0.02) return null;
  const g = new T.Group();
  g.position.copy(a).add(b).multiplyScalar(0.5);
  g.quaternion.setFromUnitVectors(UX, dir.clone().normalize());
  pa.add(g);
  const sh = new T.Mesh(new T.CylinderGeometry(r, r, len, 14, 1, true), M.tubeGlass);
  sh.rotation.z = Math.PI/2; g.add(sh);
  const fl = new T.Mesh(new T.CylinderGeometry(r*0.92, r*0.92, len*0.99, 14, 1, true), M.flowMat);
  fl.rotation.z = Math.PI/2; g.add(fl);
  BX(g, len, 0.05, 0.13, M.neonCY, 0, -r+0.07, 0, {ol:0});
  BX(g, len, 0.035, 0.06, M.neonVI, 0, r-0.05, 0, {ol:0});
  return g;
}
function tubePath(pa, pts, r, o){
  for(let i=0;i<pts.length-1;i++) tubeSeg(pa, pts[i], pts[i+1], r, o);
}
/** 支撑立柱（带霓虹环） */
function pillar(x, z, y0, y1, r, neon){
  const h = y1-y0;
  CY(root, r*0.86, r*1.25, h, 10, M.coreMetal, x, y0+h/2, z, {olt:0.016});
  CY(root, r*1.5, r*1.7, 0.22, 12, M.darkMetal, x, y0+0.11, z, {olt:0.012});
  if(neon!==false){
    CY(root, r*1.02, r*1.02, 0.09, 10, M.neonCY, x, y0+h*0.72, z, {ol:0});
    CY(root, r*1.02, r*1.02, 0.07, 10, M.neonMG, x, y0+h*0.34, z, {ol:0});
  }
  shadowBlob(x, 0.02, z, r*6, r*6, 0.5);
}
/** 管线束 */
function pipeRun(pts, r, mat){
  const cur = new T.CatmullRomCurve3(pts);
  const m = new T.Mesh(new T.TubeGeometry(cur, 26, r, 6, false), mat||M.darkMetal);
  root.add(m); return m;
}

       Math.cos(a)*(CORE_R-0.06), 0.72+hCore/2, Math.sin(a)*(CORE_R-0.06), {ol:0});

    blinker(BX(cab, 0.10,0.05,0.04, MB(0x5cffa8), Math.cos(a)*2.28, 1.13, Math.sin(a)*2.28, {ry:-a+Math.PI, ol:0}), 0x5cffa8, 1.1, i*0.4);

/* ============================================================
   空中立交系统（多层悬浮道路 / 弧形高架 / 空中匝道 / 电磁轨道）
   ============================================================ */
const Y_A = 3.40, Y_B = 5.85, Y_C = 7.85;
const R_A = 4.60, R_B = 6.30, R_C = 3.00;
const TH  = 0.30;
let PATH_A, PATH_B1, PATH_B2, PATH_C, PATH_S1, PATH_S2, PATH_S3, PATH_R1, PATH_R2;

function buildInterchange(){
  /* ---------- 第一层：环形主路 ---------- */
  PATH_A = arcPts(0,0,R_A, 0, 360, Y_A, Y_A, 12);
  roadPath(root, PATH_A, 2.20, TH, {edge:M.neonCY, guideM:M.guideCY});
  // 外圈装饰底板
  TOR(root, R_A+1.12, 0.05, M.neonCY, 0, Y_A-TH/2-0.04, 0, {rx:-Math.PI/2, seg:44});
  TOR(root, R_A-1.12, 0.04, M.neonMG, 0, Y_A-TH/2-0.04, 0, {rx:-Math.PI/2, seg:44});

  /* ---------- 三条下行匝道（通到地面） ---------- */
  PATH_S1 = spiralPts(0,0, R_A, 8.30,   5,   5, Y_A, 0.55, 5);
  PATH_S2 = spiralPts(0,0, R_A, 8.30,  95,  95, Y_A, 0.55, 5);
  PATH_S3 = spiralPts(0,0, R_A, 8.30, 265, 265, Y_A, 0.55, 5);
  [PATH_S1, PATH_S2, PATH_S3].forEach(p=>
    roadPath(root, p, 1.90, TH, {edge:M.neonAM, guideM:M.guideCY, truss:true}));
  // 匝道落地端的门架
  [PATH_S1, PATH_S2, PATH_S3].forEach(p=>{
    const e = p[p.length-1];
    const yaw = Math.atan2(e.z, e.x);
    BX(root, 2.30, 0.22, 0.20, M.darkMetal, e.x, 2.25, e.z, {ry:-yaw, olt:0.014});
    BX(root, 2.05, 0.30, 0.06, MB(0xffffff,{map:HOLO3, transparent:true, opacity:0.85, side:T.DoubleSide}),
       e.x, 1.98, e.z, {ry:-yaw});
    [-1,1].forEach(s=>
      CY(root, 0.10,0.12,2.05, 8, M.metal,
         e.x+Math.cos(yaw+Math.PI/2)*s*1.05, 1.02, e.z-Math.sin(yaw+Math.PI/2)*s*1.05, {ol:0}));
    pool(e.x*0.72, 0.03, e.z*0.72, 3.0, 3.0, 0xffb45c, 0.16);
  });

  /* ---------- 第二层：双向弧形高架桥 ---------- */
  PATH_B1 = arcPts(0,0,R_B,  20, 160, Y_B, Y_B, 9);
  PATH_B2 = arcPts(0,0,R_B, 200, 340, Y_B, Y_B, 9);
  roadPath(root, PATH_B1, 1.80, TH, {edge:M.neonCY, guideM:M.guideCY, truss:true, underM:M.underGlow});
  roadPath(root, PATH_B2, 1.80, TH, {edge:M.neonMG, guideM:M.guideMG, truss:true, underM:M.underGlowM});

  /* ---------- 空中匝道：A → B ---------- */
  PATH_R1 = spiralPts(0,0, R_A, R_B, -12,  20, Y_A, Y_B, 6);
  PATH_R2 = spiralPts(0,0, R_A, R_B, 172, 200, Y_A, Y_B, 6);
  roadPath(root, PATH_R1, 1.60, TH, {edge:M.neonCY, guideM:M.guideCY, truss:true});
  roadPath(root, PATH_R2, 1.60, TH, {edge:M.neonMG, guideM:M.guideMG, truss:true});

  /* ---------- 第三层：透明电磁轨道 ---------- */
  PATH_C = arcPts(0,0,R_C, 190, 350, Y_C, Y_C, 8);
  tubePath(root, PATH_C, 0.62);
  // 轨道支撑环
  for(let i=0;i<=8;i++){
    const t=i/8, a=(190+(350-190)*t)*D2R;
    const x=Math.cos(a)*R_C, z=Math.sin(a)*R_C;
    TOR(root, 0.74, 0.05, M.darkMetal, x, Y_C, z, {rx:-Math.PI/2, seg:14});
    TOR(root, 0.80, 0.028, M.neonCY, x, Y_C, z, {rx:-Math.PI/2, seg:14});
  }
  // 轨道与塔身的悬臂
  [190, 230, 270, 310, 350].forEach(deg=>{
    const a=deg*D2R;
    dirBox(root, new T.Vector3(Math.cos(a)*1.16, Y_C, Math.sin(a)*1.16),
                 new T.Vector3(Math.cos(a)*(R_C-0.62), Y_C, Math.sin(a)*(R_C-0.62)),
           0.14, 0.14, M.darkMetal);
  });
  // 匝道：B → C / C → B
  const PATH_R3 = spiralPts(0,0, R_B, R_C, 160, 190, Y_B, Y_C, 6);
  const PATH_R4 = spiralPts(0,0, R_C, R_B, 350, 340, Y_C, Y_B, 6);
  tubePath(root, PATH_R3, 0.52);
  tubePath(root, PATH_R4, 0.52);
  carsPath.push(PATH_R3, PATH_R4);

  /* ---------- 支撑立柱 ---------- */
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    pillar(Math.cos(a)*R_A, Math.sin(a)*R_A, 0, Y_A-TH/2, 0.24);

  [60,130,230,300].forEach(deg=>{
    const a=deg*D2R;
    pillar(Math.cos(a)*R_B, Math.sin(a)*R_B, 0, Y_B-TH/2, 0.20);
  });
  // 匝道支柱
  [[-12,R_A],[20,R_B],[172,R_A],[200,R_B],[160,R_B],[190,R_C]].forEach(p=>{
    const a=p[0]*D2R;
    pillar(Math.cos(a)*p[1], Math.sin(a)*p[1], 0, (p[1]===R_C? Y_C-0.6 : (p[1]===R_B? Y_B-0.6 : Y_A-0.6)), 0.16);

  /* ---------- 空中绿化带 ---------- */
  function planter(x,y,z,ry,sc){
    const g = new T.Group(); g.position.set(x,y,z); g.rotation.y=ry; root.add(g);
    BX(g, 0.46*sc, 0.24, 0.40*sc, M.darkMetal, 0, 0.12, 0, {olt:0.010});
    BX(g, 0.42*sc, 0.06, 0.36*sc, MK(0x24303f), 0, 0.25, 0, {ol:0});
    for(let i=0;i<3;i++){
      const s = new T.Mesh(new T.SphereGeometry(R(0.11,0.17)*sc, 10, 8),
        MK(i%2?0x2f6b48:0x3a7d52,{emissive:0x14301f,ei:0.55}));
      s.position.set((i-1)*0.14*sc, 0.33, R(-0.06,0.06));
      s.scale.y = 0.85; g.add(s); addOL(s, 0.014);
    }
  }
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    planter(Math.cos(a)*(R_A+0.78), Y_A+TH/2, Math.sin(a)*(R_A+0.78), -a, R(0.85,1.15));
  }
  [ [40,R_B],[80,R_B],[120,R_B],[220,R_B],[260,R_B],[320,R_B] ].forEach(p=>{
    const a=p[0]*D2R;
    planter(Math.cos(a)*(R_B+0.62), Y_B+TH/2, Math.sin(a)*(R_B+0.62), -a, 0.85);
  });

  /* ---------- 雨水收集管道 ---------- */
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2 + 0.35;
    const x=Math.cos(a)*(R_A+0.95), z=Math.sin(a)*(R_A+0.95);
    // 集水口
    CY(root, 0.26,0.13,0.22, 10, M.darkMetal, x, Y_A-0.02, z, {olt:0.010});
    // 立管
    CY(root, 0.085,0.085, Y_A-0.55, 8, M.metal, x, (Y_A-0.30)/2+0.15, z, {ol:0});
    TOR(root, 0.11, 0.025, M.neonCY, x, Y_A-1.20, z, {rx:-Math.PI/2, seg:10});
    // 地面排水口
    CY(root, 0.20,0.22,0.06, 10, MB(0x1b222e), x, 0.03, z, {ol:0});
    DRIPS.push(new T.Vector3(x, 0.32, z));
  }

  /* ---------- 空中交通指示灯 ---------- */
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2 + 0.2;
    const x=Math.cos(a)*(R_A+1.05), z=Math.sin(a)*(R_A+1.05);
    CY(root, 0.035,0.045,0.34, 6, M.metal, x, Y_A+0.34, z, {ol:0});
    const c = i%3===0? 0xff3fa0 : (i%3===1? 0x3fe6ff : 0xffb45c);
    blinker(CY(root, 0.075,0.075,0.10, 10, MB(c), x, Y_A+0.56, z, {ol:0}), c, 1.2+i*0.13, i*0.37);
  }
  // 第二层边缘灯
  [ [40,R_B],[110,R_B],[250,R_B],[320,R_B] ].forEach((p,i)=>{
    const a=p[0]*D2R;
    CY(root, 0.035,0.045,0.28, 6, M.metal, Math.cos(a)*(R_B+0.72), Y_B+0.30, Math.sin(a)*(R_B+0.72), {ol:0});
    blinker(CY(root, 0.065,0.065,0.09, 10, MB(0x5cffa8), Math.cos(a)*(R_B+0.72), Y_B+0.50, Math.sin(a)*(R_B+0.72), {ol:0}),
            0x5cffa8, 1.6, i*0.5);
  });

  /* ---------- 悬浮警示灯 ---------- */
  [[6.9,25,4.6],[6.9,155,5.2],[6.6,215,6.6],[6.9,325,4.9],[3.4,70,6.4],[3.2,250,6.9]].forEach((w,i)=>{
    const a=w[1]*D2R, x=Math.cos(a)*w[0], z=Math.sin(a)*w[0], y=w[2];
    const s = new T.Mesh(new T.SphereGeometry(0.12, 12, 10), MB(i%2?0xff3fa0:0xffb45c));
    s.position.set(x,y,z); root.add(s);
    const g = glowSprite(x,y,z, 1.0, i%2?0xff3fa0:0xffb45c, 0.42);
    TOR(root, 0.20, 0.02, MB(0x2a4a66,{transparent:true,opacity:0.5}), x, y-0.20, z, {rx:-Math.PI/2, seg:14});
    warnLights.push({m:s, g:g, y:y, ph:R(0,6.28), sp:R(0.5,0.9)});
  });
}

/* ============================================================
   玻璃幕墙高楼（内部可见：办公层 / 电梯井 / 植物墙 / 空中走廊）
   ============================================================ */
function buildInstanced(geo, list, mat, parent){
  if(!list.length) return;
  const im = new T.InstancedMesh(geo, mat, list.length);
  const mt = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), s = new T.Vector3();
  list.forEach((p,j)=>{
    e.set(0, p.ry||0, 0); q.setFromEuler(e);
    s.set(p.s||1, p.s||1, p.s||1);
    mt.compose(new T.Vector3(p.x,p.y,p.z), q, s);
    im.setMatrixAt(j, mt);
  });
  im.instanceMatrix.needsUpdate = true;
  (parent||root).add(im);
  return im;
}

function buildTowerBlock(cfg){
  const g = new T.Group(); g.position.set(cfg.x, 0, cfg.z); root.add(g);
  const W=cfg.w, D=cfg.d, H=cfg.h, FL=cfg.floors, y0=0.42;
  /* 基座 */
  BX(g, W+0.55, 0.42, D+0.55, M.darkMetal, 0, 0.21, 0, {olt:0.018});
  BX(g, W+0.72, 0.09, D+0.72, M.neonCY, 0, 0.46, 0, {ol:0});
  shadowBlob(cfg.x, 0.02, cfg.z, W+2.2, D+2.2, 0.55);
  /* 幕墙 */
  [[0, D/2, W-0.12, 0],[0,-D/2, W-0.12, Math.PI],[W/2,0,D-0.12,Math.PI/2],[-W/2,0,D-0.12,-Math.PI/2]]
    .forEach(f=> PL(g, f[2], H, M.facade, f[0], y0+H/2, f[1], {ry:f[3]}));
  /* 角柱 */
  [[W/2,D/2],[-W/2,D/2],[W/2,-D/2],[-W/2,-D/2]].forEach(c=>
    BX(g, 0.20, H, 0.20, M.coreMetal, c[0], y0+H/2, c[1], {olt:0.014}));
  /* 层间横梁 */
  for(let i=0;i<=FL;i++){
    const y = y0 + H*i/(FL+1);
    BX(g, W+0.06, 0.09, D+0.06, M.darkMetal, 0, y, 0, {olt:0.012});
    if(i%2===0) BX(g, W+0.12, 0.035, D+0.12, M.neonCY, 0, y+0.07, 0, {ol:0});
  }
  /* 楼层内部 */
  const fs = H/(FL+1);
  const desks = [], screens = [];
  for(let i=0;i<FL;i++){
    const y = y0 + fs*(i+1);
    PL(g, W-0.28, D-0.28, M.inFloor, 0, y, 0, {rx:-Math.PI/2});
    BX(g, W-0.80, 0.05, D-0.80, M.strip, 0, y-0.10, 0, {ol:0});       // 天花灯带
    BX(g, W-0.30, 0.04, 0.10, M.neonCY, 0, y+0.03,  (D-0.28)/2, {ol:0});
    BX(g, W-0.30, 0.04, 0.10, M.neonCY, 0, y+0.03, -(D-0.28)/2, {ol:0});
    const nx = Math.max(2, Math.floor((W-1.0)/0.78));
    const nz = Math.max(2, Math.floor((D-1.0)/0.78));
    for(let a=0;a<nx;a++) for(let b=0;b<nz;b++){
      if((a+b)%2) continue;
      const dx = -(W-1.0)/2 + a*0.78 + 0.24;
      const dz = -(D-1.0)/2 + b*0.78 + 0.24;
      if(Math.abs(dx)<0.62 && Math.abs(dz)<0.62) continue;
      desks.push({x:dx, y:y+0.32, z:dz});
      screens.push({x:dx, y:y+0.56, z:dz});
    }
  }
  buildInstanced(new T.BoxGeometry(0.64,0.30,0.44), desks, M.inDesk, g);
  buildInstanced(new T.BoxGeometry(0.24,0.16,0.03), screens, MB(0x8fe8ff), g);
  /* 竖向交通核 */

const SOLID = [
  {x0:-8.75,x1:-5.25,z0:-6.95,z1:-3.45,h:12.0},   // 塔 A
  {x0: 3.95,x1: 8.05,z0:-7.05,z1:-3.75,h: 8.9},   // 塔 B

  {x0:-7.80,x1:-6.40,z0:-3.70,z1: 3.70,h: 5.4}    // 空中走廊
];
function inSolid(x,z){
  for(let i=0;i<SOLID.length;i++){ const s=SOLID[i];
    if(x>s.x0 && x<s.x1 && z>s.z0 && z<s.z1) return s.h; }
  const r = Math.hypot(x,z);
  if(r < 2.80) return 13.80;                       // 控制舱
  if(r > 3.45 && r < 5.75) return Y_A+0.18;        // 环形主路
  const a = Math.atan2(z,x)/D2R; const deg = a<0? a+360 : a;
  if(r > 5.45 && r < 7.15){
    if((deg>=18 && deg<=162) || (deg>=198 && deg<=342)) return Y_B+0.18;
  }
  if(r > 2.30 && r < 3.70 && deg>=188 && deg<=352) return Y_C+0.5;
  return 0;
}

/* ---- 玻璃幕墙雨水（着色器） ---- */
const glassMats = [];
function makeGlassRain(w,h, x,y,z, ry, parent){
  const mat = new T.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uAspect:{value:w/h}, uOpacity:{value:0.34},
               uColor:{value:new T.Color(0xcfe8ff)} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform float uTime; uniform float uAspect; uniform float uOpacity; uniform vec3 uColor;',
      'float h11(float p){ return fract(sin(p*127.1)*43758.5453); }',
      'void main(){',
      '  vec2 uv=vUv; float a=0.0;',
      '  for(int i=0;i<18;i++){ float fi=float(i);',
      '    vec2 c=vec2(h11(fi*1.37), h11(fi*3.11));',
      '    float r=0.005+h11(fi*5.7)*0.011;',
      '    float d=distance(vec2(uv.x*uAspect,uv.y), vec2(c.x*uAspect,c.y));',
      '    a += smoothstep(r,0.0,d)*(0.30+0.45*h11(fi*7.3)); }',
      '  for(int i=0;i<6;i++){ float fi=float(i)+30.0;',
      '    float cx=h11(fi*1.7); float sp=0.10+h11(fi*2.3)*0.24;',
      '    float y=fract(h11(fi*4.1)-uTime*sp);',
      '    float dx=abs(uv.x-cx);',
      '    float head=smoothstep(0.017,0.002,dx)*smoothstep(0.06,0.0,abs(uv.y-y));',
      '    float trail=smoothstep(0.008,0.0,dx)*(1.0-smoothstep(0.0,0.24,y-uv.y))*step(uv.y,y);',
      '    a += head*0.5+trail*0.2; }',
      '  gl_FragColor=vec4(uColor, clamp(a,0.0,1.0)*uOpacity); }'
    ].join('\n'),
    transparent:true, depthWrite:false
  });
  glassMats.push(mat);
  const p = new T.Mesh(new T.PlaneGeometry(w,h), mat);
  p.position.set(x,y,z); if(ry) p.rotation.y = ry;
  (parent||root).add(p);
}

/* ---- 雨 ---- */
const RAIN_N = 1900;
const rainGeo = new T.BufferGeometry();
const rainPos = new Float32Array(RAIN_N*6);
const rainY = new Float32Array(RAIN_N);
const rainX = new Float32Array(RAIN_N);
const rainZ = new Float32Array(RAIN_N);
const rainV = new Float32Array(RAIN_N);
const rainL = new Float32Array(RAIN_N);
for(let i=0;i<RAIN_N;i++){
  rainX[i]=R(-10,10); rainZ[i]=R(-10,10); rainY[i]=R(0,17); rainV[i]=R(12,18); rainL[i]=R(0.42,0.98);
}
rainGeo.setAttribute('position', new T.BufferAttribute(rainPos, 3));
const rain = new T.LineSegments(rainGeo, new T.LineBasicMaterial({color:0xa9c9f5, transparent:true, opacity:0.28}));
rain.frustumCulled = false; root.add(rain);
function updateRain(dt){
  const p = rainPos;
  for(let i=0;i<RAIN_N;i++){
    let y = rainY[i] - rainV[i]*dt;
    if(y < -0.15){ y = R(15,17.5); rainX[i]=R(-10,10); rainZ[i]=R(-10,10); }
    rainY[i] = y;
    const j=i*6, x=rainX[i], z=rainZ[i], l=rainL[i];
    const roof = inSolid(x,z);
    if(roof && y < roof){ p[j]=x;p[j+1]=-90;p[j+2]=z; p[j+3]=x;p[j+4]=-90;p[j+5]=z; continue; }
    p[j]=x; p[j+1]=y; p[j+2]=z;
    p[j+3]=x+0.055*l; p[j+4]=y+l; p[j+5]=z+0.03*l;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

  drips.forEach(d=>{
    d.y -= d.v*dt;
    if(d.y < 0.05){ d.y = 0.32; spawnRipple(d.o.x, 0.03, d.o.z, 0.85); }
    d.m.position.set(d.o.x, d.y, d.o.z);
    d.m.scale.set(1, 2.2, 1);
  });
}

/* ---- 水波纹 ---- */
const ripples = [];
const ringGeo = new T.RingGeometry(0.06, 0.105, 22);
for(let i=0;i<86;i++){
  const m = new T.Mesh(ringGeo, MB(0xa8cff0, {transparent:true, opacity:0, blending:T.AdditiveBlending, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.visible = false; root.add(m);
  ripples.push({m:m, t:0, dur:1, s0:0.4, s1:1.8, alive:false});
}
function spawnRipple(x, y, z, scale){
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    if(r.alive) continue;
    r.alive = true; r.t = 0; r.dur = R(0.85,1.5);
    r.s0 = 0.35*scale; r.s1 = R(1.4,2.2)*scale;
    r.m.position.set(x,y,z); r.m.visible = true;
    return r;
  }
}
function updateRipples(dt){
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    if(!r.alive) continue;
    r.t += dt/r.dur;
    if(r.t >= 1){ r.alive=false; r.m.visible=false; continue; }
    const s = r.s0 + (r.s1-r.s0)*r.t;
    r.m.scale.set(s, s, 1);
    r.m.material.opacity = (1-r.t)*(1-r.t)*0.72;
  }
  let spawn = dt*30;
  while(spawn > 0){
    spawn -= 1;
    if(Math.random() > 0.52) continue;
    const x = R(-8.6,8.6), z = R(-8.6,8.6);
    if(inSolid(x,z)) continue;
    spawnRipple(x, 0.024, z, R(0.5,1.3));
  }
}

/* ============================================================
   飞行汽车（沿轨道缓慢滑行 + 尾光）
   ============================================================ */
const cars = [];
function addCar(pts, closed, color, lift, sp, u0){
  const curve = new T.CatmullRomCurve3(pts, !!closed, 'catmullrom', 0.2);
  const g = buildCarMesh(color); root.add(g);
  const tr = [];
  for(let i=0;i<6;i++) tr.push(glowSprite(0, -50, 0, 0.4, color, 0.3));
  cars.push({g:g, curve:curve, u:u0||0, sp:sp, lift:lift||0, tr:tr, ph:R(0,6.28)});
}
addCar(PATH_A.slice(0,12), true,  0x3fe6ff, 0.20, 0.030, 0.05);
addCar(PATH_A.slice(0,12), true,  0xff3fa0, 0.20, 0.026, 0.55);
addCar(PATH_B1, false, 0xffb45c, 0.18, 0.020, 0.15);
addCar(PATH_B2, false, 0x5cffa8, 0.18, 0.022, 0.70);
addCar(PATH_C,  false, 0x3fe6ff, -0.30, 0.035, 0.10);
addCar(PATH_C,  false, 0x9b6cff, -0.30, 0.030, 0.62);
addCar(carsPath[0], false, 0xff3fa0, 0, 0.028, 0.30);
addCar(carsPath[1], false, 0xffb45c, 0, 0.030, 0.20);

function updateCars(dt, time){
  cars.forEach(c=>{
    c.u += c.sp*dt;
    if(c.u > 1) c.u -= 1;
    const p = c.curve.getPointAt(c.u);
    const tg = c.curve.getTangentAt(c.u);
    c.g.position.set(p.x, p.y + c.lift + Math.sin(time*1.7+c.ph)*0.025, p.z);
    c.g.quaternion.setFromUnitVectors(UX, tg);
    for(let i=0;i<c.tr.length;i++){
      let u = c.u - (i+1)*0.0055;
      u = u - Math.floor(u);
      const pp = c.curve.getPointAt(u);
      const k = 1 - (i+1)/7;
      c.tr[i].position.set(pp.x, pp.y + c.lift, pp.z);
      c.tr[i].scale.set(0.46*k+0.12, 0.30*k+0.10, 1);
      c.tr[i].material.opacity = 0.34*k;
    }
  });
}

/* ============================================================
   城市喧嚣音效（Web Audio 程序化合成，完全离线）
   雨声 + 城市低频轰鸣 + 电网嗡鸣 + 偶尔的车辆鸣笛
   ============================================================ */
const snd = { ctx:null, master:null, rainG:null, humG:null, on:false, vol:0.55, hornT:0, hornNext:R(3.5,8) };
function mkNoise(ctx, sec, pink){
  const len = Math.floor(ctx.sampleRate*sec);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let l0=0, l1=0, l2=0;
  for(let i=0;i<len;i++){
    const w = Math.random()*2-1;
    if(pink){ l0=0.97*l0+0.03*w; l1=0.85*l1+0.15*w; l2=0.62*l2+0.38*w;
              d[i]=(l0*2.4+l1*0.9+l2*0.34)*0.30; }
    else d[i]=w*0.30;
  }
  return buf;
}
function sndBuild(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  const ctx = new AC();
  snd.ctx = ctx;
  snd.master = ctx.createGain(); snd.master.gain.value = 0;
  snd.master.connect(ctx.destination);

  /* 雨 */
  const rs = ctx.createBufferSource(); rs.buffer = mkNoise(ctx, 2.5, true); rs.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=560;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value=3600; lp.Q.value=0.5;
  snd.rainG = ctx.createGain(); snd.rainG.gain.value = 0.55;
  rs.connect(hp); hp.connect(lp); lp.connect(snd.rainG); snd.rainG.connect(snd.master);
  rs.start();
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.085;
  const lg = ctx.createGain(); lg.gain.value = 0.12;
  lfo.connect(lg); lg.connect(snd.rainG.gain); lfo.start();

  /* 城市低频轰鸣（车流） */
  const hs = ctx.createBufferSource(); hs.buffer = mkNoise(ctx, 3.0, true); hs.loop = true;
  const hlp = ctx.createBiquadFilter(); hlp.type='lowpass'; hlp.frequency.value=190; hlp.Q.value=0.9;
  snd.humG = ctx.createGain(); snd.humG.gain.value = 0.85;
  hs.connect(hlp); hlp.connect(snd.humG); snd.humG.connect(snd.master);
  hs.start();
  const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.062;
  const lg2 = ctx.createGain(); lg2.gain.value = 0.34;
  lfo2.connect(lg2); lg2.connect(snd.humG.gain); lfo2.start();

  /* 远处风声 */
  const ws = ctx.createBufferSource(); ws.buffer = mkNoise(ctx, 3.0, true); ws.loop = true;
  const wbp = ctx.createBiquadFilter(); wbp.type='bandpass'; wbp.frequency.value=340; wbp.Q.value=0.8;
  const wg = ctx.createGain(); wg.gain.value = 0.20;
  ws.connect(wbp); wbp.connect(wg); wg.connect(snd.master);
  ws.start();
  const lfo3 = ctx.createOscillator(); lfo3.frequency.value = 0.045;
  const lg3 = ctx.createGain(); lg3.gain.value = 0.14;
  lfo3.connect(lg3); lg3.connect(wg.gain); lfo3.start();

  /* 电网嗡鸣 */
  [54, 81.5, 108].forEach((f,i)=>{
    const o = ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const og = ctx.createGain(); og.gain.value = 0.035/(i+1);
    o.connect(og); og.connect(snd.master); o.start();
  });
}
/* 车辆鸣笛 */
function horn(){
  const ctx = snd.ctx; if(!ctx) return;
  const t = ctx.currentTime;
  const truck = Math.random() < 0.4;
  const freqs = truck ? [233, 311] : [420, 529];
  const dur = truck ? 0.80 : 0.52;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(truck?0.15:0.095, t+0.05);
  g.gain.setValueAtTime(truck?0.15:0.095, t+dur*0.55);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  const bp = ctx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value = truck?680:1350; bp.Q.value=1.1;
  freqs.forEach(f=>{
    const o = ctx.createOscillator(); o.type = truck?'sawtooth':'square'; o.frequency.value=f;
    const og = ctx.createGain(); og.gain.value = 0.5;
    o.connect(og); og.connect(bp); o.start(t); o.stop(t+dur+0.1);
  });
  bp.connect(g);
  // 城市回声
  const dl = ctx.createDelay(0.6); dl.delayTime.value = 0.17;
  const fb = ctx.createGain(); fb.gain.value = 0.26;
  const wet = ctx.createGain(); wet.gain.value = 0.38;
  g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(snd.master);
  if(ctx.createStereoPanner){
    const pan = ctx.createStereoPanner(); pan.pan.value = R(-0.65,0.65);
    g.connect(pan); pan.connect(snd.master);
  } else {
    g.connect(snd.master);
  }
}
(function(){
  const btn=document.getElementById('sndBtn'), vol=document.getElementById('sndVol'),
        icOn=document.getElementById('icOn'), icOff=document.getElementById('icOff');
  btn.addEventListener('click', ()=>{
    if(!snd.ctx) sndBuild();
    if(!snd.ctx) return;
    if(snd.ctx.state==='suspended') snd.ctx.resume();
    snd.on = !snd.on;
    icOn.style.display  = snd.on ? 'block' : 'none';
    icOff.style.display = snd.on ? 'none'  : 'block';
    const t = snd.ctx.currentTime;
    snd.master.gain.setTargetAtTime(snd.on ? snd.vol*0.85 : 0, t, 0.5);
    if(snd.on){ snd.hornT = 0; snd.hornNext = R(1.5, 4.5); }
  });
  vol.addEventListener('input', ()=>{
    snd.vol = vol.value/100;
    if(snd.on) snd.master.gain.setTargetAtTime(snd.vol*0.85, snd.ctx.currentTime, 0.15);
  });
  renderer.domElement.addEventListener('pointerdown', ()=>{
    if(snd.ctx && snd.ctx.state==='suspended') snd.ctx.resume();
  });
})();

/* ============================================================
   动画
   ============================================================ */
let time = 0, last = performance.now();
let screenT = 0;

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last)/1000; last = now;
  if(dt > 0.06) dt = 0.06;
  time += dt;

  /* 相机 */
  ctrl.theta += ctrl.dth; ctrl.phi += ctrl.dph; ctrl.r += ctrl.dr;
  ctrl.dth *= 0.86; ctrl.dph *= 0.86; ctrl.dr *= 0.88;
  ctrl.phi = clamp(ctrl.phi, 0.18, 1.42);
  ctrl.r   = clamp(ctrl.r, 12, 78);
  if(ctrl.dragging) ctrl.idle = 0; else ctrl.idle += dt;
  if(ctrl.idle > 5) ctrl.theta += dt*0.009;
  const sp2 = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.r*sp2*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.r*Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.r*sp2*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 雨 / 水 */
  updateRain(dt);
  updateDrips(dt);
  updateRipples(dt);
  for(let i=0;i<glassMats.length;i++) glassMats[i].uniforms.uTime.value = time;

  /* 电磁轨道流动蓝光 */
  FLOW.offset.y = (FLOW.offset.y - dt*0.55) % 1;

  /* 飞行汽车 */
  updateCars(dt, time);

  /* 电梯轿厢 */
  elevators.forEach(e=>{
    e.ph += dt*e.sp*e.dir;
    const s = Math.sin(e.ph);
    e.m.position.y = e.y0 + (e.y1-e.y0)*(0.5+0.5*s);
  });

  /* 无人机 */
  drones.forEach(d=>{
    d.ph += dt*d.sp;
    d.g.position.y = d.y0 + Math.sin(d.ph)*0.10;
    d.g.rotation.y += dt*0.6;
    d.glow.position.set(d.g.position.x, d.g.position.y-0.10, d.g.position.z);
  });

  /* 悬浮警示灯 */
  warnLights.forEach(w=>{
    w.ph += dt*w.sp;
    const y = w.y + Math.sin(w.ph)*0.16;
    w.m.position.y = y; w.g.position.y = y;
    w.g.material.opacity = 0.30 + 0.16*(0.5+0.5*Math.sin(w.ph*2.2));
  });

  /* 全息路牌轻微闪烁 */
  holoSigns.forEach(h=>{
    const f = 0.78 + 0.16*Math.sin(time*2.4+h.ph) + (Math.random()<dt*0.5 ? -0.28 : 0);
    h.p.material.opacity = h.base*clamp(f,0.15,1);
    h.sp.material.opacity = 0.20*clamp(f,0.2,1);
    h.p.position.y = Math.sin(time*0.9+h.ph)*0.035;
  });

  /* 巨型电子屏循环变换 */
  screenT += dt;
  if(screenT > 0.62){ screenT = 0; screenMode++; drawScreen(); }
  AD_TEX.offset.y = (AD_TEX.offset.y - dt*0.035) % 1;

  /* 舱内：全息旋转 / 悬浮面板 */
  if(holoRings){ holoRings.rotation.y += dt*0.55; holoCore.rotation.y -= dt*0.85; holoCore.rotation.x += dt*0.35; }
  floatPanels.forEach(p=>{
    p.m.position.y = p.y + Math.sin(time*1.15+p.ph)*0.055;
    p.m.rotation.y += dt*0.18;
  });

  /* 灯光明灭 */
  for(let i=0;i<blinks.length;i++){
    const b = blinks[i];
    const k = b.lo + (1-b.lo)*(0.5+0.5*Math.sin(time*b.sp*2.0 + b.ph));
    b.m.color.copy(b.c).multiplyScalar(k);
  }
  L.deckA.intensity = 0.95 + 0.10*Math.sin(time*1.6);
  L.core.intensity  = 1.05 + 0.14*Math.sin(time*2.3+1.1);
  L.screen.intensity= 1.05 + 0.16*Math.sin(time*3.1);
  L.ad.intensity    = 0.85 + 0.12*Math.sin(time*2.7+0.6);
  L.cabin.intensity = 1.70 + 0.10*Math.sin(time*1.9+0.3);

  /* 鸣笛 */
  if(snd.on){
    snd.hornT += dt;
    if(snd.hornT > snd.hornNext){ snd.hornT = 0; snd.hornNext = R(7, 20); horn(); }
  }

  renderer.render(scene, camera);
}
animate();
