<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 微缩世界 · 森之总览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: #dfe7f5; }
  #stage { position: fixed; inset: 0; display: block; }

  /* 电影感暗角 */
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.42) 100%);
  }

  /* 闪电白闪全屏遮罩 */
  #flash {
    position: fixed; inset: 0; z-index: 25; pointer-events: none;
    background: #eaf1ff; opacity: 0; transition: opacity .6s ease-out;
  }

  /* ---------- 顶部标题 ---------- */
  #header {
    position: fixed; top: 28px; left: 34px; z-index: 10; pointer-events: none;
    text-shadow: 0 2px 18px rgba(0,0,0,.75);
  }
  #header h1 {
    font-size: 32px; letter-spacing: 8px; font-weight: 700;
    background: linear-gradient(180deg, #ffffff 30%, #9db8dd 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  #header h1 .en { font-size: 15px; letter-spacing: 5px; vertical-align: 4px; color: #6f86ad; -webkit-text-fill-color: #6f86ad; margin-left: 10px; }
  #header .sub { margin-top: 10px; font-size: 13px; letter-spacing: 3px; color: #93a7c9; }
  #header .line { margin-top: 12px; width: 210px; height: 1px;
    background: linear-gradient(90deg, rgba(160,190,235,.55), transparent); }

  /* ---------- 右上：时钟 + 季节/音效控制 ---------- */
  #panel { position: fixed; top: 30px; right: 34px; z-index: 10; text-align: right; }
  #clock {
    display: inline-block; padding: 7px 16px; border-radius: 999px; font-size: 13px; letter-spacing: 2px;
    background: rgba(10, 16, 30, .55); border: 1px solid rgba(140,170,220,.22);
    backdrop-filter: blur(8px); color: #cdd9ee; box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  #ctrls {
    margin-top: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    background: rgba(10, 16, 30, .55); border: 1px solid rgba(140,170,220,.22);
    border-radius: 14px; padding: 12px 14px;
    backdrop-filter: blur(8px); box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  #ctrls .cl { font-size: 11px; letter-spacing: 3px; color: #8fa3c7; }
  #season {
    -webkit-appearance: none; appearance: none; width: 158px;
    background: rgba(20, 28, 48, .92); color: #dfe7f5; cursor: pointer; outline: none;
    border: 1px solid rgba(140,170,220,.3); border-radius: 8px; padding: 7px 10px; font-size: 13px; letter-spacing: 1px;
  }
  #season option { background: #141c30; color: #dfe7f5; }
  .srow { display: flex; align-items: center; gap: 10px; }
  #sndBtn, #rotBtn {
    background: rgba(20, 28, 48, .92); color: #dfe7f5; cursor: pointer;
    border: 1px solid rgba(140,170,220,.3); border-radius: 8px; padding: 7px 12px;
    font-size: 12px; letter-spacing: 1px; transition: all .2s ease;
  }
  #sndBtn:hover, #rotBtn:hover { border-color: #7fb2d9; }
  #sndBtn.on, #rotBtn.on { color: #9fe8c8; border-color: #4d9a86; box-shadow: 0 0 12px -4px #4d9a86; }
  #vol, #rotSpd { width: 84px; accent-color: #7fb2d9; cursor: pointer; }

  @media (max-width: 640px) {
    #header { top: 16px; left: 18px; } #header h1 { font-size: 20px; letter-spacing: 4px; }
    #header h1 .en { display: none; }
    #panel { top: 16px; right: 14px; } #clock { font-size: 11px; padding: 5px 10px; }
    #ctrls { padding: 8px 10px; } #season { width: 128px; font-size: 12px; }
  }

  /* ---------- 底部项目卡片区（可左右滑动，自适应数量） ---------- */
  #dockWrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 0 16px 22px;
  }
  .darrow {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(140,170,220,.25); background: rgba(12, 18, 34, .7);
    color: #cdd9ee; font-size: 20px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(8px); transition: all .2s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .darrow:hover { background: rgba(24, 36, 64, .92); border-color: rgba(160,200,255,.5); }
  .darrow.hidden { opacity: 0; pointer-events: none; }
  #dock {
    flex: 1 1 auto; min-width: 0;
    display: flex; gap: 14px; padding: 6px 2px;
    overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth;
  }
  #dock::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; display: block; text-decoration: none; color: inherit;
    min-width: 176px; padding: 14px 18px 12px; border-radius: 14px;
    background: rgba(12, 18, 34, .68); border: 1px solid rgba(120,160,220,.16);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-6px); border-color: var(--ac); background: rgba(16, 24, 44, .88);
    box-shadow: 0 10px 32px rgba(0,0,0,.45), 0 0 18px -6px var(--ac); }
  .card .row { display: flex; align-items: center; gap: 9px; }
  .card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 10px var(--ac); }
  .card .name { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
  .card .desc { margin-top: 6px; font-size: 11px; color: #8fa3c7; letter-spacing: 1px; }
  @media (max-width: 640px) { .card { min-width: 142px; padding: 10px 14px; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<div id="header">
  <h1>3D 微缩世界<span class="en">MINIATURE WORLDS</span></h1>
  <div class="sub"><span id="count">6</span> 个微缩场景 · 静谧森林 · 四季更迭 · 昼夜流转</div>
  <div class="line"></div>
</div>

<div id="panel">
  <div id="clock">—</div>
  <div id="ctrls">
    <span class="cl">季 节</span>
    <select id="season">
      <option value="spring">春 · 微风新绿</option>
      <option value="summer" selected>夏 · 虫鸣繁茂</option>
      <option value="autumn">秋 · 落叶大风</option>
      <option value="winter">冬 · 白雪皑皑</option>
    </select>
    <span class="cl">音 效</span>
    <div class="srow">
      <button id="sndBtn">🔇 关</button>
      <input id="vol" type="range" min="0" max="100" value="70" title="音量">
    </div>
    <span class="cl">自 动 旋 转</span>
    <div class="srow">
      <button id="rotBtn">🔄 开</button>
      <input id="rotSpd" type="range" min="0" max="100" value="30" title="旋转速度">
    </div>
  </div>
</div>

<div id="dockWrap">
  <button class="darrow hidden" id="dL">‹</button>
  <div id="dock"></div>
  <button class="darrow hidden" id="dR">›</button>
</div>

<!-- 引入本地 three.js 框架（完全离线，与其它场景共用 lib/three.min.js） -->
<script src="lib/three.min.js"></script>
<script>
/* =========================================================================
 *  ★★★ 添加新项目只改这里 ★★★
 *  在 PROJECTS 数组里照抄一行、改四个字段即可（卡片会自动生成，
 *  顶部场景总数也会自动更新，底部卡片栏可左右滑动、自动适配数量）：
 *    file   → 目标 html 文件名（放在本目录下）
 *    title  → 卡片上显示的名字
 *    desc   → 一句话描述
 *    ac     → 主题色（会用在卡片光效上）
 * ========================================================================= */
const PROJECTS = [
  { file: "rain-store.html",     title: "雨夜便利店",   desc: "霓虹灯牌 · 大雨滂沱", ac: "#4dd8e6" },
  { file: "old-street.html",     title: "秋日暮色老街", desc: "落叶长街 · 昏黄灯火", ac: "#e8a04c" },
  { file: "seaside-street.html", title: "滨海栈桥",     desc: "海雾灯塔 · 潮起潮落", ac: "#7fb2d9" },
  { file: "snow-cabin.html",     title: "深冬雪屋",     desc: "漫天落雪 · 一窗暖光", ac: "#CCCCCC" },
  { file: "sand-house.html",     title: "戈壁驿站",     desc: "黎明沙尘 · 大漠孤烟", ac: "#00CCFF" },
  { file: "train-station.html",  title: "暮雾车站",     desc: "夜雾月台 · 灯火通明", ac: "#7fd4c1" },
  { file: "future-nightcity.html",  title: "雨夜霓虹",     desc: "未来都市 · 雨夜霓虹", ac: "pink" },
  { file: "old-temple.html",  title: "山寺水巷",     desc: "仲夏月夜 · 山寺水巷", ac: "#7fd4c1" },
  { file: "warm-bedroom.html",  title: "温馨小屋",     desc: "暖冬午后 · 温馨小屋", ac: "#ff9900" },
  // ↓↓↓ 以后新增项目，在下面照抄一行即可，例如：
  // { file: "new-place.html", title: "新场景", desc: "一句话描述", ac: "#9d8cff" },
];

/* ========================= 基础 ========================= */
const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0e1626, 45, 175);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updateArrows();
});

const M = (c, e, ei = 0, extra = {}) => new THREE.MeshStandardMaterial(
  Object.assign({ color: c, emissive: e || 0x000000, emissiveIntensity: ei, roughness: .85, metalness: 0, flatShading: true }, extra));
const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
const cyl = (rt, rb, h, seg, mat) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
const cone = (r, h, seg, mat) => new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat);
const sph = (r, mat, seg = 10) => new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), mat);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);

/* ========================= 程序化贴图 ========================= */
function radialTex(size, stops) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
function moonTex() {
  const s = 256, c = document.createElement("canvas"); c.width = c.height = s;
  const x = c.getContext("2d");
  let g = x.createRadialGradient(s/2, s/2, 10, s/2, s/2, s/2);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.62, "rgba(255,255,255,1)");
  g.addColorStop(.68, "rgba(230,238,255,.15)"); g.addColorStop(1, "rgba(230,238,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, s, s);
  x.globalAlpha = .18; x.fillStyle = "#7d8ba8";
  [[118,105,16],[150,140,11],[100,150,13],[135,95,8],[112,128,7]].forEach(k => {
    x.beginPath(); x.arc(k[0], k[1], k[2], 0, 7); x.fill();
  });
  return new THREE.CanvasTexture(c);
}
function cloudTex() {
  const w = 256, h = 128, c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  for (let i = 0; i < 9; i++) {
    const bx = w*.18 + Math.random()*w*.64, by = h*.42 + Math.random()*h*.22, br = h*(.22+Math.random()*.2);
    const g = x.createRadialGradient(bx, by, 0, bx, by, br);
    g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.beginPath(); x.arc(bx, by, br, 0, 7); x.fill();
  }
  return new THREE.CanvasTexture(c);
}

/* ================= 2D 程序贴图（树皮/树叶/地面 · 灰度基调，颜色由材质与季节系统提供 · 可无缝平铺） ================= */
function makeTex(w, h, draw) {   // 水平方向平铺无缝（draw 收到的 W 包装会把绘制内容左右各复制一份）
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  draw(x, fn => { for (const ox of [-w, 0, w]) { x.save(); x.translate(ox, 0); fn(x); x.restore(); } });
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
const barkTex = makeTex(128, 256, (x, W) => {          // 树皮：浅底 + 纵向沟壑 + 裂纹 + 节疤
  x.fillStyle = "#dcd6cc"; x.fillRect(0, 0, 128, 256);
  for (let i = 0; i < 46; i++) {                        // 纵向沟壑（正弦周期扭动 → 上下接缝对齐）
    const x0 = Math.random() * 128, amp = rand(1.5, 5), f = 1 + Math.floor(Math.random() * 3), ph = Math.random() * 6.28;
    const dark = Math.random() < .72, a = rand(.1, .3);
    W(x => {
      x.strokeStyle = dark ? "rgba(30,22,14," + a + ")" : "rgba(255,250,240," + a * .8 + ")";
      x.lineWidth = rand(.8, 2.6); x.beginPath();
      for (let yy = 0; yy <= 256; yy += 4) {
        const xx = x0 + amp * Math.sin(6.28 * f * yy / 256 + ph);
        yy ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
      }
      x.stroke();
    });
  }
  for (let i = 0; i < 14; i++) W(x => {                 // 短横向裂纹
    x.strokeStyle = "rgba(20,14,8," + rand(.15, .35) + ")"; x.lineWidth = rand(.7, 1.6);
    const cx = Math.random() * 128, cy = rand(14, 240), l = rand(3, 9), sl = rand(-.5, .5);
    x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + l, cy + l * sl); x.stroke();
  });
  for (let i = 0; i < 3; i++) {                         // 节疤（深色椭圆环 + 亮芯）
    const kx = Math.random() * 128, ky = rand(50, 200), kr = rand(5, 9);
    W(x => {
      x.strokeStyle = "rgba(25,18,10,.4)"; x.lineWidth = 1.4;
      x.beginPath(); x.ellipse(kx, ky, kr, kr * 1.5, 0, 0, 7); x.stroke();
      x.fillStyle = "rgba(255,248,235,.35)";
      x.beginPath(); x.ellipse(kx, ky, kr * .4, kr * .6, 0, 0, 7); x.fill();
    });
  }
});
const leafTex = makeTex(128, 128, (x, W) => {          // 树叶：簇状明暗斑点（乘上四季叶色）
  x.fillStyle = "#efefef"; x.fillRect(0, 0, 128, 128);
  const cl = [];
  for (let i = 0; i < 9; i++) cl.push([Math.random() * 128, Math.random() * 128]);
  for (let i = 0; i < 300; i++) {
    const p = Math.random() < .65 ? cl[Math.floor(Math.random() * cl.length)] : [Math.random() * 128, Math.random() * 128];
    const bx = p[0] + rand(-11, 11), by = clamp(p[1] + rand(-11, 11), 6, 122);
    const r = rand(1.4, 4.6), dark = Math.random() < .8, a = rand(.08, .2);
    W(x => {
      x.fillStyle = dark ? "rgba(58,52,44," + a + ")" : "rgba(255,255,255," + a + ")";
      x.beginPath(); x.ellipse(bx, by, r, r * rand(.6, 1), Math.random() * 6.28, 0, 7); x.fill();
    });
  }
});
const groundTex = makeTex(256, 256, (x, W) => {        // 地面：土壤斑块 + 细碎颗粒 + 草叶短划
  x.fillStyle = "#e7e7e7"; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 14; i++) {                        // 深浅不一的土壤/苔藓软斑块
    const bx = Math.random() * 256, by = rand(20, 236), r = rand(12, 30), v = Math.floor(rand(58, 74));
    W(x => {
      const g = x.createRadialGradient(bx, by, 0, bx, by, r);
      g.addColorStop(0, "rgba(" + v + "," + v + "," + Math.floor(v * .92) + "," + rand(.14, .24) + ")");
      g.addColorStop(1, "rgba(" + v + "," + v + "," + Math.floor(v * .92) + ",0)");
      x.fillStyle = g; x.beginPath(); x.arc(bx, by, r, 0, 7); x.fill();
    });
  }
  for (let i = 0; i < 2400; i++) {                      // 细碎颗粒（沙土感）
    const bx = Math.random() * 256, by = rand(3, 253);
    W(x => {
      x.fillStyle = (Math.random() < .6 ? "rgba(40,36,28," : "rgba(255,255,250,") + rand(.04, .12) + ")";
      x.fillRect(bx, by, rand(1, 2.2), rand(1, 2.2));
    });
  }
  for (let i = 0; i < 900; i++) {                       // 草叶短划（近垂直的小笔画）
    const bx = Math.random() * 256, by = rand(5, 251), a = rand(-.4, .4), l = rand(2.5, 7);
    W(x => {
      x.strokeStyle = "rgba(34,44,22," + rand(.06, .17) + ")"; x.lineWidth = rand(.6, 1.2);
      x.beginPath(); x.moveTo(bx, by); x.lineTo(bx + Math.sin(a) * l, by - Math.cos(a) * l); x.stroke();
    });
  }
});
const woodTex = makeTex(256, 256, (x, W) => {          // 木板墙：8 条横板 + 波浪木纹 + 节疤 + 板缝
  x.fillStyle = "#e5ddd2"; x.fillRect(0, 0, 256, 256);
  for (let r = 0; r < 8; r++) {                         // 每块横板的明暗差 + 板缝
    const y0 = r * 32, v = rand(-.06, .06);
    x.fillStyle = v > 0 ? "rgba(255,250,240," + v + ")" : "rgba(40,30,20," + -v + ")";
    x.fillRect(0, y0, 256, 32);
    x.strokeStyle = "rgba(30,20,10,.4)"; x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(0, y0 + .8); x.lineTo(256, y0 + .8); x.stroke();
    x.strokeStyle = "rgba(255,250,240,.25)"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0, y0 + 2.6); x.lineTo(256, y0 + 2.6); x.stroke();
    const jx = Math.random() * 256;                     // 板端竖缝（每板一条，随机位置）
    x.strokeStyle = "rgba(30,20,10,.3)"; x.lineWidth = 1.2;
    x.beginPath(); x.moveTo(jx, y0 + 2); x.lineTo(jx, y0 + 31); x.stroke();
  }
  for (let i = 0; i < 85; i++) {                        // 波浪木纹（正弦水平流动 → 横向无缝）
    const row = Math.floor(Math.random() * 8), y0 = row * 32 + rand(5, 27);
    const amp = rand(1, 3.2), f = 1 + Math.floor(Math.random() * 2), ph = Math.random() * 6.28;
    const dark = Math.random() < .78, a = rand(.07, .2);
    W(x => {
      x.strokeStyle = dark ? "rgba(60,42,26," + a + ")" : "rgba(255,248,235," + a + ")";
      x.lineWidth = rand(.7, 1.8); x.beginPath();
      for (let xx = 0; xx <= 256; xx += 4) {
        const yy = y0 + amp * Math.sin(6.28 * f * xx / 256 + ph);
        xx ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
      }
      x.stroke();
    });
  }
  for (let i = 0; i < 5; i++) {                         // 节疤（椭圆年轮环）
    const row = Math.floor(Math.random() * 8);
    const kx = Math.random() * 256, ky = row * 32 + rand(8, 24), kr = rand(3, 6);
    W(x => {
      x.strokeStyle = "rgba(45,30,16,.45)"; x.lineWidth = 1.1;
      x.beginPath(); x.ellipse(kx, ky, kr * 1.6, kr, 0, 0, 7); x.stroke();
      x.beginPath(); x.ellipse(kx, ky, kr * .9, kr * .55, 0, 0, 7); x.stroke();
      x.fillStyle = "rgba(30,20,10,.4)";
      x.beginPath(); x.ellipse(kx, ky, kr * .3, kr * .2, 0, 0, 7); x.fill();
    });
  }
});
const roofTex = makeTex(128, 128, (x, W) => {          // 瓦片：8 行错缝圆瓦 + 底缘弧线 + 高光
  x.fillStyle = "#c9c4bc"; x.fillRect(0, 0, 128, 128);
  for (let r = 0; r < 8; r++) {
    const y0 = r * 16, off = (r % 2) * 16;

/* ========================= 地形高度函数 ========================= */
function groundH(x, z) {
  const d = Math.hypot(x, z);
  const n = Math.sin(x * .05) * Math.cos(z * .06) * 1.1
          + Math.sin(x * .021 + z * .033) * 1.8
          + Math.sin((x - z) * .08) * .5;
  return n * clamp((d - 10) / 28, 0, 1) * 1.6;
}

    p.setZ(i, groundH(x, -y));

  }

/* ================= 远山（三层：远峰连绵大 + 中景群山 + 近处小丘，层次递进） ================= */
/* 圆顶山体：高度加密分段后，把山顶往下压、往外鼓，山尖变圆润；圆润程度每座随机 */
const peak = (r, h, mat) => {
  const g = new THREE.ConeGeometry(r, h, 6, 10);    // 10 层高度分段，顶得住圆滑变形
  const p = g.attributes.position, hh = h / 2;
  const c = rand(.09, .2), e = rand(3, 5);          // c 圆润幅度 / e 作用范围，每座山都不同
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) + hh) / h;                  // t: 0 山脚 → 1 山尖
    if (t > 0) {
      const k = Math.pow(t, e) * c;                 // 只影响山顶附近，山脚原样
      p.setY(i, p.getY(i) - h * k);                 // 山尖往下压
      p.setX(i, p.getX(i) * (1 + k * .9));          // 上部往外鼓，形成圆顶
      p.setZ(i, p.getZ(i) * (1 + k * .9));
    }
  }
  return new THREE.Mesh(g, mat);
};
const mountainMat = new THREE.MeshStandardMaterial({ color: 0x6d7f93, roughness: 1, flatShading: true });
const hillMat = new THREE.MeshStandardMaterial({ color: 0x43703c, roughness: 1, flatShading: true });

    const r = rand(26, 50), h = rand(36, 66);

    pk.rotation.y = rand(0, 6); scene.add(pk);

  for (let i = 0; i < 18; i++) {          // 中景层：角度错位补空，与远峰连成山脉

    const r = rand(13, 26), h = rand(14, 28);

for (let i = 0; i < TREES; i++) {

    if (i % 5 === 4 && trees.length > 4) {
      const c = trees[Math.floor(Math.random() * trees.length)];
      const a = Math.random() * 6.28, rr = rand(1.2, 4.5);

    if (d > 6.2 && d < 83.5 && !inPond(x, z, 1.4) && !onPath(x, z)) break;
  }
  trees.push({
    x, z, y: groundH(x, z) - .15,
    h: rand(3.2, 9.4), s: rand(.55, 1.3),               // 高矮参差
    phase: Math.random() * 6.28, rot: rand(0, 6.28), pIdx: Math.floor(Math.random() * 3),

}

/* 树干和枝干是刚性的，只设置一次矩阵 */
for (let i = 0; i < TREES; i++) {
  const td = trees[i];
  dummy.position.set(td.x, td.y + td.h / 2, td.z);
  dummy.rotation.set(0, td.rot, 0);
  dummy.scale.set(td.s, td.h, td.s);
  dummy.updateMatrix(); trunkMesh.setMatrixAt(i, dummy.matrix);
  for (let j = 0; j < BRANCH_N; j++) {                  // 三根枝干斜向下穿出树冠层
    const ang = td.bA + j * 2.09;
    const by = td.y + td.h * (.5 + j * .17);
    const bl = td.bL * td.s * (1 - j * .12);
    dummy.position.set(td.x, by, td.z);
    _bt.set(td.x + Math.cos(ang) * bl, by - bl * .38, td.z + Math.sin(ang) * bl);
    dummy.lookAt(_bt);
    dummy.scale.set(td.s, td.s, bl);
    dummy.updateMatrix(); branchMesh.setMatrixAt(i * BRANCH_N + j, dummy.matrix);
  }
}

  function addWindow(x, y, z, w, h, rotY) {

    const fMat = woodDark;
    const fw = box(w + .16, .09, .1, fMat), fh1 = box(.09, h + .16, .1, fMat), fh2 = box(.09, h + .16, .1, fMat), fc = box(w, .07, .09, fMat);
    [fw, fh1, fh2, fc].forEach(f => { f.position.set(x, y, z + .02); f.rotation.y = rotY || 0; cabin.add(f); });
    const s = w / 2 + .02;
    if (rotY) {                                      // 侧面窗：竖框沿墙向两端分开，整组贴在侧墙外
      [fw, fh1, fh2, fc].forEach(f => { f.position.z = z; f.position.x = x + Math.sign(x) * .05; });
      fh1.position.z = z - s; fh2.position.z = z + s;
    } else {
      fh1.position.x = x - s; fh2.position.x = x + s;
    }
  }
  addWindow(1.2, 1.9, 1.83, .78, .78, 0);
  addWindow(2.4, 1.9, 0, .78, .78, Math.PI / 2);   // 右侧窗：窗面转 90°，正对侧面
  addWindow(-2.4, 1.9, 0, .78, .78, Math.PI / 2);  // 左侧窗

  window.lanternLight = new THREE.PointLight(0xffd9a0, 0, 8); lanternLight.position.set(2.3, 1.85, 2.3); cabin.add(lanternLight);

  // 侧墙柴堆（立体金字塔垒放：底层 5 根、往上 4-3-2-1 逐层递减，层间纵横交错咬合）
  const barkMat = M(0x77573a), cutMat = M(0xd8b078);
  const logGeoS = new THREE.CylinderGeometry(.09, .09, .8, 7);
  [[5, 1], [4, 0], [3, 1], [2, 0], [1, 1]].forEach(([n, alongZ], li) => {
    const y = .09 + li * .16;
    for (let i = 0; i < n; i++) {

      const lg = new THREE.Mesh(logGeoS, [barkMat, cutMat, cutMat]);   // 侧面树皮色，两端切面浅色

  const addLog = (x, y, z) => {

  // 屋旁树桩：被砍伐后留下的木桩，随机散布在木屋周围（避开小路/池塘/两处柴堆/活树）
  const stumpGeo = new THREE.CylinderGeometry(1, 1, 1, 9);

/* ========================= 环境音效（Web Audio 全程序化合成，完全离线） ================= */
const AudioFX = (function () {
  let ctx = null, master = null, noiseBuf = null;
  let windG, howlG, rainG, cicG;
  let on = false, vol = .7, mixT = 0;
  const mix = { cricket: 0, bird: 0 };

  function makeNoise() {
    const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    return b;
  }
  function loopNoise() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); return s; }
  function filter(type, f, q) { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; if (q) x.Q.value = q; return x; }

  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    noiseBuf = makeNoise();

    // 风（带通噪声 + 慢速 LFO 摆动，像阵风掠过树梢）
    const wf = filter("bandpass", 380, .8);
    windG = ctx.createGain(); windG.gain.value = 0;
    loopNoise().connect(wf); wf.connect(windG); windG.connect(master);
    const lfo = ctx.createOscillator(); lfo.frequency.value = .07;
    const lg = ctx.createGain(); lg.gain.value = 190;
    lfo.connect(lg); lg.connect(wf.frequency); lfo.start();

    // 呼啸（秋天的风声 / 暴风雨，窄带高频呜咽）
    const hf = filter("bandpass", 620, 5.5);
    howlG = ctx.createGain(); howlG.gain.value = 0;
    loopNoise().connect(hf); hf.connect(howlG); howlG.connect(master);
    const hl = ctx.createOscillator(); hl.frequency.value = .11;
    const hlg = ctx.createGain(); hlg.gain.value = 240;
    hl.connect(hlg); hlg.connect(hf.frequency); hl.start();

    // 雨（高通+低通滤波的噪声，小雨轻、暴雨重）
    const hp = filter("highpass", 420), lp = filter("lowpass", 5200);
    rainG = ctx.createGain(); rainG.gain.value = 0;
    loopNoise().connect(hp); hp.connect(lp); lp.connect(rainG); rainG.connect(master);

    // 蝉鸣（夏天白天：锯齿波载波 + 方波颤音，两声部）
    cicG = ctx.createGain(); cicG.gain.value = 0; cicG.connect(master);
    for (let i = 0; i < 2; i++) {
      const carrier = ctx.createOscillator(); carrier.type = "sawtooth";
      carrier.frequency.value = 4150 + i * 340 + rand(0, 60);
      const bp = filter("bandpass", 4300 + i * 300, 9);
      const am = ctx.createGain(); am.gain.value = .5;
      const trem = ctx.createOscillator(); trem.type = "square"; trem.frequency.value = 165 + i * 28;
      const tg = ctx.createGain(); tg.gain.value = .5;
      trem.connect(tg); tg.connect(am.gain);
      carrier.connect(bp); bp.connect(am); am.connect(cicG);
      carrier.start(); trem.start();
    }

    scheduleCricket(); scheduleBird();
  }

  /* 蟋蟀（夜晚，除冬天外） */
  function cricketChirp() {
    const t0 = ctx.currentTime, f = rand(4100, 4500);
    for (let i = 0; i < 4; i++) {
      const st = t0 + i * .085;
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(.05, st + .012);
      g.gain.exponentialRampToValueAtTime(.0001, st + .07);
      o.connect(g); g.connect(master); o.start(st); o.stop(st + .09);
    }
  }
  function scheduleCricket() {
    (function tick() {
      if (ctx && on && mix.cricket > .12) cricketChirp();
      setTimeout(tick, 500 + Math.random() * 1500);
    })();
  }

  /* 鸟鸣（春夏白天） */
  function birdChirp() {
    const t0 = ctx.currentTime, n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const st = t0 + i * .16 + Math.random() * .05;
      const o = ctx.createOscillator(); o.type = "sine";
      const f0 = rand(2100, 3000);
      o.frequency.setValueAtTime(f0, st);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.5, st + .06);
      o.frequency.exponentialRampToValueAtTime(f0 * .9, st + .12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(.09, st + .02);
      g.gain.exponentialRampToValueAtTime(.0001, st + .14);
      o.connect(g); g.connect(master); o.start(st); o.stop(st + .18);
    }
  }
  function scheduleBird() {
    (function tick() {
      if (ctx && on && mix.bird > .15) birdChirp();
      setTimeout(tick, 2200 + Math.random() * 5500);
    })();
  }

  /* 雷声（先劈裂、再隆隆回响） */
  function thunder(delay, power) {
    if (!ctx || !on) return;
    setTimeout(() => {
      if (!ctx) return;
      const t0 = ctx.currentTime;
      const c = ctx.createBufferSource(); c.buffer = noiseBuf;
      const chp = filter("highpass", 800);
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(.16 * power, t0);
      cg.gain.exponentialRampToValueAtTime(.0001, t0 + .25);
      c.connect(chp); chp.connect(cg); cg.connect(master);
      c.start(t0); c.stop(t0 + .3);
      /* 轰鸣雷声：低频隆隆持续 5~7 秒，慢速滚涌起伏（轰—隆—隆），紧随劈裂声压场 */
      const rdur = 5 + Math.random() * 2;
      const r = ctx.createBufferSource(); r.buffer = noiseBuf; r.loop = true;
      const rlp = filter("lowpass", 130);
      rlp.frequency.setValueAtTime(170, t0);
      rlp.frequency.exponentialRampToValueAtTime(52, t0 + rdur);
      const trem = ctx.createGain(); trem.gain.value = .72;      /* 滚涌 LFO 调制音量，产生多峰起伏 */
      const tl = ctx.createOscillator(); tl.frequency.value = 1.3 + Math.random();
      const tlg = ctx.createGain(); tlg.gain.value = .28;
      tl.connect(tlg); tlg.connect(trem.gain); tl.start(t0); tl.stop(t0 + rdur);
      const rg = ctx.createGain();
      rg.gain.setValueAtTime(.001, t0);
      rg.gain.linearRampToValueAtTime(.9 * power, t0 + .09);
      rg.gain.exponentialRampToValueAtTime(.0001, t0 + rdur);
      r.connect(rlp); rlp.connect(trem); trem.connect(rg); rg.connect(master);
      r.start(t0); r.stop(t0 + rdur);
    }, delay * 1000);
  }

  /* 每帧被主循环调用，内部节流到 0.3 秒一次混音 */
  function tick(dt, tg) {
    mix.cricket = tg.cricket; mix.bird = tg.bird;
    if (!ctx) return;
    mixT += dt; if (mixT < .3) return; mixT = 0;
    const now = ctx.currentTime;
    windG.gain.setTargetAtTime(Math.min(.55, tg.wind * .5), now, .8);
    howlG.gain.setTargetAtTime(Math.min(.5, tg.howl * .35), now, .8);
    rainG.gain.setTargetAtTime(tg.rain * lerp(.1, .34, tg.heavy), now, .5);
    cicG.gain.setTargetAtTime(tg.cicada * .05, now, 1.2);
  }

  function toggle() {
    if (!ctx) init();
    on = !on;
    if (on) { ctx.resume(); master.gain.setTargetAtTime(vol, ctx.currentTime, .1); }
    else master.gain.setTargetAtTime(0, ctx.currentTime, .1);
    return on;
  }
  function setVolume(v) {
    vol = v;
    if (ctx && on) master.gain.setTargetAtTime(vol, ctx.currentTime, .05);
  }
  return { toggle, setVolume, thunder, tick };
})();

/* ========================= 昼夜（一个日夜循环 = 120 秒真实时间） ================= */
const DAY_LEN = 120;
const now = new Date();
let phase = (now.getHours() + now.getMinutes() / 60) / 24;   // 起始时间跟随真实时钟

const C = {
  dayTop: new THREE.Color(0x3f74b8), dayBot: new THREE.Color(0xb8d4e8),
  nightTop: new THREE.Color(0x04060d), nightBot: new THREE.Color(0x0e1626),
  duskTop: new THREE.Color(0x2c3a66), duskBot: new THREE.Color(0xf0924e),
  gray: new THREE.Color(0x5a6572),
  sunWarm: new THREE.Color(0xffd9a0), sunWhite: new THREE.Color(0xfff6e8), moonCol: new THREE.Color(0x8fa8d8),
};
const _top = new THREE.Color(), _bot = new THREE.Color(), _tmp = new THREE.Color();
const _v3 = new THREE.Vector3();   // 专给光源位置用的三维临时量

function updateSky(dt, w) {
  phase = (phase + dt / DAY_LEN) % 1;
  const th = (phase - .25) * Math.PI * 2;          // 6 点日出 / 12 点正午 / 18 点日落
  const elev = Math.sin(th);
  const R = 165;
  const sunPos = new THREE.Vector3(Math.cos(th) * R, elev * R, -R * .3).normalize().multiplyScalar(R * .96);
  sun.position.copy(sunPos);
  moon.position.copy(sunPos).multiplyScalar(-1); moon.position.z = -R * .1;
  moonHalo.position.copy(moon.position);

  const d = clamp((elev + .12) / .37, 0, 1);                        // 白天强度
  const wGlow = clamp(1 - Math.abs(elev) / .3, 0, 1) * clamp((elev + .3) / .45, 0, 1); // 晨昏暖色
  const rf = Math.max(w.rainI * .8, w.fogI * .55);                 // 阴雨/雾天去饱和

  _top.copy(C.nightTop).lerp(C.dayTop, d).lerp(C.duskTop, wGlow * .45);
  _bot.copy(C.nightBot).lerp(C.dayBot, d).lerp(C.duskBot, wGlow * .8);
  _top.lerp(_tmp.copy(C.gray).lerp(_top, .35), rf * .55);
  _bot.lerp(_tmp.copy(C.gray).lerp(_bot, .45), rf * .5);
  skyMat.uniforms.top.value.copy(_top);
  skyMat.uniforms.bot.value.copy(_bot);
  scene.fog.color.copy(_bot);
  scene.fog.near = lerp(lerp(45, 30, w.rainI), 8, w.fogI);
  scene.fog.far = lerp(lerp(175, 110, w.rainI), 52, w.fogI);

  starMat.opacity = clamp((1 - d) * .9 - rf * .6, 0, .9);
  sun.material.opacity = clamp(elev * 3 + .3, 0, 1) * (1 - rf * .85);
  moon.material.opacity = clamp(-elev * 3 + .3, 0, 1);
  moonHalo.material.opacity = moon.material.opacity * .8;

  hemi.intensity = .18 + .62 * d;
  hemi.color.copy(_top).lerp(_tmp.set(0xffffff), .4);
  /* ★ 日月阴影：白天光源跟随太阳、夜晚跟随月亮，阴影方向随昼夜角度实时变化 */
  const dip = clamp(Math.abs(elev) / .05, 0, 1);   // 日月贴地平线切换的一瞬，直射光自然衰减，阴影柔和交接
  dir.intensity = (.26 + .81 * d) * (1 - rf * .55) * dip;   // 正午总强度不变，夜晚月光略增强让月影可见
  dir.color.copy(C.moonCol).lerp(d > .02 ? C.sunWhite : C.moonCol, d).lerp(C.sunWarm, wGlow * .7);
  dir.position.copy(elev > 0 ? sunPos : moon.position);      // 太阳在地平线上方→随太阳；落下→随月亮
  ambient.intensity = .25 + .3 * (1 - d);

  clouds.forEach(c => {
    c.material.color.setRGB(lerp(.16, 1, d), lerp(.2, 1, d), lerp(.32, 1, d));
    c.material.opacity = c.userData.baseO + w.rainI * .25 + w.fogI * .15;
  });
  return d;
}

/* ========================= 天气系统（自然现象各持续 20~30 秒） ================= */
const weather = { kind: "clear", t: 0, dur: 20, rainI: 0, heavyF: 0, fogI: 0, boltT: 4 };
function startWeather(k) {
  weather.kind = k; weather.t = 0;
  weather.dur = k === "clear" ? rand(24, 50) : rand(20, 30);
  weather.boltT = rand(2, 5);
}
function placeRainbow() {
  const sp = sun.position;
  const px = -sp.x, pz = -sp.z, L = Math.hypot(px, pz) || 1;
  rainbow.position.set(px / L * 105, -6, pz / L * 105);
  rainbow.lookAt(0, 10, 0);
}
function updateWeather(dt, dayF) {
  const w = weather;
  w.t += dt;
  if (seasonMix.winter > .5 && (w.kind === "lightrain" || w.kind === "heavyrain")) {
    startWeather("clear");                             // 冬天只下雪，不下雨
  }
  if (w.t > w.dur) {
    if (w.kind === "clear") {
      const r = Math.random();
      startWeather(seasonMix.winter > .5
        ? (r < .5 ? "fog" : "clear")                   // 冬天：雾 或 继续晴（雪由季节系统下）
        : r < .42 ? "lightrain" : r < .72 ? "heavyrain" : "fog");
    } else {
      if (w.rainI > .4 && dayF > .45 && rainbowLife < 0) { rainbowLife = 0; placeRainbow(); }
      startWeather("clear");
    }
  }
  const rT = w.kind === "lightrain" ? .55 : w.kind === "heavyrain" ? 1 : 0;
  const hT = w.kind === "heavyrain" ? 1 : 0;
  const fT = w.kind === "fog" ? 1 : 0;
  w.rainI += clamp(rT - w.rainI, -dt / 5, dt / 4);
  w.heavyF += clamp(hT - w.heavyF, -dt / 3, dt / 3);
  w.fogI += clamp(fT - w.fogI, -dt / 5, dt / 4);

  if (w.heavyF > .55) {                     // 暴雨时随机闪电
    w.boltT -= dt;
    if (w.boltT <= 0) { spawnBolt(); w.boltT = rand(2.5, 7.5); }
  }
  rainMat.opacity = w.rainI * lerp(.2, .42, w.heavyF);
}

const groundMatT = new THREE.Color(), hillMatT = new THREE.Color(), mountainMatT = new THREE.Color();
function applySeasonTargets() {
  const def = SEASON_DEF[season.target];
  groundMatT.setHex(def.ground);
  hillMatT.setHex(def.hill);
  mountainMatT.setHex(def.mount);
  grassMatT.setHex(def.bush[0]);
  trees.forEach(td => td.tgt.setHex(def.fol[td.pIdx]).offsetHSL(0, 0, rand(-.035, .035)));
  bushes.forEach(bd => bd.tgt.setHex(def.bush[bd.pIdx]).offsetHSL(0, 0, rand(-.03, .03)));
  windBaseT = def.wind; fScaleT = def.fScale;
  hayMatT.setHex(HAY_COL[season.target]);
}
applySeasonTreesInit();
function applySeasonTreesInit() {
  const def = SEASON_DEF[season.target];
  trees.forEach(td => td.tgt.setHex(def.fol[td.pIdx]));
  bushes.forEach(bd => bd.tgt.setHex(def.bush[bd.pIdx]));
  trees.forEach((td, i) => {
    td.cur.copy(td.tgt);
    folLow.setColorAt(i, td.cur); folMid.setColorAt(i, td.cur); folTop.setColorAt(i, td.cur);
  });
  bushes.forEach((bd, i) => { bd.cur.copy(bd.tgt); bushMesh.setColorAt(i, bd.cur); });
  groundMat.color.setHex(def.ground); hillMat.color.setHex(def.hill); mountainMat.color.setHex(def.mount);
  groundMatT.setHex(def.ground); hillMatT.setHex(def.hill); mountainMatT.setHex(def.mount);
  grassMat.color.setHex(def.bush[0]); grassMatT.setHex(def.bush[0]);
  tallMat.color.setHex(def.bush[0]); hayMat.color.setHex(HAY_COL[season.target]); hayMatT.setHex(HAY_COL[season.target]);
  if (folLow.instanceColor) folLow.instanceColor.needsUpdate = true;
  if (folMid.instanceColor) folMid.instanceColor.needsUpdate = true;
  if (folTop.instanceColor) folTop.instanceColor.needsUpdate = true;
  if (bushMesh.instanceColor) bushMesh.instanceColor.needsUpdate = true;
}

seasonSel.addEventListener("change", e => {

  applySeasonTargets();
});

/* ========================= 主循环 ========================= */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(0, 2.4, 0);
const clockEl = document.getElementById("clock");
let clockTick = 0, introT = 0, gust = 0, gustT = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  /* 昼夜 + 天气 */
  const dayF = updateSky(dt, weather);
  const nightF = clamp((0.35 - dayF) / 0.5, 0, 1);
  updateWeather(dt, dayF);

  /* 季节过渡（颜色 / 冠幅 / 风力全部平滑渐变） */
  const kCol = 1 - Math.pow(.5, dt / 1.1);
  for (const s in seasonMix) seasonMix[s] += ((s === season.target ? 1 : 0) - seasonMix[s]) * kCol;
  groundMat.color.lerp(groundMatT, kCol);
  hillMat.color.lerp(hillMatT, kCol);
  mountainMat.color.lerp(mountainMatT, kCol);
  grassMat.color.lerp(grassMatT, kCol);
  tallMat.color.lerp(grassMatT, kCol);
  hayMat.color.lerp(hayMatT, kCol);
  windBase += (windBaseT - windBase) * kCol;
  fScale += (fScaleT - fScale) * kCol;
  trees.forEach((td, i) => {
    td.cur.lerp(td.tgt, kCol);
    folLow.setColorAt(i, td.cur); folMid.setColorAt(i, td.cur); folTop.setColorAt(i, td.cur);
  });
  bushes.forEach((bd, i) => { bd.cur.lerp(bd.tgt, kCol); bushMesh.setColorAt(i, bd.cur); });
  if (folLow.instanceColor) folLow.instanceColor.needsUpdate = true;
  if (folMid.instanceColor) folMid.instanceColor.needsUpdate = true;
  if (folTop.instanceColor) folTop.instanceColor.needsUpdate = true;
  if (bushMesh.instanceColor) bushMesh.instanceColor.needsUpdate = true;

  /* 风：季节基础 + 阵风抖动 + 暴雨加成 */
  gustT -= dt;
  if (gustT <= 0) { gustT = rand(1.5, 4); gust = rand(-.25, .35); }
  gust *= Math.pow(.3, dt);
  const stormK = weather.rainI * weather.heavyF;
  const windLevel = clamp(windBase + gust + stormK * .45 + weather.fogI * .05, 0, 1);
  const swayAmp = .02 + windLevel * .13;

  /* 树：三层树冠随风摇摆（树干/枝干静态，建场景时已固定） */
  trees.forEach((td, i) => {
    const swayZ = Math.sin(t * 1.4 + td.phase) * swayAmp * td.s;
    const swayX = Math.cos(t * 1.1 + td.phase) * swayAmp * td.s * .7;
    for (let k = 0; k < 3; k++) {
      const tier = TREE_TIERS[k];
      dummy.position.set(td.x, td.y + td.h * tier[0], td.z);
      dummy.rotation.set(swayX * (k + 1) * .28, td.rot, swayZ * (k + 1) * .28);
      dummy.scale.set(tier[1] * td.s * fScale, tier[2] * td.s * fScale, tier[1] * td.s * fScale);
      dummy.updateMatrix();
      (k === 0 ? folLow : k === 1 ? folMid : folTop).setMatrixAt(i, dummy.matrix);
    }
  });
  folLow.instanceMatrix.needsUpdate = true;
  folMid.instanceMatrix.needsUpdate = true;
  folTop.instanceMatrix.needsUpdate = true;

  /* 灌木随风微晃 */
  bushes.forEach((bd, i) => {
    dummy.position.set(bd.x, bd.y + bd.s * bd.squash * .6, bd.z);
    dummy.rotation.set(Math.sin(t * 1.2 + bd.phase) * swayAmp * .2, bd.phase, Math.cos(t * .9 + bd.phase) * swayAmp * .2);
    dummy.scale.set(bd.s, bd.s * bd.squash, bd.s);
    dummy.updateMatrix(); bushMesh.setMatrixAt(i, dummy.matrix);
  });
  bushMesh.instanceMatrix.needsUpdate = true;

  /* 高草丛随风摇曳（根不动梢动） */
  for (let i = 0; i < tallGrass.length; i++) {
    const g = tallGrass[i];
    const sw = Math.sin(t * 1.9 + g.ph) * (.05 + windLevel * .3);
    dummy.position.set(g.x, g.y, g.z);
    dummy.rotation.set(g.tx + sw * .6, g.ry, g.tz + sw);
    dummy.scale.set(g.w, g.h, g.w);
    dummy.updateMatrix(); tallMesh.setMatrixAt(i, dummy.matrix);
  }
  tallMesh.instanceMatrix.needsUpdate = true;

  /* 春花淡入淡出 */
  const flowerT = seasonMix.spring;
  if (Math.abs(flowerT - flowerScale) > .008) {
    flowerScale += (flowerT - flowerScale) * kCol * 2;
    for (let i = 0; i < FLOWERS; i++) {
      const f = flowerMesh; // 复用矩阵只需改缩放
      f.getMatrixAt(i, dummy.matrix);
      const e = dummy.matrix.elements;
      const x = e[12], y = e[13], z = e[14];
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(Math.max(.001, flowerScale));
      dummy.updateMatrix(); f.setMatrixAt(i, dummy.matrix);
    }
    flowerMesh.instanceMatrix.needsUpdate = true;
  }

  /* 萤火虫（夏夜） */
  fireMat.opacity = seasonMix.summer * nightF * (0.45 + .3 * Math.sin(t * 1.7));

  /* 小鸟：只在春夏的白天出没，夜晚/秋冬淡出 */
  const birdF = (seasonMix.spring + seasonMix.summer) * clamp(dayF, 0, 1);
  birdMat.opacity = clamp(birdF * 2, 0, 1);
  wingMat.opacity = birdMat.opacity;                     // 翼面材质同步淡入淡出
  birds.forEach(b => b.g.visible = birdF > .05);
  if (birdF > .05) for (const b of birds) {
    const p1 = birdPath(b, t), p2 = birdPath(b, t + .4);
    b.g.position.set(p1[0], p1[1], p1[2]);
    b.g.lookAt(_birdLook.set(p2[0], p2[1], p2[2]));      // 机头朝飞行方向（含俯仰）
    const flap = Math.sin(t * b.wa + b.wp) * .95;        // 扑翅：绕肩关节上下扇动（翼根贴身不脱节）
    b.wr.rotation.z = flap; b.wl.rotation.z = -flap;
  }

  /* 小兔子：只在春季/夏季出没，圆润跳跃（路线始终不进木屋范围） */
  const rabbitF = seasonMix.spring + seasonMix.summer;
  rabbitMat.opacity = clamp(rabbitF * 2, 0, 1);
  rabbitPinkMat.opacity = rabbitDarkMat.opacity = rabbitMat.opacity;   // 眼/鼻/耳内芯同步淡入淡出
  rabbits.forEach(rb => rb.g.visible = rabbitF > .05);
  if (rabbitF > .05) for (const rb of rabbits) {
    const p1 = rabbitPath(rb, t), p2 = rabbitPath(rb, t + .35);
    const hop = Math.pow(Math.sin(t * rb.hopF * Math.PI + rb.wp), 2);   // sin² 曲线：起跳落地都圆润
    rb.g.position.set(p1[0], groundH(p1[0], p1[2]) + hop * rb.hopA, p1[2]);
    rb.g.lookAt(_birdLook.set(p2[0], rb.g.position.y, p2[2]));          // 兔头朝跳跃方向
    rb.body.scale.y = .85 * (1.25 - .25 * hop);                          // 落地压扁、腾空舒展
    rb.e1.rotation.x = rb.e2.rotation.x = -.3 * hop;                     // 跳起时耳朵后仰
    rb.hlP.rotation.x = rb.hrP.rotation.x = .9 * hop;                    // 后腿向后蹬伸
    rb.flP.rotation.x = rb.frP.rotation.x = -.75 * hop;                  // 前腿向前伸展
  }

  /* 飞艇：偶尔缓缓驶过远山的天空，驶过后休息一段时间再来 */
  if (!airOn) {
    airTimer -= dt;
    if (airTimer <= 0) {   // 出发：随机高度/纵深/方向/速度
      airOn = true; airDir = Math.random() < .5 ? 1 : -1;
      airY = rand(42, 58); airZ = rand(55, 85) * (Math.random() < .5 ? 1 : -1);
      airSpd = rand(3, 4.5);
      airX = -airDir * 175;
      airship.rotation.y = airDir > 0 ? 0 : Math.PI;
      airship.visible = true;
    }
  } else {
    airX += airDir * airSpd * dt;
    airship.position.set(airX, airY + Math.sin(t * .5) * .6, airZ);   // 缓缓前行 + 轻微起伏
    airProp.rotation.x += dt * 16;                                     // 螺旋桨旋转
    const flash = Math.pow(.5 + .5 * Math.sin(t * 4.2), 8);            // 头部闪灯：周期性急促脉冲
    airBeaconMat.opacity = flash;
    airBeacon.scale.setScalar(1 + flash * .6);                         // 闪灯随亮度微微放大
    if (Math.abs(airX) > 175) { airOn = false; airship.visible = false; airTimer = rand(22, 50); }
  }
  if (fireMat.opacity > .02) {
    for (let i = 0; i < FIRE_N; i++) {
      const b = fireBase[i];
      firePos[i*3]   = b.x + Math.sin(t * .23 + b.ph * 2) * 1.4;
      firePos[i*3+1] = b.y + Math.sin(t * .6 + b.ph) * .7;
      firePos[i*3+2] = b.z + Math.cos(t * .19 + b.ph) * 1.4;
    }
    fireGeo.attributes.position.needsUpdate = true;
  }

  /* 落叶（秋天：大风呼啸、树叶凋零） */
  leafMesh.material.opacity = leafMesh.material.opacity || 0;
  const autumnF = seasonMix.autumn;
  leafMesh.visible = autumnF > .02;
  leafMesh.material.transparent = true;
  leafMesh.material.opacity = Math.max(leafMesh.material.opacity, autumnF);
  if (leafMesh.visible) {
    leafMesh.material.opacity += (autumnF - leafMesh.material.opacity) * kCol;
    for (let i = 0; i < LEAF_N; i++) {
      const L = leafState[i];
      if (L.rest > 0) {
        L.rest -= dt;
        if (L.rest <= 0) {                     // 重新飘回树冠
          const a = Math.random() * 6.28, r = rand(8, 58);
          L.x = Math.cos(a) * r; L.z = Math.sin(a) * r; L.y = rand(5, 13);
        }
      } else {
        L.y -= L.vy * dt * (1 + windLevel * .8);
        L.x += (Math.sin(L.ph + t * L.sp) * .8 + windLevel * 3.2) * dt;
        L.z += Math.cos(L.ph * 1.3 + t * L.sp * .8) * dt * .5;
        if (L.y < groundH(L.x, L.z) + .1) { L.y = groundH(L.x, L.z) + .1; L.rest = rand(1.5, 5); }
      }
      dummy.position.set(L.x, L.y, L.z);
      dummy.rotation.set(L.ph + t * 2.6 * L.sp, L.ph * 2 + t * 1.8 * L.sp, L.ph * .5);
      dummy.scale.setScalar(.8 + Math.sin(L.ph) * .3);
      dummy.updateMatrix(); leafMesh.setMatrixAt(i, dummy.matrix);
    }
    leafMesh.instanceMatrix.needsUpdate = true;
  }

  /* 地面枯叶：秋天最厚最艳，春夏稀疏暗淡，冬天被雪掩埋 */
  const gOp = clamp(.3 + seasonMix.autumn * .7, 0, 1) * (1 - seasonMix.winter * .8);
  gleafMat.opacity = gOp;
  gleafMesh.visible = gOp > .02;
  gleafMat.color.copy(_gLeafDull).lerp(_gLeafBright, seasonMix.autumn).lerp(_gLeafSnow, seasonMix.winter * .7);

  /* 下雪（冬天：白雪皑皑） */
  snowMat.opacity = seasonMix.winter * .95;
  if (snowMat.opacity > .02) {
    for (let i = 0; i < SNOW_N; i++) {
      snowPos[i*3+1] -= snowVel[i] * dt;
      snowPos[i*3]   += (Math.sin(t * .8 + i) * .5 + windLevel * 2) * dt;
      if (snowPos[i*3+1] < -2) {
        snowPos[i*3] = (Math.random() - .5) * 130;
        snowPos[i*3+1] = rand(40, 55);
        snowPos[i*3+2] = (Math.random() - .5) * 130;
      }
    }
    snowGeo.attributes.position.needsUpdate = true;
  }

  /* 下雨（细雨 / 暴雨，暴雨更快更密） */
  if (weather.rainI > .01) {
    const rp = rainGeo.attributes.position.array;
    const dy = lerp(20, 34, weather.heavyF) * dt;
    for (let i = 0; i < RAIN_N; i++) {
      rp[i*6+1] -= dy; rp[i*6+4] -= dy;
      rp[i*6] -= windLevel * 6 * dt; rp[i*6+3] = rp[i*6] + .14;
      if (rp[i*6+1] < -9) {
        const x = (Math.random() - .5) * 110, z = (Math.random() - .5) * 110;
        rp[i*6] = rp[i*6+3] = x; rp[i*6+2] = rp[i*6+5] = z;
        rp[i*6+1] = 44; rp[i*6+4] = 45.35;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  /* 池塘雨点水花：随雨强生成涟漪，扩散 + 淡出 */
  if (weather.rainI > .05 && seasonMix.winter < .5) {
    rippleAcc += dt * weather.rainI * lerp(10, 26, weather.heavyF);
    while (rippleAcc >= 1) { rippleAcc -= 1; spawnRipple(); }
  }
  for (let i = 0; i < RIPPLE_N; i++) {
    const r = ripples[i];
    if (r.life > 0) {
      r.t += dt;
      const k = r.t / r.life;
      if (k >= 1) { r.life = 0; r.m.visible = false; continue; }
      const s = lerp(.05, .42, Math.sqrt(k));
      r.m.scale.set(s, s, 1);
      r.mat.opacity = (1 - k) * .5;
    }
  }

  /* 闪电余辉衰减 */
  flashLight.intensity *= Math.pow(.02, dt);
  if (boltLife > 0) {
    boltLife -= dt;
    bolt.material.opacity = boltLife > 0 ? rand(.5, 1) : 0;
    if (boltLife <= 0) bolt.visible = false;
  }

  /* 彩虹生命周期（约 12 秒淡入淡出） */
  if (rainbowLife >= 0) {
    rainbowLife += dt;
    const k = rainbowLife / 12;
    rainbow.visible = k < 1;
    const op = Math.sin(Math.PI * clamp(k, 0, 1)) * .38;
    rainbow.children.forEach(m => m.material.opacity = op);
    if (k >= 1) rainbowLife = -1;
  }

  /* 木屋：夜晚亮灯 + 白天烟囱偶尔冒烟 + 冬天屋顶积雪 */
  winMat.emissiveIntensity = .1 + nightF * 2.1;
  winLight.intensity = nightF * 1.4;
  lanternMat.emissiveIntensity = .2 + nightF * 1.7;
  lanternLight.intensity = nightF * .9;
  roofSnowMat.opacity = seasonMix.winter;
  haySnowMat.opacity = seasonMix.winter; haySnow.visible = seasonMix.winter > .02;   // 草垛冬季盖雪
  const snowmanF = clamp(seasonMix.winter * 1.5, 0, 1);                              // 雪人：入冬淡入、出冬融化
  snowmanMats.forEach(m => m.opacity = snowmanF);
  snowman.visible = snowmanF > .02;
  /* 池塘：水面微波 + 冬天结冰变浅色 */
  pondWater.position.y = .06 + Math.sin(t * .9) * .012;
  pondWaterMat.color.copy(_pondBlue).lerp(_pondIce, seasonMix.winter * .85);
  pondWaterMat.roughness = lerp(.12, .55, seasonMix.winter);
  smokeTimer -= dt;
  if (smokeTimer <= 0) {
    smokeOn = smokeOn > 0 ? 0 : 1;                        // 冒烟一阵、歇一阵
    smokeTimer = smokeOn ? rand(12, 24) : rand(14, 30);
  }
  const smokeA = smokeOn * dayF;                          // 只有白天冒烟
  smokePuffs.forEach(sp => {
    sp.userData.ph += dt * .22;
    const k = (sp.userData.ph % 6) / 6;
    sp.position.set(1.35 + Math.sin(k * 7) * .4 + windLevel * k * 3.5,
                    5.1 + k * 4.2,
                    -.7 + Math.cos(k * 5) * .3);
    sp.scale.setScalar(.5 + k * 2.4);
    sp.material.opacity = smokeA * .3 * (1 - k) * Math.min(1, k * 9);
  });

  /* 云海漂移 */
  clouds.forEach(c => {
    c.position.x += (c.userData.vx + windLevel * .6) * dt;
    if (c.position.x > 130) c.position.x = -130;
  });

  /* 时钟角标 */
  clockTick += dt;
  if (clockTick > .3) {
    clockTick = 0;
    const hh = Math.floor(phase * 24), mm = Math.floor((phase * 24 % 1) * 60);
    const k = weather.kind;
    const wt = k === "lightrain" ? "小雨" : k === "heavyrain" ? "暴雨 ⚡" : k === "fog" ? "浓雾" :
               (seasonMix.winter > .5 ? "落雪" : (dayF > .5 ? "晴" : dayF > .08 ? "黄昏" : "夜"));
    const icon = k === "fog" ? "🌫️" : (weather.rainI > .3 ? "🌧️" :
                 (dayF > .5 ? "☀️" : dayF > .08 ? "🌆" : "🌙"));
    clockEl.textContent = `${icon} ${SEASON_DEF[season.target].icon} ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")} · ${wt}`;
  }

  /* 声音混音（风 / 雨 / 蝉 / 蟋蟀 / 鸟 由季节·昼夜·天气驱动） */
  AudioFX.tick(dt, {
    wind: windLevel,
    howl: seasonMix.autumn * .55 + stormK * .55,
    rain: weather.rainI, heavy: weather.heavyF,
    cicada: seasonMix.summer * dayF,
    cricket: nightF * (1 - seasonMix.winter),
    bird: (seasonMix.spring + seasonMix.summer * .6) * dayF,
  });

  /* 相机（开场拉近 + 拖拽旋转 + 闲置慢转） */
  introT = Math.min(1, introT + dt * .45);
  const ease = 1 - Math.pow(1 - introT, 3);
  ctrl.dist += (ctrl.tDist * ease + 58 * (1 - ease) - ctrl.dist) * .08;
  ctrl.idle += dt;
  if (autoRot && !dragging) ctrl.tYaw += dt * rotSpeed;
  ctrl.yaw += (ctrl.tYaw - ctrl.yaw) * .07;
  ctrl.pitch += (ctrl.tPitch - ctrl.pitch) * .07;
  camera.position.set(
    camTarget.x + ctrl.dist * Math.cos(ctrl.pitch) * Math.cos(ctrl.yaw),
    camTarget.y + ctrl.dist * Math.sin(ctrl.pitch),
    camTarget.z + ctrl.dist * Math.cos(ctrl.pitch) * Math.sin(ctrl.yaw));
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}
animate();

/* WebGL 失败兜底提示 */
try { renderer.getContext(); } catch (e) {
  document.body.innerHTML = "<div style='padding:60px;color:#8fa3c7'>当前浏览器不支持 WebGL，可直接从下方链接进入各场景。</div>";
}
</script>
</body>
</html>
