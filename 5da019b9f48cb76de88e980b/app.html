function loadData(raw) {
  try {
    if (!raw) {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
    const data = JSON.parse(raw);
    // 数据迁移/字段补全
    if (!data.completedToday) data.completedToday = {};
    if (!data.mysteryBox) data.mysteryBox = DEFAULT_DATA.mysteryBox;
    if (!data.childName) data.childName = DEFAULT_DATA.childName;
    if (!data.redemptions) data.redemptions = []; // v12 新增我的奖励
    // v13 新增：成就系统 + 智能体
    if (!data.achievements || typeof data.achievements.unlocked !== 'object') {
      data.achievements = { unlocked: {} };
    }
    if (!Array.isArray(data.weeklyReviews)) data.weeklyReviews = [];
    if (typeof data.aiKey === 'undefined') data.aiKey = '';

    // 盲盒每日次数限制
    if (typeof data.mysteryBox.dailyLimit !== 'number') data.mysteryBox.dailyLimit = 1;
    if (typeof data.mysteryBox.lastBoxDate === 'undefined') data.mysteryBox.lastBoxDate = null;

    // 礼物补全 validityDays（默认 90 天）
    if (Array.isArray(data.rewards)) {
      data.rewards = data.rewards.map((r, idx) => {
        if (typeof r.validityDays !== 'number') r.validityDays = 90;
        return r;
      });
    }

    // 补全 mysteryBox.prizes 各字段（旧数据缺 type/value/probability/icon 时补齐）
    if (Array.isArray(data.mysteryBox.prizes)) {
      data.mysteryBox.prizes = data.mysteryBox.prizes.map((p, idx) => {
        const fallback = DEFAULT_DATA.mysteryBox.prizes[idx] || {};
        // emoji icon → SVG key 映射
        let iconName = p.icon || fallback.icon || '🎁';
        const EMOJI_TO_SVG = {
          '🌟': 'sticker', '⭐': 'coupon', '✨': 'coupon', '💫': 'coupon2', '🌠': 'coupon2',
          '🎀': 'puzzle', '🏆': 'shield', '🎁': 'gift', '🎈': 'puzzle', '🎉': 'sticker',
          '💝': 'heart', '💎': 'shield', '🍀': 'puzzle', '🎯': 'shield', '🎪': 'puzzle',
          '🍬': 'sticker', '🍭': 'sticker', '🍩': 'ice', '🍪': 'ice', '🎮': 'puzzle',
          '🚗': 'trip', '⚽': 'jersey', '🎨': 'puzzle', '🎭': 'puzzle', '🎺': 'puzzle',
          '🎸': 'puzzle', '🎲': 'puzzle', '🎰': 'puzzle', '💰': 'money', '💵': 'money',
          '💴': 'money', '💶': 'money', '💷': 'money', '🪙': 'coin',
          // 用户 JSON 里出现的
          '🧳': 'trip'
        };
        if (typeof iconName === 'string' && EMOJI_TO_SVG[iconName]) {
          iconName = EMOJI_TO_SVG[iconName];
        }
        return {
          id: p.id || ('p_' + Date.now() + '_' + idx),
          name: p.name || fallback.name || '神秘奖品',
          desc: p.desc || fallback.desc || '',
          icon: iconName,
          value: typeof p.value === 'number' ? p.value : (fallback.value || 0),
          probability: typeof p.probability === 'number' ? p.probability : (fallback.probability || 0),
          type: p.type || fallback.type || 'normal'
        };
      });
    }

    // 迁移：为旧版盲盒记录补 groupId/seq（v6 之前的数据没有 groupId）
    if (Array.isArray(data.records)) {
      // 先给所有已有 groupId 的盲盒记录补 seq（防止旧 v6 数据 seq 缺失）
      data.records.forEach(r => {
        if (r.groupId && typeof r.seq !== 'number') {
          if (r.taskId === 'mystery') r.seq = 0;
          else if (r.taskId === 'mystery-result') r.seq = 1;
          else if (r.taskId === 'mystery-prize') r.seq = 2;
        }
      });
      // 为完全没有 groupId 的旧盲盒 spend/earn 记录建立分组
      data.records.forEach(r => {
        if (r.type === 'spend' && r.taskTitle === '[盲盒] 开启神秘礼盒' && !r.groupId) {
          const baseTs = r.timestamp;
          const mgid = 'mg_' + baseTs;
          r.groupId = mgid;
          r.seq = 0;
          // 关联同一窗口期的 earn 奖励记录
          data.records.forEach(x => {
            if (!x.groupId && x.type === 'earn' && x.taskTitle.includes('[盲盒奖励]') &&
                x.timestamp >= baseTs && x.timestamp < baseTs + 5000) {
              x.groupId = mgid;
              x.seq = 2;
            }
          });
        }
      });
    }

    return data;
  } catch (e) {
    throw new Error('应用数据格式错误');
  }
}

let state = JSON.parse(JSON.stringify(DEFAULT_DATA));
let revision = 0;
let saveQueue = Promise.resolve();
let storageFailed = false;
function storageError(message) {
  storageFailed = true;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff9;display:grid;place-items:center;padding:24px';
  const panel = document.createElement('div');
  panel.style.cssText = 'background:white;padding:24px;border-radius:16px;max-width:420px;box-shadow:0 4px 20px #0003';
  panel.textContent = message + ' 请保留当前页面并重新打开应用核对数据。';
  overlay.appendChild(panel); document.body.appendChild(overlay);
}
function saveData(data) {
  if (storageFailed) return;
  const payload = JSON.stringify(data);
  saveQueue = saveQueue.then(async () => {
    if (storageFailed) return;
    const previous = revision;
    try {
      const result = await sql('UPDATE points_state SET document=?, revision=revision+1 WHERE id=1 AND revision=?', [payload, previous]);
      if (result.affected !== 1) throw new Error('数据已在其他会话更新');
      revision++;
    } catch (error) {
      // 结果未知时只读核对，不重放写入。
      try {
        const row = (await sql('SELECT document, revision FROM points_state WHERE id=1')).rows[0];
        if (row && Number(row.revision) === previous + 1 && row.document === payload) { revision++; return; }
      } catch (_) {}
      storageError('保存未确认或数据已在其他会话更新。');
      throw error;
    }
  }).catch(() => {});
}

function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDayStart(timestamp) {
  const d = new Date(timestamp);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function getWeekStart(date) {
  // 周一为一周开始。传入 Date 或时间戳
  const d = new Date(date);
  const dow = d.getDay(); // 0=Sun
  const diff = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function getMonthStart(date) {
  const d = new Date(date);
  d.setDate(1);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function isSameDay(ts1, ts2) {
  return getDayStart(ts1) === getDayStart(ts2);
}

function isThisWeek(ts) {
  return getWeekStart(ts) === getWeekStart(Date.now());
}

function isThisMonth(ts) {
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function getTodayDayOfWeek() {
  // 0=周日, 1=周一, ..., 6=周六 → 映射到 1-7（周一=1, 周日=7）
  const d = new Date().getDay();
  return d === 0 ? 7 : d;
}

function getTodayTasks() {
  const dow = getTodayDayOfWeek();
  const today = getTodayStr();
  const completed = state.completedToday[today] || {};
  return {
    earn: state.tasks.filter(t => t.active && t.type === 'earn' && t.days.includes(dow)),
    bad: state.tasks.filter(t => t.active && t.type === 'bad' && t.days.includes(dow)),
    completed
  };
}

function getTodayCompletedCount() {
  const today = getTodayStr();
  const completed = state.completedToday[today] || {};
  return Object.keys(completed).length;
}

function getTodayEarnedPoints() {
  const today = getTodayStr();
  const completed = state.completedToday[today] || {};
  let total = 0;
  for (const tid in completed) {
    const task = state.tasks.find(t => t.id === tid);
    if (task && task.type === 'earn') total += task.points;
  }
  return total;
}

function formatRelativeTime(ts) {
  const now = Date.now();
  const diff = now - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + ' 天前';
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

// ====== 成就系统：定义与判定 ======
function getDateStr(timestamp) {
  const d = new Date(timestamp);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 累计获得积分（含盲盒奖励，不含扣分/消耗/撤销）
function totalEarned(s) {
  return (s.records || []).filter(r => r.type === 'earn')
    .reduce((sum, r) => sum + (r.points || 0), 0);
}
// 累计完成任务次数（排除盲盒奖励）
function totalTaskCompletions(s) {
  return (s.records || []).filter(r => r.type === 'earn' && r.taskId !== 'mystery-prize').length;
}
// 连续完成天数（每天至少完成 1 个 earn 任务）
function computeStreak(s) {
  const days = new Set();
  (s.records || []).forEach(r => {
    if (r.type === 'earn' && r.taskId !== 'mystery-prize') days.add(getDateStr(r.timestamp));
  });
  let streak = 0;
  const d = new Date();
  if (!days.has(getDateStr(d.getTime()))) d.setDate(d.getDate() - 1);
  while (days.has(getDateStr(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
// 本周是否零扣分（且本周有完成记录）——口径与「本周点评」周期对齐：最近一个周日 20:00 往前推 7 天
function zeroBadThisWeek(s) {
  const periodEnd = getLatestSunday8pm();
  const periodStart = periodEnd - 7 * 86400000;
  const weekRecords = (s.records || []).filter(r => r.timestamp >= periodStart && r.timestamp < periodEnd);
  const hasEarn = weekRecords.some(r => r.type === 'earn' && r.taskId !== 'mystery-prize');
  const hasBad = weekRecords.some(r => r.type === 'bad');
  return hasEarn && !hasBad;
}
// 起床类任务连续完成天数
function earlyBirdStreak(s) {
  const wakeIds = (s.tasks || []).filter(t => t.icon === 'wakeup' || (t.title || '').includes('起床')).map(t => t.id);
  if (wakeIds.length === 0) return 0;
  const days = new Set();
  (s.records || []).forEach(r => {
    if (r.type === 'earn' && wakeIds.includes(r.taskId)) days.add(getDateStr(r.timestamp));
  });
  let streak = 0;
  const d = new Date();
  if (!days.has(getDateStr(d.getTime()))) d.setDate(d.getDate() - 1);
  while (days.has(getDateStr(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function redeemCount(s) {
  return (s.records || []).filter(r => r.taskId === 'redeem').length;
}
function boxCount(s) {
  return (s.records || []).filter(r => r.taskId === 'mystery').length;
}
function hasHidden(s, type) {
  return (s.records || []).some(r =>
    r.type === 'info' && r.taskId === 'mystery-result' &&
    r.meta && r.meta.prizeType === type
  );
}
function latestReview(s) {
  const arr = (s.weeklyReviews || []);
  return arr.length ? arr[arr.length - 1] : null;
}

    `;
  }

  if (filtered.length === 0) {
    return `
      ${renderOverviewCard()}
      ${tabsHtml}
      <div class="empty-state">
        <div class="title">该分类下没有奖励</div>
      </div>
    `;
  }

  const listHtml = filtered.map(r => renderRewardCard(r)).join('');

  return `
    ${renderOverviewCard()}
    ${tabsHtml}
    <div>${listHtml}</div>
  `;
}

function renderRewardCard(r) {
  // 渲染图标
  let iconHtml;
  const iconRaw = r.icon || 'gift';
  if (ICONS[iconRaw]) {
    iconHtml = getIcon(iconRaw, 32);
  } else {
    // emoji 直接显示
    iconHtml = `<span style="font-size:32px;line-height:1;">${iconRaw}</span>`;
  }

  // 状态徽章
  let statusBadge = '';
  if (r.status === 'active') statusBadge = '<span class="status-badge active">未核销</span>';
  else if (r.status === 'redeemed') statusBadge = '<span class="status-badge redeemed">已核销</span>';
  else if (r.status === 'expired') statusBadge = '<span class="status-badge expired">已过期</span>';

  // 剩余天数 / 过期提示
  const now = Date.now();
  let validityText = '';
  let validityClass = '';
  if (r.status === 'active' && r.expiresAt) {
    const days = Math.ceil((r.expiresAt - now) / 86400000);
    if (days > 0) {
      validityText = `⏰ 剩 ${days} 天有效期`;
      validityClass = days <= 7 ? 'expiring' : '';
    }
  } else if (r.status === 'redeemed' && r.usedAt) {
    validityText = `✅ ${formatRelativeTime(r.usedAt)} 核销`;
  } else if (r.status === 'expired') {
    validityText = '⌛ 已过期';
    validityClass = 'expired';
  }

  // 来源标签
  const typeLabel = r.type === 'mystery-prize' ? '🎲 盲盒奖励' : '🎁 礼物兑换';

  // 卡片状态 class
  const cardClass = r.type === 'mystery-prize' ? 'mystery' : '';
  const stateClass = r.status === 'redeemed' ? 'redeemed' : (r.status === 'expired' ? 'expired' : '');

  // 操作按钮
  let actionHtml = '';
  if (r.status === 'active') {
    actionHtml = `<button class="btn-redeem" data-action="redeem-reward" data-redemption-id="${r.id}">✓ 核销</button>`;
  } else if (r.status === 'redeemed') {
    actionHtml = `<button class="btn-unredeeem" data-action="unredeem-reward" data-redemption-id="${r.id}">↺ 撤销</button>`;
  }

  return `
    <div class="reward-card-large ${cardClass} ${stateClass}">
      <div class="reward-card-large-head">
        <div class="reward-card-icon">${iconHtml}</div>
        <div class="reward-card-info">
          <div class="reward-card-title">${r.title || '神秘奖励'}<span class="reward-card-type">${typeLabel}</span></div>
          <div class="reward-card-meta">
            ${r.cost ? `消耗 ${r.cost} 分` : ''} · ${statusBadge}
            <br/>${formatRelativeTime(r.createdAt || Date.now())}
          </div>
        </div>
      </div>
      <div class="reward-card-bottom">
        <div class="reward-card-validity ${validityClass}">${validityText}</div>
        <div class="reward-card-actions">${actionHtml}</div>
      </div>
    </div>
  `;
}

// 核销
function doRedeem(redemptionId) {
  const r = state.redemptions.find(x => x.id === redemptionId);
  if (!r) return;
  if (r.status !== 'active') {
    showToast('该奖励已不可核销');
    return;
  }
  if (r.expiresAt && r.expiresAt < Date.now()) {
    showToast('已过期，无法核销');
    return;
  }
  if (!confirm(`确认核销「${r.title}」？核销后无法撤销积分。`)) return;
  r.status = 'redeemed';
  r.usedAt = Date.now();
  saveData(state);
  refreshAll();
  showToast('已核销：' + r.title);
}

// 撤销核销（仅家长模式可用）
function doUnredeem(redemptionId) {
  if (!isParentMode) {
    showToast('撤销核销需要家长密码');
    return;
  }
  const r = state.redemptions.find(x => x.id === redemptionId);
  if (!r) return;
  if (r.status !== 'redeemed') return;
  if (!confirm(`确认撤销「${r.title}」的核销状态？`)) return;
  r.status = 'active';
  r.usedAt = null;
  saveData(state);
  refreshAll();
  showToast('已撤销核销');
}

function renderRecords() {
  const sorted = sortRecordsForDisplay(state.records);

  // Tab 切换器
  const tabsHtml = `
    <div class="records-tabs">
      <button class="tab ${recordsViewTab === 'day' ? 'active' : ''}" data-action="records-tab" data-tab="day">📅 日</button>
      <button class="tab ${recordsViewTab === 'week' ? 'active' : ''}" data-action="records-tab" data-tab="week">📊 周</button>
      <button class="tab ${recordsViewTab === 'month' ? 'active' : ''}" data-action="records-tab" data-tab="month">📈 月</button>
    </div>
  `;

  // 期间导航栏（周/月）
  const navHtml = renderPeriodNav();

  if (sorted.length === 0) {
    return `
      ${renderOverviewCard()}
      ${tabsHtml}
      <div class="empty-state">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#FFD54F" stroke-width="2"/>
          <path d="M12 7v5l3 3" stroke="#FFA726" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="title">还没有记录</div>
        <div>完成第一个任务吧！</div>
      </div>
    `;
  }

  let viewHtml = '';
  if (recordsViewTab === 'day') viewHtml = renderRecordsByDay(sorted);
  else if (recordsViewTab === 'week') viewHtml = renderRecordsByWeek(sorted);
  else viewHtml = renderRecordsByMonth(sorted);

  return `
    ${renderOverviewCard()}
    ${tabsHtml}
    ${navHtml}
    ${viewHtml}
  `;
}

function renderPeriodNav() {
  // 日视图不需要导航（直接显示最近 7 天）
  if (recordsViewTab === 'day') return '';
  const now = new Date();
  let label = '';
  let sub = '';
  let canNext = false;

  if (recordsViewTab === 'week') {
    const weekStart = getWeekStart(now);
    const targetStart = weekStart + recordsOffset * 7 * 86400000;
    const targetEnd = targetStart + 6 * 86400000;
    const startD = new Date(targetStart);
    const endD = new Date(targetEnd);
    label = `${startD.getMonth() + 1}月${startD.getDate()}日 - ${endD.getMonth() + 1}月${endD.getDate()}日`;
    sub = recordsOffset === 0 ? '本周' : (recordsOffset === -1 ? '上一周' : (recordsOffset === 1 ? '下一周' : `${recordsOffset >= 0 ? '+' : ''}${recordsOffset} 周`));
    canNext = recordsOffset < 0; // 只有在过去时才允许向前翻到未来（实际上数据极少，无意义）
    canNext = true; // 暂允许自由翻页
  } else {
    // 月视图
    const monthStart = getMonthStart(now);
    const targetDate = new Date(monthStart);
    targetDate.setMonth(targetDate.getMonth() + recordsOffset);
    label = `${targetDate.getFullYear()}年${targetDate.getMonth() + 1}月`;
    sub = recordsOffset === 0 ? '本月' : (recordsOffset === -1 ? '上一月' : (recordsOffset === 1 ? '下一月' : `${recordsOffset >= 0 ? '+' : ''}${recordsOffset} 月`));
  }

  return `
    <div class="records-nav">
      <button class="records-nav-btn" data-action="records-period-nav" data-dir="-1" title="上一段">‹</button>
      <div class="records-period-label">
        ${label}
        <span class="sub">${sub} ${recordsOffset === 0 ? '· 当前' : ''}</span>
      </div>
      ${recordsOffset === 0
        ? `<button class="records-nav-btn" disabled title="已是当前">·</button>`
        : `<button class="records-nav-btn" data-action="records-period-nav" data-dir="0" title="回到当前">⌂</button>`}
    </div>
  `;
}

function renderRecordsByDay(sorted) {
  // 按天分组，最多显示最近 7 天
  const dayGroups = {};
  // 过滤掉 info 类型（盲盒结果详情，避免与 spend/earn 重复展示）
  sorted.filter(r => r.type !== 'info').forEach(r => {
    const dayKey = getDayStart(r.timestamp);
    if (!dayGroups[dayKey]) dayGroups[dayKey] = [];
    dayGroups[dayKey].push(r);
  });
  const dayKeys = Object.keys(dayGroups).map(Number).sort((a, b) => b - a).slice(0, 7);
  const todayStart = getDayStart(Date.now());

  let html = '';
  dayKeys.forEach(dayStart => {
    const records = dayGroups[dayStart];
    const d = new Date(dayStart);
    const isToday = dayStart === todayStart;
    const dateLabel = isToday
      ? `今天 · ${d.getMonth() + 1}月${d.getDate()}日`
      : `${d.getMonth() + 1}月${d.getDate()}日`;
    const earn = records.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);
    const bad = records.filter(r => r.type === 'bad' || r.type === 'spend').reduce((s, r) => s + r.points, 0);

    const recordsHtml = records.map(r => `
      <div class="record-item">
        <div class="record-dot ${r.type === 'bad' || r.type === 'spend' ? 'neg' : ''}">${r.type === 'bad' || r.type === 'spend' ? '−' : '+'}</div>
        <div class="record-info">
          <div class="record-title">${r.taskTitle}</div>
          <div class="record-time">${formatRelativeTime(r.timestamp)}</div>
        </div>
        <div class="record-points ${r.type === 'bad' || r.type === 'spend' ? 'neg' : ''}">${r.type === 'bad' || r.type === 'spend' ? '-' : '+'}${r.points}</div>
      </div>
    `).join('');

    html += `
      <div class="section-title" style="margin-top: 16px;">
        <h2>${dateLabel}</h2>
        <span class="hint">+${earn} / −${bad}</span>
      </div>
      <div class="record-list">${recordsHtml}</div>
    `;
  });

  return html;
}

function renderRecordsByWeek(sorted) {
  const now = new Date();
  const currentWeekStart = getWeekStart(now);
  const weekStart = currentWeekStart + recordsOffset * 7 * 86400000;
  const weekEnd = weekStart + 7 * 86400000;
  // 过滤掉 info 类型（盲盒结果详情），spend 也参与积分统计
  const weekRecords = sorted.filter(r => r.timestamp >= weekStart && r.timestamp < weekEnd && r.type !== 'info');
  const todayStart = getDayStart(Date.now());

  // 按天分组
  const dayGroups = {};
  weekRecords.forEach(r => {
    const dayKey = getDayStart(r.timestamp);
    if (!dayGroups[dayKey]) dayGroups[dayKey] = { earn: 0, bad: 0 };
    if (r.type === 'earn') dayGroups[dayKey].earn += r.points;
    if (r.type === 'bad' || r.type === 'spend') dayGroups[dayKey].bad += r.points;
  });

  // 7 天，每天一行
  const dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const startD = new Date(weekStart);
  const endD = new Date(weekEnd - 86400000);
  const periodLabel = recordsOffset === 0
    ? '本周积分（周一至周日）'
    : `${startD.getMonth() + 1}月${startD.getDate()}日 - ${endD.getMonth() + 1}月${endD.getDate()}日`;
  let html = `<div class="section-title"><h2>📊 ${periodLabel}</h2></div>`;

  let totalEarn = 0, totalBad = 0;
  for (let i = 0; i < 7; i++) {
    const dayStart = weekStart + i * 86400000;
    const d = new Date(dayStart);
    const stat = dayGroups[dayStart] || { earn: 0, bad: 0 };
    totalEarn += stat.earn;
    totalBad += stat.bad;
    const isToday = dayStart === todayStart;
    const net = stat.earn - stat.bad;

    html += `
      <div class="summary-row ${isToday ? 'today' : ''}">
        <div class="day-label">${dayNames[i]} · ${d.getMonth() + 1}/${d.getDate()}${isToday ? '<span class="today-tag">今天</span>' : ''}</div>
        <div class="day-stats">
          <span class="earn-stat">+${stat.earn}</span>
          <span class="bad-stat">−${stat.bad}</span>
          <span class="net-stat">净 ${net >= 0 ? '+' : ''}${net}</span>
        </div>
      </div>
    `;
  }

  const totalNet = totalEarn - totalBad;
  html += `
    <div class="summary-total">
      <span class="lbl">本周总计</span>
      <span class="nums"><span class="earn-stat">+${totalEarn}</span> <span class="bad-stat">−${totalBad}</span> = <span class="net-stat">${totalNet >= 0 ? '+' : ''}${totalNet}</span></span>
    </div>
  `;

  // 显示本周每天的详细记录
  const dayKeys = Object.keys(dayGroups).map(Number).sort((a, b) => b - a);
  if (dayKeys.length > 0) {
    html += `<div class="summary-period">↓ 本周详细记录</div>`;
    dayKeys.forEach(dayStart => {
      const dayRecords = weekRecords.filter(r => getDayStart(r.timestamp) === dayStart);
      const d = new Date(dayStart);
      const isToday = dayStart === todayStart;
      const dateLabel = isToday ? `今天 · ${d.getMonth() + 1}月${d.getDate()}日` : `${d.getMonth() + 1}月${d.getDate()}日`;
      const earn = dayRecords.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);
      const bad = dayRecords.filter(r => r.type === 'bad').reduce((s, r) => s + r.points, 0);
      const recordsHtml = dayRecords.map(r => `
        <div class="record-item">
          <div class="record-dot ${r.type === 'bad' || r.type === 'spend' ? 'neg' : ''}">${r.type === 'bad' || r.type === 'spend' ? '−' : '+'}</div>
          <div class="record-info">
            <div class="record-title">${r.taskTitle}</div>
            <div class="record-time">${formatRelativeTime(r.timestamp)}</div>
          </div>
          <div class="record-points ${r.type === 'bad' || r.type === 'spend' ? 'neg' : ''}">${r.type === 'bad' || r.type === 'spend' ? '-' : '+'}${r.points}</div>
        </div>
      `).join('');
      html += `
        <div class="section-title" style="margin-top: 16px;">
          <h2>${dateLabel}</h2>
          <span class="hint">+${earn} / −${bad}</span>
        </div>
        <div class="record-list">${recordsHtml}</div>
      `;
    });
  }

  return html;
}

function renderRecordsByMonth(sorted) {
  const now = new Date();
  const currentMonthStart = getMonthStart(now);
  const monthStart = new Date(currentMonthStart);
  monthStart.setMonth(monthStart.getMonth() + recordsOffset);
  const monthStartTs = monthStart.getTime();
  const nextMonth = new Date(monthStartTs);
  nextMonth.setMonth(nextMonth.getMonth() + 1);
  const monthEnd = nextMonth.getTime();
  // 过滤掉 info 类型（盲盒结果详情）
  const monthRecords = sorted.filter(r => r.timestamp >= monthStartTs && r.timestamp < monthEnd && r.type !== 'info');

  // 按周分组
  const weekGroups = {};
  monthRecords.forEach(r => {
    const ws = getWeekStart(r.timestamp);
    if (!weekGroups[ws]) weekGroups[ws] = [];
    weekGroups[ws].push(r);
  });

  // 按周次排序
  const weekStarts = Object.keys(weekGroups).map(Number).sort((a, b) => a - b);
  const todayStart = getDayStart(Date.now());
  const monthName = `${monthStart.getFullYear()}年${monthStart.getMonth() + 1}月`;

  let html = `<div class="section-title"><h2>📈 ${monthName}积分（按周汇总）</h2></div>`;

  let totalEarn = 0, totalBad = 0;
  let weekNum = 1;

  // 列出本月所有周（包括没有记录的周）
  let currentWeek = getWeekStart(monthStartTs);
  const allWeeks = [];
  while (currentWeek < monthEnd) {
    allWeeks.push(currentWeek);
    currentWeek += 7 * 86400000;
  }

  allWeeks.forEach(weekStart => {
    const records = weekGroups[weekStart] || [];
    const earn = records.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);
    const bad = records.filter(r => r.type === 'bad' || r.type === 'spend').reduce((s, r) => s + r.points, 0);
    totalEarn += earn;
    totalBad += bad;
    const net = earn - bad;
    const startD = new Date(weekStart);
    const endD = new Date(weekStart + 6 * 86400000);
    const isCurrentWeek = getWeekStart(Date.now()) === weekStart;

    html += `
      <div class="summary-row ${isCurrentWeek ? 'today' : ''}">
        <div class="day-label">第 ${weekNum} 周 · ${startD.getMonth() + 1}/${startD.getDate()} - ${endD.getMonth() + 1}/${endD.getDate()}${isCurrentWeek ? '<span class="today-tag">本周</span>' : ''}</div>
        <div class="day-stats">
          <span class="earn-stat">+${earn}</span>
          <span class="bad-stat">−${bad}</span>
          <span class="net-stat">净 ${net >= 0 ? '+' : ''}${net}</span>
        </div>
      </div>
    `;
    weekNum++;
  });

  const totalNet = totalEarn - totalBad;
  html += `
    <div class="summary-total">
      <span class="lbl">本月总计</span>
      <span class="nums"><span class="earn-stat">+${totalEarn}</span> <span class="bad-stat">−${totalBad}</span> = <span class="net-stat">${totalNet >= 0 ? '+' : ''}${totalNet}</span></span>
    </div>
  `;

  // 显示本月各周的详细记录
  if (weekStarts.length > 0) {
    html += `<div class="summary-period">↓ 本月详细记录</div>`;
    weekStarts.forEach((weekStart, idx) => {
      const records = weekGroups[weekStart];
      const startD = new Date(weekStart);
      const endD = new Date(weekStart + 6 * 86400000);
      const isCurrentWeek = getWeekStart(Date.now()) === weekStart;
      const earn = records.filter(r => r.type === 'earn').reduce((s, r) => s + r.points, 0);
      const bad = records.filter(r => r.type === 'bad' || r.type === 'spend').reduce((s, r) => s + r.points, 0);
      const recordsHtml = records.map(r => `
        <div class="record-item">
          <div class="record-dot ${r.type === 'bad' || r.type === 'spend' ? 'neg' : ''}">${r.type === 'bad' || r.type === 'spend' ? '−' : '+'}</div>
          <div class="record-info">
            <div class="record-title">${r.taskTitle}</div>
            <div class="record-time">${formatRelativeTime(r.timestamp)}</div>
          </div>
          <div class="record-points ${r.type === 'bad' || r.type === 'spend' ? 'neg' : ''}">${r.type === 'bad' || r.type === 'spend' ? '-' : '+'}${r.points}</div>
        </div>
      `).join('');
      html += `
        <div class="section-title" style="margin-top: 16px;">
          <h2>第 ${idx + 1} 周 · ${startD.getMonth() + 1}/${startD.getDate()} - ${endD.getMonth() + 1}/${endD.getDate()}${isCurrentWeek ? '（本周）' : ''}</h2>
          <span class="hint">+${earn} / −${bad}</span>
        </div>
        <div class="record-list">${recordsHtml}</div>
      `;
    });
  }

  return html;
}

  const fmt = d => `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${fmt(s)} - ${fmt(e)}`;
}

function renderAchievements() {
  const unlocked = state.achievements.unlocked || {};
  const unlockedCount = ACHIEVEMENTS.filter(a => unlocked[a.id]).length;
  const total = ACHIEVEMENTS.length;
  const cats = ['累计', '习惯', '行为', '点评'];
  const catLabels = { '累计': '🏅 累计成就', '习惯': '🔥 习惯养成', '行为': '🎉 精彩瞬间', '点评': '🤖 每周点评' };

  let gridHtml = '';
  for (const cat of cats) {
    const items = ACHIEVEMENTS.filter(a => a.cat === cat);
    const done = items.filter(a => unlocked[a.id]).length;
    gridHtml += `<div class="achievement-cat">${catLabels[cat]}（${done}/${items.length}）</div>`;
    gridHtml += `<div class="achievement-grid">` + items.map(a => {
      const isUnlocked = !!unlocked[a.id];
      return `
        <div class="achievement-item ${isUnlocked ? '' : 'locked'}">
          <div class="a-icon">${a.emoji}</div>
          <div class="a-name">${a.name}</div>
          <div class="a-desc">${a.desc}</div>
          ${isUnlocked ? '<div class="a-done">✓ 已达成</div>' : ''}
        </div>`;
    }).join('') + `</div>`;
  }

  return `
    <div class="section-title"><h2>🏆 我的成就</h2></div>
    <div class="achievement-progress-card">
      <div class="achievement-progress-ring"><span class="num">${unlockedCount}/${total}</span></div>

// ====== 成就判定与解锁 ======
function checkAchievements(mode) {
  // mode: 'show'（默认，立即弹窗）| 'defer'（延后弹窗）| 'silent'（仅解锁不弹窗）
  const unlocked = state.achievements.unlocked || (state.achievements.unlocked = {});
  const newly = [];
  for (const a of ACHIEVEMENTS) {
    if (unlocked[a.id]) continue;
    let ok = false;
    try { ok = a.cond(state); } catch (e) { ok = false; }
    if (ok) { unlocked[a.id] = Date.now(); newly.push(a); }
  }
  if (newly.length > 0) {
    saveData(state);
    if (mode === 'defer') {
      pendingAchievementUnlocks = pendingAchievementUnlocks.concat(newly);
    } else if (mode !== 'silent') {
      showAchievementUnlock(newly);
    }
  }
  return newly;
}

function showAchievementUnlock(list) {
  if (!list || list.length === 0) return;
  const badgesHtml = list.map(a => `
    <div class="achievement-unlock-badge">
      <div class="b-icon">${a.emoji}</div>
      <div class="b-name">${a.name}</div>
      <div class="b-desc">${a.desc}</div>
    </div>
  `).join('');
  showModal(`
    <div class="achievement-unlock">
      <div class="unlock-label">🎖 达成新成就！</div>
      <div class="achievement-unlock-badges">${badgesHtml}</div>
      <button class="btn btn-primary" style="margin-top:16px; width:100%;" data-close-action="refresh">太棒了！</button>
    </div>
  `, { noMaskClose: true });
  spawnConfetti();
}

function flushPendingAchievements() {
  if (pendingAchievementUnlocks.length > 0) {
    const list = pendingAchievementUnlocks;
    pendingAchievementUnlocks = [];
    showAchievementUnlock(list);
  }
}

// ====== 智能体 · 每周点评 ======
function getLatestSunday8pm() {
  const now = new Date();
  const d = new Date(now);
  const daysUntilSunday = (7 - d.getDay()) % 7;
  d.setDate(d.getDate() + daysUntilSunday);
  d.setHours(20, 0, 0, 0);
  if (d.getTime() > now.getTime()) d.setDate(d.getDate() - 7);
  return d.getTime();
}

function computeWeeklyMetrics(s, periodStart, periodEnd) {
  const records = (s.records || []).filter(r => r.timestamp >= periodStart && r.timestamp < periodEnd);
  const earned = records.filter(r => r.type === 'earn' && r.taskId !== 'mystery-prize');
  const bads = records.filter(r => r.type === 'bad');
  let should = 0;
  const startDate = new Date(periodStart);
  for (const t of (s.tasks || [])) {
    if (t.type !== 'earn' || t.active === false) continue;
    const days = (t.days && t.days.length) ? t.days : [1, 2, 3, 4, 5, 6, 7];
    for (let i = 0; i < 7; i++) {
      const dd = new Date(startDate.getTime() + i * 86400000);
      const dow = dd.getDay() === 0 ? 7 : dd.getDay();
      if (days.includes(dow)) should++;
    }
  }
  const completionRate = should > 0 ? Math.min(1, earned.length / should) : (earned.length > 0 ? 1 : 0);
  const earnedPoints = earned.reduce((sum, r) => sum + (r.points || 0), 0);
  const badTaskMap = {};
  bads.forEach(r => { badTaskMap[r.taskTitle] = (badTaskMap[r.taskTitle] || 0) + 1; });
  const topBad = Object.entries(badTaskMap).sort((a, b) => b[1] - a[1])[0] || null;
  return {
    earnedCount: earned.length,
    shouldCount: should,
    completionRate,
    badCount: bads.length,
    zeroBad: bads.length === 0,
    earnedPoints,
    topBad
  };
}

function computeRating(m) {
  if (m.completionRate >= 0.9 && m.badCount === 0) return 'S';
  if (m.completionRate >= 0.75 && m.badCount <= 1) return 'A';
  if (m.completionRate >= 0.5) return 'B';
  return 'C';
}

function isImproved(s, periodStart, periodEnd) {
  const prevStart = periodStart - 7 * 86400000;
  const cur = computeWeeklyMetrics(s, periodStart, periodEnd);
  const prev = computeWeeklyMetrics(s, prevStart, periodStart);
  return cur.earnedPoints > prev.earnedPoints || cur.completionRate > prev.completionRate + 0.05;
}

async function generateWeeklyReview(sunday8pm, force) {
  const periodEnd = sunday8pm;
  const periodStart = sunday8pm - 7 * 86400000;
  const m = computeWeeklyMetrics(state, periodStart, periodEnd);
  m.improved = isImproved(state, periodStart, periodEnd);
  const rating = computeRating(m);
  const childName = state.childName || '小朋友';

  const comment = buildLocalComment(childName, m, rating);

  const review = {
    id: 'wr_' + sunday8pm,
    weekStart: periodStart,
    weekEnd: periodEnd,
    createdAt: Date.now(),
    rating,
    comment,
    metrics: m
  };
  const last = latestReview(state);
  if (force && last && last.weekStart === periodStart) {
    state.weeklyReviews[state.weeklyReviews.length - 1] = review;
  } else {
    state.weeklyReviews.push(review);
  }
  saveData(state);

  // 解锁点评型成就（defer，等点评弹窗关闭后再展示成就弹窗）
  checkAchievements('defer');

  showWeeklyReviewModal(review);
  refreshAll();
  return review;
}

function showWeeklyReviewModal(review) {
  const m = review.metrics || {};
  const weekLabel = formatWeekLabel(review.weekStart);
  showModal(`
    <div class="achievement-unlock" style="text-align:left;">
      <div class="unlock-label" style="text-align:center;">🤖 本周点评来啦</div>
      <div class="weekly-review-head">
        <div class="review-rating ${review.rating}">${review.rating}</div>
        <div class="review-head-text">
          <div class="r-title">${review.rating} 级 · 本周表现</div>
          <div class="r-week">${weekLabel}</div>
        </div>
      </div>
      <div class="review-comment">${review.comment || ''}</div>
      <div class="review-metrics">
        <span class="review-metric">完成率 <strong>${Math.round((m.completionRate || 0) * 100)}%</strong></span>
        <span class="review-metric">完成 <strong>${m.earnedCount || 0}</strong> 项</span>
        <span class="review-metric">获得 <strong>+${m.earnedPoints || 0}</strong> 分</span>
        <span class="review-metric">扣分 <strong>${m.badCount || 0}</strong> 次</span>
      </div>
      <button class="btn btn-primary" style="margin-top:18px; width:100%;" data-close-action="refresh">收下点评</button>
    </div>
  `, { noMaskClose: true });
  spawnConfetti();
}

function buildLocalComment(childName, m, rating) {
  const rate = Math.round(m.completionRate * 100);
  const praise = { S: '这一周你表现得超级棒！', A: '这一周你表现得很不错！', B: '这一周你有进步，继续加油！', C: '这一周我们可以再努力一点点哦。' }[rating] || '这一周你辛苦了！';
  let badPart = '';
  if (m.badCount > 0 && m.topBad) {
    badPart = ` 如果能在「${m.topBad[0]}」上再注意一点点，就更完美啦。`;
  } else if (m.zeroBad) {
    badPart = ' 而且这一整周你都没有被扣分，太厉害了！';
  }
  return `${childName}，${praise}你完成了 ${m.earnedCount} 个任务，完成率 ${rate}%，赚到了 +${m.earnedPoints} 分。${badPart} 继续保持，爸爸妈妈为你骄傲！`;
}

function checkWeeklyReview() {
  const now = Date.now();
  const sunday8pm = getLatestSunday8pm();
  if (now < sunday8pm) return;
  const periodStart = sunday8pm - 7 * 86400000;
  const last = latestReview(state);
  if (last && last.weekStart === periodStart) return; // 本周期已点评
  const hasData = (state.records || []).some(r => r.timestamp >= periodStart && r.timestamp < sunday8pm);
  if (!hasData) return;
  generateWeeklyReview(sunday8pm, false);
}

  renderTopPoints();
  const main = document.getElementById('mainContainer');
  if (!main) return;
  let html = '';
  switch (currentTab) {
    case 'today': html = renderTaskList(); break;
    case 'shop': html = renderShop(); break;
    case 'rewards': html = renderMyRewards(); break;
    case 'achievements': html = renderAchievements(); break;
    case 'records': html = renderRecords(); break;
    case 'parent': html = renderParentPanel(); break;
  }
  main.innerHTML = DOMPurify.sanitize(html);
  // 更新 Tab 高亮
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === currentTab);
  });
  // 更新模式按钮文字
  const modeBtn = document.getElementById('modeSwitchBtn');
  if (modeBtn) {
    modeBtn.textContent = isParentMode ? '孩子' : '家长';
    modeBtn.classList.toggle('parent-mode', isParentMode);
  }
  // 家长中心：初始化任务/礼物/盲盒奖品拖拽排序
  if (currentTab === 'parent' && isParentMode) {
    setupTaskDragSort();
    setupRewardDragSort();
    setupPrizeDragSort();
  }
}

// ====== 事件处理：完成任务（含动画） ======
function completeTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.active) return;

  const today = getTodayStr();
  if (!state.completedToday[today]) state.completedToday[today] = {};

  // 切换完成状态：已完成→撤销
  if (state.completedToday[today][taskId]) {
    // 撤销
    delete state.completedToday[today][taskId];
    state.totalPoints -= (task.type === 'earn' ? task.points : -task.points);
    state.records.push({
      id: 'rd_' + Date.now(),
      timestamp: Date.now(),
      taskId: task.id,
      taskTitle: '[撤销] ' + task.title,
      points: task.points,
      type: 'undo-' + task.type
    });
    showToast('已撤销：' + task.title);
    saveData(state);
    refreshAll();
    return;
  }

  // 完成
  state.completedToday[today][taskId] = Date.now();
  const pointsDelta = task.type === 'earn' ? task.points : -task.points;
  state.totalPoints += pointsDelta;
  state.records.push({
    id: 'rd_' + Date.now(),
    timestamp: Date.now(),
    taskId: task.id,
    taskTitle: task.title,
    points: task.points,
    type: task.type
  });

  // 触发动画
  const btn = document.querySelector(`[data-task-id="${taskId}"] .task-check`);
  if (btn) {
    const rect = btn.getBoundingClientRect();
    const startX = rect.left + rect.width / 2 - 20;
    const startY = rect.top + rect.height / 2 - 20;
    const targetX = window.innerWidth / 2;
    const targetY = 60;
    flyCoins(startX, startY, targetX, targetY, task.type === 'earn' ? 8 : 4, task.type === 'earn' ? '#FFD54F' : '#EF5350');
    showFloatingText(
      startX + 20,
      startY - 10,
      task.type === 'earn' ? `+${task.points}` : `-${task.points}`,
      task.type === 'earn' ? '#66BB6A' : '#EF5350'
    );
  }

  // 任务为earn且加分>=3时撒彩带
  if (task.type === 'earn' && task.points >= 3) {
    spawnConfetti();
  }

  // 顶部积分跳动动画
  const pill = document.getElementById('pointsPill');
  if (pill) {
    pill.classList.remove('points-bump');
    void pill.offsetWidth; // 触发重排
    pill.classList.add('points-bump');
  }

  saveData(state);
  checkAchievements();
  refreshAll();
}

// ====== 金币飞入动画 ======
function flyCoins(startX, startY, targetX, targetY, count, color) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const coin = document.createElement('div');
      coin.className = 'coin-fly';
      coin.style.left = (startX + (Math.random() - 0.5) * 30) + 'px';
      coin.style.top = (startY + (Math.random() - 0.5) * 30) + 'px';
      coin.style.setProperty('--start-x', startX + 'px');
      coin.style.setProperty('--start-y', startY + 'px');
      coin.style.setProperty('--target-x', targetX + 'px');
      coin.style.setProperty('--target-y', targetY + 'px');
      coin.innerHTML = `<svg viewBox="0 0 24 24" width="40" height="40">
        <circle cx="12" cy="12" r="10" fill="${color}" stroke="#fff" stroke-width="1.5"/>
        <text x="12" y="16" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">¥</text>
      </svg>`;
      document.body.appendChild(coin);
      setTimeout(() => coin.remove(), 1300);
    }, i * 60);
  }
}

// ====== 浮动积分文字 ======
function showFloatingText(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'floating-text';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = color;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ====== 彩带动画 ======
function spawnConfetti() {
  const colors = ['#FFA726', '#FFD54F', '#66BB6A', '#42A5F5', '#AB47BC', '#EF5350'];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    c.style.animationDuration = (1.8 + Math.random() * 0.8) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

// ====== Toast ======
function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ====== 弹窗 ======
function showModal(contentHtml, options) {
  const mask = document.getElementById('modalMask');
  const content = document.getElementById('modalContent');
  content.innerHTML = DOMPurify.sanitize(contentHtml);
  // 默认允许点击遮罩关闭；noMaskClose = true 时禁用（如盲盒结果弹窗）
  content.classList.toggle('no-mask-close', !!(options && options.noMaskClose));

function closeModal() {

}

// ====== 盲盒抽奖 ======
function openMysteryBox() {
  // 每日次数限制
  const today = getTodayStr();
  if (state.mysteryBox.lastBoxDate === today) {
    const limit = state.mysteryBox.dailyLimit || 1;
    showToast(`今日已抽过盲盒（每天限 ${limit} 次），明天再来吧！`);
    return;
  }
  if (state.totalPoints < state.mysteryBox.cost) {
    showToast('积分不足，无法开启盲盒');
    return;
  }
  // 扣除积分（立即同步顶部积分胶囊，避免切换页面才看到）
  state.totalPoints -= state.mysteryBox.cost;
  state.mysteryBox.lastBoxDate = today; // 记录今日已抽
  renderTopPoints();

  // 统一时间戳与分组 ID：确保 spend/result/earn 顺序稳定、可关联
  const baseTs = Date.now();
  const mysteryGroupId = 'mg_' + baseTs;

  const spendRecord = {
    id: 'rd_' + baseTs + '_s',
    timestamp: baseTs,
    taskId: 'mystery',
    taskTitle: '[盲盒] 开启神秘礼盒',
    points: state.mysteryBox.cost,
    type: 'spend',
    groupId: mysteryGroupId,
    seq: 0
  };
  state.records.push(spendRecord);

  // 按概率加权随机抽取
  const prizes = state.mysteryBox.prizes || [];
  let prize = null;
  if (prizes.length === 0) {
    prize = { id: 'empty', name: '空盲盒', desc: '奖品池为空', icon: 'gift', value: 0, probability: 0, type: 'normal' };
  } else {
    const totalProb = prizes.reduce((s, p) => s + Math.max(0, p.probability || 0), 0);
    if (totalProb <= 0) {
      prize = prizes[Math.floor(Math.random() * prizes.length)];
    } else {
      let r = Math.random() * totalProb;
      for (const p of prizes) {
        const prob = Math.max(0, p.probability || 0);
        if (r < prob) { prize = p; break; }
        r -= prob;
      }
      if (!prize) prize = prizes[prizes.length - 1];
    }
  }

  // 兜底补全 type 字段（迁移数据可能缺 type）
  const prizeType = prize.type || 'normal';
  const prizeValue = (typeof prize.value === 'number' && prize.value > 0) ? prize.value : 0;
  // icon 兼容：emoji / SVG key 都支持
  const prizeIconRaw = prize.icon || 'gift';
  const prizeIcon = ICONS[prizeIconRaw] ? getIcon(prizeIconRaw, 56) : `<span style="font-size: 56px; line-height: 1;">${prizeIconRaw}</span>`;
  const typeBadge = prizeType === 'hidden-big' ? ' 🏆' : (prizeType === 'hidden-small' ? ' 🎀' : '');
  const typeLabel = prizeType === 'hidden-big' ? '大隐藏' : (prizeType === 'hidden-small' ? '小隐藏' : '普通');

  // 总是记录一条「盲盒结果」记录（含 meta 完整信息），兑换记录/历史回查都依赖这条
  state.records.push({
    id: 'rd_' + baseTs + '_r',
    timestamp: baseTs + 10,
    taskId: 'mystery-result',
    taskTitle: '[盲盒结果] ' + prize.name + typeBadge,
    points: 0, // 不影响积分计算
    type: 'info',
    groupId: mysteryGroupId,
    seq: 1,
    meta: {
      prizeName: prize.name,
      prizeIcon: prizeIconRaw,
      prizeType,
      prizeValue,
      prizeDesc: prize.desc || ''
    }
  });

  // 只有 value > 0 才记录积分奖励（+1 边界值也严格排除）
  if (prizeValue > 0) {
    state.totalPoints += prizeValue;
    renderTopPoints(); // 立即同步顶部积分
    state.records.push({
      id: 'rd_' + baseTs + '_p',
      timestamp: baseTs + 20,
      taskId: 'mystery-prize',
      taskTitle: '[盲盒奖励] ' + prize.name + typeBadge,
      points: prizeValue,
      type: 'earn',
      groupId: mysteryGroupId,
      seq: 2
    });
  }

  // 非积分类奖品（value=0）→ 生成 redemption 记录，进我的奖励
  if (prizeValue === 0) {
    const validityDays = 90; // 盲盒奖品默认 90 天有效期
    const expiresAt = baseTs + validityDays * 86400000;
    state.redemptions.push({
      id: 'rm_' + baseTs,
      type: 'mystery-prize',
      refId: prize.id,
      title: prize.name,
      icon: prizeIconRaw,
      cost: state.mysteryBox.cost,
      expiresAt,
      usedAt: null,
      status: 'active',
      createdAt: baseTs,
      groupId: mysteryGroupId,
      meta: {
        prizeType,
        prizeDesc: prize.desc || ''
      }
    });
  }

  saveData(state);

  // 成就延后展示，避免与盲盒结果弹窗冲突
  checkAchievements('defer');

  // 显示动画：盲盒摇晃 → 打开 → 显示结果
  // 第二参数 noMaskClose=true 表示禁止点击遮罩关闭，只能点按钮
  showModal(`
    <div class="mystery-result">
      <div class="mystery-result-anim" id="mysteryBoxAnim">🎁</div>
      <div class="mystery-result-body" id="mysteryResultBody" style="display: none;">
        <div class="mystery-result-icon" id="resultIcon">${prizeIcon}</div>
        <div class="mystery-result-name" id="resultName">${prize.name}</div>
        <div class="mystery-result-tag" id="resultTag">
          <span class="result-tag ${prizeType}">${typeBadge ? typeBadge + ' ' + typeLabel : '🎁 ' + typeLabel}</span>
        </div>
        <div class="mystery-result-desc" id="resultDesc">${prize.desc || ''}</div>
        <div class="mystery-result-value" id="resultValue">${prizeValue > 0 ? '+' + prizeValue + ' 分' : '已存入【我的奖励】，记得核销哦！'}</div>
      </div>
      <button class="btn btn-primary" id="mysteryClaimBtn" style="display: none;" data-close-action="refresh">收下奖励</button>
    </div>
  `, { noMaskClose: true });

  const boxEl = document.getElementById('mysteryBoxAnim');
  boxEl.classList.add('box-shake');
  setTimeout(() => {
    boxEl.classList.remove('box-shake');
    boxEl.classList.add('box-open');
    spawnConfetti();
    // 显示结果主体
    const body = document.getElementById('mysteryResultBody');
    const claimBtn = document.getElementById('mysteryClaimBtn');
    if (body) body.style.display = 'block';
    if (claimBtn) claimBtn.style.display = 'inline-block';
  }, 1500);
  if (prizeValue > 0) {
    setTimeout(() => {
      showFloatingText(window.innerWidth / 2 - 30, window.innerHeight / 2 - 50, `+${prizeValue}`, '#66BB6A');
    }, 1800);
  }
}

// ====== 兑换礼物 ======
function redeemReward(rewardId) {
  const r = state.rewards.find(x => x.id === rewardId);
  if (!r) return;
  if (state.totalPoints < r.cost) {
    showToast('积分不足');
    return;
  }
  state.totalPoints -= r.cost;
  if (r.stock > 0) r.stock -= 1;

  const baseTs = Date.now();
  const groupId = 'rdg_' + baseTs;

  state.records.push({
    id: 'rd_' + baseTs + '_redeem',
    timestamp: baseTs,
    taskId: 'redeem',
    taskTitle: '[兑换] ' + r.title,
    points: r.cost,
    type: 'spend',
    groupId,
    seq: 0
  });

  // 生成 redemption 记录，进入「我的奖励」
  const validityDays = r.validityDays || 90;
  state.redemptions.push({
    id: 'rm_' + baseTs,
    type: 'reward',
    refId: r.id,
    title: r.title,
    icon: r.icon,
    cost: r.cost,
    expiresAt: baseTs + validityDays * 86400000,
    usedAt: null,
    status: 'active',
    createdAt: baseTs,
    groupId
  });

  saveData(state);

  // 成就延后展示，避免与兑换成功弹窗冲突
  checkAchievements('defer');

  showModal(`
    <h3>🎉 兑换成功！</h3>
    <p class="modal-desc">恭喜获得：<br/><strong style="color: var(--primary-dark); font-size: 18px;">${r.title}</strong></p>
    <p class="modal-desc" style="color: var(--text-soft);">已扣除 ${r.cost} 积分 · 有效期 ${validityDays} 天</p>
    <p class="modal-desc" style="color: var(--text-soft); font-size: 12px;">💡 可在「我的奖励」核销</p>
    <div style="margin-top: 24px;">
      <button class="btn btn-primary" data-close-action="refresh">太棒了！</button>
    </div>
  `);
  spawnConfetti();
  refreshAll();
}

// ====== 兑换记录弹窗 ======
function showRedemptionRecords() {
  // 找出所有花费记录（兑换 + 盲盒开启），并关联后续盲盒奖励
  const sorted = [...state.records].sort((a, b) => b.timestamp - a.timestamp);
  const spends = sorted.filter(r => r.type === 'spend');

  if (spends.length === 0) {
    showModal(`
      <h3>📜 兑换记录</h3>
      <p class="modal-desc">还没有任何兑换记录</p>
      <div style="margin-top: 20px;">
        <button class="btn btn-primary" data-close-action="close">知道了</button>
      </div>
    `);
    return;
  }

  // 统计
  const totalSpent = spends.reduce((s, r) => s + r.points, 0);
  const mysteryCount = spends.filter(r => r.taskTitle.includes('[盲盒]')).length;
  const rewardCount = spends.length - mysteryCount;

  // 奖品类型标签映射（用于[类型]显示）
  const TYPE_LABEL = {
    'normal': '普通',
    'hidden-small': '小隐藏 🎀',
    'hidden-big': '大隐藏 🏆'
  };

  // 关联每条花费的后续奖励（盲盒结果紧跟在盲盒开启之后）
  const itemsHtml = spends.map(s => {
    // 判断类型
    const isMystery = s.taskTitle.includes('[盲盒]');
    // 优先按 groupId 精确关联（新格式最准确）
    let resultRecord = null;
    let earnRecord = null;
    if (isMystery && s.groupId) {
      resultRecord = sorted.find(r => r.groupId === s.groupId && r.type === 'info');
      earnRecord = sorted.find(r => r.groupId === s.groupId && r.type === 'earn');
    }
    // 回退按时间范围查找（兼容无 groupId 的旧数据）
    if (!resultRecord) {
      resultRecord = sorted.find(r =>
        r.timestamp >= s.timestamp &&
        r.timestamp < s.timestamp + 5000 &&
        r.id !== s.id &&
        (r.taskTitle.includes('[盲盒结果]') || (r.meta && r.meta.prizeName))
      );
    }
    if (!earnRecord) {
      earnRecord = sorted.find(r =>
        r.timestamp >= s.timestamp &&
        r.timestamp < s.timestamp + 5000 &&
        r.id !== s.id &&
        r.type === 'earn' &&
        r.taskTitle.includes('[盲盒奖励]')
      );
    }

    let rewardContent = '';

    if (isMystery) {
      let prizeName = '', prizeType = 'normal', prizeValue = 0, prizeIcon = '🎁';
      if (resultRecord && resultRecord.meta && resultRecord.meta.prizeName) {
        // 新格式（有 meta）：最准确
        prizeName = resultRecord.meta.prizeName;
        prizeType = resultRecord.meta.prizeType || 'normal';
        prizeValue = (typeof resultRecord.meta.prizeValue === 'number') ? resultRecord.meta.prizeValue : 0;
        prizeIcon = resultRecord.meta.prizeIcon || '🎁';
      } else if (earnRecord) {
        // 旧格式：从 [盲盒奖励] 文本解析
        const m = earnRecord.taskTitle.match(/\[盲盒奖励\]\s*(.+?)(?:\s*🏆|\s*🎀)?\s*$/);
        prizeName = m ? m[1].trim() : '神秘礼物';
        const matched = state.mysteryBox.prizes.find(p => p.name === prizeName);
        prizeType = matched ? (matched.type || 'normal') : 'normal';
        prizeValue = earnRecord.points || 0;
        prizeIcon = matched ? (matched.icon || '🎁') : '🎁';
      } else {
        // 两条记录都没有（很旧的旧数据）
        prizeName = '神秘礼物';
      }

      // 构建展示文本：[类型] emoji 名称（积分奖励）
      const label = TYPE_LABEL[prizeType] || '普通';
      const valueTag = prizeValue > 0 ? `+${prizeValue} 分` : '无积分';
      rewardContent = `[${label}] ${prizeIcon} ${prizeName}（${valueTag}）`.trim();
    } else {
      // 礼物兑换
      const m = s.taskTitle.match(/\[兑换\]\s*(.+)/);
      rewardContent = m ? m[1] : s.taskTitle;
    }

    const iconSvg = isMystery
      ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="8" width="18" height="13" fill="#AB47BC"/><rect x="2" y="6" width="20" height="3" fill="#CE93D8"/><rect x="11" y="6" width="2" height="15" fill="#fff"/></svg>'
      : '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="6" width="18" height="15" rx="2" fill="#FFA726"/><circle cx="12" cy="13" r="4" fill="#FFE082"/></svg>';

    return `
      <div class="redemption-item ${isMystery ? 'mystery' : ''}">
        <div class="redemption-icon">${iconSvg}</div>
        <div class="redemption-info">
          <div class="redemption-title">${isMystery ? '🎲 盲盒抽奖' : '🎁 礼物兑换'}：${rewardContent}</div>
          <div class="redemption-time">${formatRelativeTime(s.timestamp)} · ${new Date(s.timestamp).toLocaleString('zh-CN', { hour12: false })}</div>
        </div>
        <div class="redemption-cost">-${s.points} 分</div>
      </div>
    `;
  }).join('');

  showModal(`
    <h3>📜 兑换记录</h3>
    <p class="modal-desc">共 ${spends.length} 次消耗 · 礼物 ${rewardCount} 次 · 盲盒 ${mysteryCount} 次 · 累计消耗 ${totalSpent} 积分</p>
    <div class="redemption-summary">
      💡 完整保留每一次兑换与盲盒记录，含时间、消耗积分、获得的奖励内容（[奖品类型] 奖品名称）
    </div>
    <div style="max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0;">
      ${itemsHtml}
    </div>
    <div style="margin-top: 16px;">
      <button class="btn btn-primary" data-close-action="close">关闭</button>
    </div>
  `);
}

// ====== 家长模式：密码输入弹窗 ======
function showPasswordPrompt(onSuccess, title) {
  showModal(`
    <h3>${title || '输入密码'}</h3>
    <p class="modal-desc">家长中心密码（默认 0000）</p>
    <div class="pin-input">
      <input type="password" maxlength="1" inputmode="numeric" data-idx="0" autofocus>
      <input type="password" maxlength="1" inputmode="numeric" data-idx="1">
      <input type="password" maxlength="1" inputmode="numeric" data-idx="2">
      <input type="password" maxlength="1" inputmode="numeric" data-idx="3">
    </div>
    <div id="pinErr" style="color: var(--danger); font-size: 12px; min-height: 18px;"></div>
    <button class="btn btn-primary" data-action="verify-pin">确认</button>
  `);

  // 自动跳到下一格
  setTimeout(() => {
    const inputs = document.querySelectorAll('.pin-input input');
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
      });
    });
    if (inputs[0]) inputs[0].focus();
  }, 50);

  // 暂存回调
  window._pinCallback = onSuccess;
}

function verifyPin() {
  const inputs = document.querySelectorAll('.pin-input input');
  const pin = Array.from(inputs).map(i => i.value).join('');
  if (pin.length !== 4) {
    document.getElementById('pinErr').textContent = '请输入 4 位密码';
    return;
  }
  if (pin === state.password) {
    closeModal();

function saveTask(taskId) {
  const title = document.getElementById('tTitle').value.trim();
  const desc = document.getElementById('tDesc').value.trim();
  const points = parseInt(document.getElementById('tPoints').value) || 1;
  const type = document.getElementById('tType').value;

  if (!title) {
    showToast('请输入任务名称');
    return;
  }

  if (taskId) {
    // 编辑
    const idx = state.tasks.findIndex(t => t.id === taskId);
    if (idx >= 0) {
      state.tasks[idx] = { ...state.tasks[idx], title, desc, points: Math.abs(points), type, icon, days };

    // 新增
    state.tasks.push({
      id: 't_' + Date.now(),

    });

  saveData(state);
  closeModal();

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.id = 'backupImportFile';
  input.hidden = true;
  document.body.appendChild(input);
  input.accept = '.json,application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    input.remove();
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        if (!data.tasks || !Array.isArray(data.tasks)) {
          showToast('数据格式错误');
          return;
        }
        if (!confirm('确认导入？这将覆盖当前数据')) return;
        state = data;
        if (!state.completedToday) state.completedToday = {};
        if (!state.achievements || typeof state.achievements.unlocked !== 'object') state.achievements = { unlocked: {} };
        if (!Array.isArray(state.weeklyReviews)) state.weeklyReviews = [];
        if (typeof state.aiKey === 'undefined') state.aiKey = '';
        saveData(state);
        // 静默解锁已满足条件的成就（导入历史数据后不弹窗）
        checkAchievements('silent');
        refreshAll();
        showToast('导入成功');
      } catch (err) {
        showToast('文件解析失败');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ====== 任务拖拽排序（PC + 移动端） ======
// 通用拖拽排序初始化：containerSelector 容器；itemSelector 项；getId 从项取 ID；onDrop(fromId, toId, position) 重排回调
function setupDragSort(containerSelector, itemSelector, getId, onDrop) {
  const container = document.querySelector(containerSelector);
  if (!container) return;
  const items = Array.from(container.querySelectorAll(itemSelector));

  // 清理已有指示
  items.forEach(it => {
    it.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
  });

  let dragId = null;
  let touchClone = null;
  let lastTouchY = 0;

  // PC：dragstart/dragover/drop/dragend
  items.forEach(item => {
    item.addEventListener('dragstart', (e) => {
      dragId = getId(item);
      item.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {}
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      items.forEach(it => it.classList.remove('drag-over-top', 'drag-over-bottom'));
      dragId = null;
    });
    item.addEventListener('dragover', (e) => {
      if (!dragId || dragId === getId(item)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      items.forEach(it => it.classList.remove('drag-over-top', 'drag-over-bottom'));
      item.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    });
    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!dragId || dragId === getId(item)) return;
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      onDrop(dragId, getId(item), before ? 'before' : 'after');
      refreshAll();
    });
  });

  // 移动端：长按 250ms 后进入拖拽态
  items.forEach(item => {
    let longPressTimer = null;
    let dragging = false;

    const onTouchStart = (e) => {
      const touch = e.touches[0];
      lastTouchY = touch.clientY;
      longPressTimer = setTimeout(() => {
        dragging = true;
        item.classList.add('dragging');
        // 创建浮动克隆跟随手指
        touchClone = item.cloneNode(true);
        const rect = item.getBoundingClientRect();
        touchClone.style.position = 'fixed';
        touchClone.style.left = rect.left + 'px';
        touchClone.style.top = rect.top + 'px';
        touchClone.style.width = rect.width + 'px';
        touchClone.style.zIndex = '9999';
        touchClone.style.opacity = '0.85';
        touchClone.style.boxShadow = '0 4px 16px rgba(0,0,0,0.15)';
        touchClone.style.borderRadius = '12px';
        touchClone.style.pointerEvents = 'none';
        document.body.appendChild(touchClone);
        if (navigator.vibrate) navigator.vibrate(30);
        dragId = getId(item);
      }, 250);
    };

    const onTouchMove = (e) => {
      lastTouchY = e.touches[0].clientY;
      if (!dragging || !touchClone) return;
      e.preventDefault();
      touchClone.style.top = (lastTouchY - 30) + 'px';
      // 高亮目标
      const targetItem = findItemAtY(container, lastTouchY, item, itemSelector);
      items.forEach(it => it.classList.remove('drag-over-top', 'drag-over-bottom'));
      if (targetItem && targetItem !== item) {
        const rect = targetItem.getBoundingClientRect();
        const before = (lastTouchY - rect.top) < rect.height / 2;
        targetItem.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
      }
    };

    const onTouchEnd = (e) => {
      clearTimeout(longPressTimer);
      if (!dragging) return;
      dragging = false;
      // 找落点
      const targetItem = findItemAtY(container, lastTouchY, item, itemSelector);
      if (targetItem && targetItem !== item && dragId) {
        const rect = targetItem.getBoundingClientRect();
        const before = (lastTouchY - rect.top) < rect.height / 2;
        onDrop(dragId, getId(targetItem), before ? 'before' : 'after');
        refreshAll();
      }
      // 清理
      items.forEach(it => it.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
      if (touchClone) { touchClone.remove(); touchClone = null; }
      dragId = null;
    };

    item.addEventListener('touchstart', onTouchStart, { passive: true });
    item.addEventListener('touchmove', onTouchMove, { passive: false });
    item.addEventListener('touchend', onTouchEnd);
    item.addEventListener('touchcancel', onTouchEnd);
  });
}

function findItemAtY(container, clientY, excludeItem, itemSelector) {
  const items = Array.from(container.querySelectorAll(itemSelector));
  return items.find(it => {
    if (it === excludeItem) return false;
    const r = it.getBoundingClientRect();
    return clientY >= r.top && clientY <= r.bottom;
  });
}

function reorderTaskInState(fromId, toId, position) {
  const fromIdx = state.tasks.findIndex(t => t.id === fromId);
  const toIdx = state.tasks.findIndex(t => t.id === toId);
  if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
  const [moved] = state.tasks.splice(fromIdx, 1);
  let newToIdx = state.tasks.findIndex(t => t.id === toId);
  if (newToIdx < 0) newToIdx = state.tasks.length;
  const insertIdx = position === 'before' ? newToIdx : newToIdx + 1;
  state.tasks.splice(insertIdx, 0, moved);
  saveData(state);
  showToast('已调整任务顺序');
}

// ====== 事件绑定 ======
function bindEvents() {
  // Tab 切换
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      refreshAll();
    });
  });

  // 模式切换
  document.getElementById('modeSwitchBtn').addEventListener('click', () => {
    if (isParentMode) {
      isParentMode = false;
      refreshAll();
    } else {
      // 切到家长中心
      currentTab = 'parent';
      refreshAll();
      setTimeout(() => showPasswordPrompt(() => {
        isParentMode = true;
        refreshAll();
      }, '进入家长中心'), 100);
    }
  });

  // 模态框点击外部关闭（盲盒结果弹窗除外，需点"收下奖励"按钮才能关）
  document.getElementById('modalMask').addEventListener('click', (e) => {
    if (e.target.id !== 'modalMask') return;
    const content = document.getElementById('modalContent');
    if (content && content.classList.contains('no-mask-close')) return;
    closeModal();
  });

  // 事件委托：处理所有动态渲染元素
  document.body.addEventListener('click', handleAction);
}

function handleAction(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const taskId = target.dataset.taskId;
  const rewardId = target.dataset.rewardId;

  switch (action) {
    case 'toggle-task':
      completeTask(taskId);
      break;
    case 'redeem':
      redeemReward(rewardId);
      break;
    case 'open-box':
      openMysteryBox();
      break;
    case 'show-redemptions':
      showRedemptionRecords();
      break;
    case 'redeem-reward': {
      // 核销我的奖励
      const id = target.dataset.redemptionId;
      if (id) doRedeem(id);
      break;
    }
    case 'unredeem-reward': {
      // 撤销核销
      const id = target.dataset.redemptionId;
      if (id) doUnredeem(id);
      break;
    }
    case 'rewards-tab': {
      const tab = target.dataset.tab;
      if (tab && ['active', 'all', 'redeemed', 'expired'].includes(tab)) {
        rewardsViewTab = tab;
        refreshAll();
      }
      break;
    }
    case 'toggle-mystery-detail': {
      const panel = document.getElementById('mysteryDetailPanel');
      const btn = document.getElementById('mysteryDetailToggle');
      if (!panel) break;
      const show = panel.style.display === 'none';
      panel.style.display = show ? 'block' : 'none';
      if (btn) btn.innerHTML = show ? '📜 收起奖品列表 ▲' : '📜 查看奖品内容与概率 ▼';
      break;
    }
    case 'records-tab': {
      const tab = target.dataset.tab;
      if (tab && ['day', 'week', 'month'].includes(tab)) {
        recordsViewTab = tab;
        recordsOffset = 0; // 切视图时重置到当前
        refreshAll();
      }
      break;
    }
    case 'records-period-nav': {
      const dir = parseInt(target.dataset.dir);
      if (dir === -1) {
        recordsOffset -= 1;
      } else if (dir === 1) {
        recordsOffset += 1;
      } else if (dir === 0) {
        recordsOffset = 0;
      }
      refreshAll();
      break;
    }
    case 'add-mystery-prize':
      showMysteryPrizeEditor(null);
      break;
    case 'edit-mystery-prize': {
      const prizeId = target.dataset.prizeId;
      const p = state.mysteryBox.prizes.find(x => x.id === prizeId);
      const forceType = (p && (p.type === 'hidden-small' || p.type === 'hidden-big')) ? p.type : null;
      showMysteryPrizeEditor(prizeId, forceType);
      break;
    }
    case 'save-mystery-prize':
      saveMysteryPrize(target.dataset.prizeId || null, target.dataset.forceType || null);
      break;
    case 'del-mystery-prize':
      deleteMysteryPrize(target.dataset.prizeId);
      break;
    case 'save-mystery-cost':
      saveMysteryCost();
      break;
    case 'enter-parent-mode':
      showPasswordPrompt(() => {
        isParentMode = true;
        refreshAll();
      }, '进入家长中心');
      break;
    case 'exit-parent-mode':
      isParentMode = false;
      refreshAll();
      break;
    case 'verify-pin':
      verifyPin();
      break;
    case 'adjust-points': {
      const input = document.getElementById('adjustPointsInput');
      const note = document.getElementById('adjustPointsNote');
      const v = parseInt(input.value);
      if (isNaN(v) || v === 0) { showToast('请输入有效积分'); return; }
      state.totalPoints += v;
      state.records.push({
        id: 'rd_' + Date.now(),
        timestamp: Date.now(),
        taskId: 'manual',
        taskTitle: '[家长调整] ' + (note.value || '手动调整'),
        points: Math.abs(v),
        type: v > 0 ? 'earn' : 'bad'
      });
      saveData(state);
      checkAchievements();
      input.value = '';
      note.value = '';
      refreshAll();
      showToast('已调整 ' + (v > 0 ? '+' : '') + v + ' 分');
      break;
    }
    case 'add-task':
      showTaskEditor(null);
      break;
    case 'edit-task':
      showTaskEditor(taskId);
      break;
    case 'del-task':
      deleteTask(taskId);
      break;
    case 'save-task':
      saveTask(taskId);
      break;
    case 'add-reward':
      showRewardEditor(null);
      break;
    case 'edit-reward':
      showRewardEditor(rewardId);
      break;
    case 'save-reward':
      saveReward(rewardId);
      break;
    case 'del-reward':
      deleteReward(rewardId);
      break;
    case 'change-password': {
      const oldP = document.getElementById('oldPassword').value;
      const newP = document.getElementById('newPassword').value;
      if (oldP !== state.password) { showToast('当前密码错误'); return; }
      if (!/^\d{4}$/.test(newP)) { showToast('新密码必须是 4 位数字'); return; }
      state.password = newP;
      saveData(state);
      document.getElementById('oldPassword').value = '';
      document.getElementById('newPassword').value = '';
      showToast('密码修改成功');
      break;
    }
    case 'save-child-name': {
      const name = document.getElementById('childNameInput').value.trim();
      if (!name) { showToast('请输入昵称'); return; }
      state.childName = name;
      saveData(state);
      refreshAll();
      showToast('昵称已保存');
      break;
    }
    case 'export-data':
      exportData();
      break;
    case 'import-data':
      importData();
      break;
    case 'reset-data':
      resetAllData();
      break;
    case 'generate-review': {
      const sunday8pm = getLatestSunday8pm();
      const periodStart = sunday8pm - 7 * 86400000;
      const hasData = (state.records || []).some(r => r.timestamp >= periodStart && r.timestamp < sunday8pm);
      if (!hasData) { showToast('本周还没有行为记录，无法点评'); break; }
      generateWeeklyReview(sunday8pm, true);
      break;
    }
  }
}

document.addEventListener('click', e => {
  const button = e.target.closest('[data-close-action]');
  if (!button) return;
  closeModal();
  if (button.dataset.closeAction === 'refresh') { flushPendingAchievements(); renderTopPoints(); refreshAll(); }
});
// ====== 初始化 ======
async function init() {
  try {
    await sql('INSERT OR IGNORE INTO points_state (id, document, revision) VALUES (1, ?, 0)', [JSON.stringify(DEFAULT_DATA)]);
    const row = (await sql('SELECT document, revision FROM points_state WHERE id=1')).rows[0];
    if (!row) throw new Error('数据不存在');
    state = loadData(row.document);
    revision = Number(row.revision);
  } catch (error) { storageError('无法连接应用数据，未进行任何修改。'); return; }
  bindEvents();
  refreshAll();
  // 智能体：检测是否已到周日晚 8 点，需要生成本周点评
  setTimeout(checkWeeklyReview, 400);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
