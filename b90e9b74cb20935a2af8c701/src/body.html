
  <header class="topbar">
    <div class="brand">
      <span class="brand__logo">耶</span>
      <div class="brand__txt">
        <h1>超好看头像耶</h1>
        <p>高清情头 · 成套头像 · 手机壁纸</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab is-active" data-view="home">首页</button>
      <button class="tab" data-view="wallpaper">壁纸</button>
      <button class="tab" data-view="fav">我的收藏</button>
    </nav>
  </header>

  <!-- 首页 -->
  <section id="home" class="view is-active">
    <div class="filterbar">
      <div class="chips" id="groupChips"></div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜风格 / 关系 / 关键词，如 闺蜜、情侣、水彩" />
      </div>
      <div class="tagcloud" id="tagCloud"></div>
    </div>
    <div class="grid" id="homeGrid"></div>
    <p class="empty" id="homeEmpty" hidden>没有匹配的头像，换个关键词试试～</p>
  </section>

  <!-- 壁纸 -->
  <section id="wallpaper" class="view">
    <div class="grid grid--wp" id="wpGrid"></div>
    <p class="empty" id="wpEmpty" hidden>暂无壁纸</p>
  </section>

  <!-- 收藏 -->
  <section id="fav" class="view">
    <div class="grid" id="favGrid"></div>
    <p class="empty" id="favEmpty" hidden>还没有收藏，去首页或壁纸里点 ♥ 吧</p>
  </section>

  <footer class="foot">演示版 · 头像与壁纸由 AI 生成 · 仅供展示</footer>

  <!-- 头像详情弹层 -->
  <div class="modal" id="detailModal" hidden>
    <div class="modal__mask" data-close></div>
    <div class="modal__panel">
      <button class="modal__close" data-close>×</button>
      <div class="modal__head">
        <h2 id="dmTitle"></h2>
        <span class="badge" id="dmCount"></span>
      </div>
      <div class="modal__tags" id="dmTags"></div>
      <div class="modal__imgs" id="dmImgs"></div>
      <div class="modal__actions">
        <button class="btn btn--fav" id="dmFav">♥ 收藏</button>
        <button class="btn" id="dmSave">存为图片</button>
      </div>
    </div>
  </div>

  <!-- 图片放大 -->
  <div class="modal" id="imgModal" hidden>
    <div class="modal__mask" data-close></div>
    <img class="lightbox" id="lightboxImg" src="" alt="" />
  </div>
