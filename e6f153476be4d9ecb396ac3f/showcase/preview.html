<style data-page-node-id="N6J5vkaQXCP7OpGJ9Wl6ru" data-pnid-children="Hs5EwuARNtT1qNLNiLAJHw">
  :root{
    --ink:#5a4436;
    --ink-soft:#a08a78;
    --orange:#ff9a62;
    --orange-deep:#f4804a;
    --cream:#fff8f0;
    --line:#f4e2d2;
    --shadow:0 20px 44px -22px rgba(190,140,105,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 10% -10%, #ffe7cf 0%, rgba(255,231,207,0) 62%),
      radial-gradient(700px 480px at 94% 2%, #ffe1e6 0%, rgba(255,225,230,0) 55%),
      radial-gradient(900px 620px at 50% 110%, #e8f1ff 0%, rgba(232,241,255,0) 60%),
      #fffaf4;
    background-attachment:fixed;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;
    filter:blur(2px);
  }
  body::before{width:180px;height:180px;left:-70px;top:32%;background:radial-gradient(circle,#ffe4c8 0%,rgba(255,228,200,0) 70%);}
  body::after{width:220px;height:220px;right:-90px;bottom:12%;background:radial-gradient(circle,#ffdde4 0%,rgba(255,221,228,0) 70%);}

  .wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:26px 18px 60px;}

  /* ---------- header ---------- */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  h1{
    margin:0;font-size:25px;letter-spacing:1px;font-weight:800;color:#6b4c38;
    display:flex;align-items:center;gap:8px;
  }
  h1 .spark{font-size:18px;animation:twinkle 2.4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.45;transform:scale(.9) rotate(-6deg)}50%{opacity:1;transform:scale(1.1) rotate(6deg)}}
  .sub{margin:6px 0 0;font-size:13px;color:var(--ink-soft);letter-spacing:.5px;}
  .icon-btn{
    flex:0 0 auto;width:44px;height:44px;border-radius:16px;border:1px solid var(--line);
    background:#fffdfa;font-size:18px;cursor:pointer;box-shadow:0 8px 18px -12px rgba(190,140,105,.8);
    transition:transform .15s ease,background .2s;
  }
  .icon-btn:active{transform:scale(.94);}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{
    background:#fffdfa;border:1px solid var(--line);border-radius:20px;padding:12px 6px 10px;
    text-align:center;box-shadow:0 12px 26px -20px rgba(190,140,105,.9);
  }
  .stat .num{display:block;font-size:23px;font-weight:800;color:var(--orange-deep);line-height:1.15;font-variant-numeric:tabular-nums;}
  .stat .lab{display:block;margin-top:3px;font-size:11px;color:var(--ink-soft);letter-spacing:.6px;}

  /* ---------- card ---------- */
  .card{
    background:#fffdfa;border:1px solid var(--line);border-radius:26px;
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px;
  }

  .bubble{
    position:relative;margin:2px 2px 4px;padding:12px 16px;border-radius:18px;
    background:#fff5ea;border:2px dashed #ffd8bb;color:#8a6a58;
    font-size:15px;line-height:1.55;text-align:center;min-height:48px;
    display:flex;align-items:center;justify-content:center;
    transition:background .3s,border-color .3s,color .3s,transform .3s;
  }
  .bubble.done{background:#eefaf0;border-color:#b7e2bd;color:#51825a;}
  .bubble.pop{transform:scale(1.03);}

  /* ---------- stage ---------- */
  .stage{position:relative;margin:6px auto 0;max-width:400px;}
  .stage svg{width:100%;height:auto;display:block;overflow:visible;}
  .fx{position:absolute;inset:0;pointer-events:none;overflow:visible;}

  .muyu,.pestle,.char-figure,.ripple{transform-box:fill-box;transform-origin:center;}
  .pestle{transform-box:view-box;transform-origin:150px 186px;transform:rotate(-26deg);}
  .ripple{transform-box:view-box;transform-origin:236px 224px;opacity:0;}

  .hitting .pestle{animation:knockArm .27s cubic-bezier(.35,0,.3,1);}
  @keyframes knockArm{
    0%{transform:rotate(-26deg)}
    42%{transform:rotate(6deg)}
    100%{transform:rotate(-26deg)}
  }
  .hitting .char-figure.active{animation:hop .27s ease-out;}
  @keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(5px)}100%{transform:translateY(0)}}
  .hitting .muyu{animation:muyuShake .27s ease-out;}
  @keyframes muyuShake{
    0%{transform:scale(1)}
    38%{transform:scale(1.05) translateY(-2px)}
    100%{transform:scale(1)}
  }
  .hitting .ripple{animation:rippleGo .55s ease-out;}
  @keyframes rippleGo{
    0%{opacity:.75;transform:scale(.55)}
    100%{opacity:0;transform:scale(1.9)}
  }

  .char-figure{display:none;}
  .char-figure.active{display:block;}

  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.4s infinite;}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

  /* floating words */
  .float-word{
    position:absolute;transform:translate(-50%,-50%);
    font-size:15px;font-weight:800;color:#f4804a;white-space:nowrap;
    text-shadow:0 2px 0 #fff,0 0 12px rgba(255,190,140,.9);
    animation:floatUp 1s ease-out forwards;pointer-events:none;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}
    25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-160%) scale(1)}
  }

  /* confetti */
  .confetti{
    position:absolute;top:6%;font-size:16px;animation:fall 1.9s ease-in forwards;
    pointer-events:none;
  }
  @keyframes fall{
    0%{opacity:0;transform:translateY(-10px) rotate(0deg)}
    15%{opacity:1}
    100%{opacity:0;transform:translateY(240px) rotate(220deg)}
  }

  /* ---------- progress ---------- */
  .dots{display:flex;gap:7px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap;}
  .dots i{
    width:9px;height:9px;border-radius:50%;background:#f1e4d7;display:block;
    transition:background .3s,box-shadow .3s,transform .3s;
  }
  .dots i.on{background:linear-gradient(180deg,#ffbe86,#f4834b);box-shadow:0 0 0 3px rgba(255,166,116,.18);}

  .primary{
    width:100%;border:none;border-radius:20px;padding:16px;cursor:pointer;
    font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.5px;color:#fff;
    background:linear-gradient(180deg,#ffb478,#f4804a);
    box-shadow:0 16px 28px -14px rgba(240,120,60,.9),inset 0 -3px 0 rgba(0,0,0,.07);
    transition:transform .12s ease,box-shadow .2s,background .3s;
  }
  .primary:active{transform:translateY(2px) scale(.992);box-shadow:0 8px 16px -12px rgba(240,120,60,.9);}
  .primary.ghosted{
    background:linear-gradient(180deg,#fdf0e2,#f8e6d3);color:#b18d70;
    box-shadow:inset 0 0 0 2px #f2ddc8;
  }
  .hint{margin:11px 0 2px;text-align:center;font-size:12.5px;color:var(--ink-soft);letter-spacing:.4px;}

  /* ---------- calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:#8b7361;}
  .cal-head b{font-weight:800;color:#6b4c38;letter-spacing:.4px;}
  .muted{color:#b6a293;font-size:11.5px;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .cell{
    position:relative;aspect-ratio:1/1;border-radius:13px;background:#fdf4ea;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:1px solid #f6e7d8;
  }
  .cell .d{font-size:13px;font-weight:700;color:#b29c8a;font-variant-numeric:tabular-nums;}
  .cell .m{font-size:9px;color:#c9b7a6;}
  .cell.on{
    background:linear-gradient(180deg,#ffc48f,#f89157);border-color:#f89157;
    box-shadow:0 8px 16px -10px rgba(240,130,70,.95);
  }
  .cell.on .d{color:#fff;}
  .cell.on .m{color:#fff6ee;}
  .cell.today{outline:2px solid #ffd0a8;outline-offset:2px;}

  /* ---------- avatars ---------- */
  .avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .av{
    border:1px solid var(--line);background:#fdf8f2;border-radius:16px;padding:10px 4px 8px;
    cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:.22s;
  }
  .av .e{font-size:21px;line-height:1;}
  .av .n{font-size:11px;color:#a58d7b;}
  .av.active{background:#fff1e2;border-color:#ffc79c;box-shadow:0 10px 20px -14px rgba(240,140,70,.9);transform:translateY(-2px);}
  .av.active .n{color:#e07b3f;font-weight:700;}

  footer{text-align:center;padding:6px 0 0;}
  .ghost{
    background:none;border:none;font-family:inherit;font-size:11.5px;color:#c2ad9c;
    cursor:pointer;padding:8px;letter-spacing:.5px;
  }
  .ghost:hover{color:#a08a78;}

  @media (max-width:380px){
    h1{font-size:22px;}
    .stat .num{font-size:20px;}
  }
</style>
</head>

<script data-page-node-id="iiwHH7bfuM06pjXUdZeq17" data-pnid-children="4DSZpW6yFRVyss6rb442MN">
(function(){
  'use strict';

  var KEY = 'muyu-checkin-v1';
  var localStorage = {data:{}, getItem:function(k){return this.data[k]}, setItem:function(k,v){this.data[k]=v}};
  var GOAL = 10;

  var SUCCESS_SLOGANS = [
    '今日功德圆满，心静如月 🌙',
    '戒定生慧，今天你做到了 ✨',
    '一身清爽，明天继续呀 🍃',
    '木鱼一响，烦恼皆忘 🐟',
    '你把念头放下了，很好 🤍',
    '心如止水，今日已清净 🫧',
    '又守住了一天，很了不起 💪',
    '笃、笃、笃——今日心安 🌿',
    '清净是给自己的礼物 🎁',
    '今日已打卡，愿你睡个好觉 😴'
  ];

  var PENDING_SLOGANS = [
    '心猿意马的时候，就来敲一下 🐒',
    '今天还没打卡，小和尚在等你哦 🙏',
    '一敲一放，别急，慢慢来 🌿',
    '色即是空，先敲十下再说 😌',
    '念头来了不怕，怕的是跟着走 🍂',
    '把注意力放回这一声「笃」上 👂',
    '今天是新的一天，从木鱼开始 ☀️',
    '不必完美，只要今天做到了就好 🌱',
    '手在敲，心在听，就很好 🫧',
    '每一次敲击，都是给自己松绑 🪷'
  ];

  var HIT_WORDS = ['功德 +1', '心静 +1', '妄念 -1', '清净 +1', '善哉～', '笃！', '定力 +1', '清凉 +1'];

  var AVATARS = [
    { id:'monk',    name:'小和尚', emoji:'🧘' },
    { id:'cat',     name:'小橘猫', emoji:'🐱' },
    { id:'fox',     name:'小狐狸', emoji:'🦊' },
    { id:'penguin', name:'小企鹅', emoji:'🐧' }
  ];

  var els = {
    bubble:   document.getElementById('bubble'),
    stage:    document.getElementById('stage'),
    svg:      document.getElementById('svg'),
    fx:       document.getElementById('fx'),
    dots:     document.getElementById('dots'),
    knockBtn: document.getElementById('knockBtn'),
    hint:     document.getElementById('hint'),
    streak:   document.getElementById('streakNum'),
    total:    document.getElementById('totalNum'),
    merit:    document.getElementById('meritNum'),
    cal:      document.getElementById('cal'),
    calTip:   document.getElementById('calTip'),
    avatars:  document.getElementById('avatars'),
    sound:    document.getElementById('soundBtn'),
    reset:    document.getElementById('resetBtn')
  };

  var state = load();
  var pendingSlogan = pick(PENDING_SLOGANS);

  /* ---------------- 数据 ---------------- */
  function load(){
    var base = { records:{}, merits:0, avatar:'monk', muted:false };
    try{
      var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(raw && typeof raw === 'object'){
        base.records = raw.records || {};
        base.merits  = raw.merits || 0;
        base.avatar  = raw.avatar || 'monk';
        base.muted   = !!raw.muted;
      }
    }catch(e){}
    return base;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }

  function todayRec(){
    var k = todayKey();
    if(!state.records[k]) state.records[k] = { n:0, done:false, slogan:'' };
    return state.records[k];
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function streak(){
    var s = 0, d = new Date();
    if(!(state.records[keyOf(d)] && state.records[keyOf(d)].done)){
      d.setDate(d.getDate()-1);
    }
    while(true){
      var r = state.records[keyOf(d)];
      if(r && r.done){ s++; d.setDate(d.getDate()-1); } else break;
    }
    return s;
  }
  function totalDone(){
    var n = 0;
    for(var k in state.records){ if(state.records[k] && state.records[k].done) n++; }
    return n;
  }

  /* ---------------- 音效 ---------------- */
  var actx = null;
  function audio(){
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
      }
      if(actx.state === 'suspended') actx.resume();
      return actx;
    }catch(e){ return null; }
  }
  function playKnock(){
    if(state.muted) return;
    var ctx = audio(); if(!ctx) return;
    var t = ctx.currentTime;

    var o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(132, t + 0.1);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.26);

    var len = Math.floor(ctx.sampleRate * 0.05);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<len;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.9;
    var ng = ctx.createGain(); ng.gain.value = 0.16;
    src.connect(bp); bp.connect(ng); ng.connect(ctx.destination);
    src.start(t);
  }
  function playSuccess(){
    if(state.muted) return;
    var ctx = audio(); if(!ctx) return;
    var notes = [659.25, 783.99, 987.77, 1318.51];
    notes.forEach(function(f, i){
      var t = ctx.currentTime + i*0.13;
      var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.62);
    });
  }

  /* ---------------- 特效 ---------------- */
  function floatWord(text){
    var el = document.createElement('div');
    el.className = 'float-word';
    el.textContent = text;
    el.style.left = (52 + Math.random()*18) + '%';
    el.style.top  = (50 + Math.random()*12) + '%';
    els.fx.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1000);
  }
  function confetti(){
    var shapes = ['🌸','✨','🎉','🍃','⭐','💛','🫧'];
    for(var i=0;i<16;i++){
      (function(i){
        var d = document.createElement('div');
        d.className = 'confetti';
        d.textContent = shapes[i % shapes.length];
        d.style.left = (8 + Math.random()*84) + '%';
        d.style.fontSize = (13 + Math.random()*13) + 'px';
        d.style.animationDelay = (Math.random()*0.45) + 's';
        els.fx.appendChild(d);
        setTimeout(function(){ d.remove(); }, 2400);
      })(i);
    }
  }
  function animateHit(){
    els.stage.classList.remove('hitting');
    void els.stage.offsetWidth;
    els.stage.classList.add('hitting');
    clearTimeout(animateHit._t);
    animateHit._t = setTimeout(function(){ els.stage.classList.remove('hitting'); }, 300);
  }

  /* ---------------- 敲击 ---------------- */
  var lastKnock = 0;
  function knock(){
    var now = Date.now();
    if(now - lastKnock < 90) return;
    lastKnock = now;

    var rec = todayRec();
    var wasDone = rec.done;

    rec.n += 1;
    state.merits += 1;

    if(rec.n >= GOAL && !rec.done){
      rec.done = true;
      rec.slogan = pick(SUCCESS_SLOGANS);
      save();
      animateHit();
      playKnock();
      floatWord(pick(HIT_WORDS));
      setTimeout(function(){
        confetti();
        playSuccess();
        els.bubble.classList.add('pop');
        setTimeout(function(){ els.bubble.classList.remove('pop'); }, 260);
        render();
      }, 170);
      render();
      return;
    }

    if(!rec.done){
      pendingSlogan = pick(PENDING_SLOGANS);
    }
    save();
    animateHit();
    playKnock();
    floatWord(pick(HIT_WORDS));
    render();
  }

  /* ---------------- 渲染 ---------------- */
  function render(){
    var rec = todayRec();
    var left = Math.max(0, GOAL - rec.n);

    els.streak.textContent = streak();
    els.total.textContent  = totalDone();
    els.merit.textContent  = state.merits;

    if(rec.done){
      els.bubble.classList.add('done');
      els.bubble.textContent = rec.slogan || SUCCESS_SLOGANS[0];
    }else{
      els.bubble.classList.remove('done');
      els.bubble.textContent = pendingSlogan;
    }

    var html = '';
    for(var i=0;i<GOAL;i++){ html += '<i class="' + (i < rec.n ? 'on' : '') + '"></i>'; }
    els.dots.innerHTML = html;

    if(rec.done){
      els.knockBtn.textContent = '今日已圆满 · 再敲攒功德';
      els.knockBtn.classList.add('ghosted');
      els.hint.textContent = '今天已经打过卡啦，随时可以再来敲敲 🫧';
    }else{
      els.knockBtn.textContent = '敲一下木鱼 (' + Math.min(rec.n, GOAL) + '/' + GOAL + ')';
      els.knockBtn.classList.remove('ghosted');
      els.hint.textContent = '再敲 ' + left + ' 下，今天就算打卡成功 ✨';
    }

    els.sound.textContent = state.muted ? '🔕' : '🔔';

    // 形象
    var figs = els.svg.querySelectorAll('.char-figure');
    for(var j=0;j<figs.length;j++){
      figs[j].classList.toggle('active', figs[j].getAttribute('data-avatar') === state.avatar);
    }
    var avs = els.avatars.querySelectorAll('.av');
    for(var k=0;k<avs.length;k++){
      avs[k].classList.toggle('active', avs[k].getAttribute('data-id') === state.avatar);
    }

    renderCal();
  }

  function renderCal(){
    var cells = [], done = 0;
    for(var i=20;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      var r = state.records[keyOf(d)];
      var isDone = !!(r && r.done);
      if(isDone) done++;
      cells.push(
        '<div class="cell' + (isDone ? ' on' : '') + (i === 0 ? ' today' : '') + '">' +
          '<span class="d">' + d.getDate() + '</span>' +
          '<span class="m">' + '日一二三四五六'.charAt(d.getDay()) + '</span>' +
        '</div>'
      );
    }
    els.cal.innerHTML = cells.join('');
    els.calTip.textContent = '这 21 天打卡 ' + done + ' 天';
  }

  function buildAvatars(){
    els.avatars.innerHTML = AVATARS.map(function(a){
      return '<button class="av" data-id="' + a.id + '" type="button">' +
               '<span class="e">' + a.emoji + '</span>' +
               '<span class="n">' + a.name + '</span>' +
             '</button>';
    }).join('');
    els.avatars.addEventListener('click', function(e){
      var btn = e.target.closest('.av');
      if(!btn) return;
      state.avatar = btn.getAttribute('data-id');
      save();
      render();
      floatWord('换好啦～');
    });
  }

  /* ---------------- 事件 ---------------- */
  els.stage.addEventListener('click', knock);
  els.knockBtn.addEventListener('click', knock);

  els.sound.addEventListener('click', function(){
    state.muted = !state.muted;
    save();
    render();
    if(!state.muted) playKnock();
  });

  els.reset.addEventListener('click', function(){
    if(true){
      state = { records:{}, merits:0, avatar:'monk', muted:false };
      pendingSlogan = pick(PENDING_SLOGANS);
      save();
      render();
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' && e.target.tagName !== 'BUTTON'){
      e.preventDefault();
      knock();
    }
  });

  buildAvatars();
  render();
})();
</script>
</body>
</html>
