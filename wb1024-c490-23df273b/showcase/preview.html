<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>被动收入小账本 · 每天躺赚多少钱</title>
<meta name="description" content="统一管理银行定期、余额宝、公积金等被动收益资产，按单利自动计算每日收益并汇总今日被动收入。纯本地存储，不登录、不联网。" />
<meta name="theme-color" content="#0f766e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="被动收入小账本" />
<meta name="format-detection" content="telephone=no" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M32 50V30' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M32 34c0-9 7-15 18-15 0 9-8 15-18 15z' fill='%23fff' fill-opacity='.92'/%3E%3Cpath d='M32 39c0-7-6-11-15-11 0 7 6 11 15 11z' fill='%23fff' fill-opacity='.62'/%3E%3C/svg%3E" />

<style>/* ============================================================
   被动收入小账本 · 样式
   设计基调：财务类浅色简约，深青绿主色，收益金额用暖红
   支持浅色 / 深色 / 跟随系统
   ============================================================ */

:root {
  --brand: #0f766e;
  --brand-deep: #0a5a54;
  --brand-soft: #e5f2f0;
  --brand-line: #cfe6e2;
  --gain: #c8483a;
  --gain-soft: #fbeeec;
  --warn: #b0741a;
  --warn-soft: #fdf4e3;
  --warn-line: #f3e2bd;

  --bg: #f2f5f6;
  --surface: #ffffff;
  --surface-2: #f7f9fa;
  --ink: #16232a;
  --ink-2: #3d4f59;
  --muted: #7c8b95;
  --faint: #a3b0b8;
  --line: #e5ecee;
  --line-2: #eef3f4;

  --shadow-sm: 0 1px 2px rgba(16, 44, 52, .04), 0 6px 16px -6px rgba(16, 44, 52, .10);
  --shadow-md: 0 2px 6px rgba(16, 44, 52, .05), 0 16px 32px -16px rgba(16, 44, 52, .18);
  --shadow-hero: 0 18px 34px -16px rgba(10, 90, 84, .55);
  --radius: 16px;
  --radius-lg: 20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

[data-theme="dark"] {
  --brand: #35b3a4;
  --brand-deep: #1c8b80;
  --brand-soft: #12312e;
  --brand-line: #1d4742;
  --gain: #ef8375;
  --gain-soft: #35211e;
  --warn: #e0ac55;
  --warn-soft: #332916;
  --warn-line: #4a3b1f;

  --bg: #0d1418;
  --surface: #161f25;
  --surface-2: #1b262d;
  --ink: #e9eff2;
  --ink-2: #b9c6cd;
  --muted: #8b9aa3;
  --faint: #6c7c86;
  --line: #25323a;
  --line-2: #202b32;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 16px -8px rgba(0, 0, 0, .5);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, .35), 0 18px 34px -18px rgba(0, 0, 0, .7);
  --shadow-hero: 0 18px 34px -18px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body.modal-open { overflow: hidden; }

button { font-family: inherit; font-size: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ---------------- 骨架 ---------------- */

.app {
  max-width: 780px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(10px + var(--safe-t)) 18px 10px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
}

.topbar h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .3px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar .sub {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted);
  display: block;
  margin-top: 1px;
  letter-spacing: .2px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  flex: none;
  transition: transform .12s, background .12s;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 19px; height: 19px; display: block; }

.view {
  flex: 1;
  padding: 4px 16px calc(112px + var(--safe-b));
  animation: fade .22s ease;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* ---------------- 底部导航 ---------------- */

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(12px + var(--safe-b));
  z-index: 40;
  display: flex;
  gap: 2px;
  padding: 6px;
  width: calc(100% - 24px);
  max-width: 460px;
  border-radius: 20px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(18px);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  box-shadow: 0 2px 8px rgba(16, 44, 52, .06), 0 18px 30px -14px rgba(16, 44, 52, .24),
    inset 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent);
}

.tabbar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 7px 2px 6px;
  border-radius: 14px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--muted);
  transition: color .15s, background .15s;
  position: relative;
}
.tabbar button svg { width: 21px; height: 21px; }
.tabbar button.on { color: var(--brand); background: var(--brand-soft); font-weight: 700; }
.tabbar .dot {
  position: absolute;
  top: 5px;
  right: 50%;
  margin-right: -16px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--warn);
  box-shadow: 0 0 0 2px var(--surface);
}

/* ---------------- 卡片 / 区块 ---------------- */

.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 15px 16px;
  margin-bottom: 11px;
}

.sec {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 2px 9px;
}
.sec h2 { margin: 0; font-size: 14.5px; font-weight: 700; letter-spacing: .2px; }
.sec .more { font-size: 12.5px; color: var(--brand); font-weight: 600; }
.sec .hint { font-size: 11.5px; color: var(--muted); }

/* ---------------- 首页 hero ---------------- */

.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
  padding: 18px 20px 16px;
  margin-bottom: 12px;
  color: #fff;
  background: linear-gradient(138deg, #0a5a54 0%, #0f766e 48%, #14907f 100%);
  box-shadow: var(--shadow-hero);
}
.hero::after {
  content: "";
  position: absolute;
  right: -70px;
  top: -90px;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 68%);
  pointer-events: none;
}
.hero::before {
  content: "";
  position: absolute;
  left: -50px;
  bottom: -110px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 70%);
  pointer-events: none;
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: rgba(255, 255, 255, .78);
  position: relative;
  z-index: 1;
}
.hero-pill {
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .18);
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  letter-spacing: .3px;
}

.hero-label {
  font-size: 12px;
  letter-spacing: 2px;
  color: rgba(255, 255, 255, .82);
  margin-top: 14px;
  position: relative;
  z-index: 1;
}

.hero-amount {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-size: clamp(36px, 10.5vw, 46px);
  font-weight: 700;
  letter-spacing: -1.2px;
  line-height: 1.12;
  margin: 2px 0 0;
  position: relative;
  z-index: 1;
  font-variant-numeric: tabular-nums;
}
.hero-amount .cur { font-size: .48em; font-weight: 600; opacity: .82; letter-spacing: 0; }

.hero-meta {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 6px;
  font-size: 11.5px;
  color: rgba(255, 255, 255, .72);
  position: relative;
  z-index: 1;
}
.hero-meta b { color: #fff; font-weight: 600; }

.hero-foot {
  display: flex;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, .16);
  position: relative;
  z-index: 1;
}
.hero-foot > div { flex: 1; min-width: 0; }
.hero-foot > div + div {
  padding-left: 12px;
  border-left: 1px solid rgba(255, 255, 255, .14);
  margin-left: 12px;
}
.hero-foot b {
  display: block;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.2px;
  font-variant-numeric: tabular-nums;
}
.hero-foot i {
  font-style: normal;
  font-size: 10.5px;
  color: rgba(255, 255, 255, .66);
  letter-spacing: .2px;
}

/* 目标进度 */
.goal-wrap { margin-top: 13px; position: relative; z-index: 1; }
.goal-line {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: rgba(255, 255, 255, .8);
  margin-bottom: 5px;
}
.goal-bar { height: 5px; border-radius: 100px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.goal-bar span {
  display: block;
  height: 100%;
  border-radius: 100px;
  background: linear-gradient(90deg, #fff, #bff0e6);
  transition: width .5s cubic-bezier(.2, .8, .2, 1);
}

/* ---------------- 统计小卡 ---------------- */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 12px;
}
.stat {
  background: var(--surface);
  border-radius: 14px;
  padding: 12px 11px;
  box-shadow: var(--shadow-sm);
}
.stat .k { font-size: 10.5px; color: var(--muted); letter-spacing: .2px; white-space: nowrap; }
.stat .v {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.4px;
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat .v.gain { color: var(--gain); }
.stat .v.plain { color: var(--ink); }

/* ---------------- 提醒条 ---------------- */

.alert {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  border-radius: 13px;
  padding: 11px 13px;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}
.alert .ic { color: var(--warn); flex: none; margin-top: 1px; }
.alert .ic svg { width: 17px; height: 17px; display: block; }
.alert b { display: block; font-size: 12.5px; color: var(--warn); font-weight: 700; }
.alert p { margin: 2px 0 0; font-size: 11.5px; color: var(--warn); opacity: .88; line-height: 1.45; }

/* ---------------- 资产卡片 ---------------- */

.asset {
  display: flex;
  align-items: stretch;
  gap: 12px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 13px 14px;
  margin-bottom: 9px;
  box-shadow: var(--shadow-sm);
  width: 100%;
  text-align: left;
  transition: transform .12s, box-shadow .15s;
  position: relative;
}
.asset:active { transform: scale(.988); }
.asset .bar {
  width: 3px;
  border-radius: 3px;
  background: var(--brand-line);
  flex: none;
  margin: 2px 0;
}
.asset.off .bar { background: var(--line); }
.asset .mid { flex: 1; min-width: 0; }
.asset .name {
  font-size: 14.5px;
  font-weight: 650;
  letter-spacing: .1px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
}
.asset .name span.t {
  flex: none;
  font-size: 9.5px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--brand-soft);
  color: var(--brand);
  letter-spacing: .2px;
}
.asset.off .name span.t { background: var(--surface-2); color: var(--faint); }
.asset .name em {
  font-style: normal;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.asset .sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.asset .sub .sep { color: var(--line); }
.asset .right { text-align: right; flex: none; display: flex; flex-direction: column; justify-content: center; }
.asset .right .d {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--gain);
  letter-spacing: -.4px;
  font-variant-numeric: tabular-nums;
}
.asset.off .right .d { color: var(--faint); }
.asset .right .u { font-size: 10px; color: var(--faint); margin-top: 2px; }

.asset .del {
  flex: none;
  align-self: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--faint);
}
.asset .del:active { background: var(--gain-soft); color: var(--gain); }
.asset .del svg { width: 17px; height: 17px; }

.pending-tip {
  font-size: 10.5px;
  color: var(--warn);
  background: var(--warn-soft);
  border-radius: 6px;
  padding: 2px 7px;
  margin-top: 6px;
  display: inline-block;
}

/* ---------------- 空状态 ---------------- */

.empty {
  text-align: center;
  padding: 44px 24px 32px;
}
.empty .art {
  width: 72px;
  height: 72px;
  margin: 0 auto 16px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--brand-soft);
  color: var(--brand);
}
.empty .art svg { width: 34px; height: 34px; }
.empty h3 { margin: 0 0 6px; font-size: 15.5px; font-weight: 700; }
.empty p { margin: 0 0 18px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

/* ---------------- 按钮 ---------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 46px;
  padding: 0 20px;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .3px;
  transition: transform .12s, opacity .15s, background .15s;
  width: 100%;
}
.btn:active { transform: scale(.977); }
.btn svg { width: 18px; height: 18px; }
.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-deep));
  color: #fff;
  box-shadow: 0 8px 18px -8px rgba(15, 118, 110, .7);
}
[data-theme="dark"] .btn-primary { color: #06231f; box-shadow: none; }
.btn-ghost { background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-sm); }
.btn-soft { background: var(--brand-soft); color: var(--brand); }
.btn-danger { background: var(--gain-soft); color: var(--gain); }
.btn-sm { height: 38px; font-size: 13.5px; padding: 0 15px; width: auto; border-radius: 11px; }
.btn-row { display: flex; gap: 9px; }

/* ---------------- 表单 ---------------- */

.form-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 4px 16px;
  margin-bottom: 11px;
}
.field { padding: 13px 0; border-bottom: 1px solid var(--line-2); }
.field:last-child { border-bottom: 0; }
.field > label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: .3px;
  margin-bottom: 6px;
}
.field > label .opt { font-weight: 500; color: var(--faint); font-size: 11px; }
.field input,
.field textarea {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  padding: 0;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -.1px;
}
.field input::placeholder, .field textarea::placeholder { font-weight: 400; color: var(--faint); }
.field input[type="date"] { font-weight: 600; }
.field .err {
  font-size: 11.5px;
  color: var(--gain);
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.field.bad { border-color: var(--gain-soft); }
.field.bad input { color: var(--gain); }

.field-row { display: flex; gap: 0; }
.field-row .field { flex: 1; }
.field-row .field + .field { border-left: 1px solid var(--line-2); padding-left: 14px; margin-left: 14px; }

.unit {
  position: absolute;
  right: 0;
  bottom: 0;
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.field .rel { position: relative; }

/* 类型选择 */
.type-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line-2);
}
.type-opt {
  border-radius: 12px;
  border: 1.5px solid var(--line);
  padding: 10px 11px;
  text-align: left;
  background: var(--surface);
  transition: border-color .15s, background .15s;
}
.type-opt b { display: block; font-size: 13px; font-weight: 650; }
.type-opt i { display: block; font-style: normal; font-size: 10px; color: var(--faint); margin-top: 2px; }
.type-opt.on { border-color: var(--brand); background: var(--brand-soft); }
.type-opt.on b { color: var(--brand); }

/* 开关 */
.switch {
  position: relative;
  width: 44px;
  height: 26px;
  border-radius: 100px;
  background: var(--line);
  flex: none;
  transition: background .2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  transition: transform .2s cubic-bezier(.3, .8, .3, 1);
}
.switch.on { background: var(--brand); }
.switch.on::after { transform: translateX(18px); }

.sw-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-2);
  width: 100%;
  text-align: left;
}
.sw-row:last-child { border-bottom: 0; }
.sw-row .txt { flex: 1; min-width: 0; }
.sw-row .txt b { display: block; font-size: 14px; font-weight: 600; }
.sw-row .txt i { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }

/* 分段控制 */
.seg {
  display: flex;
  gap: 3px;
  background: var(--surface-2);
  border-radius: 11px;
  padding: 3px;
  margin-bottom: 12px;
}
.seg button {
  flex: 1;
  height: 32px;
  border-radius: 9px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  transition: background .15s, color .15s;
}
.seg button.on { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-sm); }

/* 搜索 */
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border-radius: 13px;
  padding: 0 13px;
  height: 44px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 12px;
}

<script>/**
 * 被动收入小账本 · 计算内核（纯函数，无任何 UI / 存储依赖）
 * 小程序与 Node 单元测试共用同一份代码，保证“算得对”。
 *
 * 统一规则（单利）：
 *   每日收益 = 生效本金 × 生效年利率(%) ÷ 100 ÷ 365
 *   有到期日资产：计息区间为 起息日 ~ 到期日的前一天，到期日当天起不再计息
 *   无到期日资产：起息日起持续计息
 *   本金 / 利率变更：通过 segments（时间分段）记录，变更日次日按新参数计息
 */

var MS_DAY = 86400000;

function pad2(n) {
  return n < 10 ? '0' + n : '' + n;
}

/** 'YYYY-MM-DD' -> UTC 毫秒；非法返回 null */
function parseDate(key) {
  if (!key) return null;
  var p = String(key).slice(0, 10).split('-');
  if (p.length !== 3) return null;
  var y = parseInt(p[0], 10);
  var m = parseInt(p[1], 10);
  var d = parseInt(p[2], 10);
  if (!y || !m || !d) return null;
  var t = Date.UTC(y, m - 1, d);
  return isNaN(t) ? null : t;
}

/** UTC 毫秒 -> 'YYYY-MM-DD' */
function toKey(ms) {
  var d = new Date(ms);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

function isDateKey(key) {
  return parseDate(key) !== null;
}

/** 日期加减天数，返回 'YYYY-MM-DD' */
function addDays(key, n) {
  var t = parseDate(key);
  if (t === null) return key;
  return toKey(t + n * MS_DAY);
}

/** b - a 的天数差（可为负） */
function diffDays(a, b) {
  var ta = parseDate(a);
  var tb = parseDate(b);
  if (ta === null || tb === null) return 0;
  return Math.round((tb - ta) / MS_DAY);
}

/** 本地“今天”，'YYYY-MM-DD' */
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function monthStartOf(key) {
  return String(key).slice(0, 7) + '-01';
}

function yearStartOf(key) {
  return String(key).slice(0, 4) + '-01-01';
}

/**
 * 取资产的计息分段（按 from 升序）。
 * 兼容只有 principal / rate 的老数据（自动补一段）。
 */
function segmentsOf(asset) {
  if (!asset) return [];
  var raw = Array.isArray(asset.segments) ? asset.segments : [];
  var segs = [];
  for (var i = 0; i < raw.length; i++) {
    var s = raw[i];
    if (!s || !isDateKey(s.from)) continue;
    segs.push({
      from: String(s.from).slice(0, 10),
      principal: Number(s.principal) || 0,
      rate: Number(s.rate) || 0
    });
  }
  if (!segs.length && asset.startDate && isDateKey(asset.startDate)) {
    segs.push({
      from: String(asset.startDate).slice(0, 10),
      principal: Number(asset.principal) || 0,
      rate: Number(asset.rate) || 0
    });
  }
  segs.sort(function (a, b) {
    if (a.from < b.from) return -1;
    if (a.from > b.from) return 1;
    return 0;
  });
  return segs;
}

/**
 * 某个日期生效的本金与利率。
 * 早于第一段时沿用第一段（用于展示“当前本金”）；晚于最后一段沿用最后一段。
 */
function effective(asset, dateKey) {
  var segs = segmentsOf(asset);
  if (!segs.length) return { principal: 0, rate: 0, from: '' };
  var k = dateKey || todayKey();
  var cur = segs[0];
  for (var i = 0; i < segs.length; i++) {
    if (segs[i].from <= k) cur = segs[i];
    else break;
  }
  return { principal: cur.principal, rate: cur.rate, from: cur.from };
}

/** 当前本金（按今天） */
function currentPrincipal(asset, dateKey) {
  return effective(asset, dateKey || todayKey()).principal;
}

/**
 * 尚未生效的分段（今天之后才起算的本金/利率调整），用于提示“明日起按新参数计息”
 */
function pendingSegment(asset, dateKey) {
  var k = dateKey || todayKey();
  var segs = segmentsOf(asset);
  for (var i = 0; i < segs.length; i++) {
    if (segs[i].from > k) return segs[i];
  }
  return null;
}

/**
 * 计息窗口：起息日 ~ 到期日的前一天（被 untilKey 截断）。
 * 返回 null 表示该日期尚无收益。
 */
function accrualWindow(asset, untilKey) {
  if (!asset || !isDateKey(asset.startDate)) return null;
  var from = String(asset.startDate).slice(0, 10);
  var to = untilKey;
  if (asset.endDate && isDateKey(asset.endDate)) {
    var lastAccrual = addDays(String(asset.endDate).slice(0, 10), -1);
    if (lastAccrual < to) to = lastAccrual;
  }
  if (!to || to < from) return null;
  return { from: from, to: to };
}

/** 某一天的单日收益（不含该日则为 0） */
function dailyIncome(asset, dateKey) {
  var k = dateKey;
  var w = accrualWindow(asset, k);
  if (!w) return 0;
  if (k < w.from || k > w.to) return 0;
  var eff = effective(asset, k);
  return eff.principal * (eff.rate / 100) / 365;
}

/**
 * 区间 [fromKey, toKey] 内的收益合计（按分段逐段累加，段内按天数乘日收益）
 */
function incomeBetween(asset, fromKey, toKey) {
  if (!fromKey || !toKey || toKey < fromKey) return 0;
  var w = accrualWindow(asset, toKey);
  if (!w) return 0;
  var from = w.from > fromKey ? w.from : fromKey;
  var to = w.to;
  if (to < from) return 0;
  var segs = segmentsOf(asset);
  if (!segs.length) return 0;
  var total = 0;
  for (var i = 0; i < segs.length; i++) {
    var segFrom = segs[i].from;
    var segTo = i + 1 < segs.length ? addDays(segs[i + 1].from, -1) : null;
    var f = segFrom > from ? segFrom : from;
    var t = segTo === null ? to : segTo < to ? segTo : to;
    if (t < f) continue;
    var days = diffDays(f, t) + 1;
    total += days * segs[i].principal * (segs[i].rate / 100) / 365;
  }
  return total;
}

/** 累计已产生收益（起息日 ~ 今天，含今天；到期后自动封顶） */
function accruedIncome(asset, today) {
  var k = today || todayKey();
  return incomeBetween(asset, String(asset.startDate || '').slice(0, 10), k);
}

/** 已计息天数 */
function daysAccrued(asset, today) {
  var w = accrualWindow(asset, today || todayKey());
  if (!w) return 0;
  return diffDays(w.from, w.to) + 1;
}

/** 当天是否处于计息状态 */
function isActive(asset, dateKey) {
  var k = dateKey || todayKey();
  if (!isDateKey(asset.startDate) || k < String(asset.startDate).slice(0, 10)) return false;
  if (asset.endDate && isDateKey(asset.endDate) && k >= String(asset.endDate).slice(0, 10)) return false;
  return true;
}

function hasEndDate(asset) {
  return !!(asset && asset.endDate && isDateKey(asset.endDate));
}

/** 汇总：今日 / 本月 / 本年 / 累计 / 本金 */
function summarize(assets, today) {
  var k = today || todayKey();
  var list = Array.isArray(assets) ? assets : [];
  var mStart = monthStartOf(k);
  var yStart = yearStartOf(k);
  var rows = [];
  var todayTotal = 0;
  var monthTotal = 0;
  var yearTotal = 0;
  var allTotal = 0;
  var principalTotal = 0;
  var activeCount = 0;

  for (var i = 0; i < list.length; i++) {
    var a = list[i];
    var t = dailyIncome(a, k);
    var acc = accruedIncome(a, k);
    var m = incomeBetween(a, mStart, k);
    var y = incomeBetween(a, yStart, k);
    var p = currentPrincipal(a, k);
    var active = isActive(a, k);
    todayTotal += t;
    monthTotal += m;
    yearTotal += y;
    allTotal += acc;
    principalTotal += p;
    if (active) activeCount++;
    rows.push({
      id: a.id,
      asset: a,
      name: a.name,
      today: t,
      month: m,
      year: y,
      accrued: acc,
      principal: p,
      days: daysAccrued(a, k),
      active: active,
      rate: effective(a, k).rate
    });
  }

  rows.sort(function (a, b) {
    if (b.today !== a.today) return b.today - a.today;
    return b.accrued - a.accrued;
  });

  return {
    date: k,
    rows: rows,
    todayTotal: todayTotal,
    monthTotal: monthTotal,
    yearTotal: yearTotal,
    allTotal: allTotal,
    principalTotal: principalTotal,
    activeCount: activeCount,
    count: list.length,
    // 年化视角的两个参考值
    monthAvgDaily: 0
  };
}

/** 近 n 天每日总收益序列（含今天），用于折线/柱状图 */
function historySeries(assets, today, days) {
  var k = today || todayKey();
  var n = days || 30;
  var out = [];
  for (var i = n - 1; i >= 0; i--) {
    var d = addDays(k, -i);
    var total = 0;
    for (var j = 0; j < (assets || []).length; j++) {
      total += dailyIncome(assets[j], d);
    }
    out.push({ date: d, total: total });

/** 某一天的资产明细（只列当日有收益的） */
function breakdown(assets, dateKey) {

  for (var i = 0; i < (assets || []).length; i++) {
    var a = assets[i];
    var v = dailyIncome(a, dateKey);
    if (v > 0) out.push({ id: a.id, asset: a, name: a.name, today: v });
  }
  out.sort(function (a, b) { return b.today - a.today; });
  return out;
}

/**
 * 到期提醒分组
 * soon: 0~7 天；later: 8~30 天；expired: 已到期（近 90 天内）
 */
function reminderGroups(assets, today, opts) {
  var k = today || todayKey();
  var o = opts || {};
  var soon = [];
  var later = [];
  var expired = [];
  var list = Array.isArray(assets) ? assets : [];
  for (var i = 0; i < list.length; i++) {
    var a = list[i];
    if (!hasEndDate(a)) continue;
    if (o.remindOnly !== false && a.remind === false) continue;
    var left = diffDays(k, String(a.endDate).slice(0, 10));
    var item = { id: a.id, asset: a, name: a.name, endDate: a.endDate, daysLeft: left, remind: a.remind !== false };
    if (left < 0) {
      if (left >= -90) expired.push(item);
    } else if (left <= 7) {
      soon.push(item);
    } else if (left <= 30) {
      later.push(item);
    } else if (o.remindOnly === false) {
      later.push(item);
    }
  }
  function byLeft(a, b) { return a.daysLeft - b.daysLeft; }
  soon.sort(byLeft);
  later.sort(byLeft);
  expired.sort(function (a, b) { return b.daysLeft - a.daysLeft; });
  return { soon: soon, later: later, expired: expired, today: k };
}

/** 金额格式化：千分位 + 固定小数位 */
function fmtMoney(n, decimals) {
  var d = decimals === undefined || decimals === null ? 2 : Number(decimals);
  if (!(d >= 0 && d <= 6)) d = 2;
  var v = Number(n);
  if (!isFinite(v)) v = 0;
  var neg = v < 0;
  var fixed = Math.abs(v).toFixed(d);
  var parts = fixed.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/** 中文日期：2026年10月22日 */
function fmtDateCN(key) {
  var t = parseDate(key);
  if (t === null) return '';
  var d = new Date(t);
  return d.getUTCFullYear() + '年' + (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日';
}

function fmtDateShort(key) {
  var t = parseDate(key);
  if (t === null) return '';
  var d = new Date(t);
  return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日';
}

/**
 * 表单校验（新增 / 编辑共用），返回 { ok, errors }
 */
function validateAsset(draft) {
  var errors = {};
  var d = draft || {};
  var name = String(d.name || '').trim();
  if (!name) errors.name = '请填写资产名称';
  if (name.length > 30) errors.name = '名称请控制在 30 字以内';

  var p = Number(d.principal);
  if (!isFinite(p) || p <= 0) errors.principal = '本金需为大于 0 的数字';
  if (p > 1000000000000) errors.principal = '本金数值过大';

  var r = Number(d.rate);
  if (!isFinite(r) || r < 0) errors.rate = '年利率不能为负数';
  if (r > 100) errors.rate = '年利率请填写百分数（如 3.5）';

  if (!isDateKey(d.startDate)) errors.startDate = '请选择起息日期';

  var needEnd = d.type === 'fixed' || (d.type === 'custom' && d.hasEndDate);
  if (needEnd) {
    if (!isDateKey(d.endDate)) errors.endDate = '请选择到期日期';
    else if (isDateKey(d.startDate) && diffDays(d.startDate, d.endDate) <= 0) {
      errors.endDate = '到期日期需晚于起息日期';
    }
  }
  if (d.endDate && isDateKey(d.endDate) && isDateKey(d.startDate) && diffDays(d.startDate, d.endDate) <= 0) {
    errors.endDate = '到期日期需晚于起息日期';
  }
  return { ok: Object.keys(errors).length === 0, errors: errors };
}

/** 把表单数据整理成资产对象（新增用） */
function buildAsset(draft, id, now) {
  var d = draft || {};
  var startDate = String(d.startDate || '').slice(0, 10);
  var principal = Number(d.principal) || 0;
  var rate = Number(d.rate) || 0;
  var endDate = d.type === 'fixed' || (d.type === 'custom' && d.hasEndDate) ? String(d.endDate || '').slice(0, 10) : '';
  return {
    id: id || newId(),
    type: d.type || 'fixed',
    name: String(d.name || '').trim(),
    note: String(d.note || '').trim(),
    startDate: startDate,
    endDate: endDate,
    remind: d.remind !== false,
    principal: principal,
    rate: rate,
    segments: [{ from: startDate, principal: principal, rate: rate }],
    createdAt: now || Date.now(),
    updatedAt: now || Date.now()

}

var idSeq = 0;
function newId() {
  idSeq = (idSeq + 1) % 100000;
  return 'a' + Date.now().toString(36) + idSeq.toString(36) + Math.random().toString(36).slice(2, 6);
}

var api = {
  MS_DAY: MS_DAY,
  parseDate: parseDate,
  toKey: toKey,
  isDateKey: isDateKey,
  addDays: addDays,
  diffDays: diffDays,
  todayKey: todayKey,
  monthStartOf: monthStartOf,
  yearStartOf: yearStartOf,
  segmentsOf: segmentsOf,
  effective: effective,
  currentPrincipal: currentPrincipal,
  pendingSegment: pendingSegment,
  accrualWindow: accrualWindow,
  dailyIncome: dailyIncome,
  incomeBetween: incomeBetween,
  accruedIncome: accruedIncome,
  daysAccrued: daysAccrued,
  isActive: isActive,
  hasEndDate: hasEndDate,
  summarize: summarize,
  historySeries: historySeries,
  breakdown: breakdown,
  reminderGroups: reminderGroups,
  fmtMoney: fmtMoney,
  fmtDateCN: fmtDateCN,
  fmtDateShort: fmtDateShort,
  validateAsset: validateAsset,
  buildAsset: buildAsset,
  newId: newId
};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = api;
}
if (typeof window !== 'undefined') {
  window.PILCalc = api;
}

<script>/**
 * 被动收入小账本 · 数据层
 * 只依赖注入进来的 storage（小程序用 wx.getStorageSync / setStorageSync，
 * 浏览器预览用 localStorage），因此可以在 Node 里完整跑单元测试。
 */

var calc = (typeof require === 'function') ? require('./calc.js') : window.PILCalc;

var KEY_ASSETS = 'pil_assets_v1';
var KEY_SETTINGS = 'pil_settings_v1';

var DEFAULT_SETTINGS = {
  decimals: 2,        // 收益小数位
  notify: true,       // 到期提醒总开关
  goalDaily: 0        // 每日被动收入目标（可选）
};

function clone(o) {
  return JSON.parse(JSON.stringify(o));
}

function createStore(storage) {
  var st = storage || { get: function () { return null; }, set: function () {} };

  function readRaw(key, fallback) {
    var v;
    try {
      v = st.get(key);
    } catch (e) {
      v = null;
    }
    if (v === '' || v === null || v === undefined) return fallback;
    if (typeof v === 'string') {
      try {
        v = JSON.parse(v);
      } catch (e2) {
        return fallback;
      }
    }
    return v === null || v === undefined ? fallback : v;
  }

  function writeRaw(key, value) {
    try {
      st.set(key, value);
    } catch (e) { /* 存储写满等异常不阻断 UI */ }
  }

  /* ---------------- 资产 ---------------- */

  function listAssets() {
    var arr = readRaw(KEY_ASSETS, []);
    if (!Array.isArray(arr)) arr = [];
    // 过滤脏数据，避免一条坏记录让整个列表崩掉
    return arr.filter(function (a) {
      return a && a.id && a.startDate && calc.isDateKey(a.startDate);
    });
  }

  function saveAssets(list) {
    writeRaw(KEY_ASSETS, list || []);
    return list || [];
  }

  function getAsset(id) {
    var list = listAssets();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function addAsset(draft) {
    var asset = calc.buildAsset(draft);
    var list = listAssets();
    list.push(asset);
    saveAssets(list);
    return asset;
  }

  /**
   * 编辑资产。
   * 本金 / 利率发生变化时，按“次日生效”追加一个计息分段（历史收益不被篡改）。
   */
  function updateAsset(id, patch, options) {
    var list = listAssets();
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { idx = i; break; }
    }
    if (idx < 0) return null;

    var cur = list[idx];
    var today = (options && options.today) || calc.todayKey();
    var effFrom = (options && options.effectiveFrom) || calc.addDays(today, 1);
    var eff = calc.effective(cur, today);

    var next = clone(cur);
    var keys = ['type', 'name', 'note', 'startDate', 'endDate', 'remind'];
    for (var k = 0; k < keys.length; k++) {
      if (patch[keys[k]] !== undefined) next[keys[k]] = patch[keys[k]];
    }
    if (next.name) next.name = String(next.name).trim();
    if (next.startDate) next.startDate = String(next.startDate).slice(0, 10);
    next.endDate = next.endDate ? String(next.endDate).slice(0, 10) : '';
    next.remind = next.remind !== false;

    var newPrincipal = patch.principal !== undefined ? Number(patch.principal) : eff.principal;
    var newRate = patch.rate !== undefined ? Number(patch.rate) : eff.rate;
    if (!isFinite(newPrincipal)) newPrincipal = eff.principal;
    if (!isFinite(newRate)) newRate = eff.rate;

    var changed = (newPrincipal !== eff.principal) || (newRate !== eff.rate);
    var segs = calc.segmentsOf(cur).map(function (s) {
      return { from: s.from, principal: s.principal, rate: s.rate };
    });

    if (!segs.length) {
      segs = [{ from: next.startDate, principal: newPrincipal, rate: newRate }];
    } else if (changed) {
      if (effFrom <= segs[0].from) {
        // 起息日在未来 / 变更日期早于首段，直接改首段
        segs[0] = { from: segs[0].from, principal: newPrincipal, rate: newRate };
      } else {
        var kept = segs.filter(function (s) { return s.from !== effFrom; });
        kept.push({ from: effFrom, principal: newPrincipal, rate: newRate });
        kept.sort(function (a, b) { return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
        segs = kept;
      }
    }

    // 用户把起息日往前改：把首段起点一起对齐，避免出现“无分段覆盖”的空档
    if (next.startDate && segs.length && segs[0].from !== next.startDate && segs[0].from > next.startDate) {
      segs[0] = { from: next.startDate, principal: segs[0].principal, rate: segs[0].rate };
    }

    next.segments = segs;
    var last = segs[segs.length - 1];
    next.principal = last.principal;
    next.rate = last.rate;
    next.updatedAt = Date.now();

    list[idx] = next;
    saveAssets(list);
    return next;
  }

  /** 删除资产（返回是否真的删掉了） */
  function removeAsset(id) {
    if (!id) return false;
    var list = listAssets();
    var next = list.filter(function (a) { return a.id !== id; });
    if (next.length === list.length) return false;
    saveAssets(next);
    return true;
  }

  function removeAllAssets() {
    saveAssets([]);
    return true;
  }

  /** 快速调整本金（转入 / 转出），次日生效 */
  function setPrincipal(id, principal, options) {
    return updateAsset(id, { principal: Number(principal) }, options);
  }

  /** 快速调整利率，次日生效 */
  function setRate(id, rate, options) {
    return updateAsset(id, { rate: Number(rate) }, options);
  }

  function toggleRemind(id, remind) {
    var list = listAssets();
    var out = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].remind = remind !== false;
        out = list[i];
        break;
      }
    }
    if (out) saveAssets(list);
    return out;
  }

  function searchAssets(keyword) {
    var q = String(keyword || '').trim().toLowerCase();
    var list = listAssets();
    if (!q) return list;
    return list.filter(function (a) {
      return String(a.name || '').toLowerCase().indexOf(q) >= 0
        || String(a.note || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  /* ---------------- 设置 ---------------- */

  function getSettings() {
    var s = readRaw(KEY_SETTINGS, {}) || {};
    var out = clone(DEFAULT_SETTINGS);
    if (s && typeof s === 'object') {
      if (typeof s.decimals === 'number') out.decimals = Math.min(4, Math.max(0, Math.round(s.decimals)));
      if (typeof s.notify === 'boolean') out.notify = s.notify;
      if (typeof s.goalDaily === 'number' && s.goalDaily >= 0) out.goalDaily = s.goalDaily;
    }
    return out;
  }

  function saveSettings(patch) {
    var cur = getSettings();
    var next = clone(cur);
    if (patch && typeof patch === 'object') {
      for (var k in patch) {
        if (Object.prototype.hasOwnProperty.call(patch, k)) next[k] = patch[k];
      }
    }
    next.decimals = Math.min(4, Math.max(0, Math.round(Number(next.decimals) || 0)));
    next.goalDaily = Math.max(0, Number(next.goalDaily) || 0);
    next.notify = next.notify !== false;
    writeRaw(KEY_SETTINGS, next);
    return next;
  }

  /* ---------------- 备份 / 恢复 ---------------- */

  function exportBackup() {
    return {
      app: '被动收入小账本',
      version: 1,
      exportedAt: new Date().toISOString(),
      assets: listAssets(),
      settings: getSettings()
    };
  }

  /**
   * 导入备份。接受对象或 JSON 字符串。
   * mode: 'replace' 覆盖 | 'merge' 合并（按 id 去重）
   */
  function importBackup(payload, mode) {
    var data = payload;
    if (typeof data === 'string') {
      try {
        data = JSON.parse(data);
      } catch (e) {
        return { ok: false, error: '备份内容不是合法的 JSON' };
      }
    }
    if (!data || typeof data !== 'object') return { ok: false, error: '备份内容为空' };
    var incoming = Array.isArray(data.assets) ? data.assets : (Array.isArray(data) ? data : null);
    if (!incoming) return { ok: false, error: '备份里没有找到资产数据' };

    var cleaned = incoming.filter(function (a) {
      return a && a.id && a.startDate && calc.isDateKey(a.startDate);
    }).map(function (a) {
      var segs = calc.segmentsOf(a);
      var last = segs.length ? segs[segs.length - 1] : { principal: 0, rate: 0 };
      return {
        id: String(a.id),
        type: a.type || 'custom',
        name: String(a.name || '未命名资产').slice(0, 30),
        note: String(a.note || ''),
        startDate: String(a.startDate).slice(0, 10),
        endDate: a.endDate ? String(a.endDate).slice(0, 10) : '',
        remind: a.remind !== false,
        principal: Number(a.principal) || last.principal,
        rate: Number(a.rate) || last.rate,
        segments: segs,
        createdAt: a.createdAt || Date.now(),
        updatedAt: a.updatedAt || Date.now()
      };
    });

    if (mode === 'merge') {
      var map = {};
      var base = listAssets();
      for (var i = 0; i < base.length; i++) map[base[i].id] = base[i];
      for (var j = 0; j < cleaned.length; j++) map[cleaned[j].id] = cleaned[j];
      var merged = [];
      for (var key in map) {
        if (Object.prototype.hasOwnProperty.call(map, key)) merged.push(map[key]);
      }
      saveAssets(merged);
    } else {
      saveAssets(cleaned);
    }

    if (data.settings && typeof data.settings === 'object') {
      saveSettings(data.settings);
    }
    return { ok: true, count: cleaned.length, total: listAssets().length, mode: mode === 'merge' ? 'merge' : 'replace' };
  }

  return {
    KEY_ASSETS: KEY_ASSETS,
    KEY_SETTINGS: KEY_SETTINGS,
    listAssets: listAssets,
    getAsset: getAsset,
    addAsset: addAsset,
    updateAsset: updateAsset,
    removeAsset: removeAsset,
    removeAllAssets: removeAllAssets,
    setPrincipal: setPrincipal,
    setRate: setRate,
    toggleRemind: toggleRemind,
    searchAssets: searchAssets,
    getSettings: getSettings,
    saveSettings: saveSettings,
    exportBackup: exportBackup,
    importBackup: importBackup,
    saveAssets: saveAssets
  };
}

var api = { createStore: createStore, DEFAULT_SETTINGS: DEFAULT_SETTINGS };
if (typeof module !== 'undefined' && module.exports) {
  module.exports = api;
}
if (typeof window !== 'undefined') {
  window.PILStore = api;
}
</script>
<script>/**
 * 被动收入小账本 · 视图模型
 * 把 calc 的纯计算转成界面可以直接用的数值 / 文案，页面层只负责拼 HTML。
 */
(function (global) {
  'use strict';

  var calc = global.PILCalc;

  var TYPES = [
    { key: 'fixed', text: '银行定期', short: '定期', hint: '本金、利率、起止日期，到期停止计息' },
    { key: 'current', text: '活期 / 余额宝', short: '活期', hint: '随存随取，按日计息，无到期日' },
    { key: 'fund', text: '公积金', short: '公积金', hint: '按账户余额与年利率持续计息' },
    { key: 'custom', text: '自定义', short: '自定义', hint: '大额存单、国债等，可自选有无到期日' }
  ];

  function typeOf(key) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].key === key) return TYPES[i];
    return TYPES[TYPES.length - 1];
  }

  function dec(settings) {
    var d = settings && typeof settings.decimals === 'number' ? settings.decimals : 2;
    return Math.min(4, Math.max(0, Math.round(d)));
  }

  function money(n, settings) {
    return calc.fmtMoney(n, dec(settings));
  }

  function trim(n) {
    var v = Number(n) || 0;
    if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
    return String(Math.round(v * 10000) / 10000);
  }

  function pct(n) {
    return trim(n) + '%';
  }

  /** 星期几 */
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function weekOf(key) {
    var t = calc.parseDate(key);
    if (t === null) return '';
    return WEEK[new Date(t).getUTCDay()];
  }

  /** 某条资产的展示行 */
  function rowOf(r, settings, today) {
    var k = today || calc.todayKey();
    var a = r.asset;
    var d = dec(settings);
    var leftText = '';
    var leftDays = null;
    if (calc.hasEndDate(a)) {
      leftDays = calc.diffDays(k, a.endDate);
      if (leftDays > 0) leftText = '还有 ' + leftDays + ' 天到期';
      else if (leftDays === 0) leftText = '今天到期';
      else leftText = '已于 ' + calc.fmtDateShort(a.endDate) + ' 到期';
    }
    var pending = calc.pendingSegment(a, k);
    return {
      id: a.id,
      name: a.name,
      type: a.type,
      typeText: typeOf(a.type).short,
      note: a.note || '',
      principal: r.principal,
      principalText: money(r.principal, settings),
      rateText: trim(r.rate),
      today: r.today,
      todayText: money(r.today, settings),
      accruedText: money(r.accrued, settings),
      days: r.days,
      active: !!r.active,
      hasEnd: calc.hasEndDate(a),
      endDate: a.endDate || '',
      endText: a.endDate ? calc.fmtDateCN(a.endDate) : '',
      startText: calc.fmtDateCN(a.startDate),
      leftText: leftText,
      daysLeft: leftDays,
      remind: a.remind !== false,
      pendingText: pending
        ? '明日起按 ¥' + money(pending.principal, settings) + ' · ' + trim(pending.rate) + '% 计息'
        : ''
    };
  }

  /** 首页总览 */
  function dashboard(assets, settings, today) {
    var k = today || calc.todayKey();
    var s = calc.summarize(assets, k);
    var d = dec(settings);
    var list = s.rows.map(function (r) { return rowOf(r, settings, k); });

    // 到期提醒（受总开关与单条开关双重控制）
    var notifyOn = !(settings && settings.notify === false);
    var groups = calc.reminderGroups(assets, k, { remindOnly: false });
    var soon = notifyOn ? groups.soon.filter(function (i) { return i.remind; }) : [];
    var soonText = '';
    if (soon.length) {
      var f = soon[0];
      soonText = '《' + f.name + '》' + (f.daysLeft === 0 ? '今天到期' : f.daysLeft + ' 天后到期')
        + (soon.length > 1 ? ' 等 ' + soon.length + ' 笔资产即将到期' : '，请留意资金安排');
    }

    var goal = settings && settings.goalDaily ? Number(settings.goalDaily) : 0;
    var goalData = null;
    if (goal > 0) {
      var pctV = Math.min(100, Math.round((s.todayTotal / goal) * 100));
      goalData = {
        goalText: money(goal, settings),
        pct: pctV,
        reached: s.todayTotal >= goal,
        gapText: s.todayTotal >= goal
          ? '已达成，超出 ¥' + money(s.todayTotal - goal, settings) + ' / 天'
          : '还差 ¥' + money(goal - s.todayTotal, settings) + ' / 天'
      };
    }

    return {
      date: k,
      dateText: calc.fmtDateCN(k),
      weekText: weekOf(k),
      todayTotal: s.todayTotal,
      todayText: money(s.todayTotal, settings),
      monthText: money(s.monthTotal, settings),
      yearText: money(s.yearTotal, settings),
      allText: money(s.allTotal, settings),
      principalText: money(s.principalTotal, settings),
      yearForecastText: money(s.todayTotal * 365, settings),
      monthForecastText: money(s.todayTotal * 30, settings),
      count: s.count,
      activeCount: s.activeCount,
      rows: list,
      goal: goalData,
      soonCount: soon.length,
      soonText: soonText,
      notifyOn: notifyOn
    };
  }

  /** 近 n 天序列（升序，含今天） */
  function series(assets, today, n) {
    var k = today || calc.todayKey();
    var raw = calc.historySeries(assets, k, n || 30);
    var max = 0;
    for (var i = 0; i < raw.length; i++) if (raw[i].total > max) max = raw[i].total;
    return raw.map(function (p, idx) {
      return {
        date: p.date,
        total: p.total,
        max: max,
        label: calc.fmtDateShort(p.date),
        isToday: idx === raw.length - 1,
        weekText: weekOf(p.date),
        pctOfMax: max > 0 ? p.total / max : 0
      };
    });
  }

  /** 到期提醒分桶 */
  function reminders(assets, settings, today) {
    var k = today || calc.todayKey();
    var g = calc.reminderGroups(assets, k, { remindOnly: false });
    var d = dec(settings);
    function map(items) {
      return items.map(function (it) {
        var a = it.asset;
        return {
          id: it.id,
          name: it.name,
          endDate: it.endDate,
          endText: calc.fmtDateCN(it.endDate),
          daysLeft: it.daysLeft,
          remind: it.remind,
          principalText: money(calc.currentPrincipal(a, k), settings),
          typeText: typeOf(a.type).short
        };
      });
    }
    return {
      today: k,
      notifyOn: !(settings && settings.notify === false),
      soon: map(g.soon),
      later: map(g.later),
      expired: map(g.expired)
    };
  }

  /** 到期日 + 预估利息（编辑页实时预览用） */
  function preview(draft, settings, today) {
    var k = today || calc.todayKey();
    var p = Number(draft.principal) || 0;
    var r = Number(draft.rate) || 0;
    var daily = p * (r / 100) / 365;
    var out = {
      daily: daily,
      dailyText: money(daily, settings),
      monthText: money(daily * 30, settings),
      yearText: money(daily * 365, settings),
      days: null,
      totalText: '',
      valid: p > 0
    };
    if (draft.endDate && calc.isDateKey(draft.endDate) && calc.isDateKey(draft.startDate)) {
      var days = calc.diffDays(draft.startDate, draft.endDate);
      if (days > 0) {
        out.days = days;
        out.totalText = money(daily * days, settings);
      }
    }
    return out;
  }

  global.PILModel = {
    TYPES: TYPES,
    typeOf: typeOf,
    dec: dec,
    money: money,
    trim: trim,
    pct: pct,
    weekOf: weekOf,
    rowOf: rowOf,
    dashboard: dashboard,
    series: series,
    reminders: reminders,
    preview: preview
  };
})(window);
