<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡带俱乐部 · 红白机模拟器 · 示例预览</title><style>*{box-sizing:border-box}body{margin:0;background:var(--bg,#f6f5f1);color:var(--ink,#2d3431);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dedfd9;border-radius:9px;background:white;padding:9px 14px;color:inherit}button:hover{filter:brightness(.97)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.shell{display:grid;grid-template-columns:180px 1fr;min-height:100vh}aside{padding:32px 22px;background:#ffffff88;border-right:1px solid #e1e3dc}aside strong{font-size:23px;display:block;line-height:1.2}aside small{color:#7f8780;font-size:10px;letter-spacing:2px}nav{display:grid;gap:12px;margin-top:46px}nav a{color:inherit;text-decoration:none;padding:10px;border-radius:8px}nav a:first-child{color:var(--accent);background:#fff}aside p{font-size:12px;color:#858982;margin-top:100px}main{padding:30px 34px;min-width:0;max-width:1500px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}header small,.muted{color:#8c918b}h1{font-size:30px;letter-spacing:-1px;line-height:1.25;margin:7px 0}h2{font-size:18px;line-height:1.4}p{margin:10px 0}section,.card{border:1px solid #e1e3dc;border-radius:14px;background:#fff;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{grid-template-columns:1fr 1fr}.stat b{font-size:29px;display:block;line-height:1.6}.stat small{color:#969b94}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.list{display:grid;gap:0}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 0;border-bottom:1px solid #eef0e9}.row:last-child{border-bottom:0}.row small{color:#90978e}.pill{font-size:11px;border-radius:30px;background:var(--soft,#eee);color:var(--accent);padding:4px 9px}.hero{background:var(--accent);color:white;padding:30px;border-radius:15px}.hero p{opacity:.8}.progress{height:7px;background:#e8ebe3;border-radius:10px;overflow:hidden;margin-top:15px}.progress span{display:block;background:var(--accent);height:100%;width:62%}.note{min-height:190px;background:#fff7d9;padding:22px;border:0;box-shadow:0 5px 14px #33333309;transform:rotate(-1deg)}.note:nth-child(2){background:#e3eee7;transform:rotate(2deg)}.note:nth-child(3){background:#ede7f3}.editor{width:100%;height:200px;resize:vertical;border:0;outline:0;background:transparent;line-height:2;color:inherit}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{height:67px;padding:8px;background:#f7f8f4;border-radius:5px}.day:nth-child(11){background:var(--soft);color:var(--accent)}.day em{display:block;font-size:9px;font-style:normal;background:var(--soft);margin-top:3px;white-space:nowrap}.photos{columns:3;gap:12px}.photos button{display:block;padding:0;border:0;margin:0 0 12px;background:none;width:100%}.photos img{width:100%;border-radius:10px;display:block}.screen{min-height:330px;border-radius:12px;background:#131a28;color:#eee;padding:30px;position:relative;overflow:hidden}.game-scene{width:100%;height:240px;display:block}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263930;color:white;padding:10px 18px;border-radius:40px;display:none;z-index:10}.preview{position:fixed;right:15px;bottom:12px;font-size:10px;color:#8b928b;background:#ffffffde;padding:4px 9px;border-radius:20px}.checked{text-decoration:line-through;color:#9ba399}.lightbox{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:15}.lightbox img{max-width:85vw;max-height:85vh}.lightbox button{position:absolute;right:20px;top:20px}@media(max-width:640px){.shell{grid-template-columns:1fr}aside{padding:18px 22px;border-bottom:1px solid #ddd}aside strong{font-size:20px}aside small,aside p,nav{display:none}main{padding:22px 18px}h1{font-size:25px}.grid{grid-template-columns:1fr}.grid.two{grid-template-columns:1fr}.photos{columns:2}.day{height:55px;padding:4px}.calendar{font-size:11px}header{align-items:flex-start}.preview{position:static;text-align:center}.screen{min-height:280px}}</style></head><body style="--accent:#665d9e;--soft:#efebfa"><div class="shell"><aside><strong>卡带俱乐部</strong><small>ONE MORE GAME</small><nav><a href="#">我的游戏库</a><a href="#">最近游玩</a><a href="#">即时存档</a></nav><p>给喜欢的生活<br>留一点空间。</p></aside><main><header><div><small>ONE MORE GAME</small><h1>今天，玩哪一张卡带？</h1><p class="muted">熟悉的手柄，新的小小收藏。</p></div><button class="primary" data-tip="安装后上传自己的 ROM 文件">＋ 上传卡带</button></header><div class="screen" style="text-align:center;display:grid;place-content:center"><div style="font-size:56px;letter-spacing:10px">＋ ●●</div><h2>把你的第一张卡带放进来</h2><p style="color:#a9a9bd">上传自己持有的 .nes ROM，开始游玩。</p><p style="color:#a9a9bd">模板不附带游戏 ROM</p></div><div class="section-title"><h2>把游戏时间留给自己</h2><span class="muted">示例数据</span></div><div class="grid"><section class="stat"><small>即时存档</small><b>3 个槽位</b><span class="muted">每款游戏独立保存</span></section><section class="stat"><small>操作方式</small><b>键盘 / 触屏</b><span class="muted">八方向摇杆与连发</span></section><section class="stat"><small>游戏目录</small><b>随时整理</b><span class="muted">搜索、置顶和改名</span></section></div></main></div><div class="preview">示例预览 · 操作仅在当前页面生效</div><div class="toast" role="status"></div><script>function tip(text){const t=document.querySelector('.toast');t.textContent=text;t.style.display='block';clearTimeout(window.tipTimer);window.tipTimer=setTimeout(()=>t.style.display='none',2000)}document.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>tip(b.dataset.tip));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{b.classList.toggle('checked');b.textContent=b.classList.contains('checked')?'✓ '+b.dataset.check:'○ '+b.dataset.check});document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{document.querySelector('.lightbox img').src=b.querySelector('img').src;document.querySelector('.lightbox').style.display='flex'});document.querySelectorAll('[contenteditable],textarea').forEach(e=>e.oninput=()=>tip('已更新本页示例'));document.querySelectorAll('nav a').forEach(e=>e.onclick=()=>tip(e.textContent+' · 示例页面'));</script></body></html>
