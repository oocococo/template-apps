<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>喵邻圈 · 济宁猫咪地图（Web 体验版）</title>
<meta name="description" content="喵邻圈 —— 济宁全市 11 区县的猫咪地图与养猫邻里圈。可在浏览器直接体验：地图找猫、发布求助、30 天养猫日更、41 条避坑干货。">
<style>
:root{
  --pink:#FF8A8A; --pink-l:#FFD3D3; --pink-xl:#FFF2F0;
  --mint:#8FD9B6; --mint-l:#D4F1E5;
  --orange:#FFB347; --orange-l:#FFE8CC;
  --cream:#FFF8F2; --card:#FFFFFF;
  --text:#4A3F3F; --text-l:#8B7E7E; --line:#F0E4DC;
  --red:#E85C5C; --yellow:#E8A33D; --green:#4FA97C;
  --sh:0 2px 10px rgba(255,138,138,.13);
  --sh2:0 6px 22px rgba(255,138,138,.20);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI Emoji","Apple Color Emoji",sans-serif;
  background:linear-gradient(160deg,#FFF0E8 0%,#FFF8F2 45%,#F1FAF5 100%);
  color:var(--text); display:flex; align-items:center; justify-content:center;
  padding:24px 20px; gap:34px; flex-wrap:wrap;
}

/* ============ 桌面说明面板 ============ */
.intro{width:330px; flex:0 0 auto}
.intro .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.intro .logo .mark{
  width:52px;height:52px;border-radius:16px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--pink),#FFB0A0);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:var(--sh2);
}
.intro .logo h1{font-size:23px;letter-spacing:1px}
.intro .logo p{font-size:12px;color:var(--text-l);margin-top:2px}
.intro h2{font-size:15px;margin:22px 0 10px;color:var(--pink);letter-spacing:.5px}
.intro .desc{font-size:13.5px;line-height:1.85;color:#5C5050}
.intro .desc b{color:var(--text)}
.icard{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px}
.icard .row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13px;line-height:1.6}
.icard .row + .row{border-top:1px dashed var(--line)}
.icard .row .ic{font-size:16px;width:22px;flex:0 0 auto;text-align:center}
.icard .row .tx b{display:block;font-size:13px;color:var(--text)}
.icard .row .tx span{font-size:11.5px;color:var(--text-l)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--pink-xl);color:#C46A6A;border:1px solid var(--pink-l)}
.tag.m{background:var(--mint-l);color:#3F8E68;border-color:#BCE9D5}
.tag.o{background:var(--orange-l);color:#B87A2A;border-color:#FBD9A8}
.note{font-size:11.5px;color:var(--text-l);line-height:1.75;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}

/* ============ 手机壳 ============ */
.phone{
  width:375px;height:790px;flex:0 0 auto;background:#1F1B1B;border-radius:42px;
  padding:11px;box-shadow:0 22px 60px rgba(120,80,80,.28),0 0 0 2px #2E2828 inset;
  position:relative;
}
.screen{
  width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--cream);
  display:flex;flex-direction:column;position:relative;
}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:26px;background:#1F1B1B;border-radius:0 0 18px 18px;z-index:60;
}

/* 顶部导航 */
.nav{
  flex:0 0 auto;padding:34px 16px 12px;
  background:linear-gradient(135deg,var(--pink),#FFA794);
  color:#fff;position:relative;
}
.nav .nt{font-size:19px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.nav .ns{font-size:11.5px;opacity:.92;margin-top:3px;letter-spacing:.5px}
.nav .nbadge{
  position:absolute;right:16px;top:36px;font-size:10.5px;background:rgba(255,255,255,.26);
  padding:4px 9px;border-radius:20px;letter-spacing:.5px;
}

/* 内容区 */
.body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 13px 14px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}

/* 底部 Tab */
.tabbar{
  flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);
  padding:6px 0 14px;box-shadow:0 -2px 10px rgba(255,138,138,.07);
}
.tabbar .tb{flex:1;text-align:center;font-size:10.5px;color:#B6A9A9;padding:2px 0;cursor:pointer;user-select:none;transition:.15s}
.tabbar .tb .ti{font-size:20px;display:block;line-height:1.25;filter:grayscale(.85);opacity:.5;transition:.15s}
.tabbar .tb.on{color:var(--pink);font-weight:700}
.tabbar .tb.on .ti{filter:none;opacity:1;transform:translateY(-1px)}

/* ============ 通用组件 ============ */
.card{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.sec-t{font-size:13px;font-weight:700;color:var(--text);margin:2px 0 9px;display:flex;align-items:center;gap:6px}
.sec-t .dot{width:4px;height:13px;border-radius:3px;background:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px}
.chips::-webkit-scrollbar{height:0}
.chip{
  flex:0 0 auto;font-size:12px;padding:5px 12px;border-radius:20px;background:#fff;
  border:1px solid var(--line);color:var(--text-l);cursor:pointer;white-space:nowrap;transition:.15s;
}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.chip.m.on{background:var(--mint);border-color:var(--mint)}
.chip.o.on{background:var(--orange);border-color:var(--orange)}

/* 地图 */
.mapwrap{
  background:linear-gradient(180deg,#EAF7F1 0%,#F3FBEF 100%);border-radius:16px;
  padding:6px 4px 2px;position:relative;overflow:hidden;border:1px solid #D8EFE3;
}
#mapSvg{width:100%;display:block;touch-action:manipulation}
#mapSvg .dz{fill:#FFF6F1;stroke:#F6CFCF;stroke-width:1.2;cursor:pointer;transition:.18s}
#mapSvg .dz.sel{fill:#FFD9D4;stroke:var(--pink);stroke-width:2.2}
#mapSvg .dzt{font-size:11px;fill:#9C8A8A;text-anchor:middle;pointer-events:none;font-weight:600}
#mapSvg .dzt.sel{fill:#C46A6A;font-size:12.5px}
#mapSvg .mk{cursor:pointer;stroke:#fff;stroke-width:1.6;transition:.15s}
#mapSvg .mk:hover{r:8}
#mapSvg .mkl{font-size:12px;text-anchor:middle;pointer-events:none}
.legend{display:flex;gap:11px;justify-content:center;padding:7px 0 3px;font-size:10.5px;color:#6E6363;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.statrow{display:flex;gap:8px;margin-bottom:10px}
.stat{
  flex:1;background:var(--card);border-radius:12px;padding:9px 4px;text-align:center;box-shadow:var(--sh);
}
.stat b{display:block;font-size:19px;color:var(--pink);line-height:1.2}
.stat span{font-size:10px;color:var(--text-l)}

/* 抽屉 */
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;
  padding:16px 16px 18px;box-shadow:0 -6px 26px rgba(120,80,80,.22);z-index:50;
  transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
}
.sheet.up{transform:translateY(0)}
.sheet .bar{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.sheet h3{font-size:16px;display:flex;align-items:center;gap:7px;margin-bottom:3px}
.sheet .sub{font-size:11.5px;color:var(--text-l);margin-bottom:10px}
.sheet .kv{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-top:1px dashed var(--line);align-items:flex-start}
.sheet .kv .k{color:var(--text-l);flex:0 0 54px}
.sheet .kv .v{flex:1;line-height:1.65}
.sheet .acts{display:flex;gap:8px;margin-top:12px}
.btn{
  flex:1;text-align:center;padding:10px;border-radius:12px;font-size:13px;font-weight:600;
  background:var(--pink);color:#fff;cursor:pointer;user-select:none;transition:.15s;border:none;
  font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn.gh{background:var(--pink-xl);color:#C46A6A}
.btn.m{background:var(--mint)}
.btn.o{background:var(--orange)}
.btn.full{width:100%;margin-top:10px}
.x{position:absolute;right:14px;top:12px;font-size:17px;color:var(--text-l);cursor:pointer;width:26px;height:26px;text-align:center;line-height:26px}

/* 帖子 */
.post{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.post .ph{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.post .pn{font-size:13px;font-weight:600}
.post .pm{font-size:10.5px;color:var(--text-l);margin-top:1px}
.post .pc{font-size:13px;line-height:1.75;color:#554A4A}
.post .pf{display:flex;gap:16px;margin-top:9px;font-size:11.5px;color:var(--text-l)}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;display:inline-block}
.b-feed{background:var(--mint-l);color:#3F8E68}
.b-adopt{background:var(--pink-xl);color:#C46A6A}
.b-rescue{background:var(--orange-l);color:#B87A2A}
.b-warn{background:#F0EEEE;color:#8B7E7E}
.b-done{background:var(--mint-l);color:#3F8E68}

/* 知识 */
.kitem{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:9px}
.kitem .kw{font-size:13.5px;font-weight:700;color:var(--red);display:flex;gap:6px;align-items:flex-start;line-height:1.6}
.kitem .kw em{font-style:normal;flex:0 0 auto}
.kitem .kr{font-size:12.5px;line-height:1.75;color:#5C5050;margin-top:7px}
.kitem .kr span{color:var(--text-l);font-weight:600;margin-right:5px}
.kitem .kr.ok span{color:var(--green)}
.lv{font-size:10px;padding:2px 7px;border-radius:9px;display:inline-block;vertical-align:1px;margin-left:4px}
.lv.red{background:#FBE3E3;color:#C4484B}
.lv.yellow{background:#FBEFD9;color:#A8762A}
.lv.green{background:var(--mint-l);color:#3F8E68}
.tip{background:var(--card);border-radius:13px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:9px;border-left:4px solid var(--green)}
.tip.red{border-left-color:var(--red)}
.tip.yellow{border-left-color:var(--yellow)}
.tip .tt{font-size:13.5px;font-weight:700;line-height:1.55;display:flex;gap:6px;align-items:flex-start}
.tip .tw{font-size:12px;color:#6B6060;line-height:1.7;margin-top:6px}
.tip .th{font-size:12px;line-height:1.7;margin-top:6px;padding-left:12px}
.tip .th li{margin-bottom:2px;list-style:none;position:relative}
.tip .th li:before{content:"·";position:absolute;left:-10px;color:var(--mint);font-weight:700}
.tip .th li{color:#4A4040}

/* 日更 */
.stage{margin-bottom:12px}
.stage .sh_{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.stage .sh_ .se{font-size:17px}
.stage .sh_ .sn{font-size:13px;font-weight:700}
.stage .sh_ .sr{font-size:10.5px;color:var(--text-l);background:var(--pink-xl);padding:2px 8px;border-radius:10px}
.day{
  display:flex;gap:9px;background:var(--card);border-radius:12px;padding:10px 12px;
  box-shadow:var(--sh);margin-bottom:6px;cursor:pointer;transition:.15s;
}
.day:active{transform:scale(.99)}
.day .dn{
  flex:0 0 34px;height:34px;border-radius:10px;background:var(--pink-xl);color:#C46A6A;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.day .dc{flex:1;min-width:0}
.day .dc .dt{font-size:12.5px;font-weight:600;line-height:1.5}
.day .dc .dd{font-size:11px;color:var(--text-l);margin-top:2px}
.day .dc .dp{font-size:12px;line-height:1.7;color:#5C5050;margin-top:5px;display:none}
.day.open .dc .dp{display:block}
.day .dc .todo{font-size:11.5px;line-height:1.8;color:#4A4040;margin-top:6px;display:none;
  background:#FBF7F4;border-radius:9px;padding:7px 9px}
.day.open .dc .todo{display:block}
.day .dc .todo b{color:var(--mint);font-size:11px;display:block;margin-bottom:2px}
.day .dc .warn{font-size:11.5px;line-height:1.8;color:#B4484B;margin-top:5px;display:none;
  background:#FDF2F2;border-radius:9px;padding:7px 9px}
.day.open .dc .warn{display:block}
.day .dc .warn b{color:var(--red);font-size:11px;display:block;margin-bottom:2px}

/* 发布页 */
.pfield{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.pfield .fl{font-size:12.5px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.pfield .fl .rq{color:var(--pink);font-size:11px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.topt{
  text-align:center;padding:9px 2px;border-radius:12px;background:#FBF6F2;border:1.5px solid transparent;
  cursor:pointer;transition:.15s;
}
.topt .te{font-size:19px;display:block}
.topt .tn{font-size:10.5px;color:var(--text-l);margin-top:2px}
.topt.on{background:var(--pink-xl);border-color:var(--pink)}
.topt.on .tn{color:#C46A6A;font-weight:600}
.photo{
  height:96px;border-radius:12px;background:#FBF6F2;border:1.5px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-l);
  font-size:11.5px;cursor:pointer;
}
.photo .pe{font-size:22px;margin-bottom:3px}
.pinput{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;font-size:12.5px;
  font-family:inherit;color:var(--text);background:#FBF9F7;outline:none;margin-bottom:7px;
}
.pinput:focus{border-color:var(--pink)}
.picker{
  display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:#FBF9F7;
  border:1.5px solid var(--line);border-radius:11px;font-size:12.5px;cursor:pointer;margin-bottom:7px;
}
.picker .pa{color:var(--text-l);font-size:11px}
textarea.pinput{height:62px;resize:none;line-height:1.6}
.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(48,40,40,.9);
  color:#fff;font-size:12.5px;padding:11px 18px;border-radius:12px;z-index:80;opacity:0;
  transition:.2s;pointer-events:none;text-align:center;line-height:1.6;max-width:250px;
}
.toast.on{opacity:1}

/* 我的 */
.mehead{
  background:linear-gradient(135deg,var(--pink),#FFA794);border-radius:18px;padding:16px;
  color:#fff;display:flex;align-items:center;gap:12px;margin-bottom:11px;box-shadow:var(--sh2);
}
.mehead .ma{
  width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;font-size:26px;
}
.mehead .mn{font-size:16px;font-weight:700}
.mehead .ms{font-size:11.5px;opacity:.92;margin-top:3px}
.mrow{
  display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--card);
  border-radius:13px;box-shadow:var(--sh);margin-bottom:8px;cursor:pointer;transition:.15s;
}
.mrow:active{transform:scale(.99)}
.mrow .mi{font-size:17px;width:24px;text-align:center}
.mrow .mt{flex:1;font-size:13px}
.mrow .mv{font-size:11.5px;color:var(--text-l)}
.mrow .arrow{color:#D8CAC4;font-size:13px}
.cal{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}
.cd{
  aspect-ratio:1;border-radius:8px;background:#FBF6F2;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:var(--text-l);
}
.cd.done{background:var(--mint);color:#fff;font-weight:600}
.cd.today{background:var(--pink);color:#fff;font-weight:700}
.cd.out{background:transparent;color:#E0D5D0}

/* 空态/提示 */
.empty{text-align:center;padding:34px 20px;color:var(--text-l);font-size:12.5px;line-height:1.8}
.empty .ee{font-size:32px;display:block;margin-bottom:8px}
.subtab{display:flex;gap:0;background:#FBF6F2;border-radius:12px;padding:3px;margin-bottom:11px}
.subtab .st{flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:10px;cursor:pointer;color:var(--text-l);transition:.15s}
.subtab .st.on{background:#fff;color:var(--pink);font-weight:700;box-shadow:0 1px 5px rgba(255,138,138,.16)}

.hint{
  font-size:11px;color:var(--text-l);text-align:center;padding:9px 0 2px;line-height:1.6;
}

@media(max-width:820px){
  body{padding:0;gap:0;align-items:stretch}
  .intro{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .notch{display:none}
  .nav{padding-top:14px}
  .tabbar{padding-bottom:6px}
}
</style>
</head>
<body>

<!-- ============ 左侧说明 ============ -->
<!-- ============ 手机 ============ -->
<div class="phone">
<div class="screen">

  <div class="nav" id="nav">

  <div class="sheet" id="sheet"></div>

</div>
</div>

/* ============ 状态 ============ */
const S = { page:'map', dist:'all', feedFilter:'all', knowTab:'class',
            tipCat:'all', tipLv:'all', pType:'feed', pSter:'unknown', openDay:-1, curPoint:-1 };

const TYPE = {
  feed:   {name:'喂食点', color:'#8FD9B6', emoji:'🍽️', badge:'b-feed'},
  adopt:  {name:'求领养', color:'#FF8A8A', emoji:'🐱',  badge:'b-adopt'},
  rescue: {name:'求助',   color:'#FFB347', emoji:'🆘',  badge:'b-rescue'},
  warning:{name:'提醒',   color:'#A99E9E', emoji:'⚠️',  badge:'b-warn'}
};
const STER = { done:'已绝育', no:'未绝育', group:'群体·部分绝育', unknown:'绝育情况未知' };
const LVN = { red:'高危', yellow:'注意', green:'常识' };

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1700);
}
/* 经纬度 → SVG 坐标（济宁范围线性投影） */
const LNG0=115.95, LNG1=117.45, LAT0=34.65, LAT1=35.95, VW=300, VH=340;
const px = lng => (lng-LNG0)/(LNG1-LNG0)*VW;
const py = lat => (LAT1-lat)/(LAT1-LAT0)*VH;

function pointsOf(key){
  if(key==='all') return DATA.points;
  return DATA.points.filter(p=>p.district===key);
}
function districtKey(lat,lng){
  let best='', bd=Infinity;
  DATA.districts.forEach(d=>{
    if(d.key==='all') return;
    const r=Math.PI/180;
    const x=(lng-d.lng)*Math.cos((lat+d.lat)/2*r)*111, y=(lat-d.lat)*111;
    const k=Math.sqrt(x*x+y*y);
    if(k<bd){bd=k;best=d.key;}
  });
  return best;
}
/* 给点位补上 district 字段 */
DATA.points.forEach(p=>{ if(!p.district) p.district = districtKey(p.lat,p.lng); });

/* ============ 地图页 ============ */
function viewMap(){
  const list = pointsOf(S.dist);
  const d = DATA.districts.find(x=>x.key===S.dist) || DATA.districts[0];

  /* 统计 */
  const cats = list.reduce((n,p)=>n+(p.cats||0),0);
  const feeds = list.filter(p=>p.type==='feed').length;
  const adopts = list.filter(p=>p.type==='adopt').length;

  /* 区圆 */
  let circles = '';
  DATA.districts.forEach(z=>{
    if(z.key==='all') return;
    const x=px(z.lng), y=py(z.lat);
    const sel = (S.dist===z.key);
    circles += `<circle class="dz${sel?' sel':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="19"
      data-d="${z.key}"><title>${esc(z.name)}</title></circle>`;
    circles += `<text class="dzt${sel?' sel':''}" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}">${esc(z.short)}</text>`;
  });
  /* 点位 */
  let marks='';
  list.forEach(p=>{
    const t=TYPE[p.type], x=px(p.lng), y=py(p.lat);
    marks += `<circle class="mk" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"
      fill="${t.color}" data-p="${p.id}"><title>${esc(p.name)}</title></circle>`;
    marks += `<text class="mkl" x="${x.toFixed(1)}" y="${(y-11).toFixed(1)}">${t.emoji}</text>`;
  });

  let chips = DATA.districts.map(z=>
    `<div class="chip${S.dist===z.key?' on':''}" data-d="${z.key}">${esc(z.name)}</div>`).join('');

  return `
  <div class="statrow">
    <div class="stat"><b>${list.length}</b><span>点位</span></div>
    <div class="stat"><b>${cats}</b><span>在册猫</span></div>
    <div class="stat"><b>${feeds}</b><span>喂食点</span></div>
    <div class="stat"><b>${adopts}</b><span>待领养</span></div>
  </div>
  <div class="card" style="padding:8px 10px 6px">
    <div class="mapwrap">
      <svg id="mapSvg" viewBox="0 0 ${VW} ${VH}">
        <rect x="0" y="0" width="${VW}" height="${VH}" fill="none"/>
        ${circles}
        ${marks}
      </svg>
      <div class="legend">
        <span><i style="background:#8FD9B6"></i>🍽️ 喂食点</span>
        <span><i style="background:#FF8A8A"></i>🐱 求领养</span>
        <span><i style="background:#FFB347"></i>🆘 求助</span>
        <span><i style="background:#A99E9E"></i>⚠️ 提醒</span>
      </div>
    </div>
  </div>
  <div class="chips">${chips}</div>
  <div class="sec-t"><span class="dot"></span>${esc(d.name)}的点位 · ${list.length} 个</div>
  ${ list.length ? list.map(p=>{
      const t=TYPE[p.type];
      return `<div class="post" data-p="${p.id}" style="cursor:pointer">
        <div class="ph">
          <div class="avatar" style="background:${t.color}33">${t.emoji}</div>
          <div style="flex:1;min-width:0">
            <div class="pn">${esc(p.name)}</div>
            <div class="pm">📍${esc(p.spot||'')} · ${esc(p.time||'')}</div>
          </div>
          ${p.sterilized?`<span class="badge ${p.sterilized==='done'?'b-done':'b-warn'}">${p.sterilized==='done'?'✂️ 已绝育':(p.sterilized==='group'?`✂️ ${p.sterDone||0}/${p.cats||0}`:'✂️ 未绝育')}</span>`:''}
        </div>

    }).join('') : `<div class="empty"><span class="ee">🐾</span>这个区还没有人标记点位<br>遇到猫咪时点「发布」加一个吧</div>` }
  <div class="hint">点地图上的圆点或下方卡片，查看点位详情</div>`;
}

/* ============ 圈子页 ============ */

  const chips = [['all','全部','']].concat(Object.keys(TYPE).map(k=>[k,TYPE[k].name,TYPE[k].emoji]))
    .map(([k,n,e])=>`<div class="chip${S.feedFilter===k?' on m':''}" data-f="${k}">${e?e+' ':''}${n}</div>`).join('');
  return `
  <div class="chips">${chips}</div>
  ${ list.length ? list.map(p=>{
      const t=TYPE[p.type]||TYPE.feed;
      return `<div class="post">
        <div class="ph">
          <div class="avatar" style="background:${esc(p.avatarBg||'#FFD3D3')}">${esc((p.author||'A').slice(0,1))}</div>
          <div style="flex:1;min-width:0">
            <div class="pn">${esc(p.author)}</div>
            <div class="pm">${esc(p.time)} · ${esc(p.distance||'')} · ${esc(p.location||'')}</div>
          </div>
          <span class="badge ${t.badge}">${t.emoji}${t.name}</span>
        </div>
        <div class="pc">${esc(p.content)}</div>
        ${p.sterilized?`<div style="margin-top:7px"><span class="badge ${p.sterilized==='done'?'b-done':'b-warn'}">✂️ ${STER[p.sterilized]}${p.sterilized==='group'?`（${p.sterDone||0}/${p.cats||0}）`:''}</span></div>`:''}
        <div class="pf"><span>❤️ ${p.likes||0}</span><span>💬 ${p.comments||0}</span></div>

/* ============ 发布页 ============ */

  const tgrid = Object.keys(TYPE).map(k=>{
    const t=TYPE[k];
    return `<div class="topt${S.pType===k?' on':''}" data-t="${k}">
      <span class="te">${t.emoji}</span><span class="tn">${t.name}</span></div>`;
  }).join('');
  const sterOpt = [['done','已绝育'],['no','未绝育'],['unknown','不清楚']]
    .map(([k,n])=>`<div class="topt${S.pSter===k?' on':''}" data-s="${k}" style="padding:8px 2px">
      <span class="te" style="font-size:14px">${k==='done'?'✂️':(k==='no'?'✖️':'❔')}</span>
      <span class="tn">${n}</span></div>`).join('');
  return `
  <div class="pfield">
    <div class="fl">① 这是哪种点位 <span class="rq">必选</span></div>
    <div class="tgrid">${tgrid}</div>
  </div>
  <div class="pfield">
    <div class="fl">② 拍张照片 <span class="pa" style="font-weight:400;color:var(--text-l);font-size:11px">选填</span></div>
    <div class="photo" id="photo"><span class="pe">📷</span>点击拍照 / 从相册选</div>
  </div>
  <div class="pfield">
    <div class="fl">③ 位置与描述</div>
    <input class="pinput" id="pName" placeholder="给它起个名字，如：小狸花 · 求领养">
    <div class="picker" id="pDist">归属区<span class="pa">任城区 ▾</span></div>
    <div class="picker" id="pSpot">在地图上选位置<span class="pa">点这里选点 ▾</span></div>
    <textarea class="pinput" id="pDesc" placeholder="说点什么，比如：固定喂食 3 只，亲人可摸"></textarea>
  </div>
  ${S.pType==='adopt'||S.pType==='rescue'?`

    <div class="fl">④ 绝育情况 <span class="pa" style="font-weight:400;color:var(--text-l);font-size:11px">帮助判断是否要联系 TNR</span></div>
    <div class="tgrid" style="grid-template-columns:repeat(3,1fr)">${sterOpt}</div>

  <div class="hint">发布后会立刻出现在地图上，附近的猫友就能看到</div>`;
}

/* ============ 知识页 ============ */
function viewKnow(){
  const tabs = [['class','爱猫小课堂'],['tips','避坑干货'],['daily','30 天日更']]
    .map(([k,n])=>`<div class="st${S.knowTab===k?' on':''}" data-k="${k}">${n}</div>`).join('');

  if(S.knowTab==='class'){
    return `<div class="subtab">${tabs}</div>
    ${DATA.knowledge.map(k=>`
      <div class="kitem">
        <div class="kw"><em>❌</em><span>${esc(k.wrong)}</span></div>
        <div class="kr"><span>为什么</span>${esc(k.why)}</div>
        <div class="kr ok"><span>怎么做</span>${esc(k.right)}</div>
      </div>`).join('')}
    <div class="hint">共 ${DATA.knowledge.length} 条 · 主要讲给在户外喂猫的人</div>`;
  }

  if(S.knowTab==='tips'){
    let list = DATA.catTips;
    if(S.tipCat!=='all') list = list.filter(t=>t.cat===S.tipCat);
    if(S.tipLv!=='all')  list = list.filter(t=>t.level===S.tipLv);
    const cc = [['all','全部','🛡️']].concat(DATA.tipCats.filter(c=>c.key!=='all').map(c=>[c.key,c.name,c.emoji]))
      .map(([k,n,e])=>`<div class="chip${S.tipCat===k?' on m':''}" data-c="${k}">${e}${n}</div>`).join('');
    const lc = [['all','全部'],['red','🔴 高危'],['yellow','🟡 注意'],['green','🟢 常识']]
      .map(([k,n])=>`<div class="chip${S.tipLv===k?' on o':''}" data-l="${k}">${n}</div>`).join('');
    return `<div class="subtab">${tabs}</div>
    <div class="chips">${cc}</div>
    <div class="chips" style="margin-top:-4px">${lc}</div>
    ${ list.length ? list.map(t=>`
      <div class="tip ${t.level}">
        <div class="tt"><span>${t.emoji}</span><span>${esc(t.title)}</span>
          <span class="lv ${t.level}">${LVN[t.level]}</span></div>
        <div class="tw">${esc(t.why)}</div>
        <div class="th">${(t.how||[]).map(h=>`<li>${esc(h)}</li>`).join('')}</div>
      </div>`).join('') : `<div class="empty"><span class="ee">🔍</span>这个筛选下暂无内容</div>` }
    <div class="hint">共 ${list.length} / ${DATA.catTips.length} 条干货</div>`;
  }

  /* 日更 */
  const stages = DATA.dailyStages;
  return `<div class="subtab">${tabs}</div>
  <div class="card" style="background:linear-gradient(135deg,#FFF2F0,#FFF8F2)">
    <div class="sec-t" style="margin:0 0 5px"><span class="dot"></span>${esc(DATA.dailyMeta.title||'30 天养猫日更')}</div>
    <div style="font-size:11.5px;color:var(--text-l);line-height:1.7">${esc(DATA.dailyMeta.desc||'')}</div>
  </div>
  ${stages.map(st=>{
    const items = DATA.catDaily.filter(x=>x.stage===st.key);
    if(!items.length) return '';
    return `<div class="stage">
      <div class="sh_"><span class="se">${st.emoji}</span><span class="sn">${esc(st.name)}</span>
        <span class="sr">${esc(st.range)}</span></div>
      ${items.map(x=>{
        const open = S.openDay===x.day;
        return `<div class="day${open?' open':''}" data-day="${x.day}">
          <div class="dn">${x.day}</div>
          <div class="dc">
            <div class="dt">${x.emoji} ${esc(x.title)}</div>
            <div class="dd">${esc(x.date||'')} · 点开看当天该做什么</div>
            <div class="dp">${(x.paras||[]).map(p=>esc(p)).join('<br><br>')}</div>
            ${(x.todo&&x.todo.length)?`<div class="todo"><b>✅ 今天的动作</b>${x.todo.map(t=>'· '+esc(t)).join('<br>')}</div>`:''}
            ${(x.warn&&x.warn.length)?`<div class="warn"><b>🚫 今天别做</b>${x.warn.map(t=>'· '+esc(t)).join('<br>')}</div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}
  <div class="hint">共 ${DATA.catDaily.length} 天 · 点任意一天展开</div>`;
}

/* ============ 我的页 ============ */

/* ============ 点位抽屉 ============ */
function openPoint(id){
  const p = DATA.points.find(x=>x.id===id);
  if(!p) return;
  S.curPoint = id;
  const t = TYPE[p.type];
  const d = DATA.districts.find(x=>x.key===p.district);
  const sterTxt = p.sterilized
    ? (p.sterilized==='done' ? '✂️ 已绝育'
      : (p.sterilized==='group' ? `✂️ 群体 ${p.sterDone||0}/${p.cats||0} 已绝育` : '✖️ 未绝育'))
    : '';
  $('sheet').innerHTML = `
    <div class="bar"></div>
    <div class="x" id="sheetX">✕</div>
    <h3>${t.emoji} ${esc(p.name)}</h3>
    <div class="sub">${esc(p.spot||'')} · ${esc((d&&d.name)||'')} · ${esc(p.time||'')}</div>
    <div class="kv"><span class="k">类型</span><span class="v"><span class="badge ${t.badge}">${t.name}</span></span></div>
    ${p.cats?`<div class="kv"><span class="k">猫咪</span><span class="v">${p.cats} 只${p.fedToday?` · 今天已被喂 ${p.fedToday} 次`:''}</span></div>`:''}
    ${sterTxt?`<div class="kv"><span class="k">绝育</span><span class="v">${sterTxt}</span></div>`:''}
    ${p.desc?`<div class="kv"><span class="k">说明</span><span class="v">${esc(p.desc)}</span></div>`:''}
    ${p.type==='warning'?'':`<div class="acts">
      <button class="btn m" id="chkBtn">✅ 我喂过了</button>
      <button class="btn gh" id="favBtn">⭐ 收藏</button>
    </div>`}
    ${p.type==='warning'?`<div class="acts"><button class="btn gh" id="favBtn">⭐ 收藏</button></div>`:''}
  `;
  $('sheet').classList.add('up');
  $('sheetX').onclick = closeSheet;
  const cb = $('chkBtn'); if(cb) cb.onclick = ()=>{ toast('打卡成功！今天第 '+(p.fedToday||0)+1+' 次喂养 ✅'); closeSheet(); };
  const fb = $('favBtn'); if(fb) fb.onclick = ()=>{ toast('已收藏「'+p.name+'」⭐'); closeSheet(); };
}
function closeSheet(){ $('sheet').classList.remove('up'); S.curPoint=-1; }

/* ============ 渲染调度 ============ */
const NAV = {
  map:['🐱 喵邻圈','济宁 · 猫咪地图'],
  feed:['👥 邻里圈子','附近猫友的动态'],
  publish:['➕ 发布点位','让附近的猫友看见'],
  know:['📚 养猫知识','误区 · 干货 · 30 天日更'],
  me:['🙋 我的','打卡 · 收藏 · 猫档案']
};
function render(){
  const v = {map:viewMap, feed:viewFeed, publish:viewPublish, know:viewKnow, me:viewMe}[S.page];
  $('body').innerHTML = v();
  $('body').scrollTop = 0;
  const n = NAV[S.page];
  $('navT').textContent = n[0]; $('navS').textContent = n[1];
  const d = DATA.districts.find(x=>x.key===S.dist);
  $('navB').textContent = S.page==='map' ? ('🗺️ '+(d?d.name:'全市')) : '🐾 喵邻圈';
  document.querySelectorAll('.tb').forEach(e=>e.classList.toggle('on', e.dataset.p===S.page));
  bind();
}

/* ============ 事件委托 ============ */
function bind(){
  $('body').onclick = function(e){
    const chip = e.target.closest('.chip[data-d]');
    if(chip){ S.dist = chip.dataset.d; render(); return; }
    const dz = e.target.closest('.dz');
    if(dz){ S.dist = dz.dataset.d; render(); return; }
    const mk = e.target.closest('.mk');
    if(mk){ openPoint(+mk.dataset.p); return; }
    const fc = e.target.closest('.chip[data-f]');
    if(fc){ S.feedFilter = fc.dataset.f; render(); return; }
    const kk = e.target.closest('.st[data-k]');
    if(kk){ S.knowTab = kk.dataset.k; render(); return; }
    const cc = e.target.closest('.chip[data-c]');
    if(cc){ S.tipCat = cc.dataset.c; render(); return; }
    const ll = e.target.closest('.chip[data-l]');
    if(ll){ S.tipLv = ll.dataset.l; render(); return; }
    const pt = e.target.closest('.post[data-p]');
    if(pt){ openPoint(+pt.dataset.p); return; }
    const op = e.target.closest('.topt[data-t]');
    if(op){ S.pType = op.dataset.t; render(); return; }
    const os = e.target.closest('.topt[data-s]');
    if(os){ S.pSter = os.dataset.s; render(); return; }
    const day = e.target.closest('.day');
    if(day){ const n=+day.dataset.day; S.openDay = (S.openDay===n?-1:n); render();
      if(S.openDay>0){ const el=document.querySelector('.day.open'); if(el) setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),50); }
      return; }
    const ph = e.target.closest('#photo');
    if(ph){ toast('预览中不保存照片'); return; }
    const pd = e.target.closest('#pDist');
    if(pd){ toast('归属区：默认按坐标判定<br>可手动选择 11 个区县'); return; }
    const ps = e.target.closest('#pSpot');
    if(ps){ toast('预览中使用示意位置'); return; }
    const pb = e.target.closest('#pubBtn');
    if(pb){
      const nm = ($('pName')&&$('pName').value.trim()) || '新点位';
      DATA.points.unshift({id:Date.now(),type:S.pType,name:nm,spot:'任城区',district:'rencheng',lat:35.43,lng:116.59,desc:($('pDesc')&&$('pDesc').value)||'',sterilized:S.pSter,time:'刚刚'}); toast('发布成功');
      const epoch=previewEpoch; setTimeout(()=>{ if(epoch===previewEpoch){S.page='map'; render();} }, 900);
      return;
    }
    const mr = e.target.closest('.mrow[data-m]');
    if(mr){
      const k = mr.dataset.m;
      const msg = {fav:'我的收藏：3 个点位、1 条动态',
        profile:'猫档案 · 张小狸<br>狸花猫 · 母 · 约 3 个月',
        guide:'领养须知：先看健康、再谈条件<br>不熟的猫别硬抱',
        privacy:'请按实际使用情况保护个人信息'}[k];
      toast(msg||''); return;
    }
  };
  const tb = $('tabbar');
  tb.onclick = function(e){
    const t = e.target.closest('.tb'); if(!t) return;
    S.page = t.dataset.p; closeSheet(); render();
  };
}

let previewEpoch=0;
const initialData=JSON.parse(JSON.stringify(DATA));
const initialState=JSON.parse(JSON.stringify(S));
const toolbar=document.createElement('div');
toolbar.style.cssText='position:fixed;z-index:9999;top:0;left:0;right:0;padding:5px;text-align:center;background:#fff5f8;font-size:12px';
toolbar.innerHTML='示例体验 · 数据仅保存在当前页面 <button type="button" id="restoreExample">恢复示例</button>';
document.body.appendChild(toolbar);
document.getElementById('restoreExample').onclick=()=>{previewEpoch++;Object.assign(DATA,JSON.parse(JSON.stringify(initialData)));Object.assign(S,JSON.parse(JSON.stringify(initialState)));closeSheet();render();};
const NAV_KEYS = {map:1,feed:1,publish:1,know:1,me:1};
/* 首屏：支持 ?p=feed&d=rencheng 直达页签/分区 */
(function(){
  try{
    const q = new URLSearchParams(location.search);
    const p = q.get('p');
    if(p && NAV_KEYS[p]) S.page = p;
    const d = q.get('d');
    if(d && DATA.districts.some(x=>x.key===d)) S.dist = d;
  }catch(e){}
})();
render();
</script>
</body>
