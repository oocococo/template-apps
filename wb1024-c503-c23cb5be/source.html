<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#eaf5ff" />
<title>佩妮英语 · 人教版一二年级</title>
<style>
  :root{--ink:#152a45;--sub:#5b7794;--pink:#0e86c9;--rose:#2563eb;--deep:#0c7fb8;--cream:#eef6ff;--card:#ffffff;--line:rgba(14,134,201,.14);--sun:#c47f0a;--mint:#0f9d63;--blue:#3b82f6;--violet:#7c3aed;--panel:#ffffff;--panel-soft:#f2f8ff;--shadow:0 12px 28px rgba(23,63,120,.12);--shadow-s:0 3px 10px rgba(23,63,120,.10);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(circle at 10% 0%, rgba(56,189,248,.13), transparent 42%),radial-gradient(circle at 92% 6%, rgba(167,139,250,.13), transparent 40%),radial-gradient(circle at 50% 100%, rgba(240,90,105,.10), transparent 46%),#eef6ff;
    -webkit-font-smoothing:antialiased;
  }
  .app{position:relative;max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  @media (min-width:520px){
    .app{min-height:calc(100vh - 40px);margin:20px auto;border-radius:32px;overflow:hidden;
      box-shadow:0 30px 70px rgba(190,120,150,.22), 0 0 0 1px rgba(255,255,255,.7) inset;}
  }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;padding:14px 18px 10px;display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(255,250,246,.96),rgba(255,250,246,.82) 70%,rgba(255,250,246,0));
    backdrop-filter:blur(8px);
  }
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.3px;}
  .logo .pig{font-size:22px;filter:drop-shadow(0 3px 6px rgba(255,143,190,.5));}
  .logo small{display:block;font-size:10px;font-weight:600;color:var(--sub);letter-spacing:.5px;}
  .hstars{margin-left:auto;display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px;
    background:var(--panel);padding:7px 12px;border-radius:20px;box-shadow:var(--shadow-s);color:#b8790a;}
  main{flex:1;padding:0 16px 96px;}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;color:var(--panel);
    background:linear-gradient(135deg,#38bdf8,#0e86c9 45%,#0e86c9);box-shadow:0 14px 30px rgba(255,122,174,.35);}
  .hero:after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);}
  .hero:before{content:"";position:absolute;left:-24px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);}
  .hero-top{display:flex;align-items:center;gap:8px;position:relative;z-index:2;}
  .badge{font-size:11px;font-weight:800;letter-spacing:1.2px;background:rgba(255,255,255,.26);padding:5px 10px;border-radius:20px;}
  .hero h1{margin:12px 0 2px;font-size:30px;line-height:1.1;letter-spacing:.2px;position:relative;z-index:2;}
  .hero p.sub{margin:0;font-size:13px;opacity:.92;position:relative;z-index:2;}
  .wordrow{display:flex;gap:6px;margin:14px 0 12px;position:relative;z-index:2;flex-wrap:wrap;}
  .wchip{background:rgba(255,255,255,.9);color:#0c7fb8;border-radius:12px;padding:6px 9px;font-size:11px;font-weight:800;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;box-shadow:0 4px 10px rgba(190,60,105,.16);}
  .wchip b{font-size:16px;}
  .hero .bar{position:relative;z-index:2;height:7px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;}
  .hero .bar i{display:block;height:100%;border-radius:99px;background:var(--panel);transition:width .45s ease;}
  .hero .tip{position:relative;z-index:2;margin:10px 0 0;font-size:11.5px;opacity:.9;}

  /* ---------- steps ---------- */
  .sec-title{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:14px;font-weight:800;}
  .sec-title span{font-size:11px;font-weight:600;color:var(--sub);}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .step{position:relative;background:var(--panel);border:0;border-radius:20px;padding:14px 12px;text-align:left;
    box-shadow:var(--shadow-s);font-family:inherit;color:var(--ink);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;}
  .step:active{transform:scale(.97);}
  .step .ic{font-size:24px;display:block;margin-bottom:6px;}
  .step b{display:block;font-size:14px;}
  .step small{display:block;color:var(--sub);font-size:11px;margin-top:3px;}
  .step .ok{position:absolute;right:10px;top:10px;font-size:12px;background:rgba(34,197,94,.16);color:#0f9d63;
    padding:2px 7px;border-radius:20px;font-weight:800;}
  .step.primary{background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(56,189,248,.18));}

  /* ---------- week / me ---------- */
  .daycard{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:20px;padding:12px 14px;margin-bottom:10px;
    box-shadow:var(--shadow-s);cursor:pointer;border:2px solid transparent;transition:transform .15s ease;}
  .daycard:active{transform:scale(.985);}
  .daycard.now{border-color:rgba(56,189,248,.45);background:linear-gradient(135deg,#f2f8ff,var(--panel));}
  .daycard .no{width:38px;height:38px;border-radius:14px;background:rgba(56,189,248,.16);color:#0e86c9;font-weight:900;
    display:grid;place-items:center;font-size:14px;flex:none;}
  .daycard .tx{flex:1;min-width:0;}
  .daycard .tx b{font-size:14.5px;display:block;}
  .daycard .tx small{color:var(--sub);font-size:11px;}
  .daycard .minibar{height:5px;border-radius:9px;background:rgba(14,134,201,.10);overflow:hidden;margin-top:6px;}
  .daycard .minibar i{display:block;height:100%;background:linear-gradient(90deg,rgba(56,189,248,.45),#0e86c9);}
  .daycard .pct{font-size:11px;font-weight:800;color:#0e86c9;}

  .statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--panel);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-s);}
  .stat b{display:block;font-size:24px;color:#0e86c9;}
  .stat small{color:var(--sub);font-size:11px;}
  .note{background:var(--panel);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-s);font-size:12.5px;line-height:1.75;color:#4d6b8a;}
  .note b{color:var(--ink);}
  .ghost{width:100%;margin-top:12px;background:var(--panel);border:1.5px dashed rgba(56,189,248,.45);color:#0c7fb8;border-radius:16px;
    padding:12px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;}

  /* ---------- word cards ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px;}
  .back{width:38px;height:38px;border-radius:13px;border:0;background:var(--panel);box-shadow:var(--shadow-s);font-size:16px;
    display:grid;place-items:center;cursor:pointer;color:var(--ink);}
  .topbar .t{font-weight:800;font-size:15px;}
  .topbar .t small{display:block;font-weight:600;color:var(--sub);font-size:11px;}
  .topbar .spacer{flex:1;}
  .counter{font-size:12px;font-weight:800;color:#0e86c9;background:rgba(56,189,248,.16);padding:6px 11px;border-radius:20px;}

  .wcard{background:var(--panel);border-radius:28px;padding:26px 20px 20px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .wcard .glow{position:absolute;inset:-40% -10% auto;height:220px;background:radial-gradient(circle,rgba(56,189,248,.10),transparent 65%);}
  .wcard .emo{font-size:78px;line-height:1;position:relative;animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .wcard .en{font-size:42px;font-weight:900;letter-spacing:-.5px;margin:10px 0 0;position:relative;}
  .wcard .ipa{color:var(--sub);font-size:15px;margin-top:4px;font-family:"Segoe UI",system-ui,sans-serif;}
  .wcard .cn{font-size:18px;font-weight:800;color:#0c7fb8;margin-top:10px;}
  .wcard .tip{margin:14px auto 0;background:#f2f8ff;border-radius:14px;padding:10px 12px;font-size:14px;color:#4d6b8a;
    display:flex;align-items:center;justify-content:center;gap:8px;max-width:300px;}
  .wcard .tip span{font-weight:700;color:var(--ink);}
  .dots{display:flex;justify-content:center;gap:6px;margin:16px 0 4px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(14,134,201,.16);display:block;transition:.2s;}
  .dots i.on{background:#0e86c9;width:18px;border-radius:9px;}
  .dots i.learned{background:rgba(56,189,248,.45);}
  .btnrow{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;border:0;border-radius:16px;padding:14px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
    background:var(--panel);color:var(--ink);box-shadow:var(--shadow-s);transition:transform .15s ease;}
  .btn:active{transform:scale(.96);}
  .btn.pri{background:linear-gradient(135deg,#0e86c9,#0e86c9);color:var(--panel);box-shadow:0 8px 20px rgba(255,95,150,.36);}
  .btn.soft{background:rgba(56,189,248,.14);color:#0c7fb8;box-shadow:none;}
  .btn:disabled{opacity:.55;}

  /* ---------- sentence ---------- */
  .panel{background:var(--panel);border-radius:24px;padding:16px;box-shadow:var(--shadow-s);margin-bottom:12px;}
  .pattern{font-size:13px;color:var(--sub);text-align:center;}
  .pattern b{color:#0e86c9;}
  .slotline{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
    background:#f2f8ff;border:2px dashed rgba(56,189,248,.35);border-radius:18px;padding:10px;margin-top:10px;}
  .slotline.empty:before{content:"点下面的单词，把句子拼出来";font-size:12px;color:#7d92a8;}
  .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .tok{border:0;font-family:inherit;background:var(--panel);border-radius:12px;padding:9px 14px;font-size:16px;font-weight:800;
    color:#2f6fa8;box-shadow:0 3px 0 rgba(56,189,248,.35);cursor:pointer;transition:transform .12s ease;}
  .tok:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(56,189,248,.35);}
  .tok.in{background:linear-gradient(135deg,#38bdf8,#2563eb);color:var(--panel);box-shadow:0 3px 0 #0e86c9;}
  .tok.used{opacity:.28;pointer-events:none;}
  .tok.hint{background:linear-gradient(135deg,rgba(255,190,60,.22),#b45309);color:#b45309;box-shadow:0 3px 0 #b8790a;animation:hintPulse 1.1s ease-in-out infinite;}
  @keyframes hintPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .sentence-hint{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;}

  /* ---------- story ---------- */
  .stage{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:var(--panel);position:relative;}
  .scene-wrap{position:relative;background:#eef8ff;}
  .scene{display:block;width:100%;height:auto;}
  .sceneno{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);border-radius:20px;padding:4px 10px;
    font-size:11px;font-weight:800;color:#0e86c9;}
  .bubbles{padding:12px 14px 14px;background:var(--panel);}
  .line{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed #e6f0fa;opacity:.5;transition:.25s;}
  .line:last-child{border-bottom:0;}
  .line.active{opacity:1;}
  .line.active .en{background:rgba(56,189,248,.10);border-radius:12px;}
  .who{font-size:10.5px;font-weight:800;color:var(--panel);background:#2563eb;border-radius:20px;padding:4px 8px;height:22px;white-space:nowrap;margin-top:2px;}
  .bubbles .en{font-size:15px;font-weight:700;line-height:1.45;padding:4px 6px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;transition:.25s;}
  .mini{border:0;background:rgba(56,189,248,.16);color:#0c7fb8;border-radius:10px;padding:2px 7px;font-size:11px;cursor:pointer;flex:none;}
  .bubbles .cn{grid-column:2;font-size:12px;color:var(--sub);padding:2px 6px 0;}
  .bubbles .cn.hide{display:none;}
  .playbar{display:flex;gap:8px;align-items:center;margin-top:12px;}
  .playbar .btn{padding:13px 10px;}
  .iconbtn{width:52px;flex:none;}

  /* ---------- 中文速记 ---------- */
  .mnemo{margin:14px 0 0;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .mrow{display:flex;gap:9px;align-items:flex-start;border-radius:15px;padding:10px 12px;font-size:12.5px;line-height:1.65;}
  .mrow .tag{flex:none;font-size:10.5px;font-weight:900;border-radius:8px;padding:2px 20px 2px 7px;height:20px;
    display:inline-flex;align-items:center;letter-spacing:.5px;position:relative;}
  .mrow .tag:after{content:"";position:absolute;right:6px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;}
  .mrow .txt{flex:1;color:#4d6b8a;font-weight:600;}
  .mrow .txt b{color:#0c7fb8;}
  .m-sound{background:linear-gradient(135deg,rgba(245,158,11,.16),rgba(245,158,11,.10));}
  .m-sound .tag{background:#b45309;color:#b45309;}
  .m-parts{background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(37,99,235,.12));}
  .m-parts .tag{background:#3b82f6;color:#1b6fb0;}
  .m-hook{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(34,197,94,.10));}
  .m-hook .tag{background:#0f9d63;color:#0f9d63;}
  .mnemo .quote{font-size:11.5px;color:#6b8299;text-align:center;margin-top:2px;}

  /* ---------- 档位 ---------- */
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .lv{position:relative;border-radius:20px;padding:14px 12px;background:var(--panel);box-shadow:var(--shadow-s);
    cursor:pointer;border:2px solid transparent;text-align:left;font-family:inherit;color:var(--ink);}
  .lv.on{border-color:rgba(56,189,248,.45);background:linear-gradient(135deg,#f2f8ff,var(--panel));}
  .lv .e{font-size:24px;}
  .lv b{display:block;font-size:15px;margin-top:4px;}
  .lv small{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.5;}
  .lv .tick{position:absolute;right:10px;top:10px;font-size:11px;font-weight:800;color:#0e86c9;}

  /* ---------- 一词一圈 ---------- */
  .wordstrip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;
    -webkit-overflow-scrolling:touch;}
  .wordstrip button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:var(--panel);
    border-radius:14px;padding:8px 10px;box-shadow:var(--shadow-s);font-family:inherit;cursor:pointer;
    font-size:10.5px;font-weight:800;color:#2f6fa8;min-width:58px;border:2px solid transparent;}
  .wordstrip button.on{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.10);color:#0c7fb8;}
  .wordstrip button .em{font-size:20px;}
  .wordstrip button .dt{width:5px;height:5px;border-radius:50%;background:rgba(14,134,201,.16);}
  .wordstrip button.done .dt{background:#0f9d63;}

  /* ---------- quiz ---------- */
  .qcard{background:var(--panel);border-radius:24px;padding:22px;box-shadow:var(--shadow);text-align:center;}
  .qcard .q{font-size:14px;color:var(--sub);}
  .qcard .speaker{width:96px;height:96px;border-radius:50%;border:0;margin:14px auto 6px;display:grid;place-items:center;
    font-size:38px;background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(37,99,235,.22));cursor:pointer;box-shadow:0 10px 22px rgba(255,143,190,.3);}
  .qcard .speaker:active{transform:scale(.94);}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .opt{background:#f2f8ff;border:2px solid rgba(14,134,201,.22);border-radius:18px;padding:14px 8px;font-family:inherit;cursor:pointer;
    color:var(--ink);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .opt b{font-size:20px;}
  .opt span{font-size:14px;font-weight:800;}
  .opt:active{transform:scale(.96);}
  .opt.right{background:rgba(34,197,94,.16);border-color:#0f9d63;}
  .opt.wrong{background:rgba(240,90,105,.14);border-color:#e04a5c;}
  .qscore{font-size:12px;color:var(--sub);}

  /* ---------- nav ---------- */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:30;
    display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(14,134,201,.16);}
  nav button{flex:1;border:0;background:transparent;font-family:inherit;padding:8px 4px;color:var(--sub);
    font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:14px;}
  nav button i{font-size:20px;font-style:normal;filter:grayscale(1);opacity:.55;transition:.2s;}
  nav button.on{color:#0e86c9;}
  nav button.on i{filter:none;opacity:1;transform:translateY(-1px);}

  /* ---------- toast & modal ---------- */
  #toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(61,43,53,.92);color:var(--panel);
    padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:80%;text-align:center;}
  #toast.on{opacity:1;transform:translate(-50%,0);}
  #modal{position:fixed;inset:0;background:rgba(61,43,53,.42);display:none;place-items:center;z-index:90;padding:24px;}
  #modal.on{display:grid;}
  .sheet{background:var(--panel);border-radius:26px;padding:26px 22px;text-align:center;max-width:320px;width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.22);animation:pop .28s ease;}
  .sheet .big{font-size:54px;}
  .sheet h3{margin:8px 0 6px;font-size:20px;}
  .sheet p{margin:0 0 18px;font-size:13px;color:var(--sub);line-height:1.6;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden;}
  .confetti i{position:absolute;width:9px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards;}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(520deg);opacity:0}}

  /* ---------- 科目切换（佩妮英语 / 小羊语文） ---------- */
  .subjsel{position:relative;margin-bottom:12px;}
  .subjsel select{-webkit-appearance:none;appearance:none;width:100%;background:var(--panel);border:2px solid rgba(14,134,201,.20);
    border-radius:20px;padding:12px 44px 12px 16px;font-family:inherit;font-size:15px;font-weight:800;color:#152a45;
    box-shadow:var(--shadow-s);}
  .subjsel .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#0e86c9;font-size:14px;pointer-events:none;}

  /* ---------- 语文：识字 / 拼音 ---------- */
  .zcard{background:var(--panel);border-radius:24px;padding:22px 18px;box-shadow:var(--shadow);text-align:center;}
  .zbig{font-size:86px;line-height:1.1;font-weight:800;color:#152a45;font-family:"KaiTi","STKaiti","Kaiti SC",serif;}
  .zpy{font-size:16px;color:#0e86c9;font-weight:800;letter-spacing:1px;}
  .zchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;}
  .zchip{background:#f2f8ff;border:2px solid rgba(14,134,201,.22);border-radius:16px;padding:8px 14px;font-size:14px;font-weight:800;
    color:#2f6fa8;font-family:inherit;cursor:pointer;}
  .zchip.on{background:linear-gradient(135deg,#38bdf8,#2563eb);color:var(--panel);border-color:transparent;}
  .zline{background:#eaf4ff;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:13.5px;line-height:1.75;
    color:#4d6b8a;text-align:left;}
  .zline b{color:#0c7fb8;}
  .pysplit{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .pysplit button{background:rgba(37,99,235,.18);border:2px solid #c7ddf3;border-radius:16px;padding:10px 16px;font-family:inherit;
    font-size:15px;font-weight:800;color:#1b6fb0;cursor:pointer;}

  /* ---------- 语文：阶梯口述 ---------- */
  .stage-card{background:var(--panel);border-radius:24px;padding:20px 18px;box-shadow:var(--shadow);text-align:center;}
  .stage-card h3{margin:8px 0 2px;font-size:17px;}
  .ring{width:130px;height:130px;border-radius:50%;margin:10px auto;display:grid;place-items:center;

<script>
/* ======================= 基础工具 ======================= */
const $ = (s, r = document) => r.querySelector(s);

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && typeof s === 'object') return Object.assign({ learned: {}, done: {}, doneSentence: {}, doneStory: {}, stars: 0, lastVisit: '' }, s);
  } catch (e) {}
  return { learned: {}, done: {}, doneSentence: {}, doneStory: {}, stars: 0, lastVisit: '' };
}
let S = loadState();
const save = () => { try { localStorage.setItem(baseKey(), JSON.stringify(S)); } catch (e) {} };
const learnedOf = d => (S.learned[d] || []);
const isLearned = (d, i) => learnedOf(d).includes(i);

/* 连续学习天数 */
(function streak() {
  const today = new Date().toDateString();
  if (S.lastVisit !== today) {
    const y = new Date(Date.now() - 864e5).toDateString();
    S.streak = S.lastVisit === y ? (S.streak || 0) + 1 : 1;
    S.lastVisit = today;
    save();
  }
})();

/* ======================= 语音 ======================= */
let VOICE = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  VOICE = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, opt) {
  opt = opt || {};
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读，请用 Chrome / Safari / 微信打开'); opt.onend && opt.onend(); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = opt.rate || 0.82;
  u.pitch = opt.pitch || 1.12;
  u.volume = 1;
  if (VOICE) u.voice = VOICE;
  u.onend = () => opt.onend && opt.onend();
  u.onerror = () => opt.onend && opt.onend();
  speechSynthesis.speak(u);
}

function houseSVG() {

/* 小猪佩奇式金雨靴（一双，鞋头朝外）—— boots 一幕专用，替代 👢 emoji */
function bootsSVG(x, y, s) {
  s = s || 1;
  const boot = `<path d="M0 2 L0 -38 Q0 -46 8 -46 Q16 -46 16 -38 L16 -16 Q16 -11 21 -9 Q30 -5 30 2 Q30 5 26 5 L3 5 Q0 5 0 3 Z"
      fill="#ffce3c" stroke="#d99a12" stroke-width="2.5" stroke-linejoin="round"/>

    <ellipse cx="5" cy="-28" rx="3" ry="8" fill="#ffffff" opacity=".35"/>`;

    <g transform="translate(-13,0) scale(-1,1)">${boot}</g>
    <g transform="translate(13,0)">${boot}</g>
  </g>`;
}

function sceneSVG(sc) {
  const W = 360, H = 220, groundY = 178, id = 'sky' + (++GID);
  const bg = sc.bg || 'garden';
  let sky1 = '#cfeeff', sky2 = '#f2fbff', ground = '#8ed86a', groundDark = '#7ac95c';
  let sun = false, clouds = 2, rain = false, snow = false, night = false, indoor = false, house = false, pond = false;
  let park = false, shop = false, school = false, zoo = false;

  if (bg === 'home' || bg === 'kitchen') { indoor = true; sky1 = bg === 'home' ? '#ffe9d2' : '#ffeede'; sky2 = '#fffaf3'; ground = '#ecc49e'; groundDark = '#dfae82'; }
  else if (bg === 'pond') { pond = true; sun = true; }
  else if (bg === 'rain') { sky1 = '#a9bdd0'; sky2 = '#dce8f1'; rain = true; clouds = 3; ground = '#7fce6a'; groundDark = '#69b857'; }
  else if (bg === 'snow') { sky1 = '#dbe9f6'; sky2 = '#fbfdff'; snow = true; clouds = 2; ground = '#ffffff'; groundDark = '#eaf3fb'; }
  else if (bg === 'night') { sky1 = '#2f2a5c'; sky2 = '#6b5590'; night = true; ground = '#4b6b52'; groundDark = '#3c5843'; }
  else if (bg === 'park') { park = true; sun = true; ground = '#94de74'; groundDark = '#7ac95c'; }
  else if (bg === 'shop') { shop = true; clouds = 1; ground = '#e8d6c4'; groundDark = '#d6bfa9'; }
  else if (bg === 'school') { school = true; sun = true; ground = '#c9dfa0'; groundDark = '#b3cd8a'; }
  else if (bg === 'zoo') { zoo = true; sun = true; ground = '#a8d98c'; groundDark = '#8fc574'; }
  else { sun = true; house = true; }

  let out = `<svg class="scene" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${id})"/>`;

  if (night) {
    out += `<circle cx="300" cy="42" r="17" fill="#fff6d6"/><circle cx="290" cy="36" r="14" fill="${sky1}"/>`;
    [[40, 34], [90, 60], [250, 26], [330, 92], [140, 30]].forEach(p => {
      out += `<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="#fff" opacity=".85"/>`;
    });
  }
  if (sun) {
    out += `<g><circle cx="304" cy="42" r="26" fill="#ffd166" opacity=".28"/>
      <circle cx="304" cy="42" r="16" fill="#ffd166"/></g>`;
  }
  for (let i = 0; i < clouds; i++) {
    out += cloudSVG(52 + i * 96, 34 + (i % 2) * 22, 0.85 + (i % 2) * 0.2, night ? 0.32 : 0.9);
  }
  if (indoor) out += roomSVG(bg);
  out += `<rect x="0" y="${groundY}" width="${W}" height="${H - groundY}" fill="${ground}"/>`;
  if (pond) out += `<ellipse cx="180" cy="206" rx="158" ry="22" fill="#63c3e8"/><ellipse cx="180" cy="203" rx="148" ry="17" fill="#7fd4f0"/>`;

  if (!pond && !indoor) {
    out += `<ellipse cx="46" cy="${groundY + 2}" rx="90" ry="20" fill="${groundDark}" opacity=".45"/>
            <ellipse cx="320" cy="${groundY + 4}" rx="80" ry="18" fill="${groundDark}" opacity=".4"/>`;
  }
  if (house) out += houseSVG();
  if (snow) out += `<ellipse cx="120" cy="${groundY + 6}" rx="70" ry="14" fill="#fff" opacity=".9"/>`;

  /* 公园：树 + 秋千 + 滑梯 */
  if (park) {
    out += `<g transform="translate(56,0)">
      <rect x="-6" y="${groundY - 44}" width="12" height="46" fill="#b07d52" rx="4"/>
      <circle cx="0" cy="${groundY - 60}" r="30" fill="#5fbf62"/><circle cx="-22" cy="${groundY - 48}" r="20" fill="#6fcd6f"/>
      <circle cx="22" cy="${groundY - 50}" r="18" fill="#55b158"/></g>
      <g transform="translate(300,0)">
        <rect x="-4" y="132" width="8" height="48" fill="#b07d52" rx="3"/>
        <circle cx="0" cy="122" r="26" fill="#5fbf62"/><circle cx="18" cy="134" r="16" fill="#6fcd6f"/></g>
      <g transform="translate(178,0)" opacity=".95">
        <path d="M-40 132 L0 96 L40 132" stroke="#c58b5e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="-30" y="132" width="60" height="7" rx="3" fill="#e0a877"/>
        <line x1="-16" y1="138" x2="-16" y2="158" stroke="#9fb3c6" stroke-width="2"/>
        <line x1="16" y1="138" x2="16" y2="158" stroke="#9fb3c6" stroke-width="2"/>
        <rect x="-22" y="158" width="44" height="7" rx="3" fill="#ffb3d1"/></g>`;
  }
  /* 商店 / 超市 */
  if (shop) {
    out += `<g transform="translate(250,0)">
      <rect x="-56" y="${groundY - 62}" width="112" height="64" rx="6" fill="#ffe9c9"/>
      <rect x="-62" y="${groundY - 68}" width="124" height="12" rx="5" fill="#ff8d7a"/>
      <rect x="-44" y="${groundY - 50}" width="36" height="26" rx="4" fill="#bfe6ff"/>
      <rect x="6" y="${groundY - 50}" width="34" height="48" rx="4" fill="#d9a97f"/>
      <rect x="-46" y="${groundY - 78}" width="60" height="9" rx="4" fill="#7fdca6"/></g>`;
  }
  /* 学校 */
  if (school) {
    out += `<g transform="translate(258,0)">
      <rect x="-66" y="${groundY - 74}" width="132" height="76" rx="7" fill="#fff2dd"/>
      <path d="M-76 ${groundY - 74} L0 ${groundY - 112} L76 ${groundY - 74} Z" fill="#7ab8e8"/>
      <rect x="-12" y="${groundY - 34}" width="24" height="36" rx="3" fill="#c98b62"/>
      <rect x="-52" y="${groundY - 58}" width="18" height="18" rx="3" fill="#bfe6ff"/>
      <rect x="-24" y="${groundY - 58}" width="18" height="18" rx="3" fill="#bfe6ff"/>
      <rect x="18" y="${groundY - 58}" width="18" height="18" rx="3" fill="#bfe6ff"/>
      <rect x="44" y="0" width="5" height="${groundY}" fill="#cfd8e3"/>
      <path d="M49 6 L78 14 L49 22 Z" fill="#ff9ec4"/></g>`;
  }
  /* 动物园：栅栏 */
  if (zoo) {
    out += `<g stroke="#d6bfa9" stroke-width="5" stroke-linecap="round">
      ${[18, 52, 86, 120, 154, 290, 324].map(x => `<line x1="${x}" y1="${groundY - 26}" x2="${x}" y2="${groundY}"/>`).join('')}
      <line x1="6" y1="${groundY - 18}" x2="166" y2="${groundY - 18}"/>
      <line x1="278" y1="${groundY - 18}" x2="342" y2="${groundY - 18}"/></g>`;
  }

  // 角色（池塘场景让角色站在岸边）
  const cast = sc.cast || [];
  const n = cast.length;
  const castGround = groundY + 2;
  const xs = n === 1 ? [180] : n === 2 ? [120, 238] : n === 3 ? [78, 180, 282] : [66, 146, 226, 306];
  cast.forEach((k, idx) => {
    const x = xs[idx] || 180;
    if (PIGS[k]) out += pigSVG(x, castGround, k);
    else if (ANIMALS[k]) out += `<text x="${x}" y="${castGround - 4}" font-size="50" text-anchor="middle">${ANIMALS[k]}</text>`;
  });
  /* 画面里出现的「单词物体」——把这一集的词直接画进场景，让孩子看得见 */
  if (sc.word) {
    const e = MNEMONIC[(sc.word || '').toLowerCase()];
    const prop = (e && e.scene && e.scene.prop) || '';
    if (prop === '👢' || (sc.word || '').toLowerCase() === 'boots') {
      out += `<g transform="translate(180,${groundY - 96})">
        <circle cx="0" cy="6" r="34" fill="#ffffff" opacity=".55"/>
        ${bootsSVG(0, 26, 1)}
      </g>`;
    } else if (prop) {
      out += `<g transform="translate(180,${groundY - 96})">
        <circle cx="0" cy="6" r="34" fill="#ffffff" opacity=".55"/>
        <text x="0" y="18" font-size="44" text-anchor="middle">${prop}</text>
      </g>`;
    }
  }

  // 道具
  if (sc.prop) {
    const px = n === 1 ? 268 : 320;
    if (sc.prop === '👢') {
      out += bootsSVG(px, groundY + 30, 1.15);
    } else {
      const py = groundY + 40;
      const size = sc.prop.length > 3 ? 22 : 30;
      out += `<text x="${px}" y="${py}" font-size="${size}" text-anchor="middle">${sc.prop}</text>`;
    }
  }

  if (rain) {
    for (let i = 0; i < 26; i++) {
      const x = (i * 37) % 360, y = (i * 53) % 150;
      out += `<line x1="${x}" y1="${y}" x2="${x - 4}" y2="${y + 16}" stroke="#ffffff" stroke-width="2" opacity=".55" stroke-linecap="round"/>`;
    }
  }
  if (snow) {
    for (let i = 0; i < 22; i++) {
      const x = (i * 61) % 356, y = (i * 47) % 170;
      out += `<circle cx="${x}" cy="${y}" r="${1.6 + (i % 3)}" fill="#fff" opacity=".9"/>`;
    }
  }
  out += `</svg>`;
  return out;
}

/* ======================= 视图：拼句子 ======================= */
function sentenceTokens() {
  const day = dayOf(DAY), w = day.words[SENT.i];
  const src = w.sent || w.tip;
  if (src) return { tokens: src.trim().split(/\s+/), w: w };
  const parts = (day.pattern && day.pattern.en || '').split('___');
  const left = (parts[0] || '').trim().split(/\s+/).filter(Boolean);
  const right = (parts[1] || '').trim().split(/\s+/).filter(Boolean);
  const mid = w.art ? w.art.split(' ') : [];
  const tokens = left.concat(mid, [w.w]);
  // 标点并回上一个词（"___." → "mummy."）
  if (right.length && /^[.,!?;:]+$/.test(right[0])) {
    tokens[tokens.length - 1] += right.shift();
  }
  return { tokens: tokens.concat(right), w: w };
}
function startSentence() {
  const { tokens } = sentenceTokens();
  SENT.pool = shuffle(tokens.slice());
  SENT.answer = [];
  SENT.hintIdx = -1;
}

/* ======================= 一词一幕：把「一个单词」变成一个小动画 =======================
 * 每一幕 = 当天的第 i 个单词。画面用该词的速记分镜（场景/角色/道具），
 * 台词固定三句结构：①喊出这个词 ②用这个词说一句话 ③佩妮的反应（把词和情绪绑在一起）。
 * 孩子看完一幕，就有一个词和一段画面绑在一起。
 */
const HEAD_CN = {
  penny: '佩妮', tommy: '汤米', mummy: '妈妈', daddy: '爸爸',
  duck: '小鸭', cat: '小猫', dog: '小狗', rabbit: '小兔', bird: '小鸟',
  monkey: '猴子', panda: '熊猫', bear: '小熊', tiger: '老虎'
};
const HEAD_EN = {
  penny: 'Penny', tommy: 'Tommy', mummy: 'Mummy', daddy: 'Daddy',
  duck: 'Duck', cat: 'Cat', dog: 'Dog', rabbit: 'Rabbit', bird: 'Bird',
  monkey: 'Monkey', panda: 'Panda', bear: 'Bear', tiger: 'Tiger'
};

function wordScene(w) {
  const m = mnemoOf(w);
  const sd = m.scene || {};
  const peers = (sd.cast || ['penny']).filter(k => k !== 'penny');
  const cast = ['penny'].concat(peers);
  const pal = peers[0] || 'tommy';
  const src = w.sent || w.tip || w.w;
  return {
    word: w.w,
    emoji: w.emoji,
    bg: sd.bg || 'garden',
    cast: cast,
    prop: sd.prop || w.emoji,
    lines: [
      { who: 'Penny', en: w.w + '!', cn: w.cn + '！' },
      { who: 'Penny', en: src, cn: w.tipCn || '' },
      { who: 'Look', en: sd.line || src, cn: m.scene.hook || w.tipCn || '' }
    ]
  };
}

/* 当天所有单词幕 + 一个收尾幕（把词串起来） */
function scenesOf() {

      { who: 'Tommy', en: 'Hooray!', cn: '太棒啦！' }

  return list;
}

function playScene() {
  const day = dayOf(DAY), scenes = scenesOf(), sc = scenes[clamp(ST.i, 0, scenes.length - 1)];
  stopSpeak();
  const token = ++ST.token;
  const lines = document.querySelectorAll('#bubbleBox .line');
  const step = k => {
    if (token !== ST.token) return;
    if (k >= sc.lines.length) {
      ST.playing = false;
      if (ST.i === scenes.length - 1) { finishStory(); }
      return;
    }
    lines.forEach(el => el.classList.remove('active'));
    if (lines[k]) { lines[k].classList.add('active'); if (lines[k].scrollIntoView) { try { lines[k].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} } }
    speak(sc.lines[k].en, { rate: 0.78, onend: () => setTimeout(() => step(k + 1), 420) });
  };
  step(0);
}

const zhDays = () => (SUBJECTS.zh.sets[LEVEL] || []);
const zhDay = d => { const a = zhDays(); return a.find(x => x.day === d) || a[0]; };
const flatChars = () => zhDays().reduce((a, d) => a.concat(d.chars || []), []);

function speakCn(text, opt) {
  opt = opt || {};
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读'); opt.onend && opt.onend(); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = 'zh-CN';
  u.rate = opt.rate || 0.9;
  u.pitch = 1;
  u.onend = () => opt.onend && opt.onend();
  u.onerror = () => opt.onend && opt.onend();
  speechSynthesis.speak(u);
}

/* 拼音朗读修复：语音引擎会把 ch、ūn 读成英文字母，改成映射为同音汉字再朗读 */
const SM_MAP = { b:'玻', p:'坡', m:'摸', f:'佛', d:'得', t:'特', n:'讷', l:'勒', g:'哥', k:'科', h:'喝',
  j:'鸡', q:'七', x:'西', zh:'知', ch:'吃', sh:'诗', r:'日', z:'资', c:'雌', s:'丝', y:'衣', w:'乌' };
const YM_MAP = {
  'iào':'要', 'ián':'言', 'iú':'由', 'iā':'鸦', 'iāng':'央', 'iāo':'妖', 'iě':'也', 'iǎo':'咬', 'iǔ':'友',
  'ué':'月', 'uě':'月', 'üe':'月', 'uā':'蛙', 'uō':'窝', 'uǎn':'晚', 'uǒ':'我',
  'à':'啊', 'á':'啊', 'ā':'啊', 'āi':'哀', 'ǎi':'矮', 'ài':'爱',
  'àn':'按', 'ān':'安', 'ǎn':'俺', 'án':'安', 'áng':'昂', 'āng':'昂', 'àng':'昂',
  'è':'饿', 'é':'鹅', 'ē':'阿', 'ě':'恶', 'ī':'衣', 'í':'姨', 'ì':'意', 'ǐ':'以',
  'ū':'乌', 'ú':'无', 'ù':'物', 'ǔ':'五', 'ūn':'温', 'ún':'文', 'ùn':'问',
  'āo':'凹', 'áo':'熬', 'ǎo':'袄', 'ào':'奥', 'ēi':'欸', 'ěi':'伟',
  'ēng':'鞥', 'ěng':'鞥', 'éng':'鞥', 'èng':'鞥',
  'īng':'英', 'ìng':'硬', 'ǐng':'影',
  'ǒu':'偶', 'ōu':'欧', 'òu':'沤', 'ǒ':'哦', 'ō':'哦', 'ò':'哦'
};
/* 兜底：去掉声调后按基础韵母读 */
const YM_BASE = { a:'啊', o:'哦', e:'鹅', i:'衣', u:'乌', v:'迂', ai:'爱', ei:'欸', ui:'威', ao:'奥', ou:'欧',
  iu:'优', ie:'耶', ue:'月', ve:'月', er:'耳', an:'安', en:'恩', in:'因', un:'文', vn:'晕',
  ang:'昂', eng:'鞥', ing:'英', ong:'翁' };
const TONE_DIA = { 'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i',
  'ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v' };
function zhSound(t) {
  t = String(t || '').trim();
  if (!t) return t;
  if (SM_MAP[t]) return SM_MAP[t];
  if (YM_MAP[t]) return YM_MAP[t];
  const bare = t.split('').map(ch => TONE_DIA[ch] || ch).join('');
  if (/^[a-zü]+$/.test(bare) && YM_BASE[bare]) return YM_BASE[bare];
  return t;
}
function zhSpell(c) {
  return [zhSound(c.sm), zhSound(c.ym), c.z].join('，');
}

/* 二年级阶梯口述：一个字 → 词 → 短语 → 句子 → 段落 → 作文 */
const ZSTAGES = [
  { t: 2,  key: 'words', name: '组词',   label: '2 秒组一个词',    tip: '看到这个字，马上说出一个词语' },
  { t: 5,  key: 'phrase', name: '短语',  label: '5 秒说一个短语',  tip: '给词语加个修饰，变成短语' },
  { t: 10, key: 'sent',  name: '句子',   label: '10 秒造一个句子', tip: '用这个词说一句完整的话' },
  { t: 60, key: 'low',   name: '低级段落', label: '1 分钟说一小段', tip: '把句子连起来，说一段简单的话' },
  { t: 45, key: 'mid',   name: '中级段落', label: '45 秒改得更具体', tip: '马上按记忆把这段改具体一点' },
  { t: 40, key: 'high',  name: '高级段落', label: '40 秒说得更好',  tip: '加上看到的、听到的、想到的' },
  { t: 60, key: 'essay', name: '口述作文', label: '1 分钟口述小作文', tip: '有开头有结尾，说一篇小作文' }
];
function demoOfStage(day, c, key) {
  if (key === 'words') return (c.words || []).join('、');
  if (key === 'phrase') return c.phrase || '';
  if (key === 'sent') return c.sent || '';
  return (day.para && day.para[key]) || day.scene || day.short || '';
}

/* 示范切成小段：组词按「、」切，其余按句子切。
 * 逐段朗读 + 高亮当前段，孩子能看到「读到哪、跟到哪」。 */
function demoSegments(text, key) {
  const s = String(text || '').trim();
  if (!s) return [];
  if (key === 'words') return s.split(/[、,，]/).map(x => x.trim()).filter(Boolean);
  const out = s.match(/[^。！？!?；;\n]+[。！？!?；;]?/g) || [s];
  return out.map(x => x.trim()).filter(Boolean);
}

let ZREAD = 0;
function stopRead() {
  ZREAD++;
  try { speechSynthesis.cancel(); } catch (e) {}
}
/* 读示范：一段一段读，读到哪句哪句亮起来 */
function readDemo(opt) {
  opt = opt || {};
  const day = zhDay(DAY), c = (day.chars || [])[ZSTEP.i] || {};
  const st = ZSTAGES[ZSTEP.stage];
  const segs = demoSegments(demoOfStage(day, c, st.key), st.key);
  const boxes = document.querySelectorAll('#demoBox .seg');
  const token = ++ZREAD;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (!segs.length) return;
  const step = k => {
    if (token !== ZREAD) return;
    if (k >= segs.length) { boxes.forEach(b => b.classList.remove('on')); return; }
    boxes.forEach(b => b.classList.remove('on'));
    if (boxes[k]) boxes[k].classList.add('on');
    speakCn(segs[k], {
      rate: opt.rate || 0.85,
      onend: () => setTimeout(() => step(k + 1), opt.gap === undefined ? 220 : opt.gap)
    });
  };
  step(0);
}

/* 进入某一阶：先给示范（自动读），孩子听完再点「我来说」 */
function enterZStage(k, delay) {
  stopTimer(); stopRead();
  ZSTEP.stage = Math.max(0, Math.min(k, ZSTAGES.length - 1));
  ZSTEP.left = 0; ZSTEP.running = false;
  ZSTEP.phase = 'demo'; ZSTEP.peek = false;
  render();
  setTimeout(() => { if (ZSTEP.phase === 'demo') readDemo(); }, delay || 300);
}
function finishZStep() {
  stopTimer(); stopRead();
  S.done[DAY + '-zstep'] = true; save(); addStar(1); confetti();
  toast('七阶全部走完啦 🎉');
  go('home');
}

/* 4. 阶梯口述（二年级）
 * 每一阶都走「先听示范 → 跟着读 → 自己说」三步：
 *   phase=demo  把这一阶的示范摆出来，自动读一遍，孩子有东西可以模仿
 *   phase=speak 计时口述；忘了可以再瞄一眼示范
 */
function demoBoxHTML(segs, st, phase) {
  return `<div class="demo" id="demoBox">
    <div class="demo-hd">${phase === 'demo' ? '① 先听示范' : '📖 示范'} · ${st.name} · ${st.label}</div>
    <div class="demo-txt">${segs.map((s, k) => `<span class="seg" data-k="${k}">${esc(s)}</span>`).join('')}</div>
    <div class="demo-ft">${phase === 'demo' ? '听一遍 → 跟着小声读一遍 → 再说自己的。' : '忘了就再听一遍，然后接着说。'}</div>
  </div>`;
}

function zStepView() {
  const day = zhDay(DAY), cs = day.chars || [], c = cs[ZSTEP.i] || cs[0];
  const st = ZSTAGES[ZSTEP.stage];
  const segs = demoSegments(demoOfStage(day, c, st.key), st.key);
  const phase = ZSTEP.phase || 'demo';
  const prevSt = ZSTEP.stage > 0 ? ZSTAGES[ZSTEP.stage - 1] : null;
  const prevDemo = prevSt ? demoOfStage(day, c, prevSt.key) : '';

  let card = '';
  if (phase === 'demo') {
    /* 第一步：先给例子 + 读出来 */
    card = `<div class="stage-card">
      <div class="zbig" style="font-size:56px;">${c.z}</div>
      <div class="zpy">${c.py}</div>
      <h3>第 ${ZSTEP.stage + 1} 阶 · ${st.name}</h3>
      <p class="sentence-hint" style="margin:2px 0 8px;">${st.tip} · ${st.label}</p>
      ${prevSt ? `<div class="ladder">上一阶「${prevSt.name}」你是这么说的：<b>${esc(prevDemo)}</b></div>` : ''}
      ${demoBoxHTML(segs, st, 'demo')}
      <div class="btnrow" style="margin-top:12px;">
        <button class="btn" data-act="zReadDemo">🔊 读给我听</button>
        <button class="btn soft" data-act="zReadDemoSlow">🐢 慢一点</button>
      </div>
      <button class="btn pri" style="width:100%;margin-top:10px;padding:15px;" data-act="zToSpeak">② 我来说（开始计时）→</button>
      <p class="sentence-hint">先听示范，跟着读，再自己说——说得不一样更好。</p>
    </div>`;
  } else {
    /* 第二步：孩子口述，计时；示范折叠起来随时能看 */
    const pct = Math.round((st.t - (ZSTEP.left || 0)) / st.t * 100);
    const label = ZSTEP.running ? '⏸ 暂停' : (ZSTEP.left && ZSTEP.left !== st.t ? '▶️ 继续' : '▶️ 开始说');
    const timeTxt = ZSTEP.left > 0 ? ZSTEP.left + 's' : '⏰';
    card = `<div class="stage-card">
      <div class="zbig" style="font-size:48px;">${c.z}</div>
      <div class="zpy">${c.py}</div>
      <h3>第 ${ZSTEP.stage + 1} 阶 · ${st.name}</h3>
      <p class="sentence-hint" style="margin:2px 0 4px;">现在轮到你说：${st.tip}</p>
      <div class="ring" style="--p:${pct}%"><div class="in" id="zstepTime">${timeTxt}</div></div>
      <div class="btnrow">
        <button class="btn ${ZSTEP.running ? 'soft' : 'pri'}" data-act="zTimer">${label}</button>
        <button class="btn soft" data-act="zResetTimer">↺ 重来</button>
      </div>
      ${ZSTEP.peek
        ? demoBoxHTML(segs, st, 'speak') + `<button class="btn soft" style="width:100%;margin-top:8px;" data-act="zPeek">收起示范</button>`
        : `<button class="btn soft" style="width:100%;margin-top:10px;" data-act="zPeek">📖 忘了？看一眼示范</button>`}
      <div class="btnrow" style="margin-top:10px;">
        <button class="btn soft" data-act="zReadDemo">🔊 再示范一遍</button>
        <button class="btn pri" data-act="zDone">✓ 说完了</button>
      </div>
    </div>`;
  }

  return `${zTopbar('阶梯口述', '先听示范 → 再自己说', ZSTEP.stage, ZSTAGES.length)}
  <div class="stages">
    ${ZSTAGES.map((s, k) => `<button class="${k === ZSTEP.stage ? 'on' : ''} ${k < ZSTEP.stage ? 'done' : ''}" data-act="zGoStage" data-k="${k}">${s.name}</button>`).join('')}
  </div>
  ${card}
  <div class="zchips" style="margin-top:12px;">
    ${cs.map((x, k) => `<button class="zchip ${ZSTEP.i === k ? 'on' : ''}" data-act="zStepChar" data-k="${k}">${x.z}</button>`).join('')}
  </div>
  <div class="btnrow" style="margin-top:12px;">
    <button class="btn soft" data-act="zPrevStage">← 上一阶</button>
    <button class="btn pri" data-act="zNextStage">下一阶 ➜</button>
  </div>
  <p class="sentence-hint">二年级口述训练：2 秒组词 → 5 秒短语 → 10 秒造句 → 1 分钟说一段 → 越说越好。</p>`;
}

function stopTimer() { if (ZSTEP.tm) { clearInterval(ZSTEP.tm); ZSTEP.tm = null; } ZSTEP.running = false; }
function zTick() {
  if (!ZSTEP.running) return;
  const st = ZSTAGES[ZSTEP.stage];
  ZSTEP.left = Math.max(0, ZSTEP.left - 1);
  const el = $('#zstepTime');
  if (el) el.textContent = ZSTEP.left + 's';
  const ring = $('.ring');
  if (ring) ring.style.setProperty('--p', Math.round((st.t - ZSTEP.left) / st.t * 100) + '%');
  if (ZSTEP.left <= 0) {
    stopTimer();
    ZSTEP.peek = true;
    render();
    toast('时间到！说完了吗？看看示范对照一下');
    speakCn('时间到');
  }
}

/* 语文小测验：看字选拼音 / 看拼音选字 */
function zhQuizBuild() {
  const day = zhDay(DAY), cs = day.chars || [], c = cs[QZ.i] || cs[0];
  const type = QZ.i % 2 === 0 ? 'z2py' : 'py2z';
  const others = flatChars().filter(x => x.z !== c.z);
  const seen = {};
  const pool = others.map(x => (type === 'z2py' ? x.py : x.z)).filter(v => (seen[v] ? false : (seen[v] = 1)));
  QZ.type = type;
  QZ.opts = shuffle([(type === 'z2py' ? c.py : c.z)].concat(shuffle(pool).slice(0, 3)));
  QZ.answered = false;
}

  const day = zhDay(DAY), cs = day.chars || [], c = cs[QZ.i] || cs[0];

/* ======================= 错题整理（英语 + 语文通用） ======================= */
const todayStr = () => new Date().toDateString();
const mistakes = () => (S.mistakes || (S.mistakes = []));
const MKIND = {
  'en-word': '英语 · 单词', 'en-sentence': '英语 · 拼句子',
  'zh-py': '语文 · 拼音', 'zh-z': '语文 · 识字'
};
function recordMistake(kind, q, correct, wrong) {
  const arr = mistakes();
  const last = arr[arr.length - 1];
  if (last && last.kind === kind && last.q === q && last.wrong === wrong && Date.now() - last.ts < 6000) return;
  arr.push({ kind: kind, q: q, correct: correct, wrong: wrong, day: DAY, ts: Date.now(), d: todayStr() });
  if (arr.length > 120) arr.splice(0, arr.length - 120);
  save();
}
function mkItem(m) {
  const when = new Date(m.ts).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<div class="mk">
    <div class="hd"><span class="tag2">${MKIND[m.kind] || m.kind}</span>Day ${m.day} · ${when}</div>
    <div class="q">${esc(m.q)}</div>
    <div class="a">正确：<b>${esc(m.correct)}</b>　答成：<i>${esc(m.wrong || '—')}</i></div>
    <div class="ops">
      <button data-act="mkReview" data-day="${m.day}" data-kind="${m.kind}">去复习</button>
      <button data-act="mkDel" data-ts="${m.ts}">移除</button>
    </div>
  </div>`;
}
function mistakesView() {
  const arr = mistakes().slice().reverse();
  const today = todayStr();
  const t = arr.filter(m => m.d === today);
  const old = arr.filter(m => m.d !== today).slice(0, 20);
  return `<div class="topbar">
    <button class="back" data-act="back">←</button>
    <div class="t">错题整理<small>今天的错题，睡前过一遍</small></div>
    <div class="spacer"></div>
  </div>
  <div class="sec-title">今日错题 <span>${t.length} 条</span></div>
  ${t.length ? t.map(mkItem).join('') : `<div class="note">今天还没有错题，太棒啦 🎉</div>`}
  ${old.length ? `<div class="sec-title">更早的错题 <span>最近 ${old.length} 条</span></div>${old.map(mkItem).join('')}` : ''}
  ${arr.length ? `<button class="btn soft" style="width:100%;margin-top:10px" data-act="mkClear">🧹 清空错题本</button>` : ''}
  <div class="note" style="margin-top:12px;">错题来自：英语单词测验、英语拼句子、语文识字 / 拼音测验。<br>每天睡前带孩子过一遍「今日错题」，比多做一套新题更管用。</div>`;
}

/* ======================= 渲染 & 事件 ======================= */
function render() {
  const app = $('#app');
  if (VIEW.name === 'sentence' && !SENT.pool.length && !SENT.answer.length) { SENT.i = 0; startSentence(); }
  if (VIEW.name === 'quiz' && !QZ.opts.length) startQuiz();
  if (VIEW.name === 'home') app.innerHTML = homeView();
  else if (VIEW.name === 'week') app.innerHTML = weekView();
  else if (VIEW.name === 'me') app.innerHTML = meView();
  else if (VIEW.name === 'words') app.innerHTML = wordsView();
  else if (VIEW.name === 'sentence') app.innerHTML = sentenceView();
  else if (VIEW.name === 'story') app.innerHTML = storyView();
  else if (VIEW.name === 'quiz') app.innerHTML = (SUBJ === 'zh' ? zhQuizView() : quizView());
  else if (VIEW.name === 'zword') app.innerHTML = zWordView();
  else if (VIEW.name === 'zpy') app.innerHTML = zPyView();
  else if (VIEW.name === 'zmake') app.innerHTML = zMakeView();
  else if (VIEW.name === 'zstep') app.innerHTML = zStepView();
  else if (VIEW.name === 'mistakes') app.innerHTML = mistakesView();
  $('#starNum').textContent = S.stars || 0;
  const sbi = $('#sbEmoji'), sbt = $('#sbTitle');
  if (sbi) sbi.textContent = SUBJECTS[SUBJ].emoji;
  if (sbt) sbt.innerHTML = SUBJECTS[SUBJ].name + '<small>' + SUBJECTS[SUBJ].sub + '</small>';
  const tab = VIEW.name === 'home' ? 'home' : VIEW.name === 'week' ? 'week' : VIEW.name === 'me' ? 'me' : 'home';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  window.scrollTo({ top: 0 });
}
const go = (name) => { stopSpeak(); stopTimer(); ST.playing = false; ST.token++; VIEW.name = name; render(); };

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('on'), 1600);
}
function addStar(n) {
  S.stars = (S.stars || 0) + n; save();
  const el = $('#starNum'); if (el) el.textContent = S.stars;
}
function confetti() {
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#3fd8ff', '#ffd166', '#8ec8ff', '#4dffa6', '#c3a6ff', '#5fdcff'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = '-20px';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * .5) + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2600);
}
function openSheet(html) {
  $('#sheet').innerHTML = html;
  $('#modal').classList.add('on');
}
function closeSheet() { $('#modal').classList.remove('on'); }

function finishStory() {
  if (S.doneStory[DAY]) { toast('这一集已经看完啦'); return; }
  S.doneStory[DAY] = true; save();
  addStar(2); confetti();
  openSheet(`<div class="big">🎬</div><h3>第 ${DAY} 集看完啦！</h3>
    <p>${dayOf(DAY).themeCn} 的小故事听完咯，奖励 2 颗星星 ⭐⭐<br>别忘了做小测验～</p>
    <button class="btn pri" style="width:100%" data-act="startQuizFromSheet">去做小测验</button>
    <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">先逛逛</button>`);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'tab') {
    const tab = el.dataset.tab;
    if (tab === 'home') { VIEW.name = 'home'; }
    else { VIEW.name = tab; }
    stopSpeak(); ST.playing = false; ST.token++; render();
    return;
  }
  if (act === 'closeModal') { if (e.target.id === 'modal' || el.dataset.act === 'closeModal') closeSheet(); return; }
  if (act === 'say') {
    e.stopPropagation();
    speak(el.dataset.say, { rate: parseFloat(el.dataset.rate || '0.82') });
    return;
  }
  if (act === 'zSay') {
    e.stopPropagation();
    speakCn(zhSound(el.dataset.t), { rate: parseFloat(el.dataset.rate || '0.9') });
    return;
  }

  switch (act) {
    case 'back': go('home'); break;
    case 'pickDay': {
      DAY = parseInt(el.dataset.day, 10);
      WORD_I = 0; SENT = { i: 0, pool: [], answer: [], hintIdx: -1 }; ST.i = 0;
      ZHI.i = 0; ZMAKE.i = 0; ZMAKE.picked = -1; ZSTEP.stage = 0; ZSTEP.left = 0; ZSTEP.i = 0; ZSTEP.phase = 'demo'; ZSTEP.peek = false;
      stopTimer();
      startQuiz(); go('home');
      break;
    }
    case 'level': {
      const lv = el.dataset.lv;
      if (lv === LEVEL) { toast('已经在这个档位啦'); break; }
      switchLevel(lv);
      go('home');
      toast((lv === 'kg' ? '已切到大班档' : '已切到二年级档') + ' · 每天 ' + lenOf(SETS[lv][0]) + ' ' + unitName());
      break;
    }
    case 'nextWord': if (WORD_I < dayOf(DAY).words.length - 1) { WORD_I++; render(); speak(dayOf(DAY).words[WORD_I].w); } break;
    case 'words': {
      const arr = learnedOf(DAY);
      const n = dayOf(DAY).words.length;
      WORD_I = 0;
      if (arr.length < n) {
        for (let k = 0; k < n; k++) { if (arr.indexOf(k) === -1) { WORD_I = k; break; } }
      }
      go('words');
      setTimeout(() => speak(dayOf(DAY).words[WORD_I].w), 260);
      break;
    }
    case 'learn': {
      if (!isLearned(DAY, WORD_I)) {
        S.learned[DAY] = learnedOf(DAY).concat([WORD_I]);
        addStar(1); save();
      }
      speak(dayOf(DAY).words[WORD_I].w, { rate: 0.75 });
      setTimeout(() => {
        if (WORD_I < dayOf(DAY).words.length - 1) { WORD_I++; render(); speak(dayOf(DAY).words[WORD_I].w); }
        else {
          S.done[DAY + '-words'] = true; save();
          confetti(); toast(dayOf(DAY).words.length + ' 个单词学完啦！去拼句子吧 🧩');
          go('home');
        }
      }, 380);
      break;
    }
    case 'prevWord': if (WORD_I > 0) { WORD_I--; render(); speak(dayOf(DAY).words[WORD_I].w); } break;

    case 'sentence':
      if (!SENT.pool.length) { SENT.i = 0; startSentence(); }
      go('sentence'); break;
    case 'tap': {
      const i = parseInt(el.dataset.i, 10);
      const t = SENT.pool.splice(i, 1)[0];
      SENT.answer.push(t);
      SENT.hintIdx = -1;
      render();
      const need = sentenceTokens().tokens.length;
      if (SENT.answer.length === need) setTimeout(() => autoCheck(), 260);
      break;
    }
    case 'untap': {
      const i = parseInt(el.dataset.i, 10);
      SENT.pool.push(SENT.answer.splice(i, 1)[0]);
      SENT.hintIdx = -1;
      render();
      break;
    }
    case 'hintSentence': {
      const { tokens } = sentenceTokens();
      const need = tokens[SENT.answer.length];
      if (!need) break;
      const pi = SENT.pool.indexOf(need);
      SENT.hintIdx = pi > -1 ? pi : -1;
      render();
      toast('下一个点：「' + need + '」');
      break;
    }
    case 'checkSentence': {
      const { tokens } = sentenceTokens();
      const ok = SENT.answer.join(' ') === tokens.join(' ');
      if (ok) {
        const full = tokens.join(' ');
        speak(full, { rate: 0.8 });
        if (!(S.doneSentence[DAY] || []).includes(SENT.i)) {
          S.doneSentence[DAY] = (S.doneSentence[DAY] || []).concat([SENT.i]);
          addStar(1); save();
        }
        confetti();
        setTimeout(() => {
          if (SENT.i < dayOf(DAY).words.length - 1) { SENT.i++; startSentence(); render(); }
          else {
            S.done[DAY + '-sentence'] = true; save();
            openSheet(`<div class="big">🧩</div><h3>${dayOf(DAY).words.length} 句话全部拼对！</h3>
              <p>单词变成句子啦，接下来看一集小动画吧～</p>
              <button class="btn pri" style="width:100%" data-act="storyFromSheet">去看动画 🎬</button>
              <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">稍后</button>`);
          }
        }, 700);
      } else {
        let k = 0;
        while (k < SENT.answer.length && SENT.answer[k] === tokens[k]) k++;
        const msg = k >= SENT.answer.length
          ? '下一个词是「' + tokens[k] + '」，点点看'
          : '第 ' + (k + 1) + ' 个词换成「' + tokens[k] + '」';
        if (SENT.answer.length === tokens.length) {
          const w = dayOf(DAY).words[SENT.i] || {};
          recordMistake('en-sentence', '拼句子：' + (w.tipCn || w.w || ''), tokens.join(' '), SENT.answer.join(' '));
        }
        const pi = SENT.pool.indexOf(tokens[k]);
        SENT.hintIdx = pi > -1 ? pi : -1;
        render();
        const slot = $('#slot');
        if (slot) { slot.classList.add('shake'); setTimeout(() => slot.classList.remove('shake'), 420); }
        toast(msg);
      }
      break;
    }
    case 'saySentence': {
      const { tokens } = sentenceTokens();
      speak(tokens.join(' '), { rate: 0.8 });
      break;
    }
    case 'story':
      ST.i = 0; go('story');
      setTimeout(() => { if (VIEW.name === 'story') playScene(); }, 480);
      break;
    case 'nextScene': {
      if (ST.i < scenesOf().length - 1) { ST.i++; render(); previewScene(); }
      break;
    }
    case 'prevScene': if (ST.i > 0) { ST.i--; render(); previewScene(); } break;
    case 'gotoScene': ST.i = parseInt(el.dataset.i, 10) || 0; render(); previewScene(); break;
    case 'wordScene': ST.i = WORD_I; ST.playing = false; go('story'); setTimeout(() => playScene(), 460); break;
    case 'playScene': playScene(); break;
    case 'toggleCn': ST.showCn = !ST.showCn; render(); break;
    case 'finishStory': finishStory(); break;
    case 'storyFromSheet': closeSheet(); ST.i = 0; go('story'); break;
    case 'startQuizFromSheet': closeSheet(); startQuiz(); go('quiz'); setTimeout(() => speak(dayOf(DAY).words[0].w), 300); break;

    case 'quiz':
      startQuiz(); go('quiz');
      setTimeout(() => {
        if (SUBJ === 'zh') speakCn((zhDay(DAY).chars[0] || {}).z || '', { rate: 0.7 });
        else speak(dayOf(DAY).words[0].w, { rate: 0.7 });
      }, 300);
      break;
    case 'ansZh': {
      if (QZ.answered) break;
      const i = parseInt(el.dataset.i, 10);
      const picked = QZ.opts[i];
      const cs = zhDay(DAY).chars || [], c = cs[QZ.i] || cs[0];
      const correctVal = QZ.type === 'z2py' ? c.py : c.z;
      QZ.answered = true;
      const right = picked === correctVal;
      document.querySelectorAll('.opt').forEach((b, k) => {
        if (QZ.opts[k] === correctVal) b.classList.add('right');
        else if (k === i) b.classList.add('wrong');
      });
      if (right) {
        QZ.score++; addStar(1);
        const arr = S.quizScore || (S.quizScore = {});
        arr[DAY] = Math.max(arr[DAY] || 0, QZ.score);
        save(); toast('答对啦 ⭐'); speakCn(c.z, { rate: 0.7 });
      } else {
        recordMistake(QZ.type === 'z2py' ? 'zh-py' : 'zh-z', c.z + '（' + c.py + '）', correctVal, picked);
        toast('没关系，正确答案是 ' + correctVal);
        speakCn(c.z, { rate: 0.6 });
      }
      setTimeout(() => {
        if (QZ.i < cs.length - 1) {
          QZ.i++; zhQuizBuild(); render();
          setTimeout(() => speakCn(cs[QZ.i].z, { rate: 0.7 }), 260);
        } else {
          const s = S.quizScore || (S.quizScore = {});
          s[DAY] = Math.max(s[DAY] || 0, QZ.score);
          if (QZ.score >= Math.max(1, Math.ceil(cs.length * 0.66))) S.done[DAY] = true;
          save(); confetti();
          openSheet(`<div class="big">${QZ.score >= cs.length ? '🏆' : '💪'}</div>
            <h3>答对 ${QZ.score} / ${cs.length}</h3>
            <p>${QZ.score >= cs.length ? '太棒了！今天的语文课完成啦。' : '再读一遍生字，然后来挑战第二次吧。'}</p>
            <button class="btn pri" style="width:100%" data-act="againQuiz">再来一次</button>
            <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="mistakesFromSheet">看今日错题</button>
            <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">回首页</button>`);
        }
      }, 1250);
      break;
    }
    case 'ans': {
      if (QZ.answered) return;
      const i = parseInt(el.dataset.i, 10);
      const picked = QZ.opts[i];
      const correct = dayOf(DAY).words[QZ.i];
      QZ.answered = true;
      const right = picked.w === correct.w;
      const btns = document.querySelectorAll('.opt');
      btns.forEach((b, k) => {
        if (QZ.opts[k].w === correct.w) b.classList.add('right');
        else if (k === i) b.classList.add('wrong');
      });
      if (right) {
        QZ.score++; addStar(1);
        const arr = S.quizScore || (S.quizScore = {});
        arr[DAY] = Math.max(arr[DAY] || 0, QZ.score);
        save(); toast('答对啦 ⭐');
        speak(correct.w, { rate: 0.72 });
      } else {
        recordMistake('en-word', '听音选词：' + (correct.cn || correct.w), correct.w, picked.w);
        toast('没关系，再听一次：' + correct.w);
        speak(correct.w, { rate: 0.62 });
      }
      setTimeout(() => {
        if (QZ.i < dayOf(DAY).words.length - 1) {
          QZ.i++; buildQuizOptions(); render();
          setTimeout(() => speak(dayOf(DAY).words[QZ.i].w, { rate: 0.7 }), 260);
        } else {
          const s = (S.quizScore || (S.quizScore = {}));
          s[DAY] = Math.max(s[DAY] || 0, QZ.score);
          if (QZ.score >= passLine(dayOf(DAY).words.length)) S.done[DAY] = true;
          save();
          confetti();
          openSheet(`<div class="big">${QZ.score >= passLine(dayOf(DAY).words.length) ? '🏆' : '💪'}</div>
            <h3>答对 ${QZ.score} / ${dayOf(DAY).words.length}</h3>
            <p>${QZ.score >= passLine(dayOf(DAY).words.length) ? '太棒了！今天的课程完成，明天解锁 Day ' + Math.min(DAY + 1, days().length) + '。' : '再听一遍单词卡，然后来挑战第二次吧。'}</p>
            <button class="btn pri" style="width:100%" data-act="againQuiz">再来一次</button>
            <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">回首页</button>`);
        }
      }, 1250);
      break;
    }
    case 'againQuiz': closeSheet(); startQuiz(); go('quiz'); break;

    /* ---------- 小羊语文 ---------- */
    case 'zword':
      ZHI.i = 0; go('zword');
      setTimeout(() => speakCn((zhDay(DAY).chars[0] || {}).z || ''), 260);
      break;
    case 'zpy': ZHI.i = 0; go('zpy'); break;
    case 'zmake': ZMAKE.i = 0; ZMAKE.picked = -1; go('zmake'); break;
    case 'zstep':
      stopTimer(); stopRead(); ZSTEP.i = 0; ZSTEP.stage = 0; ZSTEP.left = 0;
      ZSTEP.phase = 'demo'; ZSTEP.peek = false; go('zstep');
      setTimeout(() => readDemo(), 360);
      break;
    case 'zPrev': if (ZHI.i > 0) { ZHI.i--; render(); } break;
    case 'zNext': {
      const cs = zhDay(DAY).chars || [];
      if (ZHI.i < cs.length - 1) { ZHI.i++; render(); }
      else { toast('今天的字都看完啦'); }
      break;
    }
    case 'zLearn': {
      const cs = zhDay(DAY).chars || [];
      if (!isLearned(DAY, ZHI.i)) { S.learned[DAY] = learnedOf(DAY).concat([ZHI.i]); addStar(1); save(); }
      speakCn((cs[ZHI.i] || {}).z || '', { rate: 0.7 });
      setTimeout(() => {
        if (ZHI.i < cs.length - 1) { ZHI.i++; render(); }
        else {
          S.done[DAY + '-zword'] = true; save();
          confetti(); toast(cs.length + ' 个字学完啦！去组词造句吧 🧩'); go('home');
        }
      }, 380);
      break;
    }
    case 'zPickWord': ZMAKE.picked = parseInt(el.dataset.k, 10); render(); break;
    case 'zPickChar': ZMAKE.i = parseInt(el.dataset.k, 10); ZMAKE.picked = -1; render(); break;
    case 'zMakeNext': {
      const cs = zhDay(DAY).chars || [];
      ZMAKE.i = (ZMAKE.i + 1) % Math.max(1, cs.length); ZMAKE.picked = -1; render();
      break;
    }
    case 'zStepChar': stopRead(); ZSTEP.i = parseInt(el.dataset.k, 10); enterZStage(ZSTEP.stage, 320); break;
    case 'zGoStage': enterZStage(parseInt(el.dataset.k, 10)); break;
    case 'zPrevStage': if (ZSTEP.stage > 0) enterZStage(ZSTEP.stage - 1); break;
    case 'zNextStage':
      if (ZSTEP.stage < ZSTAGES.length - 1) enterZStage(ZSTEP.stage + 1);
      else finishZStep();
      break;
    case 'zDone':
      /* 说完了 → 进入下一阶（照样先给示范） */
      if (ZSTEP.stage < ZSTAGES.length - 1) { toast('说得不错！下一阶先听示范'); enterZStage(ZSTEP.stage + 1); }
      else finishZStep();
      break;
    case 'zToSpeak':
      /* 听完示范，孩子开始口述：直接开始计时 */
      stopRead(); stopTimer();
      ZSTEP.phase = 'speak'; ZSTEP.peek = false;
      ZSTEP.left = ZSTAGES[ZSTEP.stage].t; ZSTEP.running = true;
      if (ZSTEP.tm) clearInterval(ZSTEP.tm);
      ZSTEP.tm = setInterval(zTick, 1000);
      render();
      break;
    case 'zReadDemo': readDemo(); break;
    case 'zReadDemoSlow': readDemo({ rate: 0.55, gap: 420 }); break;
    case 'zPeek':
      ZSTEP.peek = !ZSTEP.peek; render();
      if (ZSTEP.peek) setTimeout(() => readDemo(), 120);
      break;
    case 'zTimer': {
      const st = ZSTAGES[ZSTEP.stage];
      if (ZSTEP.running) { stopTimer(); render(); break; }
      if (!ZSTEP.left || ZSTEP.left <= 0) ZSTEP.left = st.t;
      ZSTEP.running = true;
      if (ZSTEP.tm) clearInterval(ZSTEP.tm);
      ZSTEP.tm = setInterval(zTick, 1000);
      render();
      break;
    }
    case 'zResetTimer': stopTimer(); ZSTEP.left = ZSTAGES[ZSTEP.stage].t; ZSTEP.running = false; render(); break;

    /* ---------- 错题整理 ---------- */
    case 'mistakes': go('mistakes'); break;
    case 'mistakesFromSheet': closeSheet(); go('mistakes'); break;
    case 'mkReview': {
      DAY = parseInt(el.dataset.day, 10);
      const k = el.dataset.kind || '';
      if (k.indexOf('zh') === 0) { ZHI.i = 0; go('zword'); }
      else { WORD_I = 0; go('words'); }
      break;
    }
    case 'mkDel': {
      const ts = parseInt(el.dataset.ts, 10);
      S.mistakes = mistakes().filter(m => m.ts !== ts);
      save(); render();
      break;
    }
    case 'mkClear':
      openSheet(`<div class="big">🧹</div><h3>清空错题本？</h3><p>所有科目的错题都会删除，无法恢复。</p>
        <button class="btn pri" style="width:100%" data-act="mkClearYes">确认清空</button>
        <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">取消</button>`);
      break;
    case 'mkClearYes': S.mistakes = []; save(); closeSheet(); render(); toast('错题本已清空'); break;

    case 'reset':
      openSheet(`<div class="big">🧹</div><h3>要清空记录吗？</h3><p>星星和已学内容都会归零，无法恢复。</p>
        <button class="btn pri" style="width:100%" data-act="resetYes">确认清空</button>
        <button class="btn soft" style="width:100%;margin-top:8px;box-shadow:none" data-act="closeModal">取消</button>`);
      break;
    case 'resetYes':
      S = { learned: {}, done: {}, doneSentence: {}, doneStory: {}, stars: 0, lastVisit: '', streak: 1 };
      save(); closeSheet(); DAY = 1; WORD_I = 0; ST.i = 0; go('home');
      toast('已重新开始');
      break;
  }
});

function previewScene() {
  const scenes = scenesOf();
  const sc = scenes[clamp(ST.i, 0, scenes.length - 1)];
  const first = document.querySelector('#bubbleBox .line');
  if (first) first.classList.add('active');
  speak(sc.lines[0].en, { rate: 0.78 });
}

function autoCheck() {
  if (VIEW.name !== 'sentence') return;
  const btn = document.querySelector('[data-act="checkSentence"]');
  if (btn) btn.click();
}

/* 科目下拉（首页 / 一周 / 我的 顶部） */
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'lvSelect') {
    const lv = e.target.value;
    if (lv !== LEVEL) {
      switchLevel(lv);
      go('home');
      toast((lv === 'kg' ? '已切到大班档' : '已切到二年级档') + ' · 每天 ' + lenOf(SETS[lv][0]) + ' ' + unitName());
    }
    return;
  }
  if (e.target && e.target.id === 'subjSelect') {
    const v = e.target.value;
    if (!SUBJECTS[v]) return;
    if (SUBJECTS[v].jump) { location.hash = 'math'; location.reload(); return; }
    stopTimer();
    switchSubject(v);
    go('home');
    toast('已切到 ' + SUBJECTS[SUBJ].name + ' · ' + SUBJECTS[SUBJ].sub);
  }
});

/* 启动（支持 #day=2&view=story 深链接） */
(function init() {
  const h = location.hash || '';
  const md = h.match(/day=(\d+)/);
  const mv = h.match(/view=(\w+)/);
  if (md) DAY = clamp(parseInt(md[1], 10), 1, days().length);
  const VIEWS = ['home', 'week', 'me', 'words', 'sentence', 'story', 'quiz', 'zword', 'zpy', 'zmake', 'zstep', 'mistakes'];
  if (mv && VIEWS.indexOf(mv[1]) > -1) VIEW.name = mv[1];
  render();
  setTimeout(() => {
    if (!S.done[DAY] && learnedOf(DAY).length === 0 && VIEW.name === 'home') {
      toast(SUBJ === 'zh'
        ? '点「识字」，先认 ' + lenOf(zhDay(DAY)) + ' 个新字吧'
        : '点“认单词”，先听 ' + dayOf(DAY).words.length + ' 个新单词吧');
    }
  }, 900);
})();
</script>
</body>
</html>
