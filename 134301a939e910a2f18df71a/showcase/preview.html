<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    color-scheme:light;
    --bg:#f6f8fc; --bg-grad:radial-gradient(1200px 620px at 50% -240px,#e7eefb 0%,#f6f8fc 62%); --dot:rgba(43,87,151,.10);
    --panel:#ffffff; --panel-2:#f4f7fb; --panel-3:#fafbfe; --field-bg:#ffffff; --code-bg:#f8fafc;
    --header-bg:rgba(255,255,255,.72); --header-border:rgba(255,255,255,.85);
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --border:#e6eaf2; --border-strong:#d3dae6;
    --accent:#2B5797; --accent-2:#3E74C4; --accent-soft:#eef3fc; --accent-glow:rgba(43,87,151,.24); --ring:rgba(43,87,151,.16);
    --up:#0f9d58; --up-bg:#e8f7ef; --down:#e5484d; --down-bg:#fdeceb; --warn:#b45309; --warn-bg:#fff4e5;
    --ci-2:#fff3e6; --ci-3:#e7f8fb; --ci-4:#f3edff; --ci-5:#e6faf3;
    --chart-split:#eef2f8;
    --scroll:#cbd4e3; --scroll-hover:#aeb9cc;
    --r-sm:10px; --r:12px; --r-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,32,54,.04);
    --shadow:0 4px 18px rgba(20,32,54,.06);
    --shadow-lg:0 14px 34px rgba(20,32,54,.12);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#080b12; --bg-grad:radial-gradient(1200px 660px at 50% -260px,#132038 0%,#080b12 64%); --dot:rgba(120,160,255,.10);
    --panel:#0f1521; --panel-2:#151d2b; --panel-3:#121a27; --field-bg:#131b29; --code-bg:#131b29;
    --header-bg:rgba(15,21,33,.72); --header-border:rgba(255,255,255,.06);
    --text:#e6edf7; --muted:#93a1b5; --faint:#64748b;
    --border:#1e2836; --border-strong:#2b3648;
    --accent:#5b8def; --accent-2:#7aa8ff; --accent-soft:rgba(91,141,239,.14); --accent-glow:rgba(91,141,239,.30); --ring:rgba(91,141,239,.28);
    --up:#3ddc97; --up-bg:rgba(61,220,151,.13); --down:#ff6b6b; --down-bg:rgba(255,107,107,.13); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13);
    --ci-2:rgba(242,120,12,.16); --ci-3:rgba(21,184,201,.16); --ci-4:rgba(139,92,246,.18); --ci-5:rgba(6,214,160,.16);
    --chart-split:rgba(255,255,255,.06);
    --scroll:#2b3648; --scroll-hover:#3b4a63;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 4px 18px rgba(0,0,0,.45);
    --shadow-lg:0 16px 40px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  *::selection{background:var(--accent-soft);color:var(--accent);}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;color:var(--text);font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:var(--bg-grad),radial-gradient(var(--dot) 1px,transparent 1px);background-size:auto,22px 22px;background-attachment:fixed;transition:background-color .3s,color .3s;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:999px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);background-clip:content-box;}
  .container{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:22px 22px 64px;}
  .app-header{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding:14px 18px;border:1px solid var(--header-border);border-radius:var(--r-lg);background:var(--header-bg);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);box-shadow:var(--shadow);transition:background-color .3s,border-color .3s;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand-mark{flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 18px var(--accent-glow);}
  .app-title{font-size:20px;font-weight:800;letter-spacing:-.2px;line-height:1.2;}
  .app-title small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:4px;letter-spacing:0;line-height:1.5;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{position:relative;width:42px;height:42px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--field-bg);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:17px;line-height:1;transition:border-color .16s,color .16s,background-color .16s,transform .16s;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .icon-btn:active{transform:scale(.96);}
  .upload-btn{position:relative;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;padding:11px 18px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;white-space:nowrap;box-shadow:0 6px 16px var(--accent-glow);transition:transform .16s,box-shadow .16s,filter .16s;}
  .upload-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px var(--accent-glow);filter:brightness(1.05);}
  .upload-btn:active{transform:translateY(0);}
  .upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:18px;transition:background-color .3s,border-color .3s;}
  .panel h3{margin:0 0 16px;font-size:15.5px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;color:var(--text);}
  .panel.full{grid-column:1 / -1;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .panel .panel-head h3{margin:0;}
  .seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--border);border-radius:999px;background:var(--panel-2);flex:0 0 auto;}
  .seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:background-color .18s,color .18s,box-shadow .18s;}
  .seg button:hover{color:var(--accent);}
  .seg button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm);}
  .seg button:disabled{opacity:.42;cursor:not-allowed;}
  .panel h3 .gname{color:var(--accent);}
  .panel h3 .gnote{color:var(--warn);font-size:12.5px;font-weight:600;}

  .empty-state{text-align:center;color:var(--muted);padding:64px 24px;border:2px dashed var(--border-strong);border-radius:20px;cursor:pointer;background:linear-gradient(180deg,var(--panel),var(--panel-3));box-shadow:var(--shadow);transition:border-color .18s,background .18s,box-shadow .18s,transform .18s;}
  .empty-state:hover{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 12px 30px var(--accent-glow);transform:translateY(-2px);}
  .empty-state .icon{font-size:46px;line-height:1;}
  .empty-state p{margin:14px 0 0;font-size:14.5px;line-height:1.75;}
  .empty-state .drop-hint{display:inline-block;margin-top:18px;padding:9px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:var(--accent);font-size:13px;font-weight:600;}

  #dropOverlay{position:fixed;inset:0;z-index:200;background:rgba(6,10,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;}
  #dropOverlay.show{display:flex;}
  #dropOverlay .drop-inner{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 62px;background:var(--panel);border:2px dashed var(--accent);border-radius:20px;box-shadow:var(--shadow-lg);pointer-events:none;max-width:90vw;text-align:center;animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  #dropOverlay .drop-inner .icon{font-size:48px;line-height:1;}
  #dropOverlay .drop-inner .t{font-size:18px;font-weight:800;color:var(--accent);}
  #dropOverlay .drop-inner small{font-size:12.5px;color:var(--muted);}

  .preview-info{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:14px;font-size:13px;color:var(--muted);}
  .preview-info b{color:var(--text);}
  .map-box{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:13px;}
  .map-box span{display:inline-block;background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:4px 11px;border-radius:999px;margin:3px;font-weight:600;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;padding:11px 20px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;box-shadow:0 6px 16px var(--accent-glow);transition:transform .16s,box-shadow .16s,filter .16s;}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px var(--accent-glow);filter:brightness(1.05);}
  .btn-ghost{background:var(--panel);border:1px solid var(--border-strong);color:var(--muted);padding:10px 18px;border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;transition:border-color .16s,color .16s,background-color .16s;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  .toolbar{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px;}
  .field input[type=date]{padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--field-bg);font-family:inherit;transition:border-color .16s,box-shadow .16s;}
  .field input[type=date]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);}
  .multi-select{position:relative;}
  .ms-toggle{min-width:200px;max-width:360px;padding:9px 13px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--field-bg);cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:border-color .16s,box-shadow .16s;}
  .ms-toggle:hover{border-color:var(--accent);}
  .ms-toggle .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-toggle .caret{flex:0 0 auto;color:var(--muted);transition:transform .18s;}
  .ms-panel{position:absolute;top:100%;left:0;margin-top:8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:8px;z-index:30;min-width:240px;max-height:320px;overflow:auto;display:none;}
  .ms-panel.open{display:block;}
  .ms-panel label{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:13px;cursor:pointer;border-radius:8px;transition:background-color .14s;}
  .ms-panel label:hover{background:var(--accent-soft);}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:16px;margin-bottom:20px;}
  .card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,background-color .3s,border-color .3s;}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
  .card.c2::before{background:linear-gradient(90deg,#F2780C,#ffb066);}
  .card.c3::before{background:linear-gradient(90deg,#15B8C9,#6ad7e2);}
  .card.c4::before{background:linear-gradient(90deg,#8b5cf6,#b393ff);}
  .card.c5::before{background:linear-gradient(90deg,#06D6A0,#5ee6bd);}
  .card.c6::before{background:linear-gradient(90deg,#e5484d,#f58a8f);}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .card .ci{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--accent-soft);}
  .card.c2 .ci{background:var(--ci-2);}
  .card.c3 .ci{background:var(--ci-3);}
  .card.c4 .ci{background:var(--ci-4);}
  .card.c5 .ci{background:var(--ci-5);}
  .card.c6 .ci{background:var(--down-bg);}
  .card .k{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.2px;padding-right:40px;}
  .card .v{font-size:clamp(22px,2.6vw,30px);font-weight:800;line-height:1.15;word-break:break-all;font-variant-numeric:tabular-nums;letter-spacing:-.6px;}
  .card .sub{font-size:12px;color:var(--faint);margin-top:8px;}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;align-items:stretch;}
  .chart{width:100%;height:clamp(360px,42vh,520px);}
  .chart.tall{height:clamp(400px,48vh,560px);}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:760px;}
  th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left;}
  thead th{background:var(--panel-2);color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.2px;position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--border);}
  tbody tr:nth-child(even){background:var(--panel-3);}
  tbody tr:hover{background:var(--accent-soft);}
  .table-scroll{max-height:440px;overflow:auto;border:1px solid var(--border);border-radius:var(--r);}
  .tag-up{display:inline-block;color:var(--up);background:var(--up-bg);font-weight:700;padding:2px 9px;border-radius:999px;font-size:12px;}
  .tag-down{display:inline-block;color:var(--down);background:var(--down-bg);font-weight:700;padding:2px 9px;border-radius:999px;font-size:12px;}
  .tag-warn{display:inline-block;background:var(--warn-bg);color:var(--warn);padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;}

  .finding{display:flex;gap:12px;padding:14px 16px;background:linear-gradient(180deg,var(--panel-3),var(--panel-2));border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);margin-bottom:10px;font-size:14px;line-height:1.65;}
  .finding .badge{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--panel);border:1px solid var(--border);}
  .advice{list-style:none;padding:0;margin:0;}
  .advice li{position:relative;padding:13px 16px 13px 44px;background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;font-size:14px;line-height:1.65;}
  .advice li::before{content:"✓";position:absolute;left:15px;top:12px;color:var(--accent);font-weight:800;font-size:14px;}
  .advice li b{color:var(--accent);}

  @media(max-width:900px){
    .container{padding:16px 14px 52px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .charts{grid-template-columns:1fr;}
    .panel.full{grid-column:auto;}
    .app-title{font-size:18px;}
  }
  @media(max-width:560px){
    .cards{grid-template-columns:1fr;}
    .app-header{padding:12px 14px;gap:12px;}
    .brand-mark{width:40px;height:40px;font-size:20px;border-radius:12px;}
    .app-title small{font-size:12px;}
    .header-actions{width:100%;}
    .upload-btn{flex:1 1 auto;justify-content:center;}
    .panel{padding:16px;}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}}
</style><body><div class="header"><div><h1>📊 新媒体运营数据看板</h1><p>上传 Excel · 自动解析 · 多平台对比 · 异常洞察与运营建议</p></div></div><main style="max-width:1400px;margin:auto;padding:24px"><p>示例体验，数据仅保留在本页。安装后可导入 Excel 或 CSV。</p><div class="toolbar"><label>平台筛选 <select id="platform"><option>全部平台</option><option>公众号</option><option>小红书</option><option>视频号</option></select></label> <button id="reset">恢复示例</button></div><div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:20px 0"></div><div class="card"><h2>📊 各平台粉丝数对比</h2><div id="bars"></div></div><div class="card"><h2>💡 运营建议</h2><p>关注互动率与粉丝增长的变化，结合内容和发布节奏复盘。</p></div></main><script>const data=[['公众号',1272,11380],['小红书',2372,12150],['视频号',872,10920]];function render(){let k=document.querySelector('#platform').value, a=data.filter(x=>k==='全部平台'||x[0]===k);document.querySelector('#stats').innerHTML=[['总粉丝数',a.reduce((s,x)=>s+x[1],0)],['总阅读量',a.reduce((s,x)=>s+x[2],0)],['净增粉丝',a.length*84]].map(x=>`<div class="card"><small>${x[0]}</small><h2>${x[1].toLocaleString()}</h2></div>`).join('');document.querySelector('#bars').innerHTML=a.map(x=>`<p>${x[0]} <span style="display:inline-block;background:#6d83df;height:16px;width:${x[1]/25}px;max-width:55%"></span> ${x[1]}</p>`).join('')};document.querySelector('#platform').onchange=render;document.querySelector('#reset').onclick=()=>{document.querySelector('#platform').value='全部平台';render()};render();</script></body></html>
