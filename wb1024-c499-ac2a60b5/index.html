<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装机模拟器 · 1024 特供版</title>
<meta name="description" content="选配件、自动查兼容、算帧数电费、生成可分享的战斗力评级配置单。WorkBuddy「1024 造物挑战」参赛作品。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">
    <span class="dot"></span>
    <h1>装机模拟器<em>1024 特供版</em></h1>
  </div>
  <p>选配件 → 自动查兼容 → 算帧数、电费和<b style="color:#fdba74">行情溢价</b> → 生成可分享的战斗力卡片。<br>
  价格已按 <b style="color:#fdba74">2026-10 行情</b>更新：内存、固态、显卡正处涨价高位，每件配件的溢价都会单独标出来。</p>
  <div class="topbar-actions">
    <button id="topGuide" class="ghost-btn">跟我一起装机 →</button>
    <button id="topCard" class="solid-btn">生成配置单卡片</button>
  </div>
</header>

<main class="layout">
  <section class="builder">
    <div class="presets-wrap">
      <h2 class="sec-title">没想法？先看这几套<span>点一下直接套用</span></h2>
      <div id="presets" class="presets"></div>
    </div>
    <h2 class="sec-title">开始搭<span>点卡片即可切换，右侧实时结算</span></h2>
    <div id="categories"></div>
  </section>

  <aside class="summary-panel">
    <div id="summaryBody"></div>
  </aside>
</main>

<footer class="foot">
  由 WorkBuddy 制作 · WorkBuddy「1024 造物挑战」参赛作品 · 数据仅供参考，下单前请再核对一次
</footer>

<div class="modal" id="cardModal">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <h3>你的配置单已生成</h3>
    <div id="themeSwitch" class="theme-switch"></div>
    <img id="cardImg" alt="配置单卡片">
    <div class="modal-actions">
      <button id="btnDownload" class="primary">下载图片</button>
      <span>右键图片也可以直接另存</span>
    </div>
  </div>
</div>

<div class="modal" id="guideModal">
  <div class="guide-wrap">
    <button id="closeGuide" class="close">×</button>
    <div id="guideBody"></div>
  </div>
</div>

<canvas id="shareCanvas" style="display:none"></canvas>
<div id="toast" class="toast"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  document.getElementById('topCard').onclick = () => document.getElementById('btnCard') && document.getElementById('btnCard').click();
  document.getElementById('topGuide').onclick = () => document.getElementById('btnGuide') && document.getElementById('btnGuide').click();
</script>
</body>
</html>
