  /* ===================== 场景渲染 ===================== */
  function header(view, scene) {
    var stars = '<span class="pill y" style="align-self:center">⭐ ' + S().stars + '</span>';
    var pets = PETS();
    var switcher = '<div class="pet-switch">';
    pets.forEach(function (p, i) {
      var on = i === (S().activePet || 0);
      switcher += '<div class="pet-chip' + (on ? ' on' : '') + '" data-pet="' + i + '" title="' + esc(p.name) + '">' +
        '<div style="transform:scale(.42);transform-origin:center;width:64px;height:64px;margin:-18px 0">' + dogSVG(p, 'home') + '</div>' +
        '<span>' + esc(p.name) + '</span></div>';
    });
    switcher += '<div class="pet-chip add" data-add="1" title="领养新朋友">➕</div></div>';

    var tabs = '<div class="tabs scene-tabs">';
    DATA.petScenes().forEach(function (sc) {
      tabs += '<button class="tab' + (sc.id === scene ? ' active' : '') + '" data-sc="' + sc.id + '">' + sc.ico + (sc.id === 'home' ? ' 陪伴' : sc.name.replace('小', '')) + '</button>';
    });
    tabs += stars + '</div>';
    return switcher + tabs;
  }

  function bindHeader(view, scene) {
    $$('[data-sc]', view).forEach(function (b) { b.onclick = function () { APP.go('/宠物养成/' + b.dataset.sc); }; });
    $$('[data-pet]', view).forEach(function (el) { el.onclick = function () { S().activePet = +el.dataset.pet; APP.route(); }; });
    var add = $('[data-add]', view); if (add) add.onclick = function () { adopt(view, true); };
  }

  function renderScene(view, scene) {
    var p = P();
    var h = H.head('🐶 ' + esc(p.name), breedOf(p.breed).name + ' · ' + DATA.stages()[stageIdx(p.level)].name + ' ' + DATA.stages()[stageIdx(p.level)].emoji + ' · Lv.' + p.level);
    h += header(view, scene);
    view.innerHTML = h;
    bindHeader(view, scene);
    var body = document.createElement('div');
    body.id = 'sceneBody';
    view.appendChild(body);

    if (scene === 'home') sceneHome(body, p);
    else if (scene === 'room') sceneRoom(body, p);
    else if (scene === 'living') sceneLiving(body, p);
    else if (scene === 'yard') sceneYard(body, p);
    else if (scene === 'park') scenePark(body, p);
    else if (scene === 'school') sceneSchool(body, p);
    else if (scene === 'hospital') sceneHospital(body, p);
    else if (scene === 'beach') sceneBeach(body, p);
    else if (scene === 'shop') sceneShop(body, p);

    // 随机事件（除商店/医院外进入时按冷却概率触发）
    if (scene !== 'shop' && scene !== 'hospital' && scene !== 'school') {
      tryEvent(view, scene);
    }
  }

  function stageCard(p) {
    var b = breedOf(p.breed), si = stageIdx(p.level), st = DATA.stages()[si];
    var need = needExp(p.level);
    var warn = [];
    if (p.sick) warn.push('生病了，快去宠物医院 🏥');
    if (p.injury) warn.push('受伤了（' + (p.injury === 'leg' ? '腿' : p.injury === 'paw' ? '爪子' : '头') + '），需要处理 🩹');
    if (!p.sick && !p.injury && p.hunger < 30) warn.push('肚子饿啦，快喂点东西 🥣');
    if (!p.sick && !p.injury && p.clean < 30) warn.push('身上脏兮兮，该洗澡啦 🛁');
    if (!p.sick && !p.injury && p.mood < 30) warn.push('有点无聊，陪我玩会儿 🎾');
    var note = warn.length
      ? '<div class="note" style="margin-top:10px;background:#FFE6F0;border-color:#FF9EC4">' + warn.map(esc).join('<br>') + '</div>'
      : '<div class="note" style="margin-top:10px;background:#EAFBF2;border-color:#8BE0B0">' + esc(p.name) + ' 现在状态不错，正在开心地摇尾巴～</div>';
    var html = '<div class="grid g2" style="align-items:start">';
    html += '<div><div class="pet-stage" id="petStage">' + dogSVG(p, 'home') + '</div>' + note + '</div>';
    html += '<div><div class="card">' +
      statRow('饱食', 'hunger', p.hunger) + statRow('清洁', 'clean', p.clean) +
      statRow('心情', 'mood', p.mood) + statRow('健康', 'health', p.health) +
      statRow('经验', 'exp', Math.round(p.exp / need * 100), p.exp + '/' + need) +
      '<div class="page-sub">成长阶段：' + st.name + '（幼崽 → 幼年 → 少年 → 成年）</div></div>';
    html += '<div class="card" style="margin-top:14px"><h3>🎮 互动</h3><div class="grid g4" style="margin-top:8px">' +
      DATA.petActions().map(function (a) {
        return '<div class="tile" data-act="' + a.id + '"><div style="font-size:26px">' + a.ico + '</div>' +
          '<div style="font-weight:800">' + esc(a.name) + '</div><div class="sm">' + (a.cost ? '⭐ ' + a.cost : '免费') + '</div></div>';
      }).join('') + '</div>' +
      '<p class="page-sub" style="margin-top:10px">有「玩具球/飞盘」陪玩心情更高；「温暖小窝」心情掉得更慢。</p></div>';
    html += '<div class="card" style="margin-top:14px"><h3>🎒 我的物品</h3><div style="font-size:24px;margin-top:6px">' +
      (p.items.length ? p.items.map(function (id) { var it = DATA.shop().filter(function (x) { return x.id === id; })[0]; return it ? '<span title="' + esc(it.name) + '">' + it.ico + '</span> ' : ''; }).join('') : '<span class="page-sub" style="font-size:14px">还没有道具，去商店逛逛吧～</span>') +
      '</div><div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" id="btnRename">✏️ 改名字</button>' +
      '<button class="btn ghost sm" id="btnGoShop">🛒 去商店</button></div></div>';
    html += '</div></div>';
    return html;
  }

  function sceneHome(body, p) {
    body.innerHTML = stageCard(p);
    bindActions(body, p);
    $('#btnGoShop', body).onclick = function () { APP.go('/宠物养成/shop'); };
    $('#btnRename', body).onclick = function () { renameModal(p); };
  }

  function bindActions(root, p) {
    $$('[data-act]', root).forEach(function (el) {
      el.onclick = function () {
        var a = DATA.petActions().filter(function (x) { return x.id === el.dataset.act; })[0];
        if (a.cost > 0 && !APP.spendStars(a.cost, a.name)) return;
        var eff = Object.assign({}, a.effect);
        if (a.id === 'play' && (p.items.indexOf('ball') >= 0 || p.items.indexOf('frisbee') >= 0)) { eff.mood += 8; eff.exp += 4; }
        if (a.id === 'groom' && p.items.indexOf('comb') >= 0) { eff.mood += 2; }
        p.asleep = false;
        var up = applyEffect(p, eff);
        p.lastEvent = p.lastEvent || 0;
        var says = { pet: '汪～好舒服', feed: '呜姆呜姆，真好吃', wash: '哗啦啦，香喷喷', play: '汪汪！再来一次', train: '我学会啦！', groom: '毛毛顺顺的～', water: '咕咚咕咚', walk: '出去玩咯！' };
        APP.toast(p.name + '：' + (says[a.id] || '好耶'), 'good');
        APP.speak(says[a.id] || '好耶', 'zh-CN');
        APP.confetti(12);
        if (up) levelUpMsg(p, up);
        APP.checkBadges(); APP.route();
      };
    });
  }

  function applyEffect(pet, eff) {
    if (eff.hunger) pet.hunger = clamp(pet.hunger + eff.hunger);
    if (eff.clean) pet.clean = clamp(pet.clean + eff.clean);
    if (eff.mood) pet.mood = clamp(pet.mood + eff.mood);
    var up = 0;
    if (eff.exp) up = addExp(pet, eff.exp);
    APP.save();
    return up;
  }

  function renameModal(p) {
    APP.modal({
      title: '给它改个名字', body: '<input type="text" id="rn" maxlength="8" value="' + esc(p.name) + '">',
      actions: [{ label: '取消', cls: 'ghost' }, {
        label: '保存', cls: 'primary', onClick: function (root) {
          var v = ($('#rn', root).value || '').trim(); if (v) { p.name = v; APP.save(true); APP.route(); APP.toast('改好啦 ✅', 'good'); }
        }
      }]
    });
  }

  function levelUpMsg(pet, times) {
    APP.confetti(50);
    APP.modal({
      title: '🎉 升级啦！',
      body: '<div style="text-align:center">' + dogSVG(pet, 'home') + '<h2 style="margin-top:6px">' + esc(pet.name) + ' 升到 Lv.' + pet.level + '</h2>' +
        '<p class="page-sub">当前形态：' + DATA.stages()[stageIdx(pet.level)].name + ' ' + DATA.stages()[stageIdx(pet.level)].emoji + '</p></div>',
      actions: [{ label: '好耶！', cls: 'primary' }]
    });
    APP.speak(pet.name + '升级啦', 'zh-CN');
  }

  /* ---------- 房间 ---------- */
  function sceneRoom(body, p) {
    var decorOn = (p.decor || []).indexOf('bed') >= 0;
    var album = p.album || [];
    var h = '<div class="pet-stage">' + dogSVG(p, 'room') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🛏️ 房间</h3><div class="grid g3" style="margin-top:8px">' +
      tile('sleep', '睡觉', '😴', '免费·恢复') + tile('tidy', '整理', '🧹', '免费·心情+') + tile('album', '相册', '🖼️', album.length + ' 张') + '</div>';
    h += '<p class="page-sub" style="margin-top:8px">' + (decorOn ? '🌟 你买了小床装饰，房间更温馨啦！' : '去商店买「小床装饰」能让房间更漂亮～') + '</p></div>';
    if (album.length) {
      h += '<div class="card" style="margin-top:12px"><h3>🖼️ 旅行相册</h3><div class="page-sub">' + album.map(esc).join(' · ') + '</div></div>';
    }
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 客厅 ---------- */
  function sceneLiving(body, p) {
    var decorOn = (p.decor || []).indexOf('plant') >= 0;
    var h = '<div class="pet-stage">' + dogSVG(p, 'living') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🛋️ 客厅</h3><div class="grid g3" style="margin-top:8px">' +
      tile('sit', '陪坐', '🛋️', '免费·心情+') + tile('tv', '看电视', '📺', '免费·心情+') + tile('feedL', '喂食', '🥣', '⭐5') + '</div>';
    h += '<p class="page-sub" style="margin-top:8px">' + (decorOn ? '🌟 绿植让客厅更有生机！' : '去商店买「绿植」装饰客厅～') + '</p></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 小院子 ---------- */
  function sceneYard(body, p) {
    var decorOn = (p.decor || []).indexOf('swing') >= 0;
    var h = '<div class="pet-stage">' + dogSVG(p, 'yard') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🌿 小院子</h3><div class="grid g3" style="margin-top:8px">' +
      tile('walkY', '遛弯', '🌿', '免费·心情+') + tile('toilet', '上厕所', '🚽', '免费·心情+') + tile('dig', '挖宝藏', '⛏️', '碰碰运气') + '</div>';
    h += '<p class="page-sub" style="margin-top:8px">' + (decorOn ? '🌟 秋千是小院子里的快乐源泉！' : '去商店买「院子秋千」装饰院子～') + '</p></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 公园 ---------- */
  function scenePark(body, p) {
    var h = '<div class="pet-stage">' + dogSVG(p, 'park') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🌳 公园</h3><div class="grid g3" style="margin-top:8px">' +
      tile('walkP', '玩飞盘', '🥏', '免费·心情+') + tile('treasure', '捡宝箱', '🎁', '可能得⭐') + tile('event', '逛一逛', '🔍', '看看惊喜') + '</div>' +
      '<p class="page-sub" style="margin-top:8px">公园是偶遇随机事件的好地方，还能捡到宝箱（每天限一次）。</p></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 宠物学校 ---------- */
  function sceneSchool(body, p) {
    var learned = p.tricks || [];
    var all = DATA.petTricks();
    var h = '<div class="pet-stage">' + dogSVG(p, 'school') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🏫 宠物学校</h3>';
    h += '<div class="page-sub">已学会 ' + learned.length + '/' + all.length + ' 个把戏</div><div style="font-size:26px;margin:6px 0">' +
      (learned.length ? learned.map(function (id) { var t = all.filter(function (x) { return x.id === id; })[0]; return t ? t.ico : ''; }).join(' ') : '🐾 还没学会把戏，去上课吧！') + '</div>';
    h += '<div class="grid g3" style="margin-top:6px">' +
      tile('class', '上课', '📚', '⭐12') + tile('perform', '表演', '🎬', '炫炫才艺') + tile('backhome', '回家', '🏠', '回陪伴') + '</div></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 宠物医院 ---------- */
  function sceneHospital(body, p) {
    var h = '<div class="pet-stage">' + dogSVG(p, 'hospital') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🏥 宠物医院</h3>';
    if (p.sick || p.injury) {
      h += '<div class="note" style="background:#FFE6F0;border-color:#FF9EC4">' + (p.sick ? '它生病了，' : '') + (p.injury ? '它受伤了（' + (p.injury === 'leg' ? '腿' : p.injury === 'paw' ? '爪子' : '头') + '），' : '') + '需要治疗哦。</div>';
      h += '<div class="grid g2" style="margin-top:10px">' +
        '<div class="tile" data-doc="hospital"><div style="font-size:26px">🏥</div><div style="font-weight:800">看医生</div><div class="sm">⭐20 治好</div></div>' +
        '<div class="tile" data-doc="med"><div style="font-size:26px">💊</div><div style="font-weight:800">家庭药箱</div><div class="sm">⭐18 平替</div></div></div>';
    } else {
      h += '<div class="note" style="background:#EAFBF2;border-color:#8BE0B0">' + esc(p.name) + ' 很健康，定期来看看就好～</div>';
    }
    h += '</div>';
    body.innerHTML = h;
    $$('[data-doc]', body).forEach(function (el) {
      el.onclick = function () {
        var kind = el.dataset.doc;
        var cost = kind === 'hospital' ? 20 : 18;
        if (!APP.spendStars(cost, '治疗宠物')) return;
        p.health = 100; p.sick = false; p.injury = null; p.mood = clamp(p.mood + 10);
        p.cured = (p.cured || 0) + 1; S().progress.pet.cured = (S().progress.pet.cured || 0) + 1;
        APP.save(); APP.confetti(24); APP.toast('治好啦，' + p.name + ' 活蹦乱跳！', 'good');
        APP.checkBadges(); APP.route();
      };
    });
  }
  /* ---------- 海边 ---------- */
  function sceneBeach(body, p) {
    var hasTravel = p.items.indexOf('travel') >= 0;
    var onBeach = p.beachUntil && p.beachUntil > Date.now();
    var h = '<div class="pet-stage">' + dogSVG(p, 'beach') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🏖️ 海边</h3>';
    if (!hasTravel) {
      h += '<div class="note" style="background:#FFF6D9;border-color:#FFD98A">想去海边度假需要先买「旅行包」（商店 🎒）。</div>';
    } else if (onBeach) {
      var left = Math.ceil((p.beachUntil - Date.now()) / 3600000);
      h += '<div class="note" style="background:#E6F7FF;border-color:#8FD3FF">🌴 正在度假中，还有约 ' + left + ' 小时心情恢复超快！</div>';
      h += '<div class="grid g2" style="margin-top:10px">' + tile('postcard', '收明信片', '📮', '心情+') + tile('backhome', '回家', '🏠', '回陪伴') + '</div>';
    } else {
      h += '<div class="note">花 30⭐ 带它去海边度假 48 小时，期间心情衰减大幅变慢，还会收获旅行相册！</div>';
      h += '<div class="grid g2" style="margin-top:10px"><div class="tile" data-go="beach"><div style="font-size:26px">🏖️</div><div style="font-weight:800">去度假</div><div class="sm">⭐30</div></div>' +
        tile('backhome', '回家', '🏠', '回陪伴') + '</div>';
    }
    h += '</div>';
    body.innerHTML = h;
    var go = $('[data-go="beach"]', body); if (go) go.onclick = function () {
      if (!APP.spendStars(30, '海边度假')) return;
      p.beachUntil = Date.now() + 48 * 3600000; p.mood = clamp(p.mood + 20); p.health = clamp(p.health + 10);
      if ((p.album || []).indexOf('海边旅行 🏖️') < 0) p.album.push('海边旅行 🏖️');
      APP.save(); APP.confetti(30); APP.toast(p.name + ' 在海边玩得超开心！', 'good');
      APP.checkBadges(); APP.route();
    };
    bindTile(body, p);
  }
  /* ---------- 商店 ---------- */
  function sceneShop(body, p) {
    var h = '<div class="grid g2" id="shopList"></div>';
    body.innerHTML = h;
    var host = $('#shopList', body);
    host.innerHTML = DATA.shop().map(function (it) {
      var owned = (it.cat === 'item' || it.cat === 'decor') && p.items.indexOf(it.id) >= 0;
      var tag = it.cat === 'medicine' ? '💊 药品' : it.cat === 'decor' ? '🏠 装饰' : it.cat === 'item' ? '✨ 道具' : '🍖 消耗';
      return '<div class="shop-item"><span class="si-ico">' + it.ico + '</span>' +
        '<div class="si-main"><div class="si-name">' + esc(it.name) + ' <span class="pill" style="font-size:11px">' + tag + '</span></div><div class="si-desc">' + esc(it.desc) + '</div></div>' +
        (owned ? '<span class="owned">已拥有</span>' : '<button class="btn yellow sm" data-buy="' + it.id + '">⭐ ' + it.price + '</button>') + '</div>';
    }).join('');
    $$('[data-buy]', host).forEach(function (btn) {
      btn.onclick = function () {
        var it = DATA.shop().filter(function (x) { return x.id === btn.dataset.buy; })[0];
        if (!APP.spendStars(it.price, '买了' + it.name)) return;
        if (it.cat === 'item' || it.cat === 'decor') p.items.push(it.id);
        if (it.cat === 'decor') (p.decor = p.decor || []).push(it.id);
        if (it.effect) applyEffect(p, it.effect);
        APP.confetti(18);
        APP.checkBadges(); APP.route();
      };
    });
  }

  function tile(id, name, ico, sub) { return '<div class="tile" data-tile="' + id + '"><div style="font-size:26px">' + ico + '</div><div style="font-weight:800">' + name + '</div><div class="sm">' + sub + '</div></div>'; }

  function bindTile(root, p) {
    $$('[data-tile]', root).forEach(function (el) {
      el.onclick = function () { doTile(el.dataset.tile, p, root); };
    });
  }

  function doTile(id, p, root) {
    var rerender = true;
    switch (id) {
      case 'sleep': p.asleep = true; p.mood = clamp(p.mood + 18); addExp(p, 2); APP.toast(p.name + ' 睡了个香喷喷的午觉 😴', 'good'); break;
      case 'tidy': p.mood = clamp(p.mood + 5); APP.toast('房间收拾干净啦', 'good'); break;
      case 'album': APP.toast('相册里有 ' + (p.album || []).length + ' 张回忆～', 'good'); rerender = false; break;
      case 'sit': p.mood = clamp(p.mood + 8); APP.toast(p.name + ' 靠着你好安心', 'good'); break;
      case 'tv': p.mood = clamp(p.mood + 10); APP.toast(p.name + ' 看动画笑哈哈', 'good'); break;
      case 'feedL': if (!APP.spendStars(5, '喂食')) return; p.hunger = clamp(p.hunger + 25); addExp(p, 4); APP.toast(p.name + ' 吃饱啦', 'good'); break;
      case 'walkY': case 'walkP': p.mood = clamp(p.mood + 8); addExp(p, 2); APP.toast(p.name + ' 散步超开心 🌿', 'good'); break;
      case 'toilet': p.mood = clamp(p.mood + 10); APP.toast('解决完，轻松多啦', 'good'); break;
      case 'dig': {
        var ev = DATA.petEvents().filter(function (e) { return e.id === 'e30'; })[0];
        showEvent(root.closest('.view') || document, ev); rerender = false; return;
      }
      case 'treasure': {
        var ev2 = DATA.petEvents().filter(function (e) { return e.id === 'e23'; })[0];
        showEvent(root.closest('.view') || document, ev2); rerender = false; return;
      }
      case 'event': tryEvent(root.closest('.view') || document, 'park', true); rerender = false; return;
      case 'class': {
        if (!APP.spendStars(12, '宠物学校上课')) return;
        var ev3 = DATA.petEvents().filter(function (e) { return e.id === 'e26'; })[0];
        showEvent(root.closest('.view') || document, ev3); rerender = false; return;
      }
      case 'perform': {
        if (!(p.tricks || []).length) { APP.toast('还没学会把戏，先去上课吧', 'warn'); rerender = false; break; }
        APP.confetti(28); APP.toast(p.name + ' 表演了 ' + (p.tricks || []).length + ' 个把戏，全场鼓掌！🎬', 'good'); APP.speak(p.name + '表演真棒', 'zh-CN');
        p.mood = clamp(p.mood + 6); break;
      }
      case 'postcard': {
        if ((p.album || []).indexOf('海边旅行 🏖️') < 0) p.album.push('海边旅行 🏖️');
        p.mood = clamp(p.mood + 15); APP.toast('明信片收进相册啦 📮', 'good'); break;
      }
      case 'backhome': APP.go('/宠物养成/home'); return;
      default: rerender = false;
    }
    if (rerender) { APP.save(); APP.checkBadges(); APP.route(); }
  }

  /* ===================== 随机事件 ===================== */
  function tryEvent(view, scene, force) {
    var p = P();
    var now = Date.now();
    if (!force) {
      if (now - (p.lastEvent || 0) < 6 * 3600 * 1000) return;
      if (Math.random() > 0.35) return;
    }
    var pool = DATA.petEvents().filter(function (e) { return !e.manual && (e.cond === 'any' || e.cond === scene); });
    if (!pool.length) { if (force) APP.toast('这一刻风平浪静～', 'good'); return; }
    var ev = pick(pool);
    p.lastEvent = now; APP.save();
    showEvent(view, ev);
  }

  function showEvent(view, ev) {
    var p = P();
    var text = (ev.text || '').replace(/\{n\}/g, p.name);
    var body = '<div style="text-align:center;font-size:46px">' + ev.ico + '</div>' +
      '<h2 style="text-align:center;margin:6px 0">' + esc(ev.title) + '</h2>' +
      '<p class="page-sub" style="text-align:center">' + esc(text) + '</p>' +
      '<div class="grid g2" id="evChoices" style="margin-top:10px"></div>';
    var md = APP.modal({ title: '✨ 随机事件', body: body, actions: [{ label: '稍后再说', cls: 'ghost' }] });
    var host = md.el.querySelector('#evChoices');
    ev.choices.forEach(function (ch) {
      var btn = document.createElement('button');
      btn.className = 'btn ' + (ch.cost ? 'yellow' : 'primary') + ' sm';
      btn.innerHTML = ch.ico + ' ' + esc(ch.label) + (ch.cost ? ' ⭐' + ch.cost : '');
      btn.onclick = function () {
        if (ch.cost && !APP.spendStars(ch.cost, ev.title)) return;
        md.close();
        if (ch.quiz) {
          miniQuiz(p, ch.winEff || {}, ch.loseEff || {}, ch.msg || '搞定！');
        } else {
          applyEventEff(p, ch.eff || {});
          APP.toast((ch.msg || '').replace(/\{n\}/g, p.name), 'good');
          APP.confetti(20);
          APP.checkBadges(); APP.route();
        }
      };
      host.appendChild(btn);
    });
  }

  function applyEventEff(pet, eff) {
    if (eff.hunger) pet.hunger = clamp(pet.hunger + eff.hunger);
    if (eff.clean) pet.clean = clamp(pet.clean + eff.clean);
    if (eff.mood) pet.mood = clamp(pet.mood + eff.mood);
    if (eff.health) pet.health = clamp(pet.health + eff.health);
    if (eff.exp) addExp(pet, eff.exp);
    if (eff.cured) { pet.cured = (pet.cured || 0) + eff.cured; S().progress.pet.cured = (S().progress.pet.cured || 0) + eff.cured; }
    if (eff.injury !== undefined) pet.injury = eff.injury;
    if (eff.sick !== undefined) pet.sick = eff.sick;
    if (eff.beach) pet.beachUntil = Date.now() + 48 * 3600000;
    if (eff.album && (pet.album || []).indexOf(eff.album) < 0) pet.album.push(eff.album);
    if (eff.trick) learnNextTrick(pet);
    if (eff.item && pet.items.indexOf(eff.item) < 0) pet.items.push(eff.item);
    if (eff.gift) grantGift(pet);
    if (eff.treasure) {
      var now = Date.now();
      if (now - (pet.lastTreasure || 0) < 24 * 3600 * 1000) { APP.toast('今天已经捡过宝箱啦～', 'warn'); }
      else { var n = rnd(5, 12); pet.lastTreasure = now; APP.awardStars(n, '公园捡到宝箱'); }
    }
    pet.asleep = false;
    APP.save();
  }

  function learnNextTrick(pet) {
    var learned = pet.tricks || [];
    if (learned.length >= DATA.petTricks().length) return;
    pet.tricks = learned.concat([DATA.petTricks()[learned.length].id]);
  }
  function grantGift(pet) {
    var pool = ['collar', 'hat', 'ball', 'frisbee', 'bone'].filter(function (id) { return pet.items.indexOf(id) < 0; });
    if (pool.length) pet.items.push(pick(pool));
    else pet.mood = clamp(pet.mood + 5);
  }

  /* 迷你学习测验（事件/学校） */
  function makeMiniQuestion() {
    if (Math.random() < 0.5) {
      var a = rnd(2, 9), b = rnd(2, 9), ans = a * b;
      var opts = shuffle([ans, ans + rnd(1, 3), Math.max(1, ans - rnd(1, 3)), ans + rnd(4, 8)]);
      return { q: a + ' × ' + b + ' = ?', opts: opts.map(String), ans: opts.indexOf(ans) };
    }
    var L = [['b', '波'], ['p', '坡'], ['m', '摸'], ['f', '佛'], ['d', '得'], ['t', '特'], ['n', '讷'], ['l', '勒'], ['g', '哥'], ['k', '科'], ['h', '喝']];
    var pl = pick(L);
    var others = shuffle(L.filter(function (x) { return x[0] !== pl[0]; })).slice(0, 3).map(function (x) { return x[0]; });
    var opts2 = shuffle([pl[0]].concat(others));
    return { q: '拼音「' + pl[1] + '」对应哪个字母？', opts: opts2, ans: opts2.indexOf(pl[0]) };
  }
  function miniQuiz(pet, winEff, loseEff, winMsg) {
    var q = makeMiniQuestion();
    var body = '<p class="page-sub">答对就能帮 ' + esc(pet.name) + ' 解决哦～</p>' +
      '<div style="font-size:20px;font-weight:800;margin:10px 0;text-align:center">' + esc(q.q) + '</div>' +
      '<div class="grid g2" id="mq">' + q.opts.map(function (o, i) { return '<button class="btn sm" data-i="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    var md = APP.modal({ title: '📚 小测验', body: body, actions: [{ label: '稍后再说', cls: 'ghost' }] });
    md.el.querySelectorAll('#mq button').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.i; md.close();
        if (i === q.ans) { applyEventEff(pet, winEff); APP.toast(winMsg.replace(/\{n\}/g, pet.name), 'good'); APP.confetti(20); }
        else { applyEventEff(pet, loseEff || {}); APP.toast('答错啦，下次加油～', 'warn'); }
        APP.checkBadges(); APP.route();
      };
    });
  }

  function statRow(name, key, val, text) {
    return '<div class="stat-row"><span class="st-name">' + name + '</span>' +
      '<div class="progress bar-' + key + '"><i style="width:' + clamp(val) + '%"></i></div>' +
      '<span class="st-val">' + (text || clamp(val) + '%') + '</span></div>';
  }
})();
</script>
<script>/* 人教版小学数学 1 年级题库（上/下册） */
window.__MB__ && window.__MB__(1, {"g":1,"vols":[{"vol":"一年级上册","term":1,"kps":[{"id":"1a-01","name":"准备课","desc":"数一数：按顺序数出物体个数；比多少：一一对应比较同样多、多、少","qs":[{"id":"1a-01-01","q":"操场上有3个足球、5个篮球，哪种球的数量更多？","o":["篮球多","足球多","一样多","不能比"],"a":0,"e":"数一数：足球3个，篮球5个，5比3大，所以篮球多。"},{"id":"1a-01-02","q":"图中有6朵红花、6朵黄花，红花和黄花比一比，结果是？","o":["红花多","黄花多","少一些","同样多"],"a":3,"e":"红花6朵，黄花也是6朵，数量相等，所以同样多。"},{"id":"1a-01-03","q":"小明有4支铅笔，小红有4块橡皮，一一对应摆好后，它们的数量？","o":["同样多","橡皮多","铅笔多","不确定"],"a":0,"e":"铅笔4支、橡皮4块，一一对应后没有多余的，数量同样多。"},{"id":"1a-01-04","q":"桌上有2本书、3支笔、1个杯子，桌子上这些小物件一共有几个？","o":["5","6","7","8"],"a":1,"e":"按顺序数：2+3+1=6，一共6个。"},{"id":"1a-01-05","q":"停车场里先开来4辆小汽车，又开来3辆，现在停车场一共有几辆小汽车？","o":["7","6","8","9"],"a":0,"e":"4辆再加上3辆，4+3=7，一共有7辆。"},{"id":"1a-01-06","q":"小兔有5根胡萝卜，小熊有3根胡萝卜，谁的多？","o":["一样多","小熊多","小兔多","都不多"],"a":2,"e":"5比3大，所以小兔的胡萝卜多。"},{"id":"1a-01-07","q":"第一行摆4个△，第二行摆4个○，两行图形的数量？","o":["△多","○多","少2个","同样多"],"a":3,"e":"都是4个，一一对应后同样多。"},{"id":"1a-01-08","q":"花园里有9只蝴蝶、7朵花，蝴蝶和花比，哪个数量多？","o":["不能比","花多","一样多","蝴蝶多"],"a":3,"e":"9比7大，蝴蝶的数量更多。"},{"id":"1a-01-09","q":"小刚画了6个笑脸，小丽画了8个笑脸，小丽比小刚多画了几个？","o":["少2个","多2个","一样多","多3个"],"a":1,"e":"8减6等于2，小丽比小刚多画2个。"},{"id":"1a-01-10","q":"盒子里有10颗糖，弟弟吃掉2颗，还剩几颗？","o":["7","9","8","10"],"a":2,"e":"原来有10颗，吃掉2颗，10-2=8，还剩8颗。"},{"id":"1a-01-11","q":"操场上男生有5人，女生有4人，男生比女生？","o":["一样多","少1人","多1人","多2人"],"a":2,"e":"5减4等于1，男生比女生多1人。"},{"id":"1a-01-12","q":"小明有3个红气球，又买了2个蓝气球，他现在一共有几个气球？","o":["4","6","5","7"],"a":2,"e":"3个加2个，3+2=5，一共有5个气球。"},{"id":"1a-01-13","q":"比一比：有6个苹果和9个橘子，哪种水果数量少？","o":["橘子","苹果","一样少","一样多"],"a":1,"e":"6比9小，所以苹果的数量少。"},{"id":"1a-01-14","q":"公共汽车上原来有8人，到站下去3人，车上还剩几人？","o":["4","5","6","7"],"a":1,"e":"8人减去下车的3人，8-3=5，还剩5人。"},{"id":"1a-01-15","q":"小猴摘了4个桃，小鹿摘了4个桃，它们摘的桃？","o":["同样多","小鹿多","小猴多","少1个"],"a":0,"e":"都是4个，数量相等，同样多。"},{"id":"1a-01-16","q":"草地上有2只白兔、3只灰兔、2只黑兔，草地上一共有几只兔子？","o":["6","9","8","7"],"a":3,"e":"2+3+2=7，草地上一共有7只兔子。"},{"id":"1a-01-17","q":"比较：10块饼干和8块蛋糕，饼干比蛋糕？","o":["多2块","少2块","一样多","多1块"],"a":0,"e":"10减8等于2，饼干比蛋糕多2块。"},{"id":"1a-01-18","q":"鱼缸里原来有5条鱼，妈妈又放进4条，现在鱼缸里有几条鱼？","o":["8","11","10","9"],"a":3,"e":"5条加上4条，5+4=9，现在有9条鱼。"},{"id":"1a-01-19","q":"左边摆7个☆，右边摆5个★，左边比右边？","o":["少2个","多2个","一样多","多3个"],"a":1,"e":"7减5等于2，左边比右边多2个。"},{"id":"1a-01-20","q":"书架第一层有3本书，第二层有6本书，两层一共有几本书？","o":["8","10","9","11"],"a":2,"e":"3本加6本，3+6=9，两层一共有9本书。"}]},{"id":"1a-02","name":"位置","desc":"上、下、前、后、左、右；认识“第几”与“几个”","qs":[{"id":"1a-02-01","q":"小明站在队伍里，从前面数他是第4个，那么他前面有几个人？","o":["3","4","5","2"],"a":0,"e":"第4个说明他前面有第1、2、3共3个人。"},{"id":"1a-02-02","q":"苹果放在桌面上，苹果在桌子的____面。","o":["下","上","前","后"],"a":1,"e":"苹果放在桌面以上，所以苹果在桌子的上面。"},{"id":"1a-02-03","q":"小猫在桌子下面，那么桌子在小猫的____面。","o":["下","上","左","右"],"a":1,"e":"小猫在桌子下方，反过来桌子就在小猫的上方。"},{"id":"1a-02-04","q":"一排小动物：兔、狗、猫、鸟、鱼，从左往右数第3只是什么？","o":["猫","狗","兔","鸟"],"a":0,"e":"从左数第1兔、第2狗、第3猫，所以第3只是猫。"},{"id":"1a-02-05","q":"小明的前面有2个人，后面有3个人，这一队一共有几人（包括小明）？","o":["5","4","7","6"],"a":3,"e":"前面2人+后面3人+小明自己1人=6人。"},{"id":"1a-02-06","q":"我们平时写字的手一般是右手，右手在身体的____边。","o":["左边","前面","右边","后面"],"a":2,"e":"写字用手是右手，右手在身体的右边。"},{"id":"1a-02-07","q":"我们面向黑板坐，黑板在教室的____面。","o":["左","后","前","右"],"a":2,"e":"我们面对黑板，黑板在大家的前方。"},{"id":"1a-02-08","q":"从前往后数小华是第2个，从后往前数小华是第4个，这队一共几人？","o":["4","5","6","7"],"a":1,"e":"前面有1人，后面有3人，加上小华自己：1+3+1=5人。"},{"id":"1a-02-09","q":"你的左脚在身体的____边。","o":["后","右","前","左"],"a":3,"e":"左脚当然在身体的左边。"},{"id":"1a-02-10","q":"书放在桌子上面，铅笔盒放在书的上面，那么铅笔盒在桌子的____。","o":["下面","上面","前面","后面"],"a":1,"e":"铅笔盒在书的上方，书在桌上，所以铅笔盒在桌子上面。"},{"id":"1a-02-11","q":"小明排在第1，小红排在第3，他们之间有几个人？","o":["0","3","2","1"],"a":3,"e":"第1和第3之间只有排第2的那1个人。"},{"id":"1a-02-12","q":"太阳在房子的____面。","o":["上","下","左","右"],"a":0,"e":"太阳在天空，房子上方，所以太阳在房子的上面。"},{"id":"1a-02-13","q":"公交车上，小明坐在前面，爷爷坐在小明后面，爷爷在小明____面。","o":["前","左","后","右"],"a":2,"e":"爷爷在小明后面，所以爷爷在小明后面。"},{"id":"1a-02-14","q":"一排共有5个气球，从右往左数某个气球是第2个，那么从左往右数它是第几个？","o":["4","3","5","2"],"a":0,"e":"共5个，右数第2就是左数第5-2+1=4个。"},{"id":"1a-02-15","q":"小明用右手拿筷子，那么筷子在小明身体的____边。","o":["左","后","前","右"],"a":3,"e":"右手在右边，所以筷子在右边。"},{"id":"1a-02-16","q":"小动物赛跑：兔子第1，乌龟第5，兔子和乌龟之间有几只动物？","o":["2","4","5","3"],"a":3,"e":"第1和第5之间是第2、3、4，共3只动物。"},{"id":"1a-02-17","q":"你的鼻子在眼睛的____面。","o":["上","左","下","右"],"a":2,"e":"鼻子在眼睛的下方，所以鼻子在眼睛下面。"},{"id":"1a-02-18","q":"一排树：第1棵松树，第2棵柳树，第3棵杨树，第4棵松树。从左数第3棵是什么树？","o":["杨树","柳树","松树","柏树"],"a":0,"e":"从左数第3棵是杨树。"},{"id":"1a-02-19","q":"小明前面有1人，后面有1人，左面有1人，右面有1人，小明周围一共有几个人？","o":["3","4","5","6"],"a":1,"e":"前1+后1+左1+右1=4人（周围的人，不含小明自己）。"},{"id":"1a-02-20","q":"小红说“我左手拿书，右手拿笔”，书在她的____边。","o":["前","右","左","后"],"a":2,"e":"左手在左边，所以书在左边。"}]},{"id":"1a-03","name":"1～5的认识和加减法","desc":"数的含义、比大小、第几、分与合、加法、减法","qs":[{"id":"1a-03-01","q":"3可以分成1和几？","o":["1","4","3","2"],"a":3,"e":"3=1+2，所以3可以分成1和2。"},{"id":"1a-03-02","q":"比4小的数有1、2、3，其中最大的是？","o":["3","2","1","4"],"a":0,"e":"比4小的数是1、2、3，其中3最大。"},{"id":"1a-03-03","q":"2+1等于几？","o":["2","4","3","5"],"a":2,"e":"2加1等于3。"},{"id":"1a-03-04","q":"5可以分成2和几？","o":["3","2","4","5"],"a":0,"e":"5=2+3，所以5可以分成2和3。"},{"id":"1a-03-05","q":"树上有4只鸟，飞走1只，还剩几只？","o":["2","5","4","3"],"a":3,"e":"4只减去飞走的1只，4-1=3，还剩3只。"},{"id":"1a-03-06","q":"3和2合起来是几？","o":["4","5","6","7"],"a":1,"e":"3+2=5，合起来是5。"},{"id":"1a-03-07","q":"比3大、比5小的数是？","o":["2","3","4","5"],"a":2,"e":"大于3小于5的整数只有4。"},{"id":"1a-03-08","q":"小明有5块糖，吃了2块，还剩几块？","o":["2","3","4","5"],"a":1,"e":"5块减去吃掉的2块，5-2=3，还剩3块。"},{"id":"1a-03-09","q":"下面哪组分与合是正确的？","o":["2和2","1和2","3和3","4和0"],"a":0,"e":"4=2+2，所以4可以分成2和2（分与合一般不用0）。"},{"id":"1a-03-10","q":"1+3等于几？","o":["3","4","5","6"],"a":1,"e":"1+3=4。"},{"id":"1a-03-11","q":"把3、1、5、2、4按从小到大排，排在中间（第3个）的是？","o":["2","4","3","5"],"a":2,"e":"排序后是1、2、3、4、5，第3个是3。"},{"id":"1a-03-12","q":"小红有2个苹果，妈妈又给她2个，现在有几个？","o":["3","6","5","4"],"a":3,"e":"2+2=4，现在有4个苹果。"},{"id":"1a-03-13","q":"5-3等于几？","o":["1","4","3","2"],"a":3,"e":"5减3等于2。"},{"id":"1a-03-14","q":"下面数中，最大的数是？","o":["1","2","5","3"],"a":2,"e":"1、3、2、5中5最大。"},{"id":"1a-03-15","q":"3可以分成几和1？","o":["1","2","3","4"],"a":1,"e":"3=2+1，所以3可以分成2和1。"},{"id":"1a-03-16","q":"4和1合起来是几？","o":["3","6","5","4"],"a":3,"e":"4+1=5，合起来是5。"},{"id":"1a-03-17","q":"比5少1的数是？","o":["3","5","4","6"],"a":2,"e":"5-1=4，比5少1是4。"},{"id":"1a-03-18","q":"看图：△△△  △△，一共有几个△？","o":["5","4","6","7"],"a":0,"e":"3个加2个，3+2=5，一共5个△。"},{"id":"1a-03-19","q":"2+2和1+3比，结果怎样？","o":["一样大","1+3大","2+2大","不能比"],"a":0,"e":"2+2=4，1+3=4，两个结果一样大。"},{"id":"1a-03-20","q":"从1数到5，第5个数是？","o":["4","5","1","3"],"a":1,"e":"1、2、3、4、5，第5个数是5。"}]},{"id":"1a-04","name":"认识图形（一）","desc":"立体图形：长方体、正方体、圆柱、球（能辨认、能分类）","qs":[{"id":"1a-04-01","q":"下面哪个物体的形状像“球”？","o":["足球","书本","魔方","纸筒"],"a":0,"e":"足球圆圆的，能到处滚，是球。"},{"id":"1a-04-02","q":"下面哪个是正方体？","o":["火柴盒","篮球","易拉罐","骰子"],"a":3,"e":"骰子六个面都是正方形，是正方体（火柴盒是长方体）。"},{"id":"1a-04-03","q":"圆柱的上下两个面是？","o":["圆形","方形","三角形","没有面"],"a":0,"e":"圆柱上下两个底面都是圆圆的圆形。"},{"id":"1a-04-04","q":"下面哪种物体既能滚动又能平平稳稳地立着？","o":["球","正方体","圆柱","长方体"],"a":2,"e":"圆柱侧面能滚，底面平平能立稳。"},{"id":"1a-04-05","q":"魔方是什么形状？","o":["长方体","圆柱","正方体","球"],"a":2,"e":"魔方六面都是正方形，是正方体。"},{"id":"1a-04-06","q":"下面哪个是长方体？","o":["课本","皮球","正方体积木","呼啦圈"],"a":0,"e":"课本长长方方，是长方体。"},{"id":"1a-04-07","q":"球的特点是什么？","o":["能稳放不能滚","能滚不能稳放","既稳放又能滚","方方正正"],"a":1,"e":"球能向任意方向滚动，但放不稳，容易滚走。"},{"id":"1a-04-08","q":"下面哪个能向四面八方滚动？","o":["圆柱","正方体","长方体","球"],"a":3,"e":"球圆圆的一滚就到处跑。"},{"id":"1a-04-09","q":"数学书的形状接近？","o":["正方体","长方体","球","圆柱"],"a":1,"e":"数学书长长方方，接近长方体。"},{"id":"1a-04-10","q":"下面哪个物体是圆柱？","o":["西瓜","骰子","罐头","砖头"],"a":2,"e":"罐头上下是圆、中间圆鼓鼓，是圆柱。"},{"id":"1a-04-11","q":"把下面图形分类，属于“正方体”的是？","o":["长长方方的盒子","六个面都是正方形的积木","圆圆的能滚的","上下一样粗的圆筒"],"a":1,"e":"六个面都是正方形的积木是正方体。"},{"id":"1a-04-12","q":"长方体每个面一般是什么形状？","o":["都是正方形","都是长方形（可能含正方形）","都是圆","都是三角形"],"a":1,"e":"长方体有6个面，一般是长方形。"},{"id":"1a-04-13","q":"下面哪种图形不能滚动？","o":["球","正方体","圆柱","都能滚"],"a":1,"e":"正方体每个面都是平的，放哪儿都稳，不能滚动。"},{"id":"1a-04-14","q":"下面物体中，滚起来最不容易停下来的是？","o":["正方体","圆柱","长方体","球"],"a":3,"e":"球能向任意方向滚，最难停。"},{"id":"1a-04-15","q":"冰箱的形状接近？","o":["长方体","正方体","球","圆柱"],"a":0,"e":"冰箱高高的、方方的，接近长方体。"},{"id":"1a-04-16","q":"下面哪个不是立体图形？","o":["正方形","长方体","正方体","圆柱"],"a":0,"e":"正方形是平平的平面图形，其他都是立体图形。"},{"id":"1a-04-17","q":"圆柱立着放的时候，能？","o":["飞起","倒下来","滚走","稳稳站住"],"a":3,"e":"圆柱底面平平，立着能稳稳站住。"},{"id":"1a-04-18","q":"积木里“方块糖”形状（六面都正方）是？","o":["球","长方体","正方体","圆柱"],"a":2,"e":"六面都正方的是正方体。"},{"id":"1a-04-19","q":"下面哪种能“转着圈滚”又能“站着不动”？","o":["球","长方体","正方体","圆柱"],"a":3,"e":"圆柱可以滚，也可以立着不动。"},{"id":"1a-04-20","q":"把皮球、课本、骰子、罐头分类，属于“球”的是？","o":["骰子","课本","皮球","罐头"],"a":2,"e":"皮球是球，课本是长方体，骰子是正方体，罐头是圆柱。"}]},{"id":"1a-05","name":"6～10的认识和加减法","desc":"连加、连减、加减混合运算","qs":[{"id":"1a-05-01","q":"6+2等于几？","o":["7","9","8","10"],"a":2,"e":"6加2等于8。"},{"id":"1a-05-02","q":"9-3等于几？","o":["5","6","7","8"],"a":1,"e":"9减3等于6。"},{"id":"1a-05-03","q":"连加：2+3+4等于几？","o":["8","9","10","11"],"a":1,"e":"先算2+3=5，再算5+4=9。"},{"id":"1a-05-04","q":"连减：10-2-3等于几？","o":["5","4","6","7"],"a":0,"e":"先算10-2=8，再算8-3=5。"},{"id":"1a-05-05","q":"加减混合：7-2+3等于几？","o":["6","9","8","7"],"a":3,"e":"先算7-2=5，再算5+3=8。"},{"id":"1a-05-06","q":"比8大2的数是？","o":["10","9","11","12"],"a":0,"e":"8+2=10，比8大2是10。"},{"id":"1a-05-07","q":"10可以分成4和几？","o":["5","6","7","8"],"a":1,"e":"10=4+6，所以10可以分成4和6。"},{"id":"1a-05-08","q":"小明有6颗糖，小红比他多3颗，小红有几颗？","o":["8","11","10","9"],"a":3,"e":"6+3=9，小红有9颗糖。"},{"id":"1a-05-09","q":"9可以分成几和5？","o":["3","5","4","6"],"a":2,"e":"9=4+5，所以9可以分成4和5。"},{"id":"1a-05-10","q":"连加：1+4+5等于几？","o":["10","9","11","12"],"a":0,"e":"先算1+4=5，再算5+5=10。"},{"id":"1a-05-11","q":"加减混合：8+2-5等于几？","o":["5","4","6","7"],"a":0,"e":"先算8+2=10，再算10-5=5。"},{"id":"1a-05-12","q":"比10少4的数是？","o":["4","7","6","5"],"a":3,"e":"10-4=6，比10少4是6。"},{"id":"1a-05-13","q":"7+3等于几？","o":["9","12","11","10"],"a":3,"e":"7+3=10。"},{"id":"1a-05-14","q":"连减：9-4-2等于几？","o":["2","4","3","5"],"a":2,"e":"先算9-4=5，再算5-2=3。"},{"id":"1a-05-15","q":"树上有8只鸟，飞走3只，又飞来2只，现在树上有几只？","o":["6","8","7","9"],"a":2,"e":"先算8-3=5，再算5+2=7，现在有7只。"},{"id":"1a-05-16","q":"10-6等于几？","o":["3","4","5","6"],"a":1,"e":"10减6等于4。"},{"id":"1a-05-17","q":"把6、8、10、7按从大到小排，排第一（最大）的是？","o":["6","7","10","8"],"a":2,"e":"从大到小是10、8、7、6，最大的是10。"},{"id":"1a-05-18","q":"6和4合起来是几？","o":["8","9","10","11"],"a":1,"e":"6+4=10，合起来是10。"},{"id":"1a-05-19","q":"加减混合：6-3+5等于几？","o":["8","7","9","10"],"a":0,"e":"先算6-3=3，再算3+5=8。"},{"id":"1a-05-20","q":"妈妈买了10个苹果，吃了2个，又买了3个，现在有几个？","o":["10","13","12","11"],"a":3,"e":"先算10-2=8，再算8+3=11，现在有11个。"}]},{"id":"1a-06","name":"11～20各数的认识","desc":"数的组成（十几=1个十+几个一）、读数写数、10加几及相应减法","qs":[{"id":"1a-06-01","q":"15是由几个十和几个一组成的？","o":["1个十5个一","5个十1个一","1个十1个一","5个十5个一"],"a":0,"e":"15=10+5，所以是1个十和5个一。"},{"id":"1a-06-02","q":"1个十和8个一组成的数是？","o":["81","18","88","10"],"a":1,"e":"10+8=18，这个数是18。"},{"id":"1a-06-03","q":"10加5等于几？","o":["15","50","5","10"],"a":0,"e":"10+5=15。"},{"id":"1a-06-04","q":"17去掉10还剩几？也就是17-10=？","o":["1","10","17","7"],"a":3,"e":"17=10+7，减去10还剩7。"},{"id":"1a-06-05","q":"下面哪个数是“1个十和3个一”？","o":["31","13","3","30"],"a":1,"e":"10+3=13，所以是13。"},{"id":"1a-06-06","q":"20是由几个十组成的？","o":["1个十","2个十","20个一","2个一"],"a":1,"e":"20=20，由2个十组成。"},{"id":"1a-06-07","q":"读数：12读作？","o":["一十二","二十一","十二","十"],"a":2,"e":"12读作“十二”。"},{"id":"1a-06-08","q":"写出“十四”这个数：？","o":["40","4","14","41"],"a":2,"e":"“十四”就是10+4=14。"},{"id":"1a-06-09","q":"16里面有____个十和____个一。","o":["1个十1个一","6个十1个一","1个十6个一","6个十6个一"],"a":2,"e":"16=10+6，所以里面有1个十和6个一。"},{"id":"1a-06-10","q":"10+7等于几？","o":["70","17","7","10"],"a":1,"e":"10+7=17。"},{"id":"1a-06-11","q":"一个数由2个十组成，这个数是？","o":["2","22","12","20"],"a":3,"e":"2个十就是20。"},{"id":"1a-06-12","q":"19-9等于几？","o":["10","9","19","1"],"a":0,"e":"19=10+9，减去9还剩10。"},{"id":"1a-06-13","q":"13的“3”在什么位上？","o":["十位","没有","百位","个位"],"a":3,"e":"13中右边第一位是“3”，在个位上，表示3个一。"},{"id":"1a-06-14","q":"和15相邻的两个数是？","o":["14和16","13和15","15和17","14和15"],"a":0,"e":"15前面是14，后面是16，相邻数是14和16。"},{"id":"1a-06-15","q":"1个十和0个一组成的数是？","o":["1","0","10","11"],"a":2,"e":"10+0=10，这个数是10。"},{"id":"1a-06-16","q":"20里面有几个一？","o":["2个","0个","10个","20个"],"a":3,"e":"20由20个一组成（也可说2个十）。"},{"id":"1a-06-17","q":"比19多1的数是？","o":["18","20","19","21"],"a":1,"e":"19+1=20。"},{"id":"1a-06-18","q":"下面写法正确的是：“十一”写作？","o":["110","101","1","11"],"a":3,"e":"“十一”就是10+1=11。"},{"id":"1a-06-19","q":"18-10等于几？","o":["18","10","8","1"],"a":2,"e":"18=10+8，减去10还剩8。"},{"id":"1a-06-20","q":"数一数：1个十和9个一合起来是？","o":["19","91","9","90"],"a":0,"e":"10+9=19。"}]},{"id":"1a-07","name":"认识钟表","desc":"认识钟面，会读整时和半时（分针指向12是整时，指向6是半时）","qs":[{"id":"1a-07-01","q":"分针指向12，时针指向3，这时是？","o":["12时","3时半","3时","6时"],"a":2,"e":"分针指12是整时，时针指3就是3时。"},{"id":"1a-07-02","q":"分针指向6，时针在9和10之间，这时是？","o":["9时","10时","9时半","6时"],"a":2,"e":"分针指6是半时，时针过了9就是9时半。"},{"id":"1a-07-03","q":"下面哪种情况表示整时？","o":["分针指6","分针指12","时针指6","分针指3"],"a":1,"e":"整时的时候分针一定指向12。"},{"id":"1a-07-04","q":"时针指向8，分针指向12，是几时？","o":["8时","8时半","12时","6时"],"a":0,"e":"分针指12是整时，时针指8就是8时。"},{"id":"1a-07-05","q":"小明早上7时起床，这时分针指向？","o":["6","12","3","9"],"a":1,"e":"7时是整时，整时分针一定指向12。"},{"id":"1a-07-06","q":"分针指向6，时针在2和3中间，是？","o":["2时","2时半","3时","3时半"],"a":1,"e":"分针指6是半时，时针过了2就是2时半。"},{"id":"1a-07-07","q":"下面哪个表示“半时”？","o":["分针指12","分针指6","时针指12","分针指9"],"a":1,"e":"半时的时候分针指向6。"},{"id":"1a-07-08","q":"钟表上时针和分针都指向12，是？","o":["12时半","12时","6时","1时"],"a":1,"e":"分针指12是整时，时针指12就是12时。"},{"id":"1a-07-09","q":"分针指向12，时针指向5，是？","o":["5时","5时半","6时","12时"],"a":0,"e":"分针指12是整时，时针指5就是5时。"},{"id":"1a-07-10","q":"下午4时半，分针应指向？","o":["12","9","3","6"],"a":3,"e":"半时分针一定指向6。"},{"id":"1a-07-11","q":"时针在7和8之间，分针指向6，是？","o":["7时半","7时","8时","8时半"],"a":0,"e":"分针指6是半时，时针过了7就是7时半。"},{"id":"1a-07-12","q":"下面时间是整时的是：时针指10，分针指？","o":["12","6","3","9"],"a":0,"e":"整时分针指向12，所以是10时整。"},{"id":"1a-07-13","q":"小红说“现在6时半”，时针大概在？","o":["正好指7","正好指6","6和7之间","12"],"a":2,"e":"半时的时候时针在两个数字中间，6时半时针在6和7之间。"},{"id":"1a-07-14","q":"分针指向12，时针指向11，是？","o":["1时","11时半","12时","11时"],"a":3,"e":"分针指12是整时，时针指11就是11时。"},{"id":"1a-07-15","q":"9时半，分针指向？","o":["6","12","3","9"],"a":0,"e":"半时分针指向6。"},{"id":"1a-07-16","q":"整时的时候，分针一定指向？","o":["9","6","3","12"],"a":3,"e":"整时分针一定指向12。"},{"id":"1a-07-17","q":"时针指向1，分针指向12，是？","o":["2时","1时半","12时","1时"],"a":3,"e":"分针指12是整时，时针指1就是1时。"},{"id":"1a-07-18","q":"下面哪个是12时半？","o":["分针指6，时针指12","分针指12，时针指12","分针指6，时针在12和1之间","分针指3"],"a":2,"e":"半时分针指6，12时半时针过了12，在12和1之间。"},{"id":"1a-07-19","q":"分针指向6，时针在4和5之间，是？","o":["4时","5时半","5时","4时半"],"a":3,"e":"分针指6是半时，时针过了4就是4时半。"},{"id":"1a-07-20","q":"我们每天中午12时吃午饭，这时分针指向？","o":["3","6","12","9"],"a":2,"e":"12时是整时，分针指向12。"}]},{"id":"1a-08","name":"20以内的进位加法","desc":"“凑十法”：9加几、8/7/6加几、5/4/3/2加几","qs":[{"id":"1a-08-01","q":"9+5用凑十法：把5分成1和4，先算9+1=10，再算10+4=？","o":["14","13","15","12"],"a":0,"e":"9+5=14，凑十后10+4=14。"},{"id":"1a-08-02","q":"8+6：把6分成2和4，先算8+2=10，再算10+4=？","o":["13","16","15","14"],"a":3,"e":"8+6=14，凑十后10+4=14。"},{"id":"1a-08-03","q":"7+5：把5分成3和2，先算7+3=10，再算10+2=？","o":["12","11","13","14"],"a":0,"e":"7+5=12，凑十后10+2=12。"},{"id":"1a-08-04","q":"9+9等于几？","o":["17","18","19","20"],"a":1,"e":"把9分成1和8，9+1=10，10+8=18。"},{"id":"1a-08-05","q":"6+7等于几？","o":["12","13","14","15"],"a":1,"e":"把7分成4和3，6+4=10，10+3=13。"},{"id":"1a-08-06","q":"9+3用凑十法，把3分成1和2，9+1=10，10+2=？","o":["12","11","13","10"],"a":0,"e":"9+3=12，凑十后10+2=12。"},{"id":"1a-08-07","q":"8+8等于几？","o":["15","17","18","16"],"a":3,"e":"把8分成2和6，8+2=10，10+6=16。"},{"id":"1a-08-08","q":"5+8等于几？","o":["12","15","14","13"],"a":3,"e":"把8分成5和3，5+5=10，10+3=13。"},{"id":"1a-08-09","q":"9+6：把6分成1和5，先算9+1=10，再算10+5=？","o":["14","15","16","17"],"a":1,"e":"9+6=15，凑十后10+5=15。"},{"id":"1a-08-10","q":"7+6等于几？","o":["11","14","13","12"],"a":3,"e":"把6分成3和3，7+3=10，10+3=13。"},{"id":"1a-08-11","q":"4+9等于几？","o":["13","12","14","15"],"a":0,"e":"把9分成6和3，4+6=10，10+3=13。"},{"id":"1a-08-12","q":"9+2等于几？","o":["10","12","11","13"],"a":2,"e":"把2分成1和1，9+1=10，10+1=11。"},{"id":"1a-08-13","q":"8+5：把5分成2和3，先算8+2=10，再算10+3=？","o":["12","14","13","15"],"a":2,"e":"8+5=13，凑十后10+3=13。"},{"id":"1a-08-14","q":"6+6等于几？","o":["12","11","13","14"],"a":0,"e":"把6分成4和2，6+4=10，10+2=12。"},{"id":"1a-08-15","q":"3+9等于几？","o":["11","13","12","14"],"a":2,"e":"把9分成7和2，3+7=10，10+2=12。"},{"id":"1a-08-16","q":"2+9等于几？","o":["10","11","12","13"],"a":1,"e":"把9分成8和1，2+8=10，10+1=11。"},{"id":"1a-08-17","q":"9+7：把7分成1和6，9+1=10，10+6=？","o":["15","17","16","18"],"a":2,"e":"9+7=16，凑十后10+6=16。"},{"id":"1a-08-18","q":"7+8等于几？","o":["14","15","16","17"],"a":1,"e":"把8分成3和5，7+3=10，10+5=15。"},{"id":"1a-08-19","q":"9+4用凑十法，4分成1和3，9+1=10，10+3=？","o":["12","14","15","13"],"a":3,"e":"9+4=13，凑十后10+3=13。"},{"id":"1a-08-20","q":"8+9等于几？","o":["16","18","17","19"],"a":2,"e":"把9分成2和7，8+2=10，10+7=17。"}]}]},{"vol":"一年级下册","term":2,"kps":[{"id":"1b-01","name":"认识图形（二）","desc":"平面图形：长方形、正方形、平行四边形、三角形、圆（能辨认、能拼组）","qs":[{"id":"1b-01-01","q":"下面哪个图形有4条一样长的边，还有4个直角？","o":["长方形","正方形","三角形","圆"],"a":1,"e":"正方形四条边都相等，而且四个角都是直角，所以它符合条件。"},{"id":"1b-01-02","q":"下面哪个图形是圆圆的、没有直直的边？","o":["三角形","正方形","圆","长方形"],"a":2,"e":"圆是曲线围成的，没有直边也没有角，圆圆的可以滚动。"},{"id":"1b-01-03","q":"下面哪个图形有3条边、3个角？","o":["长方形","三角形","正方形","圆"],"a":1,"e":"三角形有三条边和三个角，是最简单的多边形。"},{"id":"1b-01-04","q":"下面哪个图形有4条边，对边一样长，但4条边不一定都相等？","o":["正方形","长方形","圆","三角形"],"a":1,"e":"长方形对边相等，通常长边和短边不一样长，四个角都是直角。"},{"id":"1b-01-05","q":"下面哪个图形像歪着的正方形，对边互相平行？","o":["平行四边形","三角形","圆","正方形"],"a":0,"e":"平行四边形对边平行且相等，但角不一定是直角，看起来像斜着的长方形。"},{"id":"1b-01-06","q":"七巧板里没有下面哪种图形？","o":["正方形","圆","平行四边形","三角形"],"a":1,"e":"七巧板由5个三角形、1个正方形和1个平行四边形组成，里面没有圆。"},{"id":"1b-01-07","q":"用两个完全一样的小正方形拼在一起，可以拼成什么图形？","o":["正方形","三角形","圆","长方形"],"a":3,"e":"把两个一样大的正方形并排拼起来，就得到一个长方形。"},{"id":"1b-01-08","q":"我们戴的红领巾，是什么形状的？","o":["三角形","圆形","正方形","长方形"],"a":0,"e":"红领巾是三角形的，它有三条边、三个角。"},{"id":"1b-01-09","q":"一块方方的手帕，通常是哪种形状？","o":["长方形","圆","三角形","正方形"],"a":3,"e":"方手帕四条边一样长、四个角都是直角，是正方形。"},{"id":"1b-01-10","q":"汽车、自行车的轮子是什么形状的？","o":["正方形","长方形","圆","三角形"],"a":2,"e":"轮子做成圆圆的，才能平稳地滚动，所以是圆形。"},{"id":"1b-01-11","q":"用4个一样的小正方形排成一排，可以拼成什么图形？","o":["正方形","三角形","长方形","圆"],"a":2,"e":"4个小正方形排成1行，长边是短边的4倍，拼出来是一个长方形。"},{"id":"1b-01-12","q":"下面哪种图形有4条边、4个直角，而且4条边都相等？","o":["长方形","正方形","平行四边形","三角形"],"a":1,"e":"正方形四条边相等且四个角都是直角；长方形边不一定相等，平行四边形角不一定是直角。"},{"id":"1b-01-13","q":"平行四边形和长方形的共同点是？","o":["都有3条边","都有圆边","都有4条边","都没有直角"],"a":2,"e":"它们都是四边形，都有4条边；圆边和3条边都不对，长方形有直角。"},{"id":"1b-01-14","q":"下面哪个图形不能用来拼出有直边的长方形？","o":["正方形","长方形","圆","三角形"],"a":2,"e":"圆没有直边，无论怎么拼都拼不出有直边的长方形；其它图形都可以。"},{"id":"1b-01-15","q":"把一张正方形纸对折一次，不可能分成两个什么图形？","o":["两个长方形","两个三角形","正方形","圆"],"a":3,"e":"正方形对折一次得到两个长方形或两个三角形，纸是直边的，不可能折出圆。"},{"id":"1b-01-16","q":"下面哪个图形放在桌上很稳，不会滚来滚去？","o":["圆","圆柱","球","正方形"],"a":3,"e":"正方形有平平的面，能稳稳放住；圆和球会滚动，圆柱也会滚。"},{"id":"1b-01-17","q":"一套七巧板一共有几块图形？","o":["7块","6块","5块","8块"],"a":0,"e":"七巧板由7块图形组成，可以用它们拼出许多有趣的图案。"},{"id":"1b-01-18","q":"下面哪个图形不是由直线围成的？","o":["圆","长方形","平行四边形","三角形"],"a":0,"e":"圆是由一条弯曲的线围成的，没有直线边；其它三个都是直线图形。"},{"id":"1b-01-19","q":"用两个完全一样的等腰直角三角形，把斜边拼在一起，能得到什么图形？","o":["长方形","圆","三角形","正方形"],"a":3,"e":"两个等腰直角三角形斜边相对拼合，刚好组成一个正方形。"},{"id":"1b-01-20","q":"下面哪句话是对的？","o":["圆没有角","三角形有4条边","圆有4个角","正方形有3条边"],"a":0,"e":"圆是曲线图形，没有角；三角形有3条边，正方形有4条边。"}]},{"id":"1b-02","name":"20以内的退位减法","desc":"“破十法”“想加算减”：十几减9、减8/7/6、减5/4/3/2","qs":[{"id":"1b-02-01","q":"15减9等于多少？","o":["5","7","6","4"],"a":2,"e":"破十法：把15分成10和5，10减9得1，1加5得6；也可以想9加6等于15，所以15减9等于6。"},{"id":"1b-02-02","q":"13减9等于多少？","o":["5","4","3","6"],"a":1,"e":"破十法：10减9得1，1加3得4；或想9加4等于13，所以13减9等于4。"},{"id":"1b-02-03","q":"17减9等于多少？","o":["7","6","9","8"],"a":3,"e":"10减9得1，1加7得8；或想9加8等于17，所以17减9等于8。"},{"id":"1b-02-04","q":"11减9等于多少？","o":["3","2","1","0"],"a":1,"e":"10减9得1，1加1得2；或想9加2等于11，所以11减9等于2。"},{"id":"1b-02-05","q":"14减8等于多少？","o":["6","7","5","4"],"a":0,"e":"破十法：10减8得2，2加4得6；或想8加6等于14，所以14减8等于6。"},{"id":"1b-02-06","q":"13减7等于多少？","o":["5","7","6","4"],"a":2,"e":"10减7得3，3加3得6；或想7加6等于13，所以13减7等于6。"},{"id":"1b-02-07","q":"16减8等于多少？","o":["8","9","7","6"],"a":0,"e":"10减8得2，2加6得8；或想8加8等于16，所以16减8等于8。"},{"id":"1b-02-08","q":"12减6等于多少？","o":["6","7","5","4"],"a":0,"e":"10减6得4，4加2得6；或想6加6等于12，所以12减6等于6。"},{"id":"1b-02-09","q":"15减7等于多少？","o":["7","6","9","8"],"a":3,"e":"10减7得3，3加5得8；或想7加8等于15，所以15减7等于8。"},{"id":"1b-02-10","q":"11减5等于多少？","o":["6","7","5","4"],"a":0,"e":"10减5得5，5加1得6；或想5加6等于11，所以11减5等于6。"},{"id":"1b-02-11","q":"14减6等于多少？","o":["7","9","8","6"],"a":2,"e":"10减6得4，4加4得8；或想6加8等于14，所以14减6等于8。"},{"id":"1b-02-12","q":"13减5等于多少？","o":["8","9","7","6"],"a":0,"e":"10减5得5，5加3得8；或想5加8等于13，所以13减5等于8。"},{"id":"1b-02-13","q":"12减4等于多少？","o":["7","9","8","6"],"a":2,"e":"10减4得6，6加2得8；或想4加8等于12，所以12减4等于8。"},{"id":"1b-02-14","q":"11减3等于多少？","o":["7","9","8","6"],"a":2,"e":"10减3得7，7加1得8；或想3加8等于11，所以11减3等于8。"},{"id":"1b-02-15","q":"15减6等于多少？","o":["8","9","10","7"],"a":1,"e":"10减6得4，4加5得9；或想6加9等于15，所以15减6等于9。"},{"id":"1b-02-16","q":"14减5等于多少？","o":["8","10","7","9"],"a":3,"e":"10减5得5，5加4得9；或想5加9等于14，所以14减5等于9。"},{"id":"1b-02-17","q":"13减4等于多少？","o":["8","10","7","9"],"a":3,"e":"10减4得6，6加3得9；或想4加9等于13，所以13减4等于9。"},{"id":"1b-02-18","q":"12减3等于多少？","o":["8","9","10","7"],"a":1,"e":"10减3得7，7加2得9；或想3加9等于12，所以12减3等于9。"},{"id":"1b-02-19","q":"16减9等于多少？","o":["6","7","8","5"],"a":1,"e":"10减9得1，1加6得7；或想9加7等于16，所以16减9等于7。"},{"id":"1b-02-20","q":"小明有13颗糖，吃掉8颗，还剩几颗？","o":["5颗","4颗","7颗","6颗"],"a":3,"e":"求还剩多少用减法：13减8等于5，所以还剩5颗糖。可以想8加5等于13。"}]},{"id":"1b-03","name":"分类与整理","desc":"按不同标准分类，用简单统计表表示结果","qs":[{"id":"1b-03-01","q":"把动物按“会不会飞”分类：会飞的有燕子、蝴蝶；不会飞的有狗、鱼、兔子。不会飞的动物有几只？","o":["3只","2只","4只","5只"],"a":0,"e":"不会飞的是狗、鱼、兔子，一共3只。"},{"id":"1b-03-02","q":"书包里有：3支红笔、2支蓝笔、5支黑笔。按颜色分类，哪种笔最多？","o":["红笔","蓝笔","黑笔","一样多"],"a":2,"e":"红笔3支、蓝笔2支、黑笔5支，5最大，所以黑笔最多。"},{"id":"1b-03-03","q":"一班同学喜欢的水果统计：苹果8人、香蕉5人、橘子6人。喜欢哪种水果的人最多？","o":["橘子","香蕉","苹果","一样多"],"a":2,"e":"8大于6大于5，喜欢苹果的有8人，人数最多。"},{"id":"1b-03-04","q":"根据上题的统计表（苹果8人、香蕉5人、橘子6人），一共有多少人参加统计？","o":["18人","17人","20人","19人"],"a":3,"e":"把三类人数加起来：8加5加6等于19，所以一共19人。"},{"id":"1b-03-05","q":"把图形按形状分：三角形4个、正方形3个、圆5个、平行四边形2个。哪种图形数量最少？","o":["三角形","正方形","圆","平行四边形"],"a":3,"e":"平行四边形只有2个，比4、3、5都小，所以数量最少。"},{"id":"1b-03-06","q":"按上题的数量（三角形4个、正方形3个、圆5个、平行四边形2个），一共有多少个图形？","o":["14个","13个","12个","15个"],"a":0,"e":"4加3加5加2等于14，所以一共有14个图形。"},{"id":"1b-03-07","q":"小明把扣子按颜色分成两堆：红色7颗，蓝色9颗。按“多于8颗”这个标准分，符合条件的有几堆？","o":["0堆","2堆","1堆","3堆"],"a":2,"e":"红色7颗不多于8，蓝色9颗多于8，所以只有1堆符合条件。"},{"id":"1b-03-08","q":"把下面物品按“是不是文具”分类：铅笔、橡皮、苹果、尺子、香蕉。文具类有几个？","o":["2个","3个","4个","5个"],"a":1,"e":"文具是铅笔、橡皮、尺子，共3个；苹果和香蕉是水果，不是文具。"},{"id":"1b-03-09","q":"统计表显示：男生12人，女生10人。全班一共有多少人？","o":["22人","21人","20人","23人"],"a":0,"e":"男生加女生：12加10等于22，全班共22人。"},{"id":"1b-03-10","q":"按“单数还是双数”分类，卡片上的数是：3、8、5、2、7。单数有几个？","o":["2个","5个","4个","3个"],"a":3,"e":"单数是3、5、7，一共3个；8和2是双数。"},{"id":"1b-03-11","q":"还是卡片上的数：3、8、5、2、7。双数有几个？","o":["1个","2个","3个","4个"],"a":1,"e":"双数（能被2整除）是8和2，一共2个。"},{"id":"1b-03-12","q":"给物体分类时，下面哪种分法的标准不清楚？","o":["按颜色分","按“好吃的”分","按大小分","按形状分"],"a":1,"e":"“好吃的”是每个人的感觉，标准不统一；而颜色、大小、形状都能清楚判断。"},{"id":"1b-03-13","q":"小红整理书包，把书放在一起有5本，本子放在一起有3本。按“物品种类”分，分成了几类？","o":["1类","2类","3类","4类"],"a":1,"e":"书和本子是两种不同的物品种类，所以分成了2类。"},{"id":"1b-03-14","q":"天气统计：晴4天、雨3天、阴2天、雪1天。哪种天气出现的天数最少？","o":["晴","雨","阴","雪"],"a":3,"e":"雪只有1天，比4、3、2都少，所以雪天最少。"},{"id":"1b-03-15","q":"根据上题（晴4天、雨3天、阴2天、雪1天），一共统计了多少天？","o":["9天","10天","11天","12天"],"a":1,"e":"4加3加2加1等于10，一共统计了10天。"},{"id":"1b-03-16","q":"把数字按“比5大还是比5小”分类：1、3、6、8、2、9。比5大的有几个？","o":["3个","2个","4个","5个"],"a":0,"e":"比5大的是6、8、9，一共3个。"},{"id":"1b-03-17","q":"还是数字：1、3、6、8、2、9。比5小的有几个？","o":["3个","2个","4个","5个"],"a":0,"e":"比5小的是1、3、2，一共3个。"},{"id":"1b-03-18","q":"班级图书角：故事书7本、科技书4本、漫画书5本。故事书比科技书多几本？","o":["2本","4本","3本","5本"],"a":2,"e":"求多几本用减法：7减4等于3，所以故事书比科技书多3本。"},{"id":"1b-03-19","q":"根据上题（故事书7本、科技书4本、漫画书5本），图书角一共有多少本书？","o":["15本","17本","16本","18本"],"a":2,"e":"7加4加5等于16，图书角一共有16本书。"},{"id":"1b-03-20","q":"下面哪句话关于“分类”是对的？","o":["同一批物体只能按一种标准分","圆形不能分类","分类后数量会越来越多","分类的标准要清楚"],"a":3,"e":"同一批物体可以按不同标准分类（如按颜色和按大小），但每次分类的标准都要清楚。"}]},{"id":"1b-04","name":"100以内数的认识","desc":"数数、数的组成、读数写数、数的顺序、比较大小、近似数、整十数加一位数及相应减法","qs":[{"id":"1b-04-01","q":"一个数由3个十和5个一组成，这个数是几？","o":["30","53","35","8"],"a":2,"e":"3个十是30，5个一是5，合起来是35。"},{"id":"1b-04-02","q":"78里面有（ ）个十和（ ）个一？","o":["7个十和7个一","8个十和7个一","7个十和8个一","8个十和8个一"],"a":2,"e":"78的十位是7表示7个十，个位是8表示8个一。"},{"id":"1b-04-03","q":"数字45读作什么？","o":["四五","四十五个","五十四","四十五"],"a":3,"e":"读两位数先读十位“四十”再读个位“五”，读作四十五。"},{"id":"1b-04-04","q":"写出“六十三”这个数字。","o":["73","36","60","63"],"a":3,"e":"六十三表示6个十和3个一，写作63。"},{"id":"1b-04-05","q":"从三十五往后数：三十六、三十七……三十九后面是几？","o":["38","30","41","40"],"a":3,"e":"三十九再数一个就是四十，所以三十九后面是40。"},{"id":"1b-04-06","q":"100里面有（ ）个十？","o":["10","100","1","0"],"a":0,"e":"10个十是100，所以100里面有10个十。"},{"id":"1b-04-07","q":"和59相邻的两个数是？","o":["57和58","58和60","60和61","58和59"],"a":1,"e":"59前面是58、后面是60，相邻的两个数是58和60。"},{"id":"1b-04-08","q":"比50大、比60小的数中，最大的一个是几？","o":["59","58","60","51"],"a":0,"e":"比50大比60小的数从51到59，其中最大的是59（60不在范围内）。"},{"id":"1b-04-09","q":"比较大小：47（ ）74","o":["＜","＞","＝","≈"],"a":0,"e":"47的十位是4，74的十位是7，4小于7，所以47小于74。"},{"id":"1b-04-10","q":"比较大小：100（ ）99","o":["＞","＜","＝","≈"],"a":0,"e":"100是三位数，比两位数99大，所以100大于99。"},{"id":"1b-04-11","q":"一盒大约有98颗糖，估一估，它大约是几十颗？","o":["90","100","80","110"],"a":1,"e":"98非常接近100，所以可以说大约有100颗，100是它的近似数。"},{"id":"1b-04-12","q":"整十数加一位数：40加6等于多少？","o":["10","64","406","46"],"a":3,"e":"40是4个十，加6个一，合起来是46。"},{"id":"1b-04-13","q":"和上一题对应：46减6等于多少？","o":["4","40","36","50"],"a":1,"e":"46去掉6个一，剩下4个十，就是40。"},{"id":"1b-04-14","q":"一个数的个位是9，十位是4，这个数是几？","o":["9","94","40","49"],"a":3,"e":"十位4表示40，个位9表示9，合起来是49。"},{"id":"1b-04-15","q":"70前面的第3个数是几？","o":["68","67","69","73"],"a":1,"e":"从70往前数：69（第1）、68（第2）、67（第3），所以是67。"},{"id":"1b-04-16","q":"十位上是8，个位上是0，这个数是几？","o":["88","8","80","18"],"a":2,"e":"8个十、0个一组成的数是80。"},{"id":"1b-04-17","q":"35再添上5个是几十？","o":["45","30","40","39"],"a":2,"e":"35加5等于40，所以是四十。"},{"id":"1b-04-18","q":"从10开始，十个十个地数：10、20、30、40、50，一共数了几个十？","o":["4个","5个","6个","10个"],"a":1,"e":"数到的数依次是10、20、30、40、50，共5个数，也就是5个十。"},{"id":"1b-04-19","q":"最大的两位数是几？","o":["90","100","99","98"],"a":2,"e":"两位数从10到99，最大的是99；100是三位数了。"},{"id":"1b-04-20","q":"最小的三位数是几？","o":["100","99","10","101"],"a":0,"e":"三位数从100开始，所以最小的三位数是100。"}]},{"id":"1b-05","name":"认识人民币","desc":"单位：元、角、分；换算：1元=10角，1角=10分；简单的人民币计算","qs":[{"id":"1b-05-01","q":"1元等于多少角？","o":["1角","100角","10角","5角"],"a":2,"e":"人民币单位进率：1元等于10角。"},{"id":"1b-05-02","q":"1角等于多少分？","o":["1分","100分","10分","5分"],"a":2,"e":"1角等于10分。"},{"id":"1b-05-03","q":"1元等于多少分？","o":["100分","10分","1分","50分"],"a":0,"e":"1元等于10角，1角等于10分，所以1元等于100分。"},{"id":"1b-05-04","q":"5角加5角等于多少？","o":["1角","10角","5角","1元"],"a":3,"e":"5角加5角等于10角，10角就是1元。"},{"id":"1b-05-05","q":"3元6角等于多少角？","o":["30角","36角","63角","9角"],"a":1,"e":"3元等于30角，30角加6角等于36角。"},{"id":"1b-05-06","q":"48分等于几角几分？","o":["8角4分","48角","4角6分","4角8分"],"a":3,"e":"因为10分等于1角，48分就是4角还多出8分，即4角8分。"},{"id":"1b-05-07","q":"一支铅笔8角，小明付1元，应找回多少？","o":["5角","1角","3角","2角"],"a":3,"e":"1元等于10角，10角减8角等于2角，应找回2角。"},{"id":"1b-05-08","q":"一个本子5角，买2个这样的本子要多少钱？","o":["1元5角","10角","1元","5角"],"a":2,"e":"5角加5角等于10角，10角就是1元。"},{"id":"1b-05-09","q":"橡皮每块2角，买4块要多少钱？","o":["6角","1元","8角","4角"],"a":2,"e":"2角加4次：2加2加2加2等于8角，所以要8角。"},{"id":"1b-05-10","q":"小明有2元，买糖果用了1元5角，还剩多少？","o":["1元5角","5角","1元","2角"],"a":1,"e":"2元减去1元5角，剩下5角（也可以想：2元=20角，1元5角=15角，20-15=5角）。"},{"id":"1b-05-11","q":"下面哪种人民币面值最大？","o":["1元","1分","1角","5角"],"a":0,"e":"1元大于5角大于1角大于1分，所以1元面值最大。"},{"id":"1b-05-12","q":"10分可以换成几角？","o":["1角","10角","5角","2角"],"a":0,"e":"因为10分等于1角，所以10分可以换成1角。"},{"id":"1b-05-13","q":"一个汉堡8元，一个鸡腿5元，一共要多少钱？","o":["3元","12元","40元","13元"],"a":3,"e":"8元加5元等于13元，一共要13元。"},{"id":"1b-05-14","q":"一个书包36元，付出40元，应找回多少？","o":["6元","14元","4元","30元"],"a":2,"e":"40元减36元等于4元，应找回4元。"},{"id":"1b-05-15","q":"2元3角加4元等于多少？","o":["4元3角","6元","2元7角","6元3角"],"a":3,"e":"元加元：2元加4元等于6元，再加上3角，共6元3角。"},{"id":"1b-05-16","q":"7角减3角等于多少？","o":["10角","4角","3角","1角"],"a":1,"e":"7角减3角等于4角。"},{"id":"1b-05-17","q":"下面哪种说法是对的？","o":["1元=10分","10角=1元","1角=100分","100元=1角"],"a":1,"e":"正确的换算关系是10角等于1元；1元应等于100分，1角等于10分。"},{"id":"1b-05-18","q":"妈妈给小红1张5元和1张1元，一共有多少钱？","o":["6元","1元","5元","4元"],"a":0,"e":"5元加1元等于6元。"},{"id":"1b-05-19","q":"一块糖1角，买10块这样的糖要多少钱？","o":["1元","1角","10元","5角"],"a":0,"e":"10个1角就是10角，10角等于1元。"},{"id":"1b-05-20","q":"下面哪种付钱方式正好是1元？","o":["1张1角","2张5角","5张1分","1张5角"],"a":1,"e":"5角加5角等于10角，也就是1元；其它都不够1元。"}]},{"id":"1b-06","name":"100以内的加法和减法（一）","desc":"整十数加、减整十数；两位数加、减一位数/整十数（不进位、不退位）","qs":[{"id":"1b-06-01","q":"30加20等于多少？","o":["5","40","50","60"],"a":2,"e":"3个十加2个十等于5个十，也就是50。"},{"id":"1b-06-02","q":"60减30等于多少？","o":["90","30","3","33"],"a":1,"e":"6个十减3个十等于3个十，也就是30。"},{"id":"1b-06-03","q":"40加50等于多少？","o":["9","100","80","90"],"a":3,"e":"4个十加5个十等于9个十，也就是90。"},{"id":"1b-06-04","q":"70减40等于多少？","o":["110","3","30","34"],"a":2,"e":"7个十减4个十等于3个十，也就是30。"},{"id":"1b-06-05","q":"23加4等于多少？","o":["27","63","29","19"],"a":0,"e":"两位数加一位数（不进位），个位3加4得7，十位2不变，结果是27。"},{"id":"1b-06-06","q":"35加2等于多少？","o":["57","52","33","37"],"a":3,"e":"个位5加2得7，十位3不变，结果是37。"},{"id":"1b-06-07","q":"46加3等于多少？","o":["76","43","49","39"],"a":2,"e":"个位6加3得9，十位4不变，结果是49。"},{"id":"1b-06-08","q":"58加1等于多少？","o":["68","59","57","51"],"a":1,"e":"个位8加1得9，十位5不变，结果是59。"},{"id":"1b-06-09","q":"25减3等于多少？","o":["28","52","22","8"],"a":2,"e":"两位数减一位数（不退位），个位5减3得2，十位2不变，结果是22。"},{"id":"1b-06-10","q":"47减5等于多少？","o":["52","42","44","2"],"a":1,"e":"个位7减5得2，十位4不变，结果是42。"},{"id":"1b-06-11","q":"69减6等于多少？","o":["63","93","66","3"],"a":0,"e":"个位9减6得3，十位6不变，结果是63。"},{"id":"1b-06-12","q":"32加10等于多少？","o":["33","42","22","52"],"a":1,"e":"两位数加整十数，十位3加1得4，个位2不变，结果是42。"},{"id":"1b-06-13","q":"45加20等于多少？","o":["47","65","25","55"],"a":1,"e":"十位4加2得6，个位5不变，结果是65。"},{"id":"1b-06-14","q":"56加30等于多少？","o":["86","59","26","83"],"a":0,"e":"十位5加3得8，个位6不变，结果是86。"},{"id":"1b-06-15","q":"78减20等于多少？","o":["98","18","75","58"],"a":3,"e":"两位数减整十数，十位7减2得5，个位8不变，结果是58。"},{"id":"1b-06-16","q":"64减30等于多少？","o":["94","14","61","34"],"a":3,"e":"十位6减3得3，个位4不变，结果是34。"},{"id":"1b-06-17","q":"81减10等于多少？","o":["71","91","80","21"],"a":0,"e":"十位8减1得7，个位1不变，结果是71。"},{"id":"1b-06-18","q":"小明有23本故事书，又买来5本，现在有多少本？","o":["33本","25本","18本","28本"],"a":3,"e":"求现在有多少本用加法：23加5等于28，现在有28本。"},{"id":"1b-06-19","q":"小红有45颗星星，送给同学20颗，还剩几颗？","o":["65颗","42颗","25颗","5颗"],"a":2,"e":"求还剩用减法：45减20等于25，还剩25颗。"},{"id":"1b-06-20","q":"下面哪道题是不进位加法？","o":["28＋1","38＋5","47＋6","59＋7"],"a":0,"e":"28加1，个位8加1等于9，不满十，是不进位加法；其余各题个位相加都满十要进位。"}]},{"id":"1b-07","name":"找规律","desc":"图形与数字的简单排列规律","qs":[{"id":"1b-07-01","q":"按规律填空：2，4，6，8，（ ）。","o":["9","12","11","10"],"a":3,"e":"后面一个数比前面多2，8加2等于10。"},{"id":"1b-07-02","q":"按规律填空：1，3，5，7，（ ）。","o":["9","8","10","11"],"a":0,"e":"都是单数，每次加2，7加2等于9。"},{"id":"1b-07-03","q":"按规律填空：5，10，15，20，（ ）。","o":["25","21","30","22"],"a":0,"e":"每次加5，20加5等于25。"},{"id":"1b-07-04","q":"按规律填空：10，20，30，40，（ ）。","o":["41","50","60","45"],"a":1,"e":"每次加10，40加10等于50。"},{"id":"1b-07-05","q":"图形按规律排列：正方形、圆、三角形、正方形、圆、三角形、正方形、圆、（ ）。","o":["三角形","正方形","圆","平行四边形"],"a":0,"e":"图形按“正方形、圆、三角形”三个一组循环，圆后面应是三角形。"},{"id":"1b-07-06","q":"颜色按规律排列：红、黄、蓝、红、黄、蓝、红、黄、（ ）。","o":["红","蓝","黄","绿"],"a":1,"e":"颜色按“红、黄、蓝”三个一组循环，黄后面应是蓝。"},{"id":"1b-07-07","q":"按规律填空：9，8，7，6，（ ）。","o":["3","4","5","2"],"a":2,"e":"每次减1，6减1等于5。"},{"id":"1b-07-08","q":"按规律填空：11，22，33，44，（ ）。","o":["45","55","66","50"],"a":1,"e":"每次加11，44加11等于55。"},{"id":"1b-07-09","q":"按规律填空：2，4，8，（ ）。","o":["10","12","16","14"],"a":2,"e":"后面的数都是前一个的2倍（2乘2得4，4乘2得8，8乘2得16）。"},{"id":"1b-07-10","q":"图形按规律排列：三角、三角、正方、三角、三角、正方、三角、三角、（ ）。","o":["平行四边形","三角形","圆","正方形"],"a":3,"e":"按“三角、三角、正方”三个一组循环，两个三角形后面应是正方形。"},{"id":"1b-07-11","q":"按规律填空：40，35，30，25，（ ）。","o":["21","24","20","15"],"a":2,"e":"每次减5，25减5等于20。"},{"id":"1b-07-12","q":"按规律填空：1，2，4，7，11，（ ）。","o":["14","15","17","16"],"a":3,"e":"相邻两数的差依次是1、2、3、4，下一个差应是5，11加5等于16。"},{"id":"1b-07-13","q":"图形数量按规律增加：○，○○，○○○，（ ）。","o":["○○","○○○○","○","○○○○○"],"a":1,"e":"每次都比前一次多1个圆，3个圆后面应是4个圆。"},{"id":"1b-07-14","q":"按规律填空：3，6，9，12，（ ）。","o":["13","14","15","18"],"a":2,"e":"每次加3，12加3等于15。"},{"id":"1b-07-15","q":"按规律排列：上、下、上、下、上、（ ）。","o":["上","下","左","右"],"a":1,"e":"上、下两个一组交替出现，上后面应是下。"},{"id":"1b-07-16","q":"按规律填空：20，18，16，14，（ ）。","o":["11","13","10","12"],"a":3,"e":"每次减2，14减2等于12。"},{"id":"1b-07-17","q":"图形按规律排列：大、小、大、小、大、（ ）。","o":["大","中","小","圆"],"a":2,"e":"大、小两个一组交替，大后面应是小。"},{"id":"1b-07-18","q":"按规律填空：5，7，9，11，（ ）。","o":["12","15","14","13"],"a":3,"e":"每次加2，11加2等于13。"},{"id":"1b-07-19","q":"按规律填空：0，1，3，6，10，（ ）。","o":["15","14","13","16"],"a":0,"e":"相邻两数的差依次是1、2、3、4，下一个差应是5，10加5等于15。"},{"id":"1b-07-20","q":"下面哪组数是按规律排列的？","o":["1，3，5，7","2，4，9，6","5，3，8，1","9，7，8，6"],"a":0,"e":"1、3、5、7每次加2，是有规律的排列；其余几组看不出统一的变化规律。"}]}]}]});
