<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    --blue:#4a90e2;
    --blue-soft:#eaf3fd;
    --blue-deep:#2f6fc0;
    --pink:#ff6b9d;
    --pink-soft:#fff0f5;
    --pink-deep:#e84d80;
    --ink:#2c2c38;
    --muted:#8a8a9a;
    --line:#ececf3;
    --bg:#f7f8fb;
    --card:#ffffff;
    --shadow:0 10px 30px rgba(40,40,80,.08);
    --shadow-sm:0 4px 14px rgba(40,40,80,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%,rgba(74,144,226,.12),transparent 60%),
      radial-gradient(1200px 600px at 88% -10%,rgba(255,107,157,.12),transparent 60%),
      var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:24px 18px 80px}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin-bottom:22px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--pink))}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font:inherit;cursor:pointer;border:none;border-radius:12px;padding:9px 14px;
    font-weight:600;transition:.18s transform,.18s box-shadow,.18s background;
  }
  button:active{transform:translateY(1px)}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .btn-ghost:hover{box-shadow:var(--shadow)}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-pink{background:var(--pink);color:#fff}
  .btn-danger{background:#fff;color:#e23c3c;border:1px solid #f3c9c9}
  .btn-danger:hover{background:#fff3f3}

  /* couples hero */
  .hero{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:24px 18px;margin-bottom:22px;position:relative;overflow:hidden;
  }
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(74,144,226,.06),rgba(255,107,157,.06));pointer-events:none}
  .person{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
  .person.male .ring{box-shadow:0 0 0 4px var(--blue-soft),0 8px 22px rgba(74,144,226,.25)}
  .person.female .ring{box-shadow:0 0 0 4px var(--pink-soft),0 8px 22px rgba(255,107,157,.25)}
  .avatar-box{position:relative;width:96px;height:96px}
  .avatar{
    width:96px;height:96px;border-radius:50%;object-fit:cover;background:#eef0f5;
    display:flex;align-items:center;justify-content:center;font-size:34px;color:#b9bcc7;
    border:3px solid #fff;
  }
  .ring{padding:3px;border-radius:50%}
  .person.male .ring{background:linear-gradient(135deg,var(--blue),#7db4f0)}
  .person.female .ring{background:linear-gradient(135deg,var(--pink),#ffa6c4)}
  .avatar-edit{
    position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;
    background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:14px;box-shadow:var(--shadow-sm);cursor:pointer;color:var(--muted)
  }
  .person .name{font-weight:800;font-size:18px;max-width:130px;text-align:center;cursor:text;border-bottom:1px dashed transparent}
  .person .name:hover{border-bottom-color:var(--line)}
  .person.male .name{color:var(--blue-deep)}
  .person.female .name{color:var(--pink-deep)}
  .name-input{border:none;font:inherit;font-weight:800;font-size:18px;text-align:center;background:transparent;outline:none;width:130px}
  .person.male .name-input{color:var(--blue-deep)}
  .person.female .name-input{color:var(--pink-deep)}

  .center-heart{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1}
  .heart{font-size:34px;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.15)}40%{transform:scale(1)}}
  .days-big{font-weight:900;font-size:30px;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .days-label{font-size:12px;color:var(--muted);font-weight:600}

  /* stats row */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;text-align:center;position:relative}
  .stat .num{font-weight:900;font-size:20px;color:var(--ink)}
  .stat .lab{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .stat .edithint{position:absolute;top:8px;right:10px;font-size:11px;color:var(--blue);cursor:pointer;opacity:.0;transition:.15s}
  .stat:hover .edithint{opacity:1}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 14px}
  .section-title h2{font-size:17px;font-weight:800}
  .section-title .hint{font-size:12px;color:var(--muted)}

  /* timeline */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--blue),var(--pink))}
  .mem{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:14px;transition:.18s;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .mem:hover{box-shadow:var(--shadow)}
  .mem::before{content:"";position:absolute;left:-21px;top:18px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
  .mem.type-eat::before{border-color:var(--pink)}
  .mem.type-pet::before{border-color:#f5a623}
  .mem.type-newyear::before{border-color:#7b6cf0}
  .mem.type-travel::before{border-color:#1ab6c4}
  .mem.type-confess::before{border-color:#ff5e7e}
  .mem.type-propose::before{border-color:#d4af37}
  .mem-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .mem-emoji{font-size:22px;width:38px;height:38px;border-radius:11px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center}
  .mem.type-eat .mem-emoji{background:var(--pink-soft)}
  .mem.type-pet .mem-emoji{background:#fff6e6}
  .mem.type-newyear .mem-emoji{background:#f0edff}
  .mem.type-travel .mem-emoji{background:#e6fbff}
  .mem.type-confess .mem-emoji{background:#ffe9ee}
  .mem.type-propose .mem-emoji{background:#fff7e0}
  .mem-title{font-weight:800;font-size:15px;flex:1}
  .mem-date{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .mem-del{color:#c9c9d2;cursor:pointer;font-size:13px;border:none;background:none;padding:4px}
  .mem-del:hover{color:#e23c3c}
  .mem-desc{font-size:14px;color:#555;white-space:pre-wrap;word-break:break-word}
  .mem-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mem-imgs img{width:92px;height:92px;object-fit:cover;border-radius:10px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s}
  .mem-imgs img:hover{transform:scale(1.03)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:14px;box-shadow:var(--shadow-sm)}
  .empty .big{font-size:40px;margin-bottom:8px}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(30,30,50,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .mask.show{display:flex;animation:fade .2s ease}
  .modal{background:var(--card);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}
  .modal h3{font-size:18px;margin-bottom:16px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input[type=text],.field input[type=date],.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;background:#fbfbfd;outline:none;transition:.15s
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);background:#fff}
  .field textarea{resize:vertical;min-height:70px}
  .type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .type-chip{border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:#fbfbfd;transition:.15s}
  .type-chip .e{font-size:18px;display:block}
  .type-chip.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep)}
  .type-chip.custom.sel{border-color:var(--pink);background:var(--pink-soft);color:var(--pink-deep)}
  .upload-zone{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;font-size:13px}
  .upload-zone:hover{border-color:var(--blue);color:var(--blue)}
  .preview-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .preview-imgs .pv{position:relative;width:64px;height:64px}
  .preview-imgs img{width:64px;height:64px;object-fit:cover;border-radius:9px}
  .preview-imgs .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e23c3c;color:#fff;border:none;font-size:12px;cursor:pointer;line-height:1}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

  /* lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:var(--shadow)}
  .lightbox .close{position:absolute;top:18px;right:22px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none}

  /* toast */
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#2c2c38;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}

  @media(max-width:640px){
    .hero{grid-template-columns:1fr;gap:18px}
    .center-heart{order:-1;flex-direction:row;gap:12px}
    .stats{grid-template-columns:1fr}
    .type-grid{grid-template-columns:repeat(3,1fr)}
  }
</style></head><body><div style="text-align:center;background:#fff0f5;padding:8px;font-size:13px">示例体验，数据仅保留在本页 <button id="resetDemo" style="padding:3px 8px">恢复示例数据</button></div>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>我们的恋爱记录</div>
    <div class="top-actions">
      <button class="btn-ghost" id="btnAdd">＋ 记录回忆</button>
      <button class="btn-ghost" id="btn短片">🎬 回忆短片</button>
      <button class="btn-ghost" id="btnBackup">💾 备份/导入</button>
      <button class="btn-danger" id="btnClear">🗑 清空重来</button>
    </div>
  </header>

  <!-- 情侣头部 -->
  <section class="hero">
    <div class="person male">
      <div class="avatar-box">
        <div class="ring"><img alt="男" class="avatar" id="avMale" src></div>
        <div class="avatar-edit" data-side="male">📷</div>
      </div>
      <div class="name"><input class="name-input" id="nmMale" maxlength="12" placeholder="男生昵称"></div>
    </div>
    <div class="center-heart">
      <div class="heart">💗</div>
      <div class="days-big" id="daysBig">0</div>
      <div class="days-label" id="daysLabel">相恋天数</div>
    </div>
    <div class="person female">
      <div class="avatar-box">
        <div class="ring"><img alt="女" class="avatar" id="avFemale" src></div>
        <div class="avatar-edit" data-side="female">📷</div>
      </div>
      <div class="name"><input class="name-input" id="nmFemale" maxlength="12" placeholder="女生昵称"></div>
    </div>
  </section>

  <!-- 数据卡 -->
  <section class="stats">
    <div class="stat">
      <div class="num" id="stTogether">—</div>
      <div class="lab">恋爱天数</div>
      <div class="edithint" data-edit="anniversary">设置纪念日</div>
    </div>
    <div class="stat">
      <div class="num" id="stMet">—</div>
      <div class="lab">相识天数</div>
      <div class="edithint" data-edit="firstMet">设置相识日</div>
    </div>
    <div class="stat">
      <div class="num" id="stCount">0</div>
      <div class="lab">回忆片段</div>
      <div class="edithint" id="addFromStat" style="cursor:pointer; color:var(--pink)">＋ 添加</div>
    </div>
  </section>

  <!-- 回忆时间线 -->
  <div class="section-title">
    <h2>💞 恋爱回忆</h2>
    <span class="hint">按时间倒序 · 点击图片可放大</span>
  </div>
  <div class="timeline" id="timeline"></div>

  <footer class="foot">数据仅保存在本机浏览器 · 记得定期「备份」以防丢失 💛</footer>
</div>

<!-- 添加回忆弹窗 -->
<div class="mask" id="maskAdd">
  <div class="modal">
    <h3>记录一段恋爱回忆</h3>
    <div class="field">
      <label>选择类型</label>
      <div class="type-grid" id="typeGrid"></div>
    </div>
    <div class="field">
      <label>标题</label>
      <input id="mTitle" maxlength="30" placeholder="例如：第一次一起看海" type="text">
    </div>
    <div class="field">
      <label>日期</label>
      <input id="mDate" type="date">
    </div>
    <div class="field">
      <label>小记</label>
      <textarea id="mDesc" placeholder="写下那一刻的心情吧～"></textarea>
    </div>
    <div class="field">
      <label>照片（可多张）</label>
      <div class="upload-zone" id="uploadZone">点击或拖拽上传图片</div>
      <input accept="image/*" hidden id="fileInput" multiple type="file">
      <div class="preview-imgs" id="previewImgs"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="mCancel">取消</button>
      <button class="btn-blue" id="mSave">保存回忆</button>
    </div>
  </div>
</div>

<!-- 日期设置弹窗 -->
<div class="mask" id="maskDate">
  <div class="modal">
    <h3 id="dateTitle">设置日期</h3>
    <div class="field">
      <label id="dateLabel">选择日期</label>
      <input id="dateInput" type="date">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="dateCancel">取消</button>
      <button class="btn-blue" id="dateSave">保存</button>
    </div>
  </div>
</div>

<!-- 备份导入弹窗 -->
<div class="mask" id="maskBackup">
  <div class="modal">
    <h3>备份 / 导入数据</h3>
    <p style="font-size:13px; color:var(--muted); margin-bottom:14px">导出会把所有信息保存成一个文件，换电脑或清缓存前记得备份；导入可还原之前的备份。</p>
    <div class="field">
      <button class="btn-blue" id="exportBtn" style="width:100%">⬇ 导出备份文件（.json）</button>
    </div>
    <div class="field">
      <label style="margin-bottom:8px">从备份文件导入</label>
      <input accept="application/json,.json" hidden id="importInput" type="file">
      <button class="btn-ghost" id="importPick" style="width:100%">⬆ 选择备份文件导入</button>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="backupCancel">关闭</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><button class="close" id="lbClose">×</button><img id="lbImg" src></div>
<div class="toast" id="toast"></div>
<input accept="image/*" hidden id="avatarInput" type="file">

<script>/* ============ 数据层 ============ */
const KEY='loveRecordData_v1';
const TYPES=[
  {k:'meet',e:'🤝',t:'第一次见面',cls:''},
  {k:'eat',e:'🍜',t:'第一次吃饭',cls:'type-eat'},
  {k:'pet',e:'🐱',t:'共同养宠物',cls:'type-pet'},
  {k:'newyear',e:'🎆',t:'一起跨年',cls:'type-newyear'},
  {k:'travel',e:'✈️',t:'第一次旅行',cls:'type-travel'},
  {k:'confess',e:'💕',t:'告白那天',cls:'type-confess'},
  {k:'propose',e:'💍',t:'求婚时刻',cls:'type-propose'},
  {k:'star',e:'⭐',t:'其他回忆',cls:''},
];
const typeMap=Object.fromEntries(TYPES.map(t=>[t.k,t]));

const sample=()=>({male:{name:'小蓝',avatar:''},female:{name:'小粉',avatar:''},anniversary:'2024-05-20',firstMet:'2024-03-10',memories:[{id:'sample',type:'travel',title:'第一次看海',date:'2025-06-01',desc:'一起走过海边的傍晚。',images:[]}]});
let state=sample();
function load(){return sample()}
function save(){}
/* ============ 工具 ============ */
function $(id){return document.getElementById(id);}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function daysBetween(a,b){ // a,b: yyyy-mm-dd
  if(!a||!b) return null;
  const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return `${y}年${+m}月${+d}日`;}

/* ============ 渲染 ============ */
function render(){
  $('nmMale').value=state.male.name||'';
  $('nmFemale').value=state.female.name||'';
  setAvatar('avMale',state.male.avatar,'👦');
  setAvatar('avFemale',state.female.avatar,'👧');

  const t=today();
  const together=daysBetween(state.anniversary,t);
  const met=daysBetween(state.firstMet,t);
  $('daysBig').textContent=together!=null&&together>=0?together:0;
  $('stTogether').textContent=together!=null&&together>=0?together+' 天':'未设置';
  $('stMet').textContent=met!=null&&met>=0?met+' 天':'未设置';
  $('stMet').title=state.firstMet?fmtDate(state.firstMet):'';
  $('stCount').textContent=state.memories.length;

  renderTimeline();
}
function setAvatar(id,src,placeholder){
  const el=$(id);
  if(src){el.src=src;el.style.color='transparent';}
  else{el.removeAttribute('src');el.alt=placeholder;el.style.color='';}
}
function renderTimeline(){
  const box=$('timeline');
  if(!state.memories.length){
    box.innerHTML=`<div class="empty"><div class="big">📖</div>还没有回忆，点右上角「＋ 记录回忆」写下第一个故事吧～</div>`;
    return;
  }
  const list=[...state.memories].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  box.innerHTML=list.map(m=>{
    const ty=typeMap[m.type]||{e:'⭐',t:'回忆',cls:''};
    const imgs=(m.images||[]).map(src=>`<img src="${src}" data-full="${src}" alt="">`).join('');
    return `<div class="mem ${ty.cls}">
      <div class="mem-head">
        <div class="mem-emoji">${m.customEmoji||ty.e}</div>
        <div class="mem-title">${escapeHtml(m.title||ty.t)}</div>
        <div class="mem-date">${m.date?fmtDate(m.date):''}</div>
        <button class="mem-del" data-del="${m.id}">删除</button>
      </div>
      ${m.desc?`<div class="mem-desc">${escapeHtml(m.desc)}</div>`:''}
      ${imgs?`<div class="mem-imgs">${imgs}</div>`:''}
    </div>`;
  }).join('');
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============ 头像上传 ============ */
document.querySelectorAll('.avatar-edit').forEach(btn=>{
  btn.addEventListener('click',()=>{$('avatarInput').dataset.side=btn.dataset.side;$('avatarInput').click();});
});
$('avatarInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  compressImage(f,400,0.85,b64=>{
    const side=$('avatarInput').dataset.side;
    state[side].avatar=b64;save();render();toast('头像已更新 ✨');
  });
});
$('nmMale').addEventListener('input',e=>{state.male.name=e.target.value;save();});

/* ============ 图片压缩 ============ */
function compressImage(file,maxW,quality,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxW){height=Math.round(height*maxW/width);width=maxW;}
      const cv=document.createElement('canvas');cv.width=width;cv.height=height;
      cv.getContext('2d').drawImage(img,0,0,width,height);
      cb(cv.toDataURL('image/jpeg',quality));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function buildSlideshow(){
  const m=state.male.name||'他',f=state.female.name||'她';
  const list=[...state.memories].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const slides=list.map(x=>{
    const ty=typeMap[x.type]||{e:'⭐',t:'回忆'};
    const imgs=(x.images||[]).map(s=>`<div class="ph"><img src="${s}"></div>`).join('');
    return `<section class="slide"><div class="emoji">${x.customEmoji||ty.e}</div>
      <h2>${escapeHtml(x.title||ty.t)}</h2>
      <p class="dt">${x.date?fmtDate(x.date):''}</p>
      ${x.desc?`<p class="desc">${escapeHtml(x.desc)}</p>`:''}
      ${imgs?`<div class="photos">${imgs}</div>`:''}</section>`;
  }).join('');
  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(m)} & ${escapeHtml(f)} 的回忆短片</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#11131a;color:#fff;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;text-align:center;background:radial-gradient(900px 500px at 50% 30%,rgba(74,144,226,.25),transparent),radial-gradient(900px 500px at 50% 80%,rgba(255,107,157,.25),transparent),#11131a;animation:fade .8s ease}
.slide.on{display:flex}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.emoji{font-size:64px;margin-bottom:14px;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
.slide h2{font-size:30px;margin-bottom:8px}
.dt{color:#ffd2e2;font-weight:600;margin-bottom:14px}
.desc{color:#cfd2dc;max-width:560px;white-space:pre-wrap;line-height:1.7}
.photos{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.ph img{width:200px;height:200px;object-fit:cover;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.hud{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:#9aa;font-size:13px;z-index:5}
.bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#4a90e2,#ff6b9d);z-index:5;transition:width .4s}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.titlecard h1{font-size:40px;background:linear-gradient(135deg,#7db4f0,#ffa6c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.titlecard p{color:#cfd2dc;margin-top:10px}
</style></head><body>
<div class="bar" id="bar"></div>
<div class="titlecard" id="tc"><h1>${escapeHtml(m)} ❤ ${escapeHtml(f)}</h1><p>我们的恋爱回忆短片 · 共 ${list.length} 段</p></div>
${slides}
<div class="hud">空格/→ 下一页 · ← 上一页 · 点击切换</div>
<script>
var s=document.querySelectorAll('.slide'),i=-1,tc=document.getElementById('tc'),bar=document.getElementById('bar');
function show(n){if(n<0){i=-1;tc.style.display='flex';s.forEach(x=>x.classList.remove('on'));bar.style.width='0';return;}
 tc.style.display='none';if(n>=s.length){i=s.length-1;return;}i=n;s.forEach(x=>x.classList.remove('on'));s[i].classList.add('on');
 bar.style.width=((i+1)/s.length*100)+'%';}
function next(){show(i+1);}function prev(){if(i<0)return;show(i-1);}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();next();}
 if(e.code==='ArrowLeft')prev();});
document.body.addEventListener('click',e=>{if(e.target.tagName!=='IMG')next();});
setTimeout(function(){tc.addEventListener('click',next);},300);
<\/script></body></html>`;
}
