<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<title>吃啥 · 别再纠结了</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#FFF6EC;
    --card:#FFFFFF;
    --ink:#2B1D14;
    --ink2:#8A7869;
    --ink3:#B9A695;
    --brand:#FF5B33;
    --brand2:#FF8A3D;
    --sun:#FFC940;
    --mint:#22B07D;
    --line:#F1E4D6;
    --shadow:0 10px 30px rgba(74,44,20,.08);
    --shadow-lg:0 18px 50px rgba(74,44,20,.13);
  }
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    overflow-x:hidden;
  }
  /* 背景光斑 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(680px 480px at 8% -8%, rgba(255,201,64,.22), transparent 70%),
      radial-gradient(620px 420px at 108% 22%, rgba(255,91,51,.13), transparent 70%),
      radial-gradient(500px 500px at 50% 115%, rgba(34,176,125,.09), transparent 70%);
  }

  #app{
    position:relative;z-index:1;
    width:100%;max-width:480px;
    min-height:100dvh;
    padding:0 20px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }

  /* ── 顶栏 ── */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:22px 0 6px;
  }
  .logo{
    width:36px;height:36px;border-radius:12px;
    background:linear-gradient(145deg,var(--brand),var(--brand2));
    display:grid;place-items:center;font-size:19px;
    box-shadow:0 6px 16px rgba(255,91,51,.32);
  }
  .brand{font-weight:900;font-size:17px;letter-spacing:.5px}
  .brand small{display:block;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:1.6px;margin-top:1px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .rec-btn{
    border:1.5px solid var(--line);background:#fff;
    border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;
    color:var(--ink2);font-family:inherit;cursor:pointer;
    display:flex;align-items:center;gap:5px;transition:.2s;
  }
  .rec-btn:active{transform:scale(.95)}
  .rec-btn b{color:var(--brand);font-size:13px}

  /* ── 屏幕切换 ── */
  #stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 4px}
  .screen{display:none;width:100%}
  .screen.on{display:block;animation:screenIn .42s cubic-bezier(.2,.8,.3,1) both}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ── 首屏 ── */
  .hero{padding:26px 0 0;text-align:left}
  .hero-tag{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1.5px solid var(--line);
    border-radius:999px;padding:6px 12px;
    font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:18px;
  }
  .dot-live{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(34,176,125,.18)}
  .hero h1{
    font-size:clamp(38px,11vw,48px);line-height:1.08;font-weight:900;letter-spacing:-1.5px;
  }
  .hero h1 em{
    font-style:normal;position:relative;color:var(--brand);
    background:linear-gradient(100deg,var(--brand),var(--brand2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero h1 .q{color:var(--ink3)}
  .hero p{margin-top:14px;font-size:14.5px;color:var(--ink2);line-height:1.75;font-weight:500}
  .hero p b{color:var(--ink);font-weight:800}

  .cta-main{
    margin-top:30px;width:100%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;font-family:inherit;font-size:17px;font-weight:800;
    padding:19px;border-radius:20px;letter-spacing:.5px;
    box-shadow:0 14px 30px rgba(255,91,51,.34);
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .16s,box-shadow .16s;
  }
  .cta-main:active{transform:scale(.97);box-shadow:0 6px 16px rgba(255,91,51,.3)}
  .cta-main .arw{font-size:20px;transition:transform .2s}
  .cta-main:hover .arw{transform:translateX(3px)}

  .prev-card{
    margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:13px 15px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);
  }
  .prev-card .e{font-size:20px}
  .prev-card b{color:var(--ink);font-weight:800}
  .prev-card .ago{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:600}

  /* ── 步骤 ── */
  .steps{display:flex;gap:6px;margin-bottom:22px}
  .steps i{height:4px;flex:1;border-radius:99px;background:#EFE1D2;transition:.35s}
  .steps i.on{background:linear-gradient(90deg,var(--brand),var(--brand2))}
  .steps i.done{background:#FFC9B6}
  .step-h{margin-bottom:20px}
  .step-h h2{font-size:26px;font-weight:900;letter-spacing:-.6px;line-height:1.25}
  .step-h p{margin-top:7px;font-size:13.5px;color:var(--ink2);font-weight:500}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:#fff;border:1.8px solid transparent;border-radius:18px;
    padding:15px 16px;cursor:pointer;font-family:inherit;
    box-shadow:0 4px 14px rgba(74,44,20,.055);
    transition:transform .16s,border-color .18s,box-shadow .18s,background .18s;
  }
  .opt:active{transform:scale(.975)}
  .opt .ico{
    width:44px;height:44px;flex:0 0 44px;border-radius:14px;
    display:grid;place-items:center;font-size:22px;background:#FFF3E6;
    transition:.2s;
  }
  .opt .tx{flex:1;min-width:0}
  .opt .tx b{display:block;font-size:15.5px;font-weight:800;letter-spacing:.2px}
  .opt .tx span{display:block;font-size:12px;color:var(--ink2);margin-top:3px;font-weight:500}
  .opt .tick{
    width:22px;height:22px;flex:0 0 22px;border-radius:50%;
    border:2px solid #EDDDCB;display:grid;place-items:center;
    font-size:12px;color:#fff;transition:.2s;
  }
  .opt.sel{border-color:var(--brand);background:#FFFBF7;box-shadow:0 8px 22px rgba(255,91,51,.14)}
  .opt.sel .ico{background:linear-gradient(140deg,#FFE0D2,#FFD1BE)}
  .opt.sel .tick{background:linear-gradient(140deg,var(--brand),var(--brand2));border-color:transparent}

  /* 忌口 chips */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    display:flex;align-items:center;gap:7px;
    background:#fff;border:1.8px solid transparent;border-radius:14px;
    padding:12px 15px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);
    cursor:pointer;box-shadow:0 4px 14px rgba(74,44,20,.055);
    transition:.16s;
  }
  .chip:active{transform:scale(.95)}
  .chip .x{font-size:16px}
  .chip.sel{border-color:var(--brand);background:#FFF1EA;color:var(--brand)}
  .chip.sel::after{content:"✓";font-size:11px;font-weight:900}

  .step-foot{display:flex;gap:10px;margin-top:26px}
  .btn-ghost{
    flex:0 0 auto;padding:17px 22px;border-radius:18px;border:1.8px solid var(--line);
    background:#fff;color:var(--ink2);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
    transition:.16s;
  }
  .btn-ghost:active{transform:scale(.96)}
  .btn-go{
    flex:1;padding:17px;border-radius:18px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.4px;
    box-shadow:0 10px 24px rgba(255,91,51,.3);
    transition:.16s,opacity .2s;
  }
  .btn-go:active{transform:scale(.97)}
  .btn-go:disabled{background:#EADDD0;color:#B9A695;box-shadow:none;cursor:not-allowed;transform:none}

  /* ── 加载 ── */
  .loading{display:flex;flex-direction:column;align-items:center;padding:70px 0 40px;text-align:center}
  .bowl{
    font-size:60px;animation:bob 1.05s ease-in-out infinite;
    filter:drop-shadow(0 12px 20px rgba(255,91,51,.22));
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-13px) rotate(4deg)}}
  .load-txt{margin-top:24px;font-size:14.5px;color:var(--ink2);font-weight:600;min-height:22px}
  .load-bar{margin-top:18px;width:150px;height:4px;border-radius:99px;background:#F0E1D2;overflow:hidden}
  .load-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--sun));animation:fill 1.5s ease-out forwards}
  @keyframes fill{to{width:100%}}

  /* ── 结果卡 ── */
  .res-wrap{animation:drop .5s cubic-bezier(.2,1.1,.35,1) both}
  @keyframes drop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  .res-card{
    background:var(--card);border-radius:26px;overflow:hidden;box-shadow:var(--shadow-lg);
  }
  .res-top{
    position:relative;padding:26px 22px 22px;
    background:linear-gradient(150deg,#FFF2E4,#FFE6D6 60%,#FFDCCB);
    text-align:center;overflow:hidden;
  }
  .res-top::after{
    content:"";position:absolute;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.85),transparent 68%);
    top:-70px;right:-60px;
  }
  .res-kicker{
    position:relative;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.82);border-radius:999px;padding:5px 12px;
    font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.6px;margin-bottom:14px;
  }
  .res-emoji{position:relative;font-size:62px;line-height:1;filter:drop-shadow(0 10px 16px rgba(180,90,40,.2))}
  .res-name{position:relative;font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:12px;line-height:1.2}
  .res-cat{
    position:relative;display:inline-block;margin-top:9px;font-size:11.5px;font-weight:700;
    color:#A8663F;background:rgba(255,255,255,.7);padding:4px 11px;border-radius:99px;
  }
  .res-body{padding:20px 22px 6px}
  .res-blurb{font-size:14.5px;line-height:1.75;color:#4A3529;font-weight:600}
  .res-meta{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .mtag{
    display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    background:#FFF6EC;border:1px solid #F5E7D8;color:#8A6142;
    padding:7px 11px;border-radius:10px;
  }
  .why{margin-top:18px;border-top:1.5px dashed #F0E2D2;padding-top:15px}
  .why-t{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:1.4px;margin-bottom:9px}
  .why li{
    list-style:none;display:flex;gap:8px;font-size:12.8px;color:#6B5546;
    line-height:1.6;margin-bottom:6px;font-weight:600;
  }
  .why li i{color:var(--mint);font-style:normal;font-weight:900;flex:0 0 auto}
  .why li.warn i{color:#E8A33D}
  .res-foot{display:flex;gap:9px;padding:16px 22px 20px}
  .btn-swap{
    flex:1;padding:16px;border-radius:16px;border:1.8px solid var(--line);
    background:#fff;color:var(--ink);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    transition:.16s;
  }
  .btn-swap:active{transform:scale(.97)}
  .btn-swap:disabled{border-color:#F3E7DA;color:#C7B4A3;cursor:not-allowed;transform:none;background:#FDF8F2}
  .btn-lock{
    flex:1.15;padding:16px;border-radius:16px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    font-family:inherit;font-size:15px;font-weight:800;
    box-shadow:0 10px 22px rgba(255,91,51,.3);transition:.16s;
  }
  .btn-lock:active{transform:scale(.97)}
  .swap-note{
    text-align:center;font-size:12px;color:var(--ink3);font-weight:600;
    padding:0 22px 16px;line-height:1.6;
  }
  .swap-note b{color:var(--brand);font-weight:800}

  .sub-acts{display:flex;gap:10px;margin-top:12px}
  .mini{
    flex:1;padding:13px;border-radius:15px;border:1.5px solid var(--line);
    background:rgba(255,255,255,.72);color:var(--ink2);
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.16s;
  }
  .mini:active{transform:scale(.97)}

  /* ── 记录 ── */
  .rec-list{display:flex;flex-direction:column;gap:9px;max-height:58dvh;overflow-y:auto;margin:0 -4px;padding:0 4px 8px}
  .rec-item{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;
    padding:13px 15px;box-shadow:0 4px 14px rgba(74,44,20,.05);
  }
  .rec-item .e{font-size:24px}
  .rec-item .n{font-weight:800;font-size:14.5px}
  .rec-item .d{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:600}
  .empty{
    text-align:center;padding:50px 20px;color:var(--ink3);font-size:13.5px;line-height:1.8;font-weight:600;
  }
  .stat-row{display:flex;gap:10px;margin-bottom:16px}
  .stat{flex:1;background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 14px rgba(74,44,20,.05)}
  .stat b{display:block;font-size:24px;font-weight:900;color:var(--brand);letter-spacing:-.5px}
  .stat span{font-size:11px;color:var(--ink3);font-weight:700}

  /* ── 庆祝浮层 ── */
  .sheet{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(43,29,20,.42);backdrop-filter:blur(6px);
  }
  .sheet.on{display:flex;animation:fade .28s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet-box{
    width:100%;max-width:340px;background:#fff;border-radius:26px;
    padding:34px 24px 22px;text-align:center;
    box-shadow:0 24px 60px rgba(43,29,20,.3);
    animation:pop .42s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  .sheet-emoji{font-size:54px;line-height:1}
  .sheet-box h3{font-size:21px;font-weight:900;margin-top:14px;letter-spacing:-.4px}
  .sheet-box p{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.7;font-weight:600}
  .sheet-box .btn-lock{width:100%;margin-top:20px;flex:none}
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
    background:rgba(43,29,20,.92);color:#fff;padding:11px 20px;border-radius:99px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:60;
    white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{margin-top:auto;padding-top:22px;text-align:center;font-size:10.5px;color:#CBB8A6;font-weight:600;letter-spacing:.6px}
</style>
</head>
<body>
<div style="position:fixed;z-index:9999;bottom:0;right:0;background:#fff6ec;padding:5px;font-size:12px">示例体验，数据仅保留在本页 <button id="resetPreview">恢复示例</button></div>
<div id="app">

  <div class="topbar">
    <div class="logo">🍚</div>
    <div class="brand">吃啥<small>JUST PICK ONE</small></div>
    <div class="top-right">
      <button class="rec-btn" id="openRec">📖 记录 <b id="recCount">0</b></button>
    </div>
  </div>

  <div id="stage">

    <!-- 首屏 -->
    <section class="screen on" id="s-intro">
      <div class="hero">
        <div class="hero-tag"><span class="dot-live"></span>10 秒做一个决定</div>
        <h1>今天<em>吃啥</em><span class="q">？</span></h1>
        <p>别再滑动外卖软件了。<br>回答 <b>3 个问题</b>，它替你把剩下的选项全删掉。</p>
      </div>
      <button class="cta-main" id="startBtn">帮我决定 <span class="arw">→</span></button>
      <div id="prevSlot"></div>
    </section>

    <!-- 步骤（内容由 JS 渲染） -->
    <section class="screen" id="s-step">
      <div class="steps"><i class="on"></i><i></i><i></i></div>
      <div class="step-h">
        <h2 id="stepTitle"></h2>
        <p id="stepHint"></p>
      </div>
      <div class="opts" id="stepOpts"></div>
      <div class="step-foot">
        <button class="btn-ghost" id="stepBack">返回</button>
        <button class="btn-go" id="stepNext" disabled>下一步</button>
      </div>
    </section>

    <!-- 加载 -->
    <section class="screen" id="s-loading">
      <div class="loading">
        <div class="bowl">🥢</div>
        <div class="load-txt" id="loadTxt">正在翻你家冰箱…</div>
        <div class="load-bar"><i></i></div>
      </div>
    </section>

    <!-- 结果 -->
    <section class="screen" id="s-result">
      <div class="res-wrap">
        <div class="res-card">
          <div class="res-top">
            <div class="res-kicker">今天就吃这个</div>
            <div class="res-emoji" id="rEmoji">🍗</div>
            <div class="res-name" id="rName">黄焖鸡米饭</div>
            <div class="res-cat" id="rCat">米饭 · 一人食友好</div>
          </div>
          <div class="res-body">
            <p class="res-blurb" id="rBlurb"></p>
            <div class="res-meta" id="rMeta"></div>
            <div class="why">
              <div class="why-t">为什么是它</div>
              <ul id="rWhy"></ul>
            </div>
          </div>
          <div class="res-foot">
            <button class="btn-swap" id="swapBtn">换一个</button>
            <button class="btn-lock" id="lockBtn">就它了</button>
          </div>
          <div class="swap-note" id="swapNote"></div>
        </div>
        <div class="sub-acts">
          <button class="mini" id="shareBtn">生成分享卡</button>
          <button class="mini" id="restartBtn">重新选条件</button>
        </div>
      </div>
    </section>

    <!-- 记录 -->
    <section class="screen" id="s-rec">
      <div class="step-h">
        <h2>我的饭点记录</h2>
        <p>这些是它替你定过的答案。</p>
      </div>
      <div class="stat-row" id="recStats"></div>
      <div class="rec-list" id="recList"></div>
      <div class="step-foot">
        <button class="btn-ghost" id="recBack">返回</button>
        <button class="btn-go" id="recClear" style="background:#fff;color:#B9A695;box-shadow:none;border:1.8px solid var(--line)">清空记录</button>
      </div>
    </section>

  </div>

  <div class="foot">吃啥 · 一个专门治疗选择困难的小工具</div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-box">
    <div class="sheet-emoji" id="sheetEmoji">🎉</div>
    <h3 id="sheetTitle">定了！</h3>
    <p id="sheetDesc"></p>
    <button class="btn-lock" id="sheetBtn">好的，去吃</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════ 数据 ═══════════════
   s 辣度 0-3 | o 油腻 0-3 | cold 生冷 | shell 带壳/多骨 | p 人均
   sc 适合场景 | m 适合心情
*/
const DISHES = [
  // 米饭类
  {n:'黄焖鸡米饭',e:'🍗',c:'米饭',s:1,o:2,p:22,sc:['solo','duo'],m:['normal','starving'],b:'一个人吃饭的安全牌，鸡汁拌饭能吃两碗。'},
  {n:'煲仔饭',e:'🍚',c:'米饭',s:0,o:2,p:30,sc:['solo','duo'],m:['normal'],b:'锅巴才是灵魂，最后刮碗底那口最香。'},

const S = { step:0, scene:null, mood:null, avoid:[], excluded:[], cur:null, swaps:0, relaxed:false, whyNotes:[] };

/* ═══════════════ 视图切换 ═══════════════ */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  const el = $(id);
  el.classList.add('on');
  el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  window.scrollTo({top:0,behavior:'instant'});
}

/* ═══════════════ 步骤渲染 ═══════════════ */
const STEP_DEF = [
  {title:'几个人吃？', hint:'先定人数，能砍掉一半错误选项。', cfg:SCENES, key:'scene'},
  {title:'现在有多饿？', hint:'饿的程度决定要不要点硬菜。', cfg:MOODS, key:'mood'},
  {title:'有什么不吃的？', hint:'可以多选，也可以直接跳过。', cfg:AVOIDS, key:'avoid', multi:true},
];

function renderStep(){
  const d = STEP_DEF[S.step];
  $('stepTitle').textContent = d.title;
  $('stepHint').textContent = d.hint;
  document.querySelectorAll('.steps i').forEach((el,i)=>{
    el.className = i < S.step ? 'done' : (i === S.step ? 'on' : '');
  });

  const box = $('stepOpts');
  box.innerHTML = '';

  if (d.multi){
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    d.cfg.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'chip' + (S.avoid.includes(c.k)?' sel':'');
      b.innerHTML = `<span class="x">${c.e}</span>${c.t}`;
      b.onclick = ()=>{
        const i = S.avoid.indexOf(c.k);
        if (i > -1) S.avoid.splice(i,1); else S.avoid.push(c.k);
        b.classList.toggle('sel');
        $('stepNext').textContent = S.avoid.length ? '就按这个找' : '开始帮我找';
      };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  } else {
    d.cfg.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'opt' + (S[d.key]===c.k ? ' sel':'');
      b.innerHTML = `
        <span class="ico">${c.e}</span>
        <span class="tx"><b>${c.t}</b><span>${c.d}</span></span>
        <span class="tick">✓</span>`;
      b.onclick = ()=>{
        S[d.key] = c.k;
        box.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
        b.classList.add('sel');
        $('stepNext').disabled = false;
      };
      box.appendChild(b);
    });
  }

  $('stepBack').textContent = S.step === 0 ? '返回' : '上一步';
  $('stepNext').disabled = S.step === 2 ? false : !S[d.key];
  $('stepNext').textContent = S.step === 2 ? (S.avoid.length?'就按这个找':'开始帮我找') : '下一步';
  show('s-step');
}

$('startBtn').onclick = ()=>{ S.step = 0; S.scene = S.mood = null; S.avoid = []; renderStep(); };
$('restartBtn').onclick = ()=>{ S.step = 0; S.scene = S.mood = null; S.avoid = []; S.excluded = []; S.swaps = 0; renderStep(); };
$('stepBack').onclick = ()=>{ if (S.step === 0) show('s-intro'); else { S.step--; renderStep(); } };
$('stepNext').onclick = ()=>{
  if (S.step < 2){ S.step++; renderStep(); }
  else { startPick(); }
};

/* ═══════════════ 核心：挑选 ═══════════════ */
function pick(){
  S.relaxed = false;
  const inScene = d => d.sc.includes(S.scene);
  const passAvoid = d => {
    if (S.avoid.includes('辣') && d.s >= 2) return false;
    if (S.avoid.includes('油') && d.o >= 2) return false;
    if (S.avoid.includes('冷') && d.cold) return false;
    if (S.avoid.includes('壳') && d.shell) return false;
    if (S.avoid.includes('贵') && d.p > 45) return false;
    return true;
  };
  const notUsed = d => !S.excluded.includes(d.n);

  // 三层收敛：全条件 → 去掉心情 → 只保场景
  let tier1 = DISHES.filter(d => notUsed(d) && inScene(d) && passAvoid(d) && d.m.includes(S.mood));
  let tier2 = DISHES.filter(d => notUsed(d) && inScene(d) && passAvoid(d));
  let tier3 = DISHES.filter(d => notUsed(d) && inScene(d));
  let pool = tier1.length ? tier1 : (tier2.length ? tier2 : tier3);
  if (!tier1.length) S.relaxed = true;
  if (!pool.length){ S.excluded = []; pool = DISHES.filter(d => inScene(d)); S.relaxed = true; }

  // 加权
  const scored = pool.map(d=>{
    let w = 3;
    if (d.m.includes(S.mood)) w += 6;
    if (S.mood === 'starving' && d.p >= 26) w += 2;
    if (S.mood === 'starving' && d.s > 0) w += 1;
    if (S.mood === 'light' && d.o <= 1) w += 3;
    if (S.mood === 'treat' && d.p >= 45) w += 3;
    if (S.mood === 'treat' && d.o >= 2) w += 1;
    if (S.mood === 'normal' && d.o >= 3) w -= 1;
    return {d, w: Math.max(1, w)};
  });
  const total = scored.reduce((a,b)=>a+b.w, 0);
  let r = Math.random() * total;
  for (const it of scored){ r -= it.w; if (r <= 0) return it.d; }
  return scored[scored.length-1].d;
}

let loadTimer = null, finishTimer = null, textTimer = null;
function startPick(){
  show('s-loading');
  let i = 0;
  $('loadTxt').textContent = LOADS[0];
  $('loadTxt').style.opacity = 1;
  clearInterval(loadTimer);
  loadTimer = setInterval(()=>{
    i++;
    if (i < LOADS.length){
      $('loadTxt').style.opacity = 0;
      textTimer = setTimeout(()=>{ $('loadTxt').textContent = LOADS[i]; $('loadTxt').style.opacity = 1; }, 160);
    }
  }, 320);
  clearTimeout(finishTimer);
  finishTimer = setTimeout(()=>{
    clearInterval(loadTimer);
    S.swaps = 0;
    const d = pick();
    S.cur = d;
    renderResult(d);
    show('s-result');
  }, 1500);
}

/* ═══════════════ 结果渲染 ═══════════════ */
function renderResult(d){
  $('rEmoji').textContent = d.e;
  $('rName').textContent = d.n;
  $('rCat').textContent = `${d.c} · 人均 ¥${d.p} 左右`;

  const blurbs = {
    starving:'先吃上再说，别的都是后话。',
    light:'今天别为难自己的胃。',
    treat:'今天你值得一顿像样的。',
    normal:'不用多想，这个不会让你失望。'
  };
  $('rBlurb').textContent = d.b;

  const spicy = d.s === 0 ? '不辣' : '🌶'.repeat(d.s);
  $('rMeta').innerHTML = `
    <span class="mtag">${spicy}</span>
    <span class="mtag">💰 人均 ¥${d.p}</span>
    <span class="mtag">👥 ${SCENE_TXT[S.scene]}</span>
    ${d.shell?'<span class="mtag">🦴 要动手剥</span>':''}
    ${d.cold?'<span class="mtag">🧊 是凉的</span>':''}`;

  // 决策依据
  const list = [];
  list.push(`人数锁定在「${SCENE_TXT[S.scene]}」，不符合的 ${DISHES.length - DISHES.filter(x=>x.sc.includes(S.scene)).length} 道已经删掉了`);
  if (!S.relaxed && d.m.includes(S.mood)) list.push(`你选了「${MOOD_TXT[S.mood]}」，它的分量和口味正好对得上`);
  if (S.avoid.length === 0) list.push('你没设忌口，所以全品类都在候选里');
  else list.push(`避开了你不想吃的：${S.avoid.join('、')}`);
  if (d.p > 60) list.push('这顿偏贵，符合「犒劳自己」的定位');
  const whyEl = $('rWhy');
  whyEl.innerHTML = list.map(t=>`<li><i>✓</i><span>${t}</span></li>`).join('');
  if (S.relaxed){
    whyEl.insertAdjacentHTML('beforeend',
      `<li class="warn"><i>!</i><span>你的条件有点苛刻，我把范围放宽了一点</span></li>`);
  }

  // 换一个按钮状态
  const btn = $('swapBtn'), note = $('swapNote');
  const left = 5 - S.swaps;
  if (left <= 0){
    btn.disabled = true;
    btn.textContent = '不能再换了';
    note.innerHTML = '<b>已经换 5 次了。</b>今天就这么定吧，再挑下去饭就凉了。';
  } else {
    btn.disabled = false;
    btn.textContent = '换一个';
    if (S.swaps === 0) note.textContent = '';
    else if (S.swaps < 3) note.innerHTML = `已经换过 <b>${S.swaps}</b> 次了，可选范围正在变小。`;
    else note.innerHTML = `换了 <b>${S.swaps}</b> 次还没满意？说实话，第一个可能就挺好。`;
  }
}

$('swapBtn').onclick = ()=>{
  if (!S.cur) return;
  S.excluded.push(S.cur.n);
  S.swaps++;
  const d = pick();
  S.cur = d;
  const el = document.querySelector('.res-wrap');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  renderResult(d);
};

$('lockBtn').onclick = ()=>{
  const d = S.cur;
  if (!d) return;
  store.add({n:d.n, e:d.e, t:Date.now()});
  refreshCount();
  const recs = store.get();
  const monthCount = recs.filter(r=>new Date(r.t).getMonth()===new Date().getMonth() && new Date(r.t).getFullYear()===new Date().getFullYear()).length;
  $('sheetEmoji').textContent = '🎉';
  $('sheetTitle').textContent = '定了，就吃这个';
  $('sheetDesc').innerHTML = `已记下 <b>${d.n}</b><br>这是你本月第 ${monthCount} 次让它替你做决定。`;
  $('sheetBtn').textContent = '好，去吃';
  $('sheet').classList.add('on');
};
$('sheetBtn').onclick = ()=>{
  $('sheet').classList.remove('on');
  show('s-intro');
  renderPrev();
};

/* ═══════════════ 记录 ═══════════════ */
function refreshCount(){
  const n = store.get().length;
  $('recCount').textContent = n;
}
function renderPrev(){
  const recs = store.get();
  const slot = $('prevSlot');
  if (!recs.length){ slot.innerHTML = ''; return; }
  const r = recs[0];
  const diff = Date.now() - r.t;
  const txt = diff < 3600e3 ? Math.max(1,Math.round(diff/60e3))+' 分钟前'
            : diff < 86400e3 ? Math.round(diff/3600e3)+' 小时前'
            : Math.round(diff/86400e3)+' 天前';
  slot.innerHTML = `<div class="prev-card"><span class="e">${r.e}</span>
    上一次吃的是 <b>${r.n}</b><span class="ago">${txt}</span></div>`;
}
$('openRec').onclick = ()=>{
  const recs = store.get();
  const now = new Date();
  const month = recs.filter(r=>new Date(r.t).getMonth()===now.getMonth() && new Date(r.t).getFullYear()===now.getFullYear());
  const unique = new Set(month.map(r=>r.n)).size;
  $('recStats').innerHTML = `
    <div class="stat"><b>${month.length}</b><span>本月决定</span></div>
    <div class="stat"><b>${unique}</b><span>不同种类</span></div>
    <div class="stat"><b>${recs.length}</b><span>累计次数</span></div>`;
  if (!recs.length){
    $('recList').innerHTML = '<div class="empty">还没有记录。<br>先去让「吃啥」替你定一顿饭吧。</div>';
  } else {
    $('recList').innerHTML = recs.map(r=>{
      const dt = new Date(r.t);
      const s = `${dt.getMonth()+1}月${dt.getDate()}日 ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `<div class="rec-item"><span class="e">${r.e}</span><span class="n">${r.n}</span><span class="d">${s}</span></div>`;
    }).join('');
  }
  show('s-rec');
};
$('recBack').onclick = ()=>{ renderPrev(); show('s-intro'); };
$('recClear').onclick = ()=>{
  if (!store.get().length) return toast('本来就没有记录');
  store.clear(); refreshCount(); renderPrev();
  $('recStats').innerHTML = '';
  $('recList').innerHTML = '<div class="empty">记录清空了。<br>下一顿重新开始。</div>';
  toast('已清空记录');
};

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('on'), 1800);
}

/* ═══════════════ 分享卡（Canvas 导出） ═══════════════ */
function wrapText(ctx, text, x, y, maxW, lh){
  let line = '', lines = [];
  for (const ch of text){
    if (ctx.measureText(line + ch).width > maxW && line){ lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lh));
  return y + lines.length*lh;
}

$('shareBtn').onclick = ()=>{ toast('安装后可下载分享卡'); return;

  const d = S.cur;
  if (!d) return;
  const W = 680, H = 920, K = 2;
  const cv = document.createElement('canvas');
  cv.width = W*K; cv.height = H*K;
  const x = cv.getContext('2d');
  x.scale(K,K);

  // 背景
  x.fillStyle = '#FFF6EC'; x.fillRect(0,0,W,H);
  const g1 = x.createRadialGradient(80,-60,0,80,-60,520);
  g1.addColorStop(0,'rgba(255,201,64,.42)'); g1.addColorStop(1,'rgba(255,201,64,0)');
  x.fillStyle = g1; x.fillRect(0,0,W,H);
  const g2 = x.createRadialGradient(W-40,300,0,W-40,300,480);
  g2.addColorStop(0,'rgba(255,91,51,.22)'); g2.addColorStop(1,'rgba(255,91,51,0)');
  x.fillStyle = g2; x.fillRect(0,0,W,H);

  // 品牌
  x.fillStyle = '#B9A695';
  x.font = '700 15px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  x.textAlign = 'left';
  x.fillText('吃 啥 · JUST PICK ONE', 56, 78);
  x.textAlign = 'right';
  x.fillText(new Date().toLocaleDateString('zh-CN'), W-56, 78);

  // 主卡
  const cx = 56, cy = 118, cw = W-112, ch = 560;
  x.save();
  x.shadowColor = 'rgba(120,70,35,.16)'; x.shadowBlur = 44; x.shadowOffsetY = 18;
  x.fillStyle = '#fff';
  x.beginPath(); x.roundRect(cx, cy, cw, ch, 34); x.fill();
  x.restore();

  // 卡内头部暖色块
  x.save();
  x.beginPath(); x.roundRect(cx, cy, cw, 250, [34,34,0,0]); x.clip();
  const g3 = x.createLinearGradient(cx, cy, cx+cw, cy+250);
  g3.addColorStop(0,'#FFF2E4'); g3.addColorStop(1,'#FFD9C5');
  x.fillStyle = g3; x.fillRect(cx, cy, cw, 250);
  x.restore();

  // 小标签
  x.fillStyle = 'rgba(255,255,255,.9)';
  x.beginPath(); x.roundRect(cx+150, cy+34, 100, 34, 17); x.fill();
  x.fillStyle = '#FF5B33'; x.textAlign = 'center';
  x.font = '800 14px system-ui,"PingFang SC",sans-serif';
  x.fillText('今天就吃', cx+200, cy+56);

  // emoji
  x.textAlign = 'center';
  x.font = '84px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
  x.fillText(d.e, cx+cw/2, cy+150);

  // 菜名
  x.fillStyle = '#2B1D14';
  x.font = '900 40px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  x.fillText(d.n, cx+cw/2, cy+215);

  // 正文
  x.textAlign = 'left';
  x.fillStyle = '#4A3529';
  x.font = '600 20px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  let ty = wrapText(x, d.b, cx+40, cy+310, cw-80, 34) + 26;

  // 分隔线
  x.strokeStyle = '#F1E4D6'; x.lineWidth = 2;
  x.beginPath(); x.setLineDash([6,8]); x.moveTo(cx+40, ty-6); x.lineTo(cx+cw-40, ty-6); x.stroke();
  x.setLineDash([]);

  // 依据
  const reasons = [
    `适合「${SCENE_TXT[S.scene]}」，人均 ¥${d.p} 左右`,
    `口味：${d.s===0?'不辣':'辣度 '+d.s+'/3'} · ${d.o>=3?'偏油':'清爽度尚可'}`,
    S.avoid.length ? `已避开：${S.avoid.join('、')}` : '没有忌口，全品类可选'
  ];
  x.font = '600 17px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  reasons.forEach((r,i)=>{
    x.fillStyle = '#22B07D';
    x.fillText('✓', cx+42, ty+26+i*38);
    x.fillStyle = '#6B5546';
    x.fillText(r, cx+70, ty+26+i*38);
  });

  // 底部
  x.textAlign = 'center';
  x.fillStyle = '#CBB8A6';
  x.font = '700 15px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  x.fillText('别再纠结了，就它了。', W/2, H-64);
  x.fillStyle = '#E0CFBE';
  x.font = '600 13px system-ui,"PingFang SC",sans-serif';
  x.fillText('— 由「吃啥」替你决定 —', W/2, H-38);

  cv.toBlob(b=>{
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url;
    a.download = `今天吃_${d.n}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('分享卡已保存到下载文件夹');
  }, 'image/png');
};

/* ═══════════════ 初始化 ═══════════════ */
refreshCount();
renderPrev();
document.getElementById("resetPreview").onclick=()=>{clearInterval(loadTimer); clearTimeout(finishTimer); clearTimeout(textTimer); previewRecords=[]; Object.assign(S,{step:0,scene:null,mood:null,avoid:[],excluded:[],cur:null,swaps:0,relaxed:false,whyNotes:[]}); document.querySelectorAll(".on").forEach(el=>{if(!el.classList.contains("screen")) el.classList.remove("on")}); refreshCount(); renderPrev(); show("s-intro");};
</script>
