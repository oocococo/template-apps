<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;

  background: #f6f4ee;

  font-size: 14px;
  line-height: 1.6;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 40px;
  min-height: 100%;
}

/* 容器内运行时：让出顶部状态栏 + 返回/分享按钮，底部让出 home 指示条 */
body.in-container .app {
  padding-top: 84px;
  /* 刘海屏再叠安全区（旧内核不认识 calc/env 时自动退回上面的固定值） */
  padding-top: calc(56px + env(safe-area-inset-top));
  padding-bottom: 52px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
}

.view { display: none; }
.view.is-active { display: block; }

[hidden] { display: none !important; }

/* ===== 顶栏 ===== */
.hero {
  position: relative;
  padding: 26px 18px;
  border-radius: 18px;
  background: #14532d;
  background: -webkit-linear-gradient(135deg, #14532d 0%, #1f6f4a 55%, #2e8b5f 100%);
  background: linear-gradient(135deg, #14532d 0%, #1f6f4a 55%, #2e8b5f 100%);
  color: #fff;
  box-shadow: 0 8px 20px rgba(31, 111, 74, 0.28);
  overflow: hidden;
}

/* 放在内容流里，避开容器右上角的分享 / 更多按钮 */
.hero-actions {
  display: -webkit-box;
  display: flex;
  -webkit-box-pack: end;
  justify-content: flex-end;
  margin-top: 12px;
}

/* 与 .hero-badge 完全同规格 */
.hero-entry {
  display: -webkit-inline-box;
  display: inline-flex;
  -webkit-box-align: center;
  align-items: center;
  padding: 3px 10px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  font-size: 11px;
  letter-spacing: 2px;
  line-height: 1.6;
  font-family: inherit;
}

.hero-entry.has-tip {
  background: rgba(255, 255, 255, 0.3);
  -webkit-animation: ringPulse 1.6s ease-in-out infinite;
  animation: ringPulse 1.6s ease-in-out infinite;
}

@-webkit-keyframes ringPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.55); }
  60% { box-shadow: 0 0 0 9px rgba(255, 255, 255, 0); }
}

@keyframes ringPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.55); }
  60% { box-shadow: 0 0 0 9px rgba(255, 255, 255, 0); }
}

.tip-hand {
  margin-right: 4px;
  font-size: 14px;
  line-height: 1;
  -webkit-animation: tapNudge 1.3s ease-in-out infinite;
  animation: tapNudge 1.3s ease-in-out infinite;
}

@-webkit-keyframes tapNudge {
  0%, 100% { -webkit-transform: translateX(-2px) rotate(-6deg); transform: translateX(-2px) rotate(-6deg); }
  50% { -webkit-transform: translateX(2px) rotate(-6deg); transform: translateX(2px) rotate(-6deg); }
}

@keyframes tapNudge {
  0%, 100% { -webkit-transform: translateX(-2px) rotate(-6deg); transform: translateX(-2px) rotate(-6deg); }
  50% { -webkit-transform: translateX(2px) rotate(-6deg); transform: translateX(2px) rotate(-6deg); }
}

.dot {
  min-width: 16px;
  height: 16px;
  margin-left: 5px;
  padding: 0 4px;
  border-radius: 999px;
  background: #ff4d4f;
  color: #fff;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  font-weight: 700;
}

.hero-brand {

  display: flex;
  -webkit-box-align: center;
  align-items: center;
}

.hero-logo {

}

.hero-badge {

  letter-spacing: 2px;

}

}

.photo-remove {

(function (global) {
  'use strict';

  var RECORDS_KEY = 'bon_records_v1';
  var REMINDERS_KEY = 'bon_reminders_v1';
  var FLAGS_KEY = 'bon_flags_v1';
  var memory = {};
  function setRaw(key,value){ memory[key]=value; return Promise.resolve(true); }
  function getRaw(key){ return Promise.resolve(memory[key] || ''); }
  window.resetDemoStorage=function(){ memory={}; };

  function parseList(raw) {
    if (!raw) return [];
    try {
      var value = JSON.parse(raw);
      return Object.prototype.toString.call(value) === '[object Array]' ? value : [];
    } catch (e) {
      return [];
    }
  }

  function genId() {
    return 'id_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
  }

  function loadRecords() {
    return getRaw(RECORDS_KEY).then(parseList);
  }

  function saveRecords(list) {
    return setRaw(RECORDS_KEY, JSON.stringify(list));
  }

  function addRecord(record) {
    return loadRecords().then(function (list) {
      var item = Object.assign({ id: genId(), bought: null, thumb: '' }, record);
      list.unshift(item);
      return saveRecords(list).then(function () { return item; });
    });
  }

  function updateRecord(id, patch) {
    return loadRecords().then(function (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
          list[i] = Object.assign({}, list[i], patch);
          break;
        }
      }
      return saveRecords(list);
    });
  }

  function removeRecord(id) {
    return loadRecords().then(function (list) {
      var next = list.filter(function (r) { return r.id !== id; });
      return saveRecords(next);
    });
  }

  function loadReminders() {
    return getRaw(REMINDERS_KEY).then(parseList);
  }

  function saveReminders(list) {
    return setRaw(REMINDERS_KEY, JSON.stringify(list));
  }

  function addReminder(reminder) {
    return loadReminders().then(function (list) {
      var item = Object.assign({ id: genId(), status: 'active', seen: false }, reminder);
      list.unshift(item);
      return saveReminders(list).then(function () { return item; });
    });
  }

  function updateReminder(id, patch) {
    return loadReminders().then(function (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
          list[i] = Object.assign({}, list[i], patch);
          break;
        }
      }
      return saveReminders(list);
    });
  }

  function removeReminder(id) {
    return loadReminders().then(function (list) {
      return saveReminders(list.filter(function (r) { return r.id !== id; }));
    });
  }

  /* 「下次不显示」的提醒在次日恢复；返回最新列表 */
  function reviveSnoozed() {
    var now = Date.now();
    return loadReminders().then(function (list) {
      var changed = false;
      list.forEach(function (r) {
        if (r.status === 'snoozed' && r.snoozeUntil && r.snoozeUntil <= now) {
          r.status = 'active';
          changed = true;
        }
      });
      if (!changed) return list;
      return saveReminders(list).then(function () { return list; });
    });
  }

  function dueBanners() {
    return reviveSnoozed().then(function (list) {
      var now = Date.now();
      return list.filter(function (r) {
        return r.dueTs <= now && r.status === 'active';
      });
    });
  }

  function unreadCount() {
    return reviveSnoozed().then(function (list) {
      var now = Date.now();
      return list.filter(function (r) {
        return r.dueTs <= now && !r.seen && r.status !== 'dismissed';
      }).length;
    });
  }

  function loadFlags() {
    return getRaw(FLAGS_KEY).then(function (raw) {
      if (!raw) return {};
      try {
        var value = JSON.parse(raw);
        return value && typeof value === 'object' ? value : {};
      } catch (e) {
        return {};
      }
    });
  }

  function getFlag(name) {
    return loadFlags().then(function (flags) { return !!flags[name]; });
  }

  function setFlag(name) {
    return loadFlags().then(function (flags) {
      flags[name] = true;
      return setRaw(FLAGS_KEY, JSON.stringify(flags));
    });
  }

  function nextDayStart() {
    var d = new Date();
    d.setHours(24, 0, 0, 0);
    return d.getTime();
  }

  global.BonStore = {
    loadRecords: loadRecords,
    addRecord: addRecord,
    updateRecord: updateRecord,
    removeRecord: removeRecord,
    loadReminders: loadReminders,
    addReminder: addReminder,
    updateReminder: updateReminder,
    removeReminder: removeReminder,
    reviveSnoozed: reviveSnoozed,
    dueBanners: dueBanners,
    unreadCount: unreadCount,
    getFlag: getFlag,
    setFlag: setFlag,
    nextDayStart: nextDayStart,
  };
})(window);

/* 判断引擎：本机购买判断规则 */
(function (global) {
  'use strict';

  var FREQ_OPTIONS = [
    { key: 'daily', label: '几乎每天', perYear: 250 },
    { key: 'weekly', label: '每周一两次', perYear: 72 },
    { key: 'monthly', label: '每月几次', perYear: 12 },
    { key: 'rare', label: '很少用', perYear: 2 }
  ];

  var TAG_OPTIONS = ['自己用', '送人', '孩子想要', '囤货/优惠'];

  function yuan(value) {
    var rounded = Math.round(value * 10) / 10;
    var text = rounded >= 100 ? String(Math.round(rounded)) : String(rounded);
    return text.replace(/\.0$/, '');
  }

  function freqOf(key) {
    for (var i = 0; i < FREQ_OPTIONS.length; i++) {
      if (FREQ_OPTIONS[i].key === key) return FREQ_OPTIONS[i];
    }
    return FREQ_OPTIONS[2];
  }

  function looksPrepaid(name) {
    return /卡|会员|充值|储值|年费|套餐/.test(name);
  }

  function looksDurable(name) {
    return /机|器|表|屏|脑|耳|相机|电|锅|椅|床|柜/.test(name);
  }

  /* 本机规则：按「价格 ÷ 预期年使用次数」算单次成本 */
  function judgeLocal(input) {
    var name = input.name;
    var price = input.price;
    var freq = freqOf(input.freqKey);
    var tags = input.tags || [];
    var perYear = freq.perYear;
    var unitCost = perYear > 0 ? price / perYear : price;
    var threeYearUnit = perYear > 0 ? price / (perYear * 3) : price;

    var verdict = '值得买';
    var verdictClass = 'buy';
    var coolingDays = 0;
    var reason = '';

    if (tags.indexOf('孩子想要') !== -1 && price >= 300) {
      verdict = '缓一缓';
      verdictClass = 'hold';
      coolingDays = 7;
      reason = '孩子想要的玩具或用品，先隔一周再看还想不想要，成功率往往不低。';
    }

    if (input.hasSimilar) {
      verdict = '不买';
      verdictClass = 'skip';
      coolingDays = 0;
      reason = '家里已有类似的东西，再买一件多半是在解决收纳问题，不是解决问题。';
    } else if (verdict !== '不买') {
      if (perYear <= 2 && price >= 200) {
        verdict = '不买';
        verdictClass = 'skip';
        coolingDays = 0;
        reason = '一年用不到三次的东西，买的其实是「想象中的自己」。';
      } else if (price >= 3000) {
        verdict = '缓一缓';
        verdictClass = 'hold';
        coolingDays = 14;
        reason = '这是大额支出，按经验至少放两周：两周后还想要，且能说清具体用途，再买不迟。';
      } else if (unitCost > 80) {
        verdict = '缓一缓';
        verdictClass = 'hold';
        coolingDays = 7;
        reason = '摊到每次的成本偏高，先把使用场景想具体，再决定要不要花这笔钱。';
      } else if (price >= 500) {
        verdict = '缓一缓';
        verdictClass = 'hold';
        coolingDays = 7;
        reason = '五百元以上的非必需品，隔一周再看，能挡掉相当一部分冲动。';
      } else if (!reason) {
        reason = '单价不高、用得也不算少，这类钱花得比较值。';
      }
    }

    var sections = [];

    sections.push({
      title: '一句话',
      text: reason
    });

    sections.push({
      title: '这笔账',
      text: '总价 ¥' + yuan(price) + '；按「' + freq.label + '」算，一年约 ' + perYear + ' 次，' +
        '单次成本 ¥' + yuan(unitCost) + '；用满三年，单次降到 ¥' + yuan(threeYearUnit) + '。' +
        '另外还要算上比价、收纳和占地方的心思。'
    });

    var pitText;
    if (looksPrepaid(name)) {
      pitText = '预付类（卡/会员/套餐）依法应有书面合同，写清有效期、退款和转让规则；没写清就别充，充了也别充太大额。';
    } else if (looksDurable(name)) {
      pitText = '这个价位常见「划线价」套路，先记住日常价再看折扣；延保一般不划算，三包已覆盖的部分别重复买。';
    } else {
      pitText = '暂无明显风险，留意退换货规则和是否真的会用起来。';
    }
    if (tags.indexOf('囤货/优惠') !== -1) {
      pitText += '「囤货/优惠」最容易把预算变成库存，先算清楚用不用的完。';
    }
    sections.push({ title: '有没有坑', text: pitText });

    sections.push({
      title: '证据等级',
      text: 'C —— 这是本机固定规则按「价格 ÷ 预期年使用次数」算出来的，没有联网比价，也没有你所在城市的实际价格数据。'
    });

    var flipPerYear = perYear > 0 ? perYear : 1;
    sections.push({
      title: '什么情况会反转',
      text: '如果你实际每年用到 ' + Math.ceil(flipPerYear * 1.5) + ' 次以上，单次成本会降到 ¥' +
        yuan(price / (flipPerYear * 1.5)) + '，结论就往「值得买」走；反过来，买回来一周用不到一次，结论就变成「不买」。'
    });

    return {
      name: name,
      verdict: verdict,
      verdictClass: verdictClass,
      coolingDays: coolingDays,
      sections: sections,
      source: 'local'
    };
  }

  global.BonEngine = { FREQ_OPTIONS: FREQ_OPTIONS, TAG_OPTIONS: TAG_OPTIONS, judgeLocal: judgeLocal, judge: function(input) { return Promise.resolve(judgeLocal(input)); } };
})(window);

          name: record.name,
          days: result.coolingDays,
          dueTs: Date.now() + result.coolingDays * 24 * 60 * 60 * 1000,
          text: result.coolingDays + ' 天前你在考虑「' + record.name + '」，冷静期到了——现在还想买吗？'
        }).then(function () {
          alert('已记下 ' + result.coolingDays + ' 天冷静期，到期会在首页提醒你');
          refreshHome();
        });
      } else {
        refreshHome();
      }
    });
  }

  /* ---------- 首页提醒与红点 ---------- */
  function refreshHome() {
    return Store.dueBanners().then(function (list) {
      el.bannerList.innerHTML = '';
      list.forEach(function (item) {
        el.bannerList.appendChild(renderBanner(item));
      });
      return Promise.all([Store.unreadCount(), Store.loadRecords(), Store.getFlag('recordsTipSeen')]);
    }).then(function (res) {
      var count = res[0];
      if (count > 0) {
        el.dot.hidden = false;
        el.dot.textContent = count > 99 ? '99+' : String(count);
      } else {
        el.dot.hidden = true;
      }

      /* 小手引导：有过查询记录、但还没点开过「我的记录」时才出现 */
      var hasRecords = res[1].length > 0;
      var tipSeen = res[2];
      var showTip = hasRecords && !tipSeen;
      el.tipHand.hidden = !showTip;
      el.btnRecords.className = showTip ? 'hero-entry has-tip' : 'hero-entry';
    });
  }

  function renderBanner(item) {
    var wrap = document.createElement('div');
    wrap.className = 'banner';

    var tag = document.createElement('div');
    tag.className = 'banner-tag';
    tag.textContent = '冷静期到了';

    var text = document.createElement('div');
    text.className = 'banner-text';
    text.textContent = item.text;

    var actions = document.createElement('div');
    actions.className = 'banner-actions';

    var snooze = document.createElement('button');
    snooze.type = 'button';
    snooze.className = 'mini-btn';
    snooze.textContent = '下次不显示';
    snooze.addEventListener('click', function () {
      Store.updateReminder(item.id, {
        status: 'snoozed',
        snoozeUntil: Store.nextDayStart()
      }).then(refreshHome);
    });

    var dismiss = document.createElement('button');
    dismiss.type = 'button';
    dismiss.className = 'mini-btn is-strong';
    dismiss.textContent = '不再提醒';
    dismiss.addEventListener('click', function () {
      Store.updateReminder(item.id, { status: 'dismissed', seen: true }).then(refreshHome);
    });

    actions.appendChild(snooze);
    actions.appendChild(dismiss);

    wrap.appendChild(tag);
    wrap.appendChild(text);
    wrap.appendChild(actions);
    return wrap;
  }

  /* ---------- 记录页 ---------- */
  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function formatDate(ts) {
    var d = new Date(ts);
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function openRecords() {
    var now = Date.now();

    Store.reviveSnoozed().then(function (list) {
      var pending = list.filter(function (r) {
        return r.dueTs <= now && !r.seen && r.status !== 'dismissed';
      });
      var chain = Promise.resolve();
      pending.forEach(function (r) {
        chain = chain.then(function () {
          return Store.updateReminder(r.id, { seen: true });
        });
      });
      return chain;
    }).then(function () {
      return Promise.all([Store.loadReminders(), Store.loadRecords()]);
    }).then(function (res) {
      renderReminders(res[0], now);
      renderRecords(res[1]);
      showView('records');
      return Store.setFlag('recordsTipSeen');
    }).then(function () {
      refreshHome();
    });
  }

  function renderReminders(list, now) {
    var visible = list.filter(function (r) { return r.status !== 'dismissed'; });
    el.reminderList.innerHTML = '';
    if (visible.length === 0) {
      el.reminderBlock.hidden = true;
      return;
    }
    el.reminderBlock.hidden = false;

    visible.forEach(function (item) {
      var wrap = document.createElement('div');
      wrap.className = 'reminder';

      var head = document.createElement('div');
      head.className = 'reminder-head';

      var name = document.createElement('div');
      name.className = 'reminder-name';
      name.textContent = item.name;

      var due = document.createElement('div');
      due.className = 'reminder-due' + (item.dueTs <= now ? ' is-on' : '');
      due.textContent = item.dueTs <= now ? '已到期' : formatDate(item.dueTs) + ' 到期';

      head.appendChild(name);
      head.appendChild(due);

      var text = document.createElement('div');
      text.className = 'reminder-text';
      text.textContent = item.text;

      var actions = document.createElement('div');
      actions.className = 'banner-actions';

      var dismiss = document.createElement('button');
      dismiss.type = 'button';
      dismiss.className = 'mini-btn is-strong';
      dismiss.textContent = '不再提醒';
      dismiss.addEventListener('click', function () {
        Store.updateReminder(item.id, { status: 'dismissed', seen: true }).then(openRecords);
      });
      actions.appendChild(dismiss);

      wrap.appendChild(head);
      wrap.appendChild(text);
      wrap.appendChild(actions);
      el.reminderList.appendChild(wrap);
    });
  }

  function renderRecords(list) {
    el.recordsBody.innerHTML = '';

    var bought = 0;
    var skip = 0;
    var saved = 0;

    list.forEach(function (record) {
      var price = parseFloat(record.price);
      if (isNaN(price)) price = 0;
      if (record.bought === true) bought += 1;
      if (record.bought === false) {
        skip += 1;
        saved += price;
      }
    });

    el.sumTotal.textContent = String(list.length);
    el.sumBought.textContent = String(bought);
    el.sumSkip.textContent = String(skip);
    el.sumSaved.textContent = '¥' + String(Math.round(saved));

    if (list.length === 0) {
      el.recordsTable.hidden = true;
      el.recordsEmpty.hidden = false;
      return;
    }

    el.recordsTable.hidden = false;
    el.recordsEmpty.hidden = true;

    list.forEach(function (record) {
      el.recordsBody.appendChild(renderRecordRow(record));
    });
  }

  function renderRecordRow(record) {
    var row = document.createElement('div');
    row.className = 'tr';

    var tdName = document.createElement('div');
    tdName.className = 'td td-name';

    var nameRow = document.createElement('div');
    nameRow.className = 'name-row';

    if (record.thumb) {
      var img = document.createElement('img');
      img.className = 'thumb';
      img.src = record.thumb;
      img.alt = '';
      nameRow.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'thumb thumb-empty';
      ph.textContent = '?';
      nameRow.appendChild(ph);
    }

    var col = document.createElement('div');
    col.className = 'name-col';

    var nameText = document.createElement('div');
    nameText.className = 'name-text';
    nameText.textContent = record.name;

    var meta = document.createElement('div');
    meta.className = 'name-meta';
    meta.textContent = formatDate(record.ts) + (record.price ? ' · ¥' + record.price : '');

    col.appendChild(nameText);
    col.appendChild(meta);
    nameRow.appendChild(col);
    tdName.appendChild(nameRow);

    var tdVerdict = document.createElement('div');
    tdVerdict.className = 'td td-verdict';
    var pill = document.createElement('span');
    var cls = 'pill';
    if (record.verdictClass === 'buy') cls += ' is-buy';
    else if (record.verdictClass === 'skip') cls += ' is-skip';
    else cls += ' is-hold';
    pill.className = cls;
    pill.textContent = record.verdict;
    tdVerdict.appendChild(pill);

    var tdBought = document.createElement('div');
    tdBought.className = 'td td-bought';
    var btns = document.createElement('div');
    btns.className = 'buy-btns';

    var yes = document.createElement('button');
    yes.type = 'button';
    yes.className = 'buy-btn' + (record.bought === true ? ' is-yes' : '');
    yes.textContent = '买了';
    yes.addEventListener('click', function () {
      var next = record.bought === true ? null : true;
      Store.updateRecord(record.id, { bought: next }).then(openRecords);
    });

    var no = document.createElement('button');
    no.type = 'button';
    no.className = 'buy-btn' + (record.bought === false ? ' is-no' : '');
    no.textContent = '没买';
    no.addEventListener('click', function () {
      var next = record.bought === false ? null : false;
      Store.updateRecord(record.id, { bought: next }).then(openRecords);
    });

    btns.appendChild(yes);
    btns.appendChild(no);
    tdBought.appendChild(btns);

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'tr-del';
    del.textContent = '×';
    del.addEventListener('click', function () {
      if (!confirm('删掉「' + record.name + '」这条记录？相关提醒也会一并清掉。')) return;
      Store.removeRecord(record.id).then(function () {
        return Store.loadReminders();
      }).then(function (reminders) {
        var chain = Promise.resolve();
        reminders.forEach(function (r) {
          if (r.recordId === record.id) {
            chain = chain.then(function () { return Store.removeReminder(r.id); });
          }
        });
        return chain;
      }).then(openRecords);
    });

    row.appendChild(tdName);
    row.appendChild(tdVerdict);
    row.appendChild(tdBought);
    row.appendChild(del);
    return row;
  }

  /* ---------- 事件绑定 ---------- */
  function bind() {
    el.btnAnalyze.addEventListener('click', analyze);

    $('btn-records').addEventListener('click', openRecords);
    $('btn-to-records').addEventListener('click', openRecords);
    $('btn-home').addEventListener('click', function () { showView('home'); });
    $('btn-empty-back').addEventListener('click', function () { showView('home'); });

    $('btn-again').addEventListener('click', function () {
      state.name = '';
      state.price = 0;
      state.tags = [];
      state.hasSimilar = false;
      state.thumb = '';
      el.name.value = '';
      el.price.value = '';
      el.similar.checked = false;
      clearPhoto();
      buildTagChips();
      showView('home');
      refreshHome();
    });

    el.photoInput.addEventListener('change', function (e) {
      var files = e.target.files;
      if (files && files[0]) handlePhoto(files[0]);
    });

    $('btn-remove-photo').addEventListener('click', function (e) {
      e.preventDefault();
      clearPhoto();
    });

  }

  function init() {
    cache();
    buildChips();
    buildTagChips();
    bind();
    refreshHome();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);
</script><script>document.getElementById("demo-reset").onclick=function(){window.resetDemoStorage(); document.getElementById("btn-again").click()};</script></body></html>
