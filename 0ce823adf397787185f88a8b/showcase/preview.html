<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>薄肌笔记 · 冰箱里有什么，就吃什么</title>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --line:#e3e7e5; --ink:#1b2422; --ink2:#5d6b67; --ink3:#93a19d;
  --brand:#2f6f52; --brand-l:#e6f1eb; --warn:#c9762a; --bad:#c0453d;
  --pro:#2f6f52; --kcal:#c9762a; --fat:#7b62b8; --carb:#3f7fa8; --fiber:#6b8e3d;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:64px;
}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}

/* ---------- 引导 ---------- */
.onboard{max-width:560px;margin:0 auto;padding:26px 18px 40px}
.ob-logo{font-size:29px;font-weight:800;letter-spacing:-.5px;margin:4px 0 4px}
.ob-logo span{color:var(--brand)}
.ob-sub{color:var(--ink2);font-size:13.5px;margin-bottom:20px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:3px;border-radius:2px;background:#dfe5e2;font-style:normal}
.steps i.on{background:var(--brand)}
.ob-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:13px}
.ob-panel h3{margin:0 0 13px;font-size:15px;font-weight:800}
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.field input,.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fbfcfb;font-size:15px;outline:none
}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:7px}
.seg button{
  flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;
  font-size:13.5px;color:var(--ink2)
}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn{
  width:100%;padding:14px;border-radius:12px;background:var(--brand);color:#fff;
  font-size:16px;font-weight:700
}
.btn:active{opacity:.86}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.sm{padding:11px;font-size:14px}

/* 预估卡 */
.forecast{background:linear-gradient(160deg,#2f6f52,#255840);border-radius:var(--r);padding:17px;color:#fff;margin:14px 0}
.fc-t{font-size:12.5px;opacity:.82;margin-bottom:6px}
.fc-big{font-size:27px;font-weight:800;letter-spacing:-.8px;line-height:1.2}
.fc-big em{font-style:normal;font-size:14px;font-weight:600;opacity:.88}
.fc-note{font-size:12px;opacity:.85;margin-top:7px;line-height:1.6}
.fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.fc-cell{background:rgba(255,255,255,.15);border-radius:9px;padding:9px 10px}
.fc-cell b{display:block;font-size:15px}
.fc-cell span{font-size:10.5px;opacity:.85}
/* 速度三档 */
.pace-list{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.pace{
  display:flex;align-items:center;gap:10px;padding:12px 13px;border:1.5px solid var(--line);
  border-radius:11px;background:#fbfcfb;text-align:left;transition:.15s
}
.pace.on{border-color:var(--brand);background:var(--brand-l)}
.pace .pc-l{flex:1;min-width:0}
.pace .pc-l b{font-size:14px;display:block;line-height:1.3}
.pace .pc-l b em{font-style:normal;font-size:11px;color:var(--ink3);font-weight:600;margin-left:5px}
.pace .pc-l span{font-size:11.5px;color:var(--ink2);display:block;margin-top:2px}
.pace .pc-r{text-align:right;flex:none}
.pace .pc-r b{font-size:14px;color:var(--brand);display:block;line-height:1.3}
.pace .pc-r span{font-size:11px;color:var(--ink3)}
.pace .pc-chk{width:18px;height:18px;border-radius:50%;border:1.5px solid #cfd6d3;flex:none;display:grid;place-items:center;font-size:11px;color:transparent}
.pace.on .pc-chk{background:var(--brand);border-color:var(--brand);color:#fff}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pv-item{background:var(--brand-l);border-radius:9px;padding:9px 11px}
.pv-item b{display:block;font-size:19px;letter-spacing:-.5px;color:var(--brand)}
.pv-item span{font-size:11px;color:var(--ink3)}

/* 动作选择 */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{
  border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;background:#fbfcfb;
  text-align:left;transition:.15s
}
.ex.on{border-color:var(--brand);background:var(--brand-l)}
.ex .en{font-size:13.5px;font-weight:700;line-height:1.3}
.ex .ep{font-size:11px;color:var(--ink3);margin-top:2px}
.ex .es{font-size:11px;color:var(--ink2);margin-top:4px}
.extabs{display:flex;gap:7px;margin-bottom:4px}
.extabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fbfcfb;font-size:13.5px;color:var(--ink2)}
.extabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.ex .eb{font-size:10.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
.selbar{
  position:sticky;bottom:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:12px;
  display:flex;align-items:center;justify-content:space-between;font-size:13px
}
.selbar b{color:var(--brand);font-size:15px}

/* 冰箱录入 */
.mini-form{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:8px}
.mini-form input,.mini-form select{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfcfb;font-size:14px}
.mini-form button{padding:10px;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  background:#eef2f0;border-radius:20px;padding:6px 11px;font-size:12px;color:var(--ink2);
  display:flex;align-items:center;gap:6px
}
.chip b{color:var(--ink);font-weight:700}
.chip button{color:var(--ink3);font-size:14px;line-height:1}

/* ---------- 应用 ---------- */
header{
  position:sticky;top:0;z-index:20;background:rgba(244,246,245,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 16px 9px
}
.hd-top{display:flex;align-items:baseline;justify-content:space-between}
.hd-top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
.hd-top h1 span{color:var(--brand)}
.hd-date{font-size:11.5px;color:var(--ink3)}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h2{margin:0;font-size:14px;font-weight:800}
.card-h .sub{font-size:11.5px;color:var(--ink3)}
.hint{font-size:12px;color:var(--ink3);line-height:1.65}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fbfcfb;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.stat span{font-size:11px;color:var(--ink3)}
.bar{margin-bottom:11px}
.bar:last-child{margin-bottom:0}
.bar-t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.bar-t b{font-size:12.5px;font-weight:700}
.bar-t span{color:var(--ink3)}
.track{height:7px;border-radius:4px;background:#eef1ef;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .35s ease}
.fill.p{background:var(--pro)} .fill.k{background:var(--kcal)}
.fill.f{background:var(--fat)} .fill.c{background:var(--carb)} .fill.fb{background:var(--fiber)}
.fill.over{background:var(--bad)}

/* 餐单 */
.meal{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;background:#fbfcfb}
.meal:last-child{margin-bottom:0}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.meal-h b{font-size:13.5px}
.meal-h span{font-size:11.5px;color:var(--ink3)}
.meal li{font-size:13px;margin:0 0 5px;padding-left:2px;list-style:none;color:var(--ink)}
.meal li em{font-style:normal;color:var(--ink3);font-size:11.5px}
.meal ul{margin:0;padding:0}
.meal .sum{font-size:11.5px;color:var(--brand);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:600}

/* 食材网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.food{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fbfcfb;position:relative}
.food.out{opacity:.45}
.food .fn{font-size:13.5px;font-weight:700;margin-bottom:3px;line-height:1.25}
.food .fm{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.food .fp{font-size:11px;color:var(--ink2);margin-bottom:8px;line-height:1.4}
.egrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:baseline}
.egrow:last-of-type{border-bottom:0}
.egrow b{flex:none;width:60px;font-size:13px}
.egrow span{color:var(--ink2);line-height:1.6}
.egrow em{font-style:normal;color:var(--brand);font-weight:700}
.fhead{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px}
.stock{text-align:center;flex:1;line-height:1.1}
.stock b{font-size:19px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
.stock span{font-size:9.5px;color:var(--ink3);margin-left:2px;display:block}
.stockrow{display:flex;align-items:center;gap:6px;margin-top:9px}
.stockrow button{width:34px;height:32px;border-radius:9px;background:var(--brand-l);color:var(--brand);font-size:16px;font-weight:700;flex:none}
.stockrow button:last-child{background:#f1f4f2;color:var(--ink2)}
.stockrow button:active{opacity:.75}
.editbtn{width:100%;margin-top:7px;padding:5px 0;border-radius:8px;background:#f7f9f8;color:var(--ink3);font-size:11px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:280px;overflow-y:auto}
.qitem{border:1px solid var(--line);border-radius:10px;padding:13px 12px;background:#fbfcfb;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.qitem .qc{width:24px;height:24px;border-radius:50%;background:#eef2f0;color:var(--ink2);display:grid;place-items:center;font-size:13px;font-weight:700}
.qitem.on{border-color:var(--brand);background:var(--brand-l)}
.qitem.on .qc{background:var(--brand);color:#fff}
.waterbtns{display:flex;gap:7px;margin-top:11px}
.waterbtns button{flex:1;padding:9px 0;border-radius:9px;background:var(--brand-l);color:var(--brand);font-size:13px;font-weight:700}
.waterbtns button.minus{background:#f1f4f2;color:var(--ink2);flex:none;width:44px}
.food .fa{display:flex;gap:6px}
.food .fa button{flex:1;padding:7px 0;border-radius:8px;background:var(--brand-l);color:var(--brand);font-size:12.5px;font-weight:700}
.food .fa button.sec{background:#f1f4f2;color:var(--ink2);flex:none;width:34px}
.tag-cat{position:absolute;top:9px;right:9px;font-size:9.5px;color:var(--ink3)}

.logitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.logitem:last-child{border-bottom:0}
.logitem .ln{flex:1;font-size:13px;min-width:0}
.logitem .ln em{font-style:normal;color:var(--ink3);font-size:11.5px;display:block}
.logitem .lk{font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.logitem .del{color:var(--ink3);font-size:16px;padding:0 2px}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:20px 10px;line-height:1.7}

.exrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.exrow:last-child{border-bottom:0}
.chk{width:23px;height:23px;border-radius:7px;border:1.5px solid #cfd6d3;flex:none;display:grid;place-items:center;font-size:13px;color:transparent;background:#fff}
.chk.on{background:var(--brand);border-color:var(--brand);color:#fff}
.exrow .exn{flex:1;font-size:13.5px}
.exrow .exn em{font-style:normal;display:block;font-size:11.5px;color:var(--ink3)}
.exrow.done .exn{color:var(--ink3);text-decoration:line-through}

.chatbox{border:1px solid var(--line);border-radius:12px;background:#fbfcfb;padding:11px;margin-bottom:9px}
.chatlog{max-height:210px;overflow-y:auto;margin-bottom:9px}
.msg{font-size:13px;line-height:1.6;margin-bottom:9px;display:flex}
.msg.me{justify-content:flex-end}
.msg .bub{max-width:82%;padding:9px 12px;border-radius:12px;background:#eef2f0;white-space:pre-wrap}
.msg.me .bub{background:var(--brand);color:#fff}
.chat-in{display:flex;gap:7px}
.chat-in input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.chat-in button{padding:0 15px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 11px;font-size:12px;color:var(--ink2)}

.mrow{display:flex;gap:9px;margin-bottom:10px}
.mrow input{flex:1;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfcfb;font-size:14px}
.mrow button{padding:0 16px;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.chart{display:flex;align-items:flex-end;gap:7px;height:96px;padding:8px 2px 0;overflow-x:auto}
.ct-bar{flex:none;width:36px;display:flex;flex-direction:column;align-items:center;gap:5px}
.ct-bar .bar2{width:100%;min-height:3px;display:flex;align-items:flex-end;justify-content:center}
.ct-bar .bar2 i{display:block;width:100%;background:var(--brand);border-radius:5px 5px 2px 2px}
.ct-bar b{font-size:10px;color:var(--ink2);font-weight:700}
.ct-bar span{font-size:9.5px;color:var(--ink3)}
.mlist{margin-top:10px}
.mitem{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--ink2)}
.mitem:last-child{border:0}

.setrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.setrow:last-child{border:0}
.setrow span{color:var(--ink2)}
.danger{color:var(--bad);font-weight:700;font-size:13.5px}

.modal{position:fixed;inset:0;background:rgba(20,28,25,.42);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:sheetup .22s ease}
@keyframes sheetup{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.modal h3{margin:0 0 13px;font-size:16px;font-weight:800}
.modal .field{margin-bottom:11px}
.modal .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.modal .field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;font-size:15px;outline:none}
.modal .field input:focus{border-color:var(--brand);background:#fff}
.modal .info{background:var(--brand-l);border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--brand);margin-bottom:12px;line-height:1.6}
.modal .btns{display:flex;gap:9px;margin-top:15px}
.modal .btns button{flex:1;padding:13px;border-radius:11px;font-size:15px;font-weight:700}
.modal .btns .ok{background:var(--brand);color:#fff}
.modal .btns .cancel{background:#f1f4f2;color:var(--ink2)}
.modal .btns .del{background:#fdf0ef;color:var(--bad);flex:none;width:64px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
  padding:6px 0 max(6px,env(safe-area-inset-bottom))
}
.tabbar button{flex:1;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px}
.tabbar button .ic{font-size:18px;line-height:1}
.tabbar button.on{color:var(--brand);font-weight:700}
@media(max-width:360px){.grid,.exgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:relative;background:#e6f1eb;padding:8px;text-align:center;font-size:12px">示例体验，数据仅保留在本页 <button id="previewReset" style="color:#2f6f52;text-decoration:underline">恢复示例</button></div>

<!-- ================= 引导 ================= -->
<div id="onboard" class="onboard">
  <div class="ob-logo">薄肌<span>笔记</span></div>
  <div class="ob-sub">冰箱里有什么，今天该吃什么、练什么——一次算清。</div>
  <div class="steps" id="obSteps"><i class="on"></i><i></i><i></i></div>

  <!-- 步骤 1：资料 -->
  <div id="ob1">
    <div class="ob-panel">
      <h3>先认识一下</h3>
      <div class="field">
        <div class="seg" id="sexSeg"><button data-v="m" class="on">男</button><button data-v="f">女</button></div>
      </div>
      <div class="row2">
        <div class="field"><label>年龄</label><input id="obAge" type="number" inputmode="numeric"></div>
        <div class="field"><label>身高 cm</label><input id="obH" type="number" inputmode="decimal"></div>
      </div>
      <div class="row2">
        <div class="field"><label>体重 kg</label><input id="obW" type="number" inputmode="decimal"></div>
        <div class="field"><label>想减到 kg（可选）</label><input id="obGoalW" type="number" inputmode="decimal"></div>
      </div>
      <div class="field">
        <label>腰围 cm（可选，用来判断内脏脂肪）</label>
        <input id="obWaist" type="number" inputmode="decimal">
      </div>
      <div class="field">
        <div class="seg" id="goalSeg"><button data-v="cut" class="on">减脂</button><button data-v="keep">维持</button><button data-v="bulk">增肌</button></div>
      </div>
      <div class="field">
        <label>日常活动量</label>
        <select id="obAct">
          <option value="1.2">久坐 · 基本不动</option>
          <option value="1.375">轻度 · 每天走路/少量运动</option>
          <option value="1.55">中度 · 每周运动 3-5 次</option>
          <option value="1.725">高强度 · 每天训练</option>
        </select>
      </div>
    </div>
    <button class="btn" id="obNext1">算出我要怎么吃</button>
  </div>

  <!-- 步骤 2：预估 -->
  <div id="ob2" class="hidden">
    <div id="obForecast"></div>
    <div id="obTargets"></div>
    <button class="btn" id="obNext2">下一步：选训练动作</button>
    <button class="btn ghost sm" id="obBack1" style="margin-top:9px">返回修改</button>
  </div>

  <!-- 步骤 3：选动作 -->
  <div id="ob3" class="hidden">
    <div class="ob-panel">
      <h3>挑你愿意做的动作</h3>
      <div class="extabs" id="obExTabs">
        <button data-extab="home" class="on">居家训练</button>
        <button data-extab="gym">健身房训练</button>
      </div>
      <p class="hint" style="margin:10px 0 11px"><b>至少选 3 个</b>，4-6 个最好。每张卡都写了练它有什么用，看着不顺眼就换一批。</p>

/* =========================================================
   计算
   ========================================================= */
/* 三档速度：每日热量 = 消耗 × 系数 */
const PACE = {
  easy:  {label:'轻松', pct:'−15%', r:0.85, tip:'慢一点，几乎不会饿，最容易坚持'},
  normal:{label:'标准', pct:'−20%', r:0.80, tip:'平衡。掉脂稳，肌肉保得住（推荐）'},
  hard:  {label:'加速', pct:'−28%', r:0.72, tip:'冲刺档：连做最多 8 周就该回「标准」，否则容易反弹'}
};
function calcTargets(p){
  const bmr = 10*p.w + 6.25*p.h - 5*p.age + (p.sex==='m'?5:-161);
  const tdee = bmr * p.act;
  let kcal = tdee;
  if(p.goal==='cut')  kcal = tdee * (PACE[p.pace||'normal'].r);
  if(p.goal==='bulk') kcal = tdee*1.10;
  // 蛋白按体重，但封顶 175g（再高对减脂没额外好处，只会把碳水挤没）
  let pro = Math.min(Math.round(p.w*(p.goal==='cut'?2.0:(p.goal==='bulk'?1.8:1.6))), 175);
  let fat = Math.min(Math.round(p.w*0.9), 80);
  let room = kcal - pro*4 - fat*9;

  if(p.goal==='cut'){
    // 碳水保底 105g：不够就先砍脂肪（到 0.65g/kg），再降蛋白（到 1.8g/kg）
    if(room/4 < 105){
      const fatFloor = Math.round(p.w*0.65);
      if(fat > fatFloor) fat = fatFloor;
      room = kcal - pro*4 - fat*9;
    }
    if(room/4 < 105){
      pro = Math.min(Math.round(p.w*1.8), 160);
      room = kcal - pro*4 - fat*9;
    }
  }
  const carb = Math.max(55, Math.round(room/4));
  return {kcal:Math.round(kcal), pro, fat, carb, fiber:25, tdee:Math.round(tdee)};
}
/* 按热量缺口推算速度：1kg 脂肪 ≈ 7700 kcal */
function forecast(p,t){
  const deficit = Math.round(t.tdee - t.kcal);
  const perWeek = deficit>0 ? (deficit*7/7700) : 0;
  const wk4 = p.w - perWeek*4, wk8 = p.w - perWeek*8, wk12 = p.w - perWeek*12;
  let toGoalWeeks = null;
  if(p.goalW && p.goalW < p.w && perWeek>0) toGoalWeeks = Math.ceil((p.w-p.goalW)/perWeek);
  return {deficit, perWeek, wk4, wk8, wk12, toGoalWeeks};
}
function daySum(date){
  return (S.log[date]||[]).reduce((a,x)=>({
    kcal:a.kcal+x.kcal, pro:a.pro+x.pro, fat:a.fat+x.fat, carb:a.carb+x.carb, fiber:a.fiber+x.fiber
  }),{kcal:0,pro:0,fat:0,carb:0,fiber:0});
}
const foundFood = name => {
  if(!name) return null;
  const q = name.trim();
  let f = FOODS.find(x=>x.name===q);
  if(f) return f;
  f = FOODS.find(x=>q.includes(x.name) || x.name.includes(q));
  return f || null;
};

/* =========================================================
   自动排餐（库存优先）
   ========================================================= */
function recommendMeals(){
  const t=S.targets;
  if(!t) return [];
  const pro   = S.pantry.filter(p=>p.cat==='pro');
  const veg   = S.pantry.filter(p=>p.cat==='veg');
  const staple= S.pantry.filter(p=>p.cat==='staple');
  const fat   = S.pantry.filter(p=>p.cat==='fat');
  const fruit = S.pantry.filter(p=>p.cat==='fruit');

  const split = [{k:'第一餐', t:'约 12:00', r:0.45}, {k:'第二餐', t:'约 18:00', r:0.55}];
  return split.map((m,mi)=>{
    const kcalT = t.kcal*m.r, proT = t.pro*m.r;
    const items=[]; let kc=0, pr=0;

    // 1) 蛋白：先放一个主蛋白，凑到 80% 目标
    const pOrder = pro.slice().sort((a,b)=> (b.per.pro/b.per.kcal) - (a.per.pro/a.per.kcal));
    if(pOrder.length){
      const p0 = pOrder[mi % pOrder.length];
      const need = proT*0.8;
      let g = p0.per.pro>0 ? Math.min(p0.g*3, need/(p0.per.pro/100)) : p0.g;
      g = Math.round(g/10)*10;
      items.push({name:p0.name, g});
      kc += p0.per.kcal*g/100; pr += p0.per.pro*g/100;
    }
    // 2) 蔬菜：固定 300g（多给纤维和饱腹）
    if(veg.length){
      const v = veg[mi % veg.length];
      items.push({name:v.name, g:300});
      kc += v.per.kcal*3; pr += v.per.pro*3;
    }
    // 3) 主食：把剩余热量吃掉（留 15% 给坚果）
    const stapleKcal = (kcalT - kc) * 0.82;
    if(staple.length && stapleKcal>40){
      const s0 = staple[mi % staple.length];
      let g = s0.per.kcal>0 ? stapleKcal/(s0.per.kcal/100) : 100;
      g = Math.max(40, Math.round(g/10)*10);
      items.push({name:s0.name, g});
      kc += s0.per.kcal*g/100; pr += s0.per.pro*g/100;
    }
    // 4) 脂肪：剩余热量给坚果/油
    const restK = kcalT - kc;
    if(restK>30){
      if(fat.length){
        const f0 = fat[mi % fat.length];
        let g = f0.per.kcal>0 ? restK/(f0.per.kcal/100) : 10;
        g = Math.max(5, Math.round(g/5)*5);
        items.push({name:f0.name, g});
        kc += f0.per.kcal*g/100; pr += f0.per.pro*g/100;
      }
    }
    // 5) 水果：第一餐给一份
    if(mi===0 && fruit.length){
      const fr = fruit[0];
      items.push({name:fr.name, g:100});
      kc += fr.per.kcal; pr += fr.per.pro;
    }
    return {name:m.k, time:m.t, items, kcal:kc, pro:pr};
  });
}

/* ---------- 周汇总 ---------- */
function keyOf(d){
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function weeklyStats(){
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=keyOf(d);
    if(S.log[k] && S.log[k].length) days.push(daySum(k));
  }
  if(!days.length) return null;
  const n=days.length;
  const t=days.reduce((a,x)=>({kcal:a.kcal+x.kcal,pro:a.pro+x.pro,fat:a.fat+x.fat,carb:a.carb+x.carb,fiber:a.fiber+x.fiber}),
    {kcal:0,pro:0,fat:0,carb:0,fiber:0});
  return {n, kcal:t.kcal/n, pro:t.pro/n, fat:t.fat/n, carb:t.carb/n, fiber:t.fiber/n, sumKcal:t.kcal};
}
function weeklyCard(){
  const w=weeklyStats(), t=S.targets;
  if(!w) return `<div class="card">
    <div class="card-h"><h2>本周</h2><span class="sub">还没数据</span></div>
    <div class="hint">开始记两天，这里会汇总你一周吃了多少、达标几天。</div>
  </div>`;
  const hit = (v,g,ok)=>{ const r=g>0?v/g:0; return r>=ok[0]&&r<=ok[1]; };
  const proHit = hit(w.pro*7, t.pro*7, [0.9,1.3]);
  return `<div class="card">
    <div class="card-h"><h2>近 7 天</h2><span class="sub">记录了 ${w.n} 天</span></div>
    <div class="statgrid">
      <div class="stat"><b>${fmt(w.kcal)}</b><span>日均千卡</span></div>
      <div class="stat"><b>${fmt(w.pro)}</b><span>日均蛋白 g</span></div>
      <div class="stat"><b>${fmt(w.fiber,1)}</b><span>日均纤维 g</span></div>
      <div class="stat"><b>${fmt(w.sumKcal/1000,1)}k</b><span>本周总热量</span></div>
    </div>
    <div class="hint" style="margin-top:11px">
      ${proHit?'✅ 蛋白达到目标。':'⚠️ 蛋白日均 '+fmt(w.pro)+'g，目标 '+t.pro+'g，差 '+fmt(Math.max(0,t.pro-w.pro))+'g。'}
      ${w.fiber>=25?' 纤维也够了。':' 纤维日均只有 '+fmt(w.fiber,1)+'g（目标 25g），这是你最容易补上的一块。'}
    </div>
  </div>`;
}

/* ---------- 测量提醒 & 调整建议 ---------- */
function daysSince(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return Math.floor((new Date(keyOf(new Date())+'T00:00:00') - d)/86400000);
}
function measureAdvice(){
  const ms=[...S.measures].sort((a,b)=>a.date<b.date?-1:1);
  if(!ms.length) return null;
  const last=ms[ms.length-1];
  const gap=daysSince(last.date);
  const prev=ms.length>1?ms[ms.length-2]:null;
  const dw=prev?(last.w-prev.w):null;
  const dc=(prev&&last.waist&&prev.waist)?(last.waist-prev.waist):null;
  const spanDays=prev?(daysSince(prev.date)-gap):null;

  let level='ok', title='', body='';

  if(!prev){
    level='info';
    title='这是第一次记录';
    body='一周后再量一次，有两次数据我才能看出趋势，并据此调整你的餐和训练。';
  } else if(dw<-0.3 && dc!==null && dc<-0.4){
    level='good';
    title='掉得很干净';
    body=`体重 ${fmt(dw,1)}kg、腰围 ${fmt(dc,1)}cm，两个一起降说明掉的是脂肪。餐食和训练都不用改，继续。`;
  } else if(dw<=0.1 && dc!==null && dc<0){
    level='good';
    title='体重没动，但腰围在降';
    body=`这通常是在同时长肌肉、掉脂肪，体型比体重更重要。保持现在的吃法和训练。`;
  } else if(dw<-0.5 && (dc===null || dc>=0)){
    level='warn';
    title='掉得有点快，腰围没跟上';
    body=`一周掉 ${fmt(Math.abs(dw),1)}kg 而腰围不动，多半有水份或肌肉流失。把蛋白吃够（每天 ${S.targets.pro}g），别再加有氧。`;
  } else if(Math.abs(dw)<0.2 && (dc===null || Math.abs(dc)<0.3)){
    level='warn';
    title='数据没变化，该调了';
    body=`体重和腰围都原地踏步。两个选择：① 每天热量减 150 千卡（少吃一份主食）② 每天多走 2000 步。优先选②。`;
  } else if(dw>0.3){
    level='warn';
    title='这周涨了';
    body=`涨 ${fmt(dw,1)}kg。先看是不是盐吃多了（水肿，两三天会消），如果连着涨两周，就把热量减 150。`;
  } else {
    level='ok';
    title='趋势正常';
    body=`体重 ${dw>0?'+':''}${fmt(dw,1)}kg，保持现在的节奏。`;
  }

  // 到该量的时间了
  if(gap>=7){
    title = '该量了 · ' + title;
  }

  const color = level==='good'?'#2f6f52' : level==='warn'?'#c9762a' : '#5d6b67';
  const bg = level==='good'?'#e6f1eb' : level==='warn'?'#fdf1e3' : '#f7faf8';

  return `<div class="card" style="background:${bg};border-color:${bg}">
    <div class="card-h"><h2 style="color:${color}">${title}</h2>
      <span class="sub">${gap===0?'今天量过':gap+' 天前量过'}</span></div>
    <div class="hint" style="color:${color};line-height:1.7">${body}</div>
    ${gap>=7?'<div class="hint" style="margin-top:9px">📏 每周固定一天量（建议周一晨起），条件要一样：上完厕所、喝水前、同一把秤。</div>':''}
  </div>`;
}

  const el = openModal(`

      </button>`).join('') : '<div class="hint">冰箱是空的，先去「冰箱」页加几样食材。</div>'}
    </div>
    <div class="btns">
      <button class="cancel" data-m="close">取消</button>
      <button class="ok" data-m="ok">记上（共 0 份）</button>
    </div>`);

  const picked={};
  const okBtn=el.querySelector('[data-m="ok"]');
  const upd=()=>{
    let total=0;
    for(const n in picked) total+=picked[n];
    okBtn.textContent=`记上（共 ${total} 份）`;
  };

  el.querySelector('#qgrid').addEventListener('click',e=>{
    const b=e.target.closest('[data-q]'); if(!b) return;
    const name=b.dataset.q;
    const p=S.pantry.find(x=>x.name===name);
    picked[name]=(picked[name]||0)+1;
    if(picked[name]>p.count){ picked[name]=p.count; toast('库存没这么多了'); }
    b.querySelector('.qc').textContent=picked[name];
    b.classList.add('on');
    upd();
  });

  el.querySelector('[data-m="close"]').onclick=closeModal;
  okBtn.onclick=()=>{
    let total=0; for(const n in picked) total+=picked[n];
    if(!total){ return; }
    for(const name in picked){
      const n=picked[name];
      if(n<=0) continue;
      const p=S.pantry.find(x=>x.name===name);
      addLog(name, p.g, p.per, n);   // 一次记 n 份
      p.count=Math.max(0,p.count-n);
    }
    save(); render(); closeModal();
    toast(`记上了，共 ${total} 份`);
  };
}

function botReply(q){
  const k=todayKey(), s=daySum(k), t=S.targets;
  const txt = q.replace(/\s/g,'');
  if(/还能吃|剩余|剩下多少/.test(txt)){
    const rk=t.kcal-s.kcal, rp=t.pro-s.pro;
    if(rk<=0) return `今天热量已经用完了（${fmt(s.kcal)} / ${t.kcal} 千卡）。还想吃，就吃蔬菜——西兰花、黄瓜、白菜基本不占额度。`;
    return `今天还能吃 ${fmt(rk)} 千卡，蛋白还差 ${fmt(Math.max(0,rp))} g。\n换算一下：蛋白还差 ${fmt(Math.max(0,rp))} g，大概还要 ${Math.ceil(Math.max(0,rp)/18)} 个鸡蛋，或者 ${fmt(Math.max(0,rp)/0.23)} g 鸡胸肉。`;
  }
  if(/晚饭|晚餐|晚上吃/.test(txt)){
    const meals=recommendMeals(); const m=meals[1]||meals[0];
    if(!m) return '冰箱里还没有食材，先去「冰箱」加几样。';
    return `${m.name}按你的库存排这样：\n` + m.items.map(i=>`· ${i.name} ${i.g}g`).join('\n') + `\n共 ${fmt(m.kcal)} 千卡、蛋白 ${fmt(m.pro,0)}g。`;
  }
  if(/蛋白/.test(txt)){
    const rp=t.pro-s.pro;
    if(rp<=0) return `蛋白已经够了（${fmt(s.pro)} / ${t.pro} g），今天这块达标。`;
    return `还差 ${fmt(rp)} g 蛋白。最省事的补法：\n· 鸡蛋 ${Math.ceil(rp/6)} 个\n· 或鸡胸肉 ${fmt(rp/0.23)} g\n· 或牛奶 ${fmt(rp/0.032)} ml`;
  }
  if(/冰箱|有什么/.test(txt)){
    if(!S.pantry.length) return '冰箱是空的，去「冰箱」页加几样。';
    const by={}; S.pantry.forEach(p=>{ (by[p.cat]=by[p.cat]||[]).push(p.name); });
    return Object.keys(by).map(c=>`${CAT_NAME[c]}：${by[c].join('、')}`).join('\n');
  }
  if(/动作|训练|练哪/.test(txt)){
    const m = EXERCISES.find(e=>txt.includes(e.n));
    if(m) return `${m.n}（${m.part}）：${m.sets}\n要点：${m.tip}`;
    return '你选的动作是：' + S.exercises.map(id=>EXERCISES.find(e=>e.id===id)?.n).filter(Boolean).join('、') + '。\n想看哪个动作的要点，直接说名字。';
  }
  if(/减多少|多久|速度|几周/.test(txt)){
    const f=forecast(S.profile,t);
    return `按每天 ${f.deficit} 千卡缺口算，每周约减 ${fmt(f.perWeek,2)} kg。\n4 周后约 ${fmt(f.wk4,1)} kg，8 周后约 ${fmt(f.wk8,1)} kg。`;
  }
  return '这个问题超出我的本地知识范围了。我能回答：今天还能吃多少、晚饭吃什么、蛋白还差多少、冰箱里有什么、某个动作练哪、多久减多少。';
}
function sendChat(q){
  const text=(q||'').trim(); if(!text) return;
  S.chat.push({who:'me',text});
  S.chat.push({who:'ai',text:botReply(text)});
  save(); render();
  setTimeout(()=>{ const el=document.getElementById('chatlog'); if(el) el.scrollTop=el.scrollHeight; },40);
}

/* ---------- 冰箱 ---------- */
function viewPantry(){
  const tip = `<div class="card" style="background:#f7faf8;border-color:#dfeae3">
    <div class="hint" style="line-height:1.75">
      💡 <b>建议备一个厨房秤（30-50 块那种）</b>。<br>
      食材一上秤，克数才准——不然"一份"到底多少全靠猜，算出来的热量也就不可信了。<br>
      体重秤在「记录」页用，每周固定一天晨起称一次就够。
    </div>
  </div>
`;
  if(!S.pantry.length) return tip + `<div class="card"><div class="empty">冰箱是空的<br>点下面「添加食材」写几样你现在有的</div></div>
    <button class="btn" data-act="addFood">＋ 添加食材</button>`;

  for(const cat of ['pro','staple','veg','fruit','fat','other']){
    if(!by[cat].length) continue;
    html += `<div class="card">
      <div class="card-h"><h2>${CAT_NAME[cat]}</h2><span class="sub">${by[cat].length} 种</span></div>
      <div class="grid">${by[cat].map(p=>{
        const kcal=p.per.kcal*p.g/100, pro=p.per.pro*p.g/100;

        return `<div class="food ${p.count<=0?'out':''}">
          <div class="fn">${esc(p.name)}</div>
          <div class="fp">${p.liquid ? `一次吃 ${p.g}ml` : (p.byG ? `一次吃 ${p.g}g` : `按每${u} ${p.g}g`)} · ${fmt(kcal)} kcal · 蛋白 ${fmt(pro,1)}g</div>
          <div class="stockrow">
            <button data-act="stock" data-name="${esc(p.name)}" data-d="1">＋</button>
            <div class="stock"><b>${p.byG ? Math.round(p.count) : p.count}</b><span>${p.byG ? 'g' : u}</span></div>
            <button data-act="stock" data-name="${esc(p.name)}" data-d="-1">－</button>
          </div>
          <button class="editbtn" data-act="editFood" data-name="${esc(p.name)}">改份量 / 删除</button>
        </div>`;
      }).join('')}</div>

  return tip + html + `<button class="btn" data-act="addFood">＋ 添加食材</button>
    <p class="hint" style="margin-top:10px">「⋯」可以改份数或删除。吃完一份会自动扣库存，并计入今天。</p>`;
}

/* ---------- 训练 ---------- */
function viewTrain(){
  const k=todayKey(), tr=S.train[k]||[];
  const myEx=S.exercises.map(id=>EXERCISES.find(e=>e.id===id)).filter(Boolean);
  if(!myEx.length) return `<div class="card"><div class="empty">还没选动作<br>去「设置 → 重新选动作」挑几个</div></div>`;
  const done=tr.filter(Boolean).length;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({key,n:(S.train[key]||[]).filter(Boolean).length,md:`${d.getMonth()+1}/${d.getDate()}`});
  }
  return `
  <div class="card">
    <div class="card-h"><h2>今天要做的</h2><span class="sub">${done}/${myEx.length} 完成</span></div>
    ${myEx.map((e,i)=>`
      <div class="exrow ${tr[i]?'done':''}">
        <button class="chk ${tr[i]?'on':''}" data-act="tglTrain" data-i="${i}">✓</button>
        <div class="exn">${e.n}<em>${e.sets}${e.wt?' · '+e.wt:''}</em></div>
      </div>`).join('')}
  </div>
  <div class="card">
    <div class="card-h"><h2>最近 7 天</h2><span class="sub">个数 = 完成动作数</span></div>
    <div class="chart">${days.map(d=>`<div class="ct-bar">
      <div class="bar2"><i style="height:${(d.n/Math.max(1,myEx.length))*56}px"></i></div>
      <b>${d.n}</b><span>${d.md}</span></div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="card-h"><h2>动作要点</h2></div>
    <div class="hint">${myEx.map(e=>`· <b>${e.n}</b>（${e.part}）：${e.tip}`).join('<br>')}</div>
  </div>`;
}

/* ---------- 记录 ---------- */
function viewRecord(){
  const ms=[...S.measures].sort((a,b)=>a.date<b.date?-1:1);
  const last=ms[ms.length-1];
  const listHtml=ms.slice().reverse().slice(0,10).map(m=>{
    const i=ms.findIndex(x=>x.date===m.date), prev=i>0?ms[i-1]:null;
    const dw=prev?(m.w-prev.w):null, dc=(prev&&m.waist&&prev.waist)?(m.waist-prev.waist):null;
    return `<div class="mitem"><span>${m.date}</span>
      <span>${m.w} kg${dw!==null?` (${dw>0?'+':''}${fmt(dw,1)})`:''}${m.waist?` · ${m.waist} cm${dc!==null?` (${dc>0?'+':''}${fmt(dc,1)})`:''}`:''}</span></div>`;
  }).join('');
  const chart = ms.length>=2 ? (()=>{
    const arr=ms.slice(-8), vals=arr.map(m=>m.w);
    const min=Math.min(...vals)-1, max=Math.max(...vals)+1;
    return `<div class="chart">${arr.map(m=>{
      const h=Math.max(6,(m.w-min)/(max-min||1)*56);
      return `<div class="ct-bar"><div class="bar2"><i style="height:${h}px"></i></div>
        <b>${m.w}</b><span>${m.date.slice(5)}</span></div>`;
    }).join('')}</div>`;
  })() : `<div class="empty">记录两次以上，这里会出现趋势</div>`;

  return `
  ${measureAdvice()||''}

  <div class="card">
    <div class="card-h"><h2>记一笔</h2><span class="sub">${last?`上次 ${last.date}`:'还没有记录'}</span></div>
    <div class="row2" style="margin-bottom:9px">
      <div class="field"><label>体重 kg</label>
        <input id="inW" type="number" inputmode="decimal" step="0.1" value="${last?last.w:''}"></div>
      <div class="field"><label>腰围 cm（可选）</label>
        <input id="inWaist" type="number" inputmode="decimal" step="0.5" value="${last&&last.waist?last.waist:''}"></div>
    </div>
    <button class="btn sm" data-act="addMeasure">记录这一次</button>
    <div class="hint">晨起、上完厕所、喝水前测最准。腰围量肚脐水平，自然呼气末，别吸肚子。</div>
  </div>
  <div class="card">
    <div class="card-h"><h2>体重趋势</h2><span class="sub">最近 ${Math.min(ms.length,8)} 次</span></div>
    ${chart}
  </div>
  <div class="card">
    <div class="card-h"><h2>历史记录</h2><span class="sub">${ms.length} 条</span></div>
    ${ms.length?listHtml:`<div class="empty">还没有记录</div>`}
  </div>`;
}

function addLog(name, grams, per, times){
  const t=times||1;
  const r=grams*t/100, k=todayKey();
  if(!S.log[k]) S.log[k]=[];
  S.log[k].push({
    name, g:grams*t,
    pro:per.pro*r, kcal:per.kcal*r, fat:per.fat*r, carb:per.carb*r, fiber:per.fiber*r
  });
}
function openAddFood(){
  const el = openModal(`
    <h3>加个食材</h3>
    <div class="field">
      <label>名称</label>
      <input id="mName" autocomplete="off">
    </div>
    <div class="info" id="mInfo">写个名字，比如「鸡蛋」「鸡胸肉」「燕麦」</div>
    <div class="field">
      <label id="mQLabel">数量</label>
      <input id="mQty" type="number" inputmode="numeric" value="1">
    </div>
    <div class="field">
      <label id="mGLabel">净含量（选填）</label>
      <input id="mG" type="number" inputmode="numeric">
    </div>
    <div class="btns">
      <button class="cancel" data-m="close">取消</button>
      <button class="ok" data-m="ok">加入冰箱</button>
    </div>`);

  const nameEl=el.querySelector('#mName'), qtyEl=el.querySelector('#mQty'), gEl=el.querySelector('#mG');
  const infoEl=el.querySelector('#mInfo'), qLabel=el.querySelector('#mQLabel'), gLabel=el.querySelector('#mGLabel');
  let cur=null;

  const refresh=()=>{
    const name=nameEl.value.trim();
    if(!name){
      cur=null;
      infoEl.textContent='写个名字，比如「鸡蛋」「鸡胸肉」「燕麦」';
      qLabel.textContent='数量';
      gLabel.textContent='净含量（选填）';
      return;
    }
    const f=foundFood(name);
    if(f){
      cur=f;
      const def=servingOf(f);
      if(byWeight(f)){
        const gUnit = isLiquid(f)?'ml':'g';
        infoEl.innerHTML=`✅ 认出「${f.name}」（${CAT_NAME[f.cat]}）· 按${gUnit}记录`;
        qLabel.textContent=`总共有多少${gUnit}`;
        gLabel.textContent=`一次吃多少${gUnit}（必填）`;
        gEl.value=def;
        if(qtyEl.value==='1') qtyEl.value='500';
      }else{
        const u=unitOf(f);
        const gUnit = isLiquid(f)?'ml':'g';
        infoEl.innerHTML=`✅ 认出「${f.name}」（${CAT_NAME[f.cat]}）· 按${u}记录`;
        qLabel.textContent=`有多少${u}`;
        gLabel.textContent=`每${u}多少${gUnit}（必填，已填常见值）`;
        gEl.value=def;
        if(qtyEl.value==='1') qtyEl.value='10';
      }
    }else{
      cur=null;
      infoEl.innerHTML=`没收录「${esc(name)}」，营养按分类估`;
      qLabel.textContent='总共有多少克';
      gLabel.textContent='每次吃多少克（必填）';
      gEl.value=100;
      if(qtyEl.value==='1') qtyEl.value='500';
    }
  };
  nameEl.addEventListener('input', refresh);
  setTimeout(()=>nameEl.focus(),120);

  el.querySelector('[data-m="close"]').onclick=closeModal;
  el.querySelector('[data-m="ok"]').onclick=()=>{
    const name=nameEl.value.trim();
    if(!name){ infoEl.innerHTML='<b>先写个名称</b>'; return; }
    const f=cur || foundFood(name);
    const cat=guessCat(name);
    const per=f?Object.assign({},f.per):Object.assign({},CAT_DEFAULT[cat]);
    const defG=f?servingOf(f):100;
    const userG=parseFloat(gEl.value);
    if(!(userG>0)){
      gLabel.textContent='这里必须填，不能留空';
      gLabel.style.color='#c0453d';
      gEl.focus();
      return;
    }
    const g=userG;
    const bg=f?byWeight(f):true;
    const liq=f?isLiquid(f):false;
    const qty=Math.max(1, parseFloat(qtyEl.value)||1);
    const finalName=f?f.name:name;

    const exist=S.pantry.find(x=>x.name===finalName);
    if(exist){ exist.count += qty; if(userG>0) exist.g=g; exist.liquid=liq; }
    else S.pantry.push({name:finalName, cat:f?f.cat:cat, g, per, count:qty, byG:bg, liquid:liq});

    save(); render(); closeModal();
    toast(`已加入 ${finalName} ${bg?Math.round(qty)+'g':qty+unitOf(FOODS.find(x=>x.name===finalName))}`);
  };
}

function editFood(name){
  const p=S.pantry.find(x=>x.name===name); if(!p) return;
  const f=FOODS.find(x=>x.name===name) || null;
  const u=unitOf(f);
  const unitTxt = p.liquid ? 'ml' : (p.byG ? 'g' : u);
  const el = openModal(`
    <h3>${esc(p.name)}</h3>
    <div class="info">${p.byG?'一次吃':'按每'+unitTxt+' '} ${p.g} g（估）· ${fmt(p.per.kcal*p.g/100)} kcal · 蛋白 ${fmt(p.per.pro*p.g/100,1)} g<br>不准就改成实际重量，热量会跟着重算。</div>
    <div class="field">
      <label>现在还剩多少${unitTxt}</label>
      <input id="eQty" type="number" inputmode="numeric" value="${Math.round(p.count)}">
    </div>
    <div class="btns">
      <button class="del" data-m="del">删除</button>
      <button class="cancel" data-m="close">取消</button>
      <button class="ok" data-m="ok">保存</button>
    </div>`);
  el.querySelector('[data-m="close"]').onclick=closeModal;
  el.querySelector('[data-m="ok"]').onclick=()=>{
    const n=parseInt(el.querySelector('#eQty').value,10);
    if(isNaN(n)||n<0){ return; }
    if(n===0) S.pantry=S.pantry.filter(x=>x.name!==name);
    else p.count=n;
    save(); render(); closeModal();
  };
  el.querySelector('[data-m="del"]').onclick=()=>{
    S.pantry=S.pantry.filter(x=>x.name!==name);
    save(); render(); closeModal(); toast('已删除');
  };
}
document.getElementById('view').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;

  if(act==='eat'){
    const name=b.dataset.name;
    const p=S.pantry.find(x=>x.name===name); if(!p) return;
    addLog(p.name, p.g, p.per);
    p.count=Math.max(0,p.count-1);
    save(); render(); toast(`已记录 ${p.name} ${p.g}g`);
    return;
  }
  if(act==='stock'){
    const name=b.dataset.name, d=parseInt(b.dataset.d,10);
    const p=S.pantry.find(x=>x.name===name); if(!p) return;
    const step = p.byG ? p.g : 1;
    const unitWord = p.liquid ? 'ml' : (p.byG ? 'g' : '份');
    if(d>0){
      p.count += step;
      save(); render(); toast(`${p.name} +${step}${unitWord}`);
    }else{
      if(p.count<=0){ toast('已经没了'); return; }
      p.count = Math.max(0, p.count - step);
      addLog(p.name, p.g, p.per);          // 减 = 吃了，自动计入今天
      save(); render(); toast(`已吃掉 ${p.name} ${p.g}g`);
    }
    return;
  }
  if(act==='quickLog'){ openQuickLog(); return; }
  if(act==='water'){
    const ml=parseInt(b.dataset.ml,10)||0;
    const k=todayKey();
    if(!S.water) S.water={};
    S.water[k]=Math.max(0,(S.water[k]||0)+ml);
    save(); render();
    return;
  }
  if(act==='editFood'){ editFood(b.dataset.name); return; }
  if(act==='addFood'){ openAddFood(); return; }
  if(act==='delLog'){
    const k=todayKey(), i=+b.dataset.i;
    if(S.log[k]){ S.log[k].splice(i,1); save(); render(); }
    return;
  }
  if(act==='tglTrain'){
    const k=todayKey(), i=+b.dataset.i;
    if(!S.train[k]) S.train[k]=new Array(S.exercises.length).fill(false);
    S.train[k][i]=!S.train[k][i];
    save(); render();
    return;
  }
  if(act==='addMeasure'){
    const w=parseFloat(document.getElementById('inW').value);
    const waist=parseFloat(document.getElementById('inWaist').value);
    if(!w||w<20||w>300){ alert('体重填一下（20-300 kg）'); return; }
    const k=todayKey();
    S.measures=S.measures.filter(m=>m.date!==k);
    S.measures.push({date:k, w:Math.round(w*10)/10, waist:waist?Math.round(waist*10)/10:null});
    save(); render(); toast('已记录');
    return;
  }
  if(act==='sendChat'){
    const el=document.getElementById('chatInput');
    sendChat(el?el.value:'');
    return;
  }
  if(act==='reroll'){
    // 简单换一组：把冰箱顺序转一下，排餐结果就变了
    S.pantry.push(S.pantry.shift());
    save(); render(); toast('换了一组');
    return;
  }
  if(act==='reselectEx'){
    S.tab='train'; save();
    renderExPicker();
    alert('动作选择在设置里改：这里先打开完整列表，选完点「下一步」即可生效。');
    setStep(3); document.getElementById('app').classList.add('hidden');
    document.getElementById('onboard').classList.remove('hidden');
    return;
  }
  if(act==='redoProfile'){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('onboard').classList.remove('hidden');
    document.getElementById('obAge').value=S.profile.age;
    document.getElementById('obH').value=S.profile.h;
    document.getElementById('obW').value=S.profile.w;
    document.getElementById('obGoalW').value=S.profile.goalW||'';
    document.getElementById('obWaist').value=S.profile.waist||'';
    setStep(1);
    return;
  }
  if(act==='exportData'){ toast('安装后可导出数据'); return; 
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`薄肌笔记_${todayKey()}.json`;
    a.click();
    return;
  }
  if(act==='resetAll'){ resetPreview(); toast('示例已恢复'); return; 
  }
});

  const q=e.target.closest('[data-q]'); if(!q) return;

function toast(msg){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1b2422;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s';
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.style.opacity='1');
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),220); },1200);
}
