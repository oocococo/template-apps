
<div class="wrap">
  <header>
    <h1><span class="pill">💊 后悔药</span></h1>
    <div class="slogan">如果人生可以撤回，你最想撤回哪件事？</div>
  </header>

  <div class="tabs">
    <button class="on" data-tab="today">今日记录</button>
    <button data-tab="timeline">时间线</button>
    <button data-tab="stats">统计</button>
    <button data-tab="report">年度报告</button>
  </div>

  <!-- 今日 -->
  <div id="tab-today">
    <div class="card">
      <div class="date-line" id="todayDate"></div>
      <div id="todayForm">
        <textarea id="inputText" maxlength="100" placeholder="用一句话写下今天最后悔的事…&#10;例：又冲动消费了299元 / 不该熬夜打游戏"></textarea>
        <div class="hint"><span id="charCount">0</span>/100 · 每日仅允许记录一条，写完今天就不能改了</div>
        <div class="tags" id="tagPicker"></div>
        <div class="next">
          <label>下次怎么做？（可选 · 把后悔变成行动）</label>
          <input id="inputNext" maxlength="60" placeholder="例：下单前先加购物车冷静24小时">
        </div>
        <div class="center"><button class="btn" id="saveBtn">记下这条后悔</button></div>
      </div>
      <div id="todayDone" style="display:none"></div>
    </div>
    <div class="tip">记录后悔不是为了内耗，而是为了觉察改变。看见自己反复踩的坑，才能少踩一次。</div>
  </div>

  <!-- 时间线 -->
  <div id="tab-timeline" style="display:none">
    <div class="filter" id="filterBar"></div>
    <div id="timelineList"></div>
  </div>

  <!-- 统计 -->
  <div id="tab-stats" style="display:none">
    <div class="stat-grid" id="statGrid"></div>
    <div class="sec-title">各类后悔次数</div>
    <div id="tagBars"></div>
    <div class="center" style="margin-top:20px">
      <button class="btn ghost" id="exportMd">导出 Markdown</button>
      <button class="btn ghost" id="exportCsv">导出 CSV</button>
    </div>
  </div>

  <!-- 年度报告 -->
  <div id="tab-report" style="display:none">
    <div id="reportFree"></div>
    <div class="card locked" id="reportLock" style="display:none">
      <div class="icon">📄</div>
      <p><b style="color:var(--text)">年度后悔清单 · 完整报告</b><br>
      TOP高频后悔类型深度解读、逐月趋势分析、<br>个性化复盘建议与精美年度海报</p>
      <button class="btn lockbtn" id="unlockBtn">解锁年度报告</button>
    </div>
  </div>

  <footer>
    后悔药 · 记录每天的后悔，少踩重复的坑<br>
    记录和设置保存在数据库中
  </footer>
</div>

<div class="modal-bg" id="cardModal">
  <div style="text-align:center">
    <canvas height="800" id="cardCanvas" width="600"></canvas>
    <div style="margin-top:14px">
      <button class="btn" id="dlCard">保存卡片</button>
      <button class="btn ghost" id="closeModal">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
