<style data-page-node-id="z3gu3Jqolhu8mKWJfvm1hn" data-pnid-children="e5b1XZDG9vcwZSuWy90QGf">
  :root{
    --bg:#0f1117; --card:#1a1d27; --card2:#20242f; --line:#2c3140;
    --text:#e8eaf0; --muted:#8b91a3; --accent:#f0a35e; --accent2:#e8836b;
    --tag1:#5b8def; --tag2:#9b6bef; --tag3:#ef6b81; --tag4:#e0a63f; --tag5:#3fbf9f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:32px;letter-spacing:2px}
  header h1 .pill{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header .slogan{color:var(--muted);margin-top:10px;font-size:14px}
  .tabs{display:flex;gap:8px;margin:24px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;transition:.2s}
  .tabs button.on{background:var(--card2);color:var(--text);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  .date-line{font-size:13px;color:var(--muted);margin-bottom:12px}
  .date-line b{color:var(--accent)}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px;font-size:15px;resize:vertical;min-height:80px;font-family:inherit}
  textarea:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .tag{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--line);color:var(--muted);background:var(--card2);transition:.15s;user-select:none}
  .tag.sel{color:#fff;border-color:transparent}
  .t0.sel{background:var(--tag1)} .t1.sel{background:var(--tag2)} .t2.sel{background:var(--tag3)} .t3.sel{background:var(--tag4)} .t4.sel{background:var(--tag5)}
  .next{margin-top:14px}
  .next label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  .next input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px}
  .next input:focus{outline:none;border-color:var(--accent)}
  .btn{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
  .btn:hover{opacity:.9}
  .btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text);font-weight:400}
  .center{text-align:center;margin-top:16px}
  .record{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;position:relative}
  .record .r-date{font-size:12px;color:var(--muted)}
  .record .r-text{margin:8px 0;font-size:15px;line-height:1.6}
  .record .r-next{font-size:13px;color:var(--tag5);margin-top:4px}
  .record .r-tags{display:flex;gap:6px;margin-top:10px}
  .r-tag{font-size:11px;padding:3px 10px;border-radius:12px;background:var(--card2);color:var(--muted)}
  .record .del{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
  .record .del:hover{color:var(--tag3)}
  .empty{text-align:center;color:var(--muted);padding:48px 0;font-size:14px}
  .filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .filter .tag{font-size:12px;padding:5px 12px}
  .stat-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .stat .num{font-size:26px;font-weight:700;color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .bar-row .bl{width:52px;font-size:13px;color:var(--muted);flex-shrink:0}
  .bar-track{flex:1;height:22px;background:var(--card2);border-radius:11px;overflow:hidden}
  .bar-fill{height:100%;border-radius:11px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;min-width:24px;transition:width .6s}
  .sec-title{font-size:15px;font-weight:600;margin:22px 0 12px}
  .months{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
  .month{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .mcol{width:100%;max-width:36px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:6px 6px 0 0;min-height:4px;transition:height .6s}
  .mlbl{font-size:11px;color:var(--muted)}
  .tip{background:var(--card2);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px}
  .locked{text-align:center;padding:40px 0}
  .locked .icon{font-size:44px;margin-bottom:14px}
  .locked p{color:var(--muted);font-size:14px;line-height:1.8}
  .lockbtn{margin-top:18px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;line-height:2}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal-bg.show{display:flex}
  #cardCanvas{background:#fff;border-radius:16px;max-width:100%}
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 22px;border-radius:24px;font-size:13px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}
</style>

<script data-page-node-id="qYmORu8lKaUNYBb4TX5VOp" data-pnid-children="vALr6y6jmhEU6txyJH3Ptv">
const TAGS = ["消费","熬夜","情绪","拖延","人际"];
const COLORS = ["#5b8def","#9b6bef","#ef6b81","#e0a63f","#3fbf9f"];
const KEY = "houhuiyao_records";
const STORE_KEY = "houhuiyao_unlocked";
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
/* 示例数据仅保存在页面内存中。 */
const _mem={};
function sampleRecords(){
  const previous = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  return [{date:previous(1),text:"昨晚刷手机太晚",tag:1,next:"睡前把手机放远一点",ts:Date.now()-86400000},{date:previous(2),text:"冲动买了不需要的东西",tag:0,next:"先冷静一天再决定",ts:Date.now()-172800000}];
}
function resetSamples(){ for(const k in _mem) delete _mem[k]; _mem[KEY]=JSON.stringify(sampleRecords()); }
resetSamples();
function _get(k){ return (k in _mem)?_mem[k]:null; }
function _set(k,v){ _mem[k]=v; }
function _del(k){ delete _mem[k]; }
const load = () => { try{return JSON.parse(_get(KEY))||[]}catch(e){return[]} };
const save = r => _set(KEY, JSON.stringify(r));
const records = () => load();
let selTag = -1, curFilter = -1, curCard = null;

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* tabs */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  ["today","timeline","stats","report"].forEach(t=>document.getElementById("tab-"+t).style.display = b.dataset.tab===t?"":"none");
  if(b.dataset.tab==="timeline") renderTimeline();
  if(b.dataset.tab==="stats") renderStats();
  if(b.dataset.tab==="report") renderReport();
});

/* 今日 */
const wd=["日","一","二","三","四","五","六"];
document.getElementById("todayDate").innerHTML = "今天是 <b>"+todayStr()+"</b> 星期"+wd[new Date().getDay()];
const picker = document.getElementById("tagPicker");
TAGS.forEach((t,i)=>{
  const s=document.createElement("span"); s.className="tag t"+i; s.textContent=t;
  s.onclick=()=>{ if(selTag===i){selTag=-1;s.classList.remove("sel")} else {selTag=i;picker.querySelectorAll(".tag").forEach(x=>x.classList.remove("sel"));s.classList.add("sel")} };
  picker.appendChild(s);
});
const inp=document.getElementById("inputText");
inp.oninput=()=>document.getElementById("charCount").textContent=inp.value.length;

function renderToday(){
  const rec = records().find(r=>r.date===todayStr());
  if(rec){
    document.getElementById("todayForm").style.display="none";
    const el=document.getElementById("todayDone");
    el.style.display="";
    el.innerHTML = '<div style="text-align:center;padding:12px 0"><div style="font-size:34px">✅</div><p style="color:var(--muted);font-size:13px;margin:8px 0 14px">今天已经记过了，明天再来 · 今日这条：</p><div style="font-size:16px;line-height:1.7">「'+esc(rec.text)+'」</div>'+(rec.next?'<div style="font-size:13px;color:var(--tag5);margin-top:10px">下次：'+esc(rec.next)+'</div>':'')+'<div style="margin-top:16px"><button class="btn ghost" id="shareBtn2">生成分享卡片</button></div></div>';
    document.getElementById("shareBtn2").onclick=()=>openCard(rec);
  } else {
    document.getElementById("todayForm").style.display="";
    document.getElementById("todayDone").style.display="none";
  }
}
document.getElementById("saveBtn").onclick=()=>{
  const text=inp.value.trim();
  if(!text){ toast("先写下今天后悔的事"); return; }
  const rs=records();
  if(rs.some(r=>r.date===todayStr())){ toast("今天已经记过一条啦"); return; }
  rs.unshift({date:todayStr(), text, tag:selTag, next:document.getElementById("inputNext").value.trim(), ts:Date.now()});
  save(rs);
  inp.value=""; document.getElementById("inputNext").value=""; selTag=-1; picker.querySelectorAll(".tag").forEach(x=>x.classList.remove("sel"));
  document.getElementById("charCount").textContent="0";
  renderToday(); toast("已记下，明天见 👋");
};

/* 时间线 */
function renderTimeline(){
  const bar=document.getElementById("filterBar");
  bar.innerHTML="";
  const all=document.createElement("span"); all.className="tag"+(curFilter===-1?" sel t0":""); all.textContent="全部";
  all.onclick=()=>{curFilter=-1;renderTimeline()}; bar.appendChild(all);
  TAGS.forEach((t,i)=>{
    const s=document.createElement("span"); s.className="tag t"+i+(curFilter===i?" sel":""); s.textContent=t;
    s.onclick=()=>{curFilter=i;renderTimeline()}; bar.appendChild(s);
  });
  const list=document.getElementById("timelineList");
  const rs=records().filter(r=>curFilter===-1||r.tag===curFilter);
  if(!rs.length){ list.innerHTML='<div class="empty">还没有记录<br>每天一句话，从今天开始 👆</div>'; return; }
  list.innerHTML = rs.map(r=>`<div class="record">
    <button class="del" data-d="${r.date}" title="删除">✕</button>
    <div class="r-date">${r.date}</div>
    <div class="r-text">「${esc(r.text)}」</div>
    ${r.next?'<div class="r-next">↪ 下次：'+esc(r.next)+'</div>':''}
    <div class="r-tags">${r.tag>=0?'<span class="r-tag" style="color:'+COLORS[r.tag]+'">'+TAGS[r.tag]+'</span>':''}
    <span class="r-tag share" style="cursor:pointer" data-d="${r.date}">卡片</span></div>
  </div>`).join("");
  list.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const date=b.dataset.d;
    const bg=document.createElement("div"); bg.className="modal-bg show";
    bg.innerHTML='<div class="card" style="max-width:360px;width:100%;text-align:center"><p>确定删除 '+date+' 这条记录吗？</p><div class="center"><button class="btn" data-confirm>删除</button> <button class="btn ghost" data-cancel>取消</button></div></div>';
    document.body.appendChild(bg);
    bg.querySelector("[data-confirm]").onclick=()=>{save(records().filter(r=>r.date!==date));bg.remove();renderTimeline();renderToday()};
    bg.querySelector("[data-cancel]").onclick=()=>bg.remove();
  });
  list.querySelectorAll(".share").forEach(b=>b.onclick=()=>openCard(records().find(r=>r.date===b.dataset.d)));
}

/* 统计 */
function renderStats(){
  const rs=records();
  const days=new Set(rs.map(r=>r.date)).size;
  document.getElementById("statGrid").innerHTML =
    '<div class="stat"><div class="num">'+rs.length+'</div><div class="lbl">累计记录</div></div>'+
    '<div class="stat"><div class="num">'+days+'</div><div class="lbl">记录天数</div></div>'+
    '<div class="stat"><div class="num">'+(days?Math.round(rs.length/days*10)/10:0)+'</div><div class="lbl">日均后悔</div></div>';
  const counts=TAGS.map((t,i)=>({t,i,c:rs.filter(r=>r.tag===i).length})).sort((a,b)=>b.c-a.c);
  const max=Math.max(1,...counts.map(x=>x.c));
  document.getElementById("tagBars").innerHTML = counts.map(x=>
    '<div class="bar-row"><div class="bl">'+x.t+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(x.c/max*100)+'%;background:'+COLORS[x.i]+'">'+x.c+'</div></div></div>'
  ).join("") + (rs.length?"":'<div class="empty">暂无数据</div>');
}

/* 年度报告 */
function renderReport(){
  const year=new Date().getFullYear();
  const rs=records().filter(r=>r.date.startsWith(year));
  const free=document.getElementById("reportFree");
  const lock=document.getElementById("reportLock");
  if(_get(STORE_KEY)!=="1"){ free.innerHTML=""; lock.style.display=""; return; }
  lock.style.display="none";
  const counts=TAGS.map((t,i)=>({t,i,c:rs.filter(r=>r.tag===i).length})).sort((a,b)=>b.c-a.c);
  const top=counts[0];
  const months=Array(12).fill(0);
  rs.forEach(r=>{months[parseInt(r.date.slice(5,7))-1]++});
  const maxM=Math.max(1,...months);
  const tips=[];
  if(top && top.c>0){
    const map={"消费":"可以试试给自己设一个 24 小时消费冷静期。","熬夜":"今晚试试把手机放到卧室之外。","情绪":"下次情绪上头时，先深呼吸十秒再开口。","拖延":"把大任务拆成 15 分钟就能开始的小块。","人际":"重要的话先在心里过一遍，重话缓一缓再说。"};
    tips.push("今年「"+top.t+"」类后悔出现了 "+top.c+" 次，是最高频。"+map[top.t]);
  }
  const q=Math.floor((new Date().getMonth())/3);
  const qs=[0,1,2,3].map(i=>rs.filter(r=>{const m=parseInt(r.date.slice(5,7));return i*3<m&&m<=i*3+3}).length);
  if(q>0){ tips.push(qs[q]>qs[q-1] ? "本季度后悔记录比上季度多（"+qs[q]+" vs "+qs[q-1]+"），节奏放慢一点，照顾好自己。" : qs[q]<qs[q-1] ? "本季度后悔记录比上季度少（"+qs[q]+" vs "+qs[q-1]+"），正在变好，继续保持。" : "本季度与上季度记录持平，稳定觉察也是一种进步。"); }
  free.innerHTML =
    '<div class="card" style="text-align:center"><div style="font-size:30px;font-weight:700">'+year+' 年度后悔清单</div><div style="color:var(--muted);font-size:13px;margin-top:6px">共 '+rs.length+' 条后悔 · 看见自己，才能改变</div></div>'+
    '<div class="sec-title">高频后悔类型</div><div class="card">'+
    (rs.length?counts.map(x=>'<div class="bar-row"><div class="bl">'+x.t+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(x.c/Math.max(1,top.c)*100)+'%;background:'+COLORS[x.i]+'">'+x.c+'</div></div></div>').join(""):'<div class="empty">今年还没有记录</div>')+'</div>'+
    '<div class="sec-title">逐月趋势</div><div class="card"><div class="months">'+
    months.map((v,i)=>'<div class="month"><div class="mcol" style="height:'+(v/maxM*90)+'px" title="'+(i+1)+'月: '+v+'条"></div><div class="mlbl">'+(i+1)+'</div></div>').join("")+
    '</div></div>'+
    '<div class="sec-title">个性化复盘</div><div class="card">'+(tips.length?tips.map(t=>'<div class="tip">'+t+'</div>').join(""):'<div class="empty">记录积累后会生成复盘建议</div>')+'</div>'+
    '<div class="center"><button class="btn" id="yearCard">生成年度海报</button> <button class="btn ghost" id="relock">收起报告</button></div>';
  document.getElementById("yearCard").onclick=()=>openYearCard(rs,counts,months,maxM);
  document.getElementById("relock").onclick=()=>{_del(STORE_KEY);renderReport()};
}
document.getElementById("unlockBtn").onclick=()=>{
  _set(STORE_KEY,"1");
  toast("已解锁（演示版免费体验）");
  renderReport();
};

/* 导出 */
document.getElementById("exportMd").onclick=()=>{
  const rs=records();
  let md="# "+new Date().getFullYear()+" 后悔清单\n\n";
  rs.forEach(r=>{ md+="- **"+r.date+"** "+esc(r.text)+(r.tag>=0?" `"+TAGS[r.tag]+"`":"")+(r.next?"　↪ "+esc(r.next):"")+"\n"; });
  download("后悔清单.md",md,"text/markdown");
};
document.getElementById("exportCsv").onclick=()=>{
  let csv="日期,内容,标签,下次怎么做\n";
  records().forEach(r=>{ csv+=[r.date,'"'+r.text.replace(/"/g,'""')+'"',r.tag>=0?TAGS[r.tag]:"","\""+(r.next||"").replace(/"/g,'""')+"\""].join(",")+"\n"; });
  download("后悔清单.csv","\ufeff"+csv,"text/csv");
};
function download(name,content,type){ toast("安装后可导出文件"); return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:type+";charset=utf-8"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

/* 分享卡片 */
function openCard(r){
  curCard=r;
  const c=document.getElementById("cardCanvas"),x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,600,800); g.addColorStop(0,"#1b1e2b"); g.addColorStop(1,"#2b2030");
  x.fillStyle=g; x.fillRect(0,0,600,800);
  x.fillStyle="#f0a35e"; x.font="bold 40px sans-serif"; x.fillText("💊 后悔药",50,100);
  x.fillStyle="#8b91a3"; x.font="20px sans-serif"; x.fillText("如果人生可以撤回，你最想撤回哪件事？",50,145);
  x.fillStyle="#e8eaf0"; x.font="28px sans-serif";
  wrapText(x,"「"+r.text+"」",50,260,500,46);
  if(r.next){ x.fillStyle="#3fbf9f"; x.font="20px sans-serif"; wrapText(x,"↪ 下次："+r.next,50,560,500,32); }
  if(r.tag>=0){ x.fillStyle=COLORS[r.tag]; x.font="bold 22px sans-serif"; x.fillText("#"+TAGS[r.tag],50,640); }
  x.fillStyle="#8b91a3"; x.font="18px sans-serif"; x.fillText(r.date,50,720);
  x.fillText("记录每天的后悔，少踩重复的坑",50,755);
  document.getElementById("cardModal").classList.add("show");
}
function openYearCard(rs,counts,months,maxM){
  const c=document.getElementById("cardCanvas"),x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,600,800); g.addColorStop(0,"#1b1e2b"); g.addColorStop(1,"#2b2030");
  x.fillStyle=g; x.fillRect(0,0,600,800);
  const y=new Date().getFullYear();
  x.fillStyle="#f0a35e"; x.font="bold 44px sans-serif"; x.fillText(y+" 年度后悔清单",50,110);
  x.fillStyle="#e8eaf0"; x.font="24px sans-serif"; x.fillText("共 "+rs.length+" 条后悔 · 看见自己，才能改变",50,160);
  counts.slice(0,5).forEach((t,i)=>{
    x.fillStyle="#8b91a3"; x.font="20px sans-serif"; x.fillText(t.t,60,250+i*50);
    x.fillStyle="#2c3140"; x.fillRect(150,234+i*50,340*t.c/Math.max(1,counts[0].c),26)||0;
    x.fillStyle=COLORS[t.i]; x.fillRect(150,234+i*50,Math.max(4,340*t.c/Math.max(1,counts[0].c)),26);
    x.fillStyle="#e8eaf0"; x.fillText(t.c,160+Math.max(4,340*t.c/Math.max(1,counts[0].c)),255+i*50);
  });
  x.fillStyle="#8b91a3"; x.font="18px sans-serif";
  x.fillText("💊 后悔药 · 记录每天的后悔，少踩重复的坑",50,760);
  document.getElementById("cardModal").classList.add("show");
}
function wrapText(x,text,px,py,maxW,lh){
  let line="",yy=py;
  for(const ch of text){ if(x.measureText(line+ch).width>maxW){ x.fillText(line,px,yy); line=ch; yy+=lh; } else line+=ch; }
  x.fillText(line,px,yy);
}
document.getElementById("dlCard").onclick=()=>{
  toast("安装后可保存卡片"); return;
  const a=document.createElement("a");
  a.href=document.getElementById("cardCanvas").toDataURL("image/png");
  a.download="后悔药卡片.png"; a.click();
};
document.getElementById("closeModal").onclick=()=>document.getElementById("cardModal").classList.remove("show");
document.getElementById("cardModal").onclick=e=>{ if(e.target.id==="cardModal") e.target.classList.remove("show"); };

document.getElementById("resetDemo").onclick=()=>{resetSamples(); document.getElementById("cardModal").classList.remove("show"); selTag=-1;curFilter=-1;curCard=null; inp.value="";document.getElementById("inputNext").value="";document.getElementById("charCount").textContent="0";picker.querySelectorAll(".tag").forEach(x=>x.classList.remove("sel"));document.querySelector("[data-tab=today]").click();renderToday();toast("已恢复示例");};
["exportMd","exportCsv","dlCard"].forEach(id=>{const b=document.getElementById(id);b.disabled=true;b.title="安装后可下载";});
const note=document.createElement("div"); note.className="hint"; note.textContent="安装后可导出文件和保存卡片"; document.querySelector("#tab-stats .center").appendChild(note);
renderToday();
</script>
