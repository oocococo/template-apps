

  <!-- ============================================================
       顶部导航栏：标题 + 搜索 + 等级 + 多选筛选标签 + 深浅色切换
       ============================================================ -->
  <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur-md dark:border-slate-700/80 dark:bg-slate-900/85">
    <div class="mx-auto max-w-7xl px-4 py-3 sm:px-6">

      <!-- 第一行：标题 + 结果数量 + 主题切换 -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl sm:text-3xl">🎈</span>
          <div>
            <h1 class="text-lg font-extrabold leading-tight tracking-tight sm:text-xl">气球塔防 · 气球图鉴</h1>
            <p class="hidden text-xs text-slate-400 sm:block">Bloons TD 6 Balloon Codex</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="hidden rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-500 sm:inline dark:bg-slate-800 dark:text-slate-400" id="resultCount">共 0 只</span>
          <button class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 bg-white text-base shadow-sm transition hover:bg-slate-100 dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700" id="themeToggle" title="切换深色 / 浅色模式" type="button">🌙</button>
        </div>
      </div>

      <!-- 第二行：搜索框 + 等级下拉 + 重置 -->
      <div class="mt-3 flex flex-col gap-2 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">🔍</span>
          <input autocomplete="off" class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-indigo-500/20" id="searchInput" placeholder="搜索气球名称 / 类型 / 特性，如：迷彩、MOAB、陶瓷…" type="text">
        </div>
        <!-- 按“等级”筛选：由 levelGroup() 依据 type/name 自动分组 -->
        <select class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:border-slate-600 dark:bg-slate-800 dark:focus:ring-indigo-500/20 sm:w-44" id="levelSelect">
          <option value="all">全部等级</option>
          <option value="基础层">基础层（红~粉）</option>
          <option value="强化层">强化层（黑/白/紫/彩虹）</option>
          <option value="铅层">铅层</option>
          <option value="陶瓷层">陶瓷层</option>
          <option value="MOAB级">MOAB 级</option>
          <option value="BFB级及以上">BFB 级及以上</option>
        </select>
        <button class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-500 shadow-sm transition hover:bg-slate-100 hover:text-slate-700 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700" id="resetBtn" type="button">重置筛选</button>
      </div>

      <!-- 第三行：多选筛选标签（类型 / 属性），由 JS 动态生成 -->
      <div class="mt-2.5 space-y-1.5">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="mr-0.5 text-xs font-medium text-slate-400">类型</span>
          <div class="flex flex-wrap gap-1.5" id="typeChips"></div>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="mr-0.5 text-xs font-medium text-slate-400">属性</span>
          <div class="flex flex-wrap gap-1.5" id="propChips"></div>
        </div>
      </div>

    </div>
  </header>

  <!-- ============================================================
       主体：气球卡片网格（响应式自动换行）
       ============================================================ -->
  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" id="cardGrid"></div>

    <!-- 空状态：没有匹配结果时显示 -->
    <div class="hidden py-20 text-center" id="emptyState">
      <div class="text-5xl">🔍</div>
      <p class="mt-3 text-base font-semibold">没有找到匹配的气球</p>
      <p class="mt-1 text-sm text-slate-400">换个关键词试试，或者重置筛选条件</p>
      <button class="mt-4 rounded-xl bg-indigo-500 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-indigo-600" id="emptyReset" type="button">重置筛选</button>
    </div>
  </main>

  <!-- ============================================================
       底部页脚：数据来源说明
       ============================================================ -->
  <footer class="border-t border-slate-200/80 py-6 dark:border-slate-700/80">
    <div class="mx-auto max-w-7xl px-4 text-center text-xs leading-relaxed text-slate-400 sm:px-6">
      <p>气球塔防 · 气球图鉴 ｜ 数据整理自 Bloons TD（猴子塔防）图鉴资料（bloonswiki / Bloons Wiki），仅供参考，具体数值请以游戏内为准</p>
      <p class="mt-1">主题设置保存在应用数据库</p>
    </div>
  </footer>

  <!-- ============================================================
       详情弹窗：原生 JS 实现，点击卡片打开 / 点遮罩或按 Esc 关闭
       ============================================================ -->
  <div aria-modal="true" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6" id="modal" role="dialog">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" id="modalMask"></div>
    <div class="nice-scroll relative z-10 max-h-[88vh] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white shadow-2xl ring-1 ring-slate-900/5 dark:bg-slate-800 dark:ring-white/10" id="modalPanel"></div>
  </div>
