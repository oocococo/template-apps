<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="报错诊所 ErrorClinic — 终端里的报错诊断台。粘贴堆栈，30 秒拿走排查清单。终端里的诊断台。" name="description">
<title>报错诊所 ErrorClinic — 终端里的诊断台</title>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090A'/%3E%3Ctext x='7' y='22' font-family='monospace' font-size='15' fill='%2301C886'%3E%26gt;_%3C/text%3E%3C/svg%3E" rel="icon">
<style>
:root{
  --bg:#08090A; --s1:#101014; --s2:#16171C; --s3:#1E1F25;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#F7F8F8; --t2:#9CA3AF; --t3:#6B7280;
  --accent:#01C886; --accent-d:rgba(1,200,134,.13); --amber:#F0B429; --danger:#E5484D;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Microsoft YaHei',monospace;
  --sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r1:6px; --r2:8px; --r3:12px;
  --ez:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.65;
  display:grid;grid-template-rows:44px 1fr 30px;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(1,200,134,.28);color:#fff}
button{font-family:var(--mono);cursor:pointer;background:none;border:none;color:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26272E;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#rain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .4s}
#rain.on{opacity:.16}
.scanlines{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .3s;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.28) 2px 3px)}
.scanlines.on{opacity:.5}
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(640px 320px at 18% -5%,rgba(1,200,134,.07),transparent 70%),
             radial-gradient(520px 300px at 85% 110%,rgba(240,180,41,.045),transparent 70%)}

/* ---------- titlebar ---------- */
.titlebar{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--s1);
  border-bottom:1px solid var(--line);position:relative;z-index:10}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.d-r{background:#FF5F57}.d-y{background:#FEBC2E}.d-g{background:#28C840}
.tb-title{font-family:var(--mono);font-size:12px;color:var(--t3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-btn{font-size:11.5px;color:var(--t2);border:1px solid var(--line2);border-radius:var(--r1);
  padding:4px 10px;transition:all .15s var(--ez);white-space:nowrap}
.tb-btn:hover{color:var(--accent);border-color:rgba(1,200,134,.45);background:var(--accent-d)}
.tb-badge{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid rgba(1,200,134,.35);
  background:var(--accent-d);border-radius:99px;padding:3px 10px;white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:0;position:relative;z-index:5}
.sidebar{background:var(--s1);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand-mark{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--accent);border:1px solid rgba(1,200,134,.4);
  background:var(--accent-d);border-radius:var(--r1);padding:3px 7px;letter-spacing:.04em}
.brand-name{font-family:var(--mono);font-size:13px;font-weight:700}
.brand-name small{display:block;font-size:10px;color:var(--t3);font-weight:400}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r2);font-family:var(--mono);
  font-size:12.5px;color:var(--t2);transition:all .15s var(--ez);width:100%;text-align:left;border:1px solid transparent}
.nav-item .k{color:var(--t3);font-size:11px;margin-left:auto}
.nav-item:hover{color:var(--text);background:var(--s2)}
.nav-item.active{color:var(--accent);background:var(--accent-d);border-color:rgba(1,200,134,.25)}
.nav-item.active .k{color:var(--accent)}
.side-foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--line);font-family:var(--mono);
  font-size:10.5px;color:var(--t3);line-height:1.7}
.side-foot b{color:var(--amber);font-weight:500}

.main{overflow-y:auto;padding:26px 30px 60px;min-width:0}
.view{max-width:920px;margin:0 auto;animation:fadein .35s var(--ez)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- diagnose: hero ---------- */
.hero{padding:18px 0 26px}
.ascii{font-family:var(--mono);font-size:clamp(7px,1.5vw,11px);line-height:1.25;color:var(--accent);
  text-shadow:0 0 14px rgba(1,200,134,.35);white-space:pre;overflow-x:auto;user-select:none}
.hero-tag{margin-top:14px;font-family:var(--mono);color:var(--t2);font-size:13px}
.hero-tag .p{color:var(--amber)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-sub{margin-top:10px;color:var(--t2);font-size:13.5px;max-width:640px}
.hero-sub b{color:var(--text);font-weight:500}

.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:18px 20px;margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h .no{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid rgba(1,200,134,.35);
  border-radius:var(--r1);padding:2px 7px;background:var(--accent-d)}
.panel-h h3{font-size:14.5px;font-weight:500;font-family:var(--mono)}
.panel-h .hint{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--t3)}

textarea#raw{width:100%;min-height:170px;resize:vertical;background:var(--bg);border:1px solid var(--line2);
  border-radius:var(--r2);padding:14px 16px;color:var(--text);font-family:var(--mono);font-size:12.5px;line-height:1.7}
textarea#raw::placeholder{color:var(--t3)}
textarea#raw:focus{outline:none;border-color:rgba(1,200,134,.5);box-shadow:0 0 0 3px rgba(1,200,134,.08)}
.toolbar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn{font-size:12.5px;padding:8px 16px;border-radius:var(--r2);border:1px solid var(--line2);color:var(--t2);
  transition:all .15s var(--ez);display:inline-flex;align-items:center;gap:7px}
.btn:hover{color:var(--text);border-color:var(--line2);background:var(--s2)}
.btn.primary{color:#03130C;background:var(--accent);border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:#2AE9A4;box-shadow:0 0 18px rgba(1,200,134,.25)}
.btn.warn:hover{color:var(--danger);border-color:rgba(229,72,77,.45)}
.btn:disabled{opacity:.45;pointer-events:none}
.drop-hint{font-family:var(--mono);font-size:11px;color:var(--t3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--t2);border:1px dashed var(--line2);border-radius:99px;
  padding:5px 13px;transition:all .15s var(--ez)}
.chip:hover{color:var(--accent);border-color:rgba(1,200,134,.5);border-style:solid}
.langstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--t3)}
.langstrip span{border:1px solid var(--line);border-radius:var(--r1);padding:3px 8px}

/* ---------- parsing animation ---------- */
.parsing{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line2);
  border-radius:var(--r2);padding:16px;min-height:120px;position:relative;overflow:hidden}
.parsing .scan{position:absolute;left:0;right:0;height:44px;top:-44px;
  background:linear-gradient(180deg,transparent,rgba(1,200,134,.12),transparent);animation:scan 1s linear infinite}
@keyframes scan{to{top:100%}}
.plog{color:var(--t2);white-space:pre-wrap}
.plog b{color:var(--accent);font-weight:500}
.plog i{color:var(--amber);font-style:normal}

/* ---------- report ---------- */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.report-grid{grid-template-columns:1fr}}
.filecard{background:var(--s2);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.fc-row{display:flex;gap:8px;align-items:baseline;margin:5px 0;font-family:var(--mono);font-size:12.5px;flex-wrap:wrap}
.fc-row .k{color:var(--t3);width:64px;flex-shrink:0}
.fc-row .v{color:var(--text);word-break:break-all}
.fc-row .v.hl{color:var(--accent)}
.badge{font-family:var(--mono);font-size:10.5px;border-radius:var(--r1);padding:2px 8px;border:1px solid var(--line2);color:var(--t2)}
.badge.lang{color:var(--accent);border-color:rgba(1,200,134,.4);background:var(--accent-d)}
.badge.fp{color:var(--amber);border-color:rgba(240,180,41,.35);background:rgba(240,180,41,.08)}
.badge.n{color:var(--danger);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.08)}
.ascii-report{font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--accent);white-space:pre;
  overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;min-height:96px}
.cause{margin:12px 0}
.cause-top{display:flex;align-items:center;gap:10px;font-size:13px}
.cause-top .p{font-family:var(--mono);font-size:11.5px;color:var(--amber);width:44px;text-align:right;flex-shrink:0}
.bar{flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#854F0B,var(--amber));border-radius:4px;
  transition:width .7s var(--ez)}
.cause-why{font-size:12px;color:var(--t3);margin:3px 0 0 54px}
.check{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r2);
  margin:8px 0;cursor:pointer;transition:all .15s var(--ez);background:var(--s2)}
.check:hover{border-color:var(--line2)}
.check.done{border-color:rgba(1,200,134,.35);background:var(--accent-d)}
.check .box{width:16px;height:16px;border:1.5px solid var(--t3);border-radius:4px;flex-shrink:0;margin-top:3px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#03130C;transition:all .15s var(--ez)}
.check.done .box{background:var(--accent);border-color:var(--accent)}
.check .tx{font-size:13px;color:var(--text)}
.check.done .tx{color:var(--t2);text-decoration:line-through;text-decoration-color:rgba(1,200,134,.5)}
.check .cmd{font-family:var(--mono);font-size:11px;color:var(--amber);background:rgba(240,180,41,.08);
  border:1px solid rgba(240,180,41,.22);border-radius:var(--r1);padding:2px 8px;margin-top:5px;display:inline-block;word-break:break-all}
.ring-wrap{display:flex;align-items:center;gap:14px;margin:4px 0 10px}
.ring{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--s2);border:1px solid var(--line)}
.ring b{font-weight:500}
.verify{font-size:13px;color:var(--t2)}
.verify b{color:var(--text);font-weight:500}

/* ---------- kb ---------- */
.kb-tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.kb-tools input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:9px 14px;color:var(--text);font-family:var(--mono);font-size:12.5px}
.kb-tools input:focus{outline:none;border-color:rgba(1,200,134,.5)}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.kb-card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:15px 16px;
  transition:all .15s var(--ez);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.kb-card:hover{border-color:rgba(1,200,134,.35);transform:translateY(-2px)}
.kb-card .t{font-family:var(--mono);font-size:13px;color:var(--accent);word-break:break-all}
.kb-card .m{font-size:12px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto}
.kb-card .tm{font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-left:auto}
.empty{border:1px dashed var(--line2);border-radius:var(--r3);padding:44px 20px;text-align:center;color:var(--t3);
  font-family:var(--mono);font-size:12.5px}
.kb-detail{background:var(--s1);border:1px solid rgba(1,200,134,.3);border-radius:var(--r3);padding:18px 20px;margin-bottom:16px}
.kb-detail pre{font-family:var(--mono);font-size:11.5px;color:var(--t2);background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r2);padding:12px;overflow-x:auto;max-height:220px;white-space:pre-wrap;word-break:break-all}
.kb-notes{width:100%;margin-top:10px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);
  padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:12px;min-height:56px;resize:vertical}
.kb-notes:focus{outline:none;border-color:rgba(1,200,134,.5)}

/* ---------- samples ---------- */
.smp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.smp{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:16px;display:flex;
  flex-direction:column;gap:9px;transition:all .15s var(--ez)}
.smp:hover{border-color:rgba(1,200,134,.4);transform:translateY(-2px)}
.smp .t{font-family:var(--mono);font-size:13px;color:var(--text)}
.smp .d{font-size:12px;color:var(--t2);flex:1}
.smp .go{font-family:var(--mono);font-size:11.5px;color:var(--accent);align-self:flex-start;
  border:1px solid rgba(1,200,134,.35);border-radius:var(--r1);padding:5px 12px;transition:all .15s var(--ez)}
.smp .go:hover{background:var(--accent-d)}

/* ---------- about ---------- */
.prose h2{font-family:var(--mono);font-size:15px;color:var(--accent);margin:26px 0 10px;font-weight:500}
.prose h2:first-child{margin-top:0}
.prose p{color:var(--t2);font-size:13.5px;max-width:760px;margin-bottom:10px}
.prose p b,.prose li b{color:var(--text);font-weight:500}
.prose ul{padding-left:18px;color:var(--t2);font-size:13.5px;margin-bottom:10px}
.prose li{margin:4px 0}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;
  padding:2px 7px;color:var(--t2);background:var(--s2)}
table.km{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
table.km td{border:1px solid var(--line);padding:8px 12px;color:var(--t2)}
table.km td:first-child{font-family:var(--mono);color:var(--accent);width:130px;white-space:nowrap}

/* ---------- statusbar ---------- */
.statusbar{display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--s1);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--t3);position:relative;z-index:10;overflow:hidden}
.statusbar .live{color:var(--accent)}
.statusbar .sp{margin-left:auto}
.statusbar button{font-size:10.5px;color:var(--t3)}
.statusbar button:hover{color:var(--accent)}

/* ---------- palette ---------- */
.palette{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;
  padding-top:14vh;background:rgba(4,5,6,.72)}
.palette.hidden{display:none}
.palette-box{width:min(520px,92vw);background:var(--s1);border:1px solid var(--line2);border-radius:var(--r3);
  overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.palette-box input{width:100%;background:var(--bg);border:none;border-bottom:1px solid var(--line);
  padding:14px 16px;color:var(--text);font-family:var(--mono);font-size:13.5px}
.palette-box input:focus{outline:none}
.plist{max-height:300px;overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:var(--r2);
  font-family:var(--mono);font-size:12.5px;color:var(--t2);transition:background .12s}
.pitem .ic{color:var(--accent);width:20px;text-align:center}
.pitem .k{margin-left:auto;font-size:10.5px;color:var(--t3)}
.pitem.sel,.pitem:hover{background:var(--s2);color:var(--text)}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:46px;right:18px;z-index:90;font-family:var(--mono);font-size:12px;color:var(--accent);
  background:var(--s1);border:1px solid rgba(1,200,134,.4);border-radius:var(--r2);padding:10px 16px;
  opacity:0;transform:translateY(8px);transition:all .3s var(--ez);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:none}

.page-h{font-family:var(--mono);font-size:17px;font-weight:500;margin-bottom:4px}
.page-h span{color:var(--accent)}
.page-sub{font-size:13px;color:var(--t3);margin-bottom:22px}
.sec-gap{height:8px}

@media (max-width:860px){
  body{grid-template-rows:44px 1fr 56px}
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;right:0;bottom:30px;height:56px;flex-direction:row;align-items:center;gap:2px;
    border-right:none;border-top:1px solid var(--line);padding:0 6px;z-index:40;overflow-x:auto}
  .brand,.side-foot{display:none}
  .nav-item{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px;flex:1;min-width:64px;text-align:center}
  .nav-item .k{display:none}
  .main{padding:18px 14px 90px}
  .statusbar{font-size:9.5px;gap:10px;bottom:0}
  .statusbar .sp{display:none}
  .hero{padding:6px 0 18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- festive theme ---------- */
body.fest{--accent:#FFB020;--accent-d:rgba(255,176,32,.14)}
body.fest .ascii,body.fest .ascii-report{color:#FFB020;text-shadow:0 0 14px rgba(255,176,32,.4)}
body.fest .brand-mark,body.fest .tb-badge,body.fest .badge.lang,body.fest .nav-item.active,
body.fest .panel-h .no{color:#FFB020;border-color:rgba(255,176,32,.45)!important;background:rgba(255,176,32,.12)!important}
body.fest .btn.primary{color:#1A1205;background:#FFB020;border-color:#FFB020}
body.fest .btn.primary:hover{background:#FFC857;box-shadow:0 0 18px rgba(255,176,32,.3)}
body.fest ::selection{background:rgba(255,176,32,.3)}
body.fest .ring,body.fest .cause .bar i{color:#FFB020}
body.fest .check.done{border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.12)}
body.fest .check.done .box{background:#FFB020;border-color:#FFB020}
body.fest .cursor,body.fest #rain{color:#FFB020}

/* ---------- stats / sort / import ---------- */
.kb-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;flex:1;min-width:118px}
.stat .n{font-family:var(--mono);font-size:22px;color:var(--accent);font-weight:700;line-height:1.1}
.stat .l{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:3px}
.sel{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);color:var(--t2);

function extractType(raw){
  var m=raw.match(/\b([\w.]+(?:Exception|Error|Panic))\b/)||raw.match(/error (TS\d+):/)||
        raw.match(/^(panic: [^\n]+)/m)||raw.match(/^([\w.]+Error):/m)||raw.match(/^(\w+):/m);
  if(m)return (m[1]||m[0]).replace(/:$/,'').trim().slice(0,60);
  var l=raw.split('\n').filter(function(x){return x.trim()})[0]||'';
  return l.trim().slice(0,60)||'Unknown error';
}
function extractMessage(raw,type){
  var lines=raw.split('\n');
  for(var i=0;i<lines.length&&i<25;i++){
    var l=lines[i].trim();
    if(l.indexOf(type)>=0&&l.length>type.length){return l.slice(l.indexOf(type)+type.length).replace(/^[:：\s]+/,'').trim().slice(0,200)}
    if(/^(KeyError|panic|Segmentation fault|docker:|Access to fetch)/.test(l))return l.slice(0,200);
  }
  var f=lines.filter(function(x){return x.trim()})[0]||'';
  return f.trim().slice(0,200);
}
function extractFrames(raw){
  var out=[],re=/([\w.\-\/]+\.(?:java|kt|py|js|mjs|cjs|ts|go|rs|c|cc|cpp|h|rb|php))["']?(?::|:|, line )(\d+)/g,m;
  while((m=re.exec(raw))!==null&&out.length<12){out.push({file:m[1],line:parseInt(m[2],10)})}
  var seen={},u=[];
  out.forEach(function(f){var k=f.file+':'+f.line;if(!seen[k]){seen[k]=1;u.push(f)}});
  return u;
}
function normalizeMsg(msg){
  return String(msg||'').toLowerCase()
    .replace(/0x[0-9a-f]+/g,'0xH')
    .replace(/\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/g,'UUID')
    .replace(/\d+/g,'N').replace(/[\/\\][\w.\-\/\\]+/g,'PATH')
    .replace(/\s+/g,' ').trim().slice(0,120);

function diagnose(raw){
  var sig=parse(raw),best=null,bs=0;
  for(var i=0;i<RULES.length;i++){var s=RULES[i].score(sig);if(s>bs){bs=s;best=RULES[i]}}
  if(!best||bs<0.5){best=FALLBACK;bs=Math.max(bs,0.42)}
  return {sig:sig,rule:best,confidence:Math.min(bs,0.98),causes:best.causes,checks:best.checks.map(function(c){return {t:c.t,cmd:c.cmd||'',done:false}}),verify:best.verify};
}
// 诊断异常兜底：解析或规则匹配异常时回退到通用清单，并保留错误信息
function safeDiagnose(raw){
  try{
    var d=diagnose(raw);
    if(d&&d.sig&&d.rule)return d;
    return {sig:safeParse(raw),rule:FALLBACK,confidence:0.42,causes:FALLBACK.causes,
      checks:FALLBACK.checks.map(function(c){return {t:c.t,cmd:c.cmd||'',done:false}}),verify:FALLBACK.verify};
  }catch(e){
    return {sig:safeParse(raw),rule:FALLBACK,confidence:0.42,causes:FALLBACK.causes,
      checks:FALLBACK.checks.map(function(c){return {t:c.t,cmd:c.cmd||'',done:false}}),verify:FALLBACK.verify,
      error:String((e&&e.message)||e)};
  }
}

function bindView(){

    });
    var rawEl=$('#raw');
    if(rawEl){rawEl.focus();rawEl.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();runDiagnose()}})}
  }

    $('#btn-new').onclick=function(){state.diag=null;render()};
    $('#btn-copy').onclick=function(){copyText(diagMarkdown(state.diag),'已复制 Markdown 诊断报告')};
    var copyRaw=$('#btn-copy-raw');if(copyRaw)copyRaw.onclick=function(){copyText(state.diag.sig.raw,'已复制原始堆栈')};
    $('#btn-save').onclick=saveToKB;
    $$('.check').forEach(function(el){
      function toggle(){
        var i=+el.getAttribute('data-ci');

        el.setAttribute('aria-checked',state.diag.checks[i].done?'true':'false');
        el.querySelector('.box').textContent=state.diag.checks[i].done?'✓':'';
        var dn=state.diag.checks.filter(function(c){return c.done}).length;

        $('#ring').innerHTML='<b>'+p+'%</b>';
        el.closest('.panel').querySelector('.ring-wrap div:last-child').textContent=dn+' / '+state.diag.checks.length+' 已完成';
      }
      el.onclick=toggle;
      el.onkeydown=function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}};
    });
    typeAscii($('#ascii-report'),reportAscii(state.diag));
  }
  if(state.view==='kb'){
    var q=$('#kb-q');
    if(q){q.oninput=function(){state.filter.q=q.value;var p=q.selectionStart;render();var nq=$('#kb-q');nq.focus();nq.setSelectionRange(p,p)}}
    var sortSel=$('#kb-sort');if(sortSel){sortSel.value=state.kbSort||'recent';sortSel.onchange=function(){state.kbSort=sortSel.value;render()}}
    var imp=$('#kb-import');if(imp)imp.onchange=importKB;
    var exj=$('#btn-kb-export-json');if(exj)exj.onclick=function(){if(!state.kb.length){toast('错题本是空的')}else copyText(kbJSON(),'已导出 '+state.kb.length+' 条错题 JSON')};
    $$('[data-lang]').forEach(function(b){b.onclick=function(){state.filter.lang=b.getAttribute('data-lang');render()}});
    $$('.kb-card').forEach(function(c){c.onclick=function(){
      var fp=c.getAttribute('data-fp');
      state.detail=null;for(var i=0;i<state.kb.length;i++){if(state.kb[i].fp===fp)state.detail=state.kb[i]}
      render();
    }});
    if(state.detail){
      $('#btn-kb-back').onclick=function(){state.detail=null;render()};
      $('#btn-notes-save').onclick=function(){state.detail.notes=$('#kb-notes').value;saveKB();toast('正在保存备注')};
      $('#btn-kb-del').onclick=function(){
        state.kb=state.kb.filter(function(e){return e.fp!==state.detail.fp});
        state.detail=null;saveKB();render();toast('正在删除条目');
      };
    }
    var ex=$('#btn-kb-export');
    if(ex)ex.onclick=function(){copyText(kbMarkdown(),'已导出 '+state.kb.length+' 条错题 Markdown')};
    var cl=$('#btn-kb-clear');
    if(cl)cl.onclick=function(){
      if(confirm('确认清空全部 '+state.kb.length+' 条错题记录？此操作不可恢复。')){state.kb=[];state.detail=null;saveKB();render();toast('正在清空错题本')}
    };

    $$('[data-smp]').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-smp');
      for(var i=0;i<SAMPLES.length;i++){if(SAMPLES[i].id===id){state.view='diagnose';state.diag=null;render();$('#raw').value=SAMPLES[i].raw;runDiagnose();return}}
    }});

/* ================= diagnose flow ================= */
function runDiagnose(){
  var ta=$('#raw');if(!ta){toast('诊断台未就绪');return}
  var raw=ta.value.trim();
  if(raw.length<8){toast('内容太短，至少贴几行堆栈');return}
  try{
    var gen=++state.parseGen;
    var box=$('#main');
    if(!box)return;
    box.innerHTML='<div class="view"><div class="panel"><div class="panel-h"><span class="no">01</span><h3>parsing…</h3><span class="hint">clinic parse --lang auto</span></div>'
      +'<div class="parsing"><div class="scan"></div><div class="plog" id="plog"></div></div></div></div>';
    var steps=[
      function(){return '> 读取输入 <i>'+raw.length+'</i> 字符'},
      function(){var d=safeDiagnose(raw);return '> 检测语言 <b>'+esc(LANG_NAME[d.sig.lang]||d.sig.lang)+'</b>'},
      function(){var d=safeDiagnose(raw);return '> 提取类型 <b>'+esc(d.sig.type)+'</b> · 根因帧 <b>'+d.sig.frames.length+'</b> 个'},
      function(){var d=safeDiagnose(raw);return '> 计算指纹 <b>'+esc(d.sig.fp)+'</b>'},
      function(){var d=safeDiagnose(raw);return '> 匹配规则 <b>'+esc(d.rule.id)+'</b> (conf '+(d.confidence*100).toFixed(0)+'%)'},
      function(){return '> 生成三阶排查清单 <b>OK</b>'}
    ];
    var i=0,log=$('#plog');
    function next(){
      if(gen!==state.parseGen)return;
      var line=document.createElement('div');line.innerHTML=steps[i]();log.appendChild(line);
      i++;
      if(i<steps.length){setTimeout(next,REDUCED?10:220)}
      else{setTimeout(function(){if(gen===state.parseGen){state.diag=safeDiagnose(raw);render()}},REDUCED?10:420)}
    }
    next();
  }catch(e){
    // 任何意外都不应让 UI 卡死：回退到输入视图并保留原文
    toast('解析过程出现异常，已安全恢复输入');
    try{state.diag=null;render();var r=$('#raw');if(r)r.value=raw}catch(_){}
  }
}
function saveToKB(){
  var d=state.diag,s=d.sig,now=Date.now(),hit=null;
  for(var i=0;i<state.kb.length;i++){if(state.kb[i].fp===s.fp)hit=state.kb[i]}
  if(hit){hit.count++;hit.lastSeen=now;hit.raw=s.raw;
    if(hit.count>=3)toast('第 '+hit.count+' 次踩同一个坑了 — 建议写进团队 wiki');
    else toast('正在更新记录：第 '+hit.count+' 次踩坑');
  }else{
    state.kb.unshift({fp:s.fp,lang:s.lang,type:s.type,message:s.message,frames:s.frames,raw:s.raw,
      firstSeen:now,lastSeen:now,count:1,notes:''});
    toast('正在保存错题 · '+s.fp);
  }
  saveKB();render();
}

/* ================= markdown ================= */
function diagMarkdown(d){
  var s=d.sig,L=[];
  L.push('# 诊断报告 · '+s.type);L.push('');
  L.push('- 语言：'+(LANG_NAME[s.lang]||s.lang)+' · 指纹：`'+s.fp+'` · 规则：`'+d.rule.id+'`（置信度 '+(d.confidence*100).toFixed(0)+'%）');
  if(s.frames.length)L.push('- 根因帧：'+s.frames.map(function(f){return f.file+':'+f.line}).join(' → '));
  L.push('');L.push('## 最可能的原因');
  d.causes.forEach(function(c,i){L.push((i+1)+'. '+c.t+'（'+Math.round(c.p*100)+'%）— '+c.w)});
  L.push('');L.push('## 排查清单');
  d.checks.forEach(function(c){L.push('- ['+(c.done?'x':' ')+'] '+c.t+(c.cmd?' `'+c.cmd.trim()+'`':''))});
  L.push('');L.push('## 验证');L.push(d.verify);
  L.push('');L.push('```');L.push(s.raw.slice(0,800));L.push('```');
  return L.join('\n');
}
function kbMarkdown(){
  var L=['# 错题本导出 · '+new Date().toLocaleString('zh-CN'),''];
  state.kb.forEach(function(e){
    L.push('## '+e.type+' `'+e.fp+'` ×'+e.count);
    L.push('- '+(LANG_NAME[e.lang]||e.lang)+' · 首次 '+new Date(e.firstSeen).toLocaleString('zh-CN')+' · 最近 '+new Date(e.lastSeen).toLocaleString('zh-CN'));
    if(e.message)L.push('- '+e.message);
    if(e.notes)L.push('- 备注：'+e.notes);
    L.push('');
  });
  return L.join('\n');
}
function kbJSON(){
  return JSON.stringify(state.kb.map(function(e){
    return {fp:e.fp,lang:e.lang,type:e.type,message:e.message,frames:e.frames||[],raw:e.raw||'',
      firstSeen:e.firstSeen,lastSeen:e.lastSeen,count:e.count,notes:e.notes||''};
  }),null,2);
}
function importKB(ev){
  var f=ev&&ev.target&&ev.target.files&&ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onerror=function(){toast('文件读取失败，请重试')};
  rd.onload=function(){
    try{
      var arr=JSON.parse(String(rd.result));
      if(!Array.isArray(arr))throw new Error('不是合法的错题本数组');
      var added=0;
      arr.forEach(function(e){
        if(!e||!e.fp)return;
        var hit=null;
        for(var i=0;i<state.kb.length;i++){if(state.kb[i].fp===e.fp){hit=state.kb[i];break}}
        if(hit){hit.count=Math.max(hit.count||1,e.count||1);hit.lastSeen=Math.max(hit.lastSeen||Date.now(),e.lastSeen||Date.now());if(e.notes)hit.notes=e.notes;}
        else{state.kb.unshift({fp:e.fp,lang:e.lang||'unknown',type:e.type||'Unknown',message:e.message||'',frames:e.frames||[],raw:e.raw||'',firstSeen:e.firstSeen||Date.now(),lastSeen:e.lastSeen||Date.now(),count:e.count||1,notes:e.notes||''});added++}
      });
      saveKB();render();toast('正在保存导入的 '+added+' 条新错题（重复指纹已合并）');
    }catch(e){toast('JSON 解析失败：'+(e.message||e))}
  };
  rd.readAsText(f);
  try{ev.target.value=''}catch(_){}
}

/* ================= typewriter ================= */
function typeAscii(el,text){
  if(REDUCED){el.textContent=text;return}
  el.textContent='';var i=0;
  (function tick(){
    if(i<text.length){el.textContent+=text.charAt(i);i++;setTimeout(tick,7)}
  })();
}

/* ================= binary rain ================= */
var rainOn=false,rainRAF=null;
function initRain(){
  var cv=$('#rain'),ctx=cv.getContext('2d');
  function resize(){cv.width=innerWidth;cv.height=innerHeight}
  resize();addEventListener('resize',resize);
  var cols=[],fs=14;
  function reset(){cols=[];var n=Math.floor(cv.width/fs);for(var i=0;i<n;i++)cols.push({y:Math.random()*-50,s:(Math.random()*1.5+0.6)})}
  function frame(){
    if(!rainOn)return;
    ctx.fillStyle='rgba(8,9,10,.12)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font=fs+'px monospace';
    for(var i=0;i<cols.length;i++){
      var c=cols[i],ch=Math.random()>.5?'1':'0';
      ctx.fillStyle=Math.random()>.985?'#E6FFF4':'#01C886';
      ctx.fillText(ch,i*fs,c.y*fs);
      c.y+=c.s;
      if(c.y*fs>cv.height&&Math.random()>.975)c.y=0;
    }
    rainRAF=requestAnimationFrame(frame);
  }
  window.toggleRain=function(){
    rainOn=!rainOn;
    cv.classList.toggle('on',rainOn);
    if(rainOn){reset();frame();toast('二进制雨已开启 — ERROR CLINIC，祝排查顺利')}
    else{cancelAnimationFrame(rainRAF);ctx.clearRect(0,0,cv.width,cv.height);toast('二进制雨已关闭')}
  };
}

 {ic:'⤓',t:'导出错题本 Markdown',k:'',run:function(){if(!state.kb.length){toast('错题本是空的')}else copyText(kbMarkdown(),'已导出 '+state.kb.length+' 条错题 Markdown')}},
 {ic:'⤓',t:'导出错题本 JSON',k:'',run:function(){if(!state.kb.length){toast('错题本是空的')}else copyText(kbJSON(),'已导出 '+state.kb.length+' 条错题 JSON')}},

 {ic:'▭',t:'切换 CRT 扫描线',k:'',run:function(){window.toggleCRT()}},
 {ic:'?',t:'帮助：粘贴任意堆栈开始诊断',k:'',run:function(){setView('diagnose');toast('把堆栈贴进诊断台，按 ⌘K 随时回来')}}
];
function initPalette(){
  var pal=$('#palette'),inp=$('#palette-input'),list=$('#palette-list'),sel=0;
  function draw(q){
    q=(q||'').toLowerCase();
    var items=CMDS.filter(function(c){return !q||c.t.toLowerCase().indexOf(q)>=0||(q==='rain'&&c.t.indexOf('二进制')>=0)});
    if(q==='rain')items=[CMDS[4]];
    if(!items.length){list.innerHTML='<div style="padding:14px;color:var(--t3);font-family:var(--mono);font-size:12px">没有匹配命令</div>';return}
    sel=0;
    list.innerHTML=items.map(function(c,i){
      return '<button class="pitem'+(i===0?' sel':'')+'" data-i="'+CMDS.indexOf(c)+'"><span class="ic">'+c.ic+'</span>'+esc(c.t)+(c.k?'<span class="k">'+c.k+'</span>':'')+'</button>';
    }).join('');
    $$('.pitem',list).forEach(function(b){
      b.onclick=function(){close();CMDS[+b.getAttribute('data-i')].run()};
    });
  }
  function open(){pal.classList.remove('hidden');inp.value='';draw('');inp.focus()}
  function close(){pal.classList.add('hidden')}
  window.__closePalette=close;
  $('#btn-palette').onclick=open;
  pal.onclick=function(e){if(e.target===pal)close()};
  inp.oninput=function(){draw(inp.value)};
  inp.onkeydown=function(e){
    var items=$$('.pitem',list);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!items.length)return;
      items[sel].classList.remove('sel');
      sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items[sel].classList.add('sel');
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(items.length){close();CMDS[+items[sel].getAttribute('data-i')].run()}
    }else if(e.key==='Escape'){close()}
  };
}

  window.toggleFest=function(){var on=document.body.classList.toggle('fest');toast(on?'终端节日配色已开启 🎉':'已恢复默认配色')};
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').classList.contains('hidden')?$('#btn-palette').click():window.__closePalette()}
    else if(e.key==='F1'){e.preventDefault();setView('diagnose')}
    else if(e.key==='F2'){e.preventDefault();setView('kb')}
    else if(e.key==='F3'){e.preventDefault();setView('samples')}
    else if(e.key==='F4'){e.preventDefault();setView('about')}
    else if(e.key==='Escape'){window.__closePalette()}
    else if(e.key==='/'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){
      e.preventDefault();
      if(state.view!=='diagnose')setView('diagnose');
      setTimeout(function(){var r=$('#raw');if(r)r.focus()},60);
    }
  });
  document.addEventListener('dragover',function(e){e.preventDefault()});
  document.addEventListener('drop',function(e){
    e.preventDefault();
    var file=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!file)return;
    if(file.size>512*1024){toast('文件过大（>512KB），请只贴关键堆栈');return}
    var rd=new FileReader();
    rd.onerror=function(){toast('文件读取失败，请重试')};
    rd.onload=function(){
      if(state.view!=='diagnose'){state.view='diagnose';state.diag=null;render()}
      $('#raw').value=String(rd.result).slice(0,8000);runDiagnose();
    };
    rd.readAsText(file);
  });
  if(REDUCED)toast('已检测到减弱动效偏好，动画已简化');
  toast('ErrorClinic v1.0.0 就绪 — 粘贴堆栈或点样本库试试');
}
function start(){window.clinicStore.load().then(function(raw){var saved=JSON.parse(raw);if(Array.isArray(saved))state.kb=saved;init()}).catch(function(){document.body.textContent='数据库读取失败，请检查登录和连接后刷新。';});}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',start):start();
})();
</script>
</body>
</html>
