<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    --pink:#ff2e63; --pink2:#ff6b9d; --purple:#a66bff; --bg1:#fff0f5; --bg2:#f3e8ff;
    --ink:#2b2b3a; --sub:#8a8a9a; --card:#ffffff; --line:#f0e6ef;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    min-height:100vh;
    padding:18px 14px 40px;
  }
  .wrap{max-width:520px; margin:0 auto;}
  header{text-align:center; padding:14px 6px 6px;}
  .logo{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,var(--pink),var(--purple));
    padding:6px 14px; border-radius:999px; letter-spacing:.5px;
  }
  h1{font-size:25px; margin:14px 0 6px; font-weight:800; letter-spacing:.5px;}
  h1 .hl{background:linear-gradient(135deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sub{color:var(--sub); font-size:13px; line-height:1.6; margin:0 auto; max-width:380px;}
  .panel{background:var(--card); border-radius:20px; padding:16px 14px; margin-top:16px; box-shadow:0 10px 30px rgba(166,107,255,.10);}
  .label{font-size:13px; font-weight:700; color:var(--ink); margin:0 0 10px; display:flex; align-items:center; gap:6px;}
  .label .dot{width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--purple));}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:9px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .15s ease; user-select:none;
  }
  .chip:active{transform:scale(.95);}
  .chip.on{
    border-color:transparent; color:#fff;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    box-shadow:0 6px 16px rgba(255,46,99,.25);
  }
  .row{margin-top:14px;}
  .gen{
    width:100%; margin-top:18px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    color:#fff; font-size:17px; font-weight:800; letter-spacing:1px;
    padding:16px; border-radius:16px; box-shadow:0 12px 26px rgba(255,46,99,.30);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .gen:active{transform:translateY(2px); box-shadow:0 6px 16px rgba(255,46,99,.25);}
  .results{margin-top:18px; display:flex; flex-direction:column; gap:14px;}
  .rcard{
    background:var(--card); border-radius:18px; padding:16px 15px 14px;
    box-shadow:0 8px 22px rgba(166,107,255,.10); border:1px solid var(--line);
    position:relative; animation:pop .28s ease both;
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
  .rtag{position:absolute; top:-9px; left:14px; font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--pink2),var(--purple)); padding:3px 10px; border-radius:999px;}
  .rtext{white-space:pre-wrap; line-height:1.85; font-size:15px; color:var(--ink); margin:8px 0 12px; word-break:break-word;}
  .rtext .em{margin-right:4px;}
  .tags{font-size:12.5px; color:var(--purple); line-height:1.7; word-break:break-word;}
  .rbar{display:flex; gap:8px; margin-top:12px;}
  .btn{
    flex:1; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    font-size:13px; font-weight:700; padding:10px; border-radius:12px; cursor:pointer; transition:all .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(135deg,var(--pink),var(--purple)); color:#fff; border-color:transparent;}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:30px 10px; line-height:1.8;}
  .empty .big{font-size:40px; display:block; margin-bottom:8px;}
  .foot{text-align:center; color:var(--sub); font-size:11.5px; margin-top:22px; line-height:1.7;}
  .toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:rgba(43,43,58,.92); color:#fff; font-size:13px; font-weight:600;
    padding:11px 20px; border-radius:999px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .counter{text-align:center; font-size:12px; color:var(--sub); margin-top:10px;}

const EMOJIS = ["📸","✨","💡","😂","🌿","💅","🍰","🌸","☕️","🔥","💖","🌟","🫶","🍃"];

let state = {scene:null, style:null};
let genCount = 0;

function buildChips(){
  const sc = document.getElementById("sceneChips");
  const st = document.getElementById("styleChips");
  DATA.scenes.forEach((s,i)=>{
    const c = document.createElement("div");
    c.className = "chip" + (i===0?" on":"");
    c.textContent = s.name;
    c.onclick = ()=>{ state.scene = s.key; [...sc.children].forEach(x=>x.classList.remove("on")); c.classList.add("on"); };
    sc.appendChild(c);
  });
  DATA.styles.forEach((s,i)=>{
    const c = document.createElement("div");
    c.className = "chip" + (i===0?" on":"");
    c.textContent = s.name;
    c.onclick = ()=>{ state.style = s.key; [...st.children].forEach(x=>x.classList.remove("on")); c.classList.add("on"); };
    st.appendChild(c);
  });
  state.scene = DATA.scenes[0].key;
  state.style = DATA.styles[0].key;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pickScene(){ return DATA.scenes.find(s=>s.key===state.scene); }
function pickStyle(){ return DATA.styles.find(s=>s.key===state.style); }

function genOne(){
  const scene = pickScene();
  const style = pickStyle();
  const pool = DATA.lines[scene.key][style.key];
  const chosen = shuffle(pool).slice(0,3);
  const body = chosen.map(line=>{
    const e = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    return e + " " + line;
  }).join("\n");
  const tags = shuffle(scene.tags).slice(0,4).join(" ");
  return body + "\n\n" + tags;
}

  const res = document.getElementById("results");
  const empty = document.getElementById("empty");
  if(empty) empty.remove();
  res.innerHTML = "";
  const scene = pickScene();
  const style = pickStyle();
  for(let i=0;i<4;i++){
    const text = genOne();
    const card = document.createElement("div");
    card.className = "rcard";
    card.innerHTML =
      '<span class="rtag">'+scene.name+' · '+style.name+'</span>'+
      '<div class="rtext">'+ text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br/>") +'</div>'+
      '<div class="rbar">'+
        '<button class="btn" data-copy="one">📋 复制这条</button>'+
        '<button class="btn primary" data-copy="all">📑 复制全部</button>'+
      '</div>';
    card.querySelector(".rtext").dataset.text = text;
    res.appendChild(card);
  }
  genCount += 4;
  document.getElementById("counter").textContent = "已为你生成 " + genCount + " 条文案";
}

function copyText(btn){
  const t = btn.closest(".rcard").querySelector(".rtext").dataset.text;
  doCopy(t);
}
function copyAll(){
  const all = [...document.querySelectorAll(".rtext")].map(d=>d.dataset.text).join("\n\n————————\n\n");
  doCopy(all);
}
function doCopy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showToast).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ showToast(document.execCommand("copy") ? "已复制 ✅" : "复制失败，请手动选择文案复制"); }catch(e){ showToast("复制失败，请手动选择文案复制"); }
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(message = "已复制 ✅"){
  const t = document.getElementById("toast");
  t.textContent = typeof message === "string" ? message : "已复制 ✅";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1400);
}

document.getElementById("resetDemo").onclick = () => {
  genCount = 0;
  document.getElementById("counter").textContent = "已为你生成 0 条文案";
  document.getElementById("results").innerHTML = '<div class="empty" id="empty"><span class="big">📝</span>还没生成哦～<br/>选好场景和风格，点上面的按钮试试</div>';
  document.getElementById("sceneChips").innerHTML = "";
  document.getElementById("styleChips").innerHTML = "";
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");
  buildChips();
};
document.getElementById("genBtn").onclick = render;
buildChips();

document.getElementById("results").addEventListener("click", e => { const b=e.target.closest("button[data-copy]"); if (!b) return; if(b.dataset.copy === "one") copyText(b); else copyAll(); });
</script></body></html>
