<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>模拟器大厅</title>
<meta name="description" content="人生、王朝、办公室、宫斗、群聊——挑一段人生，进去活一遍。" />
<meta name="theme-color" content="#eee8dd" />
<meta property="og:title" content="模拟器大厅" />
<meta property="og:description" content="人生、王朝、办公室、宫斗、群聊——挑一段人生，进去活一遍。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23eee8dd'/%3E%3Crect x='10' y='10' width='44' height='44' rx='4' fill='%23a8442a'/%3E%3Ctext x='32' y='45' font-size='30' font-family='serif' text-anchor='middle' fill='%23fdfaf4'%3E%E6%88%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #eee8dd;
    --paper: #fffdfa;
    --ink: #1c1a17;
    --ink2: #4a443c;
    --muted: #8a837a;
    --faint: #b3a99b;
    --line: #e2d8c8;
    --line-soft: #ece4d6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 18% 8%, rgba(255, 255, 255, .55), transparent 46%),
      radial-gradient(circle at 82% 92%, rgba(168, 68, 42, .05), transparent 52%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .serif { font-family: "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", serif; }

  .hall {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 54px 24px 64px;
  }

  /* ---------- 头部 ---------- */
  header { margin-bottom: 34px; }

  .kicker {
    display: flex; align-items: center; gap: 10px;
    font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 18px;
  }
  .kicker::before {
    content: ""; width: 26px; height: 1px; background: var(--faint); opacity: .7;
  }

  h1 {
    font-size: 44px; line-height: 1.18; letter-spacing: .06em;
    font-weight: 400; margin-bottom: 14px;
  }
  h1 em { font-style: normal; color: var(--accent-title, #a8442a); }

  .lead {
    font-size: 14.5px; color: var(--muted); letter-spacing: .04em;
    max-width: 34em;
  }

  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

  .count {
    font-size: 11.5px; letter-spacing: .16em; color: var(--faint);
    padding-bottom: 4px; white-space: nowrap;
  }
  .count b { color: var(--ink2); font-weight: 600; font-size: 13px; letter-spacing: .04em; }

  /* ---------- 卡片网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
    gap: 18px;
    margin-top: 34px;
  }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    padding: 22px 22px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    text-decoration: none; color: inherit;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.22,1,.36,1), box-shadow .28s ease, border-color .28s ease;
    animation: rise .55s cubic-bezier(.22,1,.36,1) both;
    animation-delay: var(--d, 0s);
  }
  .card::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--accent); opacity: .9;
    transform: scaleX(0); transform-origin: left;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 34px rgba(74, 58, 38, .11);
    border-color: var(--line-soft);
  }
  .card:hover::after, .card:focus-visible::after { transform: scaleX(1); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 18px;
  }

  .seal {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    background: var(--accent); color: #fffdf8;
    border-radius: 3px;
    font-family: "Songti SC", "SimSun", "STSong", serif;
    font-size: 23px; line-height: 1;
    transform: rotate(-2.5deg);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
    transition: transform .35s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .seal { transform: rotate(0deg) scale(1.06); }

  .tag {
    font-size: 10.5px; letter-spacing: .2em; color: var(--faint);
    padding-top: 3px;
  }

  .card h2 {
    font-size: 20px; font-weight: 500; letter-spacing: .05em;
    line-height: 1.4; margin-bottom: 8px;
  }

  .line {
    font-size: 13.5px; color: var(--accent); letter-spacing: .02em;
    margin-bottom: 10px; font-weight: 500;
  }

  .desc {
    font-size: 12.8px; line-height: 1.85; color: var(--muted);
    letter-spacing: .01em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 18px; padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta span {
    font-size: 10.5px; letter-spacing: .06em; color: var(--ink2);
    background: #f4efe6; border-radius: 2px; padding: 2px 7px;
  }

  .go {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; letter-spacing: .12em; color: var(--accent);
    white-space: nowrap; opacity: .8;
    transition: opacity .2s ease, transform .2s ease;
  }
  .go i { font-style: normal; transition: transform .25s ease; }
  .card:hover .go { opacity: 1; }
  .card:hover .go i { transform: translateX(3px); }

  .saved { color: var(--faint); font-size: 10.5px; letter-spacing: .06em; }

  /* ---------- 待续卡 ---------- */
  .card-soon {
    border: 1px dashed var(--line);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    min-height: 214px;
    animation: rise .55s cubic-bezier(.22,1,.36,1) both;
  }
  .soon-inner { text-align: center; color: var(--faint); }
  .soon-inner .plus {
    display: block; font-size: 26px; font-weight: 200; line-height: 1;
    margin-bottom: 12px; color: #cbbfae;
  }
  .soon-inner .t { font-size: 12px; letter-spacing: .2em; }
  .soon-inner .s { display: block; font-size: 10.5px; letter-spacing: .06em; margin-top: 7px; color: #c9bcaa; }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 52px; padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: .12em; color: var(--faint);
  }
  footer .dot { opacity: .5; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 720px) {
    .hall { padding: 38px 18px 48px; }
    h1 { font-size: 33px; }
    .lead { font-size: 13.5px; }
    .grid { grid-template-columns: 1fr; gap: 14px; margin-top: 26px; }
    .card { padding: 19px 18px 16px; }
    .card-soon { min-height: 120px; }
    footer { margin-top: 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card-soon { animation: none; }
    .card, .seal, .go i, .card::after { transition: none; }
  }
</style>
</head>
<body>

<div class="hall">
  <header>
    <div class="kicker">Simulator Hall</div>
    <div class="head-row">
      <div>
        <h1 class="serif">模拟器大厅</h1>
        <p class="lead">挑一段人生，进去活一遍。每个模拟器都是一局一次，结局不重样。</p>
      </div>
      <div class="count"><b id="sim-count">5</b> 个模拟器 · 持续增加</div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <span>Simulator Hall <span class="dot">·</span> 一局到底，随时能重来</span>
    <span id="foot-stat"></span>
  </footer>
</div>

<script src="./sims.js"></script>
<script>
(function () {
  const SIMS = (window.SIM_LIST || []).slice();
  const grid = document.getElementById('grid');

  /* 读各自存档数，只作展示，读不到就当 0 */
  function savedCount(key) {
    if (!key) return 0;
    try {
      const v = JSON.parse(window.parent.hallStore.getItem(key) || '[]');
      if (Array.isArray(v)) return v.filter(Boolean).length;
      return Number.isSafeInteger(v) && v >= 0 ? v : 0;
    } catch (e) { return 0; }
  }

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  let totalSaved = 0;
  SIMS.forEach((s, i) => {
    if (s.status === 'soon') {
      const soon = el('div', 'card card-soon');
      soon.style.setProperty('--d', (i * 0.07) + 's');
      soon.appendChild(el('div', 'soon-inner',
        '<span class="plus">+</span><span class="t">' + (s.name || '更多模拟器') + '</span>' +
        '<span class="s">' + (s.line || '筹备中') + '</span>'));
      grid.appendChild(soon);
      return;
    }

    const n = savedCount(s.store);
    totalSaved += n;

    const card = el('a', 'card');
    card.href = './' + s.path + 'index.html';
    card.style.setProperty('--accent', s.accent || '#a8442a');
    card.style.setProperty('--d', (i * 0.07) + 's');

    card.appendChild(el('div', 'card-top',
      '<div class="seal serif">' + (s.seal || '') + '</div>' +
      '<div class="tag">' + (s.tag || '') + '</div>'));

    card.appendChild(el('h2', 'serif', s.name));
    card.appendChild(el('p', 'line', s.line));
    card.appendChild(el('p', 'desc', s.desc));

    const foot = el('div', 'card-foot');
    const meta = el('div', 'meta');
    (s.meta || []).forEach(m => meta.appendChild(el('span', null, m)));
    if (n) meta.appendChild(el('span', 'saved', '已存 ' + n + ' 局'));
    foot.appendChild(meta);
    foot.appendChild(el('span', 'go', '进入 <i>→</i>'));
    card.appendChild(foot);

    grid.appendChild(card);
  });

  const ready = SIMS.filter(s => s.status !== 'soon').length;
  document.getElementById('sim-count').textContent = ready;
  document.getElementById('foot-stat').textContent =
    totalSaved ? '已存 ' + totalSaved + ' 局记录' : '还没有存档，从任意一局开始';
})();
</script>
</body>
</html>
