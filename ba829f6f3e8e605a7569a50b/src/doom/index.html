<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>末日生存模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23eae5db'/%3E%3Crect x='8' y='8' width='48' height='48' rx='4' fill='none' stroke='%238c4a2f' stroke-width='2'/%3E%3Ctext x='32' y='43' font-size='30' font-family='serif' text-anchor='middle' fill='%23201d19'%3E%E6%9C%AB%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #eae5db;
    --card: #fbf9f4;
    --ink: #201d19;
    --ink2: #47413a;
    --muted: #8a8278;
    --faint: #b6ab9d;
    --line: #ddd4c5;
    --line2: #e8e0d3;
    --rust: #8c4a2f;
    --rust-l: #a8613f;
    --moss: #5d6a4f;
    --ash: #6f6a62;
    --sky: #5a6b78;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #ded7cb;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; justify-content: center; min-height: 100vh; }

  #app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    box-shadow: 0 0 80px rgba(50, 40, 30, 0.12);
    position: relative;
    overflow-x: hidden;
  }

  .serif { font-family: "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", serif; }
  .mono { font-family: "Courier New", "SFMono-Regular", Consolas, monospace; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade-up { animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both; }
  .fade-in { animation: fadeIn .6s ease both; }

  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 50px; border: none; border-radius: 2px;
    background: var(--ink); color: #f2ede4;
    font-size: 15px; letter-spacing: 3px; font-family: inherit;
    cursor: pointer; transition: opacity .15s;
  }
  .btn:active { opacity: .82; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.small { height: 40px; font-size: 13px; letter-spacing: 2px; }

  .chip {
    display: inline-block; padding: 3px 9px; margin: 0 6px 6px 0;
    border-radius: 2px; background: #e2dacd; color: #6b6157;
    font-size: 11px; letter-spacing: .8px;
  }
  .chip.rust { background: #f0e2d9; color: var(--rust); }
  .chip.moss { background: #e5e9dd; color: var(--moss); }

  /* ===================== 封面 ===================== */
  .cover {
    min-height: 100vh; padding: 0 30px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .cover::before {
    content: ''; position: absolute; top: -20%; right: -34%;
    width: 340px; height: 340px; border: 1px solid #ddd4c5; border-radius: 50%; opacity: .65;
  }
  .cover::after {
    content: ''; position: absolute; bottom: -16%; left: -38%;
    width: 290px; height: 290px; border: 1px solid #ddd4c5; border-radius: 50%; opacity: .55;
  }
  .cover-inner { width: 100%; position: relative; z-index: 2; }

  .day-mark { display: flex; align-items: center; margin-bottom: 44px; }
  .day-line { width: 26px; height: 1px; background: var(--rust); margin-right: 9px; }
  .day-text { font-size: 10px; letter-spacing: 2px; color: var(--rust); font-family: "Courier New", monospace; }

  .title { font-size: 52px; line-height: 1.14; font-weight: 600; letter-spacing: 4px; }
  .title span { display: block; }
  .subtitle { margin-top: 20px; font-size: 14px; color: #645b51; letter-spacing: .4px; line-height: 1.9; }
  .cover-divider { height: 1px; background: #d8cfc0; margin: 24px 0 20px; }
  .copy-line { display: block; font-size: 12.5px; color: var(--muted); line-height: 2.1; letter-spacing: .4px; }
  .cover-bottom { margin-top: 48px; }
  .cover-hint { display: block; text-align: center; margin-top: 13px; font-size: 11px; color: #a89e91; letter-spacing: .8px; }

  /* ===================== 出场 ===================== */
  .reveal { padding: 0 20px 44px; }
  .reveal-head { padding: 34px 2px 20px; }
  .overline { display: block; font-size: 10.5px; letter-spacing: 4px; color: var(--rust); margin-bottom: 9px; font-family: "Courier New", monospace; }
  .reveal-title { font-size: 25px; font-weight: 600; letter-spacing: 1px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 2px; padding: 20px 18px; margin-bottom: 12px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
  .card-label { font-size: 10.5px; letter-spacing: 3.5px; color: var(--muted); }
  .card-idx { font-family: "Courier New", monospace; font-size: 10px; color: #cdc3b3; }

  .origin-tag { display: block; font-size: 23px; font-weight: 600; letter-spacing: 2px; margin-bottom: 10px; }
  .origin-desc { font-size: 13px; line-height: 1.9; color: var(--ink2); }
  .origin-note {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line2);
    font-size: 12px; color: var(--muted); line-height: 1.8;
  }

  .talent-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .talent {
    flex: 1 1 calc(50% - 4px); min-width: 130px;
    border: 1px solid var(--line2); border-radius: 2px; padding: 10px 12px;
    background: #f6f2ea;
  }
  .talent-name { display: block; font-size: 14px; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; }
  .talent-desc { font-size: 11.5px; color: var(--muted); line-height: 1.7; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .stat { display: flex; flex-direction: column; }
  .stat-k { font-size: 10.5px; letter-spacing: 2px; color: var(--muted); }
  .stat-v { font-size: 21px; font-weight: 600; font-family: "Courier New", monospace; letter-spacing: -.5px; }
  .stat-v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0; }

  .gender-row { display: flex; gap: 8px; }
  .gender-btn {
    flex: 1; height: 42px; border: 1px solid var(--line); background: transparent;
    border-radius: 2px; font-size: 14px; letter-spacing: 2px; color: var(--ink2);
    font-family: inherit; cursor: pointer;
  }
  .gender-btn.on { background: var(--ink); color: #f2ede4; border-color: var(--ink); }

  /* ===================== 游戏 =====================
   * 三段式固定布局：HUD 顶住 / 正文独立滚动 / 选项钉在底部。
   * 之前正文是整个页面在滚、选项 position:fixed 贴在视口底部，
   * 结果是历史条目越攒越多，当前这一问被顶到视口外面——玩家只能看到选项，看不到问题。
   * 现在正文区自己有滚动条（overscroll-behavior: contain，不会把整页带跑），
   * 新内容进来时只滚正文区到最新一条，标题、场景、选项永远同屏可见。
   */
  body.in-game { overflow: hidden; }

  #app.game-mode {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }

  .hud {
    flex: 0 0 auto;
    z-index: 30;
    background: rgba(234, 229, 219, .96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 9px;
  }
  .hud-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .hud-day { font-family: "Courier New", monospace; font-size: 12px; color: var(--rust); letter-spacing: 1px; }
  .hud-stage { font-size: 12px; color: var(--muted); letter-spacing: 1.5px; }

  .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .bar { }
  .bar-k { font-size: 9.5px; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 3px; }
  .bar-track { height: 3px; background: #d9d0c1; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width .5s cubic-bezier(.22,1,.36,1), background .3s; }
  .bar-num { font-family: "Courier New", monospace; font-size: 11px; color: var(--ink2); margin-top: 3px; letter-spacing: -.3px; }
  .bar.low .bar-num { color: var(--rust); font-weight: 700; }

  /* 正文区：唯一可滚动的部分 */
  .feed {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 18px 18px 22px;
    scroll-behavior: smooth;
  }
  .feed-item { margin-bottom: 20px; }
  /* 历史条目收窄、变淡：当前这一问要跳出来 */
  .feed-item.past { opacity: .68; margin-bottom: 16px; }
  .feed-item.past .ev-title { font-size: 15px; }
  .feed-item.past .ev-scene { font-size: 12.5px; line-height: 1.8; }
  .feed-item.now { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
  /* 当前这一问左侧一根竖线，视线有落点 */
  .feed-item.now { padding-left: 12px; border-left: 2px solid var(--rust); }
  .feed-item.now .ev-title { font-size: 19px; }

  .ev-day {
    display: block; font-family: "Courier New", monospace;
    font-size: 10px; letter-spacing: 1.6px; color: var(--faint); margin-bottom: 6px;
  }
  .ev-title { font-size: 18px; font-weight: 600; letter-spacing: 1.2px; margin-bottom: 9px; }
  .ev-scene { font-size: 13.5px; line-height: 1.92; color: var(--ink2); }

  .ev-chosen {
    margin-top: 12px; padding: 12px 14px;
    border-left: 2px solid var(--line); background: #f4f0e7;
    font-size: 13px; line-height: 1.85; color: var(--ink2);
  }
  .ev-chosen .pick { color: var(--rust); font-weight: 600; }
  .ev-chosen .res { display: block; margin-top: 6px; }
  .tone-bad .ev-chosen { border-left-color: var(--rust); }

  .tone-good .ev-chosen { border-left-color: var(--moss); }

  .stage-note {
    margin: 4px 0 22px; padding: 12px 14px;
    border: 1px dashed var(--line); border-radius: 2px;
    font-size: 12.5px; color: var(--muted); line-height: 1.8;
    background: #f2eee5;
  }
  .stage-note b { color: var(--rust); font-weight: 600; }

  /* 选项区：跟在正文下面（不是浮层），所以正文永远滚不到它底下 */
  .choices {
    flex: 0 0 auto;
    width: 100%;
    padding: 10px 18px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 18px rgba(80, 65, 45, .05);
    z-index: 40;
    max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .choice {
    display: block; width: 100%; text-align: left;
    padding: 13px 15px; margin-bottom: 7px;
    background: var(--card); border: 1px solid var(--line); border-radius: 2px;
    font-size: 14px; line-height: 1.6; color: var(--ink); font-family: inherit;
    cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .choice:last-child { margin-bottom: 0; }
  .choice:active { border-color: var(--rust); transform: scale(.993); }
  .choice-idx { font-family: "Courier New", monospace; font-size: 10px; color: var(--faint); margin-right: 8px; }

  /* ===================== 结局 ===================== */
  .ending { padding: 34px 22px 52px; }
  .end-kicker { font-family: "Courier New", monospace; font-size: 10px; letter-spacing: 3px; color: var(--rust); margin-bottom: 14px; }
  .end-title { font-size: 34px; line-height: 1.28; font-weight: 600; letter-spacing: 2px; }
  .end-sub { margin-top: 10px; font-family: "Courier New", monospace; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .end-desc { margin-top: 24px; font-size: 14.5px; line-height: 2.05; color: var(--ink2); }
  .end-desc p { margin-bottom: 14px; }

  .end-scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 26px 0; }
  .score { }
  .score-k { font-size: 10px; letter-spacing: 2px; color: var(--muted); }
  .score-v { font-family: "Courier New", monospace; font-size: 22px; font-weight: 600; }

  .sec-title {
    font-size: 10.5px; letter-spacing: 4px; color: var(--muted);
    margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .review-line { font-size: 13.5px; line-height: 2; color: var(--ink2); margin-bottom: 12px; }

  .advice { padding: 13px 15px; background: #f5f1e8; border-radius: 2px; margin-bottom: 9px; }
  .advice-t { font-size: 13px; font-weight: 600; letter-spacing: .5px; margin-bottom: 5px; }
  .advice-x { font-size: 12.5px; line-height: 1.85; color: var(--ink2); }

  .log-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line2); font-size: 12.5px; }
  .log-day { font-family: "Courier New", monospace; font-size: 10.5px; color: var(--faint); min-width: 46px; padding-top: 2px; }
  .log-body { flex: 1; color: var(--ink2); line-height: 1.75; }
  .log-body b { font-weight: 600; color: var(--ink); }

  .end-actions { margin-top: 32px; display: flex; flex-direction: column; gap: 9px; }

  /* ===================== 档案 ===================== */
  .archive { padding: 32px 20px 50px; }
  .arch-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 2px;
    padding: 14px 16px; margin-bottom: 9px; cursor: pointer;
  }
  .arch-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .arch-title { font-size: 15px; font-weight: 600; letter-spacing: .5px; }
  .arch-total { font-family: "Courier New", monospace; font-size: 13px; color: var(--rust); }
  .arch-sub { font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--faint); font-size: 13px; line-height: 2; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: 2px; }
  .topbar-btn { background: none; border: none; font-size: 12.5px; color: var(--muted); font-family: inherit; cursor: pointer; letter-spacing: .5px; }

  .hidden { display: none !important; }

  /* 小屏矮屏（iPhone SE 568、横屏手机）：HUD 收一收，给正文和选项让位 */
  @media (max-height: 700px) {
    .hud { padding: 7px 14px 6px; }
    .hud-top { margin-bottom: 5px; }
    .bar-num { font-size: 10px; margin-top: 2px; }
    .feed { padding: 14px 16px 18px; }
    .feed-item.now .ev-title { font-size: 17px; }
    .feed-item.past .ev-scene { display: none; }
    .choices { max-height: 46vh; padding-top: 8px; }
    .choice { padding: 11px 13px; font-size: 13.5px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="./core/events.js?v=bfdfe321"></script>
<script src="./core/events-solo.js?v=bfdfe321"></script>
<script src="./core/events-pool.js?v=bfdfe321"></script>
<script src="./core/data.js?v=bfdfe321"></script>
<script src="./core/generator.js?v=bfdfe321"></script>
<script src="./core/engine.js?v=bfdfe321"></script>
<script src="./core/archive.js?v=bfdfe321"></script>
<script>
;(function () {
  const E = window.DoomEngine
  const A = window.DoomArchive
  const D = window.DoomData
  const app = document.getElementById('app')

  const S = {
    view: 'cover',
    s: null,
    ev: null,
    picked: [],
    ending: null,
    gender: null,
    busy: false,
    unlocked: false,
    savedId: null
  }

  /* ------------------------- 工具 ------------------------- */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (html != null) n.innerHTML = html
    return n
  }

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  function barColor(k, v) {
    if (v <= 20) return '#8c4a2f'
    if (v <= 40) return '#a8613f'
    if (k === 'camp') return '#5a6b78'
    if (k === 'supply') return '#7d7350'
    if (k === 'morale') return '#6a7a63'
    return '#7a6a58'
  }

  const DIM_LABEL = { health: '体力', morale: '心气', supply: '存货', camp: '据点' }

  /* ------------------------- 封面 ------------------------- */

  function renderCover() {
    S.view = 'cover'
    const n = A.count()
    exitGameMode()
    app.innerHTML = ''
    const wrap = el('div', 'cover fade-in')
    const inner = el('div', 'cover-inner')
    inner.innerHTML = `
      <div class="day-mark"><span class="day-line"></span><span class="day-text">DAY 0 · 病毒爆发</span></div>
      <h1 class="title serif"><span>末日</span><span>生存</span></h1>
      <div class="subtitle">灯灭的那天没有声音。<br>之后的一千五百天，你要想办法还在。</div>
      <div class="cover-divider"></div>
      <span class="copy-line">体力会掉，心气会垮，存货会吃完，墙会塌。</span>
      <span class="copy-line">没有人告诉你该怎么做——只有每一天都在收账。</span>
      <div class="cover-bottom">
        <button class="btn" id="start">开 始 活 下 去</button>
        <span class="cover-hint">${n ? `已存 ${n} 局 · 点这里回看` : '每一局都是新的一千五百天'}</span>
      </div>`
    wrap.appendChild(inner)
    app.appendChild(wrap)

    document.getElementById('start').onclick = () => renderReveal()
    wrap.querySelector('.cover-hint').onclick = () => renderArchive()
  }

  /* ------------------------- 出场 ------------------------- */

  function renderReveal() {
    S.view = 'reveal'
    const s = E.createSurvivor({})
    S.s = s
    const snap = E.snapshot(s)

    exitGameMode()
    app.innerHTML = ''
    const wrap = el('div', 'reveal fade-up')
    wrap.innerHTML = `
      <div class="reveal-head">
        <span class="overline">第 0 天 · 你在哪儿</span>
        <h2 class="reveal-title">这个人，是你</h2>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-label">出 身</span><span class="card-idx">ORIGIN</span></div>
        <span class="origin-tag serif">${esc(s.origin.name)}</span>
        <div class="origin-desc">${esc(s.origin.desc)}</div>
        <div class="origin-note">${esc(s.origin.note || '')}</div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-label">当 年 学 的 手 艺</span><span class="card-idx">TALENT</span></div>
        <div class="talent-row">
          ${s.talents.map(t => `
            <div class="talent">
              <span class="talent-name">${esc(t.name)}</span>
              <span class="talent-desc">${esc(t.desc)}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-label">开 局 的 账</span><span class="card-idx">STATE</span></div>
        <div class="stat-grid">
          <div class="stat"><span class="stat-k">体力</span><span class="stat-v">${snap.health}<small> / 100</small></span></div>
          <div class="stat"><span class="stat-k">心气</span><span class="stat-v">${snap.morale}<small> / 100</small></span></div>
          <div class="stat"><span class="stat-k">存货</span><span class="stat-v">${snap.supply}<small> 天</small></span></div>
          <div class="stat"><span class="stat-k">据点</span><span class="stat-v">${snap.camp}<small> / 100</small></span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-label">你 是</span><span class="card-idx">GENDER</span></div>
        <div class="gender-row">
          <button class="gender-btn" data-g="m">男</button>
          <button class="gender-btn" data-g="f">女</button>
        </div>
      </div>

      <div style="margin-top:20px">
        <button class="btn" id="go">进 入 第 一 天</button>
        <button class="btn ghost small" id="re" style="margin-top:8px">换 一 个 人</button>
      </div>`

    app.appendChild(wrap)

    const btns = wrap.querySelectorAll('.gender-btn')
    btns.forEach(b => {
      if (b.dataset.g === s.gender) b.classList.add('on')
      b.onclick = () => {
        btns.forEach(x => x.classList.remove('on'))
        b.classList.add('on')
        S.gender = b.dataset.g
      }
    })

    document.getElementById('re').onclick = () => renderReveal()
    document.getElementById('go').onclick = () => {
      if (S.gender) { S.s.gender = S.gender; S.s.genderPicked = true }
      startGame()
    }
  }

  /* ------------------------- 游戏 ------------------------- */

  function startGame() {
    const s = S.s
    E.setSeenPairs(A.seenPairs())
    S.picked = []
    S.ending = null
    S.savedId = null
    S.view = 'game'
    S._lastStage = 1
    // 先把 stage 1 的过场记下来
    S.picked.push({
      kind: 'stage', day: 0,
      text: '第一天。你只知道一件事：灯不亮了。手机没有信号，楼下有人开始喊。你站在窗边，看了很久，直到腿麻。'
    })
    renderGame()
    nextEvent()
  }

  function hudHtml() {
    const s = S.s
    const snap = E.snapshot(s)
    const dims = ['health', 'morale', 'supply', 'camp']
    return `
      <div class="hud-top">
        <span class="hud-day">DAY ${String(Math.min(snap.day, E.TOTAL_DAYS)).padStart(4, '0')} / ${E.TOTAL_DAYS}</span>
        <span class="hud-stage">${esc(snap.stageName)}</span>
      </div>
      <div class="bars">
        ${dims.map(k => {
          const v = snap[k]
          const pct = k === 'supply' ? Math.min(100, v / 1.2) : v
          const low = (k === 'supply' ? v < 12 : v < 28) ? ' low' : ''
          return `<div class="bar${low}">
            <div class="bar-k">${DIM_LABEL[k]}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, pct)}%;background:${barColor(k, pct)}"></div></div>
            <div class="bar-num">${v}</div>
          </div>`
        }).join('')}
      </div>`
  }

  function exitGameMode() {
    document.body.classList.remove('in-game')
    app.classList.remove('game-mode')
  }

  function renderGame() {
    app.innerHTML = ''
    document.body.classList.add('in-game')
    app.classList.add('game-mode')
    const hud = el('div', 'hud')
    hud.id = 'hud'
    hud.innerHTML = hudHtml()
    app.appendChild(hud)

    const feed = el('div', 'feed')
    feed.id = 'feed'
    app.appendChild(feed)

    const choices = el('div', 'choices')
    choices.id = 'choices'
    app.appendChild(choices)

    renderFeed()
    renderChoices()
    scrollFeedBottom()
  }

  /* 只滚正文区到底，不动整页（整页在游戏态是 overflow:hidden）。
   * 用 scrollTop 直接赋值：scroll-behavior:smooth 会让每次点击都有一段动画，
   * 连续点时容易追不上，反而停在半路。 */
  function scrollFeedBottom() {
    const feed = document.getElementById('feed')
    if (!feed) return
    requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight })
  }

  function updateHud() {
    const hud = document.getElementById('hud')
    if (hud) hud.innerHTML = hudHtml()
  }

  function renderFeed() {
    const feed = document.getElementById('feed')
    if (!feed) return
    const last = S.picked.length - 1
    feed.innerHTML = S.picked.map((p, i) => {
      const isNow = i === last
      if (p.kind === 'stage') {
        return `<div class="stage-note${isNow ? '' : ' past'}">${esc(p.text)}</div>`
      }
      return `<div class="feed-item ${isNow ? 'now' : 'past'} tone-${p.tone || 'neutral'}">
        <span class="ev-day">第 ${p.day} 天</span>
        <h3 class="ev-title serif">${esc(p.title)}</h3>
        <div class="ev-scene">${esc(p.scene)}</div>
        ${p.choice ? `<div class="ev-chosen">
          <span class="pick">你选了：${esc(p.choice)}</span>
          ${p.result ? `<span class="res">${esc(p.result)}</span>` : ''}
        </div>` : ''}
      </div>`
    }).join('')
  }

  function renderChoices() {
    const box = document.getElementById('choices')
    if (!box) return
    const ev = S.ev
    if (!ev) {
      box.innerHTML = ''
      box.appendChild(Object.assign(el('button', 'btn', '看 结 局'), { onclick: () => finish() }))
      return
    }
    if (ev.auto) {
      box.innerHTML = ''
      box.appendChild(Object.assign(el('button', 'btn', '继 续'), { onclick: () => autoStep() }))
      return
    }
    box.innerHTML = ''
    ;(ev.options || []).forEach((o, i) => {
      const b = el('button', 'choice', `<span class="choice-idx">${i + 1}</span>${esc(o.text)}`)
      b.onclick = () => pick(i)
      box.appendChild(b)
    })
  }

  // 把答案回填到出题时已入列的那条上，不再重复 push
  function answerLast(r, choice) {
    const last = S.picked[S.picked.length - 1]
    if (last) {
      last.choice = choice || ''
      last.result = (r && r.text) || ''
      last.tone = (r && r.tone) || 'neutral'
    }
  }

  function autoStep() {
    const ev = S.ev
    const s = S.s
    const r = E.autoResolve(s, ev)
    answerLast(r, '')
    updateHud()
    renderFeed()
    nextEvent()
  }

  function pick(i) {
    if (S.busy) return
    S.busy = true
    const ev = S.ev
    const s = S.s
    const opt = ev.options[i]
    const r = E.choose(s, ev, i)

    answerLast(r, opt.text)

    updateHud()
    renderFeed()
    const choices = document.getElementById('choices')
    if (choices) choices.innerHTML = ''
    scrollFeedBottom()

    setTimeout(() => {
      S.busy = false
      if (s.death) return finish()
      nextEvent()
    }, 220)
  }

  function nextEvent() {
    const s = S.s
    let ev = null
    try {
      ev = E.getNextEvent(s)
    } catch (e) {
      console.error('getNextEvent failed', e)
      ev = null
    }

    if (s.death) return finish()

    if (!ev) {
      S.ev = null
      renderChoices()
      return finish()
    }

    // 记录阶段过场
    const lastStage = S.picked.filter(p => p.kind === 'stage').length
    const stageInfo = E.STAGE_SPAN[s.stage]
    if (stageInfo && S._lastStage !== s.stage) {
      S._lastStage = s.stage
      if (s.stage > 2) {
        const tip = (D.STAGES[s.stage] && D.STAGES[s.stage].tip) || ''
        S.picked.push({
          kind: 'stage', day: s.day,
          text: `第 ${s.day} 天 · ${stageInfo.name}。${tip}`
        })
        updateHud()
        renderFeed()
      }
    }

    S.ev = ev
    // 出题即入列：当前这一问必须先出现在正文区，玩家才看得到问题和选项的对应关系
    S.picked.push({
      kind: 'event', day: s.day, title: ev.title, scene: ev.scene,
      choice: '', result: '', tone: 'neutral'
    })
    renderFeed()
    renderChoices()
    updateHud()
    scrollFeedBottom()
  }

  /* ------------------------- 结局 ------------------------- */

  function finish() {
    const s = S.s
    let result
    try {
      result = E.settle(s)
    } catch (e) {
      console.error('settle failed', e)
      result = { sc: s.sc || {}, ending: { title: '你停在这里', subtitle: '', desc: '' }, review: [], advice: [] }
    }

    A.addSeen((result.ending._base || '') + '|' + (result.ending._plight || ''))
    const tags = E.fateLabel(s)
    const rec = A.make(s, result, { tags })
    A.upsert(rec)
    S.savedId = rec.id
    S.ending = result
    S.view = 'ending'
    renderEnding(result)
  }

  function renderEnding(result) {
    const s = S.s
    const sc = result.sc || {}
    const end = result.ending || {}
    exitGameMode()
    app.innerHTML = ''
    window.scrollTo(0, 0)

    const wrap = el('div', 'ending fade-up')
    const descParas = String(end.desc || '').split(/\n+/).filter(Boolean)

    wrap.innerHTML = `
      <div class="end-kicker">${sc.survive ? 'SURVIVED' : 'ENDED'} · DAY ${sc.days || 0}</div>
      <h2 class="end-title serif">${esc(end.title || '')}</h2>
      <div class="end-sub">${esc(end.subtitle || '')}</div>

      <div class="end-desc">${descParas.map(p => `<p>${esc(p)}</p>`).join('')}</div>

      <div class="end-scores">
        <div class="score"><div class="score-k">体 力</div><div class="score-v">${sc.health}</div></div>
        <div class="score"><div class="score-k">心 气</div><div class="score-v">${sc.morale}</div></div>
        <div class="score"><div class="score-k">存 货</div><div class="score-v">${sc.supply}<small style="font-size:11px;color:var(--muted)"> 天</small></div></div>
        <div class="score"><div class="score-k">据 点</div><div class="score-v">${sc.camp}</div></div>
      </div>

      <div class="sec-title">这 一 局</div>
      ${(result.review || []).map(l => `<div class="review-line">${esc(l)}</div>`).join('')}

      <div class="sec-title">下 次 可 以</div>
      ${(result.advice || []).map(a => `<div class="advice">
        <div class="advice-t">${esc(a.title)}</div>
        <div class="advice-x">${esc(a.text)}</div>
      </div>`).join('')}

      <div class="sec-title">大 事 记</div>
      <div id="logbox"></div>

      <div class="end-actions">
        <button class="btn" id="again">再 活 一 次</button>
        <button class="btn ghost small" id="arch">看 我 的 档 案</button>
        <button class="btn ghost small" id="home">回 到 封 面</button>
      </div>`

    app.appendChild(wrap)

    const logbox = document.getElementById('logbox')
    const logs = (s.log || []).filter(l => l.kind !== 'stage')
    if (!logs.length) {
      logbox.innerHTML = '<div class="empty">这一局没有留下什么。</div>'
    } else {
      const pickLogs = logs.filter(l => l.choice).slice(0, 12)
      const show = pickLogs.length ? pickLogs : logs.slice(0, 12)
      logbox.innerHTML = show.map(l => `<div class="log-item">
        <span class="log-day">${l.day}天</span>
        <div class="log-body"><b>${esc(l.title)}</b>${l.choice ? ' · ' + esc(l.choice) : ''}</div>
      </div>`).join('')
    }

    document.getElementById('again').onclick = () => { S._lastStage = 0; renderReveal() }
    document.getElementById('arch').onclick = () => renderArchive()
    document.getElementById('home').onclick = () => renderCover()
  }

  /* ------------------------- 档案 ------------------------- */

  function renderArchive() {
    S.view = 'archive'
    const list = A.all()
    exitGameMode()
    app.innerHTML = ''

    const top = el('div', 'topbar', `
      <span class="topbar-title serif">档案</span>
      <button class="topbar-btn" id="back">返回</button>`)
    app.appendChild(top)

    const wrap = el('div', 'archive fade-up')
    if (!list.length) {
      wrap.innerHTML = `<div class="empty">还没有活过一局。<br>每一局都会保存在云端。</div>`
    } else {
      wrap.innerHTML = list.map(r => {
        const b = A.brief(r)
        const tag = r.survive ? '活下来了' : `${(r.death === 'supply' ? '饿死' : r.death === 'morale' ? '心垮了' : '身体垮了')}`
        return `<div class="arch-item" data-id="${r.id}">
          <div class="arch-top">
            <span class="arch-title">${esc(r.title)}</span>
            <span class="arch-total">${r.sc.total}</span>
          </div>
          <div class="arch-sub">${b.stamp} · 第 ${r.sc.days} 天 · ${tag}</div>
        </div>`
      }).join('')
    }
    app.appendChild(wrap)

    document.getElementById('back').onclick = () => {
      if (S.view === 'archive' && S.ending) renderEnding(S.ending)
      else renderCover()
    }

    wrap.querySelectorAll('.arch-item').forEach(n => {
      n.onclick = () => {
        const rec = A.get(n.dataset.id)
        if (rec) renderRecord(rec)
      }
    })
  }

  function renderRecord(rec) {
    app.innerHTML = ''
    window.scrollTo(0, 0)
    const top = el('div', 'topbar', `
      <span class="topbar-title serif">${esc(rec.title)}</span>
      <button class="topbar-btn" id="back">返回</button>`)
    app.appendChild(top)

    const wrap = el('div', 'ending fade-in')
    wrap.innerHTML = `
      <div class="end-kicker">${rec.survive ? 'SURVIVED' : 'ENDED'} · DAY ${rec.sc.days}</div>
      <div class="end-desc">${String(rec.desc || '').split(/\n+/).map(p => `<p>${esc(p)}</p>`).join('')}</div>
      <div class="end-scores">
        <div class="score"><div class="score-k">体 力</div><div class="score-v">${rec.sc.health}</div></div>
        <div class="score"><div class="score-k">心 气</div><div class="score-v">${rec.sc.morale}</div></div>
        <div class="score"><div class="score-k">存 货</div><div class="score-v">${rec.sc.supply}</div></div>
        <div class="score"><div class="score-k">据 点</div><div class="score-v">${rec.sc.camp}</div></div>
      </div>
      <div class="sec-title">这 一 局</div>
      ${(rec.review || []).map(l => `<div class="review-line">${esc(l)}</div>`).join('')}
      <div class="sec-title">当 时 的 选 择</div>
      ${(rec.log || []).map(l => `<div class="log-item">
        <span class="log-day">${l.day}天</span>
        <div class="log-body"><b>${esc(l.title)}</b>${l.choice ? ' · ' + esc(l.choice) : ''}</div>
      </div>`).join('')}
      <div class="end-actions">
        <button class="btn ghost small" id="del">删 掉 这 一 局</button>
      </div>`
    app.appendChild(wrap)

    document.getElementById('back').onclick = () => renderArchive()
    document.getElementById('del').onclick = () => {
      A.remove(rec.id)
      renderArchive()
    }
  }

  /* ------------------------- 启动 ------------------------- */

  renderCover()

  window.addEventListener('keydown', e => {
    if (S.view !== 'game') return
    const n = parseInt(e.key, 10)
    if (n >= 1 && n <= 3 && S.ev && S.ev.options && S.ev.options[n - 1]) pick(n - 1)
  })
})()
</script>
