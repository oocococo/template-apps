<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>王朝模拟器 · 你是皇帝</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2314110e'/%3E%3Crect x='7' y='7' width='50' height='50' rx='3' fill='none' stroke='%23c9a45c' stroke-width='1.5'/%3E%3Ctext x='32' y='44' font-size='30' font-family='serif' text-anchor='middle' fill='%23c9a45c'%3E%E7%8E%8B%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #14110e;
    --panel: #1d1813;
    --panel2: #241e18;
    --ink: #ece2d2;
    --ink2: #c7b8a4;
    --muted: #8b7c69;
    --faint: #5f5344;
    --line: #332a20;
    --line2: #3f3427;
    --gold: #c9a45c;
    --gold2: #a8843f;
    --red: #a8442a;
    --red2: #c4654a;
    --green: #6d8760;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0d0b09;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; justify-content: center; min-height: 100vh; }

  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(201,164,92,.07), transparent 60%),
      var(--bg);
    box-shadow: 0 0 90px rgba(0,0,0,.6);
    position: relative;
    overflow-x: hidden;
  }

  .serif { font-family: "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", serif; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sealIn { from { opacity: 0; transform: scale(1.5) rotate(-8deg); } to { opacity: .9; transform: scale(1) rotate(-3deg); } }
  .fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
  .fade-in { animation: fadeIn .7s ease both; }

  /* ---------- 通用 ---------- */
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 52px; border: none; border-radius: 2px;
    background: linear-gradient(180deg, #d3ae66, #b8903f);
    color: #1a1410; font-size: 15px; letter-spacing: 3px; font-family: inherit;
    cursor: pointer; transition: filter .15s, opacity .15s;
    font-weight: 600;
  }
  .btn:active { filter: brightness(.88); }
  .btn.ghost {
    background: transparent; color: var(--ink2);
    border: 1px solid var(--line2); font-weight: 400;
  }
  .btn.ghost:active { background: var(--panel2); }
  .btn.small { height: 44px; font-size: 13px; letter-spacing: 2px; }

  .overline { display: block; font-size: 10.5px; letter-spacing: 4px; color: var(--gold2); margin-bottom: 10px; }
  .chip {
    display: inline-block; padding: 3px 9px; margin: 0 6px 6px 0;
    border: 1px solid var(--line2); border-radius: 2px; color: var(--muted);
    font-size: 11px; letter-spacing: .8px;
  }

  /* ---------- 封面 ---------- */
  .cover { min-height: 100vh; padding: 0 30px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .cover::before {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 300px; height: 300px; border: 1px solid rgba(201,164,92,.09); border-radius: 50%;
  }
  .cover::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 210px; height: 210px; border: 1px solid rgba(201,164,92,.06); border-radius: 50%;
  }
  .cover-inner { width: 100%; position: relative; z-index: 2; }
  .cover-top { display: flex; align-items: center; margin-bottom: 40px; }
  .cover-line { width: 26px; height: 1px; background: var(--gold2); margin-right: 9px; }
  .cover-no { font-size: 10px; letter-spacing: 1.8px; color: var(--gold2); font-family: "Courier New", monospace; }
  .title { font-size: 52px; line-height: 1.18; font-weight: 600; letter-spacing: 8px; }
  .title span { display: block; }
  .title .dim { color: var(--ink2); font-size: 42px; letter-spacing: 10px; }
  .subtitle { margin-top: 20px; font-size: 14px; color: var(--ink2); letter-spacing: .6px; line-height: 1.9; }
  .cover-divider { height: 1px; background: linear-gradient(90deg, var(--line2), transparent); margin: 24px 0 20px; }
  .copy-line { display: block; font-size: 12.5px; color: var(--muted); line-height: 2.05; letter-spacing: .4px; }
  .pick { margin-top: 26px; }
  .pick-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .pick-label { font-size: 10.5px; letter-spacing: 3px; color: var(--muted); }
  .pick-hint { font-size: 10.5px; color: var(--faint); }
  .pick-opts { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick-opt {
    padding: 7px 13px; border: 1px solid var(--line); border-radius: 2px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; transition: all .15s;
    letter-spacing: .5px;
  }
  .pick-opt.on { border-color: var(--gold2); color: var(--gold); background: rgba(201,164,92,.07); }
  .cover-bottom { margin-top: 34px; }
  .cover-hint { display: block; text-align: center; margin-top: 13px; font-size: 10.5px; color: var(--faint); letter-spacing: 1px; }
  .arc-entry {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); cursor: pointer; letter-spacing: 1px;
  }
  .arc-entry-label { color: var(--ink2); }

  /* ---------- 出场 ---------- */
  .reveal { padding: 0 20px 42px; }
  .reveal-head { padding: 34px 0 20px; }
  .reveal-title { font-size: 25px; font-weight: 600; letter-spacing: 1px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 20px 18px; margin-bottom: 12px;
  }
  .card-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-label { font-size: 10.5px; letter-spacing: 4px; color: var(--muted); }
  .card-index { font-family: "Courier New", monospace; font-size: 10px; color: var(--faint); }

  .reign-name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .reign-dyn { font-size: 26px; font-weight: 600; letter-spacing: 2px; color: var(--gold); }
  .reign-era { font-size: 13px; color: var(--ink2); letter-spacing: 2px; }
  .reign-person { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .origin-tag { display: block; font-size: 19px; font-weight: 600; letter-spacing: 2px; margin: 4px 0 9px; }
  .origin-desc { font-size: 13.5px; line-height: 1.95; color: var(--ink2); }
  .origin-note { display: flex; margin-top: 15px; padding-top: 14px; border-top: 1px dashed var(--line2); }
  .note-mark { color: var(--gold); margin-right: 6px; }
  .note-text { flex: 1; font-size: 12.5px; line-height: 1.85; color: var(--muted); }

  .trait + .trait { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line2); }
  .trait-name { display: block; font-size: 17px; font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; }
  .trait-desc { font-size: 12.5px; color: var(--muted); line-height: 1.85; }

  .stat-line { display: flex; align-items: center; margin-top: 10px; }
  .stat-line:first-of-type { margin-top: 16px; }
  .stat-name { width: 44px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .stat-track { flex: 1; height: 3px; background: #2c241b; border-radius: 2px; overflow: hidden; margin-right: 9px; }
  .stat-fill { height: 100%; background: var(--gold2); border-radius: 2px; transition: width .9s cubic-bezier(.22,1,.36,1); }
  .stat-num { width: 26px; text-align: right; font-size: 11px; color: var(--muted); font-family: "Courier New", monospace; }
  .tag-block { margin: 16px 2px 20px; }
  .tag-label { display: block; font-size: 10.5px; letter-spacing: 3px; color: var(--muted); margin-bottom: 9px; }
  .reveal-foot { margin-bottom: 8px; }
  .foot-copy { display: block; font-size: 12px; color: var(--muted); line-height: 1.95; }
  .foot-copy.dim { color: var(--faint); }

  /* ---------- HUD ---------- */
  .hud {
    position: sticky; top: 0; z-index: 20;
    background: rgba(20,17,14,.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 11px 18px 9px;
  }
  .hud-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .hud-era { font-size: 15px; letter-spacing: 3px; color: var(--gold); margin-right: 8px; font-family: "Songti SC", serif; }
  .hud-year { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .hud-right { display: flex; align-items: baseline; gap: 8px; }
  .hud-stage { font-size: 10.5px; letter-spacing: 2px; color: var(--gold2); border: 1px solid var(--line2); padding: 1px 6px; border-radius: 2px; }
  .hud-age { font-size: 11px; color: var(--muted); }
  .hud-bars { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px 12px; }
  .bar { display: flex; align-items: center; gap: 5px; }
  .bar-label { font-size: 9.5px; color: var(--faint); letter-spacing: .5px; width: 22px; }
  .bar-track { flex: 1; height: 2px; background: #2b231a; border-radius: 1px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--gold2); transition: width .6s; }
  .bar-fill.low { background: var(--red); }
  .bar-fill.high { background: #dcb96f; }
  .bar-num { font-size: 9px; color: var(--muted); font-family: "Courier New", monospace; width: 16px; text-align: right; }
  .hud-foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--faint); letter-spacing: 1px; }
  .court-btn { color: var(--gold2); cursor: pointer; }

  /* ---------- 章节 ---------- */
  .chapter { min-height: calc(100vh - 86px); display: flex; flex-direction: column; justify-content: center; padding: 30px 30px 40px; position: relative; }
  .chapter-water { position: absolute; right: 14px; top: 18%; font-size: 160px; color: rgba(201,164,92,.045); font-family: "Songti SC", serif; line-height: 1; pointer-events: none; }
  .chapter-no { font-size: 11px; letter-spacing: 5px; color: var(--gold2); }
  .chapter-name { display: block; font-size: 38px; letter-spacing: 6px; margin: 12px 0 8px; font-weight: 600; }
  .chapter-range { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  .chapter-rule { width: 42px; height: 1px; background: var(--gold2); margin: 22px 0; }
  .chapter-tip { font-size: 13.5px; color: var(--ink2); line-height: 2; max-width: 320px; }
  .chapter-foot { margin-top: 40px; }

  /* ---------- 事件 ---------- */
  .body { padding: 20px 20px 40px; }
  .event { margin-bottom: 20px; }
  .ev-meta { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: 1.6px; color: var(--faint); margin-bottom: 12px; }
  .ev-meta b { color: var(--gold2); font-weight: 400; }
  .ev-title { font-size: 25px; font-weight: 600; letter-spacing: 2px; line-height: 1.45; margin-bottom: 14px; }
  .ev-scene { font-size: 14px; line-height: 2.05; color: var(--ink2); text-align: justify; }
  .ev-rule { height: 1px; background: linear-gradient(90deg, var(--line2), transparent); margin: 22px 0 4px; }

  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; align-items: flex-start; gap: 11px; width: 100%;
    padding: 15px 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 2px; color: var(--ink); font-family: inherit; font-size: 13.5px;
    line-height: 1.7; text-align: left; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opt:active { border-color: var(--gold2); background: var(--panel2); }
  .opt-no { font-family: "Courier New", monospace; font-size: 10px; color: var(--gold2); padding-top: 2px; letter-spacing: .5px; }
  .opt-txt { flex: 1; }
  .opt-arrow { color: var(--faint); font-size: 16px; line-height: 1.3; }
  .opt-hint { display: block; font-size: 10.5px; color: var(--faint); margin-top: 5px; letter-spacing: .3px; }

  /* ---------- 结果 ---------- */
  .picked { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 14px; }
  .picked em { font-style: normal; color: var(--gold); font-family: "Songti SC", serif; font-size: 14px; }
  .result-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--gold2); border-radius: 2px; padding: 20px 18px 44px; }
  .result-text { font-size: 14px; line-height: 2.05; color: var(--ink2); text-align: justify; }
  .seal {
    position: absolute; right: 14px; bottom: 12px;
    width: 38px; height: 38px; border: 1.5px solid rgba(168,68,42,.75); border-radius: 2px;
    color: rgba(196,101,74,.9); font-family: "Songti SC", serif; font-size: 11px;
    display: flex; align-items: center; justify-content: center; line-height: 1.15;
    text-align: center; letter-spacing: 0; transform: rotate(-3deg);
    animation: sealIn .4s .2s both; opacity: .9;
  }
  .deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .delta {
    font-size: 10.5px; letter-spacing: .5px; padding: 3px 7px;
    border-radius: 2px; border: 1px solid var(--line2); color: var(--muted);
    font-family: "Courier New", monospace;
  }
  .delta.up { color: var(--gold); border-color: rgba(201,164,92,.35); background: rgba(201,164,92,.06); }
  .delta.down { color: var(--red2); border-color: rgba(168,68,42,.35); background: rgba(168,68,42,.06); }
  .result-foot { margin-top: 26px; }
  .foot-note { display: block; text-align: center; margin-top: 12px; font-size: 10.5px; color: var(--faint); letter-spacing: 1px; }

  /* ---------- 结局 ---------- */
  .hero { padding: 42px 24px 26px; border-bottom: 1px solid var(--line); position: relative; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 7px; font-size: 10.5px; color: var(--muted); letter-spacing: 1.2px; margin-bottom: 18px; }
  .hero-meta span + span::before { content: '·'; margin-right: 7px; color: var(--faint); }
  .hero-title { font-size: 34px; line-height: 1.35; font-weight: 600; letter-spacing: 2px; }
  .hero-sub { margin-top: 10px; font-size: 14px; color: var(--gold); letter-spacing: 2px; }
  .hero-post { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  .hero-line { width: 36px; height: 1px; background: var(--gold2); margin: 20px 0 18px; }
  .hero-desc { font-size: 14px; line-height: 2.1; color: var(--ink2); text-align: justify; }
  .hero-scene {
    margin-top: 20px; padding: 16px 16px 16px 17px;
    border-left: 1px solid rgba(201,164,92,.45);
    background: linear-gradient(90deg, rgba(201,164,92,.05), transparent);
    font-size: 13px; line-height: 2.05; color: var(--ink2); font-family: "Songti SC", serif;
  }
  .hero-tags { margin-top: 18px; }

  .section { padding: 26px 24px 0; }
  .sec-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 18px; }
  .sec-no { font-family: "Courier New", monospace; font-size: 10px; color: var(--gold2); letter-spacing: 1px; }
  .sec-title { font-size: 16px; letter-spacing: 2px; font-weight: 600; }
  .sec-title::after { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--line2); margin-left: 10px; vertical-align: middle; }

  .score { margin-bottom: 15px; }
  .score-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .score-label { font-size: 12px; color: var(--muted); letter-spacing: 2px; }
  .score-value { font-size: 15px; color: var(--gold); font-family: "Courier New", monospace; }
  .score-track { height: 2px; background: #2b231a; overflow: hidden; }
  .score-fill { height: 100%; background: var(--gold2); width: 0; transition: width 1.1s cubic-bezier(.22,1,.36,1); }
  .score-note { display: block; margin-top: 4px; font-size: 11px; color: var(--faint); line-height: 1.9; }

  .review p { font-size: 13.5px; line-height: 2.05; color: var(--ink2); margin-bottom: 13px; text-align: justify; }
  .review p:first-child { color: var(--ink); font-family: "Songti SC", serif; font-size: 14.5px; }
  .review p:first-child::first-letter { color: var(--gold); }

  .timeline { position: relative; padding-left: 16px; }
  .timeline::before { content: ''; position: absolute; left: 3px; top: 7px; bottom: 6px; width: 1px; background: var(--line); }
  .tl-item { position: relative; padding-bottom: 15px; }
  .tl-dot { position: absolute; left: -16px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--line2); border: 1px solid var(--bg); }
  .tl-dot.good { background: var(--gold2); }
  .tl-dot.bad { background: var(--red); }
  .tl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tl-year { font-family: "Courier New", monospace; font-size: 10px; color: var(--faint); letter-spacing: .5px; }
  .tl-title { font-size: 13px; color: var(--ink2); letter-spacing: .5px; }
  .tl-choice { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
  .tl-toggle { text-align: center; font-size: 11px; color: var(--gold2); letter-spacing: 1px; padding: 8px 0 4px; cursor: pointer; }

  .advice { border: 1px solid var(--line); border-radius: 2px; padding: 16px; margin-bottom: 11px; background: var(--panel); }
  .advice-title { display: block; font-size: 13px; color: var(--gold); letter-spacing: 2px; margin-bottom: 7px; font-family: "Songti SC", serif; }
  .advice-text { font-size: 12.5px; line-height: 1.95; color: var(--muted); text-align: justify; }

  .end-actions { padding: 28px 24px 46px; display: flex; flex-direction: column; gap: 10px; }
  .end-note { text-align: center; font-size: 10.5px; color: var(--faint); letter-spacing: 1px; margin-top: 6px; }

  /* ---------- 档案 ---------- */
  .arc-head { padding: 34px 22px 18px; }
  .arc-title { font-size: 26px; letter-spacing: 2px; font-weight: 600; }
  .arc-list { padding: 0 20px 40px; }
  .arc-item {
    border: 1px solid var(--line); border-radius: 3px; background: var(--panel);
    padding: 15px 15px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s;
  }
  .arc-item:active { border-color: var(--gold2); }
  .arc-row1 { display: flex; justify-content: space-between; align-items: baseline; }
  .arc-name { font-size: 17px; font-family: "Songti SC", serif; letter-spacing: 1px; }
  .arc-total { font-family: "Courier New", monospace; font-size: 15px; color: var(--gold); }
  .arc-sub { font-size: 11.5px; color: var(--gold2); margin-top: 3px; letter-spacing: .5px; }
  .arc-meta { font-size: 10.5px; color: var(--faint); margin-top: 7px; letter-spacing: .5px; }
  .arc-empty { text-align: center; padding: 70px 30px; color: var(--faint); font-size: 12.5px; line-height: 2; }
  .back-bar { padding: 16px 20px 4px; }
  .back-btn { font-size: 12px; color: var(--muted); letter-spacing: 1px; cursor: pointer; }

  /* ---------- 朝局 ---------- */
  .court-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.62);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
    animation: fadeIn .2s both;
  }
  .court {
    width: 100%; max-width: 480px; background: var(--panel);
    border-top: 1px solid var(--line2); border-radius: 8px 8px 0 0;
    padding: 22px 22px 30px; animation: fadeUp .3s both;
  }
  .court-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .court-title { font-size: 18px; letter-spacing: 3px; font-family: "Songti SC", serif; }
  .court-close { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 8px; }
  .court-sub { font-size: 10.5px; color: var(--faint); letter-spacing: 1px; margin-bottom: 18px; }
  .fac { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .fac-name { width: 38px; font-size: 12.5px; color: var(--ink2); letter-spacing: 1px; }
  .fac-track { flex: 1; height: 4px; background: #2b231a; border-radius: 2px; overflow: hidden; }
  .fac-fill { height: 100%; background: var(--gold2); }
  .fac-fill.warn { background: var(--red); }
  .fac-num { width: 24px; text-align: right; font-size: 10.5px; color: var(--muted); font-family: "Courier New", monospace; }
  .fac-note { font-size: 10.5px; color: var(--faint); line-height: 1.8; margin-top: -4px; margin-bottom: 14px; padding-left: 48px; }
  .court-warn { margin-top: 12px; padding: 11px 12px; border-left: 2px solid var(--red); background: rgba(168,68,42,.07); font-size: 11.5px; line-height: 1.85; color: var(--ink2); }
  .court-ok { margin-top: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.85; }
</style>
</head>

<script src="./core/dyn-events.js?v=d1d5f086"></script>
<script src="./core/dyn-events-solo.js?v=d1d5f086"></script>
<script src="./core/dyn-data.js?v=d1d5f086"></script>
<script src="./core/dyn-engine.js?v=d1d5f086"></script>
<script src="./core/dyn-archive.js?v=d1d5f086"></script>
<script>
(function () {
  const E = window.DynEngine
  const D = window.DynData
  const A = window.DynArchive

  const app = document.getElementById('app')
  const STAGE_NO = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五' }
  const STAT_KEYS = [
    ['treasury', '国库'], ['people', '民心'], ['army', '军备'],
    ['admin', '吏治'], ['authority', '皇权'], ['prestige', '威望']
  ]

  let reign = null
  let currentEvent = null
  let result = null
  let record = null
  let lastStage = 0
  let pickedGender = 'auto'
  let pickedOrigin = 'random'
  let showAllTimeline = false
  let viewing = null

  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const num = v => Math.round(v)

  function scrollTop() {
    try { window.scrollTo({ top: 0, behavior: 'auto' }) } catch (e) { window.scrollTo(0, 0) }
  }

  /* ---------------- HUD ---------------- */

  function hudHTML() {
    if (!reign) return ''
    const sn = E.snapshot(reign)
    const bars = STAT_KEYS.map(([k, label]) => {
      const v = sn[k]
      const cls = v < 30 ? 'low' : v > 74 ? 'high' : ''
      return `<div class="bar">
        <span class="bar-label">${label}</span>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.max(0, Math.min(100, v))}%"></div></div>
        <span class="bar-num">${v}</span>
      </div>`
    }).join('')
    return `<div class="hud">
      <div class="hud-top">
        <div><span class="hud-era">${esc(sn.era)}</span><span class="hud-year">第 ${sn.year} 年</span></div>
        <div class="hud-right"><span class="hud-stage">${esc(sn.stageName)}</span><span class="hud-age">${sn.age} 岁</span></div>
      </div>
      <div class="hud-bars">${bars}</div>
      <div class="hud-foot">
        <span>身体 ${sn.health} · 子嗣 ${sn.heirs}</span>
        <span class="court-btn" id="btn-court">朝局 ›</span>
      </div>
    </div>`
  }

  function bindHud() {
    const b = document.getElementById('btn-court')
    if (b) b.onclick = showCourt
  }

  /* ---------------- 朝局 ---------------- */

  function showCourt() {
    if (!reign) return
    const sn = E.snapshot(reign)
    const f = sn.factions
    const FAC = [
      ['scholar', '士族', '文官、世家、清流。掌人事与舆论，最会讲道理，也最会拖事。'],
      ['eunuch', '宦官', '内廷近侍。掌你的耳目与印信，忠诚与私利分不清。'],
      ['warlord', '武将', '边将与军镇。掌刀兵，能安边，也能清君侧。'],
      ['clan', '宗室', '皇族与外戚。掌礼法与血统，离龙椅最近。']
    ]
    const top = Math.max(f.scholar, f.eunuch, f.warlord, f.clan)
    const warn = top > 66
      ? `最强的一方已到 ${top}。任何一方超过六成，都会开始想"为什么不能是我"。`
      : top > 55
        ? `最强的一方 ${top}，尚在可控之内。再让它长十年，就不一定了。`
        : '四方尚均。这种局面最省心，也最难长久——均势总要有人先动。'

    const mask = document.createElement('div')
    mask.className = 'court-mask'
    mask.innerHTML = `<div class="court">
      <div class="court-head">
        <span class="court-title">朝局</span>
        <span class="court-close" id="court-close">收起</span>
      </div>
      <div class="court-sub">${esc(sn.dynasty)} · ${esc(sn.era)}第 ${sn.year} 年 · 子嗣 ${sn.heirs}</div>
      ${FAC.map(([k, name, note]) => {
        const v = f[k]
        return `<div class="fac">
            <span class="fac-name">${name}</span>
            <div class="fac-track"><div class="fac-fill ${v > 66 ? 'warn' : ''}" style="width:${v}%"></div></div>
            <span class="fac-num">${v}</span>
          </div>
          <div class="fac-note">${note}</div>`
      }).join('')}
      <div class="${warn.includes('为什么') ? 'court-warn' : 'court-ok'}">${warn}</div>
    </div>`
    document.body.appendChild(mask)
    const close = () => { if (mask.parentNode) mask.parentNode.removeChild(mask) }
    mask.querySelector('#court-close').onclick = close
    mask.onclick = e => { if (e.target === mask) close() }
  }

  /* ---------------- 封面 ---------------- */

  const ORIGIN_PICK = [
    ['random', '随机'], ['founder', '开国'], ['heir', '守成'],
    ['child', '幼主'], ['prince', '藩王'], ['late', '末世']
  ]

  function showCover() {
    const st = E.stats()
    app.innerHTML = `
      <section class="cover">
        <div class="cover-inner fade-in">
          <div class="cover-top">
            <span class="cover-line"></span>
            <span class="cover-no">IMPERIAL ARCHIVE · No.${String(Math.floor(Math.random() * 9000) + 1000)}</span>
          </div>
          <h1 class="title serif"><span>王朝</span><span class="dim">模拟器</span></h1>
          <p class="subtitle">你是皇帝。<br/>这是一份关于你和这个国家的起居注。</p>
          <div class="cover-divider"></div>
          <div>
            <span class="copy-line">有些诏书，当时只道是寻常。</span>
            <span class="copy-line">很多年后，它们被收进了本纪。</span>
          </div>

          <div class="pick">
            <div class="pick-head">
              <span class="pick-label">你的身份</span>
              <span class="pick-hint">${pickedGender === 'f' ? '女主临朝，更难' : '可自行指定'}</span>
            </div>
            <div class="pick-opts" id="pick-gender">
              <div class="pick-opt ${pickedGender === 'm' ? 'on' : ''}" data-g="m">男</div>
              <div class="pick-opt ${pickedGender === 'f' ? 'on' : ''}" data-g="f">女</div>
              <div class="pick-opt ${pickedGender === 'auto' ? 'on' : ''}" data-g="auto">随机</div>
            </div>
          </div>

          <div class="pick">
            <div class="pick-head">
              <span class="pick-label">即位身世</span>
              <span class="pick-hint">${pickedOrigin === 'random' ? '交给天' : '自己定'}</span>
            </div>
            <div class="pick-opts" id="pick-origin">
              ${ORIGIN_PICK.map(([id, name]) => `<div class="pick-opt ${pickedOrigin === id ? 'on' : ''}" data-o="${id}">${name}</div>`).join('')}
            </div>
          </div>

          <div class="cover-bottom">
            <button class="btn" id="btn-roll">即皇帝位</button>
            <span class="cover-hint">一局约 ${st.events} 条事件 · ${st.combos} 种结局 · 选择不可撤回</span>
            <div class="arc-entry" id="btn-archive" ${A.count() ? '' : 'style="display:none"'}>
              <span class="arc-entry-label">历代本纪</span>
              <span>${A.count() ? A.count() + ' 朝' : '还没有'}</span>
            </div>
          </div>
        </div>
      </section>`

    document.getElementById('btn-roll').onclick = rollReign
    const arcBtn = document.getElementById('btn-archive')
    if (arcBtn) arcBtn.onclick = () => { if (A.count()) showArchive() }

    app.querySelectorAll('#pick-gender .pick-opt').forEach(el => {
      el.onclick = () => {
        pickedGender = el.dataset.g
        app.querySelectorAll('#pick-gender .pick-opt').forEach(x => x.classList.toggle('on', x.dataset.g === pickedGender))
        showCover()
      }
    })
    app.querySelectorAll('#pick-origin .pick-opt').forEach(el => {
      el.onclick = () => {
        pickedOrigin = el.dataset.o
        app.querySelectorAll('#pick-origin .pick-opt').forEach(x => x.classList.toggle('on', x.dataset.o === pickedOrigin))
        showCover()
      }
    })
    scrollTop()
  }

  /* ---------------- 出场 ---------------- */

  function rollReign() {
    const female = pickedGender === 'f' ? true : pickedGender === 'm' ? false : Math.random() < 0.3
    reign = E.createReign(pickedOrigin === 'random' ? null : pickedOrigin, female)
    result = null
    record = null
    currentEvent = null
    lastStage = 0
    showAllTimeline = false

    const s = reign
    const sn = E.snapshot(s)
    const tags = E.fateLabel(s)
    const stOrder = ['treasury', 'people', 'army', 'admin', 'authority', 'prestige']
    const statName = { treasury: '国库', people: '民心', army: '军备', admin: '吏治', authority: '皇权', prestige: '威望' }

    app.innerHTML = `
      <section class="reveal">
        <div class="reveal-head fade-up">
          <span class="overline">即位之际</span>
          <h2 class="reveal-title serif">这个国家，交到你手里了</h2>
        </div>

        <div class="card fade-up" style="animation-delay:.06s">
          <div class="card-label-row"><span class="card-label">国号 / 年号</span><span class="card-index">01</span></div>
          <div class="reign-name">
            <span class="reign-dyn serif">${esc(s.dynasty)}</span>
            <span class="reign-era">${esc(s.era)}</span>
            <span class="reign-person">${s.female ? '女帝' : '皇帝'} ${esc(s.surname + s.given)}</span>
          </div>
          <span class="origin-tag serif">${esc(s.origin.tag)}</span>
          <p class="origin-desc">${esc(s.origin.desc)}</p>
          <div class="origin-note">
            <span class="note-mark">·</span>
            <span class="note-text">${esc(s.origin.note)}</span>
          </div>
        </div>

        <div class="card fade-up" style="animation-delay:.12s">
          <div class="card-label-row"><span class="card-label">性格</span><span class="card-index">02</span></div>
          ${s.traits.map(t => `<div class="trait">
            <span class="trait-name serif">${esc(t.name)}</span>
            <span class="trait-desc">${esc(t.desc)}</span>
          </div>`).join('')}
        </div>

        <div class="card fade-up" style="animation-delay:.18s">
          <div class="card-label-row"><span class="card-label">登基时的国势</span><span class="card-index">03</span></div>
          ${stOrder.map(k => `<div class="stat-line">
            <span class="stat-name">${statName[k]}</span>
            <div class="stat-track"><div class="stat-fill" style="width:${Math.max(0, Math.min(100, sn[k]))}%"></div></div>
            <span class="stat-num">${sn[k]}</span>
          </div>`).join('')}
        </div>

        <div class="tag-block fade-up" style="animation-delay:.24s">
          <span class="tag-label">史官在你身上记下的</span>
          <div>${tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
        </div>

        <div class="reveal-foot fade-up" style="animation-delay:.28s">
          <span class="foot-copy">从这里开始，每一道朱批都由你来写。</span>
          <span class="foot-copy dim">国库、民心、军备、吏治、皇权、威望——任何一项见底，这个王朝就到此为止。</span>
        </div>

        <div style="margin-top:22px" class="fade-up">
          <button class="btn" id="btn-start">临朝</button>
        </div>
      </section>`

    document.getElementById('btn-start').onclick = startReign
    scrollTop()
  }

  function startReign() {
    nextEvent()
  }

  /* ---------------- 事件流 ---------------- */

  function nextEvent() {
    const prevStage = lastStage
    const ev = E.getNextEvent(reign)
    if (!ev) return showEnding()
    currentEvent = ev
    const st = E.snapshot(reign).stage
    if (st !== prevStage) {
      lastStage = st
      return showChapter(st)
    }
    showEvent()
  }

  function showChapter(stage) {
    const st = D.STAGES[stage] || D.STAGES[1]
    app.innerHTML = `
      ${hudHTML()}
      <section class="chapter">
        <span class="chapter-water serif">${STAGE_NO[stage] || ''}</span>
        <div class="fade-up">
          <span class="chapter-no">卷 ${STAGE_NO[stage] || ''}</span>
          <span class="chapter-name serif">${esc(st.name)}</span>
          <span class="chapter-range">${esc(st.range)}</span>
          <div class="chapter-rule"></div>
          <p class="chapter-tip">${esc(st.tip)}</p>
        </div>
        <div class="chapter-foot fade-up" style="animation-delay:.18s">
          <button class="btn" id="btn-ch">继续</button>
        </div>
      </section>`
    document.getElementById('btn-ch').onclick = showEvent
    bindHud()
    scrollTop()
  }

  function showEvent() {
    const ev = currentEvent
    if (!ev) return showEnding()
    const sn = E.snapshot(reign)

    app.innerHTML = `
      ${hudHTML()}
      <div class="body">
        <div class="event fade-up">
          <div class="ev-meta">
            <b>${esc(sn.era)} ${sn.year} 年</b>
            <span>·</span>
            <span>${sn.age} 岁</span>
            <span>·</span>
            <span>${esc(sn.stageName)}</span>
          </div>
          <h2 class="ev-title serif">${esc(ev.title)}</h2>
          <p class="ev-scene">${esc(ev.scene)}</p>
          <div class="ev-rule"></div>
        </div>
        <div class="options fade-up" style="animation-delay:.08s">
          ${(ev.options || []).map((o, i) => `
            <button class="opt" data-i="${i}">
              <span class="opt-no">${String(i + 1).padStart(2, '0')}</span>
              <span class="opt-txt">${esc(o.text)}</span>
              <span class="opt-arrow">›</span>
            </button>`).join('')}
        </div>
      </div>`

    app.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => pickOption(Number(btn.dataset.i))
    })
    bindHud()
    bindKeys()
    scrollTop()
  }

  function bindKeys() {
    document.onkeydown = e => {
      const n = Number(e.key)
      if (n >= 1 && n <= 9) {
        const btn = app.querySelector(`.opt[data-i="${n - 1}"]`)
        if (btn) btn.click()
      }
    }
  }

  function pickOption(i) {
    document.onkeydown = null
    const opt = currentEvent.options[i]
    if (!opt) return
    const out = E.choose(reign, currentEvent, i)
    showResult(opt.text, out)
  }

  function showResult(pickedText, out) {
    const deltas = out.deltas || []
    const ended = out.ended
    app.innerHTML = `
      ${hudHTML()}
      <div class="body">
        <div class="fade-up">
          <div class="picked">你批了 <em>「${esc(pickedText)}」</em></div>
          <div class="result-card">
            <p class="result-text">${esc(out.text || '')}</p>
            <div class="seal serif">御批</div>
          </div>
          ${deltas.length ? `<div class="deltas">
            ${deltas.map(d => `<span class="delta ${d.up ? 'up' : 'down'}">${esc(d.label)} ${d.value > 0 ? '+' : ''}${d.value}</span>`).join('')}
          </div>` : ''}
        </div>
        <div class="result-foot fade-up" style="animation-delay:.1s">
          <button class="btn" id="btn-continue">${ended ? '看这一朝的结局' : '继续'}</button>
          <span class="foot-note">${ended ? '该来的都来了' : '朱批既下，天下照办'}</span>
        </div>
      </div>`
    document.getElementById('btn-continue').onclick = nextEvent
    bindHud()
    scrollTop()
  }

  /* ---------------- 结局 ---------------- */

  function showEnding() {
    if (!reign) return showCover()
    if (!result) {
      try { E.setSeenPairs(A.seenPairs()) } catch (e) {}
      result = E.settle(reign)
      try { A.addSeen(result.ending._base + '|' + result.ending._scene) } catch (e) {}
    }
    if (!record) record = A.make(reign, result, { tags: E.fateLabel(reign) })
    A.upsert(record)
    renderEnding(record, true)
  }

  function renderEnding(rec, live) {
    const sc = rec.sc || { merit: 0, welfare: 0, order: 0, renown: 0, total: 0 }
    const DIMS = [
      ['功业', sc.merit], ['民生', sc.welfare], ['国祚', sc.order], ['威名', sc.renown]
    ]
    const timeline = rec.log || []
    const shown = 10
    const visible = showAllTimeline ? timeline : timeline.slice(0, shown)
    const more = timeline.length - shown

    const heroMeta = []
    heroMeta.push(`${rec.dynasty || ''}${rec.era ? ' · ' + rec.era : ''}`)
    heroMeta.push(`在位 ${rec.years || 0} 年`)
    heroMeta.push(`年 ${rec.age || 0}`)
    heroMeta.push(rec.female ? '女帝' : '皇帝')

    app.innerHTML = `
      ${live ? '' : `<div class="back-bar"><span class="back-btn" id="btn-back">‹ 返回本纪</span></div>`}
      <section class="hero fade-up">
        <div class="hero-meta">${heroMeta.map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <h1 class="hero-title serif">${esc(rec.title)}</h1>
        <p class="hero-sub">${esc(rec.subtitle)}</p>
        <p class="hero-post">谥曰${esc(rec.posthumous || '思')} · ${esc(rec.origin || '')}</p>
        <div class="hero-line"></div>
        <p class="hero-desc">${esc(rec.desc)}</p>
        ${rec.sceneLine ? `<div class="hero-scene">${esc(rec.sceneLine)}</div>` : ''}
        <div class="hero-tags">${(rec.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
      </section>

      <div class="section">
        <div class="sec-head"><span class="sec-no">01</span><span class="sec-title">你留下了什么</span></div>
        ${DIMS.map(([label, v]) => `
          <div class="score">
            <div class="score-top"><span class="score-label">${label}</span><span class="score-value">${v}</span></div>
            <div class="score-track"><div class="score-fill" data-w="${v}"></div></div>
          </div>`).join('')}
        <span class="score-note">这四样不是评判，只是坐标。它告诉你，你把力气花在了哪里，又欠下了什么。</span>
      </div>

      <div class="section">
        <div class="sec-head"><span class="sec-no">02</span><span class="sec-title">史臣曰</span></div>
        <div class="review">
          ${(rec.review || []).map(p => `<p>${esc(p)}</p>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="sec-head"><span class="sec-no">03</span><span class="sec-title">大事记</span></div>
        <div class="timeline">
          ${visible.map(l => `
            <div class="tl-item">
              <span class="tl-dot ${l.tone || 'neutral'}"></span>
              <div class="tl-head">
                <span class="tl-year">${esc(l.year)} 年</span>
                <span class="tl-title">${esc(l.title)}</span>
              </div>
              ${l.choice ? `<span class="tl-choice">${esc(l.choice)}</span>` : ''}
            </div>`).join('')}
        </div>
        ${(!showAllTimeline && more > 0) ? `<div class="tl-toggle" id="btn-more">展开前 ${more} 件事</div>` : ''}
      </div>

      <div class="section" style="padding-bottom:26px">
        <div class="sec-head"><span class="sec-no">04</span><span class="sec-title">如果重来</span></div>
        ${(rec.advice || []).map(a => `<div class="advice">
          <span class="advice-title">${esc(a.title)}</span>
          <span class="advice-text">${esc(a.text)}</span>
        </div>`).join('')}
      </div>

      <div class="end-actions">
        ${live ? `<button class="btn" id="btn-again">再坐一次龙椅</button>
        <button class="btn ghost" id="btn-arc">历代本纪 · ${A.count()}</button>` : ''}
        <span class="end-note">${live ? '这一局已经收进本纪，随时可以回看' : '这一局的存档'}</span>
      </div>`

    setTimeout(() => {
      app.querySelectorAll('.score-fill').forEach(el => { el.style.width = (el.dataset.w || 0) + '%' })
    }, 80)

    if (!live) {
      const back = document.getElementById('btn-back')
      if (back) back.onclick = showArchive
      return
    }
    const again = document.getElementById('btn-again')
    if (again) again.onclick = () => { showCover() }
    const arc = document.getElementById('btn-arc')
    if (arc) arc.onclick = showArchive
    const moreBtn = document.getElementById('btn-more')
    if (moreBtn) moreBtn.onclick = () => { showAllTimeline = true; renderEnding(record, true) }
    scrollTop()
  }

  /* ---------------- 档案 ---------------- */

  function showArchive() {
    const list = A.all()
    app.innerHTML = `
      <div class="arc-head">
        <span class="overline">IMPERIAL ARCHIVE</span>
        <h1 class="arc-title serif">历代本纪</h1>
        <p class="subtitle" style="font-size:12.5px">存下的 ${list.length} 朝。点一条，可以重读那一朝的本纪。</p>
      </div>
      ${list.length ? `<div class="arc-list">
        ${list.map(r => `<div class="arc-item" data-id="${r.id}">
          <div class="arc-row1">
            <span class="arc-name">${esc(r.title)}</span>
            <span class="arc-total">${r.sc ? r.sc.total : 0}</span>
          </div>
          <div class="arc-sub">${esc(r.subtitle || '')}</div>
          <div class="arc-meta">${esc(r.dynasty || '')} · ${esc(r.era || '')} · 在位 ${r.years || 0} 年 · ${esc(r.origin || '')} · ${esc(A.stamp(r.ts))}</div>
        </div>`).join('')}
      </div>` : `<div class="arc-empty">还没有存下的本纪。<br/>坐上龙椅，写一份。</div>`}
      <div class="end-actions" style="padding-top:0">
        <button class="btn ghost" id="btn-home">回封面</button>
      </div>`

    app.querySelectorAll('.arc-item').forEach(el => {
      el.onclick = () => {
        const rec = A.get(el.dataset.id)
        if (rec) {
          showAllTimeline = false
          renderEnding(rec, false)
        }
      }
    })
    document.getElementById('btn-home').onclick = () => { reign = null; showCover() }
    scrollTop()
  }

  /* ---------------- 启动 ---------------- */

  showCover()
})()
</script>
