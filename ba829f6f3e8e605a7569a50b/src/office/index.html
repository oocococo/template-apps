<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>格子间 · 办公室模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231e1d1a'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23f5f2ea'/%3E%3Crect x='7' y='15' width='12' height='2' fill='%23b23a2f'/%3E%3Crect x='7' y='20' width='15' height='2' fill='%23f5f2ea' opacity='.55'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f4f1e9;
  --paper2:#eae5d9;
  --card:#fffdf7;
  --ink:#1d1c19;
  --ink2:#3d3a33;
  --muted:#837c6e;
  --line:#dcd5c5;
  --line2:#c9c0ac;
  --accent:#b23a2f;
  --accent-soft:#f3e2dd;
  --green:#2f5d50;
  --gold:#9c7c37;
  --shadow:0 1px 2px rgba(40,35,25,.05),0 8px 24px rgba(40,35,25,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{
  margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.75;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.7), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(210,200,180,.35), transparent 46%),
    var(--paper);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:repeating-linear-gradient(0deg,rgba(120,110,90,.035) 0 1px,transparent 1px 3px);
}
.wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 22px 64px}
.serif{font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.top .brand{display:flex;align-items:center;gap:8px}
.top .dot{width:7px;height:7px;background:var(--accent);border-radius:1px;transform:rotate(45deg)}
.top button{background:none;border:none;color:var(--muted);font-size:12px;letter-spacing:.08em;cursor:pointer;padding:6px 0;font-family:inherit}
.top button:hover{color:var(--ink)}

/* ---------- 封面 ---------- */
.cover{padding:8vh 0 0;text-align:left}
.cover .kicker{font-size:11px;letter-spacing:.34em;color:var(--accent);margin-bottom:22px}
.cover h1{font-size:clamp(46px,12vw,78px);line-height:.95;margin:0 0 18px;letter-spacing:.04em;font-weight:600}
.cover h1 .thin{display:block;font-size:.26em;letter-spacing:.42em;color:var(--muted);margin-top:18px;font-weight:400}
.cover .lead{font-size:15px;color:var(--ink2);max-width:30em;margin:0 0 10px;line-height:2}
.cover .meta{display:flex;gap:22px;flex-wrap:wrap;font-size:11px;color:var(--muted);letter-spacing:.14em;margin:26px 0 40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.cover .meta span{white-space:nowrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--ink);color:#f7f3e8;border:1px solid var(--ink);
  font-family:inherit;font-size:15px;letter-spacing:.12em;
  padding:15px 30px;cursor:pointer;transition:.18s;border-radius:2px;
}
.btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--ink);color:#f7f3e8;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.cover .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cover .foot{margin-top:34px;font-size:11px;color:var(--muted);letter-spacing:.1em;line-height:2}

/* ---------- 入职表 ---------- */
.reveal{padding:20px 0 0}
.reveal .head{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:12px}
.reveal h2{font-size:28px;margin:0 0 6px;letter-spacing:.03em;font-weight:600}
.reveal .sub{font-size:13px;color:var(--muted);margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px 20px 18px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.card-label{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.24em;color:var(--muted);margin-bottom:14px;border-bottom:1px dashed var(--line);padding-bottom:9px}
.card-label b{color:var(--accent);font-weight:400;letter-spacing:.1em}
.company-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.company-tag{font-size:20px;letter-spacing:.04em;font-weight:600}
.company-desc{font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.95}
.company-note{font-size:12.5px;color:var(--muted);margin-top:12px;padding-left:11px;border-left:2px solid var(--accent-soft);line-height:1.9}
.salary{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--green);white-space:nowrap;padding-top:3px}
.talent{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.talent:last-child{margin-bottom:0}
.talent .tname{font-size:16px;font-weight:600;white-space:nowrap}
.talent .tdesc{font-size:13px;color:var(--muted);line-height:1.8}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-item{border:1px solid var(--line);padding:10px 10px 9px;border-radius:2px;background:#fdfbf4}
.stat-item .k{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:5px}
.stat-item .v{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:21px;color:var(--ink);line-height:1}
.stat-item .v small{font-size:10px;color:var(--muted);margin-left:2px}
.reveal .actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper) 76%,rgba(244,241,233,0));padding:12px 0 10px;margin-bottom:6px}
.hud-inner{background:rgba(255,253,247,.92);border:1px solid var(--line);border-radius:3px;padding:11px 14px 10px;backdrop-filter:blur(10px)}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);letter-spacing:.03em}
.hud-top .when{color:var(--ink);font-size:12px}
.hud-top .when b{font-weight:600;font-size:15px;letter-spacing:0}
.hud-top .rank{color:var(--accent);letter-spacing:.06em}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:9px}
.metric{font-size:10px;color:var(--muted);letter-spacing:.1em}
.metric .mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.metric .mnum{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--ink2);letter-spacing:0}
.mbar{height:3px;background:var(--paper2);border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ink2);border-radius:2px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.mbar i.warn{background:var(--accent)}
.mbar i.good{background:var(--green)}

/* ---------- 事件 ---------- */
.stage-tag{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.stage-tag::after{content:"";flex:1;height:1px;background:var(--line)}
.event-head{margin:0 0 14px}
.event-title{font-size:26px;line-height:1.35;margin:0 0 12px;letter-spacing:.02em;font-weight:600}
.event-scene{font-size:16px;line-height:2.05;color:var(--ink2);margin:0}
.event-scene::first-letter{letter-spacing:0}
.options{margin:24px 0 8px;display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:15px 16px;font-family:inherit;font-size:15px;line-height:1.7;color:var(--ink);
  cursor:pointer;transition:.16s;position:relative;
}
.opt .idx{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);padding-top:3px;min-width:16px}
.opt:hover{border-color:var(--ink);background:#fff;transform:translateY(-1px);box-shadow:0 4px 14px rgba(40,35,25,.07)}
.opt:hover .idx{color:var(--accent)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .idx{color:var(--accent)}
.opt:disabled{cursor:default}

/* ---------- 结果 ---------- */
.result{padding:22px 0 0}
.result .chosen{font-size:12px;letter-spacing:.18em;color:var(--muted);margin-bottom:10px}
.result .chosen b{color:var(--accent);font-weight:500;letter-spacing:.04em}
.result-body{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;padding:20px;font-size:16px;line-height:2.05;color:var(--ink2);box-shadow:var(--shadow)}
.result-body.good{border-left-color:var(--green)}
.result-body.bad{border-left-color:#8c2f28}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.02em;border:1px solid var(--line2);padding:5px 9px;border-radius:2px;background:#fdfbf4;color:var(--ink2)}
.chip.up{color:var(--green);border-color:#bcd0c7;background:#f2f7f3}
.chip.down{color:var(--accent);border-color:#e3c6c0;background:#fbf1ef}
.result .actions{margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hint{font-size:11px;color:var(--muted);letter-spacing:.08em}

/* ---------- 结局 ---------- */
.ending{padding:26px 0 0}
.ending .kicker{font-size:11px;letter-spacing:.34em;color:var(--accent);margin-bottom:16px}
.ending h1{font-size:clamp(38px,10vw,58px);line-height:1.08;margin:0 0 12px;letter-spacing:.02em;font-weight:600}
.ending .tagline{font-size:14px;color:var(--muted);letter-spacing:.06em;margin-bottom:26px}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 8px}
.score{background:var(--card);padding:14px 12px 12px}
.score .k{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:6px}
.score .v{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:26px;line-height:1}
.score .b{margin-top:9px;height:2px;background:var(--paper2)}
.score .b i{display:block;height:100%;background:var(--ink2)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);letter-spacing:.1em;padding:10px 2px 26px}
.total-row b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:22px;color:var(--ink);letter-spacing:0}
.sec{margin:0 0 30px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}
.sec-no{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:10px;color:var(--accent);letter-spacing:.1em}
.sec-title{font-size:12px;letter-spacing:.24em;color:var(--muted)}
.sec-line{flex:1;height:1px;background:var(--line)}
.ending-text{font-size:16.5px;line-height:2.1;color:var(--ink2);margin:0}
.quote{border-left:2px solid var(--accent);padding:2px 0 2px 16px;margin:18px 0 0;font-size:15px;line-height:2;color:var(--ink2);font-style:normal}
.quote .lbl{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);margin-bottom:7px}
.recall{background:#fbf8ef;border:1px dashed var(--line2);padding:16px;font-size:14.5px;line-height:2;color:var(--ink2);border-radius:2px}
.review p{font-size:15px;line-height:2.05;color:var(--ink2);margin:0 0 12px}
.review p:last-child{margin-bottom:0}
.advice{border:1px solid var(--line);background:var(--card);border-radius:3px}
.advice-item{padding:16px 18px;border-bottom:1px dashed var(--line)}
.advice-item:last-child{border-bottom:none}
.advice-item h4{margin:0 0 7px;font-size:14px;letter-spacing:.04em;font-weight:600}
.advice-item p{margin:0;font-size:13.5px;line-height:1.95;color:var(--muted)}
.tl{border-left:1px solid var(--line);margin-left:5px;padding-left:18px}
.tl-item{position:relative;padding-bottom:15px}
.tl-item::before{content:"";position:absolute;left:-23px;top:7px;width:7px;height:7px;background:var(--paper);border:1px solid var(--line2);border-radius:50%}
.tl-item.key::before{background:var(--accent);border-color:var(--accent)}
.tl-meta{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:10px;color:var(--muted);letter-spacing:.04em}
.tl-title{font-size:13.5px;margin:2px 0 0;color:var(--ink2)}
.tl-choice{font-size:12px;color:var(--muted);margin-top:2px}
.ending .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.colophon{margin-top:34px;font-size:11px;color:var(--muted);letter-spacing:.1em;line-height:2}

/* ---------- 档案 ---------- */
.archive h2{font-size:26px;margin:8px 0 4px;letter-spacing:.04em}
.archive .sub{font-size:12px;color:var(--muted);margin-bottom:24px;letter-spacing:.06em}
.arc-item{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.arc-item:hover{padding-left:6px}
.arc-item .no{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:10px;color:var(--muted);padding-top:5px;min-width:28px}
.arc-item .body{flex:1}
.arc-item .t{font-size:16px;letter-spacing:.02em;font-weight:600}
.arc-item .m{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.arc-item .sc{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;color:var(--accent);line-height:1}
.arc-empty{font-size:14px;color:var(--muted);padding:30px 0;line-height:2}

/* ---------- 动画 ---------- */
.fade{animation:fade .5s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}

@media(max-width:520px){
  .wrap{padding:0 18px 54px}
  .event-title{font-size:23px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .scores{grid-template-columns:repeat(2,1fr)}
  .metrics{gap:9px}
  .cover{padding-top:5vh}
  .hud-top .when b{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="./core/events.js"></script>
<script src="./core/events-extra.js"></script>
<script src="./core/events-pool.js"></script>
<script src="./core/data.js"></script>
<script src="./core/generator.js"></script>
<script src="./core/engine.js"></script>
<script>
(function () {
  const E = window.OfficeEngine
  const D = window.OfficeData
  const app = document.getElementById('app')

  const A = {
    KEY: 'office_sim_archive_v1',
    list() {
      try { return JSON.parse(window.parent.hallStore.getItem(A.KEY) || '[]') } catch (e) { return [] }
    },
    save(rec) {
      const l = A.list()
      l.unshift(rec)
      try { window.parent.hallStore.setItem(A.KEY, JSON.stringify(l.slice(0, 12))) } catch (e) {}
    },
    count() { return A.list().length },
    clear() { try { window.parent.hallStore.removeItem(A.KEY) } catch (e) {} }
  }

  const S = { career: null, ev: null, before: null, picked: -1, screen: 'cover', gender: 'auto' }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const num = n => (Math.round(n * 10) / 10).toString()

  function scrollTop() { window.scrollTo({ top: 0, behavior: 'auto' }) }

  /* ---------------- 封面 ---------------- */
  function showCover() {
    S.screen = 'cover'
    const n = A.count()
    app.innerHTML = `
      <div class="top">
        <div class="brand"><span class="dot"></span><span>OFFICE SIMULATOR</span></div>
        <button id="btn-arc">${n ? '档案 ' + n : '档案'}</button>
      </div>
      <div class="cover fade">
        <div class="kicker">一份关于上班的模拟</div>
        <h1 class="serif">格子间<span class="thin">你是一个小职员</span></h1>
        <p class="lead">二十四岁入职，五十四岁离开。三十年里，你要在周报、会议、绩效、裁员和一杯又一杯的应酬里，决定自己成为一个什么样的人。</p>
        <div class="meta">
          <span>30 年 · 约 50 个瞬间</span>
          <span>四维：能力 / 人缘 / 心态 / 存款</span>
          <span>结局：走向 × 最后一幕</span>
        </div>
        <div class="actions">
          <button class="btn" id="btn-start">入职</button>
          ${n ? '<button class="btn ghost" id="btn-arc2">查看档案</button>' : ''}
        </div>
        <div class="foot">
          每个人的工位上都有一份没写完的履历。<br>
          这一局，你替另一个人写完它。
        </div>
      </div>`
    document.getElementById('btn-start').onclick = showReveal
    const b1 = document.getElementById('btn-arc')
    if (b1) b1.onclick = showArchive
    const b2 = document.getElementById('btn-arc2')
    if (b2) b2.onclick = showArchive
  }

  /* ---------------- 入职表 ---------------- */
  function showReveal() {
    S.screen = 'reveal'
    S.career = E.createCareer(S.gender)
    const s = S.career
    const snap = E.snapshot(s)
    const tags = E.fateLabel(s)
    app.innerHTML = `
      <div class="top">
        <div class="brand"><span class="dot"></span><span>入职登记</span></div>
        <button id="btn-again">换一份</button>
      </div>
      <div class="reveal">
        <div class="head fade">EMPLOYEE FILE / 001</div>
        <h2 class="serif fade d1">今天是你第一天上班</h2>
        <div class="sub fade d1">${esc(snap.companyTag)} · ${s.gender === 'f' ? '女' : '男'} · ${snap.age} 岁</div>

        <div class="card fade d2">
          <div class="card-label"><span>公司</span><span>01</span></div>
          <div class="company-row">
            <div>
              <div class="company-tag serif">${esc(s.company.tag)}</div>
            </div>
            <div class="salary">${num(s.salary)}k / 月</div>
          </div>
          <div class="company-desc">${esc(s.company.desc)}</div>
          <div class="company-note">${esc(s.company.note)}</div>
        </div>

        <div class="card fade d3">
          <div class="card-label"><span>天赋</span><span>02</span></div>
          ${s.talents.map(t => `
            <div class="talent">
              <span class="tname serif">${esc(t.name)}</span>
              <span class="tdesc">${esc(t.desc)}</span>
            </div>`).join('')}
        </div>

        <div class="card fade d4">
          <div class="card-label"><span>开局</span><span>03</span></div>
          <div class="stat-grid">
            <div class="stat-item"><div class="k">能力</div><div class="v">${s.skill}</div></div>
            <div class="stat-item"><div class="k">人缘</div><div class="v">${s.rep}</div></div>
            <div class="stat-item"><div class="k">心态</div><div class="v">${s.mind}</div></div>
            <div class="stat-item"><div class="k">存款</div><div class="v">${num(s.money)}<small>万</small></div></div>
          </div>
          ${tags.length ? `<div class="company-note" style="border-left-color:var(--line2);margin-top:14px">旁人看你：${esc(tags.join('、'))}</div>` : ''}
        </div>

        <div class="actions fade d4">
          <button class="btn" id="btn-go">开始第一天</button>
          <button class="btn ghost" id="btn-respin">换一份人生</button>
        </div>
      </div>`
    document.getElementById('btn-go').onclick = startGame
    document.getElementById('btn-respin').onclick = showReveal
    document.getElementById('btn-again').onclick = showReveal
    scrollTop()
  }

  /* ---------------- 游戏 ---------------- */
  function startGame() {
    S.screen = 'game'
    nextEvent()
  }

  function hudHTML(s) {
    const snap = E.snapshot(s)
    const bar = (label, val, cls) => `
      <div class="metric">
        <div class="mrow"><span>${label}</span><span class="mnum">${val}</span></div>
        <div class="mbar"><i class="${cls || ''}" style="width:${val}%"></i></div>
      </div>`
    return `
      <div class="hud">
        <div class="hud-inner">
          <div class="hud-top">
            <span class="when">第 <b>${snap.year}</b> 年 · ${snap.age} 岁</span>
            <span class="rank">${esc(snap.rankName)}</span>
            <span>${num(s.money)} 万</span>
          </div>
          <div class="metrics">
            ${bar('能力', snap.skill, snap.skill < 35 ? 'warn' : '')}
            ${bar('人缘', snap.rep, snap.rep < 30 ? 'warn' : '')}
            ${bar('心态', snap.mind, snap.mind < 32 ? 'warn' : '')}
          </div>
        </div>
      </div>`
  }
  function nextEvent() {
    const s = S.career
    const ev = E.getNextEvent(s)
    if (!ev) return showEnding()
    S.ev = ev
    S.picked = -1
    renderEvent()
  }

  function renderEvent() {
    const s = S.career
    const snap = E.snapshot(s)
    const ev = S.ev
    const stageName = (D.STAGES[ev.stage] || {}).name || ''
    app.innerHTML = `
      ${hudHTML(s)}
      <div class="stage-tag">${esc(stageName)} · 第 ${snap.month} 个月</div>
      <div class="event-head up">
        <h1 class="event-title serif">${esc(ev.title)}</h1>
        <p class="event-scene">${esc(ev.scene)}</p>
      </div>
      <div class="options up d1">
        ${ev.options.map((o, i) => `
          <button class="opt" data-i="${i}">
            <span class="idx">0${i + 1}</span>
            <span>${esc(o.text)}</span>
          </button>`).join('')}
      </div>
      <div class="hint" style="margin-top:14px">选择一个做法。没有正确答案。</div>`
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), btn => {
      btn.onclick = () => pickOption(parseInt(btn.dataset.i, 10))
    })
    scrollTop()
  }

  function pickOption(i) {
    if (S.picked >= 0) return
    S.picked = i
    const s = S.career
    const ev = S.ev
    const before = { money: s.money, mind: s.mind, skill: s.skill, rep: s.rep, rank: s.rank, salary: s.salary }
    const out = E.choose(s, ev, i)
    if (!out) return
    renderResult(before, ev, i, out)
  }

  function deltaChips(before, s) {
    const chips = []
    const push = (label, d, unit, invert) => {
      if (!d) return
      const up = d > 0
      const good = invert ? !up : up
      chips.push(`<span class="chip ${good ? 'up' : 'down'}">${label} ${up ? '+' : ''}${num(d)}${unit || ''}</span>`)
    }
    push('能力', s.skill - before.skill)
    push('人缘', s.rep - before.rep)
    push('心态', s.mind - before.mind)
    push('存款', Math.round((s.money - before.money) * 10) / 10, ' 万')
    if (s.rank !== before.rank) push('职级', s.rank - before.rank, ' 级')
    if (s.salary !== before.salary) push('月薪', Math.round((s.salary - before.salary) * 10) / 10, 'k')
    return chips.join('')
  }

  function renderResult(before, ev, idx, out) {
    const s = S.career
    const opt = ev.options[idx]
    const chips = deltaChips(before, s)
    app.innerHTML = `
      ${hudHTML(s)}
      <div class="result">
        <div class="chosen">你选择了 <b>${esc(opt.text)}</b></div>
        <div class="result-body ${out.tone || ''} up">${esc(out.text)}</div>
        ${chips ? `<div class="deltas up d1">${chips}</div>` : ''}
        <div class="actions up d2">
          <button class="btn" id="btn-next">继续</button>
          <span class="hint">${esc(ev.title)} · ${E.snapshot(s).age} 岁</span>
        </div>
      </div>`
    document.getElementById('btn-next').onclick = nextEvent
    scrollTop()
  }

  /* ---------------- 结局 ---------------- */
  function showEnding() {
    const s = S.career
    const res = E.settle(s)
    const end = res.ending
    const sc = res.sc

    A.save({
      ts: Date.now(),
      company: s.company.tag,
      talent: s.talents.map(t => t.name),
      ending: end.title,
      base: end._base,
      scene: end._scene,
      total: sc.total,
      age: s.finalAge,
      rank: D.RANKS[s.rank],
      money: Math.round(s.money * 10) / 10,
      log: s.log.filter(l => l.kind === 'choice').slice(-40)
    })

    const scoreItem = (k, v, color) => `
      <div class="score">
        <div class="k">${k}</div>
        <div class="v">${v}</div>
        <div class="b"><i style="width:${v}%"></i></div>
      </div>`

    const choices = s.log.filter(l => l.kind === 'choice' && l.choice)
    const picks = choices

    app.innerHTML = `
      <div class="top">
        <div class="brand"><span class="dot"></span><span>档案 / 结案</span></div>
        <button id="btn-home">返回封面</button>
      </div>
      <div class="ending">
        <div class="kicker fade">${esc(end.tag)}</div>
        <h1 class="serif fade d1">${esc(end.title)}</h1>
        <div class="tagline fade d1">${esc(s.company.tag)} · ${s.finalAge} 岁 · 最后职级 ${esc(D.RANKS[s.rank])} · 存款 ${num(s.money)} 万</div>

        <div class="scores fade d2">
          ${scoreItem('存款', sc.wealth)}
          ${scoreItem('位子', sc.rank)}
          ${scoreItem('心态', sc.mind)}
          ${scoreItem('本事', sc.skill)}
        </div>
        <div class="total-row fade d2"><span>综合</span><span><b>${sc.total}</b> / 100</span></div>

        <div class="sec fade d3">
          <div class="sec-head"><span class="sec-no">01</span><span class="sec-title">这一局</span><span class="sec-line"></span></div>
          <p class="ending-text">${esc(end.desc)}</p>
          <div class="quote">
            <span class="lbl">最后一幕</span>
            ${esc(end.scene)}
          </div>
        </div>

        ${end.recall ? `
        <div class="sec fade d3">
          <div class="sec-head"><span class="sec-no">02</span><span class="sec-title">一个岔口</span><span class="sec-line"></span></div>
          <div class="recall">${esc(end.recall.text)}</div>
        </div>` : ''}

        <div class="sec fade d4">
          <div class="sec-head"><span class="sec-no">03</span><span class="sec-title">回头看一眼</span><span class="sec-line"></span></div>
          <div class="review">
            ${res.review.map(l => `<p>${esc(l)}</p>`).join('')}
            <p style="color:var(--muted);font-size:14px">${esc(end.closing)}</p>
          </div>
        </div>

        <div class="sec">
          <div class="sec-head"><span class="sec-no">04</span><span class="sec-title">你走过的路</span><span class="sec-line"></span></div>
          <div class="tl">
            ${picks.map((l, i) => `
              <div class="tl-item ${i % 3 === 0 ? 'key' : ''}">
                <div class="tl-meta">${Math.floor((l.month - 1) / 12) + 1} 年 · ${l.age} 岁</div>
                <div class="tl-title">${esc(l.title)}</div>
                <div class="tl-choice">${esc(l.choice)}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="sec">
          <div class="sec-head"><span class="sec-no">05</span><span class="sec-title">如果还能说点什么</span><span class="sec-line"></span></div>
          <div class="advice">
            ${res.advice.map(a => `
              <div class="advice-item">
                <h4>${esc(a.title)}</h4>
                <p>${esc(a.text)}</p>
              </div>`).join('')}
          </div>
        </div>

        <div class="actions">
          <button class="btn" id="btn-restart">再上一辈子班</button>
          <button class="btn ghost" id="btn-arc">查看档案</button>
        </div>
        <div class="colophon">
          格子间 · 办公室模拟器<br>
          一局三十年。第 ${A.count()} 份档案。
        </div>
      </div>`

    document.getElementById('btn-restart').onclick = () => {
      S.gender = 'auto'
      showReveal()
    }
    document.getElementById('btn-home').onclick = showCover
    const ba = document.getElementById('btn-arc')
    if (ba) ba.onclick = showArchive
    scrollTop()
  }

  /* ---------------- 档案 ---------------- */
  function showArchive() {
    S.screen = 'archive'
    const list = A.list()
    app.innerHTML = `
      <div class="top">
        <div class="brand"><span class="dot"></span><span>档案室</span></div>
        <button id="btn-home">返回封面</button>
      </div>
      <div class="archive">
        <h2 class="serif">已归档的三十年</h2>
        <div class="sub">一共 ${list.length} 份。每一份都是某个人在一个不存在的办公室里过完的一生。</div>
        ${list.length ? list.map((r, i) => `
          <div class="arc-item">
            <div class="no">${String(list.length - i).padStart(3, '0')}</div>
            <div class="body">
              <div class="t">${esc(r.ending)}</div>
              <div class="m">${esc(r.company)} · ${esc(r.rank || '')} · ${r.age} 岁 · ${r.money} 万 · ${new Date(r.ts).toLocaleDateString('zh-CN')}</div>
            </div>
            <div class="sc">${r.total}</div>
          </div>`).join('') : '<div class="arc-empty">还没有档案。去上三十年的班，再回来看。</div>'}
        <div class="actions" style="display:flex;gap:12px;margin-top:28px">
          <button class="btn" id="btn-new">入职</button>
          ${list.length ? '<button class="btn ghost" id="btn-clear">清空档案</button>' : ''}
        </div>
      </div>`
    document.getElementById('btn-home').onclick = showCover
    document.getElementById('btn-new').onclick = showReveal
    const bc = document.getElementById('btn-clear')
    if (bc) bc.onclick = () => {
      if (confirm('清空所有档案？这一步不能撤回。')) { A.clear(); showArchive() }
    }
    scrollTop()
  }

  /* 启动 */
  showCover()
})();
</script>
