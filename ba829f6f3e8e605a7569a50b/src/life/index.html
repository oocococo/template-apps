<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>人生模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23f6f3ee'/%3E%3Crect x='8' y='8' width='48' height='48' rx='4' fill='none' stroke='%23a8442a' stroke-width='2'/%3E%3Ctext x='32' y='43' font-size='30' font-family='serif' text-anchor='middle' fill='%231c1a17'%3E%E7%94%9F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f6f3ee;
    --card: #fffdfa;
    --ink: #1c1a17;
    --ink2: #4a443c;
    --muted: #8a837a;
    --faint: #b3a99b;
    --line: #e6ded1;
    --line2: #ece5d9;
    --accent: #a8442a;
    --green: #5c6b52;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #e9e3d8;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; justify-content: center; min-height: 100vh; }

  #app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    background: var(--bg);
    box-shadow: 0 0 80px rgba(60, 45, 30, 0.1);
    position: relative;
    overflow-x: hidden;
  }

  .serif { font-family: "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", serif; }

  /* ===== 动画 ===== */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade-up { animation: fadeUp 0.45s cubic-bezier(.22,1,.36,1) both; }
  .fade-in { animation: fadeIn 0.6s ease both; }

  /* ===== 通用 ===== */
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 50px; border: none; border-radius: 3px;
    background: var(--ink); color: var(--bg);
    font-size: 15px; letter-spacing: 2px; font-family: inherit;
    cursor: pointer; transition: opacity .15s;
  }
  .btn:active { opacity: .8; }

  .chip {
    display: inline-block; padding: 4px 10px; margin: 0 8px 8px 0;
    border-radius: 2px; background: #efe9df; color: #6b6157;
    font-size: 11px; letter-spacing: 1px;
  }

  /* ===== 封面 ===== */
  .cover {
    min-height: 100vh; padding: 0 32px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .cover::before {
    content: ''; position: absolute; top: -18%; right: -32%;
    width: 320px; height: 320px; border: 1px solid #e8e1d5; border-radius: 50%; opacity: .7;
  }
  .cover::after {
    content: ''; position: absolute; bottom: -14%; left: -36%;
    width: 270px; height: 270px; border: 1px solid #e8e1d5; border-radius: 50%; opacity: .6;
  }
  .cover-inner { width: 100%; position: relative; z-index: 2; }
  .archive-no { display: flex; align-items: center; margin-bottom: 48px; }
  .archive-line { width: 26px; height: 1px; background: var(--accent); margin-right: 9px; }
  .archive-text {
    font-size: 10px; letter-spacing: 1.6px; color: var(--accent);
    font-family: "Courier New", monospace;
  }
  .title { font-size: 58px; line-height: 1.12; font-weight: 600; letter-spacing: 5px; }
  .title span { display: block; }
  .subtitle {
    margin-top: 22px; font-size: 14.5px; color: #6b6157;
    letter-spacing: .5px; line-height: 1.85;
  }
  .cover-divider { height: 1px; background: #ddd5c8; margin: 26px 0 22px; }
  .copy-line { display: block; font-size: 13px; color: var(--muted); line-height: 2.05; letter-spacing: .5px; }
  .cover-bottom { margin-top: 56px; }
  .cover-hint {
    display: block; text-align: center; margin-top: 14px;
    font-size: 11px; color: #a89f93; letter-spacing: .8px;
  }

  /* ===== 出场设置 ===== */
  .reveal { padding: 0 22px 40px; }
  .reveal-head { padding: 34px 0 22px; }
  .overline { display: block; font-size: 11px; letter-spacing: 4px; color: var(--accent); margin-bottom: 10px; }
  .reveal-title { font-size: 27px; font-weight: 600; letter-spacing: 1px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 3px; padding: 22px 20px; margin-bottom: 14px;
  }
  .card-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .card-label { font-size: 11px; letter-spacing: 4px; color: var(--muted); }
  .card-index { font-family: "Courier New", monospace; font-size: 10px; color: #cfc5b5; }

  .birth-tag { display: block; font-size: 24px; font-weight: 600; letter-spacing: 2px; margin-bottom: 12px; }
  .birth-desc { font-size: 13.5px; line-height: 1.9; color: var(--ink2); }

  .stat-line { display: flex; align-items: center; margin-top: 18px; }
  .stat-track { flex: 1; height: 3px; background: var(--line2); border-radius: 2px; overflow: hidden; margin-right: 10px; }
  .stat-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .9s ease; }
  .stat-num { font-size: 11px; color: var(--muted); letter-spacing: .8px; }

  .birth-note { display: flex; margin-top: 17px; padding-top: 15px; border-top: 1px dashed #e0d8ca; }
  .note-mark { color: var(--accent); margin-right: 6px; }
  .note-text { flex: 1; font-size: 12.5px; line-height: 1.85; color: #6b6157; }

  .talent + .talent { margin-top: 17px; padding-top: 17px; border-top: 1px dashed #e0d8ca; }
  .talent-name { display: block; font-size: 17px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; }
  .talent-desc { font-size: 13px; line-height: 1.85; color: #6b6157; }

  .tag-block { padding: 4px 0 20px; }
  .tag-label { display: block; font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }

  .reveal-foot { padding: 4px 0 22px; }
  .foot-copy { display: block; font-size: 13.5px; line-height: 1.9; color: var(--ink2); letter-spacing: .5px; }
  .foot-copy.dim { color: var(--muted); font-size: 12.5px; }
  .respin {
    text-align: center; padding: 16px 0 0; font-size: 12px;
    color: var(--muted); letter-spacing: .8px; cursor: pointer;
  }

  /* ===== HUD ===== */
  .hud {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: 14px 22px 11px; border-bottom: 1px solid var(--line);
  }
  .hud-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .hud-left { display: flex; align-items: baseline; }
  .hud-stage { font-size: 12px; letter-spacing: 4px; margin-right: 8px; }
  .hud-age { font-size: 11px; color: var(--muted); }
  .hud-money { font-size: 11px; color: var(--accent); font-family: "Courier New", monospace; }
  .progress-track { height: 2px; background: var(--line); margin-bottom: 11px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--ink); transition: width .5s ease; }

  .metrics { display: flex; }
  .metric { flex: 1; display: flex; align-items: center; margin-right: 12px; }
  .metric:last-child { margin-right: 0; }
  .m-label { font-size: 10px; color: var(--muted); margin-right: 5px; }
  .m-bar { flex: 1; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; margin-right: 5px; }
  .m-fill { height: 100%; background: var(--green); border-radius: 1px; transition: width .4s ease, background .3s; }
  .m-fill.warn { background: var(--accent); }
  .m-num { font-size: 9.5px; color: var(--faint); font-family: "Courier New", monospace; width: 17px; text-align: right; }

  /* ===== 章节 ===== */
  .chapter {
    min-height: calc(100vh - 96px); padding: 0 30px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .chapter-inner { padding-top: 21vh; }
  .chapter-no { display: block; font-size: 11px; letter-spacing: 8px; color: var(--accent); margin-bottom: 14px; }
  .chapter-title-row { display: flex; align-items: baseline; margin-bottom: 17px; }
  .chapter-name { font-size: 47px; font-weight: 600; letter-spacing: 7px; line-height: 1.1; }
  .chapter-range { margin-left: 12px; font-size: 12px; color: var(--muted); }
  .chapter-line { width: 40px; height: 2px; background: var(--accent); margin-bottom: 18px; }
  .chapter-tip { font-size: 14px; line-height: 2; color: var(--ink2); letter-spacing: .5px; }
  .chapter-income {
    display: block; margin-top: 16px; font-size: 12px; color: var(--muted);
    font-family: "Courier New", monospace; opacity: 0; transition: opacity .6s ease .3s;
  }
  .chapter-income.show { opacity: 1; }
  .chapter-foot { padding-bottom: 50px; }

  /* ===== 事件 ===== */
  .body { padding: 0 22px 40px; }
  .event-card {
    padding: 26px 22px 24px; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px;
    margin-top: 18px; position: relative;
  }
  .event-card::before {
    content: ''; position: absolute; left: -1px; top: -1px;
    width: 3px; height: 32px; background: var(--accent);
  }
  .ev-meta { display: flex; align-items: center; margin-bottom: 13px; }
  .ev-age { font-size: 10.5px; color: var(--accent); letter-spacing: 1.5px; font-family: "Courier New", monospace; }
  .ev-dot { margin: 0 5px; color: #cfc5b5; font-size: 10px; }
  .ev-year { font-size: 10.5px; color: var(--faint); letter-spacing: .8px; }
  .ev-title { font-size: 24px; font-weight: 600; line-height: 1.45; letter-spacing: 1.5px; margin-bottom: 15px; }
  .ev-scene { font-size: 14px; line-height: 2; color: var(--ink2); letter-spacing: .3px; text-align: justify; }

  .options {
    margin-top: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 3px; overflow: hidden;
  }
  .option {
    display: flex; align-items: center; width: 100%; text-align: left;
    padding: 17px 16px; background: none; border: none; font-family: inherit;
    position: relative; cursor: pointer; transition: background .15s;
  }
  .option + .option::before {
    content: ''; position: absolute; left: 16px; right: 16px; top: 0;
    height: 1px; background: var(--line2);
  }
  .option:hover { background: #f6f1e7; }
  .option:active { background: #f2ece1; }
  .opt-no { font-family: "Courier New", monospace; font-size: 10px; color: #c4b9a8; width: 22px; flex-shrink: 0; }
  .opt-text { flex: 1; font-size: 14px; line-height: 1.65; color: var(--ink); letter-spacing: .3px; }
  .opt-arrow { font-size: 17px; color: #d3c9ba; margin-left: 8px; }

  .auto-wrap { margin-top: 20px; }

  /* ===== 结果 ===== */
  .result-wrap { padding-top: 24px; }
  .picked { padding-bottom: 17px; margin-bottom: 17px; border-bottom: 1px dashed #ddd5c8; }
  .picked-label { display: block; font-size: 10px; letter-spacing: 3px; color: var(--faint); margin-bottom: 6px; }
  .picked-text { font-size: 14px; color: var(--accent); letter-spacing: .5px; line-height: 1.6; }
  .result-body { padding-left: 14px; border-left: 2px solid var(--line); }
  .result-body.good { border-left-color: var(--green); }
  .result-body.bad { border-left-color: var(--accent); }
  .result-text { font-size: 14.5px; line-height: 2.1; color: #2b2723; letter-spacing: .3px; text-align: justify; }

  .deltas { display: flex; flex-wrap: wrap; margin-top: 18px; }
  .delta {
    font-size: 10.5px; font-family: "Courier New", monospace;
    padding: 3px 8px; margin: 0 7px 6px 0;
    border: 1px solid #e0d8ca; border-radius: 2px; letter-spacing: .5px;
  }
  .delta.up { color: var(--green); border-color: #ccd6c4; background: #f3f6ef; }
  .delta.down { color: var(--accent); border-color: #e6cfc7; background: #faf1ed; }

  .result-foot { margin-top: 32px; }
  .foot-note { display: block; text-align: center; margin-top: 12px; font-size: 10.5px; color: var(--faint); letter-spacing: .5px; }

  /* ===== 结局 ===== */
  .hero { background: var(--card); padding: 38px 28px 32px; border-bottom: 1px solid var(--line); }
  .hero-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 27px; }
  .hero-age { font-size: 10.5px; letter-spacing: 2.5px; color: var(--accent); font-family: "Courier New", monospace; }
  .hero-birth { font-size: 10.5px; letter-spacing: 1.5px; color: var(--faint); }
  .hero-title { font-size: 35px; font-weight: 600; line-height: 1.35; letter-spacing: 3px; margin-bottom: 9px; }
  .hero-sub { font-size: 12.5px; color: var(--muted); letter-spacing: 1.5px; line-height: 1.7; margin-bottom: 22px; }
  .hero-line { width: 32px; height: 2px; background: var(--accent); margin-bottom: 20px; }
  .hero-desc { font-size: 14.5px; line-height: 2.15; color: #2b2723; letter-spacing: .3px; text-align: justify; white-space: pre-line; }
  .hero-tags { margin-top: 22px; }

  .section { padding: 0 22px; margin-top: 36px; }
  .sec-head {
    display: flex; align-items: center; margin-bottom: 20px;
    padding-bottom: 11px; border-bottom: 1px solid var(--line);
  }
  .sec-no { font-family: "Courier New", monospace; font-size: 10px; color: #c4b9a8; width: 26px; }
  .sec-title { font-size: 13px; letter-spacing: 4px; }

  .score { margin-bottom: 15px; }
  .score-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .score-label { font-size: 12.5px; color: var(--ink2); letter-spacing: 1.5px; }
  .score-value { font-family: "Courier New", monospace; font-size: 12px; color: var(--muted); }
  .score-track { height: 4px; background: var(--line2); border-radius: 2px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 2px; width: 0; transition: width 1.1s cubic-bezier(.22,1,.36,1); }
  .score-note { display: block; margin-top: 20px; font-size: 11.5px; line-height: 1.9; color: #9a9186; }

  .tl-item { position: relative; padding-left: 17px; padding-bottom: 17px; }
  .tl-item::before {
    content: ''; position: absolute; left: 2.5px; top: 9px; bottom: 0;
    width: 1px; background: #e3ddd2;
  }
  .tl-item:last-child::before { bottom: 10px; }
  .tl-dot {
    position: absolute; left: 0; top: 6px; width: 6px; height: 6px;
    border-radius: 50%; background: #d3c9ba;
  }
  .tl-dot.good { background: var(--green); }
  .tl-dot.bad { background: var(--accent); }
  .tl-head { display: flex; align-items: baseline; margin-bottom: 3px; }
  .tl-age {
    font-family: "Courier New", monospace; font-size: 10.5px; color: var(--faint);
    width: 42px; flex-shrink: 0;
  }
  .tl-title { font-size: 13px; letter-spacing: .5px; }
  .tl-choice { font-size: 11.5px; color: var(--muted); line-height: 1.7; padding-left: 42px; }
  .tl-toggle { text-align: center; padding: 8px 0; font-size: 11.5px; color: var(--accent); letter-spacing: .8px; cursor: pointer; }

  .review-p {
    display: block; font-size: 14px; line-height: 2.05; color: #2b2723;
    letter-spacing: .3px; text-align: justify;
    margin-bottom: 15px; padding-left: 12px; border-left: 2px solid var(--line2);
  }
  .review-p:last-child { margin-bottom: 0; }

  .advice {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 3px; padding: 18px 17px; margin-bottom: 12px;
  }
  .advice-head { display: flex; align-items: center; margin-bottom: 10px; }
  .advice-index {
    font-family: "Courier New", monospace; font-size: 10px;
    background: var(--ink); color: var(--card);
    width: 18px; height: 18px; line-height: 18px; text-align: center;
    border-radius: 2px; margin-right: 9px; flex-shrink: 0;
  }
  .advice-title { font-size: 13.5px; font-weight: 600; letter-spacing: 1px; }
  .advice-text { font-size: 13px; line-height: 2; color: var(--ink2); letter-spacing: .3px; text-align: justify; }

  .closing { text-align: center; padding: 50px 22px 34px; }
  .closing-line { width: 1px; height: 30px; background: #ddd5c8; margin: 0 auto 20px; }
  .closing-main { display: block; font-size: 17px; letter-spacing: 5px; margin-bottom: 7px; }
  .closing-sub { display: block; font-size: 12.5px; letter-spacing: 2px; color: var(--muted); }

  .actions { padding: 0 22px 40px; }
  .actions .btn { margin-bottom: 10px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid #d3cabd; }

  /* ===== 性别 ===== */
  .birth-row { display: flex; align-items: baseline; margin-bottom: 7px; }
  .gender-chip {
    margin-left: 10px; font-size: 11px; letter-spacing: 3px;
    color: var(--accent); border: 1px solid #e2cfc7; background: #fbf3ef;
    padding: 2px 8px; border-radius: 2px;
  }
  .gender-desc { font-size: 11.5px; line-height: 1.8; color: #9a9186; margin-bottom: 11px; }
  .gender-meta { margin-bottom: 13px; }
  .gender-note {
    display: inline-block; font-size: 9.5px; letter-spacing: 1.6px; color: var(--accent);
    border-bottom: 1px solid #e2cfc7; padding-bottom: 2px; margin-bottom: 6px;
  }
  .gender-meta .gender-desc { margin-bottom: 0; }

  /* ===== 封面性别选择器 ===== */
  .gender-pick { margin-top: 30px; }
  .gp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .gp-label { font-size: 11.5px; letter-spacing: 2px; color: #6b6157; }
  .gp-hint { font-size: 10.5px; letter-spacing: 1px; color: #b3a99b; }
  .gp-opts {
    display: flex; border: 1px solid #ddd5c8; border-radius: 3px;
    overflow: hidden; background: #fbf8f3;
  }
  .gp-opt {
    flex: 1; height: 42px; line-height: 42px; text-align: center;
    font-size: 13.5px; letter-spacing: 2px; color: #6b6157; cursor: pointer;
    transition: background .18s, color .18s;
  }
  .gp-opt + .gp-opt { border-left: 1px solid #ddd5c8; }
  .gp-opt.on { background: #1c1a17; color: #f6f3ee; }
  .gp-opt:active { opacity: .82; }

  /* ===== 生成卡片 ===== */
  .poster-cta {
    flex-direction: column;
    height: 64px;
    background: var(--accent);
    color: #fff8f3;
    margin-bottom: 12px !important;
  }
  .cta-main { font-size: 15px; letter-spacing: 3px; font-weight: 500; }
  .cta-sub { font-size: 10.5px; letter-spacing: .5px; opacity: .72; margin-top: 4px; }

  .poster-mask {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(20, 18, 15, .84);
    display: none; align-items: flex-end; justify-content: center;
  }
  .poster-mask.show { display: flex; animation: fadeIn .2s ease both; }

  .poster-panel {
    width: 100%; max-width: 460px;
    background: var(--bg);
    border-radius: 14px 14px 0 0;
    padding: 16px 0 22px;
    animation: slideUp .3s cubic-bezier(.22,1,.36,1) both;
    max-height: 96vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .poster-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 22px 12px;
  }
  .poster-head-title { font-size: 13px; letter-spacing: 3px; color: var(--ink); }
  .poster-close { font-size: 24px; color: var(--faint); line-height: 1; cursor: pointer; }

  .poster-canvas-wrap { display: flex; justify-content: center; padding: 0 22px; }
  .poster-img {
    width: 100%; max-width: 340px; display: block;
    box-shadow: 0 6px 28px rgba(40, 30, 20, .2);
  }

  .poster-tools { display: flex; padding: 16px 22px 0; }
  .ptool {
    flex: 1; height: 46px; display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; letter-spacing: 1.5px; border-radius: 3px;
    border: 1px solid #d3cabd; color: var(--ink);
    background: transparent; text-decoration: none; font-family: inherit;
    margin-right: 10px; cursor: pointer;
  }
  .ptool:last-child { margin-right: 0; }
  .ptool.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ptool:active { opacity: .8; }

  .poster-tip {
    text-align: center; font-size: 10.5px; color: var(--faint);
    margin-top: 12px; letter-spacing: .5px;
  }

  .ai-cta {
    background: transparent;
    color: var(--accent);
    border: 1px solid #dcc9bd;
    flex-direction: column;
    height: 62px;
  }
  .ai-cta .cta-main { color: var(--accent); }
  .ai-cta .cta-sub { color: var(--faint); opacity: 1; }

  .ai-body { padding: 0 22px; }
  .ai-step { display: flex; align-items: center; margin: 20px 0 8px; }
  .ai-step-no {
    width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); color: #fff8f3;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
    margin-right: 8px; flex-shrink: 0;
  }
  .ai-step-title { font-size: 12.5px; letter-spacing: 1.5px; color: var(--ink); }
  .ai-tip {
    font-size: 11px; line-height: 1.8; color: var(--muted);
    margin-bottom: 10px;
  }
  .ai-pre {
    max-height: 180px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #fbf8f3; border: 1px solid var(--line);
    border-radius: 3px; padding: 12px 14px;
    font-size: 10px; line-height: 1.8; color: var(--ink2);
    white-space: pre-wrap; word-break: break-word;
    font-family: inherit; margin: 0;
  }
  .ai-textarea {
    width: 100%; height: 116px; resize: vertical;
    background: #fbf8f3; border: 1px solid var(--line);
    border-radius: 3px; padding: 12px 14px;
    font-size: 11.5px; line-height: 1.75; color: var(--ink);
    font-family: inherit; outline: none;
  }
  .ai-textarea:focus { border-color: #d3c0ae; }
  .ai-tools { display: flex; margin-top: 10px; }
  .ai-note {
    font-size: 10px; line-height: 1.7; color: var(--faint);
    margin-top: 10px; letter-spacing: .3px;
  }
  .ai-done {
    font-size: 11px; color: var(--green); margin-top: 8px;
    letter-spacing: .5px; min-height: 15px;
  }
  .hero-epitaph {
    display: block; margin-top: 20px;
    font-size: 13.5px; line-height: 1.9; color: var(--accent);
    letter-spacing: 1px; text-align: center;
  }
  .ai-badge {
    display: inline-block; font-size: 9px; letter-spacing: 2px;
    color: var(--accent); border: 1px solid #e2cfc7;
    padding: 2px 6px; border-radius: 2px;
    margin-left: 8px; vertical-align: 2px;
  }

  @media (max-width: 400px) {
    .title { font-size: 50px; }
    .hero-title { font-size: 30px; }
    .chapter-name { font-size: 40px; }
  }

  /* ===== 人生档案 ===== */
  .arc-entry {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    margin-top: 20px; padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px; letter-spacing: 2px; color: var(--muted);
    cursor: pointer;
  }
  .arc-entry:active { opacity: .7; }
  .arc-entry-count { color: var(--accent); letter-spacing: 1px; }

  .review-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 24px 0;
    font-size: 11px; letter-spacing: 1.5px; color: var(--muted);
  }
  .review-tag {
    font-size: 10px; letter-spacing: 3px; color: var(--accent);
    border: 1px solid #e2cfc7; background: #fbf3ef;
    padding: 1px 6px; border-radius: 2px;
  }

  .saved-note {
    padding: 0 22px 36px; text-align: center;
    font-size: 11px; letter-spacing: 1px; color: var(--faint);
  }
  .saved-link {
    color: var(--accent); border-bottom: 1px solid #e2cfc7;
    padding-bottom: 1px; cursor: pointer;
  }

  .archive-page {
    min-height: 100vh; padding: 52px 22px 40px;
    display: flex; flex-direction: column;
  }
  .arc-head { margin-bottom: 24px; padding: 0 2px; }
  .arc-kicker { display: block; font-size: 9px; letter-spacing: 3px; color: var(--faint); margin-bottom: 9px; }
  .arc-title { font-size: 30px; letter-spacing: 4px; font-weight: 400; margin-bottom: 8px; }
  .arc-sub { font-size: 11.5px; line-height: 1.8; color: var(--muted); }

  .arc-item { padding: 15px 2px 13px; border-top: 1px solid var(--line); cursor: pointer; }
  .arc-item:last-child { border-bottom: 1px solid var(--line); }
  .arc-item:active { background: #f1ece3; }
  .arc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .arc-item-title { font-size: 17px; letter-spacing: 1.5px; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arc-item-total { font-size: 13px; color: var(--accent); }
  .arc-bottom {
    display: flex; align-items: center; gap: 6px;
    margin-top: 5px; font-size: 10.5px; color: var(--faint); letter-spacing: .5px;
  }
  .arc-sep { color: var(--line); }
  .arc-del { margin-left: auto; padding: 4px 0 4px 12px; letter-spacing: 1px; }
  .arc-del.armed { color: var(--accent); }
  .arc-foot { margin-top: 28px; }
  .arc-foot .btn { margin-bottom: 10px; }
  .btn.armed { border-color: var(--accent) !important; color: var(--accent) !important; }
</style>
</head>
<body>
<div id="app"></div>

<script src="./core/events.js?v=e3624e8b"></script>
<script src="./core/events-extra.js?v=e3624e8b"></script>
<script src="./core/events-pool.js?v=e3624e8b"></script>
<script src="./core/events-new.js?v=e3624e8b"></script>
<script src="./core/data.js?v=e3624e8b"></script>
<script src="./core/generator.js?v=e3624e8b"></script>
<script src="./core/engine.js?v=e3624e8b"></script>
<script src="./core/poster.js?v=e3624e8b"></script>
<script src="./core/llm.js?v=e3624e8b"></script>
<script src="./core/archive.js?v=e3624e8b"></script>
<script>
(function () {
  const E = window.LifeEngine
  const D = window.LifeData
  const A = window.LifeArchive

  const STAGE_RANGE = { 1:'0 岁', 2:'6 — 12 岁', 3:'13 — 18 岁', 4:'19 — 25 岁', 5:'26 — 35 岁', 6:'36 — 55 岁', 7:'56 — 80 岁' }
  const STAGE_NO = { 1:'序', 2:'一', 3:'二', 4:'三', 5:'四', 6:'五', 7:'六' }
  const DIM_COLORS = { wealth:'#a8442a', happy:'#5c6b52', health:'#4a5a6b', achieve:'#8a6a3f' }

  const app = document.getElementById('app')

  let life = null
  let currentEvent = null
  let rawOptions = []
  let choiceCount = 0
  let result = null
  let showAllTimeline = false
  let pickedGender = 'auto'   // 'm' | 'f' | 'auto'
  let aiState = { applied: false, epitaph: '' }
  let record = null          // 当前这一局的存档
  let pendingDel = ''        // 档案页里等待二次确认的删除

  /* ---------------- 工具 ---------------- */
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]))

  function hudHTML() {
    if (!life) return ''
    const snap = E.snapshot(life)
    const money = life.money < 0
      ? `负债 ${Math.abs(Math.round(life.money))} 万`
      : `${Math.round(life.money)} 万`
    const prog = Math.min(100, Math.round((snap.age / 82) * 100))
    const bar = (label, val) =>
      `<div class="metric">
        <span class="m-label">${label}</span>
        <div class="m-bar"><div class="m-fill ${val < 32 ? 'warn' : ''}" style="width:${val}%"></div></div>
        <span class="m-num">${val}</span>
      </div>`
    return `<div class="hud">
      <div class="hud-row">
        <div class="hud-left">
          <span class="hud-stage">${snap.stageName}</span>
          <span class="hud-age">${snap.age} 岁</span>
        </div>
        <span class="hud-money">${money}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
      <div class="metrics">
        ${bar('心境', snap.happy)}${bar('身体', snap.health)}${bar('心气', snap.amb)}
      </div>
    </div>`
  }

  function scrollTop() { window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }) }

  /* ---------------- 封面 ---------------- */
  function showCover() {
    const no = String(Math.floor(Math.random() * 9000) + 1000)
    app.innerHTML = `
      <section class="cover">
        <div class="cover-inner fade-in">
          <div class="archive-no">
            <span class="archive-line"></span>
            <span class="archive-text">PERSONAL ARCHIVE · No.${no}</span>
          </div>
          <h1 class="title serif"><span>人生</span><span>模拟器</span></h1>
          <p class="subtitle">你会成为谁，取决于你在每个路口选了什么。</p>
          <div class="cover-divider"></div>
          <div>
            <span class="copy-line">有些选择，当时看不出分量。</span>
            <span class="copy-line">很多年后回头，才发现那是分水岭。</span>
          </div>
          <div class="gender-pick">
            <div class="gp-head">
              <span class="gp-label">这一生的性别</span>
              <span class="gp-hint" id="gp-hint">${pickedGender === 'auto' ? '交给命' : '你自己定'}</span>
            </div>
            <div class="gp-opts">
              <div class="gp-opt ${pickedGender === 'm' ? 'on' : ''}" data-g="m">男</div>
              <div class="gp-opt ${pickedGender === 'f' ? 'on' : ''}" data-g="f">女</div>
              <div class="gp-opt ${pickedGender === 'auto' ? 'on' : ''}" data-g="auto">随机</div>
            </div>
          </div>
          <div class="cover-bottom">
            <button class="btn" id="btn-roll">抽一份人生</button>
            <span class="cover-hint">一局约 5 分钟 · 选择不可撤回</span>
            <div class="arc-entry" id="btn-archive" ${A.count() ? '' : 'style="display:none"'}>
              <span class="arc-entry-label">人生档案</span>
              <span class="arc-entry-count">${A.count() ? A.count() + ' 局' : '还没有'}</span>
            </div>
          </div>
        </div>
      </section>`
    document.getElementById('btn-roll').onclick = rollLife
    document.getElementById('btn-archive').onclick = () => {
      if (A.count()) showArchive()
    }
    app.querySelectorAll('.gp-opt').forEach(el => {
      el.onclick = () => {
        pickedGender = el.dataset.g
        app.querySelectorAll('.gp-opt').forEach(x => x.classList.toggle('on', x.dataset.g === pickedGender))
        document.getElementById('gp-hint').textContent = pickedGender === 'auto' ? '交给命' : '你自己定'
      }
    })
    scrollTop()
  }

  /* ---------------- 出厂设置 ---------------- */
  function rollLife() {
    life = E.createLife(pickedGender === 'auto' ? null : pickedGender)
    choiceCount = 0
    showAllTimeline = false
    record = null
    result = null
    aiState = { applied: false, epitaph: '' }

    const tags = E.fateLabel(life)
    const talentHTML = life.talents.map(t => `
      <div class="talent">
        <span class="talent-name serif">${esc(t.name)}</span>
        <span class="talent-desc">${esc(t.desc)}</span>
      </div>`).join('')

    app.innerHTML = `
      <section class="reveal">
        <div class="reveal-head fade-up">
          <span class="overline">你的出厂设置</span>
          <h2 class="reveal-title serif">出身和天赋，你没得选</h2>
        </div>

        <div class="card fade-up" style="animation-delay:.08s">
          <div class="card-label-row"><span class="card-label">出身 / 性别</span><span class="card-index">01</span></div>
          <div class="birth-row">
            <span class="birth-tag serif">${esc(life.birth.tag)}</span>
            <span class="gender-chip">${life.gender === 'f' ? '女' : '男'}</span>
          </div>
          <div class="gender-meta">
            <span class="gender-note">${life.genderPicked ? '这一项，由你决定' : '这一次，是随机抽到的'}</span>
            <p class="gender-desc">${life.gender === 'f' ? '这个身份会给你一些照顾，也会给你一些“你应该”的期待。' : '这个身份会给你一些便利，也会给你一些“不许软弱”的规矩。'}</p>
          </div>
          <p class="birth-desc">${esc(life.birth.desc)}</p>
          <div class="stat-line">
            <div class="stat-track"><div class="stat-fill" style="width:${life.family}%"></div></div>
            <span class="stat-num">家境 ${life.family}</span>
          </div>
          <div class="birth-note">
            <span class="note-mark">·</span>
            <span class="note-text">${esc(life.birth.note)}</span>
          </div>
        </div>

        <div class="card fade-up" style="animation-delay:.16s">
          <div class="card-label-row"><span class="card-label">天赋</span><span class="card-index">02</span></div>
          ${talentHTML}
        </div>

        <div class="tag-block fade-up" style="animation-delay:.22s">
          <span class="tag-label">命运在你身上留下的记号</span>
          <div>${(tags.length ? tags : ['平平无奇']).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
        </div>

        <div class="reveal-foot fade-up" style="animation-delay:.3s">
          <span class="foot-copy">从这里开始，每一个选择都由你来做。</span>
          <span class="foot-copy dim">做完之后，你会得到一份迟到的复盘。</span>
        </div>

        <button class="btn" id="btn-begin">开始这一生</button>
        <div class="respin" id="btn-respin">换一份人生</div>
      </section>`

    document.getElementById('btn-begin').onclick = () => {
      const first = E.getNextEvent(life)
      if (!first) return showEnding()
      currentEvent = first
      showChapter()
    }
    document.getElementById('btn-respin').onclick = rollLife
    scrollTop()
  }

  /* ---------------- 章节 ---------------- */
  function showChapter() {
    const stage = life.stage
    const st = D.STAGES[stage] || {}
    const inc = life.stageIncome
    if (inc) life.stageIncome = null

    app.innerHTML = `
      ${hudHTML()}
      <section class="chapter">
        <div class="chapter-inner fade-up">
          <span class="chapter-no">${STAGE_NO[stage] || ''}</span>
          <div class="chapter-title-row">
            <span class="chapter-name serif">${esc(st.name || '')}</span>
            <span class="chapter-range">${STAGE_RANGE[stage] || ''}</span>
          </div>
          <div class="chapter-line"></div>
          <p class="chapter-tip">${esc(st.tip || '')}</p>
          ${inc ? `<span class="chapter-income" id="inc">这 ${inc.years} 年，你攒下了 ${inc.gained} 万。</span>` : ''}
        </div>
        <div class="chapter-foot fade-up" style="animation-delay:.2s">
          <button class="btn" id="btn-next-chapter">继续</button>
        </div>
      </section>`

    if (inc) setTimeout(() => {
      const el = document.getElementById('inc')
      if (el) el.classList.add('show')
    }, 220)

    document.getElementById('btn-next-chapter').onclick = () => showEvent()
    scrollTop()
  }

  /* ---------------- 事件 ---------------- */
  function showEvent() {
    const ev = currentEvent
    let list = (ev.options || []).filter(o => {
      if (!o.cond) return true
      try { return o.cond(life) } catch (e) { return true }
    })
    if (!list.length) list = ev.options || []
    rawOptions = list

    if (!ev.auto) choiceCount++

    const yearTxt = ev.auto ? '' : `第 ${choiceCount} 个岔路口`

    app.innerHTML = `
      ${hudHTML()}
      <div class="body">
        <div class="event-card fade-up">
          <div class="ev-meta">
            <span class="ev-age">${ev.age} 岁</span>
            ${yearTxt ? `<span class="ev-dot">·</span><span class="ev-year">${yearTxt}</span>` : ''}
          </div>
          <h2 class="ev-title serif">${esc(ev.title)}</h2>
          <p class="ev-scene">${esc(ev.scene)}</p>
        </div>

        ${ev.auto
          ? `<div class="auto-wrap fade-up" style="animation-delay:.1s"><button class="btn" id="btn-auto">继续</button></div>`
          : `<div class="options fade-up" style="animation-delay:.1s">
              ${list.map((o, i) => `
                <button class="option" data-i="${i}">
                  <span class="opt-no">${String(i + 1).padStart(2, '0')}</span>
                  <span class="opt-text">${esc(o.text)}</span>
                  <span class="opt-arrow">›</span>
                </button>`).join('')}
            </div>`
        }
      </div>`

    if (ev.auto) {
      document.getElementById('btn-auto').onclick = doAuto
    } else {
      app.querySelectorAll('.option').forEach(btn => {
        btn.onclick = () => pickOption(Number(btn.dataset.i))
      })
    }
    scrollTop()
  }

  function snapshotStats() {
    return { happy: life.happy, health: life.health, amb: life.amb, money: life.money }
  }

  function pickOption(i) {
    const opt = rawOptions[i]
    if (!opt) return
    const before = snapshotStats()
    const realIndex = currentEvent.options.indexOf(opt)
    const out = E.choose(life, currentEvent, realIndex < 0 ? i : realIndex)
    showResult(before, opt.text, out)
  }

  function doAuto() {
    const before = snapshotStats()
    const out = E.autoResolve(life, currentEvent)
    showResult(before, '', out)
  }

  /* ---------------- 结果 ---------------- */
  function showResult(before, pickedText, out) {
    const deltas = []
    const push = (label, key, unit) => {
      const d = Math.round(life[key] - before[key])
      if (d !== 0) deltas.push({ label, text: (d > 0 ? '+' : '') + d + (unit || ''), up: d > 0 })
    }
    push('心境', 'happy')
    push('身体', 'health')
    push('心气', 'amb')
    push('存款', 'money', ' 万')

    app.innerHTML = `
      ${hudHTML()}
      <div class="body">
        <div class="result-wrap fade-up">
          ${pickedText ? `
            <div class="picked">
              <span class="picked-label">你选择了</span>
              <span class="picked-text">「${esc(pickedText)}」</span>
            </div>` : ''}
          <div class="result-body ${out.tone || 'neutral'}">
            <p class="result-text">${esc(out.text || '')}</p>
          </div>
          ${deltas.length ? `<div class="deltas">
            ${deltas.map(d => `<span class="delta ${d.up ? 'up' : 'down'}">${d.label} ${d.text}</span>`).join('')}
          </div>` : ''}
        </div>
        <div class="result-foot fade-up" style="animation-delay:.1s">
          <button class="btn" id="btn-continue">继续</button>
          <span class="foot-note">生活不会停下来等你反应过来</span>
        </div>
      </div>`

    document.getElementById('btn-continue').onclick = nextEvent
    scrollTop()
  }

  function nextEvent() {
    const prevStage = life.stage
    const ev = E.getNextEvent(life)
    if (!ev) return showEnding()
    currentEvent = ev
    if (life.stage !== prevStage) showChapter()
    else showEvent()
  }

  /* ---------------- 结局 ---------------- */
  function showEnding() {
    if (!result) {
      // 以前出过的结局喂给引擎，这一局尽量换个没见过的
      try { E.setSeenPairs(A.seenPairs()) } catch (e) {}
      result = E.settle(life)
      try { A.addSeen(result.ending._base + '|' + result.ending._scene) } catch (e) {}
    }

    if (!record) {
      record = A.make(life, result, { tags: E.fateLabel(life), ai: aiState })
    } else {
      // AI 重写过：同步回同一份存档，不新增一条
      record.title = result.ending.title
      record.subtitle = result.ending.subtitle
      record.desc = result.ending.desc
      record.advice = (result.advice || []).map(a => ({ title: a.title, text: a.text }))
      record.ai = aiState.applied ? { applied: true, epitaph: aiState.epitaph } : null
    }
    A.upsert(record)
    renderEnding(record, true)
  }

  /* 从一份存档渲染结局页。live=false 就是回看 */
  function renderEnding(rec, live) {
    const sc = rec.sc
    const scores = [
      { label: '物质', value: sc.wealth, color: DIM_COLORS.wealth },
      { label: '心境', value: sc.happy, color: DIM_COLORS.happy },
      { label: '身体', value: sc.health, color: DIM_COLORS.health },
      { label: '成就', value: sc.achieve, color: DIM_COLORS.achieve }
    ]

    const timeline = (rec.log || []).map(l => ({
      age: l.age, title: l.title, choice: l.choice || '', tone: l.tone || 'neutral'
    }))

    const shown = 8
    const visible = showAllTimeline ? timeline : timeline.slice(0, shown)
    const more = timeline.length - shown
    const ai = rec.ai || {}
    const total = A.count()

    app.innerHTML = `
      ${live ? '' : `<div class="review-bar"><span class="review-tag">回看</span><span>${esc(A.stamp(rec.ts))} 存下的一局</span></div>`}
      <section class="hero fade-up">
        <div class="hero-meta">
          <span class="hero-age">你走完了 ${rec.finalAge || 79} 年</span>
          <span class="hero-birth">${rec.gender === 'f' ? '女' : '男'} · ${esc(rec.birth)}出生</span>
        </div>
        <h1 class="hero-title serif">${esc(rec.title)}${ai.applied ? '<span class="ai-badge">AI 重写</span>' : ''}</h1>
        <p class="hero-sub">${esc(rec.subtitle)}</p>
        <div class="hero-line"></div>
        <p class="hero-desc">${esc(rec.desc)}</p>
        ${ai.epitaph ? `<span class="hero-epitaph serif">「${esc(ai.epitaph)}」</span>` : ''}
        <div class="hero-tags">
          ${(rec.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}
        </div>
      </section>

      <div class="section">
        <div class="sec-head"><span class="sec-no">01</span><span class="sec-title">你留下了什么</span></div>
        ${scores.map(x => `
          <div class="score">
            <div class="score-top">
              <span class="score-label">${x.label}</span>
              <span class="score-value">${x.value}</span>
            </div>
            <div class="score-track">
              <div class="score-fill" data-w="${x.value}" style="background:${x.color}"></div>
            </div>
          </div>`).join('')}
        <span class="score-note">这些数字不是评判，只是坐标。它告诉你，你这辈子把力气花在了哪里。</span>
      </div>

      <div class="section">
        <div class="sec-head"><span class="sec-no">02</span><span class="sec-title">你走过的路</span></div>
        <div class="timeline">
          ${visible.map(l => `
            <div class="tl-item">
              <span class="tl-dot ${l.tone}"></span>
              <div class="tl-head">
                <span class="tl-age">${l.age} 岁</span>
                <span class="tl-title">${esc(l.title)}</span>
              </div>
              ${l.choice ? `<span class="tl-choice">${esc(l.choice)}</span>` : ''}
            </div>`).join('')}
        </div>
        ${(!showAllTimeline && more > 0)
          ? `<div class="tl-toggle" id="btn-more">展开前 ${more} 件事</div>` : ''}
      </div>

      <div class="section">
        <div class="sec-head"><span class="sec-no">03</span><span class="sec-title">回头看一眼</span></div>
        ${(rec.review || []).map(p => `<p class="review-p">${esc(p)}</p>`).join('')}
      </div>

      <div class="section">
        <div class="sec-head"><span class="sec-no">04</span><span class="sec-title">如果还能说点什么</span></div>
        ${(rec.advice || []).map((a, i) => `
          <div class="advice">
            <div class="advice-head">
              <span class="advice-index">${i + 1}</span>
              <span class="advice-title">${esc(a.title)}</span>
            </div>
            <p class="advice-text">${esc(a.text)}</p>
          </div>`).join('')}
      </div>

      <div class="closing">
        <div class="closing-line"></div>
        <span class="closing-main serif">这一生结束了。</span>
        <span class="closing-sub">但你的还没有。</span>
      </div>

      <div class="actions">
        ${live ? `<button class="btn ai-cta" id="btn-ai">
          <span class="cta-main">让 AI 写这份总结</span>
          <span class="cta-sub">导出这局数据 · 自己发给 AI</span>
        </button>` : ''}
        <button class="btn poster-cta" id="btn-poster">
          <span class="cta-main">生成结局卡片</span>
          <span class="cta-sub">一张图，把这辈子说清楚</span>
        </button>
        ${live
          ? `<button class="btn" id="btn-again">再活一次</button>
             <button class="btn ghost" id="btn-copy">把这些话记下来</button>`
          : `<button class="btn" id="btn-again">再活一次</button>
             <button class="btn ghost" id="btn-copy">把这些话复制下来</button>
             <button class="btn ghost" id="btn-back">回到档案</button>`}
      </div>

      ${live
        ? `<p class="saved-note">这一局已存进档案 · <span class="saved-link" id="btn-archive2">回看全部 ${total} 局</span></p>`
        : `<p class="saved-note">存档保存在云端</p>`}

      ${live ? `<div class="poster-mask" id="ai-mask">
        <div class="poster-panel">
          <div class="poster-head">
            <span class="poster-head-title">让 AI 写这份总结</span>
            <span class="poster-close" id="ai-close">×</span>
          </div>
          <div class="ai-body">
            <div class="ai-step"><span class="ai-step-no">1</span><span class="ai-step-title">复制这段，发给任意 AI</span></div>
            <p class="ai-tip">下面是这局的全部数据，已经整理成一条完整指令。ChatGPT、元宝、豆包、DeepSeek 都可以，粘过去直接发。</p>
            <pre class="ai-pre" id="ai-pre"></pre>
            <div class="ai-tools">
              <button class="ptool primary" id="ai-copy">复制指令</button>
              <a class="ptool" id="ai-download" download="人生模拟器-AI指令.txt">导出 .txt</a>
            </div>

            <div class="ai-step"><span class="ai-step-no">2</span><span class="ai-step-title">把 AI 的回复粘回来</span></div>
            <p class="ai-tip">整段复制粘贴就行，带不带 markdown 代码块都能认。粘贴后点下面的按钮，这页会被换成它写的那一份。</p>
            <textarea class="ai-textarea" id="ai-paste" placeholder="把 AI 的回复整段粘到这里…"></textarea>
            <div class="ai-tools">
              <button class="ptool primary" id="ai-apply">用这段替换结局</button>
            </div>
            <p class="ai-done" id="ai-done"></p>
            <p class="ai-note">这一步需要你自己把文字交给 AI —— 游戏里没有任何密钥，也不联网，所以不会替你发请求。换掉的只是结局页的文字，数值不变；海报会跟着用新文案重画。</p>
          </div>
        </div>
      </div>` : ''}

      <div class="poster-mask" id="poster-mask">
        <div class="poster-panel">
          <div class="poster-head">
            <span class="poster-head-title">你的结局卡片</span>
            <span class="poster-close" id="poster-close">×</span>
          </div>
          <div class="poster-canvas-wrap">
            <img id="poster-img" class="poster-img" alt="结局卡片" />
          </div>
          <div class="poster-tools">
            <a class="ptool" id="poster-dl" download="life-poster.png">保存图片</a>
            <button class="ptool primary" id="poster-close2">关闭</button>
          </div>
          <p class="poster-tip">手机端长按图片也可以保存</p>
        </div>
      </div>`

    // 分数条动画
    requestAnimationFrame(() => {
      setTimeout(() => {
        app.querySelectorAll('.score-fill').forEach(el => {
          el.style.width = el.dataset.w + '%'
        })
      }, 160)
    })

    const moreBtn = document.getElementById('btn-more')
    if (moreBtn) moreBtn.onclick = () => { showAllTimeline = true; renderEnding(rec, live) }

    document.getElementById('btn-again').onclick = restart
    document.getElementById('btn-copy').onclick = copyAdvice
    document.getElementById('btn-poster').onclick = openPoster

    const back = document.getElementById('btn-back')
    if (back) back.onclick = showArchive

    const arcLink = document.getElementById('btn-archive2')
    if (arcLink) arcLink.onclick = showArchive

    const aiBtn = document.getElementById('btn-ai')
    if (aiBtn) aiBtn.onclick = openAI

    document.getElementById('poster-close').onclick = closePoster
    document.getElementById('poster-close2').onclick = closePoster
    document.getElementById('poster-mask').onclick = e => {
      if (e.target.id === 'poster-mask') closePoster()
    }

    const aiMask = document.getElementById('ai-mask')
    if (aiMask) {
      document.getElementById('ai-close').onclick = closeAI
      document.getElementById('ai-copy').onclick = copyAIPrompt
      document.getElementById('ai-apply').onclick = applyAI
      aiMask.onclick = e => { if (e.target.id === 'ai-mask') closeAI() }
    }
    scrollTop()
  }

  function restart() {
    life = null; result = null; record = null; choiceCount = 0; showAllTimeline = false
    aiState = { applied: false, epitaph: '' }
    showCover()
  }

  /* ---------------- 档案 ---------------- */
  function showArchive() {
    const list = A.all()
    app.innerHTML = `
      <section class="archive-page fade-in">
        <div class="arc-head">
          <span class="arc-kicker">PERSONAL ARCHIVE</span>
          <h2 class="arc-title serif">人生档案</h2>
          <p class="arc-sub">${list.length
            ? `存下 ${list.length} 局 · 最多留 ${A.capacity()} 局，超出挤掉最旧的`
            : '还没有存下的局。走完一局，它会自己出现在这里。'}</p>
        </div>

        ${list.length ? `<div class="arc-list">
          ${list.map(r => {
            const b = A.brief(r)
            return `<div class="arc-item" data-open="${b.id}">
              <div class="arc-row">
                <span class="arc-item-title serif">${esc(b.title)}</span>
                <span class="arc-item-total">${b.total}</span>
              </div>
              <div class="arc-bottom">
                <span class="arc-meta">${b.stamp}</span>
                <span class="arc-sep">·</span>
                <span class="arc-meta">${b.gender === 'f' ? '女' : '男'} ${b.finalAge} 岁</span>
                <span class="arc-del" data-del="${b.id}">删除</span>
              </div>
            </div>`
          }).join('')}
        </div>` : ''}

        <div class="arc-foot">
          ${list.length ? `<button class="btn ghost" id="arc-clear">清空全部</button>` : ''}
          <button class="btn" id="arc-back">${list.length ? '回到封面' : '去抽一份人生'}</button>
        </div>
      </section>`

    app.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = e => {
        if (e.target.closest('[data-del]')) return
        openRecord(el.dataset.open)
      }
    })

    app.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = e => {
        e.stopPropagation()
        const id = el.dataset.del
        if (pendingDel !== id) {
          pendingDel = id
          el.textContent = '再点一次删除'
          el.classList.add('armed')
          setTimeout(() => {
            if (pendingDel === id) {
              pendingDel = ''
              const cur = app.querySelector(`[data-del="${id}"]`)
              if (cur) { cur.textContent = '删除'; cur.classList.remove('armed') }
            }
          }, 3000)
          return
        }
        pendingDel = ''
        A.remove(id)
        showArchive()
      }
    })

    const clr = document.getElementById('arc-clear')
    if (clr) {
      let armed = false
      clr.onclick = () => {
        if (!armed) {
          armed = true
          clr.textContent = '再点一次，全部删掉'
          clr.classList.add('armed')
          setTimeout(() => {
            if (armed) { armed = false; clr.textContent = '清空全部'; clr.classList.remove('armed') }
          }, 3000)
          return
        }
        A.clear()
        showArchive()
      }
    }

    document.getElementById('arc-back').onclick = () => {
      if (A.count()) showCover()
      else { restart() }
    }
    scrollTop()
  }

  function openRecord(id) {
    const rec = A.get(id)
    if (!rec) { showArchive(); return }
    life = null
    result = null
    record = rec
    showAllTimeline = false
    renderEnding(rec, false)
  }

  /* ---------------- 交给 AI ---------------- */

  function openAI() {
    if (!window.LifeAI || !result) return
    const prompt = LifeAI.buildPrompt(life, result)

    document.getElementById('ai-pre').textContent = prompt
    document.getElementById('ai-paste').value = ''
    document.getElementById('ai-done').textContent = ''
    document.getElementById('ai-copy').textContent = '复制指令'

    const dl = document.getElementById('ai-download')
    dl.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(prompt)

    document.getElementById('ai-mask').classList.add('show')
  }

  function closeAI() {
    document.getElementById('ai-mask').classList.remove('show')
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text))
    }
    return Promise.resolve(fallbackCopy(text))
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea')
      ta.value = text
      ta.style.position = 'fixed'
      ta.style.opacity = '0'
      document.body.appendChild(ta)
      ta.select()
      const ok = document.execCommand('copy')
      document.body.removeChild(ta)
      return ok
    } catch (e) {
      return false
    }
  }

  function copyAIPrompt() {
    const text = document.getElementById('ai-pre').textContent
    const btn = document.getElementById('ai-copy')
    copyText(text).then(ok => {
      btn.textContent = ok ? '已复制' : '复制失败，请长按选择'
      setTimeout(() => { btn.textContent = '复制指令' }, 1800)
    })
  }

  function applyAI() {
    const raw = document.getElementById('ai-paste').value
    const done = document.getElementById('ai-done')

    if (!raw.trim()) {
      done.textContent = '还没有粘贴内容。'
      return
    }

    const parsed = LifeAI.parseReply(raw)
    if (!parsed) {
      done.textContent = '没读懂这段回复。确认整段都复制过来了，或者换一个模型再试。'
      return
    }

    result.ending.desc = parsed.summary
    if (parsed.advice && parsed.advice.length) result.advice = parsed.advice
    aiState.applied = true
    aiState.epitaph = parsed.epitaph || ''

    closeAI()
    showEnding()
  }

  /* ---------------- 结局卡片 ---------------- */

  function openPoster() {
    if (!window.LifePoster || !record) return
    // 海报只认 life.log / finalAge / birth / gender 和 ending，用存档拼一个就够，
    // 这样回看时也能重新出图
    const lifeLike = {
      log: (record.log || []).map(l => ({ ...l, kind: l.choice ? 'choice' : 'event' })),
      finalAge: record.finalAge,
      birth: { tag: record.birth },
      gender: record.gender
    }
    const resultLike = {
      sc: record.sc,
      ending: { title: record.title, subtitle: record.subtitle, desc: record.desc }
    }
    const data = LifePoster.buildPosterData(lifeLike, resultLike)
    const scale = 2
    const canvas = document.createElement('canvas')
    canvas.width = LifePoster.W * scale
    canvas.height = LifePoster.H * scale
    const ctx = canvas.getContext('2d')
    ctx.scale(scale, scale)
    LifePoster.drawPoster(ctx, LifePoster.W, LifePoster.H, data)

    const url = canvas.toDataURL('image/png')
    const img = document.getElementById('poster-img')
    img.src = url
    const dl = document.getElementById('poster-dl')
    dl.href = url
    document.getElementById('poster-mask').classList.add('show')
  }

  function closePoster() {
    const mask = document.getElementById('poster-mask')
    if (mask) mask.classList.remove('show')
  }

  function copyAdvice() {
    if (!record) return
    const txt = [
      `「${record.title}」`,
      record.subtitle,
      '',
      record.desc,
      '',
      '—— 回头看一眼 ——',
      ...(record.review || []).map(p => '· ' + p),
      '',
      '—— 如果还能说点什么 ——',
      ...(record.advice || []).map((a, i) => `${i + 1}. ${a.title}\n${a.text}`)
    ].join('\n')

    const done = () => {
      const btn = document.getElementById('btn-copy')
      if (!btn) return
      const old = btn.textContent
      btn.textContent = '已复制到剪贴板'
      setTimeout(() => { btn.textContent = old }, 1800)
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(fallback)
    } else {
      fallback()
    }

    function fallback() {
      const ta = document.createElement('textarea')
      ta.value = txt
      ta.style.position = 'fixed'
      ta.style.opacity = '0'
      document.body.appendChild(ta)
      ta.select()
      try { document.execCommand('copy') } catch (e) {}
      document.body.removeChild(ta)
      done()
    }
  }

  /* ---------------- 启动 ---------------- */
  showCover()
  window.__lifeSim = { get life() { return life }, get result() { return result } }
})()
</script>
