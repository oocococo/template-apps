<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>少年笔侠试炼场示例</title><style>html,body{margin:0;height:100%;background:#171310}body{display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:#292117;color:#f5e8ca;font:14px sans-serif}.bar button{border:1px solid #e9b44c;border-radius:6px;background:transparent;color:inherit;padding:6px 10px}iframe{border:0;width:100%;flex:1;min-height:0}</style><div class="bar"><span>示例体验 · 状态仅保存在本页</span><button id="reset">恢复示例</button></div><div id="host" style="display:flex;flex:1;min-height:0"></div><script>const html="<!doctype html><html lang=\"zh-CN\"><meta charset=\"utf-8\"><link rel=\"icon\" href=\"data:,\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><style>\n  :root{\n    --ink:#1a1613; --paper:#f5efe2; --gold:#e9b44c; --gold-d:#b07d2b;\n    --seal:#c0392b; --jade:#57c4a3; --shadow:0 12px 34px rgba(26,22,19,.25);\n    color-scheme:light;\n  }\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\n  button,input{font-family:inherit;}\n  button{color:#3a3226;}\n  input{color:#3a3226;}\n  body{\n    font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n    background:#171310;color:#2b2622;overflow-x:hidden;min-height:100vh;\n  }\n  .kai{font-family:\"STKaiti\",\"KaiTi\",\"楷体\",\"SimKai\",serif;}\n  .screen{display:none;min-height:100vh;flex-direction:column;align-items:center;}\n  .screen.active{display:flex;animation:fadeUp .6s ease;}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}\n  .btn{\n    border:none;cursor:pointer;font-family:inherit;font-weight:800;letter-spacing:.12em;\n    border-radius:999px;transition:transform .18s,box-shadow .18s;\n  }\n  .btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3);}\n  .btn:active{transform:scale(.96);}\n  .btn-gold{background:linear-gradient(90deg,var(--gold),#f6d47c);color:#4a3208;font-size:17px;padding:14px 38px;box-shadow:0 8px 20px rgba(233,180,76,.35);}\n  .btn-dark{background:#2b2622;color:var(--paper);font-size:14px;padding:10px 24px;}\n  .btn-mini{background:#fff;color:#2b2622;font-size:13px;padding:8px 18px;box-shadow:0 3px 10px rgba(0,0,0,.15);}\n\n  /* ============ 彩蛋登录 ============ */\n  #egg{background:radial-gradient(circle at 50% 30%,#241d16,#0f0b08 75%);color:var(--paper);justify-content:center;}\n  .egg-box{text-align:center;padding:30px;}\n  .blackbox{\n    width:150px;height:110px;margin:0 auto 22px;border-radius:12px;position:relative;\n    background:linear-gradient(160deg,#3a322b,#211b15);border:1px solid #57493a;\n    box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 24px rgba(0,0,0,.5);\n    display:flex;align-items:center;justify-content:center;cursor:pointer;\n  }\n  .blackbox::before{content:\"保密\";font-family:\"STKaiti\",\"KaiTi\",serif;color:var(--paper);\n    background:var(--seal);padding:3px 10px;border-radius:4px;font-size:16px;letter-spacing:.2em;transform:rotate(-6deg);}\n  .blackbox:hover{transform:translateY(-4px) rotate(1deg);transition:.3s;}\n  .egg{\n    width:130px;height:168px;margin:14px auto;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;\n    background:radial-gradient(circle at 35% 30%,#fdf3d8,#e8d3a0 55%,#b99a5e);\n    box-shadow:inset -8px -12px 22px rgba(120,90,40,.45),0 14px 34px rgba(0,0,0,.55);\n    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;\n    user-select:none;transition:transform .15s;\n  }\n  .egg:active{transform:scale(.95);}\n  .egg .carve{\n    font-family:\"STKaiti\",\"KaiTi\",serif;font-size:26px;color:#6e5322;writing-mode:vertical-rl;\n    letter-spacing:.28em;text-shadow:0 1px 0 #fff8e0;pointer-events:none;\n  }\n  .crack{position:absolute;pointer-events:none;font-size:26px;opacity:.9;}\n  .egg.glowing{animation:eggGlow 1.2s ease infinite;}\n  @keyframes eggGlow{0%,100%{box-shadow:inset -8px -12px 22px rgba(120,90,40,.45),0 0 18px 4px rgba(233,180,76,.45);}\n    50%{box-shadow:inset -8px -12px 22px rgba(120,90,40,.45),0 0 60px 18px rgba(233,180,76,.85);}}\n  .egg-hint{margin-top:18px;color:#c9b28a;font-size:14px;letter-spacing:.1em;line-height:2;}\n  .pw-row{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}\n  .pw-input{padding:11px 16px;border-radius:12px;border:1px solid #5a4a35;background:#241d16;color:var(--paper);\n    text-align:center;font-family:inherit;width:180px;outline:none;}\n  .pw-input:focus{border-color:var(--gold);}\n  .pw-msg{margin-top:10px;min-height:22px;font-size:13px;color:#e9b44c;}\n  .intro-note{\n    margin-top:26px;max-width:560px;background:rgba(255,255,255,.06);border:1px solid rgba(233,180,76,.25);\n    border-radius:16px;padding:18px 22px;font-size:13.5px;line-height:2.1;color:#d8c9a8;text-align:left;\n  }\n  .intro-note b{color:var(--gold);}\n\n  /* ============ 承诺书 ============ */\n  #pledge{background:radial-gradient(circle at 50% 20%,#241d16,#0f0b08 75%);color:var(--paper);justify-content:center;}\n  .scroll{\n    width:min(620px,92vw);background:linear-gradient(#faf4e4,#efe4c8);color:#3a3226;\n    border-radius:14px;padding:34px 32px;box-shadow:var(--shadow);position:relative;\n  }\n  .scroll::before,.scroll::after{content:\"\";position:absolute;left:0;right:0;height:14px;\n    background:repeating-linear-gradient(90deg,#8a6d3b 0 18px,#6e5322 18px 22px);}\n  .scroll::before{top:0;border-radius:14px 14px 0 0;}\n  .scroll::after{bottom:0;border-radius:0 0 14px 14px;}\n  .scroll h2{font-family:\"STKaiti\",\"KaiTi\",serif;text-align:center;font-size:28px;letter-spacing:.3em;margin-bottom:18px;color:#5a3a00;}\n  .scroll p{font-size:14.5px;line-height:2.2;margin-bottom:8px;}\n  .scroll .seal-stamp{position:absolute;right:26px;bottom:30px;width:64px;height:64px;border:3px solid var(--seal);\n    color:var(--seal);border-radius:8px;display:flex;align-items:center;justify-content:center;\n    font-family:\"STKaiti\",\"KaiTi\",serif;font-size:15px;transform:rotate(8deg);opacity:.85;line-height:1.4;text-align:center;}\n  .name-input{display:block;margin:20px auto 6px;padding:13px 20px;font-size:16px;width:min(300px,80vw);\n    border:2px solid #cbb98d;border-radius:12px;background:#fff;text-align:center;font-family:inherit;outline:none;}\n  .name-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,180,76,.2);}\n  .btn-row{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;}\n\n  /* ============ 山路地图 ============ */\n  #map{background:linear-gradient(180deg,#101720 0%,#1c2b26 40%,#33473a 78%,#5a6b4d 100%);color:var(--paper);padding:5vh 4vw 8vh;}\n  .map-title{text-align:center;margin-bottom:8px;}\n  .map-title h2{font-family:\"STKaiti\",\"KaiTi\",serif;font-size:clamp(26px,5vw,36px);letter-spacing:.2em;color:var(--gold);text-shadow:0 0 22px rgba(233,180,76,.4);}\n  .map-title p{font-size:13px;color:#b9c4ae;margin-top:8px;line-height:2;}\n  .path{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;margin-top:26px;}\n  .node{\n    display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);\n    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px 20px;width:min(560px,92vw);\n    cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;position:relative;\n  }\n  .node:hover{transform:translateX(6px);}\n  .node.locked{opacity:.45;cursor:not-allowed;}\n  .node.locked:hover{transform:none;}\n  .node.done{background:rgba(87,196,163,.12);border-color:rgba(87,196,163,.4);}\n  .node.current{background:rgba(233,180,76,.14);border-color:var(--gold);box-shadow:0 0 26px rgba(233,180,76,.35);}\n  .node.current::after{content:\"当前关卡\";position:absolute;top:-10px;right:14px;background:var(--gold);color:#4a3208;\n    font-size:11px;font-weight:800;padding:3px 12px;border-radius:12px;letter-spacing:.1em;}\n  .node .pen-mini{width:34px;height:44px;flex-shrink:0;border-radius:4px 4px 8px 8px;position:relative;transform:rotate(18deg);}\n  .node .pen-mini::before{content:\"\";position:absolute;left:50%;top:100%;transform:translateX(-50%);\n    border:7px solid transparent;border-top:12px solid inherit;width:0;height:0;}\n  .node h3{font-size:18px;font-family:\"STKaiti\",\"KaiTi\",serif;letter-spacing:.12em;}\n  .node p{font-size:12.5px;color:#c2cdb8;margin-top:4px;line-height:1.8;}\n  .node .lv{margin-left:auto;font-family:\"STKaiti\",\"KaiTi\",serif;color:var(--gold);font-size:15px;flex-shrink:0;}\n  .peak{font-size:34px;margin-top:20px;filter:drop-shadow(0 0 18px rgba(87,196,163,.8));text-align:center;}\n  .peak-name{font-family:\"STKaiti\",\"KaiTi\",serif;color:var(--jade);letter-spacing:.24em;font-size:16px;text-align:center;margin-top:6px;}\n\n  /* ============ 神笔样式 ============ */\n  .pen{width:22px;height:88px;border-radius:5px 5px 10px 10px;position:relative;margin:0 auto;}\n  .pen::before{content:\"\";position:absolute;left:50%;top:100%;transform:translateX(-50%);\n    border:9px solid transparent;border-top:15px solid #caa64f;width:0;height:0;filter:drop-shadow(0 0 6px rgba(255,209,102,.9));}\n  .pen::after{content:\"\";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:6px;height:26px;border-radius:4px;background:rgba(255,255,255,.5);}\n  .pen.g1{background:linear-gradient(#b08a5f,#6f4e37);}   .pen.g1::before{border-top-color:#9c7b52;filter:none;}\n  .pen.g2{background:linear-gradient(#8fc07a,#3a5a40);}   .pen.g2::before{border-top-color:#caa64f;filter:none;}\n  .pen.g3{background:linear-gradient(#d98e4a,#8a4b1f);}   .pen.g3::before{border-top-color:#caa64f;filter:none;}\n  .pen.g4{background:linear-gradient(#f2f6f9,#9fb0bf);box-shadow:0 0 16px rgba(220,230,240,.55);}\n  .pen.g5{background:linear-gradient(#ffe08a,#d4a017);box-shadow:0 0 22px rgba(255,209,102,.75);}\n  .pen.g6{background:linear-gradient(#8ff0cd,#1b7a68);box-shadow:0 0 30px rgba(87,196,163,.9);animation:jadePulse 1.6s ease infinite;}\n  @keyframes jadePulse{0%,100%{box-shadow:0 0 22px rgba(87,196,163,.7);}50%{box-shadow:0 0 44px rgba(87,196,163,1);}}\n\n  /* ============ 答题 ============ */\n  #quiz{background:linear-gradient(180deg,#141a15,#1e2a20);color:var(--paper);padding:3vh 4vw 8vh;}\n  .quiz-top{width:min(760px,94vw);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}\n  .qchip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:7px 16px;font-size:13px;display:flex;align-items:center;gap:8px;}\n  .streak-dots{display:flex;gap:6px;}\n  .streak-dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);}\n  .streak-dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold);}\n  .quiz-card{\n    width:min(760px,94vw);background:linear-gradient(#faf4e4,#efe4c8);color:#3a3226;border-radius:20px;\n    padding:30px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden;\n  }\n  .quiz-card .scene{font-size:12px;letter-spacing:.24em;color:#8a6d3b;margin-bottom:12px;}\n  .quiz-card h3{font-family:\"STKaiti\",\"KaiTi\",serif;font-size:clamp(19px,3.4vw,25px);line-height:1.9;margin-bottom:22px;}\n  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}\n  @media (max-width:560px){.opts{grid-template-columns:1fr;}}\n  .opt{\n    background:#fff;border:2px solid #d8c9a0;border-radius:14px;padding:15px 18px;cursor:pointer;\n    font-size:16px;font-family:\"STKaiti\",\"KaiTi\",\"楷体\",serif;line-height:1.7;transition:all .18s;position:relative;text-align:left;color:#3a3226;\n  }\n  .opt:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 18px rgba(233,180,76,.25);}\n  .opt.right{border-color:#2a9d8f;background:#e8f7f0;animation:rightPop .5s ease;}\n  .opt.wrong{border-color:var(--seal);background:#fbeae8;animation:shake .4s;}\n  .opt.dim{opacity:.32;pointer-events:none;}\n  @keyframes rightPop{0%{transform:scale(1);}45%{transform:scale(1.05);}100%{transform:scale(1);}}\n  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}\n  .quiz-foot{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}\n  .skill-btn{background:linear-gradient(#fff8e6,#f3e3bb);border:2px solid var(--gold-d);color:#5a3a00;font-size:13.5px;padding:9px 20px;box-shadow:0 4px 12px rgba(176,125,43,.25);}\n  .skill-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}\n  .verdict-line{margin-top:16px;min-height:26px;text-align:center;font-family:\"STKaiti\",\"KaiTi\",serif;font-size:16px;color:#5a3a00;}\n  .cameo{\n    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);z-index:40;\n    background:rgba(20,15,10,.92);color:#f0dfae;border:1px solid rgba(233,180,76,.4);border-radius:16px;\n    padding:12px 22px;font-size:14px;max-width:88vw;text-align:center;opacity:0;transition:.45s;line-height:1.9;\n  }\n  .cameo.show{opacity:1;transform:translateX(-50%) translateY(0);}\n  .cameo b{color:var(--gold);}\n\n  /* ============ 升级仪式 ============ */\n  #levelup{background:radial-gradient(circle at 50% 40%,#2a2115,#120d08 75%);color:var(--paper);justify-content:center;text-align:center;}\n  .lu-pen{animation:luRise 1.4s cubic-bezier(.3,0,.2,1) both;transform-origin:center;}\n  @keyframes luRise{from{transform:translateY(70px) scale(.4);opacity:0;}to{transform:none;opacity:1;}}\n  .lu-poem{font-family:\"STKaiti\",\"KaiTi\",serif;font-size:clamp(18px,3.6vw,26px);line-height:2.4;color:#f0dfae;\n    margin-top:26px;white-space:pre-line;animation:fadeUp 1s .8s both;}\n  .lu-title{font-size:30px;font-weight:900;letter-spacing:.2em;color:var(--gold);margin-top:8px;animation:fadeUp .8s .3s both;}\n  .burst{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#fff;\n    transform:translate(-50%,-50%);opacity:0;pointer-events:none;}\n  .burst.go{animation:boom2 1s ease-out forwards;}\n  @keyframes boom2{0%{opacity:1;box-shadow:0 0 20px 12px #fff;}100%{opacity:0;box-shadow:0 0 140px 80px rgba(233,180,76,0);}}\n\n  /* ============ 玉笔殿 / 决战 ============ */\n  #jade{background:linear-gradient(180deg,#0d1a16 0%,#12251e 55%,#1d3a2e 100%);color:var(--paper);padding:6vh 4vw 8vh;}\n  .jade-hall{text-align:center;max-width:640px;}\n  .jade-pen-big{width:34px;height:130px;margin:26px auto 10px;}\n  .jade-quote{font-family:\"STKaiti\",\"KaiTi\",serif;color:#bfe9d4;font-size:15px;line-height:2.2;margin-top:14px;}\n  .duel-modes{display:flex;gap:16px;justify-content:center;margin-top:30px;flex-wrap:wrap;}\n  #duel{background:linear-gradient(180deg,#0d1a16,#1d3a2e);color:var(--paper);padding:3vh 4vw 8vh;}\n  .hp-row{display:flex;align-items:center;justify-content:space-between;width:min(760px,94vw);margin-bottom:20px;gap:14px;flex-wrap:wrap;}\n  .fighter{text-align:center;flex:1;min-width:150px;}\n  .fighter .fname{font-family:\"STKaiti\",\"KaiTi\",serif;font-size:18px;letter-spacing:.1em;}\n  .hp-bar{height:14px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;margin-top:8px;}\n  .hp-bar i{display:block;height:100%;background:linear-gradient(90deg,#e74c3c,#ff8fa3);transition:width .5s;}\n  .hp-bar.mine i{background:linear-gradient(90deg,#2a9d8f,#7ee2b8);}\n  .vs{font-family:\"STKaiti\",\"KaiTi\",serif;color:var(--gold);font-size:26px;}\n  .duel-q{width:min(760px,94vw);}\n  .duel-timer{height:8px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin:12px 0 18px;}\n  .duel-timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear;}\n  .foe-bubble{\n    margin:14px auto 0;width:fit-content;max-width:90vw;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);\n    border-radius:14px;padding:10px 20px;font-size:14px;font-family:\"STKaiti\",\"KaiTi\",serif;min-height:24px;line-height:1.9;\n  }\n  .pass-device{width:min(560px,92vw);text-align:center;background:rgba(255,255,255,.08);border-radius:18px;padding:26px 22px;margin:14px 0 20px;}\n  .pass-device h3{font-family:\"STKaiti\",\"KaiTi\",serif;color:var(--gold);font-size:20px;margin-bottom:10px;}\n\n\n  /* ============ 你问虎答 ============ */\n  #ask{background:radial-gradient(circle at 50% 12%,#2a221a,#14100b 72%);color:var(--paper);padding:3vh 4vw 7vh;}\n  .ask-head{width:min(760px,94vw);display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}\n  .tiger{width:56px;height:56px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;\n    font-size:32px;background:radial-gradient(circle at 34% 30%,#ffe9b8,#e0a53c);\n    box-shadow:0 0 22px rgba(233,180,76,.55);}\n  .ask-head h2{font-family:\"STKaiti\",\"KaiTi\",serif;font-size:24px;letter-spacing:.16em;color:var(--gold);}\n  .ask-head p{font-size:12px;color:#bda98a;margin-top:4px;letter-spacing:.06em;}\n  .ask-note{width:min(760px,94vw);font-size:11.5px;color:#8e7b60;line-height:1.9;margin-bottom:14px;}\n  .chat{width:min(760px,94vw);display:flex;flex-direction:column;gap:14px;min-height:200px;}\n  .msg{display:flex;gap:10px;align-items:flex-start;animation:fadeUp .4s ease;}\n  .msg .who{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;\n    background:radial-gradient(circle at 34% 30%,#ffe9b8,#e0a53c);box-shadow:0 0 12px rgba(233,180,76,.4);}\n  .bubble{max-width:min(560px,80vw);padding:14px 20px;border-radius:18px;font-size:15px;line-height:2;\n    font-family:\"STKaiti\",\"KaiTi\",serif;letter-spacing:.02em;}\n  .msg.tiger-side .bubble{background:linear-gradient(#f8f0da,#efe0bb);color:#3d3220;border-top-left-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.3);}\n  .msg.me-side{flex-direction:row-reverse;}\n  .msg.me-side .who{background:linear-gradient(#6b4f2a,#3d2c14);color:#ffe9b8;font-size:18px;}\n  .msg.me-side .bubble{background:rgba(255,255,255,.1);color:#f0e6d2;border-top-right-radius:6px;border:1px solid rgba(255 er;color:#6b5220;font-size:13.5px;padding:46px 0;letter-spacing:.1em;}\n  /* —— 一键发朋友圈：三步指引（宣纸风） —— */\n  .mg-mask{position:fixed;inset:0;z-index:90;background:rgba(52,38,16,.6);-webkit-backdrop-filter:blur(3px);\n    backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;\n    animation:mgIn .2s ease both;}\n  @keyframes mgIn{from{opacity:0}to{opacity:1}}\n  .mg-box{width:100%;max-width:358px;background:#fdf6e6;border:1px solid rgba(176,125,43,.65);\n    border-radius:16px;padding:22px 20px 18px;box-shadow:0 24px 56px rgba(60,40,8,.45);\n    animation:mgUp .26s cubic-bezier(.22,1.2,.4,1) both;}\n  @keyframes mgUp{from{transform:translateY(20px) scale(.96);opacity:0}to{transform:none;opacity:1}}\n  .mg-t{font-family:\"STKaiti\",\"KaiTi\",serif;font-size:19px;color:#7a4a00;letter-spacing:.16em;\n    text-align:center;margin-bottom:14px;font-weight:800;}\n  .mg-steps{margin:0;padding:0;list-style:none;counter-reset:mg;}\n  .mg-steps li{counter-increment:mg;position:relative;padding-left:30px;font-size:13.5px;line-height:1.85;\n    color:#4a3a10;margin-bottom:10px;}\n  .mg-steps li::before{content:counter(mg);position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;\n    background:rgba(176,125,43,.14);border:1px solid rgba(176,125,43,.6);color:#8a5a00;font-size:11.5px;\n    display:flex;align-items:center;justify-content:center;font-weight:800;}\n  .mg-steps li b{color:#0d6b4f;}\n  .mg-acts{display:flex;flex-direction:column;gap:9px;margin-top:16px;}\n  .mg-note{font-size:11.5px;color:#8b7346;line-height:1.8;margin-top:12px;text-align:center;}\n  /* —— 音效开关 —— */\n  #sfxBtn{\n    position:fixed;right:16px;bottom:22px;z-index:75;width:46px;height:46px;border-radius:50%;\n    border:1px solid rgba(233,180,76,.55);background:rgba(20,16,10,.72);color:#f0dfae;\n    font-size:20px;line-height:1;cursor:pointer;backdrop-filter:blur(6px);\n    box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .18s,background .18s ign:center;padding:22px;color:rgba(240,223,174,.55);font-size:12px;letter-spacing:.18em;line-height:2;}\n</style><body>\n\n<!--pnid:pvsIHJqn5vH394VTI28Gqo--><!-- ================= 彩蛋 ================= -->\n<section data-page-node-id=\"njJcFnzUTd6gr2XdfU6nvW\" class=\"screen active\" id=\"egg\">\n  <div data-page-node-id=\"z2kFfEWj9fQaA8oLH9Jmh9\" class=\"egg-box\">\n    <div data-page-node-id=\"eXxRGO6hfsVVAzXKw3mhkH\" class=\"blackbox\" id=\"blackBox\" title=\"点开黑色的盒子\"></div>\n    <div data-page-node-id=\"OCImn6pFbBkhRuktqs5tmh\" class=\"egg\" id=\"eggEl\" style=\"display:none\">\n      <span data-page-node-id=\"DZGKJqhhOGCrAz3tmMRH2U\" class=\"carve kai\"><!--pnid:gRGqO63i6zy49dhJRBNY6q-->鬼笔之魂</span>\n    </div>\n    <div data-page-node-id=\"6H2ZsiCcqg6fL8OEvwthta\" class=\"egg-hint\" id=\"eggHint\"><!--pnid:4Yv7xLmfGBrhvAJFF7dpWc-->四虎作品《少年笔侠》· 一个刻着四个字的彩蛋<br data-page-node-id=\"A7tz5wIx8OVLr7Fi3H8Xyu\"><!--pnid:8s27438KzpSDT8w5Hgylar-->👆 点开保密的黑盒子，再轻敲彩蛋三下</div>\n    <div data-page-node-id=\"8Rldtg8jxNBfjU44RLWbgB\" class=\"pw-row\" id=\"pwRow\" style=\"display:none\">\n      <input data-page-node-id=\"CP5lMbFnw2QIPecgXj6doo\" class=\"pw-input\" id=\"pwInput\" maxlength=\"10\" placeholder=\"答案两个字，填在这里\">\n      <button data-page-node-id=\"Mx1yfHQYjp0mBxj75Mp2jf\" class=\"btn btn-gold\" onclick=\"tryPassword()\"><!--pnid:pAq5ag73clUprFusj41Ouy-->登录</button>\n    </div>\n    <div data-page-node-id=\"XoG0V2MoUcZcCVL1bbwyQC\" id=\"loginTip\" style=\"display:none; margin:14px auto 0; max-width:540px; text-align:left; background:rgba(22,17,12,.78); border:1px solid rgba(233,180,76,.38); border-radius:14px; padding:14px 16px; font-size:13.5px; line-height:1.95; color:#e8dcc0; box-shadow:0 8px 26px rgba(0,0,0,.38)\">\n      <div data-page-node-id=\"1V43rSy7Z3e2TGJwdew3Ae\" style=\"color:#e9b44c; font-weight:700; letter-spacing:.06em; margin-bottom:6px\"><!--pnid:rGEW5xVUol36DdSqJUkzag-->🔑 登录提示 · 没读过原著也能进</div>\n      <div data-page-node-id=\"VlPmvSvoyzFTEy3Yv1l4jU\"><!--pnid:RjtnJi8t8taFEUKlPIlXpl-->这道小题的答案，就是密码（<b data-page-node-id=\"jpWUm3GwBtGlx9SoKjpKW4\" style=\"color:#e9b44c\"><!--pnid:rcE83yH7lo32WtUCdEMwAp-->两个字</b><!--pnid:2gYim40hCHEwx6r6iCIXIa-->）：</div>\n      <div data-page-node-id=\"JTKYbP9i52vkYKxFSnx84U\" style=\"margin:9px 0; padding:9px 12px; background:rgba(233,180,76,.1); border-left:3px solid #e9b44c; border-radius:6px; color:#f6eed8; font-family:'STKaiti','KaiTi',serif; font-size:16.5px\"><!--pnid:nARpagy2RLuUhHClB6d4fY-->「鸟宿池边树，僧敲月下门」——这句诗的作者是谁？</div>\n      <div data-page-node-id=\"prXBCdhx1eB3D7yRCoezkL\" style=\"color:#c6b9a0; font-size:12.5px\"><!--pnid:Q8HWCw5VLCx2K9fY5wV87Z-->想不起来？他当年为一个「推」字、一个「敲」字斟酌了半天，「推敲」这个词就是从他那儿来的。<br data-page-node-id=\"WBIPFTB8U714ETSpkjNvaL\"><!--pnid:fFUKh79EHdpa5cNuoC1bTd-->他写过「十年磨一剑」，是唐代一位苦吟诗人。</div>\n      <div data-page-node-id=\"OjBaoe6KLwqNx29Y2k83sg\" style=\"margin-top:10px; display:flex; gap:10px; flex-wrap:wrap\">\n        <button data-page-node-id=\"WStd0w6YaNQpFXAu6l8rgG\" onclick=\"fillPw()\" style=\"background:transparent; border:1px dashed rgba(233,180,76,.65); color:#e9b44c; border-radius:999px; padding:7px 16px; font-size:13px; cursor:pointer\"><!--pnid:YMG5Rvt0gqbvfXZtBrlLkN-->还是想不出来？点这里直接进 →</button>\n        <button data-page-node-id=\"BDchqcvhwfHkghKxf3eYBY\" onclick=\"hintAgain()\" style=\"background:transparent; border:1px dashed rgba(240,223,174,.35); color:#c6b9a0; border-radius:999px; padding:7px 16px; font-size:13px; cursor:pointer\"><!--pnid:0U9H2kiY3NFGWPWTkkKElB-->再给一点提示</button>\n      </div>\n    </div>\n    <div data-page-node-id=\"GpkY2Yk6S4X9IcOKgL3bui\" class=\"pw-msg\" id=\"pwMsg\"></div>\n    <div data-page-node-id=\"KpLcpsCkZqxAflQNO6QUf9\" class=\"intro-note\"><!--pnid:zaRfMskBSWyjhw52aWfC2H-->\n      在《少年笔侠》原著里，<b data-page-node-id=\"r1eHURDRuSYjsk8m7ZoKBu\"><!--pnid:0D2NN7aSDe6Iw8HeIKr833-->《鬼笔之魂》</b><!--pnid:6DYrdSzBoJDkYQq0PQPIUZ-->曾是黑老板设下的陷阱——它偷偷帮人答题，让少年们失去真正的本领。<br data-page-node-id=\"SRYeHx9esfZ09viJ6cwAVv\"><!--pnid:DWEigEyGDhaBVU44WKRNtX-->\n      现在，这个游戏<b data-page-node-id=\"CcU9mIf1BBlSkDUFq2I3ll\"><!--pnid:zAiTYEXyKxtdlXT41EmK52-->是一座真正的试炼场</b><!--pnid:6UGfusXCfO4TcD0UzfwDr3-->：不替你写一个字，只考你小学语文的真功夫。<br data-page-node-id=\"r0EzJRJLaazI6hLcStcWvw\"><!--pnid:19y85QDV2wwN4oN0X9fNcC-->\n      背好诗词、练好笔力，从<b data-page-node-id=\"FPKVJ20beINv2CJvYcI1I9\"><!--pnid:adCM9WokCdXX2uStReTPOW-->土笔</b><!--pnid:VhbGldRlQpHUz1DV95HRTc-->一路升到<b data-page-node-id=\"xtbYjJ3Xner5MfNBPJaTIi\"><!--pnid:CHEkCQTnImRWy9lJP5Bwro-->玉笔</b><!--pnid:q8I3CtQY8oI7s9oriNJnik-->，到山顶争夺<b data-page-node-id=\"e6MBk1eOxp7Mm2U9V1dxmr\"><!--pnid:pV8Xs5S9NfwZaEksHnKQZ7-->鬼笔王</b><!--pnid:QY8zg0r1t0S43JOyO5cDPz-->！\n    </div>\n    <div data-page-node-id=\"WIugVuWUwtNqaaIeDvFeqP\" style=\"margin:16px auto 0; max-width:560px; text-align:center; font-size:12.5px; line-height:1.9; color:rgba(240,223,174,.62); border-top:1px solid rgba(240,223,174,.16); padding-top:12px\"><!--pnid:AeZ6lrN5UjqRSrJODFdjrU-->\n      本游戏根据四虎作品《少年笔侠》改编而成。<br data-page-node-id=\"8AZWMIWZkFicgkYYRTa7OD\">\n      <b data-page-node-id=\"0IsGzbVpVSkE3bUFDrBI9s\" style=\"color:rgba(240,223,174,.9)\"><!--pnid:8rRLCX6yhKh8WxnR2uSHmS-->没有读过原著，也不影响进入游戏</b><!--pnid:D9MMvF2bxCTwP05xKIpedM-->——每一关都有文字提示，跟着提示走就行。欢迎！\n    </div>\n  </div>\n</section>\n\n<!--pnid:b2VPgtbYVGWozPPPA6d8SA--><!-- ================= 承诺书 ================= -->\n<section data-page-node-id=\"tNaP6PKUFaqmv5CWxpJUsW\" class=\"screen\" id=\"pledge\">\n  <div data-page-node-id=\"P3uS1TEb3UfI5LhdDPqaHN\" class=\"scroll\">\n    <h2 data-page-node-id=\"9M0o7zWOHIMIFqObzubYag\"><!--pnid:FL7vjrGFQXAb1cW08Gah8U-->承 诺 书</h2>\n    <p data-page-node-id=\"REUbrNtdAHDhrh0bW2UNyA\"><!--pnid:zo8zJ3cMInVtuL1reYQKMq-->一、我承诺<b data-page-node-id=\"gAHK51Hjocvs5fTd9peBVD\"><!--pnid:PtcEt1D5icQPpkNvKDBsv9-->诚实作答</b><!--pnid:jCGMnMnNhiifQNzR9ApYbL-->，不用任何外挂，也不让无敌玉笔替我写答案——因为真正的功夫要长在自己身上。</p>\n    <p data-page-node-id=\"TdNFaEt4GXv6AfagilZldu\"><!--pnid:tUrFWMaBd8jB5EojnLSvRV-->二、答错了不气馁，把每一道错题变成升级的燃料。</p>\n    <p data-page-node-id=\"xqxZJG2okIZ1YEuQSpjJO1\"><!--pnid:dXrg4BzZI8PmwaJ2fQYsdL-->三、我愿意把学语文的快乐，<b data-page-node-id=\"ASHIJyBB6MCu7jl2KZuCyH\"><!--pnid:CLAhxKDdV0dEnbHgDqY7o2-->分享给爸爸妈妈</b><!--pnid:a2u8Ko63oL4fjza0zqxPGh-->（这条恰好和原著相反 😉）。</p>\n    <div data-page-node-id=\"Z4VA64M31BozcpbBRK7NXt\" class=\"seal-stamp\"><!--pnid:UulZZlsUOZdeWpYW0Y88ps-->鬼笔<br data-page-node-id=\"nFCpTL1jfgB8z3Ht4ADuwb\"><!--pnid:sXTnzYy10DyPGJ7FO8uTqO-->之魂</div>\n    <input data-page-node-id=\"kLFQYFjVwV475w6hJvSwnW\" class=\"name-input\" id=\"heroName\" maxlength=\"8\" placeholder=\"报上你的笔侠名号（如：隐者）\">\n    <div data-page-node-id=\"GqO4cQxvY9kGxgZIiXFKBD\" class=\"btn-row\">\n      <button data-page-node-id=\"DboxyT5uHax7oWGX29ggcp\" class=\"btn btn-gold\" onclick=\"signPledge()\"><!--pnid:tU3T3guUJg6kR221GlEBwu-->✍ 按下笔印 · 进入试炼</button>\n    </div>\n  </div>\n</section>\n\n<!--pnid:yekN0uDPrOkhq553yNoOlu--><!-- ================= 山路地图 ================= -->\n<section data-page-node-id=\"g4ypcwFEoaaRJv93eihEcB\" class=\"screen\" id=\"map\">\n  <div data-page-node-id=\"0j7DA7CTpvIGyDdEfGDhvl\" class=\"map-title\">\n    <h2 data-page-node-id=\"77H9X1sN9AezbXz21dU1b1\"><!--pnid:wcjqoCnsqNPiJtswCuK5yt-->鬼笔试炼之路</h2>\n    <p data-page-node-id=\"bHRbqy7IuiVUr3m0Qo5RYC\" id=\"mapSub\"><!--pnid:QTh8YkpTwgqaNehiOqCVQF-->山谷的雾里传来爷爷的声音：「熟读唐诗三百首，不会作诗也会吟。」</p>\n    <div data-page-node-id=\"0MFhUiZbJSbJnDJz4ZGk6O\" id=\"mapPenSlot\" style=\"margin:14px auto 0\"></div>\n  </div>\n  <div data-page-node-id=\"3C0aztbpXaOE6nWuSvZC33\" class=\"path\" id=\"pathList\"></div>\n  <div data-page-node-id=\"bkmvN2Q9FXt1QpVUIsQkKp\" class=\"peak\"><!--pnid:zcZ1WtDUQPbwqS4cJvY4dJ-->⛰️</div>\n  <div data-page-node-id=\"1UNY3CMJPp267GJkTgpoEP\" class=\"peak-name\"><!--pnid:IPt20rTM1A69JI3mRhQUJU-->山顶 · 玉笔殿 · 鬼笔王之战</div>\n  <div data-page-node-id=\"WRdHh4yp0mEJLJoV1PgiUJ\" style=\"text-align:center; margin-top:18px\">\n    <button data-page-node-id=\"zTHDzkgWKnintX9RodLXOm\" class=\"btn btn-gold\" onclick=\"openAsk()\" style=\"font-size:15px; padding:12px 30px\"><!--pnid:wyFV0Ig6baQeiz5oy5btS2-->🐯 你问虎答 · 找虎叔聊聊</button>\n    <div data-page-node-id=\"BvhFJqqGmzpjQ2o5OXwHEh\" style=\"font-size:11.5px; color:#9fb0a3; margin-top:8px; letter-spacing:.06em\"><!--pnid:GXD880YxHS7vEic6hSPRSD-->童话里的事、写作文的难处、心里的疙瘩，都可以问</div>\n  </div>\n  <footer data-page-node-id=\"aleF80sBsAq9GGuREFg0xL\"><!--pnid:zg13P8YrkOnYcukloinlE4-->每一关连续答对 3 题即可升级 · 六级神笔对应小学六个年级</footer>\n</section>\n\n<!--pnid:vA3MKQwL5N358oB6Mh6iAY--><!-- ================= 答题 ================= -->\n<section data-page-node-id=\"EeaWVZaNvzt5wO6B2mgIf0\" class=\"screen\" id=\"quiz\">\n  <div data-page-node-id=\"ZQqkzP5XEu4tZSmcgCPYaw\" class=\"quiz-top\">\n    <span data-page-node-id=\"AyiDSR4tTxmN2ciOT5p1ot\" class=\"qchip\" id=\"qPenChip\"></span>\n    <span data-page-node-id=\"XQOLaGBIYcgLZbrYwgyFN0\" class=\"qchip\"><!--pnid:jynWJI5NViy1Nz6IbiDz1t-->连击 <span data-page-node-id=\"wlgMNXOx3vpFrQ6YbOuzrh\" class=\"streak-dots\" id=\"streakDots\"><i data-page-node-id=\"Mdremi4FU7yxSaiX46p2va\"></i><i data-page-node-id=\"q2zbpqPIZDPpNf81F1A2bV\"></i><i data-page-node-id=\"u9pAmJydw5gGmA5vORGshs\"></i></span></span>\n    <button data-page-node-id=\"dKjGmUiCn29lelSBtsLiyD\" class=\"btn btn-mini\" onclick=\"useJinnang()\"><!--pnid:Srrt60W0Uga14eeKjkGjww-->🧿 锦囊妙计 ×<span data-page-node-id=\"dMaMSD9TG582hgxpgC9lOr\" id=\"jnCount\"><!--pnid:y8NeuikMvTXCXMQLhgjIOy-->2</span></button>\n    <button data-page-node-id=\"ZSWr8GsNIFjiI8iiWvXb5a\" class=\"btn btn-mini\" onclick=\"useLei()\"><!--pnid:OtO3XVA1CZQCt2YoDfbUah-->⚡ 雷神咒 ×<span data-page-node-id=\"JFWYBjhgzuQlXElWVsw1dy\" id=\"leiCount\"><!--pnid:m7BPDzHXyeGboFJqQRMEVf-->1</span></button>\n    <button data-page-node-id=\"g0n7peU1dN0WEZszGXEW8O\" class=\"btn btn-mini\" onclick=\"go('map')\"><!--pnid:XGXqaapSsrI6QHlL0e6RmM-->暂回山路</button>\n  </div>\n  <div data-page-node-id=\"3sBunpi2pr0Xt2fpoImQRB\" class=\"quiz-card\">\n    <div data-page-node-id=\"fJl8SNOk1u9XVSxjD7bIuX\" class=\"scene\" id=\"qScene\"></div>\n    <h3 data-page-node-id=\"50TGFDMNZb7akoz1XVM7aA\" id=\"qText\"></h3>\n    <div data-page-node-id=\"PZIMwScPnbDZi71oP5bl4Q\" class=\"opts\" id=\"qOpts\"></div>\n    <div data-page-node-id=\"1CGZ7V9YF44nwE8SnalbXp\" class=\"verdict-line\" id=\"qVerdict\"></div>\n    <div data-page-node-id=\"9gJrTsUIzauJ2AAeaeJzRx\" class=\"quiz-foot\" id=\"qFoot\"></div>\n  </div>\n</section>\n\n<!--pnid:OV8zIQpvClVM3Ss4gtCbiC--><!-- ================= 升级仪式 ================= -->\n<section data-page-node-id=\"QN4VQZBP8LTELd7sVA0A5n\" class=\"screen\" id=\"levelup\">\n  <div data-page-node-id=\"1zyZ7rzxAEHtis3s2LZEaj\" style=\"position:relative\">\n    <div data-page-node-id=\"IHwc20LJgv9aTw2p1wuK6W\" class=\"burst\" id=\"luBurst\"></div>\n    <div data-page-node-id=\"odlnGB6J7ipUhDcWNWdsT3\" class=\"pen lu-pen\" id=\"luPen\" style=\"margin-top:40px\"></div>\n  </div>\n  <div data-page-node-id=\"QzUd65V0XJXiODMq28PXy4\" class=\"lu-title\" id=\"luTitle\"></div>\n  <div data-page-node-id=\"Ia5ndDPKm1PiTgol3PRQhn\" class=\"lu-poem kai\" id=\"luPoem\"></div>\n  <div data-page-node-id=\"p2nXEB9EVCKV9KT0EvMY5O\" style=\"margin-top:34px\"><button data-page-node-id=\"4quh4bbFPHiNjeUN5PnTZ7\" class=\"btn btn-gold\" id=\"luBtn\" onclick=\"afterLevelUp()\"><!--pnid:nsjKx8U8oP10FSEtNolymq-->继续攀登 ⛰️</button></div>\n</section>\n\n<!--pnid:WQnaHLAzE4ZcdBImTyYq0c--><!-- ================= 玉笔殿 ================= -->\n<section data-page-node-id=\"fIWXynxITJJGjP1TvqhXSk\" class=\"screen\" id=\"jade\">\n  <div data-page-node-id=\"eQt4S8r409LT3MHthJygKq\" class=\"jade-hall\">\n    <h2 data-page-node-id=\"lDO3sXWVjcJhvSyXMNnNix\" class=\"kai\" style=\"font-size:clamp(24px,4.5vw,32px); letter-spacing:.24em; color:var(--jade); text-shadow:0 0 24px rgba(87,196,163,.6)\"><!--pnid:vm7cYT5zfxomZdNMuLTsgO-->玉 笔 殿</h2>\n    <div data-page-node-id=\"IdogQ47AhO9E31m8gETIsi\" class=\"pen g6 jade-pen-big\"></div>\n    <p data-page-node-id=\"knKqpLL4B4WwHZNYQQvIVE\" class=\"jade-quote\"><!--pnid:jK14BengEnqtCesUakFAMR-->盆地中央，无敌玉笔闪闪发光，黑狼在旁虎视眈眈。<br data-page-node-id=\"AHXGxbsRBkspqDiiksljZD\"><!--pnid:0Keo1nX4dLTlZJfQzOOCoo-->\n    按照原著的规矩：决战者可选一名助手随行。<br data-page-node-id=\"nHFzr2IlPPSWAcdlsZHjCl\"><!--pnid:0hDYrZVandTm2FHDcrqUJP-->「远处的记者们已就位——本届鬼笔王，即将诞生。」</p>\n    <div data-page-node-id=\"rVBvSA3ftGhyT5CE9akuDQ\" style=\"margin:22px 0 4px\">\n      <b data-page-node-id=\"jwNVUk0T7nR3KVWqvqmmSq\" class=\"kai\" style=\"color:var(--gold); font-size:16px\"><!--pnid:OV2337XUoUxX304f1Wo7Ur-->选择你的助手（各带一次绝技）：</b>\n    </div>\n    <div data-page-node-id=\"ziBNFO8gwY5akNjPpGvDfe\" class=\"duel-modes\" id=\"helperRow\"></div>\n    <div data-page-node-id=\"BSoyBEzE0L33nMhSwgOElT\" class=\"duel-modes\" style=\"margin-top:34px\">\n      <button data-page-node-id=\"rHusEMjtPs6bhSV6jX96PJ\" class=\"btn btn-gold\" id=\"aiDuelBtn\" onclick=\"startDuel('ai')\"><!--pnid:P4EVpJWXhP5VEc6QgSdwDn-->⚔ 等待对手出现 · 大决战</button>\n      <button data-page-node-id=\"Ji10XAR0flCqCqbNTTiPQe\" class=\"btn btn-dark\" onclick=\"startDuel('pvp')\"><!--pnid:DJ2MGKGqLi35WvVQ2w4K6n-->👥 邀请朋友 · 同屏对战</button>\n    </div>\n  </div>\n</section>\n\n<!--pnid:ikTbJWPszGtXriaTQn0Akh--><!-- ================= 大决战 ================= -->\n<section data-page-node-id=\"iQSRULiuMaQ2KpS8NdgVuj\" class=\"screen\" id=\"duel\">\n  <div data-page-node-id=\"bJqvz4A5ehDF90mcb9lcUA\" class=\"hp-row\">\n    <div data-page-node-id=\"39mo7sI3LTu1eOyT6HQFCW\" class=\"fighter\">\n      <div data-page-node-id=\"98U4izeaYlhMpYkhYct3MO\" class=\"fname\" id=\"meFName\"><!--pnid:oowyx9rQV2hjB1zNzW1MRS-->隐者</div>\n      <div data-page-node-id=\"eethypD7zF59O3HHREOxoY\" class=\"hp-bar mine\"><i data-page-node-id=\"mTdQfGrQ8Ccao3afijpeWJ\" id=\"meHp\" style=\"width:100%\"></i></div>\n    </div>\n    <div data-page-node-id=\"Frxve5Ln1DdFbI9c55skav\" class=\"vs\"><!--pnid:8ya89ygrVfP8bKvgRX08gp-->笔 力 相 搏</div>\n    <div data-page-node-id=\"BebpRvff6AE36hcEWo7etk\" class=\"fighter\">\n      <div data-page-node-id=\"hedCMekp8Cv1pePj5SwXU8\" class=\"fname\" id=\"foeFName\"><!--pnid:PS4ehzdY6DhvtreInLT23Q-->黑石</div>\n      <div data-page-node-id=\"k28aw7Vtf3HkUPb2XJbVmV\" class=\"hp-bar\"><i data-page-node-id=\"fzEEkFohDtuqWMgYCUqKRG\" id=\"foeHp\" style=\"width:100%\"></i></div>\n    </div>\n  </div>\n  <div data-page-node-id=\"3z5ksIp1KtM1MhRSklAuzJ\" class=\"pass-device\" id=\"passBox\" style=\"display:none\">\n    <h3 data-page-node-id=\"bKNszz8008pCK9Wgl6zU80\" id=\"passTitle\"></h3>\n    <p data-page-node-id=\"kg5fsDXLNxjHfW3815847q\" id=\"passText\" style=\"font-size:13.5px; line-height:2; color:#cfe6d8\"></p>\n    <button data-page-node-id=\"vbQ8V1EXyrF3YF5KS4ePWR\" class=\"btn btn-gold\" id=\"passBtn\" onclick=\"passNext()\" style=\"margin-top:12px\"><!--pnid:e5wh4PgcyL4QP33o8HvUNe-->准备好了 · 开始</button>\n  </div>\n  <div data-page-node-id=\"cG6rBtu8WSMW1vaPr1Qwps\" class=\"duel-q\" id=\"duelQ\" style=\"display:none\">\n    <div data-page-node-id=\"FKV6wXnVRjXr34obPN9NEG\" class=\"quiz-card\">\n      <div data-page-node-id=\"uatQZvlvhl5WBMT2p4bQCw\" class=\"scene\" id=\"dScene\"><!--pnid:rc1qZZwCfDRvGTKjGIOK7s-->山顶 · 大决战</div>\n      <h3 data-page-node-id=\"ppIoF15qDugYsWRFz5gDLi\" id=\"dText\"></h3>\n      <div data-page-node-id=\"3y0daK2arU2S2Pg99pHxuv\" class=\"duel-timer\"><i data-page-node-id=\"AwIEfQpZYSjJpkzAQezsPb\" id=\"dTimer\"></i></div>\n      <div data-page-node-id=\"qhzI05xQywfPHRYAONRgj4\" class=\"opts\" id=\"dOpts\"></div>\n      <div data-page-node-id=\"szEkt99576SlxjTrtiCBnK\" class=\"verdict-line\" id=\"dVerdict\"></div>\n      <div data-page-node-id=\"l5oBteJvc2gZZnWfeGLyMg\" class=\"quiz-foot\" id=\"dFoot\"></div>\n    </div>\n    <div data-page-node-id=\"Fx16TXcSl0Hze1NTg1pQDp\" class=\"foe-bubble kai\" id=\"foeBubble\"><!--pnid:XSmWpb5iqNfAAZKtln0hAd-->……</div>\n  </div>\n</section>\n\n<!--pnid:1dCEwNKDP4SqMNBhBC5bxn--><!-- ================= 你问虎答 ================= -->\n<section data-page-node-id=\"7cQImfMI5vYpxdTMASVhvX\" class=\"screen\" id=\"ask\">\n  <div data-page-node-id=\"nPPfIrp5ImkgZ7oyZmWvZu\" class=\"ask-head\">\n    <div data-page-node-id=\"r4F1jrW8aTxxBLXkIATCJs\" class=\"tiger\"><!--pnid:9pEyN70oiqb1LsXr4MI3H0-->🐯</div>\n    <div data-page-node-id=\"xmHSCKFhkNDo3cAsDCZUO0\">\n      <h2 data-page-node-id=\"r6X4b5QuAfB3F2TKbzxMXf\" class=\"kai\"><!--pnid:kcLC5cGj2ZuL0RE4ARVWYF-->你 问 虎 答</h2>\n      <p data-page-node-id=\"sFlMQEOYSeQoH5u73iyj0r\"><!--pnid:hatvwWiVcY1umVpCb8vswk-->四虎在这儿等着小朋友提问 · 关于童话、关于写作、关于长大</p>\n    </div>\n  </div>\n  <div class=\"ask-note\">💡 根据内置知识库和关键词匹配模拟回答，并非作者本人；拿不准的事，以书里写的为准。</div>\n  <div data-page-node-id=\"ynTtEYHqYsj9Ve9wzLGab9\" class=\"chat\" id=\"chat\"></div>\n  <div data-page-node-id=\"HfvMym4FiSkkoR9lR095p7\" class=\"chips\" id=\"chips\"></div>\n  <div data-page-node-id=\"wpny9EE0Dg6hPw53xu44AC\" class=\"ask-input\">\n    <input data-page-node-id=\"smUSJFL1GElTawwSnQwG37\" id=\"askInput\" maxlength=\"60\" placeholder=\"想问虎叔什么？比如：布巴为什么会变成两半？\">\n    <button data-page-node-id=\"NaUdfHgpvY8CF8IhLZjDzE\" class=\"btn btn-gold\" onclick=\"askHǔ()\" style=\"padding:14px 26px; font-size:15px\"><!--pnid:hO6jv53vVCmeGfPS0YY7cx-->问虎叔</button>\n  </div>\n  <div data-page-node-id=\"0z8V8vVHLy5OfSwFC7ImfX\" class=\"ask-actions\">\n    <button data-page-node-id=\"ZZ2fWF1OFiRnArGpduFrOb\" class=\"btn btn-dark\" onclick=\"go('map')\"><!--pnid:WCXxHeUDkUh1rDd2K8yPn4-->← 回山路</button>\n    <button data-page-node-id=\"mvDdTmY2K58C0E9jy6fHMA\" class=\"btn btn-dark\" onclick=\"chatReset()\"><!--pnid:Xalrma2XY91WoSVGCFvVWk-->重新开始聊</button>\n  </div>\n</section>\n\n<!--pnid:sROIEvQ0o8lDWednOchPyL--><!-- ================= 证书 ================= -->\n<section data-page-node-id=\"5y4FHSaGKHkI2BcdQN2yn4\" class=\"screen\" id=\"cert\">\n  <div data-page-node-id=\"xe4B7JLyNTcblwC6eywB3Z\" class=\"cert-scroll\">\n    <div data-page-node-id=\"beQQmvwFXUzwutJKKAo0Rc\" class=\"crown\"><!--pnid:IogiwmdqtuCjid23xvSZFu-->👑</div>\n    <h2 data-page-node-id=\"Z8q9n14cM0Km3Z2jPsbCsQ\" class=\"kai\"><!--pnid:GDKn328KHTCXEtcKoCfTsW-->鬼 笔 王 证 书</h2>\n    <div data-page-node-id=\"e73taOPtRUptU0zg6a6JrM\" class=\"who kai\" id=\"certWho\"></div>\n    <p data-page-node-id=\"oYLNVT2w2x6bRVmQ9D9Qkc\" id=\"certBody\"></p>\n    <div data-page-node-id=\"QSSQuqgZgYRZ186Sh4ytrx\" class=\"secret-code\" id=\"certCode\"></div>\n    <p data-page-node-id=\"CWiWfIz4vWTywuHoLF1ryj\" style=\"font-size:12.5px\"><!--pnid:9VXzS7sK5TXnmL6LBg39SP-->（王者暗号 · 请截图保存）</p>\n    <div data-page-node-id=\"ZFbG9MzgDqPQfWBGYbnndc\" class=\"cert-seal\"><!--pnid:dFOfonreldakUhg3FYyFvc-->鬼笔<br data-page-node-id=\"4kYcJxvsDL1qykkXIYdqPa\"><!--pnid:geiPTEovRX8I3SEi6HcWu7-->之魂</div>\n    <div data-page-node-id=\"ehv3xs97q82MkxdXAbrAT5\" style=\"margin-top:26px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap\">\n      <button data-page-node-id=\"dULogi5VLnZRRfbl6lC8tZ\" class=\"btn btn-gold\" onclick=\"openPenCard()\" style=\"font-size:14px; padding:12px 24px\"><!--pnid:95SLuLYQS60WpK8RfU03kR-->📜 生成我的笔勋章</button>\n      <button data-page-node-id=\"JzithRQq6UYnxQWuepSCzs\" class=\"btn btn-gold\" onclick=\"openAsk()\" style=\"font-size:14px; padding:12px 24px\"><!--pnid:gNkkNOxHDoHSn830Jl3Ftl-->🐯 问虎叔一个问题</button>\n      <button data-page-node-id=\"s5KG2hOgaVOFvHEwe80El8\" class=\"btn btn-dark\" onclick=\"parent.postMessage('reset-preview','*')\"><!--pnid:8qEszm2rWleoko5bxSVaQJ-->再战一届</button>\n    </div>\n  </div>\n  <footer data-page-node-id=\"YpDyTIsaTWokTi63p7i419\"><!--pnid:Oflmt0DTfNyNRw4elqnIVW-->原著彩蛋：登录密码「贾岛」的来处——「鸟宿池边树，僧敲月下门」，推敲的故事，你一定记得。</footer>\n</section>\n\n<!--pnid:K4a5WWGU3bLwQQBreMt7ob--><!-- ================= 笔勋章图卡 ================= -->\n<section data-page-node-id=\"Hv6WbiEAdvDyCh0nmjnklO\" class=\"screen\" id=\"medal\">\n  <div data-page-node-id=\"ubpqtwvhhIaHSLbqZl5mz4\" class=\"medal-scroll\">\n    <h2 data-page-node-id=\"36TAi8VwfVPKly7tnPx2bL\" class=\"kai\"><!--pnid:yIOh20ZYHfcqE5u9K4ryH0-->笔 勋 章</h2>\n    <div data-page-node-id=\"TdbJpUCWqpiX0LMaEzQoqP\" class=\"md-tip\" id=\"mdSub\"><!--pnid:7WQa2o3yP8cm5MwkWhiOSD-->长按图片保存 · 发到朋友圈，召唤同窗来战</div>\n    <div data-page-node-id=\"gQrVObovL8zA9hN1IJkbMh\" id=\"mdStage\"></div>\n  </div>\n</section>\n\n<div data-page-node-id=\"XfI3Ul4Qcvz26dc5SroLLj\" class=\"cameo\" id=\"cameo\"></div>\n<button data-page-node-id=\"YCxJTQ7Vb5q5H1b0wJdZgM\" aria-label=\"音效开关\" id=\"sfxBtn\" onclick=\"toggleSfx()\" title=\"音效开关\"><!--pnid:EJKtnRGRuwQJL0gRJ8hgKD-->🔊</button>\n<div data-page-node-id=\"0oPIbhjTfGUf2Ng8UBgNik\" class=\"praise\" id=\"praiseCard\">\n  <div data-page-node-id=\"KhuYMMPivjgQsXbuq49Vdh\" class=\"avatar\" id=\"praiseAvatar\"><!--pnid:jIO24QGnQTjzmkrz6cJdWB-->🧙</div>\n  <div data-page-node-id=\"1x0UwVKferHTDgFrTasHdJ\" class=\"pbody\">\n    <div data-page-node-id=\"s5mLwvwXZJdqlZeaU1PpYb\" class=\"pname\" id=\"praiseName\"><!--pnid:5NE2QGqvYq0eH3tlRX84uF-->老子</div>\n    <div data-page-node-id=\"lMMAGI0yO2iKcJmk16bbWM\" class=\"pline\" id=\"praiseLine\"></div>\n  </div>\n</div>\n<div data-page-node-id=\"VFfwRyTMcGhWZTJHVM2pTf\" class=\"combo-fx\" id=\"comboFx\"><!--pnid:ZtsN7tQeuv1hFtPDgmeU1n-->连对三题！</div>\n\n<script>\n\"use strict\";\nconst $=id=>document.getElementById(id);\nfunction go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)];}\n\n/* ================= 音效引擎（WebAudio 实时合成，无需音频文件） ================= */\nlet AC=null, MASTER=null, muted=false;\nfunction audio(){\n  try{\n    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=0.55; MASTER.connect(AC.destination); }\n    if(AC.state==='suspended') AC.resume();\n    return AC;\n  }catch(e){ return null; }\n}\nfunction tone(freq,dur,type,vol,delay,slideTo){\n  const ac=audio(); if(!ac||muted) return;\n  const t0=ac.currentTime+(delay||0);\n  const o=ac.createOscillator(), g=ac.createGain();\n  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);\n  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);\n  g.gain.setValueAtTime(0.0001,t0);\n  g.gain.exponentialRampToValueAtTime(vol||0.14,t0+0.012);\n  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);\n  o.connect(g); g.connect(MASTER); o.start(t0); o.stop(t0+dur+0.02);\n}\nlet NOISE=null;\nfunction noise(dur,vol,filterFreq,delay){\n  const ac=audio(); if(!ac||muted) return;\n  if(!NOISE){\n    NOISE=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);\n    const d=NOISE.getChannelData(0);\n    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);\n  }\n  const t0=ac.currentTime+(delay||0);\n  const src=ac.createBufferSource(); src.buffer=NOISE;\n  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=filterFreq||2200; bp.Q.value=0.8;\n  const g=ac.createGain(); g.gain.setValueAtTime(vol||0.16,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);\n  src.connect(bp); bp.connect(g); g.connect(MASTER); src.start(t0); src.stop(t0+dur+0.02);\n}\n/* —— 各类音色 —— */\nconst sndBlip=()=>tone(720,.07,'sine',.07);\nconst sndSwish=()=>{noise(.18,.13,2600); tone(1200,.14,'sine',.04,0,600);};\nconst sndRight=()=>{tone(784,.12,'sine',.13); tone(1175,.26,'sine',.11,.09); noise(.12,.05,4200,.02);};\nconst sndWrong=()=>{tone(196,.22,'sawtooth',.07); tone(146,.32,'triangle',.06,.1);};\nconst sndStreak=n=>{[659,784,988,1319].slice(0,Math.min(4,n+1)).forEach((f,i)=>tone(f,.16,'triangle',.1,i*.07));};\nconst sndUp=()=>{[523,659,784,1046,1319].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.13)); noise(.5,.05,1800,.05);};\nconst sndWin=()=>{[523,659,784,1046,1319,1568].forEach((f,i)=>tone(f,.34,'sine',.13,i*.15)); tone(261,.9,'sine',.07,.1);};\nconst sndHit=()=>{tone(120,.16,'square',.09); noise(.16,.14,900);};\nconst sndCrown=()=>{tone(392,.5,'sine',.08); tone(587,.5,'sine',.07,.08); tone(784,.7,'sine',.07,.16); noise(.6,.04,5200,.2);};\nconst sndEgg=()=>{noise(.2,.09,1600); tone(320+Math.random()*180,.12,'square',.05);};\nconst sndJade=()=>{tone(880,.5,'sine',.05); tone(1320,.6,'sine',.04,.12);};\n/* 静音开关 */\nfunction toggleSfx(){\n  muted=!muted;\n  const b=document.getElementById('sfxBtn');\n  b.textContent=muted?'🔇':'🔊';\n  b.title=muted?'音效已关闭':'音效已开启';\n  if(!muted){ sndBlip(); setTimeout(()=>sndRight(),120); }\n}\ndocument.addEventListener('pointerdown',()=>audio(),{once:true});\n\n\n/* ---------------- 彩蛋开场 ---------------- */\nlet eggTaps=0;\n$('blackBox').onclick=()=>{\n  $('blackBox').style.display='none';\n  $('eggEl').style.display='flex';\n  $('eggHint').innerHTML='盒子里是一枚小彩蛋，蛋壳上刻着四个字——<b style=\"color:#e9b44c\">鬼笔之魂</b><br>👆 轻敲彩蛋三下。没读过原著也没关系，敲开后有登录提示。';\n  sndEgg();\n};\n$('eggEl').onclick=e=>{\n  if(!eggTaps){\n    $('pwRow').style.display='flex';\n    $('pwMsg').textContent='屏幕浮现一行小字：「超过24小时未登录，请输入密码。」';\n    $('loginTip').style.display='block';\n  }\n  eggTaps++;\n  const c=document.createElement('span');\n  c.className='crack';c.textContent='💥';\n  c.style.left=(20+Math.random()*60)+'%';c.style.top=(15+Math.random()*60)+'%';\n  $('eggEl').appendChild(c);\n  sndEgg();\n  if(eggTaps>=3){\n    $('eggEl').classList.add('glowing');\n    $('pwMsg').innerHTML='<b style=\"color:#f0dfae\">彩蛋裂开了，金光涌出——答对下面的小题，就能进《鬼笔之魂》。</b>';\n    $('loginTip').style.display='block';\n  }\n};\nfunction tryPassword(){\n  const v=($('pwInput').value||'').trim();\n  if(v==='贾岛'){\n    sndRight();\n    $('pwMsg').innerHTML='<b style=\"color:#7ee2b8\">「隐者，欢迎回来！」</b> 登录成功！';\n    window.isYinzhe=true;\n    setTimeout(()=>{ $('heroName').value='隐者'; go('pledge'); },900);\n  }else if(!v){\n    $('pwMsg').textContent='请输入密码。往下看，有一张登录提示卡。';\n    $('loginTip').style.display='block';\n  }else if(eggTaps<3){\n    $('pwMsg').textContent='先敲开彩蛋，才能输入密码哦。';\n  }else{\n    sndWrong();\n    $('pwMsg').innerHTML='密码错误。答案就在下面的提示卡里——「鸟宿池边树，僧敲月下门」的作者，两个字。';\n    $('loginTip').style.display='block';\n  }\n}\nfunction fillPw(){\n  $('pwInput
