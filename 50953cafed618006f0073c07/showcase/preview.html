<!DOCTYPE html>

<meta data-page-node-id="Y0efFLme9PsL5Cc3dbqhqD" content="中级职称刷题学习 App：文档一键导入成题库，按科目章节题型管理，支持顺序、随机、错题重做与模拟考试。" name="description">
<title data-page-node-id="2rl1BnteTIHW1gcJ867sj4" data-pnid-children="k59bkuwyQrvlkUzcWV0YaQ">中级职称刷题学习 App · 题库导入与智能练习</title>
<style data-page-node-id="cYcaYVc1GqVRxxPXvOz0E0" data-pnid-children="e4J1N3RXKNaFKoJtWs2zZi">
:root{
  --bg:#f4f6f8; --surface:#fff; --surface-2:#f7f8fa; --surface-3:#eef1f5;
  --line:#e3e7ec; --line-2:#edf0f4;
  --text:#16202b; --text-2:#5a6672; --text-3:#8b95a1;
  --brand:#2a4a6b; --brand-dk:#1f3a56; --brand-soft:#eaf0f6; --brand-line:#c9d7e5;
  --gold:#b8863b; --gold-soft:#fbf3e4; --gold-line:#eddcbb;
  --ok:#1c7a5c; --ok-soft:#e8f5f0; --ok-line:#b7ded1;
  --bad:#b8453c; --bad-soft:#fbeeec; --bad-line:#f0c9c4;
  --r:14px; --r-lg:18px;
  --shadow:0 1px 2px rgba(22,32,43,.05), 0 8px 24px rgba(22,32,43,.06);
  --sab:env(safe-area-inset-bottom, 0px);
  --sat:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none;overflow-x:hidden}
body{
  margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  touch-action:pan-y;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;user-select:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
img,svg{max-width:100%}
img{height:auto}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hide{display:none !important}
.mono{font-variant-numeric:tabular-nums}

/* ---------- 应用外壳 ---------- */
.app{max-width:900px;margin:0 auto;padding:0 14px calc(92px + var(--sab))}
.app-head{
  position:sticky;top:0;z-index:40;background:rgba(244,246,248,.9);
  backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line-2);margin:0 -14px 14px;padding:calc(8px + var(--sat)) 14px 8px;
}
.head-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(145deg,#35577b,#1f3a56);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;
  box-shadow:0 4px 10px rgba(31,58,86,.25);letter-spacing:0;
}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:600;line-height:1.25;letter-spacing:.02em}
.brand-txt small{display:block;font-size:10.5px;color:var(--text-3);line-height:1.3;letter-spacing:.06em}
.head-acts{margin-left:auto;display:flex;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);border:1px solid transparent;background:transparent;
}
.icon-btn:hover{background:var(--surface);border-color:var(--line)}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:6px 10px calc(6px + var(--sab));
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;justify-content:center;
}
.tabbar-in{display:flex;width:100%;max-width:520px;gap:2px}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;
  border-radius:12px;color:var(--text-3);font-size:10.5px;letter-spacing:.02em;
}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--brand);background:var(--brand-soft)}
body.immersive .tabbar,body.immersive .app-head{display:none}
body.immersive .app{padding-bottom:0;max-width:none;padding-left:0;padding-right:0}

/* ---------- 通用块 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin:20px 0 0}
.sec-title{display:flex;align-items:baseline;gap:8px;margin:0 2px 9px;font-size:13px;color:var(--text-2);font-weight:600;letter-spacing:.05em}
.sec-title .more{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:400}
.sec-title .more:hover{color:var(--brand)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  transition:transform .12s ease, background .15s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(42,74,107,.22)}
.btn.primary:hover{background:var(--brand-dk)}
.btn.ghost{background:transparent;border-color:var(--brand-line);color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:31px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:13px;white-space:nowrap;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.chip.soft{background:var(--surface-3);border-color:transparent;color:var(--text-2);font-size:12px;height:26px;padding:0 9px}
.tag{
  display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;
  font-size:11px;line-height:1;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap;
}
.tag.single{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.tag.multi{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}
.tag.judge{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.tag.neutral{background:var(--surface-3);color:var(--text-3)}
.tag.warn{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.muted{color:var(--text-3)}
.small{font-size:12px}
.row-line{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 首页 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px;
  background:linear-gradient(135deg,#2f5479 0%,#223e5d 58%,#1c3450 100%);
  color:#fff;box-shadow:0 12px 28px rgba(28,52,80,.24);
}
.hero::after{
  content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.16), rgba(255,255,255,0) 68%);
}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero-kicker{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.62);margin:0 0 3px}
.hero h1{margin:0;font-size:22px;line-height:1.35;font-weight:600;letter-spacing:.01em}
.hero-sub{margin:5px 0 0;font-size:12px;color:rgba(255,255,255,.66)}
.ring{flex:0 0 auto;width:76px;height:76px}
.ring-t{font-size:14px;font-weight:600;fill:#fff}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin:16px 0 0;position:relative;z-index:1}
.hero-stats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:8px 9px}
.hero-stats b{display:block;font-size:18px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.hero-stats i{display:block;font-style:normal;font-size:10.5px;color:rgba(255,255,255,.62);margin-top:1px}
.hero .btn{margin-top:14px;width:100%;position:relative;z-index:1;background:#fff;border-color:#fff;color:var(--brand-dk);font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.hero .btn:hover{background:#f2f6fa}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px}
.mode{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;
  transition:transform .14s ease, border-color .14s ease;
}
.mode:hover{transform:translateY(-1px);border-color:var(--brand-line)}
.mode:active{transform:none}
.mode-ico{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-soft);color:var(--brand);
}
.mode-ico.gold{background:var(--gold-soft);color:var(--gold)}
.mode-ico.ok{background:var(--ok-soft);color:var(--ok)}
.mode-ico.bad{background:var(--bad-soft);color:var(--bad)}
.mode b{font-size:14.5px;font-weight:600;line-height:1.3}
.mode small{font-size:11.5px;color:var(--text-3);line-height:1.4}

.subject-row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:9px;
}
.subject-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex:0 0 auto}
.subject-row .meta{font-size:11.5px;color:var(--text-3);margin-top:2px}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .3s ease}
.bar.ok > i{background:var(--ok)}
.bar.gold > i{background:var(--gold)}
.chev{color:var(--text-3);font-size:18px;line-height:1;flex:0 0 auto}

.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px}
.rhythm div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.rhythm b{display:block;font-size:19px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.rhythm i{font-style:normal;display:block;font-size:11px;color:var(--text-3);margin-top:2px}

/* ---------- 题库 ---------- */
.seg{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.toolbar{display:flex;gap:8px;align-items:center;margin:2px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:170px;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 11px;height:40px}
.search input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:14px;height:38px}
.search svg{color:var(--text-3);flex:0 0 auto}
.chapter{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 13px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
}
.chapter:hover{border-color:var(--brand-line)}
.chapter .no{
  width:26px;height:26px;border-radius:8px;background:var(--surface-3);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:0 0 auto;
}
.chapter b{font-size:14px;font-weight:500;line-height:1.4}
.chapter .meta{font-size:11px;color:var(--text-3);margin-top:2px}
.q-row{
  display:flex;gap:10px;width:100%;text-align:left;padding:12px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;align-items:flex-start;
}
.q-row:hover{border-color:var(--brand-line)}
.q-row .idx{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;padding-top:2px;min-width:20px}
.q-row .stem{font-size:13.5px;line-height:1.55}
.q-row .sub{margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.state{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto;margin-top:7px}
.state.weak{background:var(--bad)}
.state.done{background:var(--ok)}
.empty{
  text-align:center;padding:34px 18px;border:1px dashed var(--brand-line);border-radius:var(--r);
  background:var(--surface);color:var(--text-3);
}
.empty .ico{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:3px}
.empty p{margin:0 0 12px;font-size:12.5px;line-height:1.6}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);margin:0 2px 10px}
.crumb button{color:var(--brand)}

/* ---------- 导入 ---------- */
.drop{
  border:1.5px dashed var(--brand-line);border-radius:var(--r-lg);background:var(--surface);
  padding:26px 18px;text-align:center;transition:border-color .15s ease, background .15s ease;
}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ico{width:50px;height:50px;border-radius:15px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 11px}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop p{margin:0 0 14px;font-size:12.5px;color:var(--text-3);line-height:1.65}
.fmt{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:4px}
.paste{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.7;background:var(--surface);resize:vertical;outline:none}
.paste:focus{border-color:var(--brand-line)}
.rule{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 13px;font-size:12.5px;color:var(--text-2);line-height:1.75}
.rule b{color:var(--text);font-weight:600}
.rule code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11.5px;color:var(--brand-dk)}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.pv .top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pv .stem{font-size:13.5px;line-height:1.6;margin:6px 0 0}
.pv .opts{font-size:12px;color:var(--text-2);margin:5px 0 0;line-height:1.7}
.pv .foot{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.pv .foot .ans{color:var(--ok);font-weight:600}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:500}
.input,.select,.area{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:9px 11px;font-size:14px;outline:none;
}
.input:focus,.select:focus,.area:focus{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
.area{min-height:88px;resize:vertical;line-height:1.7;font-size:13.5px}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.6;margin-top:4px}
.stat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ---------- 统计 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi i{display:block;font-style:normal;font-size:11px;color:var(--text-3);margin-top:2px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 8px;box-shadow:var(--shadow)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-3);padding:0 3px 6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:1px}
.mbar{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.mbar:last-child{border-bottom:none}
.mbar .name{width:132px;flex:0 0 auto;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbar .track{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.mbar .track > i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.mbar .val{width:52px;text-align:right;font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;flex:0 0 auto}
.trend{display:flex;align-items:flex-end;gap:3px;height:118px;margin-top:6px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.tbar{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.tbar > i{display:block;width:100%;max-width:20px;border-radius:3px 3px 0 0;background:var(--brand-line);min-height:2px;transition:height .3s ease}
.tbar > i.hi{background:var(--ok)}
.tbar > i.mid{background:var(--gold)}
.tbar > i.low{background:var(--bad)}
.tcol em{font-style:normal;font-size:9.5px;color:var(--text-3);white-space:nowrap;height:12px;line-height:12px}
.tcol .tn{font-size:9.5px;color:var(--text-3);font-variant-numeric:tabular-nums;height:12px;line-height:12px}

/* ---------- 我的 ---------- */
.profile{display:flex;align-items:center;gap:13px;padding:16px}
.avatar{
  width:54px;height:54px;border-radius:16px;flex:0 0 auto;
  background:linear-gradient(145deg,#35577b,#1f3a56);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;
}
.profile b{display:block;font-size:16px;font-weight:600}
.profile small{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line-2);background:none}
.li:last-child{border-bottom:none}
.li:hover{background:var(--surface-2)}
.li b{font-size:14px;font-weight:500;display:block}
.li small{font-size:11.5px;color:var(--text-3);display:block;margin-top:2px}
.li .right{margin-left:auto;color:var(--text-3);font-size:12.5px;display:flex;align-items:center;gap:5px}
.switch{width:44px;height:26px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .18s ease;flex:0 0 auto}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s ease}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
.num-step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.num-step button{width:32px;height:32px;font-size:17px;color:var(--text-2);display:flex;align-items:center;justify-content:center}
.num-step button:hover{background:var(--surface-2)}
.num-step span{min-width:46px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- 答题页 ---------- */
.quiz{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.quiz-head{
  background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  padding:calc(8px + var(--sat)) 12px 8px;display:flex;align-items:center;gap:8px;
}
.quiz-head .mid{flex:1;min-width:0;text-align:center}
.quiz-head .mid b{font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.quiz-head .mid small{font-size:11px;color:var(--text-3);display:block}
.pbar{height:3px;background:var(--surface-3)}
.pbar > i{display:block;height:100%;background:var(--brand);transition:width .25s ease}
.quiz-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 14px 20px}
.quiz-in{max-width:760px;margin:0 auto}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.q-head .src{font-size:11px;color:var(--text-3);margin-left:auto}
.q-stem{font-size:16.5px;line-height:1.8;margin:0 0 16px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  font-size:14.5px;line-height:1.65;transition:border-color .12s ease, background .12s ease;
}
.opt:hover{border-color:var(--brand-line)}
.opt .k{
  width:25px;height:25px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--text-2);
  margin-top:1px;background:var(--surface-2);
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.lock{cursor:default}
.opt .txt{word-break:break-word;padding-top:1px}
.verdict{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin:14px 0 0}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.analysis{margin-top:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:13px 14px}
.analysis h4{margin:0 0 6px;font-size:12px;color:var(--text-2);letter-spacing:.06em;font-weight:600}
.analysis p{margin:0;font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.analysis .ans-line{font-size:13px;color:var(--text-2);margin-bottom:8px}
.analysis .ans-line b{color:var(--ok);font-size:14.5px;letter-spacing:.06em}
.quiz-foot{
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + var(--sab));display:flex;gap:8px;align-items:center;
}
.quiz-foot .btn{flex:1}
.sheet-mask{
  position:fixed;inset:0;z-index:120;background:rgba(16,26,42,.45);display:none;align-items:flex-end;justify-content:center;
}
.sheet-mask.show{display:flex}
.sheet{
  width:100%;max-width:540px;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + var(--sab));max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 -10px 40px rgba(16,26,42,.22);animation:sheetUp .2s ease-out;
}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 3px;font-size:16px;font-weight:600}
.sheet .sub{margin:0 0 14px;font-size:12.5px;color:var(--text-3);line-height:1.6}
.sheet-x{position:absolute;right:14px;top:10px;width:30px;height:30px;border-radius:9px;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}
.grid-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px;margin:4px 0 0}
.gnum{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.gnum.done{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-dk);font-weight:500}
.gnum.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.gnum.right{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.gnum.wrong{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.gnum.blank{color:var(--text-3)}
.legend-row{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-top:12px}

/* ---------- 报告 ---------- */
.report{max-width:760px;margin:0 auto;padding:calc(16px + var(--sat)) 14px calc(30px + var(--sab))}
.score-card{text-align:center;padding:22px 16px;border-radius:var(--r-lg);background:linear-gradient(135deg,#2f5479,#1f3a56);color:#fff;box-shadow:0 12px 28px rgba(28,52,80,.24)}
.score-num{font-size:clamp(38px,11vw,52px);line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score-num span{font-size:15px;font-weight:400;color:rgba(255,255,255,.6);margin-left:3px;letter-spacing:0}
.score-label{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px;letter-spacing:.08em}
.score-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:4px;margin-top:18px}
.score-meta div b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.score-meta div i{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.6)}
.rev{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 13px;margin-bottom:8px}
.rev .stem{font-size:13.5px;line-height:1.6;margin:6px 0 0}
.rev .mine{font-size:12px;color:var(--text-2);margin-top:6px}
.rev .mine b.ok{color:var(--ok)}
.rev .mine b.bad{color:var(--bad)}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(88px + var(--sab));transform:translate(-50%,10px);

}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:9px;justify-content:center;padding:30px;color:var(--text-3);font-size:13px}
.loading .spin{border-color:var(--line);border-top-color:var(--brand)}

function uid(prefix) {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function escapeHtml(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pad2(n) { return n < 10 ? '0' + n : String(n); }
function dayKey(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
  return pad2(m) + ':' + pad2(s);
}
function fmtDate(ts) {
  var d = new Date(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }

/* ---------- DOM ---------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function setHTML(el, html) {
  if (!el) return;
  var doc = new DOMParser().parseFromString('<!DOCTYPE html><html><body>' + html + '</body></html>', 'text/html');
  var src = doc.body;
  var frag = document.createDocumentFragment();
  while (src.firstChild) {
    var node = src.removeChild(src.firstChild);
    if (node.nodeType === 1) {
      if (/^(SCRIPT|IFRAME|OBJECT|EMBED|LINK|META|BASE|FORM)$/i.test(node.nodeName)) continue;
      stripDanger(node);
    }
    frag.appendChild(document.adoptNode(node));
  }
  el.replaceChildren(frag);
}
function stripDanger(node) {
  var list = [node];
  if (node.querySelectorAll) list = list.concat(Array.prototype.slice.call(node.querySelectorAll('*')));
  for (var i = 0; i < list.length; i++) {
    var n = list[i];
    if (!n.attributes) continue;
    for (var k = n.attributes.length - 1; k >= 0; k--) {
      var a = n.attributes[k];
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      else if ((a.name === 'href' || a.name === 'src' || a.name === 'xlink:href') && /^\s*(javascript|data:text\/html)/i.test(a.value)) n.removeAttribute(a.name);
    }
  }
}
var toastTimer = null;
function toast(msg) {
  var el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}
function openSheet(html) {
  var mask = $('#sheetMask'), sheet = $('#sheet');
  setHTML(sheet, '<div class="sheet-handle"></div>' + html);

  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#sheetMask').classList.remove('show');
  document.body.style.overflow = '';
  S.confirmCb = null;
}
function askConfirm(title, desc, okText, cb, danger) {

function seedDB() {
  var db = blankDB();
  DEMO_BANK.forEach(function (sub, si) {
    var s = { id: 's' + (si + 1), name: sub.name, code: sub.code, color: sub.color, desc: sub.desc, chapters: [] };
    sub.chapters.forEach(function (ch, ci) {
      var c = { id: s.id + '_c' + (ci + 1), name: ch.name, questions: [] };
      ch.qs.forEach(function (item, qi) {
        c.questions.push({
          id: s.id + '_c' + (ci + 1) + '_q' + (qi + 1),
          type: item.t,
          stem: item.s,
          options: item.o.map(function (txt, oi) { return { key: 'ABCDEFGH'[oi], text: txt }; }),
          answer: item.a.split(''),
          analysis: item.e || '',
          source: '示例题库',
          demo: true,
          createdAt: Date.now()
        });
      });
      s.chapters.push(c);
    });
    db.subjects.push(s);
  });
  db.demo = true;
  return db;
}
function save() {
  var raw;
  try { raw = JSON.stringify(DB); } catch (e) { return; }
  try {
    previewStore.setItem(STORE_KEY, raw);
    previewStore.setItem(MIRROR_KEY, raw);
  } catch (e) {
    toast('本地存储写入失败，进度可能无法保存');
  }
}
function load() {
  var raw = null, mirror = null;
  try {
    raw = previewStore.getItem(STORE_KEY);
    mirror = previewStore.getItem(MIRROR_KEY);
  } catch (e) { raw = null; }
  var parsed = null;
  [raw, mirror].forEach(function (t) {
    if (parsed || !t) return;
    try {
      var d = JSON.parse(t);
      if (d && d.subjects) parsed = d;
    } catch (e) { /* 继续尝试镜像 */ }
  });
  if (parsed) {
    DB = normalizeDB(parsed);
    reindex();
    return;
  }
  DB = seedDB();
  reindex();
  save();
}

        return {

/* ---------- 状态与统计 ---------- */
function qState(q) {

}
function chapterStat(c) {
  var mastered = 0, seen = 0, att = 0, right = 0;
  c.questions.forEach(function (q) {

    if (p && p.s) { seen++; att += p.s; right += p.r; if (p.streak >= 2) mastered++; }
  });
  return {
    total: c.questions.length, mastered: mastered, seen: seen,

  };
}

    total += st.total; seen += st.seen; mastered += st.mastered;
    c.questions.forEach(function (q) {
      var p = DB.progress[q.id];
      if (p && p.s) { att += p.s; right += p.r; }

  });
  return { total: total, seen: seen, mastered: mastered, chapters: chapters, accuracy: pct(right, att), mastery: pct(mastered, total) };
}

    var p = DB.progress[k];

}

}

}

  var n = 0, cursor = Date.now();
  if (!days[dayKey(cursor)]) cursor -= 86400000;

}

  var map = {}, out = [];
  DB.records.forEach(function (r) {
    var k = dayKey(r.t);

    map[k].n++; if (r.ok) map[k].ok++;

  for (var i = count - 1; i >= 0; i--) {

}

/* ---------- 文本编码 ---------- */

/* ---------- ZIP（docx / xlsx 都是 zip） ---------- */
async function unzip(file) {

  var dv = new DataView(buf);

  for (var i = dv.byteLength - 22; i >= Math.max(0, dv.byteLength - 66000); i--) {

  var total = dv.getUint16(eocd + 10, true);
  var cdOffset = dv.getUint32(eocd + 16, true);
  var entries = {};
  var p = cdOffset;
  for (var n = 0; n < total; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    var method = dv.getUint16(p + 10, true);
    var csize = dv.getUint32(p + 20, true);
    var nameLen = dv.getUint16(p + 28, true);
    var extraLen = dv.getUint16(p + 30, true);
    var cmtLen = dv.getUint16(p + 32, true);
    var localOff = dv.getUint32(p + 42, true);
    var name = new TextDecoder('utf-8').decode(new Uint8Array(buf, p + 46, nameLen));

}
async function readEntry(zip, name) {
  var e = zip.entries[name];
  if (!e) return null;
  var dv = new DataView(zip.buf);
  var nameLen = dv.getUint16(e.localOff + 26, true);
  var extraLen = dv.getUint16(e.localOff + 28, true);
  var start = e.localOff + 30 + nameLen + extraLen;
  var data = new Uint8Array(zip.buf, start, e.csize);
  if (e.method === 0) return new TextDecoder('utf-8').decode(data);
  var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  var out = await new Response(stream).arrayBuffer();
  return new TextDecoder('utf-8').decode(out);

/* ---------- DOCX ---------- */
function paraText(node) {

  for (var i = 0; i < nodes.length; i++) {
    var nm = nodes[i].nodeName;
    if (nm === 'w:t') out += nodes[i].textContent;
    else if (nm === 'w:br') out += '\n';
    else if (nm === 'w:tab') out += '\t';
    else if (nm === 'w:p' && out && !/\n$/.test(out)) out += '\n';

}

  var zip = await unzip(file);

  if (!xml) throw new Error('未找到正文（word/document.xml）');
  var doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('文档 XML 解析失败');
  var body = doc.getElementsByTagName('w:body')[0] || doc.documentElement;
  var lines = [], tables = [];
  var kids = body.childNodes;
  for (var i = 0; i < kids.length; i++) {
    var node = kids[i];
    if (node.nodeType !== 1) continue;
    if (node.nodeName === 'w:p') {
      lines.push(paraText(node));
    } else if (node.nodeName === 'w:tbl') {
      var trs = node.getElementsByTagName('w:tr');
      var rows = [];
      for (var r = 0; r < trs.length; r++) {
        var cells = trs[r].getElementsByTagName('w:tc');
        var arr = [];
        for (var c = 0; c < cells.length; c++) {

        }
        rows.push(arr);
      }
      if (rows.length) tables.push(rows);

/* ---------- XLSX ---------- */
function colIndex(letters) {

    var sdoc = new DOMParser().parseFromString(ss, 'application/xml');
    var sis = sdoc.getElementsByTagName('si');
    for (var i = 0; i < sis.length; i++) {
      var ts = sis[i].getElementsByTagName('t'), str = '';
      for (var j = 0; j < ts.length; j++) str += ts[j].textContent;
      shared.push(str);
    }
  }

  if (!sheetXml) {
    var names = Object.keys(zip.entries).filter(function (n) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); }).sort();
    if (!names.length) throw new Error('未找到工作表');
    sheetXml = await readEntry(zip, names[0]);
  }
  var doc = new DOMParser().parseFromString(sheetXml, 'application/xml');
  var rowsEl = doc.getElementsByTagName('row');
  var rows = [];
  for (var r = 0; r < rowsEl.length; r++) {
    var cells = rowsEl[r].getElementsByTagName('c');
    var arr = [];
    for (var c = 0; c < cells.length; c++) {
      var cell = cells[c];
      var ref = cell.getAttribute('r') || '';
      var idx = ref ? colIndex(ref.replace(/\d+/g, '')) : arr.length;
      var t = cell.getAttribute('t');
      var val = '';
      if (t === 'inlineStr') {
        var its = cell.getElementsByTagName('t');
        for (var k = 0; k < its.length; k++) val += its[k].textContent;
      } else {
        var vEl = cell.getElementsByTagName('v')[0];
        val = vEl ? vEl.textContent : '';

}

/* ---------- CSV ---------- */
function parseCSV(text) {
  var rows = [], row = [], cell = '', inQ = false, i = 0;
  while (i < text.length) {
    var ch = text.charAt(i);
    if (inQ) {
      if (ch === '"') {
        if (text.charAt(i + 1) === '"') { cell += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cell += ch; i++; continue;
    }
    if (ch === '"') { inQ = true; i++; continue; }
    if (ch === ',') { row.push(cell); cell = ''; i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += ch; i++;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(function (r) { return r.join('').trim() !== ''; });
}

/* ---------- PDF（尽力提取文字层） ---------- */
function pdfStrings(content) {
  var out = [];
  var reTj = /\(((?:\\.|[^\\()])*)\)\s*Tj/g, m;
  while ((m = reTj.exec(content))) out.push(unescPdf(m[1]));
  var reTJ = /\[((?:[^\[\]]|\\.)*)\]\s*TJ/g;
  while ((m = reTJ.exec(content))) {
    var seg = m[1], re = /\(((?:\\.|[^\\()])*)\)/g, mm, line = '';

  }

}
function unescPdf(s) {

    return ({ n: '\n', r: '', t: '\t', b: '', f: '', '(': '(', ')': ')', '\\': '\\' })[c] || c;

async function pdfExtract(file) {
  var buf = await file.arrayBuffer();
  var bytes = new Uint8Array(buf);

    var slice = bytes.subarray(start, end);
    var txt = null;
    try {
      var ds = new DecompressionStream('deflate');

    } catch (e) { txt = null; }
    if (txt && /T[Jj]/.test(txt)) chunks.push(pdfStrings(txt));
    re.lastIndex = end + 9;

  var text = chunks.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (!text) throw new Error('未能提取文字（可能是扫描件或使用了嵌入字体），请改用 docx / txt 或直接粘贴文本');
  var cjk = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  var ratio = text.length ? cjk / text.length : 0;
  return { text: text, lowConfidence: ratio < 0.05 && text.length > 40 };
}

var RE_Q = /^\s*(?:(\d{1,4})\s*[.、．]\s*|【\s*(\d{1,4})\s*】\s*|第\s*(\d{1,4})\s*题\s*[.、．:：]?\s*)(.*)$/;

function cleanLine(t) {

    .replace(/\r\n?/g, '\n')
    .replace(/\u00a0/g, ' ')
    .replace(/[\u200b\u200c\u200d]/g, '');
  var lines = text.split('\n');
  var items = [], warnings = [], chapterNames = [];
  var chapter = meta.chapterName || '';
  var subject = meta.subjectName || '';
  var sectionType = null;
  var parenSeq = 0;
  var q = null, lastTarget = 'stem';

  function startQ(rest) {
    q = { stemParts: [], options: [], ansRaw: '', analysisParts: [], chapter: chapter, subject: subject, sectionType: sectionType };
    lastTarget = 'stem';
    if (rest) consume(rest);
  }
  function addOption(key, txt) {
    key = key.toUpperCase();

      if (q.options[i].key === key) { q.options[i].text += ' ' + txt; return; }
    }

  function appendStem(t) {
    if (!t) return;

  }
  function consume(line) {
    var seg = splitInline(line);
    if (seg.ans !== null) {
      q.ansRaw = (q.ansRaw ? q.ansRaw + ' ' : '') + seg.ans;
      lastTarget = 'answer';
    }
    if (seg.analysis !== null) {
      if (seg.analysis) q.analysisParts.push(seg.analysis);

    var head = seg.head;
    if (!head) return;

    var line = cleanLine(lines[i]);

    var ms = line.match(RE_SUBJECT);

      flush();

    }
    var mh = line.match(RE_MDHEAD);
    if (mh && !RE_Q.test(line)) {

      continue;
    }
    var sec = line.match(RE_SECTION);

    }

}

/* ---------- 表格 → 题目 ---------- */
var HEAD_MAP = {
  stem: ['题干', '题目', '问题', '试题', '试题内容', '题干内容', 'question', '内容'],
  answer: ['答案', '正确答案', '参考答案', 'answer'],
  analysis: ['解析', '答案解析', '试题解析', '分析', '说明', 'answeranalysis'],
  chapter: ['章节', '所属章节', '章', '知识点', 'chapter'],
  type: ['题型', '类型', 'type'],
  source: ['来源', '年份', '出处', 'source'],
  subject: ['科目', '课程', 'subject']
};
function detectHeader(row) {
  var map = {}, hit = 0;
  row.forEach(function (cell, i) {
    var v = String(cell || '').replace(/\s/g, '').toLowerCase();
    if (!v) return;
    Object.keys(HEAD_MAP).forEach(function (k) {
      if (map[k] !== undefined) return;
      if (k === 'answer' && v.indexOf('解析') >= 0) return;
      if (HEAD_MAP[k].some(function (h) { return v === h.toLowerCase() || v.indexOf(h.toLowerCase()) === 0; })) { map[k] = i; hit++; }
    });
    var om = /^(选项)?([a-h])$/i.exec(v) || /^选项([a-h])$/i.exec(v);
    if (om) { map['opt_' + om[2].toUpperCase()] = i; hit++; }
  });
  return hit >= 2 ? map : null;
}
function parseRows(rows, opts) {
  opts = opts || {};
  var items = [], warnings = [], chapterNames = [];
  if (!rows || !rows.length) return { questions: items, chapters: chapterNames, warnings: warnings };
  var headIdx = -1, map = null;
  for (var i = 0; i < Math.min(rows.length, 6); i++) {
    var m = detectHeader(rows[i]);
    if (m) { map = m; headIdx = i; break; }
  }
  var positional = false;
  if (!map) {
    if (opts.assumeHeader && rows[0]) { map = null; headIdx = -1; positional = true; }
    else {
      positional = true;
      headIdx = -1;
      warnings.push({ stem: '', reasons: ['未识别到表头，按“题干 / 选项 A-E / 答案 / 解析”顺序尝试解析'] });
    }
  }
  for (var r = headIdx + 1; r < rows.length; r++) {
    var row = rows[r];
    if (!row || !row.join('').trim()) continue;
    var stem = '', options = [], answer = '', analysis = '', chapter = '', type = '', source = '', subject = '';
    if (map) {
      stem = row[map.stem] || '';
      chapter = map.chapter !== undefined ? row[map.chapter] || '' : '';
      type = map.type !== undefined ? row[map.type] || '' : '';
      source = map.source !== undefined ? row[map.source] || '' : '';
      subject = map.subject !== undefined ? row[map.subject] || '' : '';
      answer = map.answer !== undefined ? row[map.answer] || '' : '';
      analysis = map.analysis !== undefined ? row[map.analysis] || '' : '';
      'ABCDEFGH'.split('').forEach(function (k) {
        if (map['opt_' + k] !== undefined) options.push({ key: k, text: String(row[map['opt_' + k]] || '').trim() });
      });
    } else {
      var cells = row.map(function (c) { return String(c == null ? '' : c).trim(); });
      stem = cells[0] || '';
      var ansIdx = -1;
      for (var c = 1; c < cells.length; c++) {
        if (/^[A-H]{1,6}$/.test(cells[c])) { ansIdx = c; break; }
      }
      if (ansIdx > 1) {
        for (var j = 1; j < ansIdx; j++) {
          if (cells[j]) options.push({ key: 'ABCDEFGH'[j - 1], text: cells[j] });
        }
        answer = cells[ansIdx];
        analysis = cells.slice(ansIdx + 1).join(' ');
      } else if (ansIdx === 1) {
        answer = cells[1];
        analysis = cells.slice(2).join(' ');
      } else {
        for (var k = 1; k < cells.length; k++) {
          if (cells[k]) options.push({ key: 'ABCDEFGH'[k - 1], text: cells[k] });
        }
        answer = '';
      }
    }
    var q = {
      stemParts: [String(stem).replace(/\s*\n\s*/g, ' ')],
      options: options.filter(function (o) { return o.text; }),
      ansRaw: String(answer),
      analysisParts: analysis ? [String(analysis)] : [],
      chapter: String(chapter || opts.chapterName || ''),
      subject: String(subject || '')

    if (type) q.stemParts.unshift('【' + type + '】');
    var item = finalizeQuestion(q, warnings);
    if (item.source === '' && source) item.source = String(source);
    if (item.stem) items.push(item);
    if (item.chapterName && chapterNames.indexOf(item.chapterName) < 0) chapterNames.push(item.chapterName);
    if (!map) positional = true;
  }
  return { questions: items, chapters: chapterNames, warnings: warnings };
}

/* ---------- 文件入口 ---------- */
async function extractFile(file) {
  var name = String(file.name || 'text');
  var ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'docx') { var d = await docxExtract(file); return { text: d.text, tables: d.tables, kind: 'docx' }; }
  if (ext === 'xlsx') { return { rows: await xlsxExtract(file), kind: 'xlsx' }; }
  if (ext === 'csv') { return { rows: parseCSV(decodeBytes(await file.arrayBuffer())), kind: 'csv' }; }
  if (ext === 'pdf') { var p = await pdfExtract(file); return { text: p.text, kind: 'pdf', lowConfidence: p.lowConfidence }; }
  if (ext === 'txt' || ext === 'md' || ext === 'markdown' || ext === 'text') {
    return { text: decodeBytes(await file.arrayBuffer()), kind: ext };
  }
  if (ext === 'doc' || ext === 'xls' || ext === 'ppt') {
    throw new Error('暂不支持旧版 .' + ext + '，请另存为 .docx / .xlsx 后再导入');
  }
  throw new Error('不支持的文件类型：.' + ext);
}
async function parseFile(file) {
  var res = await extractFile(file);
  var out = { questions: [], chapters: [], warnings: [], kind: res.kind };
  if (res.rows) {
    var p1 = parseRows(res.rows, {});
    out.questions = out.questions.concat(p1.questions);
    out.chapters = out.chapters.concat(p1.chapters);
    out.warnings = out.warnings.concat(p1.warnings);
  } else {
    var p2 = parseText(res.text, { preamble: false });
    out.questions = out.questions.concat(p2.questions);
    out.chapters = out.chapters.concat(p2.chapters);
    out.warnings = out.warnings.concat(p2.warnings);
    if (res.tables && res.tables.length) {
      res.tables.forEach(function (rows) {
        if (!rows.length) return;
        var hasHead = detectHeader(rows[0]);
        var pt = parseRows(rows, { assumeHeader: !!hasHead });
        if (pt.questions.length) {
          out.questions = out.questions.concat(pt.questions);
          out.chapters = out.chapters.concat(pt.chapters);
        }
      });
    }
    if (res.lowConfidence) {
      out.warnings.push({ stem: '', reasons: ['PDF 提取到的文字比例偏低，可能是扫描件或特殊字体，建议核对后导入'] });
    }
  }
  return out;
}

function filteredQuestions() {
  var sub = currentSubject();
  if (!sub) return [];
  var searching = S.query.trim().length > 0;
  var ch = !searching && S.chapterId ? getChapter(sub, S.chapterId) : null;
  var list = [];
  (ch ? [ch] : sub.chapters).forEach(function (c) {
    c.questions.forEach(function (q) { list.push({ q: q, ch: c }); });
  });
  if (S.typeFilter !== 'all') list = list.filter(function (x) { return x.q.type === S.typeFilter; });
  if (S.favOnly) list = list.filter(function (x) { return DB.fav.indexOf(x.q.id) >= 0; });
  var kw = S.query.trim().toLowerCase();
  if (kw) {
    list = list.filter(function (x) {
      var q = x.q;
      var hay = q.stem + ' ' + q.options.map(function (o) { return o.text; }).join(' ') + ' ' + q.analysis;
      return hay.toLowerCase().indexOf(kw) >= 0;
    });
  }
  return list;
}
function bankListHTML() {
  var sub = currentSubject();
  var ch = S.chapterId ? getChapter(sub, S.chapterId) : null;
  var kw = S.query.trim();

  if (kw || S.typeFilter !== 'all' || S.favOnly) {
    var list = filteredQuestions();
    if (!list.length) return emptyBox(S.favOnly ? '还没有收藏题目' : '没有匹配的题目', S.favOnly ? '练习时点右上角“☆ 收藏”，题目就会出现在这里。' : '换个关键词试试，或把题型筛选切回“全部题型”。', '');

    list.forEach(function (x, i) { h += qRowHTML(x.q, x.ch, i + 1, !ch || !!kw); });

      '<div class="bar"><i style="width:' + s2.mastery + '%"></i></div></div>' +

/* ---------- 统计 ---------- */
function viewStats() {
  var ov = overallStat();
  var t = todayStat();
  var series = dailySeries(14);
  var maxN = Math.max.apply(null, series.map(function (s) { return s.n; }).concat([1]));
  var total14 = series.reduce(function (a, s) { return a + s.n; }, 0);
  var ok14 = series.reduce(function (a, s) { return a + s.ok; }, 0);
  var ts = typeStats();
  var weak = weakChapters(6);

  var html = '<div class="sec" style="margin-top:0"><div class="sec-title">学习概览</div><div class="kpis">' +
    '<div class="kpi"><b class="mono">' + ov.total + '</b><i>题库总题量</i></div>' +
    '<div class="kpi"><b class="mono">' + ov.seen + '</b><i>已练习题</i></div>' +
    '<div class="kpi"><b class="mono">' + (ov.attempts ? ov.accuracy + '%' : '—') + '</b><i>累计正确率</i></div>' +
    '<div class="kpi"><b class="mono">' + ov.mastery + '%</b><i>掌握度</i></div>' +
    '<div class="kpi"><b class="mono">' + streakDays() + '</b><i>连续天数</i></div>' +
    '<div class="kpi"><b class="mono">' + studyMinutesLabel() + '</b><i>累计分钟</i></div>' +
    '</div><div class="hint" style="margin:8px 2px 0">掌握度 = 连续答对 2 次的题目占比；答错后重新计。</div></div>';

  html += '<div class="sec"><div class="sec-title">近 14 天做题量<span class="more">' + total14 + ' 题 · 正确率 ' + (total14 ? Math.round(ok14 / total14 * 100) + '%' : '—') + '</span></div>' +
    '<div class="chart"><div class="legend"><span><i class="dot" style="background:var(--ok)"></i>正确率 ≥ 80%</span>' +
    '<span><i class="dot" style="background:var(--gold)"></i>60%–79%</span><span><i class="dot" style="background:var(--bad)"></i>&lt; 60%</span></div>' +
    '<div class="trend">';
  var lastShown = -9;
  series.forEach(function (s, i) {
    var h = s.n ? Math.max(4, Math.round(s.n / maxN * 100)) : 2;
    var cls = !s.n ? '' : s.acc >= 80 ? 'hi' : s.acc >= 60 ? 'mid' : 'low';
    var showLabel = (i % 3 === 0) || (i === series.length - 1);
    if (showLabel && i - lastShown < 2) showLabel = false;
    if (showLabel) lastShown = i;
    html += '<div class="tcol" title="' + s.key + '：' + s.n + ' 题，正确率 ' + (s.n ? s.acc + '%' : '—') + '">' +
      '<div class="tbar"><i class="' + cls + '" style="height:' + h + '%"></i></div>' +
      '<em>' + (showLabel ? s.label : '') + '</em></div>';
  });
  html += '</div></div></div>';

  html += '<div class="sec"><div class="sec-title">题型正确率</div><div class="chart">';
  [['single', '单选题'], ['multi', '多选题'], ['judge', '判断题']].forEach(function (p) {
    var m = ts[p[0]] || { n: 0, ok: 0 };
    var a = m.n ? Math.round(m.ok / m.n * 100) : 0;
    html += '<div class="mbar"><span class="name">' + p[1] + '<span class="muted small">（' + m.n + ' 次）</span></span>' +
      '<span class="track"><i class="' + (a >= 80 ? 'ok' : '') + '" style="width:' + a + '%;background:' + (m.n ? (a >= 80 ? 'var(--ok)' : a >= 60 ? 'var(--gold)' : 'var(--bad)') : 'var(--line)') + '"></i></span>' +
      '<span class="val">' + (m.n ? a + '%' : '—') + '</span></div>';
  });
  html += '</div></div>';

  html += '<div class="sec"><div class="sec-title">章节掌握度<span class="more">偏低优先</span></div><div class="chart">';
  if (!weak.length) {
    html += '<div class="small muted" style="padding:12px 2px">还没有练习记录，做几道题后这里会显示各章节掌握情况。</div>';
  } else {
    weak.forEach(function (x) {
      html += '<div class="mbar"><span class="name" title="' + escapeHtml(x.ch.name) + '">' + escapeHtml(x.ch.name.replace(/^第[一二三四五六七八九十百零〇\d]+章\s*/, '')) + '</span>' +
        '<span class="track"><i style="width:' + x.st.mastery + '%;background:' + (x.st.mastery >= 80 ? 'var(--ok)' : x.st.mastery >= 40 ? 'var(--gold)' : 'var(--bad)') + '"></i></span>' +
        '<span class="val">' + x.st.mastery + '%</span></div>';
    });
  }
  html += '</div></div>';

  if (weak.length) {
    html += '<div class="sec"><div class="sec-title">建议先补这几块</div><div class="list">';
    weak.slice(0, 3).forEach(function (x) {
      html += '<button class="li" data-act="practice-chapter" data-id="' + x.ch.id + '" data-sub="' + x.sub.id + '">' +
        '<div class="grow"><b>' + escapeHtml(x.ch.name) + '</b><small>' + escapeHtml(x.sub.name) + ' · ' + x.st.total + ' 题 · 掌握 ' + x.st.mastery + '%</small></div>' +
        '<span class="right">去练习 ›</span></button>';
    });
    html += '</div></div>';
  }
  return html;
}

   交互层：路由、答题引擎、导入落地、数据管理

var quizTimer = null;
var autoNextTimer = null;

/* ---------- 渲染 ---------- */
function render() {

  else if (S.view === 'report') setHTML(app, viewReport());
  else if (S.view === 'bank') setHTML(app, viewBank());
  else if (S.view === 'import') setHTML(app, viewImport());
  else if (S.view === 'stats') setHTML(app, viewStats());
  else if (S.view === 'me') setHTML(app, viewMe());
  else setHTML(app, viewHome());
  updateTabs();
  if (!immersive) window.scrollTo(0, 0);
}
function renderQuiz(keepScroll) {
  var old = document.querySelector('.quiz-body');
  var st = old ? old.scrollTop : 0;
  setHTML($('#app'), viewQuiz());
  var nb = document.querySelector('.quiz-body');
  if (keepScroll && nb) nb.scrollTop = st;
  else if (nb) nb.scrollTop = 0;
  updateTabs();
}
function updateTabs() {
  var act = { home: 'home', bank: 'bank', import: 'import', stats: 'stats', me: 'me' }[S.view] || '';
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    var on = tabs[i].getAttribute('data-tab') === act;
    tabs[i].classList.toggle('on', on);
    tabs[i].setAttribute('aria-current', on ? 'page' : 'false');
  }
}
function go(view) { S.view = view; render(); }

/* ---------- 计时 ---------- */
function startTimer() {
  stopTimer();
  quizTimer = setInterval(tick, 1000);
}
function stopTimer() { if (quizTimer) { clearInterval(quizTimer); quizTimer = null; } }
function tick() {
  var qz = S.quiz;
  if (!qz || S.view !== 'quiz') return;
  qz.elapsed = Math.floor((Date.now() - qz.startTs) / 1000);
  if (qz.exam) {
    qz.remain = Math.max(0, qz.limitSec - qz.elapsed);
    if (qz.remain <= 0) { finishQuiz(true); return; }
  } else {
    qz.remain = qz.elapsed;
  }
  var el = document.querySelector('.quiz-head .mid small');
  if (el) {
    if (qz.exam) el.textContent = fmtClock(qz.remain) + ' 后自动交卷';
    else {
      var doneN = Object.keys(qz.done).length;
      var okN = Object.keys(qz.done).filter(function (k) { return qz.done[k]; }).length;
      el.textContent = '已答 ' + doneN + ' · 正确 ' + okN;
    }
  }
}

/* ---------- 组卷 ---------- */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function queuePool(mode, opts) {
  opts = opts || {};
  var sub = opts.subjectId ? getSubject(opts.subjectId) : currentSubject();
  var ch = opts.chapterId && sub ? getChapter(sub, opts.chapterId) : null;
  var pool = [];
  if (mode === 'wrong') {
    Object.keys(DB.wrong).forEach(function (k) { if (QI[k]) pool.push(QI[k].q); });
  } else if (sub) {
    (ch ? [ch] : sub.chapters).forEach(function (c) {
      c.questions.forEach(function (q) { pool.push(q); });
    });
  }
  return pool.filter(function (q) { return q.answer && q.answer.length; });
}
function buildQueue(mode, opts) {
  var pool = queuePool(mode, opts);
  if (mode === 'random' || mode === 'wrong') pool = shuffle(pool);
  if (mode === 'exam') {
    var n = Math.min(opts.count || DB.settings.examCount, pool.length);
    return shuffle(pool).slice(0, n);
  }
  if (mode === 'order' || mode === 'chapter') {
    var start = 0;
    for (var i = 0; i < pool.length; i++) { if (qState(pool[i]) !== 'mastered') { start = i; break; } }
    if (start > 0) pool = pool.slice(start).concat(pool.slice(0, start));
  }
  return pool;
}
function startQuiz(mode, opts) {
  opts = opts || {};
  var list = buildQueue(mode, opts);
  if (!list.length) {
    toast(QI && mode === 'wrong' ? '错题本还是空的，先去练习吧' : '当前范围没有可练习的题目');
    return;
  }
  S.quiz = {
    mode: mode,
    list: list,
    idx: 0,
    sel: {},
    done: {},
    startTs: Date.now(),
    elapsed: 0,
    remain: mode === 'exam' ? (opts.minutes || DB.settings.examMin) * 60 : 0,
    limitSec: mode === 'exam' ? (opts.minutes || DB.settings.examMin) * 60 : 0,
    exam: mode === 'exam',
    subjectId: opts.subjectId || S.subjectId,
    chapterId: opts.chapterId || S.chapterId,
    qStart: Date.now()
  };
  S.report = null;
  S.view = 'quiz';
  render();
  startTimer();
}

/* ---------- 答题 ---------- */
function currentQ() {
  var qz = S.quiz;
  if (!qz) return null;
  return qz.list[qz.idx] || null;
}
function isAnswered(qz, qid) {
  return Object.prototype.hasOwnProperty.call(qz.done, qid);
}
function pickOpt(key) {
  var qz = S.quiz;
  var q = currentQ();
  if (!qz || !q) return;
  if (!qz.exam && isAnswered(qz, q.id)) return;
  var arr = qz.sel[q.id] ? qz.sel[q.id].slice() : [];
  if (q.type === 'multi') {
    var i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else arr.push(key);
    qz.sel[q.id] = arr;
    renderQuiz(true);
    return;
  }
  qz.sel[q.id] = [key];
  if (qz.exam) { renderQuiz(true); return; }
  submitAnswer();
}
function submitAnswer() {
  var qz = S.quiz;
  var q = currentQ();
  if (!qz || !q) return;
  if (isAnswered(qz, q.id)) return;
  var keys = qz.sel[q.id] || [];
  if (!keys.length) { toast('请先选择答案'); return; }
  var ok = sameAnswer(q, keys);
  qz.done[q.id] = ok;
  qz.sel[q.id] = keys.slice();
  recordAnswer(q, keys, ok, qz.mode, Date.now() - (qz.qStart || Date.now()));
  qz.qStart = Date.now();
  renderQuiz(true);
  clearTimeout(autoNextTimer);
  if (ok && DB.settings.autoNext) {
    autoNextTimer = setTimeout(function () {
      if (S.quiz === qz && S.view === 'quiz' && qz.done[q.id]) nextQuestion();
    }, 800);
  }
}
function nextQuestion() {
  var qz = S.quiz;
  if (!qz) return;
  if (qz.idx < qz.list.length - 1) {
    qz.idx++;
    qz.qStart = Date.now();
    renderQuiz(false);
    return;
  }
  finishQuiz(false);
}
function prevQuestion() {
  var qz = S.quiz;
  if (!qz || qz.idx === 0) return;
  qz.idx--;
  qz.qStart = Date.now();
  renderQuiz(false);
}
function finishQuiz(auto) {
  var qz = S.quiz;
  if (!qz) return;
  clearTimeout(autoNextTimer);
  stopTimer();
  var items = [], byChapter = {}, wrongIds = [];
  var correct = 0, blank = 0, answered = 0;

  qz.list.forEach(function (q) {
    var keys = qz.sel[q.id] || [];
    var has = keys.length > 0;
    var ok;
    if (qz.exam) {
      ok = has && sameAnswer(q, keys);
      if (has) answered++;
      if (!has) blank++;
    } else {
      ok = !!qz.done[q.id];
      if (has) answered++;
      if (!has) blank++;
    }
    if (ok) correct++;
    if (!ok && has) wrongIds.push(q.id);
    if (has || qz.exam) items.push({ q: q, keys: keys, ok: ok });

    var e = QI[q.id];
    if (e && e.ch && has) {
      var k = e.ch.id;
      if (!byChapter[k]) byChapter[k] = { name: e.ch.name, total: 0, correct: 0 };
      byChapter[k].total++;
      if (ok) byChapter[k].correct++;
    }
  });

  var total = qz.exam ? qz.list.length : answered;
  var used = qz.exam ? Math.min(qz.elapsed, qz.limitSec) : qz.elapsed;
  if (qz.exam) {
    var per = answered ? Math.round(used * 1000 / answered) : 0;
    items.forEach(function (it) {
      if (it.keys.length) recordAnswer(it.q, it.keys, it.ok, 'exam', per);
    });
  }
  var byList = Object.keys(byChapter).map(function (k) { return byChapter[k]; }).sort(function (a, b) {
    return (a.correct / a.total) - (b.correct / b.total);
  });

  DB.sessions.push({ at: Date.now(), mode: qz.mode, total: total, correct: correct, used: used });
  if (DB.sessions.length > 300) DB.sessions.splice(0, DB.sessions.length - 300);
  save();

  S.report = {
    title: qz.exam ? '模拟考试' : (qz.mode === 'wrong' ? '错题重做' : '练习小结'),
    mode: qz.mode,
    total: total,
    correct: correct,
    blank: qz.exam ? blank : 0,
    used: used,
    items: items,
    byChapter: byList,
    wrongIds: wrongIds
  };
  S.quiz = null;
  S.view = 'report';
  render();
}

/* ---------- 导入 ---------- */
async function handleFiles(files) {
  if (!files || !files.length) return;
  var draft = {
    fileName: '',
    questions: [],
    warnings: [],
    dupCount: 0,
    targetSubjectId: S.subjectId || (DB.subjects[0] ? DB.subjects[0].id : '__new'),
    newSubjectName: '',
    dupMode: 'skip',
    kindLabel: ''
  };
  var names = [], kinds = [], errors = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      var res = await parseFile(f);
      names.push(f.name);
      kinds.push(res.kind ? res.kind.toUpperCase() : '');
      draft.questions = draft.questions.concat(res.questions);
      draft.warnings = draft.warnings.concat(res.warnings);
    } catch (err) {
      errors.push({ stem: f.name, reasons: [String(err && err.message ? err.message : err)] });
    }
  }
  draft.warnings = errors.concat(draft.warnings);
  draft.fileName = names.join('、') || '粘贴内容';
  draft.kindLabel = kinds.filter(function (v, i, a) { return v && a.indexOf(v) === i; }).join(' / ');
  if (!draft.questions.length) {
    S.draft = null;
    S.view = 'import';
    render();
    openSheet('<div class="sheet-x" data-act="sheet-close">✕</div><h3>没能识别出题目</h3>' +
      '<p class="sub">' + (draft.warnings.length ? escapeHtml(draft.warnings[0].reasons.join('；')) : '文档里没有找到符合规则的题目。') + '</p>' +
      '<div class="rule">· 确认题干以 <code>1.</code> / <code>1、</code> 开头<br>· 确认答案行写作 <code>答案：A</code><br>· 也可以直接把文字粘贴到导入页的文本框</div>' +
      '<div class="acts"><button class="btn primary" data-act="sheet-close">知道了</button></div>');
    return;
  }
  dedupeBatch(draft);
  S.draft = draft;
  S.showAllPreview = false;
  S.view = 'import';
  render();
  recalcDup();
}
function dedupeBatch(draft) {
  var seen = {};
  var dups = 0;
  draft.questions.forEach(function (q) {
    var k = normStemKey(q.stem);
    if (k && seen[k]) { q.batchDup = true; dups++; }
    else seen[k] = 1;
  });
  draft.dupCount = dups;
}
function recalcDup() {
  var d = S.draft;
  if (!d) return;
  var targetId = d.targetSubjectId;
  if (targetId === '__new') { render(); return; }
  var sub = getSubject(targetId);
  if (!sub) return;
  var exist = {};
  sub.chapters.forEach(function (c) {
    c.questions.forEach(function (q) { exist[normStemKey(q.stem)] = 1; });
  });
  var n = d.questions.filter(function (q) { return q.batchDup || exist[normStemKey(q.stem)]; }).length;
  d.dupCount = n;
  render();
}
function applyImport() {
  var d = S.draft;
  if (!d || !d.questions.length) return;
  if ($('#newSubjectInput')) d.newSubjectName = $('#newSubjectInput').value;
  var sub;
  if (d.targetSubjectId === '__new') {
    var name = (d.newSubjectName || '').trim();
    if (!name) { toast('请填写新科目名称'); return; }
    sub = { id: uid('s_'), name: name, code: name.slice(0, 2), color: '#2a4a6b', desc: '', chapters: [] };
    DB.subjects.push(sub);
  } else {
    sub = getSubject(d.targetSubjectId);
  }
  if (!sub) { toast('请选择导入的目标科目'); return; }

  var chMap = {};
  sub.chapters.forEach(function (c) { chMap[normStemKey(c.name)] = c; });
  var existQ = {};
  sub.chapters.forEach(function (c) {
    c.questions.forEach(function (q) { existQ[normStemKey(q.stem)] = q; });
  });

  var created = 0, skipped = 0, updated = 0, newCh = 0;
  d.questions.forEach(function (item) {
    if (!item.stem) return;
    var key = normStemKey(item.stem);
    var chName = (item.chapterName || '导入题目').trim() || '导入题目';
    var ch = chMap[normStemKey(chName)];
    if (!ch) {
      ch = { id: uid('c_'), name: chName, questions: [] };
      sub.chapters.push(ch);
      chMap[normStemKey(chName)] = ch;
      newCh++;
    }
    var dup = existQ[key];
    if (dup || item.batchDup) {
      if (d.dupMode === 'update' && dup) {
        dup.type = item.type;
        dup.options = item.options.map(function (o) { return { key: o.key, text: o.text }; });
        dup.answer = item.answer.slice();
        dup.analysis = item.analysis || '';
        dup.source = item.source || dup.source;
        updated++;
      } else skipped++;
      return;
    }
    var nq = {
      id: uid('q_'),
      type: item.type,
      stem: item.stem,
      options: item.options.map(function (o) { return { key: o.key, text: o.text }; }),
      answer: item.answer.slice(),
      analysis: item.analysis || '',
      source: item.source || '',
      demo: false,
      createdAt: Date.now()
    };
    ch.questions.push(nq);
    existQ[key] = nq;
    created++;
  });

  DB.imports.push({ file: d.fileName, at: Date.now(), added: created, skipped: skipped, updated: updated });
  if (DB.imports.length > 60) DB.imports.splice(0, DB.imports.length - 60);
  reindex();
  save();
  S.subjectId = sub.id;
  S.chapterId = null;
  S.query = '';
  S.typeFilter = 'all';
  S.draft = null;
  S.view = 'bank';
  render();
  openSheet('<div class="sheet-x" data-act="sheet-close">✕</div><h3>导入完成</h3>' +
    '<p class="sub">' + escapeHtml(d.fileName) + '</p>' +
    '<div class="kpis">' +
    '<div class="kpi"><b class="mono">' + created + '</b><i>新增题目</i></div>' +
    '<div class="kpi"><b class="mono">' + skipped + '</b><i>重复跳过</i></div>' +
    '<div class="kpi"><b class="mono">' + updated + '</b><i>覆盖更新</i></div>' +
    '<div class="kpi"><b class="mono">' + newCh + '</b><i>新建章节</i></div>' +
    '</div>' +
    '<div class="hint">题目已归入「' + escapeHtml(sub.name) + '」。缺答案的题目会标记为待补全，不进入练习。</div>' +
    '<div class="acts"><button class="btn" data-act="sheet-close">留在题库</button>' +
    '<button class="btn primary" data-act="sheet-close-and-practice">开始练习</button></div>');
}

function parseOptionsText(text) {
  var lines = String(text || '').split('\n');
  var out = [], auto = 0;
  lines.forEach(function (line) {
    var t = line.replace(/^\s+|\s+$/g, '');
    if (!t) return;
    var m = t.match(RE_OPT);
    if (m) out.push({ key: m[1].toUpperCase(), text: m[2].trim() });
    else out.push({ key: 'ABCDEFGH'[auto] || 'X', text: t });
    auto++;
  });
  return out;
}
function saveEditor(qid) {
  var stem = ($('#edStem') || {}).value || '';
  stem = stem.trim();
  if (stem.length < 2) { toast('题干不能为空'); return; }
  var opts = parseOptionsText(($('#edOptions') || {}).value || '');
  var answerRaw = (($('#edAnswer') || {}).value || '').trim();
  var analysis = (($('#edAnalysis') || {}).value || '').trim();
  var source = (($('#edSource') || {}).value || '').trim();
  var type = ($('#edType') || {}).value || 'single';
  var chId = ($('#edChapter') || {}).value;

  var warnings = [];
  var item = finalizeQuestion({
    stemParts: [stem],
    options: opts,
    ansRaw: answerRaw,
    analysisParts: analysis ? [analysis] : [],
    chapter: ''
  }, warnings);
  if (!item.answer.length) { toast('答案格式不对：单选填 A，多选填 ABC，判断填 A 或 B'); return; }
  if (item.options.length < 2) { toast('至少需要两个选项'); return; }

  item.type = type;
  if (type === 'judge' && item.options.length !== 2) {
    toast('判断题需要两个选项（正确 / 错误）');
    return;
  }

  var sub = currentSubject();
  var target = getChapter(sub, chId) || sub.chapters[0];
  if (!target) { toast('请先创建章节'); return; }

  if (qid) {
    var e = QI[qid];
    if (!e) return;
    var q = e.q;
    q.type = item.type;
    q.stem = item.stem;
    q.options = item.options;
    q.answer = item.answer;
    q.analysis = analysis;
    q.source = source;
    if (e.ch.id !== target.id) {
      var idx = e.ch.questions.indexOf(q);
      if (idx >= 0) e.ch.questions.splice(idx, 1);
      target.questions.push(q);
    }
  } else {
    target.questions.push({
      id: uid('q_'), type: item.type, stem: item.stem, options: item.options,
      answer: item.answer, analysis: analysis, source: source, demo: false, createdAt: Date.now()
    });
  }
  reindex();
  save();
  closeSheet();
  render();
  toast(qid ? '已保存' : '已新增题目');
}
function deleteQuestion(qid) {
  var e = QI[qid];
  if (!e) return;
  askConfirm('删除这道题？', '题目会从题库中移除，相关的作答记录也会一并清除，此操作不可恢复。', '删除', function () {
    var idx = e.ch.questions.indexOf(e.q);

    var fi = DB.fav.indexOf(qid);
    if (fi >= 0) DB.fav.splice(fi, 1);
    reindex();
    save();
    closeSheet();
    render();
    toast('已删除');
  }, true);
}
