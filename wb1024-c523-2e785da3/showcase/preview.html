<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* ═══════════════════════════════════════════
   一念之间 · 宣纸手账
   ═══════════════════════════════════════════ */
:root{
  --paper:#FAF5EB;
  --paper2:#F2E9D8;
  --ink:#1A1A1A;
  --ink2:#5E564B;
  --ink3:#9C9384;
  --red:#C53A2A;
  --line:#DCD1BB;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);
  font-size:16px;line-height:1.8;
  min-height:100dvh;
  display:flex;justify-content:center;
  padding:clamp(22px,6vw,52px) clamp(20px,5vw,36px) 48px;
  overflow-x:hidden;
}
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(circle at 18% 8%,rgba(197,58,42,.045),transparent 42%),
    radial-gradient(circle at 82% 78%,rgba(26,26,26,.038),transparent 48%);
}
#app{position:relative;z-index:1;width:100%;max-width:560px}

/* ── 场景切换 ── */
.scene{display:none;animation:fade .42s ease both}
.scene.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── 品牌 ── */
.brand{margin-bottom:clamp(30px,7vh,58px)}
.brand h1{
  margin:0;font-size:clamp(38px,10vw,52px);font-weight:700;
  letter-spacing:.18em;line-height:1.2;
}
.brand h1 span{color:var(--red)}
.tagline{margin:14px 0 0;font-size:14.5px;color:var(--ink3);letter-spacing:.18em}

/* ── 入口 ── */
.lead{margin:0 0 34px;font-size:17px;color:var(--ink2)}
.lead p{margin:0 0 4px}
.field-label{
  display:block;font-size:13px;letter-spacing:.24em;color:var(--ink3);
  margin-bottom:12px;
}
.seed{
  width:100%;padding:18px 20px;border-radius:2px;
  border:1px solid var(--line);background:var(--paper2);
  font-family:var(--serif);font-size:17px;line-height:1.95;color:var(--ink);
  resize:vertical;min-height:110px;outline:none;
  transition:border-color .2s,background .2s;
}
.seed:focus{border-color:var(--red);background:#FBF7EF}
.seed::placeholder{color:var(--ink3);opacity:.75}

/* ── 按钮 ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:15px 30px;border-radius:2px;border:1px solid transparent;
  font-family:var(--serif);font-size:16px;letter-spacing:.16em;
  cursor:pointer;transition:.2s;text-decoration:none;
}
.btn.primary{width:100%;margin-top:26px;background:var(--ink);color:var(--paper)}
.btn.primary:hover:not(:disabled){background:#000}
.btn.primary:disabled{background:#CFC5B4;color:#F5EFE3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink2);color:var(--ink)}
.link{
  background:none;border:none;padding:6px 0;cursor:pointer;
  font-family:var(--serif);font-size:14px;color:var(--ink3);
  letter-spacing:.1em;transition:color .2s;
}
.link:hover{color:var(--red)}
.foot-nav{display:flex;gap:26px;justify-content:center;margin-top:40px;flex-wrap:wrap}

/* ── 五关 ── */
.progress{display:flex;gap:9px;margin-bottom:clamp(30px,6vh,52px)}
.progress i{
  width:26px;height:2px;background:var(--line);transition:background .3s;
}
.progress i.on{background:var(--red)}
.progress i.done{background:var(--ink2)}

.gate-idx{font-size:12.5px;letter-spacing:.34em;color:var(--red);margin-bottom:10px}
.gate-name{font-size:26px;font-weight:700;letter-spacing:.3em;margin-bottom:clamp(24px,5vh,40px)}
.gate-q{font-size:clamp(22px,5.6vw,27px);line-height:1.62;font-weight:700;margin:0 0 12px}
.gate-hint{font-size:14.5px;color:var(--ink3);margin:0 0 30px;line-height:1.9}

.gate-body{min-height:180px}
.gate-actions{display:flex;align-items:center;justify-content:space-between;margin-top:34px;gap:16px}
.gate-actions .btn.primary{width:auto;margin-top:0;min-width:126px}

/* 单行输入 */
.inp{
  width:100%;padding:15px 18px;border-radius:2px;
  border:1px solid var(--line);background:var(--paper2);
  font-family:var(--serif);font-size:16.5px;line-height:1.9;color:var(--ink);
  outline:none;transition:.2s;resize:vertical;
}
.inp:focus{border-color:var(--red);background:#FBF7EF}

/* 选项卡 */
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;align-items:flex-start;gap:13px;
  padding:15px 18px;border:1px solid var(--line);background:transparent;
  border-radius:2px;cursor:pointer;transition:.18s;text-align:left;
  font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--ink);
}
.opt:hover{border-color:var(--ink3);background:rgba(242,233,216,.5)}
.opt.sel{border-color:var(--red);background:rgba(197,58,42,.055);color:var(--red)}
.opt .dot{
  flex:0 0 9px;height:9px;margin-top:9px;border-radius:50%;
  border:1px solid var(--ink3);transition:.18s;
}
.opt.sel .dot{background:var(--red);border-color:var(--red)}

/* 拆两半 */
.split{display:grid;gap:18px}
.split-cell{border:1px solid var(--line);border-radius:2px;padding:16px 18px;background:rgba(242,233,216,.4)}
.split-cell h4{
  margin:0 0 10px;font-size:13px;letter-spacing:.22em;font-weight:400;
  color:var(--ink3);
}
.split-cell h4 b{color:var(--red);font-weight:400}
.split-cell .v{font-size:16px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.split-cell textarea{
  width:100%;border:none;background:transparent;outline:none;resize:vertical;
  font-family:var(--serif);font-size:16px;line-height:1.85;color:var(--ink);
  min-height:56px;padding:0;
}
.split-cell textarea::placeholder{color:var(--ink3);opacity:.7}

/* 圈选（能动的事） */
.picks{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pick{
  padding:9px 16px;border:1px solid var(--line);border-radius:999px;
  background:transparent;cursor:pointer;font-family:var(--serif);
  font-size:14.5px;color:var(--ink2);transition:.18s;
}
.pick:hover{border-color:var(--ink3)}
.pick.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ── 一念卡 ── */
.card-wrap{display:flex;justify-content:center;margin:6px 0 30px}
.yinian-card{
  position:relative;width:100%;padding:38px 32px 46px;
  background:#FBF7EE;border:1px solid var(--line);border-radius:2px;
  box-shadow:0 18px 48px -28px rgba(60,40,20,.42),inset 0 0 0 8px #FBF7EE,inset 0 0 0 9px rgba(220,209,187,.55);
}
.card-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
.card-title{font-size:15px;letter-spacing:.4em;color:var(--red)}
.card-date{font-size:12px;letter-spacing:.16em;color:var(--ink3)}
.card-rows{display:flex;flex-direction:column;gap:19px}
.crow{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:start}
.crow .k{
  font-size:12px;letter-spacing:.14em;color:var(--ink3);padding-top:5px;
}
.crow .v{font-size:16px;line-height:1.85;color:var(--ink);word-break:break-word}
.crow.key .v{font-weight:700;font-size:17px}
.card-seal{
  position:absolute;right:24px;bottom:22px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:var(--red);color:#fff;font-size:15px;border-radius:2px;opacity:.92;
}
.card-actions{display:flex;gap:12px}
.card-actions .btn{flex:1;margin-top:0}
.sentence{margin:32px 0 0;text-align:center}
.sentence p{
  margin:0;font-size:16.5px;line-height:2;color:var(--ink2);letter-spacing:.04em;
}

/* ── 众生相 ── */
.crowd-kicker{font-size:12.5px;letter-spacing:.3em;color:var(--red);margin-bottom:16px}
.crowd-q{font-size:clamp(23px,5.8vw,29px);line-height:1.6;font-weight:700;margin:0 0 clamp(28px,5vh,42px)}
.crowd-options{display:flex;flex-direction:column;gap:11px}
.crowd-result{margin-top:34px;animation:fade .45s ease both}
.crowd-total{
  font-size:13px;letter-spacing:.14em;color:var(--ink3);
  margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);
}
.crowd-total b{color:var(--red);font-weight:700;font-size:17px;letter-spacing:0}
.bar-row{margin-bottom:18px}
.bar-label{display:flex;justify-content:space-between;font-size:15px;margin-bottom:7px;gap:14px}
.bar-label .pct{color:var(--ink3);font-size:13.5px;white-space:nowrap}
.bar-track{height:5px;background:var(--paper2);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--ink3);border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1);width:0}
.bar-row.mine .bar-label{color:var(--red);font-weight:700}
.bar-row.mine .bar-fill{background:var(--red)}
.crowd-note{margin:26px 0 0;font-size:13.5px;color:var(--ink3);line-height:1.95;letter-spacing:.03em}

/* ── 七日心迹 ── */
.arch-head{margin-bottom:34px}
.arch-head h2{margin:0 0 8px;font-size:26px;letter-spacing:.2em;font-weight:700}
.arch-sub{margin:0;font-size:13.5px;color:var(--ink3)}
.arch-list{display:flex;flex-direction:column;gap:16px}
.arch-item{
  padding:18px 20px;border:1px solid var(--line);border-radius:2px;
  background:rgba(242,233,216,.34);
}
.arch-item .d{font-size:12px;letter-spacing:.18em;color:var(--red);margin-bottom:8px}
.arch-item .t{font-size:15.5px;line-height:1.8;color:var(--ink)}
.arch-item .a{margin-top:10px;font-size:14px;line-height:1.8;color:var(--ink2)}
.arch-item .a::before{content:"明天 · ";color:var(--ink3)}
.arch-empty{text-align:center;color:var(--ink3);font-size:14.5px;padding:50px 0;line-height:2}

/* ── 壁纸弹层 ── */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(26,26,26,.72);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet-inner{max-width:340px;width:100%;text-align:center}
.sheet-inner img{width:100%;border-radius:3px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);display:block}
.sheet-tip{color:#E8DFCE;font-size:12.5px;letter-spacing:.1em;margin:16px 0 18px}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1;margin-top:0;font-size:15px;padding:13px 16px}
.sheet-actions .btn.ghost{color:#E8DFCE;border-color:rgba(232,223,206,.4)}

.toast{
  position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(20px);
  background:rgba(26,26,26,.92);color:#F5EFE3;padding:11px 22px;border-radius:2px;
  font-size:14px;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:.28s;z-index:80;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:400px){
  .crow{grid-template-columns:54px 1fr;gap:10px}
  .yinian-card{padding:30px 22px 42px}
}

/* ── 关于 ── */
.about-card{
  max-width:480px;width:100%;background:var(--paper);
  padding:34px 30px 28px;border-radius:3px;border:1px solid var(--line);
  box-shadow:0 28px 70px -24px rgba(0,0,0,.55);
}
.about-card h3{margin:0 0 18px;font-size:20px;letter-spacing:.22em;font-weight:700}
.about-body p{margin:0 0 13px;font-size:15px;line-height:2;color:var(--ink2)}
.about-body p:last-child{margin-bottom:22px}
.about-card .btn.primary{width:100%;margin-top:6px}

/* ── 共鸣句 ── */
.echo{
  font-size:15px;line-height:1.95;color:var(--ink2);
  padding:16px 20px;margin:0 0 24px;
  border-left:2px solid var(--red);
  background:rgba(197,58,42,.045);
  text-align:left;letter-spacing:.03em;
  animation:fade .5s ease both;
}

/* ═══════════════════════════════════════════
   夜纸 · 深夜用
   内耗多半发生在夜里，米色纸在暗处刺眼。
   壁纸仍出宣纸版——那是拿去看和存的，不是盯着读的。
   ═══════════════════════════════════════════ */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15130F;
    --paper2:#201C16;
    --ink:#EDE6D8;
    --ink2:#B3A897;
    --ink3:#857B6D;
    --red:#D9563F;
    --line:#322B22;
  }
  body{
    background-image:
      radial-gradient(circle at 20% 8%,rgba(217,86,63,.07),transparent 46%),
      radial-gradient(circle at 80% 78%,rgba(237,230,216,.035),transparent 50%);
  }
  .grain{opacity:.85}
  .seed,.inp{background:var(--paper2);color:var(--ink)}
  .seed:focus,.inp:focus{background:#262119}
  .split-cell{background:rgba(32,28,22,.72)}
  .arch-item{background:rgba(32,28,22,.6)}
  .yinian-card{
    background:#1B1712;
    box-shadow:0 18px 48px -26px rgba(0,0,0,.85),
               inset 0 0 0 8px #1B1712,
               inset 0 0 0 9px rgba(50,43,34,.9);
  }
  .btn.primary{background:var(--ink);color:#15130F}
  .btn.primary:hover:not(:disabled){background:#fff}
  .btn.primary:disabled{background:#3A332A;color:#7C7364}
  .btn.ghost{color:var(--ink2);border-color:var(--line)}
  .opt:hover{background:rgba(32,28,22,.85)}
  .opt.sel{background:rgba(217,86,63,.12)}
  .pick.sel{background:var(--ink);color:#15130F;border-color:var(--ink)}
  .bar-track{background:#262119}
  .about-card{background:var(--paper);border-color:var(--line)}
  .toast{background:rgba(237,230,216,.94);color:#15130F}
  .echo{background:rgba(217,86,63,.1)}
}

/* 匿名指纹：只用来防重复计数，不含任何身份信息 */
function getUid() {
  try {
    let v = localStorage.getItem(UID_KEY);
    if (!v) {
      v = (crypto.randomUUID ? crypto.randomUUID()
        : 'u' + Date.now() + Math.random().toString(36).slice(2));
      localStorage.setItem(UID_KEY, v);
    }
    return v;
  } catch (e) { return 'anon'; }
}

function dateMinus(days) {
  const d = new Date(); d.setDate(d.getDate() - days);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function renderGate() {
  const g = GATES[S.step];
  $$('#progress i').forEach((el, i) => {
    el.className = i < S.step ? 'done' : (i === S.step ? 'on' : '');
  });
  $('#gateIdx').textContent = g.idx;
  $('#gateName').textContent = g.name;
  $('#gateQ').textContent = g.q;
  $('#gateHint').textContent = g.hint || '';

  const body = $('#gateBody');
  body.innerHTML = '';
  $('#gateBack').style.visibility = S.step === 0 ? 'hidden' : 'visible';
  $('#gateNext').textContent = S.step === GATES.length - 1 ? '生成一念卡' : '下一关';

  if (g.type === 'choice') renderChoice(g, body);
  if (g.type === 'split') renderSplit(g, body);
  if (g.type === 'input') renderInput(g, body);

  checkGate();
}

function renderChoice(g, body) {
  const wrap = document.createElement('div');
  wrap.className = 'opts';
  const cur = S.ans[g.key];
  const curArr = Array.isArray(cur) ? cur : (cur ? [cur] : []);

  g.options.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (curArr.includes(text) ? ' sel' : '');
    b.innerHTML = `<span class="dot"></span><span>${text}</span>`;
    b.addEventListener('click', () => {
      if (g.multi) {
        const arr = Array.isArray(S.ans[g.key]) ? S.ans[g.key] : [];
        const at = arr.indexOf(text);
        at >= 0 ? arr.splice(at, 1) : arr.push(text);
        S.ans[g.key] = arr;
        b.classList.toggle('sel', arr.includes(text));
      } else {
        S.ans[g.key] = S.ans[g.key] === text ? undefined : text;
        $$('.opt', wrap).forEach(el => el.classList.remove('sel'));
        if (S.ans[g.key] === text) b.classList.add('sel');
      }
      checkGate();
    });
    wrap.appendChild(b);
  });
  body.appendChild(wrap);

  if (g.custom) {
    const box = document.createElement('div');
    box.style.marginTop = '18px';
    box.innerHTML = `<input class="inp" id="custom_${g.key}" placeholder="${g.customHint || '也可以自己写一句'}" />`;
    body.appendChild(box);
    const inp = box.querySelector('input');
    inp.value = S.ans[g.key + '_custom'] || '';
    inp.addEventListener('input', () => {
      S.ans[g.key + '_custom'] = inp.value.trim();
      checkGate();
    });
  }
}

function renderSplit(g, body) {
  const d = S.ans[g.key] || {};
  const wrap = document.createElement('div');
  wrap.className = 'split';
  wrap.innerHTML = `
    <div class="split-cell">
      <h4><b>发生的事</b>　不带评价，像摄像机拍到的</h4>
      <textarea id="sp_fact" rows="3" placeholder="例：会上我提的方案被否了，没让我说完。"></textarea>
    </div>
    <div class="split-cell">
      <h4><b>我加的解释</b>　我对这件事的说法</h4>
      <textarea id="sp_exp" rows="3" placeholder="例：他根本看不上我这个人。"></textarea>
    </div>`;
  body.appendChild(wrap);

  const f = $('#sp_fact'), e2 = $('#sp_exp');
  f.value = d.fact ?? S.seed;
  e2.value = d.exp ?? '';
  const sync = () => {
    S.ans[g.key] = { fact: f.value.trim(), exp: e2.value.trim() };
    checkGate();
  };
  f.addEventListener('input', sync);
  e2.addEventListener('input', sync);
  sync();
}

function renderInput(g, body) {
  const ta = document.createElement('textarea');
  ta.className = 'inp';
  ta.rows = 3;
  ta.placeholder = g.placeholder || '';
  ta.value = S.ans[g.key] || '';
  ta.addEventListener('input', () => { S.ans[g.key] = ta.value.trim(); checkGate(); });
  body.appendChild(ta);
}

function gateValid() {
  const g = GATES[S.step], a = S.ans[g.key];
  if (g.type === 'split') return a && a.fact && a.exp && a.fact.length > 1 && a.exp.length > 1;
  if (g.type === 'input') return a && a.length >= (g.minLen || 1);
  if (g.type === 'choice') {
    const has = Array.isArray(a) ? a.length > 0 : !!a;
    return has || (a && a.length > 0) || !!(S.ans[g.key + '_custom'] || '').length;
  }
  return true;
}
function checkGate() { $('#gateNext').disabled = !gateValid(); saveDraft(); }

$('#gateBack').addEventListener('click', () => {
  if (S.step > 0) { S.step--; renderGate(); }
});
$('#gateNext').addEventListener('click', () => {
  if (!gateValid()) return;
  if (S.step < GATES.length - 1) { S.step++; renderGate(); }
  else renderCard();
});

/* ═════════════ 共鸣计数 ═════════════
   只上报「日期 + 第一关标签 + 匿名指纹」，原话不出本机。 */
async function reportEcho() {
  const el = $('#echoLine');
  el.hidden = true; el.textContent = '';

  const tag = GATES[0].options.indexOf(S.ans.shi);
  if (tag < 0) return;                   // 用户自己写的，不归类、不上报

  const day = todayKey();
  const mark = `yinian:echo:${day}:${tag}`;
  const reported = !!localStorage.getItem(mark);

  if (!reported) {
    localStorage.setItem(mark, '1');
    if (cloud) {
      try {
        await sql('INSERT OR IGNORE INTO echoes (day, tag, anon) VALUES (?, ?, ?)', [day, String(tag), getUid()]);
      } catch (e) {
        localStorage.removeItem(mark);   // 没写进去就别占位，下次还能试
      }
    }
  }

  let n = 0;
  if (cloud) {
    try {
      const result = await sql('SELECT COUNT(*) AS count FROM echoes WHERE tag = ? AND day >= ?', [String(tag), dateMinus(6)]);
      n = Number(result.rows[0].count);
    } catch (e) { /* 网络不通就不显示，不打扰 */ }
  }
  if (!n && !cloud) return;
  el.textContent = echoText(n, tag);
  el.hidden = false;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}

function saveArchive(r) {

function wrapCols(text, per) {
  const chars = [...text];
  const cols = [];
  for (let i = 0; i < chars.length; i += per) cols.push(chars.slice(i, i + per));
  return cols;
}

async function makeWallpaper(r) {
  const W = 1080, H = 1920;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const SERIF = '"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif';

  // 纸底
  x.fillStyle = '#FAF5EB'; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W * .2, H * .12, 0, W * .2, H * .12, H * .7);
  g.addColorStop(0, 'rgba(197,58,42,.05)'); g.addColorStop(1, 'rgba(197,58,42,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // 双线边框
  x.strokeStyle = '#DCD1BB'; x.lineWidth = 2; x.strokeRect(52, 52, W - 104, H - 104);
  x.strokeStyle = 'rgba(220,209,187,.5)'; x.lineWidth = 1; x.strokeRect(64, 64, W - 128, H - 128);

  // 顶部题名
  x.fillStyle = '#C53A2A'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `400 30px ${SERIF}`;
  x.letterSpacing = '10px';
  x.fillText('一 念 之 间', W / 2, 152);
  x.letterSpacing = '0px';

  // 主体：竖排（第五关的动作，太长则退到解释）
  let body = r.act || r.exp || '';
  if ([...body].length > 42) body = [...body].slice(0, 42).join('') + '…';
  const per = [...body].length > 24 ? 14 : 11;
  const cols = wrapCols(body, per);
  const size = cols.length >= 3 ? 62 : (cols.length === 2 ? 82 : 96);
  const lineH = size * 1.36;
  x.font = `700 ${size}px ${SERIF}`;
  x.fillStyle = '#1A1A1A';
  x.textAlign = 'center';
  x.textBaseline = 'top';
  const colGap = size * 1.5;
  const startY = (H - Math.min(cols.length, 1) * 0 - (per * lineH)) / 2 + 40;
  const rightX = W / 2 + (cols.length - 1) * colGap / 2;
  cols.forEach((col, ci) => {
    const cx = rightX - ci * colGap;
    col.forEach((ch, ri) => x.fillText(ch, cx, startY + ri * lineH));
  });

  // 落款
  x.font = `400 26px ${SERIF}`;
  x.fillStyle = '#9C9384';
  x.fillText(`${new Date().getFullYear()}.${pad(new Date().getMonth() + 1)}.${pad(new Date().getDate())}`, W / 2, H - 230);

  // 朱印
  const sx = W / 2 - 34, sy = H - 186;
  x.fillStyle = '#C53A2A';
  roundRect(x, sx, sy, 68, 68, 4); x.fill();
  x.fillStyle = '#FAF5EB';
  x.font = `700 34px ${SERIF}`;
  x.textBaseline = 'middle';
  x.fillText('省', W / 2, sy + 36);

  return c.toDataURL('image/png');
}

function roundRect(x, l, t, w, h, r) {
  x.beginPath();
  x.moveTo(l + r, t);
  x.arcTo(l + w, t, l + w, t + h, r);
  x.arcTo(l + w, t + h, l, t + h, r);
  x.arcTo(l, t + h, l, t, r);
  x.arcTo(l, t, l + w, t, r);
  x.closePath();
}

let crowdReady = false;

async function initCrowd() {
  const d = new Date();

  const q = CROWD[qid];
  const day = todayKey();

  $('#crowdDate').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  $('#crowdQ').textContent = q.q;

  const box = $('#crowdOptions');

  q.opts.forEach((t, i) => {

    b.className = 'opt';
    b.innerHTML = `<span class="dot"></span><span>${t}</span>`;
    b.addEventListener('click', () => castVote(day, qid, i, t));
    box.appendChild(b);
  });

  await loadCrowd(day, qid, voted !== null ? Number(voted) : null);
  crowdReady = true;
}

async function castVote(day, qid, idx, label) {
  if (localStorage.getItem(`yinian:vote:${day}:${qid}`) !== null) {
    toast('今天已经答过了'); return;
  }
  localStorage.setItem(`yinian:vote:${day}:${qid}`, String(idx));
  if (!cloud) { toast('网络未就绪，先记在本地了'); renderLocal(day, qid, idx); return; }
  try {
    await sql('INSERT INTO votes (id, day, qid, choice) VALUES (?, ?, ?, ?)', [crypto.randomUUID(), day, String(qid), String(idx)]);
    await loadCrowd(day, qid, idx);
  } catch (e) {
    console.warn(e);
    toast('答案先记在你这儿了');
    renderLocal(day, qid, idx);
  }
}

function renderLocal(day, qid, mine) {
  $('#crowdResult').hidden = false;
  $('#crowdTotal').innerHTML = `今天这里还连不上，<b>你是第 1 个</b>`;
  const q = CROWD[qid];
  $('#crowdBars').innerHTML = q.opts.map((t, i) => `
    <div class="bar-row${i === mine ? ' mine' : ''}">
      <div class="bar-label"><span>${t}</span><span class="pct">${i === mine ? '你选的' : ''}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${i === mine ? 100 : 0}%"></div></div>
    </div>`).join('');
}

async function loadCrowd(day, qid, mine) {
  const q = CROWD[qid];
  let rows = [];
  if (cloud) {
    try {
      rows = (await sql('SELECT choice FROM votes WHERE day = ? AND qid = ? LIMIT 2000', [day, String(qid)])).rows;
    } catch (e) { console.warn(e); }
  }
  const counts = q.opts.map(() => 0);
  rows.forEach(r => { if (counts[r.choice] !== undefined) counts[r.choice]++; });
  const total = counts.reduce((a, b) => a + b, 0);

  $('#crowdResult').hidden = false;
  $('#crowdTotal').innerHTML = total
    ? `今天有 <b>${total}</b> 个人答了这道题`
    : `今天还没有人答。你可以是第一个。`;

  $('#crowdBars').innerHTML = q.opts.map((t, i) => {
    const pct = total ? Math.round(counts[i] / total * 100) : 0;
    return `<div class="bar-row${mine === i ? ' mine' : ''}">
      <div class="bar-label"><span>${t}</span><span class="pct">${total ? pct + '%' : '—'}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  if (mine !== null && mine !== undefined) {
    $$('#crowdOptions .opt').forEach((el, i) => el.classList.toggle('sel', i === mine));
  }
}

/* ═════════════ 中断续跑 ═════════════
   走一半退出（手机上极常见），回来能接着走。草稿三天内有效。 */
(function resumeDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!d || !d.seed) return;
    if (Date.now() - d.t > 3 * 864e5) { clearDraft(); return; }
    const nav = $('.scene[data-scene="home"] .foot-nav');
    if (!nav) return;
    const b = document.createElement('button');
    b.className = 'link';
    b.style.color = 'var(--red)';
    b.textContent = '接着上次没过完的继续 →';
    b.addEventListener('click', () => {
      S.seed = d.seed;
      S.step = Math.min(d.step || 0, GATES.length - 1);
      S.ans = d.ans || {};
      renderGate();
      go('gate');
    });
    nav.prepend(b);
  } catch (e) {}
})();
