
<div class="wrap">
  <header>
    <h1><svg fill="none" stroke="#0e9488" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><rect height="17" rx="2" width="18" x="3" y="4"/><path d="M8 2v4M16 2v4M3 9h18M9 14l2 2 4-4"/></svg><!--pnid:OaIZtss5V01pe6pwM8TOp5-->本周工作台</h1>
    <div style="display:flex; gap:8px; align-items:center">
      <span class="mode-tag" id="modeTag"><!--pnid:ro2hSaCAxxtN0Mp3yodzLq-->访客模式</span>
      <span class="sync" id="syncBadge"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span id="syncText"><!--pnid:eXImUIidP7AcLnT8MkptcU-->已保存</span></span>
      <span class="sub" id="dateLabel"></span>
    </div>
  </header>

  <div class="top-tools">
    <button class="btn small ghost" data-click="exportDone()"><!--pnid:kxZcn16BjCaNnaWU1xM9iZ-->导出已完成工作</button>
    <button class="btn small ghost" data-click="exportJSON()"><!--pnid:qiTgZH47bOrnGN18cxn91u-->导出 JSON 备份</button>
    <button class="btn small ghost" data-click="document.getElementById('importFile').click()"><!--pnid:26Xg3Hhs62ScV39kYi8Zn5-->导入恢复</button>
    <input accept=".json" id="importFile" data-change="importJSON(this)" type="file" style="display:none">
    <button class="btn small danger" id="clearSeedBtn" data-click="clearSeed()" style="display:none"><!--pnid:FsIJX9EePWf8FJzqfL1jej-->清空示例数据</button>
  </div>

  <!--pnid:xt5tTj493gcFftRj0uvN0a--><!-- 首次访问引导：一键变成自己的工作台 -->
  <div class="card welcome" id="welcome" style="display:none">
    <h2><svg fill="none" stroke="#0e9488" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.3 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5L12 2z"/></svg><!--pnid:9p3glRyzXrgPc1fpGAFsb6-->欢迎使用本周工作台</h2>
    <p style="font-size:14px; line-height:1.7; color:#5a6773; margin-bottom:12px"><!--pnid:yD0ugNjvlHcqUCwnk1Cg2x-->
      这是别人分享给你的工作台。你可以<strong><!--pnid:vHpW3LGTqD8VHCuI0u3UKM-->直接在上面添加、勾选、编辑</strong><!--pnid:sIPjqtv7gH465eQcm0k50N-->——
      所有改动只保存在<strong><!--pnid:JDDy81W3NWnebHQ3sqYlGm-->你自己的浏览器</strong><!--pnid:DDEoIOro0AVGXyYY5XbXft-->里，不会影响分享者的数据，也不会被其他访客看到。
    </p>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="btn" data-click="makeMine()"><!--pnid:BggfYOI3p3KqVMkwGdh6w0-->用空白工作台开始（推荐）</button>
      <button class="btn ghost" data-click="dismissWelcome()"><!--pnid:IyAfkwXyfzScAzTx903CaR-->保留示例任务，先逛逛</button>
    </div>
    <p style="font-size:12px; color:#8a939c; margin-top:10px"><!--pnid:DdeokQ3v6JeFgwHPw8gcQJ-->
      提示：想换设备使用，用顶部「导出 JSON 备份 / 导入恢复」即可带走全部任务。
      <button class="btn small ghost" data-click="shareLink()" style="margin-left:6px; min-height:30px; padding:3px 10px"><!--pnid:KeWY9l7RLrsmejppJKoBac-->复制分享链接</button>
    </p>
  </div>

  <!--pnid:R9dZpkn6w1gE3wqtWuKue2--><!-- 今天要处理 -->
  <div class="card">
    <h2><svg fill="none" stroke="#e5484d" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><!--pnid:LcaIzKVAbT9RKooDhWzNt2-->今天要处理<span class="badge" id="todayCnt"></span></h2>
    <div id="todayList"></div>
  </div>

  <!--pnid:qYea3OuCksgCfqedILx2Fa--><!-- 添加任务 -->
  <div class="card">
    <h2><svg fill="none" stroke="#0e9488" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><!--pnid:oF1TQYzI9ameaVJrBHUSSi-->添加任务</h2>
    <div class="add-row">
      <input id="inpTitle" maxlength="200" placeholder="输入任务内容，回车快速添加" type="text">
      <button class="btn" data-click="addTask()"><!--pnid:W2upVPcWsjTTMi8kzcWtA6-->添加</button>
    </div>
    <div class="meta-row">
      <label><!--pnid:fRx2wek1ZI76yTUnx87pwz-->日期</label><input id="inpDate" type="date">
      <label><!--pnid:Vgto8ekKQNaqlBvq53ftDU-->时间</label><input id="inpTime" type="time" style="width:110px">
      <label><!--pnid:3ZhFGYwuXd3OTTaPDg5toN-->优先级</label>
      <select id="inpPrio"><option value="2"><!--pnid:IDshDwiZLHSfqwC5a2RBcp-->P2 普通</option><option value="1"><!--pnid:XJLmXOd0ISaGipLMqK2D47-->P1 重要</option><option value="0"><!--pnid:aVCpUCF7dUle3rdk3kUEdx-->P0 紧急</option></select>
      <button class="btn small ghost" data-click="document.getElementById('inpImgs').click()"><!--pnid:yRgGYTHWO14B1mO9SXXFde-->+ 图片附件</button>
      <input accept="image/*" id="inpImgs" multiple data-change="onPickImgs(this)" type="file" style="display:none">
    </div>
    <div class="img-preview" id="pendingImgs"></div>
  </div>

  <!--pnid:Ww8VVb39HE8zoNHUgusysD--><!-- 本周概览 -->
  <div class="card">
    <h2><svg fill="none" stroke="#0e9488" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 4"/></svg><!--pnid:2AvHMz7hiN1LFdxVN4F0gP-->本周概览<span class="badge" id="weekRange"></span></h2>
    <div class="stats">
      <div class="ring-box"><svg height="96" id="ringSvg" viewBox="0 0 96 96" width="96"></svg><div id="ringLabel" style="font-size:14px"></div></div>
      <div class="stat-cards">
        <div class="stat"><b class="c-green" id="stTotal"><!--pnid:WkLIPgMhBpXy2H1gqV3q3G-->0</b><span><!--pnid:wYUyQXzWdIU0h2HtjtmMAT-->本周任务</span></div>
        <div class="stat"><b id="stDone" style="color:var(--main)"><!--pnid:GygdZG4lswCzbxol3AzXNL-->0</b><span><!--pnid:3n08BsXj1LzuIH3JyFRNqg-->已完成</span></div>
        <div class="stat"><b class="c-red" id="stOverdue"><!--pnid:v1wn8PYmfU2HbF5jeH1FQ0-->0</b><span><!--pnid:xUQXxng7WkLkOmUlJ1fBLa-->逾期未完</span></div>
      </div>
    </div>
    <div class="weekbar" id="weekBar"></div>
  </div>

  <!--pnid:T76hbijraZnIJ1UvFctBGe--><!-- 本周任务列表 -->
  <div class="card">
    <h2><svg fill="none" stroke="#0e9488" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><!--pnid:68utxe96BnNhkwyKq0jyCC-->本周任务<span class="badge"><!--pnid:gSr5TsspDorqe8eypcxASO-->按天分组 · 已完成置灰</span></h2>
    <div id="weekList"></div>
  </div>
</div>

<!--pnid:hoNgVnNEFJh67skKj0ZpYO--><!-- 编辑弹窗 -->
<div class="mask" id="editMask">
  <div class="dialog">
    <h3><!--pnid:oN08wrugaCdIgXBW1Fseaz-->编辑任务</h3>
    <div class="frow"><label><!--pnid:ziXXaa2SpZTdclL8dAKory-->任务内容</label><input id="edTitle" maxlength="200" type="text"></div>
    <div class="frow"><label><!--pnid:O9UNlVVFYNwlu4H3rqUh01-->备注</label><textarea id="edNote" maxlength="500"></textarea></div>
    <div class="frow" style="display:flex; gap:8px">
      <div style="flex:1"><label><!--pnid:g1YUhcHBQiVJzVqxIMW7UX-->日期</label><input id="edDate" type="date"></div>
      <div style="flex:1"><label><!--pnid:YyrxFUBV9WrH9Ia2T1s2Pn-->时间</label><input id="edTime" type="time"></div>
      <div style="flex:1"><label><!--pnid:7yP5Fi79C2uQP1MjTf4ZoL-->优先级</label><select id="edPrio"><option value="2"><!--pnid:kvs8g7hFiJu9NhMgtnvEY7-->P2</option><option value="1"><!--pnid:3hEcb6pgBSBLix8EHZnqOC-->P1</option><option value="0"><!--pnid:OeDhBlSlHotmI5W6RBE36R-->P0</option></select></div>
    </div>
    <div class="frow"><label><!--pnid:kw3QFSqPuMjvyO8DG9ai18-->快捷改期</label>
      <div style="display:flex; gap:6px; flex-wrap:wrap">
        <button class="btn small ghost" data-click="shiftDate(0)" type="button"><!--pnid:7BrJshcXf2YStTZH5u8XPq-->今天</button>
        <button class="btn small ghost" data-click="shiftDate(1)" type="button"><!--pnid:DSe9vNifsbNyTaXnC5dY3U-->明天</button>
        <button class="btn small ghost" data-click="shiftDate(2)" type="button"><!--pnid:afGWITmkgS6uLhaXFdnBui-->后天</button>
        <button class="btn small ghost" data-click="shiftNextWeek()" type="button"><!--pnid:nhykvF1y8sQCtaaO0xTaQH-->下周一</button>
      </div>
    </div>
    <div class="frow" style="display:flex; align-items:center; gap:8px">
      <button class="btn small ghost" id="edDoneBtn" data-click="edToggleDone()" type="button"><!--pnid:ZJQe13qPnnbx5WvtWk1iD7-->标记已完成</button>
      <button class="btn small danger" data-click="edDelete()" type="button" style="margin-left:auto"><!--pnid:HzoCE2KhuOB4hYHjYQrEXt-->删除此任务</button>
    </div>
    <div class="btns"><button class="btn ghost" data-click="closeEdit()"><!--pnid:RxXbFpztB6CdV0hVsIP3Y6-->取消</button><button class="btn" data-click="saveEdit()"><!--pnid:qSzFdXTFcuA2vJoNsRRpKh-->保存</button></div>
  </div>
</div>

<!--pnid:ld0aZXQAIfRxseLvHWIU56--><!-- 图片查看 -->
<div class="mask" id="viewer"><div class="dialog" style="background:transparent; padding:0; max-width:640px"><img alt id="viewerImg"><div style="text-align:center; margin-top:10px"><button class="btn small ghost" data-click="document.getElementById('viewer').classList.remove('show')" style="background:#fff"><!--pnid:ARfP8kn9KtxK1hDRdFDkTg-->关闭</button></div></div></div>

<div class="toast" id="toast"></div>
