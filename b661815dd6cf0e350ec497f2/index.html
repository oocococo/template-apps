<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1024 内存合并</title>
<meta name="description" content="数字合并小游戏：把内存碎片一路合并到 1024。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%236e40c9'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='24' font-weight='bold' fill='%23f2e9ff' text-anchor='middle'%3E1024%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>1024<span class="zh">内存合并</span><span class="cursor"></span></h1>
      <div class="scores">
        <div class="score-box" id="score-box"><span class="label">得分</span><span class="value" id="score">0</span></div>
        <div class="score-box"><span class="label">最高</span><span class="value" id="best">0</span></div>
      </div>
    </div>
    <p class="subtitle">内存碎片整理挑战</p>
    <div class="toolbar">
      <button class="btn primary" id="btn-new">新游戏</button>
      <button class="btn" id="btn-undo" disabled>撤销</button>
      <button class="btn" id="btn-share">战绩卡片</button>
      <button class="btn" id="btn-sound">音效: 开</button>
    </div>
  </header>

  <div class="board" id="board">
    <div class="grid-bg" id="grid-bg"></div>
    <div class="toasts" id="toasts"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="ov-card">
        <h2 id="ov-title"></h2>
        <p id="ov-desc"></p>
        <div class="ov-stats" id="ov-stats"></div>
        <div class="ov-actions">
          <button class="btn primary" id="ov-primary"></button>
          <button class="btn" id="ov-secondary"></button>
          <button class="btn" id="ov-share"></button>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> / 滑动移动 · 相同数字合并 · 点 <b style="color:#ff9d9d">BUG</b> 方块修复它 · 合成 <b style="color:#d2b4ff">1024</b> 通关
  </p>

  <footer>
    合并数字，挑战最高分<br>
    <span class="hash"></span> · 彩蛋：试试经典秘技与输入 1024
  </footer>
</div>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal">
    <h3>战绩卡片</h3>
    <canvas id="share-canvas"></canvas>
    <div class="modal-actions">
      <button class="btn primary" id="btn-download">下载 PNG</button>
      <button class="btn" id="btn-copy">复制文案</button>
      <button class="btn" id="btn-modal-close">关闭</button>
    </div>
  </div>
</div>

<noscript><p style="text-align:center;color:#8b949e;padding:40px">需要启用 JavaScript 才能游玩。</p></noscript>
<script src="game.js"></script>
</body>
</html>
