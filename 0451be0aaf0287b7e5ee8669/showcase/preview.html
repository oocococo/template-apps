<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历备忘录 · 节日与历史上的今天</title>
  <style>:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --card-2: #f7f9fc;
  --text: #1f2733;
  --text-soft: #6b7686;
  --border: #e6eaf0;
  --accent: #4f46e5;
  --accent-soft: #eef0ff;
  --shadow: 0 10px 30px rgba(31, 39, 51, .08);
  --legal: #ef4444;
  --traditional: #f59e0b;
  --intl: #3b82f6;
  --term: #10b981;
  --memo: #8b5cf6;
  --radius: 16px;
}
[data-theme="dark"] {
  --bg: #0f1320;
  --card: #181d2c;
  --card-2: #1f2536;
  --text: #e8ecf4;
  --text-soft: #9aa6bd;
  --border: #2a3145;
  --accent: #7c83ff;
  --accent-soft: #232a44;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --legal: #ff6b6b;
  --traditional: #ffbe4d;
  --intl: #6aa8ff;
  --term: #4ade80;
  --memo: #b79cff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: 22px 18px 40px;
}

/* 顶部栏 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  font-size: 30px;
  width: 50px; height: 50px;
  display: grid; place-items: center;
  background: var(--accent-soft);
  border-radius: 14px;
}
.brand-text h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
.brand-text p { font-size: 12.5px; color: var(--text-soft); }

.topbar-actions { display: flex; gap: 10px; }
.icon-btn, .primary-btn {
  border: none; cursor: pointer; font-family: inherit;
  border-radius: 10px; transition: .15s;
}
.icon-btn {
  width: 42px; height: 42px; font-size: 18px;
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
}
.icon-btn:hover { background: var(--card-2); }
.primary-btn {
  background: var(--accent); color: #fff;
  padding: 10px 18px; font-size: 14px; font-weight: 600;
}
.primary-btn:hover { filter: brightness(1.06); }
.primary-btn.sm { padding: 8px 14px; font-size: 13px; }

/* 布局 */
.layout {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
  align-items: start;
}
.calendar-card, .detail-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}

/* 日历头 */
.cal-header {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin-bottom: 14px;
}
.cal-title { font-size: 18px; font-weight: 700; min-width: 130px; text-align: center; }
.nav-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card-2);
  color: var(--text); font-size: 20px; cursor: pointer; line-height: 1;
}
.nav-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* 星期行 */
.week-row {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; font-size: 13px; color: var(--text-soft);
  padding-bottom: 8px; margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.wk-sun { color: var(--legal); }
.wk-sat { color: var(--intl); }

/* 日期格 */
.day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-cell {
  position: relative;
  min-height: 64px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: var(--card-2);
  padding: 6px 7px;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
  transition: .12s;
  overflow: hidden;
}
.day-cell:hover { border-color: var(--accent); transform: translateY(-1px); }
.day-cell.outside { opacity: .35; }
.day-cell.today { border-color: var(--accent); background: var(--accent-soft); }
.day-cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
.dc-solar { font-size: 16px; font-weight: 700; }
.day-cell.today .dc-solar { color: var(--accent); }
.dc-lunar { font-size: 11px; color: var(--text-soft); line-height: 1.2; }
.dc-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
.dc-tag {
  font-size: 10px; line-height: 1; padding: 2px 4px; border-radius: 5px;
  color: #fff; white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
}
.tag-legal { background: var(--legal); }
.tag-traditional { background: var(--traditional); }
.tag-intl { background: var(--intl); }
.tag-term { background: var(--term); }
.dc-memo-dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--memo);
}

/* 图例 */
.legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-soft);
}
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg::before {
  content: ""; width: 11px; height: 11px; border-radius: 3px; display: inline-block;
}
.lg-legal::before { background: var(--legal); }
.lg-traditional::before { background: var(--traditional); }
.lg-intl::before { background: var(--intl); }
.lg-term::before { background: var(--term); }
.lg-memo::before { background: var(--memo); border-radius: 50%; }

/* 详情卡 */
.detail-card { position: sticky; top: 18px; }
.detail-date {
  background: var(--card-2); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
}
.dd-main { display: flex; align-items: baseline; gap: 10px; }
#ddDay { font-size: 34px; font-weight: 800; }
.dd-week { font-size: 14px; color: var(--text-soft); }
.dd-sub { font-size: 13px; color: var(--text-soft); margin-top: 2px; }

.block { margin-bottom: 16px; }
.block-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
.holiday-chip {
  font-size: 12.5px; padding: 4px 10px; border-radius: 20px; color: #fff; font-weight: 600;
}
.empty-hint { font-size: 13px; color: var(--text-soft); }

.meta-line { font-size: 12px; color: var(--text-soft); margin-bottom: 8px; }
.history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.history-list li {
  font-size: 13.5px; padding: 9px 11px; border-radius: 10px;
  background: var(--card-2); border-left: 3px solid var(--accent);
}
.history-list li .hy { font-weight: 700; color: var(--accent); margin-right: 6px; }

/* 备忘 */
.memo-form { display: flex; gap: 8px; margin-bottom: 10px; }
.memo-form input {
  flex: 1; border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  background: var(--card-2); color: var(--text);
}
.memo-form input:focus { outline: none; border-color: var(--accent); }
.memo-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.memo-item {
  display: flex; align-items: center; gap: 9px;
  background: var(--card-2); border-radius: 10px; padding: 9px 11px; font-size: 13.5px;
}
.memo-item .chk {
  width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border);
  cursor: pointer; flex: 0 0 auto; display: grid; place-items: center; font-size: 12px; color: #fff;
}
.memo-item.done .chk { background: var(--memo); border-color: var(--memo); }
.memo-item.done .mt { text-decoration: line-through; color: var(--text-soft); }
.memo-item .mt { flex: 1; word-break: break-word; }
.memo-item .del {
  border: none; background: transparent; color: var(--text-soft);
  cursor: pointer; font-size: 16px; padding: 2px 5px; border-radius: 6px;
}
.memo-item .del:hover { color: var(--legal); background: var(--card); }

.foot { text-align: center; font-size: 12px; color: var(--text-soft); margin-top: 22px; }

/* 响应式 */
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  .detail-card { position: static; }
  .day-cell { min-height: 56px; }
  .dc-solar { font-size: 14px; }
}
@media (max-width: 480px) {
  .brand-text p { display: none; }
  .day-cell { min-height: 48px; padding: 4px 4px; }
  .dc-lunar { font-size: 10px; }
}
</style>
</head>

/* ============================================================
 * app.js —— 日历渲染 + 节日/节气/历史 + 备忘录（memoryStorage）
 * ============================================================ */
(function () {
  'use strict';

  var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  var STORE_KEY = 'calendar_memos_v1';
  var THEME_KEY = 'calendar_theme_v1';

  var state = {
    viewY: 0,
    viewM: 0,        // 1-12
    selected: null   // Date 对象（选中日）
  };

  // ---------- 备忘录存储 ----------
  function loadMemos() {
    try { return JSON.parse(memoryStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveMemos(obj) {
    try { memoryStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function dateKey(d) {
    return d.getFullYear() + '-' +
      (d.getMonth() + 1 < 10 ? '0' + (d.getMonth() + 1) : (d.getMonth() + 1)) + '-' +
      (d.getDate() < 10 ? '0' + d.getDate() : d.getDate());
  }
  function getMemoFor(d) { return loadMemos()[dateKey(d)] || []; }

  // ---------- 工具 ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ---------- 渲染日历 ----------
  function renderCalendar() {
    var grid = document.getElementById('dayGrid');
    var y = state.viewY, m = state.viewM;
    document.getElementById('calTitle').textContent = y + ' 年 ' + m + ' 月';

    var first = new Date(y, m - 1, 1);
    var startWeekday = first.getDay(); // 0=日
    var daysInMonth = new Date(y, m, 0).getDate();

    // 上个月的补齐
    var prevDays = new Date(y, m - 1, 0).getDate();
    var cells = [];
    for (var i = startWeekday - 1; i >= 0; i--) {
      cells.push(makeCell(new Date(y, m - 2, prevDays - i), true));
    }
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push(makeCell(new Date(y, m - 1, d), false));
    }
    // 补满 6 行
    while (cells.length % 7 !== 0) {
      var extra = cells.length - (startWeekday + daysInMonth);
      cells.push(makeCell(new Date(y, m, extra + 1), true));
    }

    grid.innerHTML = '';
    cells.forEach(function (cell) { grid.appendChild(cell); });
  }

  function makeCell(date, outside) {
    var y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    var cell = document.createElement('div');
    cell.className = 'day-cell' + (outside ? ' outside' : '');

    var today = new Date();
    if (y === today.getFullYear() && m === today.getMonth() + 1 && d === today.getDate()) {
      cell.classList.add('today');
    }
    if (state.selected && dateKey(date) === dateKey(state.selected)) {
      cell.classList.add('selected');
    }

    var lunar = Lunar.solarToLunar(y, m, d);
    var term = Lunar.solarTerm(y, m, d);
    var holi = Holidays.getHolidays(y, m, d);

    var solarEl = document.createElement('div');
    solarEl.className = 'dc-solar';
    solarEl.textContent = d;
    cell.appendChild(solarEl);

    var lunarEl = document.createElement('div');
    lunarEl.className = 'dc-lunar';
    lunarEl.textContent = term ? term : Lunar.lunarText(lunar);
    cell.appendChild(lunarEl);

    // 标签（最多展示 2 个）
    var tagsEl = document.createElement('div');
    tagsEl.className = 'dc-tags';
    var labelPool = [];
    holi.forEach(function (h) {
      labelPool.push({ cls: 'tag-' + h.type, text: h.name });
    });
    if (term) labelPool.push({ cls: 'tag-term', text: term });

    labelPool.slice(0, 2).forEach(function (t) {
      var tag = document.createElement('span');
      tag.className = 'dc-tag ' + t.cls;
      tag.textContent = (t.text.length > 4 ? t.text.slice(0, 4) : t.text);
      tag.title = t.text;
      tagsEl.appendChild(tag);
    });
    if (labelPool.length > 2) {
      var more = document.createElement('span');
      more.className = 'dc-tag';
      more.style.background = 'var(--text-soft)';
      more.textContent = '+' + (labelPool.length - 2);
      more.title = labelPool.slice(2).map(function (x) { return x.text; }).join('、');
      tagsEl.appendChild(more);
    }
    cell.appendChild(tagsEl);

    // 备忘小红点
    if (getMemoFor(date).length > 0) {
      var dot = document.createElement('span');
      dot.className = 'dc-memo-dot';
      cell.appendChild(dot);
    }

    cell.addEventListener('click', function () {
      state.selected = date;
      renderCalendar();
      renderDetail(date);
    });
    return cell;
  }

  // ---------- 渲染详情 ----------
  function renderDetail(date) {
    var y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    var lunar = Lunar.solarToLunar(y, m, d);
    var term = Lunar.solarTerm(y, m, d);

    document.getElementById('ddDay').textContent = d;
    document.getElementById('ddWeek').textContent = WEEK[date.getDay()];
    var sub = y + ' 年 ' + m + ' 月 · 农历 ' + Lunar.lunarText(lunar) +
      '（' + Lunar.lunarGanZhiYear(lunar) + Lunar.lunarAnimal(lunar) + '年）';
    if (term) sub += ' · ' + term;
    document.getElementById('ddSub').textContent = sub;

    // 节日
    var holi = Holidays.getHolidays(y, m, d);
    var holiBox = document.getElementById('holidayList');
    holiBox.innerHTML = '';
    if (term) {
      var tc = document.createElement('span');
      tc.className = 'holiday-chip tag-term';
      tc.textContent = term + '（节气）';
      holiBox.appendChild(tc);
    }
    if (holi.length === 0 && !term) {
      holiBox.innerHTML = '<span class="empty-hint">这一天没有收录的节日 / 节气</span>';
    } else {
      holi.forEach(function (h) {
        var c = document.createElement('span');
        c.className = 'holiday-chip tag-' + h.type;
        c.textContent = h.name;
        holiBox.appendChild(c);
      });
    }

    // 历史上的今天
    renderHistory(m, d);

    // 备忘录
    renderMemos(date);
  }

  function renderHistory(m, d) {
    var box = document.getElementById('historyList');
    var meta = document.getElementById('historyMeta');
    box.innerHTML = '';
    meta.textContent = '加载中…';

    var local = HistoryToday.getLocal(m, d);
    function paint(items, source) {
      box.innerHTML = '';
      if (!items || items.length === 0) {
        box.innerHTML = '<li class="empty-hint">暂无收录的历史事件</li>';
        meta.textContent = source;
        return;
      }
      items.forEach(function (it) {
        var li = document.createElement('li');
        if (it.y) {
          var yspan = document.createElement('span');
          yspan.className = 'hy';
          yspan.textContent = it.y + '年';
          li.appendChild(yspan);
        }
        li.appendChild(document.createTextNode(it.t));
        box.appendChild(li);
      });
      meta.textContent = source;
    }

    paint(local, '本地精选数据（离线可用）');


  }

  function renderMemos(date) {
    var ul = document.getElementById('memoList');
    var items = getMemoFor(date);
    ul.innerHTML = '';
    if (items.length === 0) {
      ul.innerHTML = '<li class="empty-hint">还没有备忘，添加一条吧</li>';
      return;
    }
    items.forEach(function (it) {
      var li = document.createElement('li');
      li.className = 'memo-item' + (it.done ? ' done' : '');

      var chk = document.createElement('span');
      chk.className = 'chk';
      chk.textContent = it.done ? '✓' : '';
      chk.addEventListener('click', function () {
        toggleMemo(date, it.id);
      });

      var txt = document.createElement('span');
      txt.className = 'mt';
      txt.textContent = it.text;

      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.title = '删除';
      del.addEventListener('click', function () {
        removeMemo(date, it.id);
      });

      li.appendChild(chk);
      li.appendChild(txt);
      li.appendChild(del);
      ul.appendChild(li);
    });
  }

  // ---------- 备忘增删改 ----------
  function addMemo(date, text) {
    var all = loadMemos();
    var k = dateKey(date);
    if (!all[k]) all[k] = [];
    all[k].push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), text: text, done: false });
    saveMemos(all);
    renderMemos(date);
    renderCalendar();
  }
  function toggleMemo(date, id) {
    var all = loadMemos();
    var k = dateKey(date);
    if (all[k]) {
      all[k] = all[k].map(function (it) {
        if (it.id === id) it.done = !it.done;
        return it;
      });
      saveMemos(all);
    }
    renderMemos(date);
  }
  function removeMemo(date, id) {
    var all = loadMemos();
    var k = dateKey(date);
    if (all[k]) {
      all[k] = all[k].filter(function (it) { return it.id !== id; });
      if (all[k].length === 0) delete all[k];
      saveMemos(all);
    }
    renderMemos(date);
    renderCalendar();
  }

  // ---------- 主题 ----------
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { memoryStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  // ---------- 初始化 ----------
  function init() {
    var now = new Date();
    state.viewY = now.getFullYear();
    state.viewM = now.getMonth() + 1;
    state.selected = now;

    try {
      var savedTheme = memoryStorage.getItem(THEME_KEY);
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}

    document.getElementById('prevBtn').addEventListener('click', function () {
      state.viewM--;
      if (state.viewM < 1) { state.viewM = 12; state.viewY--; }
      renderCalendar();
    });
    document.getElementById('nextBtn').addEventListener('click', function () {
      state.viewM++;
      if (state.viewM > 12) { state.viewM = 1; state.viewY++; }
      renderCalendar();
    });
    document.getElementById('todayBtn').addEventListener('click', function () {
      var n = new Date();
      state.viewY = n.getFullYear(); state.viewM = n.getMonth() + 1; state.selected = n;
      renderCalendar();
      renderDetail(n);
    });
    document.getElementById('themeBtn').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });
    document.getElementById('memoForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('memoInput');
      var v = inp.value.trim();
      if (!v) return;
      addMemo(state.selected, v);
      inp.value = '';
    });

    renderCalendar();
    renderDetail(state.selected);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
