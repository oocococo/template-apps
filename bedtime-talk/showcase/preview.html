<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睡前聊聊 · 示例预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#39322e;font:16px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #ded6cc;padding-bottom:20px}h1{font-size:42px;margin:15px 0}h2{font-size:24px}p{color:#82776d}button{font:inherit;border:1px solid #cbbdb0;border-radius:30px;background:#fffaf3;color:#5c5045;padding:12px 24px;cursor:pointer}.card{background:#fffdf9;border:1px solid #e8dfd4;border-radius:24px;padding:38px;margin-top:28px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.small{font-size:13px;color:#908478}.tag{color:#a16a43;font-size:13px;letter-spacing:2px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}.day{padding:15px;border-radius:50%}.pink{background:#f5dce2;color:#8f5466}textarea{width:100%;min-height:100px;border:0;background:transparent;font:inherit;resize:vertical}.notice{margin-top:30px;color:#9b8b7a;font-size:12px}@media(max-width:650px){main{padding:22px}.grid{grid-template-columns:1fr}h1{font-size:30px}.card{padding:24px}.day{padding:8px}}</style></head><body><main><nav><strong>睡前聊聊</strong><span class="small">示例预览 · 操作仅在当前页面生效</span></nav><p class="tag">留一点时间，听听彼此</p><h1>今天，想和你聊聊。</h1><p>把一天的忙碌放下，从一个小问题开始。</p><div class="grid"><section class="card"><span class="tag">孩子的问题 · 心情</span><h2 id="question">今天有没有一件小事，让你偷偷开心？</h2><p>没有标准答案，想到什么就说什么。</p><button id="draw">换一张问题卡 ↗</button></section><section class="card"><span class="tag">今晚的聊天</span><h2>慢慢说，我在听。</h2><p>轮到你问，或轮到我答。<br>让小小的对话留下来。</p><button onclick="this.textContent='轮到家长提问'">轮流抽卡</button></section></div><section class="card"><span class="tag">记下此刻</span><textarea placeholder="在这里试着写下回答……"></textarea><span class="small">示例预览中的输入只保留在当前页面。</span></section></main><script>const cards=['如果明天可以学会一项本领，你想学什么？','最近有什么事情，让你觉得自己长大了？','今天有没有一件小事，让你偷偷开心？'];let i=0;document.querySelector('#draw').onclick=()=>document.querySelector('#question').textContent=cards[i++%cards.length]</script></body></html>
