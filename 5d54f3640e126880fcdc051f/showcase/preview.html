<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵签易占</title><style>
      :root,
      [data-theme='light'] {
        --bg: #f7f4ed;
        --surface: #fffdf8;
        --surface-muted: #f1ece0;
        --surface-hover: #eae3d3;
        --text: #23201a;
        --text-muted: #6d675c;
        --text-subtle: #9a9384;
        --border: #0000001a;
        --border-strong: #00000033;
        --seal: #9a2b26;
        --seal-soft: #9a2b2614;
        --gold: #8a6a24;
        --jade: #3f6b57;
        --shadow: 0 1px 2px #0000000d, 0 8px 24px #0000000a;
        /* 顶栏实测高：18px 上内边距 + 标题行 + 12px + 分区条 + 12px 下内边距 + 1px 边。
         * 解读页左栏要按它错开，两者不能各写各的。 */
        --topbar-h: 132px;
        /* 页面左右内边距。.app 用它，.topbar 用它的相反数——两处各写一个数，
         * 内边距一收放，顶栏底色就不贴视口边了。 */
        --app-pad: clamp(14px, 2.1vw, 32px);
        color-scheme: light;
      }

      [data-theme='dark'] {
        --bg: #16150f;
        --surface: #1e1d16;
        --surface-muted: #242219;
        --surface-hover: #2e2b20;
        --text: #ece7d9;
        --text-muted: #9d9683;
        --text-subtle: #6d6758;
        --border: #ffffff17;
        --border-strong: #ffffff2e;
        --seal: #d4675c;
        --seal-soft: #d4675c1f;
        --gold: #c9a961;
        --jade: #7fb69b;
        --shadow: 0 1px 2px #00000040, 0 8px 24px #00000033;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      /* .row / .card 自带 display，会盖掉 hidden 属性的默认 display: none */
      [hidden] {
        display: none !important;
      }

      /* ---------- 动画 ---------- */

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes sealIn {
        0% {
          opacity: 0;
          transform: scale(2.1) rotate(-14deg);
        }
        62% {
          opacity: 1;
          transform: scale(0.93) rotate(2deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }

      @keyframes lineGrow {
        from {
          opacity: 0;
          transform: scaleX(0);
        }
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @keyframes coinThrow {
        0% {
          transform: translateY(0) rotateY(0deg) scale(1, 1);
        }
        14% {
          transform: translateY(-48px) rotateY(100deg) scale(0.94, 1.06);
        }
        60% {
          transform: translateY(-6px) rotateY(540deg) scale(1.08, 0.92);
        }
        74% {
          transform: translateY(0) rotateY(620deg) scale(1.16, 0.84);
        }
        86% {
          transform: translateY(-8px) rotateY(680deg) scale(0.96, 1.04);
        }
        100% {
          transform: translateY(0) rotateY(720deg) scale(1, 1);
        }
      }

      @keyframes coinShadow {
        0%,
        100% {
          transform: translateX(-50%) scale(1);
          opacity: 0.26;
        }
        14% {
          transform: translateX(-50%) scale(0.5);
          opacity: 0.1;
        }
        60% {
          transform: translateX(-50%) scale(0.88);
          opacity: 0.2;
        }
        74% {
          transform: translateX(-50%) scale(1.16);
          opacity: 0.34;
        }
        86% {
          transform: translateX(-50%) scale(0.94);
          opacity: 0.28;
        }
      }

      @keyframes tossGlow {
        0%,
        100% {
          opacity: 0.55;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.06);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }

      @keyframes baguaSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes baguaSpinBack {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes baguaCore {
        0%,
        100% {
          transform: scale(0.88);
          opacity: 0.72;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }

      @keyframes baguaHalo {
        0%,
        100% {
          transform: scale(0.7);
          opacity: 0.28;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.06;
        }
      }

      .anim-rise {
        animation: riseIn 520ms cubic-bezier(0.22, 0.9, 0.3, 1) both;
      }

      .anim-fade {
        animation: fadeIn 420ms ease both;
      }

      .panel-enter {
        animation: riseIn 320ms ease both;
      }

      /* ---------- 卦气消长环 ----------
         十二辟卦的爻象是固定的：阳（或阴）自初爻逐次长上来，一格一格，
         走到对宫就是极盛。所以环上每一格的条数直接就是那一月的进度，
         看得见「走到哪一步」，不必先懂这套学说。 */

      .qiring {
        display: block;
        width: 100%;
        /* 画布是 232 见方（比 200 大，是为了给环外的标签留位置），
           乘 2.4 才是原先 200 见方时的观感大小。 */
        max-width: 560px;
        margin: 0 auto;
        overflow: visible;
      }

      .qiring .cell-bar {
        transition: opacity 300ms ease;
      }

      .qi-block {
        margin-top: 16px;
        padding: 14px 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-sunken, rgba(0, 0, 0, 0.015));
        color: var(--text);
      }

      /* ---------- 小卦与图注（八宫名单与四卦推导共用）----------
         .unit / .mini-gua 这组是 miniGua() 画出来的小卦：六线一根一根摆着，
         下面挂卦名与图注。八宫那一列同宫名单与四卦推导用的是同一套，提到这里共用。 */

      /* ---------- 四卦推导 ----------
         互、变、错、综四种取法，纯文字说一遍是「互卦为XX」四个字，
         看不出怎么互出来的。这里把本卦摆在左边，四种取法的结果摆在右边，
         中间用一条线连过去，并标出每一步动了哪几爻。 */

      .derive {
        margin-top: 16px;
        padding: 14px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-sunken, rgba(0, 0, 0, 0.015));
        /* 按这块自己有多宽来排，不按视口。这块在右栏里，视口再宽它也未必宽；
         * 拿视口宽度定列数，窄右栏配宽视口就会挤成参差的一行。 */
        container-type: inline-size;
        container-name: derive;
      }

      .derive-head {
        font-size: 16px;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 12px;
      }

      .derive .derive-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      /* 本卦一行，四种取法一行。挤在一行里最后一卦会折行、断得莫名其妙，
         分成两行反而把「本卦 vs 推出来的四卦」这层关系讲清了。 */
      .derive .derive-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        align-items: center;
        justify-items: center;
        gap: 10px 4px;
        width: 100%;
      }

      /* 箭头加卦，一格。格内自己居中，四格之间由网格定距，间距一律相等。 */
      .derive .derive-step {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 0;
      }

      /* 本卦那行只有一格，让它横跨整行再由 justify-items 居中。
       * 不跨列的话它会落在第 1 列，看着像「本卦」是四种取法里的头一个。 */
      .derive .derive-row > .unit:only-child {
        grid-column: 1 / -1;
      }

      @container derive (max-width: 720px) {
        .derive .derive-row {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px 8px;
        }
      }

      .unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 46px;
      }

      /* ---------- 八宫名单 ----------
         一宫八卦按世次先后摆成一列，标出每一卦相对本宫纯卦变过哪几爻。
         这八格是京房那一层的全貌：世次怎么爬、游魂归魂怎么退，一张图看完了。 */
      .palace {
        margin-top: 16px;
        padding: 14px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-sunken, rgba(0, 0, 0, 0.015));
        container-type: inline-size;
        container-name: palace;
      }

      /* 八格按网格均分，间距一律相等。原先是 flex 换行：容器一窄就折成
       * 「七格 + 一格」，末行那格孤零零居中，看着像掉了出去。 */
      .palace .palace-row {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        align-items: start;
        justify-items: center;
        gap: 12px 6px;
      }

      @container palace (max-width: 860px) {
        .palace .palace-row {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      /* 本卦那一格：朱砂只给「就是你这一卦」，不给另外七个——宫是一处，不是吉凶。
         框用 outline 而不是 border。border 会占布局空间：这一格顶到 1px 边 + 4px 上内边距，
         同行另外七格没有边框，两边内容就对不齐，看着像本卦这一格「掉下去」了。
         outline 不参与布局，八格的内容始终齐平，框照旧画在外面。 */
      .palace .unit.self {
        outline: 1px solid var(--seal);
        outline-offset: 3px;
        border-radius: 7px;
      }

      /* 世次名。游魂归魂这两格是梯子上的两个例外，标出来才不会看成六个一串。 */
      .palace .unit.odd .unit-tag {
        color: var(--text-muted);
        font-weight: 600;
      }

      /* 这条必须压在上一条下面，且选择器同样要三个类。
         本卦自己就有落在游魂、归魂上的（十六卦，占四分之一），那一格同时挂 self 与 odd，
         两条特异性相同时按书写顺序决胜——朱砂是「就是你这一卦」，比「这是例外级」更要紧，
         少了它，那一卦就只剩个框、字反倒是灰的。 */
      .palace .unit.self .unit-tag {
        color: var(--seal);
      }

      .palace .palace-note {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.7;
        color: var(--text-muted);
        text-align: center;
      }

      .unit-name {
        font-size: 16px;
        color: var(--text);
      }

      .unit-tag {
        font-size: 14px;
        color: var(--text-muted);
      }

      .derive .arrow {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0 1px;
        color: var(--border-strong);
      }

      .derive .arrow .how {
        /* 互卦那条注记两行、其余各一行。不定死排法的话，一行字会贴在 2.7em
         * 的盒子顶上、两行字占满盒子，四支箭头就不在一条线上。改成 flex 上下
         * 居中，一行两行都落在同一个中心，箭头一律贴在同一条基线上。 */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1.35;
        color: var(--text-muted);
        text-align: center;
        max-width: 96px;
        width: 100%;
        min-height: 2.7em;
        /* DERIVE_HOW 里的 \n 要真的断行。不写这条，\n 会被折叠成空格，
         * 换行变成靠 max-width 碰巧折出来——改个字号就可能折成一行或三行。 */
        white-space: pre-line;
      }

      .derive .arrow svg {
        display: block;
      }

      .mini-gua {
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 72px;
      }

      .mini-line {
        display: flex;
        gap: 8px;
        height: 9px;
      }

      .mini-line i {
        display: block;
        height: 9px;
        border-radius: 4px;
        background: var(--text);
      }

      /* 阴阳靠形状分，不靠明暗分：一整条是阳，断成两截是阴。
         早先把阴爻画成 --border-strong（浅色模式下只 20% 黑），叠在 4px 的细线上，
         整张卦图远看就是一团灰。卦画首先要读得出来，其次才是好看。 */
      .mini-line.yin i {
        width: 44%;
        background: var(--text-muted);
      }

      .mini-line.yang i {
        flex: 1;
      }

      /* 参与这一步取法的爻，染朱砂，一眼看出「动的是这几爻」 */
      .mini-line.touched i {
        background: var(--seal);
      }

      .self-unit .unit-name {
        font-weight: 600;
      }

      .qiring .month-label {
        font-size: 11px;
        fill: var(--text-muted);
      }

      .qiring .now-label {
        font-size: 11px;
        fill: var(--seal);
        font-weight: 600;
      }

      .qiring .mark {
        fill: var(--seal);
      }

      /* 当月那一格轻轻起伏，像轮转到这一格时它应声而动。
         起伏幅度收到 0.8：早先压到 0.55，动画每 2.6 秒就把当月格闪到半明半暗一次，
         爻杠在那一瞬几乎看不出阴阳。它是提示，不该盖过读图本身。 */
      @keyframes qiBreathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
      }

      .qiring .now-sector {
        animation: qiBreathe 2.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .qiring .now-sector {
          animation: none;
        }
      }

      /* ---------- 起卦推演中 ---------- */

      .casting {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 46px 18px;
      }

      /* 八卦环：外环八纯顺时针走，内环刻度反向走，两层错开才有流动感。
       * 整段起卦就三秒出头，一分钟转一圈等于看着没动，环只活在起卦这几秒里——
       * 所以外环 22 秒、内环 15 秒，三秒里能分别转过 49° 和 72°，一眼看得出在走。*/
      .bagua {
        width: 158px;
        height: 158px;
        color: var(--text-muted);
        overflow: visible;
      }

      .bagua .ring-outer {
        transform-origin: 100px 100px;
        animation: baguaSpin 22s linear infinite;
      }

      .bagua .ring-inner {
        transform-origin: 100px 100px;
        animation: baguaSpinBack 15s linear infinite;
      }

      .bagua .core {
        transform-origin: 100px 100px;
        animation: baguaCore 2.6s ease-in-out infinite;
      }

      .bagua .halo {
        transform-origin: 100px 100px;
        animation: baguaHalo 2.6s ease-in-out infinite;
      }

      .casting-bar {
        position: relative;
        width: min(320px, 70vw);
        height: 2px;
        background: var(--border);
        overflow: hidden;
        border-radius: 2px;
      }

      .casting-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, var(--seal), transparent);
        animation: sweep 1.1s linear infinite;
      }

      .casting-text {
        font-size: 17px;
        color: var(--text-muted);
        letter-spacing: 0.12em;
      }

      /* 推演日志：定高，免得最后一行还在打字、下面就换成结果，页面跳一下。
       * 播报最多 CASTING_MAX_LINES + 1 行——收尾那句不受行数上限管，它要压轴。
       * 每行 nowrap 固定行高，容器得留够 11 行，最后一句才不会挤到卦盘上。 */
      .casting-log {
        width: min(400px, 100%);
        min-height: 320px;
        font-size: 17px;
        line-height: 1.7;
        color: var(--text-muted);
        text-align: left;
      }

      /* ---------- 成卦盘 ----------
         起卦这一拍原先只有八卦环空转加一段打字，六爻是怎么成出来的看不见。
         这里让卦体随推演逐爻长出来：自初爻向上长到上爻，长的过程中套用该爻的
         动静（少阳、老阳…），最后动爻单独标红。取数、成卦、定动爻这条线，
         从此是看得见的。 */

      .casting-hex {
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: 120px;
        margin: 4px 0 12px;
      }

      .casting-hex .grow {
        display: flex;
        gap: 8px;
        height: 7px;
        opacity: 0;
        transform: scaleX(0.2);
        transform-origin: left center;
      }

      .casting-hex .grow.in {
        opacity: 1;
        transform: scaleX(1);
        transition: opacity 260ms ease, transform 260ms cubic-bezier(0.22, 0.9, 0.3, 1);
      }

      .casting-hex .grow i {
        display: block;
        height: 7px;
        border-radius: 3.5px;
        background: var(--text);
      }

      /* 同 .mini-line.yin：阴阳靠形状，不靠把阴爻画淡。 */
      .casting-hex .grow.yin i {
        width: 42%;
        background: var(--text-muted);
      }

      .casting-hex .grow.yang i {
        flex: 1;
      }

      .casting-hex .grow.moving i {
        background: var(--seal);
      }

      .casting-hex .grow.moving::after {
        content: '○';
        font-size: 14px;
        line-height: 1;
        color: var(--seal);
        margin-left: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .casting-hex .grow {
          transform: none;
          transition: none;
        }
      }

      .casting-line {
        white-space: nowrap;
        overflow: hidden;
        animation: fadeIn 220ms ease both;
      }

      .casting-line.done {
        color: var(--text-subtle);
      }

      /* 光标只在还没打完的那一行上 */
      .casting-line::after {
        content: '';
        display: inline-block;
        width: 6px;
        height: 13px;
        margin-left: 3px;
        vertical-align: -2px;
        background: var(--seal);
        animation: caretBlink 1s steps(1) infinite;
      }

      .casting-line.done::after {
        content: none;
      }

      @keyframes caretBlink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .casting-line::after {
          animation: none;
        }
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        font-size: 18px;
        line-height: 1.7;
      }

      .serif {
        font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
      }

      .app {
        max-width: 1340px;
        margin: 0 auto;
        /* 内边距随视口收放。原先是死 32px：窄屏上白白吃掉 64px 宽度，
         * 推导图与八宫名单正是被这一条挤到换行的。
         * 顶栏要抵消它才能贴到视口边，所以这个值只能有一个来源。 */
        padding: var(--app-pad) var(--app-pad) clamp(40px, 5vw, 72px);
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      /* ---------- 顶栏 ----------
         解读页右栏很长，标题与分区又只在最上头，滑下去就找不着自己在哪一栏了。
         所以两者合成一条顶栏钉住：底色半透明加一点模糊，内容从底下透过去但不糊。 */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 12px;
        /* 抵消 .app 的上内边距，让顶栏贴到视口顶边；左右也拉满，底色才是整条。
         * 取 --app-pad 的相反数，不另写一个 32——内边距收放时两处要一起动。 */
        margin: calc(var(--app-pad) * -1) calc(var(--app-pad) * -1) 0;
        padding: 18px var(--app-pad) 12px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        border-bottom: 1px solid var(--border);
      }

      .app-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px 20px;
        flex-wrap: wrap;
      }

      .app-header h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .app-header p {
        margin: 0;
        font-size: 16px;
        color: var(--text-muted);
        /* 副题贴在标题右边，两者算一行，顶栏因此矮一截 */
        flex: 1 1 auto;
      }

      .ganzhi-strip {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 5px 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        font-size: 16px;
        white-space: nowrap;
      }

      .pill b {
        font-weight: 600;
        color: var(--seal);
        letter-spacing: 0.06em;
      }

      nav[role='tablist'] {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow-x: auto;
      }

      nav[role='tablist'] button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
        font-size: 17px;
        padding: 8px 18px;
        border-radius: 9px;
        cursor: pointer;
        white-space: nowrap;
      }

      nav[role='tablist'] button[aria-selected='true'] {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        font-weight: 600;
      }

      main > section[role='tabpanel'] {
        display: none;
        flex-direction: column;
        gap: 16px;
      }

      main > section[role='tabpanel']:not([hidden]) {
        display: flex;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .card > h2 {
        margin: 0 0 4px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .card > p.hint {
        margin: 0 0 14px;
        font-size: 16px;
        color: var(--text-muted);
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* 存卦那行的可见提示。存不下时这里要说得出来，不能只往 live region 里写。 */
      .save-status {
        font-size: 13px;
        color: var(--text-muted);
      }

      .save-status.err {
        color: var(--seal);
      }

      input[type='text'],
      input[type='number'],
      textarea {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 8px 11px;
        width: 100%;
      }

      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--seal);
        outline-offset: 1px;
      }

      textarea {
        resize: vertical;
        min-height: 68px;
      }

      button {
        appearance: none;
        font: inherit;
        cursor: pointer;
        border-radius: 9px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        padding: 8px 16px;
        transition: background 120ms ease;
      }

      button:hover:not(:disabled) {
        background: var(--surface-hover);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--seal);
        border-color: var(--seal);
        color: #fff;
      }

      button.primary:hover:not(:disabled) {
        filter: brightness(1.08);
        background: var(--seal);
      }

      button.ghost {
        border-color: var(--border);
        color: var(--text-muted);
      }

      .methods {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .method {
        text-align: left;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg);
      }

      .method strong {
        display: block;
        font-size: 18px;
        margin-bottom: 2px;
        letter-spacing: 0.04em;
      }

      .method span {
        font-size: 16px;
        color: var(--text-muted);
      }

      /* ---------- 卦象 ---------- */

      .reading {
        display: grid;
        /* 左栏跟着视口在 300-366px 之间走，不往 300 以下压。
         * 爻行那一格是 34+42+1fr+32+auto 再加四道 12px 的缝，固定部分就吃掉 156px，
         * 留给纳甲（干支+六亲+世应+旬空月破，全是 nowrap）的那一格还得有 140px 出头。
         * 左栏一旦窄过 300，纳甲就撑破格子往右栏探，两个板块会撞在一起。
         * 真正能收放的是右边：--app-pad 收边距、推导图与八宫各自按容器宽度换列。 */
        grid-template-columns: clamp(300px, 26vw, 366px) 1fr;
        gap: clamp(16px, 1.8vw, 26px);
        align-items: start;
      }

      @media (max-width: 760px) {
        .reading {
          grid-template-columns: 1fr;
        }
      }

      /* 右栏（事实、断语、八宫、四卦推导、消长环）比左栏长出一大截，
         滑下去左栏就空一大片。钉住左栏，卦体始终在眼前。
         只在宽且够高的视口上钉：窄屏本来就是单列，矮屏钉了会够不到自己的底。 */
      @media (min-width: 761px) and (min-height: 900px) {
        .reading > :first-child {
          position: sticky;
          top: calc(var(--topbar-h) + 20px);
        }
      }

      .gua-block {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .gua-line {
        display: grid;
        grid-template-columns: 34px 42px 1fr 32px auto;
        align-items: center;
        gap: 12px;
      }

      /* 六神排在爻画左边，依《卜筮全书》「俱从下起至上」自初爻向上转。
         它只说气氛，不参与生克也不改吉凶，所以用淡字，不跟世应用同一种朱砂。 */
      .gua-line .sg {
        font-size: 15px;
        color: var(--text-subtle);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      /* 纳甲一列：干支定五行，六亲定身份，世应定主客。装上了就多出这一列 */
      .gua-line .rel {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .gua-line .rel .ganzhi {
        font-size: 15px;
        color: var(--text-subtle);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .gua-line .rel .qin {
        font-size: 16px;
        color: var(--text);
        white-space: nowrap;
      }

      /* 世爻是我、应爻是对方，用朱砂点区分，不靠文字以免一行挤不下 */
      .gua-line .rel .role {
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border: 1px solid var(--seal);
        color: var(--seal);
        border-radius: 2px;
        white-space: nowrap;
      }

      /* 旬空、月破、入墓是这一爻此刻的处境，不是它的身份，所以小字无框 */
      .gua-line .rel .st {
        font-size: 14px;
        line-height: 1;
        color: var(--text-subtle);
        white-space: nowrap;
      }

      .gua-line .rel .st.po,
      .gua-line .rel .st.tomb {
        color: var(--seal);
      }

      /* 伏神伏在飞神之下，同格并列：小字加虚框，位置是它的，不是飞神的 */
      .gua-line .rel .fu {
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border: 1px dashed var(--text-subtle);
        color: var(--text-subtle);
        border-radius: 2px;
        white-space: nowrap;
      }

      /* 化出之爻标在变卦那一爻上：这一格是本卦动爻变过来的地方，关系名跟着标出来 */
      .gua-line .rel .hu {
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border: 1px solid var(--text-subtle);
        color: var(--text-subtle);
        border-radius: 2px;
        white-space: nowrap;
      }

      /* 只有回头生与回头克用朱砂——《增删卜易》明写了这一个吉、一个凶；
         化泄化耗化比和书上没定吉凶，就跟伏神一样用淡字，别拿颜色替它表态。 */
      .gua-line .rel .hu.hot {
        border-color: var(--seal);
        color: var(--seal);
        font-weight: 600;
      }

      /* 元神忌神仇神是「用神周围那一圈」，与世应、与用神都不是一回事，各用小字描边 */
      .gua-line .rel .role-yuan,
      .gua-line .rel .role-ji,
      .gua-line .rel .role-chou {
        font-size: 14px;
        line-height: 1;
        padding: 1px 3px;
        border: 1px solid var(--text-subtle);
        color: var(--text-subtle);
        border-radius: 2px;
      }

      /* 忌神直克用神，描边加重一点，让它在那一圈里最显眼——它才是真在使坏的那一支 */
      .gua-line .rel .role-ji {
        border-color: var(--seal);
        color: var(--seal);
        font-weight: 600;
      }

      /* 用神是「你所问的这一件事」落在哪一爻，与世应的主客不是一回事，另用实底 */
      .gua-line .rel .role.god {
        background: var(--seal);
        color: var(--surface, #fff);
        font-weight: 600;
      }

      .gua-line .pos {
        font-size: 15px;
        color: var(--text-subtle);
        text-align: right;
      }

      .gua-line .bars {
        display: flex;
        gap: 14px;
        height: 14px;
      }

      .gua-line .bars i {
        display: block;
        flex: 1;
        background: var(--text);
        border-radius: 3px;
        transform-origin: left center;
      }

      /* 逐爻生长：自初爻向上。生长到位后再补一记朱砂辉光，标明「这一爻刚出来」 */
      .reveal .gua-line .bars i {
        animation:
          lineGrow 460ms cubic-bezier(0.25, 0.9, 0.3, 1) both,
          lineGlow 700ms ease-out both;
      }

      @keyframes lineGlow {
        0%,
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
        45% {
          box-shadow: 0 0 12px 1px var(--seal-soft);
        }
      }

      .reveal .gua-line[data-pos='1'] .bars i {
        animation-delay: 60ms;
      }
      .reveal .gua-line[data-pos='2'] .bars i {
        animation-delay: 150ms;
      }
      .reveal .gua-line[data-pos='3'] .bars i {
        animation-delay: 240ms;
      }
      .reveal .gua-line[data-pos='4'] .bars i {
        animation-delay: 330ms;
      }
      .reveal .gua-line[data-pos='5'] .bars i {
        animation-delay: 420ms;
      }
      .reveal .gua-line[data-pos='6'] .bars i {
        animation-delay: 510ms;
      }

      /* 动爻是唯一会变的那一爻，光要比静爻重一档 */
      .reveal .gua-line.moving .bars i {
        animation:
          lineGrow 460ms cubic-bezier(0.25, 0.9, 0.3, 1) both,
          lineGlowMove 860ms ease-out both;
      }

      @keyframes lineGlowMove {
        0%,
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
        40% {
          box-shadow: 0 0 18px 3px var(--seal);
        }
      }

      .verdict.reveal-seal {
        position: relative;
        isolation: isolate;
        animation: sealIn 560ms cubic-bezier(0.2, 1.3, 0.4, 1) both;
        animation-delay: 420ms;
      }

      /* 印落下去的同时洇开一圈墨，像真的盖在纸上 */
      .verdict.reveal-seal::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: inherit;
        background: radial-gradient(circle, var(--seal) 0%, transparent 64%);
        opacity: 0;
        z-index: -1;
        pointer-events: none;
        animation: inkBleed 820ms ease-out 400ms both;
      }

      @keyframes inkBleed {
        0% {
          opacity: 0.42;
          transform: scale(0.5);
        }
        100% {
          opacity: 0;
          transform: scale(1.9);
        }
      }

      .insights .anim-rise:nth-child(1) {
        animation-delay: 380ms;
      }
      .insights .anim-rise:nth-child(2) {
        animation-delay: 470ms;
      }
      .insights .anim-rise:nth-child(3) {
        animation-delay: 560ms;
      }
      .insights .anim-rise:nth-child(4) {
        animation-delay: 650ms;
      }
      .insights .anim-rise:nth-child(5) {
        animation-delay: 740ms;
      }
      .insights .anim-rise:nth-child(6) {
        animation-delay: 830ms;
      }
      .insights .anim-rise:nth-child(7) {
        animation-delay: 920ms;
      }
      .insights .anim-rise:nth-child(8) {
        animation-delay: 1010ms;
      }
      .insights .anim-rise:nth-child(9) {
        animation-delay: 1100ms;
      }
      .insights .anim-rise:nth-child(10) {
        animation-delay: 1190ms;
      }
      .insights .anim-rise:nth-child(n + 11) {
        animation-delay: 1270ms;
      }

      .gua-line.yin .bars {
        gap: 14px;
      }

      .gua-line.moving .bars i {
        background: var(--seal);
      }

      .gua-line .mark {
        font-size: 17px;
        color: var(--seal);
        text-align: center;
      }

      .gua-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .gua-title h3 {
        margin: 0;
        font-size: 27px;
        letter-spacing: 0.1em;
      }

      .gua-title .meta {
        font-size: 16px;
        color: var(--text-muted);
      }

      /* 六冲 / 六合：整卦的结构事实，不是吉凶。描边淡字，与「暗」「冲散」一个路子——
         颜色不替没定下来的事表态，所以这两枚都不进朱砂。 */
      .gua-title .gua-tag {
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--text-subtle);
        border: 1px solid currentColor;
        border-radius: 3px;
        padding: 1px 5px;
        cursor: help;
        opacity: 0.85;
      }

      /* 冲合连线：把初四、二五、三六三对画成跨过卦面的弧。这一层画的是「隔三位相配」
         那条规矩本身——同高去配，六十四卦里一个六冲卦也出不来。 */
      .gua-lines {
        position: relative;
      }

      /* 弧不占卦面的宽度，从右边探出去画在两列之间那道空隙里（.reading 的 gap 是 22px）。
         匀宽度出来是不行的：爻画那格是 1fr，扣掉就短一截，而变卦里「回头生 + 应 + 六亲 +
         干支」那一行本来就占得最满，扣一次就被压到看不见，阴阳都读不出来。
         放进空隙里既不挤卦面，位置也像传统刻本上的旁批，就在那儿批一句「此二支相配」。 */
      .clash-ribbon {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: -22px;
        pointer-events: none;
        overflow: visible;
      }

      /* 冲与合同一支淡线，不分色：这层只说「哪两支配在一起」，不替它们表态吉凶。 */
      .clash-ribbon .clash-arc {
        fill: none;
        stroke: var(--text-subtle);
        stroke-width: 1;
        stroke-linecap: round;
        opacity: 0.6;
      }

      .text-line {
        margin: 6px 0 0;
        font-size: 18px;
        line-height: 1.9;
        color: var(--text);
      }

      /* 彖传是解卦之辞，不是卦本身的原话，压一档以示区别 */
      .text-line .tuan {
        margin: 6px 0;
        padding-left: 10px;
        border-left: 1px solid var(--border-strong);
        color: var(--text-muted);
      }

      .yao-line {
        margin: 10px 0 0;
        padding: 8px 10px;
        border-left: 2px solid var(--seal);
        background: rgba(164, 44, 30, 0.05);
        font-size: 19px;
        line-height: 1.9;
      }

      .yao-line .tag {
        display: block;
        margin-bottom: 2px;
        font-size: 15px;
        letter-spacing: 0.18em;
        color: var(--seal);
      }

      .yao-line em {
        display: block;
        margin-top: 2px;
        font-style: normal;
        font-size: 17px;
        color: var(--text-muted);
      }

      .verdict {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 600;
        letter-spacing: 0.08em;
        background: var(--seal-soft);
        color: var(--seal);
        border: 1px solid var(--seal-soft);
      }

      /* 结论区。原先那句大白话排在右栏第四件，前头压着九行技术事实表，
         后头跟着八宫名单、四卦推导与卦气环，要一路滚到底才撞见——
         恰好是最该第一眼看到的一句，排在信息洪流中段。整块提到两栏之上，
         占满版心：吉凶、缘由、宜忌、提醒一次读完，下面的推导是「凭什么」，
         读不读都在那儿。 */
      .verdict-block {
        margin-top: 16px;
        padding: 18px 20px 16px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 3px solid var(--seal);
      }

      .verdict-lead {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 12px;
      }

      .verdict-mark {
        font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
        font-size: 46px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--seal);
      }

      .verdict-say-short {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }

      .verdict-say {
        margin: 10px 0 0;
        font-size: 19px;
        line-height: 1.85;
        color: var(--text);
      }

      .verdict-on-topic {
        padding-left: 13px;
        border-left: 3px solid var(--jade);
      }

      /* 怎么算出来的：把生克那一层与旺衰那一层都摆出来，免得看的人拿着
         事实表里的「生克小吉」去对不上这个「大吉」，以为算错了。 */
      .verdict-calc {
        margin: 10px 0 0;
        font-size: 16px;
        line-height: 1.75;
        color: var(--text-muted);
      }

      .verdict-picks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }

      .verdict-picks h3 {
        margin: 0 0 6px;
        font-size: 16px;
        letter-spacing: 0.1em;
      }

      .verdict-picks ul {
        margin: 0;
        padding-left: 20px;
        font-size: 17px;
        line-height: 1.85;
      }

      .verdict-picks .good h3 { color: var(--jade); }
      .verdict-picks .bad h3 { color: var(--seal); }

      .verdict-warn {
        margin: 14px 0 0;
        padding: 10px 13px;
        border-radius: 10px;
        background: var(--seal-soft);
        border-left: 3px solid var(--seal);
        font-size: 17px;
        line-height: 1.75;
      }

      .toss-progress {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0 14px;
      }

      .toss-track {
        flex: 1 1 auto;
        height: 8px;
        border-radius: 999px;
        background: var(--surface-muted);
        overflow: hidden;
      }

      .toss-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--seal);
        transition: width 240ms ease;
      }

      .toss-count {
        margin: 0;
        flex: 0 0 auto;
        font-size: 16px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        .toss-fill { transition: none; }
      }

      dl.facts {
        margin: 14px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;

      }

      dl.facts dt {
        color: var(--text-muted);
        white-space: nowrap;
      }

      dl.facts dd {
        margin: 0;
      }

      .insights {
        display: grid;
        gap: 14px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .insights li {
        border-left: 2px solid var(--border-strong);
        padding: 3px 0 3px 16px;
      }

      .insights strong {
        display: block;
        font-size: 17px;
        margin-bottom: 2px;
      }

      .insights span {
        font-size: 17px;
        color: var(--text-muted);
      }

      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
        gap: 12px;
      }

      .cols ul {
        margin: 6px 0 0;
        padding-left: 18px;
        font-size: 17px;
        color: var(--text-muted);
      }

      .cols h3 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.06em;
      }

      .cols .good h3 {
        color: var(--jade);
      }

      .cols .bad h3 {
        color: var(--seal);
      }

      /* ---------- 摇卦 ---------- */

      .toss-stage {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        position: relative;
      }

      /* 台面朱砂光晕：给摇卦一个现场感，压得很淡，只在余光里 */
      .toss-stage::before {
        content: '';
        position: absolute;
        top: 6px;
        left: 50%;
        width: min(300px, 92%);
        height: 120px;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, var(--seal-soft), transparent 68%);
        pointer-events: none;
        animation: tossGlow 3.4s ease-in-out infinite;
      }

      .coins {
        display: flex;
        gap: 14px;
      }

      /* 投影留在桌面不跟着飞，铜钱本身才抛得起来 */
      .coin-slot {
        position: relative;
        width: 52px;
        height: 52px;
      }

      .coin-shadow {
        position: absolute;
        left: 50%;
        bottom: -9px;
        width: 40px;
        height: 9px;
        border-radius: 50%;
        background: var(--text);
        opacity: 0.26;
        filter: blur(2px);
        transform: translateX(-50%);

      .coin {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        background: var(--surface-muted);
        display: grid;
        place-items: center;
        font-size: 19px;
        font-weight: 600;
        color: var(--gold);
        box-shadow: inset 0 0 0 4px var(--surface-muted), inset 0 0 0 5px var(--gold);

      .coin-slot:nth-child(2) .coin,
      .coin-slot:nth-child(2) .coin-shadow {

      .coin-slot:nth-child(3) .coin,

        padding: 9px 6px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        cursor: pointer;
      }

      .gua-cell:hover {
        background: var(--surface-hover);
      }

      .gua-cell[aria-pressed='true'] {
        border-color: var(--seal);
        background: var(--seal-soft);
      }

      .gua-cell .order {
        font-size: 14px;
        color: var(--text-subtle);
      }

      /* 卦库这一格里的卦画是 Unicode 卦符（⚊⚋ 一类）当文字渲染的，
         笔画本身就只有 hairline 粗细，字号一小就糊成一道灰影。
         所以这里比正文字号再放一档，并把字距收窄，六爻仍读作一个卦。 */
      .gua-cell .mini {

        line-height: 1.1;
        margin: 5px 0 4px;
        letter-spacing: -0.5px;

      .hour-grid {

        gap: 10px;
      }

        .hour-grid {

        }
      }

      @media (max-width: 760px) {
        .hour-grid {

        }
      }

      .hour {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 9px 10px;
        background: var(--bg);
      }

      .hour.auspicious {
        border-color: color-mix(in srgb, var(--jade) 45%, transparent);

      .hour.inauspicious {

      .hour.current {

      .hour .nm {

      }

      .hour .tm {

        color: var(--text-subtle);
        white-space: nowrap;
      }

      .hour .god {
        font-size: 16px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .term-list {
        display: grid;

        gap: 6px;
        font-size: 16px;
      }

      .term-list .now {
        color: var(--seal);

      }

      /* ---------- 卦历 ---------- */

      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
      }

      .history-item .main {
        min-width: 0;
      }

      .history-item .q {
        font-size: 17px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .history-item .meta {
        font-size: 15px;
        color: var(--text-subtle);
      }

      .empty {
        color: var(--text-subtle);
        font-size: 17px;
        text-align: center;
        padding: 26px 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* ---------- 免责声明 ---------- */

      .disclaimer {
        margin-top: 8px;
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--seal);
        border-radius: 12px;
        background: var(--surface-muted);
      }

      .disclaimer strong {
        display: block;
        font-size: 17px;
        letter-spacing: 0.04em;
        color: var(--seal);
        margin-bottom: 6px;
      }

      .disclaimer p {
        margin: 0;
        font-size: 16px;
        line-height: 1.8;
        color: var(--text-muted);
      }

      .cadence-hint {
        margin: 12px 0 0;
        font-size: 16px;
        line-height: 1.85;
        color: var(--text-muted);
        padding: 10px 13px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
      }

      .cadence-hint b {
        color: var(--text);
      }

      .cadence {
        margin-top: 14px;
        padding: 11px 14px;
        border-radius: 10px;
        background: var(--surface-muted);
        border-left: 3px solid var(--gold);
        font-size: 17px;
        line-height: 1.8;
      }

      .cadence .next {
        display: block;
        margin-top: 6px;
        font-size: 16px;
        color: var(--text-muted);

      .caution {

        *,

        *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          transition-duration: 1ms !important;

      }
