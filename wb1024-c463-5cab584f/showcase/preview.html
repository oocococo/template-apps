<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<meta content="dark" name="color-scheme">
<title>研发排查工作台 · 单据全链路定位</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a10;--bg2:#0b1119;--panel:#0f1722;--panel2:#111c29;
  --line:#1d2a3b;--line2:#26384e;
  --txt:#e7eef8;--dim:#8a9bb3;--dim2:#64748b;
  --acc:#38bdf8;--acc2:#818cf8;
  --ok:#34d399;--warn:#fbbf24;--err:#f87171;--info:#60a5fa;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html,body{background:var(--bg);color:var(--txt);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 12% -10%,rgba(56,189,248,.10),transparent 60%),
                   radial-gradient(800px 400px at 92% 0%,rgba(129,140,248,.09),transparent 62%),
                   linear-gradient(180deg,#070a10 0%,#080c13 100%);
  background-attachment:fixed;
  min-height:100vh;
}
.app{max-width:1280px;margin:0 auto;padding:22px 20px 40px}

/* ── top bar ── */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(56,189,248,.22),rgba(129,140,248,.18));
  border:1px solid rgba(56,189,248,.35);box-shadow:0 0 24px rgba(56,189,248,.14)}
h1{font-size:19px;letter-spacing:.4px;font-weight:650}
.sub{font-size:12.5px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.chip-demo{color:#a5f3fc;border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.10)}
.chip-ver{color:#c7d2fe;border-color:rgba(129,140,248,.4);background:rgba(129,140,248,.10)}

/* ── scenario bar ── */
.scenariobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;
  padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(15,23,34,.66)}
.scenariobar .lbl{font-size:12px;color:var(--dim2);letter-spacing:.5px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{cursor:pointer;font:inherit;font-size:12.5px;padding:6px 14px;border-radius:8px;
  border:1px solid var(--line2);background:transparent;color:var(--dim);transition:.18s}
.pill:hover{color:var(--txt);border-color:#33506e}
.pill.on{color:#06121b;background:linear-gradient(135deg,#38bdf8,#7dd3fc);border-color:transparent;font-weight:600;
  box-shadow:0 4px 16px rgba(56,189,248,.28)}

/* ── layout ── */
.grid{display:grid;grid-template-columns:386px minmax(0,1fr);gap:0 16px;align-items:start;
  grid-template-areas:"side main" "rules main"}
.grid > aside{grid-area:side}
.grid > .ruleswrap{grid-area:rules}
.grid > .maincol{grid-area:main;min-width:0}
.panel{background:linear-gradient(180deg,rgba(17,28,41,.92),rgba(13,20,30,.92));
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.30)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
.panel-h .cnt{font-family:var(--mono);letter-spacing:0;color:var(--acc);font-size:11.5px}

/* ── query ── */
.qrow{display:flex;gap:8px}
#q{flex:1;min-width:0;background:#080e16;border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;color:var(--txt);font-family:var(--mono);font-size:13px;outline:none;transition:.18s}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
#run{cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:10px 16px;border-radius:9px;border:0;
  color:#04121a;background:linear-gradient(135deg,#38bdf8,#a5f3fc);white-space:nowrap;
  transition:.18s;box-shadow:0 6px 18px rgba(56,189,248,.22)}
#run:hover{filter:brightness(1.07)}
#run:disabled{opacity:.55;cursor:progress}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.quick i{font-style:normal;font-size:11.5px;color:var(--dim2);padding:3px 8px;border-radius:6px;
  border:1px dashed var(--line2);cursor:pointer;transition:.15s}
.quick i:hover{color:var(--acc);border-color:rgba(56,189,248,.5);border-style:solid}
.hint{font-size:11.5px;color:var(--dim2);margin-top:9px;line-height:1.55}

/* ── timeline ── */
.tlbar{height:3px;border-radius:3px;background:#101a26;overflow:hidden;margin-bottom:12px}
.tlbar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#38bdf8,#818cf8);transition:width .35s ease}
.timeline{position:relative;padding-left:4px}
.node{position:relative;display:flex;gap:11px;padding-bottom:15px;opacity:.42;transition:opacity .3s}
.node:last-child{padding-bottom:0}
.node:not(:last-child):before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:1px;background:var(--line2)}
.node.done{opacity:1}
.dot{width:13px;height:13px;border-radius:50%;flex:0 0 13px;margin-top:4px;position:relative;z-index:1;
  background:#1a2738;border:2px solid #2b3f57;transition:.25s}
.node.ok .dot{background:rgba(52,211,153,.22);border-color:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.35)}
.node.warn .dot{background:rgba(251,191,36,.22);border-color:var(--warn);box-shadow:0 0 10px rgba(251,191,36,.35)}
.node.err .dot{background:rgba(248,113,113,.25);border-color:var(--err);box-shadow:0 0 12px rgba(248,113,113,.45);
  animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.42)}55%{box-shadow:0 0 0 7px rgba(248,113,113,0)}}
.nbody{min-width:0;flex:1}
.nrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nrow b{font-size:13px;font-weight:600}
.node.err .nrow b{color:#fecaca}
.cost{font-family:var(--mono);font-size:11.5px;color:var(--dim2);white-space:nowrap}
.node.err .cost{color:var(--err)}
.ndetail{font-size:11.5px;color:var(--dim2);margin-top:2px;word-break:break-word;overflow-wrap:anywhere}

/* ── metrics ── */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.m{background:linear-gradient(180deg,rgba(17,28,41,.92),rgba(12,19,28,.92));
  border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.m .k{font-size:11px;color:var(--dim2);letter-spacing:.4px}
.m .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:2px;letter-spacing:-.4px}
.m .v small{font-size:11.5px;font-weight:400;color:var(--dim2);margin-left:3px;letter-spacing:0}
.m.hot .v{color:var(--err)}
.m.warm .v{color:var(--warn)}
.m.ok .v{color:var(--ok)}

/* ── verdict ── */
.verdict{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;margin-bottom:14px;
  border:1px solid rgba(248,113,113,.34);background:linear-gradient(90deg,rgba(248,113,113,.12),rgba(248,113,113,.02))}
.verdict .vic{font-size:17px;line-height:1.2;margin-top:1px}
.verdict .vt{font-size:11px;letter-spacing:1.2px;color:#fca5a5;text-transform:uppercase}
.verdict .vb{font-size:13.5px;margin-top:3px;color:#f3f4f6}
.verdict .vb code{font-family:var(--mono);font-size:12.5px;color:#fecaca;background:rgba(248,113,113,.12);
  padding:1px 5px;border-radius:4px}

/* ── cards ── */
.cards{display:flex;flex-direction:column;gap:11px}
.card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:rgba(10,16,24,.75)}
.card.lv-high{border-left:3px solid var(--err)}
.card.lv-mid{border-left:3px solid var(--warn)}
.card.lv-low{border-left:3px solid var(--info)}
.ch{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lv{font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:5px}
.lv-high .lv{color:#fecaca;background:rgba(248,113,113,.16)}
.lv-mid .lv{color:#fde68a;background:rgba(251,191,36,.16)}
.lv-low .lv{color:#bfdbfe;background:rgba(96,165,250,.16)}
.ch h3{font-size:14px;font-weight:600;flex:1;min-width:180px}
.conf{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.crow{display:flex;gap:9px;margin-top:9px;font-size:12.8px;line-height:1.65}
.crow em{font-style:normal;flex:0 0 40px;color:var(--dim2);font-size:11.5px;padding-top:1px}
.crow p{color:#cbd5e1;flex:1;min-width:0}
.crow p b{color:#f1f5f9;font-weight:600}
.locus{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.locus code{font-family:var(--mono);font-size:11.5px;color:#a5f3fc;background:rgba(56,189,248,.09);
  border:1px solid rgba(56,189,248,.22);padding:2px 7px;border-radius:5px;
  overflow-wrap:anywhere;word-break:break-word;max-width:100%}

/* ── sql ── */
.sqlp .panel-h button{font:inherit;font-size:11.5px;cursor:pointer;color:var(--acc);background:rgba(56,189,248,.10);
  border:1px solid rgba(56,189,248,.3);border-radius:6px;padding:3px 9px;transition:.15s}
.sqlp .panel-h button:hover{background:rgba(56,189,248,.18)}
.sqlblk{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:9px;background:#070c13}
.sqlblk:last-child{margin-bottom:0}
.sqh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 11px;
  background:rgba(19,31,45,.8);border-bottom:1px solid var(--line)}
.sqh span{font-size:12px;color:#cbd5e1}
.sqh .k{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-left:7px}
.sqh button{font:inherit;font-size:11px;cursor:pointer;color:var(--dim);background:transparent;
  border:1px solid var(--line2);border-radius:5px;padding:2px 8px;transition:.15s}
.sqh button:hover{color:var(--acc);border-color:rgba(56,189,248,.45)}
pre{font-family:var(--mono);font-size:12px;line-height:1.72;padding:11px 13px;overflow:auto;color:#b9cbe0;
  white-space:pre;tab-size:2}
pre .kw{color:#c084fc}.pre-note{color:#fbbf24}

/* ── rules ── */
.rules{display:flex;flex-direction:column}
.rule{display:flex;align-items:center;gap:9px;padding:6px 1px;border-bottom:1px dashed rgba(38,56,78,.55);
  font-size:12px;color:#5d6e85;transition:.25s}
.rule:last-child{border-bottom:0}
.rule i{width:6px;height:6px;border-radius:50%;background:#22303f;flex:0 0 6px;transition:.25s}
.rule.hit{color:#e6edf6}
.rule.hit i{background:var(--err);box-shadow:0 0 9px rgba(248,113,113,.65)}
.rule em{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:.5px;color:#fca5a5;opacity:0;transition:.25s}
.rule.hit em{opacity:1}

/* ── footer ── */
footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim2);line-height:1.75}
footer b{color:var(--dim)}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:#0f2a3f;color:#a5f3fc;border:1px solid rgba(56,189,248,.45);border-radius:9px;
  padding:8px 16px;font-size:12.5px;transition:.22s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){
  .grid{grid-template-columns:minmax(0,1fr);gap:0;
    grid-template-areas:"side" "main" "rules"}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app{padding:16px 13px 32px}
  h1{font-size:17px}
  .sub{font-size:12px;line-height:1.5}
  .brand{min-width:0;align-items:flex-start}
  .brand > div{min-width:0}
  .top .badges{width:100%}
  .qrow{flex-wrap:wrap}
  #q{flex:1 1 190px}
  #run{flex:0 0 auto}
  .quick i{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  /* ══════════ DOM ══════════ */
  var $ = function(id){ return document.getElementById(id); };
  var pillsEl = $("pills"), quickEl = $("quick"), hintEl = $("hint"),
      qEl = $("q"), runEl = $("run"), tlEl = $("timeline"),
      fillEl = $("tlfill"), nodeCntEl = $("nodeCnt"),
      metricsEl = $("metrics"), verdictEl = $("verdict"),
      cardsEl = $("cards"), diagCntEl = $("diagCnt"),
      sqlEl = $("sqlbox"), toastEl = $("toast"),
      rulesEl = $("rules"), ruleCntEl = $("ruleCnt");

  /* 规则库：排查时逐条比对，命中即高亮 */
  var RULES = [
    "分布式锁 TTL 小于业务耗时",
    "回调 update 影响 0 行未告警",
    "MQ 重试间隔小于业务超时",
    "主表与扩展表行数不一致",
    "金额取值字段为空",
    "NULL 参与聚合导致结果被吞",
    "同一业务键存在多条有效单据",
    "检索分片失败未校验",
    "分页按条目数判断末页",
    "排序字段不唯一",
    "状态机停留超阈值",
    "上游回执缺失"
  ];

  var cur = 0, token = 0, timer = null;

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  /* 防御性清洗：所有入 DOM 的 HTML 片段统一过一遍，去掉脚本标签与内联事件 */
  function sanitize(html){
    return String(html)
      .replace(/<\s*\/?\s*(script|iframe|object|embed|link|meta|style|form)\b[^>]*>/gi, "")
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
      .replace(/javascript:/gi, "");
  }
  /* 只高亮 SQL 关键字，正文已是纯文本 */
  function hl(txt){
    var kw = /\b(SELECT|FROM|WHERE|AND|OR|LEFT|RIGHT|JOIN|INNER|GROUP|ORDER|BY|HAVING|LIMIT|AS|COUNT|SUM|DATE|COALESCE|TIMESTAMPDIFF|ON|DESC|ASC|GET|POST)\b/g;
    var s = escapeHtml(txt);
    s = s.replace(kw, function(m){ return '<span class="kw">' + m + '</span>'; });
    return s;
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.className = "on";
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.className = ""; }, 1600);
  }
  function copy(text){
    var done = function(){ toast("已复制到剪贴板"); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){ toast("复制失败，请手动选择"); }
      document.body.removeChild(ta);
    }
  }

  /* ══════════ 渲染：场景 pill ══════════ */
  function renderPills(){
    var h = "";
    for (var i = 0; i < SCENARIOS.length; i++){
      h += '<button class="pill' + (i === cur ? " on" : "") + '" type="button" data-i="' + i + '">' + escapeHtml(SCENARIOS[i].label) + '</button>';
    }
    pillsEl.innerHTML = sanitize(h);
  }
  function renderQuick(){
    var s = SCENARIOS[cur], h = "";
    for (var i = 0; i < SCENARIOS.length; i++){
      if (i === cur) continue;
      h += '<i data-i="' + i + '">' + escapeHtml(SCENARIOS[i].order) + '</i>';
    }
    quickEl.innerHTML = sanitize(h);
    hintEl.textContent = s.hint;
  }

  /* ══════════ 渲染：时间轴骨架 ══════════ */
  function renderSkeleton(){
    var s = SCENARIOS[cur], h = "";
    for (var i = 0; i < s.nodes.length; i++){
      var n = s.nodes[i];
      h += '<div class="node" data-i="' + i + '">' +
             '<div class="dot"></div>' +
             '<div class="nbody">' +
               '<div class="nrow"><b>' + escapeHtml(n.name) + '</b><span class="cost">—</span></div>' +
               '<div class="ndetail">等待中</div>' +
             '</div>' +
           '</div>';
    }
    tlEl.innerHTML = sanitize(h);
    nodeCntEl.textContent = "0 / " + s.nodes.length;
    fillEl.style.width = "0%";
  }

  function renderRules(){
    var h = "";
    for (var i = 0; i < RULES.length; i++){
      h += '<div class="rule" data-r="' + i + '"><i></i><span>' + escapeHtml(RULES[i]) + '</span><em>命中</em></div>';
    }
    rulesEl.innerHTML = sanitize(h);
    ruleCntEl.textContent = RULES.length + " 条 · 待命中";
  }
  function markRules(){
    var hits = SCENARIOS[cur].hitRules;
    for (var i = 0; i < hits.length; i++){
      var el = rulesEl.querySelector('.rule[data-r="' + hits[i] + '"]');
      if (el) el.className = "rule hit";
    }
    ruleCntEl.textContent = RULES.length + " 条 · 命中 " + hits.length;
  }

  function setNode(i, n){
    var el = tlEl.querySelector('.node[data-i="' + i + '"]');
    if (!el) return;
    el.className = "node done " + n.state;
    el.querySelector(".cost").textContent = n.t === "—" ? n.cost : n.cost;
    el.querySelector(".ndetail").textContent = n.t === "—" ? n.detail : (n.t + " · " + n.detail);
  }

  /* ══════════ 渲染：指标 / 结论 / 卡片 / SQL ══════════ */
  function renderMetrics(){
    var s = SCENARIOS[cur];
    metricsEl.innerHTML = sanitize(
      '<div class="m"><div class="k">全链路总耗时</div><div class="v">' + escapeHtml(s.total) + '</div></div>' +
      '<div class="m warm"><div class="k">最慢节点</div><div class="v">' + escapeHtml(s.slowest) + '</div></div>' +
      '<div class="m hot"><div class="k">异常节点</div><div class="v">' + s.bad + '<small>个</small></div></div>' +
      '<div class="m ok"><div class="k">规则命中</div><div class="v">' + escapeHtml(s.hits) + '</div></div>');
  }
  function renderVerdict(){
    var s = SCENARIOS[cur];
    verdictEl.innerHTML = sanitize('<div class="vic">⚠️</div><div><div class="vt">一句话根因</div><div class="vb">' + s.verdict + '</div></div>');
    verdictEl.style.display = "flex";
  }
  function renderCards(){
    var s = SCENARIOS[cur], h = "";
    for (var i = 0; i < s.cards.length; i++){
      var c = s.cards[i];
      var locus = "";
      for (var j = 0; j < c.locus.length; j++) locus += '<code>' + escapeHtml(c.locus[j]) + '</code>';
      h += '<article class="card lv-' + c.lv + '">' +
             '<div class="ch">' +
               '<span class="lv">' + (c.lv === "high" ? "高危" : c.lv === "mid" ? "中危" : "提示") + '</span>' +
               '<h3>' + escapeHtml(c.title) + '</h3>' +
               '<span class="conf">' + escapeHtml(c.conf) + '</span>' +
             '</div>' +
             '<div class="crow"><em>现象</em><p>' + c.symptom + '</p></div>' +
             '<div class="crow"><em>根因</em><p>' + c.cause + '</p></div>' +
             '<div class="crow"><em>处置</em><p>' + c.fix + '</p></div>' +
             '<div class="locus">' + locus + '</div>' +
           '</article>';
    }
    cardsEl.innerHTML = sanitize(h);
  }
  function renderSql(){
    var s = SCENARIOS[cur], h = "";
    for (var i = 0; i < s.sql.length; i++){
      var b = s.sql[i];
      h += '<div class="sqlblk">' +
             '<div class="sqh"><span>' + (i + 1) + '. ' + escapeHtml(b.title) +
               '<span class="k">' + escapeHtml(b.k) + '</span></span>' +
               '<button type="button" data-copy="' + i + '">复制</button>' +
             '</div>' +
             '<pre>' + hl(b.body) + '</pre>' +
           '</div>';
    }
    sqlEl.innerHTML = sanitize(h);
  }
  function renderEmpty(){
    metricsEl.innerHTML = sanitize("");
    verdictEl.style.display = "none";
    cardsEl.innerHTML = sanitize('<div style="color:#64748b;font-size:12.5px;padding:6px 2px">点击「开始排查」，按链路顺序还原并输出诊断结论。</div>');
    diagCntEl.textContent = "待排查";
    sqlEl.innerHTML = sanitize('<div style="color:#64748b;font-size:12.5px;padding:6px 2px">排查完成后按命中的可疑点生成对应 SQL。</div>');
  }

  /* ══════════ 排查主流程 ══════════ */
  function run(){
    var s = SCENARIOS[cur];
    token++;
    var my = token;
    if (timer) { clearTimeout(timer); timer = null; }

    renderSkeleton();
    renderRules();
    renderEmpty();
    runEl.disabled = true;
    runEl.textContent = "排查中…";
    diagCntEl.textContent = "运行中";

    var i = 0;
    function step(){
      if (my !== token) return;
      if (i >= s.nodes.length){
        runEl.disabled = false;
        runEl.textContent = "开始排查";
        renderMetrics();
        setTimeout(function(){
          if (my !== token) return;
          renderVerdict();
          renderCards();
          renderSql();
          markRules();
          diagCntEl.textContent = s.cards.length + " 条 · " + s.bad + " 个异常节点";
        }, 180);
        return;
      }
      setNode(i, s.nodes[i]);
      i++;
      nodeCntEl.textContent = i + " / " + s.nodes.length;
      fillEl.style.width = Math.round(i / s.nodes.length * 100) + "%";
      timer = setTimeout(step, i === s.nodes.length ? 300 : 230);
    }
    timer = setTimeout(step, 140);
  }

  /* ══════════ 事件 ══════════ */
  pillsEl.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".pill") : null;
    if (!b) return;
    cur = parseInt(b.getAttribute("data-i"), 10);
    qEl.value = SCENARIOS[cur].order;
    renderPills(); renderQuick();
    run();
  });
  quickEl.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("i") : null;
    if (!b) return;
    cur = parseInt(b.getAttribute("data-i"), 10);
    qEl.value = SCENARIOS[cur].order;
    renderPills(); renderQuick();
    run();
  });
  runEl.addEventListener("click", run);
  qEl.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.keyCode === 13) run(); });

  sqlEl.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-copy]") : null;
    if (!b) return;
    var idx = parseInt(b.getAttribute("data-copy"), 10);
    copy(SCENARIOS[cur].sql[idx].body);
    b.textContent = "已复制";
    setTimeout(function(){ b.textContent = "复制"; }, 1400);
  });
  $("copyAll").addEventListener("click", function(){
    var s = SCENARIOS[cur], parts = [];
    for (var i = 0; i < s.sql.length; i++){
      parts.push("-- " + (i + 1) + ". " + s.sql[i].title + "\n" + s.sql[i].body);
    }
    copy(parts.join("\n\n"));
  });

  /* ══════════ 初始化 ══════════ */
  /* 支持 ?s=1 / ?s=2 / ?s=3 直达某个演练场景，方便分享与截图 */
  var qm = location.search.match(/[?&]s=(\d+)/);
  if (qm){
    var k = parseInt(qm[1], 10) - 1;
    if (SCENARIOS[k]) cur = k;
  }
  renderPills();
  renderQuick();
  renderSkeleton();
  renderRules();
  renderEmpty();
  qEl.value = SCENARIOS[cur].order;
  setTimeout(run, 260);
})();
</script>
