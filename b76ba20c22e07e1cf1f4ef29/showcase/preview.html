<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>矛盾速解台</title><style>
:root{
  --bg:#f6f8f7; --panel:#ffffff; --line:#e3e9e6; --line2:#eef2f0;
  --ink:#16241f; --ink2:#4a5b55; --ink3:#7d8d87;
  --acc:#0f7b6c; --acc-s:#e6f4f0; --acc-d:#0a5a50;
  --warn:#b4590b; --warn-s:#fdf1e3;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

/* ── 顶栏 ── */
.hd{padding:26px 0 14px}
.hd h1{margin:0;font-size:25px;letter-spacing:.3px;font-weight:700}
.hd h1 span{color:var(--acc)}
.hd p{margin:6px 0 0;color:var(--ink2);font-size:13.5px}
.src{margin-top:10px;font-size:12.5px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.src b{color:var(--ink2);font-weight:600}

nav{position:sticky;top:0;z-index:30;background:rgba(246,248,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:14px -16px 0;padding:0 16px}
nav .in{max-width:1080px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 13px;font:inherit;font-size:14px;color:var(--ink3);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

.tab{display:none;padding-top:20px}
.tab.on{display:block}

/* ── 示例快捷 ── */
.ex{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex .lb{font-size:12.5px;color:var(--ink3);flex:none}
.ex button{appearance:none;border:1px solid var(--line);background:#fbfdfc;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.ex button:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-s)}

/* ── 选择区 ── */
.pair{display:grid;grid-template-columns:1fr 44px 1fr;gap:12px;align-items:start}
@media(max-width:760px){.pair{grid-template-columns:1fr;gap:14px}.swap{justify-self:start}}
.pcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.pcol h3{margin:0 0 2px;font-size:14.5px;display:flex;align-items:center;gap:7px}
.pcol h3 i{font-style:normal;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.pcol.up h3 i{background:var(--acc-s);color:var(--acc)}
.pcol.dn h3 i{background:var(--warn-s);color:var(--warn)}
.sum{margin:2px 0 10px;font-size:12.5px;color:var(--ink3);min-height:20px}
.sum b{color:var(--ink);font-weight:600}
.swap{margin-top:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.swap:hover{border-color:var(--acc);color:var(--acc)}

.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;background:#fbfdfc;color:var(--ink);outline:none}
.search:focus{border-color:var(--acc);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 4px}
.chips button{appearance:none;border:1px solid var(--line);background:#fbfdfc;border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:6px;margin-top:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.grid button{appearance:none;text-align:left;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.4;display:flex;gap:6px}
.grid button:hover{border-color:var(--acc);background:var(--acc-s)}
.grid button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid button.on em{color:rgba(255,255,255,.85)}
.grid button em{font-style:normal;color:var(--ink3);font-size:11.5px;flex:none;min-width:16px}
.grid button.hide{display:none}

/* ── 结果 ── */
.res{margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.rhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rhd h2{margin:0;font-size:17px}
.rhd .meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.acts button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.note{margin-top:12px;border-left:3px solid var(--acc);background:var(--acc-s);padding:10px 12px;border-radius:0 9px 9px 0;font-size:13px;color:var(--ink2)}
.note.w{border-left-color:var(--warn);background:var(--warn-s)}

.pr{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:#fff}
.pr .t{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pr .rk{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acc-s);color:var(--acc);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pr .rk.r1{background:var(--acc);color:#fff}
.pr .nm{font-size:15.5px;font-weight:700}
.pr .en{font-size:12px;color:var(--ink3)}
.pr .hot{margin-left:auto;font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.pr .d{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}
.pr ul{margin:8px 0 0;padding-left:0;list-style:none}
.pr ul li{font-size:13px;color:var(--ink2);padding:3px 0 3px 20px;position:relative}
.pr ul li::before{content:"";position:absolute;left:6px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.pr .q{margin-top:9px;font-size:13px;color:var(--acc-d);background:var(--acc-s);border-radius:8px;padding:7px 11px}
.pr .sub{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
.pr .sub button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;color:var(--ink3);cursor:pointer}
.pr .sub button:hover{border-color:var(--acc);color:var(--acc)}
.rv{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.rv.on{display:block}
.rv p{margin:0 0 7px;font-size:12.5px;color:var(--ink3)}
.rvc{display:flex;flex-wrap:wrap;gap:5px}
.rvc span{font-size:12px;background:#f4f7f6;border:1px solid var(--line2);border-radius:7px;padding:2px 8px;color:var(--ink2);cursor:pointer}
.rvc span:hover{border-color:var(--acc);color:var(--acc)}
.rvc span.more{background:none;border:none;color:var(--ink3);cursor:default}

/* ── 表格 ── */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12.5px;color:var(--ink3);font-weight:600;background:#fafcfb;position:sticky;top:0}
td a{color:var(--acc);text-decoration:none;cursor:pointer}
.tblwrap{max-height:none;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}

/* ── 统计 ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
.stat b{display:block;font-size:22px;color:var(--acc);line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink3)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:118px 1fr 46px;gap:9px;align-items:center;font-size:12.5px;cursor:pointer}
.bar:hover .bl{background:var(--acc)}
.bar .bn{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:16px;background:#f0f4f3;border-radius:5px;overflow:hidden}
.bar .bl{display:block;height:100%;background:#9fcfc4;border-radius:5px}
.bar .bv{text-align:right;color:var(--ink3)}

/* ── 其它 ── */
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:13.5px;border:1px dashed var(--line);border-radius:12px;background:#fff}
.ft{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(18px);background:#16241f;color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.lst40{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.mini{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;cursor:pointer}
.mini:hover{border-color:var(--acc)}
.mini .t{display:flex;align-items:baseline;gap:7px}
.mini .n{font-weight:700;font-size:14.5px}
.mini .e{font-size:11.5px;color:var(--ink3)}
.mini .f{margin-left:auto;font-size:11px;color:var(--ink3)}
.mini .d{margin-top:5px;font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style></head><body><div id="app"></div><script>document.getElementById("app").innerHTML = "\n<div class=\"wrap\">\n\n<div class=\"hd\">\n  <h1>矛盾速解台 · <span>TRIZ 技术矛盾矩阵</span></h1>\n  <p>选定「想改善的参数」与「被牵连恶化的参数」，直接调出经典矛盾矩阵推荐的发明原理，附中英对照释义、子条目与套用提问。</p>\n  <div class=\"src\">\n    <span>📐</span>\n    <div>\n      <b>数据来源：</b>39 项通用工程参数、40 条发明原理、39×39 矛盾矩阵（Altshuller 经典版）。矩阵取自两个独立公开数据集（GitHub <code>contradictions-api</code> 与 npm <code>triz-mcp</code>），二者在全部 <b>1248</b> 个非空格上逐格一致；抽样格已与公开权威表格比对。原理释义为英文原文直译，未作增删。\n    </div>\n  </div>\n</div>\n\n<nav><div class=\"in\">\n  <button class=\"on\" data-t=\"solve\">矛盾求解</button>\n  <button data-t=\"prin\">40 条原理</button>\n  <button data-t=\"para\">39 项参数</button>\n  <button data-t=\"stat\">数据概览</button>\n  <button data-t=\"fav\">我的收藏 <em id=\"favN\" style=\"font-style:normal\"></em></button>\n</div></nav>\n\n<!-- ══ 求解 ══ -->\n<div class=\"tab on\" id=\"t-solve\">\n  <div class=\"ex\" id=\"ex\"></div>\n  <div class=\"pair\">\n    <div class=\"pcol up\">\n      <h3><i>改善</i>想要提升的参数</h3>\n      <div class=\"sum\" id=\"sumUp\">未选择</div>\n      <input class=\"search\" id=\"qUp\" placeholder=\"搜索参数，如：重量、速度、可靠性\">\n      <div class=\"chips\" id=\"gUp\"></div>\n      <div class=\"grid\" id=\"grUp\"></div>\n    </div>\n    <button class=\"swap\" id=\"swap\" title=\"交换改善与恶化（矩阵非对称，结果会不同）\">⇄</button>\n    <div class=\"pcol dn\">\n      <h3><i>恶化</i>因此被拖累的参数</h3>\n      <div class=\"sum\" id=\"sumDn\">未选择</div>\n      <input class=\"search\" id=\"qDn\" placeholder=\"搜索参数，如：强度、复杂性、能量损失\">\n      <div class=\"chips\" id=\"gDn\"></div>\n      <div class=\"grid\" id=\"grDn\"></div>\n    </div>\n  </div>\n  <div class=\"res\" id=\"res\"></div>\n</div>\n\n<!-- ══ 原理 ══ -->\n<div class=\"tab\" id=\"t-prin\">\n  <input class=\"search\" id=\"qPrin\" placeholder=\"搜索原理名称或释义，如：分割、反馈、复合材料\">\n  <div style=\"margin:10px 0 14px; font-size:12.5px; color:var(--ink3)\">点开任一条可查看子条目，以及它在矩阵中被推荐于哪些矛盾组合。</div>\n  <div class=\"lst40\" id=\"lst40\"></div>\n</div>\n\n<!-- ══ 参数 ══ -->\n<div class=\"tab\" id=\"t-para\">\n  <input class=\"search\" id=\"qPara\" placeholder=\"搜索参数中文名或英文名\">\n  <div style=\"margin:10px 0 14px; font-size:12.5px; color:var(--ink3)\">点击行内的「设为改善 / 设为恶化」可直接带入求解。</div>\n  <div class=\"tblwrap\"><table id=\"tblPara\"><thead><tr><th style=\"width:44px\">#</th><th>中文名</th><th>English</th><th>类别</th><th style=\"width:150px\">操作</th></tr></thead><tbody></tbody></table></div>\n</div>\n\n<!-- ══ 概览 ══ -->\n<div class=\"tab\" id=\"t-stat\">\n  <div class=\"stats\" id=\"stats\"></div>\n  <div class=\"card\"><h2 style=\"margin:0 0 4px; font-size:16px\">40 条原理在矩阵中的推荐次数</h2>\n  <p style=\"margin:0 0 14px; font-size:12.5px; color:var(--ink3)\">统计口径：对 1248 个非空矩阵格、共 4203 次推荐计数（同一格内出现多次计多次）。点击可展开该条原理详情。</p>\n  <div class=\"bars\" id=\"bars\"></div></div>\n  <div class=\"card\"><h2 style=\"margin:0 0 8px; font-size:16px\">关于矩阵</h2>\n  <div style=\"font-size:13.5px; color:var(--ink2)\">\n    <p style=\"margin:0 0 8px\">矩阵共 39×39＝1521 格，其中 1248 格给出推荐原理，其余为空。行代表欲改善的参数，列代表随之恶化的参数；矩阵不对称，A—B 与 B—A 的推荐结果通常不同，可用「⇄」直接对照。</p>\n    <p style=\"margin:0 0 8px\">对角线（改善与恶化为同一参数）属于物理矛盾，经典矛盾矩阵不给出推荐，此时应改用分离原理（时间分离、空间分离、条件分离、系统级别分离）处理。</p>\n    <p style=\"margin:0\">推荐序号按 Altshuller 原始表内的先后排列，代表历史上该组合下被优先采用的原理顺序，仅作求解起点，不替代工程判断。</p>\n  </div></div>\n</div>\n\n<!-- ══ 收藏 ══ -->\n<div class=\"tab\" id=\"t-fav\">\n  <div id=\"favBox\"></div>\n</div>\n\n<div class=\"ft\">\n  矛盾速解台 · 示例体验：收藏仅保存在当前页面；安装后保存到应用数据库。\n</div>\n</div>\n<div class=\"toast\" id=\"toast\"></div>\n\n";

/* ══ 39 项通用工程参数 ══ */
var PARAMS=[
[1,"运动物体的重量","Weight of moving object","物理"],
[2,"静止物体的重量","Weight of stationary object","物理"],
[3,"运动物体的长度","Length of moving object","几何"],

[28,"测量精度","Measurement accuracy","精度"],

/* ══ 40 条发明原理（释义依英文原文直译） ══ */
var PRIN=[
[1,"分割","Segmentation","把物体分成相互独立的部分，或提高它的分割、碎片化程度。",["把物体分成独立的部分。","使物体易于拆卸。","提高物体的分割或碎片化程度。"],"它能不能拆成模块？拆了以后能不能更容易换、更容易修？"],
[2,"抽取","Taking Out","从物体中分离出造成干扰的部分或属性，或只把必要的那部分单独取出来。",["从物体中分离出「干扰」的部分或属性。","只从物体中提取必要的部分或属性。"],"真正起作用的只有哪一部分？碍事的那部分能不能单独拿掉？"],
[3,"局部质量","Local Quality","把物体从均匀结构改造成不均匀结构，让每一部分都承担有用功能。",["物体或其外部环境由均匀结构转为不均匀结构。","物体的不同部分承担不同功能。","把物体的每一部分都放在最有利于它工作的条件下。"],"非得整件一模一样吗？关键部位能不能单独加强或单独处理？"],
[4,"非对称性","Asymmetry","用不对称形状替代对称形状，以改善功能。",["用不对称形状替代对称形状。","若物体本已不对称，进一步提高其不对称程度。"],"对称是不是只是习惯？打破对称能腾出什么空间？"],
[5,"合并","Consolidation","在空间上把同类或相邻操作的物体合到一起，或在时间上把同类、相邻的操作合并进行。",["在空间上合并同类物体，或合并为相邻操作而设的物体。","在时间上合并同类或相邻的操作。"],"哪些部件、哪些工序可以并到一起、并行做掉？"],

  writeHash();
  var h='<div class="card"><div class="rhd"><div><h2>'+esc(PNAME[up])+' ↑ &nbsp;/&nbsp; '+esc(PNAME[dn])+' ↓</h2>'+
    '<div class="meta">改善 '+paramLabel(up)+'（'+PFULL[up][2]+'） · 恶化 '+paramLabel(dn)+'（'+PFULL[dn][2]+'）</div></div>'+
    '<div class="acts"><button id="bSwap2">⇄ 交换对照</button><button id="bFav">'+((up&&dn&&isFav(favKey()))?"★ 已收藏":"☆ 收藏此矛盾")+'</button><button id="bLink">复制求解链接</button><button id="bCopy">复制文字结果</button></div></div>';
  if(!ps){
    h+='<div class="note w">该组合在经典矩阵中为空——没有给出推荐原理。可以：① 换一个更贴近工程实际的恶化参数；② 用「⇄」看看反向组合是否有解；③ 直接用 40 条原理逐条过一遍（见效慢但覆盖面广）。</div>';
  }else{
    h+='<div class="note">矩阵推荐 '+ps.length+' 条原理，按原始表中的先后顺序排列——顺序即历史上该组合下被优先采用的先后，建议从前两条开始试。</div></div>';
    h+=ps.map(function(id,i){
      var p=PR[id];
      return '<div class="pr"><div class="t"><span class="rk'+(i===0?' r1':'')+'">'+(i+1)+'</span>'+
        '<span class="nm">'+p[0]+'. '+esc(p[1])+'</span><span class="en">'+esc(p[2])+'</span>'+
        '<span class="hot">矩阵中出现 '+FREQ[id]+' 次</span></div>'+
        '<p class="d">'+esc(p[3])+'</p>'+
        (p[4].length?'<ul>'+p[4].map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul>':'')+
        '<div class="q">套用提问：'+esc(p[5])+'</div>'+
        '<div class="sub"><button data-rv="'+id+'">看它在哪些矛盾组合中被推荐 ▾</button></div>'+
        '<div class="rv" id="rv'+id+'"></div></div>';
    }).join("");
    box.innerHTML=h;
    box.querySelectorAll("[data-rv]").forEach(function(b){
      b.onclick=function(){
        var id=+b.dataset.rv,d=document.getElementById("rv"+id),on=d.classList.toggle("on");
        b.textContent=on?"收起 ▴":"看它在哪些矛盾组合中被推荐 ▾";
        if(on&&!d.innerHTML){
          var list=PAIRS[id]||[],rev=CELLS[dn+"-"+up]||[];
          var html='<p>这条原理在矩阵中共被推荐于 '+list.length+' 个参数组合，下面列出前 '+Math.min(24,list.length)+' 个；点任一条可直接跳到那一组。</p><div class="rvc">'+
            list.slice(0,24).map(function(c){return '<span data-u="'+c[0]+'" data-w="'+c[1]+'">'+c[0]+'↑／'+c[1]+'↓ '+esc(PNAME[c[0]])+'／'+esc(PNAME[c[1]])+'</span>'}).join("")+
            (list.length>24?'<span class="more">…等共 '+list.length+' 个</span>':'')+'</div>';
          if(rev.length&&rev.indexOf(id)<0)html+='<p style="margin-top:9px">反向组合（'+esc(PNAME[dn])+'↑／'+esc(PNAME[up])+'↓）推荐的是 '+rev.map(function(x){return x+'. '+PR[x][1]}).join("、")+'，与本向不同——这正是矩阵不对称的地方。</p>';
          d.innerHTML=html;
          d.querySelectorAll("span[data-u]").forEach(function(s){
            s.onclick=function(){up=+s.dataset.u;dn=+s.dataset.w;syncSel();renderResult();window.scrollTo({top:document.getElementById("res").offsetTop-70,behavior:"smooth"})};
          });
        }
      };
    });
  }
  if(!ps){box.innerHTML=h+'</div>';}
  document.getElementById("bCopy").onclick=function(){copyResult(ps)};
  document.getElementById("bLink").onclick=function(){var u=shareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){toast("链接已复制，打开即见这组矛盾的解")},function(){toast("链接："+u)});
    else toast("链接："+u);};
  document.getElementById("bSwap2").onclick=function(){var t=up;up=dn;dn=t;syncSel();renderResult()};
  document.getElementById("bFav").onclick=toggleFav;
}
function copyResult(ps){
  var t="TRIZ 技术矛盾：改善「"+paramLabel(up)+"」，恶化「"+paramLabel(dn)+"」\n";
  if(!ps){t+="经典矩阵未给出推荐原理。\n";}
  else{
    t+="推荐原理（按优先顺序）：\n";
    ps.forEach(function(id,i){var p=PR[id];t+=(i+1)+". "+p[0]+" "+p[1]+"（"+p[2]+"）："+p[3]+"\n";
      p[4].forEach(function(r){t+="   · "+r+"\n"});
      t+="   套用提问："+p[5]+"\n";});
  }
  t+="\n在线查看这组矛盾："+shareUrl();
  t+="\n（由「矛盾速解台」生成，矩阵为 Altshuller 经典 39×39 版）";
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("已复制结果")},function(){fallback(t)})}
  else fallback(t);
  function fallback(s){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("已复制结果")}catch(e){toast("复制失败，请手动选取")}a.remove()}
}

/* ══ 40 条原理总表 ══ */
function renderPrin(){
  var kw=document.getElementById("qPrin").value.trim().toLowerCase();
  var arr=PRIN.slice();
  if(kw)arr=arr.filter(function(p){return (p[1]+p[2]+p[3]+p[4].join("")+p[5]+p[0]).toLowerCase().indexOf(kw)>=0});
  var box=document.getElementById("lst40");
  if(!arr.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">没有匹配的原理</div>';return}
  box.innerHTML=arr.map(function(p){
    return '<div class="mini" data-p="'+p[0]+'"><div class="t"><span class="n">'+p[0]+'. '+esc(p[1])+'</span><span class="e">'+esc(p[2])+'</span>'+
      '<span class="f">'+FREQ[p[0]]+' 次</span></div><div class="d">'+esc(p[3])+'</div></div>';
  }).join("");
  box.querySelectorAll(".mini").forEach(function(m){
    m.onclick=function(){var id=+m.dataset.p,p=PR[id];openPrin(id);};
  });
}
function openPrin(id){
  var p=PR[id],list=PAIRS[id]||[];
  var ov=document.createElement("div"); ov.className="overlay";
  ov.style.cssText="position:fixed;inset:0;background:rgba(12,22,19,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px";
  ov.innerHTML='<div style="background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:20px 22px">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h3 style="margin:0;font-size:18px">'+p[0]+'. '+esc(p[1])+' <span style="font-size:12.5px;color:var(--ink3);font-weight:400">'+esc(p[2])+'</span></h3>'+
    '<div style="font-size:12.5px;color:var(--ink3);margin-top:4px">在矩阵中被推荐 '+FREQ[p[0]]+' 次，覆盖 '+list.length+' 个参数组合</div></div>'+
    '<button id="pc" style="border:0;background:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1">✕</button></div>'+
    '<p style="margin:14px 0 0;font-size:14px;color:var(--ink2)">'+esc(p[3])+'</p>'+
    (p[4].length?'<ul style="margin:10px 0 0;padding-left:0;list-style:none">'+p[4].map(function(r){return '<li style="font-size:13.5px;color:var(--ink2);padding:3px 0 3px 18px;position:relative"><span style="position:absolute;left:4px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block"></span>'+esc(r)+'</li>'}).join("")+'</ul>':'')+
    '<div style="margin-top:12px;font-size:13.5px;color:var(--acc-d);background:var(--acc-s);border-radius:9px;padding:8px 12px">套用提问：'+esc(p[5])+'</div>'+
    '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><div style="font-size:12.5px;color:var(--ink3);margin-bottom:7px">被推荐的组合（共 '+list.length+' 个，点任一条直接求解）</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+list.slice(0,60).map(function(c){return '<span data-u="'+c[0]+'" data-w="'+c[1]+'" style="font-size:12px;background:#f4f7f6;border:1px solid var(--line2);border-radius:7px;padding:2px 8px;color:var(--ink2);cursor:pointer">'+c[0]+'↑／'+c[1]+'↓</span>'}).join("")+
    (list.length>60?'<span style="font-size:12px;color:var(--ink3)">…等共 '+list.length+' 个</span>':'')+'</div></div></div>';
  document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)ov.remove()};
  document.getElementById("pc").onclick=function(){ov.remove()};
  ov.querySelectorAll("span[data-u]").forEach(function(s){
    s.onclick=function(){up=+s.dataset.u;dn=+s.dataset.w;ov.remove();go("solve");syncSel();renderResult();window.scrollTo({top:document.getElementById("res").offsetTop-70,behavior:"smooth"})};
  });
}

/* ══ 参数表 ══ */
function renderPara(){
  var kw=document.getElementById("qPara").value.trim().toLowerCase();
  var rows=PARAMS.filter(function(p){return !kw||p[1].toLowerCase().indexOf(kw)>=0||p[2].toLowerCase().indexOf(kw)>=0||String(p[0])===kw});
  document.querySelector("#tblPara tbody").innerHTML=rows.map(function(p){
    return '<tr><td>'+p[0]+'</td><td>'+p[1]+'</td><td style="color:var(--ink3)">'+p[2]+'</td><td><span style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink3)">'+p[3]+'</span></td>'+
      '<td><a data-u="'+p[0]+'">设为改善</a> · <a data-w="'+p[0]+'">设为恶化</a></td></tr>';
  }).join("")||'<tr><td colspan="5" style="text-align:center;color:var(--ink3)">没有匹配的参数</td></tr>';
  document.querySelectorAll("#tblPara a[data-u]").forEach(function(a){a.onclick=function(){up=+a.dataset.u;go("solve");syncSel();renderResult();window.scrollTo({top:0,behavior:"smooth"})}});
  document.querySelectorAll("#tblPara a[data-w]").forEach(function(a){a.onclick=function(){dn=+a.dataset.w;go("solve");syncSel();renderResult();window.scrollTo({top:0,behavior:"smooth"})}});
}

/* ══ 概览 ══ */
function renderStat(){
  document.getElementById("stats").innerHTML=[
    ["39","项通用工程参数"],["40","条发明原理"],["1521","个矩阵格"],
    ["1248","个有推荐的格"],[TOTREC,"次原理推荐"],["4203→","总推荐次数"]
  ].slice(0,5).map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  var order=PRIN.slice().sort(function(a,b){return (FREQ[b[0]]||0)-(FREQ[a[0]]||0)});
  document.getElementById("bars").innerHTML=order.map(function(p){
    var f=FREQ[p[0]]||0;
    return '<div class="bar" data-p="'+p[0]+'"><span class="bn">'+p[0]+'. '+esc(p[1])+'</span>'+
      '<span class="bt"><span class="bl" style="width:'+(f/MAXF*100).toFixed(1)+'%"></span></span><span class="bv">'+f+'</span></div>';
  }).join("");
  document.querySelectorAll("#bars .bar").forEach(function(b){b.onclick=function(){openPrin(+b.dataset.p)}});
}

/* ══ 收藏 ══ */
function renderFav(){
  document.getElementById("favN").textContent=favs.length?"("+favs.length+")":"";
  var box=document.getElementById("favBox");
  if(!favs.length){box.innerHTML='<div class="empty">还没有收藏。求解一个矛盾后点「☆ 收藏此矛盾」，就会存在这里（仅保存在当前预览页面）。</div>';return}
  box.innerHTML=favs.map(function(f){
    var ps=CELLS[f.k]||[];
    return '<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">'+
      '<div><h3 style="margin:0;font-size:15.5px">'+esc(PNAME[f.u])+' ↑ ／ '+esc(PNAME[f.d])+' ↓</h3>'+
      '<div style="font-size:12.5px;color:var(--ink3);margin-top:3px">'+(ps.length?ps.map(function(x){return x+'. '+PR[x][1]}).join("　"):"经典矩阵未给出推荐原理")+'</div></div>'+
      '<div class="acts"><button data-o="'+f.k+'">打开</button><button data-r="'+f.k+'">移除</button></div></div></div>';
  }).join("");
  box.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){var k=b.dataset.o.split("-");up=+k[0];dn=+k[1];go("solve");syncSel();renderResult();window.scrollTo({top:0,behavior:"smooth"})}});
  box.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){favs=favs.filter(function(f){return f.k!==b.dataset.r});saveFav();renderFav();renderResult()}});
}

/* ══ 导航 ══ */
function go(t){
  [].forEach.call(document.querySelectorAll("nav button"),function(b){b.classList.toggle("on",b.dataset.t===t)});
  [].forEach.call(document.querySelectorAll(".tab"),function(d){d.classList.toggle("on",d.id==="t-"+t)});
}
[].forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){go(b.dataset.t)}});
