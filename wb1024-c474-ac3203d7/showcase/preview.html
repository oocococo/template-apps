<title data-page-node-id="YyhfUCm8lR2ZMVADy89fk7" data-pnid-children="gjcqGXJ8EUUVVr9XduXTPg">舒尔特方格训练</title>
<style data-page-node-id="RrjJs0tc3PhfNnTUSQfeeN" data-pnid-children="REfLBcadA94UiWYM3afZRq">
  :root{
    --bg:#0f1420;
    --bg2:#161d2c;
    --card:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.14);
    --txt:#eaf0ff;
    --sub:#9aa8c7;
    --accent:#4f8cff;
    --accent2:#39d3b3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 700px at 15% -10%,#1d2a45 0%,var(--bg) 55%) ,var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  img{max-width:100%;height:auto;}
  .wrap{width:100%;max-width:720px;}

  /* ---------- 首页 ---------- */
  .home{
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));
    border:1px solid var(--line);
    border-radius:24px;
    padding:34px 30px 30px;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:conic-gradient(from 210deg,#4f8cff,#39d3b3,#ffb020,#4f8cff);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#0f1420;font-size:19px;
    box-shadow:0 6px 18px rgba(79,140,255,.35);
  }
  h1{font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:.5px;}
  .tagline{color:var(--sub);margin:10px 0 26px;font-size:14px;line-height:1.7;}

  .field{margin-bottom:26px;}
  .field-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .field-label{font-size:15px;font-weight:600;}
  .field-value{font-size:14px;color:var(--accent2);font-weight:700;letter-spacing:.5px;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(255,255,255,.16) var(--fill,50%));
    outline:none;margin:6px 0 4px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:#fff;border:4px solid var(--accent);cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15);}
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--accent);cursor:pointer;
  }
  .ticks{display:flex;justify-content:space-between;margin-top:8px;}
  .ticks span{font-size:12px;color:var(--sub);transition:.2s;}
  .ticks span.on{color:#fff;font-weight:700;}

  .start{
    width:100%;margin-top:8px;padding:16px;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(90deg,var(--accent),#6f6bff);
    color:#fff;font-size:17px;font-weight:700;letter-spacing:2px;
    box-shadow:0 12px 28px rgba(79,140,255,.35);transition:transform .15s,box-shadow .15s;
  }
  .start:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(79,140,255,.45);}
  .start:active{transform:translateY(0);}
  .tips{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);color:var(--sub);font-size:13px;line-height:1.9;}
  .tips b{color:#cfe0ff;font-weight:600;}

  /* ---------- 游戏页 ---------- */
  .game{display:none;}
  .game.on{display:block;}
  .home.off{display:none;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 16px;margin-bottom:16px;backdrop-filter:blur(8px);
  }
  .back{
    background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);
    padding:9px 16px;border-radius:10px;cursor:pointer;font-size:14px;transition:.2s;
  }
  .back:hover{background:rgba(255,255,255,.16);}
  .timer{
    font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;letter-spacing:1px;
    color:#fff;text-shadow:0 0 18px rgba(79,140,255,.5);
  }
  .meta{color:var(--sub);font-size:12.5px;white-space:nowrap;}
  .meta span{margin-left:10px;}

  .board-area{position:relative;}
  .board{
    display:grid;gap:8px;padding:14px;border-radius:18px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    margin:0 auto;max-width:620px;
  }
  .g5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .g6{grid-template-columns:repeat(6,minmax(0,1fr));}
  .g7{grid-template-columns:repeat(7,minmax(0,1fr));}
  .cell{
    position:relative;aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;
  }
  .cell .inner{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .cell .face{
    position:absolute;inset:0;border-radius:10px;
    background:var(--c,#1b2436);
    border:1px solid rgba(255,255,255,.1);
    transition:transform .18s ease,filter .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
  }
  .cell .num{
    position:relative;z-index:2;font-weight:700;color:#e9f0ff;
    font-size:clamp(15px,3.4vw,24px);line-height:1;
  }
  .cell:hover .face{transform:scale(1.07);border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,140,255,.55),0 10px 22px rgba(0,0,0,.45);}
  .board.irr .cell:hover .face{filter:brightness(1.3);}
  .cell.done .face{background:linear-gradient(135deg,#1f6f5c,#134a3f);border-color:var(--accent2);box-shadow:0 0 0 1px rgba(57,211,179,.6);filter:none;}
  .cell.done .num{color:#a9f5e3;}
  .cell.wrong{animation:shake .38s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-3px);}}

  /* 中/重度干扰：不规则形状 */
  .board.irr .cell .face{border-radius:0;border:none;clip-path:var(--clip,none);}

  /* 重度：整个方格缓慢旋转，方向随机 */
  .board.spin .cell .inner{
    animation:rot var(--dur,9s) linear infinite;
    animation-direction:var(--dir,normal);
  }
  @keyframes rot{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  .actions{display:flex;justify-content:center;gap:12px;margin-top:18px;}
  .btn{
    padding:12px 26px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);transition:.2s;
  }
  .btn:hover{background:rgba(255,255,255,.16);}
  .btn.primary{background:linear-gradient(90deg,var(--accent),#6f6bff);border:none;color:#fff;box-shadow:0 10px 24px rgba(79,140,255,.32);}

  .next-hint{margin-top:14px;text-align:center;color:var(--sub);font-size:13.5px;}
  .next-hint b{color:var(--accent2);font-size:16px;}

  /* 暂停遮罩 + 弹窗 */
  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,14,22,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:18px;z-index:20;
  }
  .overlay.on{display:flex;}
  .modal{
    width:min(86%,320px);background:linear-gradient(180deg,#1d2740,#161d2c);
    border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .modal h3{margin:0 0 8px;font-size:19px;}
  .modal p{margin:0 0 20px;color:var(--sub);font-size:13.5px;line-height:1.7;}
  .modal .row{display:flex;gap:10px;justify-content:center;}
  .modal .btn{flex:1;padding:11px 8px;font-size:14px;}

  .result{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,11,18,.6);backdrop-filter:blur(10px);z-index:40;padding:20px;
  }
  .result.on{display:flex;}
  .result .modal{width:min(90%,340px);}

  @media (max-width:640px){
    .home{padding:26px 20px 22px;}
    .board{gap:6px;padding:10px;}
    .topbar{padding:10px 12px;}
    .timer{font-size:22px;}
    .meta{font-size:11.5px;}
  }
</style>
</head>

  var HUES = [352,18,42,86,150,190,214,262,300];

  var $ = function(id){ return document.getElementById(id); };
  var home=$('home'), game=$('game'), board=$('board'), timerEl=$('timer'), metaEl=$('meta');
  var nextNumEl=$('nextNum'), overlay=$('overlay'), result=$('result');

  var cfg = { diff:0, aid:0, dis:0 };
  var state = null;

  /* ---------- 滑块联动 ---------- */
  function syncRange(input){
    var min=+input.min, max=+input.max, v=+input.value;
    var pct = max===min ? 0 : (v-min)/(max-min)*100;
    input.style.setProperty('--fill', pct+'%');
  }
  function markTicks(box, idx){
    var spans = box.querySelectorAll('span');
    for(var i=0;i<spans.length;i++){
      spans[i].classList.toggle('on', +spans[i].getAttribute('data-i')===idx);
    }
  }
  function bindSlider(id, ticksId, valId, labels, key){
    var input=$(id), box=$(ticksId), val=$(valId);
    function upd(){
      var v=+input.value;
      cfg[key]=v;
      syncRange(input);
      markTicks(box,v);
      val.textContent = labels[v];
    }
    input.addEventListener('input',upd);
    upd();
  }
  bindSlider('diff','diffTicks','diffVal',['初级','中级','高级'],'diff');
  bindSlider('aid','aidTicks','aidVal',['关闭','开启'],'aid');
  bindSlider('dis','disTicks','disVal',DISTURB,'dis');

  /* ---------- 游戏逻辑 ---------- */
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
  function randColor(){
    var h = HUES[Math.floor(Math.random()*HUES.length)];
    return 'hsl('+h+',45%,42%)';
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function fmt(ms){
    var t = ms/1000;
    var m = Math.floor(t/60);
    var s = t - m*60;
    return pad(m)+':'+(s<10?'0':'')+s.toFixed(1);
  }

  function buildBoard(){
    var d = DIFFS[cfg.diff];
    var nums = [];
    for(var i=1;i<=d.total;i++) nums.push(i);
    shuffle(nums);

    board.className = 'board g'+d.size;
    if(cfg.dis>=2) board.classList.add('irr');
    if(cfg.dis>=3) board.classList.add('spin');
    board.innerHTML='';

    for(var k=0;k<nums.length;k++){
      var c=document.createElement('div');
      c.className='cell';
      c.setAttribute('data-n', nums[k]);
      if(cfg.dis>=1){
        c.style.setProperty('--c', randColor());
      }
      if(cfg.dis>=2){
        c.style.setProperty('--clip', SHAPES[Math.floor(Math.random()*SHAPES.length)]);
      }
      if(cfg.dis>=3){
        var dur = 7 + Math.random()*6;                       // 7~13 秒一圈，缓慢
        c.style.setProperty('--dur', dur.toFixed(2)+'s');
        c.style.setProperty('--dir', Math.random()<0.5 ? 'normal' : 'reverse'); // 旋转方向随机
      }
      var inner=document.createElement('div');
      inner.className='inner';
      var face=document.createElement('div');
      face.className='face';
      var s=document.createElement('span');
      s.className='num';
      s.textContent = nums[k];
      inner.appendChild(face);
      inner.appendChild(s);
      c.appendChild(inner);
      board.appendChild(c);
    }
  }

  function startGame(){
    buildBoard();
    var d = DIFFS[cfg.diff];
    state = {
      next:1, total:d.total, start:Date.now(), elapsed:0, timer:null, paused:false, over:false
    };
    nextNumEl.textContent='1';
    metaEl.textContent = '';
    var m1=document.createElement('span'); m1.textContent = d.name+' · '+d.size+'×'+d.size;
    var m2=document.createElement('span'); m2.textContent = cfg.aid?'辅助开':'辅助关';
    var m3=document.createElement('span'); m3.textContent = DISTURB[cfg.dis]+'干扰';
    metaEl.appendChild(m1); metaEl.appendChild(m2); metaEl.appendChild(m3);
    home.classList.add('off');
    game.classList.add('on');
    result.classList.remove('on');
    overlay.classList.remove('on');
    state.timer = setInterval(tick, 100);
    tick();
  }
  function tick(){
    if(!state || state.paused || state.over) return;
    timerEl.textContent = fmt(Date.now()-state.start+state.elapsed);
  }
  function elapsedNow(){
    return Date.now()-state.start+state.elapsed;
  }
  function pause(){
    if(!state || state.paused || state.over) return;
    state.paused = true;
    state.elapsed = elapsedNow();
    clearInterval(state.timer);
    timerEl.textContent = fmt(state.elapsed);
    overlay.classList.add('on');
  }
  function resume(){
    if(!state) return;
    state.paused = false;
    state.start = Date.now();
    overlay.classList.remove('on');
    state.timer = setInterval(tick,100);
  }
  function endGame(){
    if(!state) return;
    clearInterval(state.timer);
    state.over = true;
    game.classList.remove('on');
    home.classList.remove('off');
    overlay.classList.remove('on');
    result.classList.remove('on');
    state = null;
  }
  function finish(){
    clearInterval(state.timer);
    var total = elapsedNow();
    state.over = true;
    $('rTime').textContent = fmt(total);
    $('rLevel').textContent = DIFFS[cfg.diff].name+' · '+DIFFS[cfg.diff].size+'×'+DIFFS[cfg.diff].size+' · '+DISTURB[cfg.dis]+'干扰';
    result.classList.add('on');
  }

  function onCellClick(e){
    if(!state || state.paused || state.over) return;
    var cell = e.target.closest ? e.target.closest('.cell') : null;
    if(!cell) return;
    var n = +cell.getAttribute('data-n');
    if(n === state.next){
      if(cfg.aid){
        cell.classList.add('done');
      }
      state.next++;
      nextNumEl.textContent = state.next<=state.total ? state.next : '完成';
      if(state.next > state.total){ finish(); }
    }else{
      cell.classList.add('wrong');
      setTimeout(function(){ cell.classList.remove('wrong'); },400);
    }
  }

  board.addEventListener('click', onCellClick);

  /* ---------- 事件绑定 ---------- */
  $('startBtn').addEventListener('click', startGame);
  $('backBtn').addEventListener('click', endGame);
  $('pauseBtn').addEventListener('click', pause);
  $('resumeBtn').addEventListener('click', resume);
  $('endBtn').addEventListener('click', endGame);
  $('againBtn').addEventListener('click', startGame);
  $('homeBtn').addEventListener('click', endGame);
})();
</script>
</body>
</html>
