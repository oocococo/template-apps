<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产管理系统</title><style>/* ==========================================================================
 * 资产管理系统 · 界面样式（浅色 / 现代后台 / 简洁大气）
 * 配色参考现代 SaaS 后台（indigo 主色），支持抽屉与弹窗，无外部依赖
 * ========================================================================== */
:root {
  --indigo: #4f46e5;
  --indigo-weak: #eef2ff;
  --indigo-hover: #4338ca;
  --sky: #0ea5e9;
  --green: #10b981;
  --green-weak: #ecfdf5;
  --amber: #f59e0b;
  --amber-weak: #fff7ed;
  --red: #ef4444;
  --red-weak: #fef2f2;
  --bg: #f5f6fb;
  --panel: #ffffff;
  --line: #ebedf3;
  --line-strong: #dfe3ec;
  --text: #1e2430;
  --text-2: #5b6577;
  --text-3: #94a0b3;
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 9px;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  --sh-2: 0 10px 30px rgba(16, 24, 40, .10);
  --sh-3: 0 24px 60px rgba(16, 24, 40, .18);
  --mono: "Consolas", "Courier New", monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; outline: none; }
a { color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #cdd4e2; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #b3bccc; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ------------------------------- 顶栏 ------------------------------- */
.app-header {
  position: sticky; top: 0; z-index: 60; height: 60px; display: flex; align-items: center; gap: 16px;
  padding: 0 22px; background: #fff; border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(16, 24, 40, .02);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 196px; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  font-weight: 800; letter-spacing: .5px; font-size: 15px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed); box-shadow: 0 4px 12px rgba(79, 70, 229, .4);
}
.brand-text b { display: block; font-size: 15.5px; letter-spacing: .3px; }
.brand-text span { display: block; font-size: 10.5px; color: var(--text-3); letter-spacing: 2px; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search { position: relative; }
.search input {
  width: 320px; height: 38px; padding: 0 12px 0 36px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: #f7f8fc; transition: .15s;
}
.search input:focus { border-color: var(--indigo); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
.search .ico { position: absolute; left: 12px; top: 11px; color: var(--text-3); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--indigo-weak); color: var(--indigo); font-weight: 700; font-size: 13px;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff;
  color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: .15s;
}
.icon-btn:hover { border-color: var(--indigo); color: var(--indigo); }

.app-body { display: flex; align-items: flex-start; min-height: calc(100vh - 60px); }

/* ------------------------------- 侧栏 ------------------------------- */
.sidebar {
  position: sticky; top: 60px; flex: 0 0 232px; width: 232px; height: calc(100vh - 60px);
  background: #fcfcfe; border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto;
  transition: flex-basis .22s ease, width .22s ease, padding .22s ease, border-width .22s ease;
}
body.sidebar-collapsed .sidebar {
  flex-basis: 0; width: 0; padding-left: 0; padding-right: 0; border-right-width: 0; overflow: hidden;
}
#sidebarToggle svg { transition: transform .22s ease; }
body.sidebar-collapsed #sidebarToggle svg { transform: rotate(180deg); }
.side-title { font-size: 11px; color: var(--text-3); letter-spacing: 1px; padding: 14px 10px 6px; font-weight: 700; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 11px; border-radius: 10px;
  color: var(--text-2); cursor: pointer; font-size: 13.5px; transition: .12s; position: relative;
}
.nav-item:hover { background: #f1f2f8; color: var(--text); }
.nav-item.active { background: var(--indigo-weak); color: var(--indigo); font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--indigo); }
.nav-item .bm { margin-left: auto; font-size: 11px; background: #eef0f6; color: var(--text-2); border-radius: 20px; padding: 1px 8px; font-weight: 400; }
.nav-item.active .bm { background: #fff; color: var(--indigo); }
.tag-type { margin-left: auto; font-size: 10.5px; padding: 1px 7px; border-radius: 6px; background: #eef0f6; color: var(--text-3); }
.nav-sep { height: 1px; background: var(--line); margin: 12px 6px; }
.tdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* ------------------------------- 主区 ------------------------------- */
.main { flex: 1; min-width: 0; padding: 22px 26px 44px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat-card {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 16px 18px 16px 20px; display: flex; align-items: center; gap: 15px; box-shadow: var(--sh-1); overflow: hidden;
}
.stat-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--indigo)); }
.stat-ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--cw, var(--indigo-weak)); color: var(--c, var(--indigo)); }
.stat-num { font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: .5px; }
.stat-label { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.toolbar-right { margin-left: auto; display: flex; gap: 8px; }
.toolbar select, .toolbar input[type=text] {
  height: 36px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 11px; background: #fff; transition: .15s;
}
.toolbar select:focus, .toolbar input[type=text]:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }

.btn {
  height: 36px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff;
  color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; transition: .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--indigo); color: var(--indigo); }
.btn.primary { background: linear-gradient(135deg, #4f46e5, #6366f1); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(79, 70, 229, .3); }
.btn.primary:hover { background: linear-gradient(135deg, #4338ca, #4f46e5); color: #fff; }
.btn.danger { color: var(--red); border-color: #f4cfcf; }
.btn.danger:hover { background: var(--red-weak); border-color: var(--red); color: var(--red); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.bulk-bar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--indigo-weak); border-bottom: 1px solid #dbe2ff; color: var(--indigo); font-size: 13px; }
.bulk-bar .sp { margin-left: auto; display: flex; gap: 8px; }
.hidden { display: none !important; }

/* ------------------------------- 表格 ------------------------------- */
.table-wrap { overflow: auto; max-height: calc(100vh - 230px); }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1120px; }
table.grid thead th {
  position: sticky; top: 0; z-index: 3; background: #f8f9fc; text-align: left; font-weight: 600;
  font-size: 12px; color: var(--text-2); padding: 11px 13px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid thead th.sortable { cursor: pointer; }
table.grid thead th.sortable:hover { color: var(--indigo); }
table.grid thead th .th-title { display: inline-block; vertical-align: middle; }
table.grid thead th .th-filter {
  border: 0; background: none; cursor: pointer; color: var(--text-3); padding: 2px; margin-left: 5px;
  border-radius: 6px; display: inline-grid; place-items: center; vertical-align: middle; opacity: .55; transition: .12s;
}
table.grid thead th .th-filter:hover { color: var(--indigo); background: var(--indigo-weak); opacity: 1; }
table.grid thead th.filtered .th-filter { color: var(--indigo); opacity: 1; }
table.grid thead th.sorted { color: var(--indigo); }
table.grid thead th .sort-arr { font-weight: 700; }

.col-menu { position: fixed; z-index: 320; background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-3); padding: 6px; animation: pop .14s ease; }
.cm-title { font-size: 11px; color: var(--text-3); font-weight: 700; letter-spacing: .5px; padding: 6px 8px 3px; }
.cm-sep { height: 1px; background: var(--line); margin: 5px 2px; }
.cm-item { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-2); }
.cm-item:hover { background: #f1f2f8; color: var(--text); }
.cm-item.on { background: var(--indigo-weak); color: var(--indigo); font-weight: 600; }
.cm-item.danger { color: var(--red); }
.cm-item.danger:hover { background: var(--red-weak); }
.cm-input { display: flex; gap: 6px; padding: 4px 6px 6px; }
.cm-input input { flex: 1; height: 32px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 9px; min-width: 0; }
.cm-input input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
.cm-input button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--indigo); background: var(--indigo); color: #fff; cursor: pointer; font-size: 12.5px; }

.filter-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: #fcfcfe; }
.filter-chips.hidden { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--indigo-weak); color: var(--indigo); font-size: 12.5px; font-weight: 600; padding: 4px 6px 4px 11px; border-radius: 20px; }
.chip button { border: 0; background: none; color: var(--indigo); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; opacity: .7; }
.chip button:hover { opacity: 1; }
.chip-clear { border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: 12.5px; padding: 4px 6px; }
.chip-clear:hover { color: var(--red); }
table.grid tbody td { padding: 10px 13px; border-bottom: 1px solid #f3f5f9; font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.grid tbody tr:hover { background: #f7f8ff; }
table.grid tbody tr.selected { background: var(--indigo-weak); }
td.col-check, th.col-check { width: 44px; text-align: center; }
td.col-op, th.col-op { width: 168px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--indigo); cursor: pointer; }

.cell-name { display: flex; align-items: center; gap: 9px; }
.ico-box { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: #f1f2f8; color: var(--text-2); font-size: 10.5px; }
.mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--text-2); }
.link { color: var(--indigo); cursor: pointer; font-weight: 500; }
.link:hover { text-decoration: underline; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 12px; line-height: 19px; font-weight: 500; }
.badge.green { background: var(--green-weak); color: #047857; }
.badge.amber { background: var(--amber-weak); color: #b45309; }
.badge.red { background: var(--red-weak); color: #dc2626; }
.badge.gray { background: #f1f2f8; color: var(--text-2); }
.badge.blue { background: var(--indigo-weak); color: var(--indigo); }
.badge.sky { background: #e0f2fe; color: #0369a1; }

.pwd-wrap { display: flex; align-items: center; gap: 6px; }
.pwd-text { font-family: Consolas, monospace; letter-spacing: 1px; }
.icon-link { border: 0; background: none; cursor: pointer; color: var(--text-3); padding: 3px; border-radius: 6px; display: inline-grid; place-items: center; }
.icon-link:hover { color: var(--indigo); background: var(--indigo-weak); }

.op-btns { display: flex; gap: 5px; }
.op-btns .btn.sm { padding: 0 9px; }

.file-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; background: #f1f2f8; color: var(--text-2); font-size: 12px; cursor: pointer; border: 1px solid transparent; }
.file-chip:hover { background: var(--indigo-weak); color: var(--indigo); border-color: #d6defb; }
.file-chip.none { cursor: default; color: var(--text-3); }
.file-chip.none:hover { background: #f1f2f8; color: var(--text-3); }

.pager { display: flex; align-items: center; gap: 10px; padding: 13px 16px; }
.pager .total { color: var(--text-3); font-size: 12.5px; }
.pager .pages { margin-left: auto; display: flex; gap: 5px; }
.page-btn { min-width: 32px; height: 32px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; font-size: 13px; color: var(--text-2); }
.page-btn:hover { border-color: var(--indigo); color: var(--indigo); }
.page-btn.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.page-btn:disabled { opacity: .4; cursor: not-allowed; }

.empty { padding: 64px 20px; text-align: center; color: var(--text-3); }
.empty svg { opacity: .5; }

/* ----------------------------- 数据表切换 ----------------------------- */
.table-switch { position: relative; }
.ts-btn { height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text); transition: .15s; max-width: 280px; }
.ts-btn:hover { border-color: var(--indigo); }
.ts-btn .nm { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.dropdown { position: absolute; top: 46px; left: 0; min-width: 300px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-2); padding: 6px; z-index: 70; }
.dd-item { display: flex; align-items: center; gap: 9px; padding: 10px 11px; border-radius: 9px; cursor: pointer; font-size: 13.5px; }
.dd-item:hover { background: #f1f2f8; }
.dd-item.active { background: var(--indigo-weak); color: var(--indigo); font-weight: 600; }
.dd-item .tag { margin-left: auto; font-size: 11px; color: var(--text-3); background: #f1f2f8; padding: 1px 8px; border-radius: 20px; }
.dd-sep { height: 1px; background: var(--line); margin: 5px 4px; }

/* ------------------------------- 弹窗/抽屉 ------------------------------- */
.mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .42); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-3); width: 720px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; animation: pop .18s ease; }
@keyframes pop { from { transform: translateY(10px) scale(.99); opacity: .5; } to { transform: none; opacity: 1; } }
.modal.wide { width: 1000px; }
.modal.narrow { width: 460px; }
.modal-head { display: flex; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.modal-head .mh-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--indigo-weak); color: var(--indigo); margin-right: 12px; }
.modal-head h3 { font-size: 16.5px; font-weight: 700; }
.modal-head .sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 20px 22px; overflow: auto; }
.modal-foot { display: flex; gap: 9px; justify-content: flex-end; padding: 15px 22px; border-top: 1px solid var(--line); background: #fcfcfe; border-radius: 0 0 var(--r-lg) var(--r-lg); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100%; background: #fff; box-shadow: -12px 0 40px rgba(16, 24, 40, .18); z-index: 210; display: flex; flex-direction: column; animation: slideL .22s ease; }
.drawer.wide { width: 760px; }
@keyframes slideL { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); z-index: 209; animation: fade .15s ease; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.drawer-head .mh-ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.drawer-head h3 { font-size: 16.5px; font-weight: 700; }
.drawer-head .sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.drawer-head .x { margin-left: auto; }
.drawer-body { padding: 20px 22px; overflow: auto; flex: 1; }
.drawer-foot { display: flex; gap: 9px; justify-content: flex-end; padding: 15px 22px; border-top: 1px solid var(--line); background: #fcfcfe; }

/* ------------------------------- 表单 ------------------------------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 18px; }
.form-item { display: flex; flex-direction: column; gap: 6px; }
.form-item.full { grid-column: 1 / -1; }
.form-item label { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.form-item label .req { color: var(--red); margin-left: 2px; }
.form-item input, .form-item select, .form-item textarea { height: 38px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 11px; background: #fff; transition: .15s; width: 100%; }
.form-item textarea { height: 78px; padding: 9px 11px; resize: vertical; line-height: 1.55; }
.form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
.form-item .hint { font-size: 11.5px; color: var(--text-3); }
.section-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 16px 4px; margin-bottom: 16px; background: #fcfcfe; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ""; width: 3px; height: 14px; background: var(--indigo); border-radius: 2px; }
.kv { display: flex; gap: 10px; font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--text-3); width: 96px; flex: none; }
.kv .v { color: var(--text); word-break: break-all; }

/* ------------------------------- 附件 ------------------------------- */
.files-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.files-head .sp { margin-left: auto; display: flex; gap: 8px; }
.file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 13px; }
.file-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px; display: flex; gap: 11px; align-items: flex-start; background: #fff; transition: .15s; }
.file-card:hover { border-color: var(--indigo); box-shadow: var(--sh-1); }
.file-thumb { width: 50px; height: 50px; border-radius: 10px; flex: none; display: grid; place-items: center; background: #f1f2f8; color: var(--text-2); font-size: 11px; overflow: hidden; }
.file-thumb img { width: 100%; height: 100%; object-fit: cover; }
.file-meta { min-width: 0; flex: 1; }
.file-meta .nm { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.file-meta .nm:hover { color: var(--indigo); }
.file-meta .sz { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
.file-ops { display: flex; gap: 3px; margin-top: 7px; }
.drop-zone { border: 1.6px dashed var(--line-strong); border-radius: var(--r-md); padding: 24px; text-align: center; color: var(--text-3); background: #fcfcfe; cursor: pointer; transition: .15s; margin-bottom: 16px; }
.drop-zone:hover, .drop-zone.over { border-color: var(--indigo); background: var(--indigo-weak); color: var(--indigo); }
.preview-body { padding: 0; background: #f8fafc; }
.preview-img { display: block; max-width: 100%; max-height: 64vh; margin: 0 auto; background: #fff; }
.preview-txt { margin: 0; padding: 18px 22px; font-family: Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.75; color: #27364a; white-space: pre-wrap; word-break: break-all; max-height: 64vh; overflow: auto; }
.preview-edit { display: block; width: 100%; min-height: 56vh; margin: 0; padding: 18px 22px; border: 0; resize: vertical; font-family: Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.75; color: #27364a; background: #fff; outline: none; box-sizing: border-box; }

/* ------------------------------- 字段管理 ------------------------------- */
.field-row { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: 9px; background: #fff; }
.field-row .nm { font-weight: 600; font-size: 13.5px; }
.field-row .ty { font-size: 11.5px; color: var(--text-3); background: #f1f2f8; padding: 2px 9px; border-radius: 20px; }
.field-row .lock { font-size: 11px; color: var(--text-3); }
.field-row .lock.custom { color: var(--indigo); }
.field-row .sp { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ------------------------------- Toast ------------------------------- */
.toast-box { position: fixed; top: 72px; right: 22px; z-index: 500; display: flex; flex-direction: column; gap: 10px; }
.toast { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--indigo); border-radius: 12px; box-shadow: var(--sh-2); padding: 12px 17px; min-width: 250px; max-width: 400px; display: flex; align-items: center; gap: 11px; font-size: 13.5px; animation: slideIn .18s ease; }
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
@keyframes slideIn { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 1280px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .search input { width: 220px; }
}

/* ==========================================================================
   新增功能样式（追加，不改动以上任何原有规则）
   ========================================================================== */

/* ------------------------- 维保 / 到期预警 ------------------------- */
.exp-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 20px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
.exp-pill.warn { background: #fffbeb; color: #b45309; border-color: #fde68a; }
.exp-pill.danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.exp-pill:hover { filter: brightness(.97); }
.exp-pill.on { box-shadow: 0 0 0 2px rgba(79, 70, 229, .25); }
.exp-pill.hidden { display: none; }

.cell-exp { font-weight: 600; }
.cell-exp.expired { color: #dc2626; }
.cell-exp.soon { color: #d97706; }
.bm.warn { background: #fef3c7; color: #b45309; }
.bm.danger { background: #fee2e2; color: #b91c1c; }
tr.row-expired > td { background: #fff7f7; }

/* ------------------------- 资产标签（含条码） ------------------------- */
.label-preview { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 2px; }
.label-card { width: 300px; height: 180px; box-sizing: border-box; padding: 12px 14px; border: 1px dashed #cbd5e1;
  border-radius: 8px; background: #fff; color: #111827; display: flex; flex-direction: column; overflow: hidden; }
.label-card .lb-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px;
  color: #6b7280; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
.label-card .lb-sys { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 210px; }
.label-card .lb-brand { font-weight: 700; letter-spacing: .5px; color: #4f46e5; }
.label-card .lb-name { font-size: 15px; font-weight: 700; margin: 7px 0 4px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.label-card .lb-bar { text-align: center; margin: 2px 0 0; }
.label-card .lb-bar svg { max-width: 100%; height: 40px; }
.label-card .lb-code { text-align: center; font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
  letter-spacing: 2px; font-weight: 700; }
.label-card .lb-meta { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: #374151; }
.label-card .lb-meta span { display: inline-flex; gap: 4px; }
.label-card .lb-meta i { font-style: normal; color: #9ca3af; }

/* 打印专用容器：屏幕上完全不显示 */
.print-area { display: none; }

@media print {
  @page { margin: 8mm; }
  body.printing { background: #fff !important; }
  body.printing .app-header,
  body.printing .app-body,
  body.printing .toast-box,
  body.printing .mask,
  body.printing .drawer-mask,
  body.printing .drawer { display: none !important; }
  body.printing .print-area { display: flex !important; flex-wrap: wrap; gap: 4mm; }
  body.printing .print-area .label-card { border: 1px solid #d1d5db !important;
    page-break-inside: avoid; break-inside: avoid; }
}


/* ============ 字段设置：必填复选框 & 新增列必填 ============ */
.field-row input[type="checkbox"] { width: 15px; height: 15px; flex: none; accent-color: var(--indigo); cursor: pointer; }
.form-item label input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--indigo); vertical-align: -2px; margin-right: 4px; }

/* ============ 硬件更换单：IP 关联回填提示条 ============ */
.rel-tip { margin-top: 12px; padding: 10px 13px; border-radius: var(--r-md); font-size: 12.5px;
  line-height: 1.6; border: 1px dashed var(--line-strong); color: var(--text-2); background: #fafbfd; }
.rel-tip.hidden { display: none; }
.rel-tip b { color: var(--text); font-weight: 700; }
.rel-tip.loading { border-color: #93c5fd; background: #eff6ff; color: #1d4ed8; }
.rel-tip.ok { border-color: #6ee7b7; border-style: solid; background: #ecfdf5; color: #047857; }
.rel-tip.miss { border-color: #fcd34d; border-style: solid; background: #fffbeb; color: #b45309; }

/* ==========================================================================
 * 机柜图表（机房表视图）—— 与系统共用同一套设计令牌
 * ========================================================================== */
#rackView { display: flex; flex-direction: column; gap: 12px; height: 100%; }
#rackView.hidden { display: none; }

.rk-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rk-top .rk-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--text); }
.rk-top .rk-title .tdot { width: 12px; height: 12px; border-radius: 4px; }
.rk-top .sp { flex: 1; }

.rk-body { display: grid; grid-template-columns: 232px 1fr; gap: 12px; align-items: start; }

/* 左侧：机房信息 + 统计 + 未关联设备 + 图例 */
.rk-side { display: flex; flex-direction: column; gap: 12px; }
.rk-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--sh-1); padding: 13px 14px; }
.rk-card h4 { margin: 0 0 9px; font-size: 12px; color: var(--text-3); font-weight: 600; letter-spacing: .4px; }
.rk-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rk-stat { background: #f8f9fc; border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; }
.rk-stat b { display: block; font-size: 17px; color: var(--text); font-family: var(--mono); line-height: 1.25; }
.rk-stat span { font-size: 11px; color: var(--text-3); }
.rk-stat.hi b { color: var(--indigo); }
.rk-unlink { max-height: 210px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.rk-unlink .ui { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: var(--r-md); background: #fff; }
.rk-unlink .ui .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.rk-unlink .ui .ip { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.rk-unlink .ui button { flex: none; }
/* 原机柜已被删除的设备：琥珀色描边 + 标签，提示需要重新上架 */
.rk-unlink .ui.orphan { border-color: #fcd34d; background: #fffbeb; }
.rk-unlink .ui .tag-warn { margin-left: 6px; padding: 1px 5px; border-radius: 4px; font-style: normal;
  font-size: 10px; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; vertical-align: 1px; }
.rk-unlink .ui.orphan .ip { color: #b45309; }
.rk-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--text-2); }
.rk-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* 主区：机房画布 */
.rk-stage-wrap { position: relative; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--sh-1); overflow: hidden; height: 640px; }
.rk-stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.rk-stage.panning { cursor: grabbing; }
.rk-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.rk-roomname { position: absolute; left: 14px; top: 10px; font-size: 12px; color: var(--text-3);
  background: rgba(255,255,255,.82); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); pointer-events: none; }
.rk-zctl { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px; z-index: 6; }
.rk-zctl button { width: 30px; height: 30px; border: 1px solid var(--line); background: #fff; border-radius: var(--r-sm);
  color: var(--text-2); cursor: pointer; font-size: 14px; line-height: 1; }
.rk-zctl button:hover { color: var(--indigo); border-color: var(--indigo); }
.rk-zpv { position: absolute; right: 12px; bottom: 10px; font-family: var(--mono); font-size: 11px;
  color: var(--text-3); background: rgba(255,255,255,.8); padding: 2px 8px; border-radius: 999px; pointer-events: none; }

/* 机柜（房间视图） */
.rk-rack { position: absolute; width: 104px; height: 158px; background: #fff; border: 1px solid var(--line-strong);
  border-radius: 10px; box-shadow: var(--sh-1); cursor: grab; user-select: none; z-index: 2;
  transition: box-shadow .16s var(--ease), transform .16s var(--ease); }
.rk-rack:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
.rk-rack.dragging { opacity: .92; cursor: grabbing; z-index: 5; box-shadow: var(--sh-2); }
.rk-rack.sel { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-weak), var(--sh-1); }
.rk-rack.hot { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,.18), var(--sh-1); }
.rk-rack .nm { display: flex; align-items: center; gap: 5px; padding: 7px 8px 0; font-size: 12px; font-weight: 700; color: var(--text); }
.rk-rack .nm .led { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.rk-rack .nm .led.mid { background: var(--amber); }
.rk-rack .nm .led.hi { background: var(--red); }
.rk-rack .mt { padding: 2px 8px 0; font-size: 10.5px; color: var(--text-3); font-family: var(--mono); }
.rk-rack .fill { margin: 7px 8px 0; height: 5px; background: #eef0f5; border-radius: 99px; overflow: hidden; }
.rk-rack .fill i { display: block; height: 100%; background: var(--indigo); border-radius: 99px; }
.rk-rack .fill i.warn { background: var(--amber); }
.rk-rack .urow { display: flex; gap: 2px; padding: 7px 8px 0; }
.rk-rack .urow i { flex: 1; height: 3px; border-radius: 2px; background: #eef0f5; }
.rk-rack .urow i.on { background: var(--indigo); }
.rk-ghost { position: fixed; z-index: 400; pointer-events: none; opacity: .85; border-color: var(--indigo) !important; }

/* 拖动参考线 */
.rk-guide { position: absolute; pointer-events: none; z-index: 4; }
.rk-guide.hx { left: 0; right: 0; height: 0; border-top: 1px dashed var(--indigo); }
.rk-guide.vx { top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--indigo); }
.rk-guide.free { opacity: .45; }

/* 左下统计条（机房级 ↔ 机柜级） */
.rk-statbar { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: 9px 16px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
.rk-statbar .scope { font-weight: 700; color: var(--text); }
.rk-statbar b { font-family: var(--mono); color: var(--text); }
.rk-statbar .st { display: flex; align-items: baseline; gap: 5px; }
.rk-statbar.live { border-color: var(--indigo); background: linear-gradient(0deg, var(--indigo-weak), var(--indigo-weak)); }
.rk-statbar .tip { margin-left: auto; color: var(--text-3); font-size: 11.5px; }

/* 右侧抽屉：机柜详情（42U 立面） */
.rk-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 432px; max-width: 94vw; background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(16,24,40,.10); z-index: 200;
  transform: translateX(102%); transition: transform .3s var(--ease); display: flex; flex-direction: column; }
.rk-drawer.open { transform: translateX(0); }
.rk-dh { display: flex; align-items: center; gap: 10px; padding: 15px 16px 12px; border-bottom: 1px solid var(--line); }
.rk-dh .t { flex: 1; }
.rk-dh h3 { margin: 0; font-size: 15px; color: var(--text); }
.rk-dh .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.rk-db { flex: 1; overflow: auto; padding: 14px 16px 20px; }
.rk-selrow { display: flex; align-items: center; gap: 8px; background: var(--amber-weak, #fffbeb);
  border: 1px dashed #fcd34d; border-radius: var(--r-md); padding: 8px 11px; font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; }
.rk-selrow[hidden] { display: none; }
.rk-selrow b { color: var(--text); }
.rk-selrow button { margin-left: auto; }
.rk-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--text-3); }
.rk-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: #fff;
  color: var(--text); border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer; transition: all .15s var(--ease); }
.rk-chip:hover { border-color: var(--indigo); color: var(--indigo); }
.rk-chip .u { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.rk-chip.off { opacity: .45; cursor: not-allowed; }
.rk-chip.off:hover { border-color: var(--line-strong); color: var(--text); }

.rk-elev { position: relative; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: #fbfcfe;
  -webkit-user-select: none; user-select: none; }
.rk-slot { position: absolute; left: 0; right: 0; border-bottom: 1px solid #eef0f5; }
.rk-slot.odd { background: #f6f8fb; }
.rk-slot .u { position: absolute; left: 5px; font-family: var(--mono); font-size: 10px; color: #94a0b3; line-height: 21px; }
.rk-slot .drop { position: absolute; left: 34px; right: 8px; top: 4px; bottom: 4px; border: 1px dashed transparent; border-radius: 6px; }
.rk-slot.hot .drop { border-color: var(--indigo); background: var(--indigo-weak); }
.rk-dev { position: absolute; left: 30px; right: 8px; border-radius: 7px; background: #fff; border: 1px solid var(--line-strong);
  box-shadow: 0 1px 3px rgba(16,24,40,.08); cursor: grab; overflow: hidden; z-index: 2; user-select: none; }
.rk-dev:hover { border-color: var(--indigo); }
.rk-dev.sel { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-weak); }
.rk-dev .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.rk-dev .txt { padding: 4px 7px 4px 9px; font-size: 11.5px; color: var(--text); line-height: 1.35; overflow: hidden; }
.rk-dev .txt .ip { display: block; font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.rk-dev.dragging { opacity: .35; }
.rk-dev.c-net { background: #f0f9ff; } .rk-dev.c-net .bar { background: var(--sky); }
.rk-dev.c-srv { background: #eef2ff; } .rk-dev.c-srv .bar { background: var(--indigo); }
.rk-dev.c-sto { background: #ecfdf5; } .rk-dev.c-sto .bar { background: var(--green); }
.rk-dev.c-sec { background: #fef2f2; } .rk-dev.c-sec .bar { background: var(--red); }
.rk-dev.c-oth { background: #f8f9fc; } .rk-dev.c-oth .bar { background: #6b7280; }

.rk-empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 46px 20px; }
.rk-empty .big { font-size: 15px; color: var(--text-2); margin-bottom: 6px; }

/* 上架表单 */
.rk-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.rk-form-grid .full { grid-column: 1 / -1; }
.rk-mount-hint { font-size: 12px; color: var(--text-3); line-height: 1.7; margin: 4px 0 10px; }
.rk-mount-hint b { color: var(--indigo); font-family: var(--mono); }

@media (max-width: 1080px) {
  .rk-body { grid-template-columns: 1fr; }
  .rk-side { flex-direction: row; flex-wrap: wrap; }
  .rk-side .rk-card { flex: 1; min-width: 240px; }
}

/* ---------- 位置识别提示（设备表单，自动解析存放位置） ---------- */
.loc-hint { font-size: 12.5px; line-height: 1.65; color: var(--text-3);
  padding: 9px 11px; border: 1px dashed var(--line); border-radius: var(--r-md); background: #f8fafc; }
.loc-hint b { color: var(--text); font-weight: 700; }
.loc-hint .sub { margin-left: 8px; font-size: 11.5px; color: var(--text-3); }
.loc-hint.ok { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
.loc-hint.ok b { color: #065f46; }
.loc-hint.warn { color: #92400e; border-color: #fde68a; background: #fffbeb; }
.loc-hint.warn b { color: #92400e; }
.loc-hint.err { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
.loc-hint.err b { color: #991b1b; }
@media (max-width: 600px) {
  .app-header { height: auto; min-height: 60px; flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
  .brand { min-width: 0; flex: 0 1 auto; }
  .ts-btn { max-width: 120px; }
  .header-right { width: 100%; margin-left: 0; gap: 6px; }
  .header-right .search { flex: 1; min-width: 0; }
  .header-right .search input { width: 100%; }
  .sidebar { top: 106px; height: calc(100vh - 106px); }
  .main { padding: 14px 12px 36px; }
}
@media (max-width: 600px) {
  .form-grid, .rk-form-grid { grid-template-columns: minmax(0, 1fr); }
  .form-grid > *, .rk-form-grid > * { min-width: 0; }
}

        var fk = fkeys[i], fv = S.filters[fk]; if (!fv) continue;
        var fdef = curFields().filter(function (x) { return x.key === fk; })[0];
        if (!fdef) continue;
        var v = a[fk];
        if (fdef.type === 'select') { if (String(v) !== fv) return false; }
        else { if (String(v == null ? '' : v).toLowerCase().indexOf(fv.toLowerCase()) === -1) return false; }
      }
      if (kw) {
        var hay = curFields().map(function (f) { return a[f.key]; }).join(' ').toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
    if (S.sortKey) list.sort(function (x, y) {
      var a = (x[S.sortKey] || ''), b = (y[S.sortKey] || '');
      return a > b ? S.sortDir : a < b ? -S.sortDir : 0;
    });
    return list;
  }

  /* ------------------------------- 渲染：表格 ------------------------------- */
  function renderTable() {
    var fields = curFields().filter(function (f) { return f.visible; });
    var list = filtered();
    // 先修正越界页码，再切片：否则删完末页会显示"空表 + 页码已变"
    var pages = Math.max(1, Math.ceil(list.length / S.pageSize));
    if (S.page > pages) S.page = pages;
    if (S.page < 1) S.page = 1;
    var start = (S.page - 1) * S.pageSize;
    var rows = list.slice(start, start + S.pageSize);
    var pkKey = primaryKey();
    var expKey = expiryField() ? expiryField().key : '';
    var allChecked = rows.length > 0 && rows.every(function (a) { return S.selected[a.id]; });

    var head = '<th class="col-check"><input type="checkbox" id="chkAll"' + (allChecked ? ' checked' : '') + '></th>';
    head += fields.map(function (f) {
      var on = S.sortKey === f.key;
      return '<th class="sortable' + (on ? ' sorted' : '') + (S.filters[f.key] ? ' filtered' : '') + '" data-sort="' + esc(f.key) + '" style="min-width:' + (f.width || 120) + 'px">' +
        '<span class="th-title">' + esc(f.title) + (on ? ' <span class="sort-arr">' + (S.sortDir > 0 ? '↑' : '↓') + '</span>' : '') + '</span>' +
        '<button class="th-filter" data-colfilter="' + esc(f.key) + '" title="筛选 / 排序此列">' + icon('filter') + '</button></th>';
    }).join('');
    head += '<th style="min-width:120px">配置文件</th><th class="col-op">操作</th>';

    var body;
    if (!rows.length) {
      body = '<tr><td colspan="' + (fields.length + 3) + '"><div class="empty"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#cbd2e0" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><div style="margin-top:10px;font-size:14px">没有匹配的记录</div><div style="font-size:12.5px;margin-top:4px">可清空筛选，或点击右上角「新增记录」</div></div></td></tr>';
    } else {
      body = rows.map(function (a) {
        var tds = '<td class="col-check"><input type="checkbox" class="chk-row" data-id="' + esc(a.id) + '"' + (S.selected[a.id] ? ' checked' : '') + '></td>';
        tds += fields.map(function (f) {
          var v = a[f.key], cell;
          if (f.key === pkKey) cell = '<div class="cell-name"><span class="ico-box">' + catIcon(a.category) + '</span><span class="link" data-detail="' + esc(a.id) + '">' + esc(v || '-') + '</span></div>';
          else if (f.key === 'status') cell = '<span class="badge ' + statusColor(v) + '">' + esc(v || '-') + '</span>';
          else if (f.key === expKey) {
            var es = expiryStateOf(a);
            cell = '<span class="cell-exp' + (es ? ' ' + es : '') + '">' + esc(v || '-') + '</span>' +
              (es ? ' <span class="badge ' + (es === 'expired' ? 'red' : 'amber') + '">' + (es === 'expired' ? '已过期' : '即将到期') + '</span>' : '');
          }

              '<button class="icon-link" data-pwd="' + esc(a.id) + '" title="显示/隐藏">' + icon(show ? 'eyeOff' : 'eye') + '</button>' +
              '<button class="icon-link" data-copy="' + esc(v || '') + '" title="复制">' + icon('copy') + '</button></div>';
          } else if (f.key === 'ip' || f.key === 'mgmtIp' || f.key === 'sn') cell = '<span class="mono">' + esc(v || '-') + '</span>';
          else if (f.type === 'select') cell = v ? '<span class="badge blue">' + esc(v) + '</span>' : '-';
          else cell = esc(v || '-');
          return '<td>' + cell + '</td>';
        }).join('');
        var files = (a.fileCount || 0);
        tds += '<td>' + (files ? '<span class="file-chip" data-files="' + esc(a.id) + '">' + icon('folder') + ' ' + files + ' 个</span>' : '<span class="file-chip none">— 未上传</span>') + '</td>';
        tds += '<td class="col-op"><div class="op-btns"><button class="btn sm" data-edit="' + esc(a.id) + '">' + icon('edit') + '编辑</button>' +
          '<button class="btn sm" data-files="' + esc(a.id) + '">' + icon('file') + '附件</button>' +
          '<button class="btn sm danger" data-del="' + esc(a.id) + '">' + icon('trash') + '</button></div></td>';
        var rowCls = [(S.selected[a.id] ? 'selected' : ''), (expiryStateOf(a) === 'expired' ? 'row-expired' : '')].join(' ').trim();
        return '<tr class="' + rowCls + '" data-id="' + esc(a.id) + '">' + tds + '</tr>';
      }).join('');
    }
    $('#assetTable').innerHTML = '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody>';

    var pb = '', add = function (p, txt, dis, act) { pb += '<button class="page-btn ' + (act ? 'active' : '') + '" data-page="' + p + '"' + (dis ? ' disabled' : '') + '>' + txt + '</button>'; };
    add(S.page - 1, '‹', S.page <= 1, false);
    var from = Math.max(1, Math.min(S.page - 2, pages - 4));
    for (var p = from; p < from + 5 && p <= pages; p++) add(p, p, false, p === S.page);
    add(S.page + 1, '›', S.page >= pages, false);
    $('#pager').innerHTML = '<div class="total">共 <b>' + list.length + '</b> 条 · 第 ' + S.page + '/' + pages + ' 页</div><div class="pages">' + pb + '</div>';

      filterSec = '<div class="cm-sep"></div><div class="cm-title">按值筛选</div>' +

    } else {
      filterSec = '<div class="cm-sep"></div><div class="cm-title">按文字筛选（包含）</div>' +
        '<div class="cm-input"><input id="cmInput" type="' + (f.type === 'date' ? 'date' : 'text') + '" placeholder="输入关键字…" value="' + esc(S.filters[key] || '') + '"><button id="cmApply">应用</button></div>';
    }
    var clear = S.filters[key] ? '<div class="cm-sep"></div><div class="cm-item danger" data-fclear="1">清除该列筛选</div>' : '';
    menu.innerHTML = '<div class="cm-title">排序</div>' + sortAsc + sortDesc + filterSec + clear;
    document.body.appendChild(menu);
    var r = th.getBoundingClientRect(), mw = 210;
    menu.style.position = 'fixed';
    menu.style.top = (r.bottom + 6) + 'px';
    var left = r.left; if (left + mw > window.innerWidth - 10) left = window.innerWidth - 10 - mw; if (left < 10) left = 10;
    menu.style.left = left + 'px'; menu.style.width = mw + 'px';
    menu.addEventListener('click', function (e) {
      var it = e.target.closest('[data-sortdir]');
      if (it) { S.sortKey = key; S.sortDir = +it.getAttribute('data-sortdir'); closeColMenu(); renderTable(); return; }
      var fv = e.target.closest('[data-fval]');
      if (fv) { S.filters[key] = fv.getAttribute('data-fval'); S.page = 1; closeColMenu(); renderTable(); return; }
      if (e.target.closest('[data-fclear]')) { delete S.filters[key]; S.page = 1; closeColMenu(); renderTable(); return; }
      if (e.target.closest('#cmApply')) { var v = $('#cmInput', menu).value.trim(); if (v) { S.filters[key] = v; S.page = 1; } closeColMenu(); renderTable(); return; }
    });
  }

  /* ---------- 硬件更换单：IP → 关联设备自动回填 ----------
     填写/修改 IP 后失焦，跨所有「设备资产」类型的数据表查找该 IP，
     命中则自动回填 关联设备 / 资产编码 / 原硬件型号 等字段。 */
  function bindIpRelate(m, fields, asset, isNew) {
    var ipInput = $('#fld_ip', m);
    if (!ipInput) return;                 // 该表没有 IP 字段（如自定义表）
    var tip = $('#relTip', m);
    var busy = false;

    function titleOf(key) {
      for (var i = 0; i < fields.length; i++) if (fields[i].key === key) return fields[i].title;
      return key;
    }
    function setTip(text, kind) {
      if (!tip) return;
      if (!text) { tip.className = 'rel-tip hidden'; tip.innerHTML = ''; return; }
      tip.className = 'rel-tip ' + (kind || '');
      tip.innerHTML = text;
    }
    function fill(key, val, filled, skipped) {
      var el = $('#fld_' + key, m);
      if (!el) return;
      var v = (val == null ? '' : String(val)).trim();
      if (!v) return;
      var cur = (el.value || '').trim();
      if (cur && cur !== v) { skipped.push(titleOf(key)); return; }
      el.value = v;
      filled.push(titleOf(key));
    }
    function relate() {
      var ip = (ipInput.value || '').trim();
      if (!ip) { setTip('', ''); return; }
      if (busy) return;
      busy = true;
      setTip('正在查找 IP <b>' + esc(ip) + '</b> 对应的设备…', 'loading');
      API.lookupByIp(ip).then(function (r) {
        busy = false;
        if (r && r.found && r.asset) {
          var a = r.asset, filled = [], skipped = [];
          fill('assetName', a.name, filled, skipped);
          fill('assetCode', a.assetCode, filled, skipped);
          fill('oldPart', a.model, filled, skipped);
          setTip('已关联到 <b>' + esc(a.name || a.assetCode || ip) + '</b>'
            + (r.tableName ? '（' + esc(r.tableName) + (r.matchOn === 'mgmtIp' ? ' · 按管理IP匹配' : '') + '）' : ''), 'ok');
          if (filled.length) toast('已自动填充：' + filled.join('、'), 'success');
          if (skipped.length) toast('以下字段已有值，未自动覆盖：' + skipped.join('、'), 'warn');
        } else {
          setTip('未在任何设备资产表中找到 IP <b>' + esc(ip) + '</b>，请手动填写关联信息', 'miss');
          toast('未找到 IP ' + ip + ' 对应的设备', 'warn');
        }
      }).catch(function (e) {
        busy = false;
        setTip('', '');
        toast(e.message || '关联查询失败', 'error');
      });
    }

    ipInput.addEventListener('blur', relate);
    ipInput.addEventListener('change', relate);
    // 编辑已有更换单时，若已有 IP，进入即自动关联一次，便于核对 / 补齐
    if (!isNew && asset && asset.ip) setTimeout(relate, 350);
  }

  /* ------------------------- 位置识别（由「存放位置」文本驱动） ------------------------- */
  function rackRooms() {
    return Store.getTables().filter(function (t) { return t.type === 'rack'; });
  }

  function uRangeText(u, size) {
    return size > 1 ? ('U' + u + '-' + (u + size - 1)) : ('U' + u);
  }

  /* 位置识别：只读提示。机房 / 机柜 / U 位全部由「存放位置」文本推导，
     表单里不再出现第二套可编辑的位置输入，避免两处冲突。 */
  function rackPickerHtml(fields) {
    var hasLoc = fields.some(function (f) { return f.key === 'location'; });
    if (!hasLoc) return '';
    if (!rackRooms().length) {
      return '<div class="section-card"><div class="section-title">位置识别</div>' +
        '<div class="hint">还没有机房表。先在「新建 / 管理数据表」里建一张「机房图表」类型的表，之后填设备位置就能自动上架。</div></div>';
    }
    return '<div class="section-card"><div class="section-title">位置识别（自动 · 无需重复填写）</div>' +
      '<div class="loc-hint" id="locHint">填写上方「存放位置」后自动识别机房 / 机柜 / U 位。</div>' +
      '<div class="hint">格式示例：A机房 S柜 U3-5　·　字母大小写不限，保存时柜号统一转为大写</div></div>';
  }

  function bindRackPicker(m, asset) {
    var locInp = $('#fld_location', m), hint = $('#locHint', m);
    if (!locInp || !hint) return;
    var timer = null, seq = 0;
    var TIP = '填写上方「存放位置」后自动识别机房 / 机柜 / U 位。';

    function paint(txt) {
      if (!txt) { hint.className = 'loc-hint'; hint.innerHTML = TIP; return; }
      var my = ++seq;
      API.req('GET', '/tables/' + S.tableId + '/resolve-location?text=' + encodeURIComponent(txt))
        .then(function (r) {
          if (my !== seq || !r) return;
          if (r.status === 'ok') {
            hint.className = 'loc-hint ok';
            hint.innerHTML = '已识别：<b>' + esc(r.room) + ' · ' + esc(r.code) + ' · ' +
              uRangeText(r.uStart, r.uSize) + '</b>' +
              '<span class="sub">机柜共 ' + r.uTotal + 'U · 保存后自动关联</span>';
          } else if (r.status === 'out_of_range') {
            hint.className = 'loc-hint err';
            hint.innerHTML = 'U 位超出机柜范围：<b>' + esc(r.code) + '</b> 共 ' + r.uTotal + 'U';
          } else if (r.status === 'rack_missing') {
            hint.className = 'loc-hint warn';
            hint.innerHTML = '机柜「<b>' + esc(r.code) + '</b>」在' +
              (r.room ? '「' + esc(r.room) + '」' : '当前机房') +
              '不存在<span class="sub">保存时会询问是否新建</span>';
          } else if (r.status === 'room_has_no_rack') {
            hint.className = 'loc-hint warn';
            hint.innerHTML = '机房「' + esc(r.room) + '」里没有机柜「<b>' + esc(r.code) + '</b>」' +
              '<span class="sub">保存时会询问是否新建</span>';
          } else if (r.status === 'no_rack') {
            hint.className = 'loc-hint warn';
            hint.innerHTML = '没有写机柜号，只记录位置文本，不关联机柜';
          } else {
            hint.className = 'loc-hint warn';
            hint.innerHTML = '未能识别，请检查格式（示例：A机房 S柜 U3-5）';
          }
        })
        .catch(function () { /* 解析失败静默，不打断填写 */ });
    }

    locInp.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { paint((locInp.value || '').trim()); }, 320);
    });
    if ((locInp.value || '').trim()) paint(locInp.value.trim());
  }

  function readRackPicker() {
    // 位置已完全交由「存放位置」文本驱动，不再提交独立的柜位参数
    return null;
  }

  /* 保存后的联动反馈：已关联 / 机柜不存在（引导新建） */
  function handleRackSaveResult(info, done) {
    if (!info || info.status === 'no_location' || info.status === 'cleared' || info.status === 'none') {
      if (info && info.status === 'cleared') toast('已解除机柜关联', 'warn');
      done();
      return;
    }
    if (info.status === 'linked') {
      toast('已关联至 ' + info.room + ' ' + info.code + ' ' + uRangeText(info.uStart, info.uSize || 1), 'success');
      done();
      return;
    }
    if (info.status === 'rack_missing') {
      var roomTxt = info.room || '';
      confirmBox('机柜不存在',
        '位置中提到的机柜「<b>' + esc(info.code) + '</b>」在' + (roomTxt ? '「<b>' + esc(roomTxt) + '</b>」' : '当前机房') +
        '中不存在。<br>是否现在新建这个机柜？<br><span style="color:#94a3b8;font-size:12.5px">新建后，系统会自动把位置指向它的设备挂上去。</span>',
        function () { createMissingRack(info); }, '新建机柜');
      done();
      return;
    }
    if (info.status === 'unparsed') {
      toast('位置文本未识别出机柜，未关联（格式示例：A机房 K1柜 15-16u）', 'warn');
    }
    done();
  }

  function createMissingRack(info) {
    var rooms = rackRooms();
    var target = null;
    if (info.room) {
      target = rooms.filter(function (t) { return t.name === info.room; })[0]
            || rooms.filter(function (t) { return t.name.indexOf(info.room) >= 0 || info.room.indexOf(t.name) >= 0; })[0];
    }
    if (!target && rooms.length === 1) target = rooms[0];
    if (!target) {
      toast('请先到「机房图表」数据表中新建机柜：' + info.code, 'warn');
      return;
    }
    switchTable(target.id);
    if (window.RackView && RackView.openAddRack) {
      RackView.openAddRack({ code: (info.suggest || info.code || '').toUpperCase(), name: info.code || '' });
    }
  }

  function openAssetModal(id) {
    var fields = curFields(), t = curTable();

        $$('[data-dl]', mm).forEach(function (el) { el.addEventListener('click', function () { downloadFile(assetId, el.getAttribute('data-dl')); }); });

      }).join('') + '</div>' +

        '<div class="file-list" id="fileList2"></div></div>');

    openModal({
      title: isNew ? '新增记录' : '编辑记录', icon: t.type === 'change' ? 'swap' : 'box',
      sub: t ? t.name : '', width: 'wide', body: body,
      foot: '<button class="btn" data-close>取消</button><button class="btn primary" data-save>保存</button>',
      onMount: function (m) {
        if (!isNew) bindAssetFiles(m, id);
        if (Store.curType() === 'change') bindIpRelate(m, fields, asset, isNew);
        bindRackPicker(m, isNew ? null : asset);
        $('[data-save]', m).addEventListener('click', function () {
          var data = {}, ok = true;
          fields.forEach(function (f) {
            var inp = $('#fld_' + f.key, m); if (!inp) return;

  function findFile(assetId, fileId) { return Store.findFile(S.tableId, assetId, fileId); }
  // 附件预览：支持直接编辑(文本)、复制、重命名、删除
  function previewFile(assetId, fileId, onChange) {
    var f = findFile(assetId, fileId); if (!f) return;
    var isText = f.type === 'text';
    var p = isText ? API.fetchText(API.filePreviewUrl(S.tableId, assetId, fileId)) : Promise.resolve('');
    p.then(function (content) {
      var editing = false;
      var inner = f.type === 'image' ? '<img class="preview-img" src="' + API.filePreviewUrl(S.tableId, assetId, fileId) + '">' :
        f.type === 'text' ? '<pre class="preview-txt" id="pvText">' + esc(content) + '</pre>' +
          '<textarea class="preview-edit" id="pvEdit" style="display:none">' + esc(content) + '</textarea>' :
        '<div class="empty">该文件类型暂不支持在线预览，请下载后查看</div>';
      var foot = '';
      if (f.type === 'text') {
        foot += '<button class="btn" data-pvedit>' + icon('edit') + '编辑</button>';
        foot += '<button class="btn" data-pvcopy>复制内容</button>';
      }
      foot += '<button class="btn" data-pvrename>重命名</button>';
      foot += '<button class="btn" data-pvdel style="color:#ef4444">删除</button>';
      foot += '<button class="btn" data-close>关闭</button><button class="btn primary" data-dlp>' + icon('download') + '下载</button>';
      openModal({
        title: f.name, icon: 'file',
        sub: fmtSize(f.size) + ' · ' + f.time, width: 'wide', top: true,
        body: '<div class="preview-body">' + inner + '</div>', foot: foot,
        onMount: function (m) {
          var titleEl = m.querySelector('.modal-head h3');
          $('[data-dlp]', m).addEventListener('click', function () { downloadFile(assetId, fileId); });
          var copyBtn = $('[data-pvcopy]', m), editBtn = $('[data-pvedit]', m), renameBtn = $('[data-pvrename]', m), delBtn = $('[data-pvdel]', m);
          if (copyBtn) copyBtn.addEventListener('click', function () { copyText(content); });
          if (editBtn) editBtn.addEventListener('click', function () {
            var pre = $('#pvText', m), ta = $('#pvEdit', m);
            if (!editing) {
              pre.style.display = 'none'; ta.style.display = ''; ta.focus();
              editBtn.innerHTML = icon('upload') + '保存修改';
            } else {
              var v = ta.value;
              API.updateFileContent(S.tableId, assetId, fileId, v).then(function () {
                content = v; pre.textContent = v; ta.style.display = 'none'; pre.style.display = '';
                editing = false; editBtn.innerHTML = icon('edit') + '编辑';
                toast('内容已保存', 'success'); if (onChange) onChange();
              }).catch(function (e) { toast(e.message || '保存失败', 'error'); });
            }
          });
          if (renameBtn) renameBtn.addEventListener('click', function () {
            var nn = window.prompt('请输入新的文件名（含扩展名）：', f.name);
            if (nn && nn.trim() && nn.trim() !== f.name) {
              API.renameFile(S.tableId, assetId, fileId, nn.trim()).then(function () {
                f.name = nn.trim(); if (titleEl) titleEl.textContent = f.name;
                toast('已重命名为：' + f.name, 'success'); if (onChange) onChange();
              }).catch(function (e) { toast(e.message || '重命名失败', 'error'); });
            }
          });
          if (delBtn) delBtn.addEventListener('click', function () {
            confirmBox('删除配置文件', '确定删除该配置文件「' + esc(f.name) + '」吗？此操作不可恢复。', function () {
              API.deleteFile(S.tableId, assetId, fileId).then(function () {
                m._close(); toast('已删除：' + f.name, 'success'); if (onChange) onChange();
              }).catch(function (e) { toast(e.message || '删除失败', 'error'); });
            }, '删除文件');
          });
        }
      });
    }).catch(function (e) { toast(e.message || '预览失败', 'error'); });
  }

  function importCSV() {
    var input = document.createElement('input'); input.type = 'file'; input.accept = '.csv,.txt';
    input.onchange = function () {
      var file = input.files[0]; if (!file) return;
      API.importCsv(S.tableId, file).then(function (r) {
        var n = (r && r.imported) || 0;
        var linked = (r && r.linked) || 0;
        var miss = (r && r.missing) || [];
        var msg = '导入成功，新增 ' + n + ' 条记录';
        if (linked) msg += '（' + linked + ' 条已自动上架）';
        if (miss.length) msg += '；' + miss.length + ' 条未找到对应机柜，请在机房表新增后重新保存';
        toast(msg, miss.length ? 'warn' : 'success');
        S.page = 1;
        Store.reloadAssets(S.tableId).then(function () { Store.bumpCount(S.tableId); renderAll(); });
      }).catch(function (e) { toast(e.message || '导入失败', 'error'); });
    };
    input.click();
  }

        '<div class="hint" style="margin:-4px 0 10px">第二个复选框 = <b>保存时必填</b>。除「业务IP」「存放位置」外，其余字段都可以删除（删除后该列历史数据会一并清理）。</div>' + rows +

        '<div class="form-item"><label>字段类型</label><select id="nfType"><option value="text">文本</option><option value="number">数字</option><option value="select">下拉选择</option><option value="date">日期</option><option value="password">密码</option><option value="textarea">多行文本</option></select></div>' +
        '<div class="form-item"><label style="font-weight:500">必填</label><label style="font-weight:400"><input type="checkbox" id="nfReq"> 保存时校验非空</label></div>' +
        '<div class="form-item full"><label>下拉选项（类型为「下拉选择」时填写，逗号分隔）</label><input id="nfOpts" placeholder="如：一级,二级,三级"></div></div>';
    }
    openModal({
      title: '字段与列设置', icon: 'grid', sub: '当前数据表：' + (curTable() ? curTable().name : ''), width: 'wide',
      body: bodyHtml(),
      foot: '<button class="btn" data-close>取消</button><button class="btn primary" data-fsave>保存并应用</button>',
      onMount: function (m) {

        function bind() {
          $$('[data-up]', m).forEach(function (el) { el.addEventListener('click', function () { var i = +el.getAttribute('data-up'); if (i > 0) { fs.splice(i - 1, 0, fs.splice(i, 1)[0]); refresh(); } }); });
          $$('[data-down]', m).forEach(function (el) { el.addEventListener('click', function () { var i = +el.getAttribute('data-down'); if (i < fs.length - 1) { fs.splice(i + 1, 0, fs.splice(i, 1)[0]); refresh(); } }); });
          $$('[data-del-f]', m).forEach(function (el) { el.addEventListener('click', function () { var i = +el.getAttribute('data-del-f'); confirmBox('删除列', '确定删除列「' + esc(fs[i].title) + '」吗？<br>点「保存并应用」后，该列及所有记录中的这一项数据会一并移除。', function () { fs.splice(i, 1); toast('已标记删除，点「保存并应用」生效', 'success'); refresh(); }, '删除列'); }); });
          $('[data-fsave]', m).addEventListener('click', function () {
            $$('[data-vis]', m).forEach(function (el) { fs[+el.getAttribute('data-vis')].visible = el.checked; });
            $$('[data-req]', m).forEach(function (el) { fs[+el.getAttribute('data-req')].required = el.checked; });

              return Store.loadTable(S.tableId);

            }).catch(function (e) { toast(e.message || '保存失败', 'error'); });
          });
        }
        bind();
      }
    });
  }

  /* ------------------------------- 数据表管理 ------------------------------- */
  function openSysModal() {
    function bodyHtml() {
      return Store.getTables().map(function (s, i) {
        var n = (typeof s.count === 'number') ? s.count : 0;
        return '<div class="sys-card" style="display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px"><div class="tdot" style="width:14px;height:14px;border-radius:4px;background:' + s.color + '"></div>' +
          '<div style="flex:1"><div style="font-weight:600">' + esc(s.name) + ' <span style="font-size:11px;color:#94a0b3;background:#f1f2f8;padding:1px 7px;border-radius:6px">' + Store.TYPE_LABELS[s.type] + '</span></div><div style="font-size:12px;color:#94a0b3;margin-top:3px">' + esc(s.description || '') + ' · ' + n + ' 条</div></div>' +
          '<button class="btn sm" data-ren="' + s.id + '">重命名</button><button class="btn sm danger" data-rms="' + s.id + '"' + (Store.getTables().length <= 1 ? ' disabled' : '') + '>删除</button></div>';
      }).join('') +
        '<div class="nav-sep"></div><div class="section-title">新增数据表</div>' +
        '<div class="form-grid"><div class="form-item"><label>表名称</label><input id="nsName" placeholder="如：系统4 · 测试网"></div>' +
        '<div class="form-item"><label>表类型（决定字段模板）</label><select id="nsType"><option value="asset">设备资产表</option><option value="change">硬件更换表</option><option value="custom">空白自定义表</option><option value="rack">机房（机柜图表）</option></select></div>' +
        '<div class="form-item full"><label>说明</label><input id="nsDesc" placeholder="选填"></div></div>';
    }
    function sync(m) {
      return Store.reloadTables().then(function () {
        $('.modal-body', m).innerHTML = bodyHtml(); bind(m);
        renderTableSwitch(); renderSidebar();
      });
    }
    function bind(m) {
      $$('[data-ren]', m).forEach(function (el) { el.addEventListener('click', function () { var s = Store.tableOf(el.getAttribute('data-ren')); var v = prompt('请输入新的表名称', s.name); if (v && v.trim()) { API.renameTable(s.id, v.trim()).then(function () { toast('已重命名', 'success'); return sync(m); }).catch(function (e) { toast(e.message || '重命名失败', 'error'); }); } }); });
      $$('[data-rms]', m).forEach(function (el) { el.addEventListener('click', function () { var sid = el.getAttribute('data-rms'); var s = Store.tableOf(sid); confirmBox('删除数据表', '确定删除「' + esc(s.name) + '」吗？其下 <b>' + ((typeof s.count === 'number') ? s.count : 0) + '</b> 条记录与配置文件将一并删除。', function () {
        API.deleteTable(sid).then(function () {
          Store.clearTableCache(sid);
          toast('数据表已删除', 'success');
          return Store.reloadTables();
        }).then(function () {
          if (S.tableId === sid) {
            var first = Store.getTables()[0];
            S.tableId = first ? first.id : null; S.page = 1; S.selected = {}; S.section = 'all'; S.status = ''; S.expiry = '';
            if (S.tableId) return Store.loadTable(S.tableId);
          }
        }).then(function () {
          $('.modal-body', m).innerHTML = bodyHtml(); bind(m);
          renderTableSwitch(); renderSidebar();
          if (S.tableId) renderAll(); else renderTable();
        }).catch(function (e) { toast(e.message || '删除失败', 'error'); });
      }, '删除数据表'); }); });
      $('[data-sadd]', m).addEventListener('click', function () {
        var name = $('#nsName', m).value.trim(); if (!name) { toast('请填写表名称', 'error'); return; }
        var type = $('#nsType', m).value;
        var nt = null;   // 必须在闭包外层持有：.then 链后续回调还要用它
        API.createTable(name, type, $('#nsDesc', m).value.trim() || '新数据表', ['#4f46e5', '#0ea5e9', '#f59e0b', '#10b981'][Store.getTables().length % 4]).then(function (r) {
          nt = r || {};
          toast('已新增数据表：' + name, 'success');
          return Store.reloadTables();
        }).then(function () {
          return Store.loadTable(nt.id);
        }).then(function () {
          if (!nt.id) { toast('新增失败：服务端未返回新表 ID', 'error'); return; }
          S.tableId = nt.id; S.page = 1; S.selected = {}; S.section = 'all'; S.status = '';
          m._close(); renderAll();
          toast('已切换到新表：' + name, 'success');
        }).catch(function (e) { toast(e.message || '新增失败', 'error'); });
      });
    }
    openModal({
      title: '新建 / 管理数据表', icon: 'layers', sub: '各表数据完全隔离，互不混放', width: 'wide',
      body: bodyHtml(), foot: '<button class="btn" data-close>关闭</button><button class="btn primary" data-sadd>新增数据表</button>',
      onMount: function (m) { bind(m); }
    });
  }

  /* ------------------------------- 数据备份 / 恢复 ------------------------------- */
  function openBackupModal() {
    openModal({
      title: '数据备份 / 恢复', icon: 'db', width: 'wide',
      sub: '备份包含全部数据表、记录与附件，请妥善保管备份文件',
      body:
        '<div class="section-card"><div class="section-title">① 下载备份（建议定期执行）</div>' +
        '<div class="hint">导出一个 zip 包，内含 data.json（全部数据）与 uploads/（全部附件）。可用于换机迁移、定期归档。</div>' +
        '<div style="margin-top:12px"><button class="btn primary" data-bkdown>' + icon('download') + '下载备份文件</button></div></div>' +
        '<div class="section-card"><div class="section-title">② 从备份恢复</div>' +
        '<div class="hint" style="color:#b91c1c">⚠ 恢复会<b>清空并覆盖</b>当前全部数据。为防误操作，系统会在恢复前自动把当前数据另存到 backups/ 目录。</div>' +
        '<div class="form-item full" style="margin-top:10px"><label>选择备份文件（.zip）</label><input type="file" id="bkFile" accept=".zip"></div>' +
        '<div style="margin-top:10px"><button class="btn danger" data-bkrestore>' + icon('upload') + '开始恢复</button></div></div>',
      foot: '<button class="btn" data-close>关闭</button>',
      onMount: function (m) {
        var down = $('[data-bkdown]', m);
        if (down) down.addEventListener('click', function () {
          API.backupUrl().then(function(url) { var a=document.createElement('a'); a.href=url; a.download='资产备份.zip'; document.body.appendChild(a); a.click(); document.body.removeChild(a); toast('备份已开始下载', 'success'); }).catch(function(e) { toast(e.message || '备份失败', 'error'); });
        });
        var up = $('[data-bkrestore]', m);
        if (up) up.addEventListener('click', function () {
          var f = $('#bkFile', m);
          if (!f || !f.files || !f.files[0]) { toast('请先选择备份文件', 'error'); return; }
          var file = f.files[0];
          confirmBox('从备份恢复', '将用「' + esc(file.name) + '」<b>覆盖</b>当前全部数据，且不可撤销（系统会自动留存一份当前数据）。确认继续？', function () {
            toast('正在恢复，请稍候…', 'warn');
            API.restore(file).then(function (r) {
              var n = (r && r.restored) || {};
              toast('恢复完成：' + (n.assets || 0) + ' 条记录 / ' + (n.files || 0) + ' 个附件，页面即将刷新', 'success');
              // 恢复后缓存与表 id 全部失效，直接刷新页面最可靠
              setTimeout(function () { location.reload(); }, 1200);
            }).catch(function (e) { toast(e.message || '恢复失败', 'error'); });
          }, '确认恢复');
        });
      }
    });
  }

  /* ------------------------------- 批量修改 ------------------------------- */
  function openBulkModal() {
    var ids = Object.keys(S.selected); if (!ids.length) { toast('请先勾选要修改的记录', 'warn'); return; }
    var fields = curFields().filter(function (f) { return f.key !== 'id'; });
    if (!fields.length) { toast('当前数据表还没有任何字段，请先在「字段设置」中添加', 'warn'); return; }
    function valControl(f) {
      if (f.type === 'select') return '<select id="bkVal"><option value="">— 清空该字段 —</option>' + (f.options || []).map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
      if (f.type === 'textarea') return '<textarea id="bkVal" placeholder="输入新值（留空则清空）"></textarea>';
      var ty = f.type === 'date' ? 'date' : (f.type === 'number' ? 'number' : 'text');
      return '<input type="' + ty + '" id="bkVal" placeholder="输入新值（留空则清空）">';
    }
    var body = '<div class="form-item full"><label>要修改的字段</label><select id="bkField">' + fields.map(function (f) { return '<option value="' + esc(f.key) + '">' + esc(f.title) + '</option>'; }).join('') + '</select></div>' +
      '<div class="form-item full"><label>新值</label><div id="bkValWrap">' + valControl(fields[0]) + '</div></div>' +
      '<div class="hint">将统一应用到选中的 <b>' + ids.length + '</b> 条记录（留空表示清空该字段）</div>';
    openModal({
      title: '批量修改', icon: 'edit', sub: '共 ' + ids.length + ' 条', width: 'narrow',
      body: body,
      foot: '<button class="btn" data-close>取消</button><button class="btn primary" data-bksave>应用修改</button>',
      onMount: function (m) {
        $('#bkField', m).addEventListener('change', function () {
          var sel = this, f = fields.filter(function (x) { return x.key === sel.value; })[0];
          if (!f) return;
          $('#bkValWrap', m).innerHTML = valControl(f);
        });
        $('[data-bksave]', m).addEventListener('click', function () {
          var k = $('#bkField', m).value, f = fields.filter(function (x) { return x.key === k; })[0], v = $('#bkVal', m).value;
          if (f && f.type !== 'select' && f.required && v.trim() === '') { toast('必填字段不能清空', 'error'); return; }
          API.bulkUpdate(S.tableId, ids, k, v).then(function () {
            toast('已更新 ' + ids.length + ' 条记录的「' + (f ? f.title : k) + '」', 'success'); m._close();
            Store.reloadAssets(S.tableId).then(function () { renderTable(); });
          }).catch(function (e) { toast(e.message || '更新失败', 'error'); });
        });
      }
    });
  }

  /* ------------------------------- 切换数据表 ------------------------------- */
  function switchTable(tid) {
    if (tid === S.tableId) { $('#tsMenu').classList.add('hidden'); return; }
    var prev = S.tableId;
    S.tableId = tid; S.page = 1; S.selected = {}; S.section = 'all'; S.status = ''; S.expiry = '';
    // 列筛选 / 排序 / 关键字属于上一张表的上下文，必须清掉，否则会静默作用到新表
    S.filters = {}; S.sortKey = ''; S.sortDir = 1; S.keyword = '';
    var gs = $('#globalSearch'); if (gs) gs.value = '';
    Store.loadTable(tid).then(function () { renderAll(); $('#tsMenu').classList.add('hidden'); })
      .catch(function (e) {
        S.tableId = prev;   // 加载失败回退，避免后续操作打到错误的表
        toast(e.message || '加载失败', 'error');
      });
  }

  /* ------------------------------- 事件绑定 ------------------------------- */
  function init() {
    $('#sidebarToggle').addEventListener('click', function () { document.body.classList.toggle('sidebar-collapsed'); });
    $('#tsBtn').addEventListener('click', function (e) { e.stopPropagation(); $('#tsMenu').classList.toggle('hidden'); });
    document.addEventListener('click', function () { $('#tsMenu').classList.add('hidden'); });
    $('#tsMenu').addEventListener('click', function (e) {
      var it = e.target.closest('[data-tbl]');
      if (it) { switchTable(it.getAttribute('data-tbl')); return; }
      if (e.target.closest('[data-manage]')) openSysModal();
    });

    var timer = null;
    $('#globalSearch').addEventListener('input', function () { clearTimeout(timer); var v = this.value; timer = setTimeout(function () { S.keyword = v; S.page = 1; renderTable(); }, 160); });

    $('#tableNav').addEventListener('click', function (e) { var it = e.target.closest('[data-tbl]'); if (it) switchTable(it.getAttribute('data-tbl')); });
    $('#navList').addEventListener('click', function (e) {
      var c = e.target.closest('[data-cat]'), s = e.target.closest('[data-status]'), x = e.target.closest('[data-expiry]');
      if (c) { S.section = c.getAttribute('data-cat'); S.status = ''; S.expiry = ''; }
      else if (s) { S.status = s.getAttribute('data-status'); S.section = 'all'; S.expiry = ''; }
      else if (x) { var ev = x.getAttribute('data-expiry'); S.expiry = (S.expiry === ev) ? '' : ev; }
      else return;
      S.page = 1; renderSidebar(); renderHead(); renderTable(); renderExpPill();
    });

    $('#btnAdd').addEventListener('click', function () { openAssetModal(null); });
    $('#btnImport').addEventListener('click', importCSV);
    $('#btnExport').addEventListener('click', function () { doExport(filtered().map(function (a) { return a.id; })); });
    $('#btnFields').addEventListener('click', openFieldModal);
    $('#btnRefresh').addEventListener('click', function () {
      Store.reloadTables().then(function () { return Store.reloadAssets(S.tableId); }).then(function () { Store.bumpCount(S.tableId); renderAll(); toast('已刷新', 'success'); }).catch(function (e) { toast(e.message || '刷新失败', 'error'); });
    });
    $('#filterStatus').addEventListener('change', function () { S.status = this.value; S.page = 1; renderTable(); });
    $('#filterCat').addEventListener('change', function () { S.section = this.value; S.page = 1; renderTable(); });
    $('#pageSizeSel').addEventListener('change', function () { S.pageSize = +this.value; S.page = 1; renderTable(); });
    $('#btnReset').addEventListener('click', function () { S.keyword = ''; S.status = ''; S.section = 'all'; S.page = 1; S.expiry = ''; S.filters = {}; $('#globalSearch').value = ''; renderSidebar(); renderHead(); renderTable(); renderExpPill(); });
    $('#btnSysManage').addEventListener('click', openSysModal);
    $('#btnBackup').addEventListener('click', openBackupModal);

    var table = $('#assetTable');
    table.addEventListener('click', function (e) {
      var t = e.target, el;
      if ((el = t.closest('#chkAll'))) { filtered().slice((S.page - 1) * S.pageSize, S.page * S.pageSize).forEach(function (a) { if (el.checked) S.selected[a.id] = true; else delete S.selected[a.id]; }); renderTable(); return; }
      if ((el = t.closest('.chk-row'))) { var id = el.getAttribute('data-id'); if (el.checked) S.selected[id] = true; else delete S.selected[id]; renderTable(); return; }
      if ((el = t.closest('[data-colfilter]'))) { e.stopPropagation(); openColMenu(el.closest('th') || el, el.getAttribute('data-colfilter')); return; }
      if ((el = t.closest('[data-sort]'))) { var k = el.getAttribute('data-sort'); if (curFields().filter(function (f) { return f.key === k; })[0].type === 'password') { toast('密码列不支持排序', 'warn'); return; } if (S.sortKey === k) S.sortDir = -S.sortDir; else { S.sortKey = k; S.sortDir = 1; } renderTable(); return; }
      if ((el = t.closest('[data-edit]'))) { openAssetModal(el.getAttribute('data-edit')); return; }
      if ((el = t.closest('[data-detail]'))) { openDetail(el.getAttribute('data-detail')); return; }
      if ((el = t.closest('[data-files]'))) { openFiles(el.getAttribute('data-files')); return; }
      if ((el = t.closest('[data-del]'))) {
        var did = el.getAttribute('data-del'), target = null, ll = curAssets(); for (var i = 0; i < ll.length; i++) if (ll[i].id === did) target = ll[i];
        confirmBox('删除记录', '确定删除记录「' + esc(target ? (target[primaryKey()] || did) : did) + '」吗？其配置文件将一并删除。', function () {
          API.deleteAsset(S.tableId, did).then(function () { delete S.selected[did]; toast('记录已删除', 'success'); Store.reloadAssets(S.tableId).then(function () { Store.bumpCount(S.tableId); renderAll(); }); }).catch(function (e) { toast(e.message || '删除失败', 'error'); });
        }, '删除记录'); return;
      }
      if ((el = t.closest('[data-pwd]'))) { var pid = el.getAttribute('data-pwd'); S.showPwd[pid] = !S.showPwd[pid]; renderTable(); return; }
      if ((el = t.closest('[data-copy]'))) { copyText(el.getAttribute('data-copy')); return; }
      var rowEl = t.closest('tr[data-id]'); if (rowEl) { openAssetModal(rowEl.getAttribute('data-id')); return; }
    });
