<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>随遇而旅 — 随机城市旅行推荐</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --surface-alt: #f3f1ed;
  --primary: #2d5a3d;
  --primary-light: #4a8a5e;
  --primary-lighter: #e8f0e4;
  --accent: #c97b3e;
  --accent-light: #f5e6d6;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9a9a9a;
  --border: #e5e2dc;
  --shadow: 0 8px 32px rgba(0,0,0,0.06);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.92);
}

.header-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 2px;
}

.logo span {
  color: var(--accent);
}

.logo-sub {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
  letter-spacing: 4px;
  margin-left: 8px;
}

/* Main */
.main {
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* Hero */
.hero {
  text-align: center;
  padding: 48px 0 40px;
}

.hero h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
}

.hero h1 em {
  font-style: normal;
  color: var(--primary);
}

.hero p {
  font-size: 15px;
  color: var(--text-secondary);
  max-width: 480px;
  margin: 0 auto;
}

/* Draw button */
.draw-area {
  text-align: center;
  margin: 32px 0 48px;
}

.draw-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 48px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}

.draw-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
  transition: var(--transition);
}

.draw-btn:hover {
  transform: translateY(-2px);
  background: var(--primary-light);
  box-shadow: 0 8px 24px rgba(45,90,61,0.25);
}

.draw-btn:active {
  transform: translateY(0) scale(0.98);
}

.draw-btn .icon {
  font-size: 22px;
  line-height: 1;
  display: inline-block;
  transition: transform 0.6s ease;
}

.draw-btn.spinning .icon {
  animation: spin 0.8s ease-in-out 3;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Result card */
.result-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  display: none;
}

.result-card.visible {
  opacity: 1;
  transform: translateY(0);
  display: block;
}

/* City header */
.city-header {
  position: relative;
  padding: 48px 40px 32px;
  background: linear-gradient(135deg, var(--primary-lighter), var(--accent-light));
  overflow: hidden;
}

.city-header::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -60px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}

.city-header::after {
  content: '';
  position: absolute;
  bottom: -40px;
  left: -40px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
}

.city-badge {
  display: inline-block;
  padding: 4px 14px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  border-radius: 20px;
  letter-spacing: 1px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}

.city-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 42px;
  font-weight: 700;
  color: var(--text);
  position: relative;
  z-index: 1;
}

.city-name .province {
  font-size: 16px;
  font-weight: 400;
  color: var(--text-secondary);
  font-family: 'Noto Sans SC', sans-serif;
  margin-left: 12px;
}

.city-desc {
  margin-top: 12px;
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  position: relative;
  z-index: 1;
  max-width: 600px;
}

.city-summary {
  margin-top: 6px;
  font-size: 13px;
  color: var(--primary-light);
  font-weight: 500;
  position: relative;
  z-index: 1;
}

/* Content sections */
.content {
  padding: 32px 40px 40px;
}

.section {
  margin-bottom: 32px;
}

.section:last-child {
  margin-bottom: 0;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--primary-lighter);
}

.section-title .section-icon {
  font-size: 20px;
}

.items-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.item-card {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  transition: var(--transition);
  cursor: default;
}

.item-card:hover {
  background: var(--primary-lighter);
  transform: translateX(4px);
}

.item-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
}

.item-name .item-emoji {
  margin-right: 6px;
}

.item-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Tips */
.tips-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tip-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--accent-light);
  border-radius: 20px;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
}

.tip-tag .tip-icon {
  font-size: 14px;
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 40px;
  padding: 24px;
  color: var(--text-tertiary);
  font-size: 13px;
}

/* Loading skeleton */
.loading-dots::after {
  content: '';
  animation: dots 1.2s steps(4) infinite;
}

@keyframes dots {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
}

/* Responsive */
@media (max-width: 640px) {
  .hero h1 { font-size: 28px; }
  .city-header { padding: 32px 24px 24px; }
  .content { padding: 24px; }
  .city-name { font-size: 32px; }
  .city-name .province { display: block; margin-left: 0; margin-top: 4px; font-size: 14px; }
  .items-grid { grid-template-columns: 1fr; }
  .draw-btn { padding: 14px 36px; font-size: 15px; width: 100%; justify-content: center; }
}
</style>
</head>

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderItems(items, container) {
  container.innerHTML = items.map(item => `
    <div class="item-card">
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc}</div>
    </div>
  `).join('');
}

function renderTips(tips) {
  tipsList.innerHTML = tips.map(tip => `
    <span class="tip-tag">
      <span class="tip-icon">✦</span>
      ${tip}
    </span>
  `).join('');
}

function drawCity() {
  // Pick random city
  const city = cities[Math.floor(Math.random() * cities.length)];

  // Update header
  cityBadge.textContent = city.badge;
  cityName.innerHTML = `${city.name} <span class="province">${city.province}</span>`;
  cityDesc.textContent = city.desc;
  citySummary.textContent = city.summary || '';

  // Shuffle and pick 4 sights + 4 foods
  const randomSights = shuffleArray(city.sights).slice(0, 4);
  const randomFood = shuffleArray(city.food).slice(0, 4);

  renderItems(randomSights, sightsGrid);
  renderItems(randomFood, foodGrid);
  renderTips(city.tips);

  // Show card
  resultCard.style.display = 'block';
  requestAnimationFrame(() => {
    resultCard.classList.add('visible');
  });

  // Scroll
  setTimeout(() => {
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

drawBtn.addEventListener('click', () => {
  // Spinning animation
  drawBtn.classList.add('spinning');
  btnText.textContent = '抽取中...';
  drawBtn.disabled = true;

  resultCard.classList.remove('visible');

  setTimeout(() => {
    drawCity();
    drawBtn.classList.remove('spinning');
    btnText.textContent = '再抽一次';
    drawBtn.disabled = false;
  }, 900);
});

// Initial draw on page load
drawCity();
</script>

</body>
</html>
