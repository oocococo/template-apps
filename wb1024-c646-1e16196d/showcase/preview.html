:root {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --surface-alt: #f3f1ed;
  --primary: #2d5a3d;
  --primary-light: #4a8a5e;
  --primary-lighter: #e8f0e4;
  --accent: #c97b3e;
  --accent-light: #f5e6d6;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9a9a9a;
  --border: #e5e2dc;
  --shadow: 0 8px 32px rgba(0,0,0,0.06);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.92);
}

.header-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 600;

const drawBtn = document.getElementById('drawBtn');
const btnText = document.getElementById('btnText');
const resultCard = document.getElementById('resultCard');
const cityBadge = document.getElementById('cityBadge');
const cityName = document.getElementById('cityName');
const cityDesc = document.getElementById('cityDesc');
const citySummary = document.getElementById('citySummary');
const sightsGrid = document.getElementById('sightsGrid');
const foodGrid = document.getElementById('foodGrid');
const tipsList = document.getElementById('tipsList');

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderItems(items, container) {
  container.innerHTML = items.map(item => `
    <div class="item-card">
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc}</div>
    </div>
  `).join('');
}

function renderTips(tips) {
  tipsList.innerHTML = tips.map(tip => `
    <span class="tip-tag">
      <span class="tip-icon">✦</span>
      ${tip}
    </span>
  `).join('');
}

function drawCity() {
  // Pick random city
  const city = cities[Math.floor(Math.random() * cities.length)];

  // Update header
  cityBadge.textContent = city.badge;
  cityName.innerHTML = `${city.name} <span class="province">${city.province}</span>`;
  cityDesc.textContent = city.desc;
  citySummary.textContent = city.summary || '';

  // Shuffle and pick 4 sights + 4 foods
  const randomSights = shuffleArray(city.sights).slice(0, 4);
  const randomFood = shuffleArray(city.food).slice(0, 4);

  renderItems(randomSights, sightsGrid);
  renderItems(randomFood, foodGrid);
  renderTips(city.tips);

  // Show card
  resultCard.style.display = 'block';
  requestAnimationFrame(() => {
    resultCard.classList.add('visible');
  });

  // Scroll
  setTimeout(() => {
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

drawBtn.addEventListener('click', () => {
  // Spinning animation
  drawBtn.classList.add('spinning');
  btnText.textContent = '抽取中...';
  drawBtn.disabled = true;

  resultCard.classList.remove('visible');

  setTimeout(() => {
    drawCity();
    drawBtn.classList.remove('spinning');
    btnText.textContent = '再抽一次';
    drawBtn.disabled = false;
  }, 900);
});

// Initial draw on page load
drawCity();
