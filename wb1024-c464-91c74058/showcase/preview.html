<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root {
  /* ===== 品牌与中性色 ===== */
  --brand: #4F46E5;
  --brand-hover: #4338CA;
  --brand-soft: #EEF2FF;
  --brand-border: #C7D2FE;

  --bg: #F7F7F9;
  --surface: #FFFFFF;
  --surface-2: #FAFAFB;
  --surface-3: #F2F3F5;

  --text-1: #18181B;
  --text-2: #52525B;
  --text-3: #8A8A94;
  --text-4: #B4B4BC;

  --line: #EAEAEE;
  --line-strong: #DCDCE2;

  /* ===== 四类时间消耗（PRD 5.x 固定口径） ===== */
  --study: #2563EB;
  --study-bg: #DBEAFE;
  --work: #EA580C;
  --work-bg: #FFEDD5;
  --leisure: #7C3AED;
  --leisure-bg: #EDE9FE;
  --life: #059669;
  --life-bg: #D1FAE5;

  /* ===== 辅助语义色 ===== */
  --warn: #D97706;
  --warn-bg: #FEF3C7;
  --danger: #DC2626;
  --danger-bg: #FEE2E2;
  --ok: #059669;

  /* ===== 圆角 / 阴影 ===== */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-full: 999px;

  --sh-1: 0 1px 2px rgba(24, 24, 27, .06);
  --sh-2: 0 2px 8px rgba(24, 24, 27, .07);
  --sh-3: 0 8px 28px rgba(24, 24, 27, .10);
  --sh-4: 0 20px 60px rgba(24, 24, 27, .16);

  /* ===== 尺寸 ===== */
  --sidebar-w: 232px;
  --tap: 44px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text-1);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }
::selection { background: var(--brand-border); }

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #D6D6DD; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #BFBFC8; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* 小字：创建时间等 */
.meta { font-size: 11.5px; color: var(--text-3); }

/* ============================================================
   碎记分拣本 · UI 原型样式
   基于 PRD v1.7：V1.0 纯 Web，桌面 + 移动双端
   ============================================================ */

/* ---------- 原型外壳（演示用，非产品界面） ---------- */
.stage {
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 15% -10%, #E8E9FF 0%, transparent 60%),
    radial-gradient(800px 500px at 100% 0%, #E6F4EE 0%, transparent 55%),
    #F4F4F7;
  padding: 22px 24px 40px;
}

.stage-bar {
  max-width: 1440px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.stage-title { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.stage-title small { font-weight: 400; color: var(--text-3); margin-left: 8px; font-size: 12px; }
.stage-spacer { flex: 1; }

.device-switch {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-full);
  padding: 3px;
  box-shadow: var(--sh-1);
}
.device-switch button {
  padding: 6px 15px;
  border-radius: var(--r-full);
  font-size: 12.5px;
  color: var(--text-2);
  display: flex; align-items: center; gap: 6px;
  transition: .16s;
}
.device-switch button.on { background: var(--text-1); color: #fff; font-weight: 500; }
.device-switch button:not(.on):hover { background: var(--surface-3); }

.hint-chip {
  font-size: 11.5px;
  color: var(--text-2);
  background: #fff;
  border: 1px solid var(--line);
  padding: 5px 11px;
  border-radius: var(--r-full);
  display: inline-flex; align-items: center; gap: 6px;
}
.hint-chip b { color: var(--brand); font-weight: 600; }

/* 桌面预览容器 */
.desktop-frame {
  max-width: 1440px;
  margin: 0 auto;
  height: min(920px, calc(100vh - 110px));
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--sh-4), 0 0 0 1px rgba(24,24,27,.05);
  overflow: hidden;
  display: flex;
}

/* 手机预览容器 */
.phone-stage { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; padding-top: 6px; }
.phone {
  width: 390px;
  height: 844px;
  background: #0B0B0F;
  border-radius: 46px;
  padding: 11px;
  box-shadow: var(--sh-4), 0 0 0 1px rgba(24,24,27,.10), inset 0 0 0 2px #2A2A31;
  position: relative;
  flex-shrink: 0;
}
.phone-screen {
  width: 100%; height: 100%;
  background: var(--bg);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}
.phone-notch {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 108px; height: 26px; background: #0B0B0F; border-radius: 0 0 16px 16px;
  z-index: 60;
}
.status-bar {
  height: 46px; flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 22px 6px;
  font-size: 12px; font-weight: 600; color: var(--text-1);
  position: relative; z-index: 50;
}
.status-bar .icons { display: flex; gap: 5px; align-items: center; }
.phone-label {
  text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--text-2);
}
.phone-label b { display: block; color: var(--text-1); font-size: 13.5px; margin-bottom: 2px; }
.phone-col { display: flex; flex-direction: column; align-items: center; }

.hidden { display: none !important; }

/* ============================================================
   桌面端 · 侧边栏
   ============================================================ */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 18px 12px 12px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; flex-shrink: 0;
}
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-name { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.brand-sub { font-size: 10.5px; color: var(--text-3); margin-top: -1px; }

.nav-group { margin-bottom: 6px; }
.nav-label {
  font-size: 10.5px; font-weight: 600; color: var(--text-4);
  letter-spacing: .06em; padding: 10px 10px 6px; text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-md);
  font-size: 13.2px; color: var(--text-2);
  cursor: pointer; transition: .13s; width: 100%; text-align: left;
  position: relative;
}
.nav-item:hover { background: rgba(0,0,0,.035); color: var(--text-1); }
.nav-item.on { background: #fff; color: var(--text-1); font-weight: 560; box-shadow: var(--sh-1); }
.nav-item.on .nav-ico { color: var(--brand); }
.nav-ico { width: 17px; height: 17px; flex-shrink: 0; color: var(--text-3); }
.nav-count {
  margin-left: auto; font-size: 11px; color: var(--text-3);
  background: rgba(0,0,0,.045); padding: 1px 7px; border-radius: var(--r-full);
  font-variant-numeric: tabular-nums;
}
.nav-item.on .nav-count { background: var(--brand-soft); color: var(--brand-hover); }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }

.sidebar-foot { margin-top: auto; padding: 10px 6px 0; border-top: 1px solid var(--line); }
.user-mini { display: flex; align-items: center; gap: 9px; padding: 8px 4px; border-radius: var(--r-md); cursor: pointer; }
.user-mini:hover { background: rgba(0,0,0,.035); }
.avatar {
  width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(140deg, #A5B4FC, #6366F1);
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600;
}
.sync-state { font-size: 10.5px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
.sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }

/* ============================================================
   桌面端 · 主区
   ============================================================ */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }

.topbar {
  height: 58px; flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 0 22px; border-bottom: 1px solid var(--line);
}
.topbar h1 { font-size: 15.5px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
.topbar-sub { font-size: 12px; color: var(--text-3); }
.topbar-spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 13px; border-radius: var(--r-md);
  font-size: 12.5px; font-weight: 500; transition: .14s; white-space: nowrap;
  border: 1px solid transparent;
}
.btn-ghost { color: var(--text-2); background: transparent; }
.btn-ghost:hover { background: var(--surface-3); color: var(--text-1); }
.btn-outline { border-color: var(--line-strong); background: #fff; color: var(--text-1); }
.btn-outline:hover { background: var(--surface-2); border-color: #CFCFD7; }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(79,70,229,.35); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-icon { width: 32px; padding: 0; }

/* 输入区（桌面常驻） */
.composer-wrap { padding: 14px 22px 0; flex-shrink: 0; }
.composer {
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  background: var(--surface);
  transition: .16s;
  overflow: hidden;
  box-shadow: var(--sh-1);
}
.composer.focus { border-color: var(--brand-border); box-shadow: 0 0 0 3.5px rgba(79,70,229,.10); }
.composer textarea {
  width: 100%; border: none; outline: none; resize: none;
  padding: 12px 14px 4px; font-size: 13.5px; line-height: 1.6;
  color: var(--text-1); background: transparent; max-height: 132px;
}
.composer textarea::placeholder { color: var(--text-4); }
.composer-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 9px 14px;
}
.type-hint {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-2);
  background: var(--surface-3); padding: 3px 9px; border-radius: var(--r-full);
  transition: .18s;
  border: none; font-family: inherit; line-height: 1.5;
  cursor: pointer; white-space: nowrap;
}
.type-hint:hover { filter: brightness(.97); box-shadow: 0 0 0 1px rgba(0,0,0,.06) inset; }
.type-hint:active { transform: translateY(1px); }
.type-hint .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-4); flex-shrink: 0; }
.type-hint.idle { color: var(--text-3); background: transparent; box-shadow: 0 0 0 1px var(--line) inset; }
.type-hint .tp-caret { font-size: 9px; opacity: .55; margin-left: 1px; }
.type-hint .tp-flag {
  font-size: 9.5px; padding: 0 4px; border-radius: 4px;
  background: rgba(0,0,0,.10); color: inherit; letter-spacing: .02em;
}
.type-hint.manual { box-shadow: 0 0 0 1.5px currentColor inset; }
.type-hint.t-todo { background: #FEF3C7; color: #92400E; }
.type-hint.t-todo .dot { background: #D97706; }
.type-hint.t-note { background: #E0E7FF; color: #3730A3; }
.type-hint.t-note .dot { background: #4F46E5; }
.type-hint.t-idea { background: #EDE9FE; color: #5B21B6; }
.type-hint.t-idea .dot { background: #7C3AED; }
.type-hint.t-timelog { background: #D1FAE5; color: #065F46; }
.type-hint.t-timelog .dot { background: #059669; }

/* 类型选择浮层：贴着提示按钮弹出，电脑/手机同一套 */
.type-pop {
  position: fixed; z-index: 3200; width: 190px;
  background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(17,24,39,.16), 0 2px 6px rgba(17,24,39,.06);
  padding: 5px; animation: tpIn .14s ease-out;
}
@keyframes tpIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.type-pop .tp-title {
  font-size: 10.5px; color: var(--text-3); font-weight: 600;
  padding: 4px 8px 6px; display: flex; align-items: center; gap: 6px;
}
.type-pop .tp-title small { font-weight: 400; opacity: .7; }
.type-pop .tp-item {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 8px; font-size: 12.5px; color: var(--text-1);
  background: transparent; border: none; font-family: inherit; text-align: left; cursor: pointer;
}
.type-pop .tp-item:hover { background: var(--surface-2); }
.type-pop .tp-item.on { background: var(--surface-3); font-weight: 600; }
.type-pop .tp-item.tp-auto { border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 3px; padding-top: 8px; }
.type-pop .tp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.type-pop .tp-dot.auto { background: transparent; box-shadow: 0 0 0 1.5px var(--text-4) inset; }
.type-pop .tp-name { flex: 1; }
.type-pop .tp-check { font-size: 11px; color: var(--brand); opacity: 0; }
.type-pop .tp-item.on .tp-check { opacity: 1; }
.composer-kbd { font-size: 11px; color: var(--text-4); }
.composer-kbd kbd {
  background: var(--surface-3); border: 1px solid var(--line-strong);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 10px;
  font-family: inherit; color: var(--text-2);
}
.composer-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* 内容滚动区 */
.content { flex: 1; overflow-y: auto; padding: 16px 22px 28px; }

/* 过滤器条 */
.filter-row { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
.chip {
  height: 28px; padding: 0 11px; border-radius: var(--r-full);
  font-size: 12px; color: var(--text-2); background: #fff;
  border: 1px solid var(--line-strong); display: inline-flex; align-items: center; gap: 5px;
  transition: .14s;
}
.chip:hover { border-color: #CFCFD7; background: var(--surface-2); }
.chip.on { background: var(--text-1); color: #fff; border-color: var(--text-1); }
.chip .c-dot { width: 6px; height: 6px; border-radius: 50%; }

.section-title {
  font-size: 11.5px; font-weight: 600; color: var(--text-3);
  letter-spacing: .02em; margin: 22px 0 9px; display: flex; align-items: center; gap: 8px;
}
.section-title:first-child { margin-top: 4px; }
.section-title .line { flex: 1; height: 1px; background: var(--line); }
.section-title .cnt { font-weight: 500; color: var(--text-4); }

/* ============================================================
   待办
   ============================================================ */
.todo-list { display: flex; flex-direction: column; gap: 7px; }
.todo {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 13px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: #fff;
  transition: .15s; position: relative;
}
.todo:hover { border-color: var(--line-strong); box-shadow: var(--sh-2); }
.todo:hover .todo-ops { opacity: 1; }

.todo-box {
  width: 19px; height: 19px; flex-shrink: 0; margin-top: 1px;
  border: 1.8px solid #C9C9D2; border-radius: 6px;
  display: grid; place-items: center; transition: .15s;
  cursor: pointer; background: #fff;
}
.todo-box:hover { border-color: var(--brand); background: var(--brand-soft); }
.todo-box svg { opacity: 0; transform: scale(.6); transition: .15s; }
.todo.done .todo-box { background: var(--text-4); border-color: var(--text-4); }
.todo.done .todo-box svg { opacity: 1; transform: scale(1); }

.todo-body { flex: 1; min-width: 0; }
.todo-text { font-size: 13.5px; line-height: 1.5; color: var(--text-1); word-break: break-word; }
.todo.done .todo-text { color: var(--text-4); text-decoration: line-through; text-decoration-color: #D4D4DA; }

.todo-meta { display: flex; align-items: center; gap: 7px; margin-top: 5px; flex-wrap: wrap; }
.plan-date {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 550; color: #B45309;
  background: #FEF3C7; padding: 1.5px 7px; border-radius: 5px;
  font-variant-numeric: tabular-nums;
}
.plan-date.past { color: #B91C1C; background: var(--danger-bg); }
.plan-date.today { color: #065F46; background: #D1FAE5; }
.todo-time { font-size: 11px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.split-tag {
  font-size: 10px; color: var(--brand-hover); background: var(--brand-soft);
  padding: 1px 5px; border-radius: 4px; font-weight: 600;
}
.done-time { font-size: 11px; color: var(--text-4); font-variant-numeric: tabular-nums; }

.todo-ops { display: flex; gap: 2px; opacity: 0; transition: .14s; align-self: center; }
.op-btn {
  width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
  color: var(--text-3);
}
.op-btn:hover { background: var(--surface-3); color: var(--text-1); }
.op-btn.danger:hover { background: var(--danger-bg); color: var(--danger); }

/* 已完成 · 周分组 */
.week-group { margin-bottom: 18px; }
.week-head {
  display: flex; align-items: center; gap: 9px;
  font-size: 11.5px; color: var(--text-3); margin-bottom: 8px; font-weight: 500;
}
.week-head .wk { color: var(--text-2); font-weight: 600; }
.week-head .line { flex: 1; height: 1px; background: var(--line); }
.week-head .toggle { color: var(--text-3); font-size: 11px; padding: 2px 6px; border-radius: 5px; }
.week-head .toggle:hover { background: var(--surface-3); }
.todo.done { background: var(--surface-2); border-color: var(--line); }

/* ============================================================
   读书笔记 / 灵感（卡片 + 索引）
   ============================================================ */
.two-col { display: grid; grid-template-columns: 1fr 208px; gap: 22px; align-items: start; }
.note-index {
  position: sticky; top: 0;
  border-left: 1px solid var(--line); padding-left: 14px;
}
.note-index h4 { font-size: 10.5px; font-weight: 600; color: var(--text-4); letter-spacing: .06em; margin: 0 0 9px; text-transform: uppercase; }
.idx-item {
  display: flex; align-items: center; gap: 7px; width: 100%;
  padding: 5px 7px; border-radius: 6px; font-size: 12.3px; color: var(--text-2);
  text-align: left; transition: .13s; margin-bottom: 1px;
}
.idx-item:hover { background: var(--surface-3); color: var(--text-1); }
.idx-item.on { background: var(--brand-soft); color: var(--brand-hover); font-weight: 550; }
.idx-item .n { margin-left: auto; font-size: 10.5px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.idx-item.idx-new { color: var(--brand); margin-top: 8px; font-weight: 550; }
.idx-item.idx-new:hover { background: var(--brand-soft); color: var(--brand-hover); }
.idx-book { width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0; }

.notes-stream { display: flex; flex-direction: column; gap: 10px; }
.note-card {
  border: 1px solid var(--line); border-radius: var(--r-md); background: #fff;
  padding: 13px 15px; transition: .15s; position: relative;
}
.note-card:hover { border-color: var(--line-strong); box-shadow: var(--sh-2); }
.note-card:hover .todo-ops { opacity: 1; }
.note-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.book-name {
  font-size: 11.5px; font-weight: 600; color: #3730A3;
  background: #E0E7FF; padding: 2px 8px; border-radius: 5px;
  display: inline-flex; align-items: center; gap: 4px;
}
.book-name.unfiled { color: var(--text-2); background: var(--surface-3); }
.cat-name {
  font-size: 11.5px; font-weight: 600; color: #5B21B6;
  background: #EDE9FE; padding: 2px 8px; border-radius: 5px;
  display: inline-flex; align-items: center; gap: 4px;
}
.note-content { font-size: 13.3px; line-height: 1.68; color: #2C2C33; white-space: pre-wrap; word-break: break-word; }
.note-content.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.note-more { font-size: 11.5px; color: var(--brand); margin-top: 5px; font-weight: 500; }
.note-foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
.src-chip {
  font-size: 10.5px; color: var(--text-3); background: var(--surface-3);
  padding: 1px 6px; border-radius: 4px;
}

/* ============================================================
   时间消耗
   ============================================================ */
.tabs { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; }
.tabs button {
  padding: 5px 16px; border-radius: 7px; font-size: 12.5px; color: var(--text-2); font-weight: 500; transition: .14s;
}
.tabs button.on { background: #fff; color: var(--text-1); box-shadow: var(--sh-1); }

.stat-card {
  border: 1px solid var(--line); border-radius: var(--r-lg); background: #fff;
  padding: 15px 17px; margin-bottom: 16px;
}
.stat-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.stat-total { font-size: 21px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-total small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 5px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 13px; }
.stat-item { display: flex; flex-direction: column; gap: 3px; }
.stat-item .k { font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.stat-item .v { font-size: 16px; font-weight: 640; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat-item .v small { font-size: 11px; font-weight: 500; color: var(--text-3); }
.stackbar { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
.stackbar span { display: block; height: 100%; transition: width .3s; }

.tl-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.tl-date { font-size: 13.5px; font-weight: 600; min-width: 132px; font-variant-numeric: tabular-nums; }

/* 日视图：24h 纵轴 */
.day-wrap {
  border: 1px solid var(--line); border-radius: var(--r-lg); background: #fff;
  padding: 14px 16px; display: flex; gap: 12px;
}
.hour-col { width: 44px; flex-shrink: 0; position: relative; }
.hour-col span {
  position: absolute; right: 0; transform: translateY(-50%);
  font-size: 10.5px; color: var(--text-4); font-variant-numeric: tabular-nums;
}
.day-track { flex: 1; position: relative; border-left: 1px solid var(--line); }
.hour-line { position: absolute; left: 0; right: 0; height: 1px; background: #F3F3F6; }
.hour-line.half { background: #F8F8FA; }
.tl-block {
  position: absolute; left: 6px; right: 6px; border-radius: 7px;
  padding: 6px 9px; font-size: 11.5px; overflow: hidden;
  border-left: 3px solid; transition: .15s; cursor: pointer;
}
.tl-block:hover { filter: brightness(.97); box-shadow: var(--sh-2); z-index: 6; }
.tl-block .bt { font-weight: 600; font-size: 11.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-block .bs { font-size: 10.5px; opacity: .78; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 短时段（<40px）：不换行，时间与描述并成一行，垂直居中 */
.tl-block.tight { padding: 0 8px; display: flex; flex-direction: column; justify-content: center; }
.tl-block.tight .bt { font-size: 10.2px; line-height: 1.15; }
.tl-block.tight .bs { display: none; }
/* 挤到放不下时：左右错开并列，宁可窄也不遮住下一条 */
.tl-block.narrow { padding: 0 5px; }
.tl-block.narrow .bt { font-size: 9px; letter-spacing: -.1px; }
.now-line { position: absolute; left: 0; right: 0; height: 1.5px; background: #EF4444; z-index: 5; }
.now-line::before {
  content: ''; position: absolute; left: -4px; top: -3px;
  width: 7px; height: 7px; border-radius: 50%; background: #EF4444;
}

/* 周视图：7×24 网格 */
.week-wrap { border: 1px solid var(--line); border-radius: var(--r-lg); background: #fff; overflow: hidden; }
.week-grid { display: grid; grid-template-columns: 42px repeat(7, 1fr); }
.wk-head { padding: 8px 0; text-align: center; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.wk-head .d { font-size: 11px; color: var(--text-3); }
.wk-head .n { font-size: 13px; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }
.wk-head.today .n { color: var(--brand); }
.wk-cell { position: relative; border-left: 1px solid #F4F4F7; }
.wk-col-body { position: relative; }
.wk-lane { position: relative; height: 100%; border-left: 1px solid #F4F4F7; }
.wk-lane.today { background: #FBFBFF; }
.wk-block {
  position: absolute; left: 2px; right: 2px; border-radius: 4px;
  font-size: 9px; padding: 0 4px; line-height: 13px; overflow: hidden; border-left: 2px solid;
  white-space: nowrap; text-overflow: ellipsis;
}
.wk-hours { position: relative; }

/* 月视图 */
.month-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
}
.month-dow { background: var(--surface-2); text-align: center; padding: 7px 0; font-size: 11px; color: var(--text-3); font-weight: 500; }
.month-cell {
  background: #fff; min-height: 96px; padding: 6px 7px; cursor: pointer; transition: .13s;
  display: flex; flex-direction: column; gap: 4px;
}
.month-cell:hover { background: #FCFCFF; }
.month-cell.out { background: var(--surface-2); }
.month-cell.out .md { color: var(--text-4); }
.month-cell.today { box-shadow: inset 0 0 0 2px var(--brand-border); }
.md { font-size: 11.5px; color: var(--text-2); font-weight: 550; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 5px; }
.month-cell.today .md { color: var(--brand); font-weight: 700; }
.md .sum { margin-left: auto; font-size: 9.5px; color: var(--text-4); font-weight: 400; }
.mbar { display: flex; flex-direction: column; gap: 2px; }
.mbar span { height: 3px; border-radius: 2px; }

/* 时间消耗流水列表 */
.log-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: #fff;
  margin-bottom: 6px; transition: .14s;
}
.log-row:hover { border-color: var(--line-strong); box-shadow: var(--sh-1); }
.log-row:hover .todo-ops { opacity: 1; }
.log-cat { width: 3px; height: 26px; border-radius: 2px; flex-shrink: 0; }
.log-time { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; width: 116px; flex-shrink: 0; }
.log-dur { font-size: 12px; font-weight: 600; width: 52px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.log-tag { font-size: 10.5px; font-weight: 600; padding: 1.5px 7px; border-radius: 5px; flex-shrink: 0; }
.log-desc { font-size: 12.8px; color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================
   Toast
   ============================================================ */
.toast-layer {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  background: #18181B; color: #fff; font-size: 12.5px;
  padding: 9px 15px; border-radius: var(--r-full);
  box-shadow: var(--sh-3); display: flex; align-items: center; gap: 8px;
  animation: toastIn .22s cubic-bezier(.2,.9,.3,1.2);
  max-width: 460px;
}
.toast.warn { background: #92400E; }
.toast.ok { background: #065F46; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.phone .toast-layer { position: absolute; bottom: 96px; }

/* ============================================================
   移动端
   ============================================================ */
.m-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* 速记页 */
.quick-head {
  padding: 6px 18px 10px; display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.quick-head h2 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.quick-head .dots { margin-left: auto; color: var(--text-3); font-size: 17px; letter-spacing: 1px; }

.quick-body { flex: 1; padding: 4px 18px 0; display: flex; flex-direction: column; min-height: 0; }
.quick-card {
  border: 1.5px solid var(--brand-border);
  background: #fff; border-radius: 16px; padding: 13px 14px;
  box-shadow: 0 0 0 4px rgba(79,70,229,.07), var(--sh-2);
  display: flex; flex-direction: column;
  min-height: 168px;
}
.quick-card textarea {
  border: none; outline: none; resize: none; flex: 0 0 auto; width: 100%; box-sizing: border-box;
  font-size: 16px; /* 防止 iOS 自动放大 */
  line-height: 1.6; color: var(--text-1); background: transparent;
  min-height: 96px; max-height: 220px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.quick-card textarea::placeholder { color: var(--text-4); }
.quick-hint { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.qsend {
  width: var(--tap); height: var(--tap); border-radius: 13px; flex-shrink: 0;
  background: var(--brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 3px 10px rgba(79,70,229,.30); transition: .14s;
  margin-left: auto;
}
.qsend:active { transform: scale(.94); }
.qsend.off { background: var(--surface-3); color: var(--text-4); box-shadow: none; }

.quick-tips { margin-top: 16px; }
.quick-tips .qt-title { font-size: 11px; color: var(--text-4); font-weight: 600; letter-spacing: .05em; margin-bottom: 7px; text-transform: uppercase; }
.qt-item {
  display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px;
  background: var(--surface-2); border-radius: 9px; margin-bottom: 6px;
  font-size: 12.2px; color: var(--text-2); line-height: 1.5;
  border: 1px solid transparent; transition: .13s; width: 100%; text-align: left;
}
.qt-item:active { background: var(--surface-3); }
.qt-item b { color: var(--text-1); font-weight: 550; }
.qt-ico { font-size: 13px; flex-shrink: 0; }

.quick-foot {
  flex-shrink: 0; padding: 10px 18px 16px; display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; color: var(--text-3);
}
.quick-foot .go {
  margin-left: auto; color: var(--brand); font-weight: 600; font-size: 12.5px;
  display: flex; align-items: center; gap: 3px;
}

/* 列表页 + 底部 tab */
.m-top {
  padding: 4px 18px 10px; display: flex; align-items: center; flex-shrink: 0;
}
.m-top h2 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.m-top .spacer { flex: 1; }

.m-composer {
  margin: 0 14px 8px; flex-shrink: 0;
  display: flex; align-items: flex-end; gap: 8px;
  background: #fff; border: 1px solid var(--line-strong); border-radius: 13px;
  padding: 7px 7px 7px 12px; box-shadow: var(--sh-1);
}
/* 注意：textarea 不能用 flex:1 —— 在竖排容器里 flex-basis:0 会把 JS 撑出来的高度压回去，
   文字就会被裁成两行半；宽度也必须显式 100%，否则 align-items:flex-start 会按内容收窄。 */
.m-composer textarea {
  flex: 0 0 auto; width: 100%; box-sizing: border-box;
  border: none; outline: none; resize: none;
  font-size: 16px; line-height: 1.45; max-height: 148px; background: transparent;
  padding: 5px 0 3px; color: var(--text-1);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.m-composer textarea::placeholder { color: var(--text-4); }
/* 输入框 + 类型提示竖排，右侧留出发送按钮 */
.m-composer-in { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
.m-composer .m-hint { align-self: flex-start; font-size: 11px; padding: 2px 8px; margin-bottom: 1px; }
.m-composer .m-hint.idle { background: transparent; box-shadow: none; color: var(--text-4); padding-left: 2px; }
.msend {
  width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff;
  display: grid; place-items: center; flex-shrink: 0; transition: .14s;
}
.msend.off { background: var(--surface-3); color: var(--text-4); }

.m-tabs { display: flex; gap: 5px; padding: 0 14px 9px; overflow-x: auto; flex-shrink: 0; }
.m-tabs::-webkit-scrollbar { display: none; }
.m-tabs button {
  padding: 5px 12px; border-radius: var(--r-full); font-size: 12.5px;
  color: var(--text-2); background: #fff; border: 1px solid var(--line-strong);
  white-space: nowrap; transition: .14s; flex-shrink: 0;
}
.m-tabs button.on { background: var(--text-1); color: #fff; border-color: var(--text-1); }

.m-content { flex: 1; overflow-y: auto; padding: 0 14px 14px; min-height: 0; }

.m-tabbar {
  flex-shrink: 0; height: 62px; border-top: 1px solid var(--line);
  background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: 6px; align-items: center;
}
.m-tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; color: var(--text-3); height: var(--tap); justify-content: center;
  transition: .14s;
}
.m-tab.on { color: var(--brand); font-weight: 600; }

/* 移动端卡片紧凑化 */
.phone .todo { padding: 10px 11px; }
.phone .todo-text { font-size: 14px; }
.phone .note-content { font-size: 14px; }
.phone .log-row { flex-wrap: wrap; gap: 6px 8px; }
.phone .log-time { width: auto; }
.phone .log-desc { flex-basis: 100%; white-space: normal; }

/* 手机内 toast */
.toast-layer-inline { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; z-index: 900; }

/* ============================================================
   响应式收尾
   ============================================================ */
@media (max-width: 1180px) {
  .two-col { grid-template-columns: 1fr; }
  .note-index { position: static; border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 12px; }
}

/* ---------- 原始消息：未归类归位按钮 / 空状态 ---------- */
.mini-btn {
  background: #fff; border: 1px solid var(--line); cursor: pointer;
  color: var(--text-2); font-size: 11.5px; font-weight: 550;
  height: 22px; padding: 0 9px; border-radius: 6px; margin-left: 4px;
  transition: all .12s;
}
.mini-btn:hover { border-color: var(--brand-border); color: var(--brand); background: var(--brand-soft); }
.mini-btn[data-as="del"]:hover { border-color: #FCA5A5; color: #B91C1C; background: #FEF2F2; }
.mini-btn:disabled { opacity: .45; cursor: default; }

.m-inbox-tip {
  background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA;
  font-size: 12px; font-weight: 550; padding: 8px 11px; border-radius: 8px; margin-bottom: 9px;
}
.empty-state { padding: 64px 20px; text-align: center; }
.empty-title { font-size: 14.5px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
.empty-sub { font-size: 12.5px; color: var(--text-3); }

/* ============================================================
   真机模式：手机 / 窄屏访问时，去掉演示外壳与手机模型，全屏呈现
   ============================================================ */
.qm-back, .qm-jump { display: none; }

body.real-mobile { background: var(--bg); }
body.real-mobile .stage-bar { display: none !important; }
body.real-mobile .stage { padding: 0; height: auto; }
body.real-mobile #desktopView { display: none !important; }
body.real-mobile #mobileView { display: block !important; padding: 0; gap: 0; }
body.real-mobile .phone-col { width: 100%; }
body.real-mobile .phone-col[hidden] { display: none !important; }
body.real-mobile .phone {
  width: 100%; height: 100dvh; border-radius: 0; padding: 0;
  border: none; box-shadow: none; background: var(--bg);
}
body.real-mobile .phone-notch,
body.real-mobile .phone-label { display: none !important; }
body.real-mobile .phone-screen { border-radius: 0; height: 100dvh; }
body.real-mobile .status-bar { display: none; }
body.real-mobile .quick-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
body.real-mobile .m-tabbar { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
body.real-mobile .qm-back,
body.real-mobile .qm-jump { display: inline-flex; }
body.real-mobile .dots { display: none; }

/* 真机下的两个导航按钮 */
.qm-back {
  background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--brand); font-weight: 550;
  padding: 4px 2px; margin-left: -2px;
}
.qm-jump {
  background: var(--brand-soft); border: none; cursor: pointer;
  color: var(--brand); font-size: 12.5px; font-weight: 600;
  height: 28px; padding: 0 11px; border-radius: 999px;
}

/* ============ 真机诊断浮层 ============ */
.diag-btn {
  position: fixed; right: 10px; bottom: 78px; z-index: 9000;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.92);
  color: var(--text-3); font: 600 12px/1 ui-sans-serif, system-ui;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12);
}
.diag-out {
  position: fixed; inset: auto 8px 8px 8px; z-index: 9001;
  max-height: 46vh; overflow: auto; margin: 0;
  padding: 10px 12px; border-radius: 12px;
  background: rgba(17,24,39,.94); color: #d1fae5;
  font: 11px/1.55 ui-monospace, Menlo, Consolas, monospace;
  white-space: pre-wrap; word-break: break-all;
  box-shadow: 0 8px 28px rgba(0,0,0,.28);
}


/* ============ 手机端时间页：日/周/月切换 + 翻页 ============ */
.m-tl-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.m-tl-bar .tabs { align-self: flex-start; }
.m-tl-nav { display: flex; align-items: center; gap: 4px; }
.m-tl-nav .tl-date {
  flex: 1; min-width: 0; text-align: center;
  font-size: 13px; font-weight: 600; letter-spacing: -.1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.m-arrow {
  width: 30px; height: 30px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 9px; color: var(--text-2); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.m-arrow:active { background: var(--surface-2); }
.m-back {
  flex-shrink: 0; margin-left: 4px; height: 26px; padding: 0 9px;
  border: 1px solid var(--line); background: none; border-radius: 999px;
  color: var(--brand); font-size: 11.5px; font-weight: 600; cursor: pointer;
}

/* 紧凑周视图（手机） */
.week-wrap.compact { border-radius: 12px; }
.week-wrap.compact .week-grid { grid-template-columns: 26px repeat(7, 1fr); }
.week-wrap.compact .hour-line { background: #F6F6F9; }
.week-wrap.compact .hour-line.dim { background: #EDEDF2; }
.wk-head-gut { border-bottom: 1px solid var(--line); background: var(--surface-2); border-right: 1px solid var(--line); }
.wk-head-btn {
  border: none; border-bottom: 1px solid var(--line); font: inherit;
  background: var(--surface-2); cursor: pointer; padding: 5px 0 4px;
  display: block; width: 100%; -webkit-tap-highlight-color: transparent;
}
.wk-head-btn .d { font-size: 10px; color: var(--text-3); }
.wk-head-btn .n { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.wk-head-btn.today .n { color: var(--brand); }
.wk-head-btn.today { background: var(--brand-soft); }
.wk-head-btn .wk-t { font-size: 8.5px; font-variant-numeric: tabular-nums; margin-top: 1px; }
.wk-lane[data-mday] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.week-wrap.compact .wk-block { left: 1px; right: 1px; border-radius: 3px; border-left-width: 2px; padding: 0 1px; font-size: 8px; line-height: 1.1; overflow: hidden; }

/* 手机端日视图：刻度列收窄，给正文留宽 */
.phone .day-wrap .hour-col { width: 34px; }
.phone .day-wrap .hour-col span { font-size: 9.5px; right: 5px; }
.phone .tl-block { left: 4px; right: 4px; padding: 5px 7px; }
.phone .tl-block .bt { font-size: 11px; }
.phone .tl-block .bs { font-size: 9.5px; }
/* 紧凑周视图占满手机可用宽度 */
.week-wrap.compact { margin-left: -4px; margin-right: -4px; }

/* ============ 笔记/灵感：内容可直接点开修改 ============ */
.note-content {
  cursor: pointer; border-radius: 6px;
  transition: background .12s, box-shadow .12s;
}
.note-content:hover { background: var(--surface-2); box-shadow: 0 0 0 4px var(--surface-2); }
.note-content:active { background: var(--surface-3); box-shadow: 0 0 0 4px var(--surface-3); }

/* 手机上没有 hover：操作按钮常显，尺寸放大到好点 */
.phone .note-card .todo-ops,
.phone .todo .todo-ops { opacity: 1; }
.phone .op-btn { width: 32px; height: 32px; color: var(--text-2); }
.phone .note-head { gap: 6px; }
.phone .note-content { -webkit-tap-highlight-color: transparent; }
/* 手机窄屏：书名过长时省略，别把右侧按钮挤掉 */
.phone .note-head .book-name,
.phone .note-head .cat-name {
  max-width: 44%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.phone .note-head .todo-ops { margin-left: 2px; }

/* ============ 手机端笔记页：书籍索引 ============ */
.m-idx {
  position: sticky; top: 0; z-index: 3;
  display: flex; gap: 7px; align-items: center;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  margin: 0 -14px 6px; padding: 8px 14px 9px;
  background: var(--bg);
  box-shadow: 0 8px 10px -9px rgba(24, 24, 27, .18);
  scrollbar-width: none;
}
.m-idx::-webkit-scrollbar { display: none; }
.m-idx .chip {
  flex: 0 0 auto; height: 32px; padding: 0 12px;
  font-size: 12.5px; max-width: 62vw;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.m-idx .chip .n {
  font-size: 10.5px; color: var(--text-4);
  font-variant-numeric: tabular-nums; margin-left: 1px;
}
.m-idx .chip.on .n { color: rgba(255, 255, 255, .74); }
.m-idx .chip:active { transform: scale(.97); }
.m-idx .chip.chip-new {
  color: var(--brand); border-style: dashed; background: transparent;
  font-weight: 550; letter-spacing: .01em;
}

.m-list-meta {
  font-size: 11.5px; color: var(--text-4);
  margin: 0 0 9px; line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#btnLogout,.js-setpwd { display:none !important; }

/* ============================================================
   登录页 / 弹窗 / 表单控件
   ============================================================ */

/* ---------------- 登录 ---------------- */
.login-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: radial-gradient(1100px 520px at 50% -8%, #EEF2FF 0%, var(--bg) 55%);
  z-index: 60;
  overflow: auto;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-3);
  padding: 26px 24px 22px;
}
.login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.login-brand .brand-mark { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; }
.login-brand .brand-name { font-size: 14px; font-weight: 650; letter-spacing: .2px; }
.login-brand .brand-sub { font-size: 10.5px; color: var(--text-4); letter-spacing: .6px; text-transform: uppercase; }

.login-card h2 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.2px; }
.login-sub { font-size: 12.5px; color: var(--text-3); margin: 0 0 18px; line-height: 1.6; }

.login-tabs {
  display: flex; gap: 4px; padding: 3px;
  background: var(--surface-3); border-radius: var(--r-md); margin-bottom: 16px;
}
.login-tabs button {
  flex: 1; height: 32px; border-radius: 8px;
  font-size: 12.5px; color: var(--text-2); font-weight: 500;
  transition: .15s;
}
.login-tabs button.on { background: var(--surface); color: var(--text-1); box-shadow: var(--sh-1); font-weight: 600; }

/* 账号类型（手机号 / 邮箱）：次级、轻量，别和「登录方式」抢视线 */
.login-tabs-sub {
  background: transparent; padding: 0; gap: 16px; margin: -8px 0 14px;
  justify-content: flex-start;
}
.login-tabs-sub button {
  flex: 0 0 auto; height: auto; padding: 2px 0 3px;
  background: none; box-shadow: none; border-radius: 0;
  font-size: 12px; color: var(--text-4);
  border-bottom: 1.5px solid transparent;
}
.login-tabs-sub button.on {
  background: none; box-shadow: none; border-radius: 0;
  color: var(--brand); font-weight: 600; border-bottom-color: var(--brand);
}

.code-row { display: flex; gap: 8px; }
.code-row input { flex: 1; min-width: 0; }
.code-row .btn { flex: 0 0 auto; white-space: nowrap; }

.login-err {
  display: none;
  font-size: 12px; color: var(--danger);
  background: var(--danger-bg);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  margin: 4px 0 10px;
  line-height: 1.5;
}
.login-err.on { display: block; }

.login-btn { width: 100%; height: 40px; justify-content: center; font-size: 14px; margin-top: 4px; }
.login-btn:disabled { opacity: .6; cursor: default; }
.login-foot { font-size: 11.5px; color: var(--text-4); margin: 14px 0 0; line-height: 1.6; text-align: center; }

/* ---------------- 表单控件 ---------------- */
/* 必须 !important：下面 .fld{display:flex} 会盖掉浏览器默认的 [hidden]{display:none}，
   导致「密码登录」里照样显示验证码框（反之亦然）。 */
[hidden] { display: none !important; }
.fld { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.fld > span { font-size: 12px; color: var(--text-2); font-weight: 500; }
.fld-row { display: flex; gap: 10px; }
.fld-row .fld { flex: 1; min-width: 0; }

.fld input, .fld textarea, .fld select {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  padding: 9px 11px;
  font-size: 13.5px;
  color: var(--text-1);
  background: var(--surface);
  outline: none;
  transition: .15s;
  resize: vertical;
}
.fld input:focus, .fld textarea:focus, .fld select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.fld textarea { line-height: 1.65; }

/* ---------------- 弹窗 ---------------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: 20px 14px;
  background: rgba(24, 24, 27, .34);
  backdrop-filter: blur(2px);
  overflow: auto;
}
.modal-mask.hidden { display: none; }

.modal {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-4);
  animation: modalIn .16s ease-out;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }

.modal-head {
  display: flex; align-items: center; gap: 8px;
  padding: 15px 18px 12px;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.1px; }
.modal-x {
  margin-left: auto; width: 28px; height: 28px; border-radius: 8px;
  font-size: 19px; line-height: 1; color: var(--text-3);
  display: grid; place-items: center;
}
.modal-x:hover { background: var(--surface-3); color: var(--text-1); }

.modal-body { padding: 16px 18px; overflow: auto; flex: 1; }
.modal-body .fld:last-child { margin-bottom: 0; }

.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 18px 15px;
  border-top: 1px solid var(--line);
}
.modal-foot .btn { height: 34px; padding: 0 16px; }

.modal-err {
  margin-top: 10px; font-size: 12px; color: var(--danger);
  background: var(--danger-bg); border-radius: var(--r-sm);
  padding: 8px 10px; line-height: 1.5;
}
.modal-tip { font-size: 12.5px; color: var(--text-3); margin: 0 0 12px; line-height: 1.65; }
.modal-tip b { color: var(--text-2); font-weight: 600; }

/* 书籍选择 */
.pick-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.pick-item {
  border: 1px solid var(--line-strong); border-radius: var(--r-full);
  padding: 5px 12px; font-size: 12.5px; color: var(--text-2);
  background: var(--surface); transition: .15s;
}
.pick-item:hover { border-color: var(--brand-border); color: var(--brand); }
.pick-item.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 550; }

/* 导入预览 */
.imp-list { display: flex; flex-direction: column; gap: 9px; }
.imp-row {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 10px 12px; background: var(--surface-2);
}
.imp-row input[type="checkbox"] { margin-top: 3px; accent-color: var(--brand); width: 15px; height: 15px; flex: 0 0 auto; }
.imp-main { flex: 1; min-width: 0; }
.imp-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.imp-extra {
  flex: 1; min-width: 110px;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  padding: 3px 8px; font-size: 12px; outline: none; background: var(--surface);
}
.imp-extra:focus { border-color: var(--brand); }
.imp-text { font-size: 12.5px; color: var(--text-2); line-height: 1.6; word-break: break-word; }

/* 移动端适配 */
@media (max-width: 560px) {
  .modal { max-width: 100%; max-height: 92vh; }
  .modal-body { padding: 14px; }
  .fld-row { flex-direction: column; gap: 0; }
}

/* ============ 笔记编辑器（手机/桌面共用） ============ */
.fld-count { float: right; font-size: 11px; color: var(--text-4); font-weight: 400; font-variant-numeric: tabular-nums; }
.fld textarea[data-autogrow] {
  min-height: 132px; resize: none; overflow: auto;
  font-size: 13.8px; line-height: 1.75;
}

@media (max-width: 560px) {
  /* 手机上做成底部抽屉：键盘弹起时也够得着输入区 */
  .modal-mask { align-items: flex-end; padding: 0; }
  .modal {
    max-width: 100%; max-height: 92dvh;
    border-radius: 16px 16px 0 0;
    animation: sheetIn .18s ease-out;
  }
  @keyframes sheetIn { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
  .modal-head { padding: 14px 16px 10px; }
  .modal-body { padding: 12px 16px 6px; }
  .modal-foot {
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    position: sticky; bottom: 0; background: var(--surface);
  }
  .modal-foot .btn { flex: 1; height: 42px; }
  /* 16px 防 iOS 聚焦时页面放大 */
  .fld textarea[data-autogrow] { font-size: 16px; min-height: 150px; }
  .fld input { font-size: 16px; }
}

<script>const records={message:[],todo:[],book:[],reading_note:[],idea_category:[],idea:[],time_log:[]};
function seedDemo(){for(const k in records)records[k].length=0; records.todo.push({id:1,content:'整理本周计划',status:'pending',created_at:new Date().toISOString()});records.idea_category.push({id:2,name:'生活',created_at:new Date().toISOString()});records.idea.push({id:3,content:'给日常留一点想象空间',category_id:2,created_at:new Date().toISOString()})} seedDemo(); document.getElementById('demoReset').onclick=()=>{seedDemo();enterApp({user:{name:'我'}})};
async function initCloud(){}; async function ensureProfile(){}; async function getSession(){return {session:{user:{name:'我'}}}}; async function tryRestoreSession(){return true};
class Query {constructor(t){this.a=records[t];this.filters=[];this.kind='select'} select(){return this} insert(v){this.kind='insert';this.body=v;return this} update(v){this.kind='update';this.body=v;return this} eq(k,v){this.filters.push(x=>x[k]==v);return this} is(k,v){this.filters.push(x=>x[k]==null);return this} order(k,o){this.sort=[k,o];return this} limit(n){this.max=n;return this} then(r,j){return this.run().then(r,j)} async run(){let rows=this.a.filter(x=>this.filters.every(f=>f(x)));if(this.kind==='insert'){let x={...this.body,id:Date.now()+Math.floor(Math.random()*1000),created_at:new Date().toISOString()};this.a.push(x);rows=[x]}if(this.kind==='update') rows.forEach(x=>Object.assign(x,this.body));if(this.sort)rows.sort((a,b)=>String(a[this.sort[0]]).localeCompare(String(b[this.sort[0]]))*(this.sort[1].ascending?1:-1));return {data:rows.slice(0,this.max||rows.length),error:null}}}
function db(){return {from:t=>new Query(t)}}
function unwrap(res, label) {
  if (res.error) throw res.error;
  return res.data;
}

const iso = d => (d instanceof Date ? d.toISOString() : d);
const dayStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* ---------- 行 → 视图模型 ---------- */
function rowToTodo(r) {
  return {
    id: r.id,
    text: r.content,
    plan: r.plan_date ? new Date(r.plan_date + 'T00:00:00') : null,
    createdAt: new Date(r.created_at),
    done: r.status === 'done',
    doneAt: r.completed_at ? new Date(r.completed_at) : null,
    seq: r.split_seq || 0,
  };
}
function rowToNote(r, bookMap) {
  return {
    id: r.id,
    bookId: r.book_id,
    book: r.book_id ? (bookMap[r.book_id] || null) : null,
    content: r.content,
    createdAt: new Date(r.created_at),
  };
}
function rowToIdea(r, catMap) {
  return {
    id: r.id,
    catId: r.category_id,
    cat: r.category_id ? (catMap[r.category_id] || null) : null,
    content: r.content,
    createdAt: new Date(r.created_at),
  };
}
function rowToLog(r) {
  return {
    id: r.id,
    cat: r.category,
    desc: r.content,
    crossDay: !!r.cross_day,
    start: new Date(r.start_at),
    end: new Date(r.end_at),
    dur: r.duration_min,
  };
}

/* ---------- 原始消息（原文全链路只读，用于「原始消息」视图与收件箱兜底） ---------- */
async function loadMessages() {
  const { data, error } = await db().from('message')
    .select('*').is('deleted_at', null)
    .order('created_at', { ascending: false }).limit(500);
  if (error) throw error;
  return (data || []).map(r => ({
    id: r.id,
    content: r.content,
    type: r.parse_type || 'inbox',
    channel: r.channel || 'web',
    at: new Date(r.created_at),
  }));
}

async function setMessageType(id, type) {
  const { error } = await db().from('message').update({ parse_type: type, type_edited: 1 }).eq('id', id);
  if (error) throw error;
}

/* ---------- 载入全部数据 ---------- */
async function loadAll() {
  const [todoRes, bookRes, noteRes, catRes, ideaRes, logRes] = await Promise.all([
    db().from('todo').select('*').is('deleted_at', null).order('created_at', { ascending: true }),
    db().from('book').select('*').order('created_at', { ascending: true }),
    db().from('reading_note').select('*').is('deleted_at', null).order('created_at', { ascending: true }),
    db().from('idea_category').select('*').order('created_at', { ascending: true }),
    db().from('idea').select('*').is('deleted_at', null).order('created_at', { ascending: true }),
    db().from('time_log').select('*').is('deleted_at', null).order('start_at', { ascending: true }),
  ]);
  for (const r of [todoRes, bookRes, noteRes, catRes, ideaRes, logRes]) {
    if (r.error) throw r.error;
  }

  const bookMap = {}, catMap = {};
  (bookRes.data || []).forEach(b => { bookMap[b.id] = b.name; });
  (catRes.data || []).forEach(c => { catMap[c.id] = c.name; });

  return {
    books: bookRes.data || [],
    cats: catRes.data || [],
    todos: (todoRes.data || []).map(rowToTodo),
    notes: (noteRes.data || []).map(r => rowToNote(r, bookMap)),
    ideas: (ideaRes.data || []).map(r => rowToIdea(r, catMap)),
    logs: (logRes.data || []).map(rowToLog),
  };
}

/* ---------- 原始消息（原文全链路只读） ---------- */
async function addMessage(content, parseType, snapshot, channel = 'web') {

/* ---------- 书籍 / 分类：取或建 ---------- */
async function ensureBook(name) {
  const nm = String(name).trim();
  const { data: exist } = await db().from('book').select('id').eq('name', nm).limit(1);
  if (exist && exist.length) return exist[0].id;
  const { data, error } = await db().from('book').insert({ name: nm }).select();
  if (error) throw error;
  return data?.[0]?.id ?? null;
}

async function ensureCategory(name) {
  const nm = String(name).trim();
  const { data: exist } = await db().from('idea_category').select('id').eq('name', nm).limit(1);
  if (exist && exist.length) return exist[0].id;
  const { data, error } = await db().from('idea_category').insert({ name: nm }).select();
  if (error) throw error;
  return data?.[0]?.id ?? null;
}

/* ---------- 待办 ---------- */
async function addTodo({ text, plan, seq = 0, messageId = null }) {
  const { data, error } = await db().from('todo').insert({
    content: text,
    plan_date: plan ? dayStr(plan) : null,
    date_source: plan ? 'parsed' : 'none',
    status: 'pending',
    split_seq: seq,
    message_id: messageId,
  }).select();
  if (error) throw error;
  return rowToTodo(data[0]);
}

async function setTodoDone(id, done) {
  const now = new Date();
  const patch = done
    ? { status: 'done', completed_at: iso(now), week_key: weekKey(now) }
    : { status: 'pending', completed_at: null, week_key: null };
  const { data, error } = await db().from('todo').update(patch).eq('id', id).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error('没有改动任何待办，它可能已被删除');
}

async function updateTodo(id, patch) {
  const body = {};
  if (patch.text !== undefined) body.content = patch.text;
  if (patch.plan !== undefined) {
    body.plan_date = patch.plan ? dayStr(patch.plan) : null;
    body.date_source = patch.plan ? 'user' : 'none';
  }
  const { data, error } = await db().from('todo').update(body).eq('id', id).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error('没有改动任何待办，它可能已被删除');
}

async function softDelete(table, id) {
  const { data, error } = await db().from(table).update({ deleted_at: iso(new Date()) }).eq('id', id).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error('删除失败，记录可能已不存在');
}

async function addTimeLog({ desc, start, end, dur, cat, crossDay, messageId = null }) {
  const { data, error } = await db().from('time_log').insert({
    content: desc,
    start_at: iso(start),
    end_at: iso(end),

async function updateTimeLog(id, patch) {
  const body = {};
  if (patch.desc !== undefined) body.content = patch.desc;
  if (patch.cat !== undefined) body.category = patch.cat;
  if (patch.start !== undefined) {
    body.start_at = iso(patch.start);
    body.belong_date = dayStr(patch.start);
  }
  if (patch.end !== undefined) {
    body.end_at = iso(patch.end);
    body.duration_min = Math.round((patch.end - (patch.start || new Date())) / 60000);
  }
  const { data, error } = await db().from('time_log').update(body).eq('id', id).select();
  if (error) throw error;
  if (!data || data.length === 0) throw new Error('没有改动任何时间记录，它可能已被删除');
}

/* ============================================================
   碎记分拣本 · UI 原型交互
   规则严格对齐 PRD v1.7：排序 / 日期注入 / 分类 / 拆分 / 时间轴

/* ---------------- 工具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];

const NOW = new Date();              // 页面加载时刻，仅用于初始化展示
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const nowDate = () => new Date();    // 每条记录的真实创建时刻

function fmtMD(d) { return `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtMDHM(d) { return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDur(min) {
  if (min < 60) return min + 'm';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}h${m}m` : `${h}h`;
}
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
/** ISO 周起始（周一） */
function weekStart(d) { const x = new Date(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); x.setHours(0, 0, 0, 0); return x; }
function weekKey(d) {
  const ws = weekStart(d);
  const jan1 = new Date(ws.getFullYear(), 0, 1);
  const week = Math.floor((ws - jan1) / 86400000 / 7) + 1;
  return `${ws.getFullYear()}-W${pad(week)}`;
}

/* ============================================================
   0. 运行诊断（真机排障：把每一步结果留在屏幕上）
   ============================================================ */
const DIAG_BUILD = 'build-20261028-1105';
const DIAG_LOG = [];
let diagOn = false;

function dbg(tag, detail) {
  try {
    let d = '';
    if (detail !== undefined && detail !== null) {
      d = typeof detail === 'string' ? detail : JSON.stringify(detail);
    }
    DIAG_LOG.push(`${new Date().toTimeString().slice(0, 8)} [${tag}] ${d}`);
    if (DIAG_LOG.length > 80) DIAG_LOG.shift();
    try { localStorage.setItem('kd_diag', DIAG_LOG.join('\n')); } catch (e) { /* 隐私模式忽略 */ }
    const box = document.getElementById('diagOut');
    if (box && diagOn) box.textContent = DIAG_LOG.join('\n');
  } catch (e) { /* 诊断本身绝不抛错 */ }
}

function errText(err) {
  if (!err) return '未知错误';
  if (typeof err === 'string') return err;
  const parts = [];
  if (err.message) parts.push(err.message);
  if (err.code) parts.push('code=' + err.code);
  if (err.status) parts.push('http=' + err.status);
  if (err.details) parts.push(String(err.details));
  if (err.hint) parts.push(String(err.hint));
  return parts.join(' | ') || JSON.stringify(err);
}

function showDiag(force) {
  const box = document.getElementById('diagOut');
  if (!box) return;
  diagOn = force === true ? true : !diagOn;
  box.hidden = !diagOn;
  box.textContent = diagOn ? DIAG_LOG.join('\n') : '';
}

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('error', e => {
    dbg('JS-ERROR', `${e.message || ''} @${String(e.filename || '').split('/').pop()}:${e.lineno || 0}`);
    if (diagOn) showDiag(true);
  });
  window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    dbg('JS-REJECT', errText(r));
    if (diagOn) showDiag(true);
  });
}

if (typeof document !== 'undefined' && document.getElementById) {
  const diagBtnEl = document.getElementById('diagBtn');
  if (diagBtnEl) {
    diagBtnEl.addEventListener('click', () => showDiag());
    diagBtnEl.style.display = 'flex';
  }
}

function mkLog(id, label, y, m, d, hh, mm, dur, cat, desc, cross) {
  return {
    id, label, cat, desc, crossDay: !!cross,
    start: new Date(y, m, d, hh, mm),
    end: new Date(new Date(y, m, d, hh, mm).getTime() + dur * 60000),
    dur,
  };
}

const CAT = {
  study: { name: '学习', c: 'var(--study)', bg: 'var(--study-bg)' },
  work: { name: '工作', c: 'var(--work)', bg: 'var(--work-bg)' },
  leisure: { name: '休闲', c: 'var(--leisure)', bg: 'var(--leisure-bg)' },
  life: { name: '生活', c: 'var(--life)', bg: 'var(--life-bg)' },
};

/* ============================================================
   2. 消息识别（简化版 PRD F1-3 判定顺序）
   ============================================================ */
const LONG_TEXT = 120; // PRD F1-3：长文本判定阈值（个人设置项，默认 120 字）
const TODO_WORDS = ['交', '买', '开会', '发', '写', '预约', '回复', '整理', '看完', '打电话', '准备', '提交', '确认', '订'];
const DATE_WORDS = /(今天|明天|后天|大后天|本周[一二三四五六日]|这周[一二三四五六日]|下周[一二三四五六日]|周[一二三四五六日]|星期[一二三四五六日])/;

/* 时间区间识别：一段话里可以有多段（PRD F5 时间消耗）
   支持「10-11 学习」「昨晚11-7 睡觉」「11:30-11:50 UI」「4-4：30 讨论」 */
const SEG_RE = /(?<![\d:：])(\d{1,2})(?:[:：](\d{2}))?\s*[-–—~～到至]\s*(\d{1,2})(?:[:：](\d{2}))?(?!\d)/g;
/* 统一分类声明：「这些都归类到学习中」「都算工作」「这些都是工作」 */
const TIME_CAT_RE = /(?:这些|以上|全部)?\s*(?:(?:都|全部|统一|均)?\s*(?:归类到|归类为|归到|归为|记为|记到|算作|算是|放到|算|记)|(?:都|全部|均|这些|以上|以上都)\s*是)\s*(学习|工作|休闲|生活)\s*(?:中|里|类)?/;
const CAT_BY_WORD = { 学习: 'study', 工作: 'work', 休闲: 'leisure', 生活: 'life' };
const PM_WORDS = /^(下午|午后|傍晚)/;
const NIGHT_WORDS = /^(晚上|夜里|夜间|傍晚后)/;

/* 快递取件码：形如「3-2-2804」「5-3-1234」——三段数字，末段 3 位以上。
   必须早于时间区间判断：否则会被当成 3 点到 2 点的跨天记录（算出 23 小时）。 */
const PICKUP_CODE = /(?<![0-9:：])\d{1,2}-\d{1,3}-\d{3,6}(?![0-9:：])/;
const PICKUP_WORDS = /取件码|取件号|快递|驿站|丰巢|菜鸟|快递柜|自提|取快递|拿快递/;

/* 正文里的日期词：一段话写了两天（「这周一…；这周二…」）时，逐段切换基准日 */
const ANCHOR_RE = /(大前天|前天|昨天|昨晚|今天|今早|今晚|明天|明早|明晚|(?:这|本|下)?(?:周|星期)[一二三四五六日])/g;
/* 段前紧邻的时段词：这一段按下午/晚上理解（「下午 2-4」= 14:00-16:00） */
const PM_BEFORE_RE = /(下午|傍晚|晚上|夜里|夜间)\s*[：:，,]?\s*$/;
/* 段前紧邻的「上午/凌晨」：明确是上午，1-6 点不能自己跳到下午 */
const AM_BEFORE_RE = /(上午|早上|早晨|清晨|凌晨|半夜)\s*[：:，,]?\s*$/;
/* 段前紧邻的「晚上/夜里」：这时的 1-6 点已经过了零点，是次日凌晨 */
const LATE_BEFORE_RE = /(晚上|夜里|夜间|深夜)\s*[：:，,]?\s*$/;

function anchorDateOf(word) {
  const b = new Date(TODAY);
  b.setHours(0, 0, 0, 0);
  if (word === '前天') return addDays(b, -2);
  if (word === '大前天') return addDays(b, -3);
  if (word === '昨天' || word === '昨晚') return addDays(b, -1);
  if (word === '今早' || word === '今晚') return b;
  if (word === '明早' || word === '明晚') return addDays(b, 1);
  return resolveDate(word);   // 今天 / 明天 / 后天 / 大后天 / 周一 / 下周三…
}

/* 描述清尾：下一段的日期词、时段词和分隔符不该粘在本段描述末尾
   （「工作；这周二」→「工作」，「工作， 下午」→「工作」） */
const DESC_TAIL_NOISE = /[\s，,、;；:：。]*(?:大前天|前天|昨天|昨晚|今天|今早|今晚|明天|明早|明晚|(?:这|本|下)?(?:周|星期)[一二三四五六日]|上午|下午|中午|晚上|早上|早晨|傍晚|凌晨|夜里|夜间)[\s，,、;；:：。]*$/;

function cleanDesc(s) {
  let d = String(s || '').replace(/^[\s，,、;；:：。]+/, '');
  let prev = null;
  while (d !== prev) { prev = d; d = d.replace(DESC_TAIL_NOISE, ''); }
  return d.replace(/[\s，,、;；:：。]+$/, '').trim();
}

/** 解析出全部时间区间；无法判定为时间记录时返回 null */
function parseTimeRanges(text) {
  const t = String(text || '').trim();
  if (!t) return null;

  let work = t;
  let base = new Date(TODAY);
  let night = false;   // 夜间语境：小时 ≤12 要补 12，且可能是「上半夜→次日清晨」
  let lateCtx = false; // 真正过了晚上的语境（昨晚/今晚/晚上）：这时 1-6 点指次日凌晨
  let amCtx = false;   // 上午语境（今早/明早/早上…）：1-6 点就是凌晨，不能跳下午

  // 1) 句首日期基准 + 时段：「昨天下午：…」「昨晚…」「今早…」「今天上午…」
  const dm = work.match(/^\s*(前天|昨天|昨晚|今天|今早|今晨|今晚|明天|明早|明晚)\s*(上午|下午|中午|晚上|早上|早晨|傍晚|凌晨|夜里|夜间)?\s*[：:,，、]?\s*/);
  if (dm) {
    const w = dm[1];
    const part = dm[2] || '';
    if (w === '前天') base = addDays(TODAY, -2);
    if (w === '昨天' || w === '昨晚') base = addDays(TODAY, -1);
    if (w === '明天' || w === '明早' || w === '明晚') base = addDays(TODAY, 1);
    night = (w === '昨晚' || w === '今晚' || w === '明晚') || NIGHT_WORDS.test(part) || PM_WORDS.test(part);
    lateCtx = /^(昨晚|今晚|明晚)$/.test(w) || NIGHT_WORDS.test(part);
    amCtx = /^(今早|今晨|明早)$/.test(w) || /^(上午|早上|早晨|清晨|凌晨)/.test(part);
    work = work.slice(dm[0].length);
    // 「上午/早上」明确是上午语境，此时不补 12
    if (/^(上午|早上|早晨|凌晨)/.test(part)) { night = false; lateCtx = false; }
  }

  // 2) 统一分类：「这些都归类到学习中」→ 全部按学习记，并从描述里去掉这句
  let forcedCat = null;
  const cm = work.match(TIME_CAT_RE);
  if (cm) {
    forcedCat = CAT_BY_WORD[cm[1]];
    work = work.replace(cm[0], ' ');
  }

  // 3) 扫出所有区间
  const segs = [];
  SEG_RE.lastIndex = 0;
  let m;
  while ((m = SEG_RE.exec(work))) {
    const sh = +m[1], sm = m[2] ? +m[2] : 0;
    const eh = +m[3], em = m[4] ? +m[4] : 0;
    if (sh > 24 || eh > 24 || sm > 59 || em > 59) continue;
    segs.push({ i: m.index, j: SEG_RE.lastIndex, sh, sm, eh, em, hasColon: !!(m[2] || m[4]) });
  }
  if (!segs.length) return null;

  // 4) 防误判：只有一个「无冒号」区间时，要求是短句且不含数量词；
  //    长文本里全是裸数字对（「第2-4章」「5-6页」）时不当作时间流水
  if (segs.length === 1) {
    const s = segs[0];
    const looksTime = s.hasColon
      || (work.length <= 30 && !/[个元支张件块斤人次台只本袋瓶包箱]/.test(work));
    if (!looksTime) return null;
  }
  if (work.length >= LONG_TEXT && !segs.some(s => s.hasColon)) return null;

  /* 4.5) 正文里的日期锚点：「这周一 9-11 …；这周二 9-11 …」
     每出现一次日期词，后面各段就换到那一天。原来只认句首的「昨天/今天」，
     一段话跨两天时会全部算到今天。 */
  const anchors = [];
  ANCHOR_RE.lastIndex = 0;
  let am;
  while ((am = ANCHOR_RE.exec(work))) {
    const d = anchorDateOf(am[1]);
    if (d) anchors.push({ i: am.index, end: ANCHOR_RE.lastIndex, date: d, word: am[1] });
  }
  const anchorBefore = idx => {
    let hit = null;
    for (const a of anchors) { if (a.i < idx) hit = a; else break; }
    return hit;
  };

  // 5) 每段：描述 = 本区间结束 → 下一区间（或下一个日期词）之前的文字
  const rows = segs.map((s, k) => {
    const nextSeg = k + 1 < segs.length ? segs[k + 1] : null;
    // 日期词属于下一段，不能粘在本段描述尾巴上（「工作；这周二」→「工作」）
    const nextAnchor = anchors.find(a => a.i > s.j && (!nextSeg || a.i < nextSeg.i));
    const stopAt = Math.min(nextSeg ? nextSeg.i : work.length, nextAnchor ? nextAnchor.i : work.length);
    const desc = cleanDesc(work.slice(s.j, stopAt)) || '（未填写描述）';

    const anchor = anchorBefore(s.i);
    const rowBase = anchor ? anchor.date : base;

    /* 半天推断。中文口语里几乎不会说「凌晨 1-4」，说「1-4」就是下午一点到四点。
       判据只看紧邻这一段的几个字（±8 字窗口），避免被隔壁段落的时段词带跑：
         · 前面写了「下午/傍晚/晚上」→ 下午/晚上
         · 前面写了「上午/早上/凌晨」→ 就是上午，不补 12
         · 都没写，且起点落在 1~6 点 → 按下午算（1-4 = 13:00-16:00）
         · 都没写，起点是 12 点 → 中午（12-2 = 12:00-14:00）
         · 晚上语境里的 1-6 点 → 已经过零点，是次日凌晨（昨晚 1-4 = 次日 01:00-04:00） */
    const pre = work.slice(Math.max(0, s.i - 8), s.i);
    const amBefore = AM_BEFORE_RE.test(pre);
    const lateBefore = LATE_BEFORE_RE.test(pre);
    const evening = (night || PM_BEFORE_RE.test(pre)) && !amBefore;

    let sh = s.sh, eh = s.eh;
    let cross = false;
    let nextDay = false;

    if ((lateCtx || lateBefore) && !amBefore && !amCtx && sh >= 1 && sh <= 6 && (eh > sh || (eh === sh && s.em > s.sm))) {
      nextDay = true;              // 「昨晚 1-4」= 次日 01:00-04:00
    } else if (evening && sh < 12) {
      // 下午/晚上语境：「昨天下午 4-4:30」= 16:00→16:30；「昨晚11-7」= 23:00→次日07:00
      sh += 12;
      const startMin0 = sh * 60 + s.sm;
      const candEnd = (eh + 12) * 60 + s.em;   // 结束时刻按同半天理解
      if (candEnd > startMin0 && candEnd <= 1440) eh += 12;
      else if (eh * 60 + s.em <= startMin0) cross = true;
    } else if (sh === 12 && eh >= 1 && eh <= 6) {
      eh += 12;                    // 「12-2」= 12:00-14:00（不是次日凌晨两点）
    } else if (!amBefore && !amCtx && sh >= 1 && sh <= 6 && (eh > sh || (eh === sh && s.em > s.sm)) && eh <= 12) {
      sh += 12; eh += 12;          // 「1-4」= 13:00-16:00
    } else if (eh * 60 + s.em <= sh * 60 + s.sm) {
      cross = true; // 结束≤开始视为跨天（PRD F5-2）
    }

    // 分钟计时间轴：>1440 表示次日，便于做先后比较
    return {
      desc, sh, eh, sm: s.sm, em: s.em, cross, base: rowBase,
      st: sh * 60 + s.sm + (nextDay ? 1440 : 0),
      en: eh * 60 + s.em + (cross || nextDay ? 1440 : 0),
    };
  });

  // 6) 首段疑似笔误：「19-11:30」后面紧接「11:30-11:50」→ 起点其实是 9 点，多打了一个 1。
  //    判据很窄：跨天、超过 12 小时、且下一段起点正好等于它的终点。
  let note = '';
  if (rows.length > 1) {
    const a = rows[0], b = rows[1];
    if (a.cross && a.sh >= 13 && a.eh <= 12
        && (a.sh - 10) * 60 + a.sm <= a.eh * 60 + a.em
        && b.st === a.eh * 60 + a.em) {
      a.sh -= 10;
      a.st = a.sh * 60 + a.sm;
      a.en = a.eh * 60 + a.em;
      a.cross = false;
      note = `第 1 段按 ${a.sh}:${pad(a.sm)}-${a.eh}:${pad(a.em)} 记`;
    }
  }

  // 7) 时序校正：连续记录里后一段不会早于前一段结束，早于就按下午补 12 小时
  //    （「11:30-11:50，2-4，4-4:30」= 11:30 → 14:00 → 16:00）
  //    只对同一天内相邻的两段生效：跨日期词的两天之间不能这么推。
  for (let i = 1; i < rows.length; i++) {
    const prev = rows[i - 1], cur = rows[i];
    if (cur.base.getTime() !== prev.base.getTime()) continue;
    if (cur.st < prev.en && cur.st + 720 >= prev.en && cur.en + 720 <= 1440) {
      cur.st += 720; cur.en += 720;
    }
  }

  const atOn = (b, min) => new Date(
    b.getFullYear(), b.getMonth(), b.getDate() + Math.floor(min / 1440),
    Math.floor(min / 60) % 24, min % 60
  );

  const items = rows.map(r => {
    const start = atOn(r.base, r.st);
    const end = atOn(r.base, r.en);
    return {
      start, end,
      dur: Math.round((end - start) / 60000),
      desc: r.desc,
      crossDay: r.cross,
      cat: forcedCat || guessCat(r.desc),
    };
  });

  return { items, base, forcedCat, note, raw: work.trim() };
}

/** 兼容旧接口：只取第一段 */
function parseTimeRange(text) {
  const r = parseTimeRanges(text);
  return r ? r.items[0] : null;
}

/* 吃饭、做饭、家务、睡觉、通勤这些每天都要做的事属于「生活」，不是「休闲」。
   休闲只留真正的消遣：游戏、电影、追剧、刷手机、散步运动。
   吃饭类放在最前面判定：哪怕写成「和客户吃饭」，吃饭依然是吃饭。 */
const LIFE_WORDS = /吃饭|用餐|午饭|午餐|晚饭|晚餐|早饭|早餐|夜宵|加餐|聚餐|请客|外卖|做饭|煮饭|买菜|洗碗|做菜|下厨|家务|收拾|打扫|洗衣|晾衣|睡觉|午睡|作息|通勤|洗澡|洗漱|理发|看病|挂号|买药|取药|带娃|遛狗|接送/;

function guessCat(text) {
  const t = String(text || '');
  if (LIFE_WORDS.test(t)) return 'life';
  if (/学习|看书|读书|复习|课程|背单词|听课|笔记|刷题/.test(t)) return 'study';
  if (/工作|开会|会议|方案|开发|联调|评审|写代码|回邮件|客户|需求|代码|文档|设计|测试|排查|交付|汇报|周报|UI|PRD/.test(t)) return 'work';
  if (/游戏|电影|追剧|玩|休息|刷|音乐|散步|运动/.test(t)) return 'leisure';
  return 'life';
}

/** 一段话里写了多本书 → 按书拆开。
 *  只有「行首的书名」才算一本新书：行内引用（如「7. 《小狗钱钱》里面说…」）不拆，
 *  否则会把书里提到的书名当成另一本。 */
function splitByBooks(text) {
  const re = /《([^》]{1,40})》/g;
  const marks = [];
  let m;
  while ((m = re.exec(text))) {
    const lineStart = text.lastIndexOf('\n', m.index) + 1;
    const before = text.slice(lineStart, m.index);
    // 书名前只允许出现空白 / 序号 / 标点，否则视为正文里的引用
    if (!/^[\s\d.、,，:：)）\-—·]*$/.test(before)) continue;
    const lineEnd = text.indexOf('\n', m.index);
    const rest = text.slice(m.index + m[0].length, lineEnd === -1 ? text.length : lineEnd).trim();
    // 只有「标题行」才算一本书：书名后面只剩作者名这类短尾巴。
    // 正文里顺手提到的书名（「7. 《小狗钱钱》里面说，…」）后面还跟着一整句，不拆。
    if (rest.length > 16 || /[，。；！？、,;!?]/.test(rest)) continue;
    marks.push({ i: m.index, book: m[1].trim() });
  }
  // 同一本书多次出现只保留第一处，避免拆成同一本的多个碎片
  const seen = new Set();
  const uniq = marks.filter(x => {
    const k = x.book.replace(/\s/g, '');
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  if (uniq.length < 2) return null;
  return uniq.map((x, k) => ({
    book: x.book,
    content: text.slice(x.i, k + 1 < uniq.length ? uniq[k + 1].i : text.length).trim(),
  }));
}

function classify(text) {
  const t = text.trim();
  if (!t) return { type: 'empty' };
  // 0. 显式指令（完成/撤销）
  if (/^(已完成|完成)\s*第?\s*\d+\s*条?$/.test(t)) return { type: 'cmd_done', raw: t };
  // 1. 显式前缀
  if (/^(todo[:：]|#待办)/i.test(t)) return { type: 'todo', text: t.replace(/^(todo[:：]|#待办)/i, '').trim() };
  if (/^笔记[:：]/.test(t)) return { type: 'note', text: t.replace(/^笔记[:：]/, '').trim() };
  if (/^灵感[:：]/.test(t)) return { type: 'idea', text: t.replace(/^灵感[:：]/, '').trim() };
  // 1.5 带《书名》且不是随手一句话 → 读书笔记（要先于待办判断：
  //     书摘里常出现「今晚」「明天」「写下来」这类词，否则整段会被判成待办）
  if (/《[^》]{1,40}》/.test(t) && t.length >= 20) {
    const books = splitByBooks(t);
    if (books) return { type: 'note', text: t, multi: true, books };
    const bm = t.match(/《([^》]{1,40})》/);
    return { type: 'note', text: t, book: bm ? bm[1] : null };
  }
  // 1.6 快递取件码「3-2-2804」→ 待办。必须放在时间区间之前：
  //     否则会被当成「3 点到 2 点」的跨天记录，凭空算出 23 小时。
  if (PICKUP_CODE.test(t)) return { type: 'todo', text: t, pickup: true };
  // 2. 时间区间（可多段）：「10-11 学习」「昨天：19-11:30 文档，11:30-11:50 UI」
  const trs = parseTimeRanges(t);
  if (trs) {
    if (trs.items.length === 1) return { type: 'timelog', items: trs.items, note: trs.note, ...trs.items[0] };
    return { type: 'timelog', items: trs.items, note: trs.note };
  }
  // 3. 待办信号 + 日期词 / 多条拆分
  const parts = splitTodos(t);
  if (parts.length >= 2) return { type: 'todo', text: parts.join('，'), parts };
  if (DATE_WORDS.test(t) && TODO_WORDS.some(w => t.includes(w))) return { type: 'todo', text: t };
  // 3.5 短句带待办动作、但没有日期：也记为待办
  //     （否则「交房租」「买咖啡豆」这类最日常的输入会全掉进收件箱）
  if (t.length <= 30 && TODO_WORDS.some(w => t.includes(w))
      && !/我觉得|我认为|想到|意识到|感受|启发|本质|其实/.test(t)) {
    return { type: 'todo', text: t };
  }
  // 3.6 提到取件/快递的短句（「菜鸟驿站拿一下」「下班取快递」）也是待办。
  //     放在时间区间之后，这样「10-11 取快递」仍然记为时间消耗。
  if (t.length <= 40 && PICKUP_WORDS.test(t)) return { type: 'todo', text: t };
  // 4. 长文本 → 读书笔记（阈值对齐 PRD：classify_threshold 默认 120 字）
  if (t.length >= LONG_TEXT) {
    const bm = t.match(/《([^》]+)》/);
    return { type: 'note', text: t, book: bm ? bm[1] : null };
  }
  // 5. 思考信号
  if (/我觉得|我认为|想到|意识到|感受|启发|本质|其实/.test(t)) return { type: 'idea', text: t };
  // 6. 兜底：短文本一律记为待办
  //    理由：这个工具的第一用途就是随手记一件要做的事，短句里十有八九是待办。
  //    落进收件箱会让人「看不见自己记了什么」，比分类不准严重得多。
  if (t.length < LONG_TEXT) return { type: 'todo', text: t };
  return { type: 'inbox', text: t };
}

/* 带上「手动指定类型」的分类：自动判错时用户可以在输入框上直接改。
   手动指定只覆盖最终类型，仍然复用拆分 / 书名识别 / 时间区间解析，
   所以「周一交房租，周二开会」在手动选待办后依旧会拆成两条。 */
function classifyWith(text, force) {
  const t = String(text || '').trim();
  const auto = classify(t);
  if (!force) return auto;
  // 完成指令是操作而不是记录，任何手动类型都不该把它吃掉
  if (auto.type === 'cmd_done' || auto.type === 'empty') return auto;

  if (force === 'todo') {
    if (auto.type === 'todo' && !auto.forced) return { ...auto, forced: true };
    const parts = splitTodos(t);
    if (parts.length >= 2) return { type: 'todo', text: parts.join('，'), parts, forced: true };
    return { type: 'todo', text: t, forced: true };
  }
  if (force === 'note') {
    const books = splitByBooks(t);
    if (books) return { type: 'note', text: t, multi: true, books, forced: true };
    const bm = t.match(/《([^》]{1,40})》/);
    return { type: 'note', text: t, book: bm ? bm[1] : null, forced: true };
  }
  if (force === 'idea') return { type: 'idea', text: t, forced: true };
  if (force === 'timelog') {
    // 取件码不是时间：即使手动选了「时间消耗」也不能拿它当区间算
    if (PICKUP_CODE.test(t)) return { type: 'timelog', items: [], forced: true, error: 'norange' };
    const trs = parseTimeRanges(t);
    if (!trs || !trs.items.length) return { type: 'timelog', items: [], forced: true, error: 'norange' };
    if (trs.items.length === 1) return { type: 'timelog', items: trs.items, note: trs.note, forced: true, ...trs.items[0] };
    return { type: 'timelog', items: trs.items, note: trs.note, forced: true };
  }
  return auto;
}

/** 多待办拆分：以日期词为锚点 */
function splitTodos(text) {
  const re = /(大后天|后天|明天|今天|本周[一二三四五六日]|这周[一二三四五六日]|下周[一二三四五六日]|周[一二三四五六日]|星期[一二三四五六日])/g;
  const idx = [];
  let m;
  while ((m = re.exec(text))) idx.push({ i: m.index, w: m[0], len: m[0].length });
  if (idx.length < 2) return [];
  const out = [];
  idx.forEach((cur, k) => {
    const from = cur.i;
    const to = k + 1 < idx.length ? idx[k + 1].i : text.length;
    let seg = text.slice(from, to).replace(/[，,；;。\s]+$/, '').trim();
    if (seg.length >= 2) out.push(seg);
  });
  return out.length >= 2 ? out : [];
}

/** 日期词 → 具体日期（PRD F2-2 口径） */
function resolveDate(word) {
  const base = new Date(TODAY);
  base.setHours(0, 0, 0, 0);
  const wdOf = w => '日一二三四五六'.indexOf(w);
  if (word === '今天') return base;
  if (word === '明天') return addDays(base, 1);
  if (word === '后天') return addDays(base, 2);
  if (word === '大后天') return addDays(base, 3);

  // 注意：必须区分「下周一」与「周一」——前者前缀已吃掉"周"字，
  // 若写成 (本周|这周|下周)?(?:周|星期)(…) 会因回溯把"下周一"当"周一"处理
  let m = word.match(/(本周|这周|下周)([一二三四五六日])/);
  let prefix = m ? m[1] : null;
  let ch = m ? m[2] : null;
  if (!m) {
    m = word.match(/(?:周|星期)([一二三四五六日])/);
    if (!m) return null;
    ch = m[1];
  }
  const cur = (base.getDay() + 6) % 7; // 周一=0
  const tgt = (wdOf(ch) + 6) % 7;
  if (prefix === '本周' || prefix === '这周') return addDays(base, tgt - cur);
  if (prefix === '下周') return addDays(base, tgt - cur + 7);
  // 无修饰：向后取最近的一个该星期几（今天就是今天）
  return addDays(base, tgt >= cur ? tgt - cur : tgt - cur + 7);
}

function extractPlan(text) {
  const m = text.match(/(大后天|后天|明天|今天|本周[一二三四五六日]|这周[一二三四五六日]|下周[一二三四五六日]|周[一二三四五六日]|星期[一二三四五六日])/);
  if (!m) return null;
  return { word: m[1], date: resolveDate(m[1]) };
}
