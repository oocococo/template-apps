

<div id="loginView" class="login-wrap hidden"><div class="login-card"><h2>连接数据库</h2><div id="loginErr" class="login-err"></div></div></div>
<div id="appShell" class="hidden">
<div class="stage">
  <!-- ============ 顶部工具条 ============ -->
  <div class="stage-bar">
    <div class="stage-title">碎记分拣本 <small>数据已同步到云端</small></div>
    <div class="stage-spacer"></div>
    <span class="hint-chip">试试 <b>周一交房租，周二开会</b> 或 <b>10-11 学习</b></span>
    <div class="device-switch">
      <button id="btnDesktop" class="on">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        桌面
      </button>
      <button id="btnMobile">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/></svg>
        移动端
      </button>
    </div>
  </div>

  <!-- ============ 桌面端 ============ -->
  <div id="desktopView" class="desktop-frame">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/icon-192.png" alt="碎记分拣本"></div>
        <div>
          <div class="brand-name">碎记分拣本</div>
          <div class="brand-sub">Jot Sorter</div>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">四个列表</div>
        <button class="nav-item on" data-nav="todo">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          待办事项 <span class="nav-count" id="cnt-todo">7</span>
        </button>
        <button class="nav-item" data-nav="note">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          读书笔记 <span class="nav-count" id="cnt-note">9</span>
        </button>
        <button class="nav-item" data-nav="idea">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>
          灵感思考 <span class="nav-count" id="cnt-idea">6</span>
        </button>
        <button class="nav-item" data-nav="time">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          时间消耗 <span class="nav-count" id="cnt-time">12</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-label">全部</div>
        <button class="nav-item" data-nav="all">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          原始消息
        </button>
      </div>

      <div class="sidebar-foot">
        <div class="user-mini">
          <div class="avatar" id="userAvatar">·</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12.5px;font-weight:550" id="userName">我的账号</div>
            <div class="sync-state"><span class="sync-dot"></span> 已同步</div>
          </div>
          <button class="op-btn js-setpwd" title="设置登录密码" style="opacity:1">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.9 12.1L20 3M17 3h4v4"/></svg>
          </button>
          <button class="op-btn" id="btnLogout" title="退出登录" style="opacity:1">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">待办事项</h1>
          <div class="topbar-sub" id="pageSub">共 0 条 · 未完成 0 · 已完成 0</div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="btn btn-ghost btn-icon" title="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="btn btn-outline" id="btnImport">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          批量导入
        </button>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="deskComposer">
          <textarea id="deskInput" rows="1" placeholder="记一条… 待办、读书笔记、灵感、时间消耗都可以，自动识别"></textarea>
          <div class="composer-bar">
            <button type="button" class="type-hint idle" id="deskHint" data-force="desk"><span class="dot"></span> 等待输入<span class="tp-caret">▾</span></button>
            <span class="composer-kbd"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送</span>
            <div class="composer-actions">
              <button class="btn btn-ghost btn-icon" title="更多"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="12" r="1.6"/></svg></button>
              <button class="btn btn-primary" id="deskSend">发送</button>
            </div>
          </div>
        </div>
      </div>

      <div class="content" id="deskContent"></div>
    </main>
  </div>

  <!-- ============ 移动端 ============ -->
  <div id="mobileView" class="phone-stage hidden">
    <!-- 1. 速记页 -->
    <div class="phone-col" data-page="quick">
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="status-bar"><span>9:41</span><span class="icons">▮▮▮ ⌁ ▰</span></div>
          <div class="quick-head">
            <button class="qm-back" data-goto-page="list" type="button">‹ 列表</button>
            <h2>记一笔</h2>
            <span class="dots">···</span>
          </div>
          <div class="quick-body">
            <div class="quick-card">
              <textarea id="quickInput" rows="4" placeholder="想到什么就写什么…"></textarea>
              <div class="quick-hint">
                <button type="button" class="type-hint idle" id="quickHint" data-force="quick"><span class="dot"></span> 等待输入<span class="tp-caret">▾</span></button>
                <button class="qsend off" id="quickSend">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
              </div>
            </div>

            <div class="quick-tips">
              <div class="qt-title">试试这样写</div>
              <button class="qt-item" data-fill="周一交房租，周二下午三点开会，周三给客户发方案"><span class="qt-ico">✅</span><span><b>多条待办自动拆分</b><br>周一交房租，周二下午三点开会，周三给客户发方案</span></button>
              <button class="qt-item" data-fill="10-11 学习"><span class="qt-ico">⏱</span><span><b>时间消耗</b><br>10-11 学习</span></button>
              <button class="qt-item" data-fill="《认知觉醒》读完第三章，最大的感受是：人的焦虑本质来自对自身无能的愤怒，而解决方式不是更努力，而是建立清晰的反馈循环，让每一次行动都能立刻看到结果，大脑才愿意继续投入，这一点和我过去靠意志力硬撑的做法完全不同。"><span class="qt-ico">📖</span><span><b>读书笔记</b><br>超过 120 字自动归为笔记</span></button>
            </div>
          </div>
          <div class="quick-foot">
            <span>今天已记 4 条</span>
            <button class="go" data-goto="todo">进入分拣本 →</button>
          </div>
          <div class="toast-layer toast-layer-inline" id="quickToast"></div>
        </div>
      </div>
      <div class="phone-label"><b>速记页 /quick</b>主屏幕图标直达（PRD 3.6.2 / F12-1）</div>
    </div>

    <!-- 2. 列表页 -->
    <div class="phone-col" data-page="list">
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="status-bar"><span>9:41</span><span class="icons">▮▮▮ ⌁ ▰</span></div>
          <div class="m-top">
            <h2 id="mTitle">待办</h2>
            <div class="spacer"></div>
            <button class="qm-jump" data-goto-page="quick" type="button">记一笔</button>
            <button class="btn btn-ghost btn-icon js-setpwd" title="设置登录密码">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.9 12.1L20 3M17 3h4v4"/></svg>
            </button>
            <button class="btn btn-ghost btn-icon" title="搜索"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
          </div>

          <div class="m-composer">
            <div class="m-composer-in">
              <textarea id="mInput" rows="1" placeholder="记一条…"></textarea>
              <button type="button" class="type-hint idle m-hint" id="mHint" data-force="m"><span class="dot"></span> 等待输入<span class="tp-caret">▾</span></button>
            </div>
            <button class="msend off" id="mSend">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>

          <div class="m-tabs" id="mTabs">
            <button class="on" data-nav="todo">待办</button>
            <button data-nav="note">笔记</button>
            <button data-nav="idea">灵感</button>
            <button data-nav="time">时间</button>
            <button data-nav="all">全部</button>
          </div>

          <div class="m-content" id="mContent"></div>

          <div class="m-tabbar">
            <button class="m-tab on" data-nav="todo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
              待办
            </button>
            <button class="m-tab" data-nav="note">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
              笔记
            </button>
            <button class="m-tab" data-nav="idea">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>
              灵感
            </button>
            <button class="m-tab" data-nav="time">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              时间
            </button>
            <button class="m-tab" data-nav="all">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
              全部
            </button>
          </div>
          <div class="toast-layer toast-layer-inline" id="mToast"></div>
        </div>
      </div>
      <div class="phone-label"><b>列表页</b>底部 Tab + 常驻输入框（PRD 6.3）</div>
    </div>
  </div>
</div>

</div><!-- /appShell -->

<div class="toast-layer" id="toastLayer"></div>

<!-- 真机诊断：右下角小圆点，点开看运行日志（失败时自动展开） -->
<button id="diagBtn" class="diag-btn" type="button" title="运行诊断">i</button>
<pre id="diagOut" class="diag-out" hidden></pre>
