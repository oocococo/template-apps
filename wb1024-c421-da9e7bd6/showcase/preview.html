      '<i style="width:' + p + '%;background:' + color + '"></i></div>';
  };

  view.empty = function (title, desc, action) {
    return '<div class="empty">' +
      '<span class="empty-mark">' + QH.icon('spark', 22) + '</span>' +
      '<h3>' + QH.ui.esc(title) + '</h3>' +
      (desc ? '<p>' + QH.ui.esc(desc) + '</p>' : '') +
      (action || '') + '</div>';
  };

  view.metric = function (label, value, tone, extra) {
    return '<div class="metric">' +
      '<span class="metric-label">' + QH.ui.esc(label) + '</span>' +
      '<strong class="metric-value ' + (tone || '') + '">' + value + '</strong>' +
      (extra ? '<span class="metric-extra">' + extra + '</span>' : '') +
      '</div>';
  };

  view.categoryList = function (byCategory, total, limit) {
    var rows = Object.keys(byCategory).map(function (name) {
      return { name: name, value: byCategory[name] };
    }).sort(function (a, b) { return b.value - a.value; });
    if (!rows.length) return '';
    var shown = rows.slice(0, limit || 8);
    var rest = rows.slice(limit || 8);
    var restSum = rest.reduce(function (s, r) { return s + r.value; }, 0);
    if (restSum > 0) shown.push({ name: '其他 ' + rest.length + ' 项', value: restSum, muted: true });

    return '<div class="catlist">' + shown.map(function (r, i) {
      var color = r.muted ? QH.ui.cssVar('--muted') : QH.PALETTE[i % QH.PALETTE.length];
      var pct = total > 0 ? r.value / total * 100 : 0;
      return '<div class="catrow">' +
        '<span class="cat-dot" style="background:' + color + '"></span>' +
        '<span class="cat-name">' + QH.ui.esc(r.name) + '</span>' +
        '<span class="cat-rail">' + view.rail(pct, color, 6) + '</span>' +
        '<span class="cat-pct">' + pct.toFixed(pct >= 10 ? 0 : 1) + '%</span>' +
        '<span class="cat-amt">' + S.money(r.value) + '</span>' +
        '</div>';
    }).join('') + '</div>';
  };

  /* ------------------------------------------------------------- 首页 */

  pages.home = function (root) {
    var book = S.book();
    var user = S.user();
    var m = S.monthRange(QH.state.month);
    var entries = S.entriesIn(m.from, m.until);
    var agg = S.aggregate(entries);
    var balance = agg.income - agg.expense;
    var total = agg.income + agg.expense;
    var inPct = total > 0 ? (agg.income / total * 100) : 50;
    var budget = S.monthlyBudget();
    var tips = book.prefs.tips !== false;

    var elapsed = QH.state.month === 0
      ? new Date().getDate()
      : (QH.state.month < 0 ? m.days : 1);
    var avgDaily = elapsed > 0 ? Math.round(agg.expense / elapsed) : 0;
    var saveRate = agg.income > 0 ? Math.round(balance / agg.income * 100) : null;

    var catSegments = Object.keys(agg.byCategory).map(function (name, i) {
      return { label: name, value: agg.byCategory[name], color: QH.PALETTE[i % QH.PALETTE.length] };
    }).sort(function (a, b) { return b.value - a.value; }).slice(0, 6);

    var recent = entries.slice(0, 8);

    /* 每月固定：到日子且本月还没记的 */
    var pendingRules = S.pendingRecurring();
    var recurringBlock = '';
    if (pendingRules.length) {
      recurringBlock = '<div class="card recurring-card">' +
        '<div class="card-head"><h3>每月固定</h3>' +
          '<span class="sec-note">本月待记 ' + pendingRules.length + ' 笔</span></div>' +
        '<div class="recurring-list">' +
          pendingRules.map(function (r) {
            var cat = S.categoryById(r.categoryId);
            var color = cat ? cat.color : QH.toneOf(r.name, r.type);
            return '<span class="recurring-item">' +
              '<i style="background:' + color + '"></i>' +
              QH.ui.esc(r.name) + ' · ' + r.day + ' 号 ' +
              '<b class="' + (r.type === QH.INCOME ? 'in' : 'out') + '">' +
                (r.type === QH.INCOME ? '+' : '−') + S.money(r.cents) + '</b>' +
              '</span>';
          }).join('') +
        '</div>' +
        '<div class="recurring-actions">' +
          '<button class="btn ghost sm" data-route="budget">管理</button>' +
          '<button class="btn primary sm" data-apply-recurring>一键记上</button>' +
        '</div>' +
      '</div>';
    }

    var budgetBlock;
    if (budget > 0) {
      var used = agg.expense / budget * 100;
      var over = agg.expense > budget;
      var daysLeft = QH.state.month === 0 ? Math.max(m.days - new Date().getDate() + 1, 1) : m.days;
      var perDay = Math.max(0, Math.floor((budget - agg.expense) / daysLeft));
      budgetBlock = '' +
        '<div class="card">' +
          '<div class="card-head">' +
            '<h3>本月预算</h3>' +
            '<button class="link" data-route="budget">调整</button>' +
          '</div>' +
          '<p class="budget-figure ' + (over ? 'over' : '') + '">' + S.money(agg.expense) +
            '<span class="of"> / ' + S.money(budget) + '</span></p>' +
          view.rail(used, over ? QH.ui.cssVar('--coral') : QH.ui.cssVar('--green'), 10) +
          '<p class="muted small">' +
            (over
              ? '已超支 ' + S.money(agg.expense - budget)
              : '剩余 ' + S.money(budget - agg.expense) + ' · 按 ' + daysLeft + ' 天算，日均可用 ' + S.money(perDay)) +
            ' · 已用 ' + Math.round(used) + '%' +
          '</p>' +
        '</div>';
    } else {
      budgetBlock = '' +
        '<div class="card prompt-card">' +
          '<div>' +
            '<h3>还没有设置预算</h3>' +
            '<p class="muted small">设一个月度总额，超支时首页会主动提醒你。</p>' +
          '</div>' +
          '<button class="btn ghost sm" data-route="budget">去设置</button>' +
        '</div>';
    }

    root.innerHTML = '' +
      '<header class="page-head">' +
        '<div>' +
          '<h1>你好，' + QH.ui.esc(user.name) + '</h1>' +
          '<p class="sub">' + (tips ? '愿每一笔收支，都被温柔安放' : S.isoDate(Date.now())) + '</p>' +
        '</div>' +
        '<div class="head-actions">' +
          '<button class="btn primary" data-add>＋ 记一笔</button>' +
        '</div>' +
      '</header>' +

      '<section class="hero">' +
        '<div class="hero-deco" aria-hidden="true">' + heroDecor() + '</div>' +
        '<div class="hero-top">' +
          '<span class="hero-badge">✦ 你的财务小结</span>' +
          '<div class="month-switch">' +
            '<button data-month="-1" aria-label="上个月">' + QH.icon('chevronLeft', 16) + '</button>' +
            '<button class="month-label" data-month="0" title="回到本月">' + m.label + '</button>' +
            '<button data-month="1" aria-label="下个月">' + QH.icon('chevronRight', 16) + '</button>' +
          '</div>' +
        '</div>' +
        '<p class="hero-label">本期结余</p>' +
        '<p class="hero-value">' + (balance < 0 ? '−' : '') + S.money(Math.abs(balance)) + '</p>' +
        '<div class="hero-stats">' +
          '<span><i class="up"></i>收入 ' + S.money(agg.income) + '</span>' +
          '<span><i class="down"></i>支出 ' + S.money(agg.expense) + '</span>' +
          '<span class="count">' + agg.count + ' 笔</span>' +
        '</div>' +
        '<div class="hero-rail">' +
          '<i style="width:' + inPct + '%;background:linear-gradient(90deg,#7FD3B6,#3E9E88)"></i>' +
          '<i style="width:' + (100 - inPct) + '%;background:linear-gradient(90deg,#F0A08F,#D9695C)"></i>' +
        '</div>' +
        '<p class="hero-note">' +
          (agg.count === 0
            ? '这个月还没有记录，从一笔小额支出开始吧。'
            : (saveRate == null ? '本期还没有收入记录。'
              : '结余率 ' + saveRate + '% · ' + (saveRate >= 30 ? '攒得不错，继续保持。'
                : saveRate >= 0 ? '略有结余，可以再收紧一点。' : '这个月花超了收入，留意大额支出。'))) +
        '</p>' +
      '</section>' +

      '<form class="nl-bar" data-nl-form>' +
        '<span class="nl-ico" aria-hidden="true">' + QH.icon('spark', 18) + '</span>' +
        '<input class="nl-input" data-nl-input autocomplete="off" ' +
          'placeholder="说一句：昨天火锅 128，打车 32" aria-label="一句话记账">' +
        '<button class="nl-go" type="submit">解析</button>' +
      '</form>' +
      '<p class="nl-hint"><b>一句话记账</b> · 中文解析在本地跑，不联网、不上传</p>' +

      '<div class="metric-grid">' +
        view.metric('本期收入', S.money(agg.income), 'in') +
        view.metric('本期支出', S.money(agg.expense), 'out') +
        view.metric('日均支出', S.money(avgDaily), '', '按已过 ' + elapsed + ' 天计算') +
      '</div>' +

      budgetBlock +
      recurringBlock +

      view.secHead('钱花在哪里', '▦', '<button class="link" data-route="stats">看统计</button>') +
      (catSegments.length
        ? '<div class="card donut-card">' +
            '<div class="donut-wrap">' + QH.charts.donut(catSegments, { centerLabel: '合计支出' }) + '</div>' +
            '<div class="donut-side">' + view.categoryList(agg.byCategory, agg.expense, 5) + '</div>' +
          '</div>'
        : view.empty('这个月还没花钱', '记一笔之后，这里会出现分类占比。',
            '<button class="btn primary sm" data-add>记第一笔</button>')) +

      view.secHead('最近记录', '≡', entries.length ? '<button class="link" data-route="detail">全部明细</button>' : '') +
      (recent.length
        ? '<div class="entry-list">' + recent.map(function (e) { return view.entryRow(e); }).join('') + '</div>'
        : view.empty('账本还是空的', '先记一笔，或导入一份 CSV 账单看看效果。',
            '<div class="empty-actions">' +
            '<button class="btn primary sm" data-add>记一笔</button>' +
            '<button class="btn ghost sm" data-demo>填入示例数据</button>' +
            '</div>'));

    bindHome(root);
  };

  function heroDecor() {
    return '' +
      '<svg viewBox="0 0 340 190" preserveAspectRatio="xMidYMid slice">' +
        '<g fill="none" stroke="#E7D29B" stroke-opacity=".38" stroke-linecap="round">' +
          '<path d="M250 34c14 0 18-9 30-9s16 10 4 10-22 8-34 8"/>' +
          '<path d="M258 52c10 0 12-7 21-7"/>' +
        '</g>' +
        '<g fill="none" stroke="#9FD8C1" stroke-opacity=".22" stroke-linecap="round">' +
          '<path d="M-10 150c26-14 52 14 78 0s52 14 78 0 52 14 78 0 52 14 78 0"/>' +
          '<path d="M-10 166c26-14 52 14 78 0s52 14 78 0 52 14 78 0 52 14 78 0"/>' +
          '<path d="M-10 182c26-14 52 14 78 0s52 14 78 0 52 14 78 0 52 14 78 0"/>' +
        '</g>' +
        '<g fill="none" stroke="#E7D29B" stroke-opacity=".3" stroke-width="1.2">' +
          '<path d="M300 96c-6 6-6 12 0 18M306 96c6 6 6 12 0 18"/>' +
        '</g>' +
      '</svg>';
  }

  function bindHome(root) {
    root.querySelectorAll('[data-month]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var step = parseInt(btn.getAttribute('data-month'), 10);
        if (step === 0) QH.state.month = 0;
        else QH.state.month = Math.min(0, QH.state.month + step);
        QH.render();
      });
    });
    root.querySelectorAll('[data-demo]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        S.seedDemo();
        QH.ui.toast('已填入示例数据');
        QH.render();
      });
    });

    root.querySelectorAll('[data-apply-recurring]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var made = S.applyRecurring();
        QH.ui.toast(made ? '已记 ' + made + ' 笔固定收支' : '没有待记的固定项');
        QH.render();
      });
    });

    var nlForm = root.querySelector('[data-nl-form]');
    if (nlForm) {
      var nlInput = nlForm.querySelector('[data-nl-input]');
      nlForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var text = nlInput.value.trim();
        if (!text) {
          nlInput.focus();
          QH.ui.toast('先说一句，例如：昨天火锅 128，打车 32');
          return;
        }
        QH.openNL(text);
      });
      /* 占位词轮换，给新用户一个可抄的句式 */
      var idx = 0;
      var timer = setInterval(function () {
        if (!document.body.contains(nlInput)) { clearInterval(timer); return; }
        if (nlInput.value || document.activeElement === nlInput) return;
        idx = (idx + 1) % QH.nl.examples.length;
        nlInput.setAttribute('placeholder', '说一句：' + QH.nl.examples[idx]);
      }, 4200);
    }

    bindEntryRows(root);
  }

  function bindEntryRows(root) {
    root.querySelectorAll('[data-entry]').forEach(function (row) {
      row.addEventListener('click', function (event) {
        if (event.target.closest('[data-del]')) return;
        QH.openEntry(row.getAttribute('data-entry'));
      });
      row.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          QH.openEntry(row.getAttribute('data-entry'));
        }
      });
    });
    root.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', function (event) {
        event.stopPropagation();
        var entry = S.entryById(btn.getAttribute('data-del'));
        if (!entry) return;
        var cat = S.categoryById(entry.categoryId);
        QH.ui.confirm({
          title: '删除这笔记录？',
          message: '「' + QH.ui.esc(cat ? cat.name : '未分类') + ' ' + S.money(entry.cents) +
            '」将被移除，此操作不可撤销。',
          confirmText: '删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          S.deleteEntry(entry.id);
          QH.ui.toast('已删除');
          QH.render();
        });
      });
    });
  }
  QH.bindEntryRows = bindEntryRows;

  /* ------------------------------------------------------------- 明细 */

  function detailFilter() {
    return QH.state.detail;
  }

  function filteredEntries() {
    var f = detailFilter();
    var list = S.allEntries();
    if (f.type !== 'all') {
      var want = f.type === 'income' ? QH.INCOME : QH.EXPENSE;
      list = list.filter(function (e) { return e.type === want; });
    }
    if (f.cat !== 'all') {
      list = list.filter(function (e) { return e.categoryId === f.cat; });
    }
    if (f.from) {
      var from = S.parseISO(f.from);
      list = list.filter(function (e) { return e.time >= from; });
    }
    if (f.to) {
      var to = S.parseISO(f.to) + 86400000;
      list = list.filter(function (e) { return e.time < to; });
    }
    if (f.q) {
      var q = f.q.toLowerCase();
      list = list.filter(function (e) {
        var cat = S.categoryById(e.categoryId);
        return (cat && cat.name.toLowerCase().indexOf(q) >= 0) ||
          (e.note || '').toLowerCase().indexOf(q) >= 0 ||
          S.isoDate(e.time).indexOf(q) >= 0 ||
          S.inputAmount(e.cents).indexOf(q) >= 0;
      });
    }
    return list;
  }

  pages.detail = function (root) {
    var f = detailFilter();
    var cats = S.categories();
    var options = '<option value="all">全部分类</option>' +
      ['支出', '收入'].map(function (label, idx) {
        var group = cats.filter(function (c) { return c.type === idx; });
        if (!group.length) return '';
        return '<optgroup label="' + label + '">' + group.map(function (c) {
          return '<option value="' + c.id + '"' + (f.cat === c.id ? ' selected' : '') + '>' +
            QH.ui.esc(c.name) + '</option>';
        }).join('') + '</optgroup>';
      }).join('');

    root.innerHTML = '' +
      '<header class="page-head">' +
        '<div>' +
          '<h1>明细</h1>' +
          '<p class="sub">搜索、筛选、编辑与导出，全部在本机完成</p>' +
        '</div>' +
        '<div class="head-actions">' +
          '<button class="btn ghost" data-export>' + QH.icon('download', 17) + '导出 CSV</button>' +
          '<button class="btn primary" data-add>＋ 记一笔</button>' +
        '</div>' +
      '</header>' +

      '<div class="card filter-card">' +
        '<div class="search-wrap">' +
          QH.icon('search', 17) +
          '<input class="search" data-q placeholder="搜索分类、备注、金额或日期" value="' + QH.ui.esc(f.q) + '">' +
        '</div>' +
        '<div class="filter-row">' +
          '<div class="chips" data-typechips>' +
            '<button class="chip' + (f.type === 'all' ? ' on' : '') + '" data-type="all">全部</button>' +
            '<button class="chip' + (f.type === 'expense' ? ' on' : '') + '" data-type="expense">支出</button>' +
            '<button class="chip' + (f.type === 'income' ? ' on' : '') + '" data-type="income">收入</button>' +
          '</div>' +
          '<select class="field sm" data-cat>' + options + '</select>' +
          '<input class="field sm" type="date" data-from value="' + f.from + '" aria-label="开始日期">' +
          '<span class="dash">—</span>' +
          '<input class="field sm" type="date" data-to value="' + f.to + '" aria-label="结束日期">' +
          '<button class="chip quick" data-quick="month">本月</button>' +
          '<button class="chip quick" data-quick="last">上月</button>' +
          '<button class="chip quick" data-quick="clear">重置</button>' +
        '</div>' +
      '</div>' +

      '<div id="detail-summary" class="summary-strip"></div>' +
      '<div id="detail-list" class="entry-groups"></div>';

    function refresh() {
      var list = filteredEntries();
      var agg = S.aggregate(list);
      var summary = document.getElementById('detail-summary');
      summary.innerHTML =
        '<span><b>' + agg.count + '</b> 笔</span>' +
        '<span class="in">收入 <b>' + S.money(agg.income) + '</b></span>' +
        '<span class="out">支出 <b>' + S.money(agg.expense) + '</b></span>' +
        '<span>净额 <b class="' + (agg.income - agg.expense < 0 ? 'out' : 'in') + '">' +
          S.money(agg.income - agg.expense) + '</b></span>';

      var container = document.getElementById('detail-list');
      if (!list.length) {
        container.innerHTML = view.empty('没有符合条件的记录', '换个筛选条件，或先记一笔。',
          '<button class="btn primary sm" data-add>记一笔</button>');
        return;
      }

      var limit = detailFilter().limit;
      var shown = list.slice(0, limit);
      var groups = {};
      var order = [];
      shown.forEach(function (e) {
        if (!groups[e.time]) { groups[e.time] = []; order.push(e.time); }
        groups[e.time].push(e);
      });

      var html = order.map(function (time) {
        var items = groups[time];
        var income = 0, expense = 0;
        items.forEach(function (e) { if (e.type === QH.INCOME) income += e.cents; else expense += e.cents; });
        return '<section class="day-group">' +
          '<div class="day-head">' +
            '<span class="day-name">' + QH.ui.dayLabel(time) + '</span>' +
            '<span class="day-sum">' +
              (income ? '<i class="in">+' + S.money(income) + '</i>' : '') +
              (expense ? '<i class="out">−' + S.money(expense) + '</i>' : '') +
            '</span>' +
          '</div>' +
          items.map(function (e) { return view.entryRow(e); }).join('') +
          '</section>';
      }).join('');

      if (list.length > limit) {
        html += '<button class="btn ghost block" data-more>还有 ' + (list.length - limit) + ' 笔，继续加载</button>';
      }
      container.innerHTML = html;
      bindEntryRows(container);
      var more = container.querySelector('[data-more]');
      if (more) more.addEventListener('click', function () {
        detailFilter().limit += 100;
        refresh();
      });
    }

    refresh();

    var searchTimer = null;
    var search = root.querySelector('[data-q]');
    search.addEventListener('input', function () {
      detailFilter().q = search.value.trim();
      detailFilter().limit = 80;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(refresh, 160);
    });

    root.querySelectorAll('[data-typechips] [data-type]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        detailFilter().type = chip.getAttribute('data-type');
        root.querySelectorAll('[data-typechips] [data-type]').forEach(function (c) {
          c.classList.toggle('on', c === chip);
        });
        detailFilter().limit = 80;
        refresh();
      });
    });

    root.querySelector('[data-cat]').addEventListener('change', function (event) {
      detailFilter().cat = event.target.value;
      detailFilter().limit = 80;
      refresh();
    });
    root.querySelector('[data-from]').addEventListener('change', function (event) {
      detailFilter().from = event.target.value;
      detailFilter().limit = 80;
      refresh();
    });
    root.querySelector('[data-to]').addEventListener('change', function (event) {
      detailFilter().to = event.target.value;
      detailFilter().limit = 80;
      refresh();
    });

    root.querySelectorAll('[data-quick]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var kind = btn.getAttribute('data-quick');
        if (kind === 'clear') {
          detailFilter().from = '';
          detailFilter().to = '';
        } else {
          var offset = kind === 'last' ? -1 : 0;
          var m = S.monthRange(offset);
          detailFilter().from = S.isoDate(m.from);
          detailFilter().to = S.isoDate(m.until - 86400000);
        }
        detailFilter().limit = 80;
        QH.render();
      });
    });

    root.querySelector('[data-export]').addEventListener('click', function () {
      var list = filteredEntries();
      if (!list.length) { QH.ui.toast('没有可导出的记录'); return; }
      var csv = S.entriesToCsv(list);
      QH.ui.download('青禾明细-' + S.isoDate(Date.now()) + '.csv', csv, 'text/csv');
      QH.ui.toast('已导出 ' + list.length + ' 笔');
    });
  };

</script><script>/* 页面：统计 / 预算 / 设置 / 登录注册 */
(function (global) {
  'use strict';
  var QH = (global.QH = global.QH || {});
  var pages = (QH.pages = QH.pages || {});
  var view = QH.view;
  var S = QH.store;

  function monthKeyOf(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + (d.getMonth() + 1);
  }

  /* 天数跨度大时按周/月聚合，避免柱子挤成一条线 */
  function buildSeries(from, until) {
    var spanDays = Math.round((until - from) / 86400000);
    var buckets = {};
    var order = [];
    var list = S.entriesIn(from, until);
    list.forEach(function (e) {
      var key = e.time;
      if (spanDays > 62) {
        var d = new Date(e.time);
        key = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
      }
      if (!buckets[key]) { buckets[key] = { time: key, income: 0, expense: 0 }; order.push(key); }
      if (e.type === QH.INCOME) buckets[key].income += e.cents;
      else buckets[key].expense += e.cents;
    });
    return { days: order.sort(function (a, b) { return a - b; }).map(function (k) { return buckets[k]; }), list: list };
  }

  /* ------------------------------------------------------------- 统计 */

  function resolveRange(st) {
    var now = Date.now();
    var today = S.dayStart(now);
    if (st.range === 'month') {
      var m = S.monthRange(0);
      return { from: m.from, until: m.until, label: m.label };
    }
    if (st.range === 'last') {
      var l = S.monthRange(-1);
      return { from: l.from, until: l.until, label: l.label };
    }
    if (st.range === 'week7') {
      return { from: today - 6 * 86400000, until: today + 86400000, label: '最近 7 天' };
    }
    if (st.range === 'day30') {
      return { from: today - 29 * 86400000, until: today + 86400000, label: '最近 30 天' };
    }
    if (st.range === 'year') {
      var y = new Date().getFullYear();
      return {
        from: new Date(y, 0, 1).getTime(),
        until: new Date(y + 1, 0, 1).getTime(),
        label: y + ' 年'
      };
    }
    var from = today - 29 * 86400000;
    var until = today + 86400000;
    var label = '最近 30 天';
    if (st.from && st.to) {
      try {
        var f = S.parseISO(st.from);
        var t = S.parseISO(st.to) + 86400000;
        if (t <= f) throw new Error('结束日期需晚于开始日期');
        from = f; until = t;
        label = st.from + ' 至 ' + st.to;
      } catch (e) {
        QH.ui.toast(e.message, 'warn');
      }
    }
    return { from: from, until: until, label: label };
  }

  pages.stats = function (root) {
    var st = QH.state.stats;
    var range = resolveRange(st);
    var entries = S.entriesIn(range.from, range.until);
    var agg = S.aggregate(entries);
    var spanDays = Math.max(1, Math.round((range.until - range.from) / 86400000));
    var avgDaily = Math.round(agg.expense / spanDays);
    var series = buildSeries(range.from, range.until);

    /* 近 6 个月趋势 */
    var trendPoints = [];
    for (var i = 5; i >= 0; i--) {
      var mm = S.monthRange(-i);
      var a = S.aggregate(S.entriesIn(mm.from, mm.until));
      trendPoints.push({
        label: (mm.month + 1) + '月',
        income: a.income,
        expense: a.expense
      });
    }

    var catSegments = Object.keys(agg.byCategory).map(function (name, i) {
      return { label: name, value: agg.byCategory[name], color: QH.PALETTE[i % QH.PALETTE.length] };
    }).sort(function (a, b) { return b.value - a.value; });

    var chips = [
      ['month', '本月'], ['last', '上月'], ['week7', '近 7 天'],
      ['day30', '近 30 天'], ['year', '今年'], ['custom', '自定义']
    ].map(function (pair) {
      return '<button class="chip' + (st.range === pair[0] ? ' on' : '') + '" data-range="' + pair[0] + '">' +
        pair[1] + '</button>';
    }).join('');

    var tableRows = entries.slice(0, 60).map(function (e) {
      var cat = S.categoryById(e.categoryId);
      return '<tr>' +
        '<td>' + S.isoDate(e.time).slice(5) + '</td>' +
        '<td>' + QH.ui.esc(cat ? cat.name : '未分类') + '</td>' +
        '<td class="' + (e.type === QH.EXPENSE ? 'out' : 'in') + '">' +
          (e.type === QH.EXPENSE ? '−' : '+') + S.money(e.cents) + '</td>' +
        '<td class="note-cell">' + QH.ui.esc(e.note || '') + '</td>' +
        '</tr>';
    }).join('');

    root.innerHTML = '' +
      '<header class="page-head">' +
        '<div>' +
          '<h1>统计</h1>' +
          '<p class="sub">收支结构、每日走势与可导出的收支表</p>' +
        '</div>' +
        '<div class="head-actions">' +
          '<button class="btn ghost" data-poster>' + QH.icon('spark', 17) + '生成海报</button>' +
          '<button class="btn ghost" data-export>' + QH.icon('download', 17) + '导出本期</button>' +
        '</div>' +
      '</header>' +

      '<div class="card filter-card">' +
        '<div class="chips">' + chips + '</div>' +
        (st.range === 'custom'
          ? '<div class="filter-row">' +
              '<input class="field sm" type="date" data-from value="' + (st.from || S.isoDate(S.monthRange(0).from)) + '">' +
              '<span class="dash">—</span>' +
              '<input class="field sm" type="date" data-to value="' + (st.to || S.isoDate(Date.now())) + '">' +
              '<button class="btn ghost sm" data-apply>生成报表</button>' +
            '</div>'
          : '') +
      '</div>' +

      '<div class="metric-grid four">' +
        view.metric('收入', S.money(agg.income), 'in') +
        view.metric('支出', S.money(agg.expense), 'out') +
        view.metric('结余', S.money(agg.income - agg.expense), agg.income - agg.expense < 0 ? 'out' : 'in') +
        view.metric('日均支出', S.money(avgDaily), '', range.label) +
      '</div>' +

      view.secHead('支出分类', '▦') +
      (catSegments.length
        ? '<div class="card donut-card">' +
            '<div class="donut-wrap">' + QH.charts.donut(catSegments, { centerLabel: '合计支出' }) + '</div>' +
            '<div class="donut-side">' + view.categoryList(agg.byCategory, agg.expense, 8) + '</div>' +
          '</div>'
        : view.empty('这段时间没有支出', '换个时间范围看看，或者先记一笔。')) +

      view.secHead('每日收支', '▥',
        '<div class="segmented mini" data-series-seg>' +
          '<button data-series="expense" class="' + (st.series !== 'income' ? 'on' : '') + '">支出</button>' +
          '<button data-series="income" class="' + (st.series === 'income' ? 'on' : '') + '">收入</button>' +
        '</div>') +
      '<div class="card">' +
        (series.days.length
          ? QH.charts.dailyBars(series.days, st.series === 'income' ? 'income' : 'expense')
          : '<p class="muted small center">暂无数据</p>') +
      '</div>' +

      view.secHead('近 6 个月趋势', '◈') +
      '<div class="card">' + QH.charts.trend(trendPoints) + '</div>' +

      view.secHead('收支表', '▤', '<span class="sec-note">' + entries.length + ' 笔 · 显示前 60 笔</span>') +
      (entries.length
        ? '<div class="card table-card"><table class="data-table">' +
            '<thead><tr><th>日期</th><th>分类</th><th>金额</th><th>备注</th></tr></thead>' +
            '<tbody>' + tableRows + '</tbody></table></div>'
        : view.empty('没有记录', '这个时间范围内还没有收支。')) +
      '<p class="foot-note">数据保存在本机浏览器，导出后可用 Excel 或 AI 继续分析。</p>';

    root.querySelectorAll('[data-range]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        st.range = btn.getAttribute('data-range');
        if (st.range === 'custom' && !st.from) {

  /* ------------------------------------------------------------- 预算 */

  function recurringCard() {

    var key = S.monthKey(0);
    return '<div class="card" style="margin-top:14px">' +
      '<div class="card-head"><h3>每月固定</h3>' +
        '<button class="link" data-add-recurring>＋ 新增</button></div>' +

      (list.length
        ? '<div class="manage-list">' + list.map(function (r) {

  function openRecurringForm() {
    var cats = S.categories(QH.EXPENSE);
    function options(type) {
      return S.categories(type).map(function (c) {
        return '<option value="' + c.id + '">' + QH.ui.esc(c.name) + '</option>';
      }).join('');
    }
    QH.ui.modal({
      title: '新增每月固定',
      subtitle: '房租、工资、订阅这类每月金额不变的收支',
      body:
        '<label class="field-block"><span>名称</span>' +
          '<input class="field" data-rname maxlength="20" placeholder="例如 房租、工资、话费"></label>' +
        '<div class="form-grid">' +
          '<label class="field-block"><span>类型</span>' +
            '<select class="field" data-rtype>' +
              '<option value="0">支出</option><option value="1">收入</option>' +
            '</select></label>' +
          '<label class="field-block"><span>每月几号</span>' +
            '<input class="field" type="number" min="1" max="28" data-rday value="1"></label>' +
        '</div>' +
        '<div class="form-grid">' +
          '<label class="field-block"><span>分类</span>' +
            '<select class="field" data-rcat>' + options(QH.EXPENSE) + '</select></label>' +
          '<label class="field-block"><span>金额</span>' +

        '</div>' +

      onMount: function (m) {

          var picks = S.categories().filter(function (c) {
            return QH.store.kindOf(c.name, c.type) === kind;
          });
          if (!picks.length) return;
          var pick = picks[0];
          if (pick.type !== parseInt(typeSel.value, 10)) {
            typeSel.value = String(pick.type);
            catSel.innerHTML = options(pick.type);
          }
          catSel.value = pick.id;

        m.el.querySelector('[data-rcancel]').addEventListener('click', function () { m.close(); });
        m.el.querySelector('[data-rsave]').addEventListener('click', function () {
          var name = m.el.querySelector('[data-rname]').value.trim();
          var cents;
          try { cents = S.parseCents(m.el.querySelector('[data-ramount]').value); }
          catch (e) { error.textContent = e.message; error.hidden = false; return; }
          if (cents <= 0) { error.textContent = '金额要大于 0'; error.hidden = false; return; }
          var day = parseInt(m.el.querySelector('[data-rday]').value, 10) || 1;
          S.addRecurring({
            name: name || (catSel.options[catSel.selectedIndex] || {}).text || '固定项',
            type: parseInt(typeSel.value, 10),
            cents: cents,
            day: day,
            categoryId: catSel.value
          });
          m.close();
          QH.ui.toast('已添加固定项');
          QH.render();
        });
      }
    });
    void cats;
  }

  pages.budget = function (root) {
    var book = S.book();
    var m = S.monthRange(0);
    var entries = S.entriesIn(m.from, m.until);
    var spent = entries.filter(function (e) { return e.type === QH.EXPENSE; })
      .reduce(function (s, e) { return s + e.cents; }, 0);
    var budget = S.monthlyBudget();
    var over = budget > 0 && spent > budget;
    var daysLeft = Math.max(m.days - new Date().getDate() + 1, 1);
    var remaining = budget - spent;

    var expenseCats = S.categories(QH.EXPENSE);
    var incomeCats = S.categories(QH.INCOME);

    function catRows(list, isExpense) {
      return list.map(function (c) {
        var used = entries.filter(function (e) {
          return e.type === QH.EXPENSE && e.categoryId === c.id;
        }).reduce(function (s, e) { return s + e.cents; }, 0);
        var pct = c.budget > 0 ? used / c.budget * 100 : 0;
        var hot = c.budget > 0 && used > c.budget;
        return '<div class="manage-row" data-cat="' + c.id + '">' +
          '<span class="ico" style="color:' + c.color + ';background:' + QH.tint(c.color) + '">' +
            QH.categoryIcon(c.name, c.type, 18) + '</span>' +
          '<span class="manage-main">' +
            '<span class="manage-top">' +
              '<span class="manage-name">' + QH.ui.esc(c.name) + '</span>' +
              '<span class="manage-figure ' + (hot ? 'out' : '') + '">' +
                (isExpense ? S.money(used) : '') +
                (isExpense && c.budget > 0 ? ' <em>/ ' + S.money(c.budget) + '</em>' : '') +
              '</span>' +
            '</span>' +
            (isExpense
              ? (c.budget > 0
                ? view.rail(pct, hot ? QH.ui.cssVar('--coral') : c.color, 6)
                : '<span class="manage-hint">未设分类预算</span>')
              : '<span class="manage-hint">收入分类</span>') +
          '</span>' +
          '<button class="icon-btn" data-edit="' + c.id + '" aria-label="管理分类">' + QH.icon('edit', 15) + '</button>' +
        '</div>';
      }).join('');
    }

    root.innerHTML = '' +
      '<header class="page-head">' +
        '<div>' +
          '<h1>预算</h1>' +
          '<p class="sub">先定月度总额，再给每个支出分类分配额度</p>' +
        '</div>' +
      '</header>' +

      '<section class="card budget-hero">' +
        '<div class="bh-head">' +
          '<div>' +
            '<p class="bh-label">' + m.label + ' 已支出</p>' +
            '<p class="bh-value ' + (over ? 'out' : '') + '">' + S.money(spent) + '</p>' +
          '</div>' +
          '<button class="btn ghost sm" data-set-total>' +
            (budget > 0 ? '修改总额' : '设置总额') + '</button>' +
        '</div>' +
        (budget > 0
          ? view.rail(spent / budget * 100, over ? QH.ui.cssVar('--coral') : QH.ui.cssVar('--green'), 12) +
            '<div class="bh-foot">' +
              '<span>预算 ' + S.money(budget) + '</span>' +
              '<span class="' + (over ? 'out' : 'in') + '">' +
                (over ? '超支 ' + S.money(spent - budget)
                      : '剩余 ' + S.money(remaining) + ' · 日均可用 ' + S.money(Math.floor(remaining / daysLeft))) +
              '</span>' +
            '</div>'
          : '<p class="muted small">还没有预算。设置后首页会显示进度，并在超支时提醒你。</p>') +
      '</section>' +

      '<div class="grid-2">' +
        '<div class="card">' +
          '<div class="card-head"><h3>支出分类</h3>' +
            '<button class="link" data-add-cat="0">＋ 新增</button></div>' +
          '<div class="manage-list">' + catRows(expenseCats, true) + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-head"><h3>收入分类</h3>' +
            '<button class="link" data-add-cat="1">＋ 新增</button></div>' +
          '<div class="manage-list">' + catRows(incomeCats, false) + '</div>' +
        '</div>' +
      '</div>' +
      recurringCard() +
      '<p class="foot-note">点击分类右侧的笔，可重命名、设置分类预算或删除；已被使用的分类不能删除，以保护历史记录。</p>';

    root.querySelectorAll('[data-add-recurring]').forEach(function (btn) {
      btn.addEventListener('click', openRecurringForm);
    });
    root.querySelectorAll('[data-del-rule]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var rule = S.recurring().filter(function (r) { return r.id === btn.getAttribute('data-del-rule'); })[0];
        if (!rule) return;
        QH.ui.confirm({
          title: '删除固定项？',
          message: '「' + QH.ui.esc(rule.name) + '」以后不会再提醒。已经记到账本里的记录不受影响。',
          confirmText: '删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          S.removeRecurring(rule.id);
          QH.ui.toast('已删除');
          QH.render();
        });
      });
    });

    root.querySelector('[data-set-total]').addEventListener('click', function () {
      QH.ui.input({
        title: '月度总预算',
        label: '每月可支出的总额度（元），填 0 表示关闭预算提醒',
        prefix: '¥',
        type: 'text',
        inputmode: 'decimal',
        value: budget > 0 ? S.inputAmount(budget) : '',
        placeholder: '例如 6000',
        confirmText: '保存',
        validate: function (v) { S.parseCents(v); }
      }).then(function (value) {
        if (value == null) return;
        S.setMonthlyBudget(S.parseCents(value));
        QH.ui.toast(budget ? '预算已更新' : '预算已设置');
        QH.render();
      });
    });

    root.querySelectorAll('[data-add-cat]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var type = parseInt(btn.getAttribute('data-add-cat'), 10);
        QH.ui.input({
          title: '新增' + (type === QH.EXPENSE ? '支出' : '收入') + '分类',
          label: '分类名称（最多 20 个字）',
          maxlength: 20,
          placeholder: '例如 宠物、订阅、稿费',
          confirmText: '创建',
          validate: function (v) {
            if (!v) throw new Error('名称不能为空');
            var dup = S.categories(type).some(function (c) { return c.name === v; });
            if (dup) throw new Error('该分类已存在');
          }
        }).then(function (value) {
          if (value == null) return;
          try {
            S.addCategory(value, type);
            QH.ui.toast('分类已创建');
            QH.render();
          } catch (e) { QH.ui.toast(e.message, 'warn'); }
        });
      });
    });

    root.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var cat = S.categoryById(btn.getAttribute('data-edit'));
        if (!cat) return;
        var isExpense = cat.type === QH.EXPENSE;
        var used = S.categoryUsage(cat.id);
        var items = isExpense
          ? [['rename', '重命名'], ['budget', '设置分类预算'], ['delete', '删除分类']]
          : [['rename', '重命名'], ['delete', '删除分类']];

        QH.ui.modal({
          title: cat.name,
          subtitle: (isExpense ? '支出分类' : '收入分类') + ' · 已有 ' + used + ' 笔记录',
          body: '<div class="menu-list">' + items.map(function (item) {
            return '<button class="menu-item' + (item[0] === 'delete' ? ' danger' : '') +
              '" data-act="' + item[0] + '">' + item[1] + '</button>';
          }).join('') + '</div>',
          onMount: function (m) {
            m.el.querySelectorAll('[data-act]').forEach(function (item) {
              item.addEventListener('click', function () {
                var act = item.getAttribute('data-act');
                m.close();
                setTimeout(function () { handleCategoryAction(cat, act); }, 120);
              });
            });
          }
        });
      });
    });

    function handleCategoryAction(cat, act) {
      if (act === 'rename') {
        QH.ui.input({
          title: '重命名分类',
          label: '新的分类名称',
          value: cat.name,
          maxlength: 20,
          confirmText: '保存',
          validate: function (v) {
            if (!v) throw new Error('名称不能为空');
            var dup = S.categories(cat.type).some(function (c) { return c.id !== cat.id && c.name === v; });
            if (dup) throw new Error('同类型下已有同名分类');
          }
        }).then(function (value) {
          if (value == null) return;
          try { S.renameCategory(cat.id, value); QH.ui.toast('已重命名'); QH.render(); }
          catch (e) { QH.ui.toast(e.message, 'warn'); }
        });
      } else if (act === 'budget') {
        QH.ui.input({
          title: '分类预算 · ' + cat.name,
          label: '每月该分类的额度（元），填 0 表示不单独限制',
          prefix: '¥',
          inputmode: 'decimal',
          value: cat.budget > 0 ? S.inputAmount(cat.budget) : '',
          placeholder: '例如 1500',
          confirmText: '保存',
          validate: function (v) { S.parseCents(v); }
        }).then(function (value) {
          if (value == null) return;
          S.setCategoryBudget(cat.id, S.parseCents(value));
          QH.ui.toast('分类预算已保存');
          QH.render();
        });
      } else if (act === 'delete') {
        if (S.categoryUsage(cat.id) > 0) {
          QH.ui.confirm({
            title: '无法删除',
            message: '「' + QH.ui.esc(cat.name) + '」已被 ' + S.categoryUsage(cat.id) +
              ' 笔记录使用。为保护历史数据，请先把这些记录改到其他分类。',
            confirmText: '知道了'
          });
          return;
        }
        QH.ui.confirm({
          title: '删除分类？',
          message: '「' + QH.ui.esc(cat.name) + '」尚未被使用，可以安全删除。',
          confirmText: '删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          S.deleteCategory(cat.id);
          QH.ui.toast('已删除');
          QH.render();
        });
      }
    }

    function previewImport(text, source) {

      var parsed;

        box.innerHTML = '<div class="alert error">' + QH.icon('close', 16) +

        return;

      var income = 0, expense = 0;
      var minT = Infinity, maxT = -Infinity;
      var fresh = parsed.items.filter(function (i) { return !i.dup; });
      parsed.items.forEach(function (item) {
        if (item.type === QH.INCOME) income += item.cents; else expense += item.cents;
        minT = Math.min(minT, item.time);
        maxT = Math.max(maxT, item.time);
      });
      box.innerHTML = '' +
        '<div class="alert ok">' +
          QH.icon('check', 16) +
          '<span><b>' + fresh.length + ' 笔</b>可导入 · 来源：' + QH.ui.esc(source) + '</span>' +
        '</div>' +
        (parsed.duplicates
          ? '<div class="alert warn">' + QH.icon('shield', 16) +
            '<span>其中 <b>' + parsed.duplicates + ' 笔</b>与已有记录重复（日期、金额、分类、备注都一样），导入时会跳过。</span></div>'

          '<button class="btn ghost sm" data-cancel-import>取消</button>' +
          '<button class="btn primary sm" data-do-import>确认导入</button>' +

      box.querySelector('[data-cancel-import]').addEventListener('click', function () { box.innerHTML = ''; });
      box.querySelector('[data-do-import]').addEventListener('click', function () {
        var res = S.importRows(parsed);

                if (dup) throw new Error('该分类已存在');
              }
            }).then(function (value) {
              if (value == null) return;
              try {
                S.addCategory(value, type);
                var created = S.categories(type).filter(function (c) { return c.name === value; })[0];
                if (created) selected = created.id;
                renderChips();
                updateHint();
              } catch (e) { QH.ui.toast(e.message, 'warn'); }
            });
          });
        }

        function updateHint() {
          if (type !== QH.EXPENSE) { hint.textContent = ''; hint.className = 'budget-hint'; return; }
          var budget = S.monthlyBudget();
          if (budget <= 0) { hint.textContent = ''; hint.className = 'budget-hint'; return; }
          var m0 = S.monthRange(0);
          var spent = S.sumOf(S.entriesIn(m0.from, m0.until).filter(function (e) {
            return e.type === QH.EXPENSE;
          }));
          var cents = 0;
          try { cents = S.parseCents(amount.value); } catch (e) { cents = 0; }
          var after = spent + cents;
          var over = after > budget;
          hint.className = 'budget-hint' + (over ? ' over' : '');
          hint.textContent = over
            ? '这笔之后本月支出 ' + S.money(after) + '，超出预算 ' + S.money(after - budget)
            : '本月预算剩余 ' + S.money(budget - spent) + '，记完这笔还剩 ' + S.money(Math.max(0, budget - after));
        }

        m.el.querySelectorAll('[data-type-seg] [data-type]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var next = parseInt(btn.getAttribute('data-type'), 10);
            if (next === type) return;
            type = next;
            selected = null;
            m.el.querySelectorAll('[data-type-seg] [data-type]').forEach(function (b) {
              b.classList.toggle('on', b === btn);
            });
            renderChips();
            updateHint();
          });
        });

        amount.addEventListener('input', updateHint);
        renderChips();
        updateHint();

        var busy = false;
        function save() {
          if (busy) return;
          error.hidden = true;
          var cents;
          try { cents = S.parseCents(amount.value); }
          catch (e) {
            error.textContent = e.message;
            error.hidden = false;
            amount.focus();
            return;
          }
          if (!selected) {
            error.textContent = '请选择分类';
            error.hidden = false;
            return;
          }
          var time;
          try { time = S.parseISO(dateInput.value); }
          catch (e) {
            error.textContent = '请选择有效日期';
            error.hidden = false;
            return;
          }
          var result;
          try {
            result = S.saveEntry({
              id: editing ? editing.id : null,
              type: type,
              categoryId: selected,
              cents: cents,
              time: time,
              note: note.value.trim()
            });
          } catch (e) {
            error.textContent = e.message;
            error.hidden = false;
            return;
          }
          busy = true;
          m.close();
          QH.render();
          if (result.crossed) {
            QH.ui.toast('已保存 · 本月预算已超支 ' + S.money(Math.max(0,
              S.sumOf(S.entriesIn(S.monthRange(0).from, S.monthRange(0).until)
                .filter(function (e) { return e.type === QH.EXPENSE; })) - S.monthlyBudget())), 'warn');
          } else if (result.catCrossed) {
            QH.ui.toast('已保存 · 该分类超出预算', 'warn');
          } else {
            QH.ui.toast(editing ? '已更新' : '已记一笔');
          }
        }

        m.el.querySelector('[data-save]').addEventListener('click', save);
        m.el.querySelector('[data-cancel]').addEventListener('click', function () { m.close(); });
        amount.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); save(); }
        });
        note.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); save(); }
        });
        var del = m.el.querySelector('[data-delete]');
        if (del) {
          del.addEventListener('click', function () {
            m.close();
            QH.ui.confirm({
              title: '删除这笔记录？',
              message: '「' + S.money(editing.cents) + '」将被移除，此操作不可撤销。',
              confirmText: '删除',
              danger: true
            }).then(function (ok) {
              if (!ok) return;
              S.deleteEntry(editing.id);
              QH.ui.toast('已删除');
              QH.render();
            });
          });
        }

        setTimeout(function () { amount.focus(); amount.select(); }, 60);
      }
    });
    return modal;
  };

  /* --------------------------------------------------- 一句话记账 */

  QH.openNL = function (text) {
    var parsed = QH.nl.parse(text, { today: Date.now(), categories: S.categories() });
    if (!parsed.items.length) {
      QH.ui.toast('没听出金额，试试「昨天火锅 128，打车 32」', 'warn');
      return;
    }

    var allCats = S.categories();
    var rows = parsed.items.map(function (item) {
      var hit = allCats.filter(function (c) {
        return c.type === item.type && c.name === item.categoryName;
      })[0];
      var people = item.people || 0;
      var split = people >= 2;
      return {
        type: item.type,
        totalCents: item.cents,
        people: people,
        split: split,
        amountText: ((split ? item.perPersonCents : item.cents) / 100).toFixed(2),
        dateValue: S.isoDate(item.time),
        note: item.note || '',
        catValue: hit ? hit.id : 'new:' + item.categoryName,
        catName: item.categoryName,
        checked: true,
        warnings: item.warnings || []
      };
    });

    function catOptions(row) {
      var groups = [[QH.EXPENSE, '支出'], [QH.INCOME, '收入']].map(function (pair) {
        var list = allCats.filter(function (c) { return c.type === pair[0]; });
        var opts = list.map(function (c) {
          return '<option value="' + c.id + '"' + (row.catValue === c.id ? ' selected' : '') + '>' +
            QH.ui.esc(c.name) + '</option>';
        }).join('');
        if (row.catValue.indexOf('new:') === 0 && pair[0] === row.type) {
          opts = '<option value="' + row.catValue + '" selected>' +
            QH.ui.esc(row.catValue.slice(4)) + '（新建）</option>' + opts;
        }
        return '<optgroup label="' + pair[1] + '">' + opts + '</optgroup>';
      });
      return groups.join('');
    }

    var modal = QH.ui.modal({
      title: '一句话记账',
      subtitle: '完全离线解析 · 确认后才会入账',
      wide: true,
      body:
        '<div class="nl-echo"><span>你说</span><p>' + QH.ui.esc(text) + '</p></div>' +
        '<div class="nl-summary" data-summary></div>' +
        (parsed.skipped.length
          ? '<p class="nl-skipped">' + parsed.skipped.length + ' 句没识别出金额，已跳过</p>'
          : '') +
        '<div class="nl-list" data-list></div>' +
        '<p class="field-error" data-error hidden></p>',
      footer:
        '<button class="btn ghost" data-cancel>取消</button>' +
        '<div class="foot-right">' +
          '<button class="btn primary" data-confirm>记这几笔</button>' +
        '</div>',
      onMount: function (m) {
        var list = m.el.querySelector('[data-list]');
        var summary = m.el.querySelector('[data-summary]');
        var error = m.el.querySelector('[data-error]');

        function paint() {
          list.innerHTML = rows.map(function (row, i) {
            var cat = S.categoryById(row.catValue);
            var color = cat ? cat.color : S.toneOf(row.catName, row.type);
            return '<div class="nl-item' + (row.checked ? '' : ' off') + '" data-row="' + i + '">' +
              '<label class="nl-check"><input type="checkbox" data-check' +
                (row.checked ? ' checked' : '') + '></label>' +
              '<span class="ico" style="color:' + color + ';background:' + QH.tint(color) + '">' +
                QH.categoryIcon(row.catName, row.type, 17) + '</span>' +
              '<div class="nl-main">' +
                '<div class="nl-line">' +
                  '<select class="field sm nl-cat" data-cat>' + catOptions(row) + '</select>' +
                  '<span class="nl-amount"><i>¥</i>' +
                    '<input data-amt inputmode="decimal" value="' + QH.ui.esc(row.amountText) + '"></span>' +
                '</div>' +
                '<div class="nl-line">' +
                  '<input class="field sm nl-note" data-note placeholder="备注（可空）" value="' +
                    QH.ui.esc(row.note) + '">' +
                  '<input class="field sm nl-date" type="date" data-date value="' + row.dateValue + '">' +
                '</div>' +
                (row.people >= 2
                  ? '<div class="nl-line nl-split-row">' +
                      '<span class="nl-split-info">共 ' + S.money(row.totalCents) + ' · ' + row.people + ' 人</span>' +
                      '<div class="segmented mini">' +
                        '<button type="button" data-split="per" class="' + (row.split ? 'on' : '') + '">人均 ' +
                          S.money(Math.round(row.totalCents / row.people)) + '</button>' +
                        '<button type="button" data-split="all" class="' + (row.split ? '' : 'on') + '">全额 ' +
                          S.money(row.totalCents) + '</button>' +
                      '</div>' +
                    '</div>'
                  : '') +
                (row.warnings.length
                  ? '<p class="nl-warn">' + QH.ui.esc(row.warnings.join('；')) + '</p>'
                  : '') +
              '</div>' +
              '</div>';
          }).join('');
          bindRows();
          updateSummary();
        }

        function bindRows() {
          list.querySelectorAll('[data-row]').forEach(function (el) {
            var i = +el.getAttribute('data-row');
            el.querySelector('[data-check]').addEventListener('change', function (e) {
              rows[i].checked = e.target.checked;
              el.classList.toggle('off', !e.target.checked);
              updateSummary();
            });
            el.querySelector('[data-cat]').addEventListener('change', function (e) {
              readRow(el, i);
              var v = e.target.value;
              rows[i].catValue = v;
              if (v.indexOf('new:') === 0) rows[i].catName = v.slice(4);
              else {
                var c = S.categoryById(v);
                if (c) { rows[i].type = c.type; rows[i].catName = c.name; }
              }
              paint();
            });
            el.querySelector('[data-amt]').addEventListener('input', function (e) {
              rows[i].amountText = e.target.value;
              updateSummary();
            });
            el.querySelector('[data-date]').addEventListener('change', function (e) {
              rows[i].dateValue = e.target.value;
            });
            el.querySelector('[data-note]').addEventListener('input', function (e) {
              rows[i].note = e.target.value;
            });
            el.querySelectorAll('[data-split]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                readRow(el, i);
                var per = btn.getAttribute('data-split') === 'per';
                rows[i].split = per;
                var cents = per ? Math.round(rows[i].totalCents / rows[i].people) : rows[i].totalCents;
                rows[i].amountText = (cents / 100).toFixed(2);
                paint();
              });
            });
          });
        }

        function readRow(el, i) {
          rows[i].amountText = el.querySelector('[data-amt]').value;
          rows[i].dateValue = el.querySelector('[data-date]').value;
          rows[i].note = el.querySelector('[data-note]').value;
          rows[i].checked = el.querySelector('[data-check]').checked;
        }

        function updateSummary() {
          var income = 0, expense = 0, count = 0;
          rows.forEach(function (row) {
            if (!row.checked) return;
            var cents = 0;
            try { cents = S.parseCents(row.amountText); } catch (e) { cents = 0; }
            if (row.type === QH.INCOME) income += cents; else expense += cents;
            count++;
          });
          summary.innerHTML =
            '<span class="nl-count">识别到 <b>' + rows.length + '</b> 笔，已选 <b>' + count + '</b> 笔</span>' +
            '<span class="out">支出 ' + S.money(expense) + '</span>' +
            '<span class="in">收入 ' + S.money(income) + '</span>';
          var btn = m.el.querySelector('[data-confirm]');
          btn.textContent = count ? '记这 ' + count + ' 笔' : '请先勾选';
          btn.disabled = count === 0;
        }

        paint();

        m.el.querySelector('[data-cancel]').addEventListener('click', function () { m.close(); });

        var busy = false;
        m.el.querySelector('[data-confirm]').addEventListener('click', function () {
          if (busy) return;
          /* 先把当前 DOM 值写回，避免漏掉未失焦的编辑 */
          list.querySelectorAll('[data-row]').forEach(function (el) {
            readRow(el, +el.getAttribute('data-row'));
          });
          var saved = 0, crossed = 0, failed = [];
          rows.forEach(function (row) {
            if (!row.checked) return;
            try {
              var cents = S.parseCents(row.amountText);
              if (!(cents > 0)) throw new Error('金额需大于 0');
              var catId;
              if (row.catValue.indexOf('new:') === 0) {
                catId = S.categoryByName(row.catValue.slice(4), row.type).id;
              } else {
                catId = row.catValue;
              }
              var res = S.saveEntry({
                type: row.type,
                categoryId: catId,
                cents: cents,
                time: S.parseISO(row.dateValue),
                note: (row.split && row.people >= 2
                  ? (row.note ? row.note + ' ' : '') + '（' + row.people + '人AA）'
                  : row.note).slice(0, 120)
              });
              saved++;
              if (res.crossed || res.catCrossed) crossed++;
            } catch (e) {
              failed.push(e.message);
            }
          });
          if (!saved) {
            error.textContent = failed[0] || '保存失败';
            error.hidden = false;
            return;
          }
          busy = true;
          m.close();
          QH.render();
          QH.ui.toast('已记 ' + saved + ' 笔' + (crossed ? ' · 预算已超支' : ''),
            crossed ? 'warn' : '');
        });
      }
    });
    return modal;
  };

  /* ------------------------------------------------------------- 委托 */

  document.addEventListener('click', function (event) {
    var addBtn = event.target.closest('[data-add]');
    if (addBtn) {
      event.preventDefault();
      QH.openEntry(null);
      return;
    }
    var routeBtn = event.target.closest('[data-route]');
    if (routeBtn) {
      event.preventDefault();
      QH.go(routeBtn.getAttribute('data-route'));
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    var tag = (event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || event.target.isContentEditable) return;
    if (document.body.classList.contains('modal-open')) return;
    if (event.key === 'n' || event.key === 'N') {
      event.preventDefault();
      QH.openEntry(null);
    }
  });

  /* ------------------------------------------------------------- 启动 */

  /* 移动端：向下滚动时收起悬浮按钮，避免压住内容 */
  var lastScrollY = 0;
  window.addEventListener('scroll', function () {
    var fab = document.querySelector('.fab');
    if (!fab) return;
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (y > lastScrollY + 8 && y > 140) fab.classList.add('hidden');
    else if (y < lastScrollY - 8 || y <= 140) fab.classList.remove('hidden');
    lastScrollY = y;
  }, { passive: true });

  function boot() {
    QH.applyTheme();
    QH.render();

    /* 离线能力：注册 service worker（file:// 下跳过，直接开也能用） */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 &&
        !window.__QH_STANDALONE__) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* 忽略：不影响正常使用 */ });
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('[data-demo]')?.click());document.getElementById('reset-demo').onclick=()=>{QH.store._reset();QH.render();document.querySelector('[data-demo]')?.click()};document.addEventListener('click',e=>{let a=e.target.closest('a[download]');if(a){e.preventDefault();QH.ui.toast('安装后可下载文件')}});</script></body></html>
