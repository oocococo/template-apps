<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
/* ============ 书法字体（本地内置，离线可用） ============ */



/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --paper: #F6F0E7;        /* 宣纸米色 */
  --card: #FFFDF8;         /* 卡片纸白 */
  --ink: #332A24;          /* 墨色 */
  --ink2: #8A7A69;         /* 淡墨 */
  --red: #A33B2A;          /* 朱砂红 */
  --red-tint: #F4E3DD;
  --gold: #B98A2F;         /* 鎏金 */
  --gold-tint: #F2E8D5;
  --line: #E9DFCC;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --kai: "STKaiti", "KaiTi", "Kaiti SC", "SimKai", var(--serif);
  --sans: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --shadow: 0 2px 12px rgba(90, 66, 40, .09);
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: #E8DFD0;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.65;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--paper);
  position: relative;
  box-shadow: 0 0 30px rgba(70, 50, 30, .18);
  display: flex;
  flex-direction: column;
}

/* ============ 顶栏 ============ */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 14px 10px;   /* 2026-10-08 左右 18→14：给中间的鼎腾出空间 */
  background: linear-gradient(180deg, #F9F4EC 0%, var(--paper) 100%);
  position: sticky; top: 0; z-index: 30;
  border-bottom: 1px solid transparent;
}
#topbar.scrolled { border-bottom-color: var(--line); }
body.detail #topbar { display: none; }
.brand { display: flex; align-items: center; gap: 10px; }
.seal {
  width: 40px; height: 40px; border-radius: 9px; flex: none;
  background: var(--red); color: #FFF9F0;
  font-family: "MaShanZheng", var(--kai); font-size: 27px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #7E2A1D; outline: 2px solid var(--red); outline-offset: 3px;
  box-shadow: 0 3px 8px rgba(163, 59, 42, .4);
}
.brand h1 { font-family: "ZhiMangXing", var(--kai); font-size: 25px; letter-spacing: 2px; font-weight: 400; padding-top: 3px; }
.brand p { font-size: 10.5px; color: var(--ink2); letter-spacing: .5px; margin-top: -3px; }   /* 2026-10-08 微缩：给中间的鼎腾空间 */

/* ============ 内容区 ============ */
#view { flex: 1; padding-bottom: 86px; animation: fadeIn .25s ease; position: relative; z-index: 1; }
/* 顶栏中间的文物剪影（淡金色，不抢眼） */
.top-silhouette { flex: 1; min-width: 0; height: 50px; margin: 0 6px; opacity: .38; }   /* 2026-10-08 用户要求：鼎放大（吃满中间空档；配合上下左右微调挤出空间） */
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 18px 10px;
}
.section-head h2 {
  font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: 1px;
  display: flex; align-items: center; gap: 8px;
}
.section-head h2::before {
  content: ""; width: 5px; height: 18px; border-radius: 3px;
  background: linear-gradient(180deg, var(--red), #C96A4E);
}
.section-head .sub { font-size: 12px; color: var(--ink2); }
.section-head .more {
  font-size: 12.5px; color: var(--red); cursor: pointer; letter-spacing: .5px;
  background: none; border: none; font-family: inherit;
}

/* ============ 搜索框 ============ */
.searchbar {
  margin: 6px 16px 4px;
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 14px; padding: 10px 14px;
  box-shadow: var(--shadow);
  transition: border-color .2s;
}
.searchbar:focus-within { border-color: var(--gold); }
.searchbar svg { width: 18px; height: 18px; color: var(--ink2); flex: none; }
.searchbar input {
  flex: 1; border: none; outline: none; background: none;
  font-size: 15px; font-family: inherit; color: var(--ink);
}
.searchbar input::placeholder { color: #B7A897; }
.hotwords { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 2px; }
.hotwords .hw {
  font-size: 12.5px; color: var(--ink2); background: var(--gold-tint);
  border: none; border-radius: 999px; padding: 4px 12px; cursor: pointer;
  font-family: inherit;
}
.hotwords .hw:active { background: #EAD9B8; }

/* ============ 网红文物横滑 ============ */
.hscroll {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 4px 16px 14px; scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.hscroll::-webkit-scrollbar { display: none; }
.hcard {
  flex: none; width: 146px; scroll-snap-align: start;
  background: var(--card); border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow); cursor: pointer; border: 1px solid #F0E8D8;
  transition: transform .15s;
}
.hcard:active { transform: scale(.97); }
.hcard .media { height: 150px; }
.hcard .info { padding: 8px 10px 10px; }
.hcard .info b { font-family: var(--serif); font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hcard .info span { font-size: 11px; color: var(--ink2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.rank {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px;
  background: rgba(163, 59, 42, .92); color: #FFF6EC;
  font-size: 12px; font-weight: 700; font-style: italic;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 5px rgba(0,0,0,.25);
}
.rank.top { background: linear-gradient(135deg, #C9971F, #A9772B); }

/* ============ 图片容器（含占位） ============ */
.media { position: relative; overflow: hidden; background: var(--gold-tint); }
.media .ph {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.5), transparent 40%),
    linear-gradient(160deg, #F3E9D6 0%, #EADDC3 100%);
  color: #BCA37B;
}
.media .ph::before {
  content: attr(data-ch); font-family: var(--kai); font-size: 44px; line-height: 1;
  opacity: .8;
}
.media .ph::after { content: attr(data-label); font-size: 11px; opacity: .75; letter-spacing: 1px; }
.media img {
  position: relative; z-index: 1; width: 100%; height: 100%;
  object-fit: cover; display: block; background: var(--card);
}

/* ============ 博物馆列表卡片 ============ */
.mlist { display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 8px; }
.mcard {
  display: flex; gap: 12px; background: var(--card);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  box-shadow: var(--shadow); border: 1px solid #F0E8D8;
  transition: transform .15s;
}
.mcard:active { transform: scale(.98); }
.mcard .media { width: 106px; flex: none; }
.mcard .info { flex: 1; padding: 10px 12px 10px 0; min-width: 0; }
.mcard .info h3 { font-family: var(--serif); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.city-tag {
  font-size: 10.5px; color: var(--gold); border: 1px solid var(--gold);
  border-radius: 5px; padding: 0 5px; font-weight: 400; flex: none; letter-spacing: 1px;
}
.mcard .info p { font-size: 12.5px; color: var(--ink2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcard .meta { font-size: 11.5px; color: #B09C86; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.mcard .meta .dot { color: var(--gold); }

/* ============ 筛选chips ============ */
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 14px 16px 12px; scrollbar-width: none; }   /* 2026-10-07 用户反馈"太顶"：胶囊改小一号+上下加透气 */
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-size: 12.5px; font-family: inherit;
  color: var(--ink2); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; transition: all .15s;
}
.chip.active {
  background: var(--red); border-color: var(--red); color: #FFF7EE;
  box-shadow: 0 2px 8px rgba(163, 59, 42, .3);
}

/* ============ 文物网格 ============ */
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 16px 8px; }
.acard {
  background: var(--card); border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow); cursor: pointer; border: 1px solid #F0E8D8;
  transition: transform .15s; position: relative;
}
.acard:active { transform: scale(.97); }
.acard .media { aspect-ratio: 1 / 1; }   /* 1:1：图片源已统一为正方形，杜绝裁切出画 */
.acard .media .ph::before { font-size: 36px; }
.acard .info { padding: 8px 10px 10px; }
.acard .info b { font-family: var(--serif); font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard .info span { font-size: 11px; color: var(--ink2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.acard .info .tb-line { font-style: normal; display: block; font-size: 10px; color: var(--gold); margin-top: 3px; line-height: 1.5; }
.hot-badge {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  background: rgba(163, 59, 42, .92); color: #FFF6EC;
  font-size: 10.5px; padding: 2px 7px; border-radius: 7px; letter-spacing: 1px;
  box-shadow: 0 2px 5px rgba(0,0,0,.22);
}
.fav-badge {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255, 253, 248, .94); color: var(--red);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}

/* ============ 详情页 ============ */
.hero { position: relative; background: #2E2620; }
.hero .media { height: 300px; background: #2E2620; }
.hero .media img { object-fit: contain; background: #26201B; }
.hero .media .ph { background: linear-gradient(160deg, #3A2F26, #241D18); color: #9A8365; }
.hero-cover .media { height: 320px; }
.hero-cover .media img { object-fit: cover; }
.hero .veil {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(20,14,10,.34) 0%, transparent 30%, transparent 55%, rgba(20,14,10,.72) 100%);
}
.hero .h-title {
  position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 3; color: #FBF5EA;
}
.hero .h-title h2 { font-family: var(--serif); font-size: 26px; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.hero .h-title p { font-size: 12.5px; opacity: .92; margin-top: 4px; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.float-btn {
  position: absolute; z-index: 5; top: 14px;
  width: 38px; height: 38px; border: none; border-radius: 50%;
  background: rgba(28, 20, 14, .45); color: #FBF5EA; backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.float-btn svg { width: 20px; height: 20px; }
.float-btn.back { left: 14px; }
.float-btn.fav { right: 14px; font-size: 19px; }
.float-btn.fav.on { background: var(--red); color: #FFF6EC; }
.dbody { padding: 0 18px 30px; margin-top: -14px; position: relative; }
.panel {
  background: var(--card); border-radius: 16px; padding: 16px;
  box-shadow: var(--shadow); border: 1px solid #F0E8D8;
}
.panel + .panel, .panel + .section-head, .section-head + .panel { margin-top: 14px; }
.lead { font-size: 14.5px; line-height: 1.85; color: #4A3E33; text-align: justify; }
.lead-tag {
  display: inline-block; font-size: 12px; color: var(--red);
  background: var(--red-tint); border-radius: 6px; padding: 2px 9px; margin-bottom: 10px;
  font-family: var(--serif); letter-spacing: 1px;
}
.chipline { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.pill {
  font-size: 11.5px; color: var(--ink2); background: var(--gold-tint);
  border-radius: 999px; padding: 3px 11px;
}
.pill.red { background: var(--red-tint); color: var(--red); }
.info-rows { display: flex; flex-direction: column; gap: 12px; }
.irow { display: flex; gap: 10px; font-size: 13.5px; }
.irow .lab {
  flex: none; width: 64px; color: #A08A6F; font-family: var(--serif);
  letter-spacing: 1px; display: flex; align-items: center; gap: 4px;
}
.irow .val { flex: 1; color: #4A3E33; }
.irow .val a { color: var(--red); text-decoration: none; }
.action-row { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1; border: none; border-radius: 13px; padding: 12px 0;
  font-size: 14.5px; font-family: inherit; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .15s; letter-spacing: 1px;
}
.btn:active { transform: scale(.97); }
.btn-red { background: var(--red); color: #FFF7EE; box-shadow: 0 3px 12px rgba(163, 59, 42, .35); }
.btn-red.on { background: var(--gold); box-shadow: 0 3px 12px rgba(185, 138, 47, .35); }
.btn-line { background: var(--card); color: var(--red); border: 1.5px solid var(--red); }
.btn-gold { background: var(--gold); color: #FFF9EE; box-shadow: 0 3px 12px rgba(185, 138, 47, .35); text-decoration: none; }
.btn svg { width: 17px; height: 17px; }

/* 文物详情里的藏馆卡 */
.mini-museum {
  display: flex; gap: 12px; align-items: center; background: var(--gold-tint);
  border-radius: 12px; padding: 10px 12px; margin-top: 4px; cursor: pointer;
}
.mini-museum .media { width: 64px; height: 64px; border-radius: 10px; flex: none; }
.mini-museum .media .ph::before { font-size: 26px; }
.mini-museum .media .ph::after { display: none; }
.mini-museum b { font-family: var(--serif); font-size: 15px; }
.mini-museum p { font-size: 12px; color: var(--ink2); }
.mini-museum .arrow { margin-left: auto; color: var(--gold); font-size: 18px; }
.fact-card {
  background: linear-gradient(150deg, #FBF3E4, #F6E9D2);
  border: 1px solid #EAD9B8; border-radius: 16px; padding: 15px 16px;
  margin-top: 14px;
}
.fact-card h4 {
  font-family: var(--serif); color: var(--red); font-size: 14px;
  display: flex; align-items: center; gap: 6px; margin-bottom: 7px; letter-spacing: 1px;
}
.fact-card p { font-size: 13.5px; line-height: 1.8; color: #5A4A38; text-align: justify; }

/* ============ 我的 ============ */
.stats { display: flex; gap: 12px; padding: 6px 16px 4px; }
.stat {
  flex: 1; background: var(--card); border-radius: 14px; padding: 14px 6px 12px;
  text-align: center; box-shadow: var(--shadow); border: 1px solid #F0E8D8;
}
.stat b { font-family: var(--serif); font-size: 26px; color: var(--red); display: block; line-height: 1.2; }
.stat span { font-size: 11.5px; color: var(--ink2); letter-spacing: 1px; }
.province-box { display: flex; flex-wrap: wrap; gap: 7px; padding: 4px 16px; }
.prov {
  font-size: 12px; padding: 3px 11px; border-radius: 999px;
  background: #EDE4D2; color: #A5947D; border: 1px solid transparent;
}
.prov.on { background: var(--red-tint); color: var(--red); border-color: #E4C2B6; font-weight: 600; }
.visit-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 12px; padding: 10px 14px;
  box-shadow: var(--shadow); border: 1px solid #F0E8D8; margin-bottom: 10px;
}
.visit-row .stamp {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  border: 2px solid var(--red); color: var(--red); font-family: var(--kai);
  display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; line-height: 1.12; padding: 2px; font-weight: 700;
  transform: rotate(-8deg);
  background: rgba(255, 253, 248, .6);
}
.visit-row b { font-family: var(--serif); font-size: 14.5px; display: block; cursor: pointer; }
.visit-row p { font-size: 11.5px; color: var(--ink2); }
.visit-row .del {
  margin-left: auto; border: none; background: none; color: #C0AE97;
  font-size: 12.5px; cursor: pointer; font-family: inherit; padding: 6px;
}
.foot-note .del {
  border: none; background: none; font-family: inherit;
  font-size: inherit; color: inherit; cursor: pointer; padding: 4px 8px;
}
.empty {
  text-align: center; color: #B7A897; font-size: 13px; padding: 26px 20px; line-height: 2;
}
.empty .big { font-size: 40px; display: block; font-family: var(--kai); color: #D8C7A8; }

/* ============ 底部导航 ============ */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 40;
  display: flex; background: rgba(255, 253, 248, .96); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
#tabbar a {
  flex: 1; text-decoration: none; color: #A5947D;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 7px; font-size: 10.5px; letter-spacing: 1px; cursor: pointer;
  transition: color .15s;
}
#tabbar a svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#tabbar a.active { color: var(--red); }
#tabbar a.active svg { stroke-width: 2; }

/* ============ 提示横幅 ============ */
.notice {
  margin: 10px 16px; padding: 10px 14px; border-radius: 12px;
  background: var(--gold-tint); color: #8A6D3B; font-size: 12.5px;
  display: flex; gap: 8px; align-items: flex-start; line-height: 1.6;
}
.foot-note { text-align: center; font-size: 11px; color: #C0AE97; padding: 18px 30px 8px; line-height: 1.9; }
#view .search-result-title { padding: 16px 18px 8px; font-size: 12.5px; color: var(--ink2); letter-spacing: 1px; }
mark { background: none; color: var(--red); font-weight: 600; }

/* ============ V1.1 新增样式 ============ */
/* 吸顶搜索（首页） */
.stickywrap {
  position: sticky; top: 64px; z-index: 25; padding-top: 4px;
  background: var(--paper);
}
.stickywrap::after {
  content: ""; display: block; height: 12px; margin-bottom: -12px;
  background: linear-gradient(var(--paper), rgba(246, 240, 231, 0));
}
/* 每日一句（精选博物馆标题右侧，居中） */
.sec-quote {
  flex: 1; min-width: 0; text-align: center; cursor: pointer;
  font-family: var(--serif); font-size: 11.5px; color: var(--gold);
  letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 8px;
}
/* 每日一宝 */
.daily {
  margin: 14px 16px 2px; display: flex; gap: 12px; align-items: center;
  background: linear-gradient(140deg, #FBF3E0, #F6E7CD);
  border: 1px solid #EBD9B5; border-radius: 16px; padding: 12px;
  cursor: pointer; box-shadow: var(--shadow); transition: transform .15s;
}
.daily:active { transform: scale(.98); }
.daily .media { width: 84px; height: 84px; border-radius: 12px; flex: none; }
.daily .media .ph::before { font-size: 30px; }
.daily .media .ph::after { display: none; }
.daily .d-label { font-size: 11px; color: var(--gold); letter-spacing: 2px; font-weight: 600; }
.daily b { font-family: var(--serif); font-size: 17px; display: block; margin-top: 2px; }
.daily p { font-size: 12px; color: var(--ink2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.daily .arrow { margin-left: auto; color: var(--gold); font-size: 20px; flex: none; }
/* 小圆按钮 / 看全部按钮 */
.mini-btn {
  font-size: 12px; color: var(--red); background: var(--red-tint); border: none;
  border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 4px;
}
.mini-btn:active { opacity: .75; }
.all-btn {
  display: block; width: calc(100% - 32px); margin: 6px 16px 4px; text-align: center;
  border: 1.5px dashed var(--gold); color: var(--gold); background: transparent;
  border-radius: 14px; padding: 11px 0; font-size: 13.5px; cursor: pointer;
  font-family: inherit; letter-spacing: 1px;
}
.all-btn:active { background: var(--gold-tint); }
.mlist .all-btn { margin: 0 0 2px; width: 100%; }
/* 搜索框里的城市按钮（首页：你在的城市） */
.city-btn {
  display: flex; align-items: center; gap: 3px; flex: none;
  border: none; background: none; cursor: pointer; font-family: inherit; padding: 2px 0;
}
.city-btn .pin { font-size: 12.5px; }
.city-btn .city-txt {
  font-family: var(--serif); font-size: 14px; color: var(--red); letter-spacing: 1px;
  max-width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.city-btn .caret { font-size: 9px; color: var(--ink2); }
.sb-div { width: 1px; height: 16px; background: var(--line); flex: none; }
#city-zone .section-head { padding: 14px 18px 8px; }
.city-note { font-size: 12px; color: var(--ink2); line-height: 1.75; margin-top: 6px; }
/* 2026-10-08 选城市弹窗改版：搜索框 + 按省份分组（全国城市全可选） */
#city-search {
  width: 100%; box-sizing: border-box; margin-top: 10px; padding: 9px 14px;
  border: 1px solid var(--line); border-radius: 999px; background: #FFFCF6;
  font-size: 13px; font-family: inherit; color: var(--ink); outline: none;
  -webkit-appearance: none; appearance: none;
}
#city-search:focus { border-color: var(--gold); }
.city-wrap { max-height: 44vh; overflow-y: auto; margin-top: 8px; padding-right: 2px; }
.city-now { margin-top: 6px; }
.city-group { margin-top: 9px; }
.city-gtitle { font-size: 11px; color: var(--gold); letter-spacing: 1.5px; margin: 0 0 5px 2px; }
.city-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.city-grid .chip { padding: 5px 12px; }
.city-empty { font-size: 12.5px; color: var(--ink2); text-align: center; padding: 22px 0 8px; }
.city-none { font-size: 12px; color: var(--ink2); }
/* ============ 我的页（菜单式：大头像 + 分组入口） ============ */
.mine-top { display: flex; align-items: center; padding: 16px 18px 2px; }
.mine-top h2 { font-family: var(--serif); font-size: 24px; letter-spacing: 2px; }
.gear {
  margin-left: auto; width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink2);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
}
.gear:active { background: var(--gold-tint); }
.gear svg { width: 19px; height: 19px; }
.mine-hero { text-align: center; padding: 16px 18px 8px; }
.mine-avatar {
  width: 86px; height: 86px; margin: 0 auto; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #BB4A34, #A33B2A 62%, #8E2F20);
  color: #FFF4E8; font-family: var(--kai); font-weight: 700; font-size: 40px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #7E2A1D;
  box-shadow: 0 6px 16px rgba(163, 59, 42, .32), inset 0 0 0 2.5px rgba(255, 244, 232, .35);
}
.mine-hero b { display: block; font-family: var(--serif); font-size: 16.5px; margin-top: 12px; letter-spacing: 1px; }
.mine-hero p { font-size: 12.5px; color: var(--ink2); margin-top: 7px; }
.mgrid {
  background: var(--card); border: 1px solid #F0E8D8; border-radius: 14px;
  box-shadow: var(--shadow); margin: 10px 16px; overflow: hidden;
}
.mrow {
  display: flex; align-items: center; gap: 11px; padding: 14px;
  cursor: pointer; border-bottom: 1px solid #F3ECDD;
}
.mrow:last-child { border-bottom: none; }
.mrow:active { background: var(--gold-tint); }
.mrow .mi { width: 22px; height: 22px; flex: none; color: var(--red); display: flex; align-items: center; justify-content: center; }
.mrow .mi svg { width: 20px; height: 20px; }
.mrow b { font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: .5px; }
.mrow .msub { margin-left: auto; font-size: 12px; color: var(--ink2); }
.mrow .arrow { margin-left: auto; color: #C9B79A; font-size: 16px; line-height: 1; }
.mrow .msub + .arrow { margin-left: 3px; }
.favgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 8px 16px 10px; align-items: start; }
.favgrid .hcard { width: 100%; }
.setlist .setrow {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: none; border-bottom: 1px solid #F3ECDD;
  padding: 13px 4px; cursor: pointer; font-family: inherit;
}
.setlist .setrow:last-child { border-bottom: none; }
.setlist .setrow:active { opacity: .7; }
.setlist .setrow b { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .5px; }
.setlist .setrow .mi { width: 22px; flex: none; color: var(--red); display: flex; align-items: center; justify-content: center; }
.setlist .setrow .mi svg { width: 19px; height: 19px; }
.setlist .setrow .msub { margin-left: auto; font-size: 12px; color: var(--ink2); }
.setlist .setrow .arrow { margin-left: auto; color: #C9B79A; font-size: 16px; line-height: 1; }
.setlist .setrow .msub + .arrow { margin-left: 3px; }
.setlist .setrow.danger b { color: #B0432F; }
/* 子页头（专题/时间轴） */
.sub-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
.sub-back {
  width: 34px; height: 34px; flex: none; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-size: 19px; line-height: 1; font-family: inherit; box-shadow: var(--shadow);
}
.sub-head h2 { font-family: var(--serif); font-size: 18px; letter-spacing: 1px; }
.sub-head .sub { font-size: 12px; color: var(--ink2); margin-left: auto; }
/* 文物库入口卡 */
.entries { display: flex; gap: 10px; padding: 2px 16px 10px; }
.entry {
  flex: 1; border-radius: 14px; padding: 12px 11px; cursor: pointer;
  box-shadow: var(--shadow); border: 1px solid rgba(0, 0, 0, .03); transition: transform .15s;
}
.entry:active { transform: scale(.97); }
.entry.red { background: linear-gradient(140deg, #F7E7E1, #F2D9D0); }
.entry.gold { background: linear-gradient(140deg, #F7EEDC, #F0E2C4); }
.entry.jade { background: linear-gradient(140deg, #E7F0E4, #D7E8D3); }
.entry b { font-family: var(--serif); font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.entry p { font-size: 11px; color: var(--ink2); margin-top: 3px; text-align: center; }
/* 定级馆列表卡（找馆） */
.gcard {
  display: flex; align-items: center; gap: 10px; margin: 0 16px 8px; padding: 12px 14px;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
  border: 1px solid rgba(0, 0, 0, .03); cursor: pointer; transition: transform .15s;
}
.gcard:active { transform: scale(.98); }
.gcard .ginfo { flex: 1; min-width: 0; }
.gcard .ginfo b { font-family: var(--serif); font-size: 14.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard .ginfo p { font-size: 11.5px; color: var(--ink2); margin-top: 2px; }
.lvt { flex: none; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; letter-spacing: 1px; }
.lvt.l1 { background: #A33B2A; color: #FFF6EC; }
.lvt.l2 { background: #C09A46; color: #FFF6EC; }
.lvt.l3 { background: #98A2AE; color: #FFF6EC; }
/* 人气榜名次徽章 */
.rk {
  flex: none; width: 27px; height: 27px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; background: #EFE7D8; color: #8A7A62;
}
.rk.r1 { background: #C9971F; color: #FFF9EE; }
.rk.r2 { background: #9AA5B1; color: #FFF9EE; }
.rk.r3 { background: #B08154; color: #FFF9EE; }
/* 专题卡片 */
.topic-card {
  margin: 0 16px 12px; border-radius: 16px; overflow: hidden; cursor: pointer;
  background: var(--card); box-shadow: var(--shadow); border: 1px solid #F0E8D8;
  transition: transform .15s;
}
.topic-card:active { transform: scale(.98); }
.topic-card .strip { display: flex; height: 82px; gap: 2px; }
.topic-card .strip .media { flex: 1; min-width: 0; }
.topic-card .strip .media .ph::after { display: none; }
.topic-card .strip .media .ph::before { font-size: 26px; }
.topic-card .tinfo { padding: 10px 14px 12px; display: flex; align-items: center; gap: 8px; }
.topic-card .tinfo b { font-family: var(--serif); font-size: 16px; }
.topic-card .tinfo p { font-size: 11.5px; color: var(--ink2); margin-top: 1px; }
.topic-card .tinfo .cnt { margin-left: auto; font-size: 11.5px; color: var(--gold); flex: none; }
/* 朝代时间轴 */
.tl { padding-top: 4px; }
.tl-era { position: relative; margin-left: 16px; padding: 0 0 16px 30px; }
.tl-era::before {
  content: ""; position: absolute; left: 4px; top: 28px; bottom: -4px; width: 1.5px;
  background: linear-gradient(#D9C9AC, #E9DFCC);
}
.tl-era:last-child::before { display: none; }
.tl-era .dot {
  position: absolute; left: -1.5px; top: 8px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 4px var(--gold-tint);
}
.tl-era:first-child .dot { background: var(--red); box-shadow: 0 0 0 4px var(--red-tint); }
.tl-head { display: flex; align-items: baseline; gap: 8px; padding: 0 16px 8px 0; }
.tl-head b { font-family: var(--serif); font-size: 17px; letter-spacing: 1px; }
.tl-head span { font-size: 11px; color: var(--ink2); }
.tl-head em { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--gold); }
/* 印章册 */
.stamp-progress { padding: 0 18px 8px; font-size: 12.5px; color: var(--ink2); }
.stamp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; padding: 2px 16px 6px; }
.stamp-cell { text-align: center; cursor: pointer; }
.stamp-seal {
  width: 58px; height: 58px; margin: 0 auto; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--kai); font-weight: 700; font-size: 15px; line-height: 1.15; text-align: center;
  border: 2px solid #D8C7A8; color: #C9B79A; background: rgba(255, 253, 248, .6);
  transition: transform .2s; padding: 2px; word-break: break-all;
}
.stamp-cell .st-name {
  font-size: 10px; color: var(--ink2); margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stamp-cell.on .stamp-seal {
  border-color: var(--red); background: var(--red); color: #FFF4E8;
  box-shadow: 0 3px 10px rgba(163, 59, 42, .35), inset 0 0 0 2px rgba(255, 244, 232, .35);
  transform: rotate(-6deg);
}
.stamp-cell.on:nth-child(even) .stamp-seal { transform: rotate(5deg); }
.stamp-cell.on .st-name { color: var(--red); }
/* 网红文物热榜·大卡轮播（2026-10-08） */
.banner-box {
  position: relative; margin: 2px 16px 6px; border-radius: 16px; overflow: hidden;
  aspect-ratio: 2 / 1; background: #2A2622; box-shadow: var(--shadow);
}
.banner-track { display: flex; height: 100%; transition: transform .55s ease; will-change: transform; touch-action: pan-y; }
.banner-slide { position: relative; flex: none; width: 100%; height: 100%; overflow: hidden; cursor: pointer; }
.banner-slide .bgblur {
  position: absolute; inset: -24px; background-size: cover; background-position: center;
  filter: blur(26px) brightness(.9); transform: scale(1.12);
}
.banner-slide img.art { position: relative; display: block; height: 100%; width: auto; margin: 0 auto; }
.banner-slide .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 42%, rgba(0,0,0,.5));
}
.banner-text { position: absolute; left: 14px; bottom: 11px; right: 96px; color: #fff; }
.banner-text b {
  display: block; font-family: var(--serif); font-size: 17px; letter-spacing: .5px;
  text-shadow: 0 1px 6px rgba(0,0,0,.5);
}
.banner-text span { display: block; font-size: 11.5px; opacity: .9; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
.banner-dots { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 5px; align-items: center; }
.banner-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); transition: all .25s; }
.banner-dot.on { width: 16px; border-radius: 3px; background: #FFF; }
/* 语音朗读 */
.tts-btn {
  display: inline-flex; align-items: center; gap: 7px; margin-top: 12px;
  border: 1.5px solid var(--red); color: var(--red); background: rgba(255, 253, 248, .7);
  border-radius: 999px; padding: 7px 18px; font-size: 13.5px; cursor: pointer;
  font-family: inherit; letter-spacing: 1px; transition: all .15s;
}
.tts-btn:active { transform: scale(.96); }
.tts-btn.speaking { background: var(--red); color: #FFF7EE; }
.tts-btn svg { width: 16px; height: 16px; flex: none; }
/* ============ V1.1.1 中国地图 + 收藏压缩 ============ */
.map-box {
  margin: 0 16px; background: var(--card); border-radius: 16px; padding: 10px 8px 6px;
  box-shadow: var(--shadow); border: 1px solid #F0E8D8; position: relative;
}
.map-box svg { width: 100%; height: auto; display: block; }
.cnp { fill: #F0E7D6; stroke: #DFD2B8; stroke-width: 0.8; cursor: pointer; transition: fill .15s; }
.cnp.on { fill: #EDCFC5; stroke: #B4563F; stroke-width: 1.1; }
.cnp:active { fill: #E4D5BC; }
.cnlabel {
  font-size: 11px; fill: #A33B2A; font-weight: 600; text-anchor: middle;
  pointer-events: none; font-family: var(--sans);
}
.cninset { fill: none; stroke: #E3D6BD; stroke-width: 0.8; }
.cnhit { fill: transparent; cursor: pointer; }
.map-tip { text-align: center; font-size: 11px; color: #C0AE97; padding: 4px 0 2px; }
.hcard.mini { width: 112px; }
.hcard.mini .media { height: 96px; }
.hcard.mini .media .ph::before { font-size: 24px; }
.hcard.mini .info { padding: 6px 8px 8px; }
.hcard.mini .info b { font-size: 12.5px; }
.hcard.mini .info span { font-size: 10.5px; }
.slim-empty {
  margin: 2px 16px 6px; padding: 13px 16px; border: 1.5px dashed var(--line);
  border-radius: 12px; color: var(--ink2); font-size: 12.5px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.slim-empty .go { color: var(--red); flex: none; }
/* ============ V1.1.2 等级 / 展讯 ============ */
.city-tag.lv { color: var(--red); border-color: var(--red); }
.pill.level { background: linear-gradient(135deg, #C9971F, #A9772B); color: #FFF9EE; }
.pill.book { background: #E4EDE2; color: #55804E; }
.tick { font-weight: 600; }
.tick.free { color: #55804E; }
.tick.paid { color: var(--gold); }
.show-card {
  margin: 0 16px 12px; background: var(--card); border-radius: 16px; padding: 14px 118px 14px 16px;
  box-shadow: var(--shadow); border: 1px solid #F0E8D8; position: relative;
}
.sh-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); }
.sh-top b { font-family: var(--serif); font-size: 13.5px; color: var(--ink); }
.sh-type { font-size: 10.5px; padding: 1px 8px; border-radius: 5px; background: var(--gold-tint); color: var(--gold); flex: none; }
.sh-type.red { background: var(--red-tint); color: var(--red); }
.sh-time { margin-left: auto; font-size: 11px; color: var(--gold); flex: none; }
.show-card h4 { font-family: var(--serif); font-size: 15.5px; margin-top: 8px; letter-spacing: .5px; line-height: 1.5; }
.show-card p { font-size: 12.5px; color: #5A4A38; margin-top: 4px; line-height: 1.7; }
.sh-foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; }
.sh-foot a { color: var(--red); text-decoration: none; }
.sh-foot span { color: var(--ink2); cursor: pointer; }
/* 展讯代表展品缩略图 */
.show-thumb {
  position: absolute; top: 44px; right: 14px; width: 92px; height: 100px;
  border-radius: 12px; overflow: hidden; cursor: pointer;
  box-shadow: 0 2px 8px rgba(90, 66, 40, .18); transition: transform .15s;
}
.show-thumb:active { transform: scale(.96); }
.show-thumb .media { height: 100%; }
.show-thumb .media .ph::after { display: none; }
.show-thumb .media .ph::before { font-size: 30px; }
.thumb-name {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  background: linear-gradient(transparent, rgba(30, 20, 12, .78));
  color: #FBF5EA; font-size: 10px; padding: 12px 6px 4px;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* ============ V1.1.4 GPS打卡 / 照片印章 / 可缩放地图 ============ */
.stamp-photo {
  position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 12px;
  overflow: hidden; background: var(--gold-tint);
  box-shadow: var(--shadow); border: 1px solid #F0E8D8;
}
.stamp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.st-seal {
  position: absolute; right: 6px; bottom: 6px; z-index: 2;
  min-width: 40px; height: 40px; padding: 0 6px; border-radius: 9px;
  background: rgba(163, 59, 42, .95); color: #FFF4E8;
  font-family: var(--kai); font-weight: 700; font-size: 12.5px;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-8deg);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .3), inset 0 0 0 2px rgba(255, 244, 232, .4);
}
.st-mine {
  position: absolute; left: 6px; top: 6px; z-index: 2;
  font-size: 9.5px; background: rgba(28, 20, 14, .62); color: #F7EFDF;
  border-radius: 6px; padding: 1px 6px; letter-spacing: 1px;
}
.modal-mask {
  position: fixed; inset: 0; z-index: 90; background: rgba(30, 22, 14, .45);
  display: flex; align-items: center; justify-content: center; padding: 0 34px;
  animation: fadeIn .18s ease;
}
.modal-card {
  background: var(--card); border-radius: 18px; padding: 20px 18px 16px; width: 100%;
  max-width: 360px; box-shadow: 0 12px 40px rgba(40, 25, 12, .35);
  border: 1px solid #F0E8D8;
}
.modal-card h4 { font-family: var(--serif); font-size: 16.5px; margin-bottom: 8px; letter-spacing: 1px; }
.modal-card p { font-size: 13.5px; color: #5A4A38; line-height: 1.75; }
.modal-btns { display: flex; gap: 10px; margin-top: 16px; }
#cnmap { touch-action: none; }
.cnp.onimg { stroke: #B4563F; stroke-width: 1.2; }
.map-hint {
  position: absolute; top: 8px; left: 10px; z-index: 2; font-size: 10.5px; color: #B7A897;
  background: rgba(255, 253, 248, .88); padding: 2px 8px; border-radius: 8px; pointer-events: none;
}
.map-zoom {
  position: absolute; right: 10px; bottom: 44px; z-index: 2;
  display: flex; flex-direction: column; gap: 6px;
}
.mz {
  width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255, 253, 248, .94); color: var(--ink);
  font-size: 16px; font-family: inherit; box-shadow: var(--shadow);
}
.mz:active { background: var(--gold-tint); }
/* ============ V1.1.6 顶栏：时间 + 动态天气 ============ */
.top-meta { margin-left: auto; text-align: right; line-height: 1.35; min-width: 86px; }
.tm-time { font-family: var(--serif); font-size: 15.5px; letter-spacing: 1px; color: var(--ink); font-weight: 600; }
.tm-lunar { font-size: 10.5px; color: var(--gold); letter-spacing: 1px; margin-top: 1px; }
.tm-weather { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 11px; color: var(--ink2); margin-top: 2px; }   /* 2026-10-08 11.5→11：给中间的鼎腾空间 */
.tm-weather svg { width: 24px; height: 24px; display: block; flex: none; }
.tm-weather span { white-space: nowrap; }
.tm-weather[data-act] { cursor: pointer; border-radius: 8px; }
.tm-weather[data-act]:active { opacity: .6; }   /* 2026-10-08：天气可点 → 切换城市 */
/* 印章风徽章（打卡进度） */
.badge-seal {
  margin-left: auto; flex: none; white-space: nowrap; cursor: pointer;
  background: var(--red); color: #FFF4E8;
  font-family: "MaShanZheng", var(--kai); font-size: 14.5px;
  border-radius: 9px; padding: 1px 11px 3px;
  transform: rotate(-4deg);
  box-shadow: 0 2px 7px rgba(163, 59, 42, .35);
  border: 1.5px solid #7E2A1D; outline: 1.5px solid var(--red); outline-offset: 2px;
}
.badge-seal small { font-size: 9.5px; opacity: .9; font-family: var(--sans); }
/* 每日一句 */
.daily-line {
  text-align: center; font-family: var(--serif); font-size: 13.5px; color: var(--gold);
  letter-spacing: 2px; padding: 14px 18px 0; cursor: pointer;
}
.w-sunspin { transform-origin: 16px 16px; animation: wspin 14s linear infinite, wglow 2.2s ease-in-out infinite; }
@keyframes wglow { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
.w-drop { animation: wfall 1.05s linear infinite; }
.w-drop.fast { animation-duration: .72s; }
.w-drop.torrent { animation-duration: .55s; }
.w-hail { animation: whail .9s linear infinite; }

const PhotoDB = {
  _db: null,
  open() {
    return new Promise(res => {
      if (PhotoDB._db) return res(PhotoDB._db);
      if (!window.indexedDB) return res(null);
      const rq = indexedDB.open("gbg_photos", 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore("photos"); };
      rq.onsuccess = () => { PhotoDB._db = rq.result; res(PhotoDB._db); };
      rq.onerror = () => res(null);
    });
  },
  async put(id, blob) {
    const db = await PhotoDB.open(); if (!db) return false;
    return new Promise(res => {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").put(blob, id);
      tx.oncomplete = () => res(true); tx.onerror = () => res(false);
    });
  },
  async del(id) {
    const db = await PhotoDB.open(); if (!db) return;
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").delete(id);
  },
  async keys() {
    const db = await PhotoDB.open(); if (!db) return [];
    return new Promise(res => {
      const rq = db.transaction("photos").objectStore("photos").getAllKeys();
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]);
    });
  },
  async get(id) {
    const db = await PhotoDB.open(); if (!db) return null;
    return new Promise(res => {
      const rq = db.transaction("photos").objectStore("photos").get(id);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
    });
  }
};

}
function downscaleImage(file, maxDim) {

      cv.width = w; cv.height = h;

  };

    const ns = Math.min(5, Math.max(1, st.s * f));
    const k = ns / st.s;
    st.x = focus.x - (focus.x - st.x) * k;

function dailyFive() {

function initCarousel() {
  stopCarousel();
  const box = document.getElementById("daily-carousel");
  if (!box) return;
  const track = box.querySelector(".banner-track");
  const dots = Array.prototype.slice.call(box.querySelectorAll(".banner-dot"));
  const real = +box.dataset.real || 1;
  let idx = 0, lock = false;
  const apply = animate => {
    track.style.transition = animate ? "transform .55s ease" : "none";
    track.style.transform = "translateX(" + (-idx * 100) + "%)";
    dots.forEach((d, i) => { d.className = "banner-dot" + (i === Math.min(idx, real - 1) ? " on" : ""); });
  };
  const wrapBack = () => {                      /* 滑进克隆件后瞬间跳回开头，视觉无缝 */
    lock = true;
    setTimeout(() => {
      lock = false;
      if (!document.body.contains(box)) return;
      track.style.transition = "none";
      idx = 0;
      track.style.transform = "translateX(0)";
      void track.offsetWidth;
    }, 620);
  };
  const restart = () => {
    stopCarousel();
    carTimer = setInterval(() => {
      if (document.hidden || lock) return;

      if (idx >= real) wrapBack();
    }, 5000);

  /* 手指拖动：跟手 + 松手吸附（右滑上一件、左滑下一件） */

    stopCarousel(); track.style.transition = "none";
  }, { passive: true });
  track.addEventListener("touchmove", e => {
    if (!dragging) return;
    dx = e.touches[0].clientX - sx;

function nameKey(s) {
  return (s || "").replace(/[（(].*?[）)]/g, "").replace(/[·\s・]/g, "").replace(/[省市区县]/g, "");
}
function rankLink(n) {
  const k = nameKey(n);
  const hit = (arr, keyFn) => arr.find(x => {
    const a = keyFn(x);
    return a === k || (k.length >= 4 && a.length >= 4 && (a.indexOf(k) >= 0 || k.indexOf(a) >= 0));
  });
  const g = hit(GD, x => nameKey(x.name));
  if (g) return "g/" + esc(g.name);
  const m = hit(MUSEUMS, x => nameKey(x.name));
  return m ? "m/" + esc(m.id) : "";
}

/* 开放时间：啰嗦的（两三行那种）精简成"每周X闭馆"；一行字的短文本不动；认不出就保留原文（宁缺毋错） */
function shortHours(h) {
  if (!h) return h;
  const t = String(h).replace(/\s+/g, " ").trim();
  if (t.length <= 24) return h;
  /* 多日写法：周一、周二闭馆 / 周一,周日 全天关闭 */
  const multi = t.match(/周([一二三四五六日天])[、和及，,]\s*周([一二三四五六日天])\s*(闭馆|全天关闭|不开放|全天不开放)/);
  if (multi) return "每周" + multi[1] + "、" + multi[2] + "闭馆";
  const days = [];
  const re = /周([一二三四五六日天])[^周；;，,。]{0,14}?(闭馆|关闭|不开放|不营业|休馆)/g;
  let m;
  while ((m = re.exec(t))) {
    const before = t.slice(Math.max(0, m.index - 1), m.index);
    const pre20 = t.slice(Math.max(0, m.index - 20), m.index);
    if (before === "至" || before === "-" || before === "～" || before === "~") continue;  /* "周一至周日 全天关闭"类：日期范围，不是每周规律 */
    /* "10/08 周四 不开放""5月7日 周四 不开放"类：一次性日期（但"1/1-12/31 周二"这种全年范围不算） */
    if (/(\d{1,2}月\d{1,2}日|\d{1,2}[\/]\d{1,2})\s*$/.test(pre20) &&
        !/\d{1,2}\s*[\/\-–~～至]\s*\d{1,2}/.test(pre20)) continue;
    if (new RegExp("周" + m[1] + "[，,；;]?(不闭馆|照常|正常开放|不休息)").test(t)) continue; /* "周一不闭馆"类：否定 */
    days.push(m[1] === "天" ? "日" : m[1]);
  }
  const uniq = [...new Set(days)].sort((a, b) => "一二三四五六日".indexOf(a) - "一二三四五六日".indexOf(b));
  if (!uniq.length) return h;
  return "每周" + uniq.join("、") + "闭馆";
}

/* 该馆最热文物（无建筑照/无照片时的兜底背景） */
function repArtifactOf(mid) {
  const arts = museumsArtifacts(mid);
  let best = null;
  arts.forEach(a => { if (a.hot > 0 && (!best || a.hot < best.hot)) best = a; });
  return best || arts[0] || null;
}
/* 印章背景：我的照片 > 建筑照 > 最热文物图 */
function stampBgURL(m) {
  if (userPhotos[m.id]) return userPhotos[m.id];
  const bld = MANIFEST["bld-" + m.id];
  if (bld) return "" + bld;
  const rep = repArtifactOf(m.id);
  return rep && MANIFEST[rep.id] ? "" + MANIFEST[rep.id] : "";
}
let stampsExpanded = false;
function stampCellHTML(m, v) {
  /* m = 42馆或定级馆的统一对象（定级馆带 .gd）；v = 打卡记录（null=未盖） */
  const isGd = !!m.gd;
  const goTarget = isGd ? "g/" + esc(m.name) : "m/" + esc(m.id);
  const short = isGd ? gdStampShort(m.gd) : (STAMP_NAMES[m.id] || m.name.slice(0, 3));
  if (v) {
    if (isGd) {
      const bg = userPhotos[m.id];
      if (bg) {
        return '<div class="stamp-cell on" data-go="' + goTarget + '">' +
          '<div class="stamp-photo"><img src="' + esc(bg) + '" alt="">' +
          '<span class="st-seal">' + esc(short) + '</span><span class="st-mine">我的照片</span></div>' +
          '<div class="st-name">' + esc(v.date) + (v.manual ? " · 补卡" : "") + "</div></div>";
      }
      return '<div class="stamp-cell on" data-go="' + goTarget + '">' +
        '<div class="stamp-seal">' + esc(short) + "</div>" +
        '<div class="st-name">' + esc(v.date) + (v.manual ? " · 补卡" : "") + "</div></div>";
    }
    const bg = stampBgURL(m);
    const mark = userPhotos[m.id] ? '<span class="st-mine">我的照片</span>' : "";
    return '<div class="stamp-cell on" data-go="' + goTarget + '">' +
      '<div class="stamp-photo">' +
      (bg ? '<img src="' + esc(bg) + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
      '<span class="st-seal">' + esc(short) + "</span>" + mark + "</div>" +
      '<div class="st-name">' + esc(v.date) + (v.manual ? " · 补卡" : "") + "</div></div>";
  }
  return '<div class="stamp-cell" data-go="' + goTarget + '">' +
    '<div class="stamp-seal">' + esc(short) + "</div>" +
    '<div class="st-name">' + esc(m.city || "") + "</div></div>";
}
function renderStamps() {
  const visMap = {};
  visited.forEach(v => { visMap[v.id] = v; });
  /* 已盖的排最前（按打卡先后），然后是42精选空位，最后是全国定级馆空位 */
  const stamped = visited.map(v => ({ v: v, m: anyMuseum(v.id) })).filter(x => x.m);
  const rest42 = MUSEUMS.filter(m => !visMap[m.id]).map(m => stampCellHTML(m, null));
  const restGd = GD.filter(g => !g.mid && !visMap["g:" + g.name]).map(g =>
    stampCellHTML({ id: "g:" + g.name, name: g.name, city: g.city, province: g.prov, gd: g }, null));
  const allCells = stamped.map(x => stampCellHTML(x.m, x.v)).concat(rest42, restGd);
  const shown = stampsExpanded ? allCells : allCells.slice(0, 6);
  const toggle = allCells.length > 6
    ? '<button class="mini-btn" data-act="stampexpand" style="display:flex;margin:10px auto 2px">' +
      (stampsExpanded ? "收起 ▴" : "展开全部 " + allCells.length + " 枚 ▾") + "</button>"
    : "";
  return '<div class="stamp-progress">到馆打卡得印章（可手动补卡）· 已盖的排在前面<br>42家精选馆 + 全国定级馆都能盖章 · 精选馆可以传自己拍的照片当印章背景</div>' +

function toggleFavA(id) {
  favA = favA.includes(id) ? favA.filter(x => x !== id) : favA.concat(id);
  saveFavs();
  const on = favA.includes(id);
  document.querySelectorAll('.float-btn.fav[data-act="favA"]').forEach(b => {
    b.classList.toggle("on", on); b.textContent = on ? "♥" : "♡";
  });
  toast(on ? "已收藏 ♥" : "已取消收藏");
}
function showModalHTML(inner) {
  closeModal();
  const el = document.createElement("div");
  el.className = "modal-mask";
  el.id = "gbgModal";
  el.innerHTML = '<div class="modal-card">' + inner + "</div>";
  el.addEventListener("click", ev => { if (ev.target === el) closeModal(); });
  document.body.appendChild(el);
}
function closeModal() {
  const el = document.getElementById("gbgModal");
  if (el) el.remove();
}
function showVisitModal(m, msg, canManual) {
  showModalHTML("<h4>" + esc(m.name) + "</h4><p>" + esc(msg) + "</p>" +
    '<div class="modal-btns">' +
    (canManual ? '<button class="btn btn-line" data-act="visit-manual" data-id="' + esc(m.id) + '">手动补卡</button>' : "") +
    '<button class="btn btn-red" data-act="modal-close">' + (canManual ? "下次再来" : "知道了") + "</button></div>");
}
function modalCancelVisit(m) {
  showModalHTML("<h4>" + esc(m.name) + "</h4><p>要取消在这里的打卡吗？</p>" +
    '<div class="modal-btns">' +
    '<button class="btn btn-line" data-act="visit-undo" data-id="' + esc(m.id) + '">取消打卡</button>' +
    '<button class="btn btn-red" data-act="modal-close">保留</button></div>');
}
function doVisitCheck(m, opts) {
  if (visited.some(v => v.id === m.id)) return;
  const gps = !!(opts && opts.gps);
  visited.push({ id: m.id, date: todayStr(), gps: gps, manual: !gps });
  LS.set("gbg_visited", visited);
  const btn = view.querySelector('.btn[data-act="visit"]');
  if (btn) { btn.classList.add("on"); btn.innerHTML = "✓ 已打卡"; }
  const label = m.gd ? gdStampShort(m.gd) : stampName(m.id);
  toast("打卡成功 ✓ 获得印章「" + label + "」");
  render();   /* 刷新页面：让"上传打卡照片"等打卡后才出现的按钮即时现身 */
}
function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLon = toR(lon2 - lon1);
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.sqrt(a));
}
function fmtDist(d) { return d < 1000 ? Math.round(d) + "米" : (d / 1000).toFixed(1) + "公里"; }
function tryVisitGPS(m) {
  if (!navigator.geolocation) { showVisitModal(m, "这个浏览器不支持定位，可以手动补卡。", true); return; }
  if (!window.isSecureContext) {
    showVisitModal(m, "当前不是 https 环境，定位用不了（发布上线后就能自动定位打卡）。", true);
    return;
  }
  toast("正在定位…");
  navigator.geolocation.getCurrentPosition(
    pos => {
      const dist = distanceM(pos.coords.latitude, pos.coords.longitude, m.coord[1], m.coord[0]);
      if (dist <= 2000) {
        doVisitCheck(m, { gps: true });
        toast("打卡成功 ✓ 离馆门约 " + fmtDist(dist));
      } else {
        showVisitModal(m, "你离「" + m.name + "」还有约 " + fmtDist(dist) + "，到了博物馆附近再打卡哦～", true);
      }
    },
    err => {
      const why = err.code === 1 ? "定位权限被拒绝了" : err.code === 3 ? "定位超时了" : "定位失败了";
      showVisitModal(m, why + "，可以手动补卡。", true);
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

/* ================= 路由 ================= */
let lastTab = "home";
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const seg = h.split("/");
  return { page: seg[0] || "home", id: seg[1] ? decodeURIComponent(seg[1]) : "" };
}
function go(page, id) {
  const target = "#/" + page + (id ? "/" + encodeURIComponent(id) : "");
  if (location.hash === target) render();
  else location.hash = target;
}
function render() {
  TTS.stop(); resetTts();
  stopCarousel();                     /* 2026-10-08 离开页面即停掉每日五宝轮播 */
  const r = parseHash();
  const isDetail = r.page === "m" || r.page === "a";
  document.body.classList.toggle("detail", isDetail);
  const tabOfPage = { home: "home", explore: "explore", relics: "relics", shows: "shows", mine: "mine", topics: "relics", t: "relics", timeline: "relics", textbook: "relics", g: "explore", mystamp: "mine", myprov: "mine", myvisit: "mine", myfavm: "mine", myfava: "mine" };
  if (tabOfPage[r.page]) lastTab = tabOfPage[r.page];
  const active = isDetail ? lastTab : tabOfPage[r.page] || lastTab;
  document.querySelectorAll("#tabbar a").forEach(t =>
    t.classList.toggle("active", t.dataset.nav === active));
  window.scrollTo(0, 0);
  if (r.page === "home") renderHome();
  else if (r.page === "explore") renderExplore();
  else if (r.page === "relics") renderRelics();
  else if (r.page === "mine") renderMine();
  else if (r.page === "mystamp") renderMyStamps();
  else if (r.page === "myprov") renderMyProv();
  else if (r.page === "myvisit") renderMyVisits();
  else if (r.page === "myfavm") renderMyFavM();
  else if (r.page === "myfava") renderMyFavA();
  else if (r.page === "topics") renderTopics();
  else if (r.page === "timeline") renderTimeline();
  else if (r.page === "textbook") renderTextbook();
  else if (r.page === "g") { const g = GD.find(x => x.name === r.id); g ? renderGD(g) : go("explore"); }
  else if (r.page === "shows") renderShows();
  else if (r.page === "t") { const t = TOPICS.find(x => x.id === r.id); t ? renderTopic(t) : go("relics"); }
  else if (r.page === "m") { const m = museumById(r.id); m ? renderMuseum(m) : go("home"); }
  else if (r.page === "a") { const a = artifactById(r.id); a ? renderArtifact(a) : go("home"); }
  else go("home");
}
window.addEventListener("hashchange", render);

/* ================= 全局事件 ================= */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { go(nav.dataset.nav); return; }
  const goEl = e.target.closest("[data-go]");
  if (goEl) { const s = goEl.dataset.go.split("/"); go(s[0], s[1]); return; }
  const pm = e.target.closest("[data-provmap]");
  if (pm) {
    const prov = pm.dataset.provmap;
    if (GD.some(g => g.prov === prov)) { exploreProv = prov; exploreLv = "定级"; exploreExpand = false; go("explore"); }
    else if (MUSEUMS.some(m => m.province === prov)) { exploreProv = prov; exploreLv = "精选"; exploreExpand = false; go("explore"); }
    else toast("暂未收录「" + prov + "」的博物馆，后续慢慢补");
    return;
  }
  const act = e.target.closest("[data-act]");
  if (act) {
    const id = act.dataset.id;
    const kind = act.dataset.act;
    if (kind === "back") {
      if (history.length > 1) history.back();
      else go(act.dataset.fb || "home");
    }
    else if (kind === "favM") toggleFavM(id);
    else if (kind === "favA") toggleFavA(id);
    else if (kind === "favG") toggleFavG(id);
    else if (kind === "visit") {
      const mm = anyMuseum(id);
      if (!mm) return;
      if (visited.some(v => v.id === id)) modalCancelVisit(mm);
      else tryVisitGPS(mm);
    }
    else if (kind === "visit-manual") {
      const mm = anyMuseum(id);
      if (mm) { doVisitCheck(mm, { manual: true }); closeModal(); }
    }
    else if (kind === "visit-undo") {
      visited = visited.filter(v => v.id !== id);
      LS.set("gbg_visited", visited);
      closeModal();
      render();
    }
    else if (kind === "modal-close") closeModal();
    else if (kind === "photo-upload") pickPhoto(id);
    else if (kind === "photo-del") {
      if (confirm("删除这张打卡照片吗？（印章背景会恢复默认）")) removePhoto(id);
    }
    else if (kind === "map-zoomin" || kind === "map-zoomout" || kind === "map-reset") {
      const svg = document.getElementById("cnmap");
      if (svg && svg._zoomBy) {
        const vb = svg.viewBox.baseVal;
        if (kind === "map-reset") svg._reset();
        else svg._zoomBy(kind === "map-zoomin" ? 1.35 : 0.74, { x: vb.width / 2, y: vb.height / 2 });
      }
    }
    else if (kind === "tts") {
      const item = act.dataset.kind === "a" ? artifactById(id) : museumById(id);
      if (item) speakText(act, act.dataset.kind === "a" ? artifactSpeech(item) : museumSpeech(item));
    }
    else if (kind === "reshuffle") nextBatch();
    else if (kind === "expand") { exploreExpand = !exploreExpand; renderExplore(); }
    else if (kind === "pickcity") openCityModal();
    else if (kind === "setcity") {
      const c = act.dataset.city || "";
      LS.set("gbg_city", c ? { city: c, prov: act.dataset.prov || "" } : null);
      closeModal();
      if (!c) requestGps(true);                            /* 切回自动定位 → 立刻用 GPS 定一次（比网络定位准） */
      fetchWeather(true);                                  /* 天气跟着换城市 */
      paintCityZone();
    }
    else if (kind === "cityall") {
      const c = act.dataset.city || "";
      if (c) { explorePreQ = c; }                           /* 有城市 → 找馆页直接搜这个城市 */
      else { exploreProv = act.dataset.prov || "全部"; exploreLv = "定级"; exploreExpand = false; }
      go("explore");
    }
    else if (kind === "stampexpand") { stampsExpanded = !stampsExpanded; render(); }
    else if (kind === "settings") openSettings();
    else if (kind === "about") openAbout();
    else if (kind === "nextquote") {
      quoteOffset++;
      const q = view.querySelector("[data-act='nextquote']");
      if (q) q.textContent = "❖ " + currentQuote() + " ❖";
    }
    else if (kind === "hotall") { relicCat = "网红榜"; relicQ = ""; go("relics"); }
    else if (kind === "unvisit") {
      visited = visited.filter(v => v.id !== id);
      LS.set("gbg_visited", visited); render();
    } else if (kind === "clear") {
      if (confirm("确定清空收藏和打卡记录吗？清空后无法恢复。")) {
        favM = []; favA = []; favG = []; visited = []; saveFavs(); LS.set("gbg_fav_g", favG);
        LS.set("gbg_visited", visited); closeModal(); render();
        toast("已清空");
      }
    }
    return;
  }
  const prov = e.target.closest("[data-prov]");
  if (prov) { exploreProv = prov.dataset.prov; exploreExpand = false; renderExplore(); return; }
  const lv = e.target.closest("[data-lv]");
  if (lv) { const v = lv.dataset.lv; exploreLv = isNaN(+v) ? v : +v; exploreExpand = false; renderExplore(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat) { relicCat = cat.dataset.cat; renderRelics(); return; }
});
window.addEventListener("scroll", () => {
  topbar.classList.toggle("scrolled", window.scrollY > 10);
}, { passive: true });

window.resetDemo = function () { window.demoStore={}; favM=[]; favA=[]; favG=[]; visited=[]; location.hash="#/home"; render(); };
/* ================= 启动 ================= */
(function init() {
  if (!MUSEUMS.length || !ARTIFACTS.length) {
    document.body.classList.remove("detail");
    view.innerHTML = '<div class="empty" style="padding-top:90px">' +
      '<span class="big">!</span>数据文件没有加载成功<br><br>' +
      "请确认「逛博馆」是<b>整个文件夹</b>一起打开的<br>" +
      "（不要只把 逛博馆.html 拖出来单独打开）</div>";
    return;
  }
  TTS.init();
  paintTopMeta();
  /* requestGps(); 2026-10-08：优先 GPS（网络定位中小城市会偏到省会，如新余→南昌）；GPS 回来会自动重取天气 */
  if (autoPos()) fetchWeather();
  else setTimeout(function () {          /* 完全无定位：GPS 8秒没回来（如权限弹窗挂着）→ 网络定位兜底 */
    if (!Weather.data && !autoPos()) fetchWeather(true);
  }, 8500);
  setInterval(paintTopMeta, 20000);
  setInterval(function () { fetchWeather(); }, 30 * 60 * 1000);
  /* 切回页面/窗口时主动刷新：后台标签页的定时器会被浏览器冻结，不刷新的话天气会一直是切走前那会儿的 */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { requestGps(); fetchWeather(); paintTopMeta(); }
  });
  window.addEventListener("focus", function () { fetchWeather(); });
  if (!location.hash) location.hash = "#/home";
  render();
  Promise.resolve().then(() => {
    const r = parseHash();
    if (r.page === "mine" || r.page === "mystamp") render();
  });
})();

})();
</script></body></html>
