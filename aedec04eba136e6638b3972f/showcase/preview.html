<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学测试</title><style>:root{
  --primary:#7c4dff; --primary-dark:#5e35d6;
  --success:#2ecc71; --success-bg:#e3fbe9;
  --danger:#ff5e7e; --danger-bg:#ffe6ec;
  --bg:#eaf3ff; --card:#fff;
  --text:#3a2e4d; --muted:#9b8fb0;
  --border:#ffe1c2; --radius:22px;
  --pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"YouYuan","Yuanti SC","Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--bg);background-image:radial-gradient(rgba(124,77,255,.075) 1.6px,transparent 1.7px),radial-gradient(circle at 12% 10%,#fff4d6 0,transparent 22%),radial-gradient(circle at 88% 8%,#ffe1f0 0,transparent 22%),radial-gradient(circle at 78% 90%,#d9f3ff 0,transparent 24%);background-size:24px 24px,auto,auto,auto;background-repeat:repeat,no-repeat,no-repeat,no-repeat;color:var(--text);line-height:1.7;-webkit-text-size-adjust:100%}
.page-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.page-bg .p-blob{position:absolute;border-radius:50%;opacity:.38;filter:blur(1.5px);animation:pfloat 9s ease-in-out infinite}
.page-bg .pb1{width:150px;height:150px;background:#ffd23f;top:16%;left:4%}
.page-bg .pb2{width:110px;height:110px;background:#ff8ab8;top:52%;right:5%;animation-duration:11s;animation-delay:1.2s}
.page-bg .pb3{width:84px;height:84px;background:#5bd6c6;bottom:12%;left:10%;animation-duration:8s;animation-delay:.6s}
.page-bg .pb4{width:120px;height:120px;background:#8be0ff;top:8%;right:12%;animation-duration:10s;animation-delay:1.8s}
.page-bg .p-star{position:absolute;font-style:normal;animation:ptwinkle 3.2s ease-in-out infinite}
.page-bg .ps1{top:34%;left:16%;font-size:20px;color:#ffb84d}
.page-bg .ps2{top:66%;right:22%;font-size:16px;color:#b48bff;animation-delay:.9s}
.page-bg .ps3{top:22%;right:34%;font-size:14px;color:#ff8ab8;animation-delay:1.6s}
@keyframes pfloat{50%{transform:translateY(-20px)}}
@keyframes ptwinkle{50%{opacity:.3;transform:scale(.7) rotate(20deg)}}

.app-header{background:linear-gradient(135deg,#ffb84d,#ff7eb6 55%,#7c5cff);color:#fff;padding:26px 18px;text-align:center;box-shadow:0 6px 0 rgba(124,77,255,.18);border-bottom:5px solid #fff}
.app-header.sub{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;text-align:left;background:linear-gradient(135deg,#7c5cff,#5bb6ff)}
.app-header h1{font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.h-logo{width:30px;height:30px;border-radius:9px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.subtitle{font-size:14px;opacity:.95;margin-top:6px;font-weight:600}
.back-btn{background:#fff;color:var(--primary);border:3px solid #fff;border-radius:12px;padding:6px 14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.quiz-title{font-size:16px;font-weight:800;flex:1;text-align:center;padding:0 8px}
.timer{font-size:15px;font-weight:800;background:#fff;color:var(--primary);border-radius:12px;padding:4px 12px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.container{max-width:720px;margin:0 auto;padding:20px 14px 96px}
.section-title{font-size:18px;font-weight:800;margin:20px 0 12px;color:var(--text);display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:10px;height:22px;background:linear-gradient(var(--primary),#ff7eb6);border-radius:6px}
.hint{color:var(--muted);font-size:14px;text-align:center;padding:30px 0;font-weight:600}
.grade-tabs{display:flex;gap:16px;justify-content:center;margin-top:6px}
.stage-tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 10px 16px;border:4px solid #fff;border-radius:26px;color:#fff;cursor:pointer;transition:transform .25s var(--pop),box-shadow .25s var(--pop);box-shadow:0 7px 0 rgba(0,0,0,.14)}
.stage-emoji{width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);border-radius:16px;margin-bottom:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.stage-emoji .ico{width:28px;height:28px;stroke-width:2.6}
.stage-name{font-size:20px;font-weight:800;letter-spacing:3px}
.stage-desc{font-size:13px;opacity:.95;font-weight:600}
.stage-primary{background:linear-gradient(135deg,#ffb84d,#ff8a4d)}
.stage-junior{background:linear-gradient(135deg,#5bb6ff,#7c5cff)}
.stage-tab:hover{transform:translateY(-4px) rotate(-1deg)}
.stage-tab:active{transform:translateY(2px) scale(.97);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.stage-tab.active{transform:translateY(-4px);box-shadow:0 9px 0 rgba(0,0,0,.16)}
.stage-primary.active{outline:4px dashed #ffd23f;outline-offset:4px}
.stage-junior.active{outline:4px dashed #8be0ff;outline-offset:4px}

.features{display:flex;flex-direction:column;gap:12px;margin:6px 0 14px}
.feature{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid #fff;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 rgba(124,77,255,.1)}
.f-ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px;flex-shrink:0;border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.f-ico.t-target{color:#ff7e5f;background:#fff0ea}
.f-ico.t-bolt{color:#f5a623;background:#fff6e5}
.f-ico.t-cloud{color:#2fb9a3;background:#e6f7f2}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
.f-text{display:flex;flex-direction:column}
.f-text b{font-size:15px;color:var(--text)}
.f-text span{font-size:12px;color:var(--muted)}
.level-tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#levelTabs .tab{flex:0 1 auto;min-width:84px}
.tab{flex:1;max-width:160px;padding:13px;border:3px solid var(--border);background:#fff;border-radius:16px;font-size:16px;font-weight:800;color:var(--muted);cursor:pointer;transition:.2s var(--pop)}
.tab:hover{transform:translateY(-3px);color:var(--primary)}
.tab.active{border-color:var(--primary);color:#fff;background:linear-gradient(135deg,#7c5cff,#9b6cff);box-shadow:0 5px 0 rgba(124,77,255,.25)}
.mode-cards{display:flex;gap:14px;flex-wrap:wrap}
.mode-card{flex:1;min-width:140px;background:#fff;border:3px solid var(--border);border-radius:22px;padding:18px;text-align:center;cursor:pointer;transition:.22s var(--pop);box-shadow:0 6px 0 rgba(124,77,255,.1)}
.mode-card:hover{transform:translateY(-5px) rotate(1deg)}
.mode-card.active{border-color:var(--primary);background:linear-gradient(160deg,#f3eeff,#fff);box-shadow:0 8px 0 rgba(124,77,255,.2)}
.mode-icon{width:60px;height:60px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:18px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.mode-icon .ico{width:30px;height:30px;stroke-width:2.6}
.mode-icon.mi-practice{color:#ff8a5c;background:#fff0ea}
.mode-icon.mi-test{color:#6b7ff0;background:#eef0ff}
.mode-name{font-weight:800;font-size:17px;margin:6px 0 4px}
.mode-desc{font-size:12px;color:var(--muted)}
.chapter{margin-bottom:16px}
.chapter-name{font-size:15px;font-weight:800;color:var(--text);margin-bottom:10px;padding-left:12px;border-left:5px solid #ffb84d;border-radius:3px}
.topic-chips{display:flex;flex-wrap:wrap;gap:12px}
.topic-chip{background:#fff;border:3px solid var(--border);border-radius:16px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s var(--pop);box-shadow:0 4px 0 rgba(124,77,255,.08)}
.topic-chip:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-4px) rotate(-1deg);box-shadow:0 7px 0 rgba(124,77,255,.18)}
.topic-chip:active{transform:translateY(0) scale(.97);box-shadow:0 2px 0 rgba(124,77,255,.18)}
.qcount{font-size:12px;color:var(--primary);background:#eef5ff;border:2px solid #e3d4ff;padding:1px 8px;border-radius:8px;font-weight:800}
.q-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;border:3px solid #fff;box-shadow:0 6px 0 rgba(124,77,255,.1)}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.q-num{width:28px;height:28px;background:var(--primary);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;box-shadow:0 3px 0 rgba(124,77,255,.3)}
.q-type{font-size:12px;color:var(--primary);background:#f1ebff;padding:2px 10px;border-radius:8px;font-weight:700}
.q-stem{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:14px;color:var(--text)}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:3px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.18s var(--pop);background:#fff;font-weight:600}
.opt:hover{border-color:var(--primary);transform:translateX(4px)}
.opt input{width:20px;height:20px;accent-color:var(--primary)}
.opt.correct{background:var(--success-bg);border-color:var(--success)}
.opt.wrong{background:var(--danger-bg);border-color:var(--danger)}
.fill-input{width:100%;padding:13px 14px;border:3px solid var(--border);border-radius:14px;font-size:16px;outline:none;font-family:inherit;font-weight:600}
.fill-input:focus{border-color:var(--primary)}
.fill-input.correct{border-color:var(--success);background:var(--success-bg)}
.fill-input.wrong{border-color:var(--danger);background:var(--danger-bg)}
.q-feedback{margin-top:10px;font-size:14px}
.q-feedback.ok{color:var(--success)}
.q-feedback.no{color:var(--danger)}
.explain{margin-top:6px;font-size:13px;color:var(--muted);background:#fff7e6;border:2px dashed #ffd8a8;border-radius:12px;padding:10px 12px;line-height:1.6}
.quiz-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:4px solid var(--primary);padding:14px 16px;display:flex;justify-content:center;z-index:10}
.btn-primary{background:var(--primary);color:#fff;border:3px solid var(--primary-dark);border-radius:14px;padding:13px 30px;font-size:17px;font-weight:800;cursor:pointer;width:100%;max-width:680px;box-shadow:0 5px 0 var(--primary-dark);transition:.12s}
.btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-dark)}
.score-card{background:#fff;border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:16px;border:3px solid #fff;box-shadow:0 6px 0 rgba(124,77,255,.1)}
.score-circle{width:130px;height:130px;border-radius:50%;margin:0 auto 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.12)}
.score-circle.pass{background:linear-gradient(135deg,#2ecc71,#7be38f)}
.score-circle.fail{background:linear-gradient(135deg,#ff5e7e,#ff95a8)}
.score-num{font-size:34px;line-height:1}
.score-sub{font-size:13px;opacity:.95;margin-top:4px}
.score-meta{font-size:13px;color:var(--muted)}
.result-actions{margin:14px 0}
.review-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;border:3px solid var(--border);border-left:6px solid var(--border)}
.review-card.rc-ok{border-left-color:var(--success)}
.review-card.rc-no{border-left-color:var(--danger)}
.rc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rc-num{font-weight:800;color:var(--muted)}
.rc-stem{font-size:15px;font-weight:700;margin-bottom:8px}
.rc-line{font-size:14px;margin-bottom:3px;font-weight:600}
.rc-line .bad{color:var(--danger)}
.rc-line .good{color:var(--success)}
.rc-explain{font-size:13px;color:var(--muted);background:#fff7e6;border:2px dashed #ffd8a8;border-radius:12px;padding:8px 10px;margin-top:6px}
/* 登录条 + 弹窗 */
.auth-bar{background:#fff;border-bottom:3px solid var(--border)}
.auth-area{display:flex;align-items:center;gap:10px;justify-content:flex-end;max-width:720px;margin:0 auto;padding:8px 14px}
.auth-user{font-size:13px;color:var(--text);font-weight:700}
.auth-link{color:var(--primary);font-size:13px;cursor:pointer;text-decoration:none;font-weight:700}
.auth-btn{background:var(--primary);color:#fff;border:3px solid var(--primary-dark);border-radius:12px;padding:7px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--primary-dark)}
.auth-mask{position:fixed;inset:0;background:radial-gradient(circle at 18% 18%,rgba(139,92,246,.55) 0,transparent 45%),radial-gradient(circle at 82% 82%,rgba(236,72,153,.5) 0,transparent 45%),rgba(58,46,77,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow:hidden}
.auth-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.auth-bg .blob{position:absolute;border-radius:50%;opacity:.4;filter:blur(.5px)}
.auth-bg .b1{width:130px;height:130px;background:#ffd23f;top:10%;left:10%;animation:floaty 6s ease-in-out infinite}
.auth-bg .b2{width:90px;height:90px;background:#ff8ab8;bottom:14%;right:12%;animation:floaty 7s ease-in-out infinite .8s}
.auth-bg .b3{width:70px;height:70px;background:#5bd6c6;top:20%;right:16%;animation:floaty 5.5s ease-in-out infinite .4s}
.auth-bg .b4{width:100px;height:100px;background:#8be0ff;bottom:10%;left:14%;animation:floaty 6.5s ease-in-out infinite 1.2s}
.auth-bg .star{position:absolute;color:#fff;font-style:normal;text-shadow:0 0 8px rgba(255,255,255,.8);animation:twinkle 2.4s ease-in-out infinite}
.auth-bg .s1{top:14%;right:26%;font-size:18px}
.auth-bg .s2{top:26%;left:26%;font-size:14px;animation-delay:.6s}
.auth-bg .s3{bottom:22%;right:30%;font-size:16px;animation-delay:1.1s}
@keyframes floaty{50%{transform:translateY(-16px)}}
@keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
.auth-modal{background:#fff;border:4px solid #fff;border-radius:26px;width:100%;max-width:350px;padding:26px 22px 22px;position:relative;z-index:1;overflow:hidden;box-shadow:0 10px 0 rgba(124,77,255,.22);animation:authPop .35s var(--pop)}
.auth-modal::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,#ffb84d,#ff7eb6,#7c5cff,#5bb6ff)}
.auth-modal>*{position:relative;z-index:1}
@keyframes authPop{0%{transform:scale(.8) rotate(-3deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.auth-close{position:absolute;right:12px;top:8px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1;transition:.15s}
.auth-close:hover{color:var(--primary);transform:rotate(90deg)}
.auth-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:14px;background:linear-gradient(135deg,#ffe4f1,#e7e9ff);border:3px solid #ffd0e8;border-radius:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 rgba(124,77,255,.08)}
.auth-badge{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:31px;background:linear-gradient(135deg,#fff7d6,#ffe9f2);border-radius:16px;border:3px solid #fff;box-shadow:0 4px 0 rgba(255,138,180,.28)}
.auth-headtext{display:flex;flex-direction:column}
.auth-title{font-size:20px;font-weight:800;color:var(--text)}
.auth-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.auth-tabs{display:flex;gap:8px;margin-bottom:14px}
.auth-tabs button{flex:1;padding:9px;border:3px solid var(--border);background:#fff;border-radius:12px;cursor:pointer;font-size:14px;font-weight:700;transition:.15s;color:var(--muted)}
.auth-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary-dark);box-shadow:0 4px 0 var(--primary-dark)}
.auth-guide{font-size:12px;color:var(--primary);background:#f3eeff;border:2px dashed #cdbfff;border-radius:12px;padding:8px 10px;margin-bottom:12px;font-weight:700;text-align:center}
.auth-field{display:block;margin-bottom:11px}
.af-label{display:block;font-size:13px;font-weight:800;color:var(--text);margin-bottom:5px}
.auth-pane input{width:100%;padding:11px 12px;border:3px solid var(--border);border-radius:12px;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit;background:#fff;transition:border-color .15s,box-shadow .15s}
.auth-pane input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,77,255,.12)}
.auth-pane button.auth-submit{width:100%;background:var(--primary);color:#fff;border:3px solid var(--primary-dark);border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--primary-dark);transition:.12s;margin-top:2px}
.auth-pane button.auth-submit:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dark)}
.auth-pane button.auth-send{width:100%;background:#fff7e6;color:#e8862b;border:3px solid #ffd8a8;border-radius:12px;padding:11px;font-size:14px;cursor:pointer;margin-bottom:11px;font-weight:800;transition:.12s}
.auth-pane button.auth-send:active{transform:translateY(2px)}
.auth-pane button.auth-send.counting,.auth-pane button.auth-send:disabled{background:#f1f1f6;color:var(--muted);border-color:#e6e2ee;cursor:not-allowed;box-shadow:none}
.auth-msg{font-size:13px;margin-top:6px;min-height:18px;font-weight:700}
.auth-msg.err{color:var(--danger)}
.auth-msg.ok{color:var(--success)}

/* 账号设置页 */
.form-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:8px;border:3px solid #fff;box-shadow:0 6px 0 rgba(124,77,255,.1)}
.acct-line{font-size:15px;font-weight:600}
.acct-line span{color:var(--primary);font-weight:800}
.form-card input{width:100%;padding:11px 12px;border:3px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:10px;outline:none;box-sizing:border-box;font-family:inherit}
.form-card input:focus{border-color:var(--primary)}
.primary-btn{width:100%;background:var(--primary);color:#fff;border:3px solid var(--primary-dark);border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--primary-dark);transition:.12s}
.primary-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dark)}
.ghost-btn{width:100%;background:#fff;color:var(--text);border:3px solid var(--border);border-radius:12px;padding:11px;font-size:14px;cursor:pointer;margin-bottom:10px;font-weight:700;transition:.12s}
.ghost-btn:active{transform:translateY(3px)}
.danger-btn{width:100%;background:var(--danger);color:#fff;border:3px solid #d63a5c;border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #d63a5c}
.form-msg{font-size:13px;margin-top:6px;min-height:18px}
.form-msg.err{color:var(--danger)}
.form-msg.ok{color:var(--success)}
.warn-text{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.7;font-weight:600}

/* 首页分享入口 */
.share-section{margin-top:18px}
.share-card{background:linear-gradient(135deg,#fff4d6,#ffe1f0);border:3px solid #fff;border-radius:20px;padding:18px;box-shadow:0 6px 0 rgba(255,126,182,.18)}
.share-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.share-title .sh-ico{width:18px;height:18px;color:var(--primary)}
.share-link{font-size:12px;color:var(--primary);background:#fff;border:3px solid #ffd8a8;border-radius:12px;padding:9px 11px;word-break:break-all;margin-bottom:10px;font-weight:600}
.share-btns{display:flex;gap:10px}
.share-btns .ghost-btn,.share-btns .primary-btn{margin-bottom:0}

/* 答题弹窗 + 分数弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(58,46,77,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-box{background:#fff;border:4px solid #fff;border-radius:24px;padding:22px;box-shadow:0 12px 0 rgba(124,77,255,.2);animation:pop .25s var(--pop)}
@keyframes pop{from{transform:scale(.8) rotate(-2deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.q-modal{width:min(92vw,460px)}
.q-progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:700}
.q-shape{display:flex;justify-content:center;align-items:center;margin:2px 0 14px}
.q-shape svg{width:172px;max-width:60vw;height:auto;filter:drop-shadow(0 8px 12px rgba(124,77,255,.25))}
.q-stem{font-size:18px;font-weight:800;line-height:1.6;margin-bottom:14px;color:var(--text)}

// 通用工具：学段配置、参数解析、数据加载、答案判分
const GRADE_FILES = {
  xiaoxue: 'resource/data/xiaoxue.json',
  chuzhong: 'resource/data/chuzhong.json'
};

function getParam(name) {
  return new URLSearchParams(location.hash.split('?')[1] || '').get(name);
}

function normalizeAnswer(s) {
  if (s === null || s === undefined) return '';
  return String(s).trim().replace(/\s+/g, '').toLowerCase();
}

async function loadGradeData(grade) { return grade === 'xiaoxue' ? primary : junior; }

function findGrade(data, levelId) {
  return data.grades.find(g => g.id === levelId) || null;
}

// 按年级定位知识点：先找年级，再在该年级的章节里找 topic
function findTopic(data, levelId, topicId) {
  const grade = findGrade(data, levelId);
  if (!grade) return null;
  for (const ch of grade.chapters) {
    const t = ch.topics.find(t => t.id === topicId);
    if (t) return { ...t, chapterName: ch.name, gradeName: grade.name };
  }
  return null;
}

// 判分：choice 支持单选(answer=索引) 与多选(answer=索引数组)；fill 支持多个可接受答案
function isCorrect(q, userAns) {
  if (q.type === 'choice') {
    if (q.multiple) {
      if (!Array.isArray(userAns) || userAns.length !== q.answer.length) return false;
      const a = [...userAns].map(Number).sort();
      const b = [...q.answer].sort();
      return a.every((v, i) => v === b[i]);
    }
    return userAns !== null && userAns !== undefined && userAns !== '' && Number(userAns) === q.answer;
  } else {
    const accepted = Array.isArray(q.answer) ? q.answer : [q.answer];
    const u = normalizeAnswer(userAns);
    return accepted.some(a => normalizeAnswer(a) === u);
  }
}

function formatUserAnswer(q, ua) {
  if (ua === null || ua === undefined || ua === '') return '（未作答）';
  if (q.type === 'choice') {
    if (q.multiple) return (ua || []).map(i => q.options[i]).join('、');
    return q.options[ua];
  }
  return ua;
}

function formatRight(q) {
  if (q.type === 'choice') {
    if (q.multiple) return q.answer.map(i => q.options[i]).join('、');
    return q.options[q.answer];
  }
  return Array.isArray(q.answer) ? q.answer.join(' / ') : q.answer;
}

function navigate(target){ const params = new URLSearchParams(target.split('?')[1]); const grade=params.get('grade'), level=params.get('level'), topic=params.get('topic'); const data=grade==='xiaoxue'?primary:junior; const t=findTopic(data,level,topic); const q=t.questions[0]; const div=document.createElement('div'); div.className='modal-mask'; div.style.display='flex'; div.innerHTML=`<div class="modal-box q-modal"><div class="q-progress">示例题 · ${t.name}</div><div class="q-stem"></div><div class="q-body"></div><div class="q-feedback" style="display:none"></div><div class="q-actions"><button class="primary-btn">确认答案</button><button class="ghost-btn">返回</button></div></div>`; div.querySelector('.q-stem').textContent=q.stem; const body=div.querySelector('.q-body'); if(q.type==='choice') q.options.forEach((v,i)=>{const label=document.createElement('label');label.className='opt';const input=document.createElement('input'); input.type=q.multiple?'checkbox':'radio';input.name='sample';input.value=i; label.append(input,document.createTextNode(v));body.append(label)});else body.innerHTML='<input class="fill-input" placeholder="请输入答案">'; div.querySelector('.primary-btn').onclick=()=>{let answer=q.type==='choice'?(q.multiple?[...body.querySelectorAll('input:checked')].map(x=>Number(x.value)):(body.querySelector('input:checked')?Number(body.querySelector('input:checked').value):null)):body.querySelector('input').value; const fb=div.querySelector('.q-feedback');fb.style.display='block';fb.textContent=(isCorrect(q,answer)?'✅ 回答正确：':'❌ 回答错误：')+q.explain};div.querySelector('.ghost-btn').onclick=()=>div.remove();document.body.append(div);}

const state = { grade: null, level: null, mode: null, data: null };

const gradeTabs = document.getElementById('gradeTabs');

function renderGradeTabs() {
  const grades = [
    { key: 'xiaoxue', name: '小学', icon: ICON_PENCIL, desc: '1-6 年级', cls: 'stage-primary' },
    { key: 'chuzhong', name: '初中', icon: ICON_ROCKET, desc: '7-9 年级', cls: 'stage-junior' }
  ];
  gradeTabs.innerHTML = grades.map(g =>
    `<button class="stage-tab ${g.cls} ${state.grade === g.key ? 'active' : ''}" data-grade="${g.key}">
      <span class="stage-emoji">${g.icon}</span>
      <span class="stage-name">${g.name}</span>
      <span class="stage-desc">${g.desc}</span>
    </button>`
  ).join('');
  gradeTabs.querySelectorAll('.stage-tab').forEach(b => {
    b.addEventListener('click', async () => {
      state.grade = b.dataset.grade;
      state.level = null;
      state.data = null;
      renderGradeTabs();
      updateSummary();
      await loadAndRenderLevels();
      renderTopics();
    });
  });
}

async function loadAndRenderLevels() {
  if (!state.grade) { levelSection.style.display = 'none'; return; }
  if (!state.data) {
    try {
      state.data = await loadGradeData(state.grade);
    } catch (e) {
      levelTabs.innerHTML = '<p class="hint">题库加载失败，请通过本地服务器打开本页面。</p>';
      return;
    }
  }
  levelSection.style.display = 'block';
  updateSummary();
  levelTabs.innerHTML = state.data.grades.map(g =>
    `<button class="tab ${state.level === g.id ? 'active' : ''}" data-level="${g.id}">${g.name}</button>`
  ).join('');
  levelTabs.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => {
      state.level = b.dataset.level;
      renderLevelsActive();
      updateSummary();
      renderTopics();
    });
  });
}

function renderLevelsActive() {
  levelTabs.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.level === state.level));
}

// 选择路径摘要条：小学 › 一年级 › 练习模式
function updateSummary() {
  const path = [];
  if (state.grade) path.push(state.grade === 'xiaoxue' ? '小学' : '初中');
  if (state.level && state.data) {
    const lv = findGrade(state.data, state.level);
    if (lv) path.push(lv.name);
  }
  if (state.mode) path.push(state.mode === 'practice' ? '练习模式' : '测试模式');
  const el = document.getElementById('selSummary');
  if (!path.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<div class="sel-path">' + path.map((p, i) =>
    `<span class="sel-item${i === path.length - 1 ? ' on' : ''}">${p}</span>` +
    (i < path.length - 1 ? '<span class="sel-sep">›</span>' : '')
  ).join('') + '</div>';
}

modeCards.querySelectorAll('.mode-card').forEach(c => {
  c.addEventListener('click', () => {
    if (!state.level) { topicList.innerHTML='<p class="hint">请先选择年级</p>'; return; }
    state.mode = c.dataset.mode;
    modeCards.querySelectorAll('.mode-card').forEach(x =>
      x.classList.toggle('active', x.dataset.mode === state.mode));
    updateSummary();
    renderTopics();
  });
});

async function renderTopics() {
  if (!state.grade || !state.level || !state.mode) {
    topicList.innerHTML = '<p class="hint">请依次选择学段、年级与模式</p>';
    return;
  }
  if (!state.data) {
    try {
      state.data = await loadGradeData(state.grade);
    } catch (e) {
      topicList.innerHTML = '<p class="hint">题库加载失败，请通过本地服务器打开本页面。</p>';
      return;
    }
  }
  const grade = findGrade(state.data, state.level);
  let html = '';
  for (const ch of grade.chapters) {
    html += `<div class="chapter"><div class="chapter-name">${ch.name}</div><div class="topic-chips">`;
    for (const t of ch.topics) {
      html += `<button class="topic-chip" data-topic="${t.id}">${t.name}<span class="qcount">${t.questions.length}题</span></button>`;
    }
    html += `</div></div>`;
  }
  topicList.innerHTML = html;
  topicList.querySelectorAll('.topic-chip').forEach(b => {
    b.addEventListener('click', () => {
      navigate(`quiz?grade=${state.grade}&level=${state.level}&topic=${b.dataset.topic}&mode=${state.mode}`);
    });
  });
}
