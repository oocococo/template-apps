
    <main class="page">
      <header class="page-head">
        <h1 data-i18n="head.title">番茄钟 · 久坐提醒</h1>
        <div class="lang-switch" role="group" data-i18n-aria="lang.group">
          <button type="button" data-lang="zh" aria-pressed="true">中</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="ja" aria-pressed="false">日</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="ko" aria-pressed="false">한</button>
        </div>
        <p class="sub" data-i18n="head.sub"></p>
        <div class="head-stat">
          <span class="num" id="sessionCount">0</span>
          <span class="label" data-i18n="head.sessions">已完成段数</span>
        </div>
      </header>

      <div class="alert" id="alert" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 9v4M12 17h.01" stroke-linecap="round" />
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke-linejoin="round" />
        </svg>
        <div>
          <strong data-i18n="alert.title">该起身了</strong>
          <p id="alertText"></p>
        </div>
      </div>

      <section class="timer-card" aria-labelledby="timerHeading">
        <h2 id="timerHeading" class="visually-hidden" data-i18n="timer.label">当前工作段倒计时</h2>
        <div class="timer is-idle" id="timer" role="timer" aria-live="off">25:00</div>
        <p class="timer-sub" id="timerSub" role="status">准备开始</p>
        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="primaryBtn">开始工作</button>
          <button type="button" class="btn btn-secondary" id="discardBtn" data-i18n="btn.discard" hidden>放弃本段</button>
        </div>
        <p class="timer-hint" id="shortcutHint" hidden></p>
        <p class="hint" data-i18n="boundary.hint"></p>
      </section>

      <div class="grid">
        <section class="card" aria-labelledby="settingsHeading">
          <h2 id="settingsHeading" data-i18n="card.duration">工作段时长</h2>
          <p class="hint" data-i18n="card.duration.hint"></p>
          <form class="field" id="durationForm">
            <label for="durationInput">
              <span data-i18n="field.minutes">分钟（1–180）</span>
              <input
                type="number"
                id="durationInput"
                min="1"
                max="180"
                step="1"
                value="25"
                inputmode="numeric"
              />
            </label>
            <button type="submit" class="btn btn-secondary" data-i18n="btn.apply">应用</button>
          </form>
          <div class="presets" role="group" data-i18n-aria="group.presets">
            <button type="button" class="preset" data-min="15" data-i18n="preset.p15"></button>
            <button type="button" class="preset" data-min="25" data-i18n="preset.p25"></button>
            <button type="button" class="preset" data-min="45" data-i18n="preset.p45"></button>
            <button type="button" class="preset" data-min="60" data-i18n="preset.p60"></button>
          </div>
          <p class="field-error" id="durationError" role="alert" hidden></p>
        </section>

        <section class="card" aria-labelledby="soundHeading">
          <h2 id="soundHeading" data-i18n="card.sound">提醒音</h2>
          <p class="hint" id="soundHint"></p>
          <div class="sound-file-actions"><button class="btn btn-secondary" type="button" id="chooseFile">选择音频</button><button class="btn btn-secondary" type="button" id="chooseFolder">选择文件夹</button><button class="btn btn-secondary" type="button" id="samples">示例音</button><button class="btn btn-secondary" type="button" id="clearSound">默认音</button><input hidden type="file" accept="audio/*,.mp3,.wav,.ogg,.oga,.opus,.m4a,.aac,.flac,.webm" id="filePicker"><input hidden type="file" webkitdirectory multiple id="folderPicker"></div><p class="hint" id="folderNotice" hidden></p><form class="field" id="soundForm">
            <div class="sound-path-row">
              <label class="field-stack" for="soundPathInput">
                <span data-i18n="field.soundpath">音频文件或文件夹路径</span>
                <input
                  type="text" readonly
                  id="soundPathInput"
                  placeholder=""
                  lang="en"
                  spellcheck="false"
                  autocomplete="off"
                />
              </label>
              <!-- One fixed 36px slot with two occupants, never both visible. The
                   confirm takes the toggle's place while an edit is pending, so
                   the slot width -- and therefore the path input's width --
                   cannot change, and a long path can never push anything off
                   the panel. -->
              <span class="sound-slot">
                <button
                  type="submit"
                  class="btn sound-confirm"
                  id="soundConfirmBtn"
                  data-i18n-aria="btn.applyPath"
                  title=""
                  hidden
                >
                  <svg
                    class="icon-confirm"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polyline points="4 12.5 9.5 18 20 6" />
                  </svg>
                </button>
                <!-- One button, two states: it toggles between 顺序 and 随机. A two
                     button segmented control cost a whole row for no extra
                     function. Shown as an icon rather than text: the glyph IS the
                     state, and a 36px button leaves the track name more room. Text
                     labels are kept for screen readers. -->
                <button
                  type="button"
                  class="btn btn-secondary sound-mode-toggle"
                  id="soundModeToggle"
                  aria-pressed="true"
                  title=""
                >
                <svg
                  class="icon-sequence"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <line x1="9" y1="6" x2="21" y2="6" />
                  <line x1="9" y1="12" x2="21" y2="12" />
                  <line x1="9" y1="18" x2="21" y2="18" />
                  <circle cx="4.5" cy="6" r="1.2" />
                  <circle cx="4.5" cy="12" r="1.2" />
                  <circle cx="4.5" cy="18" r="1.2" />
                </svg>
                <svg
                  class="icon-shuffle"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polyline points="16 3 21 3 21 8" />
                  <line x1="4" y1="20" x2="21" y2="3" />
                  <polyline points="21 16 21 21 16 21" />
                  <line x1="15" y1="15" x2="21" y2="21" />
                  <line x1="4" y1="4" x2="9" y2="9" />
                </svg>
              </button>
              </span>
            </div>
          </form>
          <div class="sound-status">
            <span class="sound-now"
              ><span class="sound-line-label" data-i18n="sound.now">当前曲目</span
              ><span class="sound-line-name" id="soundNowTrack"></span
            ></span>
            <span class="sound-next" id="soundNextTrack" hidden
              ><span class="sound-line-label" data-i18n="sound.next">下一首</span
              ><span class="sound-line-name" id="soundNextName"></span
            ></span>
          </div>
          <div class="actions sound-actions">
            <button type="button" class="btn btn-secondary" id="testSoundBtn" data-i18n="btn.preview">试听</button>
            <span class="sound-toggles">
              <label class="pin">
                <input type="checkbox" id="soundLoop" />
                <span data-i18n="sound.loop">单曲循环</span>
              </label>
              <label class="pin">
                <input type="checkbox" id="soundNormalize" checked />
                <span data-i18n="sound.normalize">音量标准化</span>
              </label>
            </span>
          </div>
          <p class="field-error" id="soundError" role="alert" hidden></p>
        </section>

        <section class="card" aria-labelledby="appearanceHeading">
          <h2 id="appearanceHeading" data-i18n="card.appearance">外观</h2>
          <p class="hint" data-i18n="card.appearance.hint"></p>
          <div class="seg" role="group" data-i18n-aria="group.theme">
            <button type="button" data-theme-choice="system" aria-pressed="true" data-i18n="theme.system">跟随系统</button>
            <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n="theme.light">白天</button>
            <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n="theme.dark">夜间</button>
          </div>
          <p class="hint" id="appearanceShortcutHint" style="margin: 16px 0 0"></p>
        </section>

        <section class="card" aria-labelledby="statsHeading">
          <h2 id="statsHeading" data-i18n="card.stats">统计</h2>
          <p class="hint" data-i18n="card.stats.hint"></p>
          <div class="stat-row">
            <div>
              <div class="value" id="statSessions">0</div>
              <div class="caption" data-i18n="stat.sessions">完成段数</div>
            </div>
            <div>
              <div class="value" id="statFocus">0</div>
              <div class="caption" data-i18n="stat.focus">累计专注</div>
            </div>
          </div>
          <div class="actions" style="justify-content: flex-start">
            <button type="button" class="btn btn-danger" id="resetStatsBtn" data-i18n="btn.resetStats">清空统计</button>
          </div>
          <div class="confirm-row" id="resetConfirm" role="group" data-i18n-aria="group.resetConfirm" hidden>
            <span class="confirm-text" id="resetConfirmText"></span>
            <button type="button" class="btn btn-secondary" id="resetCancelBtn" data-i18n="btn.cancel">取消</button>
            <button type="button" class="btn btn-danger" id="resetConfirmBtn" data-i18n="btn.confirmClear">确定清空</button>
          </div>
        </section>
      </div>

      <p class="conn" id="conn">
        <span class="dot" aria-hidden="true"></span>
        <span id="connText" data-i18n="conn.online"></span>
      </p>
    </main>
