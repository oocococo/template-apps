<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root {
  --bg: #1a1a2e;
  --surface: #23233a;
  --surface2: #2c2c4a;
  --border: #3a3a5c;
  --text: #e8e8f5;
  --text2: #a0a0c0;
  --accent: #7c5cff;
  --accent2: #5dd4a5;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
header .logo { font-size: 22px; }
header h1 { font-size: 18px; font-weight: 600; }
header .sub { color: var(--text2); font-size: 13px; margin-left: auto; }
.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 0;
  min-height: calc(100vh - 65px);
}
.panel {
  padding: 20px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
}
.main { padding: 24px; overflow: auto; }
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.section h2 { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 6px; }
input[type=number], select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
}
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.switch-row span { font-size: 13px; color: var(--text); }
.switch { position: relative; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 22px; cursor: pointer; transition: 0.2s;
}
.slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 2px; background: var(--text2); border-radius: 50%; transition: 0.2s; }
input:checked + .slider { background: var(--accent); border-color: var(--accent); }
input:checked + .slider:before { transform: translateX(18px); background: #fff; }
.btn {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #6a4cf0; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
#dropzone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}
#dropzone:hover, #dropzone.drag { border-color: var(--accent); background: rgba(124, 92, 255, 0.08); }
#dropzone .ico { font-size: 30px; margin-bottom: 6px; }
#dropzone p { font-size: 13px; color: var(--text2); }
.hint { font-size: 12px; color: var(--text2); margin-top: 10px; text-align: center; }
.preview-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.preview-block { }
.preview-block h3 { font-size: 13px; color: var(--text2); margin-bottom: 8px; font-weight: 500; }
#origCanvas, #patternCanvas {
  background: #fff;
  border-radius: 8px;
  border: 1px solid var(--border);
  max-width: 100%;
}
#patternCanvas { display: block; overflow: auto; }
.canvas-wrap { max-width: 100%; overflow: auto; background: #fff; border-radius: 8px; border: 1px solid var(--border); padding: 8px; }
#bom { margin-top: 20px; }
.bom-total { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--accent2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text2); font-weight: 500; font-size: 12px; }
.swatch { display: inline-block; width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); vertical-align: middle; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .panel { border-right: none; border-bottom: 1px solid var(--border); }
}
</style></head><body><div style="padding:8px 20px;background:#313548;color:white">示例体验，数据仅保留在本页 <button id="resetSample">恢复示例</button> · 安装后可下载图纸</div>
<header>
  <span class="logo">🥐</span>
  <h1>拼豆图纸生成器</h1>
  <span class="sub">图片 → 像素化 → 色板量化 → 可打印图纸</span>
</header>
<div class="layout">
  <aside class="panel">
    <div class="section">
      <h2>1 · 上传图片</h2>
      <div id="dropzone">
        <div class="ico">🖼️</div>
        <p>点击或拖拽图片到此处</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <p class="hint" id="hint">支持 JPG / PNG, 建议先用清晰高对比图</p>
    </div>

    <div class="section">
      <h2>2 · 网格参数</h2>
      <label>板尺寸预设</label>
      <select id="boardPreset">
        <option value="29x29">单板 29 × 29</option>
        <option value="58x29">双板横排 58 × 29</option>
        <option value="29x58">双板竖排 29 × 58</option>
        <option value="58x58">四板 58 × 58</option>
        <option value="87x87" selected>大板 87 × 87 (推荐)</option>
        <option value="116x87">超大 116 × 87</option>
        <option value="custom">自定义</option>
      </select>
      <div id="dimRow" style="margin-top:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;">
        <input type="number" id="colsInput" min="2" max="400" value="87">
        <span style="color:var(--text2)">×</span>
        <input type="number" id="rowsInput" min="2" max="400" value="87">
      </div>
      <label style="margin-top:14px;">每格像素 <span id="cellSizeVal" style="color:var(--text)">16px</span></label>
      <input type="range" id="cellSize" min="8" max="32" value="16">
    </div>

    <div class="section">
      <h2>3 · 处理选项</h2>
      <label>颜色数上限 <span id="colorCountVal" style="color:var(--text)">16</span> 色</label>
      <input type="range" id="colorCount" min="6" max="96" value="16">
      <label style="margin-top:12px;">色彩增强 <span id="enhanceVal" style="color:var(--text)">30%</span></label>
      <input type="range" id="enhance" min="0" max="100" value="30">
      <label style="margin-top:12px;">细节锐化 <span id="detailVal" style="color:var(--text)">80%</span></label>
      <input type="range" id="detail" min="0" max="100" value="80">
      <label style="margin-top:12px;">主体聚焦 <span id="zoomVal" style="color:var(--text)">1.0x</span></label>
      <input type="range" id="zoom" min="100" max="300" step="5" value="100">
      <div class="switch-row" style="margin-top:12px;">
        <span>Floyd-Steinberg 抖动</span>
        <label class="switch"><input type="checkbox" id="dither"><span class="slider"></span></label>
      </div>
      <div class="switch-row">
        <span>图纸标注色号</span>
        <label class="switch"><input type="checkbox" id="showIds" checked><span class="slider"></span></label>
      </div>
      <button class="btn btn-primary" id="genBtn">重新生成图纸</button>
      <p class="hint">色板: MARD 291 真实色号; 眼珠要清楚 = 网格 87 起 + 主体聚焦 1.5~2x</p>
    </div>

    <div class="section">
      <h2>4 · 导出</h2>
      <div class="btn-row">
        <button class="btn btn-ghost" id="pngBtn" disabled>下载 PNG</button>
        <button class="btn btn-ghost" id="pdfBtn" disabled>下载 PDF</button>
      </div>
      <p class="hint">PDF 含图纸页 + 采购清单页</p>
    </div>
  </aside>

  <main class="main">
    <div class="preview-row">
      <div class="preview-block">
        <h3>原图</h3>
        <canvas id="origCanvas" width="0" height="0"></canvas>
      </div>
      <div class="preview-block" style="flex:1;min-width:280px;">
        <h3>拼豆图纸</h3>
        <div class="canvas-wrap">
          <canvas id="patternCanvas" width="0" height="0"></canvas>
        </div>
      </div>
    </div>
    <div id="bom"></div>
  </main>
</div>

        indices[p] = nearestIndex([data[i], data[i + 1], data[i + 2]], palette);
      }
    } else {
      var buf = new Float32Array(cols * rows * 3);
      for (var k2 = 0; k2 < cols * rows; k2++) { var j2 = k2 * 4; buf[k2 * 3] = data[j2]; buf[k2 * 3 + 1] = data[j2 + 1]; buf[k2 * 3 + 2] = data[j2 + 2]; }
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var idx = (y * cols + x) * 3;
          var pi = nearestIndex([buf[idx], buf[idx + 1], buf[idx + 2]], palette);
          indices[y * cols + x] = pi;
          var nc = palette[pi].rgb;
          var errR = buf[idx] - nc[0], errG = buf[idx + 1] - nc[1], errB = buf[idx + 2] - nc[2];
          distribute(buf, x + 1, y, cols, rows, errR, errG, errB, 7 / 16);
          distribute(buf, x - 1, y + 1, cols, rows, errR, errG, errB, 3 / 16);
          distribute(buf, x, y + 1, cols, rows, errR, errG, errB, 5 / 16);
          distribute(buf, x + 1, y + 1, cols, rows, errR, errG, errB, 1 / 16);
        }
      }
    }
    return { cols: cols, rows: rows, indices: indices, paletteUsed: palette };
  }

  function distribute(buf, x, y, cols, rows, er, eg, eb, w) {
    if (x < 0 || x >= cols || y < 0 || y >= rows) return;
    var idx = (y * cols + x) * 3;
    buf[idx] += er * w; buf[idx + 1] += eg * w; buf[idx + 2] += eb * w;
  }

  function buildBom(result) {
    var src = result.paletteUsed;
    var n = src.length;
    var counts = new Array(n).fill(0);
    var arr = result.indices;
    for (var i = 0; i < arr.length; i++) counts[arr[i]]++;
    var bom = [];
    for (var k = 0; k < n; k++) {
      if (counts[k] > 0) bom.push({ id: src[k].id, name: src[k].name, count: counts[k] });
    }
    bom.sort(function (a, b) { return b.count - a.count; });
    return { items: bom, total: arr.length };
  }

  window.PerlerProcessor = {
    loadImage: loadImage, imageToGridData: imageToGridData, sharpen: sharpen,
    enhance: enhance, activePalette: activePalette, dominantColors: dominantColors,
    quantize: quantize, buildBom: buildBom, nearestIndex: nearestIndex,
    rgbToLab: rgbToLab, ciede2000: ciede2000
  };
})();

// 图纸渲染: 在 Canvas 上绘制拼豆网格图纸(每格填色 + 色号 + 板边界)
(function () {
  'use strict';

  // result: quantize 输出; palette; canvas; cellSize 像素/格; opts.showIds 是否标色号; opts.boardSize 板边长(用于画板边界)
  function renderPattern(canvas, result, palette, cellSize, opts) {
    opts = opts || {};
    var cols = result.cols, rows = result.rows;
    var w = cols * cellSize, h = rows * cellSize;
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // 背景白
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    // 填色
    var indices = result.indices;
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var pi = indices[y * cols + x];
        var c = palette[pi].rgb;
        ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      }
    }

    // 网格线
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 0; gx <= cols; gx++) {
      ctx.moveTo(gx * cellSize + 0.5, 0);
      ctx.lineTo(gx * cellSize + 0.5, h);
    }
    for (var gy = 0; gy <= rows; gy++) {
      ctx.moveTo(0, gy * cellSize + 0.5);
      ctx.lineTo(w, gy * cellSize + 0.5);
    }
    ctx.stroke();

    // 板边界(每 boardSize 格加粗, 默认 29)
    var boardSize = opts.boardSize || 29;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var bx = 0; bx <= cols; bx += boardSize) {
      ctx.moveTo(bx * cellSize + 0.5, 0);
      ctx.lineTo(bx * cellSize + 0.5, h);
    }
    for (var by = 0; by <= rows; by += boardSize) {
      ctx.moveTo(0, by * cellSize + 0.5);
      ctx.lineTo(w, by * cellSize + 0.5);
    }
    ctx.stroke();

    // 色号标注(格子够大时才标)
    if (opts.showIds && cellSize >= 14) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.font = Math.floor(cellSize * 0.32) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (var yy = 0; yy < rows; yy++) {
        for (var xx = 0; xx < cols; xx++) {
          var p = indices[yy * cols + xx];
          ctx.fillText(palette[p].id, xx * cellSize + cellSize / 2, yy * cellSize + cellSize / 2);
        }
      }
    }
  }

  // 原图预览(等比缩放到给定框)
  function renderOriginal(canvas, img, maxW, maxH) {
    var ratio = img.width / img.height;
    var w, h;
    if (maxW / maxH > ratio) { h = maxH; w = h * ratio; } else { w = maxW; h = w / ratio; }
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
  }

  window.PerlerRenderer = {
    renderPattern: renderPattern,
    renderOriginal: renderOriginal
  };
})();

// 导出模块: PNG 下载 + jsPDF 生成 PDF(图纸页 + 采购清单页)
(function () {
  'use strict';

  function downloadCanvasPNG(canvas, filename) {
    canvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename || 'perler-pattern.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }, 'image/png');
  }

  // 生成 PDF: 第一页图纸(等比缩放到 A4), 后续页采购清单
  // 依赖 jsPDF (cdn)
  function exportPDF(patternCanvas, bom, meta) {
    meta = meta || {};
    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert('PDF 库未加载, 请检查网络后重试');
      return;
    }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var pageW = 210, pageH = 297, margin = 10;
    var usableW = pageW - margin * 2;

    // 标题
    doc.setFontSize(16);
    doc.text(meta.title || '拼豆图纸', margin, 18);
    doc.setFontSize(10);
    doc.setTextColor(110);
    doc.text((meta.info || ''), margin, 25);
    doc.setTextColor(0);

    // 图纸图: 等比放入
    var pw = patternCanvas.width, ph = patternCanvas.height;
    var ratio = pw / ph;
    var drawW = usableW, drawH = drawW / ratio;
    var maxDrawH = pageH - margin - 32;
    if (drawH > maxDrawH) { drawH = maxDrawH; drawW = drawH * ratio; }
    var imgData = patternCanvas.toDataURL('image/png');
    doc.addImage(imgData, 'PNG', margin, 30, drawW, drawH);

    // 采购清单页
    doc.addPage();
    doc.setFontSize(16);
    doc.text('采购清单', margin, 18);
    doc.setFontSize(11);
    doc.text('总用量: ' + bom.total + ' 颗  |  色号数: ' + bom.items.length, margin, 27);
    doc.setFontSize(10);
    var y = 38;
    var colX = [margin, margin + 60, margin + 110, margin + 150];
    doc.text('色号', colX[0], y);
    doc.text('颜色名', colX[1], y);
    doc.text('数量(颗)', colX[2], y);
    doc.text('占比', colX[3], y);
    doc.setDrawColor(200);
    doc.line(margin, y + 3, pageW - margin, y + 3);
    y += 9;
    var total = bom.total;
    for (var i = 0; i < bom.items.length; i++) {
      if (y > pageH - 15) { doc.addPage(); y = 20; }
      var it = bom.items[i];
      doc.text(it.id, colX[0], y);
      doc.text(it.name, colX[1], y);
      doc.text(String(it.count), colX[2], y);
      doc.text((it.count / total * 100).toFixed(1) + '%', colX[3], y);
      y += 7;
    }

    doc.save(meta.filename || 'perler-pattern.pdf');
  }

  window.PerlerExport = {
    downloadCanvasPNG: downloadCanvasPNG,
    exportPDF: exportPDF
  };
})();

// 界面交互: 上传 → 参数 → 处理 → 预览 → 导出 (v6)
(function () {
  'use strict';

  var state = {
    img: null,
    result: null,
    palette: window.PERLER_PALETTE,
    cellSize: 16,
    cols: 87,
    rows: 87,
    useDither: false,
    showIds: true,
    boardSize: 29,
    colorCount: 16,
    enhanceAmt: 0.3,
    detailAmt: 0.8,
    zoom: 1
  };

  var $ = function (s) { return document.querySelector(s); };
  var regenTimer = null;

  function init() {
    var drop = $('#dropzone');
    var fileInput = $('#fileInput');

    drop.addEventListener('click', function () { fileInput.click(); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('drag'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('drag');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', function () {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    // 板尺寸预设
    $('#boardPreset').addEventListener('change', function (e) {
      var v = e.target.value;
      if (v === 'custom') { $('#dimRow').style.display = ''; return; }
      var parts = v.split('x');
      state.cols = parseInt(parts[0], 10);
      state.rows = parseInt(parts[1], 10);
      $('#colsInput').value = state.cols;
      $('#rowsInput').value = state.rows;
      $('#dimRow').style.display = 'none';
      regen();
    });
    $('#colsInput').addEventListener('input', function (e) {
      state.cols = parseInt(e.target.value, 10) || 87; regen();
    });
    $('#rowsInput').addEventListener('input', function (e) {
      state.rows = parseInt(e.target.value, 10) || 87; regen();
    });

    // 每格像素
    $('#cellSize').addEventListener('input', function (e) {
      state.cellSize = parseInt(e.target.value, 10);
      $('#cellSizeVal').textContent = state.cellSize + 'px';
      if (state.result) draw();
    });

    // 颜色数 / 色彩增强 / 细节锐化 / 主体聚焦
    $('#colorCount').addEventListener('input', function (e) {
      state.colorCount = parseInt(e.target.value, 10);
      $('#colorCountVal').textContent = state.colorCount;
      regen();
    });
    $('#enhance').addEventListener('input', function (e) {
      state.enhanceAmt = parseInt(e.target.value, 10) / 100;
      $('#enhanceVal').textContent = e.target.value + '%';
      regen();
    });
    $('#detail').addEventListener('input', function (e) {
      state.detailAmt = parseInt(e.target.value, 10) / 100;
      $('#detailVal').textContent = e.target.value + '%';
      regen();
    });
    $('#zoom').addEventListener('input', function (e) {
      state.zoom = parseInt(e.target.value, 10) / 100;
      $('#zoomVal').textContent = state.zoom.toFixed(1) + 'x';
      regen();
    });

    // 抖动 / 色号标注
    $('#dither').addEventListener('change', function (e) { state.useDither = e.target.checked; regen(); });
    $('#showIds').addEventListener('change', function (e) {
      state.showIds = e.target.checked;
      if (state.result) draw();
    });

    $('#genBtn').addEventListener('click', function () {
      if (!state.img) { alert('请先上传图片'); return; }
      generate();
    });
    $('#pngBtn').addEventListener('click', function () {
      if (!state.result) return;
      window.PerlerExport.downloadCanvasPNG($('#patternCanvas'), 'perler-pattern.png');
    });
    $('#pdfBtn').addEventListener('click', function () {
      if (!state.result) return;
      var bom = window.PerlerProcessor.buildBom(state.result, state.palette);
      window.PerlerExport.exportPDF($('#patternCanvas'), bom, {
        title: '拼豆图纸',
        info: state.cols + ' x ' + state.rows + ' 格 | ' + state.result.paletteUsed.length + ' 色 | ' + (state.useDither ? '抖动' : '最近邻'),
        filename: 'perler-pattern.pdf'
      });
    });
  }

  // 带防抖的自动重生成
  function regen() {
    if (!state.img) return;
    clearTimeout(regenTimer);
    regenTimer = setTimeout(generate, 120);
  }

  function handleFile(file) {
    if (!file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
    window.PerlerProcessor.loadImage(file).then(function (img) {
      state.img = img;
      window.PerlerRenderer.renderOriginal($('#origCanvas'), img, 260, 260);
      // 默认网格: 长边 87(大板), 短边按比例
      var longer = Math.max(img.width, img.height);
      var shorter = Math.min(img.width, img.height);
      var ratio = shorter / longer;
      if (img.width >= img.height) {
        state.cols = 87; state.rows = Math.max(2, Math.round(87 * ratio));
      } else {
        state.rows = 87; state.cols = Math.max(2, Math.round(87 * ratio));
      }
      $('#colsInput').value = state.cols;
      $('#rowsInput').value = state.rows;
      $('#boardPreset').value = 'custom';
      $('#dimRow').style.display = '';
      $('#hint').textContent = '图片已加载, 已按大板规模(长边87)生成';
      generate();
    }).catch(function (err) { alert(err.message); });
  }

  function generate() {
    if (!state.img) return;
    var cols = Math.max(2, state.cols), rows = Math.max(2, state.rows);
    var data = window.PerlerProcessor.imageToGridData(state.img, cols, rows, state.zoom);
    window.PerlerProcessor.sharpen(data, state.detailAmt);
    window.PerlerProcessor.enhance(data, state.enhanceAmt);
    var active = window.PerlerProcessor.activePalette(data, state.palette, state.colorCount);
    state.result = window.PerlerProcessor.quantize(data, active, state.useDither);
    draw();
    renderBom();
    $('#hint').textContent = '生成完成 · ' + cols + ' x ' + rows + ' · ' +
      state.result.indices.length + ' 颗豆 · ' + active.length + ' 色' +
      (state.zoom > 1 ? ' · 聚焦 ' + state.zoom.toFixed(1) + 'x' : '');
    $('#pngBtn').disabled = false;
    $('#pdfBtn').disabled = false;
  }

  function draw() {
    window.PerlerRenderer.renderPattern(
      $('#patternCanvas'), state.result, state.result.paletteUsed, state.cellSize,
      { showIds: state.showIds, boardSize: state.boardSize }
    );
  }

  function renderBom() {
    var bom = window.PerlerProcessor.buildBom(state.result, state.palette);
    var html = '<div class="bom-total">总用量 ' + bom.total + ' 颗 · ' + bom.items.length + ' 种色号</div>';
    html += '<table><thead><tr><th>色块</th><th>色号</th><th>颜色名</th><th>数量</th><th>占比</th></tr></thead><tbody>';
    for (var i = 0; i < bom.items.length; i++) {
      var it = bom.items[i];
      var c = state.palette.find(function (p) { return p.id === it.id; });
      var swatch = c ? 'rgb(' + c.rgb.join(',') + ')' : '#999';
      html += '<tr><td><span class="swatch" style="background:' + swatch + '"></span></td>' +
        '<td>' + it.id + '</td><td>' + it.name + '</td><td>' + it.count + '</td>' +
        '<td>' + (it.count / bom.total * 100).toFixed(1) + '%</td></tr>';
    }
    html += '</tbody></table>';
    $('#bom').innerHTML = html;
  }

  init();
})();
