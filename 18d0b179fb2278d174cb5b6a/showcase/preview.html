<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root {
  --bg: #080b12;
  --panel: #101623;
  --panel-2: #161d2b;
  --line: #222b3b;
  --line-2: #2f3b50;
  --text: #e6ebf4;
  --muted: #8b97ad;
  --cyan: #22d3ee;
  --purple: #a78bfa;
  --err: #f87171;
  --warn: #fbbf24;
  --ok: #34d399;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 520px at 82% -12%, rgba(34, 211, 238, .12), transparent 60%),
    radial-gradient(900px 480px at 6% 4%, rgba(167, 139, 250, .10), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

/* ---------- 顶部 ---------- */
.topbar {
  padding: 30px 40px 22px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px 28px;
}
.topbar > div:first-child { flex: 0 0 auto; }
.topbar > p { flex: 1 1 320px; margin: 0; color: var(--muted); font-size: 13px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo .dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 18px var(--cyan);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .45; } }
.topbar h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
.topbar h1 em {
  font-style: normal; font-size: 12px; margin-left: 10px; vertical-align: 3px;
  color: #06121a; background: linear-gradient(90deg, var(--cyan), var(--purple));
  padding: 3px 9px; border-radius: 5px; font-weight: 700; letter-spacing: 0;
}
.topbar-actions { display: flex; gap: 10px; flex: 0 0 auto; }
.ghost-btn, .solid-btn {
  padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
  transition: .16s;
}
.ghost-btn { background: transparent; border: 1px solid var(--line-2); color: var(--text); }
.ghost-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.solid-btn { background: var(--cyan); border: 1px solid var(--cyan); color: #06121a; }
.solid-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  gap: 24px;
  padding: 24px 40px 40px;
  align-items: start;
}
.sec-title { font-size: 15px; margin: 4px 0 14px; display: flex; align-items: baseline; gap: 10px; }
.sec-title span { font-size: 12px; color: var(--muted); font-weight: 400; }

/* ---------- 预设 ---------- */
.presets-wrap { margin-bottom: 26px; }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.preset {
  text-align: left; cursor: pointer; padding: 13px 15px;
  background: linear-gradient(135deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: 12px; color: var(--text);
  transition: .18s; position: relative; overflow: hidden;
}
.preset::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(34, 211, 238, .12));
  opacity: 0; transition: .18s;
}
.preset:hover { border-color: var(--cyan); transform: translateY(-2px); }
.preset:hover::after { opacity: 1; }
.preset b { display: block; font-size: 14px; }
.preset span { font-size: 12px; color: var(--muted); }

/* ---------- 配件分类 ---------- */
.cat {
  margin-bottom: 14px; border: 1px solid var(--line);
  border-radius: 12px; background: rgba(16, 22, 35, .6); overflow: hidden;
}
.cat h2 {
  font-size: 14px; margin: 0; padding: 12px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); transition: .15s;
}
.cat h2:hover { background: var(--panel-2); }
.cat-icon { font-size: 16px; }
.cat h2 b { font-size: 14px; }
.cat h2 em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 400; flex: 1 1 auto; }
.badge {
  font-style: normal; font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 700;
}
.badge.ok { background: rgba(52, 211, 153, .12); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, .3); }
.badge.warn { background: rgba(251, 191, 36, .12); color: #fcd34d; border: 1px solid rgba(251, 191, 36, .3); }
.badge.err { background: rgba(248, 113, 113, .12); color: #fca5a5; border: 1px solid rgba(248, 113, 113, .35); }
.fold { font-size: 12px; color: var(--muted); }
.fold::before { content: '⌃ '; }
.cat.folded .cat-body { display: none; }
.cat-body { padding: 4px 16px 16px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.card {
  cursor: pointer; text-align: left; padding: 11px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  display: flex; flex-direction: column; gap: 3px; transition: .16s; position: relative;
}
.card:hover { border-color: var(--line-2); background: var(--panel-2); transform: translateY(-1px); }
.card.active {
  border-color: var(--cyan);
  background: linear-gradient(135deg, rgba(34, 211, 238, .13), rgba(34, 211, 238, .04));
  box-shadow: 0 0 0 1px rgba(34, 211, 238, .25) inset;
}
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card-name { font-weight: 700; font-size: 13px; }
.tick { color: var(--cyan); font-size: 13px; font-weight: 700; }
.card-sub { font-size: 11px; color: var(--muted); line-height: 1.4; }
.card-price {
  font-size: 13px; color: var(--cyan); font-weight: 700; margin-top: 4px;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.hike {
  font-style: normal; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
  background: rgba(248, 113, 113, .14); color: #fca5a5; border: 1px solid rgba(248, 113, 113, .32);
}
.card-base { font-size: 11px; color: #6b7688; text-decoration: line-through; }

.count-row { margin-top: 12px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
}
.stepper button:hover { border-color: var(--cyan); }
.stepper b { min-width: 20px; text-align: center; color: var(--text); }

/* ---------- 结算面板 ---------- */
.summary-panel {
  position: sticky; top: 20px;
  background: linear-gradient(180deg, var(--panel), #0d1320);
  border: 1px solid var(--line); border-radius: 16px; padding: 20px;
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.summary-panel::-webkit-scrollbar { width: 6px; }
.summary-panel::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

.total { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
.total span { font-size: 12px; color: var(--muted); }
.total b { display: block; font-size: 34px; color: var(--cyan); line-height: 1.2; letter-spacing: -.5px; }
.total em { font-style: normal; font-size: 12px; color: var(--muted); }

/* 行情溢价模块 */
.premium {
  border: 1px solid rgba(251, 146, 60, .28); border-radius: 12px; padding: 12px 14px;
  background: linear-gradient(180deg, rgba(251, 146, 60, .10), rgba(251, 146, 60, .03));
  margin-bottom: 14px;
}
.premium h4 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.premium h4 em { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400; }
.premium-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.premium-top span { font-size: 11px; color: var(--muted); }
.premium-top b { display: block; font-size: 16px; }
.premium-top b.old { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.premium-top b.up { color: #fb923c; }
.premium-bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; margin: 10px 0 10px; }
.premium-bar i {
  display: block; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #fbbf24, #f87171); transition: width .5s ease;
}
.premium-list { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 5px; }
.premium-list li { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.premium-list li span { color: var(--muted); flex: 0 0 52px; }
.premium-list li b { color: #fdba74; font-size: 13px; }
.premium-list li em { font-style: normal; color: #f87171; font-size: 11px; font-weight: 700; }
.premium-advice { margin: 0; font-size: 12px; line-height: 1.65; color: #e8dcb6; }
.premium-note { margin: 8px 0 0; font-size: 11px; color: var(--muted); line-height: 1.6; }

.score-box {
  border: 1px solid var(--line); border-left: 4px solid var(--tier);
  border-radius: 12px; padding: 14px 16px; background: var(--panel-2);
  margin-bottom: 14px; display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; align-items: center;
}
.ring { position: relative; width: 96px; height: 96px; grid-row: span 2; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring-bg { stroke: rgba(255, 255, 255, .07); }
.ring-fg {
  stroke: var(--tier);
  stroke-dasharray: 263.9;
  stroke-dashoffset: calc(263.9 - 263.9 * var(--pct) / 100);
  transition: stroke-dashoffset .6s cubic-bezier(.3, .8, .3, 1);
}
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.ring-num b { font-size: 26px; color: var(--tier); }
.ring-num span { font-size: 11px; color: var(--muted); align-self: flex-end; margin-bottom: 30px; }
.tier b { font-size: 17px; color: var(--tier); }
.tier p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.tier .tag {
  display: inline-block; margin-top: 6px; font-size: 11px; padding: 1px 8px; border-radius: 4px;
  background: rgba(255, 255, 255, .06); color: var(--muted); border: 1px solid var(--line);
}
.perk { grid-column: 2; font-size: 13px; color: var(--cyan); font-weight: 700; }
.perk span { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }

.panel-block {
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  background: var(--panel-2); margin-bottom: 12px;
}
.panel-block h4 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
.panel-block h4 em { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400; }
.panel-block .muted { color: var(--muted); font-size: 12px; margin: 0; }

.fps-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.fps-label { font-size: 12px; color: var(--muted); width: 46px; flex: 0 0 auto; }
.fps-track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.fps-track i { display: block; height: 100%; border-radius: 4px; transition: width .5s ease; }
.fps-val { font-size: 12px; font-weight: 700; width: 58px; text-align: right; flex: 0 0 auto; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-grid > div {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
}
.stat-grid span { font-size: 11px; color: var(--muted); }
.stat-grid b { display: block; font-size: 16px; }
.stat-grid b.hard { color: var(--warn); }
.stat-grid em { font-style: normal; font-size: 11px; color: var(--muted); line-height: 1.35; display: block; }

.scenarios { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.scenarios li {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px;
}
.scenarios li span { font-size: 16px; }
.scenarios b { font-size: 13px; }
.scenarios p { margin: 0; font-size: 12px; color: var(--muted); }

.issue { border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; font-size: 12px; }
.issue h4 { margin: 0 0 6px; font-size: 13px; }
.issue p { margin: 0 0 5px; line-height: 1.55; }
.issue.err { background: rgba(248, 113, 113, .09); border: 1px solid rgba(248, 113, 113, .32); color: #fca5a5; }
.issue.warn { background: rgba(251, 191, 36, .09); border: 1px solid rgba(251, 191, 36, .28); color: #fcd34d; }
.issue.tip { background: rgba(167, 139, 250, .09); border: 1px solid rgba(167, 139, 250, .28); color: #c4b5fd; }
.issue.ok { background: rgba(52, 211, 153, .09); border: 1px solid rgba(52, 211, 153, .3); color: #6ee7b7; }

.trivia {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted);
  background: rgba(255, 255, 255, .03); border: 1px dashed var(--line-2);
  border-radius: 9px; padding: 9px 11px; margin-bottom: 14px;
}
.trivia p { margin: 0; }

.actions { display: grid; gap: 8px; }
.actions button {
  padding: 11px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text); transition: .15s;
}
.actions button:hover { border-color: var(--cyan); }
.actions .primary { background: var(--cyan); color: #06121a; border-color: var(--cyan); }
.actions .primary:hover { filter: brightness(1.08); }
.actions .ghost { background: transparent; border-color: var(--line-2); }

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; inset: 0; background: rgba(2, 5, 12, .84);
  display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  backdrop-filter: blur(3px);
}
.modal.show { display: flex; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.modal-box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; max-width: 460px; width: 100%; position: relative; text-align: center;
  max-height: 92vh; overflow-y: auto;
}
.modal-box h3 { margin: 0 0 12px; font-size: 15px; }
.modal-box img { width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.close {
  position: absolute; right: 12px; top: 8px; background: none; border: none;
  color: var(--muted); font-size: 24px; cursor: pointer; z-index: 2;
}
.theme-switch { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
.theme-btn {
  padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 700;
  background: transparent; border: 1px solid var(--line); color: var(--muted); transition: .15s;
}
.theme-btn.on { color: #06121a; background: var(--c); border-color: var(--c); }
.modal-actions { margin-top: 14px; display: flex; align-items: center; gap: 12px; justify-content: center; }
.modal-actions button {
  padding: 10px 22px; border-radius: 8px; border: none; background: var(--cyan);
  color: #06121a; font-weight: 700; cursor: pointer;
}
.modal-actions span { font-size: 12px; color: var(--muted); }

/* ---------- 装机引导 ---------- */
.guide-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px; max-width: 520px; width: 100%; position: relative;
  max-height: 92vh; overflow-y: auto;
}
.guide-bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.guide-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: width .35s ease; }
.guide-head { display: flex; align-items: baseline; gap: 12px; margin: 14px 0 4px; }
.guide-step { font-size: 11px; letter-spacing: 1px; color: var(--cyan); font-weight: 700; }
.guide-head b { font-size: 18px; }
.guide-stage {
  margin: 14px 0; padding: 22px; border-radius: 14px; text-align: center;
  background: radial-gradient(circle at 50% 30%, rgba(34, 211, 238, .14), rgba(255, 255, 255, .02));
  border: 1px solid var(--line);
}
.guide-emoji { font-size: 54px; line-height: 1; animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-7px); } }
.guide-part { margin: 12px 0 0; font-weight: 700; font-size: 14px; color: var(--cyan); }
.guide-text { font-size: 13px; margin: 0 0 10px; }
.guide-tip {
  font-size: 12px; color: var(--muted); margin: 0; padding: 9px 12px;
  background: rgba(255, 255, 255, .03); border-left: 3px solid var(--purple); border-radius: 6px;
}
.guide-tip span { color: var(--purple); font-weight: 700; margin-right: 8px; font-size: 11px; }
.guide-actions { display: flex; gap: 10px; margin-top: 18px; }
.guide-actions button {
  flex: 1; padding: 11px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
}
.guide-actions button:disabled { opacity: .4; cursor: not-allowed; }
.guide-actions .primary { background: var(--cyan); color: #06121a; border-color: var(--cyan); }

.boot {
  margin-top: 16px; border-radius: 10px; background: #05070c; border: 1px solid var(--line);
  padding: 14px; font-family: Consolas, "Courier New", monospace; min-height: 150px; position: relative;
}
.boot-lines p { margin: 0 0 4px; font-size: 12px; color: #64748b; }
.boot-line { animation: fade .2s ease; }
.boot-done { color: var(--cyan) !important; font-weight: 700; font-size: 13px !important; margin-top: 8px !important; }
.boot-light { display: flex; gap: 6px; margin-top: 12px; }
.boot-light i { flex: 1; height: 5px; border-radius: 3px; background: #1b2432; transition: .4s; }
.boot.on .boot-light i { animation: rgb 2.4s linear infinite; }
.boot.on .boot-light i:nth-child(2) { animation-delay: .2s; }
.boot.on .boot-light i:nth-child(3) { animation-delay: .4s; }
.boot.on .boot-light i:nth-child(4) { animation-delay: .6s; }
@keyframes rgb {
  0% { background: #22d3ee; } 25% { background: #a78bfa; }
  50% { background: #f472b6; } 75% { background: #fbbf24; } 100% { background: #22d3ee; }
}
.boot.on { box-shadow: 0 0 26px rgba(34, 211, 238, .18) inset; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 20px);
  background: rgba(22, 29, 43, .96); border: 1px solid var(--line-2); color: var(--text);
  padding: 10px 20px; border-radius: 24px; font-size: 13px; z-index: 40;
  opacity: 0; pointer-events: none; transition: .22s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.foot { text-align: center; padding: 26px 20px; color: #57607a; font-size: 12px; }

/* ---------- 响应式 ---------- */
@media (max-width: 1120px) {
  .layout { grid-template-columns: 1fr; padding: 20px; }
  .summary-panel { position: static; max-height: none; order: -1; }
  .topbar { padding: 24px 20px 18px; }
}
@media (max-width: 560px) {
  .cards { grid-template-columns: 1fr 1fr; }
  .stat-grid { grid-template-columns: 1fr; }
  .score-box { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .ring { grid-row: auto; }
  .perk { grid-column: 1; }
  .topbar h1 { font-size: 21px; }
  .topbar-actions { width: 100%; }
  .topbar-actions button { flex: 1; }
}
</style></head><body>
<div style="padding:10px;background:#182235;color:#fff;text-align:center">示例体验 · 数据仅保存在当前页面 <button id="resetExample" type="button">恢复示例</button></div>
<header class="topbar">
  <div class="logo">
    <span class="dot"></span>
    <h1>装机模拟器<em>配置助手</em></h1>
  </div>
  <p>选配件 → 自动查兼容 → 算帧数、电费和<b style="color:#fdba74">行情溢价</b> → 生成可分享的战斗力卡片。<br>
  价格已按 <b style="color:#fdba74">2026-10 行情</b>更新：内存、固态、显卡正处涨价高位，每件配件的溢价都会单独标出来。</p>
  <div class="topbar-actions">
    <button id="topGuide" class="ghost-btn">跟我一起装机 →</button>
    <button id="topCard" class="solid-btn">生成配置单卡片</button>
  </div>
</header>

<main class="layout">
  <section class="builder">
    <div class="presets-wrap">
      <h2 class="sec-title">没想法？先看这几套<span>点一下直接套用</span></h2>
      <div id="presets" class="presets"></div>
    </div>
    <h2 class="sec-title">开始搭<span>点卡片即可切换，右侧实时结算</span></h2>
    <div id="categories"></div>
  </section>

  <aside class="summary-panel">
    <div id="summaryBody"></div>
  </aside>
</main>

<footer class="foot">
  数据仅供参考，下单前请再核对一次
</footer>

<div class="modal" id="cardModal">
  <div class="modal-box">

/* 装机模拟器 · 逻辑层 v2 */

const CATEGORY_ORDER = ['cpu', 'board', 'gpu', 'ram', 'ssd', 'cooler', 'chassis', 'psu'];
const TIER_COLOR = ['#f5d90a', '#f5d90a', '#67e8f9', '#a78bfa', '#facc15', '#cbd5e1', '#94a3b8'];
const POWER_PRICE = 0.62;   // 元/度
const GAME_HOURS = 3;       // 日均满载小时
const IDLE_WATTS = 90;      // 轻载功耗

const state = { ssdCount: 1 };
Object.assign(state, PRESETS[0].build);

const byId = (cat, id) => PARTS[cat].find((p) => p.id === id);
const money = (n) => '¥' + n.toLocaleString('zh-CN');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- 兼容性 & 性能模型 ---------------- */

function evaluate() {
  const p = {
    cpu: byId('cpu', state.cpu),
    board: byId('board', state.board),
    gpu: byId('gpu', state.gpu),
    ram: byId('ram', state.ram),
    ssd: byId('ssd', state.ssd),
    cooler: byId('cooler', state.cooler),
    chassis: byId('chassis', state.chassis),
    psu: byId('psu', state.psu)
  };

  const issues = [];
  const err = (cats, text) => issues.push({ level: 'err', cats, text });
  const warn = (cats, text) => issues.push({ level: 'warn', cats, text });
  const tip = (cats, text) => issues.push({ level: 'tip', cats, text });

  /* 1. 插槽 */
  if (p.cpu.socket !== p.board.socket) {
    err(['cpu', 'board'], `插槽不匹配：${p.cpu.name} 是 ${p.cpu.socket}，而 ${p.board.name} 是 ${p.board.socket}，物理上插不进去。`);
  }

  /* 2. 内存代数 */
  if (p.board.mem !== p.ram.type) {
    err(['board', 'ram'], `内存插不上：主板只支持 ${p.board.mem}，你选的是 ${p.ram.type}，DDR4 与 DDR5 的缺口位置不一样。`);
  } else if (!p.cpu.mem.includes(p.ram.type)) {
    err(['cpu', 'ram'], `${p.cpu.name} 的内存控制器不支持 ${p.ram.type}。`);
  } else {
    /* 3. 内存条数 / 容量 / 频率 */
    if (p.ram.sticks > p.board.dimm) {
      err(['board', 'ram'], `内存插槽不够：${p.board.name} 只有 ${p.board.dimm} 条 DIMM，你这套是 ${p.ram.sticks} 条。`);
    }
    if (p.ram.cap > p.board.maxMem) {
      err(['board', 'ram'], `容量超上限：${p.board.name} 最大支持 ${p.board.maxMem}GB，你装了 ${p.ram.cap}GB。`);
    }
    if (p.ram.freq > p.board.memMax) {
      warn(['board', 'ram'], `内存降频：这套 ${p.ram.freq}MHz 的条子，${p.board.name} 官方最高只支持 ${p.board.memMax}MHz，会按低频跑。`);
    }
  }

  /* 4. BIOS 支持 */
  if (p.board.needBios && p.board.needBios.includes(p.cpu.id)) {
    warn(['board', 'cpu'], `先刷 BIOS：${p.board.chipset} 主板出厂固件可能不认 ${p.cpu.name}，买之前确认商家已更新，或主板支持免 CPU 刷新。`);
  }

  /* 5. 板型 */
  if (!p.chassis.forms.includes(p.board.form)) {
    err(['board', 'chassis'], `板型装不下：${p.chassis.name} 支持 ${p.chassis.forms.join(' / ')}，而主板是 ${p.board.form}。`);
  }

  /* 6. 显卡长度 / 厚度 */
  if (p.gpu.len > 0 && p.gpu.len > p.chassis.maxGpu) {
    err(['gpu', 'chassis'], `显卡太长：${p.gpu.name} 长 ${p.gpu.len}mm，机箱限长 ${p.chassis.maxGpu}mm，差 ${p.gpu.len - p.chassis.maxGpu}mm。`);
  }
  if (p.gpu.slots > 0 && p.gpu.slots > p.chassis.slots) {
    err(['gpu', 'chassis'], `显卡太厚：${p.gpu.name} 要占 ${p.gpu.slots} 个槽位，${p.chassis.name} 只有 ${p.chassis.slots} 个。`);
  }

  /* 7. 显卡 PCIe 版本降速 */
  if (p.gpu.pcie === '5.0' && p.board.pcie !== '5.0') {
    warn(['gpu', 'board'], `显卡跑在 PCIe ${p.board.pcie} 上：${p.board.name} 的显卡槽不是 5.0，实测损失通常在 2%～5%，不用太慌。`);
  }

  /* 8. 散热器 */
  if (!p.cooler.sockets.includes(p.cpu.socket)) {
    err(['cooler', 'cpu'], `扣具不支持：${p.cooler.name} 没有 ${p.cpu.socket} 的扣具，装不上。`);
  }
  if (p.cooler.type === 'air') {
    if (p.cooler.height > p.chassis.maxCooler) {
      err(['cooler', 'chassis'], `风冷太高：散热 ${p.cooler.height}mm，机箱限高 ${p.chassis.maxCooler}mm，侧板盖不上。`);
    }
  } else if (!p.chassis.rads.includes(p.cooler.rad)) {
    err(['cooler', 'chassis'], `冷排装不下：${p.chassis.name} 不支持 ${p.cooler.rad} 排。`);
  }
  if (p.cpu.power > p.cooler.tdpLimit) {
    warn(['cooler', 'cpu'], `散热压不住：${p.cpu.name} 满载约 ${p.cpu.power}W，${p.cooler.name} 建议上限 ${p.cooler.tdpLimit}W，长时间会降频。`);
  }

  /* 9. 固态数量 / 速度 */
  if (state.ssdCount > p.board.m2) {
    err(['ssd', 'board'], `M.2 接口不够：${p.board.name} 只有 ${p.board.m2} 个 M.2，你插了 ${state.ssdCount} 条。`);
  }
  if (p.ssd.pcie === '5.0' && p.board.pcie !== '5.0') {
    tip(['ssd', 'board'], `固态跑不满：${p.ssd.name} 是 PCIe 5.0 盘，插在这块板上会降到 ${p.board.pcie} 速度，依然很快，只是没跑满。`);
  }

  /* 10. 核显点亮 */
  if (p.gpu.vram === 0 && !p.cpu.igpu) {
    err(['cpu', 'gpu'], `${p.cpu.name} 没有核显，不配独立显卡的话开机是黑屏的。`);
  }

  /* 11. 电源 */
  const power = Math.round(p.cpu.power + p.gpu.tdp + p.ram.cap * 0.4 + state.ssdCount * 8 + 50);
  const suggestPsu = Math.ceil((power * 1.25) / 50) * 50;
  if (p.psu.watts < power * 1.12) {
    err(['psu'], `电源带不动：估算满载 ${power}W，${p.psu.name}（${p.psu.watts}W）扛不住显卡的瞬时功耗尖峰，建议 ≥ ${suggestPsu}W。`);
  } else if (p.psu.watts < suggestPsu) {
    warn(['psu'], `电源偏紧：估算满载 ${power}W，建议上到 ${suggestPsu}W（留 25% 余量），高负载时更稳也更安静。`);
  } else if (p.psu.watts >= suggestPsu + 400) {
    tip(['psu'], `电源有点过剩（比推荐高 ${p.psu.watts - suggestPsu}W），不过留着以后升级显卡也不亏。`);
  }
  if (!p.chassis.psu.includes(p.psu.form)) {
    err(['psu', 'chassis'], `电源规格不符：${p.chassis.name} 只支持 ${p.chassis.psu.join(' / ')} 电源，你选的是 ${p.psu.form}。`);
  }
  if (!p.psu.modular && p.chassis.forms.length === 1) {
    warn(['psu', 'chassis'], `非模组电源在小机箱里是最难塞的东西，一坨多余的线要藏，建议换全模组。`);
  }

  /* 12. 风道 */
  if (power > 500 && p.chassis.rads.length === 0) {
    warn(['chassis'], `这套满载约 ${power}W，而 ${p.chassis.name} 不支持水冷排，务必把机箱风扇装满，否则热量全闷在箱子里。`);
  }

  /* 13. 瓶颈 */
  if (p.gpu.score - p.cpu.score >= 25) {
    warn(['cpu', 'gpu'], `CPU 拖后腿：${p.gpu.name} 的性能发挥不出来，同预算下更建议把 CPU 再升一档。`);
  } else if (p.cpu.score - p.gpu.score >= 30) {
    warn(['gpu', 'cpu'], `显卡偏弱：这颗 CPU 明显还有余力，预算允许的话显卡才是帧数的主要来源。`);
  }
  if (p.gpu.vram >= 16 && p.ram.cap < 32) {
    warn(['ram', 'gpu'], `显卡有 ${p.gpu.vram}GB 显存但内存只有 ${p.ram.cap}GB，建议升到 32GB 以上。`);
  }
  if (p.ram.cap >= 64 && p.cpu.score < 70) {
    warn(['ram', 'cpu'], `这么大的内存配这颗 U 有点浪费，除非你真的在跑本地大模型。`);
  }
  if (p.gpu.vram === 0) {
    tip(['gpu'], '纯核显配置：办公、写代码、轻度剪辑都够，3A 大作基本与你无关。');
  }

  /* ---------------- 价格 ---------------- */
  const items = [
    { label: SLOT_LABEL.cpu, name: p.cpu.name, price: p.cpu.price, base: p.cpu.base || p.cpu.price },
    { label: SLOT_LABEL.board, name: p.board.name, price: p.board.price, base: p.board.base || p.board.price },
    { label: SLOT_LABEL.gpu, name: p.gpu.name, price: p.gpu.price, base: p.gpu.base || p.gpu.price },
    { label: SLOT_LABEL.ram, name: p.ram.name, price: p.ram.price, base: p.ram.base || p.ram.price },
    { label: SLOT_LABEL.ssd, name: p.ssd.name + (state.ssdCount > 1 ? ` ×${state.ssdCount}` : ''), price: p.ssd.price * state.ssdCount, base: (p.ssd.base || p.ssd.price) * state.ssdCount },
    { label: SLOT_LABEL.cooler, name: p.cooler.name, price: p.cooler.price, base: p.cooler.base || p.cooler.price },
    { label: SLOT_LABEL.chassis, name: p.chassis.name, price: p.chassis.price, base: p.chassis.base || p.chassis.price },
    { label: SLOT_LABEL.psu, name: p.psu.name, price: p.psu.price, base: p.psu.base || p.psu.price }
  ];
  const total = items.reduce((s, i) => s + i.price, 0);
  const baseTotal = items.reduce((s, i) => s + i.base, 0);

  /* ---------------- 行情溢价 ---------------- */
  const premium = total - baseTotal;
  const premiumRate = baseTotal ? Math.round((premium / baseTotal) * 100) : 0;
  const hikes = items
    .map((i) => ({ label: i.label, name: i.name, diff: i.price - i.base, rate: i.base ? Math.round(((i.price - i.base) / i.base) * 100) : 0 }))
    .filter((h) => h.diff > 0)
    .sort((a, b) => b.diff - a.diff);
  const top = hikes[0];
  const market = {
    total, baseTotal, premium, premiumRate, hikes,
    level: premiumRate >= 60 ? '重度溢价' : premiumRate >= 35 ? '明显溢价' : premiumRate >= 15 ? '轻度溢价' : '价格正常',
    advice: !top
      ? '这套里没有处于涨价高位的配件，价格基本是常态价。'
      : premiumRate >= 60
        ? `整套比一年前要多花 ${money(premium)}，其中${top.label}一项就占了 ${money(top.diff)}。这个时间点装机确实吃亏，能等就等，不能等就先把预算压在${top.label === '内存' ? '16G 内存过渡' : '够用的档位'}上。`
        : premiumRate >= 35
          ? `现在买这套要比一年前多花 ${money(premium)}（+${premiumRate}%），${top.label}涨得最狠（+${top.rate}%）。不着急的话，${top.label === '内存' ? '内存可以先用 16G 顶着，等回落再补一条' : `${top.label}可以考虑降一档或看成色好的二手`}。`
          : premiumRate >= 15
            ? `有 ${hikes.length} 件配件比一年前贵了，合计多花 ${money(premium)}，属于可接受范围，该装就装。`
            : `这套的价格基本回到常态，只有${top.label}略高一点（+${top.rate}%）。`
  };
  /* 溢价不计入兼容性警告（避免和「装不起来」混在一起），单独在溢价模块展示 */

  /* ---------------- 帧数 / 电费 / 噪音 ---------------- */
  const cpuFactor = clamp(0.62 + p.cpu.score / 230, 0.62, 1);
  const fps = { fhd: 0, qhd: 0, uhd: 0 };
  if (p.gpu.score > 10) {
    const vramPenalty = (res) => {
      if (res === 'uhd') return p.gpu.vram >= 16 ? 1 : p.gpu.vram >= 12 ? 0.82 : 0.6;
      if (res === 'qhd') return p.gpu.vram >= 8 ? 1 : 0.8;
      return 1;
    };
    fps.fhd = Math.round(p.gpu.score * 3.4 * cpuFactor);
    fps.qhd = Math.round(p.gpu.score * 2.2 * cpuFactor * vramPenalty('qhd'));
    fps.uhd = Math.round(p.gpu.score * 1.2 * cpuFactor * vramPenalty('uhd'));
  }

  const kwh = Math.round(((power * GAME_HOURS + IDLE_WATTS * 6) * 365) / 1000);
  const yearlyCost = Math.round(kwh * POWER_PRICE);
  const loadRatio = (p.cpu.power + p.gpu.tdp) / Math.max(1, p.cooler.tdpLimit + p.gpu.tdp * 0.4);
  const noise = Math.round(p.cooler.noise + (loadRatio > 0.85 ? 7 : loadRatio > 0.7 ? 3 : 0) + (p.gpu.tdp > 320 ? 2 : 0));
  const cpuTemp = Math.round(clamp(42 + (p.cpu.power / p.cooler.tdpLimit) * 45 + (loadRatio - 1) * 10, 38, 102));

  let diff = 1;
  if (p.chassis.forms.length === 1) diff += 3;
  if (p.cooler.type === 'aio') diff += 2;
  if (p.gpu.slots >= 3) diff += 1;
  if (!p.psu.modular) diff += 1;
  if (p.chassis.forms.length === 1 && p.cooler.type === 'aio') diff += 1;
  const difficulty = diff <= 2
    ? { level: '新手友好', text: '照着说明书一步步来就行，一下午能搞定。' }
    : diff <= 4
      ? { level: '有点讲究', text: '需要规划走线和安装顺序，建议先看一遍装机视频。' }
      : diff <= 6
        ? { level: '老手专属', text: '空间紧张 + 水冷，装之前先把顺序想清楚。' }
        : { level: '地狱难度', text: 'ITX 塞水冷 + 非模组电源，装完你会想发朋友圈。' };

  /* ---------------- 评分 ---------------- */
  const ramScore = Math.min(100, 45 + p.ram.cap * 0.9 + (p.ram.type === 'DDR5' ? 8 : 0));
  const diskScore = Math.min(100, 55 + p.ssd.price / 12 + state.ssdCount * 6);
  const errCount = issues.filter((i) => i.level === 'err').length;
  const warnCount = issues.filter((i) => i.level === 'warn').length;
  let score = p.cpu.score * 0.35 + p.gpu.score * 0.45 + ramScore * 0.1 + diskScore * 0.1;
  score = score - errCount * 8 - warnCount * 2;
  score = clamp(Math.round(score), 0, 100);

  const idx = TITLES.findIndex((t) => score >= t.min);
  const t = TITLES[idx < 0 ? TITLES.length - 1 : idx];
  const tier = { name: t.name, quip: t.quip, tag: t.tag, color: TIER_COLOR[idx < 0 ? TIER_COLOR.length - 1 : idx] };
  const perThousand = +(score / (total / 1000)).toFixed(1);

  return {
    items, total, baseTotal, market, power, suggestPsu, issues, score, tier, perThousand, fps,
    kwh, yearlyCost, noise, cpuTemp, difficulty, cpuFactor,
    scenarios: scenariosOf(p.cpu, p.gpu, p.ram),
    parts: p
  };
}

function scenariosOf(cpu, gpu, ram) {
  const list = [];
  let game, ai, work;
  if (gpu.score >= 88) game = '4K 高画质流畅，光追也开得动';
  else if (gpu.score >= 72) game = '2K 高画质无压力';
  else if (gpu.score >= 55) game = '1080P 高画质 / 2K 中画质';
  else if (gpu.score >= 40) game = '1080P 中低画质，网游流畅';
  else game = '仅限网游与老游戏，建议加张独显';
  list.push({ icon: '🎮', name: '3A 游戏', text: game });

  if (gpu.vram >= 24) ai = `可本地跑 70B 级量化模型（${gpu.vram}GB 显存）`;
  else if (gpu.vram >= 16) ai = '14B–32B 量化模型推理流畅';
  else if (gpu.vram >= 8) ai = '7B 量化模型可用，更大的要走内存';
  else ai = ram.cap >= 64 ? '显存太小，只能靠大内存跑 CPU 推理，速度偏慢' : '本地大模型基本不可用';
  list.push({ icon: '🤖', name: '本地 AI', text: ai });

  if (cpu.score >= 85) work = '8K 素材剪辑、大规模编译渲染都轻松';
  else if (cpu.score >= 65) work = '视频剪辑与代码编译流畅';
  else if (cpu.score >= 45) work = '日常办公、轻度剪辑够用';
  else work = '轻办公与文档处理';
  list.push({ icon: '🛠️', name: '生产力', text: work });

  return list;
}

/* 每个配件的兼容状态 */
function catStatus(issues, cat) {
  let s = 'ok';
  issues.forEach((i) => {
    if (!i.cats.includes(cat)) return;
    if (i.level === 'err') s = 'err';
    else if (i.level === 'warn' && s !== 'err') s = 'warn';
  });
  return s;
}

function render() {
  const r = evaluate();
  lastResult = r;
  renderCategories(r);
  renderSummary(r);
}

/* ---------------- 预设 & 随机 ---------------- */

function applyPreset(id) {
  const p = PRESETS.find((x) => x.id === id);
  Object.assign(state, p.build);
  render();
  toast(`已切换到「${p.name}」`);
}

function randomBuild() {
  for (let attempt = 0; attempt < 600; attempt++) {
    const pick = (cat) => PARTS[cat][Math.floor(Math.random() * PARTS[cat].length)].id;
    Object.assign(state, {
      cpu: pick('cpu'), board: pick('board'), gpu: pick('gpu'), ram: pick('ram'),
      ssd: pick('ssd'), cooler: pick('cooler'), chassis: pick('chassis'), psu: pick('psu'),
      ssdCount: 1
    });
    const r = evaluate();
    if (!r.issues.some((i) => i.level === 'err')) { render(); toast('随机到一台能亮的机器'); return; }
  }
  render();
  toast('随机组合都没找到完美方案，已显示最后一次尝试');
}

/* ---------------- 配置分享链接 ---------------- */

function encodeBuild() {
  return CATEGORY_ORDER.map((cat) => PARTS[cat].findIndex((p) => p.id === state[cat]).toString(36)).join('') + state.ssdCount;
}

function decodeBuild(code) {
  if (!code || code.length !== CATEGORY_ORDER.length + 1) return false;
  const chars = code.split('');
  const next = {};
  for (let k = 0; k < CATEGORY_ORDER.length; k++) {
    const part = PARTS[CATEGORY_ORDER[k]][parseInt(chars[k], 36)];
    if (!part) return false;
    next[CATEGORY_ORDER[k]] = part.id;
  }
  const cnt = Number(chars[CATEGORY_ORDER.length]);
  if (!(cnt >= 1 && cnt <= 4)) return false;
  next.ssdCount = cnt;
  Object.assign(state, next);
  return true;
}

function shareLink() {
  const base = location.href.split('#')[0];
  const url = `${base}#b=${encodeBuild()}`;
  const done = () => toast('链接已复制，发给朋友就是同款配置');
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => toast(url));
  else toast(url);
}

/* ---------------- 装机引导 ---------------- */

let guideStep = 0;
function openGuide(r) {
  guideStep = 0;
  document.getElementById('guideModal').classList.add('show');
  drawGuide(r);
}

function drawGuide(r) {
  const box = document.getElementById('guideBody');
  const step = BUILD_STEPS[guideStep];
  const part = step.key === 'boot' ? null : r.parts[step.key];
  const isLast = guideStep === BUILD_STEPS.length - 1;
  const progress = ((guideStep + 1) / BUILD_STEPS.length) * 100;

  box.innerHTML = `
    <div class="guide-bar"><i style="width:${progress}%"></i></div>
    <div class="guide-head">
      <span class="guide-step">STEP ${guideStep + 1} / ${BUILD_STEPS.length}</span>
      <b>${step.title}</b>
    </div>
    <div class="guide-stage ${step.key}">
      <div class="guide-emoji">${SLOT_ICON[step.key] || '⚡'}</div>
      ${part ? `<p class="guide-part">${part.name}</p>` : '<p class="guide-part">接好显示器、键鼠、电源线</p>'}
    </div>
    <p class="guide-text">${step.text}</p>
    <p class="guide-tip"><span>TIPS</span>${step.tip}</p>
    ${isLast ? bootScreen(r) : ''}
    <div class="guide-actions">
      <button id="gPrev" ${guideStep === 0 ? 'disabled' : ''}>上一步</button>
      ${isLast ? '<button id="gBoot" class="primary">按下开机键</button>'
        : '<button id="gNext" class="primary">下一步 →</button>'}
    </div>
  `;

  const prev = document.getElementById('gPrev');
  const next = document.getElementById('gNext');
  if (prev) prev.onclick = () => { guideStep--; drawGuide(r); };
  if (next) next.onclick = () => { guideStep++; drawGuide(r); };
  const boot = document.getElementById('gBoot');
  if (boot) boot.onclick = () => runBoot(r);
}

function bootScreen(r) {
  return `<div class="boot" id="bootScreen">
    <div class="boot-lines" id="bootLines"></div>
    <div class="boot-light"><i></i><i></i><i></i><i></i></div>
  </div>`;
}

const BOOT_LINES = [
  'AMI BIOS 2026 · 正在检测 CPU …',
  `CPU: ${'${cpu}'}`,
  'Memory Test : Passed',
  'Detecting IDE / NVMe Devices …',
  'PCIe Device : GPU Found',
  'RGB Controller : Online（灯，亮了）',
  'All tests passed. Booting system …',
  '滴 ——'
];

function runBoot(r) {
  const lines = document.getElementById('bootLines');
  const screen = document.getElementById('bootScreen');
  const btn = document.getElementById('gBoot');
  if (!lines) return;
  btn.disabled = true;
  lines.innerHTML = '';
  let i = 0;
  const timer = setInterval(() => {
    const raw = BOOT_LINES[i].replace('${cpu}', r.parts.cpu.name);
    const div = document.createElement('p');
    div.textContent = raw;
    div.className = 'boot-line';
    lines.appendChild(div);
    i++;
    if (i >= BOOT_LINES.length) {
      clearInterval(timer);
      screen.classList.add('on');
      const done = document.createElement('p');
      done.className = 'boot-done';
      done.textContent = `🎉 点亮成功 · ${r.tier.name} · 战斗力 ${r.score}/100`;
      lines.appendChild(done);
      btn.textContent = '再来一次';
      btn.disabled = false;
      btn.onclick = () => { lines.innerHTML = ''; screen.classList.remove('on'); runBoot(r); };
    }
  }, 420);
}

  g.font = F('', 23); g.fillText(r.tier.quip, 92, 288);
  g.textAlign = 'right';

  y += 26;
  if (r.fps.fhd) {
    [['1080P', r.fps.fhd, 240], ['2K', r.fps.qhd, 180], ['4K', r.fps.uhd, 120]].forEach(([label, val, max]) => {
      g.fillStyle = '#64748b'; g.font = F('', 20);
      g.fillText(label, 60, y + 26);
      g.fillStyle = 'rgba(255,255,255,0.07)';
      g.fillRect(160, y + 8, 520, 20);
      g.fillStyle = th.main;
      g.fillRect(160, y + 8, Math.max(4, (val / max) * 520), 20);
      g.fillStyle = '#e2e8f0'; g.font = F('bold', 21);
      g.fillText(`${val} fps`, 704, y + 27);
      y += 42;
    });
  } else {
    g.fillStyle = '#64748b'; g.font = F('', 20);
    g.fillText('核显配置 · 帧数就别为难它了', 60, y + 26);
    y += 42;
  }

  // 清单
  y += 26;
  r.items.forEach((it) => {
    g.fillStyle = 'rgba(255,255,255,0.04)';
    g.fillRect(60, y - 40, 780, 66);
    g.fillStyle = '#8895ab'; g.font = F('', 19);
    g.fillText(it.label, 84, y);
    g.fillStyle = '#e2e8f0'; g.font = F('bold', 25);
    let name = it.name;
    while (g.measureText(name).width > 430 && name.length > 4) name = name.slice(0, -2) + '…';
    g.fillText(name, 200, y);
    g.fillStyle = th.main; g.font = F('bold', 25);
    const pw = g.measureText(money(it.price)).width;
    g.fillText(money(it.price), 800 - pw, y);
    y += 78;
  });

  // 底部
  y += 16;
  g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(60, y, 780, 2);
  y += 58;
  g.font = F('', 22); g.fillStyle = '#8b97ad';
  g.fillText(`满载约 ${r.power}W · 年耗电 ${r.kwh} 度（约 ${money(r.yearlyCost)}） · 噪音约 ${r.noise}dB`, 60, y);
  y += 40;
  g.fillText(`性价比 ${r.perThousand} 分/千元 · 装机难度：${r.difficulty.level}`, 60, y);
  y += 42;
  g.font = F('bold', 22); g.fillStyle = '#fb923c';
  g.fillText(`行情溢价 +${money(r.market.premium)}（+${r.market.premiumRate}%）· 一年前这套约 ${money(r.baseTotal)}`, 60, y);
  y += 78;
  g.font = F('bold', 64); g.fillStyle = th.main;
  const totalW = g.measureText(money(r.total)).width;
  g.fillText(money(r.total), 60, y);
  g.font = F('', 22); g.fillStyle = '#5f6b80';
  g.fillText('← 一年前 ' + money(r.baseTotal), 80 + totalW, y);
  g.fillText('价格为 2026-10 行情价，实际以商店为准', 60, y + 44);

  return cv;
}

function openCard(r) {
  cardTheme = 0;
  document.getElementById('cardModal').classList.add('show');
  refreshCard(r);
}

function refreshCard(r) {
  const cv = drawCard(r, cardTheme);
  const url = cv.toDataURL('image/png');
  document.getElementById('cardImg').src = url;
  document.getElementById('themeSwitch').innerHTML = CARD_THEMES
    .map((t, i) => `<button class="theme-btn ${i === cardTheme ? 'on' : ''}" data-i="${i}" style="--c:${t.main}">${t.name}</button>`)
    .join('');
  document.getElementById('themeSwitch').querySelectorAll('.theme-btn').forEach((b) => {
    b.onclick = () => { cardTheme = Number(b.dataset.i); refreshCard(r); };
  });
  document.getElementById('btnDownload').disabled = true;
  document.getElementById('btnDownload').textContent = '安装后可下载图片';
  document.getElementById('btnDownload').onclick = () => {
    const a = document.createElement('a');
    a.download = `装机配置单-${r.score}分-${CARD_THEMES[cardTheme].id}.png`;
    a.href = url; a.click();
  };
}

function copyList(r) {
  const lines = [
    '【装机配置单 · 装机模拟器】',
    ...r.items.map((i) => `${i.label}：${i.name}  ${money(i.price)}`),
    `总价：${money(r.total)}（一年前约 ${money(r.baseTotal)}，行情溢价 +${money(r.market.premium)} / +${r.market.premiumRate}%）`,
    `溢价构成：${r.market.hikes.length ? r.market.hikes.map((h) => `${h.label} +${money(h.diff)}`).join('，') : '无'}`,
    `战斗力：${r.score}/100（${r.tier.name}） — ${r.tier.quip}`,
    r.fps.fhd ? `帧数预估：1080P ${r.fps.fhd} / 2K ${r.fps.qhd} / 4K ${r.fps.uhd} fps` : '帧数预估：核显配置',
    `满载功耗：${r.power}W · 年耗电约 ${r.kwh} 度（${money(r.yearlyCost)}）`,
    `装机难度：${r.difficulty.level}`,
    ...r.scenarios.map((s) => `${s.name}：${s.text}`)
  ].join('\n');
  const btn = document.getElementById('btnCopy');
  const done = () => { btn.textContent = '已复制 ✓'; setTimeout(() => (btn.textContent = '复制文字清单'), 1600); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = lines; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(lines).then(done, fallback);
  else fallback();
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
