<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务线</title><style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e6eaf2;
    --text:#24292f; --muted:#5b616b;
    --primary:#4763de; --primary-soft:#eef1fe;
    --green:#2ea86f; --green-soft:#e7f7ef;
    --red:#e5484d; --red-soft:#fdebec;
    --amber:#e5a13a; --focus-soft:#fdf3e2; --focus-border:#ecd9ae;
    --shadow:0 2px 10px rgba(36,41,47,.06);
    --radius:12px;
    --dot:#dfe5f0; --chk-border:#b8c2d0;
    --task-border:#d7dfeb; --green-border:#b8d8c6;
    --center-bg:#24292f; --center-text:#ffffff;
    --indent-w:22px;   /* 列表每层缩进宽度（窄屏会自动收窄，见下方 @media） */
    /* 长期任务专属配色（♾）：靛紫，与完成(绿)/今日处理(琥珀)区分开 */
    --long:#7c5cff; --long-soft:#f2eeff; --long-border:#c9bcff;
    /* 主色实心块上的文字色。深色模式下主色会被提亮（见各 body.dark 块），
       白字压在亮主色上只有 2.2~3.3:1，远低于 WCAG AA 的 4.5:1 —— 改用深墨色。 */
    --on-primary:#ffffff;
    /* 实心色块（绿勾 / 琥珀徽标 / 红删除 / 主色圆钮）上的文字与符号：
       白字压这些颜色只有 1.6~3.9:1，浅色模式下也不达标，统一改用深墨 #10131a（>=4.75:1）。*/
    --on-solid:#10131a;
  }
  /* ===== 深色模式：同一套 CSS 变量，整体反转 ===== */
  body.dark{
    --bg:#14171d; --card:#1e222b; --line:#2d323d;
    --text:#e6e9f0; --muted:#98a1b0;
    --primary:#7d94ff; --primary-soft:#232c47;
    --green:#34b37a; --green-soft:#1c3229;
    --red:#e5484d; --red-soft:#3a2326;
    --amber:#e5a13a; --focus-soft:#332a18; --focus-border:#5c4d26;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --dot:#232936; --chk-border:#4a5261;
    --task-border:#39404d; --green-border:#2c5540;
    --center-bg:#e6e9f0; --center-text:#14171d;
    --long:#a78bfa; --long-soft:#241f3a; --long-border:#4b3f80;
    --on-primary:#10131a; --on-solid:#10131a;
  }
  /* ===== 配色方案 =====
     五套主色，通过 body[data-scheme] 挂载。每套都定义浅色 + 深色，
     与 body.dark 组合生效，所以"配色 × 明暗"共 10 种组合都协调。
     变量含义与上方 :root / body.dark 完全一致，切换无需改动任何组件样式。 */
  /* ① 靛蓝 Indigo（默认）：冷静专业，蓝紫调 */
  body[data-scheme="indigo"]{
    --bg:#f4f6fb; --card:#ffffff; --line:#e6eaf2;
    --text:#24292f; --muted:#5b616b;
    --primary:#4763de; --primary-soft:#eef1fe;
    --green:#2ea86f; --green-soft:#e7f7ef;
    --red:#e5484d; --red-soft:#fdebec;
    --amber:#e5a13a; --focus-soft:#fdf3e2; --focus-border:#ecd9ae;
    --shadow:0 2px 10px rgba(36,41,47,.06);
    --dot:#dfe5f0; --chk-border:#b8c2d0;
    --task-border:#d7dfeb; --green-border:#b8d8c6;
    --center-bg:#24292f; --center-text:#ffffff;
    --long:#7c5cff; --long-soft:#f2eeff; --long-border:#c9bcff;
  }
  body.dark[data-scheme="indigo"]{
    --bg:#14171d; --card:#1e222b; --line:#2d323d;
    --text:#e6e9f0; --muted:#98a1b0;
    --primary:#7d94ff; --primary-soft:#232c47;
    --green:#34b37a; --green-soft:#1c3229;
    --red:#e5484d; --red-soft:#3a2326;
    --amber:#e5a13a; --focus-soft:#332a18; --focus-border:#5c4d26;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --dot:#232936; --chk-border:#4a5261;
    --task-border:#39404d; --green-border:#2c5540;
    --center-bg:#e6e9f0; --center-text:#14171d;
    --long:#a78bfa; --long-soft:#241f3a; --on-primary:#10131a; --on-solid:#10131a; --long-border:#4b3f80;
  }
  /* ② 松绿 Forest：沉稳有力，青绿调 */
  body[data-scheme="forest"]{
    --bg:#f1f7f4; --card:#ffffff; --line:#dde9e2;
    --text:#1f2b26; --muted:#526459;
    --primary:#107b5f; --primary-soft:#e2f4ee;
    --green:#2a9d5c; --green-soft:#e3f5ea;
    --red:#d94b45; --red-soft:#fdeae8;
    --amber:#c98a24; --focus-soft:#fbf2dd; --focus-border:#e6d3a4;
    --shadow:0 2px 10px rgba(31,43,38,.07);
    --dot:#dce9e2; --chk-border:#a8c2b5;
    --task-border:#cfe0d7; --green-border:#a9d2b8;
    --center-bg:#1f2b26; --center-text:#ffffff;
    --long:#0e8a8a; --long-soft:#e0f2f2; --long-border:#a5d8d8;
  }
  body.dark[data-scheme="forest"]{
    --bg:#111a17; --card:#1a2521; --line:#2a3833;
    --text:#e4efe9; --muted:#93a89e;
    --primary:#35c79f; --primary-soft:#1b332b;
    --green:#3fb87c; --green-soft:#18322a;
    --red:#e0645e; --red-soft:#3a2321;
    --amber:#d9a13f; --focus-soft:#33290f; --focus-border:#5a4a1e;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --dot:#1f2d28; --chk-border:#465851;
    --task-border:#374740; --green-border:#2a5540;
    --center-bg:#e4efe9; --center-text:#111a17;
    --long:#3fb8b8; --long-soft:#14302f; --on-primary:#10131a; --on-solid:#10131a; --long-border:#2c5c5b;
  }
  /* ③ 暖阳 Amber：温暖亲和，琥珀橙调 */
  body[data-scheme="amber"]{
    --bg:#fdf7ef; --card:#ffffff; --line:#f0e4d4;
    --text:#33291f; --muted:#6a5c4c;
    --primary:#9e5c20; --primary-soft:#fdeee0;
    --green:#3f9455; --green-soft:#e6f4ea;
    --red:#d24b40; --red-soft:#fdeae7;
    --amber:#cf9410; --focus-soft:#fcf1da; --focus-border:#ebd9ac;
    --shadow:0 2px 10px rgba(51,41,31,.07);
    --dot:#f0e5d8; --chk-border:#cdbba4;
    --task-border:#e8dac7; --green-border:#b9d9bf;
    --center-bg:#33291f; --center-text:#ffffff;
    --long:#c0559b; --long-soft:#fbeaf5; --long-border:#e7bfd9;
  }
  body.dark[data-scheme="amber"]{
    --bg:#1c1712; --card:#261f19; --line:#3a3026;
    --text:#f0e6da; --muted:#ad9b88;
    --primary:#f5a55a; --primary-soft:#3a2a1a;
    --green:#5bb878; --green-soft:#1e3226;
    --red:#e8695d; --red-soft:#3b2420;
    --amber:#e0aa3a; --focus-soft:#3a2f10; --focus-border:#5f4d1d;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --dot:#2b231c; --chk-border:#584a3c;
    --task-border:#453930; --green-border:#2f5537;
    --center-bg:#f0e6da; --center-text:#1c1712;
    --long:#dd7cb8; --long-soft:#3a1f30; --on-primary:#10131a; --on-solid:#10131a; --long-border:#6b3355;
  }
  /* ④ 暮紫 Plum：优雅梦幻，紫罗兰调 */
  body[data-scheme="plum"]{
    --bg:#f7f3fa; --card:#ffffff; --line:#e7ddf1;
    --text:#2b2138; --muted:#61537a;
    --primary:#844bcb; --primary-soft:#f0e6fb;
    --green:#2f9e73; --green-soft:#e2f5ed;
    --red:#d5475e; --red-soft:#fde9ec;
    --amber:#cc9422; --focus-soft:#fbf2de; --focus-border:#e8d8a8;
    --shadow:0 2px 10px rgba(43,33,56,.07);
    --dot:#e8e0f0; --chk-border:#bfb0d0;
    --task-border:#dfd4ea; --green-border:#b3dcc6;
    --center-bg:#2b2138; --center-text:#ffffff;
    --long:#c2410c; --long-soft:#fcebe2; --long-border:#eec3ac;
  }
  body.dark[data-scheme="plum"]{
    --bg:#171220; --card:#211a2c; --line:#332842;
    --text:#ece4f5; --muted:#a294b5;
    --primary:#bb8af0; --primary-soft:#2f2244;
    --green:#48b98c; --green-soft:#1a3229;
    --red:#e0697d; --red-soft:#3a2028;
    --amber:#dfae42; --focus-soft:#362c10; --focus-border:#5e4d1e;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --dot:#251d31; --chk-border:#4e4260;
    --task-border:#3d3150; --green-border:#2b5544;
    --center-bg:#ece4f5; --center-text:#171220;
    --long:#e07a4a; --long-soft:#3a241a; --on-primary:#10131a; --on-solid:#10131a; --long-border:#6b4227;
  }
  /* ⑤ 石墨 Graphite：极简高级，石墨灰调（主色为克制的琥珀金） */
  body[data-scheme="graphite"]{
    --bg:#f6f6f7; --card:#ffffff; --line:#e4e4e7;
    --text:#22222a; --muted:#5e5e6a;
    --primary:#465163; --primary-soft:#eceef2;
    --green:#2f855a; --green-soft:#e4f1ea;
    --red:#c53030; --red-soft:#fbe8e8;
    --amber:#b7791f; --focus-soft:#f8f0dd; --focus-border:#e0cfa0;
    --shadow:0 2px 10px rgba(34,34,42,.07);
    --dot:#e3e3e8; --chk-border:#b4b4c0;
    --task-border:#dedee4; --green-border:#b0cfbe;
    --center-bg:#22222a; --center-text:#ffffff;
    --long:#6b46c1; --long-soft:#f0e9fa; --long-border:#c9b8e8;
  }
  body.dark[data-scheme="graphite"]{
    --bg:#151517; --card:#1f1f23; --line:#32323a;
    --text:#e8e8ec; --muted:#9d9daa;
    --primary:#aab8ca; --primary-soft:#2a2a32;
    --green:#48bb78; --green-soft:#1a2f22;
    --red:#f56565; --red-soft:#3a2020;
    --amber:#ecc94b; --focus-soft:#36300f; --focus-border:#5f541d;
    --shadow:0 2px 10px rgba(0,0,0,.45);
    --dot:#282830; --chk-border:#52525e;
    --task-border:#3d3d46; --green-border:#2b5440;
    --center-bg:#e8e8ec; --center-text:#151517;
    --long:#b794f4; --long-soft:#2c2340; --on-primary:#10131a; --on-solid:#10131a; --long-border:#4e3d73;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    transition:background .25s, color .25s;
  }
  .app{display:flex; flex-direction:column; height:100vh}

  /* 拖拽/平移期间全页禁用文本选中，松手即恢复正常选择 */
  body.dragging, body.dragging *{user-select:none !important; -webkit-user-select:none !important}
  /* 触摸设备上 pointerdown 不再无条件 preventDefault（否则捏合缩放被吃掉），
     长按会弹出系统选区菜单 —— 用 touch-callout 关掉，视觉选区由上面的 user-select 负责。 */
  .task-node, .node, .task, .line-item{-webkit-touch-callout:none}

  /* ===== 顶栏 ===== */
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:12px 18px; flex-wrap:wrap;
    position:relative; z-index:10;
  }
  .logo{display:flex; align-items:center; gap:10px; font-size:19px; font-weight:700}
  .logo .dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#4f6ef7,#8a5cf6)}
  .view-switch{display:flex; background:var(--bg); border-radius:999px; padding:3px}
  .view-switch button{
    border:none; background:none; color:var(--muted); cursor:pointer;
    padding:6px 14px; border-radius:999px; font-size:13px;
  }
  .view-switch button.on{background:var(--card); color:var(--primary); font-weight:600; box-shadow:var(--shadow)}
  header button.tool{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:6px 13px; border-radius:8px; cursor:pointer; font-size:13px;
    display:inline-flex; align-items:center; justify-content:center; line-height:1.4;
  }
  header button.tool:hover{background:var(--bg)}
  header button.tool.primary{background:var(--primary); color:var(--on-primary); border-color:var(--primary)}
  /* 深浅 / 配色两个图标按钮挨得近，给它们一点呼吸感 */
  header button.tool#btnTheme, header button.tool#btnScheme{min-width:40px; justify-content:center}
  /* 显示方式按钮：文本较长，限制宽度并省略，窄屏也不会把顶栏挤换行 */
  header button.tool#btnMapLayout{
    max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  header button.tool#btnMapLayout.on{border-color:var(--primary); color:var(--primary)}
  header .sync-badge{
    margin-left:auto; font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
    background:var(--bg); padding:6px 12px; border-radius:999px;
  }
  header .sync-badge .led{width:8px;height:8px;border-radius:50%;background:#2ea86f}

  /* 抽屉遮罩：桌面/平板不需要（侧栏常驻），窄屏才作为抽屉背景出现 */
  #drawerMask{display:none}
  /* 手机上的主线抽屉开关：桌面隐藏 */
  header button.tool#btnDrawer{display:none}
  @media (max-width:760px){ header button.tool#btnDrawer{display:inline-flex} }

  /* ===== 配色选择面板 ===== */
  header button.tool#btnScheme.on{border-color:var(--primary); color:var(--primary)}
  .scheme-pop{
    position:absolute; top:calc(100% + 8px); right:16px; z-index:60;
    width:280px; padding:12px; border-radius:14px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .scheme-pop-head{font-size:13px; font-weight:700; margin-bottom:9px; color:var(--text)}
  .scheme-list{display:flex; flex-direction:column; gap:6px}
  .scheme-item{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:8px 10px; border-radius:10px; cursor:pointer; text-align:left;
    border:1px solid transparent; background:var(--bg); color:var(--text);
  }
  .scheme-item:hover{border-color:var(--line)}
  .scheme-item.on{border-color:var(--primary); background:var(--primary-soft)}
  .scheme-item:focus-visible{outline:2px solid var(--primary); outline-offset:1px}
  /* 色卡预览：用该方案自己的变量渲染，所见即所得 */
  .scheme-swatches{
    flex:none; display:flex; border-radius:7px; overflow:hidden;
    border:1px solid rgba(0,0,0,.10); width:56px; height:30px;
  }
  .scheme-swatches i{flex:1}
  .scheme-name{font-size:13px; font-weight:600}
  .scheme-desc{font-size:11px; color:var(--muted); margin-top:1px}
  .scheme-check{margin-left:auto; font-size:14px; color:var(--primary); flex:none}
  .scheme-pop-foot{font-size:11px; color:var(--muted); margin-top:9px; text-align:center}

  /* ===== 思维导图视图 ===== */
  #mapView{position:relative; flex:1; min-height:0; display:flex; --tp-w:272px}
  /* touch-action 说明（移动端捏合缩放踩过坑）：
     原先这里是 none，把双指捏合手势整个吞掉 —— 导图画布在窄屏上几乎占满
     可视区（实测 339×743），于是手机上整页都放大不了。
     改成 pinch-zoom：浏览器接管"双指缩放"（页面级放大，正是用户要的），
     但不接管单指平移（不含 pan-x/pan-y），导图自己的 pointer 拖拽照常工作。
     捏合过程中浏览器会补发 pointercancel，endPan 已处理，不会卡在拖拽态。 */
  #mapSvg{flex:1; min-width:0; height:auto; display:block; cursor:grab; touch-action:pinch-zoom; background:
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0/26px 26px, var(--bg)}
  #mapSvg.panning{cursor:grabbing}

  /* ===== 今日处理面板（右侧大框，两视图共用，拖入任务专注今天） ===== */
  #todayPanel{
    width:272px; flex:none; align-self:stretch; margin:10px 10px 10px 0;
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:14px; display:flex; flex-direction:column; gap:10px;
    transition:border-color .2s, box-shadow .2s;
  }
  #todayPanel.in-list{margin:12px 12px 12px 0; height:auto}
  #todayPanel.drop-ready{border-style:dashed; border-color:var(--primary)}
  #todayPanel.drop-hot{border:2px solid var(--primary); box-shadow:0 0 0 4px var(--primary-soft)}
  .tp-head{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px}
  .tp-count{font-size:12px; color:var(--muted); background:var(--bg);
    border-radius:999px; padding:2px 9px; font-weight:400}
  .tp-hint{font-size:13px; color:var(--muted); line-height:1.9; background:var(--bg);
    border-radius:10px; padding:18px 10px; text-align:center}
  .tp-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px}
  .tp-item{display:flex; gap:8px; align-items:flex-start; background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:9px 10px}
  .tp-item.done{opacity:.6}
  .tp-check{width:20px; height:20px; border:2px solid var(--chk-border); border-radius:6px;
    flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--on-solid); font-size:13px; user-select:none}
  .tp-item.done .tp-check{background:var(--green); border-color:var(--green)}
  .tp-body{flex:1; min-width:0}
  .tp-title{font-size:14px; cursor:pointer; word-break:break-all}
  .tp-title:hover{color:var(--primary)}
  .tp-item.done .tp-title{text-decoration:line-through; color:var(--muted)}
  .tp-meta{font-size:11px; color:var(--muted); margin-top:3px}
  .tp-out{border:none; background:none; color:var(--muted); cursor:pointer;
    border-radius:6px; padding:2px 6px; font-size:13px}
  .tp-out:hover{color:var(--red); background:var(--red-soft)}
  .tp-clear{border:1px solid var(--line); background:var(--bg); color:var(--muted);
    border-radius:8px; padding:7px; cursor:pointer; font-size:12px}
  .tp-clear:hover{color:var(--red); background:var(--red-soft)}

  /* 拖拽时跟随鼠标的小卡片 */
  .drag-ghost{
    position:fixed; z-index:1000; pointer-events:none; max-width:220px;
    background:var(--card); color:var(--text); border:2px solid var(--primary);
    border-radius:10px; padding:8px 12px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.28); opacity:.92;
  }
  .map-tools{
    position:absolute; left:16px; bottom:16px; display:flex; flex-direction:column; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:8px; box-shadow:var(--shadow);
  }
  .map-tools button{
    width:36px; height:36px; border:none; background:var(--bg); border-radius:9px;
    cursor:pointer; font-size:16px; color:var(--text); line-height:1;
  }
  .map-tools button:hover{background:var(--primary-soft); color:var(--primary)}
  /* 显示方式切换：贴在缩放工具条正上方，只影响导图本身，不占用顶栏空间。
     缩放条实测高 142px（3×36 按钮 + 2×8 间距 + 16 内边距），bottom 取 158 留出间距与阴影 */
  .map-layout-btn{
    position:absolute; left:16px; bottom:168px; z-index:5;
    display:flex; align-items:center; gap:6px;
    max-width:min(190px, 42vw); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:12px; color:var(--text); cursor:pointer; box-shadow:var(--shadow);
  }
  .map-layout-btn:hover{border-color:var(--primary); color:var(--primary); background:var(--primary-soft)}
  .map-layout-btn.on{border-color:var(--primary); color:var(--primary); font-weight:600}
  /* 操作说明：可折叠卡片。默认展开（首次使用需要看到提示），
     折叠状态只存在本机 localStorage —— 属于"这台设备怎么看"的视图偏好，不进 settings 同步。
     right 要让开右侧「今日处理」面板（宽屏 272+10，窄屏 200+10），否则卡片会盖住面板内容。 */
  .map-legend{
    position:absolute; right:calc(var(--tp-w, 272px) + 20px); bottom:16px; z-index:5;
    width:290px; max-width:calc(100% - var(--tp-w, 272px) - 36px);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .map-legend-head{
    display:flex; align-items:center; gap:8px; width:100%;
    padding:9px 12px; background:transparent; border:none; cursor:pointer;
    font-size:12px; color:var(--text); text-align:left; line-height:1.2;
  }
  .map-legend-head:hover{background:var(--primary-soft); color:var(--primary)}
  .map-legend-head .lg-title{font-weight:600; flex:1}
  .map-legend-head .lg-arrow{
    font-size:11px; color:var(--muted); transition:transform .18s ease; flex:none;
  }
  .map-legend.open .map-legend-head .lg-arrow{transform:rotate(180deg)}
  .map-legend-body{
    padding:2px 14px 11px; font-size:12px; color:var(--muted); line-height:1.9;
    border-top:1px solid var(--line);
  }
  .map-legend:not(.open) .map-legend-body{display:none}
  .map-legend:not(.open){width:auto}
  .map-empty{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:var(--muted); font-size:15px; pointer-events:none;
  }
  .map-empty.show{display:flex}

  /* SVG 节点交互样式（颜色全部走主题变量，深色模式自动适配） */
  .node{cursor:pointer}
  /* 悬停按钮：出现要快、消失要慢（延迟 0.35s），给鼠标留足移过去的时间 */
  .node .hoverbtn{opacity:0; pointer-events:none; transition:opacity .45s ease .35s}
  .node:hover .hoverbtn{opacity:1; pointer-events:auto; transition:opacity .08s}
  /* 触屏设备没有"悬停"，按钮常显常可点 */
  @media (pointer:coarse){
    .node .hoverbtn{opacity:1; pointer-events:auto; transition:none}
  }
  .edge{fill:none; stroke-width:2.2}
  /* 折叠/展开按钮的圆底：原先硬编码 #fff，深色模式下变成"白圈 + 浅色主线色字"（≈2.3:1），
     等于按钮消失。跟随卡片底色，主线色描边与文字在两种模式下都清晰。 */
  .collapse-btn-bg{fill:var(--card)}
  .collapse-btn-txt{fill:var(--text)}
  /* 导图卡片信息行（倒计时 / 截止日期 / 参与方式）的默认文字色 */
  .info-text{fill:var(--muted)}
  .center-rect{fill:var(--center-bg)}
  .center-text{fill:var(--center-text)}
  .line-rect{fill:var(--card)}
  .muted-text{fill:var(--muted)}
  .task-rect{fill:var(--card); stroke:var(--task-border)}
  .chk{fill:var(--card); stroke:var(--chk-border)}
  .task-text{fill:var(--text)}
  .task-node.done .task-rect{fill:var(--green-soft); stroke:var(--green-border); stroke-dasharray:5 4}
  .task-node.done .chk{fill:var(--green); stroke:var(--green)}
  .task-node.done .task-text{fill:var(--muted)}
  /* 「今日处理」高亮：琥珀底 + 描边；已完成+高亮时保留绿色底仅换描边 */
  .task-node.focus .task-rect{fill:var(--focus-soft); stroke:var(--amber); stroke-width:2.5}
  .task-node.done.focus .task-rect{fill:var(--green-soft)}
  /* 长期任务 ♾：靛紫底 + 紫描边。放在上面两条之后 —— 长期身份是持久属性，
     优先级高于"今日处理"高亮（今日处理另有 ☀ 徽标表示）；已完成则保留绿底 + 紫描边 */
  .task-node.long .task-rect{fill:var(--long-soft); stroke:var(--long); stroke-width:2.5}
  .task-node.long.done .task-rect{fill:var(--green-soft); stroke:var(--long); stroke-width:2.5}

  /* ===== 列表视图 ===== */
  #listView{display:none; flex:1; min-height:0}

  /* ===== 日历视图 ===== */
  #calView{display:none; flex:1; min-height:0; position:relative}
  #calView .cal-wrap{
    flex:1; min-height:0; display:flex; flex-direction:column;
    padding:14px 16px; gap:10px;
  }
  .cal-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .cal-title{font-size:17px; font-weight:700; min-width:130px; text-align:center}
  .cal-nav{
    width:32px; height:32px; border:1px solid var(--line); background:var(--card);
    color:var(--text); border-radius:8px; cursor:pointer; font-size:17px; line-height:1;
  }
  .cal-nav:hover{background:var(--bg); border-color:var(--primary); color:var(--primary)}
  .cal-today, .cal-opt{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .cal-today:hover{background:var(--bg)}
  .cal-opt{display:flex; align-items:center; gap:6px; cursor:pointer}
  .cal-opt input{cursor:pointer}
  .cal-hint{font-size:12px; color:var(--muted); margin-left:auto}
  /* 星期表头：一~五为工作日，六日淡色 */
  .cal-week{
    display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px;
    font-size:12px; color:var(--muted); text-align:center;
  }
  .cal-week .we{color:var(--red); opacity:.75}
  /* 日期格子：固定行高，格子内部滚动，避免任务多时把整页撑开 */
  .cal-grid{
    flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr));
    grid-auto-rows:minmax(96px, 1fr); grid-template-rows:repeat(6, minmax(84px, 1fr));
    gap:6px; overflow:hidden; padding-right:2px;
  }
  .cal-cell{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:5px 6px; display:flex; flex-direction:column; gap:3px; min-height:0; overflow:hidden;
  }
  .cal-cell.out{opacity:.42; background:var(--bg)}
  .cal-cell.today{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset}
  .cal-cell.weekend .cal-day{color:var(--red)}
  .cal-day{font-size:12px; color:var(--muted); flex:none; display:flex; align-items:center; gap:4px}
  .cal-cell.today .cal-day{color:var(--primary); font-weight:700}
  /* 日历里的任务小条：主线色左边框 + 状态；可点、可双击编辑 */
  .cal-item{
    font-size:11.5px; line-height:1.35; padding:2px 5px; border-radius:6px;
    background:var(--bg); border-left:3px solid var(--primary); color:var(--text);
    cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none;
  }
  .cal-item:hover{background:var(--primary-soft)}
  .cal-item.done{opacity:.6; text-decoration:line-through; border-left-color:var(--green)}
  .cal-item.over{border-left-color:var(--red)}
  .cal-item.long{border-left-style:dashed}
  .cal-items{display:flex; flex-direction:column; gap:3px; min-height:0; overflow-y:auto}
  /* 滚动条只在格内出现，不喧宾夺主 */
  .cal-items::-webkit-scrollbar{width:4px}
  .cal-items::-webkit-scrollbar-thumb{background:var(--line); border-radius:2px}
  /* 右侧：没有截止日期的任务（含长期任务） */
  .cal-side{
    flex:none; max-height:26vh; display:flex; flex-direction:column;
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px;
  }
  .cal-side-head{font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px}
  .cal-side-head .count{
    font-size:11px; color:var(--muted); background:var(--bg);
    border-radius:999px; padding:1px 8px; font-weight:400;
  }
  .cal-side-list{flex:1; min-height:0; overflow-y:auto; margin-top:6px; display:flex; flex-wrap:wrap; gap:5px}
  .cal-side-foot{margin-top:7px; font-size:11px; color:var(--muted); line-height:1.6}
  @media (max-width:940px){
    .cal-wrap{padding:10px 10px; gap:8px}
    .cal-grid{grid-template-rows:repeat(6, minmax(76px, 1fr)); gap:4px}
    .cal-cell{padding:4px}
    .cal-hint{display:none}          /* 窄屏省掉提示，把空间留给格子 */
    .cal-side{max-height:20vh; padding:6px 10px}
    .cal-side-foot{display:none}    /* 长期任务说明让位给格子高度 */
  }
  @media (max-width:560px){
    .cal-title{font-size:15px; min-width:104px}
    .cal-today{padding:6px 9px; font-size:12px}
    .cal-opt{padding:6px 9px; font-size:12px}
    .cal-grid{grid-template-rows:repeat(6, minmax(68px, 1fr)); gap:3px}
    /* 窄屏格子只有 ~45px 宽，内边距和圆角尽量收紧，把空间留给任务文字 */
    .cal-cell{padding:3px 2px; gap:2px; border-radius:7px}
    .cal-day{padding-left:2px; font-size:11px}
    .cal-item{font-size:11px; padding:1px 3px; border-radius:4px; border-left-width:2px}
    .cal-week{font-size:11px; gap:3px}
  }
  .layout{display:flex; flex:1; min-height:0}
  aside{
    width:260px; background:var(--card); border-right:1px solid var(--line);
    padding:16px 12px; display:flex; flex-direction:column; gap:8px; overflow-y:auto;
  }
  aside h2{font-size:13px; color:var(--muted); font-weight:600; padding:0 10px 4px;
    display:flex; justify-content:space-between; align-items:center}
  aside h2 .count{font-weight:400}
  .line-item{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-radius:10px; cursor:pointer; transition:background .15s;
  }
  .line-item:hover{background:var(--bg)}
  .line-item.active{background:var(--primary-soft); color:var(--primary); font-weight:600}
  .line-item .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .line-item .mini{font-size:12px; color:var(--muted)}
  .line-item .del{
    border:none; background:none; color:var(--muted); cursor:pointer;
    font-size:14px; padding:2px 4px; border-radius:6px; opacity:0;
  }
  .line-item:hover .del{opacity:1}
  .line-item .del:hover{color:var(--red); background:var(--red-soft)}
  /* 删除按钮放大到 30px 热区（原来 19×23，鼠标也偏小），
     行高靠 padding 吸收，不会撑高主线行 */
  .line-item .del{width:30px; height:30px; display:flex; align-items:center; justify-content:center}
  .add-line{display:flex; gap:6px; margin-top:4px}
  .add-line input{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13px; outline:none; background:var(--bg); color:var(--text);
  }
  .add-line input:focus{border-color:var(--primary)}
  .btn{
    border:none; background:var(--primary); color:var(--on-primary); border-radius:8px;
    padding:8px 12px; cursor:pointer; font-size:13px;
  }
  .btn:hover,.add-line button:hover{filter:brightness(1.08)}

  main{flex:1; padding:22px 26px; overflow:hidden; display:flex; flex-direction:column}
  .main-head{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
  .main-head h1{font-size:22px}
  .main-head .stat{font-size:13px; color:var(--muted)}
  .filters{margin-left:auto; display:flex; gap:6px}
  .filters button{
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:5px 12px; border-radius:999px; cursor:pointer; font-size:12px;
  }
  .filters button.on{background:var(--primary); color:var(--on-primary); border-color:var(--primary)}
  .task-input{display:flex; gap:8px; margin-bottom:18px}
  .task-input .big-add{
    flex:1; padding:13px; font-size:14px; background:var(--card);
    color:var(--primary); border:1px dashed var(--primary); border-radius:10px;
  }
  .task-input .big-add:hover{background:var(--primary-soft)}
  .task-input input{
    flex:1; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:15px; outline:none; background:var(--card);
  }
  .task-input input:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}

  /* ===== 任务树（任意深度嵌套） ===== */
  .tree-bar{display:flex; align-items:center; gap:8px; padding:0 2px 8px; flex-wrap:wrap}
  .tool.small{font-size:12px; padding:5px 10px}
  .tree-tip{font-size:12px; color:var(--muted)}
  .crumb{
    display:none; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:12px; color:var(--muted); background:var(--card);
    border:1px dashed var(--line); border-radius:10px; padding:7px 10px; margin-bottom:8px;
  }
  .crumb.show{display:flex}
  .crumb b{color:var(--text); font-weight:600}
  .crumb .seg{cursor:pointer; padding:2px 6px; border-radius:6px; white-space:nowrap}
  .crumb .seg:hover{background:var(--primary-soft); color:var(--primary)}
  .crumb .sep{opacity:.5}

  .task-scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative}
  .task-list{position:relative}
  .task{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 14px; box-shadow:var(--shadow); transition:opacity .2s;
    height:52px; box-sizing:border-box; position:absolute; left:0; right:0;
    /* 行内任何内容都不得溢出到相邻行/视口外。
       .title 与 .chips 各自有 ellipsis/overflow，但 chips 的子项是 inline 元素，
       在 flex 收缩到很窄时仍会算出超出父盒的 rect —— 这里兜底裁掉。 */
    overflow:hidden;
  }
  .task.sel{outline:2px solid var(--primary); outline-offset:-2px}
  .task .indent{flex:none; align-self:stretch; border-left:2px dotted var(--line); margin-right:-4px; opacity:.5}
  .task .caret{
    flex:none; width:20px; height:20px; border:none; background:transparent; cursor:pointer;
    color:var(--muted); font-size:11px; line-height:20px; text-align:center; border-radius:5px;
  }
  .task .caret:hover{background:var(--bg); color:var(--primary)}
  .task .caret.empty{cursor:default; opacity:0}
  .task .caret .cnt{font-size:10px; opacity:.8}
  .task.dragging{opacity:.4}
  .drop-line{position:absolute; left:0; right:0; height:2px; background:var(--primary); z-index:5; pointer-events:none}
  .drop-line .dot{position:absolute; left:0; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--primary)}
  .task.done{opacity:.62}
  /* 「今日处理」高亮：琥珀色底 + 边框 + 左侧竖条，仅靠 task.focus 成员关系驱动 */
  .task.focus{
    background:var(--focus-soft); border-color:var(--focus-border);
    box-shadow:inset 4px 0 0 var(--amber), var(--shadow);
  }
  /* 长期任务 ♾：靛紫底 + 紫色虚线边框（不改 box-shadow，今日处理的琥珀竖条仍能同时显示） */
  .task.long{background:var(--long-soft); border-color:var(--long-border); border-style:dashed}
  .task.long .chip.long{color:var(--long); background:var(--long-soft);
    border:1px solid var(--long-border); font-weight:600}
  .task.focus .ops .td{color:#c07f10; background:rgba(229,161,58,.18); font-weight:600}
  body.dark .task.focus .ops .td{color:#e5a13a}
  .task .check{
    width:22px; height:22px; border:2px solid var(--chk-border); border-radius:7px;
    cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center;
    color:var(--on-solid); font-size:14px; user-select:none;
  }
  .task .check:hover{border-color:var(--green)}
  .task.done .check{background:var(--green); border-color:var(--green)}
  /* 标题单行显示 + 省略号；chips 可压缩，避免深层嵌套时文字被挤成竖排。
     min-width:0 是关键 —— flex 子项默认 min-width:auto，不加的话
     chips 内容宽度会撑破 .task 的 overflow:hidden，在窄屏露出半个标签。 */
  .task .title{flex:1 1 140px; min-width:70px; font-size:15px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .task .chips{flex:0 1 auto; min-width:0; max-width:100%; display:flex; gap:6px; align-items:center; overflow:hidden; white-space:nowrap}
  .task .ops .sub,.task .ops .in,.task .ops .out{padding:4px 7px; font-size:13px}
  .task .chip{font-size:12px; color:var(--muted); background:var(--bg);
    padding:3px 9px; border-radius:999px; white-space:nowrap}
  .task .chip.over{color:var(--red); background:var(--red-soft); font-weight:600}
  .task .chip.urgent{color:#c07f10; background:rgba(229,161,58,.18); font-weight:600}
  .task.done .chip.over, .task.done .chip.urgent{color:var(--muted); background:var(--bg); font-weight:400}
  .task.done .title{text-decoration:line-through; color:var(--muted)}
  .task .time{font-size:12px; color:var(--muted); flex:none; display:none}
  @media (min-width:1180px){ .task .time{display:inline} }
  .task .ops{display:flex; gap:4px; flex:none}
  .task .ops button{
    border:none; background:none; cursor:pointer; font-size:13px;
    color:var(--muted); padding:4px 8px; border-radius:6px;
  }
  .task .ops button:hover{background:var(--bg)}
  .task .ops .del:hover{color:var(--red); background:var(--red-soft)}
  .task .ops .save:hover{color:var(--green); background:var(--green-soft)}

  /* ===== 窄屏适配：任务行是固定 52px 高、不能换行（虚拟滚动按行高定位），
         只能靠"压缩 + 让位"保证操作按钮（尤其 🗑 删除）始终完整可见、点得到 ===== */
  @media (max-width:1180px){
    :root{--indent-w:16px}
    .task{gap:6px; padding:10px 10px}
    .task .title{min-width:56px}
    .task .ops{gap:2px}
    .task .ops button{padding:4px 5px}
    .task .ops .sub,.task .ops .in,.task .ops .out{padding:4px 4px}
  }
  @media (max-width:940px){
    :root{--indent-w:12px}
    /* 窄屏时「侧栏(260) + 今日处理面板(272)」会把任务列挤到只剩 200 多像素，
       六个按钮根本放不下。改成：主线列表仍在左侧，任务列表在右上，
       「今日处理」落到任务列表下方（仍可拖入任务）——按钮一个都不用隐藏 */
    .layout{
      display:grid; grid-template-columns:260px minmax(0,1fr);
      grid-template-rows:minmax(0,1fr) auto;
      grid-template-areas:"side main" "side panel";
    }
    aside{grid-area:side; width:auto}
    main{grid-area:main; padding:14px 12px; min-height:0}
    #todayPanel.in-list{grid-area:panel; width:auto; height:30vh; min-height:140px; margin:0 12px 12px}
  }
  @media (max-width:760px){
    /* 手机：主线列表已变成抽屉（fixed 脱离文档流），下方只排 任务列表 + 今日处理 */
    .layout{display:flex; flex-direction:column}
    #todayPanel.in-list{height:26vh; min-height:130px}
  }
  @media (max-width:560px){
    /* 手机再挤一点：按钮和内边距收紧，把宽度让给任务标题 */
    .task{gap:5px; padding:10px 8px}
    .task .caret{width:16px}
    .task .ops button{padding:4px 3px; font-size:12px}
  }
  .task input.edit{
    flex:1; font-size:15px; border:2px solid var(--primary); border-radius:8px;
    padding:6px 10px; outline:none; background:var(--bg); color:var(--text);
  }
  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--text); color:var(--bg); padding:10px 20px; border-radius:10px;
    font-size:13px; opacity:0; transition:all .3s; z-index:99; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* 弹窗 */
  /* 小屏 / 矮窗口时弹窗可能超出屏幕，遮罩可滚动 + dialog 上下留白，保证按钮始终点得到 */
  .mask{position:fixed; inset:0; background:rgba(20,24,32,.45); display:none;
    align-items:center; justify-content:center; z-index:50; overflow-y:auto; padding:16px}
  .mask.show{display:flex}
  .dialog{background:var(--card); border-radius:16px; padding:24px; width:min(520px,90vw);
    box-shadow:0 12px 40px rgba(0,0,0,.2); margin:auto}
  .dialog h3{margin-bottom:10px}
  .dialog p{color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:12px}
  .dialog textarea{width:100%; height:180px; border:1px solid var(--line);
    border-radius:8px; padding:10px; font-size:12px; font-family:Consolas,monospace;
    margin-bottom:12px; background:var(--bg); color:var(--text)}
  .dialog input[type=text]{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; font-size:15px; outline:none; margin-bottom:14px;
    background:var(--bg); color:var(--text);
  }
  .dialog input[type=text]:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}
  .dlg-label{display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; font-weight:600}
  .due-row{display:flex; gap:8px}
  .due-row input[type=date]{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    background:var(--bg); color:var(--text); font-size:14px; outline:none;
  }
  .due-row input[type=date]:focus{border-color:var(--primary)}
  .scope-switch{display:flex; background:var(--bg); border-radius:999px; padding:3px; gap:2px}
  .scope-switch button{
    flex:1; border:none; background:none; padding:8px 0; cursor:pointer;
    border-radius:999px; font-size:13px; color:var(--muted);
  }
  .scope-switch button.on{background:var(--card); color:var(--primary); font-weight:600; box-shadow:var(--shadow)}
  /* 长期任务开关：选中时用长期任务的专属紫，和普通开关区分开 */
  .scope-switch#longSwitch button.on{color:var(--long)}
  .dlg-tip{font-size:12px; color:var(--muted); line-height:1.7; margin-top:7px}
  .dlg-tip b{color:var(--long)}
  .dialog .row{display:flex; gap:8px; justify-content:flex-end}
  .btn.ghost{background:var(--card); color:var(--text); border:1px solid var(--line)}
  .btn.green{background:var(--green)}
  .btn.danger{background:#e5484d}

  /* ===== 登录弹窗 ===== */
  .auth-dialog{width:min(420px,92vw)}
  .auth-logo{display:flex; align-items:center; gap:8px; font-size:20px; font-weight:700;
    justify-content:center; margin-bottom:14px}
  .auth-logo .dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#4f6ef7,#8a5cf6)}
  .auth-dialog h3{text-align:center}
  .auth-dialog p{text-align:center}
  .auth-code-row{display:flex; gap:8px}
  .auth-code-row input{flex:1}
  .auth-code-row button{white-space:nowrap}
  .auth-err{color:var(--red); font-size:12px; min-height:18px; margin:-6px 0 4px; padding-left:2px}
  .auth-submit{width:100%; padding:12px; font-size:15px; margin-top:8px}
  .auth-wx{width:100%; padding:11px; font-size:14px; margin-top:8px; background:#09bb07}
  .auth-skip{text-align:center; color:var(--muted); font-size:13px; margin-top:14px;
    cursor:pointer; text-decoration:underline}
  .auth-skip:hover{color:var(--primary)}
  .auth-user-tip{font-size:13px}
  /* 自动登录开关：开关本体 + 说明文字，整行可点、可用键盘操作 */
  .auth-autologin{
    display:flex; align-items:flex-start; gap:10px; margin-top:16px;
    padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); cursor:pointer; user-select:none;
  }
  .auth-autologin:hover{border-color:var(--primary)}
  .auth-autologin .sw{
    flex:none; width:38px; height:22px; border-radius:999px; margin-top:1px;
    background:var(--chk-border); position:relative; transition:background .2s;
  }
  .auth-autologin .sw .knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .auth-autologin .sw.on{background:var(--primary)}
  .auth-autologin .sw.on .knob{transform:translateX(16px)}
  .auth-autologin .sw:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
  .auth-autologin-title{font-size:13px; font-weight:600; color:var(--text)}
  .auth-autologin-tip{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5}
  .btn:disabled{opacity:.55; cursor:not-allowed}

  @media (max-width:760px){
    header .sync-badge{display:none}
    aside{position:fixed; left:-280px; transition:left .25s; z-index:20; height:100vh}
    aside.open{left:0}
    /* 窄屏：图例不再是整块隐藏，而是收成一个小按钮（JS 首次窄屏访问自动折叠）；
       挪到画布右上角 —— 底部左侧有缩放条与「显示方式」按钮，右侧是今日处理窄条，
       只有右上这块空地能完整放下说明文字。展开时限高并内部滚动。 */
    .map-legend{top:12px; bottom:auto; width:auto; max-width:calc(100% - var(--tp-w, 46px) - 36px)}
    .map-legend-body{font-size:11px; line-height:1.85; max-height:38vh; overflow-y:auto}
    /* 收成窄条时：竖排 4 个汉字在 46px 宽里会被逐字竖排（"今/日/处/理"），
       很难看也读不成词。改成只留 ☀ 图标 + 数字计数 —— 语义靠图标传达，点开看全文。 */
    #todayPanel{width:44px; padding:10px 4px}
    #todayPanel .tp-head{
      flex-direction:column; gap:4px; font-size:19px; padding:0; text-align:center;
    }
    #todayPanel .tp-head .tp-label{display:none}          /* 藏掉「今日处理」四个字 */
    #todayPanel .tp-head .tp-count{margin:0; font-size:11px; padding:1px 5px}
    #todayPanel .tp-hint{display:none}
    #todayPanel .tp-list{display:none}
    #todayPanel .tp-clear{display:none}
    /* 展开态：恢复正常可读宽度，内部滚动 */
    #todayPanel.expanded{width:calc(100% - 16px); max-width:280px; padding:12px}
    #todayPanel.expanded .tp-head{flex-direction:row; gap:8px; font-size:16px; text-align:left; padding:0 2px}
    #todayPanel.expanded .tp-head .tp-label{display:inline}
    #todayPanel.expanded .tp-hint{display:block}
    #todayPanel.expanded .tp-list{display:flex}
    #todayPanel.expanded .tp-clear{display:block}
    /* 列表视图下面板本身就是内容，强制展开、不参与开合 */
    #todayPanel.in-list{width:auto; padding:10px 12px}
    #todayPanel.in-list .tp-head{flex-direction:row; gap:8px; font-size:16px; text-align:left}
    #todayPanel.in-list .tp-head::after{content:none}
    #todayPanel.in-list .tp-hint{display:block}
    #todayPanel.in-list .tp-list{display:flex}
    #todayPanel.in-list .tp-clear{display:block}
    /* 窄屏下没有拖拽一说，面板标题同时充当开合按钮的提示 */
    #todayPanel .tp-head{cursor:pointer}
    #todayPanel .tp-head::after{content:'‹'; font-size:15px; color:var(--muted)}
    #todayPanel.expanded .tp-head::after{content:'›'}
    #mapView{--tp-w:46px}
    #mapView:has(#todayPanel.expanded:not(.in-list)){--tp-w:min(280px, 80%)}
    /* 窄屏：显示方式按钮紧贴缩放条，只收窄尺寸，不改 vertical 位置（缩放条尺寸不变） */
    .map-layout-btn{max-width:min(150px, 40vw); padding:9px 13px; font-size:12.5px}
    /* 缩放条按钮在窄屏从 36px 加高到 42px，条高随之从 142px 变成
       3×42 + 2×9(内边距) + 2×9(间距) + 18 = 160px。
       显示方式按钮的 bottom 必须跟着抬，否则会压到缩放条（实测重叠 10px）。 */
    .map-layout-btn{bottom:186px}
  }
  @media (max-width:560px){
    .map-layout-btn{max-width:126px; padding:6px 10px; font-size:11px}
  }

  /* ==================================================================
     ===== 移动端适配 =====
     断点定义（全部按主流机型实测宽度划分，与上文零散断点一致）：
       ≥1181px  桌面 / 大平板横屏   —— 完整布局
       ≤1180px  小平板 / 笔记本     —— 收窄缩进与行内间距
       ≤940px   平板竖屏 / 折叠屏   —— 侧栏 + 主区双栏，今日处理下沉
       ≤760px   手机竖屏（含 430px 大屏手机）—— 侧栏变抽屉，触摸模式
       ≤560px   小屏手机（320~430）    —— 进一步收紧字号与内边距
     高度断点：
       ≤500px   手机横屏 —— 顶栏与面板压缩，优先保住内容区高度
     ================================================================== */

  /* ===== 安全区（刘海 / 挖孔 / home 指示条）=====
     viewport-fit=cover 让页面延伸到刘海区，必须用 env() 自己让出安全边距。
     桌面浏览器不认识 env()，整条声明会被丢弃 → 自动退化为原样，无副作用。 */
  :root{
    --sat:env(safe-area-inset-top, 0px);
    --sar:env(safe-area-inset-right, 0px);
    --sab:env(safe-area-inset-bottom, 0px);
    --sal:env(safe-area-inset-left, 0px);
  }
  .app{
    height:100vh; height:100dvh;   /* dvh：移动端浏览器地址栏收起/展开时高度自适应 */
    padding-left:var(--sal); padding-right:var(--sar);
    padding-top:var(--sat); padding-bottom:var(--sab);
  }
  /* 固定定位的浮层（弹窗 / 抽屉 / 面板 / 吐司）同样要让开安全区 */
  .mask{padding-left:calc(16px + var(--sal)); padding-right:calc(16px + var(--sar))}
  .toast{bottom:calc(24px + var(--sab))}
  .scheme-pop{right:calc(16px + var(--sar))}

  /* ===== 触摸友好：放大可点区域 =====
     刻意用「宽度断点」而不是 pointer:coarse 来放大按钮 ——
     pointer 媒体查询在部分嵌入/自动化环境里不匹配，
     而「窄窗口」本身就等价于「大概率是触屏」，布局不该依赖媒体查询是否命中。 */
  @media (max-width:760px){
    /* 去掉移动端点击时的半透明高亮方块，避免和卡片配色打架 */
    *{-webkit-tap-highlight-color:transparent}
    /* 顶栏按钮：高度提到 40px，字号不变以免顶栏换行更多 */
    header button.tool{min-height:40px; padding:8px 13px}
    .view-switch button{min-height:38px; padding:8px 14px}
    header button.tool#btnTheme, header button.tool#btnScheme{min-width:40px}
    /* 导图工具条 */
    .map-tools{padding:9px}
    .map-tools button{width:42px; height:42px; font-size:18px}
    .map-layout-btn{padding:9px 13px; font-size:12.5px}
    .map-legend-head{min-height:40px}
    /* 日历 */
    .cal-nav{width:38px; height:38px}
    .cal-today, .cal-opt{min-height:36px; padding:8px 12px}
    .cal-item{padding:3px 5px}
    .tp-clear{min-height:38px}
    /* 主线列表删除按钮常显（原来 hover 才出现，手机上永远点不到） */
    .line-item .del{opacity:1; width:34px; height:34px;
      display:flex; align-items:center; justify-content:center; font-size:16px}
    .line-item{padding:12px}
    /* 任务行：固定 52px 高不能动（虚拟滚动按 ROW_H 定位），
       靠「按钮加高 + 负 margin 抵回」把热区撑到 40px 而不改变行高与总宽度。
       宽度同理：按钮窄（就一个图标）但热区要够 —— 用 min-width 撑到 32px，
       相邻按钮的 margin:-4px 互相抵回，所以总宽度不变、标题也不会被挤。 */
    .task .check{width:36px; height:36px; font-size:18px; margin:-4px 0}
    .task .caret{width:36px; height:36px; margin:-8px -5px; font-size:13px}
    .task .ops button{min-height:40px; min-width:32px; padding:8px 4px; margin:-4px -2px}
    .task .ops{gap:0}
    .task .caret.empty{pointer-events:none}
  }

  /* ===== 窄屏顶栏重排 =====
     手机竖屏顶栏 393px 下会折成 3 行（实测 150px 高），吃掉宝贵的内容高度。
     做法：把「深浅 / 配色 / 导出 / 导入」收进一个「⋯ 更多」弹层，
     顶栏固定两行 —— 第一行 ☰ 标识 新建 登录 ⋯，第二行视图切换占满整宽。 */
  .tool-more-pop{
    position:absolute; top:calc(100% + 8px); right:calc(14px + var(--sar)); z-index:60;
    min-width:168px; padding:6px; border-radius:14px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:2px;
  }
  /* ⚠️ .tool-more-pop 显式声明了 display:flex，会盖掉 [hidden] 的 UA 样式
     （UA 是 [hidden]{display:none}，优先级低于类选择器）→ 弹层会一直显示。
     必须显式声明这条，否则 hidden 属性形同虚设。 */
  .tool-more-pop[hidden]{display:none}
  .tool-more-pop button{
    display:flex; align-items:center; gap:10px; width:100%;
    border:none; background:none; color:var(--text); cursor:pointer;
    padding:12px; border-radius:9px; font-size:14px; text-align:left; min-height:44px;
  }
  .tool-more-pop button:hover{background:var(--bg)}
  .tool-more-pop button i{font-style:normal; font-size:16px; width:22px; text-align:center; flex:none}

  /* ===== 手机竖屏（≤760px）布局收紧 ===== */
  @media (max-width:760px){
    /* 顶栏内边距收紧 + 让开刘海；两行结构由 flex-basis 控制 */
    header{padding:8px calc(12px + var(--sar)) 8px calc(12px + var(--sal)); gap:7px}
    /* 这四个收进「⋯ 更多」弹层（宽屏仍直排顶栏） */
    #btnExport, #btnImport,
    header button.tool#btnTheme, header button.tool#btnScheme{display:none}
    /* 标识在窄屏让位给操作按钮：只留圆点 + 文字，字号收一档 */
    .logo{font-size:15px; gap:6px; flex:none}
    .logo .dot{width:11px; height:11px}
    /* 第一行固定为「☰ 标识 · 新建 登录 ⋯」，全部 flex:none 防止换行。
       ⚠️ 不要给任何一项加 margin-left:auto —— flex-wrap 容器里 auto margin
       会吃掉整行剩余空间，反而把该元素挤到下一行（实测 btnMore 掉行、顶栏多出 45px）。 */
    header button.tool#btnDrawer{flex:none}
    header button.tool.primary{flex:none; white-space:nowrap}
    #btnAuth{flex:none; white-space:nowrap}
    header button.tool#btnMore{flex:none}
    .view-switch{order:9; flex:1 1 100%}
    .view-switch button{flex:1; padding:9px 6px}
    #btnAddLineTop{font-size:13px; padding:8px 12px}
    #btnAuth{font-size:13px; padding:8px 12px; max-width:104px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    header button.tool#btnMore{min-width:40px; font-size:18px}
    /* 主内容区留出底部安全区 */
    main{padding:12px calc(12px + var(--sar)) 12px calc(12px + var(--sal))}
    .task{padding:10px calc(8px + var(--sar)) 10px calc(8px + var(--sal))}
    /* 侧栏抽屉：加宽到 300px 并让开左侧安全区（横屏刘海在左边时） */
    aside{
      left:calc(-300px - var(--sal)); width:calc(300px - var(--sal));
      padding-bottom:calc(16px + var(--sab)); height:100dvh;
    }
    aside.open{left:0}
    /* 抽屉遮罩：点空白关闭，符合手机交互习惯 */
    #drawerMask{
      display:block; position:fixed; inset:0; z-index:19;
      background:rgba(20,24,32,.42); opacity:0; pointer-events:none; transition:opacity .22s;
    }
    #drawerMask.show{opacity:1; pointer-events:auto}
    /* 抽屉里新建主线的输入与按钮也要够大 */
    .add-line input{padding:11px 12px; font-size:16px}  /* 16px：小于它 iOS 会自动放大页面 */
    .add-line .btn{min-height:44px}
    /* 侧栏里的删除按钮点得中 */
    .line-item .del{width:38px; height:38px}
    /* 筛选切换 / 弹窗里的分段开关 / 全部展开折叠：全部提到 36px 以上 */
    .filters button{min-height:36px; padding:8px 13px; font-size:13px}
    .scope-switch button{min-height:38px; font-size:13.5px}
    .tool.small{min-height:36px; padding:8px 11px}
    /* 日历"显示已完成"勾选行整行可点，不止那个 13px 的小方框 */
    .cal-opt{min-height:38px}
    .cal-opt input{width:18px; height:18px}
    /* 顶栏弹层贴边但不贴出安全区 */
    .scheme-pop, .tool-more-pop{right:calc(10px + var(--sar)); left:calc(10px + var(--sal));
      width:auto; min-width:0}
  }

  /* 宽屏时把深浅/配色按钮放回顶栏直排，弹层不需要 */
  @media (min-width:761px){
    header button.tool#btnTheme, header button.tool#btnScheme{display:inline-flex}
    header button.tool#btnMore{display:none}
  }

  /* ===== 小屏手机（≤560px）=====
     320px 是仍在服役的 iPhone SE 宽度，这里是真正的极限压缩区。 */
  @media (max-width:560px){
    header{padding:8px calc(10px + var(--sar)) 8px calc(10px + var(--sal)); gap:6px}
    .logo{font-size:14px; gap:5px}
    .logo .dot{width:10px; height:10px}
    .view-switch button{padding:9px 4px; font-size:12.5px}
    #btnAddLineTop{font-size:12px; padding:8px 9px}
    #btnAuth{font-size:12px; padding:8px 9px; max-width:88px}
    header button.tool{min-height:40px; padding:8px 10px}
    header button.tool#btnMore{min-width:38px; font-size:17px}
    /* 极窄屏（≤360px）把标识文字整个收起来，只留圆点做品牌标识 —— 顶栏必须 2 行内 */
    header button.tool#btnDrawer{min-width:38px}
  }
  /* 320px：iPhone SE 这种最窄的在役机型。第一行 5 个控件
     ☰38 + logo12 + 新建83 + 登录 + ⋯39，加 4 段间距与左右内边距约 331px，会溢出。
     登录按钮限宽 + 省略号：「＋ 新建主线」与「⋯」是高频操作，必须完整显示。 */
  @media (max-width:360px){
    /* 「任务线」是裸文本节点，没有元素可隐藏 —— 用 font-size:0 + dot 显式字号来只留圆点 */
    .logo{font-size:0; gap:0}
    .logo .dot{width:12px; height:12px}
    header{gap:5px}
    #btnAddLineTop{font-size:11.5px; padding:8px 7px}
    #btnAuth{font-size:11.5px; padding:8px 7px; max-width:66px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    header button.tool#btnDrawer{min-width:36px; font-size:15px}
    header button.tool#btnMore{min-width:36px; font-size:16px}
  }
    /* 主区上下留白再收一点 */
    main{padding:10px calc(10px + var(--sar)) 10px calc(10px + var(--sal))}
    .main-head{margin-bottom:12px; gap:8px}
    .main-head h1{font-size:19px}
    /* 输入框与按钮：手机上要够高才好按 */
    .task-input input{padding:12px}
    .task-input .big-add{padding:12px; font-size:13px}
    /* 弹窗：手机上几乎占满宽度，缩小内边距 + 按钮加大 */
    .dialog{padding:18px 16px; width:calc(100vw - 24px); max-height:88dvh; overflow-y:auto}
    .dialog h3{font-size:17px}
    .dialog textarea{height:150px}
    .dialog .row{gap:10px}
    .dialog .row .btn{flex:1; min-height:44px; padding:12px}
    /* 认证弹窗的开关行更好点 */
    .auth-autologin{padding:12px}
    /* 浮层弹层贴边但不贴到安全区外 */
    .scheme-pop, .tool-more-pop{right:calc(10px + var(--sar)); left:calc(10px + var(--sal));
      width:auto; min-width:0}
    /* 列表行：缩进再收，标题字号微调保持一行 */
    :root{--indent-w:10px}
    .task .title{font-size:14.5px; min-width:52px}
    .task .chips .chip{font-size:11.5px; padding:2px 7px}
    /* 今日处理面板在列表视图下占 26vh，手机上略高了些 */
    #todayPanel.in-list{height:24vh; min-height:118px}

/* =====================================================================
 * 任务线 —— 待办事项管理应用（思维导图版）
 *
 * 一、数据模型（Data Model）
 * ---------------------------------------------------------------------
 * 整个应用只有两张"表"，全部为纯 JSON，可整体序列化、可同步：
 *
 *   主线 Line（任务分类，如"工作主线""学习主线"）：
 *   { id, title, createdAt, updatedAt, deleted }
 *
 *   任务 Task（挂在某条主线下）：
 *   { id, lineId, title, done, createdAt, updatedAt, doneAt, deleted,
 *     due, scope, assignees, focus, focusAt }
 *     due       截止日期时间戳（当天零点），未设置为 null
 *     scope     参与方式：'solo' 单人 | 'multi' 多人协作
 *     assignees 多人时的参与人名单（字符串数组，可为空）
 *     focus     是否已拖入「今日处理」面板
 *     focusAt   加入今日处理的时间（移出为 null）
 *
 *   设置 Settings（全局唯一一条，含主题偏好）：
 *   { id: 'settings', theme: 'light' | 'dark', updatedAt }
 *   主题偏好也是一条"记录"，走同一套同步管道：
 *   多标签页实时同步 + 导出/导入跨设备迁移 + LWW 合并。
 *
 *   id        全局唯一 ID（时间戳+随机数）
 *   updatedAt 最后修改时间戳 —— 同步冲突裁决依据
 *   deleted   软删除标记（墓碑），同步时不物理删除
 *
 * 二、同步机制（Sync Mechanism）
 * ---------------------------------------------------------------------
 * 1) 单一事实源：所有增删改统一写入 state，由 Repository 持久化到
 *    previewStorage，刷新页面数据不丢。
 * 2) 记录级同步 + LWW（Last-Write-Wins 最后写入优先）合并。
 * 3) 软删除墓碑：删除也参与同步，不会"删了又复活"。
 * 4) 实时通道：BroadcastChannel 广播本机变更，多标签页实时一致。
 * 5) 可插拔 SyncAdapter 接口（push/pull）：当前为本机适配器，
 *    将来接入云服务换成云端适配器即可实现跨设备实时同步，
 *    增删改查与合并代码完全不用动。
 * ===================================================================== */

/* ---------- 工具函数 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const fmtTime = ts => {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =====================================================================
 * 第一部分：数据仓库（Repository）—— 本地持久化
 * ===================================================================== */
const STORE_KEY = 'renwuxian.data.v1';

/** 任务层级上限：主线算第 0 层，其下任务从第 1 层起，最多 MAX_DEPTH 层 */
const MAX_DEPTH = 50;

/** 长期任务 ♾：无截止日期，每天首次启动自动进入「今日处理」 */
const LONG_TAG = '♾ 长期';
/** SVG 属性里不能用 var()，所以取当前主题下长期任务色的计算值（深色模式自动换色） */
function longColor() {
  try {
    return getComputedStyle(document.body).getPropertyValue('--long').trim() || '#7c5cff';
  } catch (e) { return '#7c5cff'; }
}

/** 任务记录规范化：为旧数据补上后加的字段（本地加载 / 导入 / 同步到达共用）
 *
 *  【树形结构】逻辑上是一棵任意深度的树，但存储仍然是"扁平记录 + parentId"：
 *    parentId  父任务 id；null 表示直接挂在主线下（第一层）
 *    order     同级排序序号（越小越靠前）
 *    collapsed 子树是否折叠
 *  这样做的好处：多端同步仍可"逐条记录"做 LWW 合并，不会因为改一个子节点
 *  而整棵树互相覆盖；渲染时再按 parentId/order 组装成树。
 *  旧的两层数据（只有 lineId、没有 parentId）迁移后 parentId=null，
 *  即"挂在主线下的第一层任务"，展示与交互和改造前完全一致。 */
function normalizeTasks(arr) {
  const list = arr.map(t => ({
    parentId: null, order: 0, collapsed: false,
    due: null, scope: 'solo', assignees: [], focus: false, focusAt: null,
    longTerm: false,          // ♾ 长期任务：无截止日期，每天首次启动自动进入今日处理
    ...t
  }));
  return repairTree(list);
}

/** 修复树结构（本地加载 / 导入 / 云端合并后共用，保证渲染不会错乱或死循环）：
 *  ① 父任务不存在或已被删除 → 提升为该主线的第一层任务
 *  ② parentId 成环（多端合并可能产生）→ 断开环，保证是一棵树 */
function repairTree(list) {
  const byId = new Map(list.map(t => [t.id, t]));
  for (const t of list) {
    if (t.parentId) {
      const p = byId.get(t.parentId);
      if (!p || p.deleted) t.parentId = null;
    }
    if (typeof t.order !== 'number' || !isFinite(t.order)) t.order = 0;
    t.collapsed = !!t.collapsed;
  }
  for (const t of list) {                 // 断环：沿 parentId 上溯，重复出现即断开
    const seen = new Set();
    let cur = t, guard = 0;
    while (cur && cur.parentId && guard++ < MAX_DEPTH + 10) {
      if (seen.has(cur.id)) { cur.parentId = null; break; }
      seen.add(cur.id);
      cur = byId.get(cur.parentId);
    }
  }
  return list;
}

const Repository = {
  /** 首次使用的默认主题：跟随操作系统偏好 */
  defaultTheme() {
    try {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  },
  empty() {
    return {
      lines: [{ id: uid(), title: '默认主线', createdAt: now(), updatedAt: now(), deleted: false }],
      tasks: [],
      settings: { id: 'settings', theme: this.defaultTheme(), updatedAt: now() }
    };
  },
  load() {
    try {
      const raw = previewStorage.getItem(STORE_KEY);
      if (!raw) return this.empty();
      const data = JSON.parse(raw);
      if (!Array.isArray(data.lines) || !Array.isArray(data.tasks)) return this.empty();
      // 旧版本数据迁移：补上 settings 记录（updatedAt=0 保证不覆盖别端较新的主题）
      if (!data.settings || typeof data.settings !== 'object') {
        data.settings = { id: 'settings', theme: this.defaultTheme(), updatedAt: 0 };
      }
      // 旧任务迁移：补上截止日期 / 参与方式 / 今日处理字段
      data.tasks = normalizeTasks(data.tasks);
      return data;
    } catch (e) {
      console.warn('本地数据损坏，使用初始数据', e);
      return this.empty();
    }
  },
  save(state) {
    previewStorage.setItem(STORE_KEY, JSON.stringify(state));
  }
};

/* =====================================================================
 * 第二部分：同步引擎（SyncEngine）
 * ===================================================================== */
const CHANNEL_NAME = 'renwuxian-sync';

/** 记录级合并：LWW（最后写入优先），支持 Line 与 Task 两种记录 */
function mergeRecords(localArr, remoteArr) {
  const map = new Map(localArr.map(r => [r.id, r]));
  for (const remote of remoteArr) {
    const local = map.get(remote.id);
    if (!local || (remote.updatedAt || 0) >= (local.updatedAt || 0)) {
      map.set(remote.id, remote);
    }
  }
  return Array.from(map.values());
}

const SyncEngine = {
  channel: null,
  start(onRemoteChange) {
    if ('BroadcastChannel' in window) {
      this.channel = new BroadcastChannel(CHANNEL_NAME);
      this.channel.onmessage = (ev) => {
        if (ev.data && ev.data.type === 'state') onRemoteChange(ev.data.state);
      };
    }
    window.addEventListener('storage', (ev) => {
      if (ev.key === STORE_KEY && ev.newValue) {
        try { onRemoteChange(JSON.parse(ev.newValue)); } catch (e) {}
      }
    });
  },
  broadcast(state) {
    if (this.channel) this.channel.postMessage({ type: 'state', state });
  },
  adapter: {
    name: 'local',
    push(state) { Repository.save(state); return true; },
    pull()      { return Repository.load(); }
  }
};


const CloudSync={enable(){},schedulePush(){}};
/* =====================================================================
 * 第三部分：应用状态与增删改查（CRUD）+ 状态更新逻辑
 * ===================================================================== */
const initialLocalData = !!previewStorage.getItem(STORE_KEY);
let state = Repository.load();
if (!initialLocalData) state.settings.updatedAt = 0;
let currentLineId = state.lines[0] ? state.lines[0].id : null;
let filter = 'all';                     // all | todo | done（列表视图用）
let view = 'map';                       // map | list 当前视图

/** 提交变更：持久化 + 广播同步 + 云端上行 + 应用主题 + 刷新界面 */
function commit() {
  invalidateTaskIndex();                  // 树索引缓存失效（深层嵌套下避免读到旧关系）
  SyncEngine.adapter.push(state);
  SyncEngine.broadcast(state);
  CloudSync.schedulePush();       // 云端上行（未登录时自动跳过）
  applyTheme();
  render();
}

/* ---------- 主题（深色模式）+ 配色方案：设置记录的读写与合并 ---------- */

/* 五套配色：key → { 名称、一句话说明、用于色卡预览的主色 } */
const SCHEMES = [
  { key: 'indigo',   name: '靛蓝', desc: '冷静专业',   colors: ['#4763de', '#2a9d5c', '#e5484d'] },
  { key: 'forest',   name: '松绿', desc: '沉稳有力',   colors: ['#107b5f', '#2a9d5c', '#d94b45'] },
  { key: 'amber',    name: '暖阳', desc: '温暖亲和',   colors: ['#9e5c20', '#3f9455', '#d24b40'] },
  { key: 'plum',     name: '暮紫', desc: '优雅梦幻',   colors: ['#844bcb', '#2f9e73', '#d5475e'] },
  { key: 'graphite', name: '石墨', desc: '极简高级',   colors: ['#465163', '#2f855a', '#c53030'] }
];
const SCHEME_KEYS = SCHEMES.map(s => s.key);

/** 当前配色方案的 key（缺省或非法值一律回落到靛蓝，不影响启动） */
function getScheme() {
  const s = state.settings && state.settings.scheme;
  return SCHEME_KEYS.includes(s) ? s : 'indigo';
}

/** 把当前主题应用到界面（深浅 + 配色方案） */
function applyTheme() {
  const dark = state.settings && state.settings.theme === 'dark';
  const scheme = getScheme();
  document.body.classList.toggle('dark', dark);
  document.body.setAttribute('data-scheme', scheme);
  const btn = $('btnTheme');
  if (btn) btn.textContent = dark ? '☀️' : '🌙';
  const sb = $('btnScheme');
  if (sb) {
    const cur = SCHEMES.find(s => s.key === scheme);
    sb.title = `配色：${cur.name} · ${cur.desc}（点击更换）`;
    sb.setAttribute('aria-label', sb.title);
  }
  renderSchemeList();
}

/** 渲染配色面板（每次打开/切换都重建，保证选中态与色卡始终准确） */
function renderSchemeList() {
  const box = $('schemeList');
  if (!box) return;
  box.innerHTML = '';
  const cur = getScheme();
  for (const s of SCHEMES) {
    const btn = document.createElement('button');
    btn.className = 'scheme-item' + (s.key === cur ? ' on' : '');
    btn.type = 'button';
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', s.key === cur ? 'true' : 'false');

    const sw = document.createElement('span');
    sw.className = 'scheme-swatches';
    /* 色卡用内联色值，保证即使主题变量未生效也能正确预览 */
    for (const c of s.colors) {
      const i = document.createElement('i');
      i.style.background = c;
      sw.appendChild(i);
    }
    btn.appendChild(sw);

    const txt = document.createElement('span');
    const nm = document.createElement('div');
    nm.className = 'scheme-name';
    nm.textContent = s.name;
    const ds = document.createElement('div');
    ds.className = 'scheme-desc';
    ds.textContent = s.desc;
    txt.appendChild(nm); txt.appendChild(ds);
    btn.appendChild(txt);

    if (s.key === cur) {
      const ck = document.createElement('span');
      ck.className = 'scheme-check';
      ck.textContent = '✓';
      btn.appendChild(ck);
    }

    btn.onclick = () => { setScheme(s.key); closeSchemePop(); };
    box.appendChild(btn);
  }
}

/** 切换配色方案（写入 settings 记录，随同步管道传播到其他设备） */
function setScheme(key) {
  if (!SCHEME_KEYS.includes(key)) return;
  if (!state.settings) state.settings = { id: 'settings', theme: 'light', updatedAt: 0 };
  if (getScheme() === key) return;
  state.settings.scheme = key;
  state.settings.updatedAt = now();
  commit();
  toast(`配色已切换为「${SCHEMES.find(s => s.key === key).name}」`);
}

/** 开关配色面板 */
function toggleSchemePop() { $('schemePop').hidden ? openSchemePop() : closeSchemePop(); }
function openSchemePop() {
  $('schemePop').hidden = false;
  $('btnScheme').classList.add('on');
  $('btnScheme').setAttribute('aria-expanded', 'true');
  renderSchemeList();
}
function closeSchemePop() {
  $('schemePop').hidden = true;
  $('btnScheme').classList.remove('on');
  $('btnScheme').setAttribute('aria-expanded', 'false');
}

/** 切换深色 / 浅色模式（写入 settings 记录，随同步管道传播） */
function toggleTheme() {
  if (!state.settings) state.settings = { id: 'settings', theme: 'light', updatedAt: 0 };
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  state.settings.updatedAt = now();
  commit();
}

/** 主题记录合并：同样按 LWW（最后修改的赢） */
function mergeSettings(remote) {
  if (remote && typeof remote === 'object' &&
      (remote.updatedAt || 0) >= (state.settings.updatedAt || 0)) {
    state.settings = remote;
  }
}

/* ---------- 导图显示方式（四周发散 / 统一向右） ---------- */

/** 读取当前显示方式：'radial' 四周发散（默认）| 'right' 统一向右 */
function getMapLayoutMode() {

}

/** 把「显示方式」按钮的文案同步成当前模式（换行省略，避免顶栏被撑开） */

/** 切换显示方式（写入 settings 记录，随同步管道传播到其他设备） */
function toggleMapLayout() {
