<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;font:14px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#ecefff;color:#303b70}button{border:0;border-radius:8px;background:#5b6ef5;color:white;padding:8px 12px}iframe{border:0;width:100%;height:calc(100% - 52px)}</style></head><body><header><span>示例体验 · 数据仅保存在当前页面</span><button id="reset">恢复示例</button></header><iframe title="小游戏示例" sandbox="allow-scripts"></iframe><script>const pages={"home": "<!DOCTYPE html>\n<html lang=\"zh-CN\" data-theme=\"light\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"description\" content=\"摸鱼盒子 — 上班间隙偷得十分钟的 15 款单机小游戏，示例状态仅在当前页面。\">\n<title>摸鱼盒子 · 上班间隙的十五款小游戏</title>\n<style>/* ============================================================\n   摸鱼盒子 FishBox — 全站样式\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\n:root {\n  --bg: #f4f6fb;\n  --bg-grad: radial-gradient(1200px 600px at 50% -200px, #e7ecff 0%, rgba(244, 246, 251, 0) 70%);\n  --surface: #ffffff;\n  --surface-2: #f8f9fd;\n  --ink: #1b2033;\n  --ink-2: #6a7288;\n  --ink-3: #9aa1b5;\n  --line: #e6e9f3;\n  --line-2: #eef0f7;\n  --brand: #5b6ef5;\n  --brand-2: #8b5cf6;\n  --brand-soft: #ecefff;\n  --ok: #2fbf8f;\n  --warn: #ff9f43;\n  --danger: #f2545b;\n  --radius: 18px;\n  --radius-sm: 12px;\n  --shadow-sm: 0 1px 2px rgba(24, 31, 61, .05);\n  --shadow: 0 2px 6px rgba(24, 31, 61, .05), 0 16px 36px -14px rgba(24, 31, 61, .18);\n  --shadow-lg: 0 20px 60px -16px rgba(24, 31, 61, .3);\n  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, \"Courier New\", monospace;\n}\n\nhtml[data-theme=\"dark\"] {\n  --bg: #10121a;\n  --bg-grad: radial-gradient(1200px 600px at 50% -200px, #1c2440 0%, rgba(16, 18, 26, 0) 70%);\n  --surface: #191d29;\n  --surface-2: #141822;\n  --ink: #eef1fa;\n  --ink-2: #9ba3ba;\n  --ink-3: #6f7790;\n  --line: #29303f;\n  --line-2: #222836;\n  --brand-soft: #232a45;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);\n  --shadow: 0 2px 6px rgba(0, 0, 0, .3), 0 16px 36px -14px rgba(0, 0, 0, .6);\n  --shadow-lg: 0 20px 60px -16px rgba(0, 0, 0, .7);\n}\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\",\n    \"Hiragino Sans GB\", \"Microsoft YaHei\", \"Helvetica Neue\", Arial, sans-serif;\n  background: var(--bg);\n  background-image: var(--bg-grad);\n  background-repeat: no-repeat;\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  line-height: 1.6;\n  min-height: 100vh;\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n::selection { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1120px; margin: 0 auto; padding: 0 26px; }\n\n/* ============================ 通用控件 ============================ */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  height: 40px;\n  padding: 0 18px;\n  border-radius: 11px;\n  font-size: 14px;\n  font-weight: 600;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  color: var(--ink);\n  box-shadow: var(--shadow-sm);\n  transition: transform .16s cubic-bezier(.3, 1.4, .5, 1), box-shadow .18s, background .18s, border-color .18s;\n  white-space: nowrap;\n  user-select: none;\n}\n.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: transparent; }\n.btn:active { transform: translateY(0) scale(.97); }\n\n.btn-primary {\n  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);\n  color: #fff;\n  border-color: transparent;\n  box-shadow: 0 6px 18px -6px rgba(91, 110, 245, .7);\n}\n.btn-primary:hover { box-shadow: 0 12px 26px -8px rgba(91, 110, 245, .8); }\n\n.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }\n.btn-ghost:hover { background: var(--brand-soft); color: var(--brand); box-shadow: none; }\n\n.icon-btn {\n  width: 40px;\n  height: 40px;\n  border-radius: 11px;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  transition: transform .16s cubic-bezier(.3, 1.4, .5, 1), background .18s, color .18s;\n  color: var(--ink-2);\n}\n.icon-btn:hover { transform: translateY(-1px); background: var(--brand-soft); color: var(--brand); }\n.icon-btn:active { transform: scale(.94); }\n.icon-btn svg { width: 18px; height: 18px; }\n\n/* 带文字的按钮：用来把「选工作界面」这个入口说清楚，别只剩一个看不懂的图标 */\n.icon-btn.pill {\n  width: auto;\n  padding: 0 13px 0 10px;\n  gap: 6px;\n  font-size: 12.5px;\n  font-weight: 600;\n  letter-spacing: .2px;\n}\n.icon-btn.pill svg { width: 16px; height: 16px; }\n\n/* ============================ 首页：顶栏 ============================ */\n\n.topbar {\n  height: 76px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n}\n\n.logo { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 17px; letter-spacing: -.2px; }\n.logo-mark {\n  width: 38px;\n  height: 38px;\n  border-radius: 12px;\n  background: linear-gradient(140deg, #5b6ef5 0%, #8b5cf6 55%, #b06ef5 100%);\n  display: grid;\n  place-items: center;\n  box-shadow: 0 8px 20px -8px rgba(91, 110, 245, .85);\n  overflow: hidden;\n}\n.logo-mark svg { width: 24px; height: 24px; display: block; }\n.logo-text small { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-3); letter-spacing: 1.6px; line-height: 1; margin-top: 1px; text-transform: uppercase; }\n\n.top-tools { display: flex; align-items: center; gap: 9px; }\n\n.kbd-hint {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  height: 40px;\n  padding: 0 8px 0 14px;\n  border-radius: 11px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 12.5px;\n  color: var(--ink-2);\n  box-shadow: var(--shadow-sm);\n}\nkbd {\n  font-family: var(--mono);\n  font-size: 11px;\n  font-weight: 600;\n  padding: 3px 7px;\n  border-radius: 6px;\n  background: var(--surface-2);\n  border: 1px solid var(--line);\n  border-bottom-width: 2px;\n  color: var(--ink);\n  line-height: 1;\n}\n\n/* ============================ 首页：主视觉 ============================ */\n\n.hero { padding: 34px 0 26px; }\n\n.hero-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  height: 28px;\n  padding: 0 12px;\n  border-radius: 999px;\n  background: var(--brand-soft);\n  color: var(--brand);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: .2px;\n  margin-bottom: 16px;\n}\n.hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 2s infinite; }\n@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }\n\n.hero h1 {\n  margin: 0 0 12px;\n  font-size: clamp(30px, 4.4vw, 46px);\n  line-height: 1.15;\n  letter-spacing: -1.2px;\n  font-weight: 800;\n}\n.hero h1 em {\n  font-style: normal;\n  background: linear-gradient(115deg, var(--brand) 0%, var(--brand-2) 60%, #ec6ea8 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n}\n.hero p { margin: 0; color: var(--ink-2); font-size: 15.5px; max-width: 620px; }\n.hero p b { color: var(--ink); font-weight: 700; }\n\n/* ============================ 首页：筛选 ============================ */\n\n.filters {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  flex-wrap: wrap;\n  margin: 30px 0 18px;\n  padding-bottom: 2px;\n}\n.chip {\n  height: 34px;\n  padding: 0 15px;\n  border-radius: 999px;\n  font-size: 13.5px;\n  font-weight: 600;\n  color: var(--ink-2);\n  background: transparent;\n  border: 1px solid transparent;\n  transition: all .18s;\n}\n.chip:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }\n.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }\nhtml[data-theme=\"dark\"] .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }\n.filters .count { margin-left: auto; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }\n\n/* ============================ 首页：卡片网格 ============================ */\n\n.grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));\n  gap: 18px;\n  padding-bottom: 70px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 15px;\n  padding: 20px;\n  border-radius: var(--radius);\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  transition: transform .26s cubic-bezier(.25, 1, .4, 1), box-shadow .26s, border-color .26s;\n  overflow: hidden;\n  opacity: 0;\n  transform: translateY(12px);\n  animation: cardIn .5s cubic-bezier(.22, 1, .36, 1) forwards;\n}\n@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }\n\n.card::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: inherit;\n  background: var(--card-accent, #5b6ef5);\n  opacity: 0;\n  transition: opacity .3s;\n  pointer-events: none;\n  mix-blend-mode: normal;\n}\n.card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: transparent; }\n.card:hover::after { opacity: .045; }\n.card:active { transform: translateY(-2px) scale(.99); }\n\n.card-head { display: flex; align-items: flex-start; gap: 13px; }\n\n.card-icon {\n  width: 52px;\n  height: 52px;\n  flex: 0 0 52px;\n  border-radius: 15px;\n  display: grid;\n  place-items: center;\n  background: var(--card-bg, #eef1ff);\n  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5);\n  transition: transform .3s cubic-bezier(.3, 1.5, .5, 1);\n  overflow: hidden;\n}\n.card:hover .card-icon { transform: scale(1.07) rotate(-4deg); }\n.card-icon svg { width: 34px; height: 34px; display: block; }\n\n.card-title { font-size: 16.5px; font-weight: 750; letter-spacing: -.2px; margin: 1px 0 3px; }\n.card-desc { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin: 0; }\n\n.card-foot {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin-top: auto;\n  padding-top: 2px;\n  font-size: 12px;\n  color: var(--ink-3);\n}\n.tag {\n  display: inline-flex;\n  align-items: center;\n  height: 21px;\n  padding: 0 9px;\n  border-radius: 6px;\n  background: var(--surface-2);\n  border: 1px solid var(--line-2);\n  font-size: 11.5px;\n  font-weight: 600;\n  color: var(--ink-2);\n}\n.card-best { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); }\n.card-best b { color: var(--brand); font-weight: 800; }\n\n.card-fire {\n  position: absolute;\n  top: 0;\n  right: 0;\n  padding: 5px 12px 6px 14px;\n  border-bottom-left-radius: 12px;\n  background: linear-gradient(135deg, #ffb340, #ff7043);\n  color: #fff;\n  font-size: 10.5px;\n  font-weight: 800;\n  letter-spacing: .6px;\n}\n\n/* ============================ 页脚 ============================ */\n\n.footer {\n  border-top: 1px solid var(--line);\n  padding: 26px 0 40px;\n  color: var(--ink-3);\n  font-size: 12.5px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  flex-wrap: wrap;\n}\n.footer .tips { display: flex; gap: 18px; flex-wrap: wrap; }\n.footer .tips span { display: inline-flex; align-items: center; gap: 6px; }\n\n/* ============================ 游戏页外壳 ============================ */\n\n.game-page { min-height: 100vh; display: flex; flex-direction: column; }\n\n.g-bar {\n  width: 100%;\n  max-width: 800px;\n  margin: 0 auto;\n  padding: 20px 22px 12px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}\n.g-back {\n  width: 40px;\n  height: 40px;\n  border-radius: 11px;\n  display: grid;\n  place-items: center;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  transition: transform .16s, background .18s;\n  flex: 0 0 auto;\n}\n.g-back:hover { transform: translateX(-2px); background: var(--brand-soft); }\n.g-back svg { width: 17px; height: 17px; }\n.g-name { font-size: 17px; font-weight: 750; letter-spacing: -.2px; }\n.g-name small { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }\n.g-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }\n\n.g-stage {\n  flex: 1;\n  width: 100%;\n  max-width: 800px;\n  margin: 0 auto;\n  padding: 8px 22px 24px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: flex-start;\n}\n\n.g-hint {\n  text-align: center;\n  color: var(--ink-3);\n  font-size: 12.5px;\n  padding: 0 20px 30px;\n  line-height: 1.9;\n}\n.g-hint b { color: var(--ink-2); font-weight: 600; }\n\n/* 分数条 */\n.scorebar {\n  display: flex;\n  gap: 10px;\n  width: 100%;\n  justify-content: center;\n  margin-bottom: 14px;\n  flex-wrap: wrap;\n}\n.score-box {\n  min-width: 92px;\n  padding: 9px 16px 10px;\n  border-radius: 13px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  text-align: center;\n}\n.score-box .lb { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; color: var(--ink-3); text-transform: uppercase; }\n.score-box .val { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; line-height: 1.25; }\n.score-box.accent .val { color: var(--brand); }\n\n/* 通用遮罩 */\n.overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 500;\n  display: grid;\n  place-items: center;\n  padding: 24px;\n  background: rgba(16, 20, 34, .42);\n  backdrop-filter: blur(6px);\n  -webkit-backdrop-filter: blur(6px);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity .26s;\n}\n.overlay.on { opacity: 1; pointer-events: auto; }\n.overlay-card {\n  width: 100%;\n  max-width: 320px;\n  padding: 28px 26px 24px;\n  border-radius: 22px;\n  background: var(--surface);\n  box-shadow: var(--shadow-lg);\n  text-align: center;\n  transform: translateY(14px) scale(.96);\n  transition: transform .34s cubic-bezier(.22, 1.4, .4, 1);\n}\n.overlay.on .overlay-card { transform: translateY(0) scale(1); }\n.overlay-card h3 { margin: 0 0 6px; font-size: 21px; font-weight: 800; letter-spacing: -.4px; }\n.overlay-card p { margin: 0 0 20px; color: var(--ink-2); font-size: 13.5px; }\n.overlay-card .big { font-size: 34px; font-weight: 850; color: var(--brand); letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 4px 0 2px; }\n.overlay-actions { display: flex; gap: 10px; }\n.overlay-actions .btn { flex: 1; }\n\n/* ============================ 2048 ============================ */\n\n.g2048 { --gap: 10px; --tile: calc((100% - 5 * var(--gap)) / 4); position: relative; width: 100%; max-width: 400px; padding: var(--gap); border-radius: 16px; background: #e9edf7; border: 1px solid var(--line); box-shadow: var(--shadow-sm); touch-action: none; }\nhtml[data-theme=\"dark\"] .g2048 { background: #232a3a; }\n.g2048::after { content: \"\"; display: block; padding-top: 100%; }\n.g2048 .cells { position: absolute; inset: var(--gap); }\n.g2048 .cellbg { position: absolute; width: var(--tile); height: var(--tile); border-radius: 9px; background: #dde3f0; }\nhtml[data-theme=\"dark\"] .g2048 .cellbg { background: #2c3446; }\n.g2048 .tile {\n  position: absolute;\n  width: var(--tile);\n  height: var(--tile);\n  border-radius: 9px;\n  display: grid;\n  place-items: center;\n  font-weight: 800;\n  font-size: 27px;\n  letter-spacing: -.8px;\n  color: #6b5b4a;\n  background: #eee4da;\n  transition: left .13s ease, top .13s ease, background .16s, color .16s, transform .16s;\n  will-change: left, top;\n  user-select: none;\n}\n.g2048 .tile.new { animation: tileIn .2s cubic-bezier(.3, 1.6, .5, 1); }\n@keyframes tileIn { from { transform: scale(.1); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n.g2048 .tile.pop { animation: tilePop .22s cubic-bezier(.3, 1.6, .5, 1); }\n@keyframes tilePop { 0% { transform: scale(1); } 55% { transform: scale(1.19); } 100% { transform: scale(1); } }\n.g2048 .tile[data-v=\"2\"] { background: #eee4da; }\n.g2048 .tile[data-v=\"4\"] { background: #ede0c8; }\n.g2048 .tile[data-v=\"8\"] { background: #f2b179; color: #fff; }\n.g2048 .tile[data-v=\"16\"] { background: #f59563; color: #fff; }\n.g2048 .tile[data-v=\"32\"] { background: #f67c5f; color: #fff; }\n.g2048 .tile[data-v=\"64\"] { background: #f65e3b; color: #fff; }\n.g2048 .tile[data-v=\"128\"] { background: #edcf72; color: #fff; font-size: 23px; box-shadow: 0 0 22px -4px rgba(237, 207, 114, .8); }\n.g2048 .tile[data-v=\"256\"] { background: #edcc61; color: #fff; font-size: 23px; box-shadow: 0 0 24px -3px rgba(237, 204, 97, .85); }\n.g2048 .tile[data-v=\"512\"] { background: #edc850; color: #fff; font-size: 23px; box-shadow: 0 0 26px -2px rgba(237, 200, 80, .9); }\n.g2048 .tile[data-v=\"1024\"] { background: #edc53f; color: #fff; font-size: 19px; box-shadow: 0 0 28px -1px rgba(237, 197, 63, .95); }\n.g2048 .tile[data-v=\"2048\"] { background: linear-gradient(135deg, #f7d046, #f0a500); color: #fff; font-size: 19px; box-shadow: 0 0 34px 0 rgba(240, 165, 0, 1); }\n.g2048 .tile[data-v=\"4096\"], .g2048 .tile[data-v=\"8192\"] { background: linear-gradient(135deg, #7b5cf5, #b06ef5); color: #fff; font-size: 17px; }\n.g2048 .tile[data-v=\"16384\"], .g2048 .tile[data-v=\"32768\"], .g2048 .tile[data-v=\"65536\"] { background: linear-gradient(135deg, #2fbf8f, #12a3a3); color: #fff; font-size: 15px; }\nhtml[data-theme=\"dark\"] .g2048 .tile[data-v=\"2\"] { background: #2b3244; color: #cfd6e8; }\nhtml[data-theme=\"dark\"] .g2048 .tile[data-v=\"4\"] { background: #343c52; color: #cfd6e8; }\n\n/* ============================ 扫雷 ============================ */\n\n.ms-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; width: 100%; justify-content: center; flex-wrap: wrap; }\n.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }\n.seg button { height: 30px; padding: 0 13px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); transition: all .16s; }\n.seg button.on { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-sm); }\n\n.ms-panel {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  padding: 10px 16px;\n  border-radius: 14px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  margin-bottom: 12px;\n}\n.ms-stat { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 62px; }\n.ms-stat svg { width: 15px; height: 15px; color: var(--ink-3); }\n.ms-face { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-size: 20px; transition: transform .16s; }\n.ms-face:hover { transform: scale(1.06); }\n.ms-face:active { transform: scale(.94); }\n\n.ms-board-wrap { max-width: 100%; overflow: auto; padding: 4px; border-radius: 14px; }\n.ms-board {\n  --ms: 30px;\n  display: grid;\n  gap: 2px;\n  padding: 6px;\n  border-radius: 12px;\n  background: #e9edf7;\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  user-select: none;\n  margin: 0 auto;\n  width: max-content;\n}\nhtml[data-theme=\"dark\"] .ms-board { background: #232a3a; }\n.ms-cell {\n  width: var(--ms);\n  height: var(--ms);\n  border-radius: 5px;\n  display: grid;\n  place-items: center;\n  background: var(--surface);\n  box-shadow: inset 0 -2px 0 rgb olor: #fff; }\n\n/* ---------- 顶部指标卡（每套身份一套指标，颜色跟随身份） ---------- */\n.bs-metrics { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: nowrap; }\n.bs-metrics:empty { display: none; }\n.bs-metric {\n  flex: 1 1 0; min-width: 0;\n  display: flex; flex-direction: column; gap: 1px;\n  padding: 9px 12px 10px;\n  background: #fff;\n  border: 1px solid var(--bs-line);\n  border-top: 2px solid var(--bs-primary);\n  border-radius: 6px;\n}\n.bs-metric-l {\n  font-size: 11px; color: var(--bs-ink3);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.bs-metric-v {\n  font-size: 19px; font-weight: 700; letter-spacing: .2px;\n  font-variant-numeric: tabular-nums; white-space: nowrap;\n  overflow: hidden; text-overflow: ellipsis;\n}\n.bs-metric-v em { font-style: normal; font-size: 11px; font-weight: 500; color: var(--bs-ink3); margin-left: 3px; }\n.bs-metric-d { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.bs-metric-d.good { color: #14875c; }\n.bs-metric-d.warn { color: #c07a12; }\n.bs-metric-d.flat { color: var(--bs-ink3); }\n\n/* ---------- 表格 ---------- */\n.bs-tablewrap {\n  flex: 1; min-height: 0; overflow: auto;\n  background: #fff; border: 1px solid var(--bs-line); border-radius: 6px;\n}\n.bs-table { width: 100%; border-collapse: collapse; table-layout: fixed; }\n.bs-table th, .bs-table td {\n  text-align: left; padding: 0 9px; height: 38px;\n  border-bottom: 1px solid #eef1f6;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.bs-table thead th {\n  position: sticky; top: 0; z-index: 2;\n  background: #f7f9fc; color: var(--bs-ink2);\n  font-weight: 600; font-size: 11.5px;\n  cursor: pointer; user-select: none;\n  border-bottom: 1px solid var(--bs-line);\n}\n.bs-table thead th:hover { background: #eef2f9; }\n.bs-table thead th.sorted { color: var(--bs-primary); }\n.bs-table th.bs-idx, .bs-table td.bs-idx { width: 44px; text-align: center; color: var(--bs-ink3); font-size: 11px; }\n.bs-table thead th.bs-idx { cursor: default; }\n.bs-table td.bs-no { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 11.5px; color: #4d5b73; }\n.bs-table td.bs-strong { font-weight: 500; color: #1d2534; }\n.bs-table td.bs-num { text-align: right; font-variant-numeric: tabular-nums; }\n.bs-table td.bs-date { font-variant-numeric: tabular-nums; color: #4d5b73; }\n.bs-table td.bs-mute { color: var(--bs-ink3); }\n.bs-row { cursor: pointer; }\n.bs-row:hover td { background: #f8fafd; }\n.bs-row.on td { background: var(--bs-primary-soft); }\n.bs-row.on td:first-child { box-shadow: inset 2px 0 0 var(--bs-primary); }\n\n.bs-empty td { text-align: center; color: var(--bs-ink3); height: 130px; font-size: 12px; }\n\n/* ---------- 状态标签 ---------- */\n.bs-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; line-height: 1.5; }\n.bs-tag.ok { background: #e7f7ef; color: #17845a; }\n.bs-tag.info { background: var(--bs-primary-soft); color: var(--bs-primary); }\n.bs-tag.warn { background: #fff4e5; color: #b3730a; }\n.bs-tag.danger { background: #fdeaea; color: #c53a36; }\n.bs-tag.mute { background: #f0f2f5; color: #6b7789; }\n\n/* ---------- 分页 ---------- */\n.bs-pager { flex: 0 0 auto; height: 46px; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--bs-ink3); }\n.bs-grow { flex: 1; }\n.bs-total { white-space: nowrap; }\n.bs-pg {\n  height: 26px; padding: 0 10px; border-radius: 4px;\n  border: 1px solid var(--bs-line); background: #fff; color: var(--bs-ink2);\n  font: inherit; cursor: pointer;\n}\n.bs-pg:hover:not(:disabled) { border-color: #b9c6dd; color: var(--bs-ink); }\n.bs-pg:disabled { opacity: .45; cursor: default; }\n.bs-pgn { font-variant-numeric: tabular-nums; }\n\n/* ---------- 详情抽屉 ---------- */\n.bs-drawer {\n  display: none; flex-direction: column;\n  flex: 0 0 330px; width: 330px;\n  background: #fff; border-left: 1px solid var(--bs-line);\n}\n.bs-drawer.on { display: flex; }\n.bs-dw-head {\n  flex: 0 0 auto; height: 44px;\n  display: flex; align-items: center;\n  padding: 0 8px 0 16px;\n  border-bottom: 1px solid var(--bs-line);\n}\n.bs-dw-head b { font-size: 13px; }\n.bs-dw-close {\n  margin-left: auto; width: 30px; height: 30px;\n  border: 0; background: transparent; color: var(--bs-ink3);\n  border-radius: 4px; cursor: pointer; display: grid; place-items: center;\n}\n.bs-dw-close:hover { background: #f2f4f8; color: var(--bs-ink); }\n.bs-dw-body { flex: 1; overflow: auto; padding: 14px 16px 20px; }\n.bs-dw-title { font-size: 14px; font-weight: 600; line-height: 1.45; margin-bottom: 8px; color: #1d2534; }\n.bs-dw-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }\n.bs-dw-no { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--bs-ink3); }\n.bs-dw-fields { border-radius: 5px; overflow: hidden; background: #fff; border: 1px solid #eef1f6; }\n.bs-dw-f { display: flex; gap: 12px; padding: 7px 10px; border-bottom: 1px solid #f0f3f8; font-size: 12px; }\n.bs-dw-f:last-child { border-bottom: 0; }\n.bs-dw-f label { flex: 0 0 84px; color: var(--bs-ink3); }\n.bs-dw-f > span { flex: 1; text-align: right; color: var(--bs-ink); }\n.bs-dw-sub { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font-size: 11.5px; color: var(--bs-ink3); }\n.bs-dw-sub::after { content: \"\"; flex: 1; height: 1px; background: var(--bs-line); }\n.bs-flow { list-style: none; margin: 0; padding: 0 0 0 4px; }\n.bs-flow li {\n  position: relative; display: flex; align-items: center; gap: 9px;\n  padding: 0 0 14px 16px; font-size: 12px; color: var(--bs-ink3);\n}\n.bs-flow li::before { content: \"\"; position: absolute; left: 4px; top: 11px; bottom: -3px; width: 1px; background: var(--bs-line); }\n.bs-flow li:last-child::before { display: none; }\n.bs-flow li i {\n  position: absolute; left: 0; top: 4px;\n  width: 9px; height: 9px; border-radius: 50%;\n  background: #fff; border: 1.5px solid #cfd6e2;\n}\n.bs-flow li.done { color: var(--bs-ink2); }\n.bs-flow li.done i { background: var(--bs-primary); border-color: var(--bs-primary); }\n.bs-flow li span { flex: 1; }\n.bs-flow li em { font-style: normal; font-size: 11px; color: var(--bs-ink3); font-variant-numeric: tabular-nums; }\n.bs-files { list-style: none; margin: 0; padding: 0; }\n.bs-files li { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12px; color: var(--bs-ink2); cursor: pointer; }\n.bs-files li:hover { color: var(--bs-primary); }\n.bs-files li svg { width: 14px; height: 14px; color: var(--bs-ink3); }\n.bs-files li em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--bs-ink3); }\n.bs-dw-foot { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--bs-line); }\n.bs-dw-foot .bs-btn { flex: 1; justify-content: center; }\n\n/* ---------- 状态栏 ---------- */\n.bs-status {\n  flex: 0 0 auto; height: 26px;\n  display: flex; align-items: center; gap: 10px;\n  padding: 0 16px;\n  background: #fff; border-top: 1px solid var(--bs-line);\n  font-size: 11px; color: var(--bs-ink3);\n}\n.bs-conn { display: flex; align-items: center; gap: 6px; color: #17845a; }\n.bs-conn i { width: 6px; height: 6px; border-radius: 50%; background: #2fbf8f; }\n.bs-sep { color: #dbe1ea; }\n#bsSync { font-variant-numeric: tabular-nums; }\n\n/* ---------- 提示 ---------- */\n.boss-hint {\n  position: fixed;\n  left: 50%;\n  bottom: 40px;\n  transform: translateX(-50%);\n  z-index: 99991;\n  padding: 8px 16px;\n  border-radius: 999px;\n  background: rgba(20, 20, 20, .82);\n  color: #fff;\n  font-size: 12px;\n  opacity: 0;\n  transition: opacity .3s;\n  pointer-events: none;\n}\n.boss-hint.on { opacity: 1; }\n\n/* ---------- 窄屏：抽屉浮层、导航只留图标 ---------- */\n@media (max-width: 1000px) {\n  .bs-drawer.on {\n    position: absolute;\n    right: 0; top: 0; bottom: 0;\n    z-index: 5;\n    box-shadow: -8px 0 24px rgba(20, 30, 50, .14);\n  }\n}\n\n/* 抽屉浮在列表上方时压一层浅遮罩，让人看出是「弹出来的详情」而不是表格被截断。\n   遮罩不吃点击，后面那一列行仍然可以直接点着切换 */\n.bs-scrim { display: none; }\n@media (max-width: 1000px) {\n  .bs-scrim.on {\n    display: block;\n    position: absolute;\n    inset: 0;\n    z-index: 4;\n    background: rgba(20, 30, 50, .16);\n    pointer-events: none;\n  }\n}\n\n/* 手机屏太窄，抽屉改成整屏详情页，免得底下剩一条被压成两字的表格 */\n@media (max-width: 640px) {\n  .bs-drawer.on { left: 0; width: auto; box-shadow: none; }\n}\n@media (max-width: 780px) {\n  .bs-nav { flex: 0 0 54px; }\n  .bs-nav-item { justify-content: center; margin: 0 6px; padding: 10px 0; }\n  .bs-nav-item span, .bs-nav-item .bs-cnt, .bs-nav-t, .bs-nav-foot .bs-me-t { display: none; }\n  .bs-nav-foot { justify-content: center; padding: 12px 0; }\n  .bs-search { flex: 1 1 auto; min-width: 0; }\n  .bs-clock, .bs-me-t, .bs-brand b { display: none; }\n  .bs-main { padding: 12px 12px 0; }\n  .bs-head h2 { font-size: 15px; }\n  .bs-metrics { display: none; }\n}\n\n/* ============================ 伪装场景选择面板 ============================ */\n\n.scene-picker {\n  position: fixed;\n  z-index: 9997;\n  width: 336px;\n  max-width: calc(100vw - 24px);\n  padding: 14px;\n  border-radius: 14px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: 0 18px 44px rgba(24, 31, 61, .16);\n  animation: spIn .16s ease;\n}\nhtml[data-theme=\"dark\"] .scene-picker { box-shadow: 0 18px 44px rgba(0, 0, 0, .5); }\n@keyframes spIn {\n  from { opacity: 0; transform: translateY(-6px); }\n  to { opacity: 1; transform: none; }\n}\n.sp-head b { display: block; font-size: 13.5px; }\n.sp-head small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--ink-3); }\n.sp-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }\n.sp-item {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  padding: 9px 44px 9px 11px;\n  border-radius: 10px;\n  border: 1px solid var(--line);\n  background: var(--surface);\n  color: var(--ink);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n  transition: border-color .15s, background .15s;\n}\n.sp-item:hover { border-color: #c6d2e8; background: var(--surface-2); }\n.sp-dot {\n  width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto;\n  background: var(--sp-c, var(--brand));\n}\n.sp-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }\n.sp-item b { font-size: 13px; font-weight: 700; }\n.sp-item small { font-size: 11.5px; color: var(--ink-3); }\n.sp-item .sp-sub { font-size: 11px; opacity: .9; }\n.sp-item.on { border-color: var(--brand); background: rgba(91, 110, 245, .07); }\n.sp-item.on i {\n  position: absolute;\n  top: 50%;\n  right: 11px;\n  transform: translateY(-50%);\n  font-style: normal;\n  font-size: 10.5px;\n  font-weight: 700;\n  color: var(--brand);\n}\n.sp-foot {\n  padding-top: 10px;\n  border-top: 1px dashed var(--line);\n  font-size: 11px;\n  line-height: 1.6;\n  color: var(--ink-3);\n}\n\n/* ============================ 响应式 ============================ */\n\n@media (max-width: 640px) {\n  .wrap { padding: 0 18px; }\n  .topbar { height: 66px; }\n  .kbd-hint { display: none; }\n  .hero { padding: 22px 0 18px; }\n  .grid { grid-template-columns: 1fr; gap: 14px; }\n  .g-bar { padding: 14px 16px 10px; }\n  .g-stage { padding: 6px 14px 18px; }\n  .ms-board { --ms: 26px; }\n  .ms-cell { font-size: 12px; }\n  .footer { font-size: 12px; }\n  .logo-text small { display: none; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }\n}\n</style>\n<link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='%235b6ef5'/><circle cx='20' cy='20' r='9' fill='white' opacity='.92'/><circle cx='24' cy='17' r='2.6' fill='%235b6ef5'/></svg>\">\n</head>\n<body><div id=\"demo-note\" role=\"status\" style=\"text-align:center;color:#5b6ef5\"></div>\n\n<div class=\"wrap\">\n\n  <header class=\"topbar\">\n    <a class=\"logo\" his.stampClock();\n    },\n\n    /* ----------------------- 事件 ----------------------- */\n    bind: function () {\n      var self = this;\n      var layer = this.layer;\n\n      layer.addEventListener('click', function (e) {\n        e.stopPropagation();\n        var t = e.target;\n        if (!t || !t.closest) return;\n        var el;\n\n        if ((el = t.closest('.bs-nav-item'))) { self.switchPanel(el.dataset.key); return; }\n        if ((el = t.closest('th[data-col]'))) { self.sortBy(parseInt(el.dataset.col, 10)); return; }\n        if ((el = t.closest('tr.bs-row'))) { self.selectRow(parseInt(el.dataset.row, 10)); return; }\n        if ((el = t.closest('.bs-chip'))) { self.filterStatus(el.dataset.st || ''); return; }\n        if ((el = t.closest('[data-pg]'))) { self.goPage(el.dataset.pg); return; }\n        if (t.closest('#bsRefresh')) { self.refresh(); return; }\n        if (t.closest('#bsExport')) { global.FB.toast('导出任务已提交，可在「下载中心」查看'); return; }\n        if (t.closest('.bs-dw-print')) { global.FB.toast('已发送至打印队列'); return; }\n        if (t.closest('.bs-dw-close')) { self.selectRow(-1); return; }\n      });\n\n      this._els.search.addEventListener('input', function () {\n        self.q = this.value.trim();\n        self.page = 0;\n        self.selIndex = -1;\n        self.renderMain();\n        self.renderDrawer();\n      });\n      this._els.search.addEventListener('keydown', function (e) {\n        if (e.key === 'Enter') e.preventDefault();\n      });\n    },\n\n    /* ----------------------- 渲染 ----------------------- */\n    /* 顶部指标卡：每套身份一套指标，是最直观的\"这是另一套系统\"的视觉锚点 */\n    metricsHtml: function () {\n      var ms = this.scene().metrics || [];\n      if (!ms.length) return '';\n      return ms.map(function (m) {\n        return '<div class=\"bs-metric\">' +\n          '<span class=\"bs-metric-l\">' + m.l + '</span>' +\n          '<span class=\"bs-metric-v\">' + m.v + (m.u ? '<em>' + m.u + '</em>' : '') + '</span>' +\n          '<span class=\"bs-metric- PAGE;\n      var view = rows.slice(start, start + BOSS_PER_PAGE);\n\n      /* 表头：列宽按权重换算成百分比，任何容器宽度下都恰好铺满，\n         不会出现某一列被挤出视野或半截裁掉的情况 */\n      var IDX_W = 44;             /* 序号列 */\n      var FLEX_W = 190;           /* 主标题列（未指定宽度）的基准权重 */\n      var weights = [];\n      var totalW = IDX_W;\n      for (var wi = 0; wi < pn.cols.length; wi++) {\n        var wc = pn.cols[wi];\n        /* 状态列里是可换行不了的标签，给个下限，避免被压成半截 */\n        var ww = wc.k === 'status' ? Math.max(wc.w || 0, 104) : (wc.w || FLEX_W);\n        weights.push(ww);\n        totalW += ww;\n      }\n      var pct = function (v) { return (v / totalW * 100).toFixed(3) + '%'; };\n\n      var thead = '<tr><th class=\"bs-idx\" style=\"width:' + pct(IDX_W) + '\">#</th>';\n      for (var i = 0; i < pn.cols.length; i++) {\n        var c = pn.cols[i];\n        var cls = this.sortCol === i ? ' sorted' : '';\n        var arrow = this.sortCol === i ? (this.sortDir > 0 ? ' ↑' : ' ↓') : '';\n        thead += '<th data-col=\"' + i + '\" class=\"bs-col-' + (c.k || 'text') + cls +\n          '\" style=\"width:' + pct(weights[i]) + '\">' + c.l + arrow + '</th>';\n      }\n      thead += '</tr>';\n      L.querySelector('#bsThead').innerHTML = thead;\n\n      /* 容器够宽就按比例铺满；窄到放不下时才设下限，宁可横向滚动，\n         也别把文字压成「需…」「招…」这种一列一个字的碎片 */\n      var tableEl = L.querySelector('.bs-table');\n      var wrapW = (L.querySelector('.bs-tablewrap') || {}).clientWidth || 0;\n      tableEl.style.minWidth = wrapW >= 640 ? '0px' : Math.max(620, Math.min(totalW, 880)) + 'px';\n\n      /* 表体 */\n      var tb = '';\n      if (!view.length) {\n        tb = '<tr class=\"bs-empty\"><td colspan=\"' + (pn.cols.length + 1) + '\">没有匹配的记录，试试调整搜索词或筛选条件</td></tr>';\n      } else {\n        view.forEach(function (it, idx) {\n          tb += '<tr class=\"bs-row' + (it.i === self.selIndex ? ' on' : '') + '\" data-row=\"' + it.i + '\">' +\n            '<td class=\"bs-idx\">' + (start + idx + 1) + '</td>';\n          for (var ci = 0; ci < pn.cols.length; ci++) {\n            var col = pn.cols[ci] || {};\n            var v = it.cells[ci] === undefined ? '' : it.cells[ci];\n            if (col.k === 'status') {\n              tb += '<td><span class=\"bs-tag ' + bossStatusKind(v) + '\">' + v + '</span></td>';\n            } else {\n              var tip = (v === undefined || v === '') ? '' : ' title=\"' + String(v).replace(/\"/g, '&quot;') + '\"';\n              tb += '<td class=\"' + (col.k ? 'bs-' + col.k : '') + '\"' + tip + '>' + v + '</td>';\n            }\n          }\n          tb += '</tr>';\n        });\n      }\n      L.querySelector('#bsTbody').innerHTML = tb;\n\n      /* 分页 */\n      L.querySelector('#bsPager').innerHTML =\n        '<span class=\"bs-total\">共 ' + rows.length + ' 条' +\n          (this.q || this.statusFilter ? ' · 已筛选' : '') + '</span>' +\n        '<span class=\"bs-grow\"></span>' +\n        '<button class=\"bs-pg\" data-pg=\"prev\"' + (this.page === 0 ? ' disabled' : '') + '>上一页</button>' +\n        '<span class=\"bs-pgn\">' + (this.page + 1) + ' / ' + pages + '</span>' +\n        '<button class=\"bs-pg\" data-pg=\"next\"' + (this.page >= pages - 1 ? ' disabled' : '') + '>下一页</button>';\n    },\n\n    renderDrawer: function () {\n      var d = this.layer.querySelector('#bsDrawer');\n      var pn = this.scene().panels[this.panelKey];\n      var row = pn && this.selIndex > -1 ? pn.rows[this.selIndex] : null;\n      var scrim = this.layer.querySelector('#bsScrim');\n      if (scrim) scrim.classList.toggle('on', !!row);\n      if (!row) {\n        d.classList.remove('on');\n        d.innerHTML = '';\n        return;\n      }\n\n      var sc = this.scene();\n      var si = this.statusCol(pn);\n      var ti = this.titleCol(pn);\n      var status = si > -1 ? row[si] : '';\n\n      /* 流程走到第几步：按状态粗略推断，只求看起来合理。\n         模块可自带流程（如人力里「员工档案」不该用招聘流程），否则用场景默认 */\n      var nodes = pn.flow || sc.flow || ['登记', '受理', '处理', '完成'];\n      var kind = bossStatusKind(status);\n      var stopAt;\n      if (kind === 'danger ar grid = document.getElementById('grid');\n  var countEl = document.getElementById('count');\n  var currentTag = 'all';\n\n  function render() {\n    var list = GAMES.filter(function (g) { return currentTag === 'all' || g.tag === currentTag; });\n    grid.innerHTML = list.map(function (g, i) {\n      var best = FB.Store.getBest(g.id);\n      /* 各类游戏的「战绩」含义不同（最高分 / 最佳步数 / 通关数 / 胜负），各游戏自己给文案 */\n      var foot = g.stat\n        ? g.stat()\n        : (best > 0 ? '最高 <b>' + FB.fmtNum(best) + '</b>' : '未挑战');\n      return '' +\n        '<a class=\"card\" href=\"' + g.url + '\" style=\"--card-bg:' + g.bg + ';--card-accent:' + g.accent +\n        ';animation-delay:' + (i * 55) + 'ms\">' +\n        (g.fire ? '<span class=\"card-fire\">最受欢迎</span>' : '') +\n        '<div class=\"card-head\">' +\n          '<span class=\"card-icon\">' + g.icon + '</span>' +\n          '<div>' +\n            '<h3 class=\"card-title\">' + g.name + '</h3>' +\n            '<p class=\"card-desc\">' + g.desc + '</p>' +\n          '</div>' +\n        '</div>' +\n        '<div class=\"card-foot\">' +\n          '<span class=\"tag\">' + g.tag + '</span>' +\n          '<span>' + g.meta + '</span>' +\n          '<span class=\"card-best\">' + foot + '</span>' +\n        '</div>' +\n      '</a>';\n    }).join('');\n    countEl.textContent = list.length + ' 款';\n  }\n\n  document.getElementById('filters').addEventListener('click', function (e) {\n    var btn = e.target.closest('.chip');\n    if (!btn) return;\n    document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });\n    btn.classList.add('on');\n    currentTag = btn.dataset.tag;\n    render();\n    FB.Sound.play('click');\n  });\n\n  grid.addEventListener('click', function (e) {\n    if (e.target.closest('.card')) FB.Sound.play('click');\n  });\n\n  /* ------------------ 工作界面伪装场景选择 ------------------ */\n  (function initScenePicker() {\n    var btn = document.querySelector('[data-boss-scene]');\n    if (!btn || !FB.Boss || !FB.Boss.sceneMeta) return;\n\n    var panel = null;\n\n    function close() {\n      if (!panel) return;\n      panel.remove();\n      panel = null;\n      document.removeEventListener('click', onDoc, true);\n    }\n\n    function onDoc(e) {\n      if (panel && !panel.contains(e.target) && !btn.contains(e.target)) close();\n    }\n\n    function open() {\n      var meta = FB.Boss.sceneMeta();\n      var cur = FB.Boss.getSceneId();\n\n      panel = document.createElement('div');\n      panel.className = 'scene-picker';\n      panel.innerHTML =\n        '<div class=\"sp-head\"><b>工作界面伪装场景</b>' +\n          '<small>按 Esc 或右键切过去时，显示哪一套系统</small></div>' +\n        '<div class=\"sp-list\">' + meta.map(function (m) {\n          return '<button class=\"sp-item' + (m.id === cur ? ' on' : '') + '\" data-id=\"' + m.id + '\">' +\n            '<span class=\"sp-dot\" style=\"--sp-c:' + m.accent + '\"></span>' +\n            '<span class=\"sp-txt\"><b>' + m.name + '</b><small>' + m.desc + '</small>' +\n              '<small class=\"sp-sub\">' + m.product + ' · ' + m.user + '</small></span>' +\n            (m.id === cur ? '<i>当前</i>' : '') + '</button>';\n        }).join('') + '</div>' +\n        '<div class=\"sp-foot\">选一套身份会立即切过去给你看一眼，按 <b>Esc</b> 或右键回到游戏。<br>' +\n          '六套系统的项目、金额、人名均为虚构占位数据，不含任何真实信息。</div>';\n\n      document.body.appendChild(panel);\n\n      var r = btn.getBoundingClientRect();\n      panel.style.top = (r.bottom + 8) + 'px';\n      panel.style.right = Math.max(12, window.innerWidth - r.right - 8) + 'px';\n\n      panel.addEventListener('click', function (e) {\n        var it = e.target.closest('.sp-item');\n        if (!it) return;\n        var name = '';\n        meta.forEach(function (m) { if (m.id === it.dataset.id) name = m.name; });\n        FB.Boss.setScene(it.dataset.id);\n        close();\n        FB.Sound.play('click');\n        /* 选完直接切过去看一眼，否则\"换了身份但界面没动静\"很容易被当成没生效 */\n        FB.Boss.show();\n        FB.toast('已切换为「' + name + '」，Esc 或右键回  0) 70%);\n  --surface: #191d29;\n  --surface-2: #141822;\n  --ink: #eef1fa;\n  --ink-2: #9ba3ba;\n  --ink-3: #6f7790;\n  --line: #29303f;\n  --line-2: #222836;\n  --brand-soft: #232a45;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);\n  --shadow: 0 2px 6px rgba(0, 0, 0, .3), 0 16px 36px -14px rgba(0, 0, 0, .6);\n  --shadow-lg: 0 20px 60px -16px rgba(0, 0, 0, .7);\n}\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\",\n    \"Hiragino Sans GB\", \"Microsoft YaHei\", \"Helvetica Neue\", Arial, sans-serif;\n  background: var(--bg);\n  background-image: var(--bg-grad);\n  background-repeat: no-repeat;\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  line-height: 1.6;\n  min-height: 100vh;\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n::selection { background: var(--brand); color: #fff; }\n\n.wrap { max-width: 1120px; margin: 0 auto; padding: 0 26px; }\n\n/* ============================ 通用控件 ============================ */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  height: 40px;\n  padding: 0 18px;\n  border-radius: 11px;\n  font-size: 14px;\n  font-weight: 600;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  color: var(--ink);\n  box-shadow: var(--shadow-sm);\n  transition: transform .16s cubic-bezier(.3, 1.4, .5, 1), box-shadow .18s, background .18s, border-color .18s;\n  white-space: nowrap;\n  user-select: none;\n}\n.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: transparent; }\n.btn:active { transform: translateY(0) scale(.97); }\n\n.btn-primary {\n  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);\n  color: #fff;\n  border-color: transparent;\n  box-shadow: 0 6px 18px -6px rgba(91, 110, 245, . y: inline-flex;\n  align-items: center;\n  gap: 7px;\n  height: 40px;\n  padding: 0 8px 0 14px;\n  border-radius: 11px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 12.5px;\n  color: var(--ink-2);\n  box-shadow: var(--shadow-sm);\n}\nkbd {\n  font-family: var(--mono);\n  font-size: 11px;\n  font-weight: 600;\n  padding: 3px 7px;\n  border-radius: 6px;\n  background: var(--surface-2);\n  border: 1px solid var(--line);\n  border-bottom-width: 2px;\n  color: var(--ink);\n  line-height: 1;\n}\n\n/* ============================ 首页：主视觉 ============================ */\n\n.hero { padding: 34px 0 26px; }\n\n.hero-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  height: 28px;\n  padding: 0 12px;\n  border-radius: 999px;\n  background: var(--brand-soft);\n  color: var(--brand);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: .2px;\n  margin-bottom: 16px;\n}\n.hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 2s infinite; }\n@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }\n\n.hero h1 {\n  margin: 0 0 12px;\n  font-size: clamp(30px, 4.4vw, 46px);\n  line-height: 1.15;\n  letter-spacing: -1.2px;\n  font-weight: 800;\n}\n.hero h1 em {\n  font-style: normal;\n  background: linear-gradient(115deg, var(--brand) 0%, var(--brand-2) 60%, #ec6ea8 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n}\n.hero p { margin: 0; color: var(--ink-2); font-size: 15.5px; max-width: 620px; }\n.hero p b { color: var(--ink); font-weight: 700; }\n\n/* ============================ 首页：筛选 ============================ */\n\n.filters {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  flex-wrap: wrap;\n  margin: 30px 0 18px;\n  padding-bottom: 2px;\n}\n.chip {\n  height: 34px;\n  padding: 0 15px;\n  border-radius: 999px;\n  font-size: 13.5px;\n  font-weight: 600;\n  color: var(--ink-2);\n  background: transparent;\n  border: 1px solid transparent;\n  transition: all .18s;\n}\n.chip:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }\n.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }\nhtml[data-theme=\"dark\"] .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }\n.filters .count { margin-left: auto; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }\n\n/* ============================ 首页：卡片网格 ============================ */\n\n.grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));\n  gap: 18px;\n  padding-bottom: 70px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 15px;\n  padding: 20px;\n  border-radius: var(--radius);\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  transition: transform .26s cubic-bezier(.25, 1, .4, 1), box-shadow .26s, border-color .26s;\n  overflow: hidden;\n  opacity: 0;\n  transform: translateY(12px);\n  animation: cardIn .5s cubic-bezier(.22, 1, .36, 1) forwards;\n}\n@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }\n\n.card::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: inherit;\n  background: var(--card-accent, #5b6ef5);\n  opacity: 0;\n  transition: opacity .3s;\n  pointer-events: none;\n  mix-blend-mode: normal;\n}\n.card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: transparent; }\n.card:hover::after { opacity: .045; }\n.card:active { transform: translateY(-2px) scale(.99); }\n\n.card-head { display: flex; align-items: flex-start; gap: 13px; }\n\n.card-icon {\n  width: 52px;\n  height: 52px;\n  flex: 0 0 52px;\n  border-radius: 15px;\n  display: grid;\n  place-items: center;\n  background: var(--card-bg, #eef1ff);\n  box-shadow: inset 0 0 0 1px rgba(255, 255,  14px;\n}\n.g-back {\n  width: 40px;\n  height: 40px;\n  border-radius: 11px;\n  display: grid;\n  place-items: center;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  transition: transform .16s, background .18s;\n  flex: 0 0 auto;\n}\n.g-back:hover { transform: translateX(-2px); background: var(--brand-soft); }\n.g-back svg { width: 17px; height: 17px; }\n.g-name { font-size: 17px; font-weight: 750; letter-spacing: -.2px; }\n.g-name small { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }\n.g-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }\n\n.g-stage {\n  flex: 1;\n  width: 100%;\n  max-width: 800px;\n  margin: 0 auto;\n  padding: 8px 22px 24px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: flex-start;\n}\n\n.g-hint {\n  text-align: center;\n  color: var(--ink-3);\n  font-size: 12.5px;\n  padding: 0 20px 30px;\n  line-height: 1.9;\n}\n.g-hint b { color: var(--ink-2); font-weight: 600; }\n\n/* 分数条 */\n.scorebar {\n  display: flex;\n  gap: 10px;\n  width: 100%;\n  justify-content: center;\n  margin-bottom: 14px;\n  flex-wrap: wrap;\n}\n.score-box {\n  min-width: 92px;\n  padding: 9px 16px 10px;\n  border-radius: 13px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow-sm);\n  text-align: center;\n}\n.score-box .lb { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; color: var(--ink-3); text-transform: uppercase; }\n.score-box .val { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; line-height: 1.25; }\n.score-box.accent .val { color: var(--brand); }\n\n/* 通用遮罩 */\n.overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 500;\n  display: grid;\n  place-items: center;\n  padding: 24px;\n  background: rgba(16, 20, 34, .42);\n  backdrop-filter: blur(6px);\n  -webkit-backdrop-filter: blur(6px);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity .26s;\n}\n.overlay.on { opacity: 1; pointer-events: auto; }\n.overlay-card {\n  width: 100%;\n  max-width: 320px;\n  padding: 28px 26px 24px;\n  border-radius: 22px;\n  background: var(--surface);\n  box-shadow: var(--shadow-lg);\n  text-align: center;\n  transform: translateY(14px) scale(.96);\n  transition: transform .34s cubic-bezier(.22, 1.4, .4, 1);\n}\n.overlay.on .overlay-card { transform: translateY(0) scale(1); }\n.overlay-card h3 { margin: 0 0 6px; font-size: 21px; font-weight: 800; letter-spacing: -.4px; }\n.overlay-card p { margin: 0 0 20px; color: var(--ink-2); font-size: 13.5px; }\n.overlay-card .big { font-size: 34px; font-weight: 850; color: var(--brand); letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 4px 0 2px; }\n.overlay-actions { display: flex; gap: 10px; }\n.overlay-actions .btn { flex: 1; }\n\n/* ============================ 2048 ============================ */\n\n.g2048 { --gap: 10px; --tile: calc((100% - 5 * var(--gap)) / 4); position: relative; width: 100%; max-width: 400px; padding: var(--gap); border-radius: 16px; background: #e9edf7; border: 1px solid var(--line); box-shadow: var(--shadow-sm); touch-action: none; }\nhtml[data-theme=\"dark\"] .g2048 { background: #232a3a; }\n.g2048::after { content: \"\"; display: block; padding-top: 100%; }\n.g2048 .cells { position: absolute; inset: var(--gap); }\n.g2048 .cellbg { position: absolute; width: var(--tile); height: var(--tile); border-radius: 9px; background: #dde3f0; }\nhtml[data-theme=\"dark\"] .g2048 .cellbg { background: #2c3446; }\n.g2048 .tile {\n  position: absolute;\n  width: var(--tile);\n  height: var(--tile);\n  border-radius: 9px;\n  display: grid;\n  place-items: center;\n  font-weight: 800;\n  font-size: 27px;\n  letter-spacing: -.8px;\n  color: #6b5b4a;\n  background: #eee4da;\n  transition: left .13s ease, top .13s ease, background .16s, color .16s, transform .16 \n\n/* ---------- 顶部指标卡（每套身份一套指标，颜色跟随身份） ---------- */\n.bs-metrics { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: nowrap; }\n.bs-metrics:empty { display: none; }\n.bs-metric {\n  flex: 1 1 0; min-width: 0;\n  display: flex; flex-direction: column; gap: 1px;\n  padding: 9px 12px 10px;\n  background: #fff;\n  border: 1px solid var(--bs-line);\n  border-top: 2px solid var(--bs-primary);\n  border-radius: 6px;\n}\n.bs-metric-l {\n  font-size: 11px; color: var(--bs-ink3);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.bs-metric-v {\n  font-size: 19px; font-weight: 700; letter-spacing: .2px;\n  font-variant-numeric: tabular-nums; white-space: nowrap;\n  overflow: hidden; text-overflow: ellipsis;\n}\n.bs-metric-v em { font-style: normal; font-size: 11px; font-weight: 500; color: var(--bs-ink3); margin-left: 3px; }\n.bs-metric-d { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.bs-metric-d.good { color: #14875c; }\n.bs-metric-d.warn { color: #c07a12; }\n.bs-metric-d.flat { color: var(--bs-ink3); }\n\n/* ---------- 表格 ---------- */\n.bs-tablewrap {\n  flex: 1; min-height: 0; overflow: auto;\n  background: #fff; border: 1px solid var(--bs-line); border-radius: 6px;\n}\n.bs-table { width: 100%; border-collapse: collapse; table-layout: fixed; }\n.bs-table th, .bs-table td {\n  text-align: left; padding: 0 9px; height: 38px;\n  border-bottom: 1px solid #eef1f6;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.bs-table thead th {\n  position: sticky; top: 0; z-index: 2;\n  background: #f7f9fc; color: var(--bs-ink2);\n  font-weight: 600; font-size: 11.5px;\n  cursor: pointer; user-select: none;\n  border-bottom: 1px solid var(--bs-line);\n}\n.bs-table thead th:hover { background: #eef2f9; }\n.bs-table thead th.sorted { color: var(--bs-primary); }\n.bs-table th.bs-idx, .bs-table td.bs-idx { width: 44px; text-align: center; color: var(--bs-ink3); font-size: 11px; }\n.bs-table thead th.bs-idx { cursor: default; }\n.bs-table td.bs-no { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 11.5px; color: #4d5b73; }\n.bs-table td.bs-strong { font-weight: 500; color: #1d2534; }\n.bs-table td.bs-num { text-align: right; font-variant-numeric: tabular-nums; }\n.bs-table td.bs-date { font-variant-numeric: tabular-nums; color: #4d5b73; }\n.bs-table td.bs-mute { color: var(--bs-ink3); }\n.bs-row { cursor: pointer; }\n.bs-row:hover td { background: #f8fafd; }\n.bs-row.on td { background: var(--bs-primary-soft); }\n.bs-row.on td:first-child { box-shadow: inset 2px 0 0 var(--bs-primary); }\n\n.bs-empty td { text-align: center; color: var(--bs-ink3); height: 130px; font-size: 12px; }\n\n/* ---------- 状态标签 ---------- */\n.bs-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; line-height: 1.5; }\n.bs-tag.ok { background: #e7f7ef; color: #17845a; }\n.bs-tag.info { background: var(--bs-primary-soft); color: var(--bs-primary); }\n.bs-tag.warn { background: #fff4e5; color: #b3730a; }\n.bs-tag.danger { background: #fdeaea; color: #c53a36; }\n.bs-tag.mute { background: #f0f2f5; color: #6b7789; }\n\n/* ---------- 分页 ---------- */\n.bs-pager { flex: 0 0 auto; height: 46px; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--bs-ink3); }\n.bs-grow { flex: 1; }\n.bs-total { white-space: nowrap; }\n.bs-pg {\n  height: 26px; padding: 0 10px; border-radius: 4px;\n  border: 1px solid var(--bs-line); background: #fff; color: var(--bs-ink2);\n  font: inherit; cursor: pointer;\n}\n.bs-pg:hover:not(:disabled) { border-color: #b9c6dd; color: var(--bs-ink); }\n.bs-pg:disabled { opacity: .45; cursor: default; }\n.bs-pgn { font-variant-numeric: tabular-nums; }\n\n/* ---------- 详情抽屉 ---------- */\n.bs-drawer {\n  display: none; flex-direction: column;\n  flex: 0 0 330px; width: 330px;\n  background: #fff; border-left: 1px solid var(--bs-line);\n}\n.bs-drawer.on { display: flex; }\n.bs-dw-head {\n  flex: 0 0 auto; height: 44px;\n  display: flex; align-items: center;\n  padding: 0 8px 0 16px;\n  border-bottom: 1px solid var(--bs-line);\n}\n.bs-dw-head b { font-size: 13px; }\n.bs-dw-close {\n  margin-left: auto; width: 30px; height: 30px;\n  border: 0; background: transparent; color: var(--bs-ink3);\n  border-radius: 4px; cursor: pointer; display: grid; place-items: center;\n}\n.bs-dw-close:hover { background: #f2f4f8; color: var(--bs-ink); }\n.bs-dw-body { flex: 1; overflow: auto; padding: 14px 16px 20px; }\n.bs-dw-title { font-size: 14px; font-weight: 600; line-height: 1.45; margin-bottom: 8px; color: #1d2534; }\n.bs-dw-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }\n.bs-dw-no { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--bs-ink3); }\n.bs-dw-fields { border-radius: 5px; overflow: hidden; background: #fff; border: 1px solid #eef1f6; }\n.bs-dw-f { display: flex; gap: 12px; padding: 7px 10px; border-bottom: 1px solid #f0f3f8; font-size: 12px; }\n.bs-dw-f:last-child { border-bottom: 0; }\n.bs-dw-f label { flex: 0 0 84px; color: var(--bs-ink3); }\n.bs-dw-f > span { flex: 1; text-align: right; color: var(--bs-ink); }\n.bs-dw-sub { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font-size: 11.5px; color: var(--bs-ink3); }\n.bs-dw-sub::after { content: \"\"; flex: 1; height: 1px; background: var(--bs-line); }\n.bs-flow { list-style: none; margin: 0; padding: 0 0 0 4px; }\n.bs-flow li {\n  position: relative; display: flex; align-items: center; gap: 9px;\n  padding: 0 0 14px 16px; font-size: 12px; color: var(--bs-ink3);\n}\n.bs-flow li::before { content: \"\"; position: absolute; left: 4px; top: 11px; bottom: -3px; width: 1px; background: var(--bs-line); }\n.bs-flow li:last-child::before { display: none; }\n.bs-flow li i {\n  position: absolute; left: 0; top: 4px;\n  width: 9px; height: 9px; border-radius: 50%;\n  background: #fff; border: 1.5px solid #cfd6e2;\n}\n.bs-flow li.done { color: var(--bs-ink2); }\n.bs-flow li.done i { background: var(--bs-primary); border-color: var(--bs-primary); }\n.bs-flow li span { flex: 1; }\n.bs-flow li em { font-style: normal; font-size: 11px; color: var(--bs-ink3); font-variant-numeric: tabular-nums; }\n.bs-files { list-style: none; margin: 0; padding: 0; }\n.bs-files li { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12px; color: var(--bs-ink2); cursor: pointer; }\n.bs-files li:hover { color: var(--bs-primary); }\n.bs-files li svg { width: 14px; height: 14px; color: var(--bs-ink3); }\n.bs-files li em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--bs-ink3); }\n.bs-dw-foot { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--bs-line); }\n.bs-dw-foot .bs-btn { flex: 1; justify-content: center; }\n\n/* ---------- 状态栏 ---------- */\n.bs-status {\n  flex: 0 0 auto; height: 26px;\n  display: flex; align-items: center; gap: 10px;\n  padding: 0 16px;\n  background: #fff; border-top: 1px solid var(--bs-line);\n  font-size: 11px; color: var(--bs-ink3);\n}\n.bs-conn { display: flex; align-items: center; gap: 6px; color: #17845a; }\n.bs-conn i { width: 6px; height: 6px; border-radius: 50%; background: #2fbf8f; }\n.bs-sep { color: #dbe1ea; }\n#bsSync { font-variant-numeric: tabular-nums; }\n\n/* ---------- 提示 ---------- */\n.boss-hint {\n  position: fixed;\n  left: 50%;\n  bottom: 40px;\n  transform: translateX(-50%);\n  z-index: 99991;\n  padding: 8px 16px;\n  border-radius: 999px;\n  background: rgba(20, 20, 20, .82);\n  color: #fff;\n  font-size: 12px;\n  opacity: 0;\n  transition: opacity .3s;\n  pointer-events: none;\n}\n.boss-hint.on { opacity: 1; }\n\n/* ---------- 窄屏：抽屉浮层、导航只留图标 ---------- */\n@media (max-width: 1000px) {\n  .bs-drawer.on {\n    position: absolute;\n    right: 0; top: 0; bottom: 0;\n    z-index: 5;\n    box-shadow: -8px 0 24px rgba(20, 30, 50, .14);\n  }\n}\n\n/* 抽屉浮在列表上方时压一层浅遮罩，让人看出是「弹出来的详情」而不是表格被截断。\n   遮罩不吃点击，后面那一列行仍然可以直接点着切换 */\n.bs-scrim { display: none; }\n@media (max-width: 1000px) {\n  .bs-scrim.on {\n    display: block;\n    position: absolute;\n    inset: 0;\n    z-index: 4;\n    background: rgba(20, 30, 50, .16);\n    pointer-events: none;\n  }\n}\n\n/* 手机屏太窄，抽屉改成整屏详情页，免得底下剩一条被压成两字的表格 */\n@media (max-width: 640px) {\n  .bs-drawer.on { left: 0; width: auto; box-shadow: none; }\n}\n@media (max-width: 780px) {\n  .bs-nav { flex: 0 0 54px; }\n  .bs-nav-item { justify-content: center; margin: 0 6px; padding: 10px 0; }\n  .bs-nav-item span, .bs-nav-item .bs-cnt, .bs-nav-t, .bs-nav-foot .bs-me-t { display: none; }\n  .bs-nav-foot { justify-content: center; padding: 12px 0; }\n  .bs-search { flex: 1 1 auto; min-width: 0; }\n  .bs-clock, .bs-me-t, .bs-brand b { display: none; }\n  .bs-main { padding: 12px 12px 0; }\n  .bs-head h2 { font-size: 15px; }\n  .bs-metrics { display: none; }\n}\n\n/* ============================ 伪装场景选择面板 ============================ */\n\n.scene-picker {\n  position: fixed;\n  z-index: 9997;\n  width: 336px;\n  max-width: calc(100vw - 24px);\n  padding: 14px;\n  border-radius: 14px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  box-shadow: 0 18px 44px rgba(24, 31, 61, .16);\n  animation: spIn .16s ease;\n}\nhtml[data-theme=\"dark\"] .scene-picker { box-shadow: 0 18px 44px rgba(0, 0, 0, .5); }\n@keyframes spIn {\n  from { opacity: 0; transform: translateY(-6px); }\n  to { opacity: 1; transform: none; }\n}\n.sp-head b { display: block; font-size: 13.5px; }\n.sp-head small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--ink-3); }\n.sp-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }\n.sp-item {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  padding: 9px 44px 9px 11px;\n  border-radius: 10px;\n  border: 1px solid var(--line);\n  background: var(--surface);\n  color: var(--ink);\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n  transition: border-color .15s, background .15s;\n}\n.sp-item:hover { border-color: #c6d2e8; background: var(--surface-2); }\n.sp-dot {\n  width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto;\n  background: var(--sp-c, var(--brand));\n}\n.sp-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }\n.sp-item b { font-size: 13px; font-weight: 700; }\n.sp-item small { font-size: 11.5px; color: var(--ink-3); }\n.sp-item .sp-sub { font-size: 11px; opacity: .9; }\n.sp-item.on { border-color: var(--brand); background: rgba(91, 110, 245, .07); }\n.sp-item.on i {\n  position: absolute;\n  top: 50%;\n  right: 11px;\n  transform: translateY(-50%);\n  font-style: normal;\n  font-size: 10.5px;\n  font-weight: 700;\n  color: var(--brand);\n}\n.sp-foot {\n  padding-top: 10px;\n  border-top: 1px dashed var(--line);\n  font-size: 11px;\n  line-height: 1.6;\n  color: var(--ink-3);\n}\n\n/* ============================ 响应式 ============================ */\n\n@media (max-width: 640px) {\n  .wrap { padding: 0 18px; }\n  .topbar { height: 66px; }\n  .kbd-hint { display: none; }\n  .hero { padding: 22px 0 18px; }\n  .grid { grid-template-columns: 1fr; gap: 14px; }\n  .g-bar { padding: 14px 16px 10px; }\n  .g-stage { padding: 6px 14px 18px; }\n  .ms-board { --ms: 26px; }\n  .ms-cell { font-size: 12px; }\n  .footer { font-size: 12px; }\n  .logo-text small { display: none; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }\n}\n</style>\n</head>\n<body class=\"game-page\">\n\n<div class=\"g-bar\">\n  <a class=\"g-back\" href=\"#\" onclick=\"parent.postMessage({demo: 'home'}, '*');return false\" aria-label=\"返回首页\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"/></svg>\n  </a>\n  <div class=\"g-name\">合成 2048<small>滑动合并相同数字</small></div>\n  <div class=\"g-tools\">\n    <button cla se this.show();\n    },\n\n    init: function () {\n      var self = this;\n\n      /* 捕获阶段截获键盘：伪装层打开时游戏收不到任何按键，\n         否则在搜索框里打字会把游戏操作一通（空格硬降、方向键移动）。\n         不 preventDefault，输入框照常输入。 */\n      document.addEventListener('keydown', function (e) {\n        if (self.active) {\n          if (e.key === 'Escape' || e.key === 'Esc') {\n            e.preventDefault();\n            self.hide();\n          } else {\n            e.stopPropagation();\n          }\n          return;\n        }\n        if (e.key === 'Escape' || e.key === 'Esc') {\n          e.preventDefault();\n          self.show();\n        }\n      }, true);\n\n      /* 右键：手不用离开鼠标，比找 Esc 快。\n         用冒泡阶段监听，游戏可对某块区域 stopPropagation 来豁免（如扫雷插旗）。 */\n      document.addEventListener('contextmenu', function (e) {\n        e.preventDefault();\n        self.toggle();\n      });\n\n      /* 中键：扫雷棋盘上右键被插旗占用时的备用触发；链接上仍交给浏览器开新标签 */\n      document.addEventListener('mousedown', function (e) {\n        if (e.button === 1 && !(e.target.closest && e.target.closest('a'))) e.preventDefault();\n      });\n      document.addEventListener('auxclick', function (e) {\n        if (e.button !== 1) return;\n        if (e.target.closest && e.target.closest('a')) return;\n        e.preventDefault();\n        self.toggle();\n      });\n\n      document.querySelectorAll('[data-boss]').forEach(function (el) {\n        el.addEventListener('click', function (e) { e.preventDefault(); self.toggle(); });\n      });\n\n      /* 视口变化后重新排一次表：列宽是算出来的，不重排会留旧宽度 */\n      var rt = null;\n      global.addEventListener('resize', function () {\n        if (!self.active || !self.layer) return;\n        clearTimeout(rt);\n        rt = setTimeout(function () { if (self.active) self.renderTable(); }, 120);\n      });\n    }\n  };\n\n  /* ------------------------ 小工具 ------------------------ */\n  function toast(msg, ms) {\n    var el = document.createElement('div');\n    el.textContent = msg;\n    el.style.cssText = 'position:fixed;left:50%;bottom:34 n<script>/* ============================================================\n   合成 2048\n   ============================================================ */\n(function () {\n  'use strict';\n\n  var N = 4;\n  var boardEl = document.getElementById('board');\n  var cellsEl = document.getElementById('cells');\n  var scoreEl = document.getElementById('score');\n  var bestEl = document.getElementById('best');\n  var overlay = document.getElementById('overlay');\n  var ovTitle = document.getElementById('ovTitle');\n  var ovScore = document.getElementById('ovScore');\n  var ovSub = document.getElementById('ovSub');\n  var ovUndoBtn = document.getElementById('ovUndo');\n\n  var grid, tiles, score, best, uid, over, won, undoState, pending, paused;\n\n  /* ----------------------- 初始化 ----------------------- */\n\n  function emptyGrid() {\n    var g = [];\n    for (var r = 0; r < N; r++) {\n      g.push([null, null, null, null]);\n    }\n    return g;\n  }\n\n  function buildBackground() {\n    cellsEl.innerHTML = '';\n    for (var r = 0; r < N; r++) {\n      for (var c = 0; c < N; c++) {\n        var d = document.createElement('div');\n        d.className = 'cellbg';\n        d.style.left = cellOffset(c);\n        d.style.top = cellOffset(r);\n        cellsEl.appendChild(d);\n      }\n    }\n  }\n\n  function cellOffset(i) {\n    return 'calc(' + i + ' * (var(--tile) + var(--gap)))';\n  }\n\n  function makeTile(v, r, c, isNew) {\n    var el = document.createElement('div');\n    el.className = 'tile' + (isNew ? ' new' : '');\n    el.dataset.v = v;\n    el.textContent = v;\n    el.style.left = cellOffset(c);\n    el.style.top = cellOffset(r);\n    cellsEl.appendChild(el);\n    var t = { id: uid++, v: v, r: r, c: c, el: el, merged: false };\n    grid[r][c] = t;\n    tiles.push(t);\n    return t;\n  }\n\n  function setPos(el, r, c) {\n    el.style.left = cellOffset(c);\n    el.style.top = cellOffset(r);\n  }\n\n  function updateTileVisual(t) {\n    t.el.dataset.v = t.v;\n    t.el.textContent = t.v;\n  }\n\n  function addRandomTile() {\n    var empty = [];\n    for (var r = 0; r < N; r++) {\n      for (var c = 0; c < N; c++) {\n        if (!grid[r][c]) empty.push([r, c]);\n      }\n    }\n    if (!empty.length) return null;\n    var pick = empty[Math.floor(Math.random() * empty.length)];\n    return makeTile(Math.random() < 0.9 ? 2 : 4, pick[0], pick[1], true);\n  }\n\n  function newGame() {\n    flush();\n    grid = emptyGrid();\n    tiles = [];\n    score = 0;\n    uid = 1;\n    over = false;\n    won = false;\n    undoState = null;\n    paused = false;\n    cellsEl.innerHTML = '';\n    buildBackground();\n    addRandomTile();\n    addRandomTile();\n    updateScore();\n    overlay.classList.remove('on');\n    ovUndoBtn.style.display = '';\n  }\n\n  function updateScore() {\n    scoreEl.textContent = FB.fmtNum(score);\n    var res = FB.Store.best('2048', score);\n    best = res.best;\n    bestEl.textContent = FB.fmtNum(best);\n  }\n\n  /* ----------------------- 动画调度 ----------------------- */\n\n  function schedule(fn, ms) {\n    flush();\n    var timer = setTimeout(function () {\n      pending = null;\n      fn();\n    }, ms);\n    pending = { timer: timer, fn: fn };\n  }\n\n  function flush() {\n    if (!pending) return;\n    clearTimeout(pending.timer);\n    var fn = pending.fn;\n    pending = null;\n    fn();\n  }\n\n  /* ----------------------- 移动逻辑 ----------------------- */\n\n  function linesFor(dir) {\n    var lines = [];\n    var order = [0, 1, 2, 3];\n    var rev = order.slice().reverse();\n    var r, c;\n    if (dir === 'left' || dir === 'right') {\n      for (r = 0; r < N; r++) {\n        var seq = dir === 'left' ? order : rev;\n        lines.push(seq.map(function (x) { return [r, x]; }));\n      }\n    } else {\n      for (c = 0; c < N; c++) {\n        var seq2 = dir === 'up' ? order : rev;\n        lines.push(seq2.map(function (x) { return [x, c]; }));\n      }\n    }\n    return lines;\n  }\n\n  function resetMerged() {\n    for (var i = 0; i < tiles.length; i++) tiles[i].merged = false;\n  }\n\n  function doMove(dir) {\n    if (over || paused) return;\n    flush();\n    if (over) return;\n\n    resetMerged();\n    var lines = linesFor(dir);\n    var moved = false;\n    var merges = [];\n    var kept = [];\n    var newGrid = emptyGrid();\n    var gained = 0;\n\n    for (var i = 0; i < lines.length; i++) {\n      var line = lines[i];\n      var inLine = [];\n      for (var j = 0; j < line.length; j++) {\n        var cell = grid[line[j][0]][line[j][1]];\n        if (cell) inLine.push(cell);\n      }\n      var target = 0;\n      var prev = null;\n      for (var k = 0; k < inLine.length; k++) {\n        var t = inLine[k];\n        if (prev && prev.v === t.v && !prev.merged) {\n          /* 合并到 prev 身上 */\n          t.r = prev.r;\n          t.c = prev.c;\n          prev.v *= 2;\n          prev.merged = true;\n          gained += prev.v;\n          merges.push({ keep: prev, drop: t });\n          moved = true;\n          if (prev.v === 2048 && !won) won = true;\n        } else {\n          var pos = line[target];\n          if (t.r !== pos[0] || t.c !== pos[1]) moved = true;\n          t.r = pos[0];\n          t.c = pos[1];\n          newGrid[t.r][t.c] = t;\n          kept.push(t);\n          prev = t;\n          target++;\n        }\n      }\n    }\n\n    if (!moved) {\n      /* 没有任何格子发生位移或合并 */\n      return false;\n    }\n\n    grid = newGrid;\n    score += gained;\n\n    /* 位置过渡 */\n    for (var m = 0; m < tiles.length; m++) setPos(tiles[m].el, tiles[m].r, tiles[m].c);\n    FB.Sound.play(merges.length ? 'merge' : 'move');\n\n    schedule(function () {\n      for (var a = 0; a < merges.length; a++) {\n        var pair = merges[a];\n        if (pair.drop.el.parentNode) pair.drop.el.remove();\n        var idx = tiles.indexOf(pair.drop);\n        if (idx > -1) tiles.splice(idx, 1);\n      }\n      for (var b = 0; b < merges.length; b++) {\n        var kp = merges[b].keep;\n        updateTileVisual(kp);\n        kp.el.classList.remove('pop');\n        void kp.el.offsetWidth;\n        kp.el.classList.add('pop');\n      }\n      addRandomTile();\n      updateScore();\n      checkState();\n    }, 130);\n\n    return true;\n  }\n\n  function checkState() {\n    /* 达成 2048 */\n    if (won && !over) {\n      won = false;\n      over = false;\n      showOverlay('达成 2048', score, '你赢了。要继续冲 4096 吗？', true);\n      return;\n    }\n    if (!canMove()) {\n      over = true;\n      FB.Sound.play('lose');\n      showOverlay('游戏结束', score, '格子满了，再来一局？', false);\n    }\n  }\n\n  function canMove() {\n    for (var r = 0; r < N; r++) {\n      for (var c = 0; c < N; c++) {\n        if (!grid[r][c]) return true;\n        if (c < N - 1 && grid[r][c] && grid[r][c + 1] && grid[r][c].v === grid[r][c + 1].v) return true;\n        if (r < N - 1 && grid[r][c] && grid[r + 1][c] && grid[r][c].v === grid[r + 1][c].v) return true;\n      }\n    }\n    return false;\n  }\n\n  function showOverlay(title, sc, sub, isWin) {\n    ovTitle.textContent = title;\n    ovScore.textContent = FB.fmtNum(sc);\n    ovSub.textContent = sub;\n    ovUndoBtn.style.display = isWin ? 'none' : '';\n    overlay.classList.add('on');\n    FB.Store.best('2048', sc);\n    if (isWin) FB.Sound.play('win');\n  }\n\n  /* ----------------------- 撤销 ----------------------- */\n\n  function snapshot() {\n    var g = [];\n    for (var r = 0; r < N; r++) {\n      var row = [];\n      for (var c = 0; c < N; c++) row.push(grid[r][c] ? grid[r][c].v : 0);\n      g.push(row);\n    }\n    return { g: g, score: score };\n  }\n\n  function restore(s) {\n    flush();\n    grid = emptyGrid();\n    tiles = [];\n    cellsEl.innerHTML = '';\n    buildBackground();\n    for (var r = 0; r < N; r++) {\n      for (var c = 0; c < N; c++) {\n        if (s.g[r][c] > 0) makeTile(s.g[r][c], r, c, false);\n      }\n    }\n    score = s.score;\n    over = false;\n    won = false;\n    updateScore();\n    overlay.classList.remove('on');\n  }\n\n  function undo() {\n    if (!undoState) {\n      FB.toast('没有可撤销的步骤');\n      return;\n    }\n    var s = undoState;\n    undoState = null;\n    restore(s);\n    FB.Sound.play('click');\n  }\n\n  /* ----------------------- 输入 ----------------------- */\n\n  function snapshotForUndo() {\n    flush();\n    undoState = snapshot();\n  }\n\n  /* 统一入口：先结算上一帧动画，再记录撤销点，移动无效则回滚撤销点 */\n  function tryMove(dir) {\n    if (over || paused) return;\n    flush();\n    if (over) return;\n    var prevUndo = undoState;\n    undoState = snapshot();\n    var ok = doMove(dir);\n    if (!ok) undoState = prevUndo;\n  }\n\n  document.addEventListener('keydown', function (e) {\n    var k = e.key;\n    var map = {\n      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',\n      w: 'up', s: 'down', a: 'left', d: 'right',\n      W: 'up', S: 'down', A: 'left', D: 'right'\n    };\n    if (map[k]) {\n      e.preventDefault();\n      tryMove(map[k]);\n    }\n  });\n\n  var touchX = 0, touchY = 0, touching = false;\n  boardEl.addEventListener('touchstart', function (e) {\n    if (!e.touches.length) return;\n    touching = true;\n    touchX = e.touches[0].clientX;\n    touchY = e.touches[0].clientY;\n  }, { passive: true });\n\n  boardEl.addEventListener('touchend', function (e) {\n    if (!touching) return;\n    touching = false;\n    var t = e.changedTouches[0];\n    var dx = t.clientX - touchX;\n    var dy = t.clientY - touchY;\n    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;\n    var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');\n    tryMove(dir);\n  }, { passive: true });\n\n  boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });\n\n  /* ----------------------- 按钮 ----------------------- */\n\n  document.getElementById('newBtn').addEventListener('click', function () {\n    newGame();\n    FB.Sound.play('click');\n  });\n  document.getElementById('undoBtn').addEventListener('click', undo);\n  document.getElementById('ovNew').addEventListener('click', function () {\n    newGame();\n    FB.Sound.play('click');\n  });\n  ovUndoBtn.addEventListener('click', undo);\n\n  /* 老板键打开时暂停输入 */\n  FB.Boss.onToggle = function (on) { paused = on; };\n\n  /* ----------------------- 启动 ----------------------- */\n\n  buildBackground();\n  newGame();\n  bestEl.textContent = FB.fmtNum(FB.Store.getBest('2048'));\n})();\n<\/script>\n</body>\n</html>\n"};const frame=document.querySelector('iframe');function show(page){frame.srcdoc=pages[page]}document.querySelector('#reset').onclick=()=>show('home');window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&(e.data?.demo==='home'||e.data?.demo==='game'))show(e.data.demo)});show('home');</script></body></html>
