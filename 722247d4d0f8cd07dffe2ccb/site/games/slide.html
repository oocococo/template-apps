<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字推盘 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .ss-diffs { display: flex; gap: 8px; margin-bottom: 14px; justify-content: center; flex-wrap: wrap; }
  .ss-diff {
    padding: 7px 14px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: var(--shadow-sm);
  }
  .ss-diff.on { background: var(--brand); border-color: var(--brand); color: #fff; }

  .ss-board {
    position: relative;
    width: min(86vw, 336px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
  }
  .ss-tile {
    position: absolute;
    left: 0; top: 0;
    box-sizing: border-box;
    padding: 3px;
    transition: transform .13s ease;
    will-change: transform;
  }
  .ss-face {
    width: 100%; height: 100%;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: #2b3760;
    background: linear-gradient(160deg, #ffffff, #e8edfa);
    box-shadow: inset 0 0 0 1px rgba(120, 145, 210, .22), 0 2px 4px rgba(60, 80, 150, .13);
    font-size: clamp(15px, 5.2vw, 24px);
  }
  html[data-theme="dark"] .ss-face {
    color: #e6ebfa;
    background: linear-gradient(160deg, #4a5573, #38415a);
    box-shadow: inset 0 0 0 1px rgba(160, 180, 230, .16), 0 2px 4px rgba(0, 0, 0, .3);
  }
  .ss-tile.ok .ss-face {
    background: linear-gradient(160deg, #8fe3bd, #4fc79a);
    color: #0d3a2a;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4), 0 2px 4px rgba(20, 140, 100, .2);
  }
  .ss-tile.pop .ss-face { animation: ss-pop .2s; }
  @keyframes ss-pop { 0%,100% { transform: none; } 50% { transform: scale(.93); } }

  .ss-tools { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">数字推盘<small>把数字按顺序排回去</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">步数</span><span class="val" id="moves">0</span></div>
    <div class="score-box"><span class="lb">用时</span><span class="val" id="time">0:00</span></div>
    <div class="score-box accent"><span class="lb">最少</span><span class="val" id="best">—</span></div>
  </div>

  <div class="ss-diffs" id="diffs"></div>

  <div class="ss-board" id="board"></div>

  <div class="ss-tools">
    <button class="btn" id="undoBtn">撤销一步</button>
    <button class="btn btn-primary" id="newBtn">重新打乱</button>
  </div>
</main>

<div class="g-hint">
  点空格旁边的数字，或用<b>方向键</b>推动 · <b>N</b> 重新打乱 · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">排好了</h3>
    <div class="big" id="ovScore">0 步</div>
    <p id="ovSub">用时 0:00</p>
    <div class="overlay-actions">
      <button class="btn" id="ovAgain">再来一局</button>
      <button class="btn btn-primary" id="ovBigger">试试更大的</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/slide.js"></script>
</body>
</html>
