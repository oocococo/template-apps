<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合成 2048 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">合成 2048<small>滑动合并相同数字</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">得分</span><span class="val" id="score">0</span></div>
    <div class="score-box accent"><span class="lb">最高分</span><span class="val" id="best">0</span></div>
  </div>

  <div class="g2048" id="board">
    <div class="cells" id="cells"></div>
  </div>

  <div style="margin-top:18px;display:flex;gap:10px">
    <button class="btn" id="undoBtn">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.6-7"/></svg>
      撤销一步
    </button>
    <button class="btn btn-primary" id="newBtn">新开一局</button>
  </div>
</main>

<div class="g-hint">
  <b>方向键</b> 或 <b>W A S D</b> 移动 · 手机上直接用手指滑动 · <b>Esc</b> 或<b>右键</b> 随时切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">游戏结束</h3>
    <div class="big" id="ovScore">0</div>
    <p id="ovSub">格子满了，再来一局？</p>
    <div class="overlay-actions">
      <button class="btn" id="ovUndo">撤销一步</button>
      <button class="btn btn-primary" id="ovNew">再来一局</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/2048.js"></script>
</body>
</html>
