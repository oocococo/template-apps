<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五子棋 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .gm-tools { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .gm-wrap { width: 100%; display: flex; justify-content: center; }
  .gm-wrap canvas {
    display: block;
    border-radius: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .gm-turn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  }
  .gm-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #2b3243; box-shadow: 0 0 0 1px rgba(0, 0, 0, .18) inset;
  }
  .gm-dot.white { background: #fbfdff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .22) inset; }
  @media (max-width: 520px) {
    .gm-tools { gap: 6px; }
    .seg button { padding: 0 10px; font-size: 12.5px; }
  }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">五子棋<small>你执黑，先手连五</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">手数</span><span class="val" id="moves">0</span></div>
    <div class="score-box"><span class="lb">用时</span><span class="val" id="time">0:00</span></div>
    <div class="score-box accent"><span class="lb">战绩</span><span class="val" id="rec">0:0</span></div>
  </div>

  <div class="gm-tools">
    <div class="seg" id="diff">
      <button data-d="easy">简单</button>
      <button data-d="normal" class="on">普通</button>
      <button data-d="hard">困难</button>
    </div>
    <button class="btn" id="undoBtn">悔棋</button>
    <button class="btn btn-primary" id="newBtn">重开</button>
    <span class="gm-turn"><i class="gm-dot" id="turnDot"></i><span id="turnTxt">轮到你落子</span></span>
  </div>

  <div class="gm-wrap">
    <canvas id="board"></canvas>
  </div>
</main>

<div class="g-hint">
  点棋盘落子 · 你执黑先行 · <b>Z</b> 悔棋 · <b>R</b> 重开 · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">你赢了</h3>
    <div class="big" id="ovScore">0 手</div>
    <p id="ovSub">用时 0:00</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" id="ovNew">再来一局</button>
      <button class="btn" id="ovLook">看看棋盘</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/gomoku.js"></script>
</body>
</html>
