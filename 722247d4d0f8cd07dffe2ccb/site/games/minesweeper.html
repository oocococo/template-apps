<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扫雷 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">扫雷<small>第一次点击永远安全</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="ms-toolbar">
    <div class="seg" id="levels">
      <button data-lv="easy" class="on">初级 9×9</button>
      <button data-lv="mid">中级 16×16</button>
      <button data-lv="hard">高级 30×16</button>
    </div>
  </div>

  <div class="ms-panel">
    <div class="ms-stat" title="剩余雷数">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="5"/><path d="M12 2v3M4 13H1M23 13h-3M6.5 6.5 8.5 8.5M17.5 6.5 15.5 8.5M12 21v1"/></svg>
      <span id="minesLeft">10</span>
    </div>
    <button class="ms-face" id="face" aria-label="重新开始"></button>
    <div class="ms-stat" title="用时">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      <span id="timer">000</span>
    </div>
  </div>

  <div class="ms-board-wrap">
    <div class="ms-board" id="board"></div>
  </div>
</main>

<div class="g-hint">
  <b>左键</b> 翻开 · <b>右键</b> 插旗 · 点已翻开的<b>数字</b>可快速展开周围 · 手机上<b>长按</b>插旗<br>切工作界面：<b>Alt + 右键</b>（棋盘上右键要插旗）· 或按 <b>Esc</b>、点右上角图标
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">踩到雷了</h3>
    <div class="big" id="ovTime">0s</div>
    <p id="ovSub">再来一局?</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" id="ovNew">再开一局</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/minesweeper.js"></script>
</body>
</html>
