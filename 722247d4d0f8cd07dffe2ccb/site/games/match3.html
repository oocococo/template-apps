<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消消乐 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .m3-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    width: min(92vw, 356px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    padding: 5px;
    box-sizing: border-box;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    user-select: none;
    touch-action: manipulation;
  }
  .m3-cell {
    position: relative;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2);
    cursor: pointer;
    transition: box-shadow .12s;
  }
  .m3-cell svg { width: 80%; height: 80%; display: block; pointer-events: none; }
  .m3-cell.sel { box-shadow: inset 0 0 0 2px var(--brand); }
  .m3-cell.hintpop { animation: m3-hint .3s; }
  @keyframes m3-hint { 0%,100% { transform: none; } 50% { transform: scale(1.12); } }

  .m3-timebar {
    width: min(92vw, 356px);
    height: 6px;
    margin: 10px auto 0;
    border-radius: 3px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .m3-timebar i {
    display: block; height: 100%; width: 100%;
    background: var(--brand);
    transition: width .18s linear, background .3s;
  }
  .m3-timebar.low i { background: #ef5350; }

  .m3-tools { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">消消乐<small>交换相邻两块，三个一样就消除</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">得分</span><span class="val" id="score">0</span></div>
    <div class="score-box"><span class="lb">剩下</span><span class="val" id="time">1:30</span></div>
    <div class="score-box accent"><span class="lb">最高</span><span class="val" id="best">0</span></div>
  </div>

  <div class="m3-board" id="board"></div>
  <div class="m3-timebar" id="timebar"><i></i></div>

  <div class="m3-tools">
    <button class="btn" id="hintBtn">提示</button>
    <button class="btn btn-primary" id="newBtn">重新开始</button>
  </div>
</main>

<div class="g-hint">
  点两块<b>相邻</b>的方块交换位置，横竖连成三个以上就消除 · 连锁消除有<b>倍数加成</b> · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">时间到</h3>
    <div class="big" id="ovScore">0 分</div>
    <p id="ovSub">最高分 0</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" id="ovNew">再来一局</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/match3.js"></script>
</body>
</html>
