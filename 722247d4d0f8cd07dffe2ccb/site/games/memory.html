<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记忆翻牌 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .mem-info { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .mem-info .muted { font-size: 12.5px; color: var(--ink-3); }
  .mem-board {
    display: grid;
    gap: 10px;
    width: 100%;
    max-width: 470px;
    margin: 0 auto;
  }
  .mem-card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    cursor: pointer;
    perspective: 700px;
    background: transparent;
    border: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .mem-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .34s cubic-bezier(.3, .9, .35, 1);
    border-radius: 12px;
  }
  .mem-card.flip .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
  .mem-face {
    position: absolute; inset: 0;
    border-radius: 12px;
    display: grid; place-items: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .mem-back {
    background: linear-gradient(150deg, #eef2fb, #dde6f7);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    color: #9fb0cf;
  }
  .mem-back svg { width: 34%; height: 34%; }
  .mem-front {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    transform: rotateY(180deg);
  }
  .mem-front svg { width: 56%; height: 56%; }
  .mem-card.done .mem-front { background: rgba(47, 191, 143, .1); border-color: rgba(47, 191, 143, .45); }
  .mem-card.done { pointer-events: none; }
  .mem-card.wrong .mem-front { animation: memShake .34s; }
  @keyframes memShake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    30% { transform: rotateY(180deg) translateX(-4px); }
    70% { transform: rotateY(180deg) translateX(4px); }
  }
  html[data-theme="dark"] .mem-back { background: linear-gradient(150deg, #232a3d, #1b2133); color: #66738f; }
  html[data-theme="dark"] .mem-front { background: #1d2334; }
  @media (max-width: 480px) {
    .mem-board { gap: 8px; }
  }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">记忆翻牌<small>两两配对，记住位置</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">步数</span><span class="val" id="moves">0</span></div>
    <div class="score-box"><span class="lb">用时</span><span class="val" id="time">0:00</span></div>
    <div class="score-box accent"><span class="lb">最佳步数</span><span class="val" id="best">—</span></div>
  </div>

  <div class="mem-info">
    <button class="btn btn-primary" id="newBtn">新开一局</button>
    <span class="muted" id="left">还剩 8 对</span>
  </div>

  <div class="mem-board" id="board"></div>
</main>

<div class="g-hint">
  点两张相同的牌配对 · 配错会翻回去 · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">全部配对完成</h3>
    <div class="big" id="ovScore">0 步</div>
    <p id="ovSub">用时 0:00</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" id="ovNew">再来一局</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/memory.js"></script>
</body>
</html>
