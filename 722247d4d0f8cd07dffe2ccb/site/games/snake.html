<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贪吃蛇 · 摸鱼盒子</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .sn-stage {
    position: relative;
    width: 100%;
    max-width: 400px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    touch-action: none;
    user-select: none;
  }
  .sn-stage canvas { display: block; width: 100%; height: auto; }
  .sn-pause { position: absolute; inset: 0; display: none; place-items: center; background: rgba(16,20,34,.5); color: #fff; font-weight: 700; letter-spacing: 1px; font-size: 14px; backdrop-filter: blur(3px); }
  .sn-pause.on { display: grid; }
  .sn-pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 50px); gap: 8px; margin-top: 16px; justify-content: center; }
  .sn-pad button {
    border-radius: 13px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow-sm); display: grid; place-items: center; color: var(--ink-2);
    transition: transform .14s, background .16s, color .16s; touch-action: manipulation;
  }
  .sn-pad button:active { transform: scale(.93); background: var(--brand-soft); color: var(--brand); }
  .sn-pad svg { width: 20px; height: 20px; }
  .sn-pad .sp { visibility: hidden; }
  @media (max-width: 480px) { .sn-pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 46px); } }
</style>
</head>
<body class="game-page">

<div class="g-bar">
  <a class="g-back" href="../index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="g-name">贪吃蛇<small>越吃越快,别咬到自己</small></div>
  <div class="g-tools">
    <button class="icon-btn" data-boss title="切换工作界面 (Esc / 右键)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
    </button>
    <button class="icon-btn" data-sound-toggle title="音效开关"></button>
    <button class="icon-btn" data-theme-toggle title="切换主题" data-theme-icon></button>
  </div>
</div>

<main class="g-stage">
  <div class="scorebar">
    <div class="score-box"><span class="lb">得分</span><span class="val" id="score">0</span></div>
    <div class="score-box accent"><span class="lb">最高分</span><span class="val" id="best">0</span></div>
    <div class="score-box"><span class="lb">长度</span><span class="val" id="len">3</span></div>
  </div>

  <div class="sn-stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="sn-pause" id="pauseTag">已暂停 · 按 P 继续</div>
  </div>

  <div class="sn-pad">
    <button class="sp"></button>
    <button id="bUp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="sp"></button>
    <button id="bLeft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="bDown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="bRight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</main>

<div class="g-hint">
  <b>方向键</b> 或 <b>WASD</b> 转向 · 手机可直接滑动 · <b>P</b> 暂停 · <b>Esc</b> 或<b>右键</b> 切到工作界面
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h3 id="ovTitle">撞上了</h3>
    <div class="big" id="ovScore">0</div>
    <p id="ovSub">再来一局?</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" id="ovNew">再来一局</button>
    </div>
  </div>
</div>

<script src="../assets/boss-data.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/games/snake.js"></script>
</body>
</html>
