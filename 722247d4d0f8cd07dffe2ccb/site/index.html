<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="摸鱼盒子 — 上班间隙偷得十分钟的 15 款单机小游戏，进度云端保存。">
<title>摸鱼盒子 · 上班间隙的十五款小游戏</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='%235b6ef5'/><circle cx='20' cy='20' r='9' fill='white' opacity='.92'/><circle cx='24' cy='17' r='2.6' fill='%235b6ef5'/></svg>">
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <a class="logo" href="index.html">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3.2 12c2.4-3.6 5.4-5.4 8.8-5.4 3.4 0 6.4 1.8 8.8 5.4-2.4 3.6-5.4 5.4-8.8 5.4-3.4 0-6.4-1.8-8.8-5.4z" fill="#fff" opacity=".95"/>
          <circle cx="14.6" cy="11.2" r="1.5" fill="#5b6ef5"/>
          <path d="M2.6 12 6 14.4V9.6z" fill="#fff" opacity=".8"/>
        </svg>
      </span>
      <span class="logo-text">摸鱼盒子<small>Fish Box</small></span>
    </a>
    <div class="top-tools">
      <span class="kbd-hint">按 <kbd>Esc</kbd> 或 <kbd>右键</kbd> 切换</span>
      <button class="icon-btn pill" data-boss-scene title="选择工作界面的行业场景" aria-label="选择工作界面的行业场景">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>
        <span>工作界面</span>
      </button>
      <button class="icon-btn" data-sound-toggle title="音效开关" aria-label="音效开关"></button>
      <button class="icon-btn" data-theme-toggle title="切换主题" aria-label="切换主题" data-theme-icon></button>
    </div>
  </header>

  <section class="hero">
    <span class="hero-badge"><i class="dot"></i>15 款单机小游戏 · 随时畅玩</span>
    <h1>上班间隙，<em>偷得十分钟</em></h1>
    <p>打开即玩、无需安装、进度自动保存。老板路过时按一下 <b>Esc</b> 或点一下<b>右键</b>，屏幕上立刻变成一套正在跑的业务系统——能点、能选、能翻页，就是一个正经的工作界面。</p>
  </section>

  <nav class="filters" id="filters">
    <button class="chip on" data-tag="all">全部</button>
    <button class="chip" data-tag="合成">合成</button>
    <button class="chip" data-tag="益智">益智</button>
    <button class="chip" data-tag="反应">反应</button>
    <button class="chip" data-tag="消除">消除</button>
    <button class="chip" data-tag="滑块">滑块</button>
    <button class="chip" data-tag="棋牌">棋牌</button>
    <span class="count" id="count"></span>
  </nav>

  <section class="grid" id="grid"></section>

  <footer class="footer">
    <span>摸鱼盒子 · 纯前端单机游戏，成绩和设置保存在应用中。</span>
    <div class="tips">
      <span>Esc / 右键 老板键</span>
      <span>自动存档</span>
      <span>云端存档</span>
    </div>
  </footer>

</div>

<script src="assets/boss-data.js"></script>
<script src="assets/core.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
