  *{box-sizing:border-box}
  :root{
    --main:#ff2d8a;
    --main-light:#ff7ab8;
    --main-soft:#fff5fa;
    --main-deep:#e8206f;
  }
  html,body{margin:0;padding:0;overflow-x:hidden}
  .app{max-width:100%}
  body{
    font:14px/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:#f4f5f9;color:#181820;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:calc(100vh - 34px);align-items:flex-start}

  /* 顶部署名 */
  .creditbar{
    display:flex;align-items:center;justify-content:center;gap:7px;
    height:34px;padding:0 12px;font-size:12.5px;color:#63637a;
    background:#fff;border-bottom:1px solid #ececf3;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .creditbar i{
    width:6px;height:6px;border-radius:2px;background:var(--main);
    transform:rotate(45deg);flex:0 0 auto;
  }
  .creditbar b{color:var(--main-deep);font-weight:800;letter-spacing:.5px}

  /* ---------- 舞台 ---------- */
  .stage{flex:1;min-width:0;padding:26px 26px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .preview{
    width:100%;max-width:1060px;background:#fff;border-radius:14px;
    box-shadow:0 10px 34px rgba(28,20,50,.13);
    overflow:hidden;position:relative;
  }
  .preview.drag{outline:3px dashed #ff4d9d;outline-offset:-6px}
  #cv{display:block;width:100%;height:auto}
  .drop-tip{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(255,240,247,.86);color:#e8206f;font-weight:700;font-size:18px;letter-spacing:1px;
  }
  .preview.drag .drop-tip{display:flex}

  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{
    font:inherit;font-weight:700;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;
    background:#fff;color:#333;box-shadow:0 1px 0 rgba(0,0,0,.05),0 2px 8px rgba(30,20,60,.08);
    transition:.15s;
  }
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.primary{background:linear-gradient(135deg,var(--main-light),var(--main));color:#fff;box-shadow:0 6px 18px rgba(255,45,138,.35)}
  .hint{color:#8a8a99;font-size:12.5px}

  /* ---------- 侧栏 ---------- */
  .panel{
    width:372px;flex:0 0 372px;background:#fff;border-left:1px solid #ececf3;
    height:calc(100vh - 34px);position:sticky;top:0;overflow-y:auto;padding:16px 16px 60px;
  }
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:#e2e2ec;border-radius:4px}
  .panel h1{font-size:15px;margin:2px 0 14px;display:flex;align-items:center;gap:8px}
  .panel h1 span{background:linear-gradient(135deg,var(--main-light),var(--main));color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;letter-spacing:.5px}

  details.group{border:1px solid #eeeef5;border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fcfcfe}
  details.group>summary{
    cursor:pointer;padding:11px 13px;font-weight:700;font-size:13.5px;list-style:none;
    display:flex;align-items:center;gap:7px;user-select:none;color:#2a2a38;
  }
  details.group>summary::-webkit-details-marker{display:none}
  details.group>summary::before{
    content:"";width:7px;height:7px;border-radius:2px;background:var(--main);transform:rotate(45deg);flex:0 0 auto;
  }
  details.group[open]>summary{border-bottom:1px solid #f0f0f7}
  .body{padding:12px 13px 14px}

  .row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .row:last-child{margin-bottom:0}
  .row label{flex:0 0 62px;font-size:13px;color:#565669;font-weight:600}
  input[type=text],input[type=number],textarea,select{
    font:inherit;font-size:13px;color:#181820;background:#fff;border:1px solid #e2e2ee;
    border-radius:8px;padding:7px 9px;width:100%;outline:none;transition:.15s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--main-light);box-shadow:0 0 0 3px rgba(255,90,170,.12)}
  textarea{resize:vertical;min-height:96px;line-height:1.6}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:#eeeef6;outline:none;padding:0;border:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--main);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.16);
  }
  .slider{display:flex;align-items:center;gap:9px}
  .slider .val{flex:0 0 46px;text-align:right;font-weight:700;font-size:12.5px;color:var(--main-deep);font-variant-numeric:tabular-nums}

  .filebtn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;
    border:1.5px dashed var(--main-light);border-radius:10px;background:var(--main-soft);color:var(--main-deep);
    font-weight:700;font-size:13px;cursor:pointer;margin-bottom:10px;transition:.15s;
  }
  .filebtn:hover{filter:brightness(.97)}

  /* 颜色选择 */
  .colorwrap{display:flex;align-items:center;gap:9px;flex:1}
  input[type=color]{
    -webkit-appearance:none;appearance:none;border:none;background:none;padding:0;
    width:46px;height:30px;border-radius:8px;cursor:pointer;overflow:hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:1px solid #dedee8;border-radius:8px}
  .hexv{font-size:12.5px;font-weight:700;color:#6a6a7c;font-family:"Consolas",monospace;letter-spacing:.4px}
  .swatches{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .swatches i{
    width:24px;height:24px;border-radius:50%;cursor:pointer;display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);transition:.15s;
  }
  .swatches i:hover{transform:scale(1.12)}

  .dims{display:flex;flex-direction:column;gap:7px}
  .dim{display:grid;grid-template-columns:64px 1fr 44px 52px;gap:6px;align-items:center}
  .dim input{border-radius:6px;padding:5px 7px;font-size:12.5px}
  .dim select{padding:5px 4px;font-size:12.5px;text-align:center;font-weight:700}
  .dim input[type=range]{padding:0}
  .dim .dn{font-weight:700}
  .dimhead{display:grid;grid-template-columns:64px 1fr 44px 52px;gap:6px;font-size:11px;color:#9a9aab;padding:0 2px 2px;font-weight:600}

  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#565669;font-weight:600;cursor:pointer}
  .switch input{width:16px;height:16px;accent-color:#ff2d8a;cursor:pointer}

  /* ---------- 移动端 / 窄屏 ---------- */
  @media (max-width: 980px){
    .app{flex-direction:column}
    .stage{
      position:sticky;top:0;z-index:20;width:100%;
      padding:10px 12px 8px;gap:8px;
      background:#f4f5f9;
      border-bottom:1px solid #e9e9f2;
    }
    .preview{max-width:none;border-radius:12px;box-shadow:0 6px 20px rgba(28,20,50,.12);min-width:0}
    .actions{gap:8px;width:100%;justify-content:center}
    .actions button{padding:8px 13px;font-size:13px;border-radius:9px;white-space:nowrap}
    .hint{font-size:11.5px;width:100%;text-align:center}
    .panel{
      width:100%;flex:1 1 auto;height:auto;position:static;
      border-left:none;border-top:none;padding:14px 14px 60px;
    }
    /* 防 iOS 聚焦自动放大 */
    input[type=text],input[type=number],textarea,select{font-size:16px;padding:9px 11px}
    .dim input,.dim select{font-size:14px}
    .row label{flex:0 0 58px;font-size:13.5px}
    input[type=color]{width:54px;height:36px}
    .swatches i{width:30px;height:30px}
    .filebtn{padding:14px;font-size:14px}
    details.group>summary{padding:14px 13px;font-size:14px}
    button{-webkit-tap-highlight-color:transparent}
    #cv{touch-action:pan-y}
  }
  @media (max-width: 560px){
    .creditbar{font-size:11.5px;letter-spacing:0}
    .actions .hint{display:none}
    .stage{padding:8px 8px 6px}
    .panel{padding:12px 12px 60px}
    .dim{grid-template-columns:58px 1fr 40px 48px;gap:5px}
    .dimhead{grid-template-columns:58px 1fr 40px 48px}
  }
  @media (max-height: 480px) and (orientation: landscape){
    .stage{position:static}
  }

  /* ---------- 全屏查看 ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:99;background:rgba(18,14,26,.92);
    display:none;align-items:center;justify-content:center;padding:16px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);

  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lightbox .close{
    position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;
  }
</style>

<script data-page-node-id="Q7MWP2yCdfQSqc6b1kwEYl" data-pnid-children="EqT69j2JfOGuWm9ir9KEjt">
(function(){
'use strict';

/* ============================================================
   常量 / 主题色（主色调 + 强调色可在面板调整）
   ============================================================ */
const W = 1080, H = 800, DPR = 2;

function hx(h){
  h = String(h || '#000000').replace('#', '');
  if(h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0,2),16) || 0, parseInt(h.slice(2,4),16) || 0, parseInt(h.slice(4,6),16) || 0];
}
function toHex(a){
  return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mixA(c1, c2, t){          // t=0 → c1，t=1 → c2
  const a = hx(c1), b = hx(c2);
  return toHex([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t]);
}
function rgba(c, a){
  const v = hx(c);
  return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
}

let PINK        = '#FF2D8A';   // 主色调
let PINK_DEEP   = '#E8206F';   // 主色调-深
let PINK_SOFT   = '#FFB3D5';   // 主色调-浅
let PINK_TINT   = '#FFE3F0';   // 主色调-极浅（背景）
let PINK_XLIGHT = '#FFF1F8';
let PINK_EDGE   = '#F0E6EE';   // 卡片描边
let YELLOW      = '#F2EF3A';   // 强调色
let YELLOW_TINT = '#FDFDF0';   // 强调色-极浅（卡片底）
let YELLOW_LINE = '#E9E9D2';   // 强调色-描边
let YELLOW_DEEP = '#E8E31E';   // 强调色-深（圆点）

function buildColors(){
  const t = state.theme  || '#FF2D8A';
  const a = state.accent || '#F2EF3A';
  PINK        = t;
  PINK_DEEP   = mixA(t, '#000000', 0.20);
  PINK_SOFT   = mixA(t, '#FFFFFF', 0.62);
  PINK_TINT   = mixA(t, '#FFFFFF', 0.90);
  PINK_XLIGHT = mixA(t, '#FFFFFF', 0.965);
  PINK_EDGE   = mixA(t, '#FFFFFF', 0.90);
  YELLOW      = a;
  YELLOW_TINT = mixA(a, '#FFFFFF', 0.955);
  YELLOW_LINE = mixA(a, '#FFFFFF', 0.80);
  YELLOW_DEEP = mixA(a, '#000000', 0.12);

  // 面板 CSS 变量联动
  const root = document.documentElement.style;
  root.setProperty('--main',       t);
  root.setProperty('--main-light', mixA(t, '#FFFFFF', 0.34));
  root.setProperty('--main-soft',  mixA(t, '#FFFFFF', 0.95));
  root.setProperty('--main-deep',  PINK_DEEP);
}

const INK  = '#111114';
const CN = '"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
const MONO = '"Consolas","Courier New",monospace';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR;

/* ============================================================
   状态
   ============================================================ */
const DEFAULT = {
  theme: '#FF2D8A', accent: '#F2EF3A',
  imgScale: 100, imgX: 0, imgY: 0,
  bgOpacity: 55, bgBlur: 24, showBg: true,
  name: '', race: '', job: '', age: '', level: '', gender: '',
  matches: '2390', kda: '17.7', knock: 'A', win: '42%',
  stats: [
    { label: '击倒', value: 82, letter: 'A' },
    { label: '助攻', value: 95, letter: 'S' },
    { label: '存活', value: 88, letter: 'S' },
    { label: '伤害', value: 78, letter: 'A' },
    { label: '承伤', value: 86, letter: 'S' },
    { label: '治疗', value: 64, letter: 'B' }
  ],
  intro: 'XX是 MMORPG 游戏《最终幻想14》的战场PVP玩家。PVP风格非常XX，喜欢组四小，倒老三。经常恶劣地欺负新人豆芽，后面新人豆芽前往新月岛开启了隐藏职业：时魔法师，这是可以控制游戏时间系统的隐藏职业，于是对这位恶劣的玩家进行了报复。'
};
const LETTERS = ['S','A','B','C','D','E'];
const LS_KEY = 'cup_profile_card_v2';

let state = JSON.parse(JSON.stringify(DEFAULT));
let img = null;          // 立绘 Image
let imgURL = null;

/* ============================================================
   通用绘图工具
   ============================================================ */
function rr(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRR(x, y, w, h, r, color){
  ctx.fillStyle = color; rr(x, y, w, h, r); ctx.fill();
}
function strokeRR(x, y, w, h, r, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1; rr(x, y, w, h, r); ctx.stroke();
}
function star4(cx, cy, r, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx + r*0.16, cy - r*0.16, cx + r, cy);
  ctx.quadraticCurveTo(cx + r*0.16, cy + r*0.16, cx, cy + r);
  ctx.quadraticCurveTo(cx - r*0.16, cy + r*0.16, cx - r, cy);
  ctx.quadraticCurveTo(cx - r*0.16, cy - r*0.16, cx, cy - r);
  ctx.fill();
}
function cat(cx, cy, s, color, eyeColor){
  ctx.fillStyle = color;
  // 左耳
  ctx.beginPath();
  ctx.moveTo(cx - s*0.54, cy - s*0.20);
  ctx.lineTo(cx - s*0.34, cy - s*1.00);
  ctx.lineTo(cx + s*0.02, cy - s*0.42);
  ctx.closePath(); ctx.fill();
  // 右耳
  ctx.beginPath();
  ctx.moveTo(cx + s*0.54, cy - s*0.20);
  ctx.lineTo(cx + s*0.34, cy - s*1.00);
  ctx.lineTo(cx - s*0.02, cy - s*0.42);
  ctx.closePath(); ctx.fill();
  // 脸
  ctx.beginPath();
  ctx.ellipse(cx, cy + s*0.08, s*0.56, s*0.50, 0, 0, Math.PI*2);
  ctx.fill();
  // 眼
  if(eyeColor){
    ctx.fillStyle = eyeColor;
    ctx.beginPath(); ctx.ellipse(cx - s*0.22, cy + s*0.02, s*0.085, s*0.11, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + s*0.22, cy + s*0.02, s*0.085, s*0.11, 0, 0, Math.PI*2); ctx.fill();
  }
}
// 字间距文本，返回总宽
function tracked(text, x, y, spacing, align){
  const chars = [...text];
  let total = 0;
  const widths = chars.map(c => ctx.measureText(c).width);
  widths.forEach(w => total += w);
  total += spacing * (chars.length - 1);
  let cx = x;
  if(align === 'center') cx = x - total/2;
  else if(align === 'right') cx = x - total;
  const oldAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i] + spacing; });
  ctx.textAlign = oldAlign;
  return total;
}
function wrap(text, maxWidth){
  const out = [];
  text.split('\n').forEach(para => {
    if(para === ''){ out.push(''); return; }
    let line = '';
    for(const ch of para){
      const test = line + ch;
      if(ctx.measureText(test).width > maxWidth && line !== ''){
        out.push(line); line = ch;
      } else line = test;
    }
    if(line !== '') out.push(line);
  });
  return out;
}
function drawCover(im, x, y, w, h, zoom, ox, oy){ return drawCoverOn(ctx, im, x, y, w, h, zoom, ox, oy); }
function drawCoverOn(c, im, x, y, w, h, zoom, ox, oy){
  const ir = im.width / im.height, br = w / h;
  let sw, sh;
  if(ir > br){ sh = im.height; sw = sh * br; }
  else { sw = im.width; sh = sw / br; }
  sw /= (zoom || 1); sh /= (zoom || 1);
  const maxX = (im.width - sw) / 2, maxY = (im.height - sh) / 2;
  const cx = Math.max(0, Math.min(im.width - sw, maxX + (ox || 0) * maxX));
  const cy = Math.max(0, Math.min(im.height - sh, maxY + (oy || 0) * maxY));
  c.drawImage(im, cx, cy, sw, sh, x, y, w, h);
}
function rrOn(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ============================================================
   布局常量
   ============================================================ */
const HEAD_H   = 52;
const PORT     = { x: 8, y: HEAD_H, w: 424, h: 500 };
const RADAR    = { cx: 640, cy: 300, r: 132 };
const CARD_B   = { x: 826, y: 96,  w: 234, h: 100 };   // 黄卡 基本资料
const CARD_S   = { x: 826, y: 204, w: 234, h: 250 };   // 白卡 战绩
const CARD_I   = { x: 20,  y: 520, w: 470, h: 258 };   // 基础信息
const CARD_BIO = { x: 506, y: 520, w: 554, h: 258 };   // 个人介绍

/* ============================================================
   1. 背景
   ============================================================ */
function drawBg(){
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if(!img || !state.showBg){
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0,    PINK_TINT);
    g.addColorStop(0.45, PINK_XLIGHT);
    g.addColorStop(1,    '#FFFFFF');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else {
    ctx.save();
    ctx.globalAlpha = state.bgOpacity / 100;
    if(state.bgBlur > 0) ctx.filter = 'blur(' + state.bgBlur + 'px)';
    const pad = 80;
    const bw = W + pad*2, bh = H + pad*2;
    const ir = img.width / img.height, br = bw / bh;
    let dw, dh;
    if(ir > br){ dh = bh; dw = dh * ir; } else { dw = bw; dh = dw / ir; }
    ctx.drawImage(img, (W - dw)/2, (H - dh)/2, dw, dh);
    ctx.restore();

    // 白色柔化
    const g2 = ctx.createLinearGradient(0, 0, W, 0);
    g2.addColorStop(0,   'rgba(255,255,255,0.10)');
    g2.addColorStop(0.50,'rgba(255,255,255,0.66)');
    g2.addColorStop(1,   'rgba(255,255,255,0.88)');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

    // 粉色氛围
    ctx.fillStyle = rgba(PINK, 0.10);
    ctx.fillRect(0, 0, W, H);
  }

  // 左下角点阵
  ctx.fillStyle = rgba(PINK, 0.28);
  for(let r = 0; r < 4; r++){
    for(let c = 0; c < 8; c++){
      ctx.beginPath(); ctx.arc(28 + c*15, 470 + r*15, 2.2, 0, Math.PI*2); ctx.fill();
    }
  }
  // 右上角点阵（白卡下方留白处）
  ctx.fillStyle = rgba(PINK, 0.30);
  for(let r = 0; r < 3; r++){
    for(let c = 0; c < 7; c++){
      ctx.beginPath(); ctx.arc(852 + c*16, 468 + r*15, 2.2, 0, Math.PI*2); ctx.fill();
    }
  }
}

/* ============================================================
   2. 立绘（离屏画布 + 边缘羽化，融入背景）
   ============================================================ */
let portCv = null;
function drawPortrait(){
  const {x, y, w, h} = PORT;

  if(!portCv){
    portCv = document.createElement('canvas');
    portCv.width = Math.round(w * DPR);
    portCv.height = Math.round(h * DPR);
  }
  const oc = portCv.getContext('2d');
  const fw = img ? 132 : 70;
  const fh = img ? 116 : 0;   // 无立绘时不做底部擦除，避免提示文字被吃掉

  oc.setTransform(DPR, 0, 0, DPR, 0, 0);
  oc.clearRect(0, 0, w, h);
  oc.globalCompositeOperation = 'source-over';

  oc.save();
  rrOn(oc, 0, 0, w, h, 18);
  oc.clip();

  if(img){
    drawCoverOn(oc, img, 0, 0, w, h, state.imgScale/100, state.imgX/100, state.imgY/100);
  } else {
    const g = oc.createLinearGradient(0, 0, w, h);
    g.addColorStop(0,    mixA(PINK, '#FFFFFF', 0.74));
    g.addColorStop(0.55, mixA(PINK, '#FFFFFF', 0.88));
    g.addColorStop(1,    mixA(PINK, '#FFFFFF', 0.965));
    oc.fillStyle = g; oc.fillRect(0, 0, w, h);

    const cx = w/2;
    oc.fillStyle = rgba(PINK, 0.30);
    oc.beginPath(); oc.ellipse(cx, h*0.30, 96, 104, 0, 0, Math.PI*2); oc.fill();
    oc.fillStyle = rgba(PINK, 0.42);
    oc.beginPath(); oc.arc(cx, h*0.31, 60, 0, Math.PI*2); oc.fill();
    oc.beginPath(); oc.ellipse(cx, h*0.92, 128, 152, 0, 0, Math.PI*2); oc.fill();

    oc.textAlign = 'center'; oc.textBaseline = 'middle';
    oc.fillStyle = rgba(PINK_DEEP, 0.72);
    oc.font = '700 17px ' + CN;
    oc.fillText('点击上传角色立绘', cx, h - 46);
    oc.fillStyle = rgba(PINK_DEEP, 0.45);
    oc.font = '600 12.5px ' + CN;
    oc.fillText('支持 JPG / PNG，也可直接拖入', cx, h - 24);
  }
  oc.restore();

  // 羽化：擦除边缘，露出下层背景
  oc.globalCompositeOperation = 'destination-out';
  const gr = oc.createLinearGradient(w - fw, 0, w, 0);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.55, 'rgba(0,0,0,0.55)');
  gr.addColorStop(1, 'rgba(0,0,0,0.97)');
  oc.fillStyle = gr; oc.fillRect(w - fw, 0, fw, h);

  const gb = oc.createLinearGradient(0, Math.max(0, h - fh), 0, h);
  gb.addColorStop(0, 'rgba(0,0,0,0)');
  gb.addColorStop(1, 'rgba(0,0,0,0.92)');
  if(fh > 0){ oc.fillStyle = gb; oc.fillRect(0, h - fh, w, fh); }

  // 左侧轻羽化
  const gl = oc.createLinearGradient(0, 0, 26, 0);
  gl.addColorStop(0, 'rgba(0,0,0,0.6)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  oc.fillStyle = gl; oc.fillRect(0, 0, 26, h);
  oc.globalCompositeOperation = 'source-over';

  ctx.drawImage(portCv, x, y, w, h);

  // 左侧装饰 +++
  ctx.fillStyle = INK;
  for(let i = 0; i < 3; i++){
    const py = 78 + i*24;
    ctx.fillRect(26, py, 3, 13);
    ctx.fillRect(21, py + 5, 13, 3);
  }
}

/* ============================================================
   3. 雷达图
   ============================================================ */
function drawRadar(){
  const {cx, cy, r} = RADAR;
  const angles = state.stats.map((_, i) => -Math.PI/2 + i * Math.PI/3);
  const pt = (a, rad) => [cx + Math.cos(a)*rad, cy + Math.sin(a)*rad];

  // 网格
  for(let lvl = 1; lvl <= 4; lvl++){
    const rad = r * lvl / 4;
    ctx.beginPath();
    angles.forEach((a, i) => {
      const [px, py] = pt(a, rad);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.closePath();
    if(lvl === 4){ ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill(); }
    ctx.strokeStyle = lvl === 4 ? rgba(PINK, 0.55) : rgba(PINK_SOFT, 0.40);
    ctx.lineWidth = lvl === 4 ? 2 : 1;
    ctx.stroke();
  }

  // 轴线
  ctx.strokeStyle = rgba(PINK_SOFT, 0.34);
  ctx.lineWidth = 1;
  angles.forEach(a => {
    const [px, py] = pt(a, r);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
  });

  // 数据多边形
  ctx.beginPath();
  state.stats.forEach((s, i) => {
    const v = Math.max(2, Math.min(100, Number(s.value) || 0)) / 100;
    const [px, py] = pt(angles[i], r * v);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.closePath();
  const g = ctx.createRadialGradient(cx, cy, 6, cx, cy, r);
  g.addColorStop(0, rgba(PINK, 0.55));
  g.addColorStop(1, rgba(PINK, 0.38));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = PINK;
  ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // 顶点
  state.stats.forEach((s, i) => {
    const v = Math.max(2, Math.min(100, Number(s.value) || 0)) / 100;
    const [px, py] = pt(angles[i], r * v);
    ctx.beginPath(); ctx.arc(px, py, 5.2, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = PINK; ctx.lineWidth = 2.4; ctx.stroke();
  });

  // 标签 + 等级
  ctx.textBaseline = 'middle';
  const letterR = 15;

  state.stats.forEach((s, i) => {
    const a = angles[i];
    const [vx, vy] = pt(a, r);
    const label = String(s.label || '');
    ctx.font = '700 21px ' + CN;
    const lw = ctx.measureText(label).width;
    const gapTxt = 11;
    const totalW = lw + gapTxt + letterR*2;   // 文字 + 间隔 + 圆

    let ctrX, midY;
    if(i === 0){                       // 顶
      ctrX = vx; midY = vy - 40;
    } else if(i === 1){                // 右上
      ctrX = vx + 22; midY = vy - 9;
    } else if(i === 2){                // 右下
      ctrX = vx + 22; midY = vy + 9;
    } else if(i === 3){                // 底
      ctrX = vx; midY = vy + 48;
    } else if(i === 4){                // 左下
      ctrX = vx - 22; midY = vy + 9;
    } else {                           // 左上
      ctrX = vx - 22; midY = vy - 9;
    }

    const textLeft = ctrX - totalW/2;

    // 白色描边保证在花背景上可读
    ctx.font = '700 21px ' + CN;
    ctx.textAlign = 'left';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(label, textLeft, midY + 1);
    ctx.fillStyle = INK;
    ctx.fillText(label, textLeft, midY + 1);

    // 等级圆
    const lcx = textLeft + lw + gapTxt + letterR;
    ctx.beginPath(); ctx.arc(lcx, midY, letterR, 0, Math.PI*2);
    ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.stroke();
    ctx.fillStyle = YELLOW;
    ctx.font = '800 17px ' + MONO;
    ctx.textAlign = 'center';
    ctx.fillText(String(s.letter || 'A'), lcx, midY + 1);
    ctx.textAlign = 'left';
  });
  ctx.textBaseline = 'alphabetic';
}

      ctx.moveTo(x + 14, y + 13 + rh*(i+1));

    }

function drawInfo(){
  const {x, y, w, h} = CARD_I;
  // 阴影
  ctx.save();
  ctx.shadowColor = 'rgba(120,80,110,0.16)';
  ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
  fillRR(x, y, w, h, 16, '#ffffff');
  ctx.restore();
  strokeRR(x, y, w, h, 16, PINK_EDGE, 1.2);

  const pad = 18, gap = 12, rowH = 66, rowGap = 8;
  const colW = (w - pad*2 - gap) / 2;
  const tagW = 78, valW = colW - tagW;

  const rows = [
    [['昵称', state.name], ['种族', state.race]],
    [['职业', state.job],  ['年龄', state.age]],
    [['等级', state.level],['性别', state.gender]]
  ];

  ctx.textBaseline = 'middle';
  rows.forEach((pair, r) => {
    const ry = y + pad + r * (rowH + rowGap);
    pair.forEach(([k, v], c) => {
      const rx = x + pad + c * (colW + gap);
      // 标签
      fillRR(rx, ry, tagW, rowH, 9, YELLOW);
      ctx.fillStyle = INK;
      ctx.font = '800 21px ' + CN;
      ctx.textAlign = 'center';
      ctx.fillText(k, rx + tagW/2, ry + rowH/2 + 1);
      // 值
      const vx = rx + tagW + 8;
      fillRR(vx, ry, valW - 8, rowH, 9, '#FFFFFF');
      strokeRR(vx, ry, valW - 8, rowH, 9, '#E4E4EC', 1.1);
      ctx.fillStyle = INK;
      ctx.font = '800 21px ' + CN;
      ctx.textAlign = 'left';
      let txt = String(v || '');
      let fs = 21;
      while(ctx.measureText(txt).width > valW - 30 && fs > 12){
        fs -= 1;
        ctx.font = '800 ' + fs + 'px ' + CN;
      }
      ctx.fillText(txt, vx + 14, ry + rowH/2 + 1);
    });
  });
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  // 猫爪装饰
  ctx.save();
  ctx.globalAlpha = 0.9;
  cat(x + w - 44, y + h - 30, 13, 'rgba(225,225,232,0.95)');
  ctx.restore();
}

function drawBio(){
  const {x, y, w, h} = CARD_BIO;
  ctx.save();
  ctx.shadowColor = 'rgba(120,80,110,0.14)';
  ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
  fillRR(x, y, w, h, 16, '#ffffff');
  ctx.restore();
  strokeRR(x, y, w, h, 16, PINK_EDGE, 1.2);

  const pad = 22;
  const titleY = y + 34;

  // 标题
  ctx.textBaseline = 'middle';
  ctx.fillStyle = PINK_DEEP;
  ctx.font = '900 27px ' + CN;
  ctx.textAlign = 'left';
  ctx.fillText('个人介绍', x + pad, titleY);
  const tw = ctx.measureText('个人介绍').width;

  // 菱形
  star4(x + pad + tw + 18, titleY, 9, PINK_SOFT);

  // 分隔线
  const lineX1 = x + pad + tw + 38;
  const lineX2 = x + w - pad - 132;
  const lg = ctx.createLinearGradient(lineX1, 0, lineX2, 0);
  lg.addColorStop(0, rgba(PINK, 0.85));
  lg.addColorStop(1, rgba(PINK_SOFT, 0.25));
  ctx.fillStyle = lg;
  ctx.fillRect(lineX1, titleY - 0.8, Math.max(0, lineX2 - lineX1), 1.6);

  // 小字
  ctx.fillStyle = rgba(mixA(PINK, '#FFFFFF', 0.42), 0.95);
  ctx.font = '700 10px ' + CN;
  tracked('PROFILE CARD', x + w - pad, titleY + 1, 2.4, 'right');

  // 正文
  ctx.fillStyle = '#2E2E38';
  ctx.font = '400 16px ' + CN;
  ctx.textBaseline = 'top';
  const bodyX = x + pad;
  const bodyW = w - pad*2;
  const bodyY = titleY + 30;
  const lh = 26;
  const maxLines = Math.floor((y + h - 22 - bodyY) / lh);

  const lines = wrap(String(state.intro || ''), bodyW);
  for(let i = 0; i < Math.min(lines.length, maxLines); i++){
    let line = lines[i];
    if(i === maxLines - 1 && lines.length > maxLines){
      while(ctx.measureText(line + '…').width > bodyW && line.length > 1){
        line = line.slice(0, -1);
      }
      line += '…';
    }
    ctx.fillText(line, bodyX, bodyY + i * lh);
  }
  ctx.textBaseline = 'alphabetic';
}

   ============================================================ */
function trackedWidth(text, spacing){
  let t = 0;
  const chars = [...text];
  chars.forEach(c => t += ctx.measureText(c).width);
  return t + spacing * Math.max(0, chars.length - 1);
}

const IMG_KEY = LS_KEY + '_img';
const MAX_SIDE = 2200;   // 超大图先降采样，保证滚动滑块流畅

function useImage(src, persist){
  const im = new Image();
  im.onload = () => {
    // 降采样
    let out = im;
    const side = Math.max(im.width, im.height);
    if(side > MAX_SIDE){
      const k = MAX_SIDE / side;
      const oc = document.createElement('canvas');
      oc.width = Math.round(im.width * k);
      oc.height = Math.round(im.height * k);
      const octx = oc.getContext('2d');
      octx.imageSmoothingQuality = 'high';
      octx.drawImage(im, 0, 0, oc.width, oc.height);
      out = oc;
    }
    img = out;
    imgURL = src;
    if(persist) saveImage(src);
    draw();
  };
  im.src = src;
}

function saveImage(dataURL){ return;
  try {
    // 压缩成小图再存，避免超出 localStorage 限额
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const small = c.toDataURL('image/jpeg', 0.86);
      try { localStorage.setItem(IMG_KEY, small); } catch(e){}
    };
    im.src = dataURL;
  } catch(e){}
}

function setImageFromFile(file){
  if(!file || !/^image\//.test(file.type)) return;
  const reader = new FileReader();
  reader.onload = () => useImage(reader.result, true);
  reader.readAsDataURL(file);
}

/* ---------------- 画布直接操作立绘 ---------------- */
function toCardPos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}
function inPort(p){
  return p.x >= PORT.x - 20 && p.x <= PORT.x + PORT.w &&
         p.y >= PORT.y      && p.y <= PORT.y + PORT.h;
}
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

let dragging = false, lastPos = null;

function applyDrag(p){
  const dx = p.x - lastPos.x, dy = p.y - lastPos.y;
  state.imgX = clamp(Math.round(state.imgX + dx / (PORT.w * 0.55) * 100), -100, 100);
  state.imgY = clamp(Math.round(state.imgY + dy / (PORT.h * 0.55) * 100), -100, 100);
  lastPos = p;
  $('imgX').value = state.imgX; $('imgXV').textContent = state.imgX;
  $('imgY').value = state.imgY; $('imgYV').textContent = state.imgY;
  draw();
}

cv.addEventListener('mousedown', e => {
  if(!img) return;
  const p = toCardPos(e);
  if(!inPort(p)) return;
  dragging = true; lastPos = p;
  cv.style.cursor = 'grabbing';
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if(dragging){
    applyDrag(toCardPos(e));
  } else if(img && e.target === cv){
    cv.style.cursor = inPort(toCardPos(e)) ? 'grab' : 'default';
  }
});
window.addEventListener('mouseup', () => {
  if(dragging){
    dragging = false;
    cv.style.cursor = img ? 'grab' : 'default';
    save();
  }
});

/* 触摸：单指拖动立绘 + 轻点看大图 */
let touchT0 = 0, touchMoved = false;

cv.addEventListener('touchstart', e => {
  touchT0 = Date.now();
  touchMoved = false;
  if(!img || e.touches.length !== 1) return;
  const p = toCardPos(e.touches[0]);
  if(!inPort(p)){ cv.style.touchAction = 'pan-y'; return; }
  cv.style.touchAction = 'none';
  dragging = true; lastPos = p;
}, { passive: true });

cv.addEventListener('touchmove', e => {
  if(!dragging || e.touches.length !== 1) return;
  e.preventDefault();
  touchMoved = true;
  applyDrag(toCardPos(e.touches[0]));
}, { passive: false });

cv.addEventListener('touchend', () => {
  if(dragging){ dragging = false; save(); }
  cv.style.touchAction = 'pan-y';
  if(!touchMoved && Date.now() - touchT0 < 320) openLightbox();
});
cv.addEventListener('touchcancel', () => {
  if(dragging){ dragging = false; save(); }
  cv.style.touchAction = 'pan-y';
});

cv.addEventListener('wheel', e => {
  if(!img) return;
  if(!inPort(toCardPos(e))) return;
  e.preventDefault();
  state.imgScale = clamp(Math.round(state.imgScale - e.deltaY * 0.12), 100, 260);
  $('imgScale').value = state.imgScale;
  $('imgScaleV').textContent = state.imgScale + '%';
  draw(); save();
}, { passive: false });

cv.addEventListener('dblclick', e => {
  if(inPort(toCardPos(e))) $('fileImg').click();
});

  const a = document.createElement('a');
  const safe = (state.name || '').replace(/[\\/:*?"<>|]/g, '').trim();
  a.download = '杯子角色卡' + (safe ? '_' + safe : '') + '.png';
  a.href = cv.toDataURL('image/png');
  a.click();
});

$('btnCopy').addEventListener('click', async () => {
  try {
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    const btn = $('btnCopy');
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = old, 1400);
  } catch(err){
    alert('当前浏览器不支持直接复制图片，请用「下载 PNG」。');
  }
});

/* ---------------- 全屏查看 ---------------- */
function openLightbox(){
  try {
    $('lightboxImg').src = cv.toDataURL('image/png');
    $('lightbox').classList.add('on');
    document.body.style.overflow = 'hidden';
  } catch(err){
    alert('预览生成失败，请重试。');
  }
}
function closeLightbox(){
  $('lightbox').classList.remove('on');
  document.body.style.overflow = '';
}
$('btnFull').addEventListener('click', openLightbox);
$('lightboxClose').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeLightbox();
});

$('btnReset').addEventListener('click', () => {
  
  state = JSON.parse(JSON.stringify(DEFAULT));
  img = null; imgURL = null;
  $('fileImg').value = '';
  try { localStorage.removeItem(IMG_KEY); } catch(e){}
  syncUI(); draw(); save();
});

/* ---------------- 启动 ---------------- */
load();
syncUI();
draw();
try {
  const cached = null;
  if(cached) useImage(cached, false);
} catch(e){}
window.__draw = draw;   // 调试用
window.__setImg = (im) => { img = im; draw(); };

})();
</script>
