

<div class="app">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-pot">🍲</div>
      <h1>速配<em>一餐</em></h1>
    </div>
    <p>冰箱里剩的那几样，其实够做一顿热乎的。<br>挑出来，我告诉你能做什么、怎么做。</p>
    <p class="hero-stats" id="appStats"></p>
    <svg class="hero-wave" viewBox="0 0 320 8" fill="none" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 5 Q 10 1 20 5 T 40 5 T 60 5 T 80 5 T 100 5 T 120 5 T 140 5 T 160 5 T 180 5 T 200 5 T 220 5 T 240 5 T 260 5 T 280 5 T 300 5 T 320 5"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </header>

  <!-- ── 懒人通道：随机外卖 ── -->
  <button class="lazy-entry" id="lazyEntry" type="button">
    <span class="le-ico">🥡</span>
    <span class="le-text">
      <b>今天不想做饭</b>
      <i>摇一个外卖，别在软件里翻二十分钟</i>
    </span>
    <span class="le-arrow">›</span>
  </button>

  <!-- ── 第一步：选食材 ── -->
  <section id="picker">
    <div class="panel">
      <div class="panel-head">
        <h2>你手边有什么</h2>
        <span class="counter" id="selCount">已选 0 样</span>
      </div>

      <div class="selected-chips" id="selectedChips"></div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="搜食材或菜名，比如 番茄 / 红烧肉" autocomplete="off">
      </div>

      <div class="tabs" id="catTabs" role="tablist"></div>
      <div class="grid" id="ingGrid"></div>
      <p class="hint" id="catHint"></p>
      <div class="dish-hits" id="dishHits"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>调料</h2>
        <span class="counter">默认 生抽 老抽 盐 糖 醋 油</span>
      </div>
      <div id="pantryGroups"></div>
    </div>
  </section>

  <!-- ── 第二步：结果 ── -->
  <section id="results" class="hidden">
    <div class="result-head" id="resultHead"></div>
    <div id="resultBody"></div>
  </section>

</div>

<!-- ── 底部操作条 ── -->
<div class="dock">
  <div class="dock-inner">
    <button class="btn-main" id="goBtn" type="button">先选几样手边有的东西</button>
    <button class="btn-ghost hidden" id="backBtn" type="button" style="margin-top:10px">重新选食材</button>
  </div>
</div>

<!-- ── 做法抽屉 ── -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="做法详情">
  <div class="sheet-grip"><i></i></div>
  <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">✕</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ── 随机外卖抽屉 ── -->
<div class="sheet-mask" id="tkMask"></div>
<div class="sheet" id="tkSheet" role="dialog" aria-modal="true" aria-label="随机外卖">
  <div class="sheet-grip"><i></i></div>
  <button class="sheet-close" id="tkClose" type="button" aria-label="关闭">✕</button>
  <div class="sheet-body" id="tkBody"></div>
</div>
