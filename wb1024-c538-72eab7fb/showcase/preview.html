<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* 速配一餐 · 温暖治愈风样式 */

:root {
  --cream: #FBF4E9;
  --cream-deep: #F4E8D8;
  --card: #FFFCF7;
  --card-2: #FFF8EE;
  --ink: #4B3A2E;
  --ink-2: #7E6A5A;
  --ink-3: #A6927F;
  --orange: #E2894F;
  --orange-deep: #C96F3D;
  --orange-soft: #F7DCC4;
  --green: #8FA97B;
  --green-soft: #E4EDD9;
  --yellow: #F2C879;
  --line: #F0E3D2;
  --line-2: #E8D8C3;
  --shadow: 0 10px 30px rgba(186, 146, 106, .10);
  --shadow-sm: 0 4px 14px rgba(186, 146, 106, .09);
  --shadow-lift: 0 16px 40px rgba(186, 146, 106, .18);
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB",
          "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(680px 420px at 8% -6%, rgba(247, 220, 196, .70), transparent 62%),
    radial-gradient(560px 380px at 102% 8%, rgba(228, 237, 217, .62), transparent 60%),
    radial-gradient(720px 520px at 50% 112%, rgba(242, 200, 121, .24), transparent 64%);
  background-attachment: fixed;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 0 16px 128px;
}

/* ── 顶部 ── */
.hero {
  padding: 30px 6px 16px;
  position: relative;
}

.hero-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero-pot {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  display: grid;
  place-items: center;
  font-size: 25px;
  background: linear-gradient(160deg, #FFF6EA, #FBE3C8);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  transform: rotate(-4deg);
}

.hero h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--ink);
}

.hero h1 em {
  font-style: normal;
  color: var(--orange-deep);
}

.hero p {
  margin: 12px 0 0;
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--ink-2);
  letter-spacing: .3px;
}

.hero-stats {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .72);
  border: 1px solid var(--line-2);
  font-size: 12px;
  color: var(--ink-3, #9c8a76);
  letter-spacing: .4px;
}

.hero-stats:empty {
  display: none;
}

.hero-wave {
  margin-top: 18px;
  height: 8px;
  color: var(--line-2);
  opacity: .9;
}

/* ── 卡片 ── */
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 14px;
}

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.panel-head h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .6px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.panel-head h2::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 0 4px rgba(226, 137, 79, .14);
}

.counter {
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: .4px;
  white-space: nowrap;
}

/* ── 已选 ── */
.selected-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.selected-chips:empty {
  display: none;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 10px 7px 8px;
  font-size: 13px;
  border-radius: 999px;
  background: var(--orange-soft);
  color: var(--orange-deep);
  border: 1px solid #F2CBA9;
  cursor: pointer;
  animation: pop .24s ease;
  transition: transform .16s ease, background .16s ease;
}

.chip:active { transform: scale(.94); }
.chip span.x { font-size: 11px; opacity: .6; }

/* 手绘食材图标 */
.fi {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

.ing .blob .fi { width: 88%; height: 88%; }

/* 图标自带高光，去掉圆底那层白雾 */
.ing .blob.has-fi::after { display: none; }

.chip-ico {
  width: 18px;
  height: 18px;
  display: inline-grid;
  place-items: center;
  font-size: 13px;
  line-height: 1;
  flex: 0 0 18px;
}

.mats .mat .fi {
  width: 18px;
  height: 18px;
  vertical-align: -4px;
  display: inline-block;
  margin-right: 2px;
}

/* 菜品卡 / 详情头图里的主料图标 */
.rcard .rblob .fi,
.recipe-hero .rblob .fi {
  width: 76%;
  height: 76%;
}

.dh-emoji {
  width: 22px;
  height: 22px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 22px;
}

@keyframes pop {
  from { transform: scale(.82); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ── 搜索 ── */
.search {
  position: relative;
  margin-bottom: 14px;
}

.search input {
  width: 100%;
  border: 1px solid var(--line-2);
  background: var(--card-2);
  border-radius: 14px;
  padding: 12px 14px 12px 38px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}

.search input::placeholder { color: var(--ink-3); }

.search input:focus {
  border-color: #EBB98F;
  background: #FFFDF9;
  box-shadow: 0 0 0 4px rgba(226, 137, 79, .10);
}

.search::before {
  content: "🔍";
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: .55;
}

/* ── 分类 ── */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  padding: 8px 15px;
  font-size: 13.5px;
  font-family: inherit;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: #FFFDF9;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .18s ease;
}

.tab[aria-selected="true"] {
  background: var(--orange);
  border-color: var(--orange);
  color: #fff;
  box-shadow: 0 6px 16px rgba(226, 137, 79, .28);
}

/* ── 食材网格 ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
  gap: 10px 8px;
}

.ing {
  border: none;
  background: transparent;
  padding: 4px 0 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-family: inherit;
  position: relative;
}

.ing .blob {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 25px;
  line-height: 1;
  background: var(--blob-bg, #F6EEE2);
  border: 2px solid transparent;
  transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), border-color .18s, box-shadow .18s;
  position: relative;
}

.ing .blob::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .85), transparent 58%);
  pointer-events: none;
}

.ing .nm {
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: .2px;
  transition: color .18s;
}

.ing:active .blob { transform: scale(.9); }

.ing[aria-pressed="true"] .blob {
  transform: scale(1.04) translateY(-2px);
  border-color: var(--orange);
  box-shadow: 0 8px 18px rgba(226, 137, 79, .26);
}

.ing[aria-pressed="true"] .nm {
  color: var(--orange-deep);
  font-weight: 700;
}

.ing[aria-pressed="true"] .blob::before {
  content: "✓";
  position: absolute;
  top: -4px;
  right: -4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  z-index: 2;
  box-shadow: 0 2px 6px rgba(201, 111, 61, .4);
  animation: pop .22s ease;
}

.hint {
  margin: 12px 0 0;
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: .3px;
  text-align: center;
}

/* ── 调料 ── */
.pgroup + .pgroup { margin-top: 14px; }

.pgroup-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.pgroup-title b { font-weight: 700; color: var(--ink); }

.pgroup-title i {
  font-style: normal;
  font-size: 11.5px;
  color: var(--ink-3);
}

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: #FFFDF9;
  color: var(--ink-3);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  transition: all .16s ease;
}

.pill[aria-pressed="true"] {
  background: var(--green-soft);
  border-color: #CBDCB9;
  color: #5D7350;
  font-weight: 600;
}

.pill.locked {
  background: #FFF6EA;
  border-color: #F1DCC1;
  color: #A8794C;
  cursor: default;
  font-weight: 600;
}

.pill:not(.locked):active { transform: scale(.95); }

/* ── 结果页 ── */
.result-head {
  text-align: center;
  padding: 22px 6px 18px;
}

.result-head .big {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.55;
  letter-spacing: .5px;
}

.result-head .big em {
  font-style: normal;
  color: var(--orange-deep);
  padding: 0 2px;
  background-image: linear-gradient(transparent 62%, rgba(242, 200, 121, .58) 62%);
  background-repeat: no-repeat;
}

.result-head .sub {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.7;
}

.tier-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 4px 10px;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .5px;
}

.tier-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line-2), transparent);
}

.tier-label b {
  font-weight: 700;
  color: var(--ink-2);
  font-size: 13px;
}

/* 展开更多 */
.expand-btn {
  width: 100%;
  margin: 10px 0 4px;
  padding: 12px;
  border: 1px dashed var(--line-2);
  border-radius: var(--r-md);
  background: rgba(255, 252, 247, .66);
  color: var(--ink-2);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .18s ease, transform .18s ease;
}

.expand-btn:active {
  transform: scale(.985);
  background: var(--card-2);
}

/* 菜谱卡 */
.rcard {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px;
  margin-bottom: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  font-family: inherit;
  color: inherit;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
  animation: rise .34s ease both;
}

.rcard:active {
  transform: scale(.985);
  box-shadow: var(--shadow);
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.rcard .rblob {
  flex: 0 0 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 24px;
  background: var(--blob-bg, #F7EFE3);
}

.rcard .rmain { flex: 1; min-width: 0; }

.rcard .rname {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: .4px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  letter-spacing: .3px;
}

.badge.ok { background: var(--green-soft); color: #5D7350; }
.badge.ai { background: #EDE6FA; color: #6E5A9E; }
.badge.miss { background: #FDECE0; color: #B4653A; }

.rcard .rmeta {
  margin-top: 6px;
  font-size: 12px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.rcard .rmeta .dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--ink-3);
  opacity: .5;
}

.rcard .arrow {
  color: var(--line-2);
  font-size: 16px;
}

/* AI 卡 */
.aicard {
  border: 1.5px dashed #D9C9EE;
  background: linear-gradient(160deg, #FDFBFF, #F7F2FE);
}

.ai-btn {
  width: 100%;
  margin: 18px 0 8px;
  padding: 15px;
  border-radius: var(--r-md);
  border: 1.5px dashed #D9C9EE;
  background: linear-gradient(160deg, #FDFBFF, #F7F2FE);
  color: #6E5A9E;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  transition: all .18s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.ai-btn:active { transform: scale(.98); }
.ai-btn:disabled { opacity: .62; cursor: default; }

.ai-note {
  font-size: 11.5px;
  color: var(--ink-3);
  text-align: center;
  line-height: 1.6;
  margin: 6px 0 0;
}

.empty {
  text-align: center;
  padding: 46px 20px;
  color: var(--ink-2);
}

.empty .e-emoji {
  font-size: 46px;
  display: block;
  margin-bottom: 14px;
  animation: bob 2.6s ease-in-out infinite;
}

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-6px) rotate(3deg); }
}

.empty p {
  margin: 0 0 6px;
  font-size: 14px;
  line-height: 1.8;
}

.empty .small {
  font-size: 12.5px;
  color: var(--ink-3);
}

/* ── 底部操作条 ── */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(251, 244, 233, .98) 58%, rgba(251, 244, 233, 0));
  pointer-events: none;
}

.dock-inner {
  max-width: 488px;
  margin: 0 auto;
  pointer-events: auto;
}

.btn-main {
  width: 100%;
  border: none;
  border-radius: 999px;
  padding: 16px 20px;
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
  background: linear-gradient(135deg, #EC9A5E, #DE7E45);
  box-shadow: 0 10px 26px rgba(222, 126, 69, .34);
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, opacity .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-main:active { transform: scale(.975); }

.btn-main:disabled {
  background: #E3D5C4;
  box-shadow: none;
  color: #FFFCF7;
  cursor: default;
}

.btn-ghost {
  width: 100%;
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink-2);
  border-radius: 999px;
  padding: 13px;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: .5px;
  cursor: pointer;
  transition: all .16s ease;
}

.btn-ghost:active { transform: scale(.98); background: var(--card-2); }

/* ── 详情抽屉 ── */
.sheet-mask {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(75, 58, 46, .34);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s ease;
}

.sheet-mask.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 61;
  max-width: 520px;
  margin: 0 auto;
  max-height: 90vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--card);
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -12px 44px rgba(140, 100, 60, .22);
  transform: translateY(102%);
  transition: transform .34s cubic-bezier(.32, .86, .35, 1);
  padding: 0 0 calc(28px + env(safe-area-inset-bottom));
}

.sheet.open { transform: translateY(0); }

.sheet-grip {
  position: sticky;
  top: 0;
  background: var(--card);
  padding: 10px 0 6px;
  display: grid;
  place-items: center;
  border-radius: 28px 28px 0 0;
  z-index: 2;
}

.sheet-grip i {
  width: 40px;
  height: 4px;
  border-radius: 999px;
  background: var(--line-2);
}

.sheet-close {
  position: absolute;
  top: 12px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--cream-deep);
  color: var(--ink-2);
  font-size: 15px;
  cursor: pointer;
  display: grid;
  place-items: center;
  z-index: 3;
}

.sheet-body { padding: 4px 20px 0; }

.recipe-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 6px 0 16px;
}

.recipe-hero .rblob {
  flex: 0 0 62px;
  height: 62px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: var(--blob-bg, #F7EFE3);
  transform: rotate(-3deg);
}

.recipe-hero h2 {
  margin: 0 0 6px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: .8px;
}

.recipe-hero .tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-3);
}

.recipe-hero .tags span {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 9px;
}

.sect {
  margin-bottom: 22px;
}

.sect-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  letter-spacing: 1px;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sect-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.mats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.mat {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--card-2);
  border: 1px solid var(--line);
  font-size: 13.5px;
}

.mat.lack {
  background: #FDF0E7;
  border-color: #F6D9C4;
  color: #B4653A;
}

.mat.season {
  background: #F8F5EE;
  font-size: 12.5px;
  color: var(--ink-2);
}

.mat.season.miss {
  background: #FDF0E7;
  border-color: #F6D9C4;
  color: #B4653A;
}

.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: s;
}

.steps li {
  counter-increment: s;
  position: relative;
  padding: 0 0 16px 38px;
  font-size: 14.5px;
  line-height: 1.85;
  color: #554335;
}

.steps li::before {
  content: counter(s);
  position: absolute;
  left: 0;
  top: 2px;
  width: 25px;
  height: 25px;
  border-radius: 50%;

  font-weight: 700;
  display: grid;
  place-items: center;
}

.steps li:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 12px;
  top: 30px;
  bottom: 2px;
  width: 1px;
  background: linear-gradient(to bottom, var(--line-2), transparent);
}

/* ── 载入 ── */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 30px 20px;
  color: var(--ink-2);
  font-size: 13px;
}

.pot {
  width: 54px;
  height: 30px;
  border-radius: 8px 8px 20px 20px;
  background: linear-gradient(160deg, #E8A574, #D3824C);
  position: relative;
  animation: potbob 1.5s ease-in-out infinite;
}

.pot::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 8px;
  width: 38px;
  height: 6px;
  border-radius: 999px;
  background: #C06E3E;
}

.pot::after {
  content: "";
  position: absolute;
  top: -22px;
  left: 50%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(226, 137, 79, .5);
  animation: steam 1.6s ease-out infinite;
}

@keyframes potbob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes steam {
  0% { transform: translate(-50%, 6px) scale(.5); opacity: 0; }
  40% { opacity: .9; }
  100% { transform: translate(-50%, -10px) scale(1.3); opacity: 0; }

const RECIPES=[{"id":"tomato-egg","name":"番茄炒蛋","emoji":"🍅","need":["tomato","egg"],"extra":["scallion"],"time":10,"level":1,"steps":["番茄切块，鸡蛋打散加一小撮盐。","热锅多放点油，倒蛋液，边缘凝固就划散盛出，别炒老。","锅里补少许油，下番茄中火炒到出汁变软，加半勺糖、少许盐。","倒回鸡蛋翻两下，撒葱花出锅。"],"tip":"番茄先用刀划十字烫一下去皮，汤汁会更浓，拌饭特别香。"},{"id":"tomato-egg-soup","name":"番茄蛋花汤","emoji":"🍲","need":["tomato","egg"],"extra":["scallion","starch"],"time":12,"level":1,"steps":["番茄切小块，锅里少油炒软，加两碗水烧开。","加盐调味，淋一点水淀粉让汤微微稠。","关小火，蛋液沿筷子细细淋成蛋花，静等三秒再轻推。","滴几滴香油、撒葱花即可。"],"tip":"蛋液一定要小火淋，火大了蛋花就成蛋块了。"},{"id":"potato-shred","name":"醋溜土豆丝","emoji":"🥔","need":["potato"],"extra":["garlic","driedchili"],"time":15,"level":1,"steps":["土豆切细丝，泡凉水里抓洗两遍去掉淀粉，捞出沥干。","热锅冷油下蒜末、干辣椒炒香。","倒入土豆丝大火快炒一分半，沿锅边淋一勺醋。","加盐、少许糖，再翻几下就出锅，保持脆感。"],"tip":"洗完一定要沥干，带水下锅会变成\"煮土豆丝\"，炒不脆。"},{"id":"cabbage-vinegar","name":"醋溜白菜","emoji":"🥬","need":["cabbage"],"extra":["garlic","driedchili"],"time":12,"level":1,"steps":["白菜帮斜刀片薄，菜叶手撕成块，分开放。","热油爆香蒜片和干辣椒，先下菜帮炒一分钟。","再下菜叶，大火翻炒至微软。","加生抽、醋、盐、一点糖，翻匀出锅。"],"tip":"菜帮和菜叶分开下锅，这样熟得一致，不会叶子烂了帮子还硬。"},{"id":"garlic-broccoli","name":"蒜蓉西兰花","emoji":"🥦","need":["broccoli"],"extra":["garlic"],"time":10,"level":1,"steps":["西兰花掰小朵，盐水泡五分钟，冲净。","水开加几滴油和一点盐，焯四十秒捞出过凉。","热油下蒜末小火炒香，别炒焦。","倒入西兰花大火翻匀，加盐和少许生抽即可。"],"tip":"焯水时加油和盐，颜色会保持翠绿，看着就有食欲。"},{"id":"oyster-lettuce","name":"蚝油生菜","emoji":"🥬","need":["lettuce"],"extra":["oyster","garlic"],"time":8,"level":1,"steps":["生菜一片片洗净沥干，蒜切末。","水烧开，生菜下锅烫十秒立刻捞出摆盘。","小碗调蚝油一勺、生抽半勺、少许糖和两勺水。","热油炒香蒜末，倒入料汁烧开，浇在生菜上。"],"tip":"生菜烫十秒就够，久了会出水塌掉，整盘变汤。"},{"id":"smashed-cucumber","name":"拍黄瓜","emoji":"🥒","need":["cucumber"],"extra":["garlic","sesamoil"],"time":5,"level":1,"steps":["黄瓜用刀面拍裂，再切成小段，这样更容易入味。","撒半勺盐抓匀，静置五分钟倒掉渗出的水。","加蒜末、生抽、醋、糖、香油拌匀。","喜欢辣可以加一勺辣椒油，拌好冰一会儿更爽。"],"tip":"先盐杀水再调味，是拍黄瓜不出水、味道不淡的关键。"},{"id":"cucumber-egg","name":"黄瓜炒蛋","emoji":"🥒","need":["cucumber","egg"],"extra":["scallion"],"time":10,"level":1,"steps":["黄瓜斜切薄片，鸡蛋打散。","热油炒蛋，凝固就盛出。","锅里补油，下黄瓜片大火炒一分钟。","倒回鸡蛋，加盐翻匀出锅。"],"tip":"黄瓜别炒久，断生就好，脆脆的才清口。"},{"id":"disanxian","name":"地三鲜","emoji":"🍆","need":["potato","eggplant","greenpepper"],"extra":["garlic","starch"],"time":22,"level":2,"steps":["土豆、茄子切滚刀块，青椒切块；茄子撒点盐抓一下挤掉水。","土豆先下油锅炸到金黄捞出，再炸茄子至软，最后青椒过一下油。","留底油爆香蒜末，倒回三样，淋生抽、少许老抽和糖。","淋一点水淀粉收汁，翻匀出锅。"],"tip":"不想费油就改空气炸锅或平底锅少油煎，味道差不太多，热量低很多。"},{"id":"yuxiang-eggplant","name":"鱼香茄子","emoji":"🍆","need":["eggplant","mincedpork"],"extra":["douban","garlic","ginger","starch"],"time":22,"level":2,"steps":["茄子切条，撒盐静置十分钟挤水。","碗里调汁：生抽一勺、醋一勺、糖一勺、水淀粉少许。","热油炒散肉末，加豆瓣酱、蒜末、姜末炒出红油。","下茄子翻炒，倒料汁，中火收浓即可。"],"tip":"鱼香味的公式是\"糖醋各一勺、生抽一勺\"，记住比例就不会翻车。"},{"id":"braised-eggplant","name":"红烧茄子","emoji":"🍆","need":["eggplant"],"extra":["garlic","starch"],"time":18,"level":2,"steps":["茄子切条，撒盐十分钟后挤干水分，拌一点淀粉抓匀。","平底锅少油，把茄子煎到表面微焦软身，盛出。","爆香蒜末，加生抽、老抽、糖和半碗水烧开。","倒回茄子小火焖三分钟，收汁出锅。"],"tip":"茄子先拌淀粉再煎，能少吸一半的油。"},{"id":"onion-egg","name":"洋葱炒蛋","emoji":"🧅","need":["onion","egg"],"extra":[],"time":10,"level":1,"steps":["洋葱切丝，鸡蛋打散加少许盐。","热油炒蛋，盛出备用。","下洋葱中火炒到边缘透明、略甜。","倒回鸡蛋，加生抽少许翻匀。"],"tip":"洋葱炒到微微焦边最香，别急着翻，让它贴锅一会儿。"},{"id":"onion-pork","name":"洋葱炒肉片","emoji":"🧅","need":["onion","porkloin"],"extra":["wine","starch"],"time":15,"level":2,"steps":["里脊切薄片，加料酒、生抽、淀粉抓匀腌十分钟。","热油把肉片滑散至变色，盛出。","下洋葱丝炒软，加少许盐。","倒回肉片，淋一勺生抽大火翻匀。"],"tip":"肉片腌的时候加淀粉，炒出来会嫩很多，这是便宜又有效的一步。"},{"id":"potato-beef","name":"土豆炖牛肉","emoji":"🥔","need":["potato","beef"],"extra":["ginger","wine"],"time":70,"level":2,"steps":["牛肉切块冷水下锅，加料酒和姜片焯水，撇净浮沫后冲洗。","锅里少油炒香姜片，下牛肉翻炒，加生抽、老抽上色。","倒热水没过牛肉，大火烧开转小火炖四十分钟。","加土豆块再炖二十分钟，加盐收汁。"],"tip":"一定要加热水，冷水会让肉瞬间收缩变柴。炖的时间才是软烂的关键。"},{"id":"curry-chicken","name":"咖喱土豆鸡","emoji":"🍛","need":["potato","chickenleg","carrot"],"extra":["curry"],"time":30,"level":1,"steps":["鸡腿去骨切块，土豆胡萝卜切滚刀块。","锅里少油把鸡肉煎到表面变色。","下土豆胡萝卜翻炒，倒水没过食材，煮十五分钟。","关火放咖喱块搅化，再开小火煮三分钟变稠。"],"tip":"咖喱块一定要关火后再放，边煮边放容易结块糊底。"},{"id":"mushroom-chicken","name":"香菇滑鸡","emoji":"🍄","need":["shiitake","chickenleg"],"extra":["ginger","oyster","starch"],"time":25,"level":2,"steps":["鸡腿肉切块，加生抽、蚝油、淀粉、姜丝抓匀腌十五分钟。","香菇切片铺在盘底，鸡肉铺在上面。","水开后上锅大火蒸十五分钟。","出锅撒葱花，淋一勺热油更香。"],"tip":"全程不用炒，一个蒸锅就够，最适合懒得洗锅的中午。"},{"id":"cola-wings","name":"可乐鸡翅","emoji":"🍗","need":["chickenwing"],"extra":["cola","ginger","wine"],"time":25,"level":1,"steps":["鸡翅两面划两刀，冷水下锅加料酒焯一下捞出擦干。","平底锅少油，鸡翅两面煎到金黄。","加姜片、生抽、少许老抽，倒入可乐没过一半。","中火煮十分钟，开大火收到汤汁挂勺。"],"tip":"可乐本身很甜，不用再加糖，收汁时要盯着，很容易糊。"},{"id":"xiaochao-pork","name":"青椒小炒肉","emoji":"🌶️","need":["porkbelly","greenpepper"],"extra":["douban","garlic"],"time":15,"level":2,"steps":["五花肉切薄片，青椒手撕成块。","锅里不放油，先下青椒干煸到起虎皮，盛出。","下五花肉煸出油，肉片卷边时加蒜片和豆瓣酱炒香。","倒回青椒，加生抽少许，大火翻匀。"],"tip":"青椒先干煸是湘菜馆子的做法，煸过的青椒香得多，也不会有生味。"},{"id":"twicecooked-pork","name":"回锅肉","emoji":"🥓","need":["porkbelly","cabbage"],"extra":["douban","ginger","garlic"],"time":25,"level":3,"steps":["五花肉整块冷水下锅，加姜片料酒煮十五分钟，捞出放凉切薄片。","白菜切块，锅里不放油干煸到微软盛出。","下肉片小火煸到出油、边缘微卷。","加豆瓣酱炒出红油，倒回白菜，加生抽和少许糖翻匀。"],"tip":"肉要煮到筷子能插透再切，切太薄容易碎，太厚又不入味。"},{"id":"braised-pork","name":"红烧肉","emoji":"🥓","need":["porkbelly"],"extra":["ginger","wine"],"time":60,"level":3,"steps":["五花肉切麻将块，冷水下锅焯水，捞出洗净擦干。","锅里少油，下肉块煸到四面微黄出油。","加姜片、料酒、生抽、老抽、糖，倒热水没过肉。","小火炖四十五分钟，最后大火收汁到发亮。"],"tip":"糖可以多放一点，红烧肉的甜味是灵魂；收汁时不停翻动，让每块都裹上汁。"},{"id":"garlicsprout-pork","name":"蒜苔炒肉","emoji":"🌿","need":["garlicsprout","porkloin"],"extra":["garlic","wine"],"time":15,"level":1,"steps":["蒜苔掐去老根切段，里脊切丝用生抽料酒抓匀。","热油滑炒肉丝至变色，盛出。","下蒜苔大火炒两分钟，加少许盐和一勺水焖半分钟。","倒回肉丝，加生抽翻匀出锅。"],"tip":"蒜苔加一勺水焖一下，比干炒更容易熟透又不发黄。"},{"id":"celery-pork","name":"芹菜炒肉","emoji":"🌿","need":["celery","porkloin"],"extra":["garlic","wine"],"time":15,"level":1,"steps":["芹菜撕去老筋斜切段，肉切丝腌十分钟。","水开把芹菜焯二十秒捞出，颜色更绿也更脆。","热油炒肉丝至变色，下蒜末炒香。","倒芹菜大火翻炒，加盐和生抽出锅。"],"tip":"芹菜的老筋从一头撕下来，口感差得非常多，别省这一步。"},{"id":"fungus-pork","name":"木耳炒肉","emoji":"🍄","need":["fungus","porkloin"],"extra":["garlic","oyster"],"time":15,"level":1,"steps":["木耳提前泡发，撕小朵，焯水一分钟捞出。","肉切片腌制十分钟，热油滑散盛出。","爆香蒜末，下木耳翻炒。","倒回肉片，加蚝油和生抽翻匀。"],"tip":"木耳一定要焯水，既去土味也更安全，别直接下锅炒。"},{"id":"muji","name":"木须肉","emoji":"🥚","need":["egg","fungus","cucumber","porkloin"],"extra":["scallion"],"time":20,"level":2,"steps":["肉切片腌好，木耳泡发焯水，黄瓜切片，鸡蛋炒散盛出。","热油下肉片滑散至变色。","下木耳和黄瓜大火翻炒一分钟。","倒回鸡蛋，加生抽、盐，撒葱花翻匀。"],"tip":"这道菜是\"冰箱清仓神器\"，四样东西各自处理再合炒，就不会炒成一锅糊。"},{"id":"tomato-beef","name":"番茄牛腩","emoji":"🍅","need":["tomato","beef"],"extra":["ginger","wine"],"time":90,"level":2,"steps":["牛腩切块冷水焯水，撇沫后冲洗干净。","番茄两个切块，热油炒到出沙出汁。","下牛腩翻炒，加姜片、料酒、生抽，倒热水没过。","小火炖一小时，最后加盐，再放一个番茄块煮五分钟。"],"tip":"番茄分两次放：先放的煮化成汤底，后放的保留果肉，汤浓又有口感。"},{"id":"chive-egg","name":"韭菜炒蛋","emoji":"🌿","need":["chive","egg"],"extra":[],"time":10,"level":1,"steps":["韭菜洗净沥干切段，鸡蛋打散。","热油炒蛋至半凝固，盛出。","锅补油，下韭菜大火快炒三十秒。","倒回鸡蛋，加盐翻匀立刻出锅。"],"tip":"韭菜遇热就出水，全程大火、三十秒内解决，才不会炒成汤。"},{"id":"shrimp-egg","name":"虾仁滑蛋","emoji":"🦐","need":["shrimp","egg"],"extra":["starch","wine"],"time":12,"level":2,"steps":["虾仁去虾线，加料酒、少许盐和淀粉抓匀。","蛋液打散，加两勺水淀粉搅匀，蛋会更嫩。","热锅温油滑炒虾仁至变色，倒入蛋液。","小火用铲子从边缘往中间推，半凝固就关火。"],"tip":"关火后再利用余温把蛋焖熟，这就是茶餐厅滑蛋的诀窍。"},{"id":"boiled-shrimp","name":"白灼虾","emoji":"🦐","need":["shrimp"],"extra":["ginger","scallion"],"time":10,"level":1,"steps":["水里放姜片和葱段烧开。","虾下锅，煮到变红卷曲立刻捞出，大约一分半。","小碟放生抽、少许醋和姜末做蘸料。","捞出过一下凉水，肉质更弹。"],"tip":"虾一红就捞，多煮三十秒就老了，这道菜成败只在时间上。"},{"id":"garlic-vermicelli-shrimp","name":"蒜蓉粉丝虾","emoji":"🦐","need":["shrimp","vermicelli"],"extra":["garlic","oyster"],"time":20,"level":2,"steps":["粉丝温水泡软铺在盘底。","虾开背去虾线，摆在粉丝上。","蒜末用热油激香，加蚝油、生抽拌成蒜蓉酱，铺在虾上。","水开上锅蒸八分钟，出锅撒葱花。"],"tip":"蒜末一半用油炸香、一半生的拌进去，蒜味层次会厚很多。"},{"id":"steamed-fish","name":"清蒸鲈鱼","emoji":"🐟","need":["fish"],"extra":["ginger","scallion","wine"],"time":20,"level":2,"steps":["鱼洗净擦干，两面划刀，抹少许盐和料酒，肚里塞姜葱。","盘底垫两根筷子把鱼架空，水开上锅大火蒸八分钟。","倒掉盘里的腥水，铺上新的葱丝姜丝。","淋两勺生抽，浇一勺烧到冒烟的热油。"],"tip":"蒸出来的水一定要倒掉，那是腥味的来源，这步偷懒整条鱼就废了。"},{"id":"wintermelon-mince","name":"冬瓜肉末","emoji":"🍈","need":["wintermelon","mincedpork"],"extra":["garlic","starch"],"time":20,"level":1,"steps":["冬瓜去皮切薄片，肉末备好。","热油炒散肉末，加蒜末和生抽炒香。","下冬瓜片翻炒，加半碗水，盖盖焖八分钟。","加盐，淋水淀粉收汁，撒葱花。"],"tip":"冬瓜会自己出水，水别加多，不然就是一锅汤。"},{"id":"pumpkin-egg","name":"南瓜蒸蛋","emoji":"🎃","need":["pumpkin","egg"],"extra":[],"time":20,"level":1,"steps":["南瓜去皮切小块，铺在碗底。","鸡蛋打散，加一点盐和 1.5 倍的温水搅匀，过筛。","蛋液倒入碗中，盖一层保鲜膜或盘子。","水开上锅中小火蒸十二分钟。"],"tip":"蛋液过筛加温水，蒸出来会像布丁一样滑，没有蜂窝。"},{"id":"corn-ribs-soup","name":"玉米排骨汤","emoji":"🌽","need":["corn","ribs","carrot"],"extra":["ginger","wine"],"time":60,"level":1,"steps":["排骨冷水下锅焯水，撇净浮沫捞出冲洗。","排骨加姜片和足量水，大火烧开转小火炖三十分钟。","加玉米段和胡萝卜块，再炖二十分钟。","出锅前五分钟加盐，别提前加。"],"tip":"盐一定最后放，早放肉会变紧，汤也不容易炖出味。"},{"id":"cold-fungus","name":"凉拌木耳","emoji":"🍄","need":["fungus"],"extra":["garlic","sesamoil","driedchili"],"time":12,"level":1,"steps":["木耳泡发洗净，撕小朵。","水开焯两分钟，捞出过凉水沥干。","加蒜末、生抽、醋、糖、香油。","干辣椒用热油泼香倒进去，拌匀。"],"tip":"焯完过凉水，木耳才会脆，温着拌会软塌塌的。"},{"id":"spinach-vermicelli","name":"菠菜炒粉丝","emoji":"🌿","need":["spinach","vermicelli"],"extra":["garlic"],"time":12,"level":1,"steps":["粉丝温水泡软剪短，菠菜焯水十秒挤干切段。","热油爆香蒜末。","下粉丝翻炒，加生抽和两勺水，让粉丝吸味。","倒菠菜翻匀，加盐出锅。"],"tip":"菠菜先焯水去草酸，口感不涩，也不会和豆腐类互相影响。"},{"id":"mapo-tofu","name":"麻婆豆腐","emoji":"🌶️","need":["tofu","mincedpork"],"extra":["douban","sichuan","garlic","starch"],"time":20,"level":2,"steps":["嫩豆腐切块，放淡盐水里浸五分钟，不易碎。","热油炒散肉末，加豆瓣酱、蒜末、花椒炒出红油。","加一碗水烧开，轻轻推入豆腐，小火煮五分钟。","分两次淋水淀粉勾芡，出锅撒葱花和花椒粉。"],"tip":"勾芡分两次，第一次让味道挂上，第二次让汤汁包住豆腐，这是\"亮汁\"的关键。"},{"id":"home-tofu","name":"家常豆腐","emoji":"🧈","need":["firmtofu","greenpepper"],"extra":["garlic","oyster"],"time":20,"level":2,"steps":["老豆腐切厚片，用厨房纸吸干水。","平底锅少油，两面煎到金黄，盛出。","爆香蒜末，下青椒块炒半分钟。","倒回豆腐，加蚝油、生抽和少许水，焖两分钟收汁。"],"tip":"豆腐一定要吸干水再煎，不然会溅油，也煎不出脆壳。"},{"id":"cabbage-tofu","name":"白菜炖豆腐","emoji":"🥬","need":["cabbage","firmtofu","vermicelli"],"extra":["scallion"],"time":25,"level":1,"steps":["白菜切块，豆腐切块，粉丝泡软。","热油炒白菜帮两分钟，加生抽炒匀。","加两碗水烧开，放豆腐和粉丝。","小火炖十分钟，加盐，撒葱花。"],"tip":"冬天最舒服的一锅，汤汁泡饭能吃两碗，成本还不到五块。"},{"id":"fried-tofu","name":"香煎豆腐","emoji":"🧈","need":["firmtofu"],"extra":["scallion"],"time":15,"level":1,"steps":["老豆腐切两厘米厚片，吸干表面水分。","平底锅放油，中小火煎到一面金黄再翻。","两面都脆了，淋一勺生抽和小半碗水。","收到汁快干，撒葱花出锅。"],"tip":"别急着翻面，等它自己能从锅底滑动再翻，就不会破皮。"},{"id":"century-tofu","name":"皮蛋豆腐","emoji":"🥚","need":["tofu","centuryegg"],"extra":["sesamoil","scallion"],"time":5,"level":1,"steps":["嫩豆腐倒扣在盘里，切块。","皮蛋剥壳切小块，铺在豆腐上。","淋生抽、几滴香油和一点醋。","撒葱花即可，冰镇十分钟更好吃。"],"tip":"五分钟能上桌的救命菜，热得不想开火的时候就靠它。"},{"id":"celery-tofu","name":"芹菜炒豆干","emoji":"🌿","need":["driedtofu","celery"],"extra":["garlic"],"time":15,"level":1,"steps":["豆干切条，芹菜切段焯水二十秒。","热油下豆干条，煎到边缘微黄。","加蒜末炒香，倒芹菜大火翻炒。","加生抽、少许盐，翻匀出锅。"],"tip":"豆干先煎一下会更香更有嚼头，直接炒会发软。"},{"id":"fuzhu-pork","name":"腐竹烧肉","emoji":"🥢","need":["fuzhu","porkbelly"],"extra":["garlic","oyster"],"time":40,"level":2,"steps":["腐竹提前用温水泡软，切段。","五花肉切片，小火煸出油至微黄。","加蒜末、生抽、老抽炒上色，倒热水烧开。","下腐竹小火焖二十分钟，加蚝油收汁。"],"tip":"腐竹要用温水泡，热水会外面烂了里面还硬。"},{"id":"egg-fried-rice","name":"蛋炒饭","emoji":"🍚","need":["rice","egg"],"extra":["scallion"],"time":10,"level":1,"steps":["隔夜饭打散，鸡蛋打散加少许盐。","热锅多油，倒蛋液，还没完全凝固就倒米饭。","大火快速翻炒，把蛋和饭炒散，米粒跳起来最好。","加盐、生抽少许，撒葱花出锅。"],"tip":"用隔夜冷饭、蛋液半熟就下饭，这两点决定炒饭是\"粒粒分明\"还是\"一坨\"。"},{"id":"yangzhou-rice","name":"扬州炒饭","emoji":"🍚","need":["rice","egg","peas","carrot","sausage"],"extra":["scallion"],"time":15,"level":2,"steps":["胡萝卜和火腿肠切小丁，豌豆焯熟。","热油炒蛋炒散，盛出。","下胡萝卜丁和火腿丁炒香，倒米饭炒散。","加豌豆和鸡蛋，加盐翻匀，撒葱花。"],"tip":"配料都切得跟米粒差不多大，一口下去才均匀，这是好看的关键。"},{"id":"tomato-noodle","name":"番茄鸡蛋面","emoji":"🍜","need":["noodle","tomato","egg"],"extra":["scallion"],"time":15,"level":1,"steps":["番茄切块，热油炒到出汁，加一勺生抽。","加两碗水烧开，下面条。","面快熟时淋蛋液成蛋花，加盐。","盛出撒葱花，滴几滴香油。"],"tip":"一个人的午饭之王：十五分钟、一个锅、成本三块，还热乎。"},{"id":"scallion-oil-noodle","name":"葱油拌面","emoji":"🍜","need":["noodle"],"extra":["scallion"],"time":12,"level":1,"steps":["小葱切长段，冷油下锅小火慢炸到焦黄捞出。","葱油里加生抽两勺、老抽半勺、糖半勺，小火煮开。","面煮熟捞出沥干。","淋两大勺葱油汁拌匀，铺上炸葱。"],"tip":"葱要冷油下锅小火炸，大火一进去就黑，会发苦。"},{"id":"plain-noodle","name":"阳春面","emoji":"🍜","need":["noodle"],"extra":["scallion"],"time":8,"level":1,"steps":["碗里放生抽一勺、少许盐、一点香油和葱花。","冲入一勺煮面水化开调料。","面煮熟捞入碗中，加汤至八分满。","喜欢的话加一勺猪油，味道立刻不一样。"],"tip":"调料先用热汤冲开再放面，这样汤有味、面不糊。"},{"id":"fried-egg-noodle","name":"煎蛋汤面","emoji":"🍜","need":["noodle","egg"],"extra":["scallion"],"time":10,"level":1,"steps":["平底锅煎一个荷包蛋，边缘焦脆最好。","同锅加两碗水烧开，下生抽和盐。","下面条煮到软。","盛碗，摆上煎蛋撒葱花。"],"tip":"煎蛋剩下的油别洗，直接加水煮面，汤会带一点焦香。"},{"id":"fried-instant","name":"炒方便面","emoji":"🍜","need":["instantnoodle","egg","cabbage"],"extra":[],"time":10,"level":1,"steps":["面饼用热水泡到八分软，捞出沥干。","热油炒散鸡蛋，下白菜丝炒软。","倒面，加半包调料和生抽，大火翻炒。","炒到面条微微焦边最香。"],"tip":"面别泡太软，还要炒；调料包放半包就够，全放会咸。"},{"id":"fried-ricecake","name":"炒年糕","emoji":"🍡","need":["ricecake","cabbage","sausage"],"extra":["oyster"],"time":15,"level":2,"steps":["年糕片用温水泡软分开。","热油炒香火腿肠片，下白菜炒软。","倒年糕，加生抽、蚝油和小半碗水。","翻炒到汤汁变稠、年糕软糯即可。"],"tip":"年糕容易粘锅，水要分两次加，一边炒一边补。"},{"id":"bun-sandwich","name":"馒头三明治","emoji":"🍞","need":["bun","egg","lettuce"],"extra":["cheese"],"time":10,"level":1,"steps":["馒头横切开，别切断。","煎一个蛋，顺便把馒头切面煎到微黄。","夹入煎蛋、生菜，喜欢就加一片芝士。","抹点番茄酱或沙拉酱，压一下就能吃。"],"tip":"馒头煎一下再夹，比冷着夹好吃太多，还不会掉渣。"},{"id":"egg-toast","name":"煎蛋吐司","emoji":"🍞","need":["bread","egg"],"extra":["cheese"],"time":8,"level":1,"steps":["吐司放进平底锅，小火烘到两面微脆。","同锅煎一个蛋，撒点盐。","吐司上放芝士片和煎蛋，盖上另一片。","趁热切开，芝士会拉丝。"],"tip":"吐司先干烘一下，吸油少、也不容易软塌。"},{"id":"chive-dumpling","name":"韭菜猪肉饺子","emoji":"🥟","need":["dumplingwrapper","chive","mincedpork"],"extra":["ginger","sesamoil"],"time":45,"level":2,"steps":["肉末加姜末、生抽、盐、一点水，顺一个方向搅上劲。","韭菜切碎，先拌一勺香油裹住，再和肉馅混合。","包好饺子，边缘捏紧。","水开下锅，三次点凉水，饺子浮起鼓胀即熟。"],"tip":"韭菜先拌油再拌肉，能锁住水分不出汤，包的时候不会破。"},{"id":"cabbage-dumpling","name":"白菜猪肉饺子","emoji":"🥟","need":["dumplingwrapper","cabbage","mincedpork"],"extra":["ginger","sesamoil"],"time":45,"level":2,"steps":["白菜剁碎，加盐腌十分钟，用手挤干水分。","肉末加姜末、生抽、盐搅上劲。","混合白菜，淋香油拌匀。","包好下锅煮，浮起后再煮两分钟。"],"tip":"一次多包些放冷冻，工作日中午煮十个就是一顿，比外卖快。"},{"id":"tomato-dough-drop","name":"番茄疙瘩汤","emoji":"🍅","need":["flour","tomato","egg"],"extra":["scallion"],"time":18,"level":2,"steps":["面粉放碗里，一边滴水一边用筷子搅成小疙瘩。","番茄炒出汁，加两碗水烧开。","把疙瘩抖散下锅，边下边搅防粘。","煮三分钟，淋蛋液，加盐和葱花。"],"tip":"水要一滴一滴加，搅出来的疙瘩才小；一次倒多了就成面团了。"},{"id":"potato-pancake","name":"土豆丝饼","emoji":"🥔","need":["potato","flour"],"extra":["scallion"],"time":18,"level":1,"steps":["土豆擦丝，不用洗，保留淀粉。","加两勺面粉、盐、葱花拌匀，能抱团就行。","平底锅放油，摊成小饼压薄。","中小火两面煎到金黄酥脆。"],"tip":"土豆丝千万别泡水，淀粉洗掉了就粘不起来，煎不成饼。"},{"id":"zucchini-egg","name":"西葫芦炒蛋","emoji":"🥒","need":["zucchini","egg"],"extra":["garlic"],"time":12,"level":1,"steps":["西葫芦切半月片，鸡蛋打散。","热油炒蛋盛出，锅留底油炒香蒜末。","下西葫芦大火炒两分钟至微软。","倒回鸡蛋，加盐翻匀出锅。"],"tip":"西葫芦出水多，炒完别久放，出锅就吃最清爽。"},{"id":"braised-wintermelon","name":"红烧冬瓜","emoji":"🍈","need":["wintermelon"],"extra":["scallion","oyster"],"time":18,"level":1,"steps":["冬瓜去皮切厚片，表面划几刀方便入味。","平底锅少油，两面煎到微黄。","加生抽、老抽、蚝油和小半碗水。","小火焖八分钟，收汁撒葱花。"],"tip":"冬瓜煎过再烧，会带一点肉香，吃起来不像\"水煮瓜\"。"},{"id":"snowpea-garlic","name":"清炒荷兰豆","emoji":"🍃","need":["snowpea"],"extra":["garlic"],"time":10,"level":1,"steps":["荷兰豆撕去两侧的筋，洗净。","水开焯三十秒捞出。","热油爆香蒜片。","下荷兰豆大火快炒，加盐出锅。"],"tip":"两边的筋一定要撕，不然嚼不动；焯过再炒更翠绿。"},{"id":"bacon-onion","name":"培根炒洋葱","emoji":"🥓","need":["bacon","onion"],"extra":[],"time":10,"level":1,"steps":["培根切段，洋葱切丝。","锅里不放油，先煎培根出油。","下洋葱丝炒到透明微甜。","加少许黑胡椒或生抽，翻匀出锅。"],"tip":"培根自带油和咸味，基本不用另外放油和盐。"},{"id":"sausage-egg","name":"火腿肠炒蛋","emoji":"🌭","need":["sausage","egg"],"extra":["scallion"],"time":8,"level":1,"steps":["火腿肠切斜片，鸡蛋打散。","热油炒蛋盛出。","下火腿片煎到边缘微焦。","倒回鸡蛋，加葱花翻匀。"],"tip":"火腿先煎一下会香很多，五分钟能搞定的加班午饭。"},{"id":"yam-fungus","name":"山药炒木耳","emoji":"🍠","need":["yam","fungus"],"extra":["garlic","oyster"],"time":15,"level":1,"steps":["山药去皮切薄片，泡在醋水里防氧化。","木耳泡发焯水一分钟。","热油爆香蒜末，下山药片炒两分钟。","下木耳，加盐和蚝油翻匀。"],"tip":"削山药戴手套，黏液沾手上会很痒；切好泡醋水不会发黑。"},{"id":"lotus-salad","name":"凉拌藕片","emoji":"🍥","need":["lotus"],"extra":["garlic","sesamoil","driedchili"],"time":15,"level":1,"steps":["藕去皮切薄片，泡水冲掉淀粉。","水开焯两分钟，捞出过凉水。","加蒜末、生抽、醋、糖、香油。","干辣椒用热油泼香，拌匀冰镇。"],"tip":"想要脆的选七孔藕，焯完立刻过凉水，口感会\"咔嚓\"响。"},{"id":"tomato-potato-soup","name":"番茄土豆汤","emoji":"🍅","need":["tomato","potato"],"extra":["scallion"],"time":20,"level":1,"steps":["番茄切块，土豆切小滚刀块。","热油炒番茄到出沙，加一勺生抽。","下土豆翻炒，加两碗水烧开。","小火煮十分钟到土豆软，加盐撒葱花。"],"tip":"土豆切小一点，煮到边缘化开，汤会自然变浓，不用勾芡。"},{"id":"bittergourd-egg","name":"苦瓜炒蛋","emoji":"🥒","need":["bittergourd","egg"],"extra":["garlic"],"time":12,"level":1,"steps":["苦瓜对半切开去瓤，切薄片，撒盐抓五分钟冲净。","水开焯三十秒捞出，能去大半苦味。","热油炒蛋盛出，下蒜末和苦瓜翻炒。","倒回鸡蛋，加盐翻匀。"],"tip":"盐抓 + 焯水两步做完，苦味会温和很多，夏天吃很清爽。"},{"id":"luffa-egg","name":"丝瓜炒蛋","emoji":"🥒","need":["luffa","egg"],"extra":["garlic"],"time":12,"level":1,"steps":["丝瓜去皮切滚刀块，鸡蛋打散。","热油炒蛋至半熟盛出。","下蒜末和丝瓜，中火炒到丝瓜变软出水。","倒回鸡蛋，加盐轻推几下出锅。"],"tip":"丝瓜会出清甜的汤汁，拌饭特别香，别收太干。"},{"id":"enoki-beef","name":"金针菇肥牛卷","emoji":"🍄","need":["enoki","beef"],"extra":["garlic","oyster"],"time":20,"level":2,"steps":["金针菇去根撕开，用牛肉片卷起来，接口朝下。","平底锅少油，接口朝下先煎定型。","翻面煎至变色，加蒜末。","淋生抽、蚝油和一点水，收汁即可。"],"tip":"肥牛片薄不用久煎，卷紧一点下锅才不会散。"},{"id":"mushroom-pork","name":"平菇炒肉","emoji":"🍄","need":["mushroom","porkloin"],"extra":["garlic","oyster"],"time":15,"level":1,"steps":["平菇撕条，焯水一分钟挤干水分。","肉片腌制十分钟，热油滑散盛出。","爆香蒜末，下平菇炒到微干。","倒回肉片，加蚝油和生抽翻匀。"],"tip":"平菇一定要挤干水，不然炒出来是\"平菇汤\"。"},{"id":"shiitake-bokchoy","name":"香菇青菜","emoji":"🍄","need":["shiitake","bokchoy"],"extra":["garlic","oyster"],"time":12,"level":1,"steps":["香菇切片，青菜洗净对半切。","水开焯青菜二十秒捞出摆盘。","热油炒香蒜末，下香菇炒软。","加蚝油、生抽和少许水烧开，浇在青菜上。"],"tip":"青菜和香菇分开处理，青菜才翠绿不变色。"},{"id":"tofu-shrimp-soup","name":"豆腐虾仁汤","emoji":"🍲","need":["tofu","shrimp"],"extra":["ginger","scallion"],"time":18,"level":1,"steps":["豆腐切小块，虾去虾线。","姜丝爆香，加两碗水烧开。","下豆腐小火煮五分钟，再下虾煮到变红。","加盐、白胡椒粉，撒葱花。"],"tip":"低油低盐的一碗，胃不舒服或者想清淡一天的时候最合适。"},{"id":"braised-chicken-potato","name":"土豆烧鸡块","emoji":"🍗","need":["potato","chickenleg"],"extra":["ginger","oyster","wine"],"time":35,"level":2,"steps":["鸡腿剁块焯水，土豆切滚刀块。","热油炒香姜片，下鸡块炒到表面微黄。","加料酒、生抽、老抽，倒热水没过，炖十五分钟。","下土豆再炖十五分钟，加盐收汁。"],"tip":"土豆晚放，早放会炖成泥，汤就浑了。"},{"id":"carrot-egg","name":"胡萝卜炒蛋","emoji":"🥕","need":["carrot","egg"],"extra":["scallion"],"time":12,"level":1,"steps":["胡萝卜擦丝或切细丝，鸡蛋打散。","热油炒蛋盛出。","锅里补油，下胡萝卜丝中火炒三分钟至软。","倒回鸡蛋，加盐和葱花翻匀。"],"tip":"胡萝卜里的胡萝卜素是脂溶的，用油炒过才好吸收，别水煮。"},{"id":"garlic-babycabbage","name":"蒜蓉娃娃菜","emoji":"🥬","need":["babycabbage"],"extra":["garlic","oyster"],"time":15,"level":1,"steps":["娃娃菜竖着切成四条，洗净沥干。","热油下大量蒜末，小火炒到微微发黄。","加生抽、蚝油和小半碗水烧开。","下娃娃菜，盖盖焖五分钟至软，收汁装盘。"],"tip":"娃娃菜比大白菜嫩，焖五分钟就够，久了会散架。"},{"id":"babycabbage-vermicelli","name":"娃娃菜蒸粉丝","emoji":"🥬","need":["babycabbage","vermicelli"],"extra":["garlic","oyster"],"time":20,"level":1,"steps":["粉丝泡软铺在盘底，娃娃菜切条摆在上面。","蒜末用热油激香，加蚝油、生抽拌成酱。","酱铺在娃娃菜上，水开上锅蒸十分钟。","出锅撒葱花，把盘里的汤汁淋回去。"],"tip":"蒸出来的汤汁是精华，别倒掉，拌粉丝特别鲜。"},{"id":"sprout-vinegar","name":"醋溜豆芽","emoji":"🌱","need":["beansprout"],"extra":["garlic","driedchili"],"time":10,"level":1,"steps":["豆芽洗净掐去根须，沥干水。","热锅热油，下蒜末和干辣椒爆香。","倒豆芽大火快炒一分钟。","沿锅边淋一勺醋，加盐和少许糖，翻两下出锅。"],"tip":"豆芽一定要大火快炒、全程不超过两分钟，才会脆生生不出水。"},{"id":"cauliflower-pork","name":"花菜炒肉","emoji":"🥦","need":["cauliflower","porkbelly"],"extra":["garlic","wine"],"time":20,"level":2,"steps":["花菜掰小朵，盐水泡十分钟，焯水一分钟。","五花肉切片，锅里不放油小火煸出油。","加蒜片炒香，淋料酒和生抽。","倒花菜大火翻炒两分钟，加盐出锅。"],"tip":"花菜焯过再炒容易熟透；不焯的话要多炒一会儿，加一勺水焖。"},{"id":"radish-pork","name":"白萝卜炒肉丝","emoji":"🥬","need":["radish","porkloin"],"extra":["garlic","wine"],"time":18,"level":1,"steps":["白萝卜切细丝，撒少许盐抓五分钟挤掉水。","肉丝腌十分钟，热油滑散盛出。","爆香蒜末，下萝卜丝炒三分钟至半透明。","倒回肉丝，加生抽翻匀，撒葱花。"],"tip":"萝卜先杀水再炒，不会出半锅汤，甜味也更集中。"},{"id":"radish-ribs-soup","name":"萝卜排骨汤","emoji":"🍖","need":["radish","ribs"],"extra":["ginger","wine"],"time":70,"level":1,"steps":["排骨冷水下锅焯水，撇净浮沫捞出。","加姜片和足量水，大火烧开转小火炖四十分钟。","白萝卜切滚刀块下锅，再炖二十分钟。","加盐和白胡椒粉，撒葱花。"],"tip":"萝卜别太早放，炖久了会化；关火前二十分钟下刚好。"},{"id":"steamed-egg","name":"蒸水蛋","emoji":"🥚","need":["egg"],"extra":["scallion"],"time":15,"level":1,"steps":["两个鸡蛋打散，加一小撮盐。","倒入 1.5 倍的温水搅匀，用筛子滤一遍。","盖上盘子或保鲜膜，水开上锅中火蒸十分钟。","出锅淋一勺生抽、几滴香油，撒葱花。"],"tip":"水和蛋的比例 1.5:1、一定要温水、一定要过筛，这三点做到就跟布丁一样。"},{"id":"pepper-chicken","name":"青椒鸡丁","emoji":"🍗","need":["chickenbreast","greenpepper"],"extra":["garlic","oyster","starch"],"time":18,"level":2,"steps":["鸡胸肉切丁，加生抽、淀粉抓匀腌十分钟。","青椒切丁，蒜切末。","热油下鸡丁滑炒至变白，盛出。","下蒜末和青椒炒香，倒回鸡丁，加蚝油翻匀。"],"tip":"鸡胸肉容易柴，腌的时候加淀粉、炒到刚变白就起锅，嫩得多。"}];

/* 速配一餐 · 交互逻辑 */
(function () {
  'use strict';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* 手绘图标：没装图标库或没配到图就回退 emoji */
  const icon = id => (typeof window.foodSVG === 'function' ? window.foodSVG(id) : '');
  const dishIcon = r => (r && r.need && r.need.length ? icon(r.need[0]) : '');

  const BLOB = ['#FBEBD8', '#F7E6DC', '#EDF2E2', '#FBF2D9', '#F1E9F5', '#E8F0F0', '#FDE9E4', '#F3EDDF'];
  const LEVEL_TXT = { 1: '新手友好', 2: '一般难度', 3: '要看着火' };
  const TIER_TXT = [
    { key: 0, title: '现在就能做', note: '材料齐了，起锅就行' },
    { key: 1, title: '差一样', note: '缺的那样可以省，也可以顺路买' },
    { key: 2, title: '差两样', note: '想换花样再看这些' }
  ];

  const state = {
    selected: new Set(),      // 食材 id
    customs: [],              // 自定义食材 {id,name}
    season: new Set(),        // 调料 id
    cat: 'veg',
    query: '',
    results: [],
    aiRecipes: [],
    aiOk: null,               // 云端模型是否可用，null = 还没探测出来
    expanded: {},             // 各档结果是否已全部展开
    pantryOpen: false,        // 「偶尔才有」调料是否全部展开
    view: 'picker'
  };

  const ingMap = new Map(INGREDIENTS.map(i => [i.id, i]));
  const seasonMap = new Map();
  PANTRY.forEach(g => g.items.forEach(i => seasonMap.set(i.id, i)));

  function blobColor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xffff;
    return BLOB[h % BLOB.length];
  }

  /* ─────────────── 初始化调料 ─────────────── */
  function initPantry() {
    PANTRY.forEach(g => {
      if (g.group === 'base') {
        g.items.forEach(i => state.season.add(i.id));
      } else if (g.defaultOn) {
        g.items.forEach(i => state.season.add(i.id));
      }
    });
  }

  function renderPantry() {
    const box = $('#pantryGroups');
    box.innerHTML = '';
    PANTRY.forEach(g => {
      const wrap = document.createElement('div');
      wrap.className = 'pgroup';
      const head = document.createElement('div');
      head.className = 'pgroup-title';
      head.innerHTML = '<b>' + g.label + '</b><i>' + g.note + '</i>';
      wrap.appendChild(head);

      const pills = document.createElement('div');
      pills.className = 'pills';

      // 调料太多，「偶尔才有」默认只露一小截，避免一屏几十个药丸
      const CAP = 12;
      const collapsed = g.group === 'more' && !state.pantryOpen && g.items.length > CAP;
      const list = collapsed ? g.items.slice(0, CAP) : g.items;

      list.forEach(it => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill' + (g.group === 'base' ? ' locked' : '');
        b.setAttribute('aria-pressed', state.season.has(it.id) ? 'true' : 'false');
        b.textContent = it.name;
        if (g.group === 'base') {
          b.disabled = true;
        } else {
          b.addEventListener('click', () => {
            if (state.season.has(it.id)) state.season.delete(it.id);
            else state.season.add(it.id);
            b.setAttribute('aria-pressed', state.season.has(it.id) ? 'true' : 'false');
          });
        }
        pills.appendChild(b);
      });

      if (collapsed) {
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'pill pill-more';
        more.textContent = '更多 ' + (g.items.length - CAP) + ' 种 ▾';
        more.addEventListener('click', () => {
          state.pantryOpen = true;
          renderPantry();
        });
        pills.appendChild(more);
      } else if (g.group === 'more' && state.pantryOpen && g.items.length > CAP) {
        const less = document.createElement('button');
        less.type = 'button';
        less.className = 'pill pill-more';
        less.textContent = '收起 ▴';
        less.addEventListener('click', () => {
          state.pantryOpen = false;
          renderPantry();
        });
        pills.appendChild(less);
      }

      wrap.appendChild(pills);
      box.appendChild(wrap);
    });
  }

  /* ─────────────── 食材网格 ─────────────── */
  function renderTabs() {
    const box = $('#catTabs');
    box.innerHTML = '';
    CATS.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.textContent = c.name;
      b.setAttribute('aria-selected', state.cat === c.id ? 'true' : 'false');
      b.addEventListener('click', () => {
        state.cat = c.id;
        state.query = '';
        $('#searchInput').value = '';
        renderTabs();
        renderGrid();
      });
      box.appendChild(b);
    });
  }

  function renderGrid() {
    const box = $('#ingGrid');
    const q = state.query.trim();
    const list = INGREDIENTS.filter(i => {
      if (!q) return i.cat === state.cat;
      return i.name.includes(q);
    });

    box.innerHTML = '';
    list.forEach(i => box.appendChild(ingButton(i)));

    const hits = renderDishHits(q);

    // 搜索无结果、也不是菜名 → 允许当作自定义食材添加
    if (q && list.length === 0 && hits === 0) {
      const already = state.customs.some(c => c.name === q);
      if (!already) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ing';
        b.innerHTML =
          '<span class="blob" style="--blob-bg:#EFF6E7">➕</span>' +
          '<span class="nm">添加「' + escapeHtml(q.slice(0, 6)) + '」</span>';
        b.addEventListener('click', () => {
          const name = q.slice(0, 8);
          state.customs.push({ id: 'c_' + name, name: name });
          state.selected.add('c_' + name);
          state.query = '';
          $('#searchInput').value = '';
          renderChips();
          renderGrid();
          updateDock();
        });
        box.appendChild(b);
      }
    }

    const cat = CATS.find(c => c.id === state.cat);
    $('#catHint').textContent = q
      ? (list.length ? '找到 ' + list.length + ' 样食材' : (hits ? '' : '没找到，可以直接添加'))
      : (cat ? cat.hint : '');

    renderDishHits(q);
  }

  /* 按菜名搜：直接跳到那道菜的做法，不用先凑食材 */
  function renderDishHits(q) {
    const box = $('#dishHits');
    if (!box) return 0;
    box.innerHTML = '';
    if (!q) return 0;

    const hits = RECIPES.filter(r => r.name.includes(q)).slice(0, 12);
    if (!hits.length) return 0;

    const title = document.createElement('p');
    title.className = 'dish-hits-title';
    title.textContent = '菜单里有这几道（点开直接看做法）';
    box.appendChild(title);

    const wrap = document.createElement('div');
    wrap.className = 'dish-hits-list';
    hits.forEach(r => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dish-hit';
      b.innerHTML =
        '<span class="dh-emoji">' + (dishIcon(r) || r.emoji) + '</span>' +
        '<span class="dh-name">' + escapeHtml(r.name) + '</span>' +
        '<span class="dh-meta">' + r.time + ' 分钟</span>';
      b.addEventListener('click', () => {
        const sel = state.selected;
        openRecipe({
          recipe: r,
          tier: 0,
          covered: r.need.filter(id => sel.has(id)),
          missing: r.need.filter(id => !sel.has(id)),
          missSeason: (r.extra || []).filter(id => !state.season.has(id))
        }, false);
      });
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
    return hits.length;
  }

  function ingButton(i) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ing';
    b.setAttribute('aria-pressed', state.selected.has(i.id) ? 'true' : 'false');
    b.innerHTML =
      '<span class="blob' + (icon(i.id) ? ' has-fi' : '') + '" style="--blob-bg:' + blobColor(i.id) + '">' +
        (icon(i.id) || i.emoji) + '</span>' +
      '<span class="nm">' + i.name + '</span>';
    b.addEventListener('click', () => {
      if (state.selected.has(i.id)) state.selected.delete(i.id);
      else state.selected.add(i.id);
      b.setAttribute('aria-pressed', state.selected.has(i.id) ? 'true' : 'false');
      renderChips();
      updateDock();
    });
    return b;
  }

  function renderChips() {
    const box = $('#selectedChips');
    box.innerHTML = '';
    state.selected.forEach(id => {
      const info = ingMap.get(id) || state.customs.find(c => c.id === id);
      if (!info) return;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      const ic = icon(info.id);
      chip.innerHTML = '<span class="chip-ico' + (ic ? ' has-fi' : '') + '">' + (ic || info.emoji || '🥄') + '</span>' +
        escapeHtml(info.name) + '<span class="x">✕</span>';
      chip.addEventListener('click', () => {
        state.selected.delete(id);
        renderChips();
        renderGrid();
        updateDock();
      });
      box.appendChild(chip);
    });
    $('#selCount').textContent = '已选 ' + state.selected.size + ' 样';
  }

  /* ─────────────── 匹配 ─────────────── */
  function selectedNames() {
    return Array.from(state.selected).map(id => {
      const info = ingMap.get(id) || state.customs.find(c => c.id === id);
      return info ? info.name : '';
    }).filter(Boolean);
  }

  function match() {
    const sel = state.selected;
    const out = [];
    if (sel.size === 0) return out;

    RECIPES.forEach(r => {
      const covered = r.need.filter(id => sel.has(id));
      if (covered.length === 0) return;
      const missing = r.need.filter(id => !sel.has(id));
      const missSeason = (r.extra || []).filter(id => !state.season.has(id));
      let tier;
      if (missing.length === 0) tier = 0;
      else if (missing.length === 1) tier = 1;
      else if (missing.length === 2 && covered.length >= 1) tier = 2;
      else return;

      const score =
        (tier === 0 ? 1000 : tier === 1 ? 600 : 300) +
        covered.length * 14 -
        missSeason.length * 26 -
        r.time * 0.15;

      out.push({ recipe: r, covered, missing, missSeason, tier, score });
    });

    out.sort((a, b) => (a.tier - b.tier) || (b.score - a.score));
    return out;
  }

  /* ─────────────── 结果页 ─────────────── */
  function showResults() {
    state.results = match();
    state.expanded = {};
    state.view = 'results';
    $('#picker').classList.add('hidden');
    $('#results').classList.remove('hidden');
    $('#goBtn').classList.add('hidden');
    $('#backBtn').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'auto' });
    renderResults();
  }

  function backToPicker() {
    state.view = 'picker';
    $('#picker').classList.remove('hidden');
    $('#results').classList.add('hidden');
    $('#goBtn').classList.remove('hidden');
    $('#backBtn').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  const TIER_CAP = { 0: 40, 1: 18, 2: 12 };

  function renderResults() {
    const res = state.results;
    const head = $('#resultHead');
    const body = $('#resultBody');

    const groups = TIER_TXT
      .map(t => {
        const all = res.filter(r => r.tier === t.key);
        const cap = state.expanded[t.key] ? all.length : TIER_CAP[t.key];
        return {
          key: t.key, title: t.title, note: t.note,
          items: all.slice(0, cap),
          hidden: Math.max(0, all.length - cap)
        };
      })
      .filter(g => g.items.length);

    const shown = groups.reduce((n, g) => n + g.items.length, 0);
    const zero = res.filter(r => r.tier === 0).length;
    const quick = res.filter(r => r.tier === 0 && r.recipe.time <= 20).length;

    if (!shown && state.aiRecipes.length === 0) {
      head.innerHTML =
        '<div class="empty">' +
        '<span class="e-emoji">🍳</span>' +
        '<p>手边这几样，暂时凑不出一顿像样的饭</p>' +
        '<p class="small">再加一样主料试试，比如鸡蛋、肉或者面</p>' +
        '</div>';
    } else {
      const total = res.length + state.aiRecipes.length;
      let words, sub;
      if (zero > 0) {
        words = '手边 ' + state.selected.size + ' 样东西<br>直接能做出 <em>' + zero + '</em> 道菜';
        sub = quick > 0 ? '其中 ' + quick + ' 道二十分钟内能上桌。' : '材料是齐的，就是得在灶台边多守一会儿。';
        const rest = total - zero;
        if (rest > 0) sub += '另有 ' + rest + ' 道差一两样。';
      } else {
        words = '手边 ' + state.selected.size + ' 样东西<br>凑出 <em>' + total + '</em> 道，得补点料';
        sub = '都不算齐，但差一两样的菜，味道也值得一试。';
      }
      head.innerHTML = '<div class="big">' + words + '</div><p class="sub">' + sub + '</p>';
    }

    body.innerHTML = '';

    // AI 现想的菜排最前
    state.aiRecipes.forEach(r => body.appendChild(recipeCard(r, true)));

    groups.forEach(g => {
      const label = document.createElement('div');
      label.className = 'tier-label';
      label.dataset.tier = g.key;
      label.innerHTML = '<b>' + g.title + '</b>' + g.note;
      body.appendChild(label);
      g.items.forEach(r => body.appendChild(recipeCard(r, false)));

      if (g.hidden > 0) {
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'expand-btn';
        more.textContent = '还有 ' + g.hidden + ' 道' + g.title + '的，全部展开';
        more.addEventListener('click', () => {
          state.expanded[g.key] = true;
          renderResults();
          const lb = body.querySelector('.tier-label[data-tier="' + g.key + '"]');
          if (lb) {
            window.scrollTo({ top: Math.max(0, lb.getBoundingClientRect().top + window.scrollY - 70), behavior: 'auto' });
          }
        });
        body.appendChild(more);
      }
    });

    const aiBlock = null;
    if (aiBlock) body.appendChild(aiBlock);

    const lazyLink = document.createElement('button');
    lazyLink.type = 'button';
    lazyLink.className = 'result-lazy';
    lazyLink.textContent = '还是不想动手？摇一个外卖 ›';
    lazyLink.addEventListener('click', openTakeout);
    body.appendChild(lazyLink);
  }

  function recipeCard(item, isAi) {
    const r = item.recipe;
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'rcard' + (isAi ? ' aicard' : '');

    const badges = [];
    if (isAi) badges.push('<span class="badge ai">AI 现想</span>');
    else if (item.tier === 0) badges.push('<span class="badge ok">材料齐</span>');
    else if (item.missing.length === 1)
      badges.push('<span class="badge miss">差 ' + ingMap.get(item.missing[0]).name + '</span>');
    else badges.push('<span class="badge miss">差 2 样</span>');

    const meta = [];
    meta.push('约 ' + r.time + ' 分钟');
    meta.push(LEVEL_TXT[r.level] || '家常');
    if (!isAi && item.missSeason.length)
      meta.push('少 ' + item.missSeason.map(id => seasonMap.get(id).name).join('/'));
    if (isAi) meta.push('按你现有调料设计');

    card.innerHTML =
      '<span class="rblob" style="--blob-bg:' + blobColor(r.id) + '">' + (dishIcon(r) || r.emoji) + '</span>' +
      '<span class="rmain">' +
        '<span class="rname">' + escapeHtml(r.name) + badges.join('') + '</span>' +
        '<span class="rmeta">' + meta.map(m => escapeHtml(m)).join('<i class="dot"></i>') + '</span>' +
      '</span>' +
      '<span class="arrow">›</span>';

    card.addEventListener('click', () => openRecipe(item, isAi));
    return card;
  }

  function buildAiBlock() {
    if (state.aiOk === false) return null;
    const wrap = document.createElement('div');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ai-btn';
    btn.id = 'aiBtn';
    btn.innerHTML = '<span>✨</span>都不想吃？让 AI 按现有材料现想一道';
    btn.addEventListener('click', () => askAI(btn));

    const note = document.createElement('p');
    note.className = 'ai-note';
    note.textContent = '菜谱库是精选过的家常做法；AI 会按你手上的食材重新组合，步骤同样能直接照着做。';

    wrap.appendChild(btn);
    wrap.appendChild(note);
    return wrap;
  }

  /* ─────────────── 随机外卖 ─────────────── */
  const tk = { budget: 'all', taste: 'all', cur: null, rolls: 0, rolling: false };
  const BUDGETS = [
    { id: 'all', label: '都行' },
    { id: 'low', label: '20 内' },
    { id: 'mid', label: '20–35' },
    { id: 'high', label: '35 以上' }
  ];
  const TASTES = [
    { id: 'all', label: '都行' },
    { id: 'spicy', label: '想吃辣' },
    { id: 'light', label: '清淡点' },
    { id: 'soup', label: '要带汤' },
    { id: 'staple', label: '饭或面' },
    { id: 'slim', label: '轻食' }
  ];

  function tkPool() {
    return TAKEOUT.filter(x => {
      if (tk.budget === 'low' && x.p[0] > 20) return false;
      if (tk.budget === 'mid' && (x.p[0] <= 20 || x.p[0] > 32)) return false;
      if (tk.budget === 'high' && x.p[0] <= 32) return false;
      if (tk.taste === 'spicy' && x.t.indexOf('辣') < 0) return false;
      if (tk.taste === 'light' && x.t.indexOf('清淡') < 0) return false;
      if (tk.taste === 'soup' && x.t.indexOf('带汤') < 0) return false;
      if (tk.taste === 'slim' && x.t.indexOf('轻食') < 0) return false;
      if (tk.taste === 'staple' && x.t.indexOf('饭') < 0 && x.t.indexOf('面') < 0 && x.t.indexOf('粉') < 0) return false;
      return true;
    });
  }

  function tkCard(item, rolling) {
    if (rolling) {
      return '<div class="tk-card tk-rolling">' +
        '<p class="tk-kicker">正在摇…</p>' +
        '<h3 class="tk-name">' + escapeHtml(item.n) + '</h3>' +
        '<p class="tk-price">人均 ¥' + item.p[0] + '–' + item.p[1] + '</p>' +
        '</div>';
    }
    return '<div class="tk-card">' +
      '<p class="tk-kicker">今天就吃</p>' +
      '<h3 class="tk-name">' + escapeHtml(item.n) + '</h3>' +
      '<p class="tk-price">人均 ¥' + item.p[0] + '–' + item.p[1] + '</p>' +
      '<div class="tk-tags">' + item.t.map(t => '<span>' + escapeHtml(t) + '</span>').join('') + '</div>' +
      '<p class="tk-note">' + escapeHtml(item.note) + '</p>' +
      '<button type="button" class="tk-copy" id="tkCopy">复制名字，去外卖 App 搜</button>' +
      '</div>';
  }

  function renderTakeout() {
    const body = $('#tkBody');
    if (!body) return;
    const pool = tkPool();

    const row = (list, key, active) => list.map(o =>
      '<button type="button" class="tk-pill' + (active === o.id ? ' on' : '') + '" data-k="' + key +
      '" data-v="' + o.id + '" aria-pressed="' + (active === o.id) + '">' + o.label + '</button>'
    ).join('');

    body.innerHTML =
      '<div class="tk-head">' +
        '<h2>摇一个外卖</h2>' +
        '<p>替你决定吃什么。下单还是在外卖 App 里，这里不替你掏钱。</p>' +
      '</div>' +
      '<div class="tk-filter"><span class="tk-fl">预算</span><div class="tk-pills">' + row(BUDGETS, 'budget', tk.budget) + '</div></div>' +
      '<div class="tk-filter"><span class="tk-fl">想吃</span><div class="tk-pills">' + row(TASTES, 'taste', tk.taste) + '</div></div>' +
      '<div class="tk-stage" id="tkStage">' +
        (tk.cur ? tkCard(tk.cur) : '<div class="tk-empty">' +
          '<span class="tk-emoji">🥡</span>' +
          '<p>' + (pool.length ? '点下面那颗按钮，摇一个出来' : '这个条件太窄了，放宽一点') + '</p>' +
          '</div>') +
      '</div>' +
      '<button type="button" class="tk-roll" id="tkRoll"' + (pool.length ? '' : ' disabled') + '>' +
        (tk.rolls >= 3 ? '别挑了，就这个' : '摇一个') + '</button>' +
      '<p class="tk-foot">' +
        (pool.length ? '这个条件里有 ' + pool.length + ' 种' : '没有符合条件的，试试「都行」') +
      '</p>';

    $$('.tk-pill', body).forEach(b => {
      b.addEventListener('click', () => {
        tk[b.dataset.k] = b.dataset.v;
        if (tk.cur && tkPool().indexOf(tk.cur) < 0) tk.cur = null;
        tk.rolls = 0;
        renderTakeout();
      });
    });

    const rollBtn = $('#tkRoll', body);
    if (rollBtn) rollBtn.addEventListener('click', doRoll);
    const copyBtn = $('#tkCopy', body);
    if (copyBtn) copyBtn.addEventListener('click', copyTakeout);
  }

  function doRoll() {
    if (tk.rolling) return;
    const pool = tkPool();
    if (!pool.length) return;
    const stage = $('#tkStage');
    const btn = $('#tkRoll');

    tk.rolling = true;
    if (btn) { btn.disabled = true; btn.textContent = '正在掂量…'; }

    let i = 0;
    const timer = setInterval(() => {
      const r = pool[Math.floor(Math.random() * pool.length)];
      stage.innerHTML = tkCard(r, true);
      i++;
      if (i > 8) {
        clearInterval(timer);
        let pick = pool[Math.floor(Math.random() * pool.length)];
        if (pool.length > 1 && pick === tk.cur) pick = pool[(pool.indexOf(pick) + 1) % pool.length];
        tk.cur = pick;
        tk.rolls++;
        tk.rolling = false;
        renderTakeout();
      }
    }, 62);
  }

  function copyTakeout() {
    if (!tk.cur) return;
    const btn = $('#tkCopy');
    const done = ok => {
      if (!btn) return;
      btn.textContent = ok ? '已复制，去外卖 App 粘贴搜索' : '长按上面菜名手动复制';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tk.cur.n).then(() => done(true)).catch(() => done(false));
    } else {
      done(false);
    }
  }

  function openTakeout() {
    renderTakeout();
    $('#tkMask').classList.add('open');
    $('#tkSheet').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeTakeout() {
    $('#tkMask').classList.remove('open');
    $('#tkSheet').classList.remove('open');
    document.body.style.overflow = '';
  }

  /* ─────────────── 详情抽屉 ─────────────── */
  function openRecipe(item, isAi) {
    const r = item.recipe;
    const body = $('#sheetBody');

    let mats = '';
    if (isAi) {
      mats = r.needNames.map(n => '<span class="mat">' + escapeHtml(n) + '</span>').join('');
    } else {
      mats = r.need.map(id => {
        const i = ingMap.get(id);
        const lack = !state.selected.has(id);
        return '<span class="mat' + (lack ? ' lack' : '') + '">' +
          (icon(id) || i.emoji) + escapeHtml(i.name) +
          (lack ? ' <b style="font-size:11px">缺</b>' : '') + '</span>';
      }).join('');
    }

    const baseSeasons = PANTRY[0].items.map(i => '<span class="mat season">' + i.name + '</span>').join('');
    let extraSeasons = '';
    if (isAi) {
      extraSeasons = (r.extraNames || []).map(n => '<span class="mat season">' + escapeHtml(n) + '</span>').join('');
    } else {
      extraSeasons = (r.extra || []).map(id => {
        const s = seasonMap.get(id);
        const lack = !state.season.has(id);
        return '<span class="mat season' + (lack ? ' miss' : '') + '">' + escapeHtml(s.name) +
          (lack ? ' 缺' : '') + '</span>';
      }).join('');
    }

    const steps = (r.steps || []).map(s => '<li>' + escapeHtml(s) + '</li>').join('');

    body.innerHTML =
      '<div class="recipe-hero">' +
        '<span class="rblob" style="--blob-bg:' + blobColor(r.id) + '">' + (dishIcon(r) || r.emoji) + '</span>' +
        '<div>' +
          '<h2>' + escapeHtml(r.name) + '</h2>' +
          '<div class="tags">' +
            '<span>约 ' + r.time + ' 分钟</span>' +
            '<span>' + (LEVEL_TXT[r.level] || '家常') + '</span>' +
            (isAi ? '<span>AI 现想</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sect">' +
        '<h3 class="sect-title">要准备</h3>' +
        '<div class="mats">' + mats + '</div>' +
        '<h3 class="sect-title" style="margin-top:16px">调料</h3>' +
        '<div class="mats">' + baseSeasons + extraSeasons + '</div>' +
      '</div>' +
      '<div class="sect">' +
        '<h3 class="sect-title">怎么做</h3>' +
        '<ol class="steps">' + steps + '</ol>' +
      '</div>' +
      (r.tip ? '<div class="tipbox"><span class="t-ico">💡</span><span>' + escapeHtml(r.tip) + '</span></div>' : '') +
      (r.src ? '<p class="src-line">菜式参考：' + escapeHtml(r.src) + ' 热门菜谱，步骤由本站按家用灶具整理。</p>' : '') +
      (isAi ? '<p class="warn">这道菜由 AI 临时设计，第一次做建议边做边尝咸淡。</p>' : '');

    $('#sheetMask').classList.add('open');
    $('#sheet').classList.add('open');
    document.body.style.overflow = 'hidden';
    $('#sheet').scrollTop = 0;
  }

  function closeSheet() {
    $('#sheetMask').classList.remove('open');
    $('#sheet').classList.remove('open');
    document.body.style.overflow = '';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ─────────────── 底部条 ─────────────── */
  function updateDock() {
    const btn = $('#goBtn');
    const n = state.selected.size;
    btn.disabled = n === 0;
    btn.innerHTML = n === 0
      ? '先选几样手边有的东西'
      : '看看能做什么 · 已选 ' + n + ' 样';
  }

  /* ─────────────── 事件 ─────────────── */
  function bind() {
    $('#searchInput').addEventListener('input', e => {
      state.query = e.target.value;
      renderGrid();
    });

    $('#goBtn').addEventListener('click', () => {
      if (state.selected.size === 0) return;
      state.aiRecipes = [];
      showResults();
    });

    $('#backBtn').addEventListener('click', backToPicker);
    $('#sheetMask').addEventListener('click', closeSheet);
    $('#sheetClose').addEventListener('click', closeSheet);
    $('#lazyEntry').addEventListener('click', openTakeout);
    $('#tkMask').addEventListener('click', closeTakeout);
    $('#tkClose').addEventListener('click', closeTakeout);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeSheet(); closeTakeout(); }
    });
  }

  /* ─────────────── 启动 ─────────────── */
  initPantry();
  renderPantry();
  renderTabs();
  renderGrid();
  renderChips();
  updateDock();
  bind();

  const statsEl = $('#appStats');
  if (statsEl) {
    const seasonCount = PANTRY.reduce((n, g) => n + g.items.length, 0);
    statsEl.textContent = INGREDIENTS.length + ' 种食材 · ' + RECIPES.length + ' 道家常菜 · ' + seasonCount + ' 味调料';
  }


  // 预览用：?demo=1 直接看结果页，?demo=2 顺带打开做法
  const demo = (location.search.match(/[?&]demo=(\d)/) || [])[1];
  const qParam = (location.search.match(/[?&]q=([^&]+)/) || [])[1];
  if (qParam) {
    state.query = decodeURIComponent(qParam).slice(0, 8);
    $('#searchInput').value = state.query;
    renderGrid();
  }
  const dishParam = (location.search.match(/[?&]dish=([\w-]+)/) || [])[1];
  if (dishParam) {
    const r = RECIPES.find(x => x.id === dishParam);
    if (r) {
      openRecipe({
        recipe: r, tier: 0, covered: [],
        missing: r.need.filter(id => !state.selected.has(id)),
        missSeason: (r.extra || []).filter(id => !state.season.has(id))
      }, false);
    }
  }
  if (demo === '6') {
    openTakeout();
  }
  if (demo === '4') {
    state.cat = 'staple';
    renderTabs();
    renderGrid();
  }
  if (demo === '1' || demo === '2') {
    ['potato', 'tomato', 'egg', 'porkbelly', 'greenpepper'].forEach(id => state.selected.add(id));
    renderChips();
    renderGrid();
    updateDock();
    showResults();
    if (demo === '2') {
      const first = state.results.find(r => r.tier === 0) || state.results[0];
      if (first) openRecipe(first, false);
    }
  }
})();
</script></body></html>
