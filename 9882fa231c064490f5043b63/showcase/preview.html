  font-family:
    Inter, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui,
    sans-serif;
  color: #2f382a;
  background: #f7f8f4;
  font-synthesis: none;
  line-height: 1.55;
  --green: #637a4d;
  --muted: #75816b;
  --border: #e0e5d9;
  --paper: #fff;
  --wash: #edf1e8;
  --shadow: 0 5px 24px #36432b0a;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  outline-offset: 4px;
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: wait;
  opacity: 0.5;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 30px;
  letter-spacing: -1px;
  line-height: 1.4;
  font-weight: 650;
}
h2 {
  font-size: 18px;
  font-weight: 620;
}
h3 {
  font-size: 15px;
  font-weight: 620;
}
a {
  color: inherit;
  text-decoration: none;
}
small {
  font-size: 12px;
}
input,
select,
textarea {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
  background: #fff;
  min-width: 0;
  color: #35412d;
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--green);
}
textarea {
  resize: vertical;
}
input[type="checkbox"] {
  accent-color: var(--green);
  width: 17px;
  height: 17px;
  margin: 0;
}
hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}
.muted {
  color: var(--muted);
  font-size: 13px;
}
.small {
  font-size: 11px;
}
.eyebrow {
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 2.3px;
  color: #8a967d;
  margin-bottom: 9px;
}
.btn {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  justify-content: center;
  padding: 9px 14px;
  min-height: 40px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  font-size: 13px;
  font-weight: 540;
  white-space: nowrap;
  transition: background 0.15s;
}
.btn:hover:not(:disabled) {
  background: #f1f4ec;
}
.btn.primary {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.btn.primary:hover:not(:disabled) {
  background: #526740;
}
.btn.icon {
  width: 36px;
  min-height: 36px;
  padding: 6px;
  border: 0;
  background: transparent;
}
.btn.icon:hover {
  background: var(--wash);
}
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: none;
  background: var(--shift, #b7c0ac);
}
.rest-dot {
  background: #dce2d4 !important;
}
.badge {
  background: #edf1e7;
  color: #5f7451;
  border: 1px solid #dfe7d6;
  border-radius: 5px;
  font-size: 11px;
  padding: 2px 7px;
  white-space: nowrap;
}
.app-shell {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 225px;
  border-right: 1px solid var(--border);
  background: #f0f3eb;
  display: flex;
  flex-direction: column;
  padding: 30px 20px 20px;
  z-index: 20;
}
.brand {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 3px 0 33px;
}
.brand-mark {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  background: #637a4d;
  color: white;
  border-radius: 13px;
}
.brand b {
  font-size: 21px;
  letter-spacing: 1px;
  display: block;
}
.brand small {
  font-size: 8px;
  color: #7c896f;
  letter-spacing: 1px;
}
.brand em {
  display: block;
  font-style: normal;
  font-size: 10px;
  color: #8a957e;
  letter-spacing: 1px;
  margin-top: 1px;
}
.new-roster {
  width: 100%;
  margin-bottom: 30px;
  min-height: 43px;
}
.sidebar nav {
  display: grid;
  gap: 7px;
}
.sidebar nav button,
.roster-list button {
  background: none;
  border: 0;
  text-align: left;
  padding: 11px 13px;
  border-radius: 10px;
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 13px;
  min-height: 43px;
}
.sidebar nav button {
  color: #6f7b64;
}
.sidebar nav button.active {
  background: #dfe7d6;
  color: #4d653b;
  font-weight: 650;
}
.sidebar nav button:hover,
.roster-list button:hover {
  background: #e5ebdd;
}
.rosters-heading {
  font-size: 10px;
  letter-spacing: 1px;
  color: #8e9983;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 35px 12px 9px;
}
.rosters-heading button {
  border: 0;
  background: none;
  display: grid;
  place-items: center;
  padding: 3px;
}
.roster-list {
  display: grid;
  gap: 2px;
  overflow: auto;
  max-height: 28vh;
}
.roster-list button {
  padding: 8px 12px;
  min-height: 34px;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.roster-list button.active {
  color: #536c40;
  font-weight: 650;
}
.roster-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #a6b394;
  flex: none;
}
.sidebar-bottom {
  margin-top: auto;
  padding: 35px 12px 0;
  color: #99a38e;
}
.sidebar-bottom > svg {
  color: #a2af95;
  margin-bottom: 7px;
}
.sidebar-bottom p {
  font-size: 11px;
  line-height: 1.9;
  margin-bottom: 30px;
}
.sidebar-bottom .btn {
  font-size: 10px;
  min-height: 26px;
  padding: 3px 8px;
  background: transparent;
  margin-top: 9px;
}
.save-state {
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #7c8870;
}
.save-state i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #7d9667;
}
.save-state i.working {
  animation: pulse 1s infinite;
}
@keyframes pulse {
  50% {
    opacity: 0.2;
  }
}
.workspace {
  margin-left: 225px;
  flex: 1;
  min-width: 0;
}
.topbar {
  height: 74px;
  padding: 0 35px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fafbf8;
}
.breadcrumb {
  color: #7e8974;
  font-size: 11px;
  max-width: 50%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.breadcrumb span {
  margin: 0 12px;
  color: #b0b9a7;
}
.topbar-right {
  display: flex;
  gap: 17px;
  align-items: center;
}
.topbar-right select {
  max-width: 210px;
  background: transparent;
  font-size: 11px;
  padding: 6px 10px;
  min-height: 31px;
}
.personal-badge {
  font-size: 10px;
  color: #7f9071;
  display: flex;
  gap: 5px;
  align-items: center;
}
.mobile-brand {
  display: none;
}
.app-content {
  border: 0;
  padding: 0 35px 40px;
  margin: 0;
  min-width: 0;
}
.calendar-heading,
.page-heading {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  margin: 32px 0 27px;
}
.calendar-heading .muted {
  margin-top: 6px;
  font-size: 11px;
}
.heading-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.heading-actions .btn {
  min-height: 32px;
  padding: 5px 8px;
  font-size: 11px;
  background: transparent;
}
.heading-actions input {
  max-width: 150px;
  font-size: 11px;
  padding: 7px 8px;
  background: transparent;
  min-height: 32px;
}
.calendar-toolbar {
  display: flex;
  align-items: center;
  gap: 17px;
  margin-bottom: 20px;
}
.tabs {
  display: inline-flex;
  align-items: center;
  background: #eaf0e3;
  border-radius: 9px;
  padding: 4px;
  gap: 3px;
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 6px 18px;
  border-radius: 6px;
  font-size: 11px;
  color: #859276;
  white-space: nowrap;
}
.tabs button.active {
  background: #fff;
  color: #4d653b;
  box-shadow: 0 1px 5px #334b2112;
  font-weight: 650;
}
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 1;
  max-width: 310px;
  color: #9aa68e;
}
.search input {
  border: 0;
  padding: 5px 0;
  background: transparent;
  width: 100%;
  font-size: 11px;
  outline-offset: 5px;
}
.search input::placeholder {
  color: #9ca690;
}
.toolbar-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.toolbar-tools .btn {
  font-size: 11px;
  min-height: 32px;
  padding: 5px 10px;
}
.roster-menu {
  position: relative;
}
.roster-menu summary {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  list-style: none;
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.roster-menu summary::-webkit-details-marker {
  display: none;
}
.roster-menu > div {
  display: grid;
  position: absolute;
  right: 0;
  top: 40px;
  z-index: 25;
  width: 150px;
  border: 1px solid var(--border);
  padding: 6px;
  background: white;
  box-shadow: var(--shadow);
  border-radius: 12px;
}
.roster-menu button {
  border: 0;
  background: transparent;
  font-size: 12px;
  text-align: left;
  padding: 9px;
  border-radius: 6px;
}
.roster-menu button:hover {
  background: var(--wash);
}
.danger {
  color: #a06455;
}
.calendar-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
  gap: 25px;
  align-items: start;
}
.calendar-panel {
  min-width: 0;
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 14px 14px 0;
  box-shadow: var(--shadow);
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.week-label {
  text-align: center;
  color: #8d9981;
  font-size: 11px;
  padding: 10px 0 17px;
}
.week-label.weekend {
  color: #647d4c;
}
.day-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: none;
  border: 0;
  border-top: 1px solid #eff2ea;
  padding: 10px 4px 8px;
  min-height: 105px;
  gap: 6px;
  font-size: 12px;
  position: relative;
}
.day-cell:hover {
  background: #f4f7ef;
}
.day-number {
  min-width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: 11px;
  color: #7d896f;
  border-radius: 50%;
  margin-bottom: 3px;
}
.day-number i {
  width: 4px;
  height: 4px;
  position: absolute;
  right: -6px;
  top: 9px;
  background: #b09d7d;
  border-radius: 50%;
}
.today .day-number {
  background: #6f8555;
  color: white;
  font-weight: 600;
}
.selected-day {
  background: #f3f6ed;
  border-radius: 10px;
}
.calendar-shift {
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--shift) 18%, white);
  color: color-mix(in srgb, var(--shift) 80%, #233118);
  font-size: 11px;
  font-weight: 600;
  border-left: 2px solid var(--shift);
  border-radius: 6px;
  padding: 7px 5px;
  max-width: 100%;
  min-width: 38px;
  overflow-wrap: anywhere;
  line-height: 1.35;
}
.calendar-shift.rest {
  border: 0;
  background: #f8f9f6;
  color: #b4bda9;
  font-weight: 400;
  min-width: 31px;
  padding: 7px;
}
.day-cell small {
  font-size: 9px;
  color: #9aa38f;
}
.day-cell.other-month {
  opacity: 0.35;
}
.calendar-legend {
  display: flex;
  gap: 13px;
  flex-wrap: wrap;
  justify-content: center;
  border-top: 1px solid #eef1e9;
  margin-top: 7px;
  padding: 17px 7px;
  color: #7e8972;
  font-size: 10px;
}
.calendar-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.calendar-legend i {
  width: 6px;
  height: 6px;
  border-radius: 2px;
}
.day-summary {
  display: grid;
  gap: 17px;
}
.focus-card {
  background: #edf2e7;
  border: 1px solid #dde5d4;
  border-radius: 15px;
  padding: 20px;
}
.focus-card .eyebrow {
  font-size: 8px;
  letter-spacing: 1.8px;
}
.focus-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.focus-heading h2 {
  font-size: 13px;
  font-weight: 540;
}
.focus-heading svg {
  color: #94a27e;
}
.focus-shift {
  display: flex;
  gap: 9px;
  align-items: center;
  margin-top: 25px;
}
.focus-shift strong {
  font-size: 23px;
  font-weight: 620;
}
.focus-card > p:not(.eyebrow) {
  font-size: 11px;
  color: #7f8f70;
  margin: 9px 0 3px;
}
.focus-card .btn {
  width: 100%;
  margin-top: 21px;
  background: #f8faf5;
  font-size: 11px;
  border-color: #d8e1cd;
  min-height: 32px;
  padding: 6px;
}
.focus-card .focus-note {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding-top: 8px;
  border-top: 1px solid #d8e1cd;
  margin-top: 12px !important;
}
.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 23px;
  box-shadow: var(--shadow);
}
.panel.compact {
  padding: 18px;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 24px 0 12px;
}
.panel .section-heading {
  margin: 0 0 15px;
}
.panel .section-heading h3 {
  font-size: 12px;
}
.panel .section-heading svg {
  color: #93a080;
}
.summary-numbers {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  margin-bottom: 16px;
}
.summary-numbers div {
  display: flex;
  flex-direction: column;
}
.summary-numbers b {
  font-size: 21px;
  font-weight: 550;
}
.summary-numbers span {
  font-size: 9px;
  color: #8c987f;
  margin-top: 1px;
}
.composition {
  height: 6px;
  overflow: hidden;
  display: flex;
  border-radius: 8px;
  margin: 7px 0 10px;
  gap: 2px;
}
.tool-card > svg {
  color: #8d9e7a;
}
.tool-card h3 {
  font-size: 13px;
  margin: 10px 0 8px;
}
.tool-card .muted {
  font-size: 10px;
  line-height: 1.9;
}
.tool-card .btn {
  margin-top: 11px;
  width: 100%;
  font-size: 11px;
  min-height: 31px;
}
.tool-card .btn + .btn {
  margin-top: 6px;
  background: #fafbf8;
}
.week-list {
  padding: 0 5px;
}
.week-day {
  display: flex;
  gap: 12px;
  padding: 15px 0;
  border-top: 1px solid #edf1e7;
  min-height: 95px;
}
.week-day:first-child {
  border-top: 0;
}
.week-day-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 2px;
  background: transparent;
  border: 0;
  width: 49px;
  padding: 0;
  flex: none;
}
.week-day-title span {
  font-size: 9px;
  color: #8c9a7e;
}
.week-day-title b {
  font-size: 23px;
  font-weight: 550;
}
.week-day-title small {
  font-size: 9px;
  color: #929d85;
}
.week-day.current .week-day-title b {
  color: var(--green);
}
.week-day-content {
  flex: 1;
  min-width: 0;
}
.time-scale {
  display: flex;
  justify-content: space-between;
  color: #a4ad9b;
  font-size: 8px;
}
.timeline-row {
  margin-top: 8px;
}
.timeline-track {
  height: 9px;
  border-radius: 5px;
  background: repeating-linear-gradient(
    to right,
    #eef1e9 0,
    #eef1e9 calc(25% - 1px),
    white calc(25% - 1px),
    white 25%
  );
  position: relative;
  overflow: hidden;
}
.timeline-bar {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 5px;
  opacity: 0.7;
}
.timeline-row button {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  text-align: left;
  background: none;
  border: 0;
  padding: 6px 0;
  font-size: 10px;
}
.timeline-row button > span:last-child {
  font-size: 9px;
  color: #8c9980;
}
.timeline-row .dot {
  width: 6px;
  height: 6px;
}
.rest-text,
.day-note {
  font-size: 11px;
  color: #a5af9a;
  margin-top: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.day-note {
  color: #8a7961;
  margin-top: 6px;
}
.stats-body > .muted {
  margin: 0 0 16px;
}
.metric-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}
.metric-cards .panel {
  padding: 22px;
}
.metric-cards span {
  font-size: 11px;
}
.metric-cards strong {
  display: block;
  font-size: 31px;
  font-weight: 550;
  margin-top: 10px;
  color: #586f44;
}
.metric-cards strong small {
  font-size: 11px;
  font-weight: 400;
  color: #8a967d;
  margin-left: 6px;
}
.stats-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 22px;
}
.stats-columns h2 {
  margin-bottom: 22px;
}
.stat-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 16px;
  font-size: 12px;
}
.stat-row > span:nth-child(2) {
  flex: 1;
}
.stat-row b {
  font-weight: 550;
  min-width: 45px;
}
.stat-row > span:nth-child(4) {
  min-width: 45px;
  color: #7d8c70;
}
.stat-row small {
  font-size: 10px;
  width: 32px;
  text-align: right;
  color: #9aa38e;
}
.bar-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  gap: 14px;
  min-height: 220px;
  border-bottom: 1px solid var(--border);
  padding: 0 0 12px;
}
.bar-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: #7f8e71;
}
.bar-column i {
  display: block;
  width: 32px;
  background: #9baa88;
  border-radius: 5px 5px 0 0;
}
.bar-column small {
  font-size: 9px;
}
.stats-columns .small {
  margin-top: 13px;
}
.page {
  padding-top: 0;
}
.page .page-heading {
  margin-bottom: 30px;
}
.page .page-heading .muted {
  margin-top: 8px;
}
.page > .tabs {
  margin: 0 0 13px;
}
.page > .muted {
  margin-bottom: 20px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 17px;
}
.shift-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 23px;
  position: relative;
}
.shift-card:before {
  position: absolute;
  content: "";
  left: 0;
  top: 25px;
  bottom: 25px;
  width: 3px;
  background: var(--shift);
  border-radius: 4px;
}
.shift-card.archived {
  opacity: 0.58;
}
.shift-card-title {
  display: flex;
  gap: 9px;
  align-items: center;
  margin-bottom: 10px;
}
.shift-card-title h3 {
  flex: 1;
  font-size: 17px;
}
.shift-card > p {
  font-size: 13px;
  margin-bottom: 4px;
  color: #6e7e60;
}
.card-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 20px;
}
.card-actions .btn {
  font-size: 11px;
  padding: 7px 10px;
  min-height: 34px;
}
.toggle {
  display: flex;
  gap: 7px;
  align-items: center;
  font-size: 12px;
  cursor: pointer;
}
.file-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.file-columns h2 {
  margin-bottom: 7px;
}
.file-columns h3 {
  margin-bottom: 8px;
}
.file-columns .field {
  margin-top: 20px;
}
.file-columns .card-actions {
  margin-bottom: 16px;
}
.file-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px dashed #b7c6a8;
  border-radius: 10px;
  background: #f6f8f2;
  padding: 35px 10px;
  font-size: 13px;
  color: #6b8255;
  margin: 27px 0;
  gap: 15px;
}
.file-drop input {
  font-size: 10px;
  max-width: 100%;
  padding: 6px;
}
.file-columns details {
  font-size: 11px;
  color: #839373;
  margin-top: 10px;
}
.file-columns details p {
  margin-top: 10px;
  line-height: 1.8;
}
.file-columns pre {
  font-size: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 12px;
  background: #f3f6ed;
  border-radius: 7px;
  margin-top: 12px;
}
.import-preview {
  padding-top: 20px;
  border-top: 1px solid var(--border);
  margin-top: 25px;
}
.import-preview > p {
  font-size: 12px;
  margin: 10px 0 15px;
}
.loading,
.empty {
  display: flex;
  align-items: center;
  text-align: center;
  flex-direction: column;
  padding: 85px 20px;
  color: #78886b;
  min-height: 70vh;
  justify-content: center;
}
.empty h1 {
  font-size: 27px;
  color: #3c4c30;
  margin: 10px 0 13px;
}
.empty > p:not(.eyebrow) {
  font-size: 13px;
  line-height: 1.9;
  margin-bottom: 27px;
  color: #8a967f;
}
.empty .eyebrow {
  margin-top: 23px;
}
.empty-art {
  position: relative;
  color: #91a67c;
  background: #ebf0e4;
  width: 140px;
  height: 140px;
  border-radius: 40px;
  display: grid;
  place-items: center;
  transform: rotate(-5deg);
}
.empty-art i {
  position: absolute;
  inset: 83px auto auto 58px;
  width: 10px;
  height: 10px;
  background: #9caf86;
  border-radius: 3px;
}
.empty-art i:nth-last-child(2) {
  left: 78px;
  background: #b2be9f;
}
.empty-art i:last-child {
  left: 98px;
  background: #cbd4bd;
}
.loading h2 {
  margin: 16px;
}
.loading p {
  font-size: 12px;
}
.search-results h2 {
  margin-bottom: 20px;
}
.search-results h2 small {
  font-weight: 400;
  color: #8d9982;
  font-size: 11px;
  margin-left: 8px;
}
.search-results > button {
  display: flex;
  gap: 14px;
  text-align: left;
  align-items: center;
  width: 100%;
  background: none;
  border: 0;
  border-top: 1px solid var(--border);
  padding: 15px 0;
}
.search-results small {
  color: #929c87;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.search-results strong {
  font-size: 13px;
  white-space: nowrap;
}
.search-results span {
  font-size: 12px;
  white-space: nowrap;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #25351c66;
  backdrop-filter: blur(3px);
  padding: 25px;
}
.modal {
  width: 540px;
  max-width: 100%;
  max-height: 90dvh;
  overflow: auto;
  background: #fcfdf9;
  border: 1px solid #e2e8da;
  box-shadow: 0 30px 90px #24301840;
  border-radius: 22px;
  padding: 26px;
}
.modal.wide {
  width: 790px;
}
.modal > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.modal h2 {
  font-size: 20px;
}
.modal > p.muted {
  margin-bottom: 20px;
}
.modal h3 {
  margin: 22px 0 12px;
}
.modal footer {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 25px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 18px 0;
  min-width: 0;
}
.field > span {
  font-size: 12px;
  color: #7f8b72;
}
.form-row {
  display: flex;
  gap: 12px;
}
.form-row > * {
  flex: 1;
  min-width: 0;
}
.form-row .field {
  margin-top: 12px;
  margin-bottom: 12px;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  font-size: 13px;
}
.shift-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
  margin-top: 22px;
}
.shift-option {
  display: grid;
  grid-template-columns: 15px 1fr;
  text-align: left;
  gap: 4px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 17px;
}
.shift-option strong {
  font-weight: 550;
  font-size: 15px;
}
.shift-option .dot {
  align-self: center;
}
.shift-option small {
  grid-column: 2;
  color: #8c9a7f;
  font-size: 10px;
}
.shift-option.selected {
  border-color: var(--green);
  background: #f0f5e9;
  box-shadow: 0 0 0 1px var(--green);
}
.swatches {
  display: flex;
  gap: 11px;
  margin: 19px 0;
  flex-wrap: wrap;
}
.swatches button {
  width: 27px;
  height: 27px;
  border: 3px solid #fcfdf9;
  border-radius: 50%;
  outline: 1px solid transparent;
}
.swatches button[aria-pressed="true"] {
  outline-color: #677c54;
}
.subform > h3 {
  color: #89977c;
  font-size: 12px;
  font-weight: 400;
}
.rule-card {
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 15px;
  background: white;
  margin-top: 15px;
}
.rule-card.disabled-rule {
  background: #f4f6f0;
}
.rule-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.rule-header > div {
  display: flex;
  gap: 3px;
}
.rule-header .btn {
  padding: 2px 8px;
  min-height: 30px;
  font-size: 12px;
}
.weekdays {
  display: flex;
  gap: 6px;
  margin: 10px 0;
}
.weekdays button {
  width: 34px;
  height: 32px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: #f9fbf6;
  font-size: 11px;
}
.weekdays button[aria-pressed="true"] {
  background: #72885a;
  color: white;
  border-color: #72885a;
}
.cycle-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 12px 0;
}
.cycle-slot {
  display: grid;
  grid-template-columns: 1fr 24px;
  gap: 5px;
  width: 124px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
}
.cycle-slot > span {
  font-size: 9px;
  color: #8a987c;
  align-self: center;
}
.cycle-slot > select {
  grid-row: 2;
  grid-column: 1/3;
  padding: 6px 4px;
  font-size: 12px;
  background: #f7f9f2;
  border: 0;
}
.cycle-slot .btn.icon {
  width: 24px;
  min-height: 24px;
  padding: 3px;
  grid-row: 1;
  grid-column: 2;
}
.cycle-slot .btn svg {
  width: 14px;
}
.preview {
  border-top: 1px solid var(--border);
  margin-top: 28px;
  padding-top: 22px;
}
.preview-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.preview-heading h3 {
  margin: 0 0 4px;
}
.preview-counts {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #81916f;
  margin: 20px 0;
}
.preview-counts b {
  font-size: 17px;
  color: #536b3f;
  margin-left: 4px;
}
.notice {
  background: #f7f3e8;
  border: 1px solid #e8dfc5;
  border-radius: 9px;
  font-size: 11px;
  color: #9d8655;
  padding: 11px 13px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}
.notice p {
  margin: 6px 0;
}
.preview-month {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 20px 0 9px;
}
.preview-month select {
  font-size: 12px;
  background: transparent;
  border: 0;
}
.preview-month .btn {
  padding: 4px 8px;
  min-height: 30px;
}
.preview-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.preview-grid .week-label {
  padding: 5px;
}
.preview-grid button {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-height: 74px;
  border: 1px solid #e3e9da;
  border-radius: 8px;
  background: white;
  padding: 5px 2px;
  font-size: 10px;
  min-width: 0;
}
.preview-grid button > span {
  color: #92a080;
}
.preview-grid b {
  font-size: 11px;
  overflow-wrap: anywhere;
  max-width: 100%;
  font-weight: 550;
}
.preview-grid small {
  font-size: 8px;
  color: #b1b8a9;
}
.preview-grid button.conflict {
  background: #f9f1de;
  border-color: #ddc78f;
}
.preview-grid button.chosen {
  box-shadow: inset 0 0 0 1px var(--green);
  border-color: var(--green);
}
.preview-grid i {
  position: absolute;
  right: 3px;
  top: 3px;
  background: #c8a65f;
  color: white;
  border-radius: 50%;
  font-size: 8px;
  width: 11px;
  height: 11px;
  font-style: normal;
}
.preview-reason {
  font-size: 11px;
  border-radius: 10px;
  background: #eff4e8;
  padding: 14px;
  margin: 15px 0;
}
.preview-reason p {
  margin-top: 5px;
  color: #879774;
}
.preview > .muted {
  margin: 20px 0 10px;
  font-size: 11px;
}
.error,
.app-error {
  background: #fbf1eb;
  border: 1px solid #e9cfc1;
  color: #9c5c46;
  padding: 12px 15px;
  border-radius: 10px;
  font-size: 12px;
  margin: 12px 0;
}
.app-error {
  position: fixed;
  z-index: 200;
  top: 12px;
  left: 245px;
  right: 25px;
  display: flex;
  align-items: center;
  gap: 13px;
  box-shadow: 0 5px 20px #6d3c2522;
  white-space: pre-wrap;
}
.app-error > span {
  flex: 1;
}
.app-error .btn {
  font-size: 11px;
  padding: 5px 10px;
  min-height: 30px;
}
.demo-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px 25px;
  background: #e7eddf;
  color: #748863;
  font-size: 10px;
}
.demo-banner button {
  border: 0;
  background: transparent;
  color: #536f3d;
  font-size: 10px;
  text-decoration: underline;
}
.mobile-nav {
