  /* ===== 共用 ===== */
  .btn {
    border:none; cursor:pointer; border-radius:50px;
    font-weight:700; letter-spacing:2px;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .btn:active { transform:scale(.96); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn-primary { background:linear-gradient(135deg,#e85d5d,#d43f3f); color:#fff; }
  .btn-gold { background:linear-gradient(135deg,#f5c542,#e0a010); color:#5a3d00; }
  .btn-green { background:linear-gradient(135deg,#5cae7f,#3d8f60); color:#fff; }
  .btn-gray { background:rgba(30,20,58,.85); color:#ecd9ab;
              border:1px solid rgba(214,175,110,.45); }

  /* 頂欄 */
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; transition:opacity .35s;
  }
  .topbar .tag {
    background:rgba(16,10,40,.72); padding:6px 14px; border-radius:20px;
    font-size:13px; font-weight:700; color:#f0d49a;
    border:1px solid rgba(214,175,110,.35);
    box-shadow:0 2px 12px rgba(0,0,0,.45);
  }
  .topbar .actions { display:flex; gap:8px; }
  .topbar .actions .btn { padding:8px 16px; font-size:13px; letter-spacing:1px; }

  /* 投屏優化：全螢幕時收起頂欄；鼠標閒置 3 秒自動隱藏 */
  body.full:not(.awake) .topbar { opacity:0; pointer-events:none; }
  body.idle, body.idle * { cursor:none !important; }

  /* 頁面容器 */
  .paper {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:70px 8% 40px;
  }
  h1.title {
    font-size:clamp(26px,5vw,44px); color:#f5d68f;
    text-shadow:0 2px 14px rgba(255,180,60,.4), 0 1px 0 rgba(40,15,0,.5);
    margin-bottom:6px; text-align:center;
  }
  .subtitle { font-size:14px; color:#c5ae86; margin-bottom:16px; text-align:center; }

  /* ===== 抽獎頁 =====
     中間舞台放「攪珠大字」或者「中獎格」；底部只有進度、按鈕、提示。 */
  #pageDraw { justify-content:space-between; padding:62px 8% 22px; }
  #pageDraw > * { width:min(540px, 70vw); }
  #pageDraw .bottom { display:flex; flex-direction:column; align-items:center; }

  .stage {
    flex:1 1 auto; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }

  /* ===== 中間框：攪珠 ↔ 本輪抽中，同一個位置，唔會跳位 =====
     抽中嘅人停留喺畫面（金框 + 發光 + 彈出），直到下一次攪珠先收起；
     同時會記入下面嘅中獎名單。字級唔會好大，唔會霸佔成個畫面。 */
  .round-box {
    width:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.4vh;
    /* 舞台本身唔係正中（下面有按鈕、名單），所以整體再向下移到畫面正中 */
    transform:translateY(var(--shiftY, 0px));
  }
  .round-label {
    font-size:1.9vh; letter-spacing:.35vh; color:#ffe8b8;
    background:rgba(10,6,26,.6); border-radius:99vh; padding:.5vh 1.8vh;
  }
  /* 卡框：用格線排，欄數由 fitRound 決定，幾多人都排得整齊（唔會 2+1 咁散） */
  .round-cards {
    display:grid; justify-items:center;
    gap:1.2vh; width:100%;
  }
  .r-card {
    flex:0 0 auto; min-width:0; width:max-content; max-width:100%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, rgba(255,226,150,.22), rgba(110,64,8,.34));
    border:.26vh solid #ffd571; border-radius:1.4vh;
    padding:1vh 2.2vh; font-size:var(--rfs, 3.4vh); font-weight:900;
    line-height:1.15; color:#fff4d2; white-space:nowrap;
    text-shadow:0 0 2vh rgba(255,190,80,.8), 0 .2vh .5vh rgba(50,15,0,.75);
    animation:win-pop .6s cubic-bezier(.2,1.5,.4,1) backwards,
              win-glow 1.7s ease-in-out .55s 3;
  }
  @keyframes win-pop {
    from { transform:scale(.5); opacity:0; }
    to   { transform:scale(1); opacity:1; }
  }
  @keyframes win-glow {
    0%,100% { box-shadow:0 0 2.6vh rgba(255,190,80,.45), inset 0 0 2vh rgba(255,210,130,.18); }
    50%     { box-shadow:0 0 6vh rgba(255,205,110,.95), inset 0 0 3.4vh rgba(255,226,160,.42); }
  }

  /* 攪珠中：同一個框，換成滾動名字。框填滿整欄，字會放到同框一樣闊 */
  .roll-name {
    display:none; width:100%; text-align:center;
    font-size:var(--namefs, 7vh); font-weight:900;
    line-height:1.2; color:#fff6dc; word-break:break-all;
    padding:1vh 1vh; border-radius:1.4vh;
    border:.3vh dashed rgba(255,213,113,.6);
    text-shadow:0 0 2.6vh rgba(255,190,80,.75), 0 .3vh .6vh rgba(40,10,0,.8);
  }
  .round-box.rolling .roll-name { display:block; }
  .round-box.rolling .round-cards { display:none; }

  /* 未輸入名單時：抽獎區留白 */
  #pageDraw.is-empty .round-box,
  #pageDraw.is-empty .all-box,
  #pageDraw.is-empty .win-list,
  #pageDraw.is-empty .list-label,
  #pageDraw.is-empty .pool-info { display:none; }

  /* 全部中獎者：抽完之後由按鈕叫出嚟，一次過顯示喺中間。
     加一層深色面板 —— 海報中央好光，唔加面板啲字會撞色睇唔清。 */
  .all-box {
    width:100%; display:flex; flex-direction:column; align-items:center; gap:1.6vh;
    transform:translateY(var(--shiftY, 0px));
    background:rgba(8,5,22,.72);
    border:.18vh solid rgba(255,214,138,.42); border-radius:2vh;
    padding:2.2vh 2vh 2.4vh;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    box-shadow:0 1vh 4vh rgba(0,0,0,.45);
  }
  .all-title {
    font-size:2.2vh; letter-spacing:.45vh; color:#ffe6b4; font-weight:800;
    text-shadow:0 0 2vh rgba(255,180,60,.75), 0 .2vh .5vh rgba(0,0,0,.6);
  }

  /* 中獎格：格仔唔會太大，12 位一次過見晒 */
  .win-grid {
    display:grid; width:100%; gap:1.2vh; margin:0;
  }
  .win-grid .cell {
    display:flex; align-items:center; justify-content:center;
    background:rgba(18,11,42,.55);
    border:.28vh solid rgba(255,214,138,.7);
    border-radius:1.4vh;
    padding:1.8vh .5vh;
    font-size:var(--gfs, 3vh); font-weight:800; line-height:1.15;
    color:#ffe9a8; text-shadow:0 0 30px rgba(255,190,80,.45);
    white-space:nowrap; overflow:hidden;
  }
  .win-grid .cell.new { animation:pop .5s ease backwards; }
  @keyframes pop {
    0%{ transform:scale(.3); opacity:0; }
    60%{ transform:scale(1.22); }
    100%{ transform:scale(1); opacity:1; }
  }

  /* ===== 下方中獎名單：每抽中一個就記入，號碼 + 名字 =====
     標題同號碼牌排埋同一行（會自動換行），慳返一行位畀中間嘅大字。 */
  .list-row {
    width:100%; display:flex; flex-wrap:wrap; align-items:center;
    justify-content:center; gap:.8vh; margin-bottom:.6vh;
  }
  .list-label { font-size:1.3vh; letter-spacing:.3vh; color:#e5c98f; white-space:nowrap; }
  .win-list {
    display:flex; flex-wrap:wrap; justify-content:center; gap:.8vh;
  }
  .win-list .chip {
    display:inline-flex; align-items:center; gap:.55vh;
    background:rgba(16,10,36,.6); border:.18vh solid rgba(255,214,138,.45);
    border-radius:99vh; padding:.45vh 1.1vh;
    font-size:var(--cfs, 1.2vh); line-height:1.25; color:#ffe9b8;
  }
  .win-list .chip b { color:#ffd571; font-weight:800; }
  .win-list .chip.new {
    animation:chip-in .5s ease backwards, chip-glow 1.5s ease-in-out .4s 2;
  }
  @keyframes chip-in { from { transform:translateY(1.2vh) scale(.85); opacity:0; } }
  @keyframes chip-glow { 50% { background:rgba(255,205,110,.45); border-color:#ffd571; } }

  /* 主按鈕 */
  .btn-main {
    padding:18px 76px; font-size:clamp(22px,4.6vw,30px);
    margin-top:4px; letter-spacing:6px;
    border:3px solid rgba(255,255,255,.75);
  }
  /* 抽完 12 位：暗金框表示已完成（唔用 opacity，深色底會似壞咗） */
  .btn-main.done { opacity:1; background:rgba(14,9,38,.72); color:#e6d3a4;
                   border-color:rgba(214,175,110,.55); box-shadow:none; cursor:default; }

  /* 進度（下面幾塊都收窄少少，等中間嘅名字可以再放大） */
  .pool-info {
    margin-top:3px; font-size:12px;
    color:#dcc79a; display:inline-block; padding:0;
    max-width:100%; text-align:center; line-height:1.3;
  }

  .hidden { display:none !important; }
  .kbd-hint { font-size:11px; color:#ffe89a; margin-top:6px; }

  /* ===== 管理頁 ===== */
  .admin-panel {
    width:100%; max-width:560px;
    background:rgba(14,9,38,.88); border:1px solid rgba(214,175,110,.28);
    border-radius:18px; padding:22px;
    box-shadow:0 8px 34px rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .admin-panel label { display:block; font-size:13px; font-weight:700; color:#f0d49a; margin:14px 0 6px; }
  .admin-panel textarea {
    width:100%; height:180px; border:2px solid rgba(214,175,110,.5); border-radius:12px;
    padding:10px; font-size:14px; font-family:inherit; resize:vertical;
    background:#fffdf7; color:#2a2216;
  }
  .admin-panel textarea:focus { outline:none; border-color:#c0392b; }
  .settings-row { display:flex; gap:10px; flex-wrap:wrap; }
  .settings-row .field { flex:1; min-width:130px; }
  .settings-row input {
    width:100%; border:2px solid rgba(214,175,110,.5); border-radius:10px; padding:9px 10px;
    font-size:15px; background:#fffdf7; color:#2a2216; text-align:center;
  }
  .admin-actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .admin-actions + .admin-actions { margin-top:10px; }
  .admin-actions .btn { flex:1; padding:13px 10px; font-size:15px; letter-spacing:1px; }
  .stat-line { font-size:13px; color:#c8b48e; margin-top:12px; text-align:center; }

  /* ==================== 版面 START：全屏版（16:9 / 16:10）====================
     bg.jpg 係 1110×1640 直幅海報。要「完整顯示」就一定要用 contain 按高度
     填滿，左右必然留白 —— 呢兩條邊由模糊光暈補住，內容就全部收喺海報寬度
     之內，唔會踩到延伸區，睇落仍然係一幅完整嘅畫。
     --poster = 海報完整顯示後嘅實際寬度（67.68vh = 1110/1640），唔可以闊過 100vw
     --col    = 內容欄寬度
     --gfs    = 中獎格字級（由 fitGrid() 按最長名字覆寫） */
  :root {
    --poster: min(100vw, 67.68vh);
    --col: calc(var(--poster) * 0.94);
    --side: calc((100vw - var(--poster)) / 2);
    --namefs: 7.5vh;   /* 攪珠名（fitRollName 會按最長名字覆寫） */
    --rfs: 3.4vh;      /* 本輪中獎卡（fitRound 覆寫） */
    --gfs: 3.2vh;      /* 全部中獎者格（fitGrid 覆寫） */
    --cfs: 1.45vh;     /* 下方中獎名單 */
  }

  /* 海報左右最外 2vh 淡出，同後面嘅模糊光暈接埋 —— 睇唔到「一張圖嘅邊」 */
  .bg-frame {
    -webkit-mask-image: linear-gradient(to right,
      transparent calc(var(--side) - 2vh), #000 calc(var(--side) + 2vh),
      #000 calc(100% - var(--side) - 2vh), transparent calc(100% - var(--side) + 2vh));
    mask-image: linear-gradient(to right,
      transparent calc(var(--side) - 2vh), #000 calc(var(--side) + 2vh),
      #000 calc(100% - var(--side) - 2vh), transparent calc(100% - var(--side) + 2vh));
  }

  #pageDraw { padding:max(54px, 4.6vh) 3vw max(22px, 2.8vh); }
  #pageDraw > * { width:var(--col); }

  .roll-name { font-size:var(--namefs); }

  /* 本輪中獎卡：每欄食滿，字放到最大 */
  .round-box { gap:1.4vh; }
  .r-card { padding:1.4vh 1vh; border-radius:1.6vh; }

  /* 全部中獎者：3 欄 × 4 行，名字可以放到大 */
  .win-grid { grid-template-columns:repeat(3,1fr); gap:1.2vh; }
  .win-grid .cell { padding:1.9vh .5vh; border-radius:1.4vh; }

  /* 下方中獎名單（收窄少少，慳位畀中間嘅大字） */
  .list-label { font-size:1.35vh; }
  .win-list { gap:.9vh; }
  .win-list .chip { padding:.5vh 1.1vh; }
  .list-row { margin-bottom:.4vh; }

  .pool-info { margin-top:0; font-size:1.35vh; padding:0;
               background:none; border:none; text-shadow:0 .2vh .5vh rgba(0,0,0,.7); }
  .btn-main { width:100%; padding:1.6vh 0; font-size:clamp(20px,3.2vh,34px);
              margin-top:.8vh; letter-spacing:.6vh; }
  .kbd-hint { display:none; }             /* 投屏畫面唔需要提示文字 */

  .admin-panel { width:min(720px, 78vh); }
  /* ==================== 版面 END ==================== */

  /* 簡易彩帶 */
  .confetti {
    position:fixed; top:-20px; z-index:99; font-size:22px;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(105vh) rotate(720deg); opacity:.6; }
  }

<div class="preview-note">示例體驗，資料只保留在本頁 <button id="demoReset">恢復示例</button> <span id="demoMsg"></span></div><script>function previewAlert(s){document.getElementById("demoMsg").textContent=s}
/* ================= 狀態 ================= */
const LS_KEY = "luckyDraw_v1";
let S = {
  pool: [],         // 剩餘獎池
  winners: [],      // 已抽出 [{name}]
  cfg: { perDraw:3, total:12 }   // 每次抽幾人 / 總共抽幾位
};
function save(){  }
function load(){
  try{
    const d = null;
    if(!d || !Array.isArray(d.pool)) return;
    const cfg = d.cfg || {};
    // 兼容舊版備份（舊版有 ultPool / ultWinners）：只需要映射總人數，其餘舊欄位丟棄
    S = {
      pool: d.pool,
      winners: Array.isArray(d.winners) ? d.winners : [],
      cfg: { perDraw: cfg.perDraw || 3, total: cfg.total || cfg.ultPool || 12 }
    };
    if(S.winners.length > S.cfg.total) S.winners = S.winners.slice(0, S.cfg.total);
  }catch(e){}
}

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const pageDraw = $("pageDraw"), pageAdmin = $("pageAdmin"), btnMain = $("btnMain");
const ROLL_MS = 3000;                 // 一按抽獎，3 秒後自動開獎
let rolling = false, rollTimer = null, autoStopTimer = null;
let cdTimer = null, rollStartAt = 0;  // 按鈕倒數用
let showingAll = false;               // 抽完之後有冇叫出「全部中獎者」

/* 名單文字 → 去重去空行嘅陣列 */
const parseNames = t => [...new Set(t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];
const esc = s => s.replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function pickN(arr,n){
  const a=[...arr], out=[];
  while(out.length<n && a.length) out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  return out;
}

/* ================= 頁面切換 ================= */
function showDraw(){
  pageAdmin.classList.add("hidden");
  pageDraw.classList.remove("hidden");
  $("modeTag").textContent = "🎉 抽獎模式";
  refreshDraw();
}
function showAdmin(){
  stopAll();
  pageDraw.classList.add("hidden");
  pageAdmin.classList.remove("hidden");
  $("modeTag").textContent = "⚙️ 管理模式";
  $("txtNames").value = S.pool.concat(S.winners.map(w=>w.name)).join("\n");
  $("setPerDraw").value = S.cfg.perDraw;
  $("setTotal").value = S.cfg.total;
  updateAdminStat(S.pool.length + S.winners.length);
}
$("btnAdmin").onclick = () => pageDraw.classList.contains("hidden") ? showDraw() : showAdmin();
$("btnFull").onclick = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

/* ================= 投屏優化 =================
   1. 全螢幕時收起頂欄（鼠標移去頂部 12% 再出現）
   2. 鼠標閒置 3 秒自動隱藏
   3. Wake Lock 阻止休眠（非 HTTPS 時靜靜跳過） */
let wakeLock = null, idleTimer = null;
function askWakeLock(){
  if(!("wakeLock" in navigator) || wakeLock) return;
  navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {});
}
function pokeCursor(){
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
}
document.addEventListener("mousemove", e => {
  pokeCursor();
  const showBar = !document.fullscreenElement || e.clientY < window.innerHeight * 0.12;
  document.body.classList.toggle("awake", showBar);
});
document.addEventListener("fullscreenchange", () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle("full", on);
  document.body.classList.toggle("awake", !on);
  if(on){ askWakeLock(); pokeCursor(); }
  else if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
});
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && document.fullscreenElement) askWakeLock();
});

/* ================= 管理邏輯 ================= */
function updateAdminStat(n){
  if(!n){ $("adminStat").textContent = "尚未載入名單"; return; }
  const perDraw = parseInt($("setPerDraw").value)||3;
  const total = parseInt($("setTotal").value)||12;
  const rounds = Math.ceil(total / perDraw);
  $("adminStat").innerHTML = `已載入 <b>${n}</b> 個名字 ｜ 每次抽 <b>${perDraw}</b> 人 ｜ 總共抽 <b>${total}</b> 位（約 <b>${rounds}</b> 輪）`
    + `<br><span style="color:#e8a87c">按「保存」會重置獎池同清空所有已抽記錄</span>`;
}
$("btnSave").onclick = () => {
  const names = parseNames($("txtNames").value);
  if(names.length === 0){ previewAlert("請先輸入名單！"); return; }
  const perDraw = parseInt($("setPerDraw").value)||3;
  const total = parseInt($("setTotal").value)||12;
  if(perDraw < 1){ previewAlert("每次抽獎人數至少 1 人！"); return; }
  if(total < 1){ previewAlert("中獎人數至少 1 位！"); return; }
  if(perDraw > total){ previewAlert(`每次抽 ${perDraw} 人多過總中獎人數 ${total} 位，請調整。`); return; }
  if(total > names.length){ previewAlert(`名單只有 ${names.length} 人，唔夠抽出 ${total} 位。`); return; }
  const rounds = Math.ceil(total / perDraw);
  const msg = `名單 ${names.length} 人\n每次抽 ${perDraw} 人\n總共抽出 ${total} 位（約 ${rounds} 輪）\n\n（會重置獎池、清空之前所有抽獎記錄）\n確定開始？`;
  
  S = { pool:[...names], winners:[], cfg:{perDraw,total} };
  save(); resetView(); showDraw();
};
$("btnResetAll").onclick = () => {
  if(false){
    return;
  }
  S = { pool:[], winners:[], cfg:S.cfg };
  save(); $("txtNames").value=""; resetView(); updateAdminStat(0); refreshDraw();
};
$("btnClearWinners").onclick = () => {
  if(!S.winners.length){ previewAlert("而家未有中獎記錄。"); return; }
  
  const all = S.pool.concat(S.winners.map(w=>w.name));
  S = { pool:all, winners:[], cfg:S.cfg };
  save(); resetView(); updateAdminStat(all.length);
  
};

/* ================= 畫面更新 ================= */
/* 中間細標籤：有文字先顯示，冇就收埋（唔佔高度） */
function setLabel(t){
  const el = $("roundLabel");
  el.textContent = t;
  el.classList.toggle("hidden", !t);
}

/* renderRound：本輪抽中（金框 + 中獎效果），停留喺畫面直到下次攪珠 */
function renderRound(names){
  $("roundCards").innerHTML = names.map((n,i)=>
    `<div class="r-card" style="animation-delay:${(i*0.22).toFixed(2)}s">${esc(n)}</div>`
  ).join("");
  setLabel("");
  fitRound(names.length);
}

/* renderList：下方中獎名單（號碼 + 名字），newNames 會閃金 */
function renderList(newNames){
  $("winList").innerHTML = S.winners.map((w,i)=>{
    const k = newNames ? newNames.indexOf(w.name) : -1;
    const cls = k >= 0 ? " new" : "";
    const delay = k >= 0 ? ` style="animation-delay:${(k*0.18).toFixed(2)}s"` : "";
    return `<span class="chip${cls}"${delay}><b>${i+1}</b>${esc(w.name)}</span>`;
  }).join("");
  $("listLabel").classList.toggle("hidden", !S.winners.length);
  $("winList").classList.toggle("hidden", !S.winners.length);
}

/* renderGrid：全部中獎者格（抽完先顯示） */
function renderGrid(){
  $("winGrid").innerHTML = S.winners.map(w=>`<div class="cell">${esc(w.name)}</div>`).join("");
  fitGrid();
}

/* resetView：換名單／清空／還原之後，中間同下方名單一齊重設 */
function resetView(){
  showingAll = false;
  $("roundCards").innerHTML = "";
  setLabel("");
  $("roundBox").classList.remove("rolling");
  $("rollName").textContent = "";
  renderList();
  renderGrid();
}

/* 舞台置中：中間嘅「攪珠大字／中獎卡／全部中獎者」要對準畫面正中。
   但舞台本身唔係正中（上面有標題位、下面有進度同名單），所以要計一個向下位移。
   --fitH = 以畫面正中為中心、上下都放得落嘅最大高度；
   fitRound / fitRollName 用佢限制字級，字放到最大都唔會壓住下面嘅名單。 */
function measureStage(){
  const st = $("stage"), vh = window.innerHeight;
  const top = st.getBoundingClientRect().top;
  const bottomTop = document.querySelector("#pageDraw .bottom").getBoundingClientRect().top;
  const target = vh / 2, gap = vh * 0.015;
  const up = Math.max(90, target - top);
  const down = Math.max(90, bottomTop - gap - target);
  const half = Math.min(up, down);
  st.style.setProperty("--shiftY", Math.round(target - (top + st.clientHeight / 2)) + "px");
  st.style.setProperty("--fitH", Math.round(half * 2) + "px");
}
function fitH(){
  const v = parseFloat(getComputedStyle($("stage")).getPropertyValue("--fitH"));
  return v > 0 ? v : $("stage").clientHeight;
}

/* 中獎格字級：按「最長嘅名」同實際格寬計，保證一行放得落、唔會爆格 */
function fitGrid(){
  const cells = [...$("winGrid").children];
  if(!cells.length) return;
  const len = Math.max(3, ...cells.map(c => [...c.textContent].length));
  const cw = cells[0].clientWidth - 10;
  const fs = Math.max(13, Math.min(window.innerHeight * 0.052, 56, cw * 0.94 / len));
  $("winGrid").style.setProperty("--gfs", Math.round(fs) + "px");
}

/* 本輪中獎卡：每欄食滿（1fr），字級同時受「闊度」同「高度」限制，
   所以名字會放大到同邊框一樣大，又唔會爆出畫面。
   人數決定欄數：1~3 人一欄（直落）、4~6 人兩欄、7~9 人三欄、10 人以上四欄。 */
function fitRound(n){
  const cards = [...$("roundCards").children];
  if(!cards.length) return;
  const len = Math.max(2, ...cards.map(c => [...c.textContent].length));
  const cols = Math.min(4, Math.max(1, Math.ceil(cards.length / 3)));
  const rows = Math.ceil(cards.length / cols);
  const box = $("roundCards");

  const cs = getComputedStyle(cards[0]);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
             + parseFloat(cs.borderLeftWidth) * 2;
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)
             + parseFloat(cs.borderTopWidth) * 2;
  const g = getComputedStyle(box);
  const gapC = parseFloat(g.columnGap) || 0, gapR = parseFloat(g.rowGap) || 0;
  const boxW = box.clientWidth || window.innerWidth * 0.6;
  box.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  // 扣走 label 高度同 round-box 嘅 gap，先唔會頂出海報頂部
  const labelH = $("roundLabel").offsetHeight || 0;
  const gapBox = parseFloat(getComputedStyle($("roundBox")).rowGap) || 0;
  const boxH = Math.max(160, fitH() - labelH - gapBox - 16);

  const availW = (boxW - gapC * (cols - 1)) / cols - padX - 4;
  const availH = boxH / rows - gapR - padY - 4;
  const fs = Math.max(12, Math.min(availW / len, availH / 1.15));
  box.style.setProperty("--rfs", Math.round(fs) + "px");
}

/* 攪珠名字：框填滿整欄，字級按「名單最長嘅名」定，令字同框一樣闊 */
function fitRollName(){
  const all = S.pool.concat(S.winners.map(w => w.name));
  if(!all.length) return;
  const len = Math.max(2, ...all.map(n => [...n].length));
  const el = $("rollName"), cs = getComputedStyle(el);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
             + parseFloat(cs.borderLeftWidth) * 2;
  const col = $("stage").clientWidth || window.innerWidth * 0.5;
  const labelH = $("roundLabel").offsetHeight || 0;
  const gapBox = parseFloat(getComputedStyle($("roundBox")).rowGap) || 0;
  const boxH = Math.max(120, fitH() - labelH - gapBox - 16);
  const fs = Math.min((col - padX - 6) / len, boxH / 1.2);
  document.documentElement.style.setProperty("--namefs", Math.round(fs) + "px");
}
function refit(){ measureStage(); fitRollName(); fitRound($("roundCards").children.length); fitGrid(); }
window.addEventListener("resize", refit);

/* refreshDraw：更新數字、按鈕、名單；唔重畫本輪卡（避免動畫重播） */
function refreshDraw(){
  const total = S.cfg.total, done = S.winners.length;
  const finished = done >= total;
  const empty = !S.pool.length && !done;
  if(showingAll && !finished) showingAll = false;
  const allOn = finished && showingAll;

  pageDraw.classList.toggle("is-empty", empty);
  pageDraw.classList.remove("rolling");
  $("roundBox").classList.remove("rolling");
  $("roundBox").classList.toggle("hidden", allOn);
  $("allBox").classList.toggle("hidden", !allOn);
  $("poolInfo").classList.toggle("hidden", empty);
  $("kbdHint").classList.toggle("hidden", !!done);   // 抽過一次就唔使再教

  if($("winList").children.length !== done) renderList();
  if($("winGrid").children.length !== done) renderGrid();
  // 顯示全部中獎者時，下方名單收埋（中間已經一次過顯示，唔使重複）
  $("listLabel").classList.toggle("hidden", !done || allOn);
  $("winList").classList.toggle("hidden", !done || allOn);
  $("allTitle").textContent = `🎉 全部中獎者（${done} 位）`;

  if(!$("roundCards").children.length){
    setLabel(empty ? ""
      : finished ? "按下方按鈕顯示全部中獎者" : "按「抽 獎」開始");
  }
  $("poolCount").textContent = S.pool.length;
  $("winCount").textContent = done;
  $("winTarget").textContent = total;

  btnMain.classList.remove("done");
  btnMain.textContent = empty ? "請先輸入名單"
                      : allOn ? "收 起 名 單"
                      : finished ? "顯示全部中獎者"
                      : S.pool.length ? "抽 獎" : "獎池已空";
  // 抽完之後按鈕仍然要按得（睇全部中獎者），所以只有真正做唔到嘢先停用
  btnMain.disabled = empty || rolling || (!finished && !S.pool.length);
  refit();
}

/* ================= 抽獎 ================= */
/* 倒數：按鈕顯示「停 止 · 3」逐秒遞減，令 3 秒自動開獎睇得見 */
function startCd(){
  rollStartAt = Date.now();
  clearInterval(cdTimer);
  const paint = () => {
    const left = Math.max(0, Math.ceil((rollStartAt + ROLL_MS - Date.now()) / 1000));
    btnMain.textContent = "停 止 · " + left;
  };
  paint();
  cdTimer = setInterval(paint, 120);
}
function stopCd(){ clearInterval(cdTimer); cdTimer = null; }

function startRoll(){
  if(rolling || btnMain.disabled) return;
  if(!S.pool.length) return;
  rolling = true;
  showingAll = false;
  pageDraw.classList.add("rolling");
  $("roundBox").classList.remove("hidden");
  $("allBox").classList.add("hidden");
  $("roundBox").classList.add("rolling");
  $("roundCards").innerHTML = "";        // 上一輪收去下方名單，呢一格用嚟攪珠
  setLabel("攪珠中…");
  $("rollName").textContent = "";
  btnMain.textContent = "停 止 · 3";
  startCd();
  rollTimer = setInterval(() => {
    $("rollName").textContent = S.pool[Math.floor(Math.random()*S.pool.length)];
  }, 60);
  clearTimeout(autoStopTimer);
  autoStopTimer = setTimeout(stopRoll, ROLL_MS);   // 3 秒自動開獎
}

function stopRoll(){
  if(!rolling) return;
  rolling = false;
  stopCd();
  clearInterval(rollTimer); rollTimer = null;
  clearTimeout(autoStopTimer); autoStopTimer = null;

  // 最後一輪可能唔夠數：抽到設定人數就停
  const n = Math.min(S.cfg.perDraw, S.cfg.total - S.winners.length, S.pool.length);
  if(n <= 0){ refreshDraw(); return; }
  const picked = pickN(S.pool, n);
  S.pool = S.pool.filter(x => !picked.includes(x));
  picked.forEach(w => S.winners.push({ name:w }));
  save();

  pageDraw.classList.remove("rolling");
  $("roundBox").classList.remove("rolling");
  $("rollName").textContent = "";
  renderList(picked);           // 先記入下方名單（會影響舞台高度）
  measureStage();               // 名單多咗、下面變高 → 重新算置中同可用高度
  renderRound(picked);          // 金框 + 中獎效果，停留喺畫面
  fitGrid();

  const finished = S.winners.length >= S.cfg.total;
  $("poolCount").textContent = S.pool.length;
  $("winCount").textContent = S.winners.length;
  btnMain.disabled = true;      // 等動畫完先恢復
  btnMain.textContent = finished ? "顯示全部中獎者" : "抽 獎";
  confetti(finished ? 90 : 16);

  setTimeout(refreshDraw, (picked.length-1)*220 + 800);
}

/* 切去管理頁時煞停一切 */
function stopAll(){
  if(rolling){ rolling = false; clearInterval(rollTimer); rollTimer = null; }
  stopCd();
  clearTimeout(autoStopTimer); autoStopTimer = null;
}

/* 主按鈕 */
btnMain.onclick = () => {
  // 連點保護：開始後 250ms 內再點唔當「提早停」，避免手震一按即開獎
  if(rolling && Date.now() - rollStartAt < 250) return;
  if(rolling) return stopRoll();
  // 抽完之後：同一個按鈕切換「全部中獎者」顯示
  if(S.winners.length >= S.cfg.total){
    showingAll = !showingAll;
    refreshDraw();
    if(showingAll) confetti(60);
    return;
  }
  startRoll();
};
document.addEventListener("keydown", e => {
  if(e.code === "Space" && !pageDraw.classList.contains("hidden")){
    e.preventDefault();
    if(!btnMain.disabled) btnMain.click();
  }
});

/* 彩帶 */
function confetti(n){
  const emo = ["🎉","🎊","✨","🌟","💛","🧡"];
  for(let i=0;i<n;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = emo[Math.floor(Math.random()*emo.length)];
    c.style.left = Math.random()*100+"vw";
    c.style.animationDuration = (2+Math.random()*2.5)+"s";
    c.style.animationDelay = Math.random()*0.8+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5500);
  }
}
