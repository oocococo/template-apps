  <div class="app">

    <!-- 首页 -->
    <section class="view is-active" id="view-home">
      <header class="hero">
        <div class="hero-brand">
          <img class="hero-logo" src="__ICON__" alt="" />
          <div>
            <div class="hero-badge">持家军师</div>
            <h1 class="hero-title">算清这笔账，再决定买不买</h1>
          </div>
        </div>
        <p class="hero-sub">花掉什么 · 换回什么 · 证据有多硬</p>
        <div class="hero-actions">
          <button class="hero-entry" id="btn-records" type="button">
            <span class="tip-hand" id="tip-hand" hidden>☝</span>
            <span>我的记录</span>
            <span class="dot" id="dot" hidden>0</span>
          </button>
        </div>
      </header>

      <div class="banner-list" id="banner-list"></div>

      <!-- 大号照片入口 -->
      <div class="photo-block">
        <label class="photo-drop" id="photo-drop" for="in-photo">
          <div class="photo-ring">
            <span class="photo-plus">+</span>
          </div>
          <div class="photo-title">拍照 / 上传一张照片</div>
          <div class="photo-hint">只存在本机当封面，不做识别</div>
        </label>
        <input id="in-photo" type="file" accept="image/*" class="visually-hidden" />
        <div class="photo-preview-wrap" id="photo-preview-wrap" hidden>
          <img id="photo-preview" class="photo-big" alt="本地预览" />
          <button class="photo-remove" id="btn-remove-photo" type="button">×</button>
        </div>
      </div>

      <div class="card">
        <label class="field" for="in-name">
          <span class="label">想买什么</span>
          <input id="in-name" type="text" placeholder="例如：戴森吹风机 / 健身房年卡" maxlength="40" />
        </label>

        <label class="field" for="in-price">
          <span class="label">大概多少钱（元）</span>
          <input id="in-price" type="number" inputmode="decimal" placeholder="例如 1999" maxlength="9" />
        </label>

        <div class="field">
          <span class="label">大概多久用一次</span>
          <div class="chips" id="freq-chips"></div>
        </div>

        <div class="field">
          <span class="label">买它主要是</span>
          <div class="chips" id="tag-chips"></div>
        </div>

        <label class="switch-row" for="in-similar">
          <input id="in-similar" type="checkbox" />
          <span>家里已经有类似的东西</span>
        </label>

      </div>

      <button class="cta" id="btn-analyze" type="button">帮我判断要不要买</button>
      <p class="hint" id="engine-hint">小工具离线运行：用本机算账规则给结论。</p>
    </section>

    <!-- 结果 -->
    <section class="view" id="view-result">
      <div class="verdict" id="verdict-card">
        <div class="verdict-label">军师的结论</div>
        <div class="verdict-value" id="verdict-value">—</div>
      </div>

      <div class="meta-line" id="result-meta"></div>
      <div id="section-list"></div>

      <p class="disclaimer">结论只供参考，账算给你看，拍板还是你来。</p>

      <button class="cta" id="btn-again" type="button">再看下一件</button>
      <button class="ghost" id="btn-to-records" type="button">去我的记录</button>
    </section>

    <!-- 记录 -->
    <section class="view" id="view-records">
      <div class="summary">
        <div class="summary-item">
          <div class="summary-num" id="sum-total">0</div>
          <div class="summary-label">问过的东西</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="sum-bought">0</div>
          <div class="summary-label">买了</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="sum-skip">0</div>
          <div class="summary-label">没买</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="sum-saved">¥0</div>
          <div class="summary-label">省下的钱</div>
        </div>
      </div>

      <div id="reminder-block" hidden>
        <div class="block-title">冷静期提醒</div>
        <div id="reminder-list"></div>
      </div>

      <div class="block-title">全部记录</div>
      <div class="table" id="records-table" hidden>
        <div class="tr th">
          <div class="td td-name">物品</div>
          <div class="td td-verdict">结论</div>
          <div class="td td-bought">买了吗</div>
        </div>
        <div id="records-body"></div>
      </div>

      <div class="empty" id="records-empty">
        <div class="empty-title">还没有记录</div>
        <p class="empty-hint">回去写一句想买什么，或者拍张照，判断过的都会记在这里。</p>
        <button class="cta cta-small" id="btn-empty-back" type="button">去问一件</button>
      </div>

      <p class="footer-note">记录只存在你自己手机上，换设备就看不到了。</p>
      <button class="ghost" id="btn-home" type="button">返回首页</button>
    </section>

  </div>
