<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>写作变现 · 投稿征稿渠道检索台</title>
<style>
  :root{
    --bg:#faf8f3; --card:#fffdf8; --ink:#2b2620; --muted:#7a7164;
    --line:#e7e0d3; --accent:#8a1f1f; --accent2:#b8862f; --chip:#f1ece1;
    --ok:#2e7d49; --off:#9a3b3b; --pay:#7a4a12;
    --shadow:0 1px 3px rgba(60,45,20,.08),0 6px 18px rgba(60,45,20,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif SC","Songti SC",STSong,"Microsoft YaHei",serif;line-height:1.7}
  header{background:linear-gradient(180deg,#fffdf8,#f6f1e7);border-bottom:1px solid var(--line);
    padding:22px 20px 14px;text-align:center}
  header h1{margin:0;font-size:25px;letter-spacing:2px;color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  .tabs{display:flex;justify-content:center;gap:6px;margin:14px 0 0;flex-wrap:wrap}
  .tab{background:var(--chip);border:1px solid transparent;color:var(--ink);
    padding:7px 16px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab .count{opacity:.7;font-size:12px;margin-left:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:var(--ink);font-family:inherit}
  .search svg{flex:none;opacity:.5}
  .stats{color:var(--muted);font-size:13px;white-space:nowrap}
  .sort{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    font-size:13px;color:var(--ink);font-family:inherit;cursor:pointer}
  .stars{color:var(--accent2);font-size:12px;letter-spacing:1px;white-space:nowrap}
  .stars .lv{color:var(--muted);font-size:11px;margin-left:2px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
  .chip{background:var(--chip);border:1px solid transparent;color:var(--ink);
    padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none;font-family:inherit;transition:.15s}
  .chip:hover{border-color:var(--accent2)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.sec.on{background:var(--accent2);border-color:var(--accent2)}
  .chip.evt.on{background:var(--ok);border-color:var(--ok)}
  .grp-label{font-size:12px;color:var(--muted);margin:8px 2px 0;width:100%}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent2)}
  .card h3{margin:0 0 4px;font-size:17px;letter-spacing:.3px}
  .card .meta{font-size:12px;color:var(--muted);margin-bottom:7px}
  .card .contact{font-size:12.5px;color:var(--accent);background:#faf3ea;border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;margin-bottom:6px;word-break:break-all}
  .card .pay{font-size:12.5px;color:#fff;background:var(--pay);border-radius:8px;
    padding:6px 9px;margin-bottom:8px;word-break:break-all}
  .card .theme{font-size:12.5px;color:var(--accent2);margin-bottom:6px}
  .tag{display:inline-block;background:var(--chip);color:var(--accent2);border-radius:6px;padding:1px 8px;font-size:11px;margin:0 5px 5px 0}
  .tag.t{color:var(--accent)}
  .card .blurb{font-size:13px;color:#4a4339;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .badge.ok{background:#e4f3ea;color:var(--ok)}
  .badge.off{background:#f6e4e4;color:var(--off)}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  .mask{position:fixed;inset:0;background:rgba(40,32,20,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .mask.show{display:flex}
  .modal{background:var(--card);max-width:660px;width:100%;max-height:88vh;overflow:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 24px}
  .modal h2{margin:0 0 4px;color:var(--accent);font-size:21px;letter-spacing:.5px}
  .modal .m-meta{color:var(--muted);font-size:13px;margin-bottom:12px}
  .modal .m-blurb{background:#faf6ec;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;color:#3c352b}
  .modal .m-req{background:#f4f7f4;border:1px solid #d8e3d8;border-radius:10px;padding:11px 14px;font-size:13.5px;color:#2f3a2f}
  .modal .m-pay{background:#fff4e2;border:1px solid #e9cf9f;border-radius:10px;padding:11px 14px;font-size:14px;color:#5a3a0e;font-weight:600}
  .modal .kv{font-size:14px;color:#3c352b;margin:6px 0}
  .modal .kv span{color:var(--muted)}
  .modal .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .btn.alt{background:var(--accent2)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .close{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:18px;border-top:1px solid var(--line)}
  a{color:var(--accent)}
</style>
</head>
<body>
<div style="text-align:center;background:#f1ece1;padding:5px">示例体验，数据仅保留在本页 <button onclick="resetDemo()">恢复示例</button></div><header>
  <h1>写作变现 · 投稿征稿渠道检索台</h1>
  <p>文学期刊 / 报纸副刊 / 综合报刊 / 公众号 / 网文平台 / 征文活动 全渠道搜集整理 · 资料仅供参考，投稿前请核实最新公告</p>
  <div class="tabs" id="tabs">
    <div class="tab on" data-view="all">全部</div>
    <div class="tab" data-view="literary">文学刊物 <span class="count" id="cLiterary"></span></div>
    <div class="tab" data-view="press">综合报刊 <span class="count" id="cPress"></span></div>
    <div class="tab" data-view="newspaper">报纸评论/副刊 <span class="count" id="cNewspaper"></span></div>
    <div class="tab" data-view="wechat">公众号 <span class="count" id="cWechat"></span></div>
    <div class="tab" data-view="webnovel">网文/短篇 <span class="count" id="cWebnovel"></span></div>
    <div class="tab" data-view="event">征文活动 <span class="count" id="cEvent"></span></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7164" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="text" placeholder="搜索刊物名 / 主办 / 文体 / 主题 / 稿费关键词…" />
    </div>
    <div class="stats" id="stats"></div>
    <select class="sort" id="sort">
      <option value="">稿酬：默认</option>
      <option value="high">稿酬：从高到低</option>
      <option value="low">稿酬：从低到高</option>
    </select>
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的结果，试试调整筛选条件。</div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<footer>共收录 <span id="total"></span> 条 · 邮箱/地址可能有调整，请通过各渠道官网或官微核实最新征稿启事</footer>

<!--LIT_DATA_START-->
<script>
// 写作变现投稿渠道检索台 · 数据文件
// 渠道信息可能变化，投稿前请核实最新公告。
const LIT_DATA = [{"id": 1, "name": "青禾文学（示例）", "type": "文学期刊", "region": "全国", "publisher": "青禾编辑部", "genres": ["散文", "诗歌"], "email": "example@example.com", "payment": "采用付酬", "blurb": "欢迎原创散文与诗歌。", "requirement": "请提交原创作品。", "updated": "示例", "anon": false}, {"id": 2, "name": "远方写作征文（示例）", "type": "征文活动", "region": "全国", "organizer": "远方编辑部", "genres": ["散文"], "deadline": "2099-12-31", "theme": "旅途", "prize": "示例奖项", "contact": "example@example.com", "blurb": "以旅途为主题的征文。", "requirement": "原创作品。", "updated": "示例", "anon": false}];

const ANON_IDS = [20,21,22,23,24,25,26,104,105,106,107,108,109,110,113,154,155,156,159,160,161,162,163,164,165,166,168,171,172,173,174,195

];
LIT_DATA.forEach(d => { d.anon = ANON_IDS.includes(d.id); });

</script>
<!--LIT_DATA_END-->
<script>
  const TODAY = new Date();
  const state = { view:"all", q:"", type:"", region:"", genre:"", status:"", anon:"", sort:"" };
  const $ = s => document.querySelector(s);
  const isEvent = d => ["征文活动", "征文大赛", "征文"].includes(d.type);
  const statusOf = d => { const deadline = /^\d{4}-\d{2}-\d{2}$/.test(d.deadline || "") ? new Date(d.deadline + "T23:59:59") : null; return !deadline || Number.isNaN(deadline.getTime()) ? "待确认" : deadline >= TODAY ? "进行中" : "已截止"; };
  const TYPE_GROUPS = { literary:["文学期刊","纯文学期刊","综合文学期刊","文学杂志","诗歌期刊","少年文学期刊","散文期刊","故事期刊","诗刊","内刊文学","报纸副刊"], press:["综合报刊","杂志","综合期刊","综合杂志","选刊","评论期刊","学术期刊","杂志栏目","科普杂志","作文指导期刊"], newspaper:["报纸评论","报纸副刊"], event:["征文活动","征文大赛","征文"], wechat:["公众号"], webnovel:["网文平台","平台","短故事平台","网络文学平台","非虚构写作平台"] };
  const viewTypes = v => v==="all" ? Object.values(TYPE_GROUPS).flat() : (TYPE_GROUPS[v]||[]);
  const inView = (d,v) => v === "all" || viewTypes(v).includes(d.type);

  // 计数
  const count = v => LIT_DATA.filter(d=>inView(d,v)).length;
  ["Literary","Press","Newspaper","Wechat","Webnovel","Event"].forEach(k=>{
    const n = count(k.charAt(0).toLowerCase()+k.slice(1));
    $("#c"+k).textContent = "(" + n + ")";
    const tab = document.querySelector('#tabs .tab[data-view="'+k.charAt(0).toLowerCase()+k.slice(1)+'"]');
    if(tab) tab.style.display = n ? "" : "none";
  });
  $("#total").textContent = LIT_DATA.length;

  // 稿费字段（核心）
  function payLine(d){
    if(d.payment) return d.payment;
    if(isEvent(d)) return d.prize || "奖金/证书（以官方公告为准）";
    if(d.type==="文学期刊"||d.type==="报纸副刊") return "稿费从优·按质量计酬（文学/副刊普遍千字200–600元，以用稿通知为准）";
    if(d.type==="报纸评论") return "采用付酬·评论稿费按质量计酬（省级大报评论稿费约500–1000元/千字，以用稿通知为准）";
    if(d.type==="网文平台") return "保底+分成+全勤机制（具体档位以平台规则为准）";
    return "采用付酬（以用稿通知为准）";
  }

  // 稿酬星级（1–5，用于排序与展示）
  function payScore(d){
    if(isEvent(d)) return statusOf(d)==="进行中" ? 4 : 3;
    if(d.type==="网文平台") return 5;
    if(d.type==="文学期刊" && !d.payment){
      if(/(花城|收获|当代|十月|人民文学|北京文学|芳草|诗刊|钟山|作家)/.test(d.name)) return 5;
      return 3;
    }
    const s = (d.payment||"") + " " + (d.name||"") + " " + (d.blurb||"");
    const m = s.match(/\d[\d,]{1,5}元/g);
    let max = 0;
    if(m){ m.forEach(x=>{ const v=parseInt(x.replace(/[,，]/g,''),10); if(v>max) max=v; }); }
    else {
      (s.match(/\d{2,6}/g)||[]).forEach(n=>{ const v=parseInt(n,10); if(v>1900 && v<2100) return; if(v>max) max=v; });
    }
    if(max>=2000) return 5;
    if(max>=800) return 4;
    if(max>=300) return 3;
    if(max>=100) return 2;
    if(max>0) return 1;
    return 2;
  }
  const STAR = "★★★★★";
  function starsHtml(d){
    const n = payScore(d);
    return '<span class="stars">' + STAR.slice(0,n) + '<span class="lv">稿酬' + n + '级</span></span>';
  }

  // 筛选组构建
  function buildFilters(){
    const f = $("#filters"); f.innerHTML = "";
    if(state.view === "event"){
      addGrp(f, "状态", [["进行中","进行中"],["已截止","已截止"],["待确认","待确认"]], "status", "evt");
      const evRegions = [...new Set(LIT_DATA.filter(isEvent).map(d=>d.region))].sort();
      addGrp(f, "地域", evRegions.map(r=>[r,r]), "region", "sec");
    } else {
      const types = state.view === "all" ? [...new Set(LIT_DATA.map(d => d.type).filter(Boolean))].sort() : viewTypes(state.view);
      addGrp(f, "类型", types.map(t=>[t,t]), "type");
      const regs = [...new Set(LIT_DATA.filter(d=>inView(d,state.view)).map(d=>d.region))].sort();
      addGrp(f, "地域", regs.map(r=>[r,r]), "region", "sec");
      const gens = [...new Set(LIT_DATA.filter(d=>inView(d,state.view)).flatMap(d=>d.genres||[]))].sort();
      if(gens.length) addGrp(f, "文体", gens.map(g=>[g,g]), "genre", "sec");
      addGrp(f, "投稿方式", [["无需实名","无需实名"]], "anon", "evt");
    }
  }
  function addGrp(host, label, pairs, key, cls){
    const lab = document.createElement("div"); lab.className="grp-label"; lab.textContent=label; host.appendChild(lab);
    const wrap = document.createElement("div"); wrap.style.width="100%";
    pairs.forEach(([txt])=>{
      const c = document.createElement("span");
      c.className = "chip" + (cls?(" "+cls):"");
      c.textContent = txt;
      c.onclick = ()=>{ state[key] = (state[key]===txt)?"":txt; render(); };
      wrap.appendChild(c);
    });
    host.appendChild(wrap);
  }

  function match(d){
    if(!inView(d, state.view)) return false;
    if(state.type && d.type!==state.type) return false;
    if(state.region && d.region!==state.region) return false;
    if(state.genre && !(d.genres||[]).includes(state.genre)) return false;
    if(state.status && isEvent(d) && statusOf(d)!==state.status) return false;
    if(state.anon && !d.anon) return false;
    if(state.q){
      const hay = (d.name+d.publisher+(d.organizer||"")+(d.theme||"")+d.region+(d.genres||[]).join("")
        +d.blurb+(d.email||"")+(d.contact||"")+(d.wechat||"")+(d.platform||"")+payLine(d)).toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  }

  function contactLine(d){
    if(isEvent(d)) return d.contact ? ("投稿邮箱：" + d.contact) : "投稿方式见官方公告";
    if(d.type==="公众号") return d.email ? ("投稿：" + d.email) : ("投稿：" + (d.wechat||"公众号后台"));
    return d.email ? ("投稿：" + d.email) : "投稿方式见官网";
  }

  function render(){
    buildFilters();
    document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.toggle("on", t.dataset.view===state.view));
    document.querySelectorAll("#filters .chip").forEach(c=>{
      if(state.type===c.textContent) c.classList.add("on");
      if(state.region===c.textContent) c.classList.add("on");
      if(state.genre===c.textContent) c.classList.add("on");
      if(state.status===c.textContent) c.classList.add("on");
      if(state.anon===c.textContent) c.classList.add("on");
    });

    let list = LIT_DATA.filter(match);
    if(state.sort==="high") list.sort((a,b)=>payScore(b)-payScore(a));
    else if(state.sort==="low") list.sort((a,b)=>payScore(a)-payScore(b));
    const grid = $("#grid"); grid.innerHTML="";
    $("#empty").style.display = list.length ? "none":"block";
    $("#stats").textContent = "显示 " + list.length + " / " + LIT_DATA.length + " 条" + (state.sort?" · 已按稿酬排序":"");

    list.forEach(d=>{
      const card = document.createElement("div");
      card.className="card";
      let head = '<h3>' + d.name + (isEvent(d)?'<span class="badge '+(statusOf(d)==="进行中"?"ok":"off")+'">'+statusOf(d)+'</span>':"") + '</h3>';
      let meta = '<div class="meta">' + d.type + ' · ' + d.region + ' · ' + (d.publisher||d.organizer||d.wechat||"") + ' ' + starsHtml(d) + (d.anon?' <span class="badge ok">无需实名</span>':"") + '</div>';
      let mid;
      if(isEvent(d)){
        mid = '<div class="theme">主题：' + (d.theme||"—") + ' ｜ 截稿：' + d.deadline + '</div>';
      } else {
        mid = '<div class="contact">' + contactLine(d) + '</div>'
            + '<div class="pay">稿费：' + payLine(d) + '</div>';
      }
      let tags = (d.genres||[]).map(g=>'<span class="tag">'+g+'</span>').join("");
      let blurb = '<div class="blurb">' + d.blurb + '</div>';
      card.innerHTML = head + meta + mid + (tags?'<div>'+tags+'</div>':"") + blurb;
      card.onclick=()=>openModal(d);
      grid.appendChild(card);
    });
  }

  function openModal(d){
    const m = $("#modal");
    const siteUrl = (d.site || "").match(/https?:\/\/[^\s（）"<>]+/)?.[0] || "";
    let html = '<button class="close" onclick="closeModal()">×</button><h2>'+d.name+'</h2>'+
      '<div class="m-meta">'+d.type+' · '+d.region+' · '+(d.publisher||d.organizer||d.wechat||"")+' '+starsHtml(d)+(d.anon?' <span class="badge ok">无需实名</span>':"")+'</div>';

    if(isEvent(d)){
      html += '<div class="kv"><span>截稿日期：</span>'+d.deadline+' <span class="badge '+(statusOf(d)==="进行中"?"ok":"off")+'">'+statusOf(d)+'</span></div>';
      html += '<div class="kv"><span>征文主题：</span>'+d.theme+'</div>';
      html += '<div class="kv"><span>主办单位：</span>'+d.organizer+'</div>';
      html += '<div class="kv"><span>奖项设置：</span>'+d.prize+'</div>';
      html += '<div class="kv"><span>投稿邮箱：</span>'+d.contact+'</div>';
    } else if(d.type==="公众号"){
      html += '<div class="kv"><span>平台：</span>'+(d.platform||"微信公众号")+'</div>';
      if(d.wechat) html += '<div class="kv"><span>公众号：</span>'+d.wechat+'</div>';
      html += '<div class="kv"><span>投稿方式：</span>'+(d.email||"公众号后台投稿")+'</div>';
      html += '<div class="m-pay">稿费：'+payLine(d)+'</div>';
      if(siteUrl) html += '<div class="kv"><span>相关链接：</span><a href="'+siteUrl+'" target="_blank" rel="noopener">'+siteUrl+'</a></div>';
    } else {
      html += '<div class="kv"><span>投稿邮箱：</span>'+(d.email||"以官网为准")+'</div>';
      html += '<div class="kv"><span>投稿地址：</span>'+(d.address||"—")+(d.postcode?("（邮编 "+d.postcode+"）"):"")+'</div>';
      html += '<div class="m-pay">稿费：'+payLine(d)+'</div>';
      if(siteUrl) html += '<div class="kv"><span>官方网站：</span><a href="'+siteUrl+'" target="_blank" rel="noopener">'+siteUrl+'</a></div>';
    }
    if(d.source||d.site) html += '<div class="kv"><span>核实来源：</span><a href="'+(d.source||d.site)+'" target="_blank" rel="noopener">查看核实来源</a>（2026-10-18 逐条核实）</div>';
    html += '<div class="row"><b>征稿要点</b><div class="m-blurb">'+d.blurb+'</div></div>';
    html += '<div class="row"><b>投稿要求</b><div class="m-req">'+d.requirement+'</div></div>';
    html += '<div class="row"><b>征稿文体</b>：'+(d.genres||[]).map(g=>'<span class="tag">'+g+'</span>').join("")+'</div>';
    html += '<div class="row" style="color:var(--muted);font-size:12px">数据整理：'+d.updated+'</div>';
    html += '<div class="acts">'+
      (siteUrl?'<a class="btn alt" href="'+siteUrl+'" target="_blank" rel="noopener">访问官网</a>':"")+
      '<button class="btn ghost" onclick="copyInfo('+d.id+')">复制投稿信息</button>'+
      '</div>';
    m.innerHTML = html;
    $("#mask").classList.add("show");
  }
  function closeModal(){ $("#mask").classList.remove("show"); }
  $("#mask").onclick = e=>{ if(e.target.id==="mask") closeModal(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  function copyInfo(id){
    const d = LIT_DATA.find(x=>x.id===id);
    let t = d.name + "\n类型：" + d.type + "｜地域：" + d.region + "｜主办：" + (d.publisher||d.organizer||d.wechat||"") +
      "\n征稿文体：" + (d.genres||[]).join("、") + "\n征稿要点：" + d.blurb + "\n投稿要求：" + d.requirement +
      "\n稿费：" + payLine(d);
    if(isEvent(d)) t += "\n截稿日期：" + d.deadline + "\n主题：" + d.theme + "\n投稿邮箱：" + d.contact;
    else if(d.type==="公众号") t += "\n平台：" + (d.platform||"微信") + "\n投稿方式：" + (d.email||d.wechat||"公众号后台");
    else t += "\n投稿邮箱：" + (d.email||"以官网为准") + "\n投稿地址：" + (d.address||"—");
    document.querySelector(".acts").insertAdjacentHTML("beforeend", "<span>示例体验：安装后可复制投稿信息</span>");
  }

  $("#q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
  $("#sort").addEventListener("change", e=>{ state.sort=e.target.value; render(); });
  document.querySelectorAll("#tabs .tab").forEach(t=>{
    t.onclick = ()=>{ state.view=t.dataset.view; state.type=state.region=state.genre=state.status=state.anon=""; render(); };
  });
  function resetDemo(){Object.assign(state,{view:"all",q:"",type:"",region:"",genre:"",status:"",anon:"",sort:""}); $("#q").value=""; $("#sort").value=""; closeModal(); render();}
  render();
</script>
</body>
</html>
