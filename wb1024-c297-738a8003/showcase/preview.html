<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{
  --bg:#f7f5f2; --card:#fff; --tx:#2f2a26; --tx2:#8a7f75;
  --brand:#e8622a; --brand2:#ff943d; --line:#ece6df; --gold:#f5b301;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
html,body{height:100%;}
body{background:#efece8;display:flex;align-items:center;justify-content:center;}
#app{position:relative;width:100%;max-width:430px;height:100vh;max-height:100vh;background:var(--bg);
  overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 16px 14px;
  border-radius:0 0 22px 22px;flex:none;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;}
.logo small{font-weight:400;opacity:.85;font-size:12px;margin-left:6px;}
.search{background:rgba(255,255,255,.22);border-radius:20px;padding:9px 14px;display:flex;align-items:center;gap:8px;}
.search input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;}
.search input::placeholder{color:rgba(255,255,255,.75);}
main{flex:1;overflow-y:auto;padding:12px 14px 90px;-webkit-overflow-scrolling:touch;}
.sec-title{font-size:16px;font-weight:800;margin:14px 0 10px;display:flex;align-items:center;gap:6px;}
.sec-title span{font-size:13px;color:var(--tx2);font-weight:500;}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cat{background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);
  cursor:pointer;transition:transform .1s;border:1.5px solid transparent;}
.cat:active{transform:scale(.94);}
.cat.on{border-color:var(--brand);background:#fff3ee;}
.cat .emo{font-size:26px;}
.cat .nm{font-size:12px;margin-top:4px;color:var(--tx);font-weight:600;}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:6px 14px;border-radius:16px;background:var(--card);font-size:13px;color:var(--tx2);
  border:1px solid var(--line);cursor:pointer;}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rc{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.06);
  cursor:pointer;transition:transform .12s;position:relative;}
.rc:active{transform:scale(.97);}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;}
.thumb .tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.35);color:#fff;font-size:10px;
  padding:3px 8px;border-radius:10px;backdrop-filter:blur(2px);}
.fav{position:absolute;top:6px;right:6px;font-size:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.info{padding:10px 11px 12px;}
.nm{font-size:14.5px;font-weight:700;color:var(--tx);line-height:1.3;}
.desc{font-size:11.5px;color:var(--tx2);margin-top:4px;height:30px;overflow:hidden;line-height:1.35;}
.meta{display:flex;gap:8px;margin-top:7px;font-size:11px;color:var(--tx2);align-items:center;}
.meta b{color:var(--brand);font-weight:700;}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px;}

/* 底部导航 */
nav{position:absolute;bottom:0;left:0;right:0;height:66px;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);display:flex;backdrop-filter:blur(8px);}
nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--tx2);cursor:pointer;}
nav div.on{color:var(--brand);font-weight:700;}
nav .ic{font-size:21px;}

/* 详情页 */
.sheet{position:absolute;inset:0;background:#fff;transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;z-index:30;}
.sheet.show{transform:translateY(0);}
.sh-head{height:170px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;font-size:76px;}
.back{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.3);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.sh-body{flex:1;overflow-y:auto;padding:16px 18px 30px;margin-top:-24px;background:#fff;border-radius:24px 24px 0 0;}
.sh-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.sh-desc{font-size:13px;color:var(--tx2);line-height:1.6;}
.stats{display:flex;gap:10px;margin:14px 0 6px;}
.stat{flex:1;background:#faf7f4;border-radius:14px;padding:10px 8px;text-align:center;}
.stat .v{font-size:15px;font-weight:800;color:var(--brand);}
.stat .k{font-size:11px;color:var(--tx2);margin-top:2px;}
.blk{margin-top:18px;}
.blk h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ing{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px dashed var(--line);font-size:13.5px;
  align-items:center;cursor:pointer;}
.ing .ck{width:17px;height:17px;border:1.6px solid #d8cfc6;border-radius:5px;margin-right:9px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
.ing.done .ck{background:var(--brand);border-color:var(--brand);}
.ing.done .n{text-decoration:line-through;color:#c3b9ae;}
.step{display:flex;gap:11px;margin-bottom:14px;}
.step .no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;
  font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.step .tx{font-size:13.5px;line-height:1.65;color:#3d3730;flex:1;}
.step .tx em{font-style:normal;color:var(--brand);font-weight:600;}
.tips{background:#fff8ed;border:1px solid #ffe3bf;border-radius:14px;padding:12px 14px;font-size:13px;
  line-height:1.7;color:#8a5a1e;}
.timer-btn{width:100%;padding:14px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(232,98,42,.3);margin-top:18px;}
/* 计时器浮窗 */
.timer-pop{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;}
.timer-pop.show{display:flex;}
.tbox{background:#fff;border-radius:22px;padding:26px 30px;text-align:center;width:250px;}
.tbox .tm{font-size:44px;font-weight:900;color:var(--brand);letter-spacing:2px;}
.tbox .lb{font-size:13px;color:var(--tx2);margin:6px 0 16px;}
.tbox button{border:none;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;margin:0 5px;}
.tbox .stop{background:#eee;color:#666;}
.tbox .pause{background:var(--brand);color:#fff;}
.empty{text-align:center;padding:60px 20px;color:var(--tx2);font-size:14px;}
.empty .e{font-size:52px;margin-bottom:12px;}
.hidden{display:none !important;}
</style></head><body>
<div id="app">
  <header>
    <div class="header-top">
      <div class="logo">🍳 小灶<small>家常菜谱 · 今天吃什么</small></div>
      <div id="randBtn" style="font-size:22px">🎲</div>
    </div>
    <div class="search">
      <span>🔍</span>
      <input id="q" placeholder="搜索菜名、食材，如「番茄」「鸡」">
    </div>
  </header>

  <main id="main"></main>

  <nav>
    <div class="on" data-tab="home"><div class="ic">🏠</div>首页</div>
    <div data-tab="cat"><div class="ic">🍲</div>分类</div>
    <div data-tab="fav"><div class="ic">❤️</div>收藏 <span id="favN" style="color:var(--brand); font-weight:700">0</span></div>
    <div data-tab="menu"><div class="ic">📝</div>菜单</div>
  </nav>

  <!-- 详情 -->
  <div class="sheet" id="sheet">
    <div class="sh-head" id="shHead">
      <div class="back" id="backBtn">‹</div>
      <span id="shEmo">🍜</span>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>

  <!-- 计时器 -->
  <div class="timer-pop" id="timerPop">
    <div class="tbox">
      <div class="tm" id="tmv">05:00</div>
      <div class="lb" id="tml">烹饪计时中...</div>
      <button class="pause" id="tPause">暂停</button>
      <button class="stop" id="tStop">结束</button>
    </div>
  </div>
</div>

<script>

const R = [
 {id:1,n:"番茄炒蛋",e:"🍅",cat:"家常",t:"10分钟",d:"简单",c:120,rate:4.9,
  bg:"linear-gradient(135deg,#ffd3a5,#fd6585)",
  desc:"国民第一道家常菜，酸甜下饭，3分钟出锅，新手零失败。",
  ing:[["鸡蛋","3个"],["番茄","2个(中等)"],["白糖","1小勺"],["盐","适量"],["葱花","少许"],["食用油","2大勺"]],
  steps:["鸡蛋打散，加<em>一小撮盐</em>搅匀；番茄去蒂切滚刀块。",
   "热锅倒油，油热后倒入蛋液，<em>待边缘凝固再用铲子推炒</em>，八分熟盛出。",
   "锅底留油下番茄块，中火炒到出汁变软，加白糖提鲜、少许盐。",
   "倒回鸡蛋翻炒均匀，让蛋块吸饱番茄汁，撒葱花出锅。"],
  tip:"番茄顶部划十字用开水烫30秒，皮一撕就掉，口感更细腻。加少许白糖能中和酸味。"},

 {id:2,n:"红烧肉",e:"🥘",cat:"家常",t:"90分钟",d:"进阶",c:680,rate:4.9,
  bg:"linear-gradient(135deg,#f6d365,#fda085)",
  desc:"色泽红亮、肥而不腻，入口即化的经典硬菜。",
  ing:[["五花肉","500g"],["冰糖","30g"],["生抽","2勺"],["老抽","1勺"],["料酒","3勺"],["姜片","4片"],["八角","2个"],["葱结","1个"],["热水","没过肉"]],
  steps:["五花肉切3cm见方块，冷水下锅加姜片料酒，<em>焯水3分钟</em>后温水冲净沥干。",
   "锅不放油，直接下肉块小火煸到微黄出油，盛出多余的油。",
   "另起锅小火炒化冰糖至<em>琥珀色</em>，立刻下肉块快速翻炒裹上糖色。",
   "加生抽老抽料酒炒香，倒入没过肉的热水，放姜片八角葱结。",
   "大火烧开转小火炖60分钟，最后<em>大火收汁</em>到汤汁浓稠挂勺。"],
  tip:"炒糖色是关键：冰糖变琥珀色马上下肉，过了会发苦。加热水不要冷水，肉质才不会柴。"},

 {id:3,n:"可乐鸡翅",e:"🍗",cat:"家常",t:"30分钟",d:"简单",c:320,rate:4.8,
  bg:"linear-gradient(135deg,#fbc2eb,#a6c1ee)",
  desc:"一罐可乐搞定，孩子最爱，甜咸鲜亮无难度。",
  ing:[["鸡中翅","10个"],["可乐","1罐(330ml)"],["生抽","2勺"],["姜","3片"],["料酒","1勺"],["盐","少许"],["白芝麻","少许"]],
  steps:["鸡翅两面各划两刀方便入味，冷水浸泡10分钟去血水。",
   "不粘锅少油，鸡翅<em>两面煎到金黄</em>，下姜片。",
   "倒入可乐没过鸡翅的2/3，加生抽料酒，大火烧开。",
   "转中小火焖15分钟，最后<em>大火收汁</em>到浓稠亮油，撒白芝麻。"],
  tip:"可乐本身很甜别再加糖。收汁时一定要守着锅，容易糊。"},

 {id:4,n:"清炒西兰花",e:"🥦",cat:"素菜",t:"10分钟",d:"简单",c:90,rate:4.6,
  bg:"linear-gradient(135deg,#a8e063,#56ab2f)",
  desc:"脆嫩翠绿，3分钟出锅的低卡快手菜。",
  ing:[["西兰花","1颗"],["蒜","3瓣"],["盐","适量"],["蚝油","1勺"],["食用油","1勺"]],
  steps:["西兰花切小朵，淡盐水浸泡10分钟后冲洗干净。",
   "水烧开加<em>几滴油和盐</em>，西兰花焯水40秒立刻捞出过冷水。",
   "热锅下油爆香蒜末，倒入西兰花大火快炒30秒。",
   "加蚝油和少许盐炒匀立刻出锅。"],
  tip:"焯水加油能让西兰花保持翠绿，过冷水保持脆感。"},

 {id:5,n:"蒜蓉粉丝蒸虾",e:"🦐",cat:"海鲜",t:"20分钟",d:"普通",c:210,rate:4.8,
  bg:"linear-gradient(135deg,#ffecd2,#fcb69f)",
  desc:"十分钟蒸出饭店味，蒜香浓郁低脂高蛋白。",
  ing:[["大虾","10只"],["龙口粉丝","1把"],["蒜","1整头"],["蒸鱼豉油","2勺"],["小米辣","1个"],["葱花","少许"],["食用油","3勺"]],
  steps:["粉丝温水泡软；蒜切末分成两份，一半用油炸到金黄，另一半留生。",
   "虾开背去虾线，用刀<em>从背部片开但不切断</em>。",
   "粉丝铺盘底，虾摆在上面，把炸蒜和生蒜混合铺在虾背。",
   "水开后<em>大火蒸8分钟</em>，淋蒸鱼豉油，撒葱花，再浇一勺热油。"],
  tip:"一半炸蒜一半生蒜，香气层次最足。蒸太久虾肉会老，8分钟刚好。"},

 {id:6,n:"麻婆豆腐",e:"🌶️",cat:"川菜",t:"25分钟",d:"普通",c:280,rate:4.8,
  bg:"linear-gradient(135deg,#f78ca0,#fe9a8b)",
  desc:"麻、辣、烫、香、酥、嫩、鲜、活，川菜灵魂代表作。",
  ing:[["嫩豆腐","400g"],["牛肉末","100g"],["郫县豆瓣酱","1.5勺"],["花椒粉","1小勺"],["蒜末姜末","各1勺"],["生抽","1勺"],["水淀粉","适量"],["葱花","少许"]],
  steps:["豆腐切2cm方块，放<em>淡盐水里焯1分钟</em>定型去豆腥，捞出沥干。",
   "热油下牛肉末煸到酥香出油，加豆瓣酱蒜姜末炒出红油。",
   "加一碗水烧开，轻轻推入豆腐，<em>用锅铲背面推不要搅</em>，中火煮3分钟。",
   "淋水淀粉分两次勾芡，收汁亮油后撒大量花椒粉和葱花。"],
  tip:"花椒粉一定最后撒，遇高温会失去麻味。豆腐焯盐水不易碎。"},

 {id:7,n:"番茄牛腩",e:"🍲",cat:"汤羹",t:"120分钟",d:"进阶",c:520,rate:4.9,
  bg:"linear-gradient(135deg,#ff9a9e,#fecfef)",
  desc:"浓稠番茄汤汁裹着软烂牛腩，拌饭能吃三碗。",
  ing:[["牛腩","600g"],["番茄","4个"],["洋葱","半个"],["番茄膏","1勺(可选)"],["姜","4片"],["八角","1个"],["盐","适量"],["热水","足量"]],
  steps:["牛腩切块冷水焯，撇净浮沫后温水洗净。",
   "番茄顶部划十字烫去皮，2个切块炒成酱，2个留块后放。",
   "热油炒香洋葱丁和番茄块到<em>完全出汁成酱</em>，加番茄膏提味。",
   "下牛腩翻炒，加热水没过，放姜八角，小火炖<em>90分钟</em>。",
   "放入剩下的番茄块再炖15分钟，加盐调味。"],
  tip:"番茄要分两次放：前期化进汤里成底味，后期保留果块口感。"},

 {id:8,n:"青椒肉丝",e:"🫑",cat:"家常",t:"15分钟",d:"简单",c:230,rate:4.7,
  bg:"linear-gradient(135deg,#84fab0,#8fd3f4)",
  desc:"肉丝滑嫩、青椒脆爽，最经典的下饭组合。",
  ing:[["猪里脊","250g"],["青椒","3个"],["生抽","1勺"],["料酒","1勺"],["淀粉","1勺"],["蒜","2瓣"],["盐","少许"]],
  steps:["里脊逆纹切细丝，加料酒生抽淀粉和<em>1勺清水</em>抓匀腌10分钟，最后封一层油。",
   "青椒去籽切丝，蒜切末。",
   "热锅滑油，肉丝下锅快速划散到<em>变色即盛出</em>（约30秒）。",
   "底油爆香蒜末下青椒大火炒到虎皮状，倒回肉丝，加盐生抽炒匀出锅。"],
  tip:"腌肉时最后封一勺油，下锅不粘不坨，这是饭店嫩肉的秘密。"},

 {id:9,n:"蛋炒饭",e:"🍚",cat:"主食",t:"15分钟",d:"简单",c:380,rate:4.8,
  bg:"linear-gradient(135deg,#fddb92,#d1fdff)",
  desc:"隔夜饭的华丽转身，粒粒分明、金包银。",
  ing:[["隔夜米饭","2碗"],["鸡蛋","2个"],["葱花","适量"],["盐","适量"],["生抽","半勺"],["食用油","2勺"],["火腿丁/豌豆","可选"]],
  steps:["隔夜饭用手<em>抓散</em>，不要成一坨坨。",
   "鸡蛋打散，热油炒到半熟盛出。",
   "锅再加油，下米饭<em>中大火翻炒到粒粒跳动</em>，用铲背压散结块。",
   "倒回鸡蛋炒匀，加盐、生抽沿锅边淋入，撒大量葱花出锅。"],
  tip:"必须用冷饭！热饭含水多会炒成糊。饭要先在锅里炒透再加蛋。"},

 {id:10,n:"糖醋排骨",e:"🍖",cat:"家常",t:"45分钟",d:"普通",c:450,rate:4.9,
  bg:"linear-gradient(135deg,#ffd86f,#fc6262)",
  desc:"酸甜挂汁、色泽红亮，牢记「1234」黄金比例。",
  ing:[["肋排","500g"],["料酒","1勺"],["生抽","2勺"],["白糖","3勺"],["香醋","4勺"],["姜片","3片"],["熟白芝麻","少许"]],
  steps:["排骨冷水下锅焯水，撇沫捞出洗净擦干。",
   "热锅把排骨<em>煎到两面微焦</em>，下姜片。",
   "按<em>1酒2酱3糖4醋</em>调入，加没过排骨的热水。",
   "大火烧开转小火焖30分钟，最后大火收汁至<em>浓稠挂汁</em>。",

const CATS = [["全部","🍽️"],["家常","🏠"],["川菜","🌶️"],["素菜","🥬"],["海鲜","🦐"],["汤羹","🍲"],["主食","🍚"],["早餐","🌅"],["西餐","🍝"]];
const DIFFS = ["全部难度","简单","普通","进阶"];

let favs = [];
let menu = [];
let tab = 'home', cat = '全部', diff = '全部难度', kw = '';
const main = document.getElementById('main');
const $ = id => document.getElementById(id);

function save(){ $('favN').textContent = favs.length; }

function card(r){
  const f = favs.includes(r.id);
  return `<div class="rc" data-id="${r.id}">
    <div class="thumb" style="background:${r.bg}">
      <span>${r.e}</span>
      <div class="tag">${r.cat}</div>
      <div class="fav" data-fav="${r.id}">${f?'❤️':'🤍'}</div>
    </div>
    <div class="info">
      <div class="nm">${r.n}</div>
      <div class="desc">${r.desc}</div>
      <div class="meta"><span class="stars">${'★'.repeat(Math.round(r.rate))}</span>${r.rate}
        <span>·</span><span>${r.t}</span></div>
    </div></div>`;
}

function filtered(){
  let list = R.slice();
  if(tab==='fav') list = list.filter(r=>favs.includes(r.id));
  if(tab==='menu') list = list.filter(r=>menu.includes(r.id));
  if(cat!=='全部' && tab!=='fav' && tab!=='menu') list = list.filter(r=>r.cat===cat);
  if(diff!=='全部难度') list = list.filter(r=>r.d===diff);
  if(kw){
    const k = kw.trim().toLowerCase();
    list = list.filter(r=> (r.n+r.desc+r.cat+r.ing.map(i=>i[0]).join('')).toLowerCase().includes(k));
  }
  return list;
}

function render(){
  const list = filtered();
  let html = '';
  if(tab==='home'){
    const today = R.filter(r=>r.rate>=4.8).slice(0,6);
    html += `<div class="sec-title">🔥 今日推荐 <span>高分必吃</span></div><div class="list">${today.map(card).join('')}</div>`;
    html += `<div class="sec-title">⚡ 快手菜 <span>15分钟内搞定</span></div><div class="list">${R.filter(r=>parseInt(r.t)<=15).slice(0,4).map(card).join('')}</div>`;
  } else {
    if(tab!=='fav' && tab!=='menu'){
      html += `<div class="cats">${CATS.map(c=>`<div class="cat ${cat===c[0]?'on':''}" data-cat="${c[0]}"><div class="emo">${c[1]}</div><div class="nm">${c[0]}</div></div>`).join('')}</div>`;
      html += `<div class="filters">${DIFFS.map(d=>`<div class="chip ${diff===d?'on':''}" data-diff="${d}">${d}</div>`).join('')}</div>`;
    }
    const title = tab==='fav' ? '我的收藏' : tab==='menu' ? '今日菜单' : `${cat} · ${list.length}道`;
    html += `<div class="sec-title">🍽️ ${title}</div>`;
    html += list.length ? `<div class="list">${list.map(card).join('')}</div>`
      : `<div class="empty"><div class="e">🍽️</div>还没有内容，去首页发现美食吧</div>`;
  }
  main.innerHTML = html;
  main.scrollTop = 0;
}

// 事件委托
main.addEventListener('click', e=>{
  const c = e.target.closest('.cat'), ch = e.target.closest('.chip');
  const f = e.target.closest('[data-fav]'), rc = e.target.closest('.rc');
  if(c){ cat = c.dataset.cat; render(); return; }
  if(ch){ diff = ch.dataset.diff; render(); return; }
  if(f){ e.stopPropagation(); const id = +f.dataset.fav;
    const i = favs.indexOf(id); i>=0 ? favs.splice(i,1) : favs.push(id);
    f.textContent = favs.includes(id)?'❤️':'🤍'; save();
    if(tab==='fav') render(); return; }
  if(rc){ open(+rc.dataset.id); }
});

// 详情
function open(id){
  const r = R.find(x=>x.id===id);
  if(!r) return;
  $('shHead').style.background = r.bg;
  $('shEmo').textContent = r.e;
  const inMenu = menu.includes(id);
  $('shBody').innerHTML = `
    <div class="sh-title">${r.n}</div>
    <div class="sh-desc">${r.desc}</div>
    <div class="stats">
      <div class="stat"><div class="v">${r.t}</div><div class="k">用时</div></div>
      <div class="stat"><div class="v">${r.d}</div><div class="k">难度</div></div>
      <div class="stat"><div class="v">${r.c}</div><div class="k">千卡/份</div></div>
      <div class="stat"><div class="v">★ ${r.rate}</div><div class="k">评分</div></div>
    </div>
    <div class="blk"><h3>🥕 食材清单 <span style="font-size:12px;color:var(--tx2);font-weight:400">点击可勾选</span></h3>
      ${r.ing.map((i,n)=>`<div class="ing" data-n="${n}"><div class="n"><span class="ck">✓</span>${i[0]}</div><div style="color:var(--tx2)">${i[1]}</div></div>`).join('')}
    </div>
    <div class="blk"><h3>👩‍🍳 做法步骤</h3>
      ${r.steps.map((s,i)=>`<div class="step"><div class="no">${i+1}</div><div class="tx">${s}</div></div>`).join('')}
    </div>
    <div class="blk"><h3>💡 小贴士</h3><div class="tips">${r.tip}</div></div>
    <button class="timer-btn" id="startT">⏱ 开始烹饪计时（${r.t}）</button>
    <button class="timer-btn" id="addMenu" style="background:${inMenu?'#8a7f75':'linear-gradient(135deg,#ff943d,#ffb347)'}">
      ${inMenu?'✓ 已加入今日菜单':'📝 加入今日菜单'}</button>`;
  $('sheet').classList.add('show');
  $('shBody').scrollTop = 0;

  $('shBody').querySelectorAll('.ing').forEach(el=> el.onclick = ()=> el.classList.toggle('done'));
  let mins = parseInt(r.t)||10; if(mins>60) mins=Math.min(mins,30);
  $('startT').onclick = ()=> startTimer(mins*60, r.n);
  $('addMenu').onclick = function(){
    const i = menu.indexOf(id); i>=0 ? menu.splice(i,1) : menu.push(id);
    save(); this.textContent = menu.includes(id)?'✓ 已加入今日菜单':'📝 加入今日菜单';
  };
}
$('backBtn').onclick = ()=> $('sheet').classList.remove('show');

// 计时器
let tLeft=0, timer=null, running=false;
function fmt(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startTimer(sec, name){
  tLeft = sec; running = true;
  $('tml').textContent = `正在做「${name}」`;
  $('tmv').textContent = fmt(tLeft);
  $('timerPop').classList.add('show');
  clearInterval(timer);
  timer = setInterval(()=>{
    if(!running) return;
    tLeft--; $('tmv').textContent = fmt(Math.max(tLeft,0));
    if(tLeft<=0){ clearInterval(timer); beep(); alert('⏰ 时间到！出锅开饭啦～'); $('timerPop').classList.remove('show'); }
  }, 1000);
}
$('tPause').onclick = function(){ running=!running; this.textContent = running?'暂停':'继续'; };
$('tStop').onclick = ()=>{ clearInterval(timer); $('timerPop').classList.remove('show'); };

function beep(){
  try{
    const a = new (window.AudioContext||window.webkitAudioContext)();
    [880,660,880,1175].forEach((f,i)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.25, a.currentTime+i*.25);
      g.gain.exponentialRampToValueAtTime(.001, a.currentTime+i*.25+.24);
      o.connect(g); g.connect(a.destination);
      o.start(a.currentTime+i*.25); o.stop(a.currentTime+i*.25+.25);
    });
  }catch(e){}
}

// 搜索
$('q').addEventListener('input', e=>{ kw = e.target.value; if(kw && tab==='home'){ tab='cat'; document.querySelectorAll('nav > div').forEach(x=>x.classList.toggle('on',x.dataset.tab==='cat')); } render(); });
// 随机
$('randBtn').onclick = ()=>{ open(R[Math.floor(Math.random()*R.length)].id); };
// tab
document.querySelectorAll('nav > div').forEach(d=> d.onclick = ()=>{
  document.querySelectorAll('nav > div').forEach(x=>x.classList.remove('on'));
  d.classList.add('on'); tab = d.dataset.tab; render();
});

save();
render();
</script></body></html>
