<div class="modal-back hidden" id="modal"><div class="modal"><h2 id="modal-title">写下一句话</h2><p id="modal-subtitle">小小的分享，会让共同的旅程更有温度。</p><select id="comment-author" aria-label="留言身份"><option value="mom">妈妈</option><option value="dad">爸爸</option></select><textarea id="comment-text" placeholder="今天想说些什么？"></textarea><div class="modal-actions"><button id="cancel">取消</button><button class="primary" id="save-comment">保存这句话</button></div></div></div></div><div class="modal-back hidden" id="profile-modal"><div class="modal"><h2>给彼此一个称呼</h2><p>你们的称呼会显示在共同旅程和留言里。</p><label for="mom-name">妈妈的称呼</label><input id="mom-name" placeholder="妈妈"><label for="dad-name">爸爸的称呼</label><input id="dad-name" placeholder="爸爸"><div class="modal-actions"><button id="profile-cancel">取消</button><button class="primary" id="profile-save">保存称呼</button></div></div></div><div class="modal-back hidden" id="pregnancy-modal"><div class="modal"><h2 id="pregnancy-title">报喜：确认怀孕了</h2><p id="pregnancy-sub">填写末次月经的第一天，我们会帮你算好孕周和预产期，每周清单也会自动跟上。</p><label for="lmp-input">末次月经开始日期</label><input type="date" id="lmp-input"><p class="mini-hint">记不清具体日期？先填大概日期，之后随时可以修改，产检时医生也会帮你校准。</p><div class="modal-actions"><button id="pregnancy-back" class="hidden">回到备孕清单</button><button id="pregnancy-cancel">取消</button><button class="primary" id="pregnancy-save">保存，进入孕周模式</button></div></div></div><div class="reward hidden" id="reward">✦ 又完成了一件事，你们真的很棒！</div>
`;async function i(e,t=[]){return demoSQL(e,t)}function Y(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),e=>e.toString(16).padStart(2,"0")).join("")}var S={prepare:{"1":{theme:"把期待说出来",note:"先聊聊彼此想要的生活，不需要立刻做出所有决定。",tasks:[["mom","写下备孕的三个期待","找个安静的晚上，两个人各写各的再交换。可以是很实际的（想住得离医院近一些），也可以是很情绪化的（希望宝宝像谁）。写下来再聊，比口头想到哪说到哪更容易聊到深处。"],["dad","约一次不赶时间的谈话","选一个没有工作消息打扰的晚上，认真聊聊。她担心的可能是身体、工作或钱——先完整听完，再说说你的想法，不用急着给解决方案，被理解本身就是支持。"],["mom","记录月经周期起点","在日历或经期 App 里记下这次月经的第一天，往后每次都记。坚持两三个月就能看出自己的周期规律，之后无论是安排备孕还是验孕，这份记录都用得上。"],["dad","一起商量分工","把备孕要做的事摊开列出来：预约检查、买叶酸、调整饮食……按各自的擅长和时间分好，写下来。有了明确分工，就不容易出现「都以为对方做了」的情况。"]]},"2":{theme:"认识身体的节奏",note:"周期会有差异，记录是帮助了解自己。",tasks:[["mom","记下这周的身体感受","每天用一两句话记录：睡眠怎么样、情绪如何、有没有不舒服。备孕期间身体变化很容易被过度解读，留一份客观记录，之后看医生也说得清楚。"],["dad","整理既往病史与用药","翻一下自己的病历和体检报告，列出慢性病、做过的大手术、正在吃的药（包括保健品）。就诊时医生问起，不用临时想半天。"],["mom","选择顺手的周期记录方式","试试经期 App 或一本小日历，关键是每天顺手能记：月经第一天和天数、明显不适也写一笔。断了也不用自责，重新捡起来就好，记录是为了了解自己，不是打卡。"],["dad","预约双方的孕前咨询","孕前检查两个人都要做。挂号时问清楚：要不要空腹、女方要避开月经期吗、需要带什么资料，选一个两人都方便的时间一起去。"]]},"3":{theme:"把问题带给医生",note:"已有疾病、药物和补充剂都值得在孕前讨论。",tasks:[["mom","列出正在使用的药物与补充剂","把处方药、非处方药、中药、维生素全都列上，注明剂量和频率。有些药需要在孕前调整或替换，让医生判断，不要自己突然停药。"],["dad","整理想问的健康问题","平时想到什么就随手记进手机备忘录：「抽烟影响大吗」「我工作要接触化学品怎么办」。就诊时按担心的程度从高到低问，不容易漏。"],["mom","准备自己的健康史","写下自己的月经情况、既往病史、家族史（家里有没有糖尿病、高血压等），如果之前有过怀孕或流产经历也一并整理，就诊时医生都会问到。"],["dad","陪同讨论下一步安排","孕前咨询最好两人一起去。医生的建议常常是给两个人的（生活方式、戒烟戒酒都算），一起听才不会漏掉属于自己的那部分，也方便当场追问。"]]},"4":{theme:"照顾营养这件小事",note:"叶酸应在怀孕前开始；具体补充方案可和医生确认。",tasks:[["mom","向医生确认叶酸补充方案","叶酸建议从怀孕前 2-3 个月开始每天补（常见剂量 0.4mg），能明显降低胎儿神经管畸形的风险。具体剂量听医生的，有特殊情况的医生会加大剂量，别自己乱加。"],["dad","挑选一顿均衡的日常餐","不用一下子变成养生餐，先从一顿饭做起：有主食、有蛋白质（蛋、肉、豆）、有蔬菜。备孕是两个人的事，爸爸的作息和饮食同样影响状态。"],["mom","检查家中常备食材","看看家里零食、腌制品的占比，不用扔东西，下次采购换个清单：鸡蛋、牛奶、深色蔬菜、水果、坚果。让忙碌的时候也有舒服的选择。"],["dad","把营养建议整理成清单","把医生建议和权威渠道（如妇幼机构）的资料整理成一页备忘，贴冰箱上或存进共享相册。两个人照着同一张清单吃，比各自记容易坚持。"]]},"5":{theme:"核对疫苗与防护",note:"在孕前咨询中核对接种史、工作与生活暴露。",tasks:[["mom","整理自己的接种记录","翻出接种本或在接种记录平台查一查，重点看风疹、乙肝、水痘。有些疫苗（如风疹）孕期不能打，需要孕前补种并避孕一段时间，所以现在核对正合适。"],["dad","留意接触化学品的场景","想想工作和家务里有哪些接触化学品的机会：油漆、染发剂、杀虫剂、强效清洁剂。一条条记下来，就诊时问一句是否需要规避。"],["mom","整理双方接种记录","把两个人的接种记录放在一起核对，缺的、不确定的列成清单，带去孕前咨询让医生判断要不要补种。"],["dad","分担清洁和接触风险较高的家务","主动接手猫砂（家里养猫的话，弓形虫风险）、下水道疏通剂、园艺杀虫剂这类活。这不是客套，是实打实地降低风险。"]]},"6":{theme:"让生活慢慢稳下来",note:"睡眠、活动和减压都可以从适合自己的方式开始。",tasks:[["mom","选一种喜欢的轻活动","散步、瑜伽、游泳都可以，标准是「做完感觉舒服而不是累」。每周 3-4 次、每次 30 分钟左右，比偶尔突击运动一天有效得多。"],["dad","写下最能让自己放松的时刻","想想什么真正能让你放松：打球、打游戏、和朋友吃饭？给它固定个时间，每周留出来。备孕期的爸爸也有压力，别硬扛。"],["mom","安排一周的共同散步","约好一个固定时间，比如晚饭后 20 分钟。边走边聊，聊什么不重要，重点是让备孕这件事不那么像完成任务。"],["dad","主动接手一件耗神的家务","选一件她最烦的（比如洗碗、倒垃圾），这周开始固定归你。省下来的精力，让她能多休息一会儿。"]]},"7":{theme:"回看一个周期",note:"周期并不需要完美，观察变化比追求数字更有用。",tasks:[["mom","回看已记录的周期信息","看看这两三个月的记录：周期大概多少天、规律吗？周期在 21-35 天之间都算正常，偶尔波动一两天不用紧张。有疑问记下来，下次问医生。"],["dad","标记身体感觉不同的日子","帮她留意也留意自己：睡眠、精力、情绪。只做记录，别下「你是不是排卵了」这种结论——猜错比不猜更让人焦虑。"],["mom","问问这周需要哪种支持","直接问：「这周我做什么你会觉得轻松一点？」答案可能是陪散步、少聊怀孕话题，或者什么都不用做。她说什么就是什么。"],["dad","一起调整生活节奏","一起回顾这几个月：哪些习惯值得保留（早睡、散步），哪些在制造压力（天天测体温、刷论坛）。保留前者，放下后者。"]]},"8":{theme:"把情绪也放进计划",note:"等待常有不确定感，情绪值得被认真对待。",tasks:[["mom","写下等待时最常出现的心情","月经来的时候最难受？看到别人晒娃会酸？写下来。这些情绪非常正常，被自己看见、被伴侣知道，就不会变成闷在心里的石头。"],["dad","决定本周不想被追问的话题","和对方先对好口径：面对父母同事的追问，统一答「有了会告诉你们的」。想好这句话，被追问时就不至于尴尬或被迫透露。"],["mom","和亲友约好分享边界","和伴侣商量好：备孕进展只告诉谁、不告诉谁。两个人口径一致，谁被问到都这么答，避免一个人不小心说漏让另一个人难受。"],["dad","安排一次与结果无关的约会","看场电影、吃顿好的，全程不许聊怀孕。让两个人记起来：你们首先是彼此的伴侣，然后才是备孕队友。"]]},"9":{theme:"理解可能的下一步",note:"何时检测、何时求助，按实际周期和医生建议决定。",tasks:[["mom","把验孕相关疑问记下来","常见疑问：月经推迟几天测比较准？晨尿还是什么时候都行？一深一浅算吗？记下来查权威资料或问医生，别在论坛里越看越慌。"],["dad","整理过去几周的记录","把周期记录、身体变化、问过医生的问题整理到一处。如果之后需要求助生殖科，这些记录能帮医生快速了解情况，少走弯路。"],["mom","确认附近可咨询的医疗渠道","查好家附近靠谱的妇产医院或社区服务中心的挂号方式、门诊时间。心里有「要问医生该找谁」的答案，人就没那么慌。"],["dad","聊聊不同结果的应对","认真聊一次：这个月没中怎么办？多久没中就一起去求助？提前约定「无论哪种结果我们都是一伙的」，真遇到时没那么难熬。"]]},"10":{theme:"整理家庭支持网络",note:"未来的支持可以提前想好，不必把所有事扛在两个人身上。",tasks:[["mom","写下希望得到的帮助","备孕阶段最需要什么？可能是有人聊经验、可能是长辈别催。同时写下明确不想要的（比如「不要推荐偏方」），两个清单都留给伴侣看。"],["dad","挑选一位信任的人","想想有没有一个可以说真心话的朋友或家人。备孕的压力需要出口，但这个人要靠谱、不传话。"],["mom","列出可帮忙的家人朋友","想想将来如果需要帮忙（送医、搭把手），谁靠得住。只列你们俩都认可的人，现在心里有数就行。"],["dad","核对请假与就医安排","了解一下公司的请假政策、年假余额，看诊时间冲突了怎么办。提前想好，真要请假时不至于手忙脚乱。"]]},"11":{theme:"给计划留出弹性",note:"备孕没有统一进度，持续的压力可以和医生谈。",tasks:[["mom","回顾哪些习惯真正适合自己","这几个月下来，哪些做得舒服、哪些纯靠意志力硬撑？硬撑的部分可以放弃——备孕是长跑，能坚持下去的才是好习惯。"],["dad","记录想和医生讨论的变化","这段时间身体或情绪有什么变化？容易累、睡眠变差、莫名的烦躁，都记下来，下次问诊一起问。"],["mom","问一句「这周最辛苦的是什么」","认真地问，然后闭嘴听。很多时候她要的不是解决方案，只是被理解。听完先共情，再问「需要我做什么吗」。"],["dad","把清单减到可完成的程度","看看两个人的任务清单，是不是已经多到像第二份工作？划掉可有可无的项，留下真正重要的。轻松的氛围比满清单重要。"]]},"12":{theme:"一起复盘，继续同行",note:"十二周是一次温柔的回顾，不是成功与否的期限。",tasks:[["mom","回看这段时间的身体记录","把三个月的记录翻一遍，整理出最想问医生的问题和想保持的习惯。十二周是个温柔的节点，不是截止日期。"],["dad","写给自己一句感谢","备孕里爸爸的努力常被忽略。给自己写句话：「谢谢你没有缺席。」你的坚持不需要用结果来证明。"],["mom","和伴侣回顾两人的分工","聊聊这三个月的配合：哪些分工很顺？哪些名存实亡？保留最舒服的方式，调整不顺的。"],["dad","计划下一阶段的陪伴方式","无论有没有好消息，都商量好继续同行的方式。如果备孕超过一年未成功，下一步是两人一起看生殖科——这也是同行的一部分。"]]}},early:{"1":{theme:"从末次月经开始计算",note:"孕周从末次月经第一天起算，此时通常还无法确认怀孕。",tasks:[["mom","记下末次月经开始日期","翻回这个月月经来的第一天，精确到日记进备忘录，并设为置顶。产科说的「孕几周」全部从这一天算起，它是之后所有产检估算的基准。"],["dad","继续按孕前建议照顾自己","现在还无法确认是否怀孕，别急着找「害喜」「胸胀」等症状——孕 1-2 周其实还没排卵。继续好好吃饭睡觉，就是最好的准备。"],["mom","了解孕周的计算方法","孕周不是从受孕那天算，而是从末次月经第一天算：7 天 = 1 个孕周，全程约 40 周。举例：末次月经 10 月 1 日，到 10 月 29 日就是「孕 4 周」，虽然受孕可能只发生在两周前。预产期粗算：末次月经的月份减 3（不够减就加 9）、日期加 7。所以「孕 1 周」时其实还没怀孕，完全正常。"],["dad","和伴侣约好信息来源","两人约定只看这几类信息：产检医生说的、正规医院公众号和官方指南。别的（尤其是短视频和论坛里「绝对会/绝对不能」的说法）一律存疑。信息一致，才不会互相吓唬。"]]},"2":{theme:"保持原有的照顾",note:"这一周仍可能处于受孕前，先照顾好日常。",tasks:[["mom","维持已确认的营养安排","叶酸继续吃。这周可能刚排卵或刚受孕，不需要额外加补品。任何新加的药物（包括感冒药）在用之前先问一句医生。"],["dad","记录平时的睡眠与感受","你也在「备孕状态」里：熬夜、喝酒、压力大都会影响精子质量。顺手记录自己的作息，继续保持孕前的好习惯就好。"],["mom","准备一份方便的健康资料","把体检报告、病史、过敏史、在吃的药整理成一个文件夹（纸质或手机都行）。之后确认怀孕建档、首次问诊都用得上。"],["dad","安排轻松的共同活动","这周是等待结果的日子，安排点让两个人开心的事。别让「等等等」占满所有注意力。"]]},"3":{theme:"给不确定留一点空间",note:"是否受孕还难以判断，不用凭单个感受下结论。",tasks:[["mom","继续记录周期变化","如果有轻微出血、小腹坠胀，记下时间和感受就好。这些变化既可能来也可能不来，单凭感受判断不了是否怀孕，把疑问留给合适的检测时机。"],["dad","留意身体需要的休息","这句也是说给你自己的：两个人都别熬夜。她如果有轻微不适，陪着就是最好的帮助，不用分析原因。"],["mom","了解何时适合验孕","早早孕试纸一般在「下次月经该来没来」时测较准，用晨尿更敏感。测太早容易出现假阴性，白白失望一场。具体时机可以看试纸说明或问医生。"],["dad","约定看到结果时怎么陪伴","提前说好：不管结果是单杠还是双杠，第一句话都是「我们在一起」。这一条约定，比之后任何攻略都重要。"]]},"4":{theme:"确认消息与下一步",note:"月经推迟时可考虑检测；结果和时间不符可咨询医生。",tasks:[["mom","按合适时间使用验孕工具","月经推迟后用晨尿测，严格按说明书的时间读数（超时再看会出现假印）。结果拍照留存并记下日期；两条杠或一深一浅，过两三天再测一次看加深情况。"],["dad","如确认怀孕，联系孕期保健机构","验出两条杠后先别发朋友圈。查好当地建册/建档流程（很多城市要求孕 6-12 周内到社区卫生服务中心建册），打个电话问清需要什么材料。"],["mom","陪伴确认结果","看到结果的那一刻，先抱抱她，听她说。想哭想笑都陪着她，这时候最不需要的是「冷静分析」。"],["dad","把当前药物列给医生","把自己正在吃的药列出来问医生是否需要调整；她如果也在吃药，同样列出来。但别自作主张让她停处方药，停不停由医生判断。"]]},"5":{theme:"开始建立照护关系",note:"尽早联系产科或孕期保健机构，了解当地流程。",tasks:[["mom","记下最后一次月经日期","第一次就诊医生一定会问末次月经，答得准，孕周和预产期就估得准。顺手把这个日期设成手机置顶备忘。"],["dad","列出慢性病与既往怀孕经历","两人的慢性病、手术史、家族遗传病，以及她之前有无流产、宫外孕经历，都提前列好。首次问诊时间有限，提前准备能问得更全。"],["mom","查清当地建档入口","查清楚在哪建册（社区医院）、在哪产检建档（分娩医院）。很多地方建档名额紧张，孕 6-8 周就要动手。把电话、地址、所需材料记成一条清单。"],["dad","整理两个人的时间表","把接下来一个月的出差、加班高峰标出来，为首次产检和建档预留时间。产检一般在工作日白天，得提前协调。"]]},"6":{theme:"照顾早期的不舒服",note:"孕早期感受差异很大，持续或明显不适应求助。",tasks:[["mom","记录想向医生问的症状","孕早期的恶心、嗜睡、胸胀都很常见。记录：什么症状、什么时候开始、影不影响吃饭睡觉。但剧吐到无法进水、单侧剧烈腹痛、出血，别等记录了，直接就医。"],["dad","找出这周更容易入口的食物","如果她恶心，别劝「多吃点」。试试少量多餐、干一点的食物（苏打饼干、吐司）、避开油腻气味。能吃进什么就吃什么，这个阶段营养不是主要矛盾。"],["mom","询问她今天最需要什么","孕吐的日子，需求天天变。每天问一句，按当天的答案来：也许是安静地躺半小时，也许是你下楼买一碗酸汤面。"],["dad","备好就医联系方式","把产检医院咨询电话、附近急诊存进两个人手机。有担心的症状时，一个电话能省掉大半夜的胡思乱想。"]]},"7":{theme:"把问题写进清单",note:"第一次正式产检前，先准备最想得到的答案。",tasks:[["mom","写下对产检的三个问题","第一次全面问诊前，写下最想知道的：我要做哪些检查？工作要调整吗？问题控制在三个以内，医生时间有限，先问最关心的。"],["dad","确认营养补充与用药计划","带着她现在的补剂清单（叶酸等）问医生：继续吃吗？要加吗？把答案记下来，回家更新冰箱上的清单。"],["mom","整理检查资料与证件","身份证、医保卡、既往检查单、健康史文件夹放进一个文件袋。产检出门拿上就走，不用每次都翻箱倒柜。"],["dad","一起看首次问诊路线","提前查好医院停车、地铁出口、挂号窗口的位置，算上堵车时间早点出门。第一次产检的排队，常常比想象中久。"]]},"8":{theme:"初次产检的准备",note:"不少地区会在孕 8–12 周安排首次全面问诊，按当地预约为准。",tasks:[["mom","带上健康史参加首次问诊","首次问诊问得很细：月经史、孕产史、家族病史。如实说，包括情绪和睡眠的变化——这些都写在健康资料里，直接给医生看。"],["dad","询问后续筛查选项","问清接下来几个月的筛查时间表（NT、唐筛/无创等），以及每个选项的差别和费用。了解之后再一起决定，不用急着当场拍板。"],["mom","陪同或协助记录医生建议","医生交代的注意事项当场记下，离开诊室前复述一遍：下次产检时间、要做的检查、要注意什么。记不清的当场问。"],["dad","照顾产检当天的节奏","产检常要空腹抽血加长时间排队。提前带点吃的和水，排队时让她坐着等。把当天安排得松一点，别排成赶场。"]]},"9":{theme:"慢慢适应新的日常",note:"身体和情绪都可能变化，可以调整工作与生活节奏。",tasks:[["mom","观察哪些时段更需要休息","这两周困意可能说来就来。找出自己最困的时段（常见是下午两三点），能小睡就小睡，工作安排尽量往清醒的时段挪。"],["dad","记录想询问的工作与活动问题","比如「最近要出差能去吗」「能继续健身吗」这类问题，帮她记下来，产检时统一问医生，别问搜索引擎。"],["mom","接手一项固定家务","如果她嗜睡或孕吐，家务重新分工：把一件重的（拖地、做饭）固定到你头上，让她腾出时间休息。"],["dad","问问她今天的情绪颜色","「今天是什么颜色的？」这种问法比「你今天怎么样」更容易让她说出真实感受。孕早期激素波动大，情绪起伏是生理现象，不是矫情。"]]},"10":{theme:"理解筛查的选择",note:"孕早期筛查有不同选项与时间窗，选择应充分知情。",tasks:[["mom","了解当地可选的产前筛查","孕早期筛查主要是 NT 超声（11-13+6 周），之后还有唐筛、无创 DNA 等选项，准确率和价格各不同。把优缺点列下来，和医生讨论后再选。"],["dad","核对已预约的检查日期","把已约的 NT 等检查写进两人共享日历，设提前一天提醒。NT 有严格的时间窗，错过了只能换方案。"],["mom","一起阅读正规机构的说明","找卫健委或正规医院发布的产筛科普一起读，读懂「筛查高风险不等于确诊」这类关键概念。读完一起讨论，别替对方做选择。"],["dad","安排检查日的陪伴","NT 检查有时宝宝姿势不对要重做，时间难料。提前把当天下午留空，无论结果怎样，出来后一起吃顿饭。"]]},"11":{theme:"为早孕超声做准备",note:"一些地区在 11–14 周安排超声与相关筛查。",tasks:[["mom","确认超声预约与注意事项","确认 NT/早孕超声的预约单：时间、楼层、要不要空腹或憋尿。有疑问直接打医院电话，别靠猜。"],["dad","写下希望了解的信息","检查时可以问的：宝宝大小和孕周相符吗？下次检查是什么？提前写在备忘录里，进了诊室就不会脑子空白。"],["mom","准备交通与预约信息","把预约单截图、医院地址、出发时间发给对方。第一次做超声容易紧张，流程越顺心越稳。"],["dad","商量检查后怎样放松","无论结果如何，安排一个简单的放松：吃顿好的、散个步、看场电影。等待的这两周，需要一点甜。"]]},"12":{theme:"整理孕早期的发现",note:"检查结果和孕周估算可在医生帮助下理解。",tasks:[["mom","与医生核对预产期估算","医生会根据超声（尤其是 11-13 周测的头臀长）校准预产期，这比按末次月经估的更准。以后说孕周，就以医生校准后的为准。"],["dad","整理检查结果与待问事项","把孕早期所有报告拍照归档（手机建个相册），没听懂的结果列出来，下次产检一次问清。"],["mom","陪她复述医生给出的重点","让她说说这次医生的重点是什么，你帮着补充。两个人都听过、都复述过，之后就不容易传错或忘掉。"],["dad","一起庆祝走过这一段","孕早期是最难熬的一段：孕吐、紧张、各种检查。走过来了，值得小小庆祝一下——这也会成为你们以后常讲起的回忆。"]]}},middle:{"13":{theme:"走进孕中期",note:"这不是必须立刻精力充沛的一周，继续按身体感受调整。",tasks:[["mom","回顾早孕期最有帮助的做法","哪些做法让早孕反应好受些？少食多餐、午睡？把它们保留下来。孕中期整体舒服些，但每个人节奏不同，按自己的身体来。"],["dad","记录现在最想改善的一件事","睡眠、腰酸、工作强度？挑一件最想解决的，写下来带去下次问诊，让医生给具体建议。"],["mom","重新分配近期家务","她体力回升了，但子宫也在变大。家务按体力重新分：重活弯腰活归你，轻的可以继续。主动提出，别等她开口。"],["dad","计划一次轻松外出","孕中期是整个孕期体力最好的窗口期，适合短途旅行或郊游。由她定节奏：行程松、随时能休息、有干净的卫生间。"]]},"14":{theme:"重新找回舒服的节奏",note:"饮食、活动和休息都可以慢慢建立稳定感。",tasks:[["mom","给自己安排一个稳定的休息时段","把「休息」写进日程，而不是等忙完再说。比如每天午后 20 分钟，躺着把脚垫高。规律休息比周末报复性补觉有效。"],["dad","和医生讨论适合的活动方式","孕中期适合快走、游泳、孕妇瑜伽，但有前置胎盘等情况要遵医嘱。下次产检问一句，把运动变成两个人的习惯。"],["mom","整理一周家务安排","把家务列成一周计划（哪天买菜、哪天打扫），贴出来。有计划，就没有「怎么又没做饭」的互相埋怨。"],["dad","准备一份喜欢的日常食谱","收集 6-8 道两人都爱吃、一刻钟能做出来的菜。孕中期她胃口回来了，但晚上容易累，快手菜是生活质量的保底。"]]},"15":{theme:"把问题带去复诊",note:"下一次问诊可以谈症状、检查结果和情绪。",tasks:[["mom","列出本月最想问的变化","白带变多、便秘、情绪波动……只要让你困扰的都值得问。医生见过太多类似问题，你觉得难以启齿的，对他们都是日常。"],["dad","核对检查结果中看不懂的词","把上次报告里没懂的术语列出来（比如「羊水深度」），请医生解释。看不懂的报告不要上网搜，越搜越怕。"],["mom","把问题写进共享清单","建一个共享备忘录叫「问医生」，想到就往里加。就诊时打开照着问，结束前确认都问过了。"],["dad","确认下次预约的时间地点","中期筛查类检查有严格时间窗。确认下次产检的时间和地点，提前跟工作协调好。"]]},"16":{theme:"关注自己的感受",note:"孕中期就诊会继续关注健康与生活感受。",tasks:[["mom","在复诊时说出最近的身心变化","睡眠变浅、莫名想哭、对宝宝健康特别担心——这些都要说。孕期情绪问题很常见也有成熟的干预办法，越早说越好。"],["dad","询问接下来超声的时间","大排畸（系统超声）一般在 20-24 周，名额紧张。问清时间和预约方式，尽早约上。"],["mom","陪同整理复诊重点","复诊出来花两分钟对一遍：医生说了什么、下次什么时候来。两人记一致，避免日后「你当时没说」。"],["dad","安排一个不被打扰的晚上","手机放一边，聊聊各自最近的感受——包括你对当爸爸的期待和害怕。这种对话在孕期多进行几次，会一直受益。"]]},"17":{theme:"为中期超声留好时间",note:"详细超声常安排在 18–22 周左右，具体以当地为准。",tasks:[["mom","写下想了解的超声问题","大排畸查什么？如果发现「软指标」异常怎么办？提前写好带去，检查时问医生。"],["dad","确认检查日的休息与工作安排","大排畸可能 30 分钟到 2 小时不等，宝宝不配合还要出去走走再回来。给自己也留出弹性，别把当天排太满。"],["mom","核对超声预约与路线","确认预约单：时间、医院、楼层。大医院的超声常要提前取号，搞清流程免得白跑一趟。"],["dad","在结果出来前约好沟通方式","提前约定：如果当场有「建议进一步检查」的说法，我们听完所有解释、问完问题再回应，不当场慌乱做决定。"]]},"18":{theme:"认真听懂检查说明",note:"中期超声用于观察胎儿发育，也可能需要后续解释。",tasks:[["mom","按预约参加中期超声","大排畸主要查胎儿的结构发育。报告上如果出现「左心室强光点」等字样，别慌，大概率是正常变异——当场请医生解释清楚再走。"],["dad","记录检查后的感受","第一次「看见」宝宝的样子，很多人会突然觉得「真的有孩子了」。把自己的感受记下来或说给她听，这是很珍贵的时刻。"],["mom","陪伴完成检查日","超声排队久是常态，带着水和零食，排队时聊天分散紧张。如果她需要走动让宝宝换姿势，陪她走。"],["dad","把报告存到同一处","所有报告归到一个文件夹，命名统一（如「0312-大排畸」）。后面每次产检都要带越来越厚的资料，一开始就理清楚。"]]},"19":{theme:"留意身体的新变化",note:"有人会在孕中期开始感觉到胎动，出现时间因人而异。",tasks:[["mom","留意是否出现新的轻微动作感","初产妇常在 18-22 周第一次感到胎动，像小鱼吐泡、蝴蝶扇翅。感觉到就记下日期；没感觉到也别慌，和胎盘位置有关，下次产检提一句。"],["dad","询问医生需要关注的身体变化","问医生：什么情况需要立即联系（出血、持续腹痛、剧烈头痛等）？把这些「红线」记下来贴冰箱上，两个人都清楚。"],["mom","了解胎动出现时间的差异","胎动早晚个体差异很大，经产妇往往更早感到。不要拿「别人 16 周就动了」来比较，那是没有意义的压力。"],["dad","一起散步聊聊身体感受","晚饭后散步时让她说说身体最近的感觉，当分享不当汇报。如果她愿意，把手放在肚子上一起等一次胎动——很多爸爸第一次被打动就在这时。"]]},"20":{theme:"一起理解中期结果",note:"检查解释应交给专业人员，不必独自解读报告。",tasks:[["mom","带中期超声结果与医生沟通","大排畸报告如果有「建议复查」的字样，下次产检带上报告，请医生解释清楚是常规复查还是需要进一步检查。"],["dad","记录接下来想了解的事情","孕中期是了解育儿的好时机：孕妇学校、无痛分娩讲座。把想了解的事记下来，有机会就报名。"],["mom","陪同听取结果说明","听解释时没听懂就当场问，可以请医生用通俗的话再说一遍。离开诊室再想问，就难了。"],["dad","整理后续预约","糖耐（24-28 周）、下次产检，把日期放进共享日历。孕中期检查一个接一个，全靠日历，不靠脑子。"]]},"21":{theme:"让家更适合休息",note:"从日常的小调整开始，不需要一次买齐所有东西。",tasks:[["mom","观察家中哪个位置最适合休息","肚子渐大后，原来的沙发可能不够撑腰。试试家里哪里休息最舒服，需要加个靠枕、换把椅子，就说出来。"],["dad","为自己留一段不被打扰的时间","你也需要喘息。每周固定留 1-2 小时做自己的事，安排好了，两个人的状态都会更好，这不自私。"],["mom","调整常用物品的位置","把高频用的东西（水杯、零食、充电器）放到不用弯腰就够得到的地方。肚子大起来后，弯腰捡东西会越来越费劲。"],["dad","列出真正需要采购的物品","母婴用品五花八门。先列「真正必须」的（安全座椅、婴儿床、基础衣物），其他观望。别被种草视频牵着走。"]]},"22":{theme:"谈谈未来的育儿分工",note:"提前聊分工，有助于以后少靠猜。",tasks:[["mom","写下最希望被分担的三件事","夜奶？换尿布？还是坐月子的安排？写下最在意的三件，越具体越好——「多帮忙」太空，「夜里的每次换尿布归你」才可执行。"],["dad","说出自己对产后支持的期待","你也说：希望她怎么支持你？希望老人来帮忙还是请月嫂？把期待摆到桌面上，产后才不会各自失望。"],["mom","列出自己能承担的固定事务","你想固定承担什么？做饭、采购、夜间支持？产后家里的事越固定越好，谁的事谁来，减少临场扯皮。"],["dad","听完再复述对方的期待","她说完后，用自己的话复述一遍：「你的意思是……对吗？」确认理解一致再讨论，能避开八成的误解。"]]},"23":{theme:"了解下一段检查",note:"妊娠糖尿病相关检查常在 24–28 周评估，按医生安排。",tasks:[["mom","询问是否需要糖代谢相关检查","糖耐量试验一般在 24-28 周做：空腹喝糖水、抽三次血，全程约 2-3 小时。向医生确认自己的预约安排和准备事项。"],["dad","整理近期饮食与身体疑问","体重增长、水肿、饮食忌口……把最近想问的记下来。糖耐前后医生可能给饮食建议，两个人可以一起调整。"],["mom","确认检查可能需要的准备","糖耐前一天晚上 10 点后通常要禁食，当天带水杯和早餐（抽完第三次血才能吃）。具体流程问清医院，各家略有不同。"],["dad","提前协调检查时间","糖耐会占一整个上午。提前请假或调休，最好陪她去——空腹饿着排队的滋味不好受。"]]},"24":{theme:"照顾成长中的身体",note:"关注身体变化，任何担忧都可以联系孕期照护团队。",tasks:[["mom","把新出现的不适记下来","腰酸、腿抽筋、耻骨痛……记下出现的部位和时间。多数是负担加重的正常信号，但持续加重的要让医生看。"],["dad","与医生核对本周的检查安排","确认糖耐结果出来后的复诊安排。如果确诊妊娠糖尿病，会有饮食指导和血糖监测方案，需要两个人一起配合。"],["mom","把常用的就医电话存好","产检医院、产科急诊、建册社区的电话存进通讯录并置顶。出现任何担心的情况，先打电话，而不是先上网搜。"],["dad","安排一次轻松的共同晚餐","不谈产检、不谈待产包，就吃饭聊天。孕中期难得的平稳时光，值得好好享受。"]]},"25":{theme:"继续关注身心状态",note:"一些地区此时安排随访，尤其是首次怀孕者。",tasks:[["mom","按预约参加随访","很多地区初产妇在孕中期有随访（社区或医院），聊聊睡眠、情绪、体重。如实说就好，随访不是考试。"],["dad","问清接下来需要关注什么","借随访问医生：接下来一个月要重点留意什么？胎动怎么数？把要点记下来。"],["mom","陪同整理随访后的安排","随访后的新安排（下次时间、注意事项）写进共享备忘录。信息越清楚，心里越踏实。"],["dad","讨论产后可获得的帮助","开始认真讨论：月嫂、月子中心还是老人帮忙？各自的利弊和预算摆一摆。这个决定越早定，越能约到好的资源。"]]},"26":{theme:"为后半程做一次整理",note:"计划可以更新，越具体越容易互相帮忙。",tasks:[["mom","回看孕中期的记录","翻一遍这十几周的记录，整理出还想和医生讨论的问题。孕中期快结束了，把没问的都问掉。"],["dad","整理现有检查资料","检查资料越来越多，按时间排序归档。可以开始准备一个「产检资料包」，住院时直接拎走。"],["mom","核对请假与陪诊计划","了解自己的产假、你的陪产假各有多少天、怎么申请。把数字放在一起看，规划产后的时间。"],["dad","一起检查家中物品清单","对照待产清单过一遍家里已有的，只补缺的。孕中期采购从容，别都堆到孕晚期。"]]},"27":{theme:"平稳走向下一阶段",note:"提前了解后期随访与分娩信息，保持节奏即可。",tasks:[["mom","询问下次复诊的具体安排","孕晚期产检频率会提高（从四周一次变成两周一次）。问清下阶段的时间表，提前排好日历。"],["dad","想一想对分娩最在意的问题","顺产还是剖宫产？要不要无痛？都可以问。先想清楚自己最在意什么，和她的想法一起带去和医生讨论。"],["mom","查找正规机构的分娩课程","找医院或正规机构办的孕妇学校（产程知识、呼吸法、母乳喂养），很多免费。和产检医院对口的最好。"],["dad","准备一份两个人的提问清单","把两人关于分娩的疑问汇总：什么时候该去医院？产程大概多久？陪产政策是什么？下次产检时问。"]]}},late:{"28":{theme:"进入孕晚期的照护",note:"这一阶段的检查与随访可能更频繁，按个人计划进行。",tasks:[["mom","按预约进行孕晚期随访","孕晚期产检变频繁，开始重点关注胎位、胎心。每次产检后，把医生的新指示记下来。"],["dad","说出睡眠和情绪的变化","孕晚期你也会睡不好、会紧张，这很正常，说出来。她需要知道你也在认真对待这件事，坦诚在这一阶段尤其重要。"],["mom","陪同复诊并记录安排","孕晚期信息量大（胎位、分娩方式讨论），陪同就诊帮忙记录，别让她一个人记住所有事。"],["dad","了解新生儿照护课程","找新生儿护理课程：洗澡、脐带护理、黄疸观察、呛奶急救。选能两个人一起参加的形式，一起学比一个人学再转述强得多。"]]},"29":{theme:"聊聊生产时的支持",note:"先谈希望被怎样陪伴，具体分娩方式和医生讨论。",tasks:[["mom","写下希望生产时有人如何支持","产房里希望他在身边吗？希望谁来陪？没有标准答案，写下此刻的想法就行，之后随时可以改。"],["dad","记录对疼痛管理的疑问","无痛分娩的安全性、什么时机能打、对产程有什么影响——这些疑问列好，产检时请产科或麻醉科医生解答。"],["mom","询问陪产规定与流程","问拟分娩医院：可以陪产吗？需要什么手续？各医院政策差别很大，以产检的这家为准。"],["dad","练习先问「你需要什么」","从现在开始养成习惯：她说累的时候先问「你需要我做什么」，而不是「你应该怎样」。这个习惯会一直陪你走进育儿期。"]]},"30":{theme:"认识新生儿的日常",note:"提前了解喂养和睡眠的正规信息。",tasks:[["mom","写下喂养方面的疑问","母乳还是配方奶？开奶疼吗？乳头皴裂怎么办？把疑问写下来，找产科护士、哺乳门诊或课程问，别自己硬扛。"],["dad","挑选想参加的新生儿课程","优先选实操课：抱娃姿势、换尿布、洗澡、拍嗝。看视频学和自己上手学，完全是两回事。"],["mom","了解安全睡眠的基本原则","记住核心几条：仰卧睡、床垫硬、床上不放软玩具和枕头、和父母同房不同床。这几条能有效降低婴儿猝死风险，来源选正规机构指南。"],["dad","整理产后可用的支持联系方式","月嫂联系人、哺乳门诊、儿科医生、有经验的朋友。列一个「产后求助清单」，需要时不用现找。"]]},"31":{theme:"把产后照顾写具体",note:"首次怀孕者在一些地区此时有随访。",tasks:[["mom","如有预约，谈谈临产准备与身心状态","把对分娩的期待和害怕都跟医生说说。恐惧感很常见，说出来的恐惧，比闷着的恐惧好管理得多。"],["dad","列出产后最希望有人帮的三件事","做饭？夜间搭手？跑腿？写得越具体，越知道该找谁帮忙、帮到什么程度。"],["mom","规划产后一周的家务与餐食","设想产后第一周：谁来做饭、谁来买菜、谁来照顾你和宝宝？写成一页纸，提前分工比临场安排靠谱得多。"],["dad","联系可帮忙的人","把计划落到人头上：月嫂定了没？老人什么时候到？每个人具体负责什么。一个个打电话确认。"]]},"32":{theme:"学习临产前的信号",note:"在课程或产检时了解何时联系医院。",tasks:[["mom","向照护团队询问何时需要联系医院","问清「红线」：规律宫缩（比如五六分钟一次）、破水、胎动明显减少、出血——出现哪种要立即去医院、哪种可以先观察。记下来贴冰箱上。"],["dad","整理分娩课程里的问题","真宫缩和假宫缩怎么区分？见红了先洗头还是先去医院？把课程里没听懂的一次问清。"],["mom","保存医院或助产团队的电话","把分娩医院产科电话存成两人手机的置顶联系人。拿不准要不要去医院时，一个电话就能定心。"],["dad","一起熟悉入院流程","去医院走哪个门？夜间急诊产科怎么走？办住院要哪些证件？最好实地走一遍，把不确定的步骤都问清。"]]},"33":{theme:"让居家准备更轻松",note:"慢慢整理出生后的空间，保持行动和采购的余地。",tasks:[["mom","决定宝宝用品放哪里最顺手","换尿布的地方最好不用弯腰，尿布、湿巾、衣服就近放。以「谁在半夜用最方便」为标准来布置。"],["dad","试着说出产后想被怎样照顾","你也可能产后疲惫低落，提前说出来：希望她怎么支持你、哪些事你来扛。互相说清，避免「我以为你知道」。"],["mom","整理宝宝衣物与必要用品","新生儿衣服先洗后穿（用婴儿专用洗衣液），按尺码分袋。前两周常用的和尚服、包被，放在最顺手的一层。"],["dad","检查家中休息空间","她产后需要方便起夜、方便哺乳的休息区：床头灯、小桌板、哺乳枕的位置都过一遍。半夜照顾宝宝的动线越短越好。"]]},"34":{theme:"核对分娩偏好",note:"分娩计划是沟通工具，可以随实际情况改变。",tasks:[["mom","写下分娩偏好与担心","希望尽量自然、希望有镇痛、希望家属陪产……以及最担心的事。这份清单带去产检，和医生逐条讨论可行性。"],["dad","询问产后初期照护安排","住院几天？出院时宝宝要做哪些检查？42 天复查是什么？了解产后初期的流程，心里有数。"],["mom","和她一起读一遍偏好清单","两人逐条读一遍，确认理解一致。有些偏好聊聊弹性：「如果疼到受不了呢？」提前想好，比当场纠结强。"],["dad","核对医院路线与交通方案","白天路线、半夜路线、打车和自驾方案各想一个，测算好时间，留出堵车的余量。"]]},"35":{theme:"开始整理待产物品",note:"可以逐步打包，避免临近预产期匆忙准备。",tasks:[["mom","挑选自己住院时想带的物品","按医院清单准备：产褥垫、卫生巾、一次性内裤、洗漱用品、水杯吸管、出院的衣服。少带贵重物品。"],["dad","把重要证件和检查资料放在一起","身份证、医保卡、产检手册、所有检查报告放一个文件袋。入院登记全靠它们，放在待产包最外层。"],["mom","整理陪产者和宝宝用品","分开装袋并贴标签：妈妈袋、宝宝袋、证件袋。宝宝出院要穿的衣服单独放最上面，方便拿。"],["dad","查看医院提供什么","问医院：待产包里提供哪些？病房有热水吗？确认之后再补缺，避免买重。"]]},"36":{theme:"关注胎位与后续安排",note:"许多地区在这时评估胎位与分娩准备。",tasks:[["mom","按预约讨论胎位和后续计划","医生会评估胎位（头位最理想）。如果胎位不正，问清有什么选择和后续安排，别急着试网上的「转胎位」偏方。"],["dad","确认待产包还缺什么","对着清单把待产包查一遍，缺的补齐。之后就放在门口固定位置，不拆不挪。"],["mom","陪同记录医生建议","这一阶段的建议常涉及分娩方式的倾向，两个人一起听、一起记录，回家慢慢商量。"],["dad","确认联络顺序","发动时要通知谁？先叫车还是先打医院电话？老人什么时候出发？把这些排成顺序，写进手机备忘录。"],["mom","开始打包待产包","打开「待产包」菜单，选好你的场景，对照清单先把证件资料装进最外面的透明袋。从这一周（预产期前一个月）开始准备，时间刚刚好，不慌不忙。"]]},"37":{theme:"让出发准备就位",note:"待产包和交通方案可以在预产期前准备好。",tasks:[["mom","把待产包放在容易拿到的地方","放在玄关或车里，全家都知道位置。这周起无论去哪，待产包跟着走。"],["dad","熟悉医院要求的入院材料","入院手续、押金方式、医保结算流程，先打电话或实地问清。真发动的时候，这些事不该占用脑子。"],["mom","再走一遍交通路线","按不同时段（早高峰、半夜）各走一遍去医院的路，记下时间和备选路线。"],["dad","和支持者确认联络方式","陪产的人、要通知的老人，各自确认好手机号并互存。约定好：有动静先打给谁、再打给谁。"],["dad","陪妈妈查缺补漏","对照「待产包」清单把缺的东西补齐；打医院电话问清提供哪些（多数医院提供产妇卫生巾和宝宝衣服），避免重复买。"]]},"38":{theme:"每天都留出余地",note:"留意自己熟悉的胎动模式；明显变化应及时联系照护团队。",tasks:[["mom","留意宝宝平时的活动模式","熟悉宝宝的胎动规律（什么时候爱动）。如果某天明显比平时少，立即联系医院，不要等到第二天——数胎动这件事宁可谨慎。"],["dad","产检时问清超过预产期的选择","预产期只是估算，多数宝宝在 37-42 周之间出生。问医生：过了预产期还没动静，什么时候需要干预、有哪些选择。"],["mom","减少不必要的外出安排","从现在起出门尽量两人同行或有人陪同，手机保持有电。给随时可能发动的生活，留出机动空间。"],["dad","把医院电话置顶","医院产科、请假联系人、她的医生，全部置顶。同时养成习惯：出门手机满电，车里备一根充电线。"],["mom","待产包集中归位","把打包好的袋子放到玄关固定位置，和陪产的人交代清楚「包在哪、证件在哪」，之后不再拆散挪动。"]]},"39":{theme:"彼此照顾的最后几步",note:"接近预产期也可能继续等待，把决定交给专业建议。",tasks:[["mom","把最近的担忧告诉照护团队","越临近越容易紧张：怕生的时候手忙脚乱、怕自己受不了疼。这些担忧值得告诉医生，他们会给你针对性的准备建议。"],["dad","选择让自己舒服的休息方式","等待期你的紧张不比她少。找适合自己的方式放松，别不好意思——你的状态稳，她才更安心。"],["mom","检查交通、证件和手机电量","每天出门前过一遍：证件袋在吗？手机满电吗？路线熟吗？保持简单可执行，不求完美。"],["dad","说一句具体的感谢","对她说句具体的话：「谢谢你这十个月……」等待变得漫长的时候，具体的爱意最能撑住人心。"],["dad","演练一次出发流程","假装宫缩来了完整走一遍：谁开车或叫车、拿哪个包、路上通知谁；把医院电话和待产包备忘放进手机首屏。"]]},"40":{theme:"和宝宝一起等合适的时刻",note:"到预产周仍未分娩并不少见，按医生建议讨论后续安排。",tasks:[["mom","按预约讨论后续观察或处理选项","过了预产期没动静很常见，初产妇平均还会推迟几天。和医生讨论：继续观察还是引产，各方案的时机和利弊，选适合自己的。"],["dad","说出此刻最需要的支持","这周你可能又紧张又疲惫。告诉她你需要什么：一个拥抱、一起散个步？互相说出来，才能互相接住。"],["mom","陪同听取后续计划","医生如果给出观察计划（胎心监护频率、何时复查），记下关键时间和电话。别让她独自消化这些安排。"],["dad","把接下来几天留出弹性","推迟工作、推掉应酬，把这几天的弹性留出来。宝宝随时会来，而你们都想第一时间在场。"],["mom","出发前最后确认","证件袋在包里、手机满电、油箱或电量充足；剩下的交给缘分——你们已经准备得很好了。"]]}}};var D={disclaimer:"以下内容基于《中国居民膳食营养素参考摄入量》与孕期保健常规建议整理，供参考；是否需要额外补充、具体剂量请以产检医生的意见为准。",stages:[{id:"prepare",title:"备孕期",range:"怀孕前 2-3 个月开始",note:"这个阶段的重点只有一件事：把叶酸吃起来，并让身体先「存」好营养。其他补剂不是必须的，均衡吃饭比什么都可以。",items:[{name:"叶酸",dose:"0.4mg 每天",why:"叶酸是胎儿神经管发育的关键营养，而神经管在怀孕后第 4 周内就开始闭合——那时很多人还不知道自己怀孕了。提前 2-3 个月补充，才能保证怀孕时体内叶酸已经达标，把胎儿神经管缺陷的风险降低一半以上。",how:"每天固定时间吃 1 片 0.4mg 的叶酸片（普通药店即可，几十块钱一瓶就够），吃到怀孕后满 3 个月。忘了吃也不用第二天吃两片，想起来再吃就行。买「叶酸片」而不是「复合维生素」，这个阶段只需要这一种。"},{name:"碘",dose:"靠加碘盐 + 每周 1 次海带/紫菜",why:"碘直接参与甲状腺激素合成，影响宝宝的大脑和神经系统发育。备孕和孕期对碘的需求比平时高近一倍，缺碘是最常见也最容易被忽略的问题。",how:"家里换成加碘盐即可，不用额外买补剂。每周安排一次海带、紫菜、贝类。注意：如果体检发现甲状腺功能异常，碘的摄入要遵医嘱调整。"}]},{id:"t1",title:"孕早期",range:"孕 1-12 周",note:"孕早期宝宝还很小，需要的营养不多，不需要「一人吃两人份」。恶心吃不下很正常，重点是叶酸继续吃、别强迫自己大补。",items:[{name:"叶酸",dose:"0.4mg 每天，继续",why:"神经管发育的关键期就在孕早期（前 12 周），备孕时开始吃的叶酸要一直吃到孕 3 个月结束，这个不能停。",how:"和备孕期一样，每天 1 片。孕吐严重、吃不下饭的阶段，叶酸也尽量保住——它是这个阶段唯一必须坚持的补剂。"},{name:"维生素 D",dose:"400IU 每天（可从孕中期开始）",why:"维生素 D 帮助钙吸收，几乎所有孕妈都晒不够太阳。缺乏维生素 D 会影响后面补钙的效果，也可能和妊娠期糖尿病风险相关。",how:"不用专门买，很多孕中期的钙片里已经含了维生素 D；如果买的钙不含 D，可以单独补小剂量。每天散步晒太阳 20 分钟也是免费的补充方式。"}]},{id:"t2",title:"孕中期",range:"孕 13-27 周",note:"宝宝骨骼发育加速，钙的需求明显上升；这个阶段也是查血常规、判断要不要补铁的窗口期。DHA 从这个阶段开始补更有意义。",items:[{name:"钙",dose:"每天 600mg 补剂 + 饮食中的钙",why:"孕中期起宝宝开始快速长骨骼，每天需要约 1000mg 钙。靠喝奶很难凑够，不够的部分会从妈妈的骨头里「借」——这就是很多孕妈孕中晚期腿抽筋的原因。",how:"先保证每天 300-500ml 牛奶或等量奶制品，剩下的缺口用钙片补（一般每天 1 片 600mg）。钙片和铁剂要错开时间吃（间隔 2 小时以上），否则互相影响吸收。晚上吃钙片还有助于缓解夜间抽筋。"},{name:"DHA",dose:"200mg 每天",why:"DHA 是宝宝大脑和视网膜发育的原料，孕中晚期是大脑发育最快的阶段。每周吃不到 2-3 次深海鱼的孕妈，建议直接补剂。",how:"优先食补：三文鱼、沙丁鱼、鲈鱼每周 2-3 次，每次巴掌大一块。吃不够再买藻油 DHA（一天 1 粒 200mg）。藻油比鱼油干净、没有腥味，孕吐敏感的人更适合。"},{name:"铁（看检查结果）",dose:"是否补、补多少，听产检的",why:"孕期血容量大幅增加，一半以上孕妈会在这个阶段出现缺铁性贫血。轻度贫血没感觉，但会影响宝宝供氧，也会让你特别容易累。",how:"不需要常规预防性补铁，按产检血常规来：血红蛋白和血清铁蛋白正常就不用补；偏低时医生会开铁剂（常见多糖铁复合物），记得和钙片、牛奶错开 2 小时，搭配维生素 C（橙子）帮助吸收。"}]},{id:"t3",title:"孕晚期",range:"孕 28-40 周",note:"孕晚期宝宝在冲刺长身体，钙和 DHA 继续；这个阶段便秘和胃胀很常见，膳食纤维和水比补剂更值得花心思。",items:[{name:"钙",dose:"每天 600mg 补剂，继续",why:"孕晚期是宝宝储存钙的高峰期，每天的需求量达到孕期的顶点（约 1200mg），停补的话抽筋和腰背酸痛会明显加重。",how:"延续孕中期的方案：奶制品 + 600mg 钙片。如果抽筋仍然频繁，复诊时和医生确认是否需要调整剂量，不要自己加倍。"},{name:"铁",dose:"以孕晚期血常规结果为准",why:"孕晚期血容量达到顶峰，贫血概率最高；而且分娩时会出血，产前把铁储备拉起来，产后恢复会顺利很多。",how:"每次产检关注血常规：贫血就按医嘱补铁并复查。食补可以加每周 1-2 次动物肝脏（每次约 50g）或红肉。"},{name:"DHA",dose:"200mg 每天，继续",why:"孕晚期是宝宝大脑发育的最后冲刺期，DHA 需求没有下降，一直吃到生都可以。",how:"继续藻油 DHA 每天 1 粒，或每周 2-3 次深海鱼。孕晚期胃口容易被顶住，鱼类吃不下时补剂更方便。"},{name:"膳食纤维 + 水",dose:"蔬菜 500g / 天，水 1700ml / 天",why:"孕晚期肠道被增大的子宫挤压、加上铁剂可能加重便秘，便秘几乎是标配，严重时还会诱发痔疮。",how:"每餐先吃蔬菜，主食里加一半粗粮（燕麦、糙米、玉米），早晨空腹一杯温水。这个不用花钱买补剂，是性价比最高的一项。"}]}]};var M={scenes:[{id:"hospital",title:"入院当天 / 当晚",subtitle:"住院必备，人人都要",note:"这一袋是基础款，无论后面住月子中心还是回家请月嫂，都需要它。打包建议放在最外面的袋子里，家属要能一眼找到。",groups:[{name:"证件资料（最重要）",items:["夫妻双方身份证原件","医保卡（社保卡）","产检手册 / 病历本
