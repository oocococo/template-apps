<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root {
  --bg: #0f1115;
  --bg-soft: #171a21;
  --card: #1d212b;
  --card-2: #242a36;
  --text: #eef1f6;
  --muted: #9aa3b2;
  --line: #2c3340;
  --accent: #ff5d8f;
  --accent-2: #6c8cff;
  --radius: 16px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 顶栏 */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 16px;
  background: rgba(15,17,21,.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand__logo {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px;
  display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.brand__txt h1 { font-size: 16px; margin: 0; line-height: 1.1; }
.brand__txt p { font-size: 11px; margin: 2px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 6px; }
.tab {
  border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
  padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: .15s;
}
.tab.is-active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }

/* 视图 */
.view { display: none; padding: 16px; max-width: 1100px; margin: 0 auto; }
.view.is-active { display: block; }

/* 筛选条 */
.filterbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: .15s;
}
.chip.is-active { color: #fff; background: var(--card-2); border-color: var(--accent-2); }
.search input {
  width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 14px; outline: none;
}
.search input:focus { border-color: var(--accent-2); }
.tagcloud { display: flex; flex-wrap: wrap; gap: 6px; }
.tagcloud .tag {
  font-size: 12px; color: var(--muted); background: var(--bg-soft);
  border: 1px solid var(--line); padding: 4px 10px; border-radius: 8px; cursor: pointer;
}
.tagcloud .tag:hover { color: var(--text); }

/* 网格 */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;
}
.grid--wp { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent-2); }
.card__img { position: relative; aspect-ratio: 1/1; background: var(--bg-soft); }
.card__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card__img.wp { aspect-ratio: 9/16; }
.card__fav {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,.45); color: #fff; border: none; font-size: 15px; cursor: pointer;
  display: grid; place-items: center; backdrop-filter: blur(4px);
}
.card__fav.is-on { color: var(--accent); }
.card__body { padding: 9px 10px; }
.card__title { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.card__meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.card__meta .pill { background: var(--bg-soft); padding: 2px 7px; border-radius: 6px; }

.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0 40px; }

/* 弹层 */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
.modal[hidden] { display: none; }
.modal__mask { position: absolute; inset: 0; background: rgba(0,0,0,.66); }
.modal__panel {
  position: relative; z-index: 1; width: min(92vw, 560px); max-height: 88vh; overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px;
}
.modal__close {
  position: absolute; top: 10px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
  border: none; background: var(--bg-soft); color: var(--text); font-size: 20px; cursor: pointer;
}
.modal__head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.modal__head h2 { font-size: 18px; margin: 0; }
.badge { font-size: 12px; color: var(--accent); background: rgba(255,93,143,.12); padding: 3px 9px; border-radius: 999px; }
.modal__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.modal__tags .t { font-size: 12px; color: var(--muted); background: var(--bg-soft); padding: 3px 9px; border-radius: 7px; }
.modal__imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; }
.modal__imgs img { width: 100%; border-radius: 12px; cursor: pointer; border: 1px solid var(--line); }
.modal__actions { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--text); font-size: 14px; cursor: pointer;
}
.btn--fav.is-on { color: #fff; background: var(--accent); border-color: transparent; }

.lightbox { position: relative; z-index: 1; max-width: 92vw; max-height: 88vh; border-radius: 12px; }

@media (max-width: 520px) {
  .brand__txt p { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(44vw, 1fr)); gap: 10px; }
}

,{"name":"动漫","count":0},{"name":"动漫手绘","count":0},{"name":"软萌卡通","count":0},{"name":"卡通头像","count":0},{"name":"暗黑系","count":0},{"name":"都市","count":0}]},{"key":"mood","name":"情绪","tags":[{"name":"温柔","count":0},{"name":"治愈","count":0},{"name":"浪漫","count":0},{"name":"青春","count":0},{"name":"可爱","count":0},{"name":"甜蜜","count":0},{"name":"清冷","count":0},{"name":"酷感","count":0},{"name":"疏离","count":0}]},{"key":"color","name":"色系","tags":[{"name":"奶油色","count":0},{"name":"樱花粉","count":0},{"name":"粉色","count":0},{"name":"明亮","count":0},{"name":"浅蓝","count":0},{"name":"深蓝","count":0},{"name":"霓虹紫","count":0}]}]};</script><script>(function () {
  'use strict';
  var D = window.APP_DATA || {};
  var PAIRS = D.PAIRS || [];
  var SERIES = D.SERIES || [];
  var GROUPS = D.GROUPS || [];
  var WALLPAPERS = D.WALLPAPERS || [];
  var TAGS = D.TAGS || [];
  var FAV_KEY = '__web_favs'; var demoFavs = [];

  var state = { group: '', keyword: '' };
  var currentPair = null;

  // ---------- 收藏（localStorage） ----------
  function readFavs() {
    return demoFavs.slice();
  }
  function writeFavs(a) {
    demoFavs = a.slice();
  }
  function favKey(type, id) { return (type === 'wallpaper' ? 'wallpaper' : 'pair') + ':' + id; }
  function isFav(type, id) { return readFavs().indexOf(favKey(type, id)) >= 0; }
  function toggleFav(type, id) {
    var k = favKey(type, id);
    var a = readFavs();
    var i = a.indexOf(k);
    if (i >= 0) a.splice(i, 1); else a.push(k);
    writeFavs(a);
    return i < 0;
  }

  // ---------- 工具 ----------
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function coverOf(pair) {
    return (pair.members && pair.members[0] && pair.members[0].url) || '';
  }

  // ---------- 顶部 tab ----------
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      var v = t.getAttribute('data-view');
      tabs.forEach(function (x) { x.classList.remove('is-active'); });
      t.classList.add('is-active');
      document.querySelectorAll('.view').forEach(function (sec) {
        sec.classList.toggle('is-active', sec.id === v);
      });
      if (v === 'fav') renderFav();
      if (v === 'wallpaper') renderWallpaper();
    });
  });

  // ---------- 分类 chips ----------
  var chipsBox = document.getElementById('groupChips');
  function buildChips() {
    chipsBox.innerHTML = '';
    var all = el('button', 'chip is-active', '全部');
    all.setAttribute('data-g', '');
    chipsBox.appendChild(all);
    GROUPS.forEach(function (g) {
      var c = el('button', 'chip', g.name);
      c.setAttribute('data-g', g.groupKey);
      chipsBox.appendChild(c);
    });
    chipsBox.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () {
        chipsBox.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('is-active'); });
        c.classList.add('is-active');
        state.group = c.getAttribute('data-g') || '';
        renderHome();
      });
    });
  }

  // ---------- 标签云 ----------
  var tagBox = document.getElementById('tagCloud');
  function buildTags() {
    tagBox.innerHTML = '';
    var seen = {};
    TAGS.forEach(function (dim) {
      (dim.tags || []).forEach(function (t) {
        if (seen[t.name]) return;
        seen[t.name] = 1;
        var e = el('span', 'tag', t.name);
        e.addEventListener('click', function () {
          document.getElementById('searchInput').value = t.name;
          state.keyword = t.name;
          renderHome();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        tagBox.appendChild(e);
      });
    });
  }

  // ---------- 首页 ----------
  var homeGrid = document.getElementById('homeGrid');
  var homeEmpty = document.getElementById('homeEmpty');
  function matchPair(p) {
    if (state.group && p.group !== state.group) return false;
    var kw = state.keyword.trim().toLowerCase();
    if (kw) {
      var hay = (p.title + ' ' + (p.flatTags || []).join(' ') + ' ' + (p.groupName || '')).toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  }
  function renderHome() {
    var list = PAIRS.filter(matchPair);
    homeGrid.innerHTML = '';
    homeEmpty.hidden = list.length > 0;
    list.forEach(function (p) {
      var card = el('div', 'card');
      var imgBox = el('div', 'card__img');
      var img = el('img');
      img.src = coverOf(p);
      img.alt = p.title;
      img.loading = 'lazy';
      imgBox.appendChild(img);
      var fav = el('button', 'card__fav' + (isFav('pair', p.pairId) ? ' is-on' : ''), '♥');
      fav.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var on = toggleFav('pair', p.pairId);
        fav.classList.toggle('is-on', on);
      });
      imgBox.appendChild(fav);
      card.appendChild(imgBox);
      var body = el('div', 'card__body');
      body.appendChild(el('p', 'card__title', p.title));
      var meta = el('div', 'card__meta');
      meta.appendChild(el('span', 'pill', (p.members || []).length + ' 张'));
      meta.appendChild(el('span', 'pill', p.groupName || ''));
      body.appendChild(meta);
      card.appendChild(body);
      card.addEventListener('click', function () { openDetail(p); });
      homeGrid.appendChild(card);
    });
  }

  // ---------- 壁纸 ----------
  var wpGrid = document.getElementById('wpGrid');
  var wpEmpty = document.getElementById('wpEmpty');
  function renderWallpaper() {
    wpGrid.innerHTML = '';
    wpEmpty.hidden = WALLPAPERS.length > 0;
    WALLPAPERS.forEach(function (w) {
      var card = el('div', 'card');
      var imgBox = el('div', 'card__img wp');
      var img = el('img');
      img.src = w.url; img.alt = w.title; img.loading = 'lazy';
      imgBox.appendChild(img);
      var fav = el('button', 'card__fav' + (isFav('wallpaper', w.wallpaperId) ? ' is-on' : ''), '♥');
      fav.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var on = toggleFav('wallpaper', w.wallpaperId);
        fav.classList.toggle('is-on', on);
      });
      imgBox.appendChild(fav);
      card.appendChild(imgBox);
      var body = el('div', 'card__body');
      body.appendChild(el('p', 'card__title', w.title));
      body.appendChild(el('div', 'card__meta', (w.flatTags || []).slice(0, 3).map(function (t) {
        return '<span class="pill">' + t + '</span>';
      }).join('')));
      card.appendChild(body);
      card.addEventListener('click', function () { openImg(w.url); });
      wpGrid.appendChild(card);
    });
  }

  // ---------- 收藏页 ----------
  var favGrid = document.getElementById('favGrid');
  var favEmpty = document.getElementById('favEmpty');
  function renderFav() {
    favGrid.innerHTML = '';
    var favs = readFavs();
    var pairIds = favs.filter(function (k) { return k.indexOf('pair:') === 0; })
      .map(function (k) { return k.slice(5); });
    var wpIds = favs.filter(function (k) { return k.indexOf('wallpaper:') === 0; })
      .map(function (k) { return k.slice(10); });
    var pairs = PAIRS.filter(function (p) { return pairIds.indexOf(p.pairId) >= 0; });
    var wps = WALLPAPERS.filter(function (w) { return wpIds.indexOf(w.wallpaperId) >= 0; });
    favEmpty.hidden = (pairs.length + wps.length) > 0;

    pairs.forEach(function (p) { favGrid.appendChild(buildPairCard(p)); });
    wps.forEach(function (w) {
      var c = el('div', 'card');
      var box = el('div', 'card__img wp');
      var img = el('img'); img.src = w.url; img.alt = w.title; img.loading = 'lazy';
      box.appendChild(img);
      c.appendChild(box);
      var body = el('div', 'card__body');
      body.appendChild(el('p', 'card__title', w.title));
      c.appendChild(body);
      c.addEventListener('click', function () { openImg(w.url); });
      favGrid.appendChild(c);
    });
  }
  function buildPairCard(p) {
    var card = el('div', 'card');
    var box = el('div', 'card__img');
    var img = el('img'); img.src = coverOf(p); img.alt = p.title; img.loading = 'lazy';
    box.appendChild(img);
    card.appendChild(box);
    var body = el('div', 'card__body');
    body.appendChild(el('p', 'card__title', p.title));
    card.appendChild(body);
    card.addEventListener('click', function () { openDetail(p); });
    return card;
  }

  // ---------- 详情弹层 ----------
  var detailModal = document.getElementById('detailModal');
  var dmTitle = document.getElementById('dmTitle');
  var dmCount = document.getElementById('dmCount');
  var dmTags = document.getElementById('dmTags');
  var dmImgs = document.getElementById('dmImgs');
  var dmFav = document.getElementById('dmFav');
  var dmSave = document.getElementById('dmSave');

  function openDetail(p) {
    currentPair = p;
    dmTitle.textContent = p.title;
    dmCount.textContent = (p.members || []).length + ' 张成套';
    dmTags.innerHTML = '';
    (p.flatTags || []).forEach(function (t) {
      dmTags.appendChild(el('span', 't', t));
    });
    dmImgs.innerHTML = '';
    (p.members || []).forEach(function (m) {
      var img = el('img'); img.src = m.url; img.alt = p.title; img.loading = 'lazy';
      img.addEventListener('click', function () { openImg(m.url); });
      dmImgs.appendChild(img);
    });
    dmFav.classList.toggle('is-on', isFav('pair', p.pairId));
    dmFav.textContent = isFav('pair', p.pairId) ? '♥ 已收藏' : '♥ 收藏';
    detailModal.hidden = false;
  }
  dmFav.addEventListener('click', function () {
    if (!currentPair) return;
    var on = toggleFav('pair', currentPair.pairId);
    dmFav.classList.toggle('is-on', on);
    dmFav.textContent = on ? '♥ 已收藏' : '♥ 收藏';
    renderHome();
  });
  dmSave.addEventListener('click', function () {
    if (!currentPair) return;
    return; var src = coverOf(currentPair);
    var a = document.createElement('a');
    a.href = src; a.download = currentPair.pairId + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  });

  // ---------- 图片放大 ----------
  var imgModal = document.getElementById('imgModal');
  var lightboxImg = document.getElementById('lightboxImg');
  function openImg(src) {
    lightboxImg.src = src;
    imgModal.hidden = false;
  }

  // 关闭弹层
  document.querySelectorAll('[data-close]').forEach(function (e) {
    e.addEventListener('click', function () {
      detailModal.hidden = true;
      imgModal.hidden = true;
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { detailModal.hidden = true; imgModal.hidden = true; }
  });

  // ---------- 搜索 ----------
  var searchInput = document.getElementById('searchInput');
  var t;
  searchInput.addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      state.keyword = searchInput.value;
      renderHome();
    }, 200);
  });

  // ---------- 初始化 ----------
  document.getElementById('dmSave').textContent='安装后可保存图片'; document.getElementById('resetDemo').onclick=function(){demoFavs=[];state.group='';state.keyword='';document.getElementById('searchInput').value='';buildChips();renderHome();renderWallpaper();renderFav();detailModal.hidden=true;imgModal.hidden=true;};
  buildChips();
  buildTags();
  renderHome();
})();
</script></body></html>
