
<div class="shell">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>毛孩子养护台</h1>
        <div class="tagline">一份档案，全年日程，到期就提醒</div>
      </div>
    </div>
    <div class="stamp mono" id="stamp"></div>
  </header>

  <div class="grid">
    <main>
      <section class="panel rise" id="overview"></section>
      <div class="seg rise" style="animation-delay:.06s">
        <button data-t="sched" class="on">日程</button>
        <button data-t="health">健康</button>
        <button data-t="profile">档案</button>
      </div>
      <section id="view"></section>
    </main>

    <aside style="display:flex;flex-direction:column;gap:20px">
      <section class="panel rise" style="animation-delay:.1s">
        <div class="panel-t">我的宠物</div>
        <div class="pets" id="petList"></div>
        <div class="add-row" id="addBtn">+ 新建档案</div>
        <div id="demoNote"></div>
      </section>
      <section class="panel rise" style="animation-delay:.16s" id="side"></section>
    </aside>
  </div>

  <footer>
    养护周期依据公开的常规兽医指南整理，仅用于日常提醒与记录，<b>不能替代执业兽医的诊断与处方</b>。
    疫苗种类与接种程序请遵医嘱，兔子不可套用猫狗用药剂量。宠物出现不吃、不排、精神沉郁、呼吸困难等情况请立即就医。<br>
    档案保存在此应用的数据库中。
  </footer>
</div>
