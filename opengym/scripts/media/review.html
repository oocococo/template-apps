<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>openGym · 动作样片检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d100e;color:#ebf1ed;font:15px/1.6 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:32px 24px}header{margin-bottom:28px}small,.muted{color:#a2b0a7}h1{font-size:32px;line-height:1.2;margin:10px 0}h2{font-size:18px;margin:0}p{margin:8px 0}label{display:flex;align-items:center;gap:10px}select,button,a{font:inherit}select,button{color:#e7eee9;background:#242c27;border:1px solid #45534a;border-radius:8px;padding:8px 12px}button{cursor:pointer}a{color:#c0e78f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}.card{background:#191e1b;border:1px solid #303c34;border-radius:16px;overflow:hidden}.info{padding:18px}.status{font-size:12px;color:#eec17f;background:#453820;border-radius:5px;padding:3px 7px;white-space:nowrap}video{display:block;width:100%;aspect-ratio:1;background:#e6e8e8}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}footer{padding:12px 18px;background:#222a25;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#empty{padding:32px}.warning{border-left:3px solid #e6b35b;padding:8px 14px;background:#25251c;margin-top:18px}code{font-size:12px;overflow-wrap:anywhere}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}@media(max-width:550px){main{padding:24px 16px}h1{font-size:26px}}
</style>
<main>
<header><small>openGym / 媒体制作检查</small><h1>动作样片检查</h1><p class="muted">目标 5,632 个动作 · 全部补齐并核验后统一上线</p>
<p id="counts">正在读取本地样片…</p><p class="warning">这些是制作中的样片，尚未批准为动作教学素材。动作名称、接触点、关节方向和循环都需逐项检查。</p>
<div class="actions"><label>显示版本 <select id="version"><option value="latest">每个动作的最新样片</option><option value="all">全部尝试（含已发现问题的样片）</option></select></label><button id="pause-all">全部暂停</button><button id="refresh">刷新列表</button></div></header>
<section id="grid" class="grid" aria-label="动作样片"></section><p id="empty" hidden>尚无已完成渲染的样片。</p>
</main>
<script type="module">
const titles={push_up:'俯卧撑',jumping_jack:'开合跳',bear_crawl:'熊爬',jog:'慢跑',run:'跑步',seated_meditation:'坐姿冥想',walk:'行走'};
let manifest;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;};
const pauseAll=()=>document.querySelectorAll('video').forEach(v=>v.pause());
function draw(){
 pauseAll();const grid=document.querySelector('#grid');grid.replaceChildren();
 let list=manifest.candidates;
 if(document.querySelector('#version').value==='latest'){
  const byId=new Map();for(const c of list){const previous=byId.get(c.id);const rank=x=>(x.quality==='final'?10000:0)+Number(x.attempt.split('-')[1]||0);if(!previous||rank(c)>rank(previous))byId.set(c.id,c);}list=[...byId.values()];
 }
 document.querySelector('#counts').textContent=`已渲染 ${new Set(manifest.candidates.map(c=>c.id)).size} 类动作样片 · 不计为全量覆盖完成`;
 document.querySelector('#empty').hidden=!!list.length;
 for(const c of list){
  const card=el('article',null,'card'),video=el('video');video.controls=true;video.muted=true;video.loop=true;video.playsInline=true;video.preload='metadata';video.poster=c.url+'still.webp';video.src=c.url+'video.mp4';video.setAttribute('aria-label',`${titles[c.id]||c.id}动作样片`);
  const info=el('div',null,'info');info.append(el('h2',titles[c.id]||c.id),el('span','待核验','status'),el('p',c.attempt,'muted'),el('code',`${c.frames} 帧 · 循环关节偏差 ${(c.loopDelta*100).toFixed(1)} cm`));
  if(c.id==='bear_crawl'&&c.attempt==='preview-1')info.append(el('p','已拒绝：这是贴地爬行，不符合熊爬。','warning'));
  const nav=el('nav');for(const [label,file] of [['静态图','still.webp'],['MP4','video.mp4'],['GIF','animation.gif'],['动态 WebP','animation.webp'],['3D 文件','motion.glb']]){const a=el('a',label);a.href=c.url+file;a.target='_blank';a.rel='noopener';nav.append(a);}info.append(nav);
  const footer=el('footer'),play=el('button','播放'),speed=el('select');play.setAttribute('aria-label',`播放${titles[c.id]||c.id}`);play.onclick=async()=>{if(video.paused){pauseAll();try{await video.play();}catch{play.textContent='无法播放';}}else video.pause();};video.onplay=()=>play.textContent='暂停';video.onpause=()=>play.textContent='播放';
  speed.setAttribute('aria-label',`${titles[c.id]||c.id}播放速度`);for(const rate of [.25,.5,1]){const option=el('option',`${rate}×`);option.value=rate;option.selected=rate===1;speed.append(option);}speed.onchange=()=>video.playbackRate=Number(speed.value);footer.append(play,el('span','速度'),speed);
  card.append(video,info,footer);grid.append(card);
 }
}
async function refresh(){manifest=await (await fetch('/manifest.json')).json();draw();}
document.querySelector('#version').onchange=draw;document.querySelector('#pause-all').onclick=pauseAll;document.querySelector('#refresh').onclick=refresh;
refresh().catch(e=>document.querySelector('#counts').textContent='读取样片失败：'+e.message);
</script>
</html>
